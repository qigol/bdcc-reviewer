title: Time Series Forecasting
shortTitle: Time Series
summary: |
  Order is information. Read a series as trend + season + remainder, test and fix stationarity by differencing, read the
  ACF, beat the naive baselines with ARIMA(p, d, q), then forecast with ordinary regression on lag features without leaking.
course: ML2
order: 30
