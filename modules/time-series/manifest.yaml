schemaVersion: 1
id: time-series
version: 1.3.0
title: Time Series Forecasting
shortTitle: Time Series
summary: |
  In a time series, order is information. See a series as trend + season + remainder, make it steady by differencing,
  read how it echoes its own past, beat the simple baselines with ARIMA, then forecast with regression on lag columns
  without leaking the answer.
course: ML2
order: 30
color: '#0ea5e9'
icon: chart-line
sources:
  - title: 'Session 10: Time Series'
    file: bsdsba2028_-_ml2_session_10_time_series.pdf
    sessions: '10'
    date: '2026-09-18'
  - title: 'Session 11: Time Series (ARIMA) lecture notebook, instructor''s copy'
    file: Session_11_Time_Series_Instructor.ipynb
    sessions: '11'
  - title: 'Session 12: Time Series with classical ML, lecture notebook'
    file: Session_12_Time_Series_ML_Student.ipynb
    sessions: '12'
prerequisites: []
skills:
  - id: ts-structure
    label: Trend, seasonality, remainder
    description: The additive mental model y ≈ T + S + R; seasonal vs cyclic.
  - id: lags
    label: Lags and notation
    description: y_t, y_(t−1), y_(t−k); the unit of k is one step of the data.
  - id: chrono-split
    label: Chronological splits
    description: Never shuffle a series; train on the past, test on the future.
  - id: stationarity
    label: Stationarity and the ADF test
    description: Stable level, spread and self-relationship; reading an ADF result.
  - id: differencing
    label: Differencing
    description: First and seasonal differences; the lost observation; the changed question.
  - id: autocorrelation
    label: Autocorrelation (ACF and PACF)
    description: Correlation of a series with a lagged copy of itself; reading p and q from the plots.
  - id: baselines
    label: Naive baselines
    description: Naive and seasonal naive forecasts, the bar every model must clear.
  - id: forecast-metrics
    label: MAE, RMSE, MAPE
    description: Scoring forecasts on held-out months.
  - id: arima
    label: ARIMA(p, d, q)
    description: Assembling AR, I and MA; forecasting with fitted coefficients; residual diagnostics.
  - id: lag-features
    label: Lag features and leakage
    description: Turning a series into X and y for regression, and the two classic leaks.
