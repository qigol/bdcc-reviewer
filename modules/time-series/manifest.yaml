authoring:
  generatedBy: Claude
  generatedAt: '2026-10-05'
  notes: |
    Built from the Session 10 deck and the Session 11 (ARIMA) and Session 12 (classical ML) notebooks. The real Mauna Loa CO₂ (516 months) and Niño 1+2 (252 months) series were pulled from statsmodels so that every score, autocorrelation, ARIMA forecast and lag-feature regression in the notebooks reproduces in logic.js. The ADF test and the ARIMA fit itself are not re-estimated in the browser: their outputs (statistics, p-values, coefficients) are data. v1.1.0 (2026-10-05): rewritten in plain language for learners who start from zero; guide edition 2 (every term defined where it first appears, new basic terms such as forecast, training and test set, correlation, p-value, residual and linear regression, practice and reflect gates, tryIt, quiz hints). No ids changed. v1.2.0 (learner review 2026-10-05): one-step vs multi-step taught and tested (new glossary terms, beat, quiz items); differencing, seasonality and ADF reconciled (d = 1 is enough for the trend, the yearly pattern goes to Δ12 / SARIMA; the slow-fading ACF rule now separates lags 1-3 from lags 12-24-36); PACF taught with pictures, a lag-2 math section and real CO2 evidence for ARIMA(1,1,1); residual ACF drawn from the model recursion; give-away gates hidden until answered; drift, seasonal naive, random walk and CO2-vs-coop explanations corrected; null hypothesis, rolling mean, month columns, one-step and multi-step forecasts added to the glossary; generators fixed (pacfQ impossible pairs, adfQ statistic/p pairing, lag/naive distractor collisions, metricsQ MAE vs MAPE, arimaQ as-written misconception); new level-3 templates; slide and session numbers removed from learner text. All existing ids kept. v1.3.0 (audit follow-up): differencing sheet column renamed Δy so the math-code fill renders; lag table rounds ties to even like pandas; Scenario C and no-swing predicts can no longer be read off live controls; ACF/PACF evidence says neither stops cleanly; forest, horizon and workflow quiz items fixed; four generator-backed level-3 transfer templates (pq-read-mcq, seasonal-forecast-hand, arima-transfer-hand, feature-row-hand).
guide: 2
objectives:
  - id: read-a-series
    text: 'Describe a series as trend, seasonality and remainder, and read lags in the data''s own time steps.'
    skills:
      - ts-structure
      - lags
  - id: test-honestly
    text: |
      Split a series by date, score naive and seasonal naive forecasts with MAE, RMSE and MAPE on the same one-step or multi-step setup, and explain why shuffling cheats.
    skills:
      - chrono-split
      - baselines
      - forecast-metrics
  - id: make-it-steady
    text: 'Judge whether a series is stationary, read an ADF result, difference it by hand, and read its ACF and PACF.'
    skills:
      - stationarity
      - differencing
      - autocorrelation
  - id: forecast-by-hand
    text: 'Forecast with ARIMA(1,1,1) step by step, and build leak-free lag columns for a regression.'
    skills:
      - arima
      - lag-features
