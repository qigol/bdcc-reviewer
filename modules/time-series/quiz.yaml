  - id: seasonal-forecast-hand
    type: hand-calc
    skills: [differencing, baselines]
    difficulty: 3
    tags: [math]
    generator: seasonQ
    lessonRef: { tab: math-code, id: differencing }
    prompt: |
      Monthly electricity sales (GWh) of a small utility, January of year 1 to March of year 2. Take the seasonal
      difference $\Delta_{12}\, y_t = y_t - y_{t-12}$, then use it to forecast April of year 2.
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 1, rowHeader: month } }
    steps:
      - prompt: How many seasonal differences can you compute from these 15 months?
        answer: { var: nd }
        hint: The first 12 months have no value one year earlier.
      - prompt: '$\Delta_{12}$ for March of year 2 (2 decimal places)'
        answer: { var: dLast, tol: 0.01 }
        hint: March of year 2 minus March of year 1.
      - prompt: 'Average of all the seasonal differences: the typical yearly growth (2 decimal places)'
        answer: { var: mD, tol: 0.01 }
        hint: 'Compute Δ12 for January and February too, then average the three.'
      - prompt: 'Forecast for April of year 2: April of year 1 plus the average yearly growth (2 decimal places)'
        answer: { var: fc, tol: 0.01 }
        hint: 'A forecast of a change is added back to the value it was measured from: here, April a year earlier.'
    hints:
      - 'A seasonal difference compares each month with the same month a year earlier, so the yearly swing cancels out.'
    explanation: |
      The {=nd} seasonal differences are {=d12List}: steady, so the yearly swing is gone and only the growth is left.
      Their average is {=mD|2}. April of year 1 was {=aprPrev}, so the forecast is {=aprPrev} + {=mD|2} = {=fc|2}.
      Seasonal naive alone ({=aprPrev}) would miss a whole year of growth.

