templates:
  - id: seasonal-cyclic
    type: match
    skills: [ts-structure]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: name-the-parts }
    prompt: Seasonal or cyclic?
    pairs:
      - ['Ice-cream sales peaking every summer', 'Seasonal: repeats every year, tied to the calendar']
      - ['Traffic dipping every Sunday', 'Seasonal: repeats every week, tied to the calendar']
      - ['A recession every 6 to 10 years', 'Cyclic: economic swings of no fixed length']
      - ['Sunspot activity with cycles of 9 to 14 years', 'Cyclic: solar swings of no fixed length']
    explanation: Seasonal patterns repeat on a fixed, calendar-linked period; cyclic rises and falls have no fixed length.

  - id: structure-mcq
    type: mcq
    skills: [ts-structure]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: be-the-forecaster }
    prompt: A monthly series climbs steadily and repeats the same yearly shape. What should a forecast of the next 12 months use?
    options:
      - The direction and last year's shape
      - Only the typical level
      - Only the last value
      - Nothing; it cannot be forecast without a model
    answer: 0
    explanation: That is Series C on slide 10. Trend gives the direction, seasonality the shape.

  - id: additive-multi
    type: multi
    skills: [ts-structure]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: decomposition }
    prompt: 'About the model y_t ≈ T_t + S_t + R_t (slide 13), which statements are true?'
    options:
      - It is a way of looking at a series, not a theory of how the data were generated
      - Some series combine their parts by multiplying rather than adding
      - A series can have several seasonal patterns at once
      - The trend must be a straight line
      - The remainder is whatever trend and seasonality do not explain
    answer: [0, 1, 2, 4]
    explanation: '"≈, not =". The trend can curve and change direction.'

  - id: lag-numeric
    type: numeric
    skills: [lags]
    difficulty: 1
    tags: [math]
    generator: lagQ
    lessonRef: { tab: math-code, id: lag-notation }
    prompt: 'The table lists a {=freq} series up to time t. What is $y_{t-{=k}}$?'
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0 } }
    answer: { var: value, tol: 0 }
    misconceptions:
      - { var: wrongForward, feedback: 'Count back exactly k rows from t; you are one row short.' }
      - { var: wrongOff, feedback: 'You counted one row too far back.' }
    explanation: |
      Count {=k} steps back from t: $y_{t-{=k}} = {=value}$.

  - id: lag-units
    type: mcq
    skills: [lags]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: lags }
    prompt: 'The data are quarterly. What is $y_{t-4}$?'
    options:
      - The same quarter one year ago
      - The value four months ago
      - The value four years ago
      - The average of the last four quarters
    answer: 0
    explanation: 'k counts steps of the data. Four quarters = one year. For monthly data the same idea is y_(t−12); for daily data, y_(t−7) is a week ago.'

  - id: lag-code
    type: code-fill
    skills: [lags, lag-features]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: lag-notation }
    prompt: Add a "same month last year" column to a monthly DataFrame.
    code: |
      features = co2.to_frame(name="co2")
      features["lag_1"] = features["co2"].__BLANK_1__(1)
      features["lag_12"] = features["co2"].shift(__BLANK_2__)
    blanks:
      '1': { accept: ['shift'] }
      '2': { accept: ['12'] }
    explanation: '`shift(k)` moves the column down k rows, so each row holds the value from k months earlier.'

  - id: random-split-mcq
    type: mcq
    skills: [chrono-split]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: order-is-signal }
    prompt: Why is `train_test_split(X, y, shuffle=True)` wrong for a time series?
    options:
      - 'It lets the model train on later months and be tested on earlier ones, so the score is excellent and meaningless'
      - It deletes rows from the series
      - It changes the values of the series
      - It only works for classification
    answer: 0
    explanation: Shuffling deletes nothing and destroys the order, which is the signal. Train on the past, test on the future.

  - id: forecast-workflow
    type: order
    skills: [chrono-split, baselines]
    difficulty: 1
    tags: [application]
    lessonRef: { tab: intuition, id: baselines }
    prompt: Put the Session 11 workflow in order.
    items:
      - Plot the series and name its structures
      - Split chronologically into train and test
      - Score the naive and seasonal naive baselines on the test months
      - Test stationarity and difference if needed
      - Read the ACF and PACF to choose p and q
      - Fit ARIMA(p, d, q), forecast the test months and compare with the baselines
      - Check the residuals for structure the model missed
    explanation: Baseline first, then each letter of ARIMA from its own evidence, then the honest check on the residuals.

  - id: forest-mcq
    type: mcq
    skills: [chrono-split, lag-features]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: order-is-signal }
    prompt: |
      A random forest on CO₂ lag features scores MAE 0.515 with a random split and 3.174 with a chronological split.
      Its highest forecast is 366.06 while the training maximum is 366.68. What explains the gap?
    options:
      - 'Trees predict averages of training targets, so they cannot forecast above the training range; the random split hid this'
      - The chronological split had too few test months
      - The forest needs more trees
      - CO₂ is not a time series
    answer: 0
    explanation: With a shuffled split every test month had training months on both sides, so the forest only filled gaps. Linear regression has no such ceiling.

  - id: adf-mcq
    type: mcq
    skills: [stationarity]
    difficulty: 2
    tags: [math]
    generator: adfQ
    lessonRef: { tab: math-code, id: adf }
    prompt: 'ADF test: statistic {=stat}, 5% critical value {=crit}, p-value {=p}. What is the correct conclusion?'
    explanation: |
      Reject H₀ (unit root) only when p < 0.05, equivalently when the statistic is below the critical value. Hypothesis tests
      never prove stationarity or non-stationarity.

  - id: stationarity-multi
    type: multi
    skills: [stationarity]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: stationary-gallery }
    prompt: Which are the three conditions for a stationary series (slide 17)?
    options:
      - A stable typical level
      - A stable amount of fluctuation
      - A stable relationship with its own past
      - Small fluctuations
      - Predictable values
    answer: [0, 1, 2]
    explanation: Stationary means consistent, not flat and not predictable. The sunspot series swings widely and is stationary.

  - id: gallery-match
    type: match
    skills: [stationarity]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: stationary-gallery }
    prompt: Match each series from slide 18 to the reason for its verdict.
    pairs:
      - ['Random walk: not stationary', 'It wanders with no level to return to']
      - ['Growing volatility: not stationary', 'The level is stable but the spread grows']
      - ['Sunspots: stationary', 'Big swings, but the behaviour stays the same and the cycles have no fixed length']
      - ['Nile flow: not stationary', 'The level shifts part-way through']
      - ['Monthly CO₂: not stationary', 'Trend and seasonality']
    pick: 4
    explanation: Each non-stationary series breaks one of the three conditions (level, spread, relationship with its past).

  - id: diff-numeric
    type: numeric
    skills: [differencing]
    difficulty: 1
    tags: [math]
    generator: diffQ
    lessonRef: { tab: intuition, id: difference-by-hand }
    prompt: 'Annual values: {=valsList}. What is the **last** value of the first-differenced series?'
    answer: { var: dLast, tol: 0.01 }
    misconceptions:
      - { var: wrongRev, feedback: 'Subtract the earlier value from the later one: Δy_t = y_t − y_(t−1).' }
      - { var: last, feedback: 'That is the level, not the change.' }
    explanation: |
      $\Delta y_t = {=last} - {=prev} = {=dLast|2}$. The {=n} values give {=nd} changes.

  - id: seasonal-diff-numeric
    type: numeric
    skills: [differencing]
    difficulty: 3
    tags: [math]
    generator: diffQ
    lessonRef: { tab: math-code, id: differencing }
    prompt: 'Monthly values (oldest first): {=valsList}. Compute the last value of the **seasonal** difference $\Delta_{12}\, y_t = y_t - y_{t-12}$.'
    answer: { var: dLast, tol: 0.01 }
    misconceptions:
      - { var: wrongRev, feedback: 'Δ12 y_t = y_t − y_(t−12): later minus earlier.' }
      - { var: last, feedback: 'That is the level, not the seasonal change.' }
    explanation: |
      $y_t - y_{t-12} = {=last} - {=prev} = {=dLast|2}$. With {=n} values, only {=nd} seasonal differences exist.

  - id: diff-code
    type: code-fill
    skills: [differencing]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: differencing }
    prompt: Difference the training series once and drop the empty first value.
    code: |
      train_diff = train.__BLANK_1__().__BLANK_2__()
      print(len(train), "→", len(train_diff))   # 468 → 467
    blanks:
      '1': { accept: ['diff'] }
      '2': { accept: ['dropna'] }
    explanation: '`diff()` computes y_t − y_(t−1); the first row has no previous value, so it is NaN and dropped.'

  - id: diff-multi
    type: multi
    skills: [differencing]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: difference-by-hand }
    prompt: What are the consequences of first differencing (slide 22)?
    options:
      - You lose one observation
      - Every forecast afterwards is a forecast of change
      - Seasonality survives and may need a seasonal difference
      - It removes all noise from the series
      - Differencing more than necessary is always harmless
    answer: [0, 1, 2]
    explanation: 'Differencing changes the question, not the noise. Over-differencing invents patterns that were never there.'

  - id: acf-hand
    type: hand-calc
    skills: [autocorrelation]
    difficulty: 2
    tags: [math]
    generator: acfQ
    lessonRef: { tab: math-code, id: acf }
    prompt: 'Series (in time order): {=yList}. Compute the lag-1 autocorrelation with the ACF estimator (one overall mean, one denominator).'
    steps:
      - prompt: Mean $\bar y$
        answer: { var: mean, tol: 0.01 }
      - prompt: 'Denominator $\sum_t (y_t - \bar y)^2$'
        answer: { var: den, tol: 0.01 }
      - prompt: 'Numerator $\sum_{t=2}^{n} (y_t - \bar y)(y_{t-1} - \bar y)$'
        answer: { var: num1, tol: 0.01 }
      - prompt: '$r_1$'
        answer: { var: r1, tol: 0.01 }
        misconceptions:
          - { var: wrongPearson, feedback: 'That is the Pearson correlation of the pairs, with separate means and denominators. The ACF uses one overall mean and the full sum of squares.' }
    explanation: |
      $\bar y = {=mean}$, denominator {=den}, numerator {=num1|3}, so $r_1 = {=r1|3}$.

  - id: acf-pattern-match
    type: match
    skills: [autocorrelation, arima]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: intuition, id: autocorrelation }
    prompt: Match each pattern to what it suggests (Session 11 reading table).
    pairs:
      - ['ACF decays slowly and never dies out', 'Not stationary yet: increase d']
      - ['PACF cuts off after lag k, ACF decays', 'p ≈ k']
      - ['ACF cuts off after lag k, PACF decays', 'q ≈ k']
      - ['Both ACF and PACF decay', 'Try a small p and a small q']
      - ['Large spikes at lags 12 and 24', 'Seasonal structure, outside ARIMA(p, d, q)']
    pick: 4
    explanation: These are hints, not rules; real series are mixtures and several orders may fit equally well.

  - id: pacf-numeric
    type: numeric
    skills: [autocorrelation]
    difficulty: 3
    tags: [math]
    generator: pacfQ
    lessonRef: { tab: intuition, id: autocorrelation }
    prompt: |
      A stationary series has autocorrelations $r_1 = {=r1}$ and $r_2 = {=r2}$. The lag-2 partial autocorrelation (what lag 2
      adds once lag 1 is accounted for) is $\phi_{22} = \frac{r_2 - r_1^2}{1 - r_1^2}$. Compute it.
    answer: { var: p2, tol: 0.01 }
    misconceptions:
      - { var: wrongR2, feedback: 'r₂ is the total resemblance at lag 2; the PACF removes the part that runs through lag 1.' }
      - { var: wrongNoDen, feedback: 'Divide by 1 − r₁².' }
    explanation: |
      $\frac{ {=r2} - {=r1}^2}{1 - {=r1}^2} = {=p2|3}$. For a pure AR(1), r₂ = r₁², so φ₂₂ = 0: the PACF cuts off after lag 1.

  - id: acf-code
    type: code-fill
    skills: [autocorrelation]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: acf }
    prompt: Complete the ACF at lag k.
    code: |
      def acf(y, lags):
          y = np.asarray(y, dtype=float)
          ybar = y.mean()
          den = np.sum((y - ybar) ** 2)
          out = {}
          for k in lags:
              num = np.sum((y[__BLANK_1__:] - ybar) * (y[:-k] - ybar))
              out[k] = num / __BLANK_2__
          return out
    blanks:
      '1': { accept: ['k'] }
      '2': { accept: ['den'] }
    explanation: Pair y_t (from index k on) with y_(t−k); divide by the shared denominator.

  - id: snaive-numeric
    type: numeric
    skills: [baselines]
    difficulty: 1
    tags: [math]
    generator: naiveQ
    lessonRef: { tab: math-code, id: baselines }
    prompt: |
      Training ends in December 1997; its last 12 months are shown. What is the **seasonal naive** forecast {=h} month(s) ahead
      (a {=targetMonth})?
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 1 } }
    answer: { var: sn, tol: 0.001 }
    misconceptions:
      - { var: nv, feedback: 'That is the naive forecast (the last value). Seasonal naive copies the same month from last season.' }
      - { var: wrongShift, feedback: 'Off by one month: horizon h copies month (h − 1) mod 12 of the last season.' }
    explanation: |
      Horizon {=h} lands on a {=targetMonth}; copy {=targetMonth} 1997: {=sn}.

  - id: baseline-mcq
    type: mcq
    skills: [baselines]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: baselines }
    prompt: 'On CO₂ 1998–2001, naive scores MAE 4.527 and seasonal naive 5.063. Why does the forecast with more information score worse?'
    options:
      - 'It repeats 1997''s shape but forgets the yearly growth, so it sits ever further below'
      - Seasonal naive uses less information
      - MAE penalizes seasonal shapes
      - The test set is too short
    answer: 0
    explanation: Naive captured the level, seasonal naive the season; neither captured both. That gap is what ARIMA and lag features fill.

  - id: baseline-code
    type: code-fill
    skills: [baselines]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: baselines }
    prompt: Complete the seasonal naive forecast.
    code: |
      SEASON_LENGTH = 12
      last_year = train.iloc[-SEASON_LENGTH:].values
      seasonal_naive = pd.Series(
          [last_year[i __BLANK_1__ SEASON_LENGTH] for i in range(len(test))], index=test.index)
      naive = pd.Series(train.iloc[__BLANK_2__], index=test.index)
    blanks:
      '1': { accept: ['%'] }
      '2': { accept: ['-1'] }
    explanation: Month i of the test period copies month i mod 12 of the last training year; naive repeats the last training value.

  - id: metrics-hand
    type: hand-calc
    skills: [forecast-metrics]
    difficulty: 1
    tags: [math]
    generator: metricsQ
    lessonRef: { tab: math-code, id: forecast-metrics }
    prompt: Score these forecasts.
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0 } }
    steps:
      - prompt: MAE
        answer: { var: mae, tol: 0.01 }
        misconceptions:
          - { var: me, feedback: 'Take absolute values before averaging, or positive and negative errors cancel.' }
      - prompt: RMSE
        answer: { var: rmse, tol: 0.01 }
        misconceptions:
          - { var: mse, feedback: 'That is the MSE; take the square root.' }
      - prompt: 'MAPE (%)'
        answer: { var: mape, tol: 0.01 }
        misconceptions:
          - { var: wrongMapeByF, feedback: 'Divide each error by the actual value, not the forecast.' }
    explanation: |
      Errors ({=errors|list}). MAE = {=mae|3}, RMSE = {=rmse|3}, MAPE = {=mape|3}%.

  - id: rmse-numeric
    type: numeric
    skills: [forecast-metrics]
    difficulty: 2
    tags: [math]
    generator: metricsQ
    lessonRef: { tab: math-code, id: forecast-metrics }
    prompt: Compute the RMSE of these forecasts.
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0 } }
    answer: { var: rmse, tol: 0.01 }
    misconceptions:
      - { var: mse, feedback: 'Take the square root of the mean squared error.' }
      - { var: mae, feedback: 'That is the MAE. RMSE squares the errors first, so big misses weigh more.' }
    explanation: |
      $\sqrt{\tfrac1n\sum e^2} = \sqrt{ {=mse|3} } = {=rmse|3}$.

  - id: mape-numeric
    type: numeric
    skills: [forecast-metrics]
    difficulty: 2
    tags: [math]
    generator: metricsQ
    lessonRef: { tab: math-code, id: forecast-metrics }
    prompt: Compute the MAPE (in %) of these forecasts.
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0 } }
    answer: { var: mape, tol: 0.01 }
    misconceptions:
      - { var: wrongMapeByF, feedback: 'Divide by the actual value y_t, not by the forecast.' }
      - { var: mae, feedback: 'That is the MAE; express each error as a percentage of the actual value.' }
    explanation: |
      $\tfrac{100}{n}\sum|e_t / y_t| = {=mape|3}\%$.

  - id: metrics-match
    type: match
    skills: [forecast-metrics]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: math-code, id: forecast-metrics }
    prompt: Match each metric to how it reads.
    pairs:
      - ['MAE', 'Typical forecast error, in the original units']
      - ['RMSE', 'Forecast error with extra penalty for large misses']
      - ['MAPE', 'Typical error as a percentage of the actual value; unstable near zero']
    explanation: MAE and RMSE are in ppm for CO₂; MAPE is unit-free.

  - id: arima-numeric
    type: numeric
    skills: [arima]
    difficulty: 2
    tags: [math]
    generator: arimaQ
    lessonRef: { tab: math-code, id: arima-forecast }
    prompt: |
      ARIMA(1,1,1) with drift: mean change c = {=c}, φ = {=phi}, θ = {=theta}. The last two values are {=y0} and {=y1}
      (so Δy = {=dy}), and the last shock is ε = {=eps}. Forecast the next value.
    answer: { var: yhat, tol: 0.01 }
    misconceptions:
      - { var: wrongLevel, feedback: 'That is the forecast **change**. Add it to the last value to get the level.' }
      - { var: wrongNoMa, feedback: 'Include the MA term θ·ε for the first step.' }
    explanation: |
      $\Delta\hat y = {=c} + {=phi}({=dy} - {=c}) + {=theta}({=eps}) = {=dh|3}$; $\hat y = {=y1} + {=dh|3} = {=yhat|3}$.

  - id: arima-hand
    type: hand-calc
    skills: [arima, differencing]
    difficulty: 3
    tags: [math]
    generator: arimaQ
    lessonRef: { tab: intuition, id: arima-assembled }
    prompt: 'Same model (c = {=c}, φ = {=phi}, θ = {=theta}), last values {=y0}, {=y1}, last shock {=eps}. Forecast two steps.'
    steps:
      - prompt: Forecast change for step 1
        answer: { var: dh, tol: 0.01 }
      - prompt: Forecast level for step 1
        answer: { var: yhat, tol: 0.01 }
      - prompt: 'Forecast change for step 2 (the future shock is forecast as 0)'
        answer: { var: dh2, tol: 0.01 }
      - prompt: Forecast level for step 2
        answer: { var: yhat2, tol: 0.01 }
    explanation: |
      Step 1: {=dh|3} → {=yhat|3}. Step 2: $c + \phi(\Delta\hat y_1 - c) = {=dh2|3}$ → {=yhat2|3}.

  - id: pdq-match
    type: match
    skills: [arima]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: arima-assembled }
    prompt: Match each part of ARIMA(p, d, q) to its meaning.
    pairs:
      - ['AR (p)', 'Uses recent values of the (differenced) series']
      - ['I (d)', 'Differences the series d times to make it stationary']
      - ['MA (q)', 'Uses recent forecast errors (shocks)']
      - ['σ²', 'Variance of the unexplained errors; not a term in the forecast']
    explanation: 'ARIMA(1,1,1) read aloud: one past value, one difference, one past shock.'

  - id: residual-mcq
    type: mcq
    skills: [arima, autocorrelation]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: arima-assembled }
    prompt: The ARIMA(1,1,1) residuals on CO₂ have an ACF spike of 0.58 at lag 12. What does it mean, and what is the fix?
    options:
      - 'The mistakes repeat every year; add seasonal terms (SARIMA)'
      - 'The residuals are white noise; nothing to fix'
      - 'The model is over-differenced; use d = 0'
      - 'The series has no seasonality'
    answer: 0
    explanation: Residuals should look like unpredictable noise. A lag-12 spike is the season the model has no letter for, the same thing the ACF flagged before fitting.

  - id: arima-code
    type: code-fill
    skills: [arima]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: arima-forecast }
    prompt: Fit ARIMA(1,1,1) with drift on the training months and forecast the test period.
    code: |
      arima_fit = ARIMA(train, order=(1, __BLANK_1__, 1), trend="t").fit()
      forecast = arima_fit.get_forecast(steps=__BLANK_2__)
      arima_forecast = forecast.predicted_mean
    blanks:
      '1': { accept: ['1'] }
      '2': { accept: ['len(test)'] }
    explanation: d = 1 from the ADF test; one forecast per test month.

  - id: roll-numeric
    type: numeric
    skills: [lag-features]
    difficulty: 1
    tags: [math]
    generator: rollQ
    lessonRef: { tab: intuition, id: lag-features }
    prompt: 'Monthly values t1 … t5: {=valsList}. What is the leak-free `roll_mean_3` feature for the t5 row?'
    answer: { var: roll, tol: 0.005 }
    misconceptions:
      - { var: leaky, feedback: 'That includes t5 itself: rolling(3) without shift(1) leaks the target.' }
      - { var: wrongFour, feedback: 'Use exactly the three months before t5.' }
    explanation: |
      $(y_{t4} + y_{t3} + y_{t2}) / 3 = {=roll|3}$. The leaky version would be {=leaky|3}.

  - id: leak-mcq
    type: mcq
    skills: [lag-features]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: lag-regression }
    prompt: Replacing `roll_mean_3` with `co2.rolling(3).mean()` drops the test MAE to 0.0. Why?
    options:
      - 'The feature contains y_t, so the regression solves y_t = 3·roll − lag_1 − lag_2 instead of forecasting'
      - 'Three-month averages are perfect forecasters of CO₂'
      - 'The test set became easier'
      - 'Linear regression always reaches MAE 0 with enough features'
    answer: 0
    explanation: 'Leakage: information from the month being predicted entered the features. Shift before rolling.'

  - id: features-order
    type: order
    skills: [lag-features]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: lag-regression }
    prompt: Put the Session 12 pipeline in order.
    items:
      - 'Create lag features with shift()'
      - 'Create the rolling feature with shift() then rolling()'
      - Add one-hot month columns
      - Drop rows with missing lags
      - Split by date into train and test
      - Fit LinearRegression on the training rows
      - Forecast the test months one step ahead and compare with naive and ARIMA
