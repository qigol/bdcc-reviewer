  - id: step-naive-hand
    type: hand-calc
    skills: [baselines, forecast-metrics]
    difficulty: 3
    tags: [math]
    generator: stepQ
    lessonRef: { tab: intuition, id: lag-features }
    prompt: |
      A monthly series ended its training months at {=last}. The next five months turned out {=testList}. Score two naive
      forecasts on these five months.
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0 } }
    steps:
      - prompt: 'MAE of the **multi-step** naive forecast (every month forecast as {=last})'
        answer: { var: maeMulti, tol: 0.01 }
        misconceptions:
          - { var: maeOne, feedback: 'That is the one-step score. Multi-step repeats the last training value for all five months.' }
          - { var: wrongSumMulti, feedback: 'That is the total miss. Divide by the 5 months.' }
        hint: 'Each miss is |real − {=last}|; average the five.'
      - prompt: 'MAE of the **one-step** naive forecast (each month forecast as the real month before it)'
        answer: { var: maeOne, tol: 0.01 }
        misconceptions:
          - { var: maeMulti, feedback: 'That is the multi-step score. One-step uses the real value of the month just before.' }
          - { var: meOne, feedback: 'Take absolute values before averaging, or misses of opposite sign cancel.' }
        hint: 'The first forecast is {=last}; after that, each forecast is the previous real month.'
    hints:
      - 'Multi-step: one forecast number for every month. One-step: a new forecast each month from the latest real value.'
      - Write both forecast columns next to the real values before scoring.
    explanation: |
      Multi-step misses grow as the series climbs away from {=last}: MAE {=maeMulti|2}. One-step forecasts ({=oneList})
      only bridge one month: MAE {=maeOne|2}. Same naive rule, different setup, so compare models only within one setup.

  - id: baseline-duel-hand
    type: hand-calc
    skills: [baselines, forecast-metrics]
    difficulty: 3
    tags: [application]
    generator: horizonQ
    lessonRef: { tab: math-code, id: baselines }
    prompt: |
      Quarterly sales of a new product line: the last training year was {=trainList} (Q1 to Q4) and the next year turned
      out {=testList}. Forecast all four test quarters once, from the end of training, with both baselines.
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0 } }
    steps:
      - prompt: 'MAE of the naive forecast (all four quarters forecast as {=last})'
        answer: { var: maeMulti, tol: 0.01 }
        misconceptions:
          - { var: maeSn, feedback: 'That is the seasonal naive score. Naive repeats the last training quarter.' }
          - { var: maeOne, feedback: 'That uses each real quarter before it (one-step). Here every forecast is made once, from the end of training.' }
        hint: 'Each miss is |real − {=last}|.'
      - prompt: 'MAE of the seasonal naive forecast (each quarter copies the same quarter of the training year)'
        answer: { var: maeSn, tol: 0.01 }
        misconceptions:
          - { var: maeMulti, feedback: 'That is the naive score. Seasonal naive copies Q1 from Q1, Q2 from Q2, and so on.' }
          - { var: maeOne, feedback: 'That compares each quarter with the one just before it. Seasonal naive uses the same quarter a year earlier.' }
        hint: 'Pair test Q1 with training Q1, test Q2 with training Q2, and so on.'
    hints:
      - Write the two forecast columns next to the test year before scoring.
      - 'A season here is 4 quarters, so "the same quarter last year" is 4 steps back.'
    explanation: |
      Naive misses average {=maeMulti|2}; seasonal naive misses average {=maeSn|2}, so {=snWins} wins here. Seasonal naive
      wins when the yearly swing is bigger than a year's growth; naive wins when the growth is bigger.

