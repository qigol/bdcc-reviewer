templates:
  - id: seasonal-cyclic
    type: match
    skills: [ts-structure]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: name-the-parts }
    prompt: Seasonal or cyclic?
    pairs:
      - ['Ice-cream sales peaking every summer', 'Seasonal: repeats every year, tied to the calendar']
      - ['Traffic dipping every Sunday', 'Seasonal: repeats every week, tied to the calendar']
      - ['A recession every 6 to 10 years', 'Cyclic: economic swings of no fixed length']
      - ['Sunspot activity with cycles of 9 to 14 years', 'Cyclic: solar swings of no fixed length']
    hints:
      - Does the pattern repeat on a fixed calendar length?
    explanation: Seasonal patterns repeat on a fixed, calendar-linked period; cyclic rises and falls have no fixed length.

  - id: structure-mcq
    type: mcq
    skills: [ts-structure]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: be-the-forecaster }
    prompt: A monthly series climbs steadily and repeats the same yearly shape. What should a forecast of the next 12 months use?
    options:
      - The direction and last year's shape
      - Only the typical level
      - Only the last value
      - Nothing; it cannot be forecast without a model
    answer: 0
    hints:
      - Which two patterns does the description mention?
    explanation: 'That is series C on slide 10. The trend gives the direction, seasonality the repeating shape.'

  - id: additive-multi
    type: multi
    skills: [ts-structure]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: decomposition }
    prompt: 'About the idea y_t ≈ T_t + S_t + R_t (slide 13), which statements are true?'
    options:
      - It is a way of looking at a series, not a theory of how the data were generated
      - Some series combine their parts by multiplying rather than adding
      - A series can have several seasonal patterns at once
      - The trend must be a straight line
      - The remainder is whatever trend and seasonality do not explain
    answer: [0, 1, 2, 4]
    hints:
      - 'Look out for options that say "must".'
    explanation: '"≈, not =". The trend can curve and change direction.'

  - id: lag-numeric
    type: numeric
    skills: [lags]
    difficulty: 1
    tags: [math]
    generator: lagQ
    lessonRef: { tab: math-code, id: lag-notation }
    prompt: 'The table lists a {=freq} series up to time t. What is y at time t − {=k}?'
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0 } }
    answer: { var: value, tol: 0 }
    misconceptions:
      - { var: wrongForward, feedback: 'Count back exactly k rows from t; you are one row short.' }
      - { var: wrongOff, feedback: 'You counted one row too far back.' }
    hints:
      - Start at the row for time t (the last row).
      - Count back exactly k rows.
    explanation: |
      Count {=k} steps back from t: $y_{t-{=k}} = {=value}$.

  - id: lag-units
    type: mcq
    skills: [lags]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: lags }
    prompt: 'The data are quarterly (4 values per year). What is y at time t − 4?'
    options:
      - The same quarter one year ago
      - The value four months ago
      - The value four years ago
      - The average of the last four quarters
    answer: 0
    hints:
      - k counts steps of the data. What is one step here?
    explanation: |
      k counts steps of the data. Four quarters = one year. For monthly data the same idea is t − 12; for daily data, t − 7 is a week ago.


  - id: lag-code
    type: code-fill
    skills: [lags, lag-features]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: lag-notation }
    prompt: Add a "same month last year" column to a monthly DataFrame.
    code: |
      features = co2.to_frame(name="co2")
      features["lag_1"] = features["co2"].__BLANK_1__(1)
      features["lag_12"] = features["co2"].shift(__BLANK_2__)
    blanks:
      '1': { accept: ['shift'] }
      '2': { accept: ['12'] }
    hints:
      - Which pandas method moves a column down by k rows?
    explanation: '`shift(k)` moves the column down k rows, so each row holds the value from k months earlier.'

  - id: random-split-mcq
    type: mcq
    skills: [chrono-split]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: order-is-signal }
    prompt: Why is `train_test_split(X, y, shuffle=True)` wrong for a time series?
    options:
      - 'It lets the model train on later months and be tested on earlier ones, so the score is excellent and meaningless'
      - It deletes rows from the series
      - It changes the values of the series
      - It only works for classification
    answer: 0
    hints:
      - 'After shuffling, which months could end up in training?'
    explanation: |
      Shuffling deletes nothing but destroys the order, and the order is the information. Learn from the past, test on the future.


  - id: forecast-workflow
    type: order
    skills: [chrono-split, baselines]
    difficulty: 1
    tags: [application]
    lessonRef: { tab: intuition, id: baselines }
    prompt: Put the Session 11 workflow in order.
    items:
      - Plot the series and name its patterns
      - Split by date into training and test months
      - Score the naive and seasonal naive forecasts on the test months
      - Test for stationarity and difference if needed
      - Read the ACF and PACF to choose p and q
      - 'Fit ARIMA(p, d, q), forecast the test months and compare with the baselines'
      - Check the residuals for patterns the model missed
    explanation: |
      Set the baseline first, then choose each ARIMA number from its own evidence, then check the residuals honestly.


  - id: forest-mcq
    type: mcq
    skills: [chrono-split, lag-features]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: order-is-signal }
    prompt: |
      A random forest on CO₂ lag columns scores MAE 0.515 with a random split and 3.174 with a split by date. Its highest
      forecast is 366.06, while the highest training value is 366.68. What explains the gap?
    options:
      - |
        A tree predicts averages of training values, so it cannot forecast above the highest one; the random split hid this
      - The split by date had too few test months
      - The forest needs more trees
      - CO₂ is not a time series
    answer: 0
    hints:
      - Can an average of training values ever be bigger than the biggest training value?
    explanation: |
      With a shuffled split, every test month had training months on both sides, so the forest only filled gaps. Linear regression has no such ceiling.


  - id: adf-mcq
    type: mcq
    skills: [stationarity]
    difficulty: 2
    tags: [math]
    generator: adfQ
    lessonRef: { tab: math-code, id: adf }
    prompt: |
      ADF test: statistic {=stat}, 5% cut-off (critical value) {=crit}, p-value {=p}. What is the correct conclusion?
    hints:
      - 'The ADF test''s H₀ is "random walk". Is p below 0.05?'
    explanation: |
      Reject H₀ ("random walk") only when p < 0.05, which is the same as the statistic being below the cut-off. A test
      never proves that a series is or is not stationary.

  - id: stationarity-multi
    type: multi
    skills: [stationarity]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: stationary-gallery }
    prompt: Which are the three conditions for a stationary series (slide 17)?
    options:
      - A steady typical level
      - A steady amount of wiggle
      - A steady link with its own past
      - Small wiggles
      - Predictable values
    answer: [0, 1, 2]
    hints:
      - 'Stationary means "behaves the same throughout", not "small" or "easy to predict".'
    explanation: |
      Stationary means consistent, not flat and not predictable. The sunspot series swings widely and is still stationary.


  - id: gallery-match
    type: match
    skills: [stationarity]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: stationary-gallery }
    prompt: Match each series from slide 18 to the reason for its verdict.
    pairs:
      -   - 'Random walk: not stationary'
          - It wanders with no level to return to
      -   - 'Growing wiggle: not stationary'
          - The level is steady but the wiggle grows
      -   - 'Sunspots: stationary'
          - 'Big swings, but the behaviour stays the same and the cycles have no fixed length'
      -   - 'Nile flow: not stationary'
          - The level jumps part-way through
      -   - 'Monthly CO₂: not stationary'
          - Trend and seasonality
    pick: 4
    hints:
      - 'For each series, ask which of level, wiggle size or link to the past changes over time.'
    explanation: 'Each non-stationary series breaks one of the three conditions (level, wiggle, link with its past).'

  - id: diff-numeric
    type: numeric
    skills: [differencing]
    difficulty: 1
    tags: [math]
    generator: diffQ
    lessonRef: { tab: intuition, id: difference-by-hand }
    prompt: 'Annual values: {=valsList}. What is the **last** value of the first-differenced series?'
    answer: { var: dLast, tol: 0.01 }
    misconceptions:
      - { var: wrongRev, feedback: 'Subtract the earlier value from the later one: Δy_t = y_t − y_(t−1).' }
      - { var: last, feedback: 'That is the level, not the change.' }
    hints:
      - The first difference is this value minus the one before it.
      - 'For the last value: last value − second-to-last value.'
    explanation: |
      $\Delta y_t = {=last} - {=prev} = {=dLast|2}$. The {=n} values give {=nd} changes.

  - id: seasonal-diff-numeric
    type: numeric
    skills: [differencing]
    difficulty: 3
    tags: [math]
    generator: diffQ
    lessonRef: { tab: math-code, id: differencing }
    prompt: 'Monthly values (oldest first): {=valsList}. Compute the last value of the **seasonal** difference $\Delta_{12}\, y_t = y_t - y_{t-12}$.'
    answer: { var: dLast, tol: 0.01 }
    misconceptions:
      - { var: wrongRev, feedback: 'Δ12 y_t = y_t − y_(t−12): later minus earlier.' }
      - { var: last, feedback: 'That is the level, not the seasonal change.' }
    hints:
      - A seasonal difference compares with the same month one year (12 steps) earlier.
      - Count back 12 values from the last one and subtract.
    explanation: |
      $y_t - y_{t-12} = {=last} - {=prev} = {=dLast|2}$. With {=n} values, only {=nd} seasonal differences exist.

  - id: diff-code
    type: code-fill
    skills: [differencing]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: differencing }
    prompt: Difference the training series once and drop the empty first value.
    code: |
      train_diff = train.__BLANK_1__().__BLANK_2__()
      print(len(train), "→", len(train_diff))   # 468 → 467
    blanks:
      '1': { accept: ['diff'] }
      '2': { accept: ['dropna'] }
    hints:
      - pandas has a method that subtracts the previous row. The first result is empty.
    explanation: |
      `diff()` computes y_t − y_(t−1). The first row has nothing before it, so it is empty (NaN) and dropped.


  - id: diff-multi
    type: multi
    skills: [differencing]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: difference-by-hand }
    prompt: What are the consequences of first differencing (slide 22)?
    options:
      - You lose one value
      - Every forecast afterwards is a forecast of change
      - The yearly pattern survives and may need a seasonal difference
      - It removes all noise from the series
      - Differencing more than needed is always harmless
    answer: [0, 1, 2]
    hints:
      - Two of the options are too good to be true.
    explanation: |
      Differencing changes the question, not the noise. Differencing too much creates patterns that were never there.


  - id: acf-hand
    type: hand-calc
    skills: [autocorrelation]
    difficulty: 2
    tags: [math]
    generator: acfQ
    lessonRef: { tab: math-code, id: acf }
    prompt: |
      Series (in time order): {=yList}. Compute the lag-1 autocorrelation (one overall average, one shared bottom number).
    steps:
      - prompt: |
          Average $\bar y$
        answer: { var: mean, tol: 0.01 }
        hint: Add the values and divide by how many there are.
      - prompt: |
          Bottom number $\sum_t (y_t - \bar y)^2$
        answer: { var: den, tol: 0.01 }
        hint: 'Subtract the average from each value, square, and add.'
      - prompt: |
          Top number $\sum_{t=2}^{n} (y_t - \bar y)(y_{t-1} - \bar y)$
        answer: { var: num1, tol: 0.01 }
        hint: 'Multiply each gap by the gap one step earlier, and add.'
      - prompt: '$r_1$'
        answer: { var: r1, tol: 0.01 }
        misconceptions:
          - { var: wrongPearson, feedback: 'That is the Pearson correlation of the pairs, with separate means and denominators. The ACF uses one overall mean and the full sum of squares.' }
        hint: Top ÷ bottom.
    hints:
      - 'Work out each value''s gap from the average first; you will reuse the gaps.'
    explanation: |
      Average $\bar y = {=mean}$, bottom number {=den}, top number {=num1|3}, so $r_1 = {=r1|3}$.

  - id: acf-pattern-match
    type: match
    skills: [autocorrelation, arima]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: intuition, id: autocorrelation }
    prompt: Match each pattern to what it suggests (Session 11 reading table).
    pairs:
      -   - ACF fades very slowly and never dies out
          - 'Not stationary yet: difference again (raise d)'
      -   - 'PACF stops after lag k, ACF fades'
          - p ≈ k
      -   - 'ACF stops after lag k, PACF fades'
          - q ≈ k
      -   - Both ACF and PACF fade
          - Try a small p and a small q
      -   - Big spikes at lags 12 and 24
          - 'A yearly pattern, which ARIMA(p, d, q) cannot capture'
    pick: 4
    hints:
      - '"Stops" after lag k points to that number of terms; "fades" points to small p and q.'
    explanation: 'These are hints, not rules; real series are mixtures and several choices may fit equally well.'

  - id: pacf-numeric
    type: numeric
    skills: [autocorrelation]
    difficulty: 3
    tags: [math]
    generator: pacfQ
    lessonRef: { tab: intuition, id: autocorrelation }
    prompt: |
      A stationary series has autocorrelations $r_1 = {=r1}$ and $r_2 = {=r2}$. The lag-2 partial autocorrelation (what lag 2
      adds once lag 1 is accounted for) is $\phi_{22} = \frac{r_2 - r_1^2}{1 - r_1^2}$. Compute it.
    answer: { var: p2, tol: 0.01 }
    misconceptions:
      - {var: wrongR2, feedback: 'r₂ is the full link at lag 2. The PACF removes the part that is passed along through lag 1.'}
      - { var: wrongNoDen, feedback: 'Divide by 1 − r₁².' }
    hints:
      - Square r₁ first.
      - 'Top: r₂ − r₁². Bottom: 1 − r₁².'
    explanation: |
      $\frac{ {=r2} - {=r1}^2}{1 - {=r1}^2} = {=p2|3}$. If a series is built from just its last value, r₂ = r₁², so this is 0:
      the PACF stops after lag 1.

  - id: acf-code
    type: code-fill
    skills: [autocorrelation]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: acf }
    prompt: Complete the ACF at lag k.
    code: |
      def acf(y, lags):
          y = np.asarray(y, dtype=float)
          ybar = y.mean()
          den = np.sum((y - ybar) ** 2)
          out = {}
          for k in lags:
              num = np.sum((y[__BLANK_1__:] - ybar) * (y[:-k] - ybar))
              out[k] = num / __BLANK_2__
          return out
    blanks:
      '1': { accept: ['k'] }
      '2': { accept: ['den'] }
    hints:
      - 'Pair y[k:] with y[:-k], each minus the average.'
    explanation: |
      Pair y_t (from position k on) with y_(t−k), each minus the average, and divide by the shared bottom number.


  - id: snaive-numeric
    type: numeric
    skills: [baselines]
    difficulty: 1
    tags: [math]
    generator: naiveQ
    lessonRef: { tab: math-code, id: baselines }
    prompt: |
      Training ends in December 1997; its last 12 months are shown. What is the **seasonal naive** forecast {=h} month(s) ahead (a {=targetMonth})?
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 1 } }
    answer: { var: sn, tol: 0.001 }
    misconceptions:
      - {var: nv, feedback: 'That is the naive forecast (the last value). Seasonal naive copies the same month from last year.'}
      - {var: wrongShift, feedback: 'Off by one month: look up the same calendar month in last year''s values.'}
    hints:
      - Seasonal naive copies the same calendar month from the last 12 training months.
      - Which month is h months after December? Find that month in the table.
    explanation: |
      Horizon {=h} lands on a {=targetMonth}; copy {=targetMonth} 1997: {=sn}.

  - id: baseline-mcq
    type: mcq
    skills: [baselines]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: baselines }
    prompt: 'On CO₂ 1998–2001, naive scores MAE 4.527 and seasonal naive 5.063. Why does the forecast with more information score worse?'
    options:
      - 'It repeats 1997''s shape but forgets the yearly growth, so it sits further and further below'
      - Seasonal naive uses less information
      - MAE punishes seasonal shapes
      - The test set is too short
    answer: 0
    hints:
      - 'Does 1997''s shape know that CO₂ keeps rising each year?'
    explanation: |
      Naive got the level, seasonal naive the yearly shape; neither got both. ARIMA and lag columns fill that gap.


  - id: baseline-code
    type: code-fill
    skills: [baselines]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: baselines }
    prompt: Complete the seasonal naive forecast.
    code: |
      SEASON_LENGTH = 12
      last_year = train.iloc[-SEASON_LENGTH:].values
      seasonal_naive = pd.Series(
          [last_year[i __BLANK_1__ SEASON_LENGTH] for i in range(len(test))], index=test.index)
      naive = pd.Series(train.iloc[__BLANK_2__], index=test.index)
    blanks:
      '1': { accept: ['%'] }
      '2': { accept: ['-1'] }
    hints:
      - Which slice of the training data holds last year?
    explanation: |
      Month i of the test period copies month (i mod 12) of the last training year; naive repeats the last training value.


  - id: metrics-hand
    type: hand-calc
    skills: [forecast-metrics]
    difficulty: 1
    tags: [math]
    generator: metricsQ
    lessonRef: { tab: math-code, id: forecast-metrics }
    prompt: Score these forecasts.
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0 } }
    steps:
      - prompt: MAE
        answer: { var: mae, tol: 0.01 }
        misconceptions:
          - { var: me, feedback: 'Take absolute values before averaging, or positive and negative errors cancel.' }
        hint: 'Average of |real − forecast|.'
      - prompt: RMSE
        answer: { var: rmse, tol: 0.01 }
        misconceptions:
          - { var: mse, feedback: 'That is the MSE; take the square root.' }
        hint: 'Square each miss, average, then square root.'
      - prompt: 'MAPE (%)'
        answer: { var: mape, tol: 0.01 }
        misconceptions:
          - { var: wrongMapeByF, feedback: 'Divide each error by the actual value, not the forecast.' }
        hint: 'Each |miss| ÷ real value, averaged, × 100.'
    hints:
      - Write down each miss (real − forecast) first.
    explanation: 'Misses ({=errors|list}). MAE = {=mae|3}, RMSE = {=rmse|3}, MAPE = {=mape|3}%.'
  - id: rmse-numeric
    type: numeric
    skills: [forecast-metrics]
    difficulty: 2
    tags: [math]
    generator: metricsQ
    lessonRef: { tab: math-code, id: forecast-metrics }
    prompt: Compute the RMSE of these forecasts.
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0 } }
    answer: { var: rmse, tol: 0.01 }
    misconceptions:
      - { var: mse, feedback: 'Take the square root of the mean squared error.' }
      - { var: mae, feedback: 'That is the MAE. RMSE squares the errors first, so big misses weigh more.' }
    hints:
      - Square each miss (real − forecast).
      - 'Average the squares, then take the square root.'
    explanation: |
      $\sqrt{\tfrac1n\sum e^2} = \sqrt{ {=mse|3} } = {=rmse|3}$.

  - id: mape-numeric
    type: numeric
    skills: [forecast-metrics]
    difficulty: 2
    tags: [math]
    generator: metricsQ
    lessonRef: { tab: math-code, id: forecast-metrics }
    prompt: Compute the MAPE (in %) of these forecasts.
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0 } }
    answer: { var: mape, tol: 0.01 }
    misconceptions:
      - { var: wrongMapeByF, feedback: 'Divide by the actual value y_t, not by the forecast.' }
      - { var: mae, feedback: 'That is the MAE; express each error as a percentage of the actual value.' }
    hints:
      - 'Divide each miss by the real value, not the forecast, and drop the sign.'
      - 'Average those, then multiply by 100.'
    explanation: |
      $\tfrac{100}{n}\sum|e_t / y_t| = {=mape|3}\%$.

  - id: metrics-match
    type: match
    skills: [forecast-metrics]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: math-code, id: forecast-metrics }
    prompt: Match each metric to how it reads.
    pairs:
      -   - MAE
          - 'Typical forecast miss, in the original units'
      -   - RMSE
          - Forecast miss with an extra penalty for big misses
      -   - MAPE
          - Typical miss as a percentage of the real value; unreliable near zero
    hints:
      - 'Which score turns misses into percentages, and which one punishes big misses most?'
    explanation: MAE and RMSE are in ppm for CO₂; MAPE has no units.

  - id: arima-numeric
    type: numeric
    skills: [arima]
    difficulty: 2
    tags: [math]
    generator: arimaQ
    lessonRef: { tab: math-code, id: arima-forecast }
    prompt: |
      ARIMA(1,1,1) with drift: average change c = {=c}, φ = {=phi}, θ = {=theta}. The last two values are {=y0} and {=y1}
      (so the last change is {=dy}), and the last surprise is ε = {=eps}. Forecast the next value.
    answer: { var: yhat, tol: 0.01 }
    misconceptions:
      - {var: wrongLevel, feedback: 'That is the forecast **change**. Add it to the last value to get the forecast value.'}
      - {var: wrongNoMa, feedback: 'Include the surprise term θ × ε for the first step.'}
    hints:
      - Forecast change = c + φ × (last change − c) + θ × ε.
      - Then add that change to the last value.
    explanation: |
      $\Delta\hat y = {=c} + {=phi}({=dy} - {=c}) + {=theta}({=eps}) = {=dh|3}$; $\hat y = {=y1} + {=dh|3} = {=yhat|3}$.

  - id: arima-hand
    type: hand-calc
    skills: [arima, differencing]
    difficulty: 3
    tags: [math]
    generator: arimaQ
    lessonRef: { tab: intuition, id: arima-assembled }
    prompt: |
      Same model (c = {=c}, φ = {=phi}, θ = {=theta}), last values {=y0}, {=y1}, last surprise {=eps}. Forecast two steps.
    steps:
      - prompt: Forecast change for step 1
        answer: { var: dh, tol: 0.01 }
        hint: c + φ × (last change − c) + θ × ε.
      - prompt: Forecast value for step 1
        answer: { var: yhat, tol: 0.01 }
        hint: Last value + that change.
      - prompt: 'Forecast change for step 2 (the next surprise is set to 0)'
        answer: { var: dh2, tol: 0.01 }
        hint: 'Use the step-1 change as the "last change"; drop the θ term.'
      - prompt: Forecast value for step 2
        answer: { var: yhat2, tol: 0.01 }
        hint: Step-1 value + this change.
    hints:
      - 'Each step works on the change first, then adds it to the level.'
    explanation: |
      Step 1: {=dh|3} → {=yhat|3}. Step 2: $c + \phi(\Delta\hat y_1 - c) = {=dh2|3}$ → {=yhat2|3}.

  - id: pdq-match
    type: match
    skills: [arima]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: arima-assembled }
    prompt: Match each part of ARIMA(p, d, q) to its meaning.
    pairs:
      -   - AR (p)
          - Uses recent values of the (differenced) series
      -   - I (d)
          - Differences the series d times to make it stationary
      -   - MA (q)
          - Uses recent forecast misses (surprises)
      -   - σ²
          - How big the surprises are; not a term in the forecast
    hints:
      - 'AR looks at past values, I at differencing, MA at past surprises.'
    explanation: 'ARIMA(1,1,1) read aloud: one past change, one difference, one past surprise.'

