    generator: rollQ
    lessonRef: { tab: intuition, id: lag-features }
    prompt: |
      Monthly values t1 … t5: {=valsList}. What is the safe (leak-free) `roll_mean_3` value for the t5 row?
    answer: { var: roll, tol: 0.005 }
    misconceptions:
      - { var: leaky, feedback: 'That includes t5 itself: rolling(3) without shift(1) leaks the target.' }
      - { var: wrongFour, feedback: 'Use exactly the three months before t5.' }
    hints:
      - The safe version uses only months before t5.
      - 'Average t2, t3 and t4.'
    explanation: |
      $(y_{t4} + y_{t3} + y_{t2}) \div 3 = {=roll|3}$. The unsafe version (including t5) would be {=leaky|3}.

