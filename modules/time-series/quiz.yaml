    tags: [application]
    generator: featQ
    lessonRef: { tab: intuition, id: lag-features }
    prompt: |
      A shop's monthly sales, January of year 1 to February of year 2. February of year 2 is the month being forecast (its
      real value is shown only to check the forecast later). A fitted regression is
      $\hat y = {=b0} + {=w1}\cdot\text{lag\_1} + {=w12}\cdot\text{lag\_12} + {=w3}\cdot\text{roll\_mean\_3}$. Build the
      inputs for February of year 2 and forecast it.
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0, rowHeader: month } }
    steps:
      - prompt: lag_1
        answer: { var: lag1, tol: 0.01 }
        hint: The month just before February of year 2.
      - prompt: lag_12
        answer: { var: lag12, tol: 0.01 }
        hint: The same month one year earlier.
      - prompt: 'Safe roll_mean_3 (2 decimal places)'
        answer: { var: roll, tol: 0.01 }
        hint: 'Shift first: average the three months **before** February of year 2.'
      - prompt: 'Forecast $\hat y$ (2 decimal places)'
        answer: { var: fc, tol: 0.01 }
        hint: Intercept + each weight × its column.
    hints:
      - 'Every input must be known before February of year 2 starts.'
    explanation: |
      lag_1 = {=lag1}, lag_12 = {=lag12}, roll_mean_3 = {=roll|2} (November, December, January). Forecast
      {=b0} + {=w1}·{=lag1} + {=w12}·{=lag12} + {=w3}·{=roll|2} = {=fc|2}; the real value was {=actual}. The leaky window
      (December to February, {=leaky|2}) would have slipped the answer into the inputs.

  # ------------------------------------------------------------------ new formats (find-error, case, two-tier, explain, Parsons)
  - id: mape-find-error
    type: find-error
    skills: [forecast-metrics]
    difficulty: 2
    tags: [math]
    generator: metricsQ
    lessonRef: { tab: math-code, id: forecast-metrics }
    prompt: A classmate scores these four forecasts. **One step is wrong.** Click it and give the correct MAPE.
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0 } }
    steps:
      - 'Errors e = actual − forecast: {=errors|list}'
      - 'MAE = mean |e| = {=mae|2}'
      - 'RMSE = √(mean e²) = {=rmse|2}'
      - 'MAPE = mean of |e| ÷ forecast × 100 = {=wrongMapeByF|2}%'
    wrong: 3
    fix: { var: mape, tol: 0.01, percent: true }
    fixPrompt: What is the correct MAPE (%)?
    misconceptions:
      - { var: wrongMapeByF, feedback: "That still divides by the forecast. MAPE divides each error by the **actual** value." }
    stepFeedback:
      0: Errors as actual − forecast is right.
      1: MAE is the mean absolute error, which is right.
      2: RMSE is the root of the mean squared error, which is right.
    hints: [Percentage of what?]
    explanation: MAPE = mean of |e| ÷ actual × 100 = {=mape|2}%.

  - id: diff-case
    type: case
    skills: [differencing, stationarity]
    difficulty: 3
    tags: [math]
    generator: diffQ
    lessonRef: { tab: math-code, id: differencing }
    prompt: '**Difference a short series and use it.** The series is {=valsList}.'
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 1 } }
    parts:
      - type: numeric
        prompt: How many values does the first-differenced series have?
        answer: { var: nd, tol: 0 }
        explanation: 'Differencing loses one value: {=n} − 1 = {=nd}.'
      - type: numeric
        prompt: The last value of the differenced series (one decimal)
        answer: { var: dLast, tol: 0.05 }
        explanation: '{=last} − {=prev} = {=dLast|1}.'
      - type: numeric
        prompt: The mean of the differenced series (two decimals)
        answer: { var: meanD, tol: 0.01 }
        explanation: 'Mean change = {=meanD|2}.'
      - type: two-tier
        prompt: A model forecasts the **differenced** series as {=meanD|2} for next month. What is the forecast of the series itself?
        options: ['The last value plus that change', 'That number itself', 'The mean of the original series']
        answer: 0
        reasons:
          - A differenced forecast is a change, which has to be added back to the last value
          - Differencing rescales the series, so its forecasts are already levels
          - Differenced series are always forecast by the mean
        reasonAnswer: 0
        reasonFeedback:
          1: Differencing turns levels into changes; it doesn't rescale.
          2: The mean is one forecast choice; either way it's a change that must be added back.
        explanation: '{=last} + {=meanD|2}: forecasts of changes are integrated back onto the last level.'
    hints: [Each difference is a value minus the one before it.]
    explanation: '{=nd} differences, last {=dLast|1}, mean {=meanD|2}; a forecast of change is added back to {=last}.'

  - id: split-two-tier
    type: two-tier
    skills: [chrono-split]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: lag-features }
    prompt: A team forecasting monthly sales uses `train_test_split(X, y, shuffle=True)` and gets a great test score. Should they trust it?
    options: ['No; they should split by date, training on the past and testing on the future', 'Yes; shuffling makes the test set more representative', 'Yes, as long as the test set is 20% of the data']
    answer: 0
    reasons:
      - With shuffling, test months sit between training months, so the model fills gaps instead of forecasting
      - Shuffling removes the trend
      - Time series can't be split at all
    reasonAnswer: 0
    optionFeedback:
      1: Representative for gap-filling, not for forecasting the future.
      2: The share isn't the problem; the order is.
    reasonFeedback:
      1: Shuffling keeps every value; it only destroys the order.
      2: They can, by date.
    hints: ["What will the model see in real use: the months around the target, or only the past?"]
    explanation: Split chronologically; a shuffled split leaks the future into training and flatters the score.

  - id: stationary-explain
    type: explain
    skills: [stationarity, differencing]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: differencing }
    prompt: Explain what stationarity means and why a trending series is usually differenced before fitting ARIMA.
    model: |
      A stationary series has a steady typical level, a steady amount of wiggle, and a steady link with its own past; it can
      still swing a lot. A trend breaks the first condition, because the level keeps moving. ARIMA's AR and MA parts assume a
      stationary series, so we difference: model the month-to-month changes, which often are stationary, then add the forecast
      changes back onto the last value (the "I" in ARIMA).
    checklist:
      - Stationary means steady level, steady spread and steady autocorrelation
      - A trend makes the level drift, so the series isn't stationary
      - Differencing models changes instead of levels
      - Forecasts of changes are added back (integrated)
    hints: [Which of the three conditions does a trend break?]
    explanation: Difference to remove the drifting level, model the changes, then integrate back.

  - id: forecast-parsons
    type: order
    skills: [baselines, chrono-split, forecast-metrics]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: baselines }
    prompt: Build an honest forecasting workflow from the bank. Two lines don't belong.
    items:
      - Split the series by date into training and test periods
      - Score a naive baseline on the test period
      - Fit the model on the training period only
      - Check the residuals for leftover patterns
      - Score the model on the test period and compare it with the baseline
    distractors:
      - Shuffle the rows so that every month appears in training
      - Fit the model on all the data, then score it on the test period
    hints: [Nothing from the test period may reach the model before scoring.]
    explanation: Split by date → baseline → fit on train → check residuals → compare on test. Shuffling or fitting on everything leaks the test period.

  # ------------------------------------------------------------------ transfer (new settings, several scenarios each)
  - id: transfer-baseline
    type: mcq
    skills: [baselines, forecast-metrics]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: math-code, id: baselines }
    prompt: A Manila bakery's daily sales have a strong weekly pattern (busy weekends). Which simple baseline should a new forecasting model beat?
    options:
      - Seasonal naive, using the same day last week
      - The overall mean of all days
      - Zero for every day
      - A forecast that copies the highest day ever
    answer: 0
    optionFeedback:
      1: The mean ignores the weekly pattern.
      2: Zero isn't a meaningful baseline.
      3: That ignores the pattern and the level.
    hints: [Which baseline already captures the weekly pattern?]
    explanation: With a strong seasonal pattern, seasonal naive is the natural baseline.
    variants:
      - prompt: A stock's daily closing price moves like a random walk. Which baseline is hard to beat?
        options:
          - Naive, using yesterday's price
          - Seasonal naive, using last week's price
          - The mean of the last year
          - The highest price this month
        answer: 0
        optionFeedback:
          1: There's no weekly pattern to copy.
          2: The level drifts, so an old mean lags.
          3: That's not a forecasting method.
        explanation: For a random walk, today's value is the best single guess for tomorrow.
      - prompt: A new model's MAE is 12.4; seasonal naive's is 11.8 on the same test months. What should the team conclude?
        options:
          - The model doesn't beat the simple baseline yet
          - The model is 5% better
          - MAE can't compare these two
          - The model is good because 12.4 is small
        answer: 0
        optionFeedback:
          1: Lower MAE is better; the model's is higher.
          2: Same test months make them comparable.
          3: Small or large only means something next to a baseline.
        explanation: A model must beat the baseline to be worth its complexity.

  - id: transfer-differencing
    type: two-tier
    skills: [differencing, stationarity]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: math-code, id: differencing }
    prompt: A city's monthly water use climbs steadily year after year. Before fitting ARIMA, what should the analyst try first?
    options: ['First differencing', 'Shuffling the months', 'Removing the last year']
    answer: 0
    reasons:
      - A steady climb means the level drifts; differences remove that trend
      - Shuffling makes the series stationary
      - Recent data causes non-stationarity
    reasonAnswer: 0
    optionFeedback:
      1: Shuffling destroys the time order.
      2: Dropping data doesn't remove a trend.
    reasonFeedback:
      1: Shuffling isn't a valid transformation for a series.
      2: The trend runs through all the years.
    hints: [Which of the stationarity conditions does a trend break?]
    explanation: Differencing turns levels into changes, removing the drifting level.
    variants:
      - prompt: A shop's monthly sales have no trend, but every December spikes. After a first difference, an ACF spike at lag 12 remains. What next?
        options: ['A seasonal difference (lag 12)', 'Difference again at lag 1', 'Nothing; the series is fine']
        answer: 0
        reasons:
          - A yearly pattern needs a difference at the seasonal lag
          - Every pattern is removed by lag-1 differences
          - ACF spikes at 12 are normal noise
        reasonAnswer: 0
        optionFeedback:
          1: More lag-1 differencing can over-difference without removing the yearly pattern.
          2: A lag-12 spike is the yearly pattern still there.
        reasonFeedback:
          1: Lag-1 differences don't remove a yearly repeat.
          2: A clear lag-12 spike is a signal, not noise.
        explanation: Seasonality calls for a seasonal difference or seasonal terms.
      - prompt: A series that is already stationary is differenced twice. What risk does that bring?
        options: ['Over-differencing creates patterns that weren''t there', 'It makes the series more stationary, which is always good', 'It has no effect']
        answer: 0
        reasons:
          - Extra differencing adds artificial correlation, such as a negative lag-1 spike
          - More differencing always helps
          - Differencing can't change a stationary series
        reasonAnswer: 0
        optionFeedback:
          1: More isn't better; it distorts the series.
          2: It changes the series and its ACF.
        reasonFeedback:
          1: Over-differencing is a known problem.
          2: Each difference changes the values.
        explanation: Difference only as much as needed.

  - id: transfer-leakage
    type: mcq
    skills: [lag-features, chrono-split]
    difficulty: 3
    tags: [application]
    lessonRef: { tab: intuition, id: lag-features }
    prompt: At the start of each week, a hospital forecasts that week's admissions with a regression. Which input is NOT safe to use?
    options:
      - The average daily temperature measured during that week
      - Admissions last week
      - Admissions in the same week last year
      - Whether the week contains a public holiday
    answer: 0
    optionFeedback:
      1: Last week is known at the start of this week.
      2: Last year is known.
      3: Holidays are on the calendar in advance.
    hints: [What is known when the forecast is made?]
    explanation: That week's measured temperature isn't known yet when the forecast is made.
    variants:
      - prompt: Which rolling feature leaks the answer when forecasting this month's sales?
        options:
          - The mean of this month's and the two previous months' sales
          - The mean of the three months before this one
          - Sales twelve months ago
          - The number of selling days this month
        answer: 0
        optionFeedback:
          1: Shifting before rolling keeps it safe.
          2: Last year is known.
          3: The calendar is known in advance.
        explanation: A rolling mean that includes the target month contains the answer.
      - prompt: A model's test MAE suddenly drops to 0.0 after adding a feature. What should you suspect first?
        options:
          - Leakage; the feature contains the answer
          - The model became perfect
          - The test set is too small
          - The metric is broken
        answer: 0
        optionFeedback:
          1: Real forecasts are never perfect.
          2: A small test set wouldn't give exactly 0.
          3: The metric is fine; the input isn't.
        explanation: An error of exactly 0 almost always means leakage.
