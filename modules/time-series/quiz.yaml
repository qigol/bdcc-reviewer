  - id: pq-read-mcq
    type: mcq
    skills: [autocorrelation, arima]
    difficulty: 3
    tags: [math]
    generator: pqQ
    lessonRef: { tab: math-code, id: pacf }
    prompt: |
      A new monthly series (not CO₂) gives the sample ACF and PACF below. Values within about ±0.06 of 0 count as "nothing".
      Which choice does this evidence support?
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 2, rowHeader: lag } }
    hints:
      - 'For each column, ask: does it stop after a lag (then nothing), or fade gradually?'
      - 'PACF stops after lag k → p ≈ k. ACF stops after lag k → q ≈ k. Both fade → start small. ACF barely falls at all → difference first.'
    explanation: |
      The column that **stops** names the model: a PACF that stops after lag k means k past values (p = k); an ACF that
      stops after lag k means k past shocks (q = k). When both fade, start with a small p and q and check the residuals.
      An ACF that stays near 1 for lag after lag is not stationary yet, so difference before reading p and q.

  - id: seasonal-forecast-hand
    type: hand-calc
    skills: [differencing, baselines]
    difficulty: 3
    tags: [math]
    generator: seasonQ
    lessonRef: { tab: math-code, id: differencing }
    prompt: |
      Monthly electricity sales (GWh) of a small utility, January of year 1 to March of year 2. Take the seasonal
      difference $\Delta_{12}\, y_t = y_t - y_{t-12}$, then use it to forecast April of year 2.
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 1, rowHeader: month } }
    steps:
      - prompt: How many seasonal differences can you compute from these 15 months?
        answer: { var: nd }
        hint: The first 12 months have no value one year earlier.
      - prompt: '$\Delta_{12}$ for March of year 2 (2 decimal places)'
        answer: { var: dLast, tol: 0.01 }
        hint: March of year 2 minus March of year 1.
      - prompt: 'Average of all the seasonal differences: the typical yearly growth (2 decimal places)'
        answer: { var: mD, tol: 0.01 }
        hint: 'Compute Δ12 for January and February too, then average the three.'
      - prompt: 'Forecast for April of year 2: April of year 1 plus the average yearly growth (2 decimal places)'
        answer: { var: fc, tol: 0.01 }
        hint: 'A forecast of a change is added back to the value it was measured from: here, April a year earlier.'
    hints:
      - 'A seasonal difference compares each month with the same month a year earlier, so the yearly swing cancels out.'
    explanation: |
      The {=nd} seasonal differences are {=d12List}: steady, so the yearly swing is gone and only the growth is left.
      Their average is {=mD|2}. April of year 1 was {=aprPrev}, so the forecast is {=aprPrev} + {=mD|2} = {=fc|2}.
      Seasonal naive alone ({=aprPrev}) would miss a whole year of growth.

  - id: arima-transfer-hand
    type: hand-calc
    skills: [arima]
    difficulty: 3
    tags: [math]
    generator: arimaTQ
    lessonRef: { tab: math-code, id: arima-forecast }
    prompt: |
      Weekly orders at a bakery: the last two weeks were {=y0} and {=y1}, so the last change was {=dy}. The fitted model is
      {=modelText}. Forecast the next three weeks (2 decimal places each).
    steps:
      - prompt: Forecast change for week 1
        answer: { var: dh1, tol: 0.01 }
        hint: 'Use the lesson''s recipe, c + φ × (last change − c) + θ × ε, and leave out the part this model does not have.'
      - prompt: Forecast value for week 1
        answer: { var: f1, tol: 0.01 }
        hint: Last value + the forecast change.
      - prompt: Forecast value for week 2
        answer: { var: f2, tol: 0.01 }
        hint: 'The "last change" is now the week-1 forecast change, and the next surprise is unknown, so it is 0.'
      - prompt: Forecast value for week 3
        answer: { var: f3, tol: 0.01 }
        hint: Recompute the change from the week-2 change, then add it on.
    hints:
      - 'ARIMA(1,1,0) has φ but no θ; ARIMA(0,1,1) has θ but no φ. Each step: forecast the change first, then add it to the level.'
    explanation: |
      Changes: {=dh1|3}, {=dh2|3}, {=dh3|3}. Values: {=y1} → {=f1|2} → {=f2|2} → {=f3|2}. With an AR part the change
      drifts back toward c step by step; with only an MA part the surprise counts once, and from week 2 the change is just c.

  - id: feature-row-hand
    type: hand-calc
    skills: [lag-features]
    difficulty: 3
    tags: [application]
    generator: featQ
    lessonRef: { tab: intuition, id: lag-features }
    prompt: |
      A shop's monthly sales, January of year 1 to February of year 2. February of year 2 is the month being forecast (its
      real value is shown only to check the forecast later). A fitted regression is
      $\hat y = {=b0} + {=w1}\cdot\text{lag\_1} + {=w12}\cdot\text{lag\_12} + {=w3}\cdot\text{roll\_mean\_3}$. Build the
      inputs for February of year 2 and forecast it.
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0, rowHeader: month } }
    steps:
      - prompt: lag_1
        answer: { var: lag1, tol: 0.01 }
        hint: The month just before February of year 2.
      - prompt: lag_12
        answer: { var: lag12, tol: 0.01 }
        hint: The same month one year earlier.
      - prompt: 'Safe roll_mean_3 (2 decimal places)'
        answer: { var: roll, tol: 0.01 }
        hint: 'Shift first: average the three months **before** February of year 2.'
      - prompt: 'Forecast $\hat y$ (2 decimal places)'
        answer: { var: fc, tol: 0.01 }
        hint: Intercept + each weight × its column.
    hints:
      - 'Every input must be known before February of year 2 starts.'
    explanation: |
      lag_1 = {=lag1}, lag_12 = {=lag12}, roll_mean_3 = {=roll|2} (November, December, January). Forecast
      {=b0} + {=w1}·{=lag1} + {=w12}·{=lag12} + {=w3}·{=roll|2} = {=fc|2}; the real value was {=actual}. The leaky window
      (December to February, {=leaky|2}) would have slipped the answer into the inputs.
