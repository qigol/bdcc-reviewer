templates:
  - id: seasonal-cyclic
    type: match
    skills: [ts-structure]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: name-the-parts }
    prompt: Seasonal or cyclic?
    pairs:
      - ['Ice-cream sales peaking every summer', 'Seasonal: repeats every year, tied to the calendar']
      - ['Traffic dipping every Sunday', 'Seasonal: repeats every week, tied to the calendar']
      - ['A recession every 6 to 10 years', 'Cyclic: economic swings of no fixed length']
      - ['Sunspot activity with cycles of 9 to 14 years', 'Cyclic: solar swings of no fixed length']
    hints:
      - Does the pattern repeat on a fixed calendar length?
    explanation: Seasonal patterns repeat on a fixed, calendar-linked period; cyclic rises and falls have no fixed length.

  - id: structure-mcq
    type: mcq
    skills: [ts-structure]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: be-the-forecaster }
    prompt: A monthly series climbs steadily and repeats the same yearly shape. What should a forecast of the next 12 months use?
    options:
      - Its direction and its yearly shape
      - Its usual level only
      - Its last value only
      - Its direction only
    answer: 0
    optionFeedback:
      1: "A steady climb means the level keeps rising, so its usual level would fall behind."
      2: "The last value ignores both the climb and the yearly shape."
      3: "Direction alone misses the repeating yearly shape."
    hints:
      - Which two patterns does the description mention?
    explanation: 'That is series C in the first scene. The trend gives the direction, seasonality the repeating shape.'

  - id: additive-multi
    type: multi
    skills: [ts-structure]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: decomposition }
    prompt: 'About the idea y_t ≈ T_t + S_t + R_t, which statements are true?'
    options:
      - It is a way of looking at a series, not a theory of how the data were generated
      - Some series combine their parts by multiplying rather than adding
      - A series can have several seasonal patterns at once
      - The trend must be a straight line
      - The remainder is whatever trend and seasonality do not explain
    answer: [0, 1, 2, 4]
    optionFeedback:
      0: "Yes: it's a lens on the series, written with ≈, not a law."
      1: "Yes: some series multiply, with swings that grow with the level."
      2: "Yes: a series can be weekly and yearly at once, for example."
      3: "The trend can curve and change direction."
      4: "Yes: the remainder is what's left over."
    hints:
      - 'Look out for options that say "must".'
    explanation: '"≈, not =". The trend can curve and change direction.'

  - id: lag-numeric
    type: numeric
    skills: [lags]
    difficulty: 1
    tags: [math]
    generator: lagQ
    lessonRef: { tab: math-code, id: lag-notation }
    prompt: 'The table lists a {=freq} series up to time t. What is y at time t − {=k}?'
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0 } }
    answer: { var: value, tol: 0 }
    misconceptions:
      - { var: wrongForward, feedback: 'Count back exactly k rows from t; you are one row short.' }
      - { var: wrongOff, feedback: 'You counted one row too far back.' }
    hints:
      - Start at the row for time t (the last row).
      - Count back exactly k rows.
    explanation: |
      Count {=k} steps back from t: $y_{t-{=k}} = {=value}$.

  - id: lag-units
    type: mcq
    skills: [lags]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: lags }
    prompt: 'The data are quarterly (4 values per year). What is y at time t − 4?'
    options:
      - The same quarter one year ago
      - The value four months ago
      - The value four years ago
      - The average of the last four quarters
    answer: 0
    optionFeedback:
      1: "Lags count steps of the data. Here a step is a quarter, not a month."
      2: "Four steps of quarterly data make one year, not four."
      3: "y at t − 4 is a single past value, not an average."
    hints:
      - k counts steps of the data. What is one step here?
    explanation: |
      k counts steps of the data. Four quarters = one year. For monthly data the same idea is t − 12; for daily data, t − 7 is a week ago.
    variants:
      - prompt: The data are monthly. What is y at time t − 12?
        options:
          - The same month one year ago
          - The value twelve days ago
          - The value twelve years ago
          - The average of the last twelve months
        answer: 0
        optionFeedback:
          1: Lags count steps of the data; here a step is a month.
          2: Twelve monthly steps make one year.
          3: A lag is a single past value, not an average.
        explanation: Twelve monthly steps back is the same month last year.
      - prompt: The data are daily. Which lag gives the same weekday last week?
        options:
          - t − 7
          - t − 1
          - t − 52
          - t − 30
        answer: 0
        optionFeedback:
          1: t − 1 is yesterday.
          2: 52 is weeks in a year, not days.
          3: t − 30 is about a month ago, a different weekday.
        explanation: Seven daily steps back is the same weekday.


  - id: lag-code
    type: code-fill
    skills: [lags, lag-features]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: lag-notation }
    prompt: Add a "same month last year" column to a monthly DataFrame.
    code: |
      features = co2.to_frame(name="co2")
      features["lag_1"] = features["co2"].__BLANK_1__(1)
      features["lag_12"] = features["co2"].shift(__BLANK_2__)
    blanks:
      '1': { accept: ['shift'] }
      '2': { accept: ['12'] }
    hints:
      - Which pandas method moves a column down by k rows?
    explanation: '`shift(k)` moves the column down k rows, so each row holds the value from k months earlier.'

  - id: random-split-mcq
    type: mcq
    skills: [chrono-split]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: order-is-signal }
    prompt: Why is `train_test_split(X, y, shuffle=True)` wrong for a time series?
    options:
      - 'It lets the model learn from later months and be tested on earlier ones'
      - 'It drops some rows, leaving gaps the model cannot handle'
      - 'It rescales the values, so the scores are in the wrong units'
      - 'It keeps too few test months to score the model fairly'
    answer: 0
    optionFeedback:
      1: "Shuffling deletes no rows; it scrambles their order."
      2: "Splitting doesn't rescale anything."
      3: "The test size is set separately; the problem is that order is lost."
    hints:
      - 'After shuffling, which months could end up in training?'
    explanation: |
      Shuffling deletes nothing but destroys the order, and the order is the information. Learn from the past, test on the future.
    variants:
      - prompt: A team forecasts daily electricity demand and uses 5-fold cross-validation with shuffling. What is wrong?
        options:
          - Folds mix future days into training, so the scores are too optimistic
          - 5 folds is too many for daily data
          - Cross-validation drops weekends
          - Shuffling changes the demand values
        answer: 0
        optionFeedback:
          1: The number of folds isn't the issue; the order is.
          2: Nothing is dropped.
          3: Shuffling keeps values, only scrambles order.
        explanation: Use time-ordered splits (train on the past, test on the future).
      - prompt: Which split is honest for forecasting next quarter's sales?
        options:
          - Train on all quarters before the test period, test on the following quarters
          - Randomly pick 20% of quarters for testing
          - Test on the oldest quarters, train on the newest
          - Train and test on the same quarters
        answer: 0
        optionFeedback:
          1: Random picks let the model see the future.
          2: That trains on the future to predict the past.
          3: That measures memory, not forecasting.
        explanation: Learn from the past, test on the future.


  - id: forecast-workflow
    type: order
    skills: [chrono-split, arima]
    difficulty: 1
    tags: [application]
    lessonRef: { tab: intuition, id: arima-assembled }
    prompt: Put the ARIMA workflow in order.
    items:
      - Plot the series and name its patterns
      - Split by date into training and test months
      - Run the ADF test on the training months and difference until it rejects (choose d)
      - Read the ACF and PACF of the differenced series to choose p and q
      - 'Fit ARIMA(p, d, q), forecast the test months and compare with the naive baselines'
      - Check the residuals for patterns the model missed
    hints:
      - Which step needs the differenced series before it can start?
      - 'The lesson looks at the whole series before cutting it; every step that fits or tests uses the training months only.'
    explanation: |
      Plot first to see the patterns; then split, because everything after that is learned from the training months only.
      d comes before p and q because the ACF and PACF are read on the differenced series. The residual check comes last, after there is a fitted model.


  - id: forest-mcq
    type: mcq
    skills: [chrono-split, lag-features]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: order-is-signal }
    prompt: |
      A random forest on CO₂ lag columns scores MAE 0.515 with a random split and 3.174 with a split by date. Its highest
      forecast is 366.06, while the highest training value is 366.68. What explains the gap?
    options:
      - Trees cannot forecast above their highest training value; the random split hid this
      - The split by date had too few test months to score the forest fairly
      - The forest had too few trees, so its forecasts were too noisy
      - The trees overfit the training months and needed to be pruned
    answer: 0
    optionFeedback:
      1: "The date split had plenty of test months; it exposed the forest's ceiling."
      2: "More trees wouldn't let a forest forecast above its training maximum."
      3: "Pruning can't lift the ceiling: trees can only output values they've seen."
    hints:
      - Compare where the test months sat in time under each split.
    explanation: |
      With a shuffled split, every test month had training months on both sides, so the forest only filled gaps. Linear regression has no such ceiling.


  - id: adf-mcq
    type: mcq
    skills: [stationarity]
    difficulty: 2
    tags: [math]
    generator: adfQ
    lessonRef: { tab: math-code, id: adf }
    prompt: |
      ADF test: statistic {=stat}, 5% cut-off (critical value) {=crit}, p-value {=p}. What is the correct conclusion?
    hints:
      - 'The ADF test''s H₀ is "random walk". Is p below 0.05?'
    explanation: |
      Reject H₀ ("random walk") only when p < 0.05, which is the same as the statistic being below the cut-off. A test
      never proves that a series is or is not stationary.

  - id: stationarity-multi
    type: multi
    skills: [stationarity]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: stationary-gallery }
    prompt: Which are the three conditions for a stationary series?
    options:
      - A steady typical level
      - A steady amount of wiggle
      - A steady link with its own past
      - Small wiggles
      - Predictable values
    answer: [0, 1, 2]
    optionFeedback:
      0: "Yes: a steady level is one condition."
      1: "Yes: steady variance is another."
      2: "Yes: a steady autocorrelation is the third."
      3: "Big wiggles are fine if they stay consistent, like sunspots."
      4: "Stationary doesn't mean predictable."
    hints:
      - 'Stationary means "behaves the same throughout", not "small" or "easy to predict".'
    explanation: |
      Stationary means consistent, not flat and not predictable. The sunspot series swings widely and is still stationary.


  - id: gallery-match
    type: match
    skills: [stationarity]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: stationary-gallery }
    prompt: Match each series from the stationarity gallery to the reason for its verdict.
    pairs:
      -   - 'Random walk'
          - 'Not stationary: no level to return to'
      -   - 'Growing wiggle'
          - 'Not stationary: the spread changes over time'
      -   - 'Sunspots'
          - 'Stationary: large but unchanging behaviour'
      -   - 'Nile flow'
          - 'Not stationary: the level shifts part-way'
      -   - 'Monthly CO₂'
          - 'Not stationary: a climb plus a yearly pattern'
    pick: 4
    hints:
      - 'For each series, ask which of level, wiggle size or link to the past changes over time.'
    explanation: 'Each non-stationary series breaks one of the three conditions (level, wiggle, link with its past).'

  - id: diff-numeric
    type: numeric
    skills: [differencing]
    difficulty: 1
    tags: [math]
    generator: diffQ
    lessonRef: { tab: intuition, id: difference-by-hand }
    prompt: 'Annual values: {=valsList}. What is the **last** value of the first-differenced series?'
    answer: { var: dLast, tol: 0.01 }
    misconceptions:
      - { var: wrongRev, feedback: 'Subtract the earlier value from the later one: Δy_t = y_t − y_(t−1).' }
      - { var: last, feedback: 'That is the level, not the change.' }
    hints:
      - The first difference is this value minus the one before it.
      - 'For the last value: last value − second-to-last value.'
    explanation: |
      $\Delta y_t = {=last} - {=prev} = {=dLast|2}$. The {=n} values give {=nd} changes.

  - id: seasonal-diff-numeric
    type: numeric
    skills: [differencing]
    difficulty: 3
    tags: [math]
    generator: diffQ
    lessonRef: { tab: math-code, id: differencing }
    prompt: 'Monthly values (oldest first): {=valsList}. Compute the last value of the **seasonal** difference $\Delta_{12}\, y_t = y_t - y_{t-12}$.'
    answer: { var: dLast, tol: 0.01 }
    misconceptions:
      - { var: wrongRev, feedback: 'Δ12 y_t = y_t − y_(t−12): later minus earlier.' }
      - { var: last, feedback: 'That is the level, not the seasonal change.' }
    hints:
      - A seasonal difference compares with the same month one year (12 steps) earlier.
      - Count back 12 values from the last one and subtract.
    explanation: |
      $y_t - y_{t-12} = {=last} - {=prev} = {=dLast|2}$. With {=n} values, only {=nd} seasonal differences exist.

  - id: diff-code
    type: code-fill
    skills: [differencing]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: differencing }
    prompt: Difference the training series once and drop the empty first value.
    code: |
      train_diff = train.__BLANK_1__().__BLANK_2__()
      print(len(train), "→", len(train_diff))   # 468 → 467
    blanks:
      '1': { accept: ['diff'] }
      '2': { accept: ['dropna'] }
    hints:
      - pandas has a method that subtracts the previous row. The first result is empty.
    explanation: |
      `diff()` computes y_t − y_(t−1). The first row has nothing before it, so it is empty (NaN) and dropped.


  - id: diff-multi
    type: multi
    skills: [differencing]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: difference-by-hand }
    prompt: What are the consequences of first differencing?
    options:
      - You lose one value
      - Every forecast afterwards is a forecast of change
      - The yearly pattern survives and may need a seasonal difference
      - It removes all noise from the series
      - Differencing more than needed is always harmless
    answer: [0, 1, 2]
    optionFeedback:
      0: "Yes: the first value has nothing before it."
      1: "Yes: the model now forecasts changes, which must be added back."
      2: "Yes: a yearly pattern can survive a first difference."
      3: "Differencing changes the question; the noise stays."
      4: "Over-differencing creates patterns that weren't there."
    hints:
      - Two of the options are too good to be true.
    explanation: |
      Differencing changes the question, not the noise. Differencing too much creates patterns that were never there.


  - id: acf-hand
    type: hand-calc
    skills: [autocorrelation]
    difficulty: 2
    tags: [math]
    generator: acfQ
    lessonRef: { tab: math-code, id: acf }
    prompt: |
      Series (in time order): {=yList}. Compute the lag-1 autocorrelation (one overall average, one shared bottom number).
    steps:
      - prompt: |
          Average $\bar y$
        answer: { var: mean, tol: 0.01 }
        hint: Add the values and divide by how many there are.
      - prompt: |
          Bottom number $\sum_t (y_t - \bar y)^2$
        answer: { var: den, tol: 0.01 }
        hint: 'Subtract the average from each value, square, and add.'
      - prompt: |
          Top number $\sum_{t=2}^{n} (y_t - \bar y)(y_{t-1} - \bar y)$
        answer: { var: num1, tol: 0.01 }
        hint: 'Multiply each gap by the gap one step earlier, and add.'
      - prompt: '$r_1$ (2 decimal places)'
        answer: { var: r1, tol: 0.01 }
        misconceptions:
          - { var: wrongPearson, feedback: 'That is the Pearson correlation of the pairs, with separate means and denominators. The ACF uses one overall mean and the full sum of squares.' }
        hint: Top ÷ bottom.
    hints:
      - 'Work out each value''s gap from the average first; you will reuse the gaps.'
    explanation: |
      Average $\bar y = {=mean}$, bottom number {=den}, top number {=num1|3}, so $r_1 = {=r1|3}$.

  - id: acf-pattern-match
    type: match
    skills: [autocorrelation, arima]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: intuition, id: autocorrelation }
    prompt: Match each pattern to what it suggests.
    pairs:
      -   - 'ACF fades very slowly from lags 1, 2, 3 onward'
          - 'Not stationary yet: difference again (raise d)'
      -   - 'PACF stops after lag k, ACF fades'
          - p ≈ k
      -   - 'ACF stops after lag k, PACF fades'
          - q ≈ k
      -   - Both ACF and PACF fade
          - Try a small p and a small q
      -   - 'Tall bars at lags 12, 24, 36 that fade slowly'
          - 'A yearly pattern: seasonal difference or SARIMA'
    pick: 4
    hints:
      - '"Stops" after lag k points to that number of terms; "fades" points to small p and q.'
    explanation: 'These are hints, not rules; real series are mixtures and several choices may fit equally well.'

  - id: pacf-numeric
    type: numeric
    skills: [autocorrelation]
    difficulty: 3
    tags: [math]
    generator: pacfQ
    lessonRef: { tab: math-code, id: pacf }
    prompt: |
      A stationary series has autocorrelations $r_1 = {=r1}$ and $r_2 = {=r2}$. The lag-2 partial autocorrelation (what lag 2
      adds once lag 1 is accounted for) is $\phi_{22} = \frac{r_2 - r_1^2}{1 - r_1^2}$. Compute it (2 decimal places).
    answer: { var: p2, tol: 0.01 }
    misconceptions:
      - {var: wrongR2, feedback: 'r₂ is the full link at lag 2. The PACF removes the part that is passed along through lag 1.'}
      - { var: wrongNoDen, feedback: 'Divide by 1 − r₁².' }
    hints:
      - Square r₁ first.
      - 'Top: r₂ − r₁². Bottom: 1 − r₁².'
    explanation: |
      $\frac{ {=r2} - {=r1}^2}{1 - {=r1}^2} = {=p2|3}$. If a series is built from just its last value, r₂ = r₁², so this is 0:
      the PACF stops after lag 1.

  - id: acf-code
    type: code-fill
    skills: [autocorrelation]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: acf }
    prompt: Complete the ACF at lag k.
    code: |
      def acf(y, lags):
          y = np.asarray(y, dtype=float)
          ybar = y.mean()
          den = np.sum((y - ybar) ** 2)
          out = {}
          for k in lags:
              num = np.sum((y[__BLANK_1__:] - ybar) * (y[:-k] - ybar))
              out[k] = num / __BLANK_2__
          return out
    blanks:
      '1': { accept: ['k'] }
      '2': { accept: ['den'] }
    hints:
      - 'Pair y[k:] with y[:-k], each minus the average.'
    explanation: |
      Pair y_t (from position k on) with y_(t−k), each minus the average, and divide by the shared bottom number.


  - id: snaive-numeric
    type: numeric
    skills: [baselines]
    difficulty: 1
    tags: [math]
    generator: naiveQ
    lessonRef: { tab: math-code, id: baselines }
    prompt: |
      Training ends in December 1997; its last 12 months are shown. What is the **seasonal naive** forecast {=h} month(s) ahead (a {=targetMonth})?
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 1 } }
    answer: { var: sn, tol: 0.001 }
    misconceptions:
      - {var: nv, feedback: 'That is the naive forecast (the last value). Seasonal naive copies the same month from last year.'}
      - {var: wrongShift, feedback: 'Off by one month: look up the same calendar month in last year''s values.'}
    hints:
      - Seasonal naive copies the same calendar month from the last 12 training months.
      - Which month is h months after December? Find that month in the table.
    explanation: |
      Horizon {=h} lands on a {=targetMonth}; copy {=targetMonth} 1997: {=sn}.

  - id: snaive-far-numeric
    type: numeric
    skills: [baselines]
    difficulty: 2
    tags: [math]
    generator: naiveQ
    lessonRef: { tab: math-code, id: baselines }
    prompt: |
      Training ends in December 1997; its last 12 months are shown. What is the **seasonal naive** forecast {=h} months
      ahead (a {=targetMonth}, more than a year away)? Beyond one season, keep repeating last year.
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 1 } }
    answer: { var: sn, tol: 0.001 }
    misconceptions:
      - {var: nv, feedback: 'That is the naive forecast (the last value). Seasonal naive copies the same month from the last training year.'}
      - {var: wrongShift, feedback: 'Off by one month: count h months on from December, and wrap past each year.'}
    hints:
      - Seasonal naive never uses months after December 1997; it repeats the last training year again and again.
      - 'Subtract 12 from h until it is 12 or less: that month of the year is the one to copy.'
    explanation: |
      {=h} months after December 1997 is a {=targetMonth}, {=years} full year(s) beyond the first. Seasonal naive copies
      {=targetMonth} 1997 again: {=sn}.

  - id: baseline-mcq
    type: mcq
    skills: [baselines]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: baselines }
    prompt: 'On CO₂ 1998–2001, naive scores MAE 4.527 and seasonal naive 5.063. Why does the forecast with more information score worse?'
    options:
      - 'It sits at 1997''s average level, below December''s, and nearly every miss has the same sign'
      - 'It copies the yearly shape, and MAE gives extra weight to errors in shape'
      - 'It uses less information than naive, because it ignores the last value'
      - 'Its forecast changes every month, so small misses add up over four years'
    answer: 0
    optionFeedback:
      1: "MAE weighs every miss the same; the problem is the level, not the shape."
      2: "Seasonal naive uses last year's values, so it isn't using less information; it's anchored to an older level."
      3: "Changing month to month isn't the problem. Both miss by roughly the level gap."
    hints:
      - 'Are the forecasts above or below the real values, and does that change from month to month?'
    explanation: |
      Seasonal naive sits below every real month, naive below 47 of 48. With same-sign misses, MAE is about the gap
      between the average real value and the average forecast: seasonal naive averages 363.70, naive sits 0.55 higher at
      364.25. Naive got the level, seasonal naive the shape; neither got both.


  - id: baseline-code
    type: code-fill
    skills: [baselines]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: baselines }
    prompt: Complete the seasonal naive forecast.
    code: |
      SEASON_LENGTH = 12
      last_year = train.iloc[-SEASON_LENGTH:].values
      seasonal_naive = pd.Series(
          [last_year[i __BLANK_1__ SEASON_LENGTH] for i in range(len(test))], index=test.index)
      naive = pd.Series(train.iloc[__BLANK_2__], index=test.index)
    blanks:
      '1': { accept: ['%'] }
      '2': { accept: ['-1', 'len(train)-1'] }
    hints:
      - Which slice of the training data holds last year?
    explanation: |
      Month i of the test period copies month (i mod 12) of the last training year; naive repeats the last training value.


  - id: metrics-hand
    type: hand-calc
    skills: [forecast-metrics]
    difficulty: 1
    tags: [math]
    generator: metricsQ
    lessonRef: { tab: math-code, id: forecast-metrics }
    prompt: Score these forecasts (2 decimal places).
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0 } }
    steps:
      - prompt: MAE
        answer: { var: mae, tol: 0.01 }
        misconceptions:
          - { var: me, feedback: 'Take absolute values before averaging, or positive and negative errors cancel.' }
        hint: 'Average of |real − forecast|.'
      - prompt: RMSE
        answer: { var: rmse, tol: 0.01 }
        misconceptions:
          - { var: mse, feedback: 'That is the MSE; take the square root.' }
        hint: 'Square each miss, average, then square root.'
      - prompt: 'MAPE (in %)'
        answer: { var: mape, tol: 0.01, percent: true }
        misconceptions:
