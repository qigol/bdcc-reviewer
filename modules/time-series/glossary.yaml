terms:
  - id: time-series
    term: Time series
    aka: [series]
    short: Values recorded one after another in time, usually at regular steps like every month. The order itself carries information.
    skills: [ts-structure]
  - id: forecast
    term: Forecast
    aka: [forecasting, forecasts]
    short: A best guess of future values of a time series, made only from what is known up to now.
    skills: [ts-structure]
  - id: trend
    term: Trend
    short: The long-run rise or fall of a series. It need not be a straight line and it can change direction.
    related: [seasonality, remainder]
    skills: [ts-structure]
  - id: seasonality
    term: Seasonality
    aka: [seasonal, season]
    short: A pattern that repeats on a fixed calendar period, such as every year, every week or every day.
    related: [cyclic]
    skills: [ts-structure]
  - id: remainder
    term: Remainder
    short: Whatever is left of the series after the trend and the seasonal pattern are taken out.
    formula: 'R_t = y_t - T_t - S_t'
    skills: [ts-structure]
  - id: cyclic
    term: Cyclic pattern
    aka: [cyclic, cycle, cycles]
    short: Rises and falls that have no fixed length, such as business booms and recessions. Not the same as seasonal.
    related: [seasonality]
    skills: [ts-structure]
  - id: lag
    term: Lag
    aka: [lags]
    short: How many steps back you look. y at t − k is the value k steps earlier; for monthly data, k = 12 is a year.
    formula: 'y_{t-k}'
    skills: [lags]
  - id: training-set
    term: Training set
    aka: [training data, training months, train]
    short: The part of the data a model learns from. For a time series, it must be the earlier part.
    related: [test-set, chronological-split]
    skills: [chrono-split]
  - id: test-set
    term: Test set
    aka: [test months, test data, held-out]
    short: Data hidden from the model while it learns, then used to check its forecasts. For a time series, the later part.
    related: [training-set]
    skills: [chrono-split]
  - id: chronological-split
    term: Chronological split
    aka: [split by date, chronological]
    short: Cutting the data at a date, so the model learns from the past and is tested on the future. Never shuffled.
    skills: [chrono-split]
  - id: random-forest
    term: Random forest
    aka: [forest]
    short: A model that averages the answers of many simple yes/no rule sets (decision trees). It cannot predict beyond the values it has seen.
    skills: [chrono-split]
  - id: stationarity
    term: Stationarity
    aka: [stationary]
    short: The series behaves the same way throughout. Its typical level, its amount of wiggle and its link to its own past stay steady.
    long: Stationary means consistent, not flat. A swinging sunspot series can be stationary; a random walk is not, even when it looks calm.
    skills: [stationarity]
  - id: random-walk
    term: Random walk
    short: Each value is the previous one plus a random jump, so jumps never fade and there is no level to return to.
    formula: 'y_t = y_{t-1} + \varepsilon_t'
    skills: [stationarity]
  - id: null-hypothesis
    term: Null hypothesis (H₀)
    aka: [null hypothesis, 'H₀', H0, hypothesis test]
    short: The default assumption a test starts from, such as "this series wanders like a random walk". A test can reject it, never prove it.
    long: |
      Read H₀ as "H-nought". A hypothesis test asks whether the data are surprising enough to give up this default.
      Not rejecting it is not proof that it is true.
    related: [p-value, adf-test]
    skills: [stationarity]
  - id: p-value
    term: p-value
    aka: [p value]
    short: How surprising the data would be if the null hypothesis were true. Below 0.05 usually means reject it.
    long: |
      If the data would be very unlikely under H₀ (small p-value), we reject H₀. A large p-value does **not** prove H₀; it
      only means the data are not surprising under it.
    related: [null-hypothesis]
    skills: [stationarity]
  - id: adf-test
    term: Augmented Dickey–Fuller (ADF) test
    aka: [ADF test, ADF]
    short: A test whose default assumption (H₀) is "this series wanders like a random walk". A small p-value suggests it is stationary.
    related: [p-value, random-walk]
    skills: [stationarity]
  - id: differencing
    term: Differencing
    aka: [difference, differenced]
    short: Replacing each value with how much it changed since the step before. You lose one value, and you now forecast changes.
    formula: '\Delta y_t = y_t - y_{t-1}'
    skills: [differencing]
  - id: seasonal-difference
    term: Seasonal difference
    short: The change from the same season one period ago, such as this month minus the same month last year.
    formula: '\Delta_{12}\, y_t = y_t - y_{t-12}'
    skills: [differencing]
  - id: correlation
    term: Correlation
    aka: [correlation r]
    short: A number from −1 to +1 for how closely two things move together. +1 means perfectly together, −1 perfectly opposite, 0 no link.
    skills: [autocorrelation]
  - id: autocorrelation
    term: Autocorrelation (ACF)
    aka: [autocorrelation, ACF]
    short: The correlation between a series and a copy of itself shifted k steps back. There is one value for each lag k.
    formula: 'r_k = \frac{\sum_{t>k}(y_t - \bar y)(y_{t-k} - \bar y)}{\sum_t (y_t - \bar y)^2}'
    related: [correlation, pacf]
    skills: [autocorrelation]
  - id: shock
    term: Shock (innovation)
    aka: [shock, shocks, surprise]
    short: The part of a value that nothing in the past could predict; the surprise. Written ε ("epsilon").
    skills: [arima]
  - id: pacf
    term: Partial autocorrelation (PACF)
    aka: [partial autocorrelation, PACF]
    short: How much lag k still adds after the lags in between are accounted for. The direct link, not passed along through other months.
    skills: [autocorrelation]
  - id: naive-forecast
    term: Naive forecast
    aka: [naive]
    short: Every future value is set equal to the last value seen. On a chart it is a flat line.
    formula: '\hat y_{t+h \mid t} = y_t'
    skills: [baselines]
  - id: mae
    term: MAE
    aka: [mean absolute error]
    short: The average size of the forecast misses, ignoring sign, in the series' own units.
    formula: '\frac{1}{n}\sum |y_t - \hat y_t|'
    skills: [forecast-metrics]
  - id: rmse
    term: RMSE
    aka: [root mean squared error]
    short: Square each miss, average, then take the square root. Big misses count more than in MAE.
    formula: '\sqrt{\frac{1}{n}\sum (y_t - \hat y_t)^2}'
    skills: [forecast-metrics]
  - id: mape
    term: MAPE
    aka: [mean absolute percentage error]
    short: The average miss as a percentage of the real value. It has no units, but breaks down when real values are near zero.
    formula: '\frac{100}{n}\sum \left|\frac{y_t - \hat y_t}{y_t}\right|'
    skills: [forecast-metrics]
  - id: seasonal-naive
    term: Seasonal naive forecast
    aka: [seasonal naive]
    short: Each future value copies the value from the same season one period earlier, such as the same month last year.
    formula: '\hat y_{t+h \mid t} = y_{t+h-m(k+1)}, \quad k = \lfloor (h-1)/m \rfloor'
    long: |
      For a horizon h of up to one season (h ≤ m) this is $y_{t+h-m}$, the same month last year. Further ahead it keeps
      repeating the last season: month i of the forecast copies month (i mod 12) of the last training year.
    related: [naive-forecast]
    skills: [baselines]
  - id: arima
    term: ARIMA(p, d, q)
    aka: [ARIMA]
    short: A forecasting model that works on changes (d), using p recent values (AR) and q recent surprises (MA).
    formula: 'w_t - c = \sum_{i=1}^{p}\phi_i\,(w_{t-i} - c) + \varepsilon_t + \sum_{j=1}^{q}\theta_j\,\varepsilon_{t-j}, \quad w_t = \Delta^d y_t'
    long: |
      AR = **autoregressive** (the series regressed on its own past values), I = **integrated** (forecast changes are
      added back up into values), MA = **moving average** of past shocks, which is not the rolling mean of past values.
      In the formula, c is the average change (the drift). The lecture notebook writes c as a plain constant, which would
      forecast 365.71 instead of its own 365.64 for January 1998.
    related: [drift, sarima]
    skills: [arima]
  - id: drift
    term: Drift
    short: The average change per step that a model builds into its forecasts. The CO₂ model estimates 0.1156 ppm per month.
    long: |
      The plain average of the 467 monthly training changes is 0.104. The fitted model estimates the average change
      together with how changes carry over from month to month, so its estimate (0.1156) comes out a little higher.
    skills: [arima]
  - id: residual
    term: Residual
    aka: [residuals]
    short: A model's miss on data it was trained on (real value minus fitted value). Patterns left in residuals mean the model missed something.
    skills: [arima]
  - id: sarima
    term: SARIMA / SARIMAX
    aka: [SARIMA, SARIMAX]
    short: ARIMA plus extra seasonal terms at lag 12 (for monthly data). SARIMAX also allows outside inputs.
    skills: [arima]
  - id: linear-regression
    term: Linear regression
    aka: [regression]
    short: A model that predicts a number by adding up each input column times a learned weight.
    skills: [lag-features]
  - id: lag-feature
    term: Lag feature
    aka: [lag features, lag column]
    short: A column holding the series' own value k steps earlier, made with shift(k), so a regression can use the past.
    related: [lag, linear-regression]
    skills: [lag-features]
  - id: leakage
    term: Leakage
    aka: [leak, leaky, leaks]
    short: Information from the month being predicted, or from the future, sneaking into the inputs. Scores look excellent and mean nothing.
    skills: [lag-features, chrono-split]
  - id: rolling-mean
    term: Rolling mean
    aka: [rolling average, roll_mean_3]
    short: The average of the last few values, recomputed at every step. For forecasting it must use only months before the one predicted.
    formula: '\tfrac13(y_{t-1} + y_{t-2} + y_{t-3})'
    related: [lag-feature, leakage]
    skills: [lag-features]
  - id: month-columns
    term: Month columns
    aka: [month column, one-hot month, month dummies]
    short: Eleven 0/1 input columns that say which calendar month a row is, so a regression can learn a separate effect for each month.
    related: [lag-feature, seasonality]
    skills: [lag-features]
  - id: multi-step-forecast
    term: Multi-step forecast
    aka: [multi-step]
    short: Forecasts made once, from one point in time, for many steps ahead. Later steps cannot use the real values in between.
    related: [one-step-forecast]
    skills: [baselines]
  - id: one-step-forecast
    term: One-step forecast
    aka: [one-step, one step ahead, one-step-ahead]
    short: A forecast of only the next step, made with the real values up to the step before. Much easier than forecasting far ahead.
    related: [multi-step-forecast]
    skills: [lag-features]
