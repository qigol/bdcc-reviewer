terms:
  - id: time-series
    term: Time series
    short: Observations recorded in time order, usually at regular intervals; the order itself carries information.
    lessonRef: { tab: intuition, id: be-the-forecaster }
    skills: [ts-structure]
  - id: trend
    term: Trend
    short: The long-run increase or decrease of a series; need not be a straight line and can change direction.
    related: [seasonality, remainder]
    skills: [ts-structure]
  - id: seasonality
    term: Seasonality
    short: A pattern that repeats on a fixed, known, calendar-linked period, such as month of year or day of week.
    related: [cyclic]
    skills: [ts-structure]
  - id: cyclic
    term: Cyclic pattern
    short: Rises and falls with no fixed length, such as business cycles or sunspot cycles; not seasonal.
    related: [seasonality]
    skills: [ts-structure]
  - id: remainder
    term: Remainder
    short: Whatever is left of the series once trend and seasonality are accounted for.
    formula: 'R_t = y_t - T_t - S_t'
    skills: [ts-structure]
  - id: lag
    term: Lag
    short: How far back in time we look; y_(t−k) is the value k steps of the data earlier (k = 12 is a year for monthly data).
    formula: 'y_{t-k}'
    lessonRef: { tab: intuition, id: lags }
    skills: [lags]
  - id: chronological-split
    term: Chronological split
    short: Train on the past and test on the future, cutting at a date instead of shuffling rows at random.
    lessonRef: { tab: math-code, id: chrono-split }
    skills: [chrono-split]
  - id: stationarity
    term: Stationarity
    short: The series behaves consistently throughout, with a stable level, a stable spread and a stable relationship with its own past.
    long: Stationary means consistent, not flat. A swinging sunspot series can be stationary; a quiet random walk is not.
    lessonRef: { tab: intuition, id: stationary-gallery }
    skills: [stationarity]
  - id: random-walk
    term: Random walk
    short: Each value is the previous value plus a random shock, so shocks persist and there is no level to return to.
    formula: 'y_t = y_{t-1} + \varepsilon_t'
    skills: [stationarity]
  - id: adf-test
    term: Augmented Dickey–Fuller (ADF) test
    short: Tests H₀ "the series has a unit root" (random-walk behaviour); a small p-value is evidence consistent with stationarity.
    lessonRef: { tab: math-code, id: adf }
    skills: [stationarity]
  - id: differencing
    term: Differencing
    short: Replacing each value with its change from the previous period; one observation is lost and the forecast becomes a forecast of change.
    formula: '\Delta y_t = y_t - y_{t-1}'
    lessonRef: { tab: intuition, id: difference-by-hand }
    skills: [differencing]
  - id: seasonal-difference
    term: Seasonal difference
    short: Change from the same season one period earlier; removes a seasonal pattern that survives first differencing.
    formula: '\Delta_{12}\, y_t = y_t - y_{t-12}'
    skills: [differencing]
  - id: autocorrelation
    term: Autocorrelation (ACF)
    short: Correlation between a series and a copy of itself shifted k steps; one value per lag.
    formula: 'r_k = \frac{\sum_{t>k}(y_t - \bar y)(y_{t-k} - \bar y)}{\sum_t (y_t - \bar y)^2}'
    lessonRef: { tab: intuition, id: autocorrelation }
    skills: [autocorrelation]
  - id: pacf
    term: Partial autocorrelation (PACF)
    short: How strongly y_t relates to y_(t−k) after the lags in between are accounted for; the direct resemblance.
    skills: [autocorrelation]
  - id: naive-forecast
    term: Naive forecast
    short: Every future value equals the last observed value; a horizontal line.
    formula: '\hat y_{t+h \mid t} = y_t'
    skills: [baselines]
  - id: seasonal-naive
    term: Seasonal naive forecast
    short: Each future value copies the value from the same season one period earlier.
    formula: '\hat y_{t+h \mid t} = y_{t+h-m}'
    skills: [baselines]
  - id: mae
    term: MAE
    aka: [mean absolute error]
    short: Average size of the forecast errors, in the original units.
    formula: '\frac{1}{n}\sum |y_t - \hat y_t|'
    skills: [forecast-metrics]
  - id: rmse
    term: RMSE
    aka: [root mean squared error]
    short: Square root of the mean squared error; large misses weigh more than in MAE.
    formula: '\sqrt{\frac{1}{n}\sum (y_t - \hat y_t)^2}'
    skills: [forecast-metrics]
  - id: mape
    term: MAPE
    aka: [mean absolute percentage error]
    short: Average absolute error as a percentage of the actual value; unit-free but unstable near zero.
    formula: '\frac{100}{n}\sum \left|\frac{y_t - \hat y_t}{y_t}\right|'
    skills: [forecast-metrics]
  - id: arima
    term: ARIMA(p, d, q)
    short: Differences the series d times, then models the result with p past values (AR) and q past shocks (MA).
    formula: 'w_t = c + \sum_{i=1}^{p}\phi_i w_{t-i} + \varepsilon_t + \sum_{j=1}^{q}\theta_j \varepsilon_{t-j}, \quad w_t = \Delta^d y_t'
    lessonRef: { tab: math-code, id: arima-forecast }
    skills: [arima]
  - id: shock
    term: Shock (innovation)
    short: The part of a period that nothing in the past predicted; the error term ε_t.
    skills: [arima]
  - id: drift
    term: Drift
    short: A steady average change built into the forecast, here about 0.116 ppm per month.
    skills: [arima]
  - id: sarima
    term: SARIMA / SARIMAX
    short: ARIMA plus seasonal AR, differencing and MA terms at lag m, written ARIMA(p,d,q)(P,D,Q)_m; the X adds outside predictors.
    skills: [arima]
  - id: lag-feature
    term: Lag feature
    short: A column holding the series' own value k steps earlier, created with shift(k), so a regression can use the past.
    lessonRef: { tab: intuition, id: lag-features }
    skills: [lag-features]
  - id: leakage
    term: Leakage
    short: Information from the moment being predicted, or from the future, entering the features or training data; scores look excellent and mean nothing.
    skills: [lag-features, chrono-split]
