scenes:
  - id: be-the-forecaster
    title: You are the forecaster
    goal: When you guess the next 12 months of a chart, what are you actually looking at?
    state: { which: A, reveal: hide }
    derive:
      - { fn: forecaster, in: { which: '@which', reveal: '@reveal' }, out: fc }
    stage:
      - id: plot
        widget: Chart
        props: { kind: line, series: '@fc.series', xLabel: month, yLabel: value, title: 'Monthly data, five years, last 12 months hidden' }
      - id: pick
        widget: Choice
        region: side
        props:
          label: series
          options:
            - { value: A, label: A }
            - { value: B, label: B }
            - { value: C, label: C }
        bind: { value: which }
      - id: show
        widget: Choice
        region: side
        hidden: true
        props:
          label: last 12 months
          options:
            - { value: hide, label: hidden }
            - { value: show, label: revealed }
        bind: { value: reveal }
      - id: bins
        widget: DropBins
        region: bottom
        hidden: true
        props:
          chips:
            - { id: a, label: Series A }
            - { id: b, label: Series B }
            - { id: c, label: Series C }
          bins:
            - { id: level, label: 'the typical level' }
            - { id: dir, label: 'the direction' }
            - { id: shape, label: "the direction and last year's shape" }
          solution: { a: level, b: dir, c: shape }
    beats:
      - say: |
          A **time series** is a list of values recorded one after another in time, like monthly sales or daily rainfall.
          Guessing its future values is making a **forecast**. The chart shows five years of monthly data with the last 12
          months hidden (slide 7).
        define: [time-series, forecast]
      - say: Picture in your head what comes next, then name what you used to guess.
        gate:
          type: predict
          question: 'Series A: what is the most useful thing to carry forward?'
          options: ['Its typical level', 'Its direction', 'Last year''s up-and-down shape', 'Nothing: it cannot be guessed']
          answer: 0
          explain: A wobbles around the same height, with no climb and no repeating shape. The best guess is that usual height.
      - say: Look at series B.
        gate:
          type: when
          prompt: Switch to **B**.
          when: 'which == ''B'''
      - say: B behaves differently.
        gate:
          type: predict
          question: 'Series B: what did you use?'
          options: ['The typical level only', 'The direction it is heading', 'Last year''s shape', 'The first value']
          answer: 1
          explain: B climbs steadily. A flat line at its average would be far too low, so you continue the climb.
      - say: Now series C.
        gate:
          type: when
          prompt: Switch to **C**.
          when: 'which == ''C'''
      - say: Sort all three by what you used.
        show: [bins]
        gate:
          type: event
          prompt: Match each series to what you used.
          target: bins
          event: solved
      - say: |
          **Nobody used a formula. Everybody used patterns.** By eye you used the usual level, the direction, and a shape
          that repeats. Every method in this module does the same thing, just with arithmetic.
        show: [show]
        set: { reveal: show }
    takeaway: Guessing by eye already uses patterns in the past (level, direction, repeating shape). Every forecasting method writes those down as arithmetic.

  - id: name-the-parts
    title: Trend, season, remainder
    goal: What pieces is a series made of, and how do they fit together?
    skills: [ts-structure]
    state: { slope: 0.5, amp: 5 }
    derive:
      - { fn: decompose, in: { slope: '@slope', amp: '@amp' }, out: dc }
    stage:
      - id: plot
        widget: Chart
        props: { kind: line, series: '@dc.series', xLabel: month, title: 'y = T + S + R (made-up data)' }
      - id: rem
        widget: Chart
        region: bottom
        props: { kind: line, series: '@dc.parts', xLabel: month, title: Remainder }
      - id: f
        widget: Formula
        region: side
        props: { tex: '\anchor{y}{y_t} \approx \anchor{t}{T_t} + \anchor{s}{S_t} + \anchor{r}{R_t}', size: lg }
      - id: sl
        widget: Slider
        region: side
        props: { label: 'trend slope per month', min: -0.5, max: 1, step: 0.05, format: 2 }
        bind: { value: slope }
      - id: am
        widget: Slider
        region: side
        props: { label: size of the yearly swing, min: 0, max: 10, step: 0.5, format: 1 }
        bind: { value: amp }
      - id: bins
        widget: DropBins
        region: bottom
        hidden: true
        props:
          chips:
            - { id: e1, label: Electricity demand by hour of day }
            - { id: e2, label: 'Business cycles (booms and recessions)' }
            - { id: e3, label: 'Sunspot activity (cycles of roughly 9–14 years)' }
            - { id: e4, label: Retail sales spiking every December }
            - { id: e5, label: Weekend dips in daily train ridership }
            - { id: e6, label: 'El Niño episodes every 2–7 years' }
          bins:
            - { id: seasonal, label: 'Seasonal (fixed, calendar-linked)' }
            - { id: cyclic, label: 'Cyclic (no fixed length)' }
          solution: { e1: seasonal, e2: cyclic, e3: cyclic, e4: seasonal, e5: seasonal, e6: cyclic }
    beats:
      - say: |
          Slide 13 splits a series into three pieces. $y_t$ ("y at time t") is the value we see. The first piece is the
          **trend**, $T_t$: the long-run direction, up or down.
        define: [trend]
        do:
          - { target: f, cmd: highlight, args: { sel: 'term:t', tone: accent } }
      - say: |
          The second piece is **seasonality**, $S_t$: a shape that repeats on a fixed calendar period, like higher sales every
          December. The third piece is the **remainder**, $R_t$: whatever is left over, the random wiggle.
        define: [seasonality, remainder]
        do:
          - { target: f, cmd: highlight, args: { sel: 'term:s', tone: accent } }
      - say: The trend need not be a straight line, and it can change direction. Move the sliders.
        gate:
          type: when
          prompt: Make a series with a clear yearly swing but **no trend**.
          when: 'abs(slope) < 0.06 and amp >= 3'
          hint: Set the slope to 0 and the swing size up.
      - say: Now remove the yearly swing too.
        gate:
          type: predict
          question: 'With slope 0 and swing size 0, what is left of y?'
          options: ['Only the remainder around a flat level', 'Nothing', 'A straight line', 'A smooth wave']
          answer: 0
          explain: Without trend and season, y is just its usual level plus the remainder.
      - say: |
          Note the "≈" (roughly equal), not "=". This is a way of looking at data, not a law. Some series **multiply** their
          pieces (the swings grow as the level grows), some have **several** repeating patterns, some have none.
      - say: |
          One more thing to tell apart. Seasonal patterns have a **fixed** length tied to the calendar. A **cyclic pattern** also rises
          and falls, but with **no fixed length**, like business booms and recessions.
        define: [cyclic]
        show: [bins]
        gate:
          type: event
          prompt: Sort each pattern.
          target: bins
          event: solved
    takeaway: 'y_t ≈ T_t + S_t + R_t: long-run direction, a repeating calendar shape, and the rest. Patterns without a fixed length are cyclic, not seasonal.'

  - id: lags
    title: Lags
    goal: What does "y at time t − k" mean, and which k matters for monthly data?
    skills: [lags]
    data: [co2, lagrows]
    state: { k: 1 }
    derive:
      - { fn: lagView, in: { co2: '@co2', k: '@k' }, out: lv }
      - { fn: tableMatrix, in: { table: '@lagrows' }, out: lm }
    stage:
      - id: plot
        widget: Chart
        props: { kind: line, series: '@lv.series', xLabel: year, yLabel: 'CO₂ (ppm)', title: 'A lag is the same series, slid to the right' }
      - id: tbl
        widget: Matrix
        region: side
        props: { data: '@lm', format: 1, title: 'Slide 16', rowHeader: month }
      - id: ks
        widget: Slider
        region: side
        hidden: true
        props: { label: 'lag k (months)', min: 1, max: 24, step: 1 }
        bind: { value: k }
    beats:
      - say: |
          Our main data: CO₂ in the air (in ppm, parts per million), measured monthly at Mauna Loa. From now on the small
          number under y means **when**. $y_t$ is the value now, $y_{t-1}$ one step earlier, $y_{t-k}$ k steps earlier.
          k is the **lag**.
        define: [lag]
        gate:
          type: predict
          question: 'Slide 16: t = June 1999, monthly data. What is y at t − 1?'
          answer: { value: 370.8, tol: 0.05 }
          explain: 'One month earlier, May 1999, which was 370.8.'
      - say: The same table has a lag-12 column.
        gate:
          type: predict
          question: 'For April 1999, what is y at t − 12?'
          answer: { value: 368.5, tol: 0.05 }
          explain: 'Twelve months back: the same month one year ago, April 1998 = 368.5.'
      - say: Slide the whole series k months to the right and lay it over itself.
        show: [ks]
        gate:
          type: when
          prompt: Find the lag at which the yearly peaks line up again.
          when: 'k == 12'
          hint: How many months are in a year?
      - say: |
          At k = 12 the shifted copy has the right yearly **shape**, but sits lower because it misses a year of growth. Lag 1
          has the right **height**. Together they give both.
      - say: k always counts steps of the data, whatever a step is.
        gate:
          type: predict
          question: 'If the data were quarterly (4 per year), which lag is "the same quarter last year"?'
          answer: { value: 4 }
          explain: 'Four quarters in a year. For daily data, k = 7 is the same weekday last week.'
      - say: Practise reading lags off a table.
        gate:
          type: practice
          template: lag-numeric
    takeaway: 'Lag k means k steps back in the data''s own steps. Monthly: t − 1 is last month, t − 12 the same month last year.'

  - id: order-is-signal
    title: Order is the signal
    goal: What do you lose if you shuffle the rows of a time series?
    skills: [chrono-split]
    data: [co2, notebook]
    state: { mode: ordered }
    derive:
      - { fn: shuffleOrder, in: { co2: '@co2', mode: '@mode' }, out: so }
      - { fn: chronoSplit, in: { co2: '@co2' }, out: cs }
    stage:
      - id: plot
        widget: Chart
        props: { kind: line, series: '@so.series', xLabel: year, yLabel: ppm, title: 'Monthly CO₂, 1995–2001' }
      - id: pick
        widget: Choice
        region: side
        props:
          label: rows
          options:
            - { value: ordered, label: in time order }
            - { value: shuffled, label: shuffled }
        bind: { value: mode }
      - id: stats
        widget: Readout
        region: side
        props:
          items:
            - { label: values, value: '@so.n' }
            - { label: mean, value: '@so.mean', format: 3 }
            - { label: max, value: '@so.max', format: 2 }
      - id: rf
        widget: Callout
        hidden: true
        props: { kind: warn, title: 'Session 12: a random forest, two ways of splitting', body: 'Shuffled split: average miss (MAE) **0.515**. Split by date: **3.174**, nearly 3× worse than just repeating the last value. A forest can only predict averages of values it has seen, so it can never go above **366.68**, the highest training value; 38 of the 48 test months are above it.' }
    beats:
      - say: |
          Shuffle the rows of a customer list and nothing is lost: customer 400 was never "after" customer 399. Now shuffle
          a time series.
        gate:
          type: when
          prompt: Shuffle the rows.
          when: 'mode == ''shuffled'''
      - say: Every pattern is gone. Look at the side panel.
        gate:
          type: predict
          question: How many values did the shuffle delete?
          answer: { value: 0 }
          explain: Same 84 numbers, same average, same maximum. Only the order changed, and the order was the information.
      - say: |
          To check a forecast, we hide some data. The model learns from the **training set** and is graded on the **test set**.
          For a time series, use a **chronological split**: cut at a date. The past trains, the future tests.
        define: [training-set, test-set, chronological-split]
      - say: |
          A random split lets the model learn from next year to "predict" last year. Session 12 tried both splits on a
          **random forest**, a model made of many decision trees averaged together, with the same inputs.
        define: [random-forest]
        show: [rf]
        gate:
          type: predict
          question: Which test score is the honest one?
          options: ['The split by date, 3.174', 'The shuffled split, 0.515', 'Both equally', 'Neither']
          answer: 0
          explain: 'With a shuffled split, each test month had training months on both sides, so the forest only had to fill gaps, not look ahead.'
      - say: |
          The notebooks cut at a date: **{=cs.train}** training months (1959–1997) and **{=cs.test}** test months (1998–2001).
        set: { mode: ordered }
      - say: Put the danger in your own words.
        gate:
          type: reflect
          prompt: Why can a shuffled split make a forecasting model look much better than it really is?
          model: |
            After shuffling, the training set holds months from before and after each test month. The model can simply
            fill the gap between neighbours it has already seen. In real use the future is never known, so the honest test
            is to train only on the past and test on later months.
    takeaway: In a time series the order is the information. Shuffling deletes nothing and destroys everything, so always split by date.

  - id: stationary-gallery
    title: Stationary does not mean flat
    goal: Does this series behave the same way from start to finish?
    skills: [stationarity]
    data: [co2, adf]
    state: { which: noise }
    derive:
      - { fn: gallery, in: { co2: '@co2', which: '@which' }, out: g }
      - { fn: adfView, in: { adf: '@adf' }, out: av }
    stage:
      - id: plot
        widget: Chart
        props: { kind: line, series: '@g.series', title: 'One panel of slide 18''s gallery (made-up, except CO₂)' }
      - id: pick
        widget: Choice
        region: side
        props:
          label: series
          style: dropdown
          options:
            - { value: noise, label: random wiggle }
            - { value: cycles, label: 'sunspot-like cycles' }
            - { value: co2, label: 'CO₂, monthly' }
            - { value: walk, label: random walk }
            - { value: shift, label: 'Nile-like jump in level' }
            - { value: volatility, label: growing wiggle }
        bind: { value: which }
      - id: halves
        widget: Readout
        region: side
        props:
          items:
            - { label: 'average, 1st half', value: '@g.mean1', format: 2 }
            - { label: 'average, 2nd half', value: '@g.mean2', format: 2 }
            - { label: 'spread, 1st half', value: '@g.sd1', format: 2 }
            - { label: 'spread, 2nd half', value: '@g.sd2', format: 2 }
      - id: bins
        widget: DropBins
        region: bottom
        hidden: true
        props:
          chips:
            - { id: noise, label: random wiggle }
            - { id: cycles, label: sunspot-like cycles }
            - { id: co2, label: 'CO₂, monthly' }
            - { id: walk, label: random walk }
            - { id: shift, label: jump in level }
            - { id: vol, label: growing wiggle }
          bins:
            - { id: yes, label: stationary }
            - { id: no, label: not stationary }
          solution: { noise: yes, cycles: yes, co2: no, walk: no, shift: no, vol: no }
      - id: adf-t
        widget: Matrix
        hidden: true
        props: { data: '@av.table', format: 4, title: 'Session 11: ADF on the CO₂ training months', rowHeader: run }
    beats:
      - say: |
          Many forecasting methods assume a series has **stationarity**: across its whole length, its usual level stays the
          same, the size of its wiggle stays the same, and the way it relates to its own past stays the same.
          Stationary means **consistent**, not flat.
        define: [stationarity]
      - say: Look at the sunspot-like cycles.
        gate:
          type: predict
          question: 'They swing from about 0 to 150. Stationary?'
          options: ['Yes: they keep coming back to the same level with similar swings', 'No: they swing too much', 'No: they have a season', 'Only the first half']
          answer: 0
          explain: Big swings are fine if the behaviour stays the same. And because the cycles have no fixed length, they are not seasonal either.
      - say: Compare the two halves of each series in the side panel.
        show: [bins]
        gate:
          type: event
          prompt: Sort all six panels.
          target: bins
          event: solved
      - say: |
          The **random walk** hardly moves, yet it is **not** stationary. Each value is the last one plus a random jump, so it
          drifts with no level to return to. Judging by eye does not scale, so Session 11 uses a test.
        define: [random-walk]
        show: [adf-t]
      - say: |
          A test starts from a default assumption, called H₀. The **p-value** says how surprising the data would be if H₀
          were true; below 0.05 we reject H₀. The **ADF test**'s H₀ is "this series wanders like a random walk".
        define: [p-value, adf-test]
      - say: 'On the CO₂ level the ADF test gives p = 0.9989 (its statistic +2.287 is also above the 5% cut-off of −2.868).'
        gate:
          type: predict
          question: What do we conclude?
          options: ['We cannot reject H₀: no evidence it is anything but a random walk', 'Reject H₀: the series is stationary', 'The series is proven to be non-stationary', 'The test is invalid']
          answer: 0
          explain: 'p is nowhere near 0.05. Not rejecting is not proof; it just means the data are not surprising under H₀.'
    takeaway: Stationary means the level, the wiggle and the link to the past stay steady. Big swings can be stationary; a random walk is not.

  - id: difference-by-hand
    title: Differencing, by hand
    goal: How do we turn a climbing series into one that behaves the same throughout?
    skills: [differencing, stationarity]
    data: [annual, co2]
    state: { diffUpTo: 0 }
    derive:
      - { fn: annualDiff, in: { annual: '@annual', upTo: '@diffUpTo' }, out: ad }
      - { fn: trainDiff, in: { co2: '@co2' }, out: td }
    stage:
      - id: sheet
        widget: Matrix
        props: { rows: '@ad.rows', cols: '@ad.cols', values: '@ad.values', format: 1, title: 'Slide 19: yearly average CO₂ at Mauna Loa (ppm)', rowHeader: year }
      - id: player
        widget: StepPlayer
        region: bottom
        hidden: true
        props:
          fn: diffWalk
          in: { annual: '@annual' }
          roles: { sheet: sheet }
          speed: 0.7
      - id: f
        widget: Formula
        region: side
        props:
          steps:
            - '\Delta y_t = y_t - y_{t-1}'
            - '\Delta_{12}\, y_t = y_t - y_{t-12}'
          step: 0
      - id: monthly
        widget: Chart
        hidden: true
        props: { kind: line, series: '@td.series', xLabel: year, yLabel: 'Δy (ppm)', title: 'Monthly changes, 1959–1997: centred, but still a yearly wiggle' }
    beats:
      - say: |
          Yearly CO₂ climbs every year, so it is not stationary. The fix is **differencing**: next to each value, write how
          much it **changed** since the year before. The symbol Δ ("delta") means "change".
        define: [differencing]
        gate:
          type: predict
          question: 'Change from 1959 (316.0) to 1960 (316.9)?'
          answer: { value: 0.9, tol: 0.01 }
          explain: '316.9 − 316.0 = +0.9 ppm.'
      - say: Fill in the rest.
        show: [player]
        gate:
          type: event
          prompt: Play the differences.
          target: player
          event: done
      - say: The left column climbs forever. The right column stays around one steady value.
        set: { diffUpTo: 5 }
        gate:
          type: predict
          question: What is the average yearly change?
          answer: { value: 0.7, tol: 0.01 }
          explain: '(0.9 + 0.7 + 0.8 + 0.5 + 0.6) ÷ 5 = 3.5 ÷ 5 = 0.7 ppm per year.'
      - say: Notice what it cost.
        gate:
          type: predict
          question: 'Six values went in. How many changes came out?'
          answer: { value: 5 }
          explain: 1959 has no year before it. You lose one value and never get it back.
      - say: Why does this matter for forecasting?
        gate:
          type: reflect
          prompt: After differencing, what are you forecasting, and what must you do to get back to real CO₂ values?
          model: |
            You are now forecasting the change from one step to the next, not the value itself. To get a real forecast you
            add each predicted change to the last known value, step by step.
      - say: Here are the monthly training values, differenced once (467 changes, average 0.104 ppm).
        show: [monthly]
        do:
          - { target: f, cmd: step, args: { n: 1 } }
      - say: |
          It is centred and steady, but the **yearly wiggle survives**: one difference removes the trend, not the season.
          For that you take a **seasonal difference**: this month minus the same month last year, $\Delta_{12}$.
        define: [seasonal-difference]
      - say: The ADF test on the differenced series gives p = 0.0006.
        gate:
          type: predict
          question: 'ADF on the changes: p = 0.0006. What next?'
          options: ['Reject H₀: one difference was enough, so stop', 'Difference again', 'We cannot reject H₀', 'Go back to the original values']
          answer: 0
          explain: 'p is far below 0.05, so reject H₀. Do not difference again: differencing too much creates patterns that were never there.'
      - say: Difference a short series yourself.
        gate:
          type: practice
          template: diff-numeric
    takeaway: Differencing turns values into changes. It costs one value, changes the question, and leaves the yearly pattern for a seasonal difference.

  - id: autocorrelation
    title: A series against its own past
    goal: How much does this month look like the months before it?
    skills: [autocorrelation]
    data: [nino, co2]
    state: { k: 1 }
    derive:
      - { fn: lagScatter, in: { y: '@nino', k: '@k' }, out: sc }
      - { fn: acfDiff, in: { co2: '@co2', nlags: 24 }, out: ac }
      - { fn: arMaAcf, in: { phi: 0.8, theta: 0.8 }, out: am }
    stage:
      - id: scatter
        widget: Chart
        props: { kind: scatter, series: '@sc.series', xLabel: 'y_(t−k)', yLabel: 'y_t', title: 'Monthly sea temperature, Niño 1+2, 1990–2010 (°C)' }
      - id: r
        widget: Readout
        region: side
        props:
          items:
            - { label: 'lag k', value: '@k' }
            - { label: 'correlation r', value: '@sc.r', format: 2, tone: accent }
      - id: ks
        widget: Slider
        region: side
        props: { label: 'lag k (months)', min: 1, max: 24, step: 1 }
        bind: { value: k }
      - id: acfbars
        widget: Chart
        hidden: true
        props: { kind: bar, series: '@ac.bars', xLabel: lag, yLabel: r_k, title: 'ACF of the differenced CO₂ training series' }
      - id: sig
        widget: Chart
        region: bottom
        hidden: true
        props: { kind: bar, series: '@am.bars', xLabel: lag, title: 'Built from past values (AR) vs past surprises (MA)' }
    beats:
      - say: |
          **Correlation** is a number from −1 to +1 for how closely two things move together. +1: they rise and fall
          together. −1: when one rises, the other falls. 0: no link.
        define: [correlation]
      - say: |
          **Autocorrelation** compares one series with a shifted copy of **itself**. Each dot is one month, placed against the
          same series k months earlier. Data: monthly sea temperature off Peru and Ecuador.
        define: [autocorrelation]
        gate:
          type: predict
          question: 'Lag 1: this month vs last month. Roughly what correlation?'
          options: ['+0.87', '0', '−0.66', '+0.10']
          answer: 0
          explain: 'Sea temperature changes slowly, so back-to-back months are very similar: r = +0.87 (slide 24).'
      - say: Half a year apart, warm months face cool ones.
        gate:
          type: when
          prompt: Find a lag where the correlation is below **−0.6**.
          when: 'sc.r < -0.6'
          hint: Half a year.
      - say: 'Lag 6 gives r = −0.66. Now try a full year.'
        gate:
          type: predict
          question: 'Lag 12: same month last year. r?'
          answer: { value: 0.75, tol: 0.02 }
          explain: '+0.75. The yearly cycle brings the pattern back.'
      - say: |
          The **ACF** puts all of these in one chart: one bar per lag. Here it is for the CO₂ changes from the last scene.
        show: [acfbars]
        gate:
          type: predict
          question: 'Which lag has the tallest bar?'
          options: ['12', '1', '6', '24']
          answer: 0
          explain: 'r at lag 12 is 0.916 (lag 1 is 0.708). The yearly cycle survives differencing; lag 24 is almost as tall.'
      - say: |
          Part of every value is a **shock**: a surprise nothing in the past could predict. A series built from past
          **values** has an ACF that fades slowly. One built from past **shocks** has an ACF that stops suddenly (beyond the slides).
        define: [shock]
        show: [sig]
      - say: |
          The **PACF** (partial autocorrelation) asks what lag k adds **directly**, once the months in between are accounted
          for. Its shape, next to the ACF's, will help us set up a forecasting model two scenes from now.
        define: [pacf]
    takeaway: Autocorrelation correlates a series with its own shifted copy. How it fades or stops across lags hints at how to build a model.

  - id: baselines
    title: The bar to beat
    goal: What must any forecasting model beat before it is worth using?
    skills: [baselines, forecast-metrics, chrono-split]
    data: [co2, arima]
    state: { method: naive, maeUpTo: 0 }
    derive:
      - { fn: baselineCompare, in: { co2: '@co2', arima: '@arima', method: '@method' }, out: bc }
      - { fn: maeSheet, in: { co2: '@co2', method: naive, upTo: '@maeUpTo' }, out: ms }
    stage:
      - id: plot
        widget: Chart
        props: { kind: line, series: '@bc.series', xLabel: year, yLabel: 'CO₂ (ppm)', title: 'Forecasting 1998–2001 from December 1997' }
      - id: pick
        widget: Choice
        region: side
        props:
          label: forecast
          options:
            - { value: naive, label: naive }
            - { value: seasonal, label: seasonal naive }
            - { value: arima, label: 'ARIMA(1,1,1)' }
        bind: { value: method }
      - id: score
        widget: Readout
        region: side
        props:
          items:
            - { label: MAE, value: '@bc.mae', format: 3, tone: accent }
            - { label: RMSE, value: '@bc.rmse', format: 3 }
            - { label: 'MAPE %', value: '@bc.mape', format: 3 }
      - id: sheet
        widget: Matrix
        hidden: true
        props: { rows: '@ms.rows', cols: '@ms.cols', values: '@ms.values', format: 3, title: 'Naive forecast, month by month', rowHeader: month }
      - id: player
        widget: StepPlayer
        region: bottom
        hidden: true
        props:
          fn: maeWalk
          in: { co2: '@co2', method: naive }
          roles: { sheet: sheet }
          speed: 4
    beats:
      - say: |
          Train on 1959–1997, hide 1998–2001. The simplest forecast is the **naive forecast**: "whatever the latest value is,
          use it for every future month".
        define: [naive-forecast]
        gate:
          type: predict
          question: 'December 1997 was 364.25. What is the naive forecast for March 2000?'
          answer: { value: 364.25, tol: 0.001 }
          explain: The same 364.25 for every future month, a flat line.
      - say: |
          How good is it? **MAE** is the average size of the misses: for each hidden month take |real − forecast|, then
          average. Work through all 48 months.
        define: [mae]
        show: [sheet, player]
        gate:
          type: event
          prompt: Play all 48 months.
          target: player
          event: done
      - say: |
          MAE = 217.30 ÷ 48 = 4.527 ppm. Two other scores: **RMSE** squares each miss first, so big misses count more (5.103).
          **MAPE** turns each miss into a percentage of the real value (1.224%).
        define: [rmse, mape]
        set: { maeUpTo: 48 }
      - say: The **seasonal naive forecast** copies the same month from 1997 instead.
        define: [seasonal-naive]
        gate:
          type: when
          prompt: Switch to **seasonal naive**.
          when: 'method == ''seasonal'''
      - say: It uses more information. Look at its score.
        gate:
          type: predict
          question: 'Seasonal naive MAE is 5.063, worse than naive. Why?'
          options: ['It has the right shape but forgets that every year sits higher than 1997', 'It uses less information', 'Its forecasts are random', 'MAE cannot score seasonal forecasts']
          answer: 0
          explain: 'Every bump is in the right month, but about 2 ppm too low and sinking further each year. Naive got the level, seasonal naive the shape; neither got both.'
      - say: |
          Now a real model: **ARIMA**, a classic method that forecasts from recent values, recent changes and recent
          surprises. The next scene opens it up.
        define: [arima]
        gate:
          type: when
          prompt: Switch to **ARIMA(1,1,1)**.
          when: 'method == ''arima'''
      - say: |
          MAE 1.900, MAPE 0.517%: less than half the naive error. It climbs at the right rate but is smooth, because it has no
          yearly term. Beating naive does not make a model great; it only makes it worth a closer look.
      - say: Try a seasonal naive forecast yourself.
        gate:
          type: practice
          template: snaive-numeric
    takeaway: Naive and seasonal naive set the bar. Score every forecast on the same hidden months with MAE, RMSE and MAPE.

  - id: arima-assembled
    title: ARIMA, assembled
    goal: Where do ARIMA's three numbers come from, and how does it make a forecast?
    skills: [arima, autocorrelation, differencing]
    data: [co2, arima]
    state: { arUpTo: 0 }
    derive:
      - { fn: arimaScene, in: { co2: '@co2', arima: '@arima', upTo: '@arUpTo' }, out: ar }
    stage:
      - id: f
        widget: Formula
        props:
          steps:
            - '\Delta y_t - c = \anchor{ar}{\phi\,(\Delta y_{t-1} - c)} + \varepsilon_t + \anchor{ma}{\theta\,\varepsilon_{t-1}}'
            - '\Delta y_t - 0.1156 = \anchor{ar}{0.5744\,(\Delta y_{t-1} - 0.1156)} + \varepsilon_t + \anchor{ma}{0.3733\,\varepsilon_{t-1}}'
          step: 0
      - id: fc
        widget: Matrix
        region: side
        props: { data: '@ar.table', format: 2, title: First three forecasts, rowHeader: month }
      - id: plot
        widget: Chart
        props: { kind: line, series: '@ar.series', xLabel: year, yLabel: 'CO₂ (ppm)', title: 'Four years forecast without seeing the answer' }
      - id: player
        widget: StepPlayer
        region: bottom
        hidden: true
        props:
          fn: arimaWalk
          in: { co2: '@co2', arima: '@arima' }
          roles: { fc: fc }
          speed: 0.4
      - id: letters
        widget: DropBins
        region: bottom
        hidden: true
        props:
          chips:
            - { id: d, label: 'd = 1' }
            - { id: p, label: 'p = 1' }
            - { id: q, label: 'q = 1' }
          bins:
            - { id: adf, label: 'the ADF test on the values and on the changes' }
            - { id: pacf, label: 'the PACF / ACF (past values)' }
            - { id: acf, label: 'the ACF / PACF (past surprises)' }
          solution: { d: adf, p: pacf, q: acf }
      - id: errata
        widget: Callout
        region: side
        hidden: true
        props: { kind: errata, body: 'Session 11 writes 0.1156 as the equation''s constant. In statsmodels it is the **average** change, so the constant is 0.1156 × (1 − 0.5744) = 0.049. Read literally, the notebook''s equation would forecast 365.71, not its own 365.64.' }
    beats:
      - say: |
          How would you guess next month by hand? Work with **changes**, not levels, if the series keeps climbing: that is d,
          the number of differences. Follow the last few changes: p of them (AR). Correct for your last few surprises:
          q of them (MA). [[arima|ARIMA(1,1,1)]] uses one of each.
      - say: |
          Each number has its evidence. d comes from the ADF test. For p and q, read the ACF and PACF: a PACF that stops after
          lag k suggests p = k; an ACF that stops after lag k suggests q = k. If both fade slowly, try small p and q.
        show: [letters]
        gate:
          type: event
          prompt: Match each number to its evidence.
          target: letters
          event: solved
      - say: |
          Fitted on the training years: the **drift** c = 0.1156 (the average monthly change), φ ("phi") = 0.5744 and θ
          ("theta") = 0.3733. The last training change was 364.25 − 362.38 = 1.87 and the last surprise 0.725.
        define: [drift]
        show: [errata]
        do:
          - { target: f, cmd: step, args: { n: 1 } }
          - { target: f, cmd: highlight, args: { sel: 'term:ar', tone: accent } }
        gate:
          type: predict
          question: 'Forecast for January 1998: 364.25 + 0.1156 + 0.5744 × (1.87 − 0.1156) + 0.3733 × 0.725 = ?'
          answer: { value: 365.64, tol: 0.02 }
          explain: '0.1156 + 1.0077 + 0.2706 = 1.394, so 364.25 + 1.394 = 365.64.'
      - say: Step forward. After the first month the next surprise is unknown, so it is set to 0 and the MA part drops out.
        show: [player]
        gate:
          type: event
          prompt: Play the three forecasts.
          target: player
          event: done
      - say: Your turn on new numbers.
        gate:
          type: practice
          template: arima-numeric
      - say: |
          For four years the forecast climbs at almost exactly the real rate, but it is smooth while the real series wiggles.
          Check the **residuals**, the model's misses on its training data: their ACF spikes at lag 12 (about 0.58).
        define: [residual]
        set: { arUpTo: 3 }
        gate:
          type: predict
          question: What does the lag-12 spike in the residuals call for?
          options: ['Yearly (seasonal) terms in the model', 'More differencing', 'A larger p', 'Nothing: residuals always spike']
          answer: 0
          explain: 'The model makes the same kind of mistake every January. ARIMA has no yearly part, so we add one.'
      - say: |
          **SARIMA** is ARIMA with extra terms at lag 12, written ARIMA(p,d,q)(P,D,Q)₁₂. SARIMAX also lets outside inputs in,
          such as temperature.
        define: [sarima]
    takeaway: d comes from the ADF test; p and q from the ACF and PACF. ARIMA forecasts each change from the last change and surprise.

  - id: lag-features
    title: A series becomes a table
    goal: How can an ordinary prediction model forecast a time series, and how can it cheat?
    skills: [lag-features, chrono-split]
    data: [co2, arima]
    state: { featUpTo: 0, scenario: lag1 }
    derive:
      - { fn: featureSheet, in: { co2: '@co2', upTo: '@featUpTo', n: 8 }, out: fs }
      - { fn: scenarioView, in: { co2: '@co2', arima: '@arima', scenario: '@scenario' }, out: sv }
    stage:
      - id: sheet
        widget: Matrix
        props: { rows: '@fs.rows', cols: '@fs.cols', values: '@fs.values', format: 3, title: 'Building the input table from the series (first 8 months)', rowHeader: month }
      - id: player
        widget: StepPlayer
        region: bottom
        hidden: true
        props:
          fn: featureWalk
          in: { co2: '@co2', n: 6 }
          roles: { sheet: sheet }
          speed: 0.6
      - id: pick
        widget: Choice
        region: side
        props:
          label: input columns
          style: dropdown
          options:
            - { value: lag1, label: 'lag_1 only' }
            - { value: A, label: 'A: lag_1, lag_2, lag_12, roll_mean_3' }
            - { value: B, label: 'B: A + 11 month columns' }
            - { value: C, label: 'C: all 12 lags + roll + months' }
            - { value: leaky, label: 'B with the unsafe rolling mean' }
        bind: { value: scenario }
      - id: score
        widget: Readout
        region: side
        props:
          items:
            - { label: 'one-step MAE', value: '@sv.mae', format: 3, tone: accent }
            - { label: input columns, value: '@sv.nFeatures' }
      - id: plot
        widget: Chart
        hidden: true
        props: { kind: line, series: '@sv.series', xLabel: year, yLabel: 'CO₂ (ppm)', title: One-step forecasts on the 48 test months }
    beats:
      - say: |
          **Linear regression** predicts a number by adding up input columns, each times a learned weight. It needs a table
          of inputs, but a series is just one column. The only inputs we could know before this month are **earlier months**.
        define: [linear-regression]
      - say: |
          So each lag becomes a column: a **lag feature**. lag_1 holds last month's value, lag_12 the same month last year.
          In pandas, `shift(k)` makes it.
        define: [lag-feature]
      - say: |
          Another useful column is a **rolling mean**: the average of the last three months. Careful: pandas' `rolling(3)`
          includes the current month by default, so **shift first**, then average.
        show: [player]
        gate:
          type: event
          prompt: Build the first six rows.
          target: player
          event: done
      - say: Check one value.
        set: { featUpTo: 8 }
        gate:
          type: predict
          question: 'The safe roll_mean_3 for April 1959 = the average of Jan, Feb, Mar (315.50, 316.56, 316.74)?'
          answer: { value: 316.267, tol: 0.005 }
          explain: '(315.5 + 316.5625 + 316.7375) ÷ 3 = 316.267. The unsafe version averages Feb to **Apr**, including the month being predicted.'
      - say: |
          Train on 1960–1997, then forecast each 1998–2001 month one step ahead. With **lag_1 only**, MAE is 1.067, about the
          same as repeating last month (1.080).
        show: [plot]
        gate:
          type: predict
          question: 'The lag_1-only regression learns a weight of about…'
          options: ['1: it learned to copy last month', '0', '12', '0.5']
          answer: 0
          explain: '0.9978. A fancier model with no new information gains nothing.'
      - say: Add more of the past, and the month of the year.
        gate:
          type: when
          prompt: Choose **B** (past + month columns).
          when: 'scenario == ''B'''
      - say: |
          MAE **0.222**, about a fifth of the naive error and well below ARIMA's 0.600. The gain came from the month columns:
          yearly information that ARIMA(p,d,q) has no part for.
      - say: Now swap in the unsafe rolling mean and change nothing else.
        gate:
          type: when
          prompt: Choose **B with the unsafe rolling mean**.
          when: 'scenario == ''leaky'''
      - say: |
          MAE is zero: a perfect score. That is **leakage**: the month being predicted sneaked into an input column. The
          model learned the weights lag_1 = −1, lag_2 = −1, roll_leaky = 3.
        define: [leakage]
        gate:
          type: predict
          question: 'Why those weights?'
          options: ['y_t = 3·roll_leaky − y_(t−1) − y_(t−2): it worked out the answer from the input', 'The model is perfect', 'The month columns cancel out', 'Rounding error']
          answer: 0
          explain: 'roll_leaky = (y_t + y_(t−1) + y_(t−2)) ÷ 3 contains the answer itself. Leakage gives excellent scores that mean nothing.'
      - say: Build a safe rolling mean yourself.
        gate:
          type: practice
          template: roll-numeric
    takeaway: Lag columns, a safe rolling mean and month columns let any regression forecast. Every input must be knowable before the month it predicts.
