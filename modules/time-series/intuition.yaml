scenes:
  - id: be-the-forecaster
    title: You are the forecaster
    goal: What did you actually use when you sketched the next 12 months?
    skills: [ts-structure]
    state: { which: A, reveal: hide }
    derive:
      - { fn: forecaster, in: { which: '@which', reveal: '@reveal' }, out: fc }
    stage:
      - id: plot
        widget: Chart
        props: { kind: line, series: '@fc.series', xLabel: month, yLabel: value, title: 'Monthly data, five years, last 12 months hidden' }
      - id: pick
        widget: Choice
        region: side
        props:
          label: series
          options:
            - { value: A, label: A }
            - { value: B, label: B }
            - { value: C, label: C }
        bind: { value: which }
      - id: show
        widget: Choice
        region: side
        hidden: true
        props:
          label: last 12 months
          options:
            - { value: hide, label: hidden }
            - { value: show, label: revealed }
        bind: { value: reveal }
      - id: bins
        widget: DropBins
        region: bottom
        hidden: true
        props:
          chips:
            - { id: a, label: Series A }
            - { id: b, label: Series B }
            - { id: c, label: Series C }
          bins:
            - { id: level, label: 'the typical level' }
            - { id: dir, label: 'the direction' }
            - { id: shape, label: "the direction and last year's shape" }
          solution: { a: level, b: dir, c: shape }
    beats:
      - say: |
          Slide 7. Monthly data, five years, the last 12 months hidden. Sketch in your head what happens next, then name the information you used.
        gate:
          type: predict
          question: 'Series A: what is the most useful thing to carry forward?'
          options: ['Its typical level', 'Its direction', 'Last year''s up-and-down shape', 'Nothing: it is unpredictable']
          answer: 0
          explain: A wobbles around a steady level with no climb and no repeating shape. The best guess is that level.
      - say: Look at series B.
        gate:
          type: when
          prompt: Switch to **B**.
          when: 'which == ''B'''
      - say: B behaves differently.
        gate:
          type: predict
          question: 'Series B: what did you use?'
          options: ['The typical level only', 'The direction it is heading', 'Last year''s shape', 'The first value']
          answer: 1
          explain: B climbs steadily. A flat line at its average would be badly low; you extend the direction.
      - say: Now series C.
        gate:
          type: when
          prompt: Switch to **C**.
          when: 'which == ''C'''
      - say: Sort all three by the information you used.
        show: [bins]
        gate:
          type: event
          prompt: Match each series to what you used.
          target: bins
          event: solved
      - say: |
          **Nobody used a model. Everybody used structure.** You did by eye what every method in this course does with arithmetic: level, direction, repetition.
        show: [show]
        set: { reveal: show }
    takeaway: Forecasting by eye already uses structure in the past values (level, direction, seasonal shape), which is what every method formalizes.

  - id: name-the-parts
    title: Trend, season, remainder
    goal: Which pieces is a series made of, and how do they combine?
    skills: [ts-structure]
    state: { slope: 0.5, amp: 5 }
    derive:
      - { fn: decompose, in: { slope: '@slope', amp: '@amp' }, out: dc }
    stage:
      - id: plot
        widget: Chart
        props: { kind: line, series: '@dc.series', xLabel: month, title: 'y = T + S + R (synthetic)' }
      - id: rem
        widget: Chart
        region: bottom
        props: { kind: line, series: '@dc.parts', xLabel: month, title: Remainder }
      - id: f
        widget: Formula
        region: side
        props: { tex: '\anchor{y}{y_t} \approx \anchor{t}{T_t} + \anchor{s}{S_t} + \anchor{r}{R_t}', size: lg }
      - id: sl
        widget: Slider
        region: side
        props: { label: 'trend slope per month', min: -0.5, max: 1, step: 0.05, format: 2 }
        bind: { value: slope }
      - id: am
        widget: Slider
        region: side
        props: { label: seasonal amplitude, min: 0, max: 10, step: 0.5, format: 1 }
        bind: { value: amp }
      - id: bins
        widget: DropBins
        region: bottom
        hidden: true
        props:
          chips:
            - { id: e1, label: Electricity demand by hour of day }
            - { id: e2, label: 'Business cycles (booms and recessions)' }
            - { id: e3, label: 'Sunspot activity (cycles of roughly 9–14 years)' }
            - { id: e4, label: Retail sales spiking every December }
            - { id: e5, label: Weekend dips in daily train ridership }
            - { id: e6, label: 'El Niño episodes every 2–7 years' }
          bins:
            - { id: seasonal, label: 'Seasonal (fixed, calendar-linked)' }
            - { id: cyclic, label: 'Cyclic (no fixed length)' }
          solution: { e1: seasonal, e2: cyclic, e3: cyclic, e4: seasonal, e5: seasonal, e6: cyclic }
    beats:
      - say: |
          Slide 13's mental model: what you observed, $y_t$, is roughly a **trend** $T_t$ (where it is heading in the long run) plus a **seasonal** part $S_t$
          (the repeating within-year part) plus a **remainder** $R_t$ (whatever is left).
        do:
          - { target: f, cmd: highlight, args: { sel: 'term:t', tone: accent } }
      - say: The trend need not be a straight line, and it can change direction. Move the sliders.
        gate:
          type: when
          prompt: Make a series with a clear season but **no trend**.
          when: 'abs(slope) < 0.06 and amp >= 3'
          hint: Slope to 0, amplitude up.
      - say: Now remove the season too.
        gate:
          type: predict
          question: 'With slope 0 and amplitude 0, what is left of y?'
          options: ['Only the remainder around a flat level', 'Nothing', 'A straight line', 'A sine wave']
          answer: 0
          explain: Without trend and season, y is the level plus the remainder, the "everything else".
      - say: |
          "≈, not =". This is a way of looking, not a theory. Some series **multiply** (the swings grow with the level), some have **several** seasons, some have neither.
      - say: One more distinction. **Seasonal** means a fixed, known, calendar-linked period. **Cyclic** means rises and falls of no fixed length.
        show: [bins]
        gate:
          type: event
          prompt: Sort each pattern.
          target: bins
          event: solved
    takeaway: 'y_t ≈ T_t + S_t + R_t: long-run direction, fixed-period repetition, and the rest. Cycles without a fixed period are not seasonal.'

  - id: lags
    title: Lags
    goal: What does y with a subscript "t − k" mean, and which k matters for monthly data?
    skills: [lags]
    data: [co2, lagrows]
    state: { k: 1 }
    derive:
      - { fn: lagView, in: { co2: '@co2', k: '@k' }, out: lv }
      - { fn: tableMatrix, in: { table: '@lagrows' }, out: lm }
    stage:
      - id: plot
        widget: Chart
        props: { kind: line, series: '@lv.series', xLabel: year, yLabel: 'CO₂ (ppm)', title: 'A lag is the same series, slid to the right' }
      - id: tbl
        widget: Matrix
        region: side
        props: { data: '@lm', format: 1, title: 'Slide 16', rowHeader: month }
      - id: ks
        widget: Slider
        region: side
        hidden: true
        props: { label: 'lag k (months)', min: 1, max: 24, step: 1 }
        bind: { value: k }
    beats:
      - say: |
          From now on subscripts mean **when**, not which row. $y_t$ is the value at time t; $y_{t-1}$ one step earlier; $y_{t-k}$ k steps earlier. k is **the lag**.
        gate:
          type: predict
          question: 'Slide 16: t = June 1999, monthly data. What is y with subscript t − 1?'
          answer: { value: 370.8, tol: 0.05 }
          explain: 'Last month, May 1999 = 370.8. The same 370.8 is May''s own y.'
      - say: The same table has a lag-12 column.
        gate:
          type: predict
          question: 'For April 1999, what is y with subscript t − 12?'
          answer: { value: 368.5, tol: 0.05 }
          explain: 'The same month one year ago, April 1998 = 368.5.'
      - say: Slide the whole series k months to the right and compare it with itself.
        show: [ks]
        gate:
          type: when
          prompt: Find the lag at which the seasonal peaks line up again.
          when: 'k == 12'
          hint: How many months in a year?
      - say: |
          At k = 12 the lagged copy has the right seasonal **shape** but sits lower: it misses a year of growth. Lag 1 has the right **level**. Together they give both.
      - say: The unit of k is one step of the data.
        gate:
          type: predict
          question: 'If the data were quarterly, which lag is "the same quarter last year"?'
          answer: { value: 4 }
          explain: 'Four quarters in a year. For daily data, k = 7 is the same weekday last week.'
    takeaway: 'A lag k means k steps back in the data''s own units: y_(t−1) is last month, y_(t−12) the same month last year.'

  - id: order-is-signal
    title: Order is the signal
    goal: What do you lose if you shuffle the rows of a time series?
    skills: [chrono-split]
    data: [co2, notebook]
    state: { mode: ordered }
    derive:
      - { fn: shuffleOrder, in: { co2: '@co2', mode: '@mode' }, out: so }
      - { fn: chronoSplit, in: { co2: '@co2' }, out: cs }
    stage:
      - id: plot
        widget: Chart
        props: { kind: line, series: '@so.series', xLabel: year, yLabel: ppm, title: 'Monthly CO₂, 1995–2001' }
      - id: pick
        widget: Choice
        region: side
        props:
          label: rows
          options:
            - { value: ordered, label: chronological }
            - { value: shuffled, label: shuffled }
        bind: { value: mode }
      - id: stats
        widget: Readout
        region: side
        props:
          items:
            - { label: values, value: '@so.n' }
            - { label: mean, value: '@so.mean', format: 3 }
            - { label: max, value: '@so.max', format: 2 }
      - id: rf
        widget: Callout
        hidden: true
        props: { kind: warn, title: 'Session 12: a random forest, two splits', body: 'Shuffled split MAE **0.515**. Chronological split MAE **3.174**, nearly 3× worse than the naive forecast. A tree predicts averages of training targets, so it can never exceed **366.68**, the highest training value; 38 of the 48 test months are above it.' }
    beats:
      - say: |
          Shuffle the rows of a customer table and nothing is lost: row 400 was never "after" row 399. Now shuffle a time series.
        gate:
          type: when
          prompt: Shuffle the rows.
          when: 'mode == ''shuffled'''
      - say: Every pattern is gone. Look at the side panel.
        gate:
          type: predict
          question: How many values did the shuffle delete?
          answer: { value: 0 }
          explain: Same 84 numbers, same mean, same maximum. Only the order changed, and the order was the signal.
      - say: |
          **Never shuffle a time series, and never split one at random.** `train_test_split(..., shuffle=True)` lets a model train on next year to predict last year.
      - say: 'Session 12 did exactly that to a random forest, with the same features both times.'
        show: [rf]
        gate:
          type: predict
          question: Which test score is the honest one?
          options: ['The chronological split, MAE 3.174', 'The shuffled split, MAE 0.515', 'Both equally', 'Neither']
          answer: 0
          explain: 'With a shuffled split, each test month had training months on both sides, so the forest only had to fill gaps, not forecast.'
      - say: |
          The notebooks cut at a date: **{=cs.train}** training months (1959–1997) and **{=cs.test}** test months (1998–2001). Train on the past, test on the future.
        set: { mode: ordered }
    takeaway: In a time series the order is the signal. Shuffling deletes nothing and destroys everything; always split chronologically.

  - id: stationary-gallery
    title: Stationary does not mean flat
    goal: Does this series behave like the same series throughout?
    skills: [stationarity]
    data: [co2, adf]
    state: { which: noise }
    derive:
      - { fn: gallery, in: { co2: '@co2', which: '@which' }, out: g }
      - { fn: adfView, in: { adf: '@adf' }, out: av }
    stage:
      - id: plot
        widget: Chart
        props: { kind: line, series: '@g.series', title: 'One panel of slide 18''s gallery (synthetic, except CO₂)' }
      - id: pick
        widget: Choice
        region: side
        props:
          label: series
          style: dropdown
          options:
            - { value: noise, label: random fluctuation }
            - { value: cycles, label: 'sunspot-like cycles' }
            - { value: co2, label: 'CO₂, monthly' }
            - { value: walk, label: random walk }
            - { value: shift, label: 'Nile-like level shift' }
            - { value: volatility, label: growing volatility }
        bind: { value: which }
      - id: halves
        widget: Readout
        region: side
        props:
          items:
            - { label: 'mean, 1st half', value: '@g.mean1', format: 2 }
            - { label: 'mean, 2nd half', value: '@g.mean2', format: 2 }
            - { label: 'spread, 1st half', value: '@g.sd1', format: 2 }
            - { label: 'spread, 2nd half', value: '@g.sd2', format: 2 }
      - id: bins
        widget: DropBins
        region: bottom
        hidden: true
        props:
          chips:
            - { id: noise, label: random fluctuation }
            - { id: cycles, label: sunspot-like cycles }
            - { id: co2, label: 'CO₂, monthly' }
            - { id: walk, label: random walk }
            - { id: shift, label: level shift }
            - { id: vol, label: growing volatility }
          bins:
            - { id: yes, label: stationary }
            - { id: no, label: not stationary }
          solution: { noise: yes, cycles: yes, co2: no, walk: no, shift: no, vol: no }
      - id: adf-t
        widget: Matrix
        hidden: true
        props: { data: '@av.table', format: 4, title: 'Session 11: ADF on the CO₂ training months', rowHeader: run }
    beats:
      - say: |
          A series is **stationary** when, across its whole length, it has a stable typical level, a stable amount of fluctuation, and a stable relationship with its own past.
          Stationary means **consistent**, not flat and not predictable.
      - say: Look at the sunspot-like cycles.
        gate:
          type: predict
          question: 'They swing from about 0 to 150. Stationary?'
          options: ['Yes: the cycles keep returning to the same level with similar swings', 'No: they swing too much', 'No: they have a season', 'Only the first half']
          answer: 0
          explain: Big swings are fine if the behaviour stays the same. The cycles have no fixed length, so they are not seasonal either.
      - say: Compare the two halves of each series in the side panel.
        show: [bins]
        gate:
          type: event
          prompt: Classify all six panels.
          target: bins
          event: solved
      - say: |
          The random walk barely moves and is **not** stationary: it wanders with no level to return to. Eyeballing does not scale, so Session 11 uses a test.
        show: [adf-t]
      - say: |
          The **augmented Dickey–Fuller** test's H₀ is "unit root", the random-walk signature. On the CO₂ level: statistic +2.287, 5% critical value −2.868, p = 0.9989.
        gate:
          type: predict
          question: What do we conclude?
          options: ['Fail to reject H₀: no evidence against a unit root', 'Reject H₀: the series is stationary', 'The series is proven non-stationary', 'The test is invalid']
          answer: 0
          explain: 'p is nowhere near 0.05 and the statistic is on the wrong side of the critical value. Failing to reject is not proof; it just means the data are not surprising under H₀.'
    takeaway: Stationary means the level, spread and self-relationship stay the same. Big swings can be stationary; a quiet random walk is not.

  - id: difference-by-hand
    title: Differencing, by hand
    goal: How do we turn a climbing series into one that behaves the same throughout?
    skills: [differencing, stationarity]
    data: [annual, co2]
    state: { diffUpTo: 0 }
    derive:
      - { fn: annualDiff, in: { annual: '@annual', upTo: '@diffUpTo' }, out: ad }
      - { fn: trainDiff, in: { co2: '@co2' }, out: td }
    stage:
      - id: sheet
        widget: Matrix
        props: { rows: '@ad.rows', cols: '@ad.cols', values: '@ad.values', format: 1, title: 'Slide 19: annual mean CO₂ at Mauna Loa (ppm)', rowHeader: year }
      - id: player
        widget: StepPlayer
        region: bottom
        hidden: true
        props:
          fn: diffWalk
          in: { annual: '@annual' }
          roles: { sheet: sheet }
          speed: 0.7
      - id: f
        widget: Formula
        region: side
        props:
          steps:
            - '\Delta y_t = y_t - y_{t-1}'
            - '\Delta_{12}\, y_t = y_t - y_{t-12}'
          step: 0
      - id: monthly
        widget: Chart
        hidden: true
        props: { kind: line, series: '@td.series', xLabel: year, yLabel: 'Δy (ppm)', title: 'Monthly changes, 1959–1997: centred, but still a yearly wiggle' }
    beats:
      - say: |
          Slide 19: annual CO₂ climbs every year. Write the **change from last year** next to each value.
        gate:
          type: predict
          question: 'Change from 1959 (316.0) to 1960 (316.9)?'
          answer: { value: 0.9, tol: 0.01 }
          explain: '316.9 − 316.0 = +0.9 ppm.'
      - say: Fill in the rest.
        show: [player]
        gate:
          type: event
          prompt: Play the differences.
          target: player
          event: done
      - say: The left column climbs forever. The right column sits around a steady value.
        set: { diffUpTo: 5 }
        gate:
          type: predict
          question: What is the average yearly change?
          answer: { value: 0.7, tol: 0.01 }
          explain: '(0.9 + 0.7 + 0.8 + 0.5 + 0.6) / 5 = 3.5 / 5 = 0.7 ppm per year.'
      - say: Notice what it cost.
        gate:
          type: predict
          question: 'Six values went in. How many changes came out?'
          answer: { value: 5 }
          explain: 1959 has no previous year. You lose one observation and never get it back.
      - say: |
          Differencing does not clean the data; it **changes the question**, from "what is the value?" to "how much did it change?". Every forecast afterwards is a forecast of change, which must be added back.
      - say: The monthly training series, differenced once (467 changes, mean 0.104 ppm).
        show: [monthly]
        do:
          - { target: f, cmd: step, args: { n: 1 } }
      - say: |
          It is centred and stable, but the **yearly wiggle survives**: first differencing removes the trend, not the season. That needs a seasonal difference $\Delta_{12}$.
          The ADF test on the differenced series gives p = 0.0006.
        gate:
          type: predict
          question: 'ADF on Δy: p = 0.0006. Decision?'
          options: ['Reject the unit root: one difference was enough, so d = 1', 'Difference again', 'Fail to reject', 'Use the level instead']
          answer: 0
          explain: 'Reject H₀. Do not difference again: over-differencing manufactures patterns that were never there.'
    takeaway: Differencing turns levels into changes; it costs one observation, changes the question, and leaves seasonality for a seasonal difference.

  - id: autocorrelation
    title: A series against its own past
    goal: How strongly does this month resemble the months before it?
    skills: [autocorrelation]
    data: [nino, co2]
    state: { k: 1 }
    derive:
      - { fn: lagScatter, in: { y: '@nino', k: '@k' }, out: sc }
      - { fn: acfDiff, in: { co2: '@co2', nlags: 24 }, out: ac }
      - { fn: arMaAcf, in: { phi: 0.8, theta: 0.8 }, out: am }
    stage:
      - id: scatter
        widget: Chart
        props: { kind: scatter, series: '@sc.series', xLabel: 'y_(t−k)', yLabel: 'y_t', title: 'Monthly sea-surface temperature, Niño 1+2, 1990–2010 (°C)' }
      - id: r
        widget: Readout
        region: side
        props:
          items:
            - { label: 'lag k', value: '@k' }
            - { label: 'correlation r', value: '@sc.r', format: 2, tone: accent }
      - id: ks
        widget: Slider
        region: side
        props: { label: 'lag k (months)', min: 1, max: 24, step: 1 }
        bind: { value: k }
      - id: acfbars
        widget: Chart
        hidden: true
        props: { kind: bar, series: '@ac.bars', xLabel: lag, yLabel: r_k, title: 'ACF of the differenced CO₂ training series' }
      - id: sig
        widget: Chart
        region: bottom
        hidden: true
        props: { kind: bar, series: '@am.bars', xLabel: lag, title: 'Built from past values (AR) vs past shocks (MA)' }
    beats:
      - say: |
          **Correlation** asks whether two different variables move together. **Autocorrelation** applies the same idea to one series and a shifted copy of itself:
          each dot is one month, plotted against itself k months earlier.
        gate:
          type: predict
          question: 'Lag 1: this month vs last month. Roughly what correlation?'
          options: ['+0.87', '0', '−0.66', '+0.10']
          answer: 0
          explain: 'Sea temperature changes slowly, so consecutive months are very similar: r = +0.87 (slide 24).'
      - say: Half a year apart, warm months face cool ones.
        gate:
          type: when
          prompt: Find a lag where the correlation is below **−0.6**.
          when: 'sc.r < -0.6'
          hint: Half a year.
      - say: 'Lag 6 gives r = −0.66. Now try a full year.'
        gate:
          type: predict
          question: 'Lag 12: same month last year. r?'
          answer: { value: 0.75, tol: 0.02 }
          explain: '+0.75. The seasonal cycle brings the pattern back.'
      - say: |
          Next session collapses all of these into one plot: the **ACF**, one bar per lag. Here it is for the differenced CO₂ training series.
        show: [acfbars]
        gate:
          type: predict
          question: 'Which lag has the largest bar?'
          options: ['12', '1', '6', '24']
          answer: 0
          explain: 'r₁₂ = 0.916 (lag 1 is 0.708). The yearly cycle survives first differencing; lag 24 is nearly as large.'
      - say: |
          The **PACF** asks how much lag k adds once the lags in between are accounted for: total vs direct resemblance. A series built from past **values** has
          an ACF that decays; one built from past **shocks** has an ACF that cuts off (theory, beyond the slides).
        show: [sig]
      - say: |
          Reading rules (Session 11): PACF cuts off after k, ACF decays → $p \approx k$. ACF cuts off after k, PACF decays → $q \approx k$. Both decay → small p and q.
          Differenced CO₂: both decay, so try p = 1, q = 1.
    takeaway: Autocorrelation correlates a series with its own lagged copy. Its pattern across lags (cut off or decay) suggests p and q.

  - id: baselines
    title: The bar to beat
    goal: What must any forecasting model beat before it has earned its complexity?
    skills: [baselines, forecast-metrics, chrono-split]
    data: [co2, arima]
    state: { method: naive, maeUpTo: 0 }
    derive:
      - { fn: baselineCompare, in: { co2: '@co2', arima: '@arima', method: '@method' }, out: bc }
      - { fn: maeSheet, in: { co2: '@co2', method: naive, upTo: '@maeUpTo' }, out: ms }
    stage:
      - id: plot
        widget: Chart
        props: { kind: line, series: '@bc.series', xLabel: year, yLabel: 'CO₂ (ppm)', title: 'Forecasting 1998–2001 from December 1997' }
      - id: pick
        widget: Choice
        region: side
        props:
          label: forecast
          options:
            - { value: naive, label: naive }
            - { value: seasonal, label: seasonal naive }
            - { value: arima, label: 'ARIMA(1,1,1)' }
        bind: { value: method }
      - id: score
        widget: Readout
        region: side
        props:
          items:
            - { label: MAE, value: '@bc.mae', format: 3, tone: accent }
            - { label: RMSE, value: '@bc.rmse', format: 3 }
            - { label: 'MAPE %', value: '@bc.mape', format: 3 }
      - id: sheet
        widget: Matrix
        hidden: true
        props: { rows: '@ms.rows', cols: '@ms.cols', values: '@ms.values', format: 3, title: 'Naive forecast, month by month', rowHeader: month }
      - id: player
        widget: StepPlayer
        region: bottom
        hidden: true
        props:
          fn: maeWalk
          in: { co2: '@co2', method: naive }
          roles: { sheet: sheet }
          speed: 4
    beats:
      - say: |
          Train on 1959–1997, hide 1998–2001. The **naive** forecast: "whatever the latest value is, use that for the future".
        gate:
          type: predict
          question: 'December 1997 was 364.25. What is the naive forecast for March 2000?'
          answer: { value: 364.25, tol: 0.001 }
          explain: The same 364.25 for every future month, a horizontal line.
      - say: |
          Score it on the 48 held-out months. **MAE** is the average absolute miss, in ppm. Work through every month.
        show: [sheet, player]
        gate:
          type: event
          prompt: Play all 48 months.
          target: player
          event: done
      - say: 'MAE = 217.30 / 48 = 4.527 ppm. RMSE (5.103) squares the misses first, so big ones weigh more; MAPE (1.224%) divides each miss by the actual value.'
        set: { maeUpTo: 48 }
      - say: The **seasonal naive** copies the same month from 1997 instead.
        gate:
          type: when
          prompt: Switch to **seasonal naive**.
          when: 'method == ''seasonal'''
      - say: It uses more information. Look at its score.
        gate:
          type: predict
          question: 'Seasonal naive MAE is 5.063, worse than naive. Why?'
          options: ['It has the right shape but forgets that every year sits higher than 1997', 'It uses less information', 'Its forecasts are random', 'MAE cannot score seasonal forecasts']
          answer: 0
          explain: 'Every wiggle is in the right month, but parked about 2 ppm low and drifting further below. Naive got the level, seasonal naive the season; neither got both.'
      - say: Now the model from Session 11.
        gate:
          type: when
          prompt: Switch to **ARIMA(1,1,1)**.
          when: 'method == ''arima'''
      - say: |
          MAE 1.900, MAPE 0.517%: less than half the naive error. It climbs at the right rate but is smooth, because it has no seasonal term.
          A model that beats the naive forecast has earned **a conversation, not a coronation**.
    takeaway: Naive and seasonal naive set the bar. Score every forecast on the same held-out months with MAE, RMSE and MAPE.

  - id: arima-assembled
    title: ARIMA, assembled
    goal: Where do p, d and q come from, and how does the model forecast?
    skills: [arima, autocorrelation, differencing]
    data: [co2, arima]
    state: { arUpTo: 0 }
    derive:
      - { fn: arimaScene, in: { co2: '@co2', arima: '@arima', upTo: '@arUpTo' }, out: ar }
    stage:
      - id: f
        widget: Formula
        props:
          steps:
            - '\Delta y_t - c = \anchor{ar}{\phi\,(\Delta y_{t-1} - c)} + \varepsilon_t + \anchor{ma}{\theta\,\varepsilon_{t-1}}'
            - '\Delta y_t - 0.1156 = \anchor{ar}{0.5744\,(\Delta y_{t-1} - 0.1156)} + \varepsilon_t + \anchor{ma}{0.3733\,\varepsilon_{t-1}}'
          step: 0
      - id: fc
        widget: Matrix
        region: side
        props: { data: '@ar.table', format: 2, title: First three forecasts, rowHeader: month }
      - id: plot
        widget: Chart
        props: { kind: line, series: '@ar.series', xLabel: year, yLabel: 'CO₂ (ppm)', title: 'Four years forecast with no sight of the answer' }
      - id: player
        widget: StepPlayer
        region: bottom
        hidden: true
        props:
          fn: arimaWalk
          in: { co2: '@co2', arima: '@arima' }
          roles: { fc: fc }
          speed: 0.4
      - id: letters
        widget: DropBins
        region: bottom
        hidden: true
        props:
          chips:
            - { id: d, label: 'd = 1' }
            - { id: p, label: 'p = 1' }
            - { id: q, label: 'q = 1' }
          bins:
            - { id: adf, label: 'the ADF test on the level and on Δy' }
            - { id: pacf, label: 'the PACF / ACF (past values)' }
            - { id: acf, label: 'the ACF / PACF (past shocks)' }
          solution: { d: adf, p: pacf, q: acf }
      - id: errata
        widget: Callout
        region: side
        hidden: true
        props: { kind: errata, body: 'Session 11 writes 0.1156 as the equation''s constant. In statsmodels it is the **mean** change, so the constant is 0.1156 × (1 − 0.5744) = 0.049. Read literally, the notebook''s equation would forecast 365.71, not its own 365.64.' }
    beats:
      - say: |
          How would you guess next month by hand? Follow recent **values** (AR, p). If it keeps drifting up, track the **change** instead of the level (I, d).
          Correct for how wrong you were last time, recent **shocks** (MA, q). ARIMA(1,1,1): one past value, one difference, one past shock.
      - say: Each letter came from somewhere.
        show: [letters]
        gate:
          type: event
          prompt: Match each letter to its evidence.
          target: letters
          event: solved
      - say: |
          Fitted on the training years: drift **c = 0.1156** (the average monthly change), φ = 0.5744, θ = 0.3733. The last training change was 364.25 − 362.38 = 1.87 and the last shock 0.725.
        show: [errata]
        do:
          - { target: f, cmd: step, args: { n: 1 } }
          - { target: f, cmd: highlight, args: { sel: 'term:ar', tone: accent } }
        gate:
          type: predict
          question: 'Forecast for January 1998: 364.25 + 0.1156 + 0.5744(1.87 − 0.1156) + 0.3733(0.725) = ?'
          answer: { value: 365.64, tol: 0.02 }
          explain: '0.1156 + 1.0077 + 0.2706 = 1.394; 364.25 + 1.394 = 365.64.'
      - say: Step forward. After the first month the future shock is unknown, so the MA term drops out.
        show: [player]
        gate:
          type: event
          prompt: Play the three forecasts.
          target: player
          event: done
      - say: |
          The forecast climbs at almost exactly the real rate for four years, but it is smooth: the real series wiggles. The residuals' ACF spikes at lag 12 (≈ 0.58).
        set: { arUpTo: 3 }
        gate:
          type: predict
          question: What does the lag-12 residual spike call for?
          options: ['A seasonal term: SARIMA, ARIMA(p,d,q)(P,D,Q)₁₂', 'More differencing', 'A larger p', 'Nothing: residuals always spike']
          answer: 0
          explain: 'The model''s mistakes repeat every January. ARIMA(p,d,q) has no seasonal letter; SARIMA adds AR, I and MA terms at lag 12. SARIMAX adds outside predictors.'
    takeaway: d comes from the ADF test, p and q from ACF/PACF; ARIMA forecasts each change from the last change and shock, then adds it back.

  - id: lag-features
    title: A series becomes a table
    goal: How can an ordinary regression forecast a time series, and how can it cheat?
    skills: [lag-features, chrono-split]
    data: [co2, arima]
    state: { featUpTo: 0, scenario: lag1 }
    derive:
      - { fn: featureSheet, in: { co2: '@co2', upTo: '@featUpTo', n: 8 }, out: fs }
      - { fn: scenarioView, in: { co2: '@co2', arima: '@arima', scenario: '@scenario' }, out: sv }
    stage:
      - id: sheet
        widget: Matrix
        props: { rows: '@fs.rows', cols: '@fs.cols', values: '@fs.values', format: 3, title: 'Building X from the series (first 8 months)', rowHeader: month }
      - id: player
        widget: StepPlayer
        region: bottom
        hidden: true
        props:
          fn: featureWalk
          in: { co2: '@co2', n: 6 }
          roles: { sheet: sheet }
          speed: 0.6
      - id: pick
        widget: Choice
        region: side
        props:
          label: features
          style: dropdown
          options:
            - { value: lag1, label: 'lag_1 only' }
            - { value: A, label: 'A: lag_1, lag_2, lag_12, roll_mean_3' }
            - { value: B, label: 'B: A + 11 month columns' }
            - { value: C, label: 'C: all 12 lags + roll + months' }
            - { value: leaky, label: 'B with the leaky rolling mean' }
        bind: { value: scenario }
      - id: score
        widget: Readout
        region: side
        props:
          items:
            - { label: 'one-step MAE', value: '@sv.mae', format: 3, tone: accent }
            - { label: features, value: '@sv.nFeatures' }
      - id: plot
        widget: Chart
        hidden: true
        props: { kind: line, series: '@sv.series', xLabel: year, yLabel: 'CO₂ (ppm)', title: One-step forecasts on the 48 test months }
    beats:
      - say: |
          A regression needs a table X and a target y, but a series is one column. If y is this month's value, the only thing we could know beforehand is **earlier months**.
          So each lag becomes a column.
      - say: |
          A **rolling mean** of the last three months is another feature. `rolling(3)` includes the current row by default, so **shift first**.
        show: [player]
        gate:
          type: event
          prompt: Build the first six rows.
          target: player
          event: done
      - say: Check one value.
        set: { featUpTo: 8 }
        gate:
          type: predict
          question: 'Leak-free roll_mean_3 for 1959-04 = mean of Jan, Feb, Mar (315.50, 316.56, 316.74)?'
          answer: { value: 316.267, tol: 0.005 }
          explain: '(315.5 + 316.5625 + 316.7375) / 3 = 316.267. The leaky version averages Feb–**Apr**, including the month being predicted.'
      - say: |
          Fit linear regression on 1960–1997, forecast each 1998–2001 month one step ahead. With **lag_1 only**, MAE is 1.067, the same as naive (1.080).
        show: [plot]
        gate:
          type: predict
          question: 'The lag_1-only regression learns a coefficient of about…'
          options: ['1: it learned to copy last month', '0', '12', '0.5']
          answer: 0
          explain: '0.9978. More complexity with no new information buys nothing.'
      - say: Add the past and the calendar.
        gate:
          type: when
          prompt: Choose **B** (past + month columns).
          when: 'scenario == ''B'''
      - say: |
          MAE **0.222**, about a fifth of the naive error and well below ARIMA's 0.600. The gain came from the month columns: seasonal information ARIMA(p,d,q) has no term for.
      - say: Now swap in the leaky rolling mean, nothing else.
        gate:
          type: when
          prompt: Choose the **leaky** version.
          when: 'scenario == ''leaky'''
      - say: MAE is zero.
        gate:
          type: predict
          question: 'The leaky model''s coefficients are lag_1 = −1, lag_2 = −1, roll_leaky = 3. Why?'
          options: ['y_t = 3·roll_leaky − y_(t−1) − y_(t−2): it solved for the answer', 'The model is perfect', 'Month columns cancel out', 'Rounding error']
          answer: 0
          explain: 'roll_leaky = (y_t + y_(t−1) + y_(t−2))/3 contains the target. Leakage gives excellent scores that mean nothing.'
    takeaway: Lags, leak-free rolling means and month columns let any regression forecast; every feature must be knowable before the month it predicts.
