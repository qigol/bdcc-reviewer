terms:
  # ---------------------------------------------------------------- Session 5: files and layouts
  - id: cell
    term: Cell
    aka: [cells, code cell, text cell]
    short: One box of a notebook that holds code or text. You run each code cell on its own, and its output appears below it.
    related: [dataframe]
    skills: [columnar-parquet]
  - id: dataframe
    term: DataFrame
    aka: [DataFrames, data frame]
    short: A table that Spark spreads over many computers, with named columns and one row per record.
    related: [column, schema]
    skills: [columnar-parquet]
  - id: column
    term: Column
    aka: [columns]
    short: 'One named field of a table, such as fare_amount. Every row holds one value in it, and all its values share one type.'
    related: [dataframe, schema]
    skills: [columnar-parquet]
  - id: csv
    term: CSV file
    aka: [CSV, comma-separated values, CSV files]
    short: A plain-text file with one record per line and commas between the values. It stores no types, so every value is text.
    related: [row-layout, parquet]
    skills: [columnar-parquet, csv-vs-parquet]
  - id: row-layout
    term: Row layout
    aka: [row-oriented, row-oriented storage, row by row]
    short: 'Storing a table record by record, so each record''s values sit together. Handy for whole records; a one-column question still reads everything.'
    related: [columnar-layout, csv]
    skills: [columnar-parquet]
  - id: columnar-layout
    term: Columnar layout
    aka: [columnar, column-oriented, columnar storage, column by column]
    short: 'Storing a table column by column, so each column''s values sit together. A question that needs two columns reads only those two.'
    related: [row-layout, parquet]
    skills: [columnar-parquet]
  - id: parquet
    term: Parquet
    aka: [Apache Parquet, Parquet file, Parquet files]
    short: 'A file format that stores a table column by column, packed smaller (compressed), with each column''s name and type. Spark saves it as a folder.'
    related: [columnar-layout, csv, schema]
    skills: [columnar-parquet, read-write-parquet]
  - id: schema
    term: Schema
    aka: [schemas, printSchema]
    short: 'The list of a table''s column names and their types, such as fare_amount: double. printSchema() prints it as a tree.'
    related: [column, parquet]
    skills: [csv-vs-parquet, json-nested]
  - id: action
    term: Action
    aka: [actions]
    short: 'A command that makes Spark do the work and hand back a result, such as show(), count(), first() or toPandas().'
    related: [row-object]
    skills: [read-write-parquet, aggregations]
  - id: partition-folder
    term: Partition folder
    aka: [partition folders, partitionBy, partitioned]
    short: 'A sub-folder named column=value, such as VendorID=1/, made when Parquet is written split by a column. It holds only rows with that value.'
    related: [parquet]
    skills: [read-write-parquet]
  # ---------------------------------------------------------------- Session 5: running sections and graded problems
  - id: restart
    term: Restart
    aka: [restart Python, Clear state, restarts, restarted]
    short: 'Starting Python afresh: every variable and import from earlier cells is forgotten. On Databricks, look for Restart Python or Clear state in the notebook menus.'
    related: [import, name-error]
    skills: [restart-run-order]
  - id: import
    term: Import
    aka: [imports, import line, imported]
    short: 'A line that borrows names from a library, such as from pyspark.sql import functions as F. Until it runs, those names do not exist.'
    related: [restart, name-error]
    skills: [restart-run-order]
  - id: name-error
    term: NameError
    aka: [NameErrors]
    short: 'Python''s complaint that a name was never defined in this session, for example after a restart or a missing import.'
    related: [restart, import]
    skills: [restart-run-order]
  - id: function
    term: Function
    aka: [functions, def]
    short: 'A named block of code that takes inputs and gives back a result. def name(input) starts it, and return hands back the result.'
    related: [spec]
    skills: [graded-workflow]
  - id: spec
    term: Spec
    aka: [specification, specs]
    short: The text cell of a graded problem that says exactly what your function must accept and return, including column names and sort order.
    related: [assertion-error]
    skills: [graded-workflow]
  - id: assertion-error
    term: AssertionError
    aka: [failing test, assert_equal]
    short: 'The error a test cell raises when a result differs from the expected one. It prints ACTUAL (your value) and DESIRED (the expected value).'
    related: [spec]
    skills: [graded-workflow]
  # ---------------------------------------------------------------- Session 5: grouping and summaries
  - id: group-by
    term: groupBy
    aka: [group by, groupby, GroupedData, grouped]
    short: Puts rows with equal values in the chosen columns into one group, so that each group can be counted or summarized.
    related: [aggregation]
    skills: [aggregations]
  - id: aggregation
    term: Aggregation
    aka: [agg, aggregate, aggregates, summary per group]
    short: 'One summary value per group, such as a count or an average, computed with agg(...) or count() after grouping.'
    related: [group-by, alias]
    skills: [aggregations]
  - id: alias
    term: Alias
    aka: [aliases, renamed]
    short: 'A new name for a result column, such as stars. Without one, Spark makes up names like avg(fare_amount).'
    related: [aggregation, dot-path]
    skills: [aggregations, nested-select]
  - id: row-object
    term: Row
    aka: [Row object]
    short: The small record that first() returns. Read a value by name or by position, or turn it into a plain list of values (a tuple).
    related: [action, tuple]
    skills: [aggregations]
  - id: tuple
    term: Tuple
    aka: [tuples, triple]
    short: 'A fixed list of values in round brackets, such as (2, 9). Python reads its values by position, counting from 0.'
    related: [row-object]
    skills: [aggregations]
  # ---------------------------------------------------------------- Session 6: nested JSON
  - id: json-lines
    term: JSON Lines
    aka: [JSON, JSON file, JSON files, .jsonl]
    short: 'Text records written as {"name": value, ...}, one record per line. A value may itself hold more named values or a list.'
    related: [struct, array]
    skills: [json-nested]
  - id: struct
    term: Struct
    aka: [structs, struct column, nested column, nested columns]
    short: 'A column whose values hold named fields, like a folder holding files and more folders. In the events, actor holds the field login.'
    related: [dot-path, array]
    skills: [json-nested, nested-select]
  - id: dot-path
    term: Dot path
    aka: [dot paths, dotted path]
    short: 'A column name with dots, like "actor.login", that walks into a column to one of its named fields.'
    related: [struct, alias]
    skills: [nested-select]
  - id: tie-break
    term: Tie-break
    aka: [tie-breaks, tie-breaker, ties, tie]
    short: 'A second sort key used when the first one is equal, such as sorting equal star counts by name, so the order never changes.'
    related: [alias]
    skills: [rank-ties]
  - id: array
    term: Array
    aka: [arrays, array column, list column]
    short: A column whose value in each row is a list, such as the commits of one push. The list may be empty or missing.
    related: [explode, struct]
    skills: [json-nested, explode-arrays]
  - id: explode
    term: explode
    aka: [F.explode, exploded, exploding]
    short: Turns each element of a list column into its own row, copying the other columns. Empty or missing lists give no row.
    related: [array]
    skills: [explode-arrays]
    lessonRef: { tab: intuition, id: one-row-per-commit }
  - id: file-path-metadata
    term: _metadata.file_path
    aka: [_metadata, file_path]
    short: A hidden column of every file-based DataFrame that holds the path of the file each row was read from.
    related: [dataframe]
    skills: [file-metadata]
