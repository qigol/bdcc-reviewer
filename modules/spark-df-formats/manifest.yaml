skills:
  - id: columnar-parquet
    label: Row vs column storage
    description: Why a file that keeps each column together (Parquet) reads less than one that keeps each row together (CSV).
  - id: read-write-parquet
    label: Reading and writing Parquet folders
    description: spark.read.parquet on a folder, dbutils.fs.ls, write.parquet with mode and partitionBy, column=value folders.
  - id: csv-vs-parquet
    label: CSV vs Parquet (Problem 1)
    description: Same results or not, stored types, and which operations get faster.
  - id: restart-run-order
    label: Restarts and self-contained sections
    description: After a restart every variable and import is gone; a section must import what it uses.
  - id: graded-workflow
    label: Spec, stub and test
    description: Write the function the spec asks for, run the test, read ACTUAL and DESIRED, trust the test.
  - id: aggregations
    label: groupBy, count, agg and alias
    description: Group by one or two columns, count rows, average with F.mean, name results with alias, read a Row from first().
  - id: json-nested
    label: JSON and nested columns
    description: JSON Lines files, structs and arrays, and reading a nested printSchema tree.
  - id: nested-select
    label: Dot paths
    description: Reach a field inside a struct with "actor.login" in select, filter and groupBy; the result column takes the last name.
  - id: rank-ties
    label: Top-k with tie-breaks
    description: orderBy descending with a second sort key, then limit; why the tie-break decides who makes the top k.
  - id: explode-arrays
    label: 'explode: one row per element'
    description: Turn a list column into rows; NULL or empty lists give no row.
  - id: file-metadata
    label: Which file a row came from
    description: The hidden _metadata.file_path column, and counting rows per file.
