# Every expected value comes from a real Spark 4.0.1 run (truth.json or the extra runs m3x.* in
# SCRATCH/m3x/extra_truth.json), or is a count stated there. The engine fns must reproduce them exactly.
examples:
  - id: top-pair-show
    source: 'Session 5, Problem 2 (graded) shape on taxi12; Real Spark 4.0.1 run (harness), truth m3.top_pair.show/.first/.tuple'
    fn: pairCount
    in: {}
    expect:
      showLines: 
        - '+------------+------------+-----+'
        - '|PULocationID|DOLocationID|count|'
        - '+------------+------------+-----+'
        - '|          41|         238|    2|'
        - '|           7|         179|    1|'
        - '|           7|         223|    1|'
        - '|           7|         260|    1|'
        - '|           7|         261|    1|'
        - '|          33|         140|    1|'
        - '|          33|         143|    1|'
        - '|          74|          75|    1|'
        - '|          74|         166|    1|'
        - '|          75|          41|    1|'
        - '|          97|         137|    1|'
        - '+------------+------------+-----+'
      firstRepr: 'Row(PULocationID=41, DOLocationID=238, count=2)'
      tupleRepr: '(41, 238, 2)'
    note: 'groupBy("PULocationID", "DOLocationID").count(): (41, 238) is the only pair seen twice.'
  - id: pair-groups
    source: 'Session 5, Problem 2 on taxi12; Real Spark 4.0.1 run (harness), extra runs m3x.pair_groups_count and m3x.pu_groups_count'
    fn: pairCount
    in: {}
    expect:
      groups: 11
      puGroups: 6
      topCount: 2
      secondCount: 1
    note: '11 distinct pairs but only 6 pickup zones.'
  - id: mean-alias-show
    source: 'Session 5, Problem 3 (graded) shape on taxi12; Real Spark 4.0.1 run (harness), truth m3.mean_alias.show'
    fn: groupMean
    in: {}
    expect:
      showLines: 
        - '+------------+----------------+'
        - '|PULocationID|mean fare amount|'
        - '+------------+----------------+'
        - '|           7|           14.25|'
        - '|          33|            30.0|'
        - '|          41|           11.75|'
        - '|          74|            7.25|'
        - '|          75|             8.0|'
        - '|          97|            22.0|'
        - '+------------+----------------+'
      columns: ['PULocationID', 'mean fare amount']
      means: [14.25, 30, 11.75, 7.25, 8, 22]
      keys: [7, 33, 41, 74, 75, 97]
    note: 'Zone 7: (34.5 + 4.0 + 8.0 + 10.5) / 4 = 14.25.'
  - id: ave-amount-pandas
    source: 'Session 5, Problem 3 test reads toPandas(); Real Spark 4.0.1 run (harness), extra run m3x.ave_amount_pandas'
    fn: groupMean
    in: {}
    expect:
      pandasLines: 
        - '   PULocationID  mean fare amount'
        - '0             7             14.25'
        - '1            33             30.00'
        - '2            41             11.75'
        - '3            74              7.25'
        - '4            75              8.00'
        - '5            97             22.00'
    note: 'pandas prints 30.00 and 8.00 to line the column up.'
  - id: mean-tip-vendor
    source: 'Session 5 › Tools for Problems 2 and 3 (agg + alias) on taxi12; Real Spark 4.0.1 run (harness), extra run m3x.mean_tip_vendor'
    fn: groupMean
    in: { key: 'VendorID', value: 'tip_amount', alias: 'mean tip' }
    expect:
      showLines: 
        - '+--------+------------------+'
        - '|VendorID|          mean tip|'
        - '+--------+------------------+'
        - '|       1| 4.116666666666666|'
        - '|       2|1.3055555555555556|'
        - '+--------+------------------+'
  - id: vendor-first-row
    source: 'Session 5 › Tools for Problems 2 and 3 (first() and the Row) on taxi12; Real Spark 4.0.1 run (harness), extra runs m3x.vendor_first, m3x.vendor_first_print'
    fn: vendorFirst
    in: {}
    expect:
      firstRepr: 'Row(VendorID=2, count=9)'
      printLine: '9 2 (2, 9)'
      count: 9
  - id: mean-vs-avg
    source: 'Session 5 › Discovery: what can a group do?; Real Spark 4.0.1 run (harness), truth m3.mean_vs_avg and extra run m3x.type_groupby'
    fn: meanVsAvg
    in: {}
    expect:
      groupedType: '<class ''pyspark.sql.connect.group.GroupedData''>'
      meanRepr: 'Column<''avg(fare_amount)''>'
      avgRepr: 'Column<''avg(fare_amount)''>'
    note: 'Truth prints (False, Column<''avg(fare_amount)''>, Column<''avg(fare_amount)''>): two functions, the same column.'
