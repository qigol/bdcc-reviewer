id: volume
kind: json
title: The course volume after the setup notebook (folder tree)
source: 'Real listings from dbutils.fs.ls on the local mirror of the volume (truth m3.ls_base, m3.ls_nyctaxi, m3.ls_green_2017; truth/README.md "The volume"). The lessons/ folder of the harness is left out: the setup notebook does not create it. output/ is not made by the setup notebook either; its note says it appears after the first write of Session 5.'
description: |
  Tree widget payload (node ids are kebab-case). Sizes are real bytes. The part-file names and their number
  inside green_2017/ are chosen by Spark when it writes, so they differ on Databricks.
value:
  id: root
  label: 'bdcc/'
  note: '/Volumes/workspace/default/bdcc'
  children:
    - id: gharchive
      label: 'gharchive/'
      note: 'GitHub events, one file per hour'
      children:
        - { id: gh-15, label: '2015-01-01-15.json.gz' }
        - { id: gh-16, label: '2015-01-01-16.json.gz' }
        - { id: gh-17, label: '2015-01-01-17.json.gz' }
    - id: gutenberg
      label: 'gutenberg/'
      note: '23 books, in 1/1/1/<d>/<id>/<id>.txt'
    - id: nyctaxi
      label: 'nyctaxi/'
      note: 'the green-taxi trips, Oct to Dec 2017'
      children:
        - id: green-2017
          label: 'green_2017/'
          note: 'Parquet: one table stored as a folder of files'
          children:
            - { id: green-success, label: '_SUCCESS', note: '0 bytes' }
            - { id: green-parts, label: 'part-….snappy.parquet', note: 'data files, about 58 MB in all in our local run (Spark picks their names and number)' }
        - { id: csv-10, label: 'green_tripdata_2017-10.csv', note: '81,903,758 bytes' }
        - { id: csv-11, label: 'green_tripdata_2017-11.csv', note: '77,272,601 bytes' }
        - { id: csv-12, label: 'green_tripdata_2017-12.csv', note: '80,039,208 bytes' }
    - id: output
      label: 'output/'
      note: 'appears after your first write in Session 5'
    - id: raw
      label: 'raw/'
      note: 'the downloads, before clean-up'
