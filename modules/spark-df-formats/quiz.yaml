    lessonRef: { tab: application, id: fixed-answers }
    prompt: |
      Rank the pickup zones by their average tip on long trips (over 10 miles), keeping only zones with at least
      100 long trips. Show the highest average first; equal averages go by the smaller zone number.
    code: |
      zone_tips = (
          trips.__BLANK_1__(F.col("trip_distance") > 10)
          .groupBy("PULocationID")
          .agg(
              F.mean("tip_amount").alias("mean_tip"),
              F.__BLANK_2__("*").alias("trips"),
          )
      )
      (
          zone_tips.filter(F.col("__BLANK_3__") >= 100)
          .orderBy(F.__BLANK_4__("mean_tip"), "__BLANK_5__")
          .show(5)
      )
    blanks:
      '1': { accept: ['filter', 'where'] }
      '2': { accept: ['count'] }
      '3': { accept: ['trips'] }
      '4': { accept: ['desc'] }
