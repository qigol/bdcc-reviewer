    hints:
      - Keep the long trips first, then group and summarize each zone.
      - The minimum applies to a column that you named inside `agg`.
    explanation: |
      `filter` keeps the long trips. `agg` computes each zone's `mean_tip` and counts its trips with `F.count("*")`,
      named `trips`. Filtering on `trips` drops the zones with too few trips. `F.desc("mean_tip")` sorts from the
      highest average, and `"PULocationID"` is the [[tie-break]]. On the fixed capstone this prints zone 166 first:
      7.777539724059902 over 2,077 long trips (real output).

