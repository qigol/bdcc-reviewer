sections:
  - id: key-terms
    title: Key terms lookup
    skills:
      - coke-history
      - industry-forces
      - bottler-model
      - strategy-culture
      - portfolio-growth
      - sustainability
    summary: "A placeholder section: this module is conceptual, so the workbench only looks up the meaning of its key terms.
      Pick a term to see what it means."
    keyFormula: \text{term} \rightarrow \text{meaning}
    state:
      term: csd
    derive:
      - fn: termLookup
        in:
          term: "@term"
        out: k
    live:
      - id: r
        widget: Readout
        props:
          items:
            - label: Term
              value: "{=k.name}"
              tone: accent
            - label: Meaning
              value: "{=k.meaning}"
              tone: good
      - id: pick
        widget: Choice
        props:
          label: Term
          options:
            - value: csd
              label: Carbonated soft drink
            - value: sugar-tax
              label: Sugar tax
            - value: concentrate-producer
              label: Concentrate producer
            - value: stills
              label: Stills
            - value: global-ventures
              label: Global Ventures
        bind:
          value: term
    steps:
      - tex: |
          \anchor{lookup}{\text{term}} ;\mapsto; \text{meaning}
        say: Each term has one meaning in this lecture.
      - tex: |
          \anchor{answer}{\text{meaning}} = \text{{=k.name|text}}
        say: "{=k.name}: {=k.meaning}"
    code:
      lang: python
      title: A term lookup
      source: |
        TERMS = {
            "csd": "Carbonated soft drink",
            "sugar-tax": "Sugar tax",
            "concentrate-producer": "Concentrate producer",
            "stills": "Stills",
            "global-ventures": "Global Ventures",
        }

        def term_lookup(term):
            """Look up a key term from the lecture.

            Args:
                term: the term's id.
            Returns:
                The term's name.
            Placeholder: this module is conceptual; see the Intuition tab.
            """
            name = TERMS[term]       # @a:lookup
            return name              # @a:answer
    links:
      - anchor: lookup
        label: Find the term
      - anchor: answer
        label: Its meaning
    trace:
      fn: termLookup
      in:
        term: "@term"
    examples:
      - term-csd
      - term-sugar-tax
      - term-concentrate-producer
      - term-stills
      - term-global-ventures
    tryIt:
      - forces-match
      - model-mcq
    pitfalls:
      - Memorizing the term without the idea behind it. The Intuition tab explains each one.
    examTip: "Exam questions on this lecture are conceptual: know what each term means and when it applies."
