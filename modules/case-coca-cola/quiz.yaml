templates:
  # ------------------------------------------------------------------ coke-history
  - id: model-mcq
    type: mcq
    skills: [coke-history, bottler-model]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: coke-story }
    prompt: How did Asa Candler's business model work in the early years?
    options:
      - Coke sold syrup at a fixed price to bottlers who filled, sold and delivered the drink locally
      - Coke owned every bottle plant itself
      - Coke sold only in drugstores
      - Coke gave the drink away free
    answer: 0
    hints:
      - Think about who bought the syrup.
    explanation: Candler sold perpetual bottling rights to investors, who formed regions and franchised independent bottlers that bought syrup at a fixed price.

  - id: pepsi-challenge-mcq
    type: mcq
    skills: [coke-history]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: coke-story }
    prompt: What was the Pepsi Challenge?
    options:
      - Blind taste tests showing consumers who said they drank Coke picking Pepsi
      - A race between two delivery trucks
      - A price war between the two firms
      - A law case about the Pepsi name
    answer: 0
    hints:
      - The drinks were unmarked.
    explanation: A slight majority preferred Pepsi in blind tests. Pepsi's volume in Dallas grew 14 percent the year after the ads, compared with 6 percent the year before.

  - id: new-coke-mcq
    type: mcq
    skills: [coke-history, strategy-culture]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: coke-story }
    prompt: What happened with New Coke in 1985?
    options:
      - Consumers rejected it, and within three months the original returned as Coke Classic
      - It replaced Coke permanently
      - It was never sold
      - It was sold only abroad
    answer: 0
    hints:
      - Coke Classic regained its share quickly.
    explanation: The launch was widely seen as a failure. Quincey later called the resulting caution New Coke Syndrome.

  - id: history-order
    type: order
    skills: [coke-history]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: coke-story }
    prompt: Put these events in the order they happened.
    items:
      - The Pepsi Challenge ads run in Dallas
      - Diet Coke is launched
      - New Coke is launched and then Coke Classic returns
      - Coke acquires the U.S. operations of its largest bottler
    hints:
      - The Pepsi Challenge began in 1975.
    explanation: The Pepsi Challenge was in 1975, Diet Coke in 1982, New Coke in 1985, and Coke bought the U.S. bottling operations in 2010.

  - id: rivals-mcq
    type: mcq
    skills: [coke-history]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: coke-story }
    prompt: What did Pepsi's former CEO say about competing with Coke?
    options:
      - The warfare is a continuing battle without blood, and each firm makes the other sharper
      - Pepsi would be better off if Coke disappeared
      - Competition is a waste of money
      - Coke should be copied exactly
    answer: 0
    hints:
      - He said each firm helps the other.
    explanation: Both firms grew the industry while competing, and smaller rivals' shares shrank.

  # ------------------------------------------------------------------ industry-forces
  - id: decline-mcq
    type: mcq
    skills: [industry-forces]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: changing-forces }
    prompt: What happened to U.S. soft drink case sales between 2004 and 2018, according to the case?
    options:
      - They fell from about 10.4 billion to about 8.5 billion cases
      - They rose from 8.5 billion to 10.4 billion cases
      - They stayed the same
      - They doubled
    answer: 0
    hints:
      - The industry was in decline.
    explanation: Cases sold fell from 10,377 million in 2004 to 8,520 million in 2018, and in 2017 CSD sales fell behind bottled water for the first time.

  - id: forces-match
    type: match
    skills: [industry-forces]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: changing-forces }
    prompt: Match each force to the trouble it caused for soft drink makers.
    pairs:
      - ['Health and obesity concerns', 'Consumers cut back on sugary drinks']
      - ['Sugar taxes', 'Higher prices and lower sales of taxed drinks']
      - ['Environmental concerns', 'Criticism of plastic bottles and packaging waste']
      - ['Many new drink categories', 'Competition for shelf space and attention']
    hints:
      - Taxes raise prices.
    explanation: These forces together shrank the growth of the soft drink business.

  - id: tax-mcq
    type: mcq
    skills: [industry-forces]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: changing-forces }
    prompt: What happened to sales of taxed sugary drinks in Philadelphia in the first year of the tax?
    options:
      - They fell by 51 percent, or 38 percent after adjusting for purchases just outside the city
      - They rose by 51 percent
      - They did not change
      - They fell by 5 percent
    answer: 0
    hints:
      - The adjusted figure accounts for shoppers who crossed the city line.
    explanation: The industry said the effect of such taxes was overstated and lobbied against them.

  - id: taxes-multi
    type: multi
    skills: [industry-forces]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: changing-forces }
    prompt: Which statements about sugary drink taxes match the case?
    options:
      - About 43 countries had them
      - The Philippines was among the countries that adopted one between 2014 and 2019
      - The U.S. had passed a national tax
      - Seven U.S. cities had imposed taxes
    answer: [0, 1, 3]
    hints:
      - The U.S. had not passed a national tax.
    explanation: Several U.S. cities, including Philadelphia, San Francisco and Seattle, had taxes of 1 to 2 cents per ounce.

  - id: sustainability-force-mcq
    type: mcq
    skills: [industry-forces]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: changing-forces }
    prompt: What did a 2019 volunteer litter audit across 37 countries find?
    options:
      - The largest two producers of the plastic litter were Coke and Pepsi
      - Plastic litter came only from small firms
      - There was no brand information
      - Glass bottles were the main litter
    answer: 0
    hints:
      - It put the biggest names on the list.
    explanation: Plastic bottles are used briefly but take centuries to break down, so they matter most to consumers.

  # ------------------------------------------------------------------ bottler-model
  - id: roles-match
    type: match
    skills: [bottler-model]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: bottler-model }
    prompt: Match each player in the soft drink business to its role.
    pairs:
      - ['[[concentrate-producer|Concentrate producer]]', 'Makes the flavor base and builds the brand']
      - ['[[bottler|Bottler]]', 'Fills bottles and cans and delivers them']
      - ['Retailer', 'Sells to the consumer and decides shelf space']
    hints:
      - One of them spends heavily on advertising.
    explanation: The case's appendix describes four types of players, including suppliers.

  - id: refranchise-mcq
    type: mcq
    skills: [bottler-model]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: bottler-model }
    prompt: What is refranchising?
    options:
      - Selling company-owned bottling operations to independent local partners
      - Buying every bottler in the world
      - Moving the headquarters
      - Changing the recipe
    answer: 0
    hints:
      - It reverses the 2010 move.
    explanation: Coke completed refranchising in the U.S. in 2018, pursuing an asset-light strategy, though it kept some bottlers abroad.

  - id: asset-light-mcq
    type: mcq
    skills: [bottler-model]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: bottler-model }
    prompt: Between 2015 and 2018, Coke's revenue fell from 44.3 to 34.3 billion dollars while its operating margin rose from 19.7 to 26.7 percent. What does this show?
    options:
      - Shedding bottling operations cut revenue but made the remaining business more profitable
      - The firm was in trouble
      - Margins always fall when revenue falls
      - The firm bought more bottlers
    answer: 0
    hints:
      - Headcount also fell by half.
    explanation: Refranchising removed bottler revenue and staff, while margins rose.

  - id: bottler-order
    type: order
    skills: [bottler-model]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: bottler-model }
    prompt: Put Coke's relationship with its bottlers in time order.
    items:
      - Candler sells bottling rights to independent investors
      - Coke spins off bottlers as Coca-Cola Enterprises in 1986
      - Coke acquires the U.S. operations of the bottler in 2010
      - Coke refranchises North America, finishing in 2018
    hints:
      - The relationship went from independent to owned and back to independent.
    explanation: Each move changed who owned the bottling work.

  # ------------------------------------------------------------------ strategy-culture
  - id: strategy-mcq
    type: mcq
    skills: [strategy-culture]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: beverages-for-life }
    prompt: What did the tagline Beverages for Life signal?
    options:
      - A shift from one all-occasion cola to many drinks for the eight servings people drink each day
      - A plan to sell only water
      - A new price war
      - The end of Coca-Cola
    answer: 0
    hints:
      - Most of the eight drinks in the picture were not CSDs.
    explanation: Coke moved from saying its cola was an all-occasion beverage to offering a range of drinks.

  - id: culture-mcq
    type: mcq
    skills: [strategy-culture]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: beverages-for-life }
    prompt: Why did Quincey say Coke had to change its culture along with its strategy?
    options:
      - When strategy and culture conflict, culture wins, so the culture had to match the strategy
      - Culture does not matter
      - Culture is easier to change than strategy
      - Employees asked for jeans
    answer: 0
    hints:
      - He used the symbols of jeans and a bottle of Dasani.
    explanation: He wanted executives to be comfortable saying red Coke is not their only favorite drink.

  - id: structure-mcq
    type: mcq
    skills: [strategy-culture]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: beverages-for-life }
    prompt: How was Coke organized under Quincey?
    options:
      - Four geographic operating groups plus Bottling Investments and Global Ventures
      - Three product groups only
      - One global team with no regions
      - By customer size
    answer: 0
    hints:
      - Quincey chose geography except in a few cases.
    explanation: Business units and key operations were locally focused profit centers, each with its own president.

  - id: people-multi
    type: multi
    skills: [strategy-culture]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: beverages-for-life }
    prompt: Which changes did Coke make as part of the people plan?
    options:
      - Eliminate 1,200 of 5,500 headquarters positions
      - Shift part of pay to differentiate by performance
      - Push more decision-making into the geographies
      - Make tenure the only basis for pay
    answer: [0, 1, 2]
    hints:
      - The case contrasts a tenure-focused culture with a performance-oriented one.
    explanation: Coke moved from valuing tenure to rewarding performance and teamwork.

  # ------------------------------------------------------------------ portfolio-growth
  - id: zombie-mcq
    type: mcq
    skills: [portfolio-growth]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: growing-portfolio }
    prompt: Coke found that 30 percent of its products produced only 1 percent of its volume. What did it do?
    options:
      - It eliminated over 1,300 of these zombies in 2018 and 2019
      - It doubled their advertising
      - It ignored them
      - It sold the firm
    answer: 0
    hints:
      - The name zombie suggests they should be removed.
    explanation: Removing zombies frees resources for growth products.

  - id: lift-mcq
    type: mcq
    skills: [portfolio-growth]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: growing-portfolio }
    prompt: What does lift, shift and scale mean?
    options:
      - Take products that succeed in one market, bring them to new markets and grow them
      - Raise prices, shift costs and scale back
      - Lift weights in factories
      - Close markets
    answer: 0
    hints:
      - Think of Smartwater in 20 new countries.
    explanation: Quincey said a win in one country barely moves the needle at a company working in 200 countries.

  - id: lce-match
    type: match
    skills: [portfolio-growth]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: growing-portfolio }
    prompt: Match each brand stage to what the case says about it.
    pairs:
      - ['Explorer', 'Small, newer brand that should grow about four times faster than the category']
      - ['Challenger', 'Larger brand, around 12 percent share, at the mercy of the leader']
      - ['Leader', 'Leads its market and can reach premium prices with an edge']
    hints:
      - Challengers are forced to discount.
    explanation: The framework gives resources by stage, and moving up can take six years or more in each market.

  - id: costa-mcq
    type: mcq
    skills: [portfolio-growth]
    difficulty: 3
    tags: [application]
    lessonRef: { tab: intuition, id: growing-portfolio }
    prompt: Analysts noted a concern about the 5.1 billion dollar Costa Coffee deal. What was it?
    options:
      - Coke had never run retail stores and may have overpaid, at 16.4 times EBITDA against 13 times for Starbucks
      - Costa had no revenue
      - Coke already owned all coffee brands
      - Costa had no cafes
    answer: 0
    hints:
      - The price was high compared with a rival.
    explanation: Quincey said it was a coffee strategy, not a retail strategy.

  - id: innovation-mcq
    type: mcq
    skills: [portfolio-growth]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: growing-portfolio }
    prompt: By how much did new products' share of Coke's revenue rise between 2017 and 2019?
    options:
      - From about 15 percent to nearly 25 percent
      - From 5 percent to 7 percent
      - From 25 percent to 15 percent
      - It did not change
    answer: 0
    hints:
      - It rose by about ten points.
    explanation: Innovation included reformulations, functional drinks, premium and smaller-sized products.

  - id: gv-mcq
    type: mcq
    skills: [portfolio-growth, strategy-culture]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: growing-portfolio }
    prompt: Why did Coke create Global Ventures?
    options:
      - So small, high-potential brands could grow without being overwhelmed by the larger company
      - To close small brands
      - To replace the geographic groups
      - To handle bottling
    answer: 0
    hints:
      - Mann said bigger systems had sometimes killed smaller brands.
    explanation: Costa was placed in Global Ventures with incentives for the regions to support it.

  # ------------------------------------------------------------------ sustainability
  - id: water-mcq
    type: mcq
    skills: [sustainability]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: sustainability }
    prompt: What did Coke achieve on water between 2004 and 2019?
    options:
      - It cut water used per liter of beverage from 2.7 to 1.85 liters
      - It doubled water use
      - It stopped using water
      - It sold only bottled water
    answer: 0
    hints:
      - A water wake-up call came from India in 2002.
    explanation: Coke also replenished more water, from 81 billion liters in 2012 to 273.7 billion in 2019.

  - id: sugar-actions-multi
    type: multi
    skills: [sustainability, industry-forces]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: sustainability }
    prompt: Which steps did Coke take on sugar and obesity?
    options:
      - Smaller package sizes
      - Low- and no-calorie options beside most full-sugar drinks
      - Calories on front labels
      - Larger fountain cups
    answer: [0, 1, 2]
    hints:
      - Fountains had offered a 64-ounce cup, which Coke moved away from.
    explanation: Coke focused on value share and the consumer experience rather than volume alone.

  - id: packaging-mcq
    type: mcq
    skills: [sustainability]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: sustainability }
    prompt: Which packaging goals did Coke set under Quincey?
    options:
      - Make 100 percent of packaging recyclable globally by 2025 and collect and recycle one bottle for each sold by 2030
      - Stop using bottles by 2022
      - Use only glass by 2025
      - Sell fewer drinks
    answer: 0
    hints:
      - It also supported bottle bills.
    explanation: Coke also changed some bottles from green to clear to make recycling easier.

  - id: barbecue-mcq
    type: mcq
    skills: [sustainability, strategy-culture]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: sustainability }
    prompt: What was Quincey's barbecue challenge?
    options:
      - Employees hearing friends say Coke is bad, so the firm needed a story about what it is for
      - A summer sales promotion
      - A tax case
      - A contest for bottlers
    answer: 0
    hints:
      - It was about how staff felt at social events.
    explanation: Quincey said that if you cannot solve the barbecue moment, you do not have a strategy that makes sense.

  - id: people-match
    type: match
    skills: [strategy-culture, sustainability]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: beverages-for-life }
    prompt: Match each executive to the role the case gives them.
    pairs:
      - ['James Quincey', 'Chair and CEO who pushed the total beverage strategy']
      - ['Jennifer Mann', 'Led the people plan and headed Global Ventures']
      - ['Bea Perez', 'Created the Office of Sustainability']
      - ['Francisco Crespo', 'Chief growth officer who described explorers and challengers']
    hints:
      - Perez worked on sustainability.
    explanation: These executives drove the strategy, people, sustainability and growth efforts described in the case.
