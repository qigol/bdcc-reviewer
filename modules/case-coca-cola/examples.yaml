examples:
  - id: term-csd
    source: "Coca-Cola, Preparing for the Next 100 Years (Harvard Business School case 9-721-359, 2021): glossary term
      Carbonated soft drink"
    fn: termLookup
    in:
      term: csd
    expect:
      name: Carbonated soft drink
      meaning: A sweet, fizzy, non-alcoholic drink such as a cola.
  - id: term-sugar-tax
    source: "Coca-Cola, Preparing for the Next 100 Years (Harvard Business School case 9-721-359, 2021): glossary term Sugar
      tax"
    fn: termLookup
    in:
      term: sugar-tax
    expect:
      name: Sugar tax
      meaning: A tax on sugary drinks, charged to cut how much of them people drink.
  - id: term-concentrate-producer
    source: "Coca-Cola, Preparing for the Next 100 Years (Harvard Business School case 9-721-359, 2021): glossary term
      Concentrate producer"
    fn: termLookup
    in:
      term: concentrate-producer
    expect:
      name: Concentrate producer
      meaning: A company that makes the secret flavor base of a drink and sells it to bottlers, while building the brand.
  - id: term-stills
    source: "Coca-Cola, Preparing for the Next 100 Years (Harvard Business School case 9-721-359, 2021): glossary term Stills"
    fn: termLookup
    in:
      term: stills
    expect:
      name: Stills
      meaning: Coke's word for drinks without fizz, such as water, juice, tea and coffee.
  - id: term-global-ventures
    source: "Coca-Cola, Preparing for the Next 100 Years (Harvard Business School case 9-721-359, 2021): glossary term
      Global Ventures"
    fn: termLookup
    in:
      term: global-ventures
    expect:
      name: Global Ventures
      meaning: Coke's group for small, fast-growing brands, kept apart from the geographic structure so the big company does
        not smother them.
