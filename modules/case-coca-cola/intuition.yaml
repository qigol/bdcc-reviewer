scenes:
  - id: coke-story
    title: A drink, a rival and a flop
    goal: How did a drink sold in a drugstore become the most loved soft drink brand, and what nearly went wrong?
    skills: [coke-history]
    stage:
      - id: start-note
        widget: Callout
        props:
          kind: note
          title: 'The year was 2019'
          body: |
            James Quincey, CEO since 2017, became chair of The Coca-Cola Company. Coca-Cola had been the world's best-selling beverage
            for **100 years**, but some consumers were turning away from fizzy drinks.
      - id: rival-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: r1, label: Sold syrup at a fixed price to local bottlers }
            - { id: r2, label: Ran blind taste tests in Dallas }
            - { id: r3, label: Launched Diet Coke in 1982 }
            - { id: r4, label: Offered a larger bottle for the same price in the 1930s }
            - { id: r5, label: Launched New Coke in 1985 }
          bins:
            - { id: coke, label: Coca-Cola }
            - { id: pepsi, label: Pepsi }
          solution: { r1: coke, r2: pepsi, r3: coke, r4: pepsi, r5: coke }
    beats:
      - say: |
          Coca-Cola began in 1886 as a syrup made by a pharmacist, mixed with carbonated water and sold as a tonic.
          Asa Candler turned it into a national brand and sold bottling rights to independent investors.
        show: [start-note]
      - say: |
          Coke makes the drink's secret syrup, and local bottlers fill and deliver it. Over the years Coke made a
          **carbonated soft drink**, or **CSD**, the largest part of its business. Coke called these drinks sparkling.
        define: [csd]
      - say: |
          Pepsi began to fight back, offering larger bottles for the same price and copying Coke. In 1975 it aired blind taste
          tests. The **Pepsi Challenge** showed people who claimed to drink Coke picking Pepsi.
        define: [pepsi-challenge]
        hide: [start-note]
        gate:
          type: predict
          question: How did Pepsi's sales volume in Dallas compare in the year after the Pepsi Challenge ads with the year before?
          options:
            - It grew faster, at 14 percent compared with 6 percent
            - It fell
            - It stayed the same
            - It grew slower
          answer: 0
          explain: Pepsi's Dallas volume grew 14 percent, against 6 percent the year before, so it ran the ads in other markets.
      - say: |
          Coke fought back with Diet Coke in 1982, which became the third largest soft drink within two years. Then in 1985
          it launched New Coke, pulled the original, and consumers loudly rejected it. Sort the moves by company.
        show: [rival-sorter]
        gate:
          type: event
          prompt: Put each move under the firm that made it.
          target: rival-sorter
          event: solved
          hint: Syrup, Diet Coke and New Coke are Coke. Blind taste tests and bigger bottles are Pepsi.
      - say: Review the history.
        hide: [rival-sorter]
        gate:
          type: practice
          template: pepsi-challenge-mcq
      - say: And the flop.
        gate:
          type: practice
          template: new-coke-mcq
    takeaway: Coke built a global brand through bottlers, but rivals and the New Coke flop taught it caution.

  - id: changing-forces
    title: Why people drank less
    goal: What changed so that, after a century of growth, soft drink sales began to shrink?
    skills: [industry-forces]
    data: [us-csd-cases]
    stage:
      - id: csd-chart
        widget: Chart
        hidden: true
        props:
          kind: line
          title: U.S. soft drink case sales (millions of cases)
          xLabel: Year
          yLabel: Cases
          series:
            - { name: CSD cases, x: ['1985', '1990', '1995', '2000', '2005', '2010', '2015', '2018'], y: [6385, 7780, 8970, 10041, 10322, 9369, 8705, 8520] }
      - id: force-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: f1, label: Evidence linking sugary drinks to obesity }
            - { id: f2, label: A cent per ounce charged on sugary drinks }
            - { id: f3, label: Plastic bottles found in litter }
            - { id: f4, label: Bottled water sales passing CSD sales }
          bins:
            - { id: health, label: Health }
            - { id: tax, label: Taxes }
            - { id: env, label: Environment }
            - { id: comp, label: New competition }
          solution: { f1: health, f2: tax, f3: env, f4: comp }
    beats:
      - say: |
          From 1970 to 2000 the U.S. soft drink business grew rapidly, as firms added flavors, packages and sizes. Then the
          picture changed. Before you see the data, what do you expect?
        gate:
          type: predict
          question: What happened to U.S. soft drink case sales between the early 2000s and 2018?
          options:
            - They fell
            - They kept rising
            - They stayed flat
            - They doubled
          answer: 0
          explain: Cases fell from about 10.4 billion in 2004 to about 8.5 billion in 2018.
      - say: |
          Here is the pattern. In 2017 CSD sales fell behind bottled water for the first time, and PepsiCo's CEO had warned
          that consumers could walk away from soft drinks.
        show: [csd-chart]
      - say: |
          Four forces pushed sales down. Health worries linked sugary drinks to obesity. Governments added a **sugar tax**, a
          tax on sugary drinks. About 43 countries taxed them, and Philadelphia's taxed drinks fell 51 percent in the first year.
        define: [sugar-tax]
        hide: [csd-chart]
        show: [force-sorter]
        gate:
          type: event
          prompt: Put each force under its type.
          target: force-sorter
          event: solved
          hint: Obesity is health. Litter is environment.
      - say: |
          Consumers also cared about the planet. Plastic bottles are used briefly but take centuries to break down, and a
          2019 litter audit named Coke and Pepsi as the largest two producers.
        hide: [force-sorter]
      - say: Check the numbers.
        gate:
          type: practice
          template: decline-mcq
      - say: And the forces.
        gate:
          type: practice
          template: forces-match
    takeaway: Health worries, taxes, plastic and new drinks all pulled soft drink sales down.

  - id: bottler-model
    title: Who makes and who sells
    goal: Coke does not fill most of its own bottles. How does it split the work with partners?
    skills: [bottler-model]
    stage:
      - id: players-tree
        widget: Tree
        hidden: true
        props:
          root:
            id: chain
            label: The soft drink business
            children:
              - { id: cp, label: Concentrate producer, note: Makes the flavor base, builds the brand }
              - { id: bt, label: Bottler, note: Fills, sells and delivers }
              - { id: rt, label: Retailer, note: Sells to consumers }
      - id: change-table
        widget: Schedule
        hidden: true
        props:
          title: Coke after refranchising
          columns: ['2015', '2018']
          rows:
            - { label: Revenue ($ billions), amounts: ['44.3', '34.3'] }
            - { label: Headcount, amounts: ['123,200', '62,600'] }
            - { label: Operating margin, amounts: ['19.7%', '26.7%'] }
    beats:
      - say: |
          A **concentrate producer** such as Coke makes the flavor base and builds the brand through advertising. A
          **bottler** mixes it with water and sweetener, fills the bottles, and delivers them to shops.
        define: [concentrate-producer, bottler]
        show: [players-tree]
      - say: |
          The two sides never agreed fully on the best arrangement. In 1986 Coke spun its largest bottlers off as one company.
          In 2010 Coke bought the U.S. operations back, believing it could cut costs and launch new products faster.
        hide: [players-tree]
      - say: |
          By 2016 Coke changed its mind. **Refranchising** means selling company-owned bottling operations to independent local
          partners. Coke finished doing this in the U.S. in 2018.
        define: [refranchising]
        gate:
          type: predict
          question: After selling its bottlers, what would you expect to happen to Coke's operating margin?
          options:
            - It rose
            - It fell
            - It did not change
            - It disappeared
          answer: 0
          explain: Margins rose from 19.7 percent to 26.7 percent, even as revenue fell.
      - say: |
          Here are the numbers. Revenue and headcount fell sharply but margin rose. This is an **asset-light strategy**: own
          fewer factories and trucks and let local partners do the heavy work.
        define: [asset-light-strategy]
        show: [change-table]
      - say: |
          A Coke manager said small partners make better distributors because of their local focus. Coke kept some bottlers
          overseas, and PepsiCo chose not to refranchise.
        hide: [change-table]
      - say: Check the roles.
        gate:
          type: practice
          template: roles-match
      - say: And the meaning of refranchising.
        gate:
          type: practice
          template: refranchise-mcq
      - say: Put the bottler story in order.
        gate:
          type: practice
          template: bottler-order
    takeaway: Coke moved from owning bottlers back to local partners, giving up revenue but gaining margin.

  - id: beverages-for-life
    title: Changing what Coke is
    goal: How do you change a 130-year-old company that depends on one famous drink?
    skills: [strategy-culture]
    stage:
      - id: story-note
        widget: Callout
        hidden: true
        props:
          kind: note
          title: Symbols
          body: |
            At a town hall Quincey wore **jeans on a Wednesday**. Later he carried a bottle of **Dasani** water and said, "It is
            okay if your favorite drink is not red Coke."
      - id: struct-tree
        widget: Tree
        hidden: true
        props:
          root:
            id: coke
            label: Coke's structure under Quincey
            children:
              - { id: geo, label: Four geographic groups, note: 'Europe, Middle East and Africa; Latin America; North America; Asia Pacific' }
              - { id: bi, label: Bottling Investments, note: Company-owned bottling }
              - { id: gv, label: Global Ventures, note: Small brands to scale }
    beats:
      - say: |
          Quincey said Coke would become a **total beverage company**, one that sells drinks for every taste and occasion, not
          only its flagship cola. In 2017 the tagline Beverages for Life showed eight different drinks for the eight servings
          people drink each day.
        define: [total-beverage-company]
      - say: Try predicting this one.
        gate:
          type: predict
          question: Why would a cola company find stills harder than its core business?
          options:
            - They had lower margins, lower volumes and less experience
            - They are illegal
            - They cost nothing to make
            - Nobody drinks them
          answer: 0
          explain: The manager in the case said stills were lower margin, harder to make and made at lower volumes.
      - say: |
          Most of those drinks were not fizzy. Coke calls non-fizzy drinks **stills**. Many stills had lower margins, were harder
          to make and were made at lower volumes, so Coke looked for higher-margin segments where it could lead.
        define: [stills]
      - say: |
          Quincey knew culture could block the plan. He said that when culture and strategy conflict, culture wins. Symbols
          helped.
        show: [story-note]
      - say: |
          He also worried about **New Coke Syndrome**, a fear of failure that kept the company cautious. For small brands he
          wanted more experiments and faster decisions. He pushed decisions into the regions and cut 1,200 of 5,500 headquarters
          positions.
        define: [new-coke-syndrome]
        hide: [story-note]
      - say: |
          The structure used four geographic groups, each split into business units that act as **profit centers**, each
          with its own president. Coke also began to focus on **value share**, a brand's share of money spent, rather than only
          units sold.
        define: [profit-center, value-share]
        show: [struct-tree]
      - say: Check the strategy.
        hide: [struct-tree]
        gate:
          type: practice
          template: strategy-mcq
      - say: And the structure.
        gate:
          type: practice
          template: structure-mcq
      - say: One question about culture and strategy.
        gate:
          type: reflect
          prompt: Quincey said that when culture and strategy conflict, culture wins. Why might that be true?
          model: |
            People follow what the culture rewards in daily life, not what a strategy slide says. If executives are expected to
            protect the old flagship, they will, however the new strategy reads.
    takeaway: Coke changed strategy, symbols, pay and structure together so culture would not defeat strategy.

  - id: growing-portfolio
    title: Pruning and planting
    goal: How does a giant company add new drinks without drowning them?
    skills: [portfolio-growth]
    stage:
      - id: lce-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: g1, label: Small, newer brand that should grow about four times faster than its category }
            - { id: g2, label: Larger brand, around 12 percent share, forced to discount }
            - { id: g3, label: Leader of its segment, able to charge premium prices }
          bins:
            - { id: exp, label: Explorer }
            - { id: chal, label: Challenger }
            - { id: lead, label: Leader }
          solution: { g1: exp, g2: chal, g3: lead }
      - id: acq-table
        widget: Schedule
        hidden: true
        props:
          title: The Costa Coffee deal
          columns: [Fact]
          rows:
            - { label: Price, amounts: [5.1 billion dollars] }
            - { label: Costa revenue, amounts: [1.7 billion dollars] }
            - { label: Cafes, amounts: [3,800 in 32 countries] }
            - { label: Price as a multiple of 2018 EBITDA, amounts: [16.4 times, against 13 times for Starbucks] }
    beats:
      - say: |
          Coke grew its drink list in three ways: new products, taking successful products to new markets, and buying
          companies. It also removed products. A **zombie product** sells so little it adds almost nothing but still uses
          resources.
        define: [zombie]
        gate:
          type: predict
          question: What share of Coke's products produced only about 1 percent of its volume?
          options: [About 5 percent, About 10 percent, About 30 percent, About 60 percent]
          answer: 2
          explain: The case found 30 percent of products produced only 1 percent of volume, and Coke removed over 1,300 in two years.
      - say: |
          Innovation lifted new products from about 15 percent of revenue in 2017 to nearly 25 percent in 2019. [[lift-shift-scale|Lift, shift and scale]] takes a product that works in one country, moves it to others and grows it there, as with Smartwater in more
          than 20 new countries.
        define: [lift-shift-scale]
      - say: |
          Coke sorts brands with the **leader-challenger-explorer framework**. Explorers are small and need only to show
          traction. Challengers are larger but not leaders. Leaders have an edge. Sort three descriptions.
        define: [leader-challenger-explorer]
        show: [lce-sorter]
        gate:
          type: event
          prompt: Match each description to its brand stage.
          target: lce-sorter
          event: solved
          hint: Challengers are at the mercy of the leader.
      - say: |
          Buying companies speeds things up. A **bolt-on acquisition** is a small company with a good product in one place that
          Coke can spread widely. The biggest was Costa Coffee. Analysts questioned the price.
        define: [bolt-on-acquisition]
        hide: [lce-sorter]
        show: [acq-table]
      - say: |
          New acquisitions sit in **Global Ventures**, a group for small, high-potential businesses, kept apart from the
          geographic structure so the large company does not smother them.
        define: [global-ventures]
        hide: [acq-table]
      - say: |
          Coke tracks **organic growth**, which leaves out currency changes and purchases of other companies, and it had met
          its 4 to 6 percent target for ten quarters. Investors still wanted earnings growth, and currency was a major factor.
        define: [organic-growth]
      - say: Check the zombies.
        gate:
          type: practice
          template: zombie-mcq
      - say: And the three brand stages.
        gate:
          type: practice
          template: lce-match
    takeaway: Coke prunes zombies, lifts and shifts winners, and buys small brands into a protected group.

  - id: sustainability
    title: Sugar, water and bottles
    goal: How did Coke respond when critics said its drinks hurt health and the planet?
    skills: [sustainability]
    stage:
      - id: water-table
        widget: Schedule
        hidden: true
        props:
          title: Coke on water
          columns: [Then, Later]
          rows:
            - { label: Water to make one liter of beverage, amounts: ['2.7 liters (2004)', '1.85 liters (2019)'] }
            - { label: Water replenished, amounts: ['81 billion liters (2012)', '273.7 billion liters (2019)'] }
      - id: action-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: a1, label: Smaller packages and calories on the front label }
            - { id: a2, label: Help bottlers use less water }
            - { id: a3, label: Thinner bottles and more recycled material }
            - { id: a4, label: Low- and no-calorie options beside full-sugar drinks }
          bins:
            - { id: sugar, label: Sugar and obesity }
            - { id: water, label: Water }
            - { id: pack, label: Packaging }
          solution: { a1: sugar, a2: water, a3: pack, a4: sugar }
    beats:
      - say: |
          Coke moved from a **social license to operate** that only avoids harm, to a **social license to lead**: helping solve
          a problem, not just avoiding it. Executives said staff faced the barbecue test: friends saying Coke is bad.
        define: [social-license-to-lead]
      - say: |
          On sugar, Coke first funded studies on exercise and was criticized. It then listened to experts and changed its own
          drinks. It cut serving sizes, offered low-calorie versions, reformulated Fanta and put calories on labels.
        gate:
          type: predict
          question: What did Coke emphasize when it shifted away from selling ever-larger sizes?
          options:
            - The consumer experience and value share rather than volume
            - Bigger cups
            - Lower quality
            - Fewer brands
          answer: 0
          explain: Coke moved to smaller packs sold at higher margins and focused on value share.
      - say: |
          On water, an Indian protest in 2002 was a wake-up call. **Water replenishment** means putting back as much water as
          is used in the drinks. Coke put back a liter for each liter and cut its own water use.
        define: [water-replenishment]
        show: [water-table]
      - say: |
          On packaging, Coke thinned bottles, used more recycled material and set goals: all packaging recyclable by 2025 and a
          bottle collected for each one sold by 2030. It backed each **bottle bill**, a refundable deposit on containers.
        define: [bottle-bill]
        hide: [water-table]
        show: [action-sorter]
        gate:
          type: event
          prompt: Put each action under the problem it targets.
          target: action-sorter
          event: solved
          hint: Calories point to sugar. Recycled material points to packaging.
      - say: Check the water numbers.
        hide: [action-sorter]
        gate:
          type: practice
          template: water-mcq
      - say: And the packaging goals.
        gate:
          type: practice
          template: packaging-mcq
      - say: A final thought.
        gate:
          type: reflect
          prompt: Why would a drink company want to help solve water and packaging problems, not just follow the law?
          model: |
            Water and packaging are essential to its business and highly visible. Helping to solve them wins public trust,
            protects its right to operate and gives employees something to be proud of.
    takeaway: Coke tackled sugar, water and packaging to move from avoiding harm to leading on the issues.
