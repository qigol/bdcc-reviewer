intro: |
  The Coca-Cola case ends in early 2020 with a company that has changed a lot and a pandemic that changes everything again.
  Work through four decisions James Quincey's team faced and one big judgment.
case:
  id: coke-decisions
  title: What should Quincey do next?
  story: |
    By 2019 Coca-Cola had revenue of 37.3 billion dollars and had met its organic growth target of 4 to 6 percent for ten
    quarters. Yet its stock lagged PepsiCo and the S&P 500, and 80 percent of its volume was sold outside the U.S., where
    currencies hurt earnings. In 2020 the pandemic cut volume by 25 percent in April. Use only the case's facts when you decide.
  cells:
    - id: defend-or-diversify
      title: Defend the flagship or diversify?
      say: |
        Some executives argue for putting all effort behind red Coke. Quincey sees consumers asking for variety and worrying
        about sugar. The case shows that the company already held more than 50 percent of the global soft drink market by value.
      stage:
        - id: forces-table
          widget: Schedule
          props:
            title: What the case says
            columns: [Fact]
            rows:
              - { label: U.S. soft drink cases, amounts: [Down from 10,377 million in 2004 to 8,520 million in 2018] }
              - { label: Developed markets, amounts: [Three-quarters of drinks are commercial; Coke leads in sparkling] }
              - { label: Developing markets, amounts: [One-quarter of drinks are commercial and rising] }
      decision:
        prompt: Which strategy best fits these facts?
        type: mcq
        options:
          - Grow a range of drinks for all occasions while still growing sparkling
          - Put all effort into red Coke
          - Stop selling soft drinks
          - Sell only in developed markets
        answer: 0
        optionFeedback:
          1: The U.S. cola market is falling, so relying on one product is risky.
        model: Quincey chose to grow beverages beyond fizzy drinks, since consumers want variety, while keeping the strong cola business.
    - id: prune-step
      title: Which product goes?
      say: |
        A review of the portfolio compares three drinks. The numbers below are made-up illustrations of the kind of data Coke
        used when it found that 30 percent of products made only 1 percent of volume.
      stage:
        - id: prune-table
          widget: Schedule
          props:
            title: Three drinks (hypothetical)
            columns: [Share of volume, Growth against its category, Years on the market]
            rows:
              - { label: Drink A, amounts: ['0.1 percent', 'Slower', '12'] }
              - { label: Drink B, amounts: ['0.2 percent', 'About four times faster', '2'] }
              - { label: Drink C, amounts: ['9 percent', 'Equal', '30'] }
      decision:
        prompt: Which drink is the best candidate to be cut as a zombie?
        type: mcq
        options:
          - Drink A, tiny and slow with no sign of traction
          - Drink B, tiny but growing very fast
          - Drink C, large and stable
          - None, all should stay
        answer: 0
        optionFeedback:
          1: An explorer should grow about four times faster than its category, so B is a young explorer.
        model: Drink A sells little and is not gaining traction, so it ties up resources. Drink B fits an explorer and should be given time.
    - id: costa-step
      title: Is Costa worth the price?
      say: |
        Coke paid 5.1 billion dollars for Costa, which had 1.7 billion dollars of revenue and 3,800 cafes in 32 countries. The
        price was 16.4 times 2018 EBITDA, while Starbucks traded at 13 times. Quincey called it a coffee strategy, not a retail
        strategy.
      stage:
        - id: costa-note
          widget: Callout
          props:
            kind: note
            title: Context from the case
            body: Coffee was an 80 billion dollar industry growing over 5 percent a year, JAB and Nestle were buying aggressively, and hot beverages were a segment where Coke had no global brand.
      decision:
        prompt: What is the strongest reason to believe the price may be justified?
        type: mcq
        options:
          - Costa could be taken into many new channels and countries through Coke's system
          - Coke had experience running cafes
          - Starbucks was cheaper, so Costa must be too
          - Costa had no competitors
        answer: 0
        optionFeedback:
          1: The case says Coke had never operated retail stores.
        model: The ideal bolt-on takes a product doing well in a few places and spreads it through the global system, as with Costa's planned cafes in other stores, home coffee and bottled drinks.
    - id: ventures-step
      title: Where should Costa sit?
      say: |
        Costa could be placed inside a geographic region or in Global Ventures, which keeps small high-potential businesses
        independent but draws on Coke's resources.
      stage:
        - id: ventures-note
          widget: Callout
          props:
            kind: tip
            title: Mann's view in the case
            body: "As we put smaller brands into our system, we have sometimes killed them."
      decision:
        prompt: Why did Coke put Costa in Global Ventures?
        type: mcq
        options:
          - To let a small business grow with its own global head while drawing on Coke's network
          - To stop Costa from expanding
          - To save on its pay costs
          - Because regions asked for it
        answer: 0
        model: Global Ventures protects a young business from being overwhelmed, with incentives for the regions to support it.
    - id: judge-step
      title: Your judgment
      say: |
        Consider the whole picture: strategy, culture, bottlers, portfolio and sustainability, and then the pandemic. Quincey
        says Coke has come out stronger from every previous crisis.
      stage:
        - id: judge-note
          widget: Callout
          props:
            kind: note
            title: Question for you
            body: Which part of the plan would you worry about most as COVID-19 closes restaurants and fountains?
      decision:
        prompt: In a few sentences, which part of the transformation would you worry about most in 2020, and why?
        type: open
        model: |
          Strong answers pick one area and tie it to the case. For example, away-from-home sales in restaurants and fountains
          fell sharply, which hits a traditional strength; or the new culture of risk-taking could clash with cost pressure; or
          the bolt-on brands may need cash while currencies are volatile.
atScale:
  title: In practice
  body: |
    A company of this size runs hundreds of launches a year, so it uses a rule for resources by brand stage and reviews the
    portfolio regularly to cut zombies. Corporate teams track organic growth separately from currency and acquisitions so
    investors see the underlying business, and finance teams hedge currency for future foreign cash flows.
tradeoffs:
  title: Ways to grow a portfolio
  columns: [Route, Benefit, Risk]
  rows:
    - [Innovation, 'Fits consumer needs; reuses the brand', 'Most new products fail']
    - [Lift, shift and scale, 'Proven product, global reach', 'Can take years in each new market']
    - [Bolt-on acquisition, Fast access to a growing brand, Price risk and integration risk]
connections:
  - module: org-design
    note: Coke's geographic structure, profit centers and Global Ventures show how structure follows strategy.
  - module: intl-finance-fx
    note: The case notes that currency held back earnings growth, which the finance module explains through exposure and hedging.
  - module: competitive-strategy
    note: The move from one flagship to many brands is a change in competitive strategy.
explainBack:
  prompt: |
    Explain to a friend why Coca-Cola changed from a one-product company to a total beverage company, and name two steps
    it took.
  rubric:
    - Names at least two forces behind falling soft drink sales
    - Describes refranchising or an asset-light approach and the portfolio steps (zombies, lift and shift, acquisitions)
    - Mentions culture or structure as part of the change
