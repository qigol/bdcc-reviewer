terms:
  - id: csd
    term: Carbonated soft drink
    aka: [CSD, sparkling]
    short: A sweet, fizzy, non-alcoholic drink such as a cola.
    related: [stills]
    skills: [coke-history]
  - id: stills
    term: Stills
    short: Coke's word for drinks without fizz, such as water, juice, tea and coffee.
    related: [csd]
    skills: [strategy-culture]
  - id: concentrate-producer
    term: Concentrate producer
    short: A company that makes the secret flavor base of a drink and sells it to bottlers, while building the brand.
    related: [bottler]
    skills: [bottler-model]
  - id: bottler
    term: Bottler
    short: A company that mixes the concentrate with water and sweetener, fills bottles or cans, and delivers them to shops.
    related: [concentrate-producer, refranchising]
    skills: [bottler-model]
  - id: pepsi-challenge
    term: Pepsi Challenge
    short: Blind taste tests, first shown in ads in 1975, in which many Coke drinkers said they preferred Pepsi.
    related: [csd, new-coke-syndrome]
    skills: [coke-history]
  - id: new-coke-syndrome
    term: New Coke Syndrome
    short: A fear of failure that makes a company too cautious, named after the failed 1985 launch of New Coke.
    related: [pepsi-challenge, total-beverage-company]
    skills: [strategy-culture]
  - id: refranchising
    term: Refranchising
    short: Selling company-owned bottling operations back to independent local partners.
    related: [asset-light-strategy]
    skills: [bottler-model]
  - id: asset-light-strategy
    term: Asset-light strategy
    short: Owning few factories and trucks and letting partners do the heavy work, to lift margins and speed.
    related: [refranchising]
    skills: [bottler-model]
  - id: sugar-tax
    term: Sugar tax
    short: A tax on sugary drinks, charged to cut how much of them people drink.
    related: [csd, stills, total-beverage-company]
    skills: [industry-forces]
  - id: total-beverage-company
    term: Total beverage company
    short: A company that sells drinks for every taste and occasion, not just its original flagship drink.
    related: [csd, stills, lift-shift-scale]
    skills: [strategy-culture]
  - id: value-share
    term: Value share
    short: A brand's share of the money spent in a category, which can grow even if units sold do not.
    related: [organic-growth, total-beverage-company]
    skills: [strategy-culture]
  - id: profit-center
    term: Profit center
    short: A part of a company, such as a country unit, that is responsible for its own profit.
    related: [global-ventures, concentrate-producer]
    skills: [strategy-culture]
  - id: global-ventures
    term: Global Ventures
    short: Coke's group for small, fast-growing brands, kept apart from the geographic structure so the big company does not smother them.
    related: [leader-challenger-explorer, bolt-on-acquisition, profit-center]
    skills: [portfolio-growth, strategy-culture]
  - id: zombie
    term: Zombie product
    short: A product that sells so little it adds almost nothing, yet still takes up resources.
    related: [leader-challenger-explorer, total-beverage-company]
    skills: [portfolio-growth]
  - id: lift-shift-scale
    term: Lift, shift and scale
    short: Taking a product that works in one country, moving it to new markets and growing it there.
    related: [bolt-on-acquisition, global-ventures]
    skills: [portfolio-growth]
  - id: leader-challenger-explorer
    term: Leader-challenger-explorer framework
    short: A way to give resources by brand stage, small explorers, mid-sized challengers and leaders of their market.
    related: [global-ventures, zombie, lift-shift-scale]
    skills: [portfolio-growth]
  - id: bolt-on-acquisition
    term: Bolt-on acquisition
    short: Buying a small company with a good product in one place, then spreading it widely through your own system.
    related: [lift-shift-scale, organic-growth]
    skills: [portfolio-growth]
  - id: organic-growth
    term: Organic growth
    short: Growth from existing business, leaving out currency changes and purchases of other companies.
    related: [value-share, bolt-on-acquisition]
    skills: [portfolio-growth]
  - id: social-license-to-lead
    term: Social license to lead
    short: Going beyond avoiding harm to help solve a community or global problem, which earns public trust.
    related: [water-replenishment, bottle-bill]
    skills: [sustainability]
  - id: water-replenishment
    term: Water replenishment
    short: Putting back into nature as much water as a company uses in its drinks.
    related: [social-license-to-lead, bottler]
    skills: [sustainability]
  - id: bottle-bill
    term: Bottle bill
    short: A law that charges a refundable deposit on drink containers to encourage returning them.
    related: [social-license-to-lead, bottler]
    skills: [sustainability]
