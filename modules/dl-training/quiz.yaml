  - id: reg-explain
    type: explain
    skills: [early-stopping, dropout, l2]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: l2 }
    prompt: Explain how early stopping, dropout and L2 each reduce overfitting, and why their effect must be checked on validation data.
    model: |
      Early stopping ends training once validation loss stops improving and restores the best weights, so the model
      never reaches the epochs that memorize noise. Dropout switches off random hidden units in each training step, so
      no unit can depend on fragile partners. L2 charges for large weights, keeping the function smooth. Each makes
      training harder or shorter; too much of any causes underfitting, so only validation loss can show whether it
      helped.
    checklist:
      - Early stopping uses validation loss, patience and restores the best epoch
      - Dropout drops random units during training only
      - L2 penalizes large weights, which keeps the function smooth
      - Too much regularization underfits, so check on validation data
    hints: [What does each one change, and what can go wrong with too much?]
    explanation: Three different brakes on memorizing; validation evidence decides how hard to press.
