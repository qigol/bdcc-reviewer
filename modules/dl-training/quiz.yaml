  - id: stop-mcq
    type: mcq
    skills: [early-stopping]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: early-stopping }
    prompt: Why does early stopping use a patience of several epochs instead of stopping at the first worse epoch?
    options:
      - Validation curves are noisy; one bad epoch should not end training
      - Patience makes each epoch faster
      - It guarantees the lowest possible training loss
      - The first worse epoch is always the best epoch
    answer: 0
    optionFeedback:
      '1': Patience changes when training stops, not how fast an epoch runs.
      '2': Early stopping deliberately stops before training loss is lowest.
      '3': A loss can dip again after a bump.
    explanation: Very short patience can stop on a temporary plateau; very long patience wastes epochs.
    variants:
      - prompt: 'The baseline ran 1,000 epochs (validation loss 0.484); early stopping stopped at 136 (0.235). What does that show?'
        options:
          - Stopping near the best epoch avoided the overfitting of the long run
          - Early stopping always trains for exactly 136 epochs
          - More epochs always help
          - The baseline used a different network
        answer: 0
        optionFeedback:
          '1': The stopping epoch depends on the curve and the patience.
          '2': The long run's validation loss doubled.
          '3': Same network; only early stopping was added.
        explanation: Early stopping chooses the number of epochs from validation data during one run.
      - prompt: What does the minimum improvement δ protect against?
        options:
          - Counting a tiny, meaningless drop as a real improvement
          - Training for too few epochs
          - Exploding gradients
          - Overly large weights
        answer: 0
        optionFeedback:
          '1': It can make training stop sooner, not later.
          '2': That is gradient clipping's job.
          '3': That is L2's job.
        explanation: Only a drop larger than δ resets the patience counter.

  - id: code-stop
    type: code-fill
    skills: [early-stopping]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: early-stop }
    prompt: Complete the notebook's early-stopping rule.
    code: |
      def find_stopping_point(val_losses, patience, min_delta):
          best_loss, best_epoch, wait = float("inf"), 0, 0
          for epoch, loss in enumerate(val_losses, start=1):
              if loss < __BLANK_1__:
                  best_loss, best_epoch, wait = loss, epoch, 0
              else:
                  wait += 1
              if wait >= __BLANK_2__:
                  return best_epoch, epoch
          return best_epoch, len(val_losses)
    blanks:
      '1': { accept: ['best_loss - min_delta', 'best_loss-min_delta'] }
      '2': { accept: ['patience'] }
    hints:
      - An improvement must beat the best by more than δ.
    explanation: '`loss < best_loss - min_delta`, and stop when `wait >= patience`.'

