terms:
  - id: model
    term: model
    short: A recipe with adjustable numbers that turns the facts we know about a case into a guess about what we want to know.
    related: [training, parameter]
    skills: [params-vs-hyper]

  - id: training
    term: training
    aka: [learning, fitting]
    short: Adjusting a model's numbers using examples with known answers, so its guesses get closer to those answers.
    related: [model, loss, epoch]
    skills: [params-vs-hyper]

  - id: weight
    term: weight
    aka: [w, connection weight]
    short: The number on one connection that says how strongly, and in which direction, an input pushes the unit it feeds.
    related: [bias, parameter]
    skills: [params-vs-hyper]

  - id: bias
    term: bias
    aka: [b, intercept]
    short: A number added to a unit's sum after the weighted inputs, so the unit can fire earlier or later.
    related: [weight, parameter]
    skills: [params-vs-hyper]

  - id: parameter
    term: parameter
    aka: [trainable parameter, θ, theta]
    short: A number the model learns during training; in a neural network, every weight and every bias.
    related: [weight, bias, hyperparameter]
    skills: [params-vs-hyper]

  - id: hyperparameter
    term: hyperparameter
    aka: [hyperparameters, setting]
    short: A setting we choose before or around training, such as the learning rate or dropout rate, rather than one training learns.
    long: |
      Three families: architecture (layers, units), optimization (the [[learning-rate]], [[training-batch]] size, epochs,
      [[momentum]], [[optimizer]]) and regularization ([[dropout]], [[l2-regularization|L2]], [[early-stopping]]).
      They are chosen on the [[validation-set]].
    related: [parameter, validation-set]
    skills: [params-vs-hyper, hp-selection]

  - id: loss
    term: loss
    aka: [L, error, binary cross-entropy]
    short: One number that measures how wrong the predictions are; training tries to make it small.
    related: [training, gradient]
    skills: [params-vs-hyper, learning-rate]

  - id: gradient
    term: gradient
    aka: [∇L, slope]
    short: The list of slopes of the loss, one per parameter, pointing in the direction where the loss rises fastest.
    related: [loss, gradient-descent]
    skills: [learning-rate]

  - id: gradient-descent
    term: gradient descent
    short: The update that moves every parameter a small step against its loss gradient, the direction that lowers the loss.
    formula: '\theta \leftarrow \theta - \eta\,\nabla_\theta L'
    related: [gradient, learning-rate]
    skills: [learning-rate]

  - id: learning-rate
    term: learning rate
    aka: [η, eta, step size]
    short: The small number η ("eta") that sets how big each gradient-descent step is.
    long: Too small creeps; too large bounces or diverges. Each [[optimizer]] needs its own.
    related: [gradient-descent, divergence]
    skills: [learning-rate]

  - id: divergence
    term: divergence
    aka: [diverge, diverges]
    short: When steps overshoot so far that the loss grows instead of shrinking, step after step.
    related: [learning-rate]
    skills: [learning-rate]

  - id: training-batch
    term: batch
    aka: [mini-batch, B, batch size]
    short: The group of training examples used to compute one gradient.
    related: [update-step, epoch, mini-batch-gd]
    skills: [batch-size]

  - id: update-step
    term: step
    aka: [update, iteration]
    short: One parameter update, made from the gradient of one batch.
    related: [training-batch, epoch]
    skills: [batch-size]

  - id: epoch
    term: epoch
    aka: [epochs]
    short: One full pass of training through every example in the training set.
    related: [training-batch, update-step, early-stopping]
    skills: [batch-size]

  - id: mini-batch-gd
    term: mini-batch gradient descent
    aka: [full-batch gradient descent, stochastic gradient descent]
    short: Updating after each small batch, between full-batch (one step per epoch) and stochastic (one example per step).
    formula: '\lceil N / B \rceil \text{ steps per epoch}'
    related: [training-batch, update-step]
    skills: [batch-size]

  - id: momentum
    term: momentum
    aka: [β, beta, velocity]
    short: Keeping a running direction that blends in recent steps, so consistent directions speed up and jitter cancels.
    formula: 'v_t = \beta v_{t-1} + g_t, \quad \theta_t = \theta_{t-1} - \eta v_t'
    related: [optimizer, sgd]
    skills: [momentum]

  - id: optimizer
    term: optimizer
    short: The rule that turns gradients into parameter updates, such as SGD, SGD with momentum, or Adam.
    related: [sgd, adam, momentum]
    skills: [optimizers]

  - id: sgd
    term: SGD
    aka: [stochastic gradient descent, plain SGD]
    short: The plain update that moves every parameter by the same multiple η of its own gradient.
    related: [optimizer, momentum]
    skills: [optimizers]

  - id: adam
    term: Adam
    aka: [AdamW]
    short: An optimizer with momentum that also scales each parameter's step by the size of its recent gradients.
    long: Its first step has size about η for every parameter, however large or small the gradient. AdamW applies [[weight-decay]] separately.
    related: [optimizer, sgd]
    skills: [optimizers]

  - id: training-set
    term: Training set
    aka: [training data, training split]
    short: The part of the data the model learns from.
    related: [validation-set, test-set]
    skills: [hp-selection]

  - id: validation-set
    term: validation set
    aka: [validation data, val]
    short: Data held back from training and checked after every epoch, to watch for overfitting and compare models.
    related: [training-set, test-set, hyperparameter]
    skills: [hp-selection]

  - id: test-set
    term: Test set
    aka: [test data, test split]
    short: Data kept aside and never shown during learning, used at the end to check how well the model really does.
    related: [validation-set]
    skills: [hp-selection]

  - id: feature-standardization
    term: standardization
    aka: [scaling, z-score]
    short: Subtracting a mean and dividing by a standard deviation, both computed from the training set only.
    formula: 'z = (x - \mu_{\text{train}})/\sigma_{\text{train}}'
    related: [training-set]
    skills: [hp-selection]

  - id: underfitting
    term: underfitting
    aka: [underfit]
    short: When a model has not captured the pattern yet, so both training and validation loss stay high.
    related: [overfitting, regularization]
    skills: [diagnose]

  - id: overfitting
    term: Overfitting
    aka: [overfit, memorize]
    short: When a model memorizes the exact examples it learned from instead of the general pattern, so it does worse on new cases.
    long: On curves, training loss keeps falling while [[validation-set|validation]] loss rises.
    related: [underfitting, regularization, generalization]
    skills: [diagnose]

  - id: generalization
    term: generalization
    aka: [generalize]
    short: How well a model does on new data it was not trained on.
    related: [overfitting, validation-set]
    skills: [diagnose]

  - id: regularization
    term: regularization
    short: Any change to training meant to reduce overfitting, usually by making the learned function smoother or the task slightly harder.
    long: '[[early-stopping]], [[dropout]] and [[l2-regularization]] are examples. Too much causes [[underfitting]].'
    related: [overfitting, underfitting]
    skills: [diagnose]

  - id: early-stopping
    term: early stopping
    short: Stopping training once validation loss stops improving, then going back to the weights of the best epoch.
    related: [patience, min-delta, epoch]
    skills: [early-stopping]

  - id: patience
    term: patience
    short: How many epochs in a row without improvement early stopping tolerates before it stops.
    related: [early-stopping, min-delta]
    skills: [early-stopping]

  - id: min-delta
    term: minimum improvement
    aka: [δ, delta, min_delta]
    short: How much a new validation loss must beat the best so far to count as an improvement.
    related: [early-stopping, patience]
    skills: [early-stopping]

  - id: dropout
    term: dropout
    aka: [nn.Dropout, dropout rate, p]
    short: Switching off a random share of a layer's values during training only, so the network cannot lean on any single one.
    related: [inverted-dropout, regularization]
    skills: [dropout]

  - id: inverted-dropout
    term: inverted dropout
    aka: [rescaling, 1/(1 − p)]
    short: Scaling the units that survive dropout by 1/(1 − p), so the signal keeps the same overall strength as at prediction time.
    related: [dropout]
    skills: [dropout]

  - id: l2-regularization
    term: L2 regularization
    aka: [L2 penalty, λ, lambda, ridge penalty]
    short: Adding λ/2 times the sum of squared weights to the loss, which charges the network for large weights.
    formula: 'L_{\text{total}} = L_{\text{data}} + \frac{\lambda}{2}\sum w^2'
    related: [weight-decay, regularization]
    skills: [l2]

  - id: weight-decay
    term: weight decay
    short: The shrinking of every weight by a small fraction at each step that the L2 penalty causes under SGD.
    formula: 'w \leftarrow (1 - \eta\lambda)\,w - \eta g'
    related: [l2-regularization, adam]
    skills: [l2]
