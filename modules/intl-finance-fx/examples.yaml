examples:
  - id: term-exchange-rate
    source: "INTB 3355 Module 15, International Accounting and Financial Management (Session 26): glossary term Exchange rate"
    fn: termLookup
    in:
      term: exchange-rate
    expect:
      name: Exchange rate
      meaning: The price of one currency in another, such as 58 pesos for one dollar.
  - id: term-natural-hedge
    source: "INTB 3355 Module 15, International Accounting and Financial Management (Session 26): glossary term Natural hedge"
    fn: termLookup
    in:
      term: natural-hedge
    expect:
      name: Natural hedge
      meaning: Earning and spending in the same currency so that rate moves cancel each other out.
  - id: term-multilateral-netting
    source: "INTB 3355 Module 15, International Accounting and Financial Management (Session 26): glossary term Multilateral
      netting"
    fn: termLookup
    in:
      term: multilateral-netting
    expect:
      name: Multilateral netting
      meaning: Subsidiaries send only their net amounts through a central clearing center, which means fewer payments and
        lower costs.
  - id: term-translation-exposure
    source: "INTB 3355 Module 15, International Accounting and Financial Management (Session 26): glossary term Translation
      exposure"
    fn: termLookup
    in:
      term: translation-exposure
    expect:
      name: Translation exposure
      meaning: The risk that foreign results look bigger or smaller when converted into the home currency for reports.
  - id: term-capital-structure
    source: "INTB 3355 Module 15, International Accounting and Financial Management (Session 26): glossary term Capital
      structure"
    fn: termLookup
    in:
      term: capital-structure
    expect:
      name: Capital structure
      meaning: How a firm raises its money, through its own profits, new shares or borrowing.
