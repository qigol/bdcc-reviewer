terms:
  - id: exchange-rate
    term: Exchange rate
    short: The price of one currency in another, such as 58 pesos for one dollar.
    related: [exposure, transaction-exposure, forward-contract]
    skills: [fx-exposure]
  - id: exposure
    term: Exposure
    short: The amount of money a firm could gain or lose when an exchange rate moves.
    related: [hedge]
    skills: [fx-exposure]
  - id: hedge
    term: Hedge
    short: A step that reduces the risk of losing money when exchange rates or prices move.
    related: [natural-hedge]
    skills: [fx-exposure]
  - id: natural-hedge
    term: Natural hedge
    short: Earning and spending in the same currency so that rate moves cancel each other out.
    related: [hedge]
    skills: [fx-exposure, hedging]
  - id: transaction-exposure
    term: Transaction exposure
    aka: [deal risk]
    short: The risk that an exchange rate moves between signing a deal and getting paid.
    related: [translation-exposure, economic-exposure]
    skills: [fx-exposure]
  - id: translation-exposure
    term: Translation exposure
    aka: [report-card risk]
    short: The risk that foreign results look bigger or smaller when converted into the home currency for reports.
    related: [transaction-exposure, economic-exposure]
    skills: [fx-exposure, translation-accounting]
  - id: economic-exposure
    term: Economic exposure
    aka: [competition risk, operating exposure]
    short: The long-run effect of exchange rate changes on a firm's value, because they change who has the cheaper product.
    related: [transaction-exposure, translation-exposure]
    skills: [fx-exposure]
  - id: partial-pass-through
    term: Partial pass-through
    short: Firms neither absorb the full cost of a currency move nor pass all of it on in prices.
    related: [economic-exposure]
    skills: [fx-exposure]
  - id: forward-contract
    term: Forward contract
    aka: [forward market hedge]
    short: An agreement today to buy or sell a currency at a fixed rate on a future date.
    related: [currency-option]
    skills: [hedging]
  - id: currency-option
    term: Currency option
    short: The right, but not the duty, to buy or sell a set amount of currency at a set rate, bought for a fee.
    related: [forward-contract]
    skills: [hedging]
  - id: money-market-hedge
    term: Money market hedge
    short: Borrowing and lending in the home and foreign money markets so that a future payment is covered.
    related: [hedge, forward-contract, covered-interest-rate-parity]
    skills: [hedging]
  - id: swap-contract
    term: Swap contract
    short: A spot sale or purchase of an asset paired with a future purchase or sale of an equal amount.
    related: [hedge, forward-contract]
    skills: [hedging]
  - id: covered-interest-rate-parity
    term: Covered interest rate parity
    aka: [CIRP]
    short: The percentage gap between forward and spot exchange rates should equal the gap in interest rates between two countries.
    related: [forward-contract, money-market-hedge, exchange-rate]
    skills: [hedging]
  - id: multilateral-netting
    term: Multilateral netting
    short: Subsidiaries send only their net amounts through a central clearing center, which means fewer payments and lower costs.
    related: [international-finance-center, leading-and-lagging, transaction-exposure]
    skills: [cash-management, hedging]
  - id: leading-and-lagging
    term: Leading and lagging
    short: Paying or collecting money earlier or later than due, depending on where a currency is expected to go.
    related: [multilateral-netting, transaction-exposure]
    skills: [cash-management]
  - id: fronting-loan
    term: Fronting loan
    short: A loan from a parent to a subsidiary made through an intermediary, usually a bank.
    related: [subsidiary, international-finance-center]
    skills: [cash-management]
  - id: transfer-pricing
    term: Transfer pricing
    short: The prices charged for goods and services sold between members of the same company.
    related: [subsidiary, income-tax, controlled-foreign-corporation]
    skills: [cash-management]
  - id: international-finance-center
    term: International finance center
    short: A central unit that handles a multinational's cash, funding and currency risk for all its subsidiaries.
    related: [multilateral-netting, fronting-loan, exposure]
    skills: [cash-management]
  - id: functional-currency
    term: Functional currency
    short: The main currency in which a business operates and earns its money.
    related: [translation-exposure, current-rate-method, temporal-method]
    skills: [translation-accounting]
  - id: consolidation
    term: Consolidation
    short: Translating the results of subsidiaries and adding them into one financial report.
    related: [subsidiary, translation-exposure, current-rate-method, temporal-method]
    skills: [translation-accounting]
  - id: current-rate-method
    term: Current rate method
    short: A way of translating where assets and liabilities are valued at the current spot rate.
    related: [temporal-method]
    skills: [translation-accounting]
  - id: temporal-method
    term: Temporal method
    short: A way of translating where money-type items use the spot rate and items kept at historical cost use their historical rates.
    related: [current-rate-method]
    skills: [translation-accounting]
  - id: gaap
    term: GAAP
    aka: [generally accepted accounting principles]
    short: The detailed accounting rules followed in the United States.
    related: [ifrs]
    skills: [translation-accounting]
  - id: ifrs
    term: IFRS
    aka: [International Financial Reporting Standards]
    short: The shared accounting principles set by the International Accounting Standards Board and used in most of the world.
    related: [gaap]
    skills: [translation-accounting]
  - id: triple-bottom-line
    term: Triple-bottom-line accounting
    aka: [3BL, TBL]
    short: A report to stakeholders on a company's environmental, social and financial results.
    related: [gaap, ifrs]
    skills: [translation-accounting]
  - id: capital-structure
    term: Capital structure
    short: How a firm raises its money, through its own profits, new shares or borrowing.
    related: [american-depositary-receipt, offshore-financial-center]
    skills: [capital-structure]
  - id: american-depositary-receipt
    term: American depositary receipt
    aka: [ADR]
    short: A foreign share held by a custodian bank in the issuer's home market and traded in dollars on a U.S. exchange.
    related: [capital-structure, gaap]
    skills: [capital-structure]
  - id: offshore-financial-center
    term: Offshore financial center
    aka: [tax haven]
    short: A place that specializes in financing people and firms from elsewhere, with low taxes and few banking rules.
    related: [capital-structure, income-tax, withholding-tax]
    skills: [capital-structure]
  - id: income-tax
    term: Income tax
    short: A direct tax charged on earnings.
    related: [value-added-tax, withholding-tax, branch]
    skills: [taxation]
  - id: value-added-tax
    term: Value-added tax
    aka: [VAT]
    short: An indirect tax collected from the parties as they add value to a product.
    related: [income-tax, withholding-tax]
    skills: [taxation]
  - id: withholding-tax
    term: Withholding tax
    short: An indirect tax paid by the payer, usually on passive income such as interest or royalties.
    related: [income-tax, value-added-tax, subsidiary]
    skills: [taxation]
  - id: branch
    term: Branch
    short: A foreign operation that is a legal extension of the parent company.
    related: [subsidiary]
    skills: [taxation]
  - id: subsidiary
    term: Subsidiary
    short: A foreign operation that is a separate legal entity owned by the parent company.
    related: [branch, controlled-foreign-corporation]
    skills: [taxation]
  - id: controlled-foreign-corporation
    term: Controlled foreign corporation
    aka: [CFC]
    short: A foreign subsidiary in which the parent owns more than 50 percent.
    related: [subsidiary]
    skills: [taxation]
