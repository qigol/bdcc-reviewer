sections:
  - id: key-terms
    title: Key terms lookup
    skills:
      - fx-exposure
      - hedging
      - cash-management
      - translation-accounting
      - capital-structure
      - taxation
    summary: "A placeholder section: this module is conceptual, so the workbench only looks up the meaning of its key terms.
      Pick a term to see what it means."
    keyFormula: \text{term} \rightarrow \text{meaning}
    state:
      term: exchange-rate
    derive:
      - fn: termLookup
        in:
          term: "@term"
        out: k
    live:
      - id: r
        widget: Readout
        props:
          items:
            - label: Term
              value: "{=k.name}"
              tone: accent
            - label: Meaning
              value: "{=k.meaning}"
              tone: good
      - id: pick
        widget: Choice
        props:
          label: Term
          options:
            - value: exchange-rate
              label: Exchange rate
            - value: natural-hedge
              label: Natural hedge
            - value: multilateral-netting
              label: Multilateral netting
            - value: translation-exposure
              label: Translation exposure
            - value: capital-structure
              label: Capital structure
        bind:
          value: term
    steps:
      - tex: |
          \anchor{lookup}{\text{term}} ;\mapsto; \text{meaning}
        say: Each term has one meaning in this lecture.
      - tex: |
          \anchor{answer}{\text{meaning}} = \text{{=k.name|text}}
        say: "{=k.name}: {=k.meaning}"
    code:
      lang: python
      title: A term lookup
      source: |
        TERMS = {
            "exchange-rate": "Exchange rate",
            "natural-hedge": "Natural hedge",
            "multilateral-netting": "Multilateral netting",
            "translation-exposure": "Translation exposure",
            "capital-structure": "Capital structure",
        }

        def term_lookup(term):
            """Look up a key term from the lecture.

            Args:
                term: the term's id.
            Returns:
                The term's name.
            Placeholder: this module is conceptual; see the Intuition tab.
            """
            name = TERMS[term]       # @a:lookup
            return name              # @a:answer
    links:
      - anchor: lookup
        label: Find the term
      - anchor: answer
        label: Its meaning
    trace:
      fn: termLookup
      in:
        term: "@term"
    examples:
      - term-exchange-rate
      - term-natural-hedge
      - term-multilateral-netting
      - term-translation-exposure
      - term-capital-structure
    tryIt:
      - exposure-match
      - peso-loss-mcq
    pitfalls:
      - Memorizing the term without the idea behind it. The Intuition tab explains each one.
    examTip: "Exam questions on this lecture are conceptual: know what each term means and when it applies."
