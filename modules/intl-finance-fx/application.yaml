intro: |
  Managing currency risk is mostly a set of decisions made with incomplete knowledge. Work through a small exporter's
  choice, then look at how two real consumer-goods giants described their currency years in a guest session.
case:
  id: fx-decisions
  title: Three firms, one problem
  story: |
    A Cebu furniture exporter must choose how to protect a dollar order. Then you read how Unilever and Coca-Cola
    explained the effect of currencies on their results in the guest session, using the figures given there.
  cells:
    - id: exporter-choice
      title: The exporter's choice
      say: |
        The exporter ships USD 100,000, payable in 90 days. Today's rate is 58 pesos per dollar. The owner needs at least
        5.6 million pesos on payday for payroll and suppliers. The rate on payday could be 55, 58 or 61. A forward locks 58.
        An option costs 100,000 pesos and lets the owner sell at 58 if the market is worse, or at the market rate if better.
      stage:
        - id: answer-table
          widget: Schedule
          hidden: true
          props:
            title: Pesos received (millions)
            columns: [Rate 55, Rate 58, Rate 61]
            rows:
              - { label: Wait, amounts: ['5.5', '5.8', '6.1'] }
              - { label: Forward, amounts: ['5.8', '5.8', '5.8'] }
              - { label: Option, amounts: ['5.7', '5.7', '6.0'] }
      decision:
        prompt: Which choice makes sure the owner always has at least 5.6 million pesos while keeping most of the upside if the peso weakens?
        type: mcq
        options:
          - Buy the currency option
          - Wait and convert at the payday rate
          - Lock in with a forward
          - Ask the customer to pay half later
        answer: 0
        optionFeedback:
          2: The forward guarantees the amount but gives up the upside.
          1: Waiting can fall below 5.6 million if the rate is 55.
        model: The option guarantees at least 5.7 million after the fee, and still gives 6.0 million at a rate of 61. A forward fixes 5.8 million and loses the upside. Waiting can fall short.
    - id: unilever-year
      title: Unilever's year
      say: |
        Unilever reports in euros and sells in 190 countries, with emerging markets at 59 percent of 2025 sales. In 2025
        its underlying sales grew 3.5 percent, 1.5 from selling more and 2.0 from higher prices. Yet reported turnover fell 3.8
        percent to 50.5 billion euros, and currency alone cut 5.9 points.
      stage:
        - id: unilever-note
          widget: Callout
          props:
            kind: note
            title: From the guest session
            body: The company reports growth both with and without currency effects. Currency also cut 8.8 points from underlying earnings per share.
      decision:
        prompt: Did Unilever's business get worse in 2025?
        type: mcq
        options:
          - No. Its underlying business grew, but euro value of sales earned in weaker currencies shrank
          - Yes. Its customers left
          - Yes. It stopped raising prices
          - No. Nothing at all changed
        answer: 0
        optionFeedback:
          1: Underlying sales grew by 3.5 percent, so customers did not leave.
        model: The business grew 3.5 percent. The reported decline came from translation exposure, the report-card risk, which is why firms report growth with and without currency.
    - id: coke-year
      title: Coca-Cola's year
      say: |
        Coca-Cola sells in more than 200 countries. In 2025, 84 percent of its drinks by volume were sold outside the U.S.
        In the first nine months of 2026 about 61 percent of its revenue, 24.0 billion of 39.2 billion dollars, came from
        outside the U.S. Currency added about 2 points to earnings growth in the third quarter. The firm expects about a
        3 percent boost to full-year comparable earnings per share, and a slight drag in 2027.
      stage:
        - id: coke-note
          widget: Callout
          props:
            kind: note
            title: How Coca-Cola protects itself
            body: It uses forwards, options and collars for future foreign cash flows, matches debt to foreign businesses, and sells through local bottling partners close to customers and their currency.
      decision:
        prompt: Currency helped Coca-Cola in 2026. Why might it still hedge?
        type: mcq
        options:
          - The same move can reverse, and hedging lets it plan budgets, prices and dividends
          - Hedging always increases profit
          - Currency can never help again
          - Hedging is required by every government
        answer: 0
        model: Coca-Cola already expects a slight drag in 2027. Hedging gives predictability, not extra profit.
    - id: crisis-step
      title: A market in crisis
      say: |
        In one of its big markets a currency has lost half its value in a year and prices are rising fast. You are the
        finance leader of the firm. Pick the best response from the list.
      stage:
        - id: crisis-tree
          widget: Tree
          props:
            root:
              id: moves
              label: Possible moves
              children:
                - { id: p, label: Raise prices }
                - { id: l, label: Buy and make more locally }
                - { id: h, label: Hedge only the payments you can predict }
                - { id: r, label: Report growth with and without currency }
      decision:
        prompt: Which of these moves adjusts the business for the long run rather than locking in or matching?
        type: mcq
        options:
          - Raising prices and buying and making more locally
          - Buying a forward contract
          - Matching the currency of debt with the currency of earnings
          - Netting payments among subsidiaries
        answer: 0
        optionFeedback:
          1: A forward locks in a rate.
          2: Matching earns and spends in the same currency.
        model: Changing prices, suppliers and where you produce adjusts the business and helps against competition risk. Forwards lock in, and matching and netting match.
    - id: netting-step
      title: Cutting the payments
      say: |
        A group has subsidiaries that owe each other money. Without netting, eight payments and 1.2 million dollars are in
        transit. The treasurer wants fewer payments and lower costs.
      stage:
        - id: netting-note
          widget: Callout
          props:
            kind: note
            title: The treasurer's note
            body: Each subsidiary should send or receive only one net amount through a central clearing center.
      decision:
        prompt: Which technique does the treasurer describe, and how many payments would the lecture's example need?
        type: mcq
        options:
          - Multilateral netting, which would need four payments
          - A swap contract, which would need eight payments
          - Transfer pricing, which would need two payments
          - A fronting loan, which would need six payments
        answer: 0
        model: Multilateral netting cuts the example from eight transactions to four and from 1.2 million dollars in transit to 600,000, lowering FX transaction costs.
atScale:
  title: In practice
  body: |
    Treasurers set limits on how much currency exposure the company will accept and hedge the rest with forwards and
    options. Many group treasury centers pool cash, run back-to-back loans between subsidiaries and cover leftover gaps with
    forward contracts. Finance teams report results with and without currency, so investors can see the underlying business.
tradeoffs:
  title: Ways to handle a foreign payment
  columns: [Choice, Benefit, Cost or risk]
  rows:
    - [Wait, No fee and keeps all upside, Can leave the firm short]
    - [Forward, A fixed amount you can plan on, Gives up the upside]
    - [Option, 'Floor on the downside with most of the upside', A fee whatever happens]
connections:
  - module: monetary-system
    note: Exchange rate systems explain why currencies move and why firms must manage the risk.
  - module: org-design
    note: Transfer pricing and control of subsidiaries link accounting to the structure of the firm.
  - module: case-coca-cola
    note: The Coca-Cola case describes how currency held back earnings in 2019, a 2021 view of the same risk.
  - module: case-unilever-brazil
    note: The Unilever case shows a firm selling in local currencies and prices in a market with high inflation risk.
explainBack:
  prompt: |
    Explain to a friend why a firm that sold more can still report smaller sales, and which three moves firms use to protect
    themselves.
  rubric:
    - Names translation exposure and the report-card idea
    - Describes lock it in, match it and adjust the business
    - Gives an example of a hedge outcome using the peso order
