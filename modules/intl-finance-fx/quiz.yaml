templates:
  # ------------------------------------------------------------------ fx-exposure
  - id: peso-loss-mcq
    type: mcq
    skills: [fx-exposure]
    difficulty: 1
    tags: [application]
    lessonRef: { tab: intuition, id: fx-basics }
    prompt: A Cebu exporter is paid USD 100,000 after 90 days. The rate was 58 pesos per dollar at signing and 55 on payday. How many pesos arrive, and what happened?
    options:
      - 5.5 million pesos arrive, 300,000 less than budgeted, because the peso strengthened
      - 5.8 million pesos arrive, exactly as budgeted
      - 6.1 million pesos arrive, a gain, because the peso strengthened
      - 5.5 million pesos arrive, a gain, because the peso weakened
    answer: 0
    hints:
      - Multiply the dollars by the payday rate.
      - A stronger peso means fewer pesos per dollar.
    explanation: At 55 pesos per dollar, USD 100,000 is 5.5 million pesos, 300,000 less than the 5.8 million budgeted. The loss comes from the gap between signing and settling.

  - id: weak-peso-mcq
    type: mcq
    skills: [fx-exposure]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: fx-basics }
    prompt: The peso weakens from 58 to 64 per dollar. Who is most likely to be better off?
    options:
      - A Philippine exporter paid in dollars
      - A firm that imports dollar-priced materials
      - A family paying dollar-priced school fees abroad
      - A firm with large dollar debts
    answer: 0
    hints:
      - A weaker peso means each dollar buys more pesos.
    explanation: A weaker peso makes imports pricier and Philippine exports cheaper abroad, so dollar earners gain and dollar payers lose.

  - id: exposure-match
    type: match
    skills: [fx-exposure]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: three-exposures }
    prompt: Match each plain name to its textbook term.
    pairs:
      - ['The deal risk', '[[transaction-exposure|Transaction exposure]]']
      - ['The report-card risk', '[[translation-exposure|Translation exposure]]']
      - ['The competition risk', '[[economic-exposure|Economic exposure]]']
    hints:
      - The report card is about what is printed in the annual report.
    explanation: Each exposure affects a different part of the firm, from one payment to the whole competitive position.

  - id: exposure-case-mcq
    type: mcq
    skills: [fx-exposure]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: three-exposures }
    prompt: A company sold more in 2025, yet its reported sales in euros fell because currencies it earned in weakened. Which exposure is this?
    options:
      - Translation exposure
      - Transaction exposure
      - Economic exposure
      - No exposure
    answer: 0
    hints:
      - The business did not change, only the conversion of results.
    explanation: This is the report-card risk. No cash is lost on a deal, but converted results look smaller.

  - id: competition-mcq
    type: mcq
    skills: [fx-exposure]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: three-exposures }
    prompt: A firm that sells only in its home country sees foreign rivals become cheaper after their currency weakens. Which statement is true?
    options:
      - It faces economic exposure even though it never sells abroad
      - It faces no exchange rate risk
      - It faces only transaction exposure
      - It faces only translation exposure
    answer: 0
    hints:
      - Think about the long-run effect on who has the cheaper product.
    explanation: Economic exposure can hit a firm that never sells abroad, and it is the biggest and slowest of the three.

  - id: passthrough-mcq
    type: mcq
    skills: [fx-exposure]
    difficulty: 3
    tags: [term]
    lessonRef: { tab: intuition, id: three-exposures }
    prompt: What does partial pass-through mean?
    options:
      - Firms neither fully absorb a currency change nor fully pass it on to prices
      - Firms always raise prices by the full currency move
      - Firms always absorb the full cost
      - Prices never change
    answer: 0
    hints:
      - The word partial gives it away.
    explanation: Companies show partial pass-through behavior, which makes operating exposure hard to measure.

  # ------------------------------------------------------------------ hedging
  - id: three-ways-match
    type: match
    skills: [hedging]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: lock-match }
    prompt: Match each protective move to what it does.
    pairs:
      - ['Lock it in', 'Agree today on the rate for a future payment']
      - ['Match it', 'Earn and spend in the same currency, or cancel payments inside the company']
      - ['Adjust the business', 'Change prices, suppliers, where you produce or when you pay']
    hints:
      - Matching means making the two sides cancel.
    explanation: The pro-tip is to lock in the deals you know, match where you can, and adjust the business for the long run.

  - id: hedge-outcome-mcq
    type: mcq
    skills: [hedging]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: lock-match }
    prompt: The exporter needs at least 5.6 million pesos on payday for USD 100,000. Which choice can leave the owner short?
    options:
      - Waiting and converting at whatever the rate is
      - Locking in 58 with a forward
      - Buying a currency option at 58 for a 100,000 peso fee
      - Both the forward and the option
    answer: 0
    hints:
      - Compare the worst outcome of each choice with 5.6 million.
    explanation: Waiting at a rate of 55 gives 5.5 million, which is short. The forward gives 5.8 million, and the option gives at least 5.7 million after the fee.

  - id: forward-cost-mcq
    type: mcq
    skills: [hedging]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: lock-match }
    prompt: The exporter locks in 58, and on payday the rate is 61. How much does the exporter give up compared with waiting?
    options:
      - 300,000 pesos, the price of certainty
      - Nothing
      - 100,000 pesos
      - 600,000 pesos
    answer: 0
    hints:
      - Waiting would have given 6.1 million.
    explanation: Waiting would give 6.1 million and the forward gives 5.8 million, a difference of 300,000.

  - id: option-mcq
    type: mcq
    skills: [hedging]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: lock-match }
    prompt: Compared with a forward, what is true of the currency option in the exporter's example?
    options:
      - It costs a fee whatever happens but keeps most of the upside
      - It has no fee
      - It gives a fixed result at every rate
      - It cannot protect against a stronger peso
    answer: 0
    hints:
      - The fee is 100,000 pesos.
    explanation: At 61 the option gives 6.0 million, which is 6.1 less the fee. At 55 it gives 5.7 million, which is 5.8 less the fee.

  - id: whenwait-mcq
    type: mcq
    skills: [hedging]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: lock-match }
    prompt: When could waiting be a reasonable choice?
    options:
      - The order is small, or the firm has plenty of cash to absorb a bad month
      - The firm needs the exact amount for payroll
      - The order is huge and there is no spare cash
      - The firm has no idea of the rate
    answer: 0
    hints:
      - Think about who can survive a bad outcome.
    explanation: A small order or a large cash cushion lets a firm live with a bad month.

  - id: hedge-tools-match
    type: match
    skills: [hedging]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: more-hedges }
    prompt: Match each hedging tool to its description.
    pairs:
      - ['[[forward-contract|Forward market hedge]]', 'A contract to buy or sell currency at a fixed rate later']
      - ['[[currency-option|Currency option hedge]]', 'The right to buy or sell a set amount at a set rate']
      - ['[[money-market-hedge|Money market hedge]]', 'Borrowing and lending in home and foreign money markets']
      - ['[[swap-contract|Swap contract]]', 'A spot deal paired with an opposite future deal']
    hints:
      - Option means the right, but not the duty.
    explanation: These tools are among the six ways to cover transaction exposure.

  - id: six-ways-multi
    type: multi
    skills: [hedging]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: more-hedges }
    prompt: Which are among the six ways to cover transaction exposure?
    options:
      - Refuse to enter into foreign currency contracts
      - Practice exposure netting
      - Use a forward market hedge
      - Use a currency option hedge
      - Raise all prices tenfold
    answer: [0, 1, 2, 3]
    hints:
      - The last option is not a hedge.
    explanation: The six ways are refusing foreign currency contracts, exposure netting, forward hedge, option hedge, money market hedge and a swap.

  - id: cirp-mcq
    type: mcq
    skills: [hedging]
    difficulty: 3
    tags: [term]
    lessonRef: { tab: intuition, id: more-hedges }
    prompt: What does covered interest rate parity say?
    options:
      - The percentage gap between forward and spot rates equals the gap in nominal interest rates
      - Interest rates are equal everywhere
      - Forward rates never differ from spot rates
      - Exchange rates never move
    answer: 0
    hints:
      - It links forward rates to interest rates.
    explanation: This link explains why forward rates differ from spot rates.

  # ------------------------------------------------------------------ cash-management
  - id: netting-mcq
    type: mcq
    skills: [cash-management]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: cash-moves }
    prompt: In the lecture example, multilateral netting cuts eight transactions to four and the money in transit from 1.2 million dollars to what?
    options:
      - 600,000 dollars
      - 1.2 million dollars
      - 2.4 million dollars
      - Nothing
    answer: 0
    hints:
      - It halves.
    explanation: With netting there are four transactions and 600,000 dollars in transit, and FX transaction costs fall too.

  - id: leadlag-match
    type: match
    skills: [cash-management]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: cash-moves }
    prompt: Match each situation to the move the lecture suggests.
    pairs:
      - ['A foreign currency is expected to weaken and you are owed money in it', 'Collect early (lead)']
      - ['A foreign currency is expected to strengthen and you owe money in it', 'Pay early (lead)']
      - ['A foreign currency is expected to strengthen and you are owed money in it', 'Collect late (lag)']
      - ['A foreign currency is expected to weaken and you owe money in it', 'Pay late (lag)']
    hints:
      - Collect before a currency falls and wait for it to rise.
    explanation: The idea is to time payments so that currency moves help the company.

  - id: fund-moves-multi
    type: multi
    skills: [cash-management]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: cash-moves }
    prompt: Which are ways to move funds inside a multinational?
    options:
      - Fronting loans through an intermediary
      - Transfer pricing
      - Multilateral netting
      - Leading and lagging
      - Hiding profits from every tax authority
    answer: [0, 1, 2, 3]
    hints:
      - One option is not a recognized technique.
    explanation: Transfer pricing can raise ethical issues in the host country.

  - id: ifc-mcq
    type: mcq
    skills: [cash-management]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: cash-moves }
    prompt: Why are more firms centralizing finance operations in an international finance center?
    options:
      - Because of floating exchange rates, growing markets, changing inflation and better cash systems
      - Because exchange rates are fixed
      - Because markets are shrinking
      - Because cash management is no longer needed
    answer: 0
    hints:
      - Think about what makes cash harder to manage.
    explanation: The lecture also lists chances to raise yields and the growth of derivatives.

  # ------------------------------------------------------------------ translation-accounting
  - id: methods-match
    type: match
    skills: [translation-accounting]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: translation }
    prompt: Match each functional currency to its translation method.
    pairs:
      - ['Local currency', 'Current rate method']
      - ['Parent company currency', 'Temporal method']
    hints:
      - The names match the idea of using today's rate for everything.
    explanation: The functional currency decides which method the parent uses.

  - id: current-mcq
    type: mcq
    skills: [translation-accounting]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: translation }
    prompt: Under the current rate method, where do translation gains and losses appear?
    options:
      - On the balance sheet, as a separate component of equity
      - On the income statement as net earnings
      - They are ignored
      - In the cash flow only
    answer: 0
    hints:
      - The temporal method sends them to net earnings.
    explanation: Under the temporal method translation gains and losses appear in net earnings instead.

  - id: temporal-mcq
    type: mcq
    skills: [translation-accounting]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: translation }
    prompt: Under the temporal method, which items use their historical exchange rates?
    options:
      - Fixed and intangible assets, and items such as cost of goods sold and depreciation
      - Cash and receivables
      - Every item
      - Only revenue
    answer: 0
    hints:
      - Monetary items use the spot rate.
    explanation: Monetary accounts use the spot rate, while accounts carried at historical cost use historical rates.

  - id: standards-match
    type: match
    skills: [translation-accounting]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: standards }
    prompt: Match each standard to its description.
    pairs:
      - ['[[gaap|GAAP]]', 'Used in the United States, relies on detailed rules']
      - ['[[ifrs|IFRS]]', 'Used by most of the world, relies on shared principles']
    hints:
      - Rules versus principles.
    explanation: The two systems are on a path of convergence.

  - id: gray-mcq
    type: mcq
    skills: [translation-accounting]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: standards }
    prompt: Which two dimensions did Sidney Gray's study use to compare accounting cultures?
    options:
      - Secrecy-transparency and optimism-conservatism
      - Profit and loss
      - Debt and equity
      - Tax and revenue
    answer: 0
    hints:
      - One is about how much a firm reveals.
    explanation: Disclosure practices and measurement are affected by culture.

  - id: tbl-mcq
    type: mcq
    skills: [translation-accounting]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: standards }
    prompt: What does triple-bottom-line accounting report?
    options:
      - Environmental, social and financial results
      - Revenue, cost and profit only
      - Three years of tax returns
      - Only environmental results
    answer: 0
    hints:
      - There are three parts.
    explanation: Critics say it is not widely implementable and needs objective measures for comparison.

  # ------------------------------------------------------------------ capital-structure
  - id: capital-sources-mcq
    type: mcq
    skills: [capital-structure]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: capital }
    prompt: From which sources do firms raise capital?
    options:
      - Internally through retained earnings and externally through equity or debt
      - Only through taxes
      - Only by selling products
      - Only from governments
    answer: 0
    hints:
      - Retained earnings stay inside the firm.
    explanation: Firms can also issue stock in foreign markets to reach a broader pool of investors.

  - id: adr-mcq
    type: mcq
    skills: [capital-structure]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: capital }
    prompt: What is an American depositary receipt?
    options:
      - A foreign share held by a custodian bank and traded in dollars on a U.S. exchange
      - A U.S. tax form
      - A loan to a U.S. bank
      - A currency option
    answer: 0
    hints:
      - It lets U.S. investors buy foreign shares.
    explanation: ADRs are held by a custodian, usually a U.S. bank, in the issuer's home market.

  - id: decisions-multi
    type: multi
    skills: [capital-structure]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: capital }
    prompt: Which are decisions a financial manager makes when raising capital?
    options:
      - Choice of currency
      - Capital structure of equity versus debt
      - Choice of capital market
      - Amount and duration of financing
      - The color of the logo
    answer: [0, 1, 2, 3]
    hints:
      - One option has nothing to do with finance.
    explanation: The lecture lists six decisions including sources and alternative financing.

  - id: offshore-mcq
    type: mcq
    skills: [capital-structure]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: capital }
    prompt: What is an offshore financial center?
    options:
      - A place that specializes in financing nonresidents, with low taxes and few banking rules
      - A bank in the home country
      - A government office
      - A type of stock
    answer: 0
    hints:
      - It is also called a tax haven.
    explanation: Such centers attract money because of low taxes and light regulation.

  # ------------------------------------------------------------------ taxation
  - id: tax-match
    type: match
    skills: [taxation]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: taxes }
    prompt: Match each tax to its description.
    pairs:
      - ['[[income-tax|Income tax]]', 'A direct tax on earnings']
      - ['[[value-added-tax|Value-added tax]]', 'An indirect tax collected as parties add value']
      - ['[[withholding-tax|Withholding tax]]', 'An indirect tax paid by the payer, usually on passive income']
    hints:
      - Direct versus indirect.
    explanation: Taxation is an external force that affects the decisions of international managers.

  - id: forms-mcq
    type: mcq
    skills: [taxation]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: taxes }
    prompt: How does a branch differ from a subsidiary?
    options:
      - A branch is a legal extension of the parent; a subsidiary is a separate legal entity owned by the parent
      - A branch is always larger
      - A subsidiary is always owned by locals
      - They are the same thing
    answer: 0
    hints:
      - One is part of the parent in law, the other is separate.
    explanation: The legal form affects taxes and liability.

  - id: cfc-mcq
    type: mcq
    skills: [taxation]
    difficulty: 3
    tags: [term]
    lessonRef: { tab: intuition, id: taxes }
    prompt: When is a foreign subsidiary a controlled foreign corporation?
    options:
      - When the parent owns more than 50 percent of it
      - When the parent owns exactly 10 percent
      - When it has no employees
      - When it pays no taxes
    answer: 0
    hints:
      - Think of control as a majority.
    explanation: A CFC is controlled by a parent with more than 50 percent ownership.

  - id: decision-order
    type: order
    skills: [fx-exposure, hedging]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: lock-match }
    prompt: Put the steps of the exporter's decision in a sensible order.
    items:
      - Notice the gap between signing and getting paid
      - Decide how many pesos are needed on payday
      - Compare waiting, locking in and insurance
      - Choose the tool and agree it with the bank
    hints:
      - Know the need before you compare options.
    explanation: A firm first sees the exposure, then states what it needs, then compares tools.

  - id: statement-order
    type: order
    skills: [translation-accounting]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: translation }
    prompt: Put the consolidation process in a sensible order.
    items:
      - Decide each subsidiary's functional currency
      - Choose the current rate or the temporal method
      - Translate the subsidiary's results
      - Add the translated results into one report
    hints:
      - The functional currency decides the method.
    explanation: Consolidation translates subsidiary results and then aggregates them.
