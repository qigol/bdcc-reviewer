terms:
  - id: class-imbalance
    term: Class imbalance
    aka: [imbalanced data]
    short: One class has far fewer examples than another, so a learner and its metrics can ignore the rare class.
    long: |
      Imbalance matters when the distribution, the metric or the learning procedure lets us overlook poor performance on
      the class that drives the decision (Session 2, slide 5). Dropout (1.41%), fraud (< 1%) and severe undernutrition are typical.
    related: [minority-class, majority-class, imbalance-ratio]
    lessonRef: { tab: intuition, id: lazy-model }
    skills: [accuracy-trap]
  - id: minority-class
    term: Minority class
    short: The rare class, usually the one the decision is about (dropout, fraud, >50K). Treated as the positive class.
    related: [majority-class, class-imbalance]
    skills: [accuracy-trap]
  - id: majority-class
    term: Majority class
    short: The common class that dominates the data and therefore dominates accuracy.
    related: [minority-class]
    skills: [accuracy-trap]
  - id: imbalance-ratio
    term: Imbalance ratio
    short: 'Majority count divided by minority count, written as "r : 1". Adult Income is 37,155 / 11,687 ≈ 3.2 : 1.'
    formula: '\frac{n_{\text{majority}}}{n_{\text{minority}}}'
    skills: [random-resampling]
  - id: accuracy-paradox
    term: Accuracy trap
    aka: [accuracy paradox, lazy model]
    short: A model that always predicts the majority scores high accuracy while catching none of the rare class.
    long: 'On 10,000 learners at 1.41% dropout, always predicting "stays" is 98.59% accurate with 0% dropout recall (slide 9).'
    lessonRef: { tab: intuition, id: lazy-model }
    related: [accuracy, recall]
    skills: [accuracy-trap]
  - id: confusion-matrix
    term: Confusion matrix
    short: Table counting predictions by actual class (rows) and predicted class (columns); its four cells are TP, FN, FP, TN.
    lessonRef: { tab: intuition, id: tally-fraud }
    related: [true-positive, false-negative, false-positive, true-negative]
    skills: [confusion-matrix]
  - id: true-positive
    term: True positive (TP)
    short: A minority case the model flagged correctly, e.g. a fraud it caught.
    related: [false-negative]
    skills: [confusion-matrix]
  - id: false-negative
    term: False negative (FN)
    short: A minority case the model missed by predicting the majority, e.g. an undetected fraud or dropout.
    related: [true-positive, recall]
    skills: [confusion-matrix]
  - id: false-positive
    term: False positive (FP)
    short: A majority case wrongly flagged as minority, i.e. a false alarm.
    related: [precision]
    skills: [confusion-matrix]
  - id: true-negative
    term: True negative (TN)
    short: A majority case correctly left alone, e.g. a legitimate transaction cleared.
    skills: [confusion-matrix]
  - id: accuracy
    term: Accuracy
    short: Share of all predictions that are correct, (TP + TN) / total. Dominated by the majority when classes are imbalanced.
    formula: '\frac{TP + TN}{TP + TN + FP + FN}'
    skills: [prf1]
  - id: precision
    term: Precision
    short: Of the cases the model flagged, the share that really are minority, TP / (TP + FP). Low precision means many false alarms.
    formula: '\frac{TP}{TP + FP}'
    lessonRef: { tab: math-code, id: four-metrics }
    skills: [prf1]
  - id: recall
    term: Recall
    aka: [sensitivity, true positive rate]
    short: Of the real minority cases, the share the model caught, TP / (TP + FN). Low recall means many misses.
    formula: '\frac{TP}{TP + FN}'
    lessonRef: { tab: math-code, id: four-metrics }
    skills: [prf1]
  - id: f1
    term: F1 score
    short: Harmonic mean of precision and recall; it is pulled toward the smaller of the two.
    formula: '2 \cdot \frac{P \cdot R}{P + R}'
    skills: [prf1]
  - id: balanced-accuracy
    term: Balanced accuracy
    short: Average of the recall on each class, so a lazy majority-guesser scores only 0.5 on two classes.
    formula: '\tfrac12\left(\frac{TP}{TP+FN} + \frac{TN}{TN+FP}\right)'
    skills: [prf1]
  - id: per-class-recall
    term: Per-class recall
    short: Recall computed separately for every class; the diagonal of a row-normalized confusion matrix.
    lessonRef: { tab: intuition, id: per-class-sigla }
    related: [macro-average]
    skills: [per-class]
  - id: macro-average
    term: Macro average
    short: Unweighted mean of a metric over classes, so a rare class counts as much as a common one.
    skills: [per-class]
  - id: random-undersampling
    term: Random undersampling (RUS)
    short: Throw away randomly chosen majority rows until both classes have the minority's count.
    formula: 'n_{\text{majority}}^{\text{kept}} = n_{\text{minority}}'
    lessonRef: { tab: math-code, id: undersampling }
    skills: [random-resampling]
  - id: random-oversampling
    term: Random oversampling (ROS)
    short: Copy randomly chosen minority rows, with replacement, until both classes have the majority's count.
    formula: 'n_{\text{minority}}^{\text{new}} = n_{\text{majority}}'
    lessonRef: { tab: math-code, id: oversampling }
    skills: [random-resampling]
  - id: smote
    term: SMOTE
    aka: [Synthetic Minority Over-sampling TEchnique]
    short: Creates new minority points on the line segment between a minority point and one of its nearest minority neighbours.
    formula: 'x_{\text{new}} = x_i + \lambda\,(x_{\text{nb}} - x_i)'
    lessonRef: { tab: intuition, id: smote-line }
    skills: [smote]
  - id: smote-nc
    term: SMOTE-NC
    aka: [SMOTE for Nominal and Continuous features]
    short: SMOTE for mixed data; numeric columns are interpolated, categorical columns take the neighbours' most frequent value.
    lessonRef: { tab: intuition, id: smote-nc-vote }
    skills: [smote-nc]
  - id: adasyn
    term: ADASYN
    aka: [Adaptive Synthetic sampling]
    short: Like SMOTE, but each minority point gets synthetic neighbours in proportion to how many majority points surround it.
    formula: 'r_i = \frac{\Delta_i}{k}, \quad \hat r_i = \frac{r_i}{\sum_j r_j}'
    lessonRef: { tab: intuition, id: adasyn-hardness }
    skills: [adasyn]
  - id: stratified-split
    term: Stratified split
    short: A train/test split that keeps each class's proportion the same in both halves.
    skills: [choosing]
  - id: resampling-leakage
    term: Resampling leakage
    short: Resampling before splitting, so copies or blends of test rows reach training and test scores become optimistic.
    lessonRef: { tab: math-code, id: honest-pipeline }
    skills: [choosing]
  - id: class-weights
    term: Class weights
    aka: [scale_pos_weight, class_weight="balanced"]
    short: Making each minority example count more in the training loss instead of changing the rows, as SAGIP did in LightGBM.
    skills: [choosing]
