  - id: adasyn-code
    type: code-fill
    skills: [adasyn]
    difficulty: 3
    tags: [code]
    lessonRef: { tab: math-code, id: adasyn }
    prompt: Complete the ADASYN counts.
    code: |
      def adasyn_counts(X, y, k=3):
          minority = np.where(y == 1)[0]
          G = (y == 0).sum() - (y == 1).sum()
          r = []
          for i in minority:
              d2 = ((X - X[i]) ** 2).sum(axis=1)
              d2[i] = np.inf
              nn = np.argsort(d2)[:k]
              delta = (y[nn] == __BLANK_1__).sum()
              r.append(delta / k)
          r_hat = np.array(r) / __BLANK_2__
          return np.rint(r_hat * G).astype(int)
    blanks:
      '1': { accept: ['0'] }
      '2': { accept: ['sum(r)', 'np.sum(r)', 'np.array(r).sum()'] }
    explanation: Δ counts **majority** (label 0) neighbours; dividing by Σr makes the weights sum to 1.

  - id: adasyn-order
    type: order
    skills: [adasyn]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: adasyn }
    prompt: Put ADASYN's steps in order.
    items:
      - 'Set the budget G = n_majority − n_minority'
      - For each minority point, find its k nearest neighbours among all points
      - 'Count Δ_i, the majority points among them, and set r_i = Δ_i / k'
      - 'Normalize: r̂_i = r_i / Σ r_j'
      - 'Give point i about g_i = r̂_i · G synthetic points'
      - Create each one SMOTE-style towards a minority neighbour
    explanation: ADASYN only decides how many points each minority row gets; the points themselves are made as in SMOTE.

