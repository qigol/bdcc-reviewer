  # ------------------------------------------------------------------ new formats (case, find-error, two-tier, explain, cloze)
  - id: metrics-case
    type: case
    skills: [confusion-matrix, prf1, accuracy-trap]
    difficulty: 3
    tags: [math]
    generator: confusionQ
    lessonRef: { tab: math-code, id: four-metrics }
    prompt: |
      **Audit a fraud model.** It was run on {=n} transactions, {=pos} of them actually fraudulent. Its confusion matrix:
    show:
      - { id: cm, widget: Matrix, props: { data: '@cm', format: int, rowHeader: actual } }
    parts:
      - type: numeric
        prompt: Accuracy (as a decimal, two places)
        answer: { var: accuracy, tol: 0.01 }
        explanation: '(TP + TN) / n = ({=tp} + {=tn}) / {=n} = {=accuracy|2}.'
      - type: numeric
        prompt: Recall on the fraud class (two places)
        answer: { var: recall, tol: 0.01 }
        misconceptions:
          - { var: wrongRecAsPrec, feedback: 'That is precision, TP / (TP + FP). Recall divides by the actual frauds, TP + FN.' }
        explanation: 'TP / (TP + FN) = {=tp} / ({=tp} + {=fn}) = {=recall|2}.'
      - type: numeric
        prompt: F1 score (two places)
        answer: { var: f1, tol: 0.01 }
        misconceptions:
          - { var: wrongF1Arith, feedback: "That's the plain average of precision and recall. F1 is their **harmonic** mean, 2PR / (P + R)." }
        explanation: 'Precision {=precision|2}, recall {=recall|2}, so F1 = 2PR / (P + R) = {=f1|2}.'
      - type: two-tier
        prompt: The team lead says "accuracy is {=accuracyPct|0}%, ship it". What do you say?
        options: ['Look at recall and F1 on the fraud class first', 'Agree: most of its predictions are right, so it is good enough', 'Ask for more negative examples to raise accuracy further']
        answer: 0
        reasons:
          - With a rare class, accuracy is dominated by the majority class and can hide missed frauds
          - Accuracy already includes recall
          - More data always fixes imbalance
        reasonAnswer: 0
        reasonFeedback:
          1: Accuracy pools both classes. The few fraud rows barely move it.
          2: More majority-class rows make the imbalance worse, not better.
        explanation: The minority-class metrics are the ones that tell you whether frauds are caught.
    hints:
      - Read TP, FN, FP, TN off the matrix first.
      - Accuracy uses all four cells; recall and precision only use the fraud row or column.
    explanation: Accuracy {=accuracy|2}, recall {=recall|2}, F1 {=f1|2}. A high accuracy can sit on top of a low recall when fraud is rare.

  - id: f1-find-error
    type: find-error
    skills: [prf1]
    difficulty: 2
    tags: [math]
    generator: confusionQ
    lessonRef: { tab: math-code, id: four-metrics }
    prompt: |
      A classmate scores a classifier with TP = {=tp}, FN = {=fn}, FP = {=fp}, TN = {=tn}. **One step is wrong.** Click it and give
      the correct value.
    steps:
      - 'Precision = TP / (TP + FP) = {=tp} / ({=tp} + {=fp}) = {=precision|3}'
      - 'Recall = TP / (TP + FN) = {=tp} / ({=tp} + {=fn}) = {=recall|3}'
      - 'F1 = (precision + recall) / 2 = {=f1Arith|3}'
    wrong: 2
    fix: { var: f1, tol: 0.01 }
    fixPrompt: What is the correct F1 (two decimals)?
    misconceptions:
      - { var: f1Arith, feedback: "That's still the plain average. F1 = 2PR / (P + R)." }
    hints:
      - F1 punishes a big gap between precision and recall.
      - It's the harmonic mean, 2PR / (P + R).
    explanation: F1 = 2 × {=precision|3} × {=recall|3} / ({=precision|3} + {=recall|3}) = {=f1|3}. The plain average ({=f1Arith|3}) overstates a lopsided model.

  - id: smote-explain
    type: explain
    skills: [smote, random-resampling]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: smote-line }
    prompt: Explain how SMOTE differs from random oversampling, and why that difference can help a classifier.
    model: |
      Random oversampling copies existing minority rows, so the model sees the same few points again and can overfit to them.
      SMOTE makes **new** synthetic minority rows: it picks a minority point, picks one of its k nearest minority neighbours, and
      places a new point at a random spot on the line between them. That fills in the minority region instead of stacking
      duplicates, so the decision boundary is pushed out more smoothly. Both are applied to the training data only.
    checklist:
      - Random oversampling duplicates existing minority rows
      - SMOTE creates new points between a minority row and a nearby minority neighbour
      - Duplicates invite overfitting; interpolated points spread the minority region
      - Resampling is done on the training split only
    hints: ["What does each method add to the training set: copies, or new points?"]
    explanation: Copies vs interpolated neighbours, and both only on training data.

  - id: metric-cloze
    type: code-fill
    lang: text
    skills: [prf1, confusion-matrix]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: four-metrics }
    prompt: Fill in the metric names.
    code: |
      Of the cases the model flagged as positive, the share that really are positive is __BLANK_1__. Of the cases that really
      are positive, the share the model caught is __BLANK_2__. Their harmonic mean is the __BLANK_3__ score.
    blanks:
      '1': { accept: [precision], hint: 'p…' }
      '2': { accept: [recall, sensitivity, true positive rate], hint: 'r…' }
      '3': { accept: [F1, F1 score, F-1, F], hint: 'F…' }
    hints: [One divides by the alarms raised, the other by the actual positives.]
    explanation: Precision = TP / (TP + FP); recall = TP / (TP + FN); F1 = 2PR / (P + R).

  - id: resample-split-two-tier
    type: two-tier
    skills: [random-resampling, smote, choosing]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: resample-counts }
    prompt: A team applies SMOTE to the **whole** dataset, then splits it into training and test sets. Their test recall jumps from 0.40 to 0.85. Should they trust the jump?
    options: ['No, the test score is inflated', 'Yes, SMOTE made the model better at finding the minority class', 'Yes, as long as they used k = 5 neighbours']
    answer: 0
    reasons:
      - Synthetic test rows were built from training rows, so the test set leaks training information
      - SMOTE always lowers recall, so a rise must be an error
      - The test set should be balanced too, so resampling it is correct
    reasonAnswer: 0
    optionFeedback:
      1: Some of the improvement may be real, but you can't tell, because the test set now holds points interpolated from training rows.
      2: The number of neighbours doesn't fix leakage.
    reasonFeedback:
      1: SMOTE usually raises minority recall. That's not the problem here.
      2: The test set must keep the real class mix, or its scores don't describe the real world.
    hints: [Where did the synthetic test points come from?]
    explanation: Resample only the training split, after the split. Otherwise synthetic test points are near-copies of training points and the score is optimistic.

