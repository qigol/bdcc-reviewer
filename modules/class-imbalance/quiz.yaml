templates:
  - id: lazy-accuracy
    type: numeric
    skills: [accuracy-trap]
    difficulty: 1
    tags: [math]
    generator: lazyQ
    lessonRef: { tab: intuition, id: lazy-model }
    prompt: |
      A dataset has **{=N}** rows, and **{=ratePct}%** of them belong to the minority class. A model predicts the majority
      class for every row. What is its accuracy, in percent?
    answer: { var: accuracyPct, tol: 0.01 }
    explanation: |
      Minority rows: {=nMin}; majority rows: {=nMaj}. The model is right on every majority row:
      accuracy $= {=nMaj} / {=N} = {=accuracyPct|2}\%$. Its minority recall is 0.

  - id: lazy-recall-mcq
    type: mcq
    skills: [accuracy-trap]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: lazy-model }
    prompt: 'On a 99 : 1 dataset a model reports 99% accuracy. What can you conclude?'
    options:
      - 'Nothing yet: always predicting the majority also gives 99%, with 0% minority recall'
      - The model has learned the minority class well
      - The model's minority recall must be at least 0.99
      - The model is overfitting
    answer: 0
    explanation: |
      Accuracy equal to the majority share is exactly what the lazy model gets (slides 17–18). Check the confusion matrix and
      the minority recall before believing it.

  - id: why-hurts-multi
    type: multi
    skills: [accuracy-trap]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: lazy-model }
    prompt: Which statements explain why class imbalance hurts (slide 24)? Select all that apply.
    options:
      - Errors on the rare class barely move the overall accuracy
      - The cheapest way for a learner to look good is to bet on the majority
      - A single accuracy number can conceal 0% recall on the class that matters
      - The cost of a missed minority case lives outside the metric
      - Imbalanced data always contains labelling errors
      - A balanced dataset guarantees a good model
    answer: [0, 1, 2, 3]
    explanation: |
      Imbalance matters when the distribution, the metric or the learning procedure lets us overlook the minority. It says
      nothing about label errors, and balance alone does not make a model good.

  - id: tally-hand
    type: hand-calc
    skills: [confusion-matrix]
    difficulty: 1
    tags: [math]
    generator: confusionQ
    lessonRef: { tab: intuition, id: tally-fraud }
    prompt: Tally this table into a confusion matrix (positive = `pos`).
    show:
      - { id: t, widget: Matrix, props: { data: '@table', title: 'actual and predicted labels' } }
    steps:
      - prompt: 'TP (actual pos, predicted pos)'
        answer: { var: tp, tol: 0 }
      - prompt: 'FN (actual pos, predicted neg)'
        answer: { var: fn, tol: 0 }
      - prompt: 'FP (actual neg, predicted pos)'
        answer: { var: fp, tol: 0 }
        misconceptions:
          - { var: fn, feedback: 'That is FN. A false **positive** is a negative row the model called positive.' }
      - prompt: 'TN (actual neg, predicted neg)'
        answer: { var: tn, tol: 0 }
    explanation: |
      TP = {=tp}, FN = {=fn}, FP = {=fp}, TN = {=tn}; together {=n} rows. Positives are {=pos}, negatives {=neg}.

  - id: outcome-match
    type: match
    skills: [confusion-matrix]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: tally-fraud }
    prompt: Match each fraud-detection outcome to its cell.
    pairs:
      - ['A fraud the model flagged', 'True positive (TP)']
      - ['A fraud the model let through', 'False negative (FN)']
      - ['A legitimate payment flagged as fraud', 'False positive (FP)']
      - ['A legitimate payment cleared', 'True negative (TN)']
    explanation: The first word says whether the prediction was right; the second says what was predicted.

  - id: confusion-code
    type: code-fill
    skills: [confusion-matrix]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: confusion-tally }
    prompt: Complete the tally. `positive` is the minority label.
    code: |
      def confusion_counts(actual, predicted, positive="Fraud"):
          tp = fn = fp = tn = 0
          for a, p in zip(actual, predicted):
              if a == positive and p == positive:
                  tp += 1
              elif a == positive:
                  __BLANK_1__ += 1
              elif p == __BLANK_2__:
                  fp += 1
              else:
                  tn += 1
          return tp, fn, fp, tn
    blanks:
      '1': { accept: ['fn'] }
      '2': { accept: ['positive'] }
    explanation: Actual positive but not predicted positive is a miss (FN). Actual negative but predicted positive is a false alarm (FP).

  - id: precision-numeric
    type: numeric
    skills: [prf1]
    difficulty: 1
    tags: [math]
    generator: confusionQ
    lessonRef: { tab: math-code, id: four-metrics }
    prompt: 'A classifier has TP = {=tp}, FN = {=fn}, FP = {=fp}, TN = {=tn}. What is its **precision**?'
    show:
      - { id: cm, widget: Matrix, props: { data: '@cm', format: int, rowHeader: actual } }
    answer: { var: precision, tol: 0.01 }
    misconceptions:
      - { var: wrongPrecAsRec, feedback: 'That is recall, TP / (TP + FN). Precision divides by the alarms raised, TP + FP.' }
      - { var: wrongTpOverN, feedback: 'You divided by all rows. Precision only looks at the rows predicted positive.' }
    explanation: |
      $P = \frac{TP}{TP + FP} = \frac{ {=tp} }{ {=tp} + {=fp} } = {=precision|2}$.

  - id: recall-numeric
    type: numeric
    skills: [prf1]
    difficulty: 1
    tags: [math]
    generator: confusionQ
    lessonRef: { tab: math-code, id: four-metrics }
    prompt: 'TP = {=tp}, FN = {=fn}, FP = {=fp}, TN = {=tn}. What is the **recall** on the positive class?'
    answer: { var: recall, tol: 0.01 }
    misconceptions:
      - { var: wrongRecAsPrec, feedback: 'That is precision. Recall divides by the real positives, TP + FN.' }
      - { var: wrongTpOverN, feedback: 'Recall divides by the actual positives, not by every row.' }
    explanation: |
      $R = \frac{TP}{TP + FN} = \frac{ {=tp} }{ {=tp} + {=fn} } = {=recall|2}$: the share of real positives caught.

  - id: f1-numeric
    type: numeric
    skills: [prf1]
    difficulty: 2
    tags: [math]
    generator: confusionQ
    lessonRef: { tab: intuition, id: four-metrics }
    prompt: 'TP = {=tp}, FN = {=fn}, FP = {=fp}, TN = {=tn}. Compute the **F1** score.'
    answer: { var: f1, tol: 0.01 }
    misconceptions:
      - { var: wrongF1Arith, feedback: 'That is the arithmetic mean (P + R)/2. F1 is the harmonic mean, 2PR/(P + R).' }
      - { var: accuracy, feedback: 'That is accuracy. F1 ignores TN entirely.' }
    explanation: |
      P = {=precision|3}, R = {=recall|3}. $F_1 = \frac{2PR}{P + R} = {=f1|3}$.

  - id: metrics-hand
    type: hand-calc
    skills: [prf1, confusion-matrix]
    difficulty: 2
    tags: [math]
    generator: confusionQ
    lessonRef: { tab: math-code, id: four-metrics }
    prompt: Compute the four slide-22 metrics for this confusion matrix (rows = actual, columns = predicted).
    show:
      - { id: cm, widget: Matrix, props: { data: '@cm', format: int, rowHeader: actual } }
    steps:
      - prompt: Accuracy
        answer: { var: accuracy, tol: 0.01 }
      - prompt: Precision
        answer: { var: precision, tol: 0.01 }
        misconceptions:
          - { var: wrongPrecAsRec, feedback: 'That is recall. Precision = TP / (TP + FP).' }
      - prompt: Recall
        answer: { var: recall, tol: 0.01 }
      - prompt: F1
        answer: { var: f1, tol: 0.01 }
        misconceptions:
          - { var: wrongF1Arith, feedback: 'Harmonic, not arithmetic, mean.' }
    explanation: |
      Accuracy $= ({=tp} + {=tn})/{=n} = {=accuracy|3}$; P $= {=tp}/({=tp}+{=fp}) = {=precision|3}$;
      R $= {=tp}/({=tp}+{=fn}) = {=recall|3}$; $F_1 = {=f1|3}$.

  - id: balanced-accuracy
    type: numeric
    skills: [prf1, accuracy-trap]
    difficulty: 2
    tags: [math]
    generator: confusionQ
    lessonRef: { tab: math-code, id: four-metrics }
    prompt: |
      TP = {=tp}, FN = {=fn}, FP = {=fp}, TN = {=tn}. The Session 3 notebook also reports **balanced accuracy**, the mean of
      the recall on each class. Compute it.
    answer: { var: balanced, tol: 0.01 }
    misconceptions:
      - { var: wrongBalancedAcc, feedback: 'That is plain accuracy. Balanced accuracy averages the two per-class recalls.' }
      - { var: recall, feedback: 'That is only the positive-class recall. Average it with TN / (TN + FP).' }
    explanation: |
      Recall(pos) = {=recall|3}; recall(neg) = TN/(TN + FP) = {=specificity|3}. Balanced accuracy = their mean = {=balanced|3}.
      The lazy model would score only 0.5.

  - id: metric-match
    type: match
    skills: [prf1]
    difficulty: 1
    tags: [math]
    lessonRef: { tab: math-code, id: four-metrics }
    prompt: Match each metric to its formula.
    pairs:
      - ['Accuracy', '$(TP + TN)/(TP + TN + FP + FN)$']
      - ['Precision', '$TP/(TP + FP)$']
      - ['Recall', '$TP/(TP + FN)$']
      - ['F1', '$2PR/(P + R)$']
      - ['Balanced accuracy', '$\tfrac12\big(TP/(TP+FN) + TN/(TN+FP)\big)$']
    pick: 4
    explanation: Precision and recall share TP on top; FP goes with precision, FN with recall.

  - id: metrics-code
    type: code-fill
    skills: [prf1]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: four-metrics }
    prompt: Fill in precision and recall.
    code: |
      def scores(tp, fn, fp, tn):
          accuracy = (tp + tn) / (tp + tn + fp + fn)
          precision = tp / (tp + __BLANK_1__)
          recall = tp / (tp + __BLANK_2__)
          f1 = 2 * precision * recall / (precision + recall)
          return accuracy, precision, recall, f1
    blanks:
      '1': { accept: ['fp'] }
      '2': { accept: ['fn'] }
    explanation: Precision divides by everything flagged (TP + FP); recall by every real positive (TP + FN).

  - id: per-class-recall
    type: numeric
    skills: [per-class]
    difficulty: 2
    tags: [math]
    generator: perClassQ
    lessonRef: { tab: math-code, id: per-class-recall }
    prompt: |
      Confusion matrix of counts (rows = actual, columns = predicted) for classes A = Normal, B = Underweight,
      C = Severely UW. What is the recall for class **{=cls}**?
    show:
      - { id: m, widget: Matrix, props: { data: '@M', format: int, rowHeader: actual } }
    answer: { var: recall, tol: 0.01 }
    misconceptions:
      - { var: precision, feedback: 'You divided by the column total: that is precision. Recall divides by the row (actual class) total.' }
      - { var: accuracy, feedback: 'That is the overall accuracy. Recall for one class uses only that class''s row.' }
    explanation: |
      Row {=cls}: diagonal {=diag} out of {=rowSum} actual {=cls} cases, so recall $= {=diag}/{=rowSum} = {=recall|3}$.

  - id: macro-recall
    type: numeric
    skills: [per-class]
    difficulty: 3
    tags: [math]
    generator: perClassQ
    lessonRef: { tab: math-code, id: per-class-recall }
    prompt: 'For the same kind of matrix, compute the **macro recall** (unweighted mean of the three per-class recalls).'
    show:
      - { id: m, widget: Matrix, props: { data: '@M', format: int, rowHeader: actual } }
    answer: { var: macroRecall, tol: 0.01 }
    misconceptions:
      - { var: accuracy, feedback: 'That is overall accuracy, which weights classes by size. Macro recall averages the three recalls equally.' }
      - { var: meanPrecision, feedback: 'You averaged precisions (column-based). Use each row''s diagonal / row total.' }
    explanation: |
      Recalls: ({=recalls|list}) to 3 decimals: macro $= {=macroRecall|3}$. The weakest class is {=worst}.

  - id: sigla-mcq
    type: mcq
    skills: [per-class]
    difficulty: 1
    tags: [application]
    lessonRef: { tab: intuition, id: per-class-sigla }
    prompt: |
      SIGLA's marker-derived model matches or beats the anthropometric one on every headline metric (macro-F1 0.69 vs 0.65).
      Its row-normalized confusion matrix has 0.94 for Normal and 0.00 for Severely Underweight on the diagonal. What is the
      right conclusion?
    options:
      - 'It never catches a severely underweight learner, the class SIGLA exists to find'
      - It is the better model, because the headline numbers are higher
      - It catches 94% of all learners correctly
      - Its precision for Severely Underweight is 0.94
    answer: 0
    explanation: Diagonal of a row-normalized matrix = per-class recall. A decent average hid zero recall on the decision-relevant class.

  - id: rus-size
    type: numeric
    skills: [random-resampling]
    difficulty: 1
    tags: [math]
    generator: resampleQ
    lessonRef: { tab: math-code, id: undersampling }
    prompt: 'A training set has {=nMaj} majority and {=nMin} minority rows. How many rows remain after random **undersampling** to a 50 : 50 balance?'
    answer: { var: rus, tol: 0 }
    misconceptions:
      - { var: wrongDoubleMaj, feedback: 'That is the size after **over**sampling (2 × majority).' }
      - { var: wrongKeepAll, feedback: 'Undersampling removes majority rows; the size must shrink.' }
    explanation: |
      Keep all {=nMin} minority rows and {=nMin} majority rows: $2 \times {=nMin} = {=rus}$. {=removed} majority rows are dropped.

  - id: ros-copies
    type: numeric
    skills: [random-resampling]
    difficulty: 1
    tags: [math]
    generator: resampleQ
    lessonRef: { tab: math-code, id: oversampling }
    prompt: '{=nMaj} majority and {=nMin} minority training rows. How many **copies** does random oversampling add to reach 50 : 50?'
    answer: { var: added, tol: 0 }
    misconceptions:
      - { var: wrongDoubleMaj, feedback: 'That is the final size. The question asks how many rows are added.' }
      - { var: nMaj, feedback: 'The minority already has some rows; only the gap must be filled.' }
    explanation: |
      Fill the gap: ${=nMaj} - {=nMin} = {=added}$ copies, drawn with replacement. Final size $2 \times {=nMaj} = {=ros}$.

  - id: rus-code
    type: code-fill
    skills: [random-resampling]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: undersampling }
    prompt: Complete random undersampling.
    code: |
      def random_undersample(X, y, rng):
          minority = np.where(y == 1)[0]
          majority = np.where(y == 0)[0]
          keep = rng.choice(majority, size=__BLANK_1__, replace=__BLANK_2__)
          idx = np.concatenate([minority, keep])
          return X[idx], y[idx]
    blanks:
      '1': { accept: ['len(minority)', 'minority.size', 'minority.shape[0]'] }
      '2': { accept: ['False'] }
    explanation: Draw as many majority rows as there are minority rows, without replacement (each row at most once).

  - id: technique-match
    type: match
    skills: [random-resampling, smote, smote-nc, adasyn]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: resample-counts }
    prompt: Match each technique to what it does to the training data (slide 25).
    pairs:
      - ['Random undersampling', 'Removes some majority examples']
      - ['Random oversampling', 'Duplicates minority examples']
      - ['SMOTE', 'Interpolates new minority points between real ones']
      - ['SMOTE-NC', 'Interpolates numeric columns, votes on categorical ones']
      - ['ADASYN', 'Makes more synthetic points where the minority is hardest to learn']
    explanation: Two random techniques (delete or copy), three synthetic ones (between neighbours, mixed data, focused on hard regions).

  - id: smote-coordinate
    type: numeric
    skills: [smote]
    difficulty: 1
    tags: [math]
    generator: smoteQ
    lessonRef: { tab: math-code, id: smote }
    prompt: |
      SMOTE: minority point $x_i = ({=xi1}, {=xi2})$, chosen neighbour $x_{\text{nb}} = ({=xn1}, {=xn2})$, $\lambda = {=lambda}$.
      What is the **first** coordinate of $x_{\text{new}}$?
    answer: { var: x1, tol: 0.01 }
    misconceptions:
      - { var: wrongRev, feedback: 'You started from the neighbour: x_nb + λ(x_i − x_nb). SMOTE starts at x_i and moves λ towards x_nb.' }
      - { var: wrongScale, feedback: 'λ multiplies the difference (x_nb − x_i), not the neighbour itself.' }
    explanation: |
      ${=xi1} + {=lambda} \times ({=xn1} - {=xi1}) = {=xi1} + {=lambda} \times {=diff1} = {=x1|2}$.

  - id: smote-hand
    type: hand-calc
    skills: [smote]
    difficulty: 2
    tags: [math]
    generator: knnQ
    lessonRef: { tab: intuition, id: smote-line }
    prompt: |
      Minority point $x_i = ({=xi|list})$. The other minority points are {=pts}. Use squared Euclidean distance, k = 1,
      and $\lambda = {=lambda}$.
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0, title: 'other minority points' } }
    steps:
      - prompt: Squared distance from $x_i$ to its nearest minority neighbour
        answer: { var: dNearest, tol: 0 }
      - prompt: First coordinate of $x_{\text{new}}$
        answer: { var: x1, tol: 0.01 }
      - prompt: Second coordinate of $x_{\text{new}}$
        answer: { var: x2, tol: 0.01 }
    explanation: |
      Squared distances: {=d2s}. Nearest: {=nearest} = ({=nb|list}). $x_{\text{new}} = x_i + {=lambda}(x_{\text{nb}} - x_i) = ({=x1|2}, {=x2|2})$.

  - id: knn-mcq
    type: mcq
    skills: [smote]
    difficulty: 2
    tags: [math]
    generator: knnQ
    lessonRef: { tab: math-code, id: smote }
    prompt: |
      SMOTE looks for the nearest **minority** neighbour of $x_i = ({=xi|list})$. Candidates: {=pts}. Which is nearest
      (Euclidean distance)?
    explanation: |
      Squared distances: {=d2s}. The smallest belongs to **{=nearest}**. (Squared distances give the same ranking as distances.)

  - id: smote-code
    type: code-fill
    skills: [smote]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: smote }
    prompt: Complete one SMOTE step.
    code: |
      def smote_point(X_min, i, k, rng):
          x_i = X_min[i]
          d2 = ((X_min - x_i) ** 2).sum(axis=1)
          d2[i] = np.inf
          neighbours = np.argsort(d2)[:__BLANK_1__]
          nb = rng.choice(neighbours)
          lam = rng.uniform(0, 1)
          return x_i + lam * (__BLANK_2__)
    blanks:
      '1': { accept: ['k'] }
      '2': { accept: ['X_min[nb] - x_i', 'X_min[nb]-x_i'] }
    explanation: Keep the k smallest distances, then move a random fraction λ along the difference from x_i to the neighbour.

  - id: smote-order
    type: order
    skills: [smote]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: smote-line }
    prompt: Put the steps for creating one SMOTE point in order.
    items:
      - Pick a minority point x_i
      - Compute its distances to the other minority points
      - Keep its k nearest minority neighbours
      - Choose one of those neighbours at random
      - Draw λ uniformly between 0 and 1
      - 'Set x_new = x_i + λ (x_nb − x_i)'
    explanation: Neighbours first, then a random partner and a random position on the segment.

  - id: smotenc-vote
    type: mcq
    skills: [smote-nc]
    difficulty: 2
    tags: [math]
    generator: smotencQ
    lessonRef: { tab: intuition, id: smote-nc-vote }
    prompt: |
      SMOTE-NC creates a row from X. X's three minority neighbours have marital-status {=neigh}; the interpolation
      partner is {=chosen} ({=chosenMarital}). What marital-status does the synthetic row get?
    show:
      - { id: t, widget: Matrix, props: { data: '@table', title: 'X and its neighbours' } }
    explanation: |
      Categorical columns take the **most frequent value among the k neighbours**: {=winner}. The interpolation partner does
      not decide it, and averaging codes would invent a category.

  - id: smotenc-numeric
    type: numeric
    skills: [smote-nc]
    difficulty: 1
    tags: [math]
    generator: smotencQ
    lessonRef: { tab: math-code, id: smote-nc }
    prompt: 'SMOTE-NC: X is {=age} years old, its chosen neighbour is {=nbAge}, and λ = {=lambda}. What age does the synthetic row get?'
    answer: { var: newAge, tol: 0.01 }
    misconceptions:
      - { var: wrongRev, feedback: 'Start from X, not from the neighbour: age_X + λ (age_nb − age_X).' }
      - { var: wrongMid, feedback: 'That is always the midpoint. Use the given λ.' }
    explanation: |
      Numeric columns are interpolated as in SMOTE: ${=age} + {=lambda}({=nbAge} - {=age}) = {=newAge|2}$.

  - id: smotenc-why
    type: mcq
    skills: [smote-nc]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: smote-nc-vote }
    prompt: Why does the notebook use SMOTE-NC rather than plain SMOTE on Adult Income's raw columns?
    options:
      - 'Interpolating category codes creates values that are not real categories, e.g. 0.5 between Married and Divorced'
      - SMOTE-NC makes more synthetic points
      - Plain SMOTE cannot handle more than two classes
      - SMOTE-NC does not need nearest neighbours
    answer: 0
    explanation: You can interpolate an age, not a marital status. SMOTE-NC keeps interpolation for numeric columns and votes on categorical ones.

  - id: smotenc-code
    type: code-fill
    skills: [smote-nc]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: smote-nc }
    prompt: Complete the categorical step of SMOTE-NC.
    code: |
      from collections import Counter

      def smote_nc_point(x_i, neighbours, nb, lam, numeric, categorical):
          new = {}
          for col in numeric:
              new[col] = x_i[col] + lam * (nb[col] - x_i[col])
          for col in categorical:
              votes = Counter(n[col] for n in __BLANK_1__)
              new[col] = votes.__BLANK_2__(1)[0][0]
          return new
    blanks:
      '1': { accept: ['neighbours'] }
      '2': { accept: ['most_common'] }
    explanation: Count the category over all k neighbours and keep the most common one.

  - id: adasyn-g
    type: numeric
    skills: [adasyn]
    difficulty: 2
    tags: [math]
    generator: adasynQ
    lessonRef: { tab: math-code, id: adasyn }
    prompt: |
      ADASYN with k = {=k}. Training set: {=nMaj} majority, {=nMin} minority rows, so $G = {=G}$. The number of majority
      points among each minority point's k nearest neighbours is: {=deltaList}. How many synthetic points does
      **{=target}** get?
    answer: { var: g, tol: 0.01 }
    misconceptions:
      - { var: wrongUnnorm, feedback: 'You used r_i · G without normalizing. Divide r_i by the sum of all r first.' }
      - { var: wrongUniform, feedback: 'That spreads G evenly (SMOTE-like). ADASYN weights by difficulty.' }
    explanation: |
      $r_{ {=target} } = {=deltaT}/{=k}$, $\sum r = {=sumR|3}$, so $\hat r = {=rhat|3}$ and $g = \hat r \cdot G = {=g|2}$.

  - id: adasyn-hand
    type: hand-calc
    skills: [adasyn]
    difficulty: 3
    tags: [math]
    generator: adasynQ
    lessonRef: { tab: intuition, id: adasyn-hardness }
    prompt: 'ADASYN, k = {=k}, {=nMaj} majority and {=nMin} minority rows. Majority neighbours per minority point: {=deltaList}.'
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0 } }
    steps:
      - prompt: 'G = ?'
        answer: { var: G, tol: 0 }
      - prompt: 'r for {=target} = Δ/k'
        answer: { var: rT, tol: 0.01 }
      - prompt: 'Sum of r over all minority points'
        answer: { var: sumR, tol: 0.01 }
      - prompt: 'Synthetic points for {=target}'
        answer: { var: g, tol: 0.01 }
        misconceptions:
          - { var: wrongUnnorm, feedback: 'Normalize: divide r by the sum of r before multiplying by G.' }
    explanation: |
      G = {=nMaj} − {=nMin} = {=G}; r = {=deltaT}/{=k} = {=rT|3}; Σr = {=sumR|3}; g = r/Σr · G = {=g|2}.

