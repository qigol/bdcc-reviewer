templates:
  - id: lazy-accuracy
    type: numeric
    skills: [accuracy-trap]
    difficulty: 1
    tags: [math]
    generator: lazyQ
    lessonRef: { tab: intuition, id: lazy-model }
    prompt: |
      A dataset has **{=N}** rows, and **{=ratePct}%** of them belong to the minority class. A model predicts the majority
      class for every row. What is its accuracy, in percent?
    answer: { var: accuracyPct, tol: 0.01, percent: true }
    hints:
      - The model guesses the big group for everyone. Which rows does it get right?
      - Accuracy = rows it got right ÷ all rows. Here that is (majority rows) ÷ N.
      - 'First find the minority rows (rate × N), then subtract from N.'
    explanation: |
      Minority rows: {=nMin}; majority rows: {=nMaj}. The model is right on every majority row, so
      accuracy $= {=nMaj} \div {=N} = {=accuracyPct|2}\%$. It catches no minority rows, so its recall is 0.

  - id: lazy-recall-mcq
    type: mcq
    skills: [accuracy-trap]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: lazy-model }
    prompt: 'On a 99 : 1 dataset a model reports 99% accuracy. What can you conclude?'
    options:
      - 'Nothing yet: always guessing the big group also scores 99%, with 0% recall on the small group'
      - 'It has learned the small group well, since it is right 99 times in 100'
      - 'Its recall on the small group must also be about 99%'
      - 'It is overfitting, because 99% is too high for real data'
    answer: 0
    optionFeedback:
      1: "Always guessing the big group also scores 99%, so the accuracy says nothing about the small group."
      2: "Accuracy and minority recall can be far apart: the lazy model has 99% accuracy and 0% recall."
      3: "99% is exactly what the lazy model gets on 99 : 1 data. It points to imbalance, not overfitting."
    hints:
      - 'What accuracy would a model get if it always guessed the big group on a 99 : 1 dataset?'
    explanation: |
      An accuracy equal to the share of the big group is exactly what the lazy model gets. Look at the
      confusion matrix and the recall on the small group before believing it.

  - id: why-hurts-multi
    type: multi
    skills: [accuracy-trap]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: lazy-model }
    prompt: Which statements explain why uneven groups cause trouble? Select all that apply.
    options:
      - Mistakes on the rare group barely change the overall accuracy
      - The easiest way for a model to look good is to always guess the big group
      - 'A single accuracy number can hide 0% recall on the group that matters'
      - The usual score counts a missed rare case the same as any other wrong guess
      - Uneven data always contains labelling mistakes
      - Even groups guarantee a good model
    answer: [0, 1, 2, 3]
    optionFeedback:
      0: "Yes: the rare group is a tiny share of the rows, so its mistakes barely move accuracy."
      1: "Yes: guessing the big group is the lazy shortcut to a high score."
      2: "Yes: one overall number can sit on top of 0% recall."
      3: "Yes: plain accuracy weighs every mistake the same, however costly."
      4: "Imbalance is about group sizes, not label quality."
      5: "Balanced groups remove one problem but don't make a model good."
    hints:
      - Think about what happens to accuracy when you miss a few rare cases.
      - Two of the options claim things imbalance cannot promise.
    explanation: |
      Imbalance matters when the data, the score or the way the model learns lets us overlook the small group. It says
      nothing about labelling mistakes, and even groups alone do not make a model good.

  - id: tally-hand
    type: hand-calc
    skills: [confusion-matrix]
    difficulty: 1
    tags: [math]
    generator: confusionQ
    lessonRef: { tab: intuition, id: tally-fraud }
    prompt: 'Sort this table into a confusion matrix. The positive class is `pos`.'
    show:
      - { id: t, widget: Matrix, props: { data: '@table', title: 'actual and predicted labels' } }
    steps:
      - prompt: 'TP (really pos, guessed pos)'
        answer: { var: tp, tol: 0 }
      - prompt: 'FN (really pos, guessed neg)'
        answer: { var: fn, tol: 0 }
      - prompt: 'FP (really neg, guessed pos)'
        answer: { var: fp, tol: 0 }
        misconceptions:
          - { var: fn, feedback: 'That is FN. A false **positive** is a negative row the model called positive.' }
      - prompt: 'TN (really neg, guessed neg)'
        answer: { var: tn, tol: 0 }
    hints:
      - 'Go row by row. Look at the real answer first, then the guess.'
      - |
        The first letter says if the guess was right (True) or wrong (False). The second letter says what was guessed.
    explanation: |
      TP = {=tp}, FN = {=fn}, FP = {=fp}, TN = {=tn}; together {=n} rows. Positives are {=pos}, negatives {=neg}.

  - id: outcome-match
    type: match
    skills: [confusion-matrix]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: tally-fraud }
    prompt: Match each fraud-detection outcome to its cell.
    pairs:
      - ['A fraud the model flagged', 'True positive (TP)']
      - ['A fraud the model let through', 'False negative (FN)']
      - ['A legitimate payment flagged as fraud', 'False positive (FP)']
      - ['A legitimate payment cleared', 'True negative (TN)']
    hints:
      - '"True" or "False" says whether the guess was right. "Positive" or "Negative" says what was guessed.'
    explanation: The first word says whether the guess was right; the second says what was guessed.

  - id: confusion-code
    type: code-fill
    skills: [confusion-matrix]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: confusion-tally }
    prompt: Complete the tally. `positive` is the minority label.
    code: |
      def confusion_counts(actual, predicted, positive="Fraud"):
          tp = fn = fp = tn = 0
          for a, p in zip(actual, predicted):
              if a == positive and p == positive:
                  tp += 1
              elif a == positive:
                  __BLANK_1__ += 1
              elif p == __BLANK_2__:
                  fp += 1
              else:
                  tn += 1
          return tp, fn, fp, tn
    blanks:
      '1': { accept: ['fn'] }
      '2': { accept: ['positive'] }
    explanation: |
      Really positive but not guessed positive is a miss (FN). Really negative but guessed positive is a false alarm (FP).


  - id: precision-numeric
    type: numeric
    skills: [prf1]
    difficulty: 1
    tags: [math]
    generator: confusionQ
    lessonRef: { tab: math-code, id: four-metrics }
    prompt: 'A classifier has TP = {=tp}, FN = {=fn}, FP = {=fp}, TN = {=tn}. What is its **precision**?'
    show:
      - { id: cm, widget: Matrix, props: { data: '@cm', format: int, rowHeader: actual } }
    answer: { var: precision, tol: 0.01 }
    misconceptions:
      - { var: wrongPrecAsRec, feedback: 'That is recall, TP / (TP + FN). Precision divides by the alarms raised, TP + FP.' }
      - { var: wrongTpOverN, feedback: 'You divided by all rows. Precision only looks at the rows predicted positive.' }
    hints:
      - Precision only looks at the cases the model flagged as positive.
      - Precision = TP ÷ (TP + FP).
    explanation: |
      $P = \frac{TP}{TP + FP} = \frac{ {=tp} }{ {=tp} + {=fp} } = {=precision|2}$.

  - id: recall-numeric
    type: numeric
    skills: [prf1]
    difficulty: 1
    tags: [math]
    generator: confusionQ
    lessonRef: { tab: math-code, id: four-metrics }
    prompt: 'TP = {=tp}, FN = {=fn}, FP = {=fp}, TN = {=tn}. What is the **recall** on the positive class?'
    answer: { var: recall, tol: 0.01 }
    misconceptions:
      - { var: wrongRecAsPrec, feedback: 'That is precision. Recall divides by the real positives, TP + FN.' }
      - { var: wrongTpOverN, feedback: 'Recall divides by the actual positives, not by every row.' }
    hints:
      - Recall only looks at the cases that really were positive.
      - Recall = TP ÷ (TP + FN).
    explanation: |
      $R = \frac{TP}{TP + FN} = \frac{ {=tp} }{ {=tp} + {=fn} } = {=recall|2}$: the share of real positives caught.

  - id: f1-numeric
    type: numeric
    skills: [prf1]
    difficulty: 2
    tags: [math]
    generator: confusionQ
    lessonRef: { tab: intuition, id: four-metrics }
    prompt: 'TP = {=tp}, FN = {=fn}, FP = {=fp}, TN = {=tn}. Compute the **F1** score.'
    answer: { var: f1, tol: 0.01 }
    misconceptions:
      - {var: wrongF1Arith, feedback: 'That is the normal average (P + R) ÷ 2. F1 uses 2PR ÷ (P + R).'}
      - {var: accuracy, feedback: 'That is accuracy. F1 ignores TN completely.'}
    hints:
      - First compute precision P = TP ÷ (TP + FP) and recall R = TP ÷ (TP + FN).
      - Then F1 = 2 × P × R ÷ (P + R).
    explanation: |
      P = {=precision|3}, R = {=recall|3}. $F_1 = \frac{2PR}{P + R} = {=f1|3}$.

  - id: metrics-hand
    type: hand-calc
    skills: [prf1, confusion-matrix]
    difficulty: 2
    tags: [math]
    generator: confusionQ
    lessonRef: { tab: math-code, id: four-metrics }
    prompt: |
      Compute the four scores for this confusion matrix (rows = real answer, columns = guess).
    show:
      - { id: cm, widget: Matrix, props: { data: '@cm', format: int, rowHeader: actual } }
    steps:
      - prompt: Accuracy
        answer: { var: accuracy, tol: 0.01 }
        hint: Right guesses (TP + TN) ÷ all rows.
      - prompt: Precision
        answer: { var: precision, tol: 0.01 }
        misconceptions:
          - { var: wrongPrecAsRec, feedback: 'That is recall. Precision = TP / (TP + FP).' }
        hint: TP ÷ everything guessed positive.
      - prompt: Recall
        answer: { var: recall, tol: 0.01 }
        hint: TP ÷ everything really positive.
      - prompt: F1
        answer: { var: f1, tol: 0.01 }
        misconceptions:
          - var: wrongF1Arith
            feedback: That is the normal average. F1 = 2PR ÷ (P + R).
        hint: 2 × P × R ÷ (P + R).
    hints:
      - 'Find TP, FN, FP and TN in the matrix first. The real-positive row holds TP and FN.'
    explanation: |
      Accuracy $= ({=tp} + {=tn})/{=n} = {=accuracy|3}$; P $= {=tp}/({=tp}+{=fp}) = {=precision|3}$;
      R $= {=tp}/({=tp}+{=fn}) = {=recall|3}$; $F_1 = {=f1|3}$.

  - id: balanced-accuracy
    type: numeric
    skills: [prf1, accuracy-trap]
    difficulty: 2
    tags: [math]
    generator: confusionQ
    lessonRef: { tab: math-code, id: four-metrics }
    prompt: |
      TP = {=tp}, FN = {=fn}, FP = {=fp}, TN = {=tn}. The Session 3 notebook also reports [[balanced-accuracy|balanced
      accuracy]]: the average of the recall on each group. Compute it.
    answer: { var: balanced, tol: 0.01 }
    misconceptions:
      - { var: wrongBalancedAcc, feedback: 'That is plain accuracy. Balanced accuracy averages the two per-class recalls.' }
      - { var: recall, feedback: 'That is only the positive-class recall. Average it with TN / (TN + FP).' }
    hints:
      - 'You need two recalls, one for the positive group and one for the negative group.'
      - Positive recall = TP ÷ (TP + FN). Negative recall = TN ÷ (TN + FP).
      - Add the two and divide by 2.
    explanation: |
      Recall on positives = {=recall|3}; recall on negatives = TN ÷ (TN + FP) = {=specificity|3}. Balanced accuracy is
      their average: {=balanced|3}. The lazy model would score only 0.5.

  - id: metric-match
    type: match
    skills: [prf1]
    difficulty: 1
    tags: [math]
    lessonRef: { tab: math-code, id: four-metrics }
    prompt: Match each metric to its formula.
    pairs:
      - ['Accuracy', '$(TP + TN)/(TP + TN + FP + FN)$']
      - ['Precision', '$TP/(TP + FP)$']
      - ['Recall', '$TP/(TP + FN)$']
      - ['F1', '$2PR/(P + R)$']
      - ['Balanced accuracy', '$\tfrac12\big(TP/(TP+FN) + TN/(TN+FP)\big)$']
    pick: 4
    hints:
      - Precision and recall both have TP on top. Which mistake goes with which?
    explanation: Precision and recall share TP on top; FP goes with precision, FN with recall.

  - id: metrics-code
    type: code-fill
    skills: [prf1]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: four-metrics }
    prompt: Fill in precision and recall.
    code: |
      def scores(tp, fn, fp, tn):
          accuracy = (tp + tn) / (tp + tn + fp + fn)
          precision = tp / (tp + __BLANK_1__)
          recall = tp / (tp + __BLANK_2__)
          f1 = 2 * precision * recall / (precision + recall)
          return accuracy, precision, recall, f1
    blanks:
      '1': { accept: ['fp'] }
      '2': { accept: ['fn'] }
    hints:
      - Precision divides by everything flagged; recall by everything really positive.
    explanation: Precision divides by everything flagged (TP + FP); recall by every real positive (TP + FN).

  - id: per-class-recall
    type: numeric
    skills: [per-class]
    difficulty: 2
    tags: [math]
    generator: perClassQ
    lessonRef: { tab: math-code, id: per-class-recall }
    prompt: |
      Confusion matrix of counts (rows = real group, columns = guess) for groups A = Normal, B = Underweight,
      C = Severely Underweight. What is the recall for group **{=cls}**?
    show:
      - { id: m, widget: Matrix, props: { data: '@M', format: int, rowHeader: actual } }
    answer: { var: recall, tol: 0.01 }
    misconceptions:
      - { var: precision, feedback: 'You divided by the column total: that is precision. Recall divides by the row (actual class) total.' }
      - { var: accuracy, feedback: 'That is the overall accuracy. Recall for one class uses only that class''s row.' }
    hints:
      - 'Recall for one group uses only that group''s row.'
      - 'Divide the diagonal box of that row by the row''s total.'
    explanation: |
      Row {=cls}: diagonal {=diag} out of {=rowSum} actual {=cls} cases, so recall $= {=diag}/{=rowSum} = {=recall|3}$.

  - id: macro-recall
    type: numeric
    skills: [per-class]
    difficulty: 3
    tags: [math]
    generator: perClassQ
    lessonRef: { tab: math-code, id: per-class-recall }
    prompt: |
      For the same kind of matrix, compute the [[macro-average|macro recall]]: the plain average of the three groups' recalls.
    show:
      - { id: m, widget: Matrix, props: { data: '@M', format: int, rowHeader: actual } }
    answer: { var: macroRecall, tol: 0.01 }
    misconceptions:
      - { var: accuracy, feedback: 'That is overall accuracy, which weights classes by size. Macro recall averages the three recalls equally.' }
      - { var: meanPrecision, feedback: 'You averaged precisions (column-based). Use each row''s diagonal / row total.' }
    hints:
      - 'Work out each group''s recall first (diagonal box ÷ row total).'
      - Add the three recalls and divide by 3. Do not weight by group size.
    explanation: |
      Each group's recall: ({=recalls|list}). Their plain average is $ {=macroRecall|3}$. The weakest group is {=worst}.

  - id: sigla-mcq
    type: mcq
    skills: [per-class]
    difficulty: 1
    tags: [application]
    lessonRef: { tab: intuition, id: per-class-sigla }
    prompt: |
      SIGLA's estimated-height version matches or beats the measured-height one on every overall score (macro-F1 0.69 vs
      0.65). In its table (rows add up to 1), the diagonal is 0.94 for Normal and 0.00 for Severely Underweight. What is the
      right conclusion?
    options:
      - 'It never catches a severely underweight learner, the group SIGLA exists to find'
      - 'It is the better model, because the overall scores are higher'
      - 'It labels 94% of all learners correctly'
      - Its precision for Severely Underweight is 0.94
    answer: 0
    optionFeedback:
      1: "Higher overall scores hid zero recall on the group the decision is about."
      2: "0.94 is the recall of the Normal row only, not of all learners."
      3: "With rows adding to 1, the diagonal is recall, and the Severely Underweight diagonal is 0.00."
    hints:
      - 'In a table whose rows add up to 1, what does the diagonal box tell you?'
    explanation: |
      When each row adds up to 1, the diagonal box is that group's recall. A decent average hid zero recall on the
      group the decision is about.


  - id: rus-size
    type: numeric
    skills: [random-resampling]
    difficulty: 1
    tags: [math]
    generator: resampleQ
    lessonRef: { tab: math-code, id: undersampling }
    prompt: |
      A training set has {=nMaj} majority and {=nMin} minority rows. How many rows are left after random **undersampling** to a 50 : 50 balance?
    answer: { var: rus, tol: 0 }
    misconceptions:
      - { var: wrongDoubleMaj, feedback: 'That is the size after **over**sampling (2 × majority).' }
      - { var: wrongKeepAll, feedback: 'Undersampling removes majority rows; the size must shrink.' }
    hints:
      - Undersampling keeps every minority row and removes majority rows.
      - The majority is cut down to the same size as the minority.
    explanation: |
      Keep all {=nMin} minority rows and {=nMin} majority rows: $2 \times {=nMin} = {=rus}$. {=removed} majority rows are dropped.

  - id: ros-copies
    type: numeric
    skills: [random-resampling]
    difficulty: 1
    tags: [math]
    generator: resampleQ
    lessonRef: { tab: math-code, id: oversampling }
    prompt: |
      {=nMaj} majority and {=nMin} minority training rows. How many **copies** does random oversampling add to reach 50 : 50?
    answer: { var: added, tol: 0 }
    misconceptions:
      - { var: wrongDoubleMaj, feedback: 'That is the final size. The question asks how many rows are added.' }
      - { var: nMaj, feedback: 'The minority already has some rows; only the gap must be filled.' }
    hints:
      - The minority must grow until it is as big as the majority.
      - How many rows short is the minority?
    explanation: |
      Fill the gap: ${=nMaj} - {=nMin} = {=added}$ copies (the same row may be copied more than once). Final size
      $2 \times {=nMaj} = {=ros}$.

  - id: rus-code
    type: code-fill
    skills: [random-resampling]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: undersampling }
    prompt: Complete random undersampling.
    code: |
      def random_undersample(X, y, rng):
          minority = np.where(y == 1)[0]
          majority = np.where(y == 0)[0]
          keep = rng.choice(majority, size=__BLANK_1__, replace=__BLANK_2__)
          idx = np.concatenate([minority, keep])
          return X[idx], y[idx]
    blanks:
      '1': { accept: ['len(minority)', 'minority.size', 'minority.shape[0]'] }
      '2': { accept: ['False'] }
    hints:
      - How many majority rows should be kept? As many as which group has?
    explanation: |
      Pick as many majority rows as there are minority rows, and do not pick any row twice (`replace=False`).


  - id: technique-match
    type: match
    skills: [random-resampling, smote, smote-nc, adasyn]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: resample-counts }
    prompt: Match each technique to what it does to the training data.
    pairs:
      -   - Random undersampling
          - Removes some majority rows
      -   - Random oversampling
          - Copies minority rows
      -   - SMOTE
          - Makes new minority points between real ones
      -   - SMOTE-NC
          - 'Blends number columns, votes on name columns'
      -   - ADASYN
          - Makes more new points where the minority is hardest to learn
    hints:
      - Two methods are simple (delete or copy). Three make new points.
    explanation: |
      Two simple methods (delete or copy) and three that make new points (between neighbours, for mixed data, aimed at hard areas).


  - id: smote-coordinate
    type: numeric
    skills: [smote]
    difficulty: 1
    tags: [math]
    generator: smoteQ
    lessonRef: { tab: math-code, id: smote }
    prompt: |
      SMOTE: minority point $x_i = ({=xi1}, {=xi2})$, chosen neighbour $x_{\text{nb}} = ({=xn1}, {=xn2})$, $\lambda = {=lambda}$.
      What is the **first** coordinate of $x_{\text{new}}$?
    answer: { var: x1, tol: 0.01 }
    misconceptions:
      - { var: wrongRev, feedback: 'You started from the neighbour: x_nb + λ(x_i − x_nb). SMOTE starts at x_i and moves λ towards x_nb.' }
      - { var: wrongScale, feedback: 'λ multiplies the difference (x_nb − x_i), not the neighbour itself.' }
    hints:
      - 'Start at x_i, not at the neighbour.'
      - new = x_i + λ × (neighbour − x_i). Work out the gap first.
    explanation: |
      ${=xi1} + {=lambda} \times ({=xn1} - {=xi1}) = {=xi1} + {=lambda} \times {=diff1} = {=x1|2}$.

  - id: smote-hand
    type: hand-calc
    skills: [smote]
    difficulty: 2
    tags: [math]
    generator: knnQ
    lessonRef: { tab: intuition, id: smote-line }
    prompt: |
      Minority point $x_i = ({=xi|list})$. The other minority points are {=pts}. Use squared distance (square each gap,
      then add), k = 1 (only the nearest neighbour), and $\lambda = {=lambda}$.
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0, title: 'other minority points' } }
    steps:
      - prompt: Squared distance from $x_i$ to its nearest minority neighbour
        answer: { var: dNearest, tol: 0 }
      - prompt: First coordinate of $x_{\text{new}}$
        answer: { var: x1, tol: 0.01 }
      - prompt: Second coordinate of $x_{\text{new}}$
        answer: { var: x2, tol: 0.01 }
    hints:
      - Compute the squared distance from x_i to each other point and pick the smallest.
      - 'Then for each coordinate, new = old + λ × (neighbour − old).'
    explanation: |
      Squared distances: {=d2s}. Nearest: {=nearest} = ({=nb|list}). $x_{\text{new}} = x_i + {=lambda}(x_{\text{nb}} - x_i) = ({=x1|2}, {=x2|2})$.

  - id: knn-mcq
    type: mcq
    skills: [smote]
    difficulty: 2
    tags: [math]
    generator: knnQ
    lessonRef: { tab: math-code, id: smote }
    prompt: |
      SMOTE looks for the nearest **minority** neighbour of $x_i = ({=xi|list})$. Candidates: {=pts}. Which is nearest
      (Euclidean distance)?
    hints:
      - 'For each candidate, square the gap in each coordinate and add them up.'
    explanation: |
      Squared distances: {=d2s}. The smallest belongs to **{=nearest}**. (Skipping the square root does not change which is closest.)

  - id: smote-code
    type: code-fill
    skills: [smote]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: smote }
    prompt: Complete one SMOTE step.
    code: |
      def smote_point(X_min, i, k, rng):
          x_i = X_min[i]
          d2 = ((X_min - x_i) ** 2).sum(axis=1)
          d2[i] = np.inf
          neighbours = np.argsort(d2)[:__BLANK_1__]
          nb = rng.choice(neighbours)
          lam = rng.uniform(0, 1)
          return x_i + lam * (__BLANK_2__)
    blanks:
      '1': { accept: ['k'] }
      '2': { accept: ['X_min[nb] - x_i', 'X_min[nb]-x_i'] }
    hints:
      - How many neighbours does SMOTE keep? The function has a parameter for it.
    explanation: Keep the k smallest distances, then move a random fraction λ along the difference from x_i to the neighbour.

  - id: smote-order
    type: order
    skills: [smote]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: smote-line }
    prompt: Put the steps for creating one SMOTE point in order.
    items:
      - Pick a minority point x_i
      - Measure its distance to the other minority points
      - Keep its k nearest minority neighbours
      - Choose one of those neighbours at random
      - Pick a random λ between 0 and 1
      - Set x_new = x_i + λ (x_nb − x_i)
    explanation: 'Find the neighbours first, then pick a random partner and a random spot on the line between them.'

  - id: smotenc-vote
    type: mcq
    skills: [smote-nc]
    difficulty: 2
    tags: [math]
    generator: smotencQ
    lessonRef: { tab: intuition, id: smote-nc-vote }
    prompt: |
      SMOTE-NC creates a row from X. X's three minority neighbours have marital-status {=neigh}; the interpolation
      partner is {=chosen} ({=chosenMarital}). What marital-status does the synthetic row get?
    show:
      - { id: t, widget: Matrix, props: { data: '@table', title: 'X and its neighbours' } }
    hints:
      - Name columns are never averaged. Who gets a say?
    explanation: |
