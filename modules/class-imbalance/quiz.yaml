          - { var: precision, feedback: 'That divides by the column: precision. Recall uses the row of real {=cls} cases.' }
      - prompt: Precision for group {=cls} (3 decimals)
        answer: { var: precision, tol: 0.005 }
        misconceptions:
          - { var: recall, feedback: 'That divides by the row: recall. Precision uses the column of cases guessed {=cls}.' }
      - prompt: Macro recall (3 decimals)
        answer: { var: macroRecall, tol: 0.005 }
        misconceptions:
          - { var: accuracy, feedback: 'That is overall accuracy, which weights groups by size. Average the three recalls.' }
    hints:
      - Recall reads along a row; precision reads down a column.
    explanation: |
      Group {=cls}: recall {=diag}/{=rowSum} = {=recall|3}, precision {=diag}/{=colSum} = {=precision|3}. Recalls
      ({=recalls|list}) average to a macro recall of {=macroRecall|3}, against an accuracy of {=accuracy|3}.

