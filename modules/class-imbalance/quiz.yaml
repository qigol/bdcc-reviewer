  - id: adasyn-code
    type: code-fill
    skills: [adasyn]
    difficulty: 3
    tags: [code]
    lessonRef: { tab: math-code, id: adasyn }
    prompt: Complete the ADASYN counts.
    code: |
      def adasyn_counts(X, y, k=3):
          minority = np.where(y == 1)[0]
          G = (y == 0).sum() - (y == 1).sum()
          r = []
          for i in minority:
              d2 = ((X - X[i]) ** 2).sum(axis=1)
              d2[i] = np.inf
              nn = np.argsort(d2)[:k]
              delta = (y[nn] == __BLANK_1__).sum()
              r.append(delta / k)
          r_hat = np.array(r) / __BLANK_2__
          return np.rint(r_hat * G).astype(int)
    blanks:
      '1': { accept: ['0'] }
      '2': { accept: ['sum(r)', 'np.sum(r)', 'np.array(r).sum()'] }
    explanation: 'Δ counts **majority** (label 0) neighbours; dividing by the sum makes the shares add up to 1.'

