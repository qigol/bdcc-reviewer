          2: Recall alone ignores wasted interviews.
          3: Specificity ignores the qualified group.
        explanation: F1 is the harmonic mean of precision and recall.

  - id: transfer-resampling
    type: two-tier
    skills: [random-resampling, smote]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: smote-line }
    prompt: A credit-default dataset has 950 non-defaults and 50 defaults. The team copies each default row 19 times before training. What is the main risk?
    options: ['Overfitting to the same 50 defaults', 'Losing most of the non-default data', 'Changing the test set']
    answer: 0
    reasons:
      - Exact copies add no new information, so the model can memorize them
      - Copying rows deletes other rows
      - Oversampling is applied to the test set
    reasonAnswer: 0
    optionFeedback:
      1: That's undersampling.
      2: Done properly, only the training set is resampled.
    reasonFeedback:
      1: Oversampling adds rows; it doesn't remove any.
      2: The test set should be left alone.
    hints: [What do copies add?]
    explanation: Duplicates invite overfitting; SMOTE's interpolated points are one alternative.
    variants:
      - prompt: Another team keeps only 50 of the 950 non-defaults to balance the classes. What is the main risk?
        options: ['Throwing away most of the information', 'Overfitting to copied rows', 'Leakage into the test set']
        answer: 0
        reasons:
          - Undersampling discards 900 real rows
          - Undersampling creates copies
          - Undersampling moves test rows into training
        reasonAnswer: 0
        optionFeedback:
          1: No rows are copied.
          2: Leakage comes from resampling before splitting.
        reasonFeedback:
          1: It only removes rows.
          2: It doesn't move rows between sets.
        explanation: Random undersampling loses information.
      - prompt: A dataset has a categorical column "region" with values like NCR and Visayas. Which oversampler fits?
        options: ['SMOTE-NC', 'Plain SMOTE', 'Neither; categories can''t be oversampled']
        answer: 0
        reasons:
          - SMOTE-NC blends numbers and votes on categories
          - Plain SMOTE blends categories into impossible in-between values
          - Categorical data can never be resampled
        reasonAnswer: 0
        optionFeedback:
          1: Blending category codes invents regions that don't exist.
          2: SMOTE-NC handles them.
        reasonFeedback:
          1: Plain SMOTE does that, which is the problem.
          2: SMOTE-NC handles mixed data.
        explanation: Use SMOTE-NC for mixed numeric and categorical data.

