          2: Accuracy is dominated by legitimate transactions.
          3: Row counts aren't a quality metric.
        explanation: With limited review capacity, precision of the flagged list matters most.
      - prompt: A scholarship screen should both catch most qualified applicants and not waste interviews. Which single score balances the two?
        options: ['F1', 'Accuracy', 'Recall only', 'Specificity']
        answer: 0
        optionFeedback:
