    source: 'Session 2, slide 14'
    page: 14
    fn: siglaView
    in: { sigla: '@sigla', model: marker }
    expect: { normal: 0.94, uw: 0.29, sevuw: 0, worst: SevUW }
  - id: sigla-code
    source: 'Session 2, slide 14'
    page: 14
    fn: perClassCode
    in: { M: '@sigla.marker' }
    expect: { recalls: [0, 0.29, 0.94, 0.28, 0.61] }
  - id: adult-ratio
    source: 'Session 3 notebook, section 3'
    fn: stratifiedSplit
    in: { majority: 37155, minority: 11687, testSize: 0.25 }
    expect: { ratio: 3.2, minRate: 0.239 }
    tol: 0.05
  - id: adult-split
    source: 'Session 3 notebook, section 3'
    fn: stratifiedSplit
    in: { majority: 37155, minority: 11687, testSize: 0.25 }
    expect: { trainRows: 36631, testRows: 12211, trainMinRate: 0.239 }
    tol: 0.0005
  - id: adult-rus
    source: 'Session 3 notebook, technique 1'
    fn: adultCounts
    in: { adult: '@adult', method: RUS }
    expect: { rows: 17530, minProp: 0.5 }
  - id: adult-ros
    source: 'Session 3 notebook, technique 2'
    fn: adultCounts
    in: { adult: '@adult', method: ROS }
    expect: { rows: 55732, minProp: 0.5 }
  - id: adult-pipeline
    source: 'Session 3 notebook, sections 3 and technique 1'
    fn: pipelineCode
    in: { adult: '@adult', method: RUS }
    expect: { testRows: 12211, testMin: 2922, resampled: 17530 }
  - id: smote-lambda-0
    source: 'Session 3 notebook, technique 3'
    fn: smoteInterp
    in: { xi: [7, 5], xnb: [9, 3], lambda: 0 }
    expect: { x: [7, 5] }
    note: λ = 0 lands on x_i.
  - id: smote-lambda-1
    source: 'Session 3 notebook, technique 3'
    fn: smoteInterp
    in: { xi: [7, 5], xnb: [9, 3], lambda: 1 }
    expect: { x: [9, 3] }
    note: λ = 1 lands on the neighbour.
  - id: smote-codes
    source: 'Session 3 notebook, technique 4'
    fn: smoteInterp
    in: { xi: [0], xnb: [1], lambda: 0.5 }
    expect: { x1: 0.5 }
    note: Married = 0, Divorced = 1, λ = 0.5 gives 0.5, a category that does not exist.
  - id: toy-smote
    source: 'Beyond the slides (toy map)'
    fn: smoteToy
    in: { toy: '@toy', i: M2, k: 2, nb: M4, lambda: 0.5 }
    expect: { neighbours: [M1, M4], x: [8, 4] }
  - id: toy-smote-code
    source: 'Beyond the slides (toy map)'
    fn: smoteCode
    in: { toy: '@toy', i: M2, k: 2, nb: M4, lambda: 0.5 }
    expect: { x: [8, 4] }
  - id: toy-knn-walk
    source: 'Beyond the slides (toy map)'
    fn: knnWalk
    in: { toy: '@toy', target: M2, k: 2 }
    expect: { neighbours: [M1, M4], steps: 5 }
  - id: toy-smote-nc
    source: 'Session 3 notebook, technique 4 (illustrative rows)'
    fn: smoteNC
    in: { rows: '@snc', i: X, nb: N2, lambda: 0.5 }
    expect: { age: 39, hours: 55, marital: Married, workclass: Private }
  - id: toy-smote-nc-code
    source: 'Session 3 notebook, technique 4 (illustrative rows)'
    fn: smoteNCCode
    in: { rows: '@snc', i: X, nb: N2, lambda: 0.5 }
    expect: { age: 39, marital: Married }
  - id: toy-adasyn
    source: 'Beyond the slides (toy map)'
    fn: adasyn
    in: { toy: '@toy', k: 3 }
    expect: { G: 5, deltas: [1, 1, 0, 0, 3], gs: [1, 1, 0, 0, 3], generated: 5 }
  - id: toy-adasyn-walk
    source: 'Beyond the slides (toy map)'
    fn: adasynWalk
    in: { toy: '@toy', k: 3 }
    expect: { steps: 7, g.M5: 3 }
  - id: toy-adasyn-code
    source: 'Beyond the slides (toy map)'
    fn: adasynCode
    in: { toy: '@toy', k: 3 }
    expect: { g: [1, 1, 0, 0, 3] }
  - id: toy-rus
    source: 'Beyond the slides (toy map)'
    fn: rusCode
    in: { toy: '@toy' }
    expect: { rows: 10 }
  - id: toy-ros
    source: 'Beyond the slides (toy map)'
    fn: rosCode
    in: { toy: '@toy' }
    expect: { rows: 20 }
  - id: cost-switch
    source: 'Session 3 notebook, section 5 (derived)'
    fn: costCompare
    in: { results: '@results', ratio: 1 }
    expect: { best: Baseline }
    note: When a miss costs the same as a false alarm, the un-resampled baseline makes the fewest total errors.
  - id: cost-switch-adasyn
    source: 'Session 3 notebook, section 5 (derived)'
    fn: costCompare
    in: { results: '@results', ratio: 5 }
    expect: { best: ADASYN }
