sections:
  - id: lazy-baseline
    title: The lazy baseline
    skills: [accuracy-trap]
    summary: |
      The "lazy model" guesses the big group for everyone and never reads a single [[feature]]. Its
      [[accuracy|accuracy]] is just the share of the big group, and its [[recall|recall]] on the rare group is zero. Any
      real model must beat it on the score that matters.
    keyFormula: '\text{Accuracy}_{\text{lazy}} = \frac{n_{\text{maj}}}{N}, \qquad \text{Recall}_{\text{lazy}} = 0'
    state: { nMaj: 9859, nMin: 141 }
    derive:
      - { fn: lazyCode, in: { nMaj: '@nMaj', nMin: '@nMin' }, out: lz }
    live:
      - id: counts
        widget: Readout
        props:
          items:
            - { label: 'majority (stays)', value: '@nMaj' }
            - { label: 'minority (drops out)', value: '@nMin' }
            - { label: accuracy, value: '@lz.accuracy', format: 4, tone: good }
            - { label: 'minority recall', value: '@lz.recall', format: 2, tone: bad }
    steps:
      - tex: |
          \anchor{n}{N = n_{\text{maj}} + n_{\text{min}}}
        say: |
          Count everyone. $n_{\text{maj}}$ is the size of the big group, $n_{\text{min}}$ the size of the small one.
      - tex: |
          \anchor{acc}{\text{Accuracy} = \frac{n_{\text{maj}}}{N}}
        say: 'It guesses "big group" every time, so it is right on exactly the big-group rows.'
      - tex: |
          \anchor{tp}{TP = 0} \;\Rightarrow\; \anchor{rec}{\text{Recall} = \frac{TP}{TP + FN} = \frac{0}{n_{\text{min}}} = 0}
        say: 'It never guesses "small group", so it catches none of them. TP (caught cases) is 0, so recall is 0.'
      - tex: |
          \text{Accuracy} = \frac{ {=nMaj} }{ {=nMaj} + {=nMin} } = {=lz.accuracy|4}, \qquad \text{Recall} = {=lz.recall}
        say: 'Slide 9: 10,000 learners with a 1.41% dropout rate.'
    code:
      lang: python
      source: |
        def lazy_model_scores(n_majority, n_minority):
            """Accuracy and minority recall of "predict the majority for everyone".

            Args:
                n_majority: rows in the majority class (learners who stay).
                n_minority: rows in the minority class (dropouts).

            Returns:
                (accuracy, recall), recall measured on the minority class.
                Lecture: lazy_model_scores(9859, 141) == (0.9859, 0.0)
            """
            n = n_majority + n_minority      # @a:n
            accuracy = n_majority / n        # @a:acc
            tp = 0                           # @a:tp
            recall = tp / n_minority         # @a:rec
            return accuracy, recall
    links:
      - { anchor: n, label: 'N, every row' }
      - { anchor: acc, label: 'accuracy = majority share', say: 'Right on every majority row, wrong on every minority row.' }
      - { anchor: tp, label: 'TP = 0', say: 'The minority label is never predicted.' }
      - { anchor: rec, label: 'recall = 0' }
    trace: { fn: lazyCode, in: { nMaj: '@nMaj', nMin: '@nMin' } }
    examples: [lazy-sagip, lazy-99-1, lazy-code]
    pitfalls:
      - |
        A high accuracy on uneven data does not prove the model learned anything. First compare it with the share of the big group.
      - '"98.6% accurate" and "never finds a dropout" can both be true about the same model.'
    examTip: |
      Before praising an accuracy, divide the big group by the total. A useful model must beat that and catch at least some rare cases.


    tryIt:
      - lazy-accuracy
      - lazy-recall-mcq
  - id: confusion-tally
    title: Tallying the confusion matrix
    skills: [confusion-matrix]
    summary: |
      Go through the rows once. Each pair (real answer, guess) lands in exactly one of four boxes: fraud caught (TP), fraud
      missed (FN), false alarm (FP) or normal payment cleared (TN). The four counts always add up to the number of rows.
    keyFormula: '\begin{pmatrix} TP & FN \\ FP & TN \end{pmatrix}, \qquad TP + FN + FP + TN = N'
    data: [fraud18]
    derive:
      - { fn: fraudSheet, in: { table: '@fraud18', upTo: 0 }, out: fs }
      - { fn: cmPayload, in: { tp: 0, fn: 0, fp: 0, tn: 0, blank: true }, out: blankCm }
      - { fn: confusion, in: { table: '@fraud18' }, out: c }
    live:
      - id: fraud
        widget: Matrix
        props: { data: '@fs.table', title: 'Slides 19–20: the 18 transactions' }
      - id: cm
        widget: Matrix
        props: { data: '@blankCm', format: int, title: 'Rows = actual, columns = predicted', emptyLabel: '·' }
    steps:
      - tex: |
          \anchor{init}{TP = FN = FP = TN = 0}
        say: Start four counters at zero.
      - tex: |
          \anchor{loop}{\text{for each row } (a_i, \hat y_i):} \quad
          \begin{cases}
            \anchor{tp}{TP \mathrel{+}= 1} & a_i = +,\ \hat y_i = + \\
            \anchor{fn}{FN \mathrel{+}= 1} & a_i = +,\ \hat y_i = - \\
            \anchor{fp}{FP \mathrel{+}= 1} & a_i = -,\ \hat y_i = + \\
            \anchor{tn}{TN \mathrel{+}= 1} & a_i = -,\ \hat y_i = -
          \end{cases}
        say: |
          For each row, $a_i$ is the real answer and $\hat y_i$ ("y-hat") is the guess. + means Fraud, the [[positive-class|positive class]]. Exactly one line applies.
      - tex: |
          \anchor{ret}{\begin{pmatrix} TP & FN \\ FP & TN \end{pmatrix}} = \begin{pmatrix} {=c.tp} & {=c.fn} \\ {=c.fp} & {=c.tn} \end{pmatrix}, \qquad {=c.tp} + {=c.fn} + {=c.fp} + {=c.tn} = {=c.n}
        say: 'Slide 21: most guesses are right, but 2 of the 4 frauds sit in the FN box.'
    code:
      lang: python
      source: |
        def confusion_counts(actual, predicted, positive="Fraud"):
            """Tally a binary confusion matrix, one row at a time.

            Args:
                actual: true labels, e.g. ["Legit", "Fraud", ...].
                predicted: the model's labels, same length.
                positive: the minority label the decision is about.

            Returns:
                (tp, fn, fp, tn).
                Lecture: the 18 fraud transactions give (2, 2, 1, 13).
            """
            tp = fn = fp = tn = 0                    # @a:init
            for a, p in zip(actual, predicted):      # @a:loop
                if a == positive and p == positive:
                    tp += 1                          # @a:tp
                elif a == positive:
                    fn += 1                          # @a:fn
                elif p == positive:
                    fp += 1                          # @a:fp
                else:
                    tn += 1                          # @a:tn
            return tp, fn, fp, tn                    # @a:ret
    extraCode:
      - lang: python
        title: With scikit-learn
        source: |
          from sklearn.metrics import confusion_matrix

          # labels= fixes the order: positive class first, as on slide 21
          cm = confusion_matrix(actual, predicted, labels=["Fraud", "Legit"])
          (tp, fn), (fp, tn) = cm
    links:
      - { anchor: init, label: 'four counters at 0' }
      - { anchor: loop, label: 'one pass over the rows' }
      - { anchor: tp, label: 'TP: caught fraud' }
      - { anchor: fn, label: 'FN: missed fraud', say: 'The costly error in fraud, dropout and nutrition screening.' }
      - { anchor: fp, label: 'FP: false alarm' }
      - { anchor: tn, label: 'TN: correct legit' }
      - { anchor: ret, label: 'the 2×2 matrix' }
    trace: { fn: confusionCode, in: { table: '@fraud18' } }
    examples: [fraud-tally, fraud-tally-walk, fraud-metrics-code]
    pitfalls:
      - |
        scikit-learn sorts the labels itself unless you pass `labels=`. With 0/1 labels you get [[TN, FP], [FN, TP]], the mirror image of slide 21.
      - The four boxes must add up to the number of rows. Always check.
    examTip: |
      Decide which group is "positive" first. Fill the real-positive row (TP, FN) before the real-negative row (FP, TN).


    tryIt:
      - tally-hand
      - confusion-code
  - id: four-metrics
    title: Accuracy, precision, recall, F1
    skills: [prf1]
    summary: |
      All four scores come from the same four boxes. Accuracy uses every right guess. [[precision|Precision]] looks only
      at the cases the model flagged. [[recall|Recall]] looks only at the real cases. [[f1|F1]] combines precision and recall.
    keyFormula: 'P = \frac{TP}{TP + FP}, \quad R = \frac{TP}{TP + FN}, \quad F_1 = \frac{2PR}{P + R}'
    state: { tp: 2, fn: 2, fp: 1, tn: 13 }
    derive:
      - { fn: metrics, in: { tp: '@tp', fn: '@fn', fp: '@fp', tn: '@tn' }, out: m }
      - { fn: cmPayload, in: { tp: '@tp', fn: '@fn', fp: '@fp', tn: '@tn' }, out: cmv }
    live:
      - id: cm
        widget: Matrix
        props: { data: '@cmv', format: int, title: 'Rows = actual, columns = predicted' }
      - id: scores
        widget: Readout
        props:
          items:
            - { label: accuracy, value: '@m.accuracy', format: 3 }
            - { label: precision, value: '@m.precision', format: 2 }
            - { label: recall, value: '@m.recall', format: 2, tone: accent }
            - { label: F1, value: '@m.f1', format: 2 }
    steps:
      - tex: |
          \anchor{acc}{\text{Accuracy} = \frac{TP + TN}{TP + TN + FP + FN}}
        say: |
          Right guesses divided by all guesses. When the rare group is tiny, TN (normal cases cleared) makes up most of it.
      - tex: |
          \anchor{prec}{\text{Precision} = \frac{TP}{TP + FP}} \qquad \anchor{rec}{\text{Recall} = \frac{TP}{TP + FN}}
        say: |
          Both have TP on top. Precision divides by everything the model flagged; recall divides by everything that was really positive.
      - tex: |
          \anchor{f1}{F_1 = 2 \cdot \frac{P \cdot R}{P + R}}
        say: A special average that stays close to the smaller of precision (P) and recall (R).
      - tex: |
          \frac{ {=tp} + {=tn} }{ {=m.n} } = {=m.accuracy|3}, \quad P = \frac{ {=tp} }{ {=tp} + {=fp} } = {=m.precision|2}, \quad R = \frac{ {=tp} }{ {=tp} + {=fn} } = {=m.recall|2}, \quad F_1 = {=m.f1|2}
        say: 'Slide 22: 83.3% accuracy, yet only half of the fraud is caught.'
    code:
      lang: python
      source: |
        def scores(tp, fn, fp, tn):
            """The four slide-22 metrics from one confusion matrix.

            Args:
                tp, fn, fp, tn: the four cells, positive = minority.

            Returns:
                (accuracy, precision, recall, f1).
                Lecture: scores(2, 2, 1, 13) ≈ (0.833, 0.67, 0.50, 0.57)
            """
            accuracy = (tp + tn) / (tp + tn + fp + fn)          # @a:acc
            precision = tp / (tp + fp)                           # @a:prec
            recall = tp / (tp + fn)                              # @a:rec
            f1 = 2 * precision * recall / (precision + recall)   # @a:f1
            return accuracy, precision, recall, f1
    extraCode:
      - lang: python
        title: With scikit-learn (as in the Session 3 notebook)
        source: |
          from sklearn.metrics import (accuracy_score, balanced_accuracy_score,
                                       precision_score, recall_score, f1_score)

          acc = accuracy_score(y_true, y_pred)
          bal = balanced_accuracy_score(y_true, y_pred)   # mean of per-class recall
          prec = precision_score(y_true, y_pred, zero_division=0)  # 0 if nothing flagged
          rec = recall_score(y_true, y_pred, zero_division=0)
          f1 = f1_score(y_true, y_pred, zero_division=0)
    links:
      - {anchor: acc, label: accuracy, say: 'Uses all four boxes; the big group dominates it.'}
      - {anchor: prec, label: precision, say: 'Looks down the "guessed Fraud" column: TP and FP.'}
      - {anchor: rec, label: recall, say: 'Looks along the "really Fraud" row: TP and FN.'}
      - { anchor: f1, label: F1 }
    trace: { fn: metricsCode, in: { tp: '@tp', fn: '@fn', fp: '@fp', tn: '@tn' } }
    examples: [fraud-metrics]
    pitfalls:
      - |
        Precision and recall share the top number, TP. Mixing up their bottom numbers is the most common slip.
      - 'F1 is not the normal average: (0.67 + 0.50) ÷ 2 = 0.58, but F1 = 0.57.'
      - 'If the model flags nothing, precision is 0 ÷ 0. The notebook then reports 0 (`zero_division=0`).'
    examTip: |
      Write P = TP/(TP+FP) and R = TP/(TP+FN) side by side before plugging in. FP goes with precision, FN with recall.


    tryIt:
      - recall-numeric
      - f1-numeric
      - metrics-code
  - id: per-class-recall
    title: Per-class recall
    skills: [per-class]
    summary: |
      With more than two groups, work out recall for each group. If every row of the table adds up to 1, the diagonal box
      of each row **is** that group's recall. The [[macro-average|macro average]] gives every group equal weight, so a
      forgotten rare group shows up.
    keyFormula: '\text{Recall}_c = \frac{C_{cc}}{\sum_j C_{cj}}, \qquad \text{Macro} = \frac{1}{K}\sum_c \text{Recall}_c'
    data: [sigla]
    state: { model: marker }
    derive:
      - { fn: siglaView, in: { sigla: '@sigla', model: '@model' }, out: sv }
    live:
      - id: pick
        widget: Choice
        props:
          label: SIGLA height input
          options:
            - { value: anthro, label: Anthropometric }
            - { value: marker, label: Marker-derived }
        bind: { value: model }
      - id: sigla
        widget: Matrix
        props: { data: '@sv.M', format: 2, heatmap: seq, title: 'Slide 14, row-normalized (rows = actual)' }
      - id: macro
        widget: Readout
        props:
          items:
            - { label: 'Normal recall', value: '@sv.normal', format: 2, tone: good }
            - { label: 'Sev. UW recall', value: '@sv.sevuw', format: 2, tone: bad }
            - { label: 'macro recall', value: '@sv.macroRecall', format: 3 }
    steps:
      - tex: |
          \anchor{row}{\tilde C_{cj} = \frac{C_{cj}}{\sum_{j} C_{cj}}}
        say: |
          Divide each box by its row total, so each row (one real group) adds up to 1. Slide 14 is already like this.
      - tex: |
          \anchor{loop}{\text{for each class } c:} \quad \anchor{diag}{\text{Recall}_c = \tilde C_{cc}}
        say: The diagonal box is the share of group c that was labelled as c.
      - tex: |
          \anchor{macro}{\text{Macro recall} = \frac{1}{K}\sum_{c=1}^{K} \text{Recall}_c}
        say: |
          Add the K recalls and divide by K, the number of groups. Every group counts once, whatever its size (beyond the slides).
      - tex: |
          \text{Sev. UW} = {=sv.sevuw|2}, \quad \text{UW} = {=sv.uw|2}, \quad \text{Normal} = {=sv.normal|2}, \quad \text{Macro} = {=sv.macroRecall|3}
        say: 'Switch the input: the estimated-height version never catches Severely Underweight.'
    code:
      lang: python
      source: |
        import numpy as np

        def per_class_recall(cm, classes, normalized=True):
            """Recall of every class from a confusion matrix (rows = actual).

            Args:
                cm: K × K array; counts, or already row-normalized (slide 14).
                classes: the K class names in row order.
                normalized: True if each row already sums to 1.

            Returns:
                (dict class → recall, macro recall).
                Lecture: marker-derived SIGLA gives Normal 0.94, Sev. UW 0.00.
            """
            if not normalized:
                cm = cm / cm.sum(axis=1, keepdims=True)    # @a:row
            recalls = {}
            for i, c in enumerate(classes):                # @a:loop
                recalls[c] = cm[i, i]                      # @a:diag
            macro = sum(recalls.values()) / len(recalls)   # @a:macro
            return recalls, macro
    links:
      - {anchor: row, label: 'row-normalize', say: 'Divide each row by its total, so rows add up to 1.'}
      - { anchor: loop, label: 'one class at a time' }
      - { anchor: diag, label: 'diagonal = recall' }
      - { anchor: macro, label: 'macro average' }
    trace: { fn: perClassCode, in: { M: '@sv.M' } }
    examples: [sigla-anthro, sigla-marker, sigla-code]
    pitfalls:
      - |
        If rows add up to 1, the diagonal shows recall. If columns add up to 1, it shows precision. Check which way first.
      - |
        Overall scores can improve while the group that matters collapses (SIGLA estimated vs measured height).
    examTip: |
      Find the group the decision is about, read its row, and report its diagonal box as that group's recall.


    tryIt:
      - per-class-recall
      - macro-recall
  - id: undersampling
    title: Random undersampling
    skills: [random-resampling]
    summary: |
      Keep every minority row, plus the same number of majority rows picked at random. Nothing new is made; the
      [[training-set|training set]] shrinks to twice the minority count. Quick, but real information is thrown away.
    keyFormula: 'n_{\text{majority}}^{\text{kept}} = n_{\text{minority}}'
    data: [toy, adult]
    derive:
      - { fn: resampleToy, in: { toy: '@toy', method: RUS }, out: rt }
      - { fn: adultCounts, in: { adult: '@adult', method: RUS }, out: ac }
    live:
      - id: plot
        widget: Chart
        props: { kind: scatter, series: '@rt.series', xLabel: x1, yLabel: x2, title: 'Toy map after RUS (kept majority + all minority)' }
      - id: counts
        widget: Readout
        props:
          items:
            - { label: 'toy rows after RUS', value: '@rt.rows', tone: good }
            - { label: 'Adult rows after RUS', value: '@ac.rows' }
            - { label: 'Adult majority dropped', value: '@ac.removed', tone: bad }
    steps:
      - tex: |
          \anchor{min}{I_{\min} = \{\, i : y_i = 1 \,\}} \qquad \anchor{maj}{I_{\text{maj}} = \{\, i : y_i = 0 \,\}}
        say: 'Make two lists of row numbers: the minority rows ($y_i = 1$) and the majority rows ($y_i = 0$).'
      - tex: |
          \anchor{draw}{K \subset I_{\text{maj}}, \ |K| = |I_{\min}|} \ \text{(drawn without replacement)}
        say: 'Pick, at random, as many majority rows as there are minority rows. Each row can be picked only once.'
      - tex: |
          \anchor{join}{D' = I_{\min} \cup K}, \qquad |D'| = 2\,n_{\min}
        say: 'Put them together. Half the rows are minority, half majority.'
      - tex: |
          \text{Adult: } 2 \times {=ac.trainMin} = {=ac.rows} \text{ rows}, \quad {=ac.removed} \text{ majority rows discarded}
        say: 'Notebook technique 1: 17,530 training rows, now 50% minority.'
    code:
      lang: python
      source: |
        import numpy as np

        def random_undersample(X, y, rng):
            """Drop random majority rows until both classes are equal (RUS).

            Args:
                X: feature rows; y: 0/1 labels, 1 = minority.
                rng: a numpy Generator, e.g. np.random.default_rng(42).

            Returns:
                (X_res, y_res) with 2 · n_minority rows.
                Lecture: Adult train 27,866 + 8,765 → 17,530 rows.
            """
            minority = np.where(y == 1)[0]                                  # @a:min
            majority = np.where(y == 0)[0]                                  # @a:maj
            keep = rng.choice(majority, size=len(minority), replace=False)  # @a:draw
            idx = np.concatenate([minority, keep])                          # @a:join
            return X[idx], y[idx]
    extraCode:
      - lang: python
        title: imbalanced-learn (Session 3 notebook)
        source: |
          from imblearn.under_sampling import RandomUnderSampler

          rus = RandomUnderSampler(random_state=42)
          X_train_rus, y_train_rus = rus.fit_resample(X_train, y_train)   # train only
    links:
      - { anchor: min, label: 'minority indices' }
      - { anchor: maj, label: 'majority indices' }
      - { anchor: draw, label: 'random subset, no replacement' }
      - { anchor: join, label: 'balanced training set' }
    trace: { fn: rusCode, in: { toy: '@toy' } }
    examples: [adult-rus, toy-rus]
    pitfalls:
      - 'Undersampling can throw away thousands of useful majority rows, which hurts when data is scarce.'
      - 'Rebalance the training set only. The [[test-set|test set]] must keep the real-world imbalance.'
    examTip: 'After undersampling: 2 × the minority count. After oversampling: 2 × the majority count.'

    tryIt:
      - rus-size
      - rus-code
  - id: oversampling
    title: Random oversampling
    skills: [random-resampling]
    summary: |
      Keep every row and add random copies of minority rows until the minority matches the majority. The same row may be
      copied more than once. Nothing is lost, but the copies sit on exactly the same spots, which invites
      [[overfitting|overfitting]].
    keyFormula: 'n_{\text{minority}}^{\text{new}} = n_{\text{majority}}'
    data: [toy, adult]
    derive:
      - { fn: resampleToy, in: { toy: '@toy', method: ROS }, out: rt }
      - { fn: adultCounts, in: { adult: '@adult', method: ROS }, out: ac }
    live:
      - id: plot
        widget: Chart
        props: { kind: scatter, series: '@rt.series', xLabel: x1, yLabel: x2, title: 'Toy map after ROS: copies land on existing points' }
      - id: counts
        widget: Readout
        props:
          items:
            - { label: 'toy rows after ROS', value: '@rt.rows', tone: good }
            - { label: 'Adult rows after ROS', value: '@ac.rows' }
            - { label: 'Adult copies added', value: '@ac.added', tone: warn }
    steps:
      - tex: |
          \anchor{min}{I_{\min}}, \ \anchor{maj}{I_{\text{maj}}}: \quad \text{need } n_{\text{maj}} - n_{\min} \text{ extra minority rows}
        say: The gap between the two groups is how many extra minority rows we need.
      - tex: |
          \anchor{draw}{E = (e_1, \dots, e_{n_{\text{maj}} - n_{\min}}),\ e_t \sim \text{Uniform}(I_{\min})} \ \text{(with replacement)}
        say: 'Pick that many minority rows at random. The same row may be picked again ("with replacement").'
      - tex: |
          \anchor{join}{D' = D \cup E}, \qquad |D'| = 2\,n_{\text{maj}}
        say: 'Every original row stays, and now the minority matches the majority.'
      - tex: |
          \text{Adult: } 2 \times {=ac.trainMaj} = {=ac.rows} \text{ rows}, \quad {=ac.added} \text{ copies}
        say: 'Notebook technique 2: 55,732 training rows, now 50% minority.'
    code:
      lang: python
      source: |
        import numpy as np

        def random_oversample(X, y, rng):
            """Add random copies of minority rows until both classes are equal (ROS).

            Args:
                X: feature rows; y: 0/1 labels, 1 = minority.
                rng: a numpy Generator.

            Returns:
                (X_res, y_res) with 2 · n_majority rows.
                Lecture: Adult train 27,866 + 8,765 → 55,732 rows.
            """
            minority = np.where(y == 1)[0]                                  # @a:min
            majority = np.where(y == 0)[0]                                  # @a:maj
            need = len(majority) - len(minority)
            extra = rng.choice(minority, size=need, replace=True)          # @a:draw
            idx = np.concatenate([majority, minority, extra])               # @a:join
            return X[idx], y[idx]
    extraCode:
      - lang: python
        title: imbalanced-learn (Session 3 notebook)
        source: |
          from imblearn.over_sampling import RandomOverSampler

          ros = RandomOverSampler(random_state=42)
          X_train_ros, y_train_ros = ros.fit_resample(X_train, y_train)
    links:
      - { anchor: min, label: 'minority indices' }
      - { anchor: maj, label: 'majority indices' }
      - { anchor: draw, label: 'copies, with replacement' }
      - { anchor: join, label: 'originals + copies' }
    trace: { fn: rosCode, in: { toy: '@toy' } }
    examples: [adult-ros, toy-ros]
    pitfalls:
      - 'Copies add no new spots on the map. The minority cloud gets denser, not wider.'
      - |
        If you oversample before splitting, copies of one row can end up in both training and test: that is [[resampling-leakage|leakage]].
    examTip: 'Copies added = majority count − minority count. Final size = 2 × majority count.'

    tryIt:
      - ros-copies
  - id: smote
    title: SMOTE
    skills: [smote]
    summary: |
      Take a minority point, find its k [[nearest-neighbour|nearest minority neighbours]], pick one at random, and put a
      new point a random fraction λ of the way towards it. New points fill the gaps between real minority points instead
      of stacking on top of them.
    keyFormula: 'x_{\text{new}} = x_i + \lambda\,(x_{\text{nb}} - x_i), \quad \lambda \sim U(0, 1)'
    data: [toy]
    state: { lam: 0.5, nb: M4 }
    derive:
      - { fn: smoteToy, in: { toy: '@toy', i: M2, k: 2, nb: '@nb', lambda: '@lam' }, out: sm }
    live:
      - id: plot
        widget: Chart
        props: { kind: scatter, series: '@sm.series', xLabel: x1, yLabel: x2, title: 'Synthesizing from M2 = (7, 5)' }
      - id: lam-s
        widget: Slider
        props: { label: 'λ', min: 0, max: 1, step: 0.05, format: 2 }
        bind: { value: lam }
      - id: nb-c
        widget: Choice
        props:
          label: chosen neighbour
          options:
            - { value: M1, label: 'M1 (8, 6)' }
            - { value: M4, label: 'M4 (9, 3)' }
        bind: { value: nb }
      - id: out
        widget: Readout
        props:
          items:
            - { label: 'x_new', value: '({=sm.x1}, {=sm.x2})', tone: good }
    steps:
      - tex: |
          \anchor{dist}{d^2(x_i, x_j) = \sum_f (x_{jf} - x_{if})^2} \quad (j \text{ minority},\ j \ne i)
        say: |
          Squared distance: for each feature f, square the gap, then add them up. Only other minority points count.
      - tex: |
          \anchor{knn}{N_k(x_i) = \text{the } k \text{ smallest } d^2}
        say: |
          Keep the k points with the smallest distances (imbalanced-learn uses k = 5; the practice map uses k = 2).
      - tex: |
          \anchor{pick}{x_{\text{nb}} \in N_k(x_i) \text{ at random}}, \qquad \anchor{lam}{\lambda \sim U(0, 1)}
        say: 'Pick one of them at random, and a random λ between 0 and 1.'
      - tex: |
          \anchor{new}{x_{\text{new}} = x_i + \lambda\,(x_{\text{nb}} - x_i)}
        say: Start at $x_i$ and move λ of the way towards the neighbour.
      - tex: |
          {=sm.tex}
        say: 'Practice map: M2''s two nearest are M1 (squared distance 2) and M4 (8).'
    code:
      lang: python
      source: |
        import numpy as np

        def smote_point(X_min, i, k, rng):
            """One synthetic minority point, SMOTE style.

            Args:
                X_min: minority rows only (numeric), shape (n_min, d).
                i: index of the point to oversample; k: neighbours to consider.
                rng: a numpy Generator.

            Returns:
                A new point on the segment from X_min[i] to a near neighbour.
                Toy map: M2 = (7, 5), neighbour M4 = (9, 3), λ = 0.5 → (8, 4).
            """
            x_i = X_min[i]
            d2 = ((X_min - x_i) ** 2).sum(axis=1)     # @a:dist
            d2[i] = np.inf
            neighbours = np.argsort(d2)[:k]           # @a:knn
            nb = rng.choice(neighbours)               # @a:pick
            lam = rng.uniform(0, 1)                   # @a:lam
            return x_i + lam * (X_min[nb] - x_i)      # @a:new
    extraCode:
      - lang: python
        title: imbalanced-learn (Session 3 notebook)
        source: |
          from imblearn.over_sampling import SMOTE

          # SMOTE needs numeric input: one-hot encode first (encoder fit on train only)
          smote = SMOTE(random_state=42)            # k_neighbors=5 by default
          E_train_smote, y_train_smote = smote.fit_resample(E_train, y_train)
    links:
      - { anchor: dist, label: 'squared distances to minority points' }
      - { anchor: knn, label: 'k nearest minority neighbours' }
      - { anchor: pick, label: 'random neighbour' }
      - { anchor: lam, label: 'λ ~ U(0, 1)' }
      - { anchor: new, label: 'interpolate' }
    trace: { fn: smoteCode, in: { toy: '@toy', i: M2, k: 2, nb: '@nb', lambda: '@lam' } }
    examples: [smote-lambda-0, smote-lambda-1, toy-smote, toy-smote-code, toy-knn-walk]
    pitfalls:
      - |
        Start from x_i and move towards the neighbour: x_i + λ(x_nb − x_i). Starting from the neighbour gives a mirror-image point.
      - SMOTE needs numbers. Blending codes for names creates values that do not exist.
      - A minority point sitting among majority points can make SMOTE create points in the wrong area.
    examTip: 'Do one coordinate at a time: new = old + λ × (neighbour − old).'

    tryIt:
      - smote-hand
      - smote-code
  - id: smote-nc
    title: SMOTE-NC
    skills: [smote-nc]
    summary: |
      Data with both numbers and names needs two rules. Number columns are blended exactly as in SMOTE. Each
      [[categorical-feature|name column]] takes the most common value among the point's minority neighbours: a vote, not
      an average, so every new row has real values.
    keyFormula: 'x^{\text{num}}_{\text{new}} = x^{\text{num}}_i + \lambda\,(x^{\text{num}}_{\text{nb}} - x^{\text{num}}_i), \qquad x^{\text{cat}}_{\text{new}} = \operatorname{mode}\{x^{\text{cat}}_j : j \in N_k(x_i)\}'
    data: [snc]
    derive:
      - { fn: smoteNC, in: { rows: '@snc', i: X, nb: N2, lambda: 0.5, blank: true }, out: blank }
      - { fn: smoteNC, in: { rows: '@snc', i: X, nb: N2, lambda: 0.5 }, out: nc }
    live:
      - id: snc
        widget: Matrix
        props: { data: '@blank.table', title: 'X, its 3 minority neighbours, and the new row (chosen neighbour N2, λ = 0.5)', emptyLabel: '?' }
    steps:
      - tex: |
          \anchor{numloop}{\text{for each numeric column } f:} \quad \anchor{interp}{x_{\text{new},f} = x_{i,f} + \lambda\,(x_{\text{nb},f} - x_{i,f})}
        say: Ages and hours can be blended; halfway between 30 and 40 is 35.
      - tex: |
          \anchor{catloop}{\text{for each categorical column } f:} \quad \anchor{votes}{\text{count } x_{j,f},\ j \in N_k(x_i)}
        say: 'Halfway between Married and Divorced makes no sense, so count the neighbours'' values instead.'
      - tex: |
          \anchor{mode}{x_{\text{new},f} = \text{the most frequent value}}
        say: 'The most common value wins. All k neighbours vote, not just the one used for blending.'
      - tex: |
          \text{age} = 40 + 0.5(38 - 40) = {=nc.age}, \quad \text{marital} = \text{mode}(\text{ {=nc.maritalVotes} }) = \text{ {=nc.marital} }
        say: 'The blending partner N2 is Divorced, yet the new row is Married: 2 votes to 1.'
    code:
      lang: python
      source: |
        from collections import Counter

        def smote_nc_point(x_i, neighbours, nb, lam, numeric, categorical):
            """One synthetic row for mixed numeric + categorical data.

            Args:
                x_i: the minority row (dict column → value).
                neighbours: its k nearest minority rows; nb: the one chosen.
                lam: λ in [0, 1]; numeric / categorical: column names.

            Returns:
                dict: interpolated numerics, majority-vote categories.
                Toy rows: age 39, hours 55, Married, Private.
            """
            new = {}
            for col in numeric:                                   # @a:numloop
                new[col] = x_i[col] + lam * (nb[col] - x_i[col])  # @a:interp
            for col in categorical:                               # @a:catloop
                votes = Counter(n[col] for n in neighbours)       # @a:votes
                new[col] = votes.most_common(1)[0][0]             # @a:mode
            return new
    extraCode:
      - lang: python
        title: imbalanced-learn (Session 3 notebook)
        source: |
          from imblearn.over_sampling import SMOTENC

          # categoricals stay as raw columns; tell SMOTE-NC where they are
          categorical_idx = [FEATURES.index(c) for c in CATEGORICAL]
          smotenc = SMOTENC(categorical_features=categorical_idx, random_state=42)
          X_train_snc, y_train_snc = smotenc.fit_resample(X_train, y_train)
    links:
      - { anchor: numloop, label: 'numeric columns' }
      - { anchor: interp, label: 'interpolate (as SMOTE)' }
      - { anchor: catloop, label: 'categorical columns' }
      - { anchor: votes, label: 'count neighbour values' }
      - { anchor: mode, label: 'most frequent wins' }
    trace: { fn: smoteNCCode, in: { rows: '@snc', i: X, nb: N2, lambda: 0.5 } }
    examples: [smote-codes, toy-smote-nc, toy-smote-nc-code]
    pitfalls:
      - Telling SMOTE-NC the wrong columns makes it blend a name or vote on a number.
      - 'The name value comes from the neighbours'' vote, not from the one neighbour used for blending.'
    examTip: 'For each column ask: can I average it? Yes: blend. No: majority vote of the k neighbours.'

    tryIt:
      - smotenc-vote
      - smotenc-code
  - id: adasyn
    title: ADASYN
    skills: [adasyn]
    summary: |
      ADASYN decides how many SMOTE-style points each minority point gets. Points whose nearest neighbours are mostly
      majority are "hard" and get more. The total, G = majority − minority, is shared out in proportion to each point's hardness.
    keyFormula: 'r_i = \frac{\Delta_i}{k}, \quad \hat r_i = \frac{r_i}{\sum_j r_j}, \quad g_i = \hat r_i \cdot G'
    data: [toy]
    derive:
      - { fn: adasynSheet, in: { toy: '@toy', k: 3 }, out: sheetData }
      - { fn: adasyn, in: { toy: '@toy', k: 3 }, out: ad }
    live:
      - id: sheet
        widget: Matrix
        props: { rows: '@sheetData.rows', cols: '@sheetData.cols', values: '@sheetData.values', format: 2, title: 'ADASYN worksheet: k = 3 nearest among all points, Δ = majority among them, r = Δ/k' }
    steps:
      - tex: |
          \anchor{budget}{G = (n_{\text{maj}} - n_{\min}) \cdot \beta}, \quad \beta = 1
        say: 'How many new points to make in total. β = 1 means "make the groups equal".'
      - tex: |
          \anchor{knn}{N_k(x_i)} = k \text{ nearest among all points}
        say: 'Unlike SMOTE, these neighbours can be from either group.'
      - tex: |
          \anchor{delta}{\Delta_i = \#\{\, j \in N_k(x_i) : y_j = 0 \,\}}
        say: 'Δ ("delta") counts how many of them are majority.'
      - tex: |
          \anchor{r}{r_i = \frac{\Delta_i}{k}}, \qquad \anchor{rhat}{\hat r_i = \frac{r_i}{\sum_j r_j}}
        say: |
          Hardness $r_i$ is Δ divided by k. Then divide each by the total so they add up to 1 ($\hat r_i$, "r-hat").
      - tex: |
          \anchor{g}{g_i = \hat r_i \cdot G}
        say: Each minority point then makes $g_i$ new SMOTE points towards its minority neighbours.
      - tex: |
          G = {=ad.G}, \quad \Delta = ({=ad.deltas|list}), \quad g = ({=ad.gs|list})
        say: 'Practice map: M5, buried among the majority, gets 3 of the 5 new points.'
    code:
      lang: python
      source: |
        import numpy as np

        def adasyn_counts(X, y, k=3):
            """How many synthetic points each minority row gets under ADASYN.

            Args:
                X: all training rows (numeric); y: 0/1 labels, 1 = minority.
                k: neighbours used to judge difficulty.

            Returns:
                int array g, one count per minority row (sums to about G).
                Toy map: Δ = (1, 1, 0, 0, 3) → g = (1, 1, 0, 0, 3).
            """
            minority = np.where(y == 1)[0]
            G = (y == 0).sum() - (y == 1).sum()        # @a:budget
            r = []
            for i in minority:
                d2 = ((X - X[i]) ** 2).sum(axis=1)
                d2[i] = np.inf
                nn = np.argsort(d2)[:k]                # @a:knn
                delta = (y[nn] == 0).sum()             # @a:delta
                r.append(delta / k)                    # @a:r
            r_hat = np.array(r) / sum(r)               # @a:rhat
            return np.rint(r_hat * G).astype(int)      # @a:g
    extraCode:
      - lang: python
        title: imbalanced-learn (Session 3 notebook)
        source: |
          from imblearn.over_sampling import ADASYN

          adasyn = ADASYN(random_state=42)          # n_neighbors=5 by default
          E_train_ada, y_train_ada = adasyn.fit_resample(E_train, y_train)
          # minority lands near, not exactly at, 50%: 56,090 rows, 0.503 minority
    links:
      - { anchor: budget, label: 'total budget G' }
      - { anchor: knn, label: 'k nearest, all classes' }
      - { anchor: delta, label: 'Δ_i majority neighbours' }
      - { anchor: r, label: 'hardness r_i' }
      - { anchor: rhat, label: 'normalize r̂_i' }
      - { anchor: g, label: 'points per minority row' }
    trace: { fn: adasynCode, in: { toy: '@toy', k: 3 } }
    examples: [toy-adasyn, toy-adasyn-walk, toy-adasyn-code]
    pitfalls:
      - 'Forgetting to divide by the total: r_i × G will not add up to G.'
      - |
        A minority point surrounded by majority points may just be noise, yet ADASYN gives it the most new points.
      - 'Rounding means the total can miss G slightly, so the final minority share need not be exactly 50%.'
    examTip: 'List Δ for every minority point, divide each by their sum (k cancels out), then multiply by G.'

    tryIt:
      - adasyn-hand
      - adasyn-code
  - id: honest-pipeline
    title: Split first, resample train only
    skills: [choosing]
    summary: |
      The [[test-set|test set]] must look like the real world. So split first, with a [[stratified-split|stratified split]]
      so both parts keep the group shares; rebalance only the training part; then score on the untouched test set with the
      score your decision needs.
    keyFormula: 'D \to (D_{\text{train}}, D_{\text{test}}) \to \text{resample}(D_{\text{train}}) \to \text{fit} \to \text{score on } D_{\text{test}}'
    data: [adult]
    state: { method: RUS }
    derive:
      - { fn: pipelineTable, in: { adult: '@adult', method: '@method' }, out: pt }
    live:
      - id: m
        widget: Choice
        props:
          label: resampler
          options:
            - { value: none, label: none }
            - { value: RUS, label: RUS }
            - { value: ROS, label: ROS }
        bind: { value: method }
      - id: counts
        widget: Matrix
        props: { data: '@pt', format: 3, title: 'Adult Income rows at each stage' }
    steps:
      - tex: |
          \anchor{split}{|D_{\text{test}}| = \lceil 0.25 \cdot N \rceil, \ \text{class ratio kept (stratify)}}
        say: 'Split first: 12,211 test rows, 23.9% minority, the same as the full data.'
      - tex: |
          \anchor{resample}{D_{\text{train}} \to D'_{\text{train}}} \quad \text{(the test set is never resampled)}
        say: Rebalancing the test set would grade the model on a world that does not exist.
      - tex: |
          \anchor{fit}{\hat f = \text{fit}(D'_{\text{train}})}, \qquad \anchor{score}{\text{score}(\hat f, D_{\text{test}})}
        say: 'Same model, same untouched test set, so the methods can be compared fairly.'
    code:
      lang: python
      source: |
        from sklearn.model_selection import train_test_split
        from sklearn.metrics import recall_score

        def honest_recall(X, y, resampler, model):
            """Recall on an untouched test set, resampling the training half only.

            Args:
                X, y: the full data; resampler: e.g. RandomUnderSampler(...).
                model: an unfitted classifier.

            Returns:
                float: minority recall on the original, imbalanced test set.
            """
            # @a split
            X_tr, X_te, y_tr, y_te = train_test_split(
                X, y, test_size=0.25, stratify=y, random_state=42)
            # @end
            X_rs, y_rs = resampler.fit_resample(X_tr, y_tr)    # @a:resample
            model.fit(X_rs, y_rs)                              # @a:fit
            return recall_score(y_te, model.predict(X_te))     # @a:score
    extraCode:
      - lang: python
        title: Inside cross-validation (imblearn Pipeline)
        source: |
          from imblearn.pipeline import Pipeline
          from imblearn.over_sampling import SMOTE
          from sklearn.model_selection import cross_val_score

          # the sampler runs on each training fold only, never on the validation fold
          pipe = Pipeline([("smote", SMOTE(random_state=42)), ("clf", model)])
          scores = cross_val_score(pipe, X_train, y_train, scoring="recall", cv=5)
    links:
      - { anchor: split, label: 'stratified split first' }
      - { anchor: resample, label: 'resample train only' }
      - { anchor: fit, label: 'fit on resampled train' }
      - { anchor: score, label: 'score on untouched test' }
    trace: { fn: pipelineCode, in: { adult: '@adult', method: '@method' } }
    examples: [adult-split, adult-ratio, adult-pipeline]
    pitfalls:
      - |
        Rebalancing before the split leaks copies (ROS) or blends (SMOTE) of test rows into training, so scores look too good.
      - 'Without `stratify=y`, a small minority can end up badly under-represented in the test set.'
      - |
        The notebook leaves [[class-weights|class weights]] off on purpose, to see the effect of rebalancing alone.
    examTip: |
      Split → rebalance (training only) → fit → score (test). Rows rebalanced after the split never touch the test set.
    tryIt:
      - test-minority
      - pipeline-code
