version: 1.1.0
title: Class Imbalance
shortTitle: Imbalance
summary: |
  When one group is rare, a model can look accurate while missing every case that matters. Learn to read a confusion
  matrix group by group, then rebalance the training data with undersampling, oversampling, SMOTE, SMOTE-NC or ADASYN.
course: ML2
order: 10
color: '#e05a2b'
icon: scale
