prerequisites: []
skills:
  - id: accuracy-trap
    label: The accuracy trap
    description: Why a model that always predicts the majority can post high accuracy and zero minority recall.
  - id: confusion-matrix
    label: Confusion matrix
    description: Tallying TP, FN, FP and TN from actual and predicted labels.
  - id: prf1
    label: Precision, recall, F1
    description: The four metrics from one confusion matrix, and balanced accuracy.
  - id: per-class
    label: Per-class performance
    description: Reading per-class recall off a row-normalized confusion matrix; macro averages.
  - id: random-resampling
    label: Random under- and oversampling
    description: Deleting majority rows or duplicating minority rows until the classes match.
  - id: smote
    label: SMOTE
    description: Synthesizing minority points on the segment to a nearest minority neighbour.
  - id: smote-nc
    label: SMOTE-NC
    description: 'SMOTE for mixed data: interpolate numeric columns, vote on categorical ones.'
  - id: adasyn
    label: ADASYN
    description: Giving more synthetic points to minority points surrounded by the majority.
  - id: choosing
    label: Honest evaluation and choosing a method
    description: Split first, resample only the training set, and pick the trade-off the decision needs.
