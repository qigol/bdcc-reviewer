  notes: |
    Built from the Session 2 deck (SAGIP, SIGLA, the lazy-model baseline, the 18-row fraud example) and the Session 3 instructor notebook (Adult Income, five resampling techniques, the final comparison table). Every slide number reproduces from logic.js. SMOTE and ADASYN are taught step by step on a 15-point toy map (beyond the slides) because the notebook only runs imbalanced-learn on 36,631 rows. v1.1.0 (2026-10-05): rewritten in plain language for learners who start from zero; guide edition 2 (every term defined in the beat that first shows it, new basic terms such as classifier, feature, training set and threshold, practice and reflect gates, tryIt, quiz hints). No ids changed.
