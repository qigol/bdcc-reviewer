objectives:
  - id: spot-the-trap
    text: |
      Show why a high accuracy can hide a model that catches none of the rare cases, by comparing it with always guessing the common group.
    skills:
      - accuracy-trap
  - id: score-a-model
    text: |
      Fill in a confusion matrix from guesses and compute accuracy, precision, recall, F1 and the recall of each group.
    skills:
      - confusion-matrix
      - prf1
      - per-class
  - id: rebalance-by-hand
    text: |
      Work out by hand what undersampling, oversampling, SMOTE, SMOTE-NC and ADASYN do to a small training set.
    skills:
      - random-resampling
      - smote
      - smote-nc
      - adasyn
  - id: choose-honestly
    text: |
      Pick a rebalancing method by the cost of each kind of mistake, and test it honestly by rebalancing only the training set.
    skills:
      - choosing
