scenes:
  - id: lazy-model
    title: The lazy model
    goal: Would you trust a model that is right 98.6% of the time but never finds a single dropout?
    skills: [accuracy-trap]
    state: { ratePct: 1.41 }
    derive:
      - { fn: lazyModel, in: { N: 10000, ratePct: '@ratePct' }, out: lz }
    stage:
      - id: bars
        widget: Chart
        props: { kind: bar, series: '@lz.bars', yLabel: learners, title: '10,000 learners' }
      - id: scores
        widget: Readout
        region: side
        props:
          items:
            - { label: 'accuracy (%)', value: '@lz.accuracyPct', format: 2, tone: good }
            - { label: 'dropout recall', value: '@lz.recall', format: 2, tone: bad }
            - { label: 'dropout F1', value: '@lz.f1', format: 2, tone: bad }
      - id: rate
        widget: Slider
        region: side
        hidden: true
        props: { label: 'dropout rate (%)', min: 0.5, max: 50, step: 0.01, format: 2 }
        bind: { value: ratePct }
    beats:
      - say: |
          Imagine a program that reads a learner's school records and guesses: will this learner **stay** or **drop out**?
          A program that sorts cases into groups like this is a **classifier**. Each piece of information it reads, like
          attendance or grades, is a **feature**.
        define: [classifier, feature]
      - say: |
          The lecture's example is **SAGIP**, a dropout-risk system for Filipino learners. Only about **1.41%** of learners
          drop out. The dropouts are the small, rare group: the **minority class**. The learners who stay are the
          **majority class**. When one group is this much smaller, we have **class imbalance**.
        define: [minority-class, majority-class, class-imbalance]
        gate:
          type: predict
          question: Out of 10,000 learners, how many drop out at a 1.41% rate?
          answer: { value: 141 }
          explain: '1.41% of 10,000 = 0.0141 × 10,000 = 141 dropouts. The other 9,859 stay.'
      - say: |
          Now build the laziest classifier possible: it says **"stays"** for every learner, without reading anything.
          How good does it look? The usual score is **accuracy**: the share of guesses that were right.
        define: [accuracy]
        gate:
          type: predict
          question: What accuracy (in %) does the lazy model get?
          answer: { value: 98.59, tol: 0.01 }
          explain: 'It is right about all 9,859 learners who stay, and wrong about the 141 who leave. 9,859 ÷ 10,000 = 98.59%.'
      - say: |
          98.59% sounds excellent. But we built this to find dropouts. **Recall** asks the question that matters:
          out of all the real dropouts, what share did the model catch?
        define: [recall]
        gate:
          type: predict
          question: What is the lazy model's recall on dropouts?
          options: ['0', '0.0141', '0.9859', '1']
          answer: 0
          explain: 'It never says "drops out", so it catches 0 of the 141 dropouts. 0 ÷ 141 = 0.'
      - say: |
          This is the **accuracy trap**: a model that ignores the rare group can still get a high accuracy. Use the slider to
          change how rare dropouts are and watch the lazy model's accuracy.
        define: [accuracy-paradox]
        show: [rate]
        gate:
          type: when
          prompt: 'Make the lazy model exactly 99% accurate (slide 17).'
          when: 'abs(lz.accuracyPct - 99) < 0.05'
          hint: The lazy model's accuracy is just the share of learners who stay. So 1% must drop out.
      - say: |
          99 stay for every 1 who leaves. That "99 : 1" is the **imbalance ratio**. The lazy model now scores **99%** and
          still catches **no one**. The rarer the group, the better a useless model looks. Now go the other way.
        define: [imbalance-ratio]
        gate:
          type: when
          prompt: 'Make the two groups equal in size (50 : 50).'
          when: 'ratePct >= 49.9'
          hint: Drag the slider all the way to the right.
      - say: |
          With equal groups the lazy model drops to 50%, no better than a coin flip. Your turn: work out a lazy model's
          accuracy on new numbers.
        gate:
          type: practice
          template: lazy-accuracy
      - say: Put the idea in your own words before moving on.
        gate:
          type: reflect
          prompt: Why does the lazy model look *better* when dropouts are *rarer*?
          model: |
            The lazy model is right on every learner who stays and wrong on every dropout. Its accuracy is simply the share of
            learners who stay. The rarer dropouts are, the bigger that share, so its accuracy rises even though it still
            catches nobody.
      - say: |
          So when the groups are uneven, never trust accuracy alone. First ask: what would a model that always guesses the
          big group score? Then check recall on the group you care about.
    takeaway: When one group is rare, always guessing the common group gives high accuracy and zero recall. Compare any accuracy with that.

  - id: tally-fraud
    title: Tally the fraud table
    goal: How do we keep score of 18 guesses, so we can see exactly which kinds of mistakes were made?
    skills: [confusion-matrix]
    data: [fraud18]
    state: { tallyUpTo: 0 }
    derive:
      - { fn: fraudSheet, in: { table: '@fraud18', upTo: '@tallyUpTo' }, out: fs }
    stage:
      - id: tbl
        widget: Matrix
        props: { data: '@fs.table', title: 'Slides 19–20: 18 card payments, the real answer and the guess' }
      - id: cm
        widget: Matrix
        region: side
        props: { data: '@fs.cm', format: int, title: 'Rows = real answer, columns = guess', rowHeader: actual }
      - id: count
        widget: Readout
        region: side
        props:
          items:
            - { label: rows tallied, value: '@fs.done' }
            - { label: correct so far, value: '@fs.correct', tone: good }
      - id: player
        widget: StepPlayer
        region: bottom
        hidden: true
        props:
          fn: tallyWalk
          in: { table: '@fraud18' }
          roles: { table: tbl, cm: cm }
          speed: 1
    beats:
      - say: |
          Each row is one card payment. The **actual** column says what really happened (Fraud or Legit, meaning a normal
          payment). The **predicted** column is the classifier's guess. 4 of the 18 payments are fraud.
      - say: |
          We are hunting for fraud, so Fraud is the **positive class**. "Positive" here just means "the thing we are looking
          for". It does not mean good. Legit payments are the negatives.
        define: [positive-class]
      - say: |
          To see how the guesses went, sort every row into a small scoreboard called a **confusion matrix**. Its rows are
          the real answer and its columns are the guess, so it has four boxes.
        define: [confusion-matrix]
      - say: |
          A fraud the model flagged is a **true positive (TP)**: right guess, positive. A fraud the model let through is a
          **false negative (FN)**: wrong guess, it said negative.
        define: [true-positive, false-negative]
        gate:
          type: predict
          question: 'Payment T13 is really Fraud, but the model guessed Legit. Which box?'
          options: [TP, FN, FP, TN]
          answer: 1
          explain: 'Really fraud, guessed legit: the model missed it. That is a **false negative**.'
      - say: |
          On the Legit side: a normal payment wrongly flagged as fraud is a **false positive (FP)**, a false alarm. A normal
          payment correctly cleared is a **true negative (TN)**. Tip: the first word says if the guess was right.
        define: [false-positive, true-negative]
        gate:
          type: predict
          question: 'Payment T07 is really Legit, but the model guessed Fraud. Which box?'
          options: [TP, FN, FP, TN]
          answer: 2
          explain: 'Really normal, but flagged: a false alarm, which is a **false positive**.'
      - say: Now sort all 18 rows, one at a time, and watch the boxes fill.
        show: [player]
        gate:
          type: event
          prompt: Play the tally to the end.
          target: player
          event: done
      - say: Look at the bottom-right box.
        set: { tallyUpTo: 18 }
        gate:
          type: predict
          question: How many true negatives (TN) are there?
          answer: { value: 13 }
          explain: '18 rows − 2 TP − 2 FN − 1 FP = 13 normal payments correctly cleared.'
      - say: |
          **15 of 18** guesses are right, so the model looks strong. But **2 of the 4 real frauds** sit in the FN box. The
          mistakes that hurt most hide in one small corner.
        do:
          - { target: cm, cmd: highlight, args: { sel: 'cell:Fraud,Legit', tone: bad } }
      - say: Try sorting a new table yourself.
        gate:
          type: practice
          template: tally-hand
    takeaway: Every row lands in exactly one box (TP, FN, FP or TN), and the four boxes always add up to the number of rows.

  - id: four-metrics
    title: Four scores, one matrix
    goal: How can the same model be 83% accurate and still catch only half the fraud?
    skills: [prf1, confusion-matrix]
    state: { tp: 2, fp: 1, fstep: 0 }
    derive:
      - { fn: sliderMetrics, in: { tp: '@tp', fp: '@fp', pos: 4, neg: 14 }, out: m }
    stage:
      - id: cm
        widget: Matrix
        props: { data: '@m.cm', format: int, title: '4 frauds, 14 normal payments', rowHeader: actual }
      - id: f
        widget: Formula
        props:
          steps:
            - '\text{Accuracy} = \frac{\anchor{tp}{TP} + TN}{N} = \frac{ {=m.tp} + {=m.tn} }{18} = {=m.accuracy|3}'
            - '\text{Precision} = \frac{\anchor{tp}{TP}}{TP + \anchor{fp}{FP}} = \frac{ {=m.tp} }{ {=m.tp} + {=m.fp} } = {=m.precision|2}'
            - '\text{Recall} = \frac{\anchor{tp}{TP}}{TP + \anchor{fn}{FN}} = \frac{ {=m.tp} }{ {=m.tp} + {=m.fn} } = {=m.recall|2}'
            - 'F_1 = \frac{2PR}{P + R} = \frac{2({=m.precision|2})({=m.recall|2})}{ {=m.precision|2} + {=m.recall|2} } = {=m.f1|2}'
          step: '@fstep'
      - id: r
        widget: Readout
        region: side
        props:
          items:
            - { label: accuracy, value: '@m.accuracy', format: 3 }
            - { label: precision, value: '@m.precisionShown', format: 2 }
            - { label: recall, value: '@m.recall', format: 2, tone: accent }
            - { label: F1, value: '@m.f1', format: 2 }
      - id: tp-s
        widget: Slider
        region: side
        hidden: true
        props: { label: 'frauds caught (TP)', min: 0, max: 4, step: 1 }
        bind: { value: tp }
      - id: fp-s
        widget: Slider
        region: side
        hidden: true
        props: { label: 'false alarms (FP)', min: 0, max: 14, step: 1 }
        bind: { value: fp }
    beats:
      - say: |
          Here is the fraud scoreboard again: TP 2, FN 2, FP 1, TN 13. [[accuracy|Accuracy]] counts every right guess (TP
          and TN) and divides by all 18 payments.
        gate:
          type: predict
          question: What is the accuracy? (as a decimal)
          answer: { value: 0.833, tol: 0.005 }
          explain: '(2 + 13) ÷ 18 = 15 ÷ 18 = 0.833, or 83.3%.'
      - say: |
          **Precision** asks: when the model shouts "fraud!", how often is it right? Only look at the payments it flagged:
          the TP box and the FP box.
        define: [precision]
        set: { fstep: 1 }
        gate:
          type: predict
          question: Precision = ?
          answer: { value: 0.67, tol: 0.01 }
          explain: 'TP ÷ (TP + FP) = 2 ÷ (2 + 1) = 0.67. Two of its three alarms were real fraud.'
      - say: |
          [[recall|Recall]] asks the other question: of the payments that really were fraud, how many did we catch? Only
          look at the real-fraud row: TP and FN.
        set: { fstep: 2 }
        gate:
          type: predict
          question: Recall = ?
          answer: { value: 0.5, tol: 0.01 }
          explain: 'TP ÷ (TP + FN) = 2 ÷ (2 + 2) = 0.50. Half of the fraud got through.'
      - say: |
          The **F1 score** squeezes precision and recall into one number. It uses a special average that stays close to
          the smaller of the two, so a model cannot hide a bad recall behind a good precision.
        define: [f1]
        set: { fstep: 3 }
        gate:
          type: predict
          question: F1 = ?
          answer: { value: 0.57, tol: 0.01 }
          explain: '2 × 0.67 × 0.50 ÷ (0.67 + 0.50) = 0.67 ÷ 1.17 = 0.57 (slide 22). A plain average would give 0.58.'
      - say: |
          One more fair score: **balanced accuracy**. Take the recall on fraud (2 of 4 = 0.50) and the recall on normal
          payments (13 of 14 = 0.93), then average them: 0.71. The small group now counts as much as the big one.
        define: [balanced-accuracy]
      - say: Now you control the model. Catching more fraud usually means more false alarms too.
        show: [tp-s, fp-s]
        gate:
          type: when
          prompt: Catch **every** fraud while keeping precision at 0.5 or higher.
          when: 'm.recall == 1 and m.precision >= 0.5'
          hint: Set TP to 4. Precision = 4 ÷ (4 + FP). How many false alarms can you allow before that drops below 0.5?
      - say: Your turn on fresh numbers.
        set: { tp: 2, fp: 1, fstep: 2 }
        gate:
          type: practice
          template: precision-numeric
      - say: |
          Notice that accuracy barely moved when you changed TP, because only 4 of the 18 rows are fraud. Recall moved a lot.
        gate:
          type: reflect
          prompt: Why can a model have high accuracy but low recall when the group you hunt is rare?
          model: |
            Accuracy counts every right guess, and most guesses are about the big group (here, 13 of the 15 right guesses were
            normal payments). Missing a few rare cases hardly changes it. Recall only looks at the rare cases, so every miss
            shows up clearly.
    takeaway: 'One scoreboard, four questions: accuracy (all guesses), precision (the alarms), recall (the real cases), F1 (precision and recall together).'

  - id: per-class-sigla
    title: Same model, very different per group
    goal: Can a model with a decent overall score never catch the group that matters most?
    skills: [per-class]
    data: [sigla]
    state: { model: anthro }
    derive:
      - { fn: siglaView, in: { sigla: '@sigla', model: '@model' }, out: sv }
    stage:
      - id: head
        widget: Matrix
        props: { data: '@sigla.headline', format: 2, title: 'Slide 13: SIGLA overall scores', rowHeader: metric }
      - id: cmx
        widget: Matrix
        props: { data: '@sv.M', format: 2, heatmap: seq, title: 'Slide 14: each row is one real group, shares add up to 1', rowHeader: actual }
      - id: pick
        widget: Choice
        region: side
        props:
          label: How height is measured
          options:
            - { value: anthro, label: 'Measured with a tape (anthropometric)' }
            - { value: marker, label: 'Estimated from photo markers' }
        bind: { value: model }
      - id: rec
        widget: Readout
        region: side
        props:
          items:
            - { label: 'Normal recall', value: '@sv.normal', format: 2, tone: good }
            - { label: 'Underweight recall', value: '@sv.uw', format: 2, tone: warn }
            - { label: 'Sev. underweight recall', value: '@sv.sevuw', format: 2, tone: bad }
      - id: macro-r
        widget: Readout
        region: side
        hidden: true
        props:
          items:
            - { label: 'macro recall', value: '@sv.macroRecall', format: 3, tone: accent }
    beats:
      - say: |
          **SIGLA** estimates a learner's weight and puts them in one of five groups, from Severely Underweight (SevUW) to
          Obese. Its main job is to catch **underweight** learners. Two versions exist: one uses measured height, one uses
          estimated height.
      - say: |
          The top table shows overall scores, like F1. The estimated-height version looks the same or slightly better on
          every one. So is it the better model? To answer, look group by group.
      - say: |
          In the big table, each row is one **real** group, and the row shows where those learners ended up. Each row adds up
          to 1. So the box on the diagonal is that group's **per-class recall**: the share of that group the model got right.
        define: [per-class-recall]
        do:
          - { target: cmx, cmd: highlight, args: { sel: '@sv.diag', tone: accent } }
        gate:
          type: predict
          question: 'Measured-height model: what is the recall for the Normal group?'
          answer: { value: 0.91, tol: 0.005 }
          explain: 'Row Normal, column Normal: 0.91. Normal learners are almost always recognized.'
      - say: Now the group SIGLA cares about most. Read the SevUW row.
        do:
          - { target: cmx, cmd: highlight, args: { sel: 'row:SevUW', tone: bad } }
        gate:
          type: predict
          question: 'Measured height: what share of severely underweight learners is labelled correctly?'
          answer: { value: 0.11, tol: 0.005 }
          explain: '0.11. The rest are called Underweight or even Normal.'
      - say: Now look at the version that "matches or slightly beats" the measured one overall.
        gate:
          type: when
          prompt: Switch to **Estimated from photo markers**.
          when: 'model == ''marker'''
      - say: Read the same row again.
        gate:
          type: predict
          question: 'Estimated height: recall for Severely Underweight?'
          options: ['0.00', '0.11', '0.33', '0.67']
          answer: 0
          explain: 'The diagonal box is 0. This version **never** catches a severely underweight learner; 0.67 of them are called just Underweight.'
      - say: |
          A fair way to sum this up: add the five diagonal boxes and divide by 5. This is the **macro average**, here the
          macro recall. Every group counts the same, so the "better" estimated version actually scores lower.
        define: [macro-average]
        show: [macro-r]
      - say: Practise reading one group's recall from a table of counts.
        gate:
          type: practice
          template: per-class-recall
      - say: |
          Slide 15 suggests three levels of checking: the **overall** score (fine), the score **per group** (very uneven),
          and the score on the **group the decision is about** (we exist to find undernourished learners).
    takeaway: Read each group's diagonal box. A good average can hide a group the model never catches.

  - id: resample-counts
    title: Fewer of the big group, or more of the small one
    goal: If the small group is too small, should we delete some of the big group or copy some of the small one?
    skills: [random-resampling]
    data: [toy, adult]
    state: { method: none }
    derive:
      - { fn: resampleToy, in: { toy: '@toy', method: '@method' }, out: rt }
      - { fn: adultCounts, in: { adult: '@adult', method: '@method' }, out: ac }
    stage:
      - id: plot
        widget: Chart
        props: { kind: scatter, series: '@rt.series', xLabel: x1, yLabel: x2, title: 'Small practice map (10 majority, 5 minority)' }
      - id: pick
        widget: Choice
        region: side
        props:
          label: Rebalancing method
          options:
            - { value: none, label: none }
            - { value: RUS, label: 'undersample (RUS)' }
            - { value: ROS, label: 'oversample (ROS)' }
        bind: { value: method }
      - id: adult-r
        widget: Readout
        region: side
        props:
          items:
            - { label: 'Adult training rows', value: '@ac.rows', tone: accent }
            - { label: 'Adult majority', value: '@ac.maj' }
            - { label: 'Adult minority', value: '@ac.min' }
            - { label: 'minority share', value: '@ac.minProp', format: 3 }
      - id: note
        widget: Text
        region: side
        props: { body: 'Practice map: {=rt.note}.' }
    beats:
      - say: |
          Before a model learns, the data is split in two. The model studies the **training set**. The **test set** is
          hidden away and only used at the end, like a final exam the model has never seen.
        define: [training-set, test-set]
      - say: |
          The Session 3 notebook uses **Adult Income**, a dataset of people where earning over $50K is the rare group
          (23.9%). Its training set has **27,866** majority and **8,765** minority rows. One fix for imbalance is to change
          the training set so the groups are even.
      - say: |
          **Random undersampling (RUS)** keeps every minority row and throws away random majority rows until both groups
          are the same size.
        define: [random-undersampling]
        gate:
          type: predict
          question: How many training rows are left after RUS?
          answer: { value: 17530 }
          explain: '8,765 minority + 8,765 majority kept = 2 × 8,765 = 17,530 rows (notebook technique 1).'
      - say: See it on the small map. Blue dots are the majority, the others are the minority.
        gate:
          type: when
          prompt: Choose **undersample (RUS)**.
          when: 'method == ''RUS'''
      - say: |
          Five of the ten blue points are gone. With Adult Income that is thousands of real people thrown away. It is quick,
          but we may lose useful information. The opposite idea is **random oversampling (ROS)**: copy random minority rows
          until they match the majority.
        define: [random-oversampling]
        gate:
          type: predict
          question: How many training rows are there after random oversampling?
          answer: { value: 55732 }
          explain: '27,866 majority + 27,866 minority = 55,732 rows. 19,101 of the minority rows are copies.'
      - say: Switch the map to oversampling.
        gate:
          type: when
          prompt: Choose **oversample (ROS)**.
          when: 'method == ''ROS'''
      - say: |
          The new points sit **exactly on top of** old ones. Nothing is lost, but the model sees the same few people again and
          again. It may start **overfitting**: memorizing those exact people instead of learning the general pattern.
        define: [overfitting]
      - say: Your turn on new numbers.
        gate:
          type: practice
          template: rus-size
    takeaway: Undersampling deletes majority rows (2 × minority remain). Oversampling copies minority rows (2 × majority). Neither adds new information.

  - id: smote-line
    title: SMOTE draws on the line
    goal: How can we make new minority points instead of copying old ones?
    skills: [smote]
    data: [toy]
    state: { lam: 0.5, nb: M4, knnUpTo: 0 }
    derive:
      - { fn: smoteToy, in: { toy: '@toy', i: M2, k: 2, nb: '@nb', lambda: '@lam' }, out: sm }
      - { fn: knnSheet, in: { toy: '@toy', target: M2, upTo: '@knnUpTo', k: 2 }, out: ks }
    stage:
      - id: plot
        widget: Chart
        props: { kind: scatter, series: '@sm.series', xLabel: x1, yLabel: x2, title: 'Making a new point from M2 = (7, 5)' }
      - id: sheet
        widget: Matrix
        props: { rows: '@ks.rows', cols: '@ks.cols', values: '@ks.values', format: 0, title: 'Squared distance from M2 to each minority point' }
      - id: player
        widget: StepPlayer
        region: bottom
        hidden: true
        props:
          fn: knnWalk
          in: { toy: '@toy', target: M2, k: 2 }
          roles: { sheet: sheet, plot: plot }
          speed: 0.7
      - id: f
        widget: Formula
        region: side
        props: { tex: '{=sm.tex}' }
      - id: lam-s
        widget: Slider
        region: side
        hidden: true
        props: { label: 'λ', min: 0, max: 1, step: 0.05, format: 2 }
        bind: { value: lam }
      - id: nb-c
        widget: Choice
        region: side
        hidden: true
        props:
          label: neighbour
          options:
            - { value: M1, label: M1 }
            - { value: M4, label: M4 }
        bind: { value: nb }
    beats:
      - say: |
          Each dot is one person, placed by two features, x1 and x2. Oversampling stacked copies on old dots. **SMOTE**
          instead makes brand-new minority dots in the **gaps between** real minority dots.
        define: [smote]
      - say: |
          Step 1: for minority point M2, find its **nearest neighbours**: the minority points closest to it. To measure
          closeness, square the gap in x1, square the gap in x2, and add. (We skip the square root; it does not change which is closest.)
        define: [nearest-neighbour]
        gate:
          type: predict
          question: 'M2 = (7, 5) and M1 = (8, 6). What is the squared distance?'
          answer: { value: 2 }
          explain: '(8 − 7)² + (6 − 5)² = 1 + 1 = 2.'
      - say: Now compute M2's distance to every other minority point.
        show: [player]
        gate:
          type: event
          prompt: Play the four distances.
          target: player
          event: done
      - say: |
          With k = 2, M2's two nearest are **M1** (2) and **M4** (8). SMOTE picks one at random, then a random number λ
          ("lambda") between 0 and 1. The new point is λ of the way from M2 to that neighbour:
          $x_{\text{new}} = x_i + \lambda\,(x_{\text{nb}} - x_i)$.
        set: { knnUpTo: 4 }
        gate:
          type: predict
          question: 'Neighbour M4 = (9, 3) and λ = 0.5. What is the new point''s first coordinate?'
          answer: { value: 8 }
          explain: 'Start at 7, move half of the gap (9 − 7 = 2): 7 + 0.5 × 2 = 8. Second coordinate: 5 + 0.5 × (3 − 5) = 4. So the new point is (8, 4).'
      - say: Drag λ and watch the new point slide along the line.
        show: [lam-s, nb-c]
        gate:
          type: when
          prompt: Put the new point at **(8.5, 3.5)**.
          when: 'abs(sm.x1 - 8.5) < 0.01 and abs(sm.x2 - 3.5) < 0.01'
          hint: 'Use neighbour M4. You need 7 + λ × 2 = 8.5.'
      - say: |
          λ = 0 lands on M2 itself, λ = 1 lands on the neighbour, and anything in between is a **new** spot inside the
          minority area. One risk: if a minority point sits deep among majority points, SMOTE draws new points in the wrong area.
      - say: Try one yourself.
        gate:
          type: practice
          template: smote-coordinate
    takeaway: SMOTE puts each new point a random fraction λ of the way from a minority point to one of its nearest minority neighbours.

  - id: smote-nc-vote
    title: Names vote, numbers blend
    goal: What is "halfway between Married and Divorced"?
    skills: [smote-nc]
    data: [snc]
    derive:
      - { fn: smoteNC, in: { rows: '@snc', i: X, nb: N2, lambda: 0.5 }, out: nc }
    stage:
      - id: tbl
        widget: Matrix
        props: { data: '@nc.table', title: 'Person X, their 3 nearest minority neighbours, and the new row' }
      - id: f
        widget: Formula
        region: side
        props:
          tex: 'x_{\text{new}} = x_i + \lambda\,(x_{\text{nb}} - x_i), \quad \lambda = 0.5,\ \text{nb} = N2'
      - id: bins
        widget: DropBins
        region: bottom
        hidden: true
        props:
          chips:
            - { id: age, label: age }
            - { id: hours, label: hours-per-week }
            - { id: edu, label: education-num }
            - { id: marital, label: marital-status }
            - { id: workclass, label: workclass }
            - { id: race, label: race }
            - { id: sex, label: sex }
          bins:
            - { id: interp, label: 'blend (numbers)' }
            - { id: vote, label: 'neighbour vote (names)' }
          solution: { age: interp, hours: interp, edu: interp, marital: vote, workclass: vote, race: vote, sex: vote }
    beats:
      - say: |
          Adult Income has number columns (age, hours worked per week) and name columns like marital status. A column whose
          values are names is a **categorical feature**. SMOTE only works with numbers, so suppose we code Married = 0,
          Divorced = 1, Single = 2.
        define: [categorical-feature]
        gate:
          type: predict
          question: 'Plain SMOTE between Married (0) and Divorced (1) with λ = 0.5 gives which code?'
          answer: { value: 0.5 }
          explain: '0 + 0.5 × (1 − 0) = 0.5: a marital status that **does not exist**.'
      - say: |
          **SMOTE-NC** fixes this. ("NC" means it handles both name and number columns.) Number columns are blended exactly
          like SMOTE. Here the new row is made from X and neighbour N2 with λ = 0.5.
        define: [smote-nc]
        gate:
          type: predict
          question: 'X is 40 years old and N2 is 38. What age does the new row get?'
          answer: { value: 39 }
          explain: '40 + 0.5 × (38 − 40) = 40 − 1 = 39. Hours: 50 + 0.5 × (60 − 50) = 55.'
      - say: |
          For each name column, SMOTE-NC holds a **vote** among X's nearest minority neighbours, and the most common value
          wins. No averaging.
        gate:
          type: predict
          question: 'The neighbours N1, N2, N3 are Married, Divorced, Married. What marital status does the new row get?'
          options: [Married, Divorced, 'Single', '0.5 (halfway)']
          answer: 0
          explain: 'Married wins 2 votes to 1, even though N2 (the one used for blending) is Divorced. Workclass: Private 2, Self-emp 1, so Private.'
      - say: Which rule does each Adult Income column follow?
        show: [bins]
        gate:
          type: event
          prompt: Drag every column into its bin.
          target: bins
          event: solved
      - say: Blend a number column yourself.
        gate:
          type: practice
          template: smotenc-numeric
      - say: |
          Now every new row has **real** values in its name columns. That is why the notebook tells SMOTE-NC which columns
          are categorical and leaves them as text.
    takeaway: 'SMOTE-NC blends number columns and lets the nearest neighbours vote on name columns, so every new row makes sense.'

  - id: adasyn-hardness
    title: ADASYN aims at the hard cases
    goal: Which minority points deserve more new points around them?
    skills: [adasyn]
    data: [toy]
    state: { adaUpTo: 0 }
    derive:
      - { fn: adasynSheet, in: { toy: '@toy', k: 3, upTo: '@adaUpTo' }, out: ad }
      - { fn: resampleToy, in: { toy: '@toy' }, out: rt }
    stage:
      - id: plot
        widget: Chart
        props: { kind: scatter, series: '@rt.series', xLabel: x1, yLabel: x2, title: 'Practice map: where is the minority hardest to learn?' }
      - id: sheet
        widget: Matrix
        props: { rows: '@ad.rows', cols: '@ad.cols', values: '@ad.values', format: 2, title: 'ADASYN worksheet (k = 3, G = 5)' }
      - id: player
        widget: StepPlayer
        region: bottom
        hidden: true
        props:
          fn: adasynWalk
          in: { toy: '@toy', k: 3 }
          roles: { sheet: sheet, plot: plot }
          speed: 0.6
      - id: f
        widget: Formula
        region: side
        props:
          steps:
            - 'r_i = \frac{\Delta_i}{k}, \qquad \hat r_i = \frac{r_i}{\sum_j r_j}, \qquad g_i = \hat r_i \cdot G'
          step: 0
    beats:
      - say: |
          SMOTE spreads its new points **evenly** across the minority. **ADASYN** spends more of them where the minority is
          **hardest to learn**: close to majority points. First, the total number of new points, G, is the gap between the
          groups: majority count − minority count.
        define: [adasyn]
        gate:
          type: predict
          question: 'The practice map has 10 majority and 5 minority points. G = ?'
          answer: { value: 5 }
          explain: '10 − 5 = 5 new points in total.'
      - say: |
          Next, for each minority point, look at its 3 nearest neighbours of **either** group. Count how many are majority.
          Call that count Δ ("delta"). M5 = (3, 0) sits bottom-left, among the blue majority points.
        gate:
          type: predict
          question: 'M5''s 3 nearest neighbours are B10, B8 and B7 (all majority). What is Δ for M5?'
          answer: { value: 3 }
          explain: All three are majority, so Δ = 3. Its hardness r = Δ ÷ 3 = 1, the highest possible.
      - say: |
          Do this for all five minority points. Then turn each hardness into a share of the total (divide by the sum), and
          hand out G in those shares.
        show: [player]
        gate:
          type: event
          prompt: Play the ADASYN worksheet.
          target: player
          event: done
      - say: Read the last column.
        set: { adaUpTo: 5 }
        gate:
          type: predict
          question: How many of the 5 new points go to M5?
          answer: { value: 3 }
          explain: 'Hardness: 1/3, 1/3, 0, 0, 1. They sum to 5/3. M5''s share is 1 ÷ 5/3 = 0.6, and 0.6 × 5 = 3. M1 and M2 get 1 each; M3 and M4 get none.'
      - say: |
          But is M5 really a hard case, or just an odd, misplaced point (noise)? Its new points get drawn towards other
          minority points, straight across majority territory.
        do:
          - { target: plot, cmd: highlight, args: { sel: 'point:minority,4', tone: bad } }
      - say: |
          In the notebook, ADASYN caught the most rich earners (recall 0.877) but had the most false alarms ([[precision]]
          0.499) of all five methods. Focusing on the border buys catches with false alarms.
      - say: Hand out a budget yourself.
        gate:
          type: practice
          template: adasyn-g
    takeaway: 'ADASYN gives each minority point a share of the new points based on how many majority neighbours crowd around it.'

  - id: choose-by-decision
    title: No method wins everywhere
    goal: Which rebalancing method should you pick, and who decides?
    skills: [choosing, random-resampling]
    data: [results]
    state: { ratio: 1 }
    derive:
      - { fn: resultsView, in: { results: '@results', cols: [accuracy, balanced_acc, precision, recall, f1, roc_auc, pr_auc] }, out: rv }
      - { fn: costCompare, in: { results: '@results', pos: 2922, neg: 9289, ratio: '@ratio' }, out: cc }
    stage:
      - id: tbl
        widget: Matrix
        props: { data: '@rv', format: 3, heatmap: seq, title: 'Session 3 results (same model, same untouched test set)', rowHeader: method }
      - id: cost
        widget: Chart
        hidden: true
        props: { kind: bar, series: '@cc.bars', yLabel: 'errors × cost', title: 'Total cost of mistakes on the test set' }
      - id: ratio-s
        widget: Slider
        region: side
        hidden: true
        props: { label: 'cost of a miss ÷ cost of a false alarm', min: 1, max: 6, step: 0.05, format: 2 }
        bind: { value: ratio }
      - id: best
        widget: Readout
        region: side
        hidden: true
        props:
          items:
            - { label: cheapest method, value: '@cc.best', tone: good }
      - id: beyond
        widget: Callout
        region: side
        hidden: true
        props: { kind: beyond, body: 'Cost = ratio × FN + FP. FN and FP are worked back from the rounded table (2,922 minority test rows), so they are approximate.' }
    beats:
      - say: |
          The notebook trained the same kind of classifier (a logistic regression) on six versions of the training set and
          graded each on the same untouched test set. Read the **recall** column.
        gate:
          type: predict
          question: Which method has the highest recall?
          options: [Baseline, RUS, SMOTE, ADASYN]
          answer: 3
          explain: 'ADASYN, 0.877. Every method lifts recall from the baseline''s 0.506 (no rebalancing) to above 0.82.'
      - say: |
          The model does not just say yes or no. It gives each person a score, and anyone above a cut-off is flagged. That
          cut-off is the **decision threshold**. **ROC-AUC** checks how well the scores rank real cases above normal ones,
          whatever threshold you pick.
        define: [decision-threshold, roc-auc]
        gate:
          type: predict
          question: What happened to ROC-AUC after rebalancing?
          options: ['It barely moved (0.875–0.876)', 'It jumped from 0.6 to 0.9', 'It fell by half', 'It became exactly 1']
          answer: 0
          explain: 'The model''s **ranking** of people hardly changed. Rebalancing mostly acts like lowering the threshold: more catches, more false alarms.'
      - say: |
          So which is "best"? Put a price on each mistake. Suppose a missed case costs **r** times as much as a false alarm.
        show: [cost, ratio-s, best, beyond]
        gate:
          type: when
          prompt: Find a cost ratio where plain **RUS** is the cheapest method.
          when: 'cc.best == ''RUS'''
          hint: Somewhere between "a miss and an alarm cost the same" and "a miss costs 5 times more".
      - say: |
          At ratio 1 the baseline wins, near 2 RUS wins, and from about 2.5 upward ADASYN wins. The right score depends on
          the decision you are making.
        gate:
          type: when
          prompt: Make **ADASYN** the cheapest.
          when: 'cc.best == ''ADASYN'''
      - say: Think about real users of these models.
        gate:
          type: reflect
          prompt: A school might pick ADASYN, while an overworked fraud team might pick the baseline. Why can both be right?
          model: |
            They pay different prices for mistakes. For the school, a missed dropout is far worse than one extra home visit,
            so catching more (high recall) is worth extra false alarms. A fraud team that can only check a few alerts a day
            cannot afford many false alarms, so it values precision more.
      - say: |
          One rule never changes. Use a **stratified split**: split first, keeping the same share of each group in both
          parts. Rebalancing before splitting causes **resampling leakage**: copies of test rows end up in training.
        define: [stratified-split, resampling-leakage]
        gate:
          type: predict
          question: Which data may be rebalanced?
          options: ['The training set only', 'The whole dataset, before splitting', 'The test set only', 'Both sets separately']
          answer: 0
          explain: 'Split first, then rebalance the **training set only**. The test set must keep the real-world imbalance so the scores stay honest.'
      - say: |
          A last option skips rebalancing altogether: **class weights**. You tell the model that a mistake on a minority case
          counts, say, 70 times more. SAGIP did this. No rows are added or removed.
        define: [class-weights]
      - say: Price two models' mistakes yourself.
        gate:
          type: practice
          template: cost-numeric
    takeaway: Every method trades false alarms for catches differently. Pick by what mistakes cost, and rebalance only the training set.
