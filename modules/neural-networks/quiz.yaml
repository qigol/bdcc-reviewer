  - id: eta-too-big
    type: mcq
    skills: [gradient-descent]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: lab-update }
    prompt: On the lab network one step with $\eta = 0.05$ drops the loss from 2 to 0.211, but with $\eta = 0.15$ the loss after the step is about 2.1. Why?
    options:
      - The step is so large that the prediction jumps past the target and lands farther away
      - A larger learning rate flips the gradients, so the parameters move uphill
      - With a larger learning rate the backward pass uses the new parameters
      - The loss always rises on the first step and falls only on the later ones
    answer: 0
    optionFeedback:
      '1': The gradients are the same; only the step length changes.
      '2': The gradients come from the original network whatever $\eta$ is.
      '3': With $\eta = 0.05$ the very first step lowered the loss.
    explanation: The gradient only gives the downhill **direction** near the current point. Too long a step overshoots, so the loss can rise.

  - id: same-network
    type: mcq
    skills: [gradient-descent, backprop]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: gradient-descent }
    prompt: Why are all the gradients computed before any parameter is updated?
    options:
      - Each gradient describes the original network; updating early would mix old and new parameters in one step
      - Updating a parameter early would make its own gradient zero for the rest of the step
      - The biases must always be updated before the weights, so the weights wait
      - Computing them first is quicker, but the results would be the same either way
    answer: 0
    optionFeedback:
      '1': Its gradient would not become zero; it would just describe a different network.
      '2': There is no required order between weights and biases.
      '3': The results would differ, because later chains reuse the old $v$ and $w$ values.
    explanation: Backpropagation computes gradients; gradient descent updates. The chain for $w_{11}$ uses the old $v_1$, so $v_1$ must not change mid-way.

