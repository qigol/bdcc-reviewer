terms:
  - id: model
    term: model
    short: A recipe with adjustable numbers that turns the facts we know about a case into a guess about what we want to know.
    long: |
      Spam filters, price forecasts and image labels all come from models. A neural network is one family of models.
    related: [feature, prediction, parameter]
    skills: [neuron]

  - id: feature
    term: feature
    aka: [input, input feature]
    short: One measured fact about a case that the model reads, such as temperature, age or one pixel's brightness.
    related: [model, input-layer]
    skills: [neuron]

  - id: prediction
    term: prediction
    aka: [output, ŷ, y-hat]
    short: The value the model gives back for a case. We write it ŷ ("y-hat") to tell it apart from the true answer.
    related: [target, loss]
    skills: [neuron, forward-pass]

  - id: neural-network
    term: neural network
    aka: [network, multilayer perceptron, MLP]
    short: A model built from many simple artificial neurons connected in layers, each layer feeding the next.
    long: |
      Neural networks are one family inside machine learning; **deep learning** is the part of that family with many
      hidden layers. Logistic regression is a network with a single sigmoid neuron.
    related: [neuron, hidden-layer, deep-learning]
    skills: [neuron, architecture]

  - id: neuron
    term: artificial neuron
    aka: [neuron, unit]
    short: A tiny calculator that multiplies each input by a weight, adds them up with a bias, then bends the total with an activation function.
    formula: 'a = g\Big(\sum_i w_i x_i + b\Big)'
    related: [weight, bias, weighted-sum, activation-function]
    skills: [neuron]

  - id: weight
    term: weight
    aka: [w, connection weight]
    short: The number on one connection that says how strongly, and in which direction, an input pushes the neuron it feeds.
    long: |
      In the lab network $w_{ij}$ is the weight **from** input $i$ **to** hidden unit $j$, and $v_j$ goes from hidden
      unit $j$ to the output.
    related: [bias, parameter]
    skills: [neuron]

  - id: bias
    term: bias
    aka: [b, intercept]
    short: A number added to a neuron's sum after the weighted inputs, so the neuron can fire earlier or later.
    long: The bias is a parameter like any weight, even when it starts at 0, and it is updated in the same way.
    related: [weight, parameter]
    skills: [neuron]

  - id: weighted-sum
    term: weighted sum (pre-activation)
    aka: [z, pre-activation, sum]
    short: The neuron's total before the activation, z, found by multiplying each input by its weight, adding these up, then adding the bias.
    formula: 'z = \sum_i w_i x_i + b'
    related: [neuron, activation-function]
    skills: [neuron]

  - id: activation-function
    term: activation function
    aka: [activation, g, nonlinearity]
    short: The bend a neuron applies to its weighted sum; without a bend, stacking layers adds no power.
    formula: 'a = g(z)'
    related: [relu, sigmoid, threshold-unit]
    skills: [neuron, activations]

  - id: relu
    term: ReLU
    aka: [rectified linear unit, 'max(0, z)']
    short: An activation that keeps positive sums as they are and turns negative sums into 0.
    formula: '\text{ReLU}(z) = \max(0, z)'
    long: It is cheap and does not flatten out for large positive z, so it is the usual choice for hidden layers.
    related: [relu-slope, inactive-relu, sigmoid]
    skills: [activations]

  - id: sigmoid
    term: sigmoid
    aka: [logistic function, σ]
    short: An S-shaped activation that squashes any number into the range 0 to 1, so the output can be read as a probability.
    formula: '\sigma(z) = \frac{1}{1 + e^{-z}}'
    long: It flattens out ("saturates") at both ends, where its slope is almost 0. tanh is a similar S-curve from −1 to 1.
    related: [relu, activation-function]
    skills: [activations]

  - id: threshold-unit
    term: threshold unit
    aka: [step activation, McCulloch–Pitts neuron, step function]
    short: An all-or-nothing neuron that outputs 1 when its sum passes a cutoff and 0 otherwise.
    formula: '\text{step}(z) = 1[z > 0]'
    long: |
      McCulloch and Pitts (1943) showed networks of these units can compute logic. The step is flat almost everywhere,
      so a small weight change usually changes nothing: there is no signal for learning.
    related: [perceptron, activation-function]
    skills: [linear-limits]

  - id: training
    term: training
    aka: [learning, fitting]
    short: Adjusting a model's numbers using examples with known answers, so its guesses get closer to those answers.
    related: [parameter, gradient-descent, loss]
    skills: [linear-limits, gradient-descent]

  - id: perceptron
    term: perceptron
    short: Rosenblatt's 1958 single layer of threshold neurons whose weights are learned from examples instead of set by hand.
    long: 'Its learning rule, in modern form: when it is wrong, nudge the weights toward the right answer.'
    related: [threshold-unit, decision-boundary, training]
    skills: [linear-limits, nn-history]

  - id: decision-boundary
    term: decision boundary
    aka: [the line]
    short: The line (or surface) where a neuron's sum is exactly 0; points on one side make it fire, points on the other do not.
    formula: 'w_1x_1 + w_2x_2 + b = 0'
    long: Changing the bias slides the line; changing the weights turns it.
    related: [linearly-separable, perceptron]
    skills: [linear-limits]

  - id: linearly-separable
    term: linearly separable
    short: Describes data whose two classes can be split by one straight line (or flat plane).
    long: AND and OR are linearly separable. XOR is not, so no single-layer perceptron can compute it.
    related: [decision-boundary, xor]
    skills: [linear-limits]

  - id: xor
    term: XOR
    aka: [exclusive or]
    short: The logic rule that outputs 1 when exactly one of its two inputs is 1, and 0 when both are 0 or both are 1.
    long: Minsky and Papert (1969) used it, the smallest parity problem, to show what one layer cannot compute.
    related: [linearly-separable, hidden-layer]
    skills: [linear-limits]

  - id: input-layer
    term: input layer
    short: The first column of a network, which just holds the features; it does no computing and has no biases.
    related: [hidden-layer, output-layer, feature]
    skills: [architecture]

  - id: hidden-layer
    term: hidden layer
    aka: [hidden units]
    short: A layer of neurons between the inputs and the output that builds new, learned features from the layer before it.
    long: Hidden units re-represent the data. For XOR, an OR unit and an AND unit turn the problem into one a single line can solve.
    related: [input-layer, output-layer, deep-learning]
    skills: [linear-limits, architecture]

  - id: output-layer
    term: output layer
    short: The last layer of a network, whose neurons give the prediction, for example one number or one score per class.
    related: [hidden-layer, prediction]
    skills: [architecture]

  - id: parameter
    term: parameter
    aka: [trainable parameter, θ, theta]
    short: A number the model learns during training; in a neural network, every weight and every bias.
    long: |
      A fully connected layer with $n_{\text{in}}$ inputs and $n_{\text{out}}$ neurons has
      $n_{\text{in}} \times n_{\text{out}}$ weights and $n_{\text{out}}$ biases. Activations and sums are **not**
      parameters: they are recomputed for every input.
    related: [weight, bias, gradient-descent]
    skills: [architecture]

  - id: deep-learning
    term: deep learning
    aka: [deep network]
    short: Using neural networks with many hidden layers; "deep" counts the hidden layers.
    related: [hidden-layer, neural-network]
    skills: [architecture, nn-history]

  - id: backpropagation
    term: backpropagation
    aka: [backprop, backward pass]
    short: The method that sends the error backward through the network, layer by layer, to find how much each weight caused it.
    long: |
      Made widely known by Rumelhart, Hinton and Williams (1986); earlier roots in Linnainmaa (1970) and Werbos (1974).
      It is the chain rule applied from the loss back to every parameter, reusing each layer's result for the layer before.
    related: [chain-rule, loss-gradient, gradient-descent]
    skills: [nn-history, backprop]

  - id: cnn
    term: convolutional network (CNN)
    aka: [convolution, CNN, ConvNet]
    short: A network for images that slides one small pattern detector across every position, so the same weights are reused everywhere.
    long: 'Local (each unit looks at a small patch), shared (the same weights scan every position), stacked (edges → strokes → parts → objects).'
    related: [deep-learning]
    skills: [nn-history]

  - id: rnn
    term: recurrent network (RNN)
    aka: [RNN, LSTM, GRU]
    short: A network for sequences that feeds its own hidden state back in, so each step remembers what came before.
    long: Information from many steps back fades. LSTM (1997) and GRU (2014) add gates that decide what to keep.
    related: [transformer]
    skills: [nn-history]

  - id: transformer
    term: Transformer
    aka: [attention, self-attention]
    short: A network built on attention, which lets every word look directly at every other word, so whole sequences are processed at once.
    long: Vaswani et al. (2017). No recurrence, so it trains in parallel on GPUs; it still uses neurons, residual connections and backpropagation.
    related: [rnn, llm]
    skills: [nn-history]

  - id: llm
    term: large language model
    aka: [LLM]
    short: A very large Transformer trained by backpropagation to predict the next word piece across huge amounts of text, then tuned to follow instructions.
    related: [transformer, backpropagation]
    skills: [nn-history]

  - id: forward-pass
    term: forward pass
    short: Computing the network's prediction for one input by working through the layers from the inputs to the output, keeping every value.
    long: The backward pass reuses every z and a computed here, so write them all down.
    related: [loss, backpropagation]
    skills: [forward-pass]

  - id: target
    term: target
    aka: [label, true value, y]
    short: The correct answer for a training example, written y, which the prediction is compared with.
    related: [prediction, loss]
    skills: [forward-pass]

  - id: loss
    term: loss
    aka: [L, half squared error, error]
    short: One number that measures how wrong a prediction is; training tries to make it small.
    formula: 'L = \tfrac12(\hat y - y)^2'
    long: The ½ is there so that it cancels when we differentiate. In code the loss is averaged over all examples.
    related: [target, loss-gradient]
    skills: [forward-pass]

  - id: inactive-relu
    term: switched-off unit
    aka: [inactive ReLU, dead unit, dead ReLU]
    short: A ReLU unit whose sum is negative, so it outputs 0 and passes no learning signal back to the weights that feed it.
    long: |
      Its slope is 0, so every gradient behind it is 0 for that input. A unit that is off for every input never learns:
      it is called a dead ReLU.
    related: [relu, relu-slope]
    skills: [forward-pass, backprop]

  - id: derivative
    term: derivative
    aka: [slope, rate of change, d/dx]
    short: How fast an output changes when its input changes a little; the slope of the tangent line at that point.
    formula: '\frac{dy}{dx}'
    related: [chain-rule, local-derivative]
    skills: [chain-rule]

  - id: chain-rule
    term: chain rule
    short: The rule that the rate of change through a chain of steps is the product of each step's own rate of change.
    formula: '\frac{dy}{dx} = \frac{dy}{du}\cdot\frac{du}{dx}'
    long: 'Gears: if u turns 3× as fast as x and y turns 2× as fast as u, then y turns 6× as fast as x. Recipe: name the inner and outer function, differentiate the outer, multiply by the inner''s derivative.'
    related: [derivative, backpropagation]
    skills: [chain-rule]

  - id: local-derivative
    term: local derivative
    short: The derivative linking two neighbouring quantities, read from one defining equation while holding everything else in it constant.
    formula: '\frac{\partial \hat y}{\partial v_1} = a_1'
    long: The curly ∂ ("partial") means "change only this one, hold the rest still".
    related: [loss-gradient, chain-rule]
    skills: [local-derivatives]

  - id: loss-gradient
    term: loss gradient
    aka: [gradient, '∂L/∂θ']
    short: How fast the loss changes when one quantity changes a little; the product of the local derivatives on its path to the loss.
    formula: '\frac{\partial L}{\partial w_{11}} = \frac{\partial L}{\partial \hat y}\frac{\partial \hat y}{\partial a_1}\frac{\partial a_1}{\partial z_1}\frac{\partial z_1}{\partial w_{11}}'
    long: Always write the full ratio ∂L/∂w₁₁, never just "∂w₁₁". A positive gradient means raising the quantity would raise the loss.
    related: [local-derivative, backpropagation, gradient-descent]
    skills: [backprop]

  - id: relu-slope
    term: ReLU slope
    aka: ["ReLU'", ReLU derivative]
    short: The derivative of ReLU at the sum z, which is 1 when z is positive and 0 when z is negative, whatever the activation's value.
    formula: '\text{ReLU}''(z) = \begin{cases} 1 & z > 0 \\ 0 & z < 0 \end{cases}'
    long: 'It is the **slope**, not the activation: if z = 2 then ReLU(z) = 2 but ReLU′(z) = 1.'
    related: [relu, inactive-relu]
    skills: [local-derivatives]

  - id: gradient-descent
    term: gradient descent
    short: The update that moves every parameter a small step against its loss gradient, the direction that lowers the loss.
    formula: '\theta_{\text{new}} = \theta - \eta\,\frac{\partial L}{\partial \theta}'
    long: All gradients are computed on the original network first, then every parameter is updated.
    related: [learning-rate, loss-gradient, backpropagation]
    skills: [gradient-descent]

  - id: learning-rate
    term: learning rate
    aka: [η, eta, step size]
    short: The small number η ("eta") that sets how big each gradient-descent step is.
    long: Too small and learning crawls; too large and the step overshoots, so the loss can go up instead of down.
    related: [gradient-descent]
    skills: [gradient-descent]
