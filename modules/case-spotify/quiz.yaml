  - id: streams-explain
    type: explain
    skills: [streams-vs-sales]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: streams-versus-sales }
    prompt: Explain why some artists felt streaming paid them less than downloads, and what Spotify argued in reply.
    model: |
      A download earns the label about 0.69 dollars once, while a stream pays well under a cent, so it takes roughly a hundred
      streams to match one sale. Artists like Taylor Swift saw streaming as cheapening their work. Spotify argued that streams
      keep paying every time a song is played, that most revenue goes back to rights holders, and that the alternative for many
      listeners is piracy, which pays nothing.
    checklist:
      - One download pays far more than one stream
      - It takes about a hundred streams to match a download
      - Streams keep paying over time and about 70% of revenue goes to rights holders
      - Spotify's alternative is piracy, which pays nothing
    hints: [Compare one sale with one play, then think about time.]
    explanation: Per-unit pay is lower, but plays repeat, and the comparison Spotify draws is with piracy.

