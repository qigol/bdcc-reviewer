  # ------------------------------------------------------------------ new formats (case, find-error, two-tier, explain, cloze)
  - id: royalty-case
    type: case
    skills: [royalty-model]
    difficulty: 3
    tags: [math]
    generator: royaltyQ
    lessonRef: { tab: math-code, id: royalty-chain }
    prompt: |
      **Follow the money from a listener to an artist.** Spotify's revenue this month is **{=revenue|comma}** million. It pays
      about **{=payoutRate|pct}** to rights holders. One label's artists drew **{=streamShare|pct}** of all streams, and an artist
      on that label gets **{=artistCut|pct}** of what the label is paid.
    parts:
      - type: numeric
        prompt: The pool for rights holders (millions)
        answer: { var: pool, tol: 0.05 }
        explanation: '{=payoutRate|pct} × {=revenue|comma} = {=pool|comma2} million.'
      - type: numeric
        prompt: The label's payment (millions)
        answer: { var: holder, tol: 0.005 }
        misconceptions:
          - { var: wrongNoPayout, feedback: 'That uses all the revenue. Only the payout pool is shared by stream share.' }
        explanation: '{=streamShare|pct} × {=pool|comma2} = {=holder|2} million.'
      - type: numeric
        prompt: "The artist's share (millions)"
        answer: { var: artist, tol: 0.005 }
        misconceptions:
          - { var: wrongArtistFull, feedback: "That's the label's whole payment. The artist gets only their cut of it." }
        explanation: '{=artistCut|pct} × {=holder|2} = {=artist|3} million.'
      - type: two-tier
        prompt: Who decides how much of the label's payment the artist receives?
        options: ['The label, under the artist''s contract', 'Spotify, the same for every artist', 'Each country''s government']
        answer: 0
        reasons:
          - Spotify pays rights holders; contracts between labels and artists decide the split
          - Spotify pays every artist directly
          - Royalty splits are set by law
        reasonAnswer: 0
        reasonFeedback:
          1: Spotify pays rights holders, not artists.
          2: The case describes contracts, not laws.
        explanation: Spotify → rights holder by stream share → artist by contract.
    hints: [Revenue → payout pool → label by stream share → artist by contract cut.]
    explanation: Pool {=pool|comma2}; label {=holder|2}; artist {=artist|3} million.

