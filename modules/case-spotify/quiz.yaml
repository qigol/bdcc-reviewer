templates:
  # ------------------------------------------------------------------ music-economics
  - id: format-share-numeric
    type: numeric
    skills: [music-economics]
    difficulty: 1
    tags: [math]
    generator: formatQ
    lessonRef: { tab: math-code, id: us-formats }
    prompt: |
      In {=year}, US recorded music brought in **{=total|comma}** million dollars. Of that, streaming (paid subscriptions plus ad-supported streaming) brought in **{=streaming|comma}** million. What share was streaming? (Decimal or percent.)
    answer: { var: share, tol: 0.005, accept: [decimal, percent] }
    misconceptions:
      - { var: wrongPaidOnly, feedback: 'You counted only paid subscriptions. Streaming includes ad-supported streaming too.' }
      - { var: wrongOverPhysical, feedback: 'You divided by physical sales. Divide by the total.' }
    hints:
      - A share is part over whole.
      - Streaming divided by the total for the year.
    explanation: |
      $ {=streaming|comma} / {=total|comma} = {=share|pct1}$.

  - id: format-total-numeric
    type: numeric
    skills: [music-economics]
    difficulty: 2
    tags: [math]
    generator: formatQ
    lessonRef: { tab: math-code, id: us-formats }
    prompt: |
      In {=year}, US recorded music had physical sales of **{=physical|comma}** million, downloads of **{=downloads|comma}** million and streaming of **{=streaming|comma}** million. What was the total, in millions?
    answer: { var: total, tol: 0.5 }
    misconceptions:
      - { var: wrongCdShare, feedback: 'That is the physical share, not a total. Add all three.' }
      - { var: streaming, feedback: 'That is only streaming. Add physical and downloads too.' }
    hints:
      - Add the three kinds of revenue.
    explanation: |
      {=physical|comma} + {=downloads|comma} + {=streaming|comma} = {=total|comma} million dollars.

  - id: format-handcalc
    type: hand-calc
    skills: [music-economics]
    difficulty: 2
    tags: [math]
    generator: formatQ
    lessonRef: { tab: math-code, id: us-formats }
    prompt: |
      In {=year}, paid subscriptions brought in **{=paid|comma}** million and ad-supported streaming **{=adSupported|comma}** million. Total US recorded music revenue was **{=total|comma}** million.
    steps:
      - prompt: How much did streaming bring in altogether (millions)?
        answer: { var: streaming, tol: 0.5 }
        misconceptions:
          - { var: paid, feedback: 'Add ad-supported streaming too.' }
        hint: Add the two streaming rows.
      - prompt: What share of the total was streaming?
        answer: { var: share, tol: 0.005 }
        misconceptions:
          - { var: wrongPaidOnly, feedback: 'You used only the paid part.' }
        hint: Streaming divided by total.
    hints:
      - Add, then divide.
    explanation: |
      Streaming {=streaming|comma}; share {=share|pct1}.

  - id: labels-match
    type: match
    skills: [music-economics]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: how-music-is-sold }
    prompt: Match each term to its meaning.
    pairs:
      - ['[[major-label|Major label]]', 'One of Universal, Sony or Warner']
      - ['[[independent-label|Independent label]]', 'A smaller label outside the three majors']
      - ['[[digital-download|Digital download]]', 'A song or album bought as a file']
      - ['[[streaming|Streaming]]', 'Listening online without owning the file']
    hints:
      - Which one is about ownership of a file?
    explanation: Music moved from owned products to access over the internet.

  - id: market-mcq
    type: mcq
    skills: [music-economics]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: how-music-is-sold }
    prompt: In 2014, which statement about the music industry fits the case?
    options:
      - Digital revenues were expected to rival physical sales for the first time
      - Physical sales had overtaken digital
      - Radio had disappeared
      - Piracy was not an issue
    answer: 0
    optionFeedback:
      1: "The case has physical and digital level in 2014, at about 6.85 billion dollars each, so neither had overtaken the other."
      2: "Radio was still a major channel; the case is about digital catching up with physical sales."
      3: "Piracy was a central concern, and Spotify's free tier was pitched as a way to fight it."
    hints:
      - Look at Exhibit 1a.
    explanation: The case puts physical and digital at 6.85 billion dollars each in 2014, and says digital rivaled physical for the first time.

  # ------------------------------------------------------------------ growth-metrics
  - id: growth-pct-numeric
    type: numeric
    skills: [growth-metrics]
    difficulty: 1
    tags: [math]
    generator: growthQ
    lessonRef: { tab: math-code, id: growth-pct }
    prompt: |
      Revenue was **{=before|comma}** million and later **{=after|comma}** million. What was the percentage change? (Decimal or percent; use a minus sign for a fall.)
    answer: { var: pct, tol: 0.005, accept: [decimal, percent] }
    misconceptions:
      - { var: wrongOverAfter, feedback: 'You divided the change by the later number. Divide by the starting number.' }
      - { var: wrongRatio, feedback: 'That is the ratio of the two numbers. Take away 1 to get the change.' }
    hints:
      - Find the change first.
      - Divide the change by the starting number.
    explanation: |
      $({=after|comma} - {=before|comma}) / {=before|comma} = {=pct|pct}$.

  - id: growth-change-numeric
    type: numeric
    skills: [growth-metrics]
    difficulty: 1
    tags: [math]
    generator: growthQ
    lessonRef: { tab: math-code, id: growth-pct }
    prompt: |
      Revenue was **{=before|comma}** million and later **{=after|comma}** million. By how many millions did it change? (Minus sign for a fall.)
    answer: { var: change, tol: 0.5 }
    misconceptions:
      - { var: pct, feedback: 'That is the percentage. The question asks for the amount of the change.' }
      - { var: after, feedback: 'That is the later level. Subtract the earlier one.' }
    hints:
      - Later minus earlier.
    explanation: |
      $ {=after|comma} - {=before|comma} = {=change|comma}$ million.

  - id: growth-handcalc
    type: hand-calc
    skills: [growth-metrics]
    difficulty: 2
    tags: [math]
    generator: growthQ
    lessonRef: { tab: math-code, id: growth-pct }
    prompt: |
      Revenue went from **{=before|comma}** to **{=after|comma}** million.
    steps:
      - prompt: What is the change (millions)?
        answer: { var: change, tol: 0.5 }
        misconceptions:
          - { var: after, feedback: 'Subtract the earlier level.' }
        hint: Later minus earlier.
      - prompt: What is the percentage change?
        answer: { var: pct, tol: 0.005 }
        misconceptions:
          - { var: wrongOverAfter, feedback: 'Divide by the starting number.' }
        hint: Change divided by the starting number.
    hints:
      - Change first.
    explanation: |
      Change {=change|comma}; percentage change {=pct|pct}.

  - id: growth-code
    type: code-fill
    skills: [growth-metrics]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: growth-pct }
    prompt: Complete the percentage change function.
    code: |
      def percent_change(before, after):
          change = after - before
          return change / __BLANK_1__
    blanks:
      '1': { accept: ['before'] }
    hints:
      - Compare the change with the starting value.
    explanation: Percentage change divides the change by the starting number.

  - id: growth-mcq
    type: mcq
    skills: [growth-metrics]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: reading-growth }
    prompt: Spotify's operating result went from -80 million euros to -93 million. The case prints the change as -16%. What does that mean?
    options:
      - The loss got about 16% bigger
      - The loss got 16% smaller
      - Revenue fell 16%
      - The company made a 16% profit
    answer: 0
    optionFeedback:
      1: "The loss went from 80 to 93 million, so it grew. The minus sign flags the change as bad news."
      2: "The figure is about the operating result, not revenue."
      3: "Both figures are losses; there was no profit."
    hints:
      - A negative operating result is a loss.
    explanation: The loss grew from 80 to 93, an increase of 13 on 80, or about 16%. The sign marks it as bad news.
    variants:
      - prompt: A company's loss went from 50 million to 40 million. The report prints the change as +20%. What does that mean?
        options:
          - The loss got 20% smaller, which is good news
          - The loss got 20% bigger
          - Revenue rose 20%
          - The company made a 20% profit
        answer: 0
        optionFeedback:
          1: A smaller loss is an improvement, shown as positive.
          2: The figure is about the result, not revenue.
          3: It's still a loss.
        explanation: 10 on 50 is 20%, and a shrinking loss is good news.
      - prompt: Revenue grew from 750 million to 1,080 million. What is the growth rate?
        options:
          - '44%'
          - '330%'
          - '31%'
          - '144%'
        answer: 0
        optionFeedback:
          1: 330 million is the increase, not a percent.
          2: You divided the increase by the new value.
          3: 144% is the ratio new ÷ old, not the growth.
        explanation: (1,080 − 750) ÷ 750 = 44%.

  # ------------------------------------------------------------------ business-model
  - id: conversion-numeric
    type: numeric
    skills: [business-model]
    difficulty: 1
    tags: [math]
    generator: shareQ
    lessonRef: { tab: math-code, id: share-of }
    prompt: |
      A service has **{=whole}** million active users and **{=part}** million of them pay. What share pay? (Decimal or percent.)
    answer: { var: share, tol: 0.005, accept: [decimal, percent] }
    misconceptions:
      - { var: wrongInverse, feedback: 'You divided users by payers. Put the paying users on top.' }
      - { var: wrongRest, feedback: 'That is the share that does not pay.' }
    hints:
      - Part over whole.
    explanation: |
      $ {=part} / {=whole} = {=share|pct}$.

  - id: sub-revenue-numeric
    type: numeric
    skills: [business-model]
    difficulty: 2
    tags: [math]
    generator: subQ
    lessonRef: { tab: math-code, id: subscription-revenue }
    prompt: |
      **{=subscribers}** million subscribers each pay **{=price}** dollars a month. How much subscription revenue, in millions of dollars, comes in over **{=months}** months?
    answer: { var: revenue, tol: 0.05 }
    misconceptions:
      - { var: wrongNoMonths, feedback: 'You counted only one month. Multiply by the number of months.' }
      - { var: wrongNoSubs, feedback: 'You left out the number of subscribers.' }
    hints:
      - Multiply subscribers, price and months.
    explanation: |
      $ {=subscribers} \times {=price} \times {=months} = {=revenue|comma2}$ million dollars.

  - id: freemium-mcq
    type: mcq
    skills: [business-model]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: how-spotify-earns }
    prompt: Why does Spotify say its free tier is important?
    options:
      - It is a funnel that drives paid subscribers and competes with piracy
      - Free users pay the labels directly
      - It stops ads
      - It removes the need for subscriptions
    answer: 0
    optionFeedback:
      1: "Free users don't pay labels; ad revenue and later subscriptions do."
      2: "The free tier is ad-supported, so it carries ads rather than stopping them."
      3: "The free tier is meant to feed subscriptions, not replace them."
    hints:
      - Think about how users become paying customers.
    explanation: Spotify's head of communications called the free tier a critical element to driving subscriber growth.

  - id: model-match
    type: match
    skills: [business-model]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: how-spotify-earns }
    prompt: Match each term to its meaning.
    pairs:
      - ['[[freemium|Freemium]]', 'A free basic version and a paid better version']
      - ['[[premium-subscription|Premium subscription]]', 'A paid plan with no ads and offline listening']
      - ['[[ad-supported-streaming|Ad-supported streaming]]', 'Free listening paid for by ads']
      - ['[[conversion-rate|Conversion rate]]', 'The share of users who pay']
    hints:
      - Which one is a share?
    explanation: These terms describe how Spotify turns listeners into income.

  - id: share-code
    type: code-fill
    skills: [business-model]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: share-of }
    prompt: Complete the share function.
    code: |
      def share(part, whole):
          return __BLANK_1__ / __BLANK_2__
    blanks:
      '1': { accept: ['part'] }
      '2': { accept: ['whole'] }
    hints:
      - Part over whole.
    explanation: A share is a part divided by the whole.

  - id: sub-code
    type: code-fill
    skills: [business-model]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: subscription-revenue }
    prompt: Complete the subscription revenue function.
    code: |
      def subscription_revenue(subscribers, price, months):
          return subscribers * __BLANK_1__ * __BLANK_2__
    blanks:
      '1': { accept: ['price', 'months'] }
      '2': { accept: ['months', 'price'] }
    hints:
      - Each subscriber pays the price every month.
    explanation: Revenue is subscribers times the monthly price times the number of months.

  # ------------------------------------------------------------------ royalty-model
  - id: pool-numeric
    type: numeric
    skills: [royalty-model]
    difficulty: 1
    tags: [math]
    generator: royaltyQ
    lessonRef: { tab: math-code, id: royalty-chain }
    prompt: |
      Spotify pays about **{=payoutRate|pct}** of its revenue to rights holders. If revenue in a month is **{=revenue|comma}** million, how much goes into the pool for rights holders (millions)?
    answer: { var: pool, tol: 0.05 }
    misconceptions:
      - { var: revenue, feedback: 'That is all the revenue. Only about 70% is paid out.' }
      - { var: holder, feedback: 'That is one rights holder''s share, not the whole pool.' }
    hints:
      - Take 70% of the revenue.
    explanation: |
      $ {=payoutRate|2} \times {=revenue|comma} = {=pool|comma2}$ million.

  - id: holder-numeric
    type: numeric
    skills: [royalty-model]
    difficulty: 2
    tags: [math]
    generator: royaltyQ
    lessonRef: { tab: math-code, id: royalty-chain }
    prompt: |
      Spotify takes in **{=revenue|comma}** million in a month and pays about **{=payoutRate|pct}** of it to rights holders. A label whose artists account for **{=streamShare|pct}** of all streams gets that share of the pool. How much does the label get (millions)?
    answer: { var: holder, tol: 0.05 }
    misconceptions:
      - { var: wrongNoPayout, feedback: 'You applied the stream share to all revenue. Only about 70% is paid out.' }
      - { var: pool, feedback: 'That is the whole pool. The label gets its stream share of it.' }
    hints:
      - First find the pool.
      - Then take the label's share of the pool.
    explanation: |
      Pool $= {=pool|comma2}$. The label gets $ {=streamShare|2} \times {=pool|comma2} = {=holder|comma2}$ million.

  - id: artist-numeric
    type: numeric
    skills: [royalty-model]
    difficulty: 3
    tags: [math]
    generator: royaltyQ
    lessonRef: { tab: math-code, id: royalty-chain }
    prompt: |
      A label with **{=streamShare|pct}** of streams gets that share of the **{=payoutRate|pct}** that Spotify pays out of **{=revenue|comma}** million in revenue. Its artist's contract gives the artist **{=artistCut|pct}** of what the label receives. How much does the artist get (millions)?
    answer: { var: artist, tol: 0.01 }
    misconceptions:
      - { var: holder, feedback: 'That is what the label gets. The artist keeps only a share of it.' }
      - { var: wrongAllRevenue, feedback: 'You applied the artist''s cut to all revenue. Follow the chain: payout, stream share, artist cut.' }
    hints:
      - Pool, then label, then artist.
    explanation: |
      Pool {=pool|comma2}; label {=holder|comma2}; artist {=artist|comma2} million.

  - id: royalty-handcalc
    type: hand-calc
    skills: [royalty-model]
    difficulty: 3
    tags: [math]
    generator: royaltyQ
    lessonRef: { tab: math-code, id: royalty-chain }
    prompt: |
      Revenue **{=revenue|comma}** million; payout rate **{=payoutRate|pct}**; label stream share **{=streamShare|pct}**; artist cut **{=artistCut|pct}**.
    steps:
      - prompt: What is the pool for rights holders (millions)?
        answer: { var: pool, tol: 0.05 }
        misconceptions:
          - { var: revenue, feedback: 'Only about 70% is paid out.' }
        hint: Payout rate times revenue.
      - prompt: What does the label get (millions)?
        answer: { var: holder, tol: 0.05 }
        misconceptions:
          - { var: pool, feedback: 'Take the label''s stream share of the pool.' }
        hint: Stream share times the pool.
      - prompt: What does the artist get (millions)?
        answer: { var: artist, tol: 0.01 }
        misconceptions:
          - { var: holder, feedback: 'Take the artist''s cut of what the label gets.' }
        hint: Artist cut times the label's amount.
    hints:
      - Follow the chain.
    explanation: |
      Pool {=pool|comma2}; label {=holder|comma2}; artist {=artist|comma2}.

  - id: streams-numeric
    type: numeric
    skills: [royalty-model]
    difficulty: 2
    tags: [math]
    generator: streamsQ
    lessonRef: { tab: math-code, id: stream-counts }
    prompt: |
      A rights holder is paid **{=payout|comma}** dollars at an average of **{=perStream}** dollars per stream. How many streams is that?
    answer: { var: streams, relTol: 0.01 }
    misconceptions:
      - { var: wrongMul, feedback: 'You multiplied. To find the number of streams, divide the payout by the pay per stream.' }
      - { var: wrongCents, feedback: 'You treated the pay per stream as cents rather than dollars. Divide the dollars by dollars per stream.' }
    hints:
      - Payout is streams times the rate.
      - Divide the payout by the rate.
    explanation: |
      $ {=payout|comma} / {=perStream} = {=streams|comma0}$ streams.

  - id: royalty-multi
    type: multi
    skills: [royalty-model]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: who-gets-paid }
    prompt: Which statements about how Spotify pays are true?
    options:
      - About 70% of revenue goes to rights holders
      - Each rights holder's share depends on how many streams its artists get
      - Most artists receive 15% to 20% of what the rights holder is paid
      - Spotify pays every artist directly and equally
      - The payout is the same in every country
    answer: [0, 1, 2]
    optionFeedback:
      0: "Yes: roughly 70% of revenue goes to rights holders."
      1: "Yes: each rights holder's share follows its artists' share of streams."
      2: "Yes: labels typically pass 15–20% of their payment on to artists."
      3: "Spotify pays rights holders, mostly labels, who then pay artists under their own contracts."
      4: "Payouts are calculated country by country, so they differ."
    hints:
      - Shares are by streams and by country.
    explanation: Spotify pays rights holders by stream share, calculated by country, and the labels decide how artists are paid.

  - id: royalty-code
    type: code-fill
    skills: [royalty-model]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: royalty-chain }
    prompt: Complete the royalty chain.
    code: |
      def royalty(revenue, payout_rate, stream_share, artist_cut):
          pool = revenue * __BLANK_1__
          holder = pool * stream_share
          return holder * __BLANK_2__
    blanks:
      '1': { accept: ['payout_rate'] }
      '2': { accept: ['artist_cut'] }
    hints:
      - Payout, stream share, then artist cut.
    explanation: The artist's money is revenue times the payout rate times the stream share times the artist cut.

  - id: royalty-order
    type: order
    skills: [royalty-model]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: royalty-chain }
    prompt: Put the steps of working out an artist's Spotify royalty in order.
    items:
      - Take Spotify's revenue for the month
      - Keep about 70% as the pool for rights holders
      - Give each rights holder its share of streams
      - The rights holder pays the artist the share in the artist's contract
    hints:
      - Start with revenue.
    explanation: Money flows from revenue to the pool, then to rights holders, then to artists.

  # ------------------------------------------------------------------ streams-vs-sales
  - id: stream-equiv-numeric
    type: numeric
    skills: [streams-vs-sales]
    difficulty: 2
    tags: [math]
    generator: dlQ
    lessonRef: { tab: math-code, id: download-vs-stream }
    prompt: |
      A song sells as a download for **{=price}** dollars and the retailer keeps **{=retailerCut|pct}**. A stream pays the label **{=perStream}** dollars. How many streams does it take to earn the label as much as one download?
    answer: { var: streams, tol: 0.5 }
    misconceptions:
      - { var: wrongNoCut, feedback: 'You forgot the retailer''s cut. The label gets only what is left after it.' }
      - { var: net, feedback: 'That is what the label earns from the sale, not the number of streams. Divide it by the pay per stream.' }
    hints:
      - First find what the label gets from the sale.
      - Divide that by the pay per stream.
    explanation: |
      Label gets {=net|3}. $ {=net|3} / {=perStream} = {=streams|1}$ streams.

  - id: net-numeric
    type: numeric
    skills: [streams-vs-sales]
    difficulty: 1
    tags: [math]
    generator: dlQ
    lessonRef: { tab: math-code, id: download-vs-stream }
    prompt: |
      A download sells for **{=price}** dollars. The retailer keeps **{=retailerCut|pct}**. How much does the label get from one sale?
    answer: { var: net, tol: 0.005 }
    misconceptions:
      - { var: price, feedback: 'That is the sale price. Take away the retailer''s cut.' }
      - { var: retailerShare, feedback: 'That is the retailer''s share. The label keeps the rest.' }
    hints:
      - The label keeps the rest after the retailer's share.
    explanation: |
      $ {=price} \times (1 - {=retailerCut|2}) = {=net|3}$ dollars.

  - id: dl-mcq
    type: mcq
    skills: [streams-vs-sales]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: streams-versus-sales }
    prompt: Why do some artists worry that streaming pays less than downloads?
    options:
      - It takes many streams to earn as much as one download
      - Streams are never paid
      - Downloads cost nothing
      - Labels do not get paid for streams
    answer: 0
    optionFeedback:
      1: "Streams are paid, just at well under a cent each."
      2: "A download sells for a price and earns the label about 0.69 dollars."
      3: "Labels are paid for streams; that's where the 70% goes."
    hints:
      - Compare per-stream pay with the label's share of a download.
    explanation: A download earns the label about 0.69 dollars, while a stream pays well under a cent, so about a hundred streams match one sale.
    variants:
      - prompt: A song earns its label about 0.69 dollars per download and about 0.007 dollars per stream. About how many streams equal one download?
        options:
          - About 100
          - About 10
          - About 1,000
          - About 1
        answer: 0
        optionFeedback:
          1: 10 streams earn about 0.07 dollars.
          2: 1,000 streams earn about 7 dollars.
          3: One stream earns well under a cent.
        explanation: 0.69 ÷ 0.007 ≈ 100 streams.
      - prompt: Why might an artist with a song that's played for years earn more from streaming than from downloads?
        options:
          - Streams keep paying every time it's played, while a download pays once
          - Streams pay more per play than downloads
          - Downloads stop paying after a month
          - Streaming pays artists directly at a fixed salary
        answer: 0
        optionFeedback:
          1: Per play, streams pay far less.
          2: A download pays once, at the sale.
          3: Artists are paid through rights holders by stream share.
        explanation: Repeated plays add up over time.

  - id: dl-code
    type: code-fill
    skills: [streams-vs-sales]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: download-vs-stream }
    prompt: Complete the function.
    code: |
      def streams_to_match(price, retailer_cut, per_stream):
          net = price * (1 - __BLANK_1__)
          return net / __BLANK_2__
    blanks:
      '1': { accept: ['retailer_cut'] }
      '2': { accept: ['per_stream'] }
    hints:
      - Take away the retailer's cut first.
    explanation: The label's share of a download divided by the pay per stream gives the number of streams.

  # ------------------------------------------------------------------ swift-takedown
  - id: swift-weight-numeric
    type: numeric
    skills: [swift-takedown]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: share-of }
    prompt: |
      Taylor Swift was on track to earn about **6 million** dollars from Spotify in 2014. Spotify said it expected to pay out about **1 billion** dollars in royalties in 2014. What share of all payouts is Swift's 6 million? (Decimal or percent.)
