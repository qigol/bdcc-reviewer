intro: |
  Every expansion starts with the same hard questions: where, for whom, and how to get in. Follow a made-up Philippine
  iced-tea company through a screening, a visit and an entry choice, and decide at each step.
case:
  id: kalye-entry
  title: Kalye Brew looks abroad
  story: |
    Kalye Brew is an imaginary iced-tea maker from Davao with a strong local brand and a handful of café-kiosks. It has
    three overseas markets on its list, called A, B and C. The owner wants to keep tight control of the recipe and the
    look of every kiosk. The facts below are invented for practice.
  cells:
    - id: basic-step
      title: Cut the list, first screening
      say: |
        The owner starts with the cheapest data, the basic needs of each market. Iced tea sells best where people want a cold
        drink, and the firm wants a market that can already afford a café drink. Look at the table and apply the first screening.
      stage:
        - id: basic-table
          widget: Schedule
          props:
            title: First look at three markets
            columns: [Market A, Market B, Market C]
            rows:
              - { label: Climate, amounts: [Hot all year, Hot most of the year, Cool and rainy] }
              - { label: Cold drinks imported each year, amounts: [Rising, Rising, Falling] }
              - { label: Competing tea kiosks, amounts: [Few, Many, Few] }
      decision:
        prompt: Which market should the first screening remove?
        type: mcq
        options:
          - Market C, because climate and imports suggest weak need for cold drinks
          - Market B, because it has many competing kiosks
          - Market A, because it is hot
          - None, because no data are available yet
        answer: 0
        optionFeedback:
          1: Competition is checked in the last screening, not the first.
        model: The first screening looks at basic needs. A cool climate and falling imports of cold drinks point to weak need, so Market C goes first. Competition comes last.
    - id: legal-step
      title: Rules about ownership
      say: |
        Next the owner reads each government's rules. In Market A the law says a foreign firm may own at most 40% of a local
        business, and profits can be sent home freely. Market B has no such limit. The owner wants full control of the recipe.
      stage:
        - id: legal-table
          widget: Schedule
          props:
            title: Political and legal facts
            columns: [Market A, Market B]
            rows:
              - { label: Foreign ownership of a local business, amounts: ['Up to 40%', No limit] }
              - { label: Sending profits home, amounts: [Allowed, Allowed] }
      decision:
        prompt: Which entry mode would be difficult in Market A if Kalye Brew insists on owning most of the business?
        type: mcq
        options:
          - An equity-based mode such as a joint venture in which Kalye Brew holds most of the shares
          - Licensing the recipe for a fee
          - Contracted manufacturing
          - A management contract
        answer: 0
        optionFeedback:
          1: Licensing involves no ownership, so a cap on foreign ownership does not stop it.
        model: A 40% cap blocks majority ownership, so an equity mode with Kalye Brew in control is hard. Contract-based modes do not need ownership.
    - id: segment-step
      title: Who is the customer?
      say: |
        Market B passed the screens. Now the owner scans segments inside it. Three groups are described in the table, along
        with how many people are in each and how easy they are to reach.
      stage:
        - id: seg-table
          widget: Schedule
          props:
            title: Three segments in Market B
            columns: [Who they are, People, Reach]
            rows:
              - { label: Office workers near train stations, amounts: ['Want a cold drink on the way to work', 'About 400,000', 'Posters and stations'] }
              - { label: Farmers in remote hills, amounts: ['Little cash', 'About 25,000', 'No shops or phones nearby'] }
              - { label: Students who might like tea someday, amounts: ['Not clearly defined', 'Unknown', 'Online'] }
      decision:
        prompt: Which segment best meets the five criteria?
        type: mcq
        options:
          - Office workers near train stations
          - Farmers in remote hills
          - Students who might like tea someday
          - All three equally
        answer: 0
        model: Office workers are definable, large, accessible, actionable and capturable. The hill farmers are small and hard to reach, and the students are not clearly defined.
    - id: visit-step
      title: Test the idea on the ground
      say: |
        The owner flies to Market B with a local team and asks 100 office workers to taste the tea. Ninety-two say they love
        it. The interviewers wore Kalye Brew shirts and thanked each person for helping the company.
      stage:
        - id: visit-callout
          widget: Callout
          props:
            kind: note
            title: What the team noticed
            body: Several workers left without buying anything when the team packed up, even though they had said they loved the tea.
      decision:
        prompt: What is the best explanation for the gap between what workers said and what they did?
        type: mcq
        options:
          - Social desirability bias, since they wanted to please the interviewers
          - Cluster analysis found a hidden group
          - Predictive analytics showed the best price
          - A trade fair raised demand
        answer: 0
        model: Wearing company shirts and thanking people encourages polite answers. Social desirability bias means respondents please the interviewer, so the team should also watch what people actually buy.
    - id: pick-mode
      title: Choose the way in
      say: |
        The owner wants to open ten kiosks in Market B. A local partner would run them. The owner insists the partner follow
        Kalye Brew's menu, uniform and kiosk design to the letter, but does not want to own the shops.
      stage:
        - id: mode-tree
          widget: Tree
          hidden: true
          props:
            root:
              id: modes
              label: Entry modes
              children:
                - id: fran
                  label: Franchising
                  note: Licensing plus operating rules
                  tone: good
                - id: lic
                  label: Licensing
                  note: Fee for technology, fewer rules
                - id: jv
                  label: Joint venture
                  note: Shared ownership
      decision:
        prompt: Which mode best fits what the owner wants?
        type: mcq
        options:
          - Franchising, where the partner runs kiosks under the brand name and strict rules
          - A joint venture that shares ownership of the kiosks
          - A turnkey project
          - Contracted manufacturing of the tea only
        answer: 0
        optionFeedback:
          1: The owner does not want to own the shops, so shared ownership is out.
        model: Franchising lets a partner run the business under an established name by specific rules, which gives more control than simple licensing, without Kalye Brew owning the kiosks.
atScale:
  title: In practice
  body: |
    Large firms do the same steps with teams. Analysts build country scorecards, buy market reports, and use big data
    from online sales to size segments. A small firm often begins with a trade mission or a trade fair, then tests one
    market with a partner. Lawyers check ownership and profit-sending rules before any contract is signed.
tradeoffs:
  title: Entry mode choices for Kalye Brew
  columns: [Mode, Benefit, Risk]
  rows:
    - [Franchising, 'Brand rules followed, little investment', 'Culture may hinder it; depends on the partner']
    - [Licensing, Fee income with low effort, Less control over quality]
    - [Joint venture, 'Shared ownership, local know-how', 'More money and commitment; shared decisions']
connections:
  - module: political-forces
    note: Ownership limits and tariffs are the political and legal barriers the third screening checks.
  - module: economic-forces
    note: Income and inflation data feed the second screening.
  - module: intl-marketing
    note: After a market and entry mode are chosen, the marketing mix is set.
  - module: case-unilever-brazil
    note: The Unilever case applies segment scanning to the poor of Brazil's Northeast.
explainBack:
  prompt: |
    Explain to a friend how a firm narrows a list of foreign markets, what it does after the screening, and how it picks an
    entry mode.
  rubric:
    - Names the five screenings in order from easy data to hard data
    - Mentions segments and the five criteria, and a personal visit
    - Separates nonequity modes from equity-based modes and gives an example of each
