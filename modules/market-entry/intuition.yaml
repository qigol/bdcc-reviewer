scenes:
  - id: screening-steps
    title: Which countries are worth a look?
    goal: A firm cannot enter every country at once. How does it decide where to look first?
    skills: [screening-process]
    stage:
      - id: uniqlo-note
        widget: Callout
        props:
          kind: note
          title: A real puzzle
          body: |
            Uniqlo, a Japanese clothing chain, had over **2,300 stores** in Asia at the start of 2024 and expects about
            **3,000 stores** in China. In the United States, where it is known mostly in big cities and sells little online, the
            same plan has been much harder.
      - id: steps-table
        widget: Schedule
        hidden: true
        props:
          title: The five screenings, from easiest data to hardest
          columns: [What the firm checks, How easy the data are]
          rows:
            - { label: 1. Basic needs potential, amounts: ['Climate, land, natural resources; imports and local production', 'Easiest'] }
            - { label: 2. Financial and economic forces, amounts: ['Inflation, exchange rates, interest rates, credit, paying habits', 'Fairly easy'] }
            - { label: 3. Political and legal forces, amounts: ['Tariffs, ownership limits, limits on sending profits home', 'Medium'] }
            - { label: 4. Cultural forces, amounts: ['Customs and values, even social media influencers', 'Hard'] }
            - { label: 5. Competitive forces, amounts: ['Rivals: number, size, share, prices, quality, distribution', 'Hardest'] }
      - id: step-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: c1, label: Climate and terrain }
            - { id: c2, label: Imports of similar goods }
            - { id: c3, label: Inflation trends }
            - { id: c4, label: Credit availability }
            - { id: c5, label: Limits on foreign ownership }
            - { id: c6, label: Import tariffs }
            - { id: c7, label: Local customs and values }
            - { id: c8, label: What social media influencers say }
            - { id: c9, label: Rivals' market shares }
            - { id: c10, label: Rivals' prices }
          bins:
            - { id: basic, label: Basic needs }
            - { id: fin, label: Financial and economic }
            - { id: pol, label: Political and legal }
            - { id: cult, label: Cultural }
            - { id: comp, label: Competitive }
          solution: { c1: basic, c2: basic, c3: fin, c4: fin, c5: pol, c6: pol, c7: cult, c8: cult, c9: comp, c10: comp }
    beats:
      - say: |
          Uniqlo is the biggest clothing chain in Asia, yet it has struggled in the United States. Success in one place does not
          carry over by itself. So where should a firm look first, and how does it avoid expensive mistakes?
        show: [uniqlo-note]
      - say: Pause and make a guess before the next idea.
        gate:
          type: predict
          question: A firm starts with 40 candidate countries and runs its first screening. What is the most likely result?
          options:
            - Some countries are crossed off, leaving a shorter list
            - Every country stays on the list
            - More countries are added to the list
            - The list is chosen by a coin toss
          answer: 0
          explain: Screening works by elimination, so the list gets shorter at each step.
      - say: |
          A firm can scan the whole world for changes in politics, money, culture and competition. That watching is
          **environmental scanning**. **Market screening** is a narrower version: it finds desirable markets by crossing off
          the less desirable ones.
        define: [environmental-scanning, market-screening]
      - say: |
          Screening can compare **whole countries**, which is **country screening**. Or it can look inside countries at groups of
          shoppers who want similar things, which is **segment scanning**. Many firms do the first and then the second.
        define: [country-screening, segment-scanning]
      - say: |
          The first screening checks **basic needs potential**: do people there need this product? Climate, land and natural
          resources shape the answer. Industrial goods are easy to judge; wants such as chocolate are harder.
        define: [basic-needs-potential]
        hide: [uniqlo-note]
        show: [steps-table]
      - say: |
          After basic needs come money, politics and law, culture and finally competitors. Notice the order: it runs from the
          data that are easy to get to the data that need the most judgment. Now sort some facts into their screening.
        hide: [steps-table]
        show: [step-sorter]
        gate:
          type: event
          prompt: Drop each fact into the screening where it belongs.
          target: step-sorter
          event: solved
          hint: Tariffs and ownership limits are about the government. Prices and shares are about rivals.
      - say: Check the difference between watching the world and narrowing the list.
        hide: [step-sorter]
        gate:
          type: practice
          template: scan-screen-mcq
      - say: One question about the order of the steps.
        gate:
          type: reflect
          prompt: Why does a firm do the easy-data screenings first and leave culture and competition for later?
          model: |
            Early screenings cost little and remove many countries quickly. Culture and competition need judgment and more
            effort, so it makes sense to study only the markets that survive the easy steps.
    takeaway: Screening shortens the list of markets step by step, from easy-to-get data to hard-to-judge data.

  - id: screening-tools
    title: Tools for comparing countries
    goal: Once a firm has a shortlist, what numbers and methods help it compare the countries fairly?
    skills: [screening-tools]
    state: { pick: stability }
    stage:
      - id: tool-note
        widget: Callout
        hidden: true
        props:
          kind: note
          title: Money data used in the second screening
          body: |
            Firms look at **inflation, exchange rates, interest rates, credit availability, paying habits** and the
            **return on similar investments**.
      - id: tool-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: t1, label: A country's average household income }
            - { id: t2, label: Registered cars, for a tire seller }
            - { id: t3, label: Ten years of past values used to estimate next year }
            - { id: t4, label: Sorting thirty countries into groups of look-alikes }
          bins:
            - { id: ind, label: Market indicator }
            - { id: fac, label: Market factor }
            - { id: trend, label: Trend analysis }
            - { id: clu, label: Cluster analysis }
          solution: { t1: ind, t2: fac, t3: trend, t4: clu }
      - id: legal-note
        widget: Callout
        hidden: true
        props:
          kind: note
          title: Political and legal checks
          body: |
            Look for **barriers to entry** such as import and export tariffs, **limits on foreign ownership**, and limits on
            sending profits home. Check both whether the government is steady and whether its rules are steady.
      - id: stability-choice
        widget: Choice
        region: side
        hidden: true
        props:
          label: Which is shaky here?
          style: dropdown
          options:
            - { value: stability, label: Choose one }
            - { value: leaders, label: The leaders in power }
            - { value: rules, label: The rules on ownership and tariffs }
        bind: { value: pick }
    beats:
      - say: |
          The second screening studies money. Two kinds of data help. **Market indicators** show how strong a country or region
          is as a market overall, such as national income. **Market factors** move closely with demand for one particular
          product.
        define: [market-indicators, market-factors]
        show: [tool-note]
      - say: |
          Two statistical tools help with those data. **Trend analysis** uses measurements taken at regular times to spot a
          pattern and estimate future values. **Cluster analysis** divides countries into groups that are alike.
        define: [trend-analysis, cluster-analysis]
        hide: [tool-note]
        show: [tool-sorter]
        gate:
          type: event
          prompt: Place each example under the tool it illustrates.
          target: tool-sorter
          event: solved
          hint: Tire sellers care about cars. Looking at past years to guess the next one is a trend.
      - say: |
          The third screening is political and legal. A firm wants **policy stability**: rules that stay predictable even when
          people in power change. It also checks whether it may send profits home, called **repatriation of earnings**.
        define: [policy-stability, repatriation-of-earnings]
        hide: [tool-sorter]
        show: [legal-note]
        gate:
          type: predict
          question: A leader has ruled for thirty years but changes the ownership rules for foreign firms every spring. What is the firm's biggest worry?
          options:
            - The rules are unpredictable, so policy stability is weak
            - The leader is too stable
            - There is no need to check anything
            - The country has no tariffs
          answer: 0
          explain: A steady leader does not guarantee steady rules. The firm needs policy stability to plan.
      - say: |
          Governments can be steady while their rules shift, or shaky while their rules stay put. Use the menu to say which one
          is the problem in each case. First case: the rules change every year while the same party rules.
        show: [stability-choice]
        gate:
          type: when
          prompt: Pick what is shaky when the same party rules but the ownership rules keep changing.
          when: "pick == 'rules'"
          hint: The party is not the problem here.
      - say: Check how the money data differ.
        hide: [stability-choice, legal-note]
        gate:
          type: practice
          template: indicator-factor-mcq
      - say: And the two groups of tools.
        gate:
          type: practice
          template: tools-match
    takeaway: Indicators and factors describe a market; trend and cluster analysis forecast and group it; steady rules matter more than steady faces.

  - id: segments-and-visits
    title: Picking the people, then going to see them
    goal: Within a country, which shoppers should a firm aim for, and how does it confirm its choice?
    skills: [segment-visits]
    stage:
      - id: seg-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: s1, label: Shoppers who might one day like fashion }
            - { id: s2, label: Twelve people in a remote valley }
            - { id: s3, label: Mountain villagers with no roads, shops or phones }
            - { id: s4, label: Office workers aged 25 to 40 near train stations who want simple, low-price basics }
          bins:
            - { id: nodef, label: Hard to define }
            - { id: small, label: Too small }
            - { id: noreach, label: Cannot be reached }
            - { id: good, label: A good target }
          solution: { s1: nodef, s2: small, s3: noreach, s4: good }
      - id: criteria-note
        widget: Callout
        props:
          kind: note
          title: Five criteria for a segment
          body: |
            A good segment is **definable**, **large**, **accessible**, **actionable** and **capturable**.
      - id: visit-note
        widget: Callout
        hidden: true
        props:
          kind: tip
          title: Two ways to meet a market
          body: |
            The Frankfurt Book Fair in Germany is a famous **trade fair**. A **trade mission** can be led by a company, or by state
            or national government officials.
    beats:
      - say: |
          The question for marketers is not where consumers live, but whether they share similar wants and needs. A group of
          shoppers like that is a segment. Five checks tell whether a segment is worth the effort.
        show: [criteria-note]
      - say: |
          Think of them as plain questions: can we say who is in it, are there enough people, can we reach them, can we
          design a plan for them, and can we win their purchases? Try them on four groups.
        hide: [criteria-note]
        show: [seg-sorter]
        gate:
          type: event
          prompt: Sort each group by the criterion it fails, or call it a good target.
          target: seg-sorter
          event: solved
          hint: One group is fine. The others each fail one question.
      - say: |
          Even after all the screening, nothing replaces a personal visit. Talking face to face can reveal things written
          reports leave out. A **trade mission** is a market visit by business people or government officials looking for
          business.
        define: [trade-mission]
        hide: [seg-sorter]
        gate:
          type: predict
          question: What is the main goal of the final personal visit to a shortlisted market?
          options:
            - To understand the prospective market first-hand
            - To avoid ever doing a screening
            - To pay the import tariff in advance
            - To hire a rival's managers
          answer: 0
          explain: Visits build understanding that reports cannot give, which helps the final selection.
      - say: |
          A **trade fair** is a large exhibition where companies promote the sale of their products. It puts many sellers and
          buyers in one hall, which makes it a fast way to meet a market.
        define: [trade-fair]
        show: [visit-note]
      - say: Check the two events.
        hide: [visit-note]
        gate:
          type: practice
          template: mission-fair-mcq
      - say: A last thought, taken from a debate about Africa.
        gate:
          type: reflect
          prompt: Sub-Saharan Africa's population is expected to double by 2050, but its countries differ a lot. Why might a firm still screen by country and segment there?
          model: |
            A fast-growing region is not one market. Incomes, rules and tastes differ between countries and between groups
            inside them, so screening picks the ones where growth, access and fit line up.
    takeaway: A good segment is definable, large, accessible, actionable and capturable, and a visit confirms what the data suggest.

  - id: local-research
    title: Asking questions in an unfamiliar place
    goal: What goes wrong when a firm studies a foreign market, and can new data tools help?
    skills: [research-problems]
    stage:
      - id: problem-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: p1, label: Respondents speak a dialect the team does not know }
            - { id: p2, label: An interviewee says what the interviewer wants to hear }
            - { id: p3, label: The maps show roads that no longer exist }
            - { id: p4, label: Many people cannot read the printed survey }
          bins:
            - { id: cult, label: Cultural issues }
            - { id: bias, label: Respondent bias }
            - { id: tech, label: Technical difficulty }
          solution: { p1: cult, p2: bias, p3: tech, p4: cult }
      - id: data-table
        widget: Schedule
        hidden: true
        props:
          title: What big data can do
          columns: [Use]
          rows:
            - { label: Understand consumer needs and trends, amounts: ['Advanced analysis of massive data'] }
            - { label: Personalize shopping, amounts: ['Helps companies sell more products'] }
            - { label: Help governments, amounts: ['Understand population patterns and map public services'] }
            - { label: Watch out for, amounts: ['Cybersecurity, data privacy and data protection laws'] }
    beats:
      - say: |
          Research at home rests on easy things: a common language, good maps and honest answers. Abroad, each one can fail.
          Language, dialect and how well people read all affect how a survey is written and understood.
      - say: |
          Another trap is **social desirability bias**: respondents want to please the interviewer, so they answer as they
          think they should, not as they truly feel. Old or wrong maps are a plain technical problem.
        define: [social-desirability-bias]
        show: [problem-sorter]
        gate:
          type: event
          prompt: Sort each problem into its type.
          target: problem-sorter
          event: solved
          hint: Language and reading skill are cultural. Maps are technical.
      - say: |
          New tools help. **Big data** means massive sets of organized and messy information that businesses collect. With
          advanced methods it shows consumer needs and trends, and it can be used to personalize shopping.
        define: [big-data]
        hide: [problem-sorter]
        gate:
          type: predict
          question: Which concern does the lecture attach to big data?
          options:
            - Data privacy, cybersecurity and protection laws
            - Surveys become illegal
            - Customers disappear
            - Interviewers become more biased
          answer: 0
          explain: The same data that give insight also raise privacy and security concerns, so firms must follow data protection laws.
      - say: |
          **Predictive analytics** uses such data to guess what customers will want or do next.
          Here is what big data can do. Researchers are also told to mix
          many media, act as storytellers who translate data, and deliver faster and cheaper.
        define: [predictive-analytics]
        show: [data-table]
      - say: Check the bias idea.
        hide: [data-table]
        gate:
          type: practice
          template: bias-mcq
    takeaway: Foreign research faces language, bias and map problems, while big data brings insight and privacy duties.

  - id: nonequity
    title: Getting in without owning a business there
    goal: How can a firm sell in a foreign market without buying or building a company there?
    skills: [nonequity-modes]
    stage:
      - id: mode-tree
        widget: Tree
        hidden: true
        props:
          root:
            id: modes
            label: Ways to enter a market
            note: Two big families
            children:
              - id: noneq
                label: Nonequity modes
                note: No ownership abroad
                tone: accent
                children:
                  - { id: turn, label: Turnkey project, note: Build and hand over }
                  - { id: lic, label: Licensing, note: Fee for use of technology }
                  - { id: fran, label: Franchising, note: Partner runs a business under your name }
                  - { id: mc, label: Management contract, note: Managers for hire }
                  - { id: cm, label: Contracted manufacturing, note: Others make it }
      - id: mode-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: m1, label: Build a power plant, train the staff and hand over the keys }
            - { id: m2, label: Allow a patented process to be used for a fee }
            - { id: m3, label: Let a partner run cafés under your name and your rules }
            - { id: m4, label: Send managers to run a hotel someone else owns }
            - { id: m5, label: Pay a factory abroad to make shoes to your design }
          bins:
            - { id: turn, label: Turnkey project }
            - { id: lic, label: Licensing }
            - { id: fran, label: Franchising }
            - { id: mc, label: Management contract }
            - { id: cm, label: Contracted manufacturing }
          solution: { m1: turn, m2: lic, m3: fran, m4: mc, m5: cm }
    beats:
      - say: |
          A **nonequity mode of entry** gets a firm into a foreign market without owning part of a business there. It relies on
          contracts instead. Five kinds appear in the lecture.
        define: [nonequity-mode]
        show: [mode-tree]
      - say: |
          First, a **turnkey project**: the contractor designs and builds a plant, supplies the process technology and
          inputs, trains the operators, runs a trial and hands over a working facility. It exports technology and know-how.
        define: [turnkey-project]
      - say: |
          Second, **licensing**: one firm gives another access to its patents, trade secrets or technology for a fee. It is
          used in technology and fashion. Third, **franchising**: a form of licensing where the partner runs a business under
          your name.
        define: [licensing, franchising]
        gate:
          type: predict
          question: Which of the two gives the firm more control over how the business is run abroad?
          options:
            - Franchising, because it comes with operating rules
            - Licensing, because it has no rules
            - Neither gives any control
            - They give exactly the same control
          answer: 0
          explain: Franchising is licensing plus rules, so it gives more control. Culture can still get in the way.
      - say: |
          Last, two contracts. In a **management contract** one firm provides the managers for another. In **Contracted manufacturing**, a firm pays another to produce goods to its specifications.
        define: [management-contract, contracted-manufacturing]
        hide: [mode-tree]
        show: [mode-sorter]
        gate:
          type: event
          prompt: Match each situation to the mode it describes.
          target: mode-sorter
          event: solved
          hint: Look for who builds, who pays a fee, whose name is used, who supplies managers, and who makes the goods.
      - say: Try telling the two nearest cousins apart.
        hide: [mode-sorter]
        gate:
          type: practice
          template: license-franchise-mcq
      - say: And name the whole group.
        gate:
          type: practice
          template: nonequity-multi
    takeaway: 'Nonequity modes enter by contract: turnkey, licensing, franchising, management contract and contracted manufacturing.'

  - id: equity-and-choice
    title: Sharing ownership
    goal: When does a firm choose to share ownership abroad, and what does it give up?
    skills: [equity-modes]
    state: { mode: license }
    stage:
      - id: equity-tree
        widget: Tree
        hidden: true
        props:
          root:
            id: modes
            label: Ways to enter a market
            note: Ownership is the dividing line
            children:
              - id: noneq
                label: Nonequity modes
                note: Contracts only
                tone: accent
              - id: eq
                label: Equity-based modes
                note: Shared ownership abroad
                tone: good
                children:
                  - { id: jv, label: Joint venture, note: A business built together }
                  - { id: sa, label: Strategic alliance, note: Partnership with competitors, customers or suppliers }
      - id: mode-choice
        widget: Choice
        region: side
        hidden: true
        props:
          label: Entry mode
          style: dropdown
          options:
            - { value: license, label: Licensing }
            - { value: contract, label: Contracted manufacturing }
            - { value: jv, label: Joint venture }
            - { value: turnkey, label: Turnkey project }
        bind: { value: mode }
    beats:
      - say: |
          An **equity-based mode of entry** means the firm owns part of a business abroad. That asks for more money and more
          commitment than a contract, but it can bring a closer partnership.
        define: [equity-mode]
        show: [equity-tree]
      - say: |
          A **joint venture** is a cooperative effort among two or more organizations that share an interest in a business
          undertaking. They create and run it together, sharing what goes in and what comes out.
        define: [joint-venture]
      - say: |
          A **strategic alliance** is a collaboration with competitors, customers or suppliers.
        define: [strategic-alliance]
        hide: [equity-tree]
        gate:
          type: predict
          question: A firm teams up with a supplier through a contract and no shares change hands. Which statement is true?
          options:
            - It can still be a strategic alliance, in nonequity form
            - It cannot be an alliance without shares
            - It must be a joint venture
            - It must be licensing
          answer: 0
          explain: Alliances may take nonequity or equity form, so a contract-only partnership can qualify.
      - say: |
          Time to choose. A firm wants a shared business with a local partner that has a common interest, with both sides
          owning and running it. Use the menu to pick the mode. Remember that an alliance can be equity or nonequity.
        hide: [equity-tree]
        show: [mode-choice]
        gate:
          type: when
          prompt: Choose the entry mode that creates a business owned and run together.
          when: "mode == 'jv'"
          hint: Which option involves sharing ownership?
      - say: Check which side of the line some modes fall on.
        hide: [mode-choice]
        gate:
          type: practice
          template: mode-classify-match
      - say: One last question to connect the module.
        gate:
          type: reflect
          prompt: A small firm is unsure about a foreign market. Why might it begin with licensing or contracted manufacturing instead of a joint venture?
          model: |
            Contract modes need little or no ownership abroad, so the firm risks less money and can learn about the market.
            A joint venture takes more money and commitment, so the firm may choose it later when it is more certain.
    takeaway: Equity modes share ownership abroad, while nonequity modes use contracts; alliances can be either.
