id: entry-modes
kind: table
title: Entry modes in the lecture
source: 'M12, slides 23-26'
description: The two families of entry mode and what each mode means in one line.
columns: [mode, family, meaning]
rows:
  - [turnkey-project, nonequity, 'Contractor designs, builds and hands over a working plant']
  - [licensing, nonequity, 'Access to patents, trade secrets or technology for a fee']
  - [franchising, nonequity, 'Licensing where the partner runs a business under your name by set rules']
