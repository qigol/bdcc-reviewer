  - [contracted-manufacturing, nonequity, 'One firm makes products to another firm''s specifications']
  - [joint-venture, equity, 'Two or more organizations share an interest in a business undertaking']
  - [strategic-alliance, either, 'Collaboration with competitors, customers or suppliers; nonequity or equity']
