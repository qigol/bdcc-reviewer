terms:
  - id: environmental-scanning
    term: Environmental scanning
    short: Watching the whole world for changes in politics, money, culture or competition that could affect a firm.
    related: [market-screening]
    skills: [screening-process]
  - id: market-screening
    term: Market screening
    aka: [screening]
    short: Picking the best foreign markets by ruling out the less attractive ones, step by step.
    related: [environmental-scanning, country-screening]
    skills: [screening-process]
  - id: country-screening
    term: Country screening
    short: Choosing markets by comparing whole countries with each other.
    related: [segment-scanning]
    skills: [screening-process]
  - id: segment-scanning
    term: Segment scanning
    aka: [segment screening]
    short: Choosing markets by looking inside countries at groups of consumers who share similar wants and needs.
    related: [country-screening]
    skills: [screening-process, segment-visits]
  - id: basic-needs-potential
    term: Basic needs potential
    short: How much people in a country need a product, shaped by climate, land and natural resources.
    related: [market-screening, country-screening, market-factors]
    skills: [screening-process]
  - id: market-indicators
    term: Market indicators
    short: Economic data that show how strong a country or region is as a market, such as overall income.
    related: [market-factors]
    skills: [screening-tools]
  - id: market-factors
    term: Market factors
    short: Economic data that move closely with demand for one particular product.
    related: [market-indicators]
    skills: [screening-tools]
  - id: trend-analysis
    term: Trend analysis
    short: Using repeated measurements taken at regular times to spot a pattern and guess the next value.
    related: [cluster-analysis]
    skills: [screening-tools]
  - id: cluster-analysis
    term: Cluster analysis
    short: A statistical way to sort countries or customers into groups that are similar to each other.
    related: [trend-analysis]
    skills: [screening-tools]
  - id: policy-stability
    term: Policy stability
    short: Government rules that stay predictable even when the people in power change.
    related: [market-screening, environmental-scanning, repatriation-of-earnings]
    skills: [screening-tools]
  - id: repatriation-of-earnings
    term: Repatriation of earnings
    short: Sending the profits a foreign business earns back to the home country.
    related: [policy-stability, market-indicators]
    skills: [screening-tools]
  - id: trade-mission
    term: Trade mission
    short: A trip by business people or government officials to a foreign market to look for deals.
    related: [trade-fair]
    skills: [segment-visits]
  - id: trade-fair
    term: Trade fair
    short: A big exhibition where many companies show and promote their products to buyers.
    related: [trade-mission]
    skills: [segment-visits]
  - id: social-desirability-bias
    term: Social desirability bias
    short: People answer a survey the way they think the interviewer wants, not the way they truly feel.
    related: [big-data, segment-scanning]
    skills: [research-problems]
  - id: big-data
    term: Big data
    short: Huge amounts of organized and messy information that businesses collect about customers and markets.
    related: [predictive-analytics]
    skills: [research-problems]
  - id: predictive-analytics
    term: Predictive analytics
    short: Using data and statistics to guess what customers will want or do next.
    related: [big-data]
    skills: [research-problems]
  - id: nonequity-mode
    term: Nonequity mode of entry
    short: A way into a foreign market that does not require the firm to own part of a business there.
    related: [equity-mode]
    skills: [nonequity-modes]
  - id: turnkey-project
    term: Turnkey project
    short: A deal where a firm builds a complete plant, trains the staff and hands over the working facility.
    related: [nonequity-mode]
    skills: [nonequity-modes]
  - id: licensing
    term: Licensing
    short: Letting another firm use your patents, trade secrets or technology in return for a fee.
    related: [franchising]
    skills: [nonequity-modes]
  - id: franchising
    term: Franchising
    short: A kind of licensing where another firm runs a business under your name.
    related: [licensing]
    skills: [nonequity-modes]
  - id: management-contract
    term: Management contract
    short: An agreement where one firm provides the managers to run another firm.
    related: [contracted-manufacturing]
    skills: [nonequity-modes]
  - id: contracted-manufacturing
    term: Contracted manufacturing
    short: Paying another firm to make your products to your specifications.
    related: [management-contract]
    skills: [nonequity-modes]
  - id: equity-mode
    term: Equity-based mode of entry
    short: A way into a foreign market where the firm owns part of a business there.
    related: [nonequity-mode]
    skills: [equity-modes]
  - id: joint-venture
    term: Joint venture
    short: A business that two or more organizations create and run together because they share an interest.
    related: [strategic-alliance]
    skills: [equity-modes]
  - id: strategic-alliance
    term: Strategic alliance
    short: A partnership with competitors, customers or suppliers.
    long: It can take a nonequity form, using contracts, or an equity form, with shared ownership.
    related: [joint-venture]
    skills: [equity-modes]
