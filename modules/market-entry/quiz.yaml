templates:
  # ------------------------------------------------------------------ screening-process
  - id: scan-screen-mcq
    type: mcq
    skills: [screening-process]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: screening-steps }
    prompt: How does [[market-screening]] differ from [[environmental-scanning]]?
    options:
      - Screening picks desirable markets by ruling out the less desirable ones; scanning watches the world for changes
      - Screening only studies one country; scanning only studies one customer
      - Screening is done after entry; scanning is done before entry
      - They mean exactly the same thing
    answer: 0
    hints:
      - One is a wide watch on change. The other is a narrowing down.
    explanation: Environmental scanning looks across the world for changing forces. Market screening is a modified form that finds good markets by eliminating weak ones.

  - id: country-segment-mcq
    type: mcq
    skills: [screening-process, segment-visits]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: screening-steps }
    prompt: A firm ignores country borders and instead looks at groups of shoppers with similar wants. Which approach is this?
    options:
      - Segment scanning
      - Country screening
      - Trend analysis
      - Contracted manufacturing
    answer: 0
    hints:
      - The unit being compared is a group of consumers, not a nation.
    explanation: Segment scanning works inside countries on groups of consumers. Country screening compares whole countries.

  - id: screening-order
    type: order
    skills: [screening-process]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: screening-steps }
    prompt: Put the five screenings in the order the lecture suggests, from the easiest data to the most subjective.
    items:
      - Basic needs potential
      - Financial and economic forces
      - Political and legal forces
      - Cultural forces
      - Competitive forces
    hints:
      - The first screening uses plain facts like climate and imports.
    explanation: The order moves from the most accessible, objective data to the least. Each step removes markets before the harder work begins.

  - id: screening-match
    type: match
    skills: [screening-process]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: screening-steps }
    prompt: Match each screening to what it checks.
    pairs:
      - ['Basic needs potential', 'Climate, land, natural resources and imports']
      - ['Financial and economic forces', 'Inflation, exchange rates, interest rates and credit']
      - ['Political and legal forces', 'Tariffs, ownership limits and rules on sending profits home']
      - ['Cultural forces', 'Subjective customs and values that are hard to measure from afar']
      - ['Competitive forces', 'Rival firms, their prices, quality and distribution']
    hints:
      - Start with the pair that mentions the most specific items, like tariffs.
    explanation: Each screening removes markets for a different reason. Together they narrow the list of countries.

  - id: screening-factors-multi
    type: multi
    skills: [screening-process]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: screening-steps }
    prompt: Which of these belong to the competitive screening?
    options:
      - The number and size of rival firms
      - Rivals' market shares
      - Rivals' pricing policies
      - Limits on foreign ownership
      - Trends in interest rates
    answer: [0, 1, 2]
    hints:
      - Two options belong to other screenings (political and financial).
    explanation: 'The competitive screening studies rivals: how many, how big, how they price and sell. Ownership limits are political and interest rates are financial.'

  - id: cultural-data-mcq
    type: mcq
    skills: [screening-process]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: screening-steps }
    prompt: Why is the cultural screening hard for a firm to do from its home office?
    options:
      - Culture is subjective and interpretive, and the data are hard to collect from a distance
      - Culture is always the same everywhere
      - Governments ban all research on culture
      - Culture data are always free and public
    answer: 0
    hints:
      - Think about whether a number can capture a custom.
    explanation: Culture is open to interpretation, so data are scarce and judgment-heavy. That is why this screening sits late in the order.

  # ------------------------------------------------------------------ screening-tools
  - id: indicator-factor-mcq
    type: mcq
    skills: [screening-tools]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: screening-tools }
    prompt: A firm that sells tires uses the number of registered cars in each country as its guide. What kind of data is that?
    options:
      - A [[market-factors|market factor]], since it moves closely with demand for the product
      - A [[market-indicators|market indicator]], since it shows the overall strength of the country
      - A trade fair
      - A turnkey project
    answer: 0
    hints:
      - Ask whether the data relate to one product or to the whole economy.
    explanation: Market factors correlate with demand for a particular product. Market indicators measure the relative strength of a country or area as a whole.

  - id: tools-match
    type: match
    skills: [screening-tools]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: screening-tools }
    prompt: Match each tool to its job.
    pairs:
      - ['[[market-indicators|Market indicators]]', 'Measure how strong a country is as a market']
      - ['[[market-factors|Market factors]]', 'Track data that move with demand for one product']
      - ['[[trend-analysis|Trend analysis]]', 'Uses repeated measurements to estimate future values']
      - ['[[cluster-analysis|Cluster analysis]]', 'Groups countries that are alike']
    hints:
      - Which tool looks forward in time? Which one sorts into groups?
    explanation: Indicators and factors describe the market. Trend analysis forecasts. Cluster analysis groups similar markets together.

  - id: trend-mcq
    type: mcq
    skills: [screening-tools]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: screening-tools }
    prompt: A firm studies a country's yearly inflation over ten years to guess next year's rate. Which technique is it using?
    options:
      - Trend analysis
      - Cluster analysis
      - Franchising
      - Segment scanning
    answer: 0
    hints:
      - Repeated observations at regular times point to a pattern.
    explanation: Trend analysis uses successive observations at regular intervals to estimate future values.

  - id: cluster-mcq
    type: mcq
    skills: [screening-tools]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: screening-tools }
    prompt: A snack firm sorts thirty countries into groups with similar incomes, tastes and shopping habits, then picks one country from each group. What is the benefit?
    options:
      - It tests one country per group instead of studying all thirty, because similar countries should behave alike
      - It guarantees every group will buy the snack
      - It removes the need for any political screening
      - It makes all thirty countries identical
    answer: 0
    hints:
      - The technique divides objects into groups based on similarity.
    explanation: Cluster analysis divides countries into similar groups so the firm can learn from fewer cases. It does not replace the political and legal screening.

  - id: stability-policy-mcq
    type: mcq
    skills: [screening-tools]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: screening-tools }
    prompt: Leaders in a country change often, yet tariff and ownership rules stay the same each time. What does that show?
    options:
      - Policy stability can hold even when political stability is low
      - Political stability and policy stability are always the same thing
      - The country has a command economy
      - Repatriation of earnings is banned
    answer: 0
    optionFeedback:
      1: The lecture separates the two ideas, so they can differ.
    hints:
      - Which one is about people in power and which one is about the rules?
    explanation: Governments may change while rules stay steady, so a firm should check both political stability and policy stability.

  - id: repatriation-mcq
    type: mcq
    skills: [screening-tools]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: screening-tools }
    prompt: A country caps how much profit a foreign subsidiary may send home each year. Which barrier is that?
    options:
      - A limit on repatriation of earnings
      - A trade fair
      - A turnkey contract
      - A cluster
    answer: 0
    hints:
      - Where do the profits end up?
    explanation: Sending profits back to the parent is repatriation. Limits on it are one of the political and legal barriers to check.

  # ------------------------------------------------------------------ segment-visits
  - id: segment-criteria-multi
    type: multi
    skills: [segment-visits]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: segments-and-visits }
    prompt: Which are criteria for a good consumer segment?
    options:
      - Definable
      - Large
      - Accessible
      - Secret
      - Actionable
      - Capturable
    answer: [0, 1, 2, 4, 5]
    hints:
      - Five of these six describe a useful target group.
    explanation: A segment should be definable, large, accessible, actionable and capturable. Being secret is not a criterion.

  - id: segment-criteria-match
    type: match
    skills: [segment-visits]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: segments-and-visits }
    prompt: Match each criterion to the question it asks.
    pairs:
      - ['Definable', 'Can we say clearly who is in the group?']
      - ['Large', 'Are there enough people to be worth it?']
      - ['Accessible', 'Can we reach them with ads and shops?']
      - ['Actionable', 'Can we design a plan that suits them?']
      - ['Capturable', 'Can we win their purchases?']
    hints:
      - Match Large first. It is the easiest.
    explanation: The one-line meanings are plain-language readings of the five criteria. A group that fails any of them is a weak target.

  - id: mission-fair-mcq
    type: mcq
    skills: [segment-visits]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: segments-and-visits }
    prompt: Which pair is correct?
    options:
      - A trade mission is a market visit to find business; a trade fair is a big exhibition where firms promote their products
      - A trade mission is a big exhibition; a trade fair is a government visit
      - Both are kinds of licensing
      - Both are kinds of tariff
    answer: 0
    hints:
      - One of them is a trip and one is an event.
    explanation: A mission travels to a market. A fair gathers many sellers in one place.

  - id: visit-why-mcq
    type: mcq
    skills: [segment-visits]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: segments-and-visits }
    prompt: Why do firms still visit a market in person before making the final choice?
    options:
      - Face-to-face interviews can show things written reports do not
      - Written reports are illegal abroad
      - Visits replace the need for screening
      - Visits are required by law
    answer: 0
    hints:
      - What can a conversation reveal that a table cannot?
    explanation: There is no substitute for a personal visit. The goal is to understand the market, and interviews uncover what reports miss.

  - id: fair-example-mcq
    type: mcq
    skills: [segment-visits]
    difficulty: 3
    tags: [application]
    lessonRef: { tab: application, id: visit-step }
    prompt: A book publisher wants to meet many foreign buyers in a single week. Which tool fits best?
    options:
      - A trade fair, because many companies and buyers gather in one place
      - A turnkey project
      - Contracted manufacturing
      - A variable levy
    answer: 0
    hints:
      - One of the options is an exhibition of products.
    explanation: A trade fair, like a large book fair, brings many sellers and buyers together at once.

  # ------------------------------------------------------------------ research-problems
  - id: bias-mcq
    type: mcq
    skills: [research-problems]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: local-research }
    prompt: Villagers praise a new soap because the interviewer is a polite visitor, though they dislike it. What is this?
    options:
      - Social desirability bias
      - Predictive analytics
      - A market factor
      - A joint venture
    answer: 0
    hints:
      - The answers are meant to please.
    explanation: Social desirability bias is the wish to please the interviewer, which hides true beliefs and feelings.

  - id: research-problems-multi
    type: multi
    skills: [research-problems]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: local-research }
    prompt: Which are problems of doing market research in a foreign country?
    options:
      - Language, dialect and literacy
      - Respondents who answer to please the interviewer
      - Out-of-date maps
      - Lower prices for every survey
      - A guarantee that culture matches the home market
    answer: [0, 1, 2]
    hints:
      - Pick the three that make research harder.
    explanation: The lecture lists cultural issues, social desirability bias and technical difficulties such as old maps.

  - id: bigdata-mcq
    type: mcq
    skills: [research-problems]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: local-research }
    prompt: Which describes big data in marketing research?
    options:
      - Massive structured and unstructured data that can be analyzed to find consumer needs and trends
      - A single survey with a very large number of questions
      - A tax on digital goods
      - A list of competitors
    answer: 0
    hints:
      - Look for the option about volume and variety of information.
    explanation: Big data covers huge, mixed data sets that advanced methods turn into insight, with risks for privacy and cybersecurity.

  - id: bigdata-risk-multi
    type: multi
    skills: [research-problems]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: local-research }
    prompt: Which uses or risks does the lecture link to big data?
    options:
      - Predictive analytics
      - User behavior analytics
      - Personalized shopping
      - Cybersecurity and privacy concerns
      - Removing the need for any customers
    answer: [0, 1, 2, 3]
    hints:
      - Only one option is nonsense.
    explanation: Big data supports prediction, behavior tracking and personalization, but it raises data privacy and protection concerns.

  # ------------------------------------------------------------------ nonequity-modes
  - id: turnkey-mcq
    type: mcq
    skills: [nonequity-modes]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: nonequity }
    prompt: A contractor designs and builds a factory abroad, trains the workers, runs a trial and then hands it over. What is this?
    options:
      - A turnkey project
      - A joint venture
      - Franchising
      - A trade mission
    answer: 0
    hints:
      - The buyer just turns a key.
    explanation: A turnkey project exports technology, management skill and sometimes equipment, then hands over a working facility.

  - id: license-franchise-mcq
    type: mcq
    skills: [nonequity-modes]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: nonequity }
    prompt: How is franchising related to licensing?
    options:
      - It is a form of licensing that runs a business under an established name by specific rules, giving more control
      - It is the opposite of licensing and always requires ownership
      - It is the same as a joint venture
      - It only applies to manufacturing plants
    answer: 0
    hints:
      - One is a special case of the other.
    explanation: Franchising is licensing plus a full set of operating rules, so the franchisor gets more control than with simple licensing.

  - id: nonequity-match
    type: match
    skills: [nonequity-modes]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: nonequity }
    prompt: Match each nonequity entry mode to its description.
    pairs:
      - ['[[turnkey-project|Turnkey project]]', 'Build a plant and hand over the working facility']
      - ['[[licensing|Licensing]]', 'Give access to patents or technology for a fee']
      - ['[[franchising|Franchising]]', 'Let a partner run a business under your name and rules']
      - ['[[management-contract|Management contract]]', 'One firm provides the managers for another']
      - ['[[contracted-manufacturing|Contracted manufacturing]]', 'Another firm makes your products to your specifications']
    hints:
      - Begin with the two that mention making or building something.
    explanation: None of these requires the firm to own part of a foreign business, so all are nonequity modes.

  - id: nonequity-multi
    type: multi
    skills: [nonequity-modes]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: nonequity }
    prompt: Which are nonequity modes of entry?
    options:
      - Licensing
      - Franchising
      - Joint venture
      - Management contract
      - Contracted manufacturing
    answer: [0, 1, 3, 4]
    hints:
      - One of these means sharing ownership in a new business.
    explanation: A joint venture is an equity-based mode. The other four work through contracts.

  - id: fashion-mode-mcq
    type: mcq
    skills: [nonequity-modes]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: application, id: pick-mode }
    prompt: A fashion house wants a foreign partner to use its brand and designs for a fee, without opening its own shops. Which mode fits?
    options:
      - Licensing
      - Turnkey project
      - Management contract
      - Strategic alliance with shared shares
    answer: 0
    hints:
      - The lecture says this mode is used in technology and fashion.
    explanation: Licensing gives access to brands, designs or technology for a fee and is common in fashion and technology.

  - id: culture-franchise-mcq
    type: mcq
    skills: [nonequity-modes]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: nonequity }
    prompt: Which statement about franchising abroad is correct?
    options:
      - Cultural forces may hinder franchising efforts
      - Franchising is never affected by culture
      - Franchising gives less control than licensing
      - Franchising always needs the firm to own the stores
    answer: 0
    hints:
      - Two options contradict what the lecture says about control.
    explanation: Franchising gives more control than licensing, but local culture can still get in the way.

  # ------------------------------------------------------------------ equity-modes
  - id: jv-mcq
    type: mcq
    skills: [equity-modes]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: equity-and-choice }
    prompt: Two firms with a common interest create a business and run it together. What is this called?
    options:
      - A joint venture
      - A trade fair
      - A turnkey project
      - Contracted manufacturing
    answer: 0
    hints:
      - Look for the option with a shared business undertaking.
    explanation: A joint venture is a cooperative effort among two or more organizations that share an interest in a business undertaking.

  - id: alliance-mcq
    type: mcq
    skills: [equity-modes]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: equity-and-choice }
    prompt: Which statement about strategic alliances is true?
    options:
      - They can be formed with competitors, customers or suppliers, and may take nonequity or equity form
      - They are only possible between two competitors
      - They always require shares
      - They are the same as licensing
    answer: 0
    hints:
      - The lecture says they may take either form.
    explanation: An alliance is a collaboration with competitors, customers or suppliers, and may or may not involve equity.

  - id: mode-classify-match
    type: match
    skills: [nonequity-modes, equity-modes]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: equity-and-choice }
    prompt: Match each mode to its group.
    pairs:
      - ['Licensing', 'Nonequity']
      - ['Management contract', 'Nonequity']
      - ['Joint venture', 'Equity-based']
      - ['Strategic alliance with shared ownership', 'Equity-based']
    hints:
      - Ask whether the firm owns part of a business abroad.
    explanation: The groups differ by ownership. Equity modes share ownership; nonequity modes use contracts.

  - id: entry-order
    type: order
    skills: [screening-process, equity-modes]
    difficulty: 3
    tags: [application]
    lessonRef: { tab: application, id: pick-mode }
    prompt: Put a market entry decision in a sensible order.
    items:
      - Screen countries and segments, from easy data to hard
      - Visit the shortlisted market in person
      - Research local consumers
      - Choose an entry mode
    hints:
      - You cannot pick a mode before you know where to go.
    explanation: Screening comes first, then a visit and local research, and the entry mode is chosen last.

  - id: mode-scenario-multi
    type: multi
    skills: [equity-modes, nonequity-modes]
    difficulty: 3
    tags: [application]
    lessonRef: { tab: application, id: pick-mode }
    prompt: A firm wants a local partner and shared ownership in a new foreign business. Which modes could fit?
    options:
      - Joint venture
      - Strategic alliance in equity form
      - Licensing
      - Contracted manufacturing
    answer: [0, 1]
    hints:
      - The key words are shared ownership.
    explanation: Only equity-based modes share ownership. Licensing and contracted manufacturing are contract-only.
