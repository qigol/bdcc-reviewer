sections:
  - id: key-terms
    title: Key terms lookup
    skills:
      - screening-process
      - screening-tools
      - segment-visits
      - research-problems
      - nonequity-modes
      - equity-modes
    summary: "A placeholder section: this module is conceptual, so the workbench only looks up the meaning of its key terms.
      Pick a term to see what it means."
    keyFormula: \text{term} \rightarrow \text{meaning}
    state:
      term: environmental-scanning
    derive:
      - fn: termLookup
        in:
          term: "@term"
        out: k
    live:
      - id: r
        widget: Readout
        props:
          items:
            - label: Term
              value: "{=k.name}"
              tone: accent
            - label: Meaning
              value: "{=k.meaning}"
              tone: good
      - id: pick
        widget: Choice
        props:
          label: Term
          options:
            - value: environmental-scanning
              label: Environmental scanning
            - value: market-indicators
              label: Market indicators
            - value: segment-scanning
              label: Segment scanning
            - value: social-desirability-bias
              label: Social desirability bias
            - value: nonequity-mode
              label: Nonequity mode of entry
        bind:
          value: term
    steps:
      - tex: |
          \anchor{lookup}{\text{term}} ;\mapsto; \text{meaning}
        say: Each term has one meaning in this lecture.
      - tex: |
          \anchor{answer}{\text{meaning}} = \text{{=k.name|text}}
        say: "{=k.name}: {=k.meaning}"
    code:
      lang: python
      title: A term lookup
      source: |
        TERMS = {
            "environmental-scanning": "Environmental scanning",
            "market-indicators": "Market indicators",
            "segment-scanning": "Segment scanning",
            "social-desirability-bias": "Social desirability bias",
            "nonequity-mode": "Nonequity mode of entry",
        }

        def term_lookup(term):
            """Look up a key term from the lecture.

            Args:
                term: the term's id.
            Returns:
                The term's name.
            Placeholder: this module is conceptual; see the Intuition tab.
            """
            name = TERMS[term]       # @a:lookup
            return name              # @a:answer
    links:
      - anchor: lookup
        label: Find the term
      - anchor: answer
        label: Its meaning
    trace:
      fn: termLookup
      in:
        term: "@term"
    examples:
      - term-environmental-scanning
      - term-market-indicators
      - term-segment-scanning
      - term-social-desirability-bias
      - term-nonequity-mode
    tryIt:
      - screening-match
      - scan-screen-mcq
    pitfalls:
      - Memorizing the term without the idea behind it. The Intuition tab explains each one.
    examTip: "Exam questions on this lecture are conceptual: know what each term means and when it applies."
