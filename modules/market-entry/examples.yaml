examples:
  - id: term-environmental-scanning
    source: "INTB 3355 Module 12, International Markets: Assessment and Entry Modes (Session 22): glossary term
      Environmental scanning"
    fn: termLookup
    in:
      term: environmental-scanning
    expect:
      name: Environmental scanning
      meaning: Watching the whole world for changes in politics, money, culture or competition that could affect a firm.
  - id: term-market-indicators
    source: "INTB 3355 Module 12, International Markets: Assessment and Entry Modes (Session 22): glossary term Market
      indicators"
    fn: termLookup
    in:
      term: market-indicators
    expect:
      name: Market indicators
      meaning: Economic data that show how strong a country or region is as a market, such as overall income.
  - id: term-segment-scanning
    source: "INTB 3355 Module 12, International Markets: Assessment and Entry Modes (Session 22): glossary term Segment
      scanning"
    fn: termLookup
    in:
      term: segment-scanning
    expect:
      name: Segment scanning
      meaning: Choosing markets by looking inside countries at groups of consumers who share similar wants and needs.
  - id: term-social-desirability-bias
    source: "INTB 3355 Module 12, International Markets: Assessment and Entry Modes (Session 22): glossary term Social
      desirability bias"
    fn: termLookup
    in:
      term: social-desirability-bias
    expect:
      name: Social desirability bias
      meaning: People answer a survey the way they think the interviewer wants, not the way they truly feel.
  - id: term-nonequity-mode
    source: "INTB 3355 Module 12, International Markets: Assessment and Entry Modes (Session 22): glossary term Nonequity
      mode of entry"
    fn: termLookup
    in:
      term: nonequity-mode
    expect:
      name: Nonequity mode of entry
      meaning: A way into a foreign market that does not require the firm to own part of a business there.
