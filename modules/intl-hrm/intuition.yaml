scenes:
  - id: labor
    title: Where the workers are
    goal: Before hiring abroad, what should a company know about the people who live and work in each country?
    skills: [labor-conditions]
    stage:
      - id: trend-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: n1, label: Population is growing and getting younger }
            - { id: n2, label: Population is expected to decline }
            - { id: n3, label: Aging is more pronounced }
            - { id: n4, label: Urbanization rose about eight times faster from 1970 to 2020 }
          bins:
            - { id: dev, label: Developed nations }
            - { id: devg, label: Developing nations }
          solution: { n1: devg, n2: dev, n3: dev, n4: devg }
      - id: expat-note
        widget: Callout
        props:
          kind: note
          title: People working abroad
          body: |
            In 2024 the number of expatriates worldwide was estimated at **over 202 million**. The United States has about
            **4 percent** of the world's population but over **18 percent** of its migrants.
      - id: union-note
        widget: Callout
        hidden: true
        props:
          kind: tip
          title: Unions around the world
          body: |
            In the U.S. and Europe, union activity is often **adversarial** with management. In Japan, unions identify strongly
            with the **company's interests**. Union numbers are falling in most developed nations.
    beats:
      - say: |
          A global firm has to find the right number of people with the right skills in every country. The **labor market**
          is the pool of available people with the needed skills who live within commuting distance of an employer.
        define: [labor-market]
        show: [expat-note]
      - say: |
          World populations are changing. Developing nations are growing and getting younger. In developed nations,
          populations are expected to decline, and aging is more pronounced. More than half the world now lives in cities.
        hide: [expat-note]
        show: [trend-sorter]
        gate:
          type: event
          prompt: Sort each trend into developed or developing nations.
          target: trend-sorter
          event: solved
          hint: Fast urban growth and young populations belong with developing countries.
      - say: |
          People also move to find jobs. **Labor mobility** is the movement of people from country to country in search of
          work. **Guest workers** go legally to a foreign country for certain jobs, on a temporary basis.
        define: [labor-mobility, guest-workers]
        hide: [trend-sorter]
        gate:
          type: predict
          question: When an economy slows, what usually happens to guest workers?
          options:
            - Their contracts may not be renewed, or they may be sent home
            - They all become citizens
            - Their pay doubles
            - They are required to stay
          answer: 0
          explain: When economies slow, fewer workers are needed, and guest workers are either not renewed or deported.
      - say: |
          Some countries lose their best minds. **Brain drain** is a country's loss of its most intelligent and best-educated
          people. **Reverse brain drain** is when highly skilled emigrants return home.
        define: [brain-drain, reverse-brain-drain]
      - say: |
          Workers also organize. **Collective bargaining** is the process in which a union represents workers in talks with
          management. Union attitudes differ by region.
        define: [collective-bargaining]
        show: [union-note]
      - say: Check the first idea.
        hide: [union-note]
        gate:
          type: practice
          template: labor-market-mcq
      - say: And the four movement terms.
        gate:
          type: practice
          template: labor-terms-match
      - say: Think about what this means for a firm.
        gate:
          type: reflect
          prompt: What might a multinational do differently if its home country is aging while a country where it operates is young and urbanizing?
          model: |
            It could hire more workers in the young, urban country, train them, and think about moving some jobs there. It may
            also bring in migrants or use guest workers at home, and plan for a shrinking workforce.
    takeaway: Population, migration and unions decide how many and what kind of workers a firm can find in each country.

  - id: approaches
    title: Four ways to choose a team
    goal: When a firm opens a branch abroad, whose point of view should guide who it hires and promotes?
    skills: [hr-approach]
    stage:
      - id: approach-table
        widget: Schedule
        hidden: true
        props:
          title: Four approaches and the strategies they go with
          columns: [Hires and promotes on, Typical strategy]
          rows:
            - { label: Ethnocentric, amounts: ['Parent company home-country viewpoint', International or home replication] }
            - { label: Polycentric, amounts: ['Local context of the subsidiary', Multidomestic] }
            - { label: Regiocentric, amounts: ['Regional context of the subsidiary', Regional] }
            - { label: Geocentric, amounts: ['Ability and experience, not citizenship', Transnational] }
      - id: case-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: a1, label: Headquarters picks its own citizens for key posts abroad }
            - { id: a2, label: The subsidiary hires locals who know the language and customs }
            - { id: a3, label: A firm staffs a whole region with a mix of locals and people from nearby countries }
            - { id: a4, label: The best person from anywhere gets the job }
          bins:
            - { id: eth, label: Ethnocentric }
            - { id: poly, label: Polycentric }
            - { id: regio, label: Regiocentric }
            - { id: geo, label: Geocentric }
          solution: { a1: eth, a2: poly, a3: regio, a4: geo }
    beats:
      - say: |
          An international HR manager sets policies for estimating workforce needs, recruiting, training, motivating, paying,
          disciplining and ending employment. Underneath them all sits a choice about whose view guides hiring.
      - say: |
          An **ethnocentric approach** hires and promotes by the parent company's home-country viewpoint. It fits firms with
          low pressure for cost cuts and local responsiveness, and it can be expensive because home staff cost more.
        define: [ethnocentric]
      - say: Pause and make a guess before the next idea.
        gate:
          type: predict
          question: A firm that must respond closely to each country's tastes and rules would most likely staff its subsidiaries how?
          options:
            - Mostly with local people
            - Only with headquarters citizens
            - With a single worldwide pool
            - With no people at all
          answer: 0
          explain: Multidomestic firms face high pressure for local responsiveness, which points to local staff.
      - say: |
          A **polycentric approach** follows the local context where the subsidiary operates. It suits firms facing high
          pressure for local responsiveness. Locals know customs and language, but may need training.
        define: [polycentric]
      - say: |
          A **regiocentric approach** follows the regional context and uses both host-country and third-country people.
          A **geocentric approach** picks the best person for the job whatever their race or citizenship.
        define: [regiocentric, geocentric]
        show: [approach-table]
      - say: Sort four staffing choices into their approach.
        hide: [approach-table]
        show: [case-sorter]
        gate:
          type: event
          prompt: Drop each staffing choice into the approach it shows.
          target: case-sorter
          event: solved
          hint: Look for whose viewpoint is guiding the choice.
      - say: Review the four.
        hide: [case-sorter]
        gate:
          type: practice
          template: approach-match
      - say: And the most global of the four.
        gate:
          type: practice
          template: geo-mcq
    takeaway: Staffing follows strategy, from ethnocentric at one end to geocentric at the other.

  - id: staffing
    title: Who gets the job?
    goal: Whom can a firm hire for a key job abroad, and what does each kind of worker bring?
    skills: [staffing-training]
    stage:
      - id: national-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: s1, label: A U.S. citizen sent from U.S. headquarters to the firm's Brazilian subsidiary }
            - { id: s2, label: A Brazilian hired by the subsidiary in Brazil }
            - { id: s3, label: A Mexican citizen working for the U.S. firm in Brazil }
          bins:
            - { id: pcn, label: Parent-country national }
            - { id: hcn, label: Host-country national }
            - { id: tcn, label: Third-country national }
          solution: { s1: pcn, s2: hcn, s3: tcn }
      - id: staffing-table
        widget: Schedule
        hidden: true
        props:
          title: What each type brings
          columns: [Strength, Concern]
          rows:
            - { label: Parent-country national, amounts: ['Knows headquarters and its decisions', 'Can be expensive to use'] }
            - { label: Host-country national, amounts: ['Understands local customs, culture and language', 'May need training; loyalty may be split'] }
            - { label: Third-country national, amounts: ['May accept lower wages; may know another company unit', 'Cost savings not assured; work permits'] }
    beats:
      - say: |
          Employees are classed by citizenship. A **parent-country national** is a citizen of the nation where the parent
          company has its headquarters. Ethnocentric firms use them for key posts.
        define: [parent-country-national]
      - say: |
          A **host-country national** is a citizen of the nation where the subsidiary operates. A [[third-country-national|third-country national]] is a citizen of neither the parent's nor the host country.
        define: [host-country-national, third-country-national]
        show: [national-sorter]
        gate:
          type: event
          prompt: Classify each person from the U.S. firm's point of view.
          target: national-sorter
          event: solved
          hint: Ask which country the parent is in and which country the subsidiary is in.
      - say: |
          Each type has strengths and concerns. Before you see them, think about which type is likely to know the local
          scene best.
        hide: [national-sorter]
        gate:
          type: predict
          question: Which type of employee is most likely to understand local customs and language?
          options:
            - Host-country nationals
            - Parent-country nationals
            - Third-country nationals
            - They are all equal
          answer: 0
          explain: Host-country nationals grew up in the local culture, which is why polycentric firms rely on them.
      - say: Here is what each type brings. Check the three classes.
        show: [staffing-table]
        gate:
          type: practice
          template: nationals-match
      - say: Apply the classes to a case.
        gate:
          type: practice
          template: nationals-case-mcq
    takeaway: Citizenship sorts employees into parent-country, host-country and third-country nationals, each with trade-offs.

  - id: training
    title: Getting people ready
    goal: Do home, local and third-country staff need the same preparation?
    skills: [staffing-training]
    stage:
      - id: train-table
        widget: Schedule
        hidden: true
        props:
          title: Training and development by type
          columns: [What the lecture says]
          rows:
            - { label: Parent-country national, amounts: ['Few recent graduates are hired to be sent abroad; encouraged to study language and culture; short trips; family concerns'] }
            - { label: Host-country national, amounts: ['If hired at home, may lose touch with the host country; if hired locally, may attend home-country schools and visit HQ'] }
            - { label: Third-country national, amounts: ['May accept lower pay; may know another unit; work permit obstacles; use grows with geocentric views'] }
      - id: train-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: r1, label: Short trips to handle special assignments }
            - { id: r2, label: Visits to headquarters to learn skills and build a network }
            - { id: r3, label: Work permits can be an obstacle }
          bins:
            - { id: pcn, label: Parent-country national }
            - { id: hcn, label: Host-country national }
            - { id: tcn, label: Third-country national }
          solution: { r1: pcn, r2: hcn, r3: tcn }
    beats:
      - say: |
          Hiring is only the start. Training depends on who the person is. A home-country employee who will be sent abroad
          needs language and culture preparation and often a short trip first, and the family is a major concern.
        show: [train-table]
      - say: |
          A local hire may be sent to the parent's headquarters, schools or other subsidiaries to gain skills and a
          network. A third-country hire may already know the company, but may face work permit problems.
        hide: [train-table]
        show: [train-sorter]
        gate:
          type: event
          prompt: Match each training point to the type of employee.
          target: train-sorter
          event: solved
          hint: Headquarters visits help locals. Work permits matter for outsiders.
      - say: Take a guess first. The answer comes right after.
        gate:
          type: predict
          question: What trend does the lecture link to more use of third-country nationals?
          options:
            - An increasingly geocentric view
            - A purely ethnocentric view
            - Lower union density
            - Falling urbanization
          answer: 0
          explain: A geocentric view staffs from worldwide pools, which raises the use of third-country nationals.
      - say: |
          As more firms take a geocentric view, they will use more third-country nationals, so training will need to
          span many nationalities.
        hide: [train-sorter]
      - say: Check the training points.
        gate:
          type: practice
          template: training-match
      - say: And what third-country staff mean for a firm.
        gate:
          type: practice
          template: tcn-mcq
    takeaway: Training differs for each type of employee, from language and culture for home staff to headquarters visits for local hires.

  - id: expats
    title: Life as an expatriate
    goal: Why do so many international assignments end badly, and how can they go better?
    skills: [expatriates, expat-family]
    stage:
      - id: type-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: e1, label: A host-country employee brought to headquarters }
            - { id: e2, label: A home employee sent for a few weeks to fix a problem abroad }
            - { id: e3, label: A home employee relocated abroad for four years }
          bins:
            - { id: inp, label: Inpatriate }
            - { id: flex, label: Flexpatriate }
            - { id: exp, label: Expatriate }
          solution: { e1: inp, e2: flex, e3: exp }
      - id: family-note
        widget: Callout
        hidden: true
        props:
          kind: warn
          title: The family factor
          body: |
            As many as **90 percent** of expatriate failures are family related, and over **75 percent** of people who decline
            relocations cite family concerns. Only about **one in five** companies require cross-cultural training.
    beats:
      - say: |
          Firms staff abroad in three ways. **Inpatriates** are employees hired in the host country. **Flexpatriates** are home
          or third-country employees on short-term assignments. **Expatriates** are relocated for a longer stay.
        define: [inpatriate, flexpatriate, expatriate]
        show: [type-sorter]
        gate:
          type: event
          prompt: Classify each person.
          target: type-sorter
          event: solved
          hint: Short stays are flex, longer stays abroad are expat.
      - say: |
          Expatriates bring scarce skills and grow into leaders. But costs are high and failure rates are high, with about
          a quarter leaving the company during the assignment. A typical assignment lasts two to five years.
        hide: [type-sorter]
      - say: |
          Moving abroad can cause **culture shock**, the anxiety of moving from a familiar culture to an entirely different
          one. It touches work, daily life and contact with local people. Coming home brings **reverse culture shock**.
        define: [culture-shock, reverse-culture-shock]
        gate:
          type: predict
          question: What does the lecture say is the cause of most expatriate failures?
          options:
            - Family-related problems
            - Poor salary
            - Language errors in contracts
            - Union disputes
          answer: 0
          explain: Up to 90 percent of expatriate failures are family related.
      - say: |
          In a two-career family the **trailing spouse** may have no right to work abroad, and faces changes in lifestyle
          and self-image. Children, sometimes called **third-culture kids**, may gain culturally but can feel insecure.
        define: [trailing-spouse, third-culture-kids]
        show: [family-note]
      - say: |
          Coming back matters too. **Repatriation** is the return home. Planning should start before the assignment, with
          career goals discussed up front, regular visits home and a plan to use the new knowledge.
        define: [repatriation]
        hide: [family-note]
      - say: Check the three types.
        gate:
          type: practice
          template: types-match
      - say: And the shock on the way back.
        gate:
          type: practice
          template: shock-mcq
      - say: Put the return in order.
        gate:
          type: practice
          template: repat-order
    takeaway: Expatriate assignments succeed or fail largely through the family, and the return home needs a plan.

  - id: pay
    title: Paying people to live abroad
    goal: Why is an expatriate's pay so much more complicated than a home salary?
    skills: [compensation]
    stage:
      - id: pay-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: m1, label: Pay equal to the home counterpart }
            - { id: m2, label: Housing and schooling help }
            - { id: m3, label: Extra pay for a dangerous posting }
            - { id: m4, label: A company car with a driver }
          bins:
            - { id: base, label: Base salary }
            - { id: allow, label: Allowance }
            - { id: bonus, label: Bonus }
            - { id: perk, label: Perk }
          solution: { m1: base, m2: allow, m3: bonus, m4: perk }
      - id: pay-note
        widget: Callout
        hidden: true
        props:
          kind: note
          title: Complications
          body: |
            A package can include many payments, and must consider **exchange rates and inflation**. In practice **65 to
            75 percent** of base salary is paid in host-country currency, and firms must choose an exchange rate.
    beats:
      - say: |
          Pay must be fair and attractive enough to find the expatriates a firm needs. The traditional method is the
          **balance sheet approach**: a base salary equal to a domestic counterpart, plus allowances and bonuses.
        define: [balance-sheet-approach]
      - say: |
          **Allowances** are added to base salary because living abroad costs more: housing, cost of living, tax
          differences, education, moving and orientation. **Bonuses** pay for hardship, inconvenience or danger.
        define: [allowances, bonuses]
        show: [pay-sorter]
        gate:
          type: event
          prompt: Sort each pay element.
          target: pay-sorter
          event: solved
          hint: Danger is a bonus. Housing help is an allowance.
      - say: |
          **International status** entitles an expatriate to all the allowances and bonuses for the place of residence and
          work. **Perks** are extra benefits such as cars, company housing, insurance and club memberships.
        define: [international-status, perks]
        hide: [pay-sorter]
        show: [pay-note]
        gate:
          type: predict
          question: In a country with high personal income tax, how do firms often pay executives?
          options:
            - Lower salaries and expensive perquisites
            - Higher salaries and no perks
            - Only in stock
            - Equal salaries everywhere
          answer: 0
          explain: Where taxes are high, firms often rely on perquisites such as premium housing and elite schooling.
      - say: |
          Third-country nationals are increasingly treated like host-country nationals, but tax differences and home leave
          bonuses make their pay complicated too.
        hide: [pay-note]
      - say: Check the elements.
        gate:
          type: practice
          template: pay-parts-match
      - say: And the main method.
        gate:
          type: practice
          template: balance-mcq
      - say: A last question.
        gate:
          type: reflect
          prompt: Why might a company use a lump sum instead of the balance sheet approach?
          model: |
            The balance sheet approach is complex and expensive to run because each allowance must be calculated. A lump sum is
            simpler to administer and gives the person flexibility, though it can look less fair.
    takeaway: Expatriate pay builds on a home salary with allowances, bonuses and perks, and exchange rates and tax add complexity.
