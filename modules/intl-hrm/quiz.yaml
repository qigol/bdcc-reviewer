templates:
  # ------------------------------------------------------------------ labor-conditions
  - id: labor-market-mcq
    type: mcq
    skills: [labor-conditions]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: labor }
    prompt: What is a [[labor-market|labor market]]?
    options:
      - The pool of available people with the needed skills within commuting distance of an employer
      - A place where goods are sold to workers
      - A government office that sets wages
      - A union meeting
    answer: 0
    hints:
      - It is about people, not goods.
    explanation: A labor market is the pool of potential employees with the necessary skills who live within commuting distance.

  - id: aging-mcq
    type: mcq
    skills: [labor-conditions]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: labor }
    prompt: Which statement about world population trends matches the lecture?
    options:
      - Populations in developing nations are growing and becoming younger, while aging is more pronounced in developed nations
      - All populations are growing at the same rate
      - Developed nations are growing younger
      - Urbanization has stopped
    answer: 0
    hints:
      - Think of which group has fewer young people.
    explanation: Developing nations are growing and getting younger, while developed nations are aging and expected to decline.

  - id: labor-terms-match
    type: match
    skills: [labor-conditions]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: labor }
    prompt: Match each term to its meaning.
    pairs:
      - ['[[labor-mobility|Labor mobility]]', 'Movement of people between places for jobs']
      - ['[[guest-workers|Guest workers]]', 'Legal temporary workers in a foreign country']
      - ['[[brain-drain|Brain drain]]', 'Loss of a country''s best-educated people']
      - ['[[reverse-brain-drain|Reverse brain drain]]', 'Skilled emigrants returning home']
    hints:
      - Two of them are opposites.
    explanation: These four terms describe how workers move between countries.

  - id: unions-mcq
    type: mcq
    skills: [labor-conditions]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: labor }
    prompt: How do union relations differ between regions, according to the lecture?
    options:
      - In the U.S. and Europe unions are often adversarial with management, while in Japan they identify strongly with the company
      - Unions are the same everywhere
      - Unions are banned in all developed countries
      - Japanese unions oppose their companies
    answer: 0
    hints:
      - Think of the contrast between Japan and the West.
    explanation: The lecture also notes unions are declining in most developed nations.

  - id: migration-multi
    type: multi
    skills: [labor-conditions]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: labor }
    prompt: Which statements about migration match the lecture?
    options:
      - Two-thirds of the world's migrants live in developed countries
      - The U.S. has over 18 percent of the world's migrants
      - Many migrants work in dirty, dangerous and degrading jobs
      - Guest workers always get permanent residence
    answer: [0, 1, 2]
    hints:
      - Guest workers are temporary.
    explanation: When economies slow, guest workers may not be renewed or may be deported.

  - id: urban-mcq
    type: mcq
    skills: [labor-conditions]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: labor }
    prompt: What does urbanization often create for companies, according to the lecture?
    options:
      - A pool of low-cost, low-skill workers
      - A shortage of all workers
      - Fewer people in cities
      - Higher union density everywhere
    answer: 0
    hints:
      - Think about people moving from farms to cities.
    explanation: More than half the world now lives in urban areas, and the rate of urbanization has been much faster in developing countries.

  # ------------------------------------------------------------------ hr-approach
  - id: approach-match
    type: match
    skills: [hr-approach]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: approaches }
    prompt: Match each approach to what it hires on.
    pairs:
      - ['[[ethnocentric|Ethnocentric]]', 'The parent company''s home-country frame of reference']
      - ['[[polycentric|Polycentric]]', 'The local context of the subsidiary']
      - ['[[regiocentric|Regiocentric]]', 'The regional context of the subsidiary']
      - ['[[geocentric|Geocentric]]', 'Ability and experience, regardless of citizenship']
    hints:
      - Poly means many local contexts.
    explanation: The four approaches differ in whose point of view guides hiring and promotion.

  - id: strategy-approach-match
    type: match
    skills: [hr-approach]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: approaches }
    prompt: Match each strategy to the staffing approach that usually goes with it.
    pairs:
      - ['Home replication or international', 'Ethnocentric']
      - ['Multidomestic', 'Polycentric']
      - ['Regional', 'Regiocentric']
      - ['Transnational', 'Geocentric']
    hints:
      - Multidomestic firms respond to local needs.
    explanation: Each strategy brings different pressures for cost and for local responsiveness, which shape staffing.

  - id: pressures-mcq
    type: mcq
    skills: [hr-approach]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: approaches }
    prompt: Which staffing approach fits a firm that faces low pressure for cost reduction and high pressure for local responsiveness?
    options:
      - Polycentric
      - Ethnocentric
      - Geocentric
      - Regiocentric
    answer: 0
    optionFeedback:
      1: Ethnocentric firms face low pressure for both cost reduction and local responsiveness.
    hints:
      - Local responsiveness points to local staff.
    explanation: Polycentric staffing uses host-country nationals who know the local customs, culture and language.

  - id: geo-mcq
    type: mcq
    skills: [hr-approach]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: approaches }
    prompt: What is a geocentric staffing policy?
    options:
      - Using worldwide staffing pools to find the best person for the job, regardless of national origin
      - Hiring only locals
      - Hiring only people from headquarters
      - Hiring only from one region
    answer: 0
    hints:
      - Think of the best person for the job.
    explanation: Geocentric staffing fits transnational firms, and HR practice tends to be consistent across subsidiaries.

  # ------------------------------------------------------------------ staffing-training
  - id: nationals-match
    type: match
    skills: [staffing-training]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: staffing }
    prompt: Match each employee class to its meaning.
    pairs:
      - ['[[parent-country-national|Parent-country national]]', 'Citizen of the country with the parent''s headquarters']
      - ['[[host-country-national|Host-country national]]', 'Citizen of the country where the subsidiary operates']
      - ['[[third-country-national|Third-country national]]', 'Citizen of neither of those countries']
    hints:
      - Third means neither of the other two.
    explanation: Where an employee holds citizenship decides the class.

  - id: nationals-case-mcq
    type: mcq
    skills: [staffing-training]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: staffing }
    prompt: A Japanese firm sends a Thai manager to run its subsidiary in Brazil. What is the manager in this role?
    options:
      - A third-country national
      - A parent-country national
      - A host-country national
      - An inpatriate
    answer: 0
    hints:
      - Is Thailand the parent's country or the host country?
    explanation: The manager is a citizen of neither Japan (parent) nor Brazil (host).

  - id: staffing-pros-multi
    type: multi
    skills: [staffing-training]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: staffing }
    prompt: Which statements about host-country nationals match the lecture?
    options:
      - They understand local customs, culture and language
      - They may require considerable training
      - There can be a conflict between loyalty to the host country and the employer
      - They always cost more than expatriates
    answer: [0, 1, 2]
    hints:
      - Cost was the concern for home-country staff.
    explanation: Polycentric staffing uses HCNs. Using home-country citizens can be expensive.

  - id: tcn-mcq
    type: mcq
    skills: [staffing-training]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: training }
    prompt: Which is true of third-country nationals?
    options:
      - They may accept lower wages and benefits and may have worked for another unit of the company
      - They never need work permits
      - They are always cheaper in every case
      - They cannot be used by regiocentric firms
    answer: 0
    hints:
      - The lecture also warns of obstacles obtaining work permits.
    explanation: Cost savings are not assured with TCNs, and work permits can be obstacles.

  - id: training-match
    type: match
    skills: [staffing-training]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: training }
    prompt: Match each type of employee to a training point from the lecture.
    pairs:
      - ['Parent-country national', 'Encouraged to study the language and culture, often with a short trip first']
      - ['Host-country national hired in the host country', 'May be sent to HQ or business school to gain skills and a network']
      - ['Third-country national', 'May already know the company from another unit']
    hints:
      - Short trips fit a person heading abroad.
    explanation: Each class has different training needs and concerns.

  - id: hr-duties-order
    type: order
    skills: [staffing-training, hr-approach]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: approaches }
    prompt: Put these international HR responsibilities in the order the lecture lists them.
    items:
      - Estimating workforce needs
      - Recruitment and selection
      - Training and development
      - Motivation and compensation
      - Discipline and employment termination
    hints:
      - You hire before you train.
    explanation: The lecture lists policy areas from workforce planning through recruitment, training, motivation, compensation, discipline and termination.

  # ------------------------------------------------------------------ expatriates
  - id: types-match
    type: match
    skills: [expatriates]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: expats }
    prompt: Match each type of international employee to its description.
    pairs:
      - ['[[inpatriate|Inpatriate]]', 'Employee hired in the host country']
      - ['[[flexpatriate|Flexpatriate]]', 'Home or third-country employee on a short-term assignment']
      - ['[[expatriate|Expatriate]]', 'Employee relocated to the host country, typically for two to five years']
    hints:
      - Flex means flexible and short.
    explanation: These three types appear in the lecture's list of international staffing.

  - id: failure-multi
    type: multi
    skills: [expatriates]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: expats }
    prompt: Which statements about expatriate assignments match the lecture?
    options:
      - Costs are substantial and failure rates are high
      - About one-quarter leave the company during the assignment
      - Up to 90 percent of failures are family related
      - Most companies require cross-cultural training for the family
    answer: [0, 1, 2]
    hints:
      - Only about one in five companies require training.
    explanation: Family concerns drive most failures, yet few companies require cross-cultural training.

  - id: shock-mcq
    type: mcq
    skills: [expatriates]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: expats }
    prompt: An expatriate returns home after four years and feels lost in the home office. What is this?
    options:
      - Reverse culture shock
      - Social loafing
      - Brain drain
      - Culture bias
    answer: 0
    hints:
      - It is the shock on the way back.
    explanation: Reverse culture shock can strike when an expat returns home, so repatriation needs planning.

  - id: family-mcq
    type: mcq
    skills: [expat-family]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: expats }
    prompt: Why are two-career families a challenge for expatriate assignments?
    options:
      - In many countries the spouse has no legal right to work, so the trailing spouse faces big adjustments
      - Spouses are always paid by the company
      - Children never move
      - Language training is always free
    answer: 0
    hints:
      - Think about the spouse's job.
    explanation: Trailing spouses may face changes in lifestyle, the balance of power in the family and self-image.

  - id: repat-order
    type: order
    skills: [expat-family]
    difficulty: 3
    tags: [application]
    lessonRef: { tab: intuition, id: expats }
    prompt: Put these repatriation steps in a sensible order.
    items:
      - Discuss long-range career goals before the assignment
      - Visit the home office regularly during the assignment
      - Plan the return well before the assignment ends
      - Use the expatriate's new knowledge after the return
    hints:
      - Planning begins before the assignment itself.
    explanation: The lecture says planning for return should start before the assignment, with regular visits to stay in the loop and a plan to harness new knowledge.

  - id: tck-mcq
    type: mcq
    skills: [expat-family]
    difficulty: 3
    tags: [term]
    lessonRef: { tab: intuition, id: expats }
    prompt: Which statement about expatriate children matches the lecture?
    options:
      - They are often overlooked in planning and can gain culturally but also feel insecure
      - They never need support
      - They always adapt faster than adults
      - About three-quarters of expats have dependent children
    answer: 0
    hints:
      - The share of expats with children abroad is about one quarter.
    explanation: Children sometimes called third-culture kids can benefit or can feel frustrated and powerless.

  # ------------------------------------------------------------------ compensation
  - id: pay-parts-match
    type: match
    skills: [compensation]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: pay }
    prompt: Match each pay element to its purpose.
    pairs:
      - ['Base salary', 'Set equal to a domestic counterpart']
      - ['[[allowances|Allowances]]', 'Cover higher costs of living abroad']
      - ['[[bonuses|Bonuses]]', 'Pay for hardship, inconvenience or danger']
      - ['[[perks|Perks]]', 'Extras such as a car or company housing']
    hints:
      - Allowances cover costs; bonuses reward hardship.
    explanation: The balance sheet approach builds a package from a base salary plus extras.

  - id: balance-mcq
    type: mcq
    skills: [compensation]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: pay }
    prompt: What is the balance sheet approach?
    options:
      - A traditional method with a base salary equal to a domestic counterpart, plus allowances and bonuses
      - A lump sum with no detail
      - Paying everyone the host-country local rate
      - Paying only in stock
    answer: 0
    hints:
      - It starts with a salary like the home job.
    explanation: It can be complex and costly to administer, so some firms use a hybrid or lump-sum approach.

  - id: package-multi
    type: multi
    skills: [compensation]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: pay }
    prompt: Which allowances does the lecture list?
    options:
      - Housing
      - Cost of living
      - Tax differentials
      - Education
      - Moving and orientation
      - Entertainment
    answer: [0, 1, 2, 3, 4]
    hints:
      - Five of the six are on the list.
    explanation: Allowances cover the higher expenses of living abroad.

  - id: high-tax-mcq
    type: mcq
    skills: [compensation]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: pay }
    prompt: In a country with high personal income tax, how are expatriate executives often paid?
    options:
      - Lower salaries and expensive perquisites such as premium housing and elite education
      - Higher salaries and no perks
      - Only stock
      - No pay at all
    answer: 0
    hints:
      - Perks are often taxed differently.
    explanation: High tax rates shape the mix of salary and perquisites.

  - id: currency-mcq
    type: mcq
    skills: [compensation]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: pay }
    prompt: In practice, how much of an expatriate's base salary is typically paid in host-country currency?
    options:
      - About 65 to 75 percent
      - About 5 to 10 percent
      - All of it
      - None of it
    answer: 0
    hints:
      - Most, but not all.
    explanation: Companies also must choose an exchange rate and consider inflation.
