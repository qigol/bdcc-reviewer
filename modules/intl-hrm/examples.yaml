examples:
  - id: term-labor-market
    source: "INTB 3355 Module 14, Managing Human Resources in an International Context (Session 24): glossary term Labor
      market"
    fn: termLookup
    in:
      term: labor-market
    expect:
      name: Labor market
      meaning: The pool of available people with the needed skills who live within commuting distance of an employer.
  - id: term-ethnocentric
    source: "INTB 3355 Module 14, Managing Human Resources in an International Context (Session 24): glossary term
      Ethnocentric approach"
    fn: termLookup
    in:
      term: ethnocentric
    expect:
      name: Ethnocentric approach
      meaning: Hiring and promoting people according to the parent company's home-country culture and viewpoint.
  - id: term-parent-country-national
    source: "INTB 3355 Module 14, Managing Human Resources in an International Context (Session 24): glossary term
      Parent-country national"
    fn: termLookup
    in:
      term: parent-country-national
    expect:
      name: Parent-country national
      meaning: An employee who is a citizen of the country where the parent company has its headquarters.
  - id: term-inpatriate
    source: "INTB 3355 Module 14, Managing Human Resources in an International Context (Session 24): glossary term Inpatriate"
    fn: termLookup
    in:
      term: inpatriate
    expect:
      name: Inpatriate
      meaning: An employee hired in the host country, often brought to the parent company for a time.
  - id: term-trailing-spouse
    source: "INTB 3355 Module 14, Managing Human Resources in an International Context (Session 24): glossary term Trailing
      spouse"
    fn: termLookup
    in:
      term: trailing-spouse
    expect:
      name: Trailing spouse
      meaning: The partner who moves abroad for the other's job, often facing a loss of work and a change of role.
