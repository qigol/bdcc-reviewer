terms:
  - id: labor-market
    term: Labor market
    short: The pool of available people with the needed skills who live within commuting distance of an employer.
    related: [labor-mobility, guest-workers, collective-bargaining]
    skills: [labor-conditions]
  - id: labor-mobility
    term: Labor mobility
    short: The movement of people from country to country or area to area in search of jobs.
    related: [guest-workers]
    skills: [labor-conditions]
  - id: guest-workers
    term: Guest workers
    short: People who go to a foreign country legally for certain jobs on a temporary basis.
    related: [labor-mobility]
    skills: [labor-conditions]
  - id: brain-drain
    term: Brain drain
    short: A country's loss of its most intelligent and best-educated people to other countries.
    related: [reverse-brain-drain]
    skills: [labor-conditions]
  - id: reverse-brain-drain
    term: Reverse brain drain
    short: Highly skilled emigrants returning to their home country after contributing to their adopted one.
    related: [brain-drain]
    skills: [labor-conditions]
  - id: collective-bargaining
    term: Collective bargaining
    short: Talks in which a union speaks for workers to negotiate with management.
    related: [labor-market, labor-mobility]
    skills: [labor-conditions]
  - id: ethnocentric
    term: Ethnocentric approach
    short: Hiring and promoting people according to the parent company's home-country culture and viewpoint.
    related: [polycentric, regiocentric, geocentric]
    skills: [hr-approach]
  - id: polycentric
    term: Polycentric approach
    short: Hiring and promoting people according to the local context where the subsidiary operates.
    related: [ethnocentric, regiocentric, geocentric]
    skills: [hr-approach]
  - id: regiocentric
    term: Regiocentric approach
    short: Hiring and promoting people according to the regional context where the subsidiary operates.
    related: [ethnocentric, polycentric, geocentric]
    skills: [hr-approach]
  - id: geocentric
    term: Geocentric approach
    short: Hiring and promoting people for their ability and experience, whatever their race or citizenship.
    related: [ethnocentric, polycentric, regiocentric]
    skills: [hr-approach]
  - id: parent-country-national
    term: Parent-country national
    aka: [PCN, home-country national]
    short: An employee who is a citizen of the country where the parent company has its headquarters.
    related: [host-country-national, third-country-national]
    skills: [staffing-training]
  - id: host-country-national
    term: Host-country national
    aka: [HCN]
    short: An employee who is a citizen of the country where the subsidiary operates, not the parent's country.
    related: [parent-country-national, third-country-national]
    skills: [staffing-training]
  - id: third-country-national
    term: Third-country national
    aka: [TCN]
    short: An employee who is a citizen of neither the parent company's country nor the host country.
    related: [parent-country-national, host-country-national]
    skills: [staffing-training]
  - id: inpatriate
    term: Inpatriate
    short: An employee hired in the host country, often brought to the parent company for a time.
    related: [expatriate]
    skills: [expatriates]
  - id: flexpatriate
    term: Flexpatriate
    short: A home or third-country employee sent on short-term foreign assignments.
    related: [expatriate]
    skills: [expatriates]
  - id: expatriate
    term: Expatriate
    aka: [expat]
    short: An employee relocated to the host country from the home country or a third country, usually for two to five years.
    related: [inpatriate, flexpatriate]
    skills: [expatriates]
  - id: culture-shock
    term: Culture shock
    short: The anxiety people often feel when they move from a familiar culture to one that is entirely different.
    related: [reverse-culture-shock]
    skills: [expatriates]
  - id: reverse-culture-shock
    term: Reverse culture shock
    short: The shock an expatriate feels on returning home after a long time abroad.
    related: [culture-shock, repatriation]
    skills: [expatriates]
  - id: trailing-spouse
    term: Trailing spouse
    short: The partner who moves abroad for the other's job, often facing a loss of work and a change of role.
    related: [expatriate, third-culture-kids, repatriation]
    skills: [expat-family]
  - id: third-culture-kids
    term: Third-culture kids
    short: Children who grow up abroad and belong fully to neither the home culture nor the host culture.
    related: [trailing-spouse, culture-shock, reverse-culture-shock]
    skills: [expat-family]
  - id: repatriation
    term: Repatriation
    short: The return of an expatriate to the home country at the end of the assignment.
    related: [reverse-culture-shock]
    skills: [expat-family]
  - id: balance-sheet-approach
    term: Balance sheet approach
    short: The traditional pay method that starts from a home-country salary and adds allowances and bonuses.
    related: [allowances, bonuses, international-status]
    skills: [compensation]
  - id: allowances
    term: Allowances
    short: Payments added to an expatriate's base salary to cover higher costs of living abroad, such as housing and schooling.
    related: [bonuses]
    skills: [compensation]
  - id: bonuses
    term: Bonuses
    short: Payments on top of salary and allowances for hardship, inconvenience or danger, such as overseas premiums.
    related: [allowances]
    skills: [compensation]
  - id: international-status
    term: International status
    short: The standing that entitles an expatriate to all allowances and bonuses of the place of residence and work.
    related: [balance-sheet-approach, allowances, bonuses]
    skills: [compensation]
  - id: perks
    term: Perks
    short: Extra benefits for expatriates, such as a car, a company house, insurance and club memberships.
    related: [allowances, bonuses, expatriate]
    skills: [compensation]
