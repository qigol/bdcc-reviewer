intro: |
  Staffing a branch in another country is a series of people decisions. Follow an imaginary Philippine logistics firm
  as it opens a subsidiary abroad, and decide how to staff, prepare and pay its people.
case:
  id: kaban-subsidiary
  title: Kaban Logistics opens a branch abroad
  story: |
    Kaban Logistics, an imaginary firm from Manila, is opening a warehouse subsidiary in a new country called Selvara.
    Its strategy is to fit each country's customers and rules closely. The facts below are invented for practice.
  cells:
    - id: pick-approach
      title: Which staffing approach?
      say: |
        Customers in Selvara use local delivery customs, speak a local dialect and expect different paperwork. Kaban wants to
        respond closely to them rather than copy its Manila routines.
      stage:
        - id: approach-note
          widget: Callout
          props:
            kind: note
            title: Kaban's situation
            body: High pressure to respond to local customs, low pressure to cut costs, and a plan to run Selvara the local way.
      decision:
        prompt: Which staffing approach fits this strategy?
        type: mcq
        options:
          - Polycentric, hiring mostly host-country nationals who know the local customs
          - Ethnocentric, sending Manila citizens into every key post
          - Geocentric, ignoring local knowledge
          - No approach is needed
        answer: 0
        optionFeedback:
          1: An ethnocentric approach suits low pressure for local responsiveness, which is not the case here.
        model: Close local responsiveness points to a polycentric approach, because host-country nationals understand local customs, culture and language.
    - id: classify-step
      title: Who is who?
      say: |
        Kaban now has three key employees in Selvara, and the HR team must record each one's class before planning training.
      stage:
        - id: people-table
          widget: Schedule
          props:
            title: Three employees
            columns: [Citizenship, Hired by, Works in]
            rows:
              - { label: Ana, amounts: [Philippines, Kaban Manila, Selvara] }
              - { label: Dara, amounts: [Selvara, Kaban Selvara, Selvara] }
              - { label: Omar, amounts: [A third country, Kaban Selvara, Selvara] }
      decision:
        prompt: Which list gives the correct classes for Ana, Dara and Omar?
        type: mcq
        options:
          - Ana is a parent-country national, Dara a host-country national, Omar a third-country national
          - Ana is a host-country national, Dara a parent-country national, Omar a third-country national
          - All three are host-country nationals
          - Ana is a third-country national, Dara a host-country national, Omar a parent-country national
        answer: 0
        model: Ana is a citizen of the parent's country, Dara of the host country, and Omar of neither, so he is a third-country national.
    - id: family-step
      title: The trailing spouse
      say: |
        Ana is excited about her three-year assignment, but her husband is a nurse and the law in Selvara does not let
        spouses of foreign workers take jobs. Her two children are in school.
      stage:
        - id: family-note
          widget: Callout
          props:
            kind: warn
            title: From HR's notes
            body: Ana has not decided yet. She says she will decline unless the family can be settled.
      decision:
        prompt: Which action best reduces the biggest risk to this assignment?
        type: mcq
        options:
          - Offer cross-cultural and language training to the whole family, and help with schools and housing
          - Offer a larger bonus only
          - Cancel the assignment
          - Send Ana alone with no support
        answer: 0
        optionFeedback:
          1: Money alone does not solve family adjustment, which causes most failures.
        model: Family problems cause most expatriate failures, so training and practical help for the whole family address the real risk. Only about one in five firms do this, so it can be a strength.
    - id: pay-step
      title: Building Ana's package
      say: |
        Ana's home salary is the base. Selvara has high personal income tax, expensive housing and few international
        schools. The firm wants to keep the package fair and not too costly to run.
      stage:
        - id: pay-tree
          widget: Tree
          props:
            root:
              id: pkg
              label: Ana's package
              children:
                - { id: base, label: Base salary, note: Equal to a domestic counterpart }
                - { id: allow, label: Allowances, note: Housing, cost of living, tax, education, moving }
                - { id: bonus, label: Bonus, note: Hardship or danger }
                - { id: perk, label: Perks, note: Car, insurance, housing }
      decision:
        prompt: Given high tax and costly housing, which adjustment is most consistent with the lecture?
        type: mcq
        options:
          - Pay a lower salary and more perquisites such as premium housing and school help
          - Pay a huge salary with no perks
          - Pay nothing extra
          - Pay only in stock
        answer: 0
        model: In countries with high personal income tax, executives often receive lower salaries and expensive perquisites such as premium housing and elite education for their children.
    - id: return-step
      title: Coming home
      say: |
        Three years later Ana's assignment ends. The Manila office has changed, her old job no longer exists and she feels
        out of the loop.
      stage:
        - id: return-note
          widget: Callout
          props:
            kind: note
            title: What happened
            body: Ana's career goals were never discussed before the assignment, and she visited Manila only once.
      decision:
        prompt: What should Kaban have done differently, and why does it matter?
        type: open
        model: |
          Kaban should have planned the return before the assignment began, discussed Ana's long-range career goals up front,
          arranged regular visits to the home office, and planned to use her new knowledge. Without this she may suffer
          reverse culture shock and leave, which wastes the investment.
atScale:
  title: In practice
  body: |
    Large firms keep global mobility teams that handle visas, tax advice, pay calculations and relocation. They use
    cost-of-living surveys and expatriate healthcare programs, and they run training for the family as well as the
    employee. Many pair expatriates with mentors at headquarters to keep them in the loop.
tradeoffs:
  title: Who to send
  columns: [Option, Benefit, Risk]
  rows:
    - [Parent-country national, Knows headquarters well, Costly and may not know local culture]
    - [Host-country national, Understands local customs and language, May need training and have split loyalty]
    - [Third-country national, 'May cost less and know the company', Cost savings not assured and work permits can be hard]
connections:
  - module: global-leadership
    note: Global leaders and teams are built through the same assignments and training.
  - module: org-design
    note: Staffing approach follows the strategy and structure of the firm.
explainBack:
  prompt: |
    Explain to a friend how a firm chooses between home, local and third-country staff, and why expatriate assignments
    often fail.
  rubric:
    - Links an HR approach to a strategy
    - Distinguishes PCNs, HCNs and TCNs with a strength and a concern for each
    - Mentions the family factor and the pay package
