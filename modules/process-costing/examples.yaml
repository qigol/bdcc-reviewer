examples:
  - id: cavite-flow
    source: 'Session 6, slide 25 (Example 2)'
    fn: physicalFlow
    in: { beg: 0, started: 18000, completed: 8000, end: null }
    expect: { end: 10000, left: 18000, right: 18000, balanced: true }
  - id: cavite-eu
    source: 'Session 6, slide 30 (Example 3)'
    fn: euSimple
    in: { completed: 8000, endUnits: 10000, timing: start, conv: 0.2 }
    expect: { euMat: 18000, euConv: 10000 }
  - id: bottling-eu
    source: 'Session 6, slide 34 (Example 3.5)'
    fn: euSimple
    in: { completed: 12000, endUnits: 3000, timing: end, conv: 0.5 }
    expect: { euMat: 12000, euConv: 13500 }
  - id: cavite-report
    source: 'Session 6, slides 38–40 (Example 4)'
    fn: report
    in: { data: '@cavite', method: wa }
    expect: { eu_mat: 18000, eu_conv: 10000, unit_mat: 1.5, unit_conv: 2.5, combined: 4, completedCost: 32000, end_mat: 15000, end_conv: 5000, endWip: 20000, total: 52000 }
  - id: cavite-walk
    source: 'Session 6, slides 38–40 (Example 4), count-along'
    fn: reportWalk
    in: { data: '@cavite', method: wa }
    expect: { steps: 12, completedCost: 32000, endWip: 20000 }
  - id: depta-eu
    source: 'Session 6, slides 48 and 56 (Examples 5 and 7)'
    fn: euBoth
    in: { data: '@depta' }
    expect: { wa_mat: 6500, wa_conv: 6100, prior_mat: 1500, prior_conv: 1000, fifo_mat: 5000, fifo_conv: 5100 }
  - id: portland-wa
    source: 'Session 6, slides 51–52 (Example 6)'
    fn: report
    in: { data: '@portland', method: wa }
    expect: { eu_mat: 45000, eu_conv: 41500, cost_mat: 53500, cost_conv: 577500, unit_mat: 1.1889, unit_conv: 13.9156, combined: 15.1046, total: 631000 }
    tol: 0.0001
  - id: portland-wa-assign
    source: 'Session 6, slide 52 (Example 6); the slide marks these ≈ because it rounds unit costs to 4 dp'
    fn: report
    in: { data: '@portland', method: wa }
    expect: { completedCost: 604184, end_mat: 5944, end_conv: 20874, endWip: 26818 }
    tol: 2.5
  - id: portland-fifo
    source: 'Session 6, slide 58 (head-to-head)'
    fn: report
    in: { data: '@portland', method: fifo }
    expect: { eu_mat: 44200, eu_conv: 41020, unit_mat: 0.9389, unit_conv: 12.7133, completedCost: 607235, endWip: 23765 }
    tol: 0.6
  - id: portland-fifo-walk
    source: 'Session 6, slide 58, count-along'
    fn: reportWalk
    in: { data: '@portland', method: fifo }
    expect: { steps: 15, total: 631000 }
  - id: portland-compare
    source: 'Session 6, slide 58 (head-to-head)'
    fn: compareMethods
    in: { data: '@portland' }
    expect: { wa.completedCost: 604182.06, fifo.completedCost: 607235.46, diffCompleted: 3053.4 }
    tol: 0.05
  - id: nueva-wa
    source: 'Session 6, slide 64 (Example 8)'
    fn: report
    in: { data: '@nueva', method: wa }
    expect: { eu_mat: 20000, eu_conv: 17000, unit_mat: 9, unit_conv: 9, completedCost: 288000, endWip: 45000, total: 333000 }
  - id: nueva-transfer
    source: 'Session 6, slide 61 (Example 6.5)'
    fn: deptWithEntry
    in: { data: '@nueva', method: wa }
    expect: { completedCost: 288000, toAcct: 'Work-in-Process – Packaging Department' }
  - id: batangas-ti
    source: 'Session 6, slide 66 (Example 9)'
    fn: report
    in: { data: '@batangas', method: wa }
    expect: { eu_ti: 10000, eu_mat: 8000, eu_conv: 9200, unit_ti: 15, unit_mat: 8, unit_conv: 12, combined: 35, completedCost: 280000, endWip: 44400, total: 324400 }
  - id: batangas-walk
    source: 'Session 6, slide 66 (Example 9), count-along'
    fn: reportWalk
    in: { data: '@batangas', method: wa }
    expect: { steps: 14, completedCost: 280000 }
  - id: aklan-fifo-eu
    source: 'Session 6, slide 70 (Example 11)'
    fn: euBoth
    in: { data: '@aklan' }
    expect: { wa_mat: 9000, wa_conv: 9800, prior_mat: 0, prior_conv: 700, fifo_mat: 9000, fifo_conv: 9100 }
  - id: reconcile-gap
    source: 'Session 6, slide 68 (Example 10)'
    fn: reconcileGap
    in: { toAccount: 450000, completed: 380000, endWip: 60000 }
    expect: { accounted: 440000, gap: 10000 }
