terms:
  - id: process-costing
    term: Process costing
    short: A costing system that accumulates costs by department or process and divides by output, so every unit receives the same average cost.
    related: [job-order-costing, cost-of-production-report]
    skills: [pc-basics]
  - id: job-order-costing
    term: Job-order costing
    short: The contrasting system from Session 5 that traces costs to a specific, unique job on a job cost sheet.
    related: [process-costing]
    skills: [pc-basics]
  - id: conversion-cost
    term: Conversion cost
    short: Direct labor plus factory overhead, combined into one category because both are incurred together and evenly in a continuous process.
    formula: '\text{Conversion} = \text{DL} + \text{OH}'
    related: [equivalent-units]
    skills: [pc-basics, equiv-units]
  - id: operation-costing
    term: Operation costing
    aka: [hybrid costing]
    short: A blend of both systems, such as process costing for standard operations and job-order costing for a customized batch.
    related: [process-costing, job-order-costing]
    skills: [pc-basics]
  - id: beginning-wip
    term: Beginning work-in-process
    aka: [beginning WIP, beginning inventory]
    short: Units already partly completed at the start of the period, carrying cost from the prior period.
    related: [ending-wip, physical-flow]
    skills: [physical-flow]
  - id: ending-wip
    term: Ending work-in-process
    aka: [ending WIP, ending inventory]
    short: Units still partly completed at the end of the period; they stay in the department's Work-in-Process account.
    related: [beginning-wip, equivalent-units]
    skills: [physical-flow]
  - id: physical-flow
    term: Physical flow equation
    aka: [physical flow]
    short: The Step 1 identity that beginning units plus units started equals units completed plus ending units; it must balance.
    formula: '\text{Beg. WIP} + \text{Started} = \text{Completed} + \text{End. WIP}'
    related: [beginning-wip, ending-wip]
    skills: [physical-flow]
  - id: equivalent-units
    term: Equivalent units of production
    aka: [equivalent units, EU]
    short: The number of whole units represented by completed plus partly completed work; 100 units 60% done equal 60 equivalent units.
    related: [cost-per-equivalent-unit, conversion-cost]
    skills: [equiv-units]
  - id: cost-of-production-report
    term: Cost-of-production report
    aka: [production report]
    short: Process costing's counterpart of the job cost sheet, one per department per period, covering all five steps.
    related: [reconciliation-check]
    skills: [five-steps]
  - id: cost-per-equivalent-unit
    term: Cost per equivalent unit
    aka: [unit cost]
    short: A cost category's total cost divided by its own equivalent units; the categories add up to the combined unit cost.
    formula: '\text{Unit cost}_c = \frac{\text{Cost}_c}{\text{EU}_c}'
    related: [equivalent-units]
    skills: [five-steps]
  - id: reconciliation-check
    term: Reconciliation check
    short: Step 5's test that the cost of completed units plus ending WIP equals the total costs to account for from Step 3.
    formula: '\text{Completed} + \text{End. WIP} = \text{Costs to account for}'
    related: [cost-of-production-report]
    skills: [five-steps]
  - id: weighted-average-method
    term: Weighted-average method
    short: Blends beginning WIP cost with current-period cost into one average cost per equivalent unit, ignoring when the work was done.
    formula: '\text{EU} = \text{Completed} + \text{End. WIP} \times \%'
    related: [fifo-method]
    skills: [weighted-avg]
  - id: fifo-method
    term: FIFO method
    aka: [first-in first-out]
    short: Keeps beginning WIP cost separate, assumes beginning WIP finishes first, and computes unit costs from current-period costs only.
    formula: '\text{EU}_{\text{FIFO}} = \text{EU}_{\text{WA}} - \text{Beg. WIP} \times \%\text{ done last period}'
    related: [weighted-average-method, started-and-completed]
    skills: [fifo]
  - id: started-and-completed
    term: Units started and completed
    aka: [started and completed]
    short: Units both begun and finished this period; under FIFO they equal units completed minus beginning WIP units.
    formula: '\text{Completed} - \text{Beg. WIP units}'
    related: [fifo-method]
    skills: [fifo]
  - id: transferred-in-cost
    term: Transferred-in cost
    short: The cost units carry from a prior department; the receiving department treats it like materials added at the very start.
    related: [equivalent-units]
    skills: [transferred-in]
