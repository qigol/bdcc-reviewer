skills:
  - id: pc-basics
    label: When and why process costing averages
    description: Continuous, identical output; two cost categories; operation (hybrid) costing.
  - id: physical-flow
    label: The physical flow of units
    description: Beginning WIP + started = completed + ending WIP.
  - id: equiv-units
    label: Equivalent units
    description: Partial work in whole units, separately for materials and conversion; materials at start, evenly or at end.
  - id: five-steps
    label: The five-step cost-of-production report
    description: Units, equivalent units, costs, cost per equivalent unit, assignment and reconciliation.
  - id: weighted-avg
    label: Weighted-average method
    description: Beginning WIP blended with current cost into one unit cost.
  - id: fifo
    label: FIFO method
    description: Beginning WIP finished first and kept separate; current-period unit costs.
  - id: choose-method
    label: Choosing weighted-average or FIFO
    description: Simplicity versus clean current-period cost control.
  - id: transferred-in
    label: Transferred-in costs and department transfers
    description: A third cost category in later departments, and the WIP-to-WIP or WIP-to-FG entries.
