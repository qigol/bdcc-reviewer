  - id: chain-handcalc
    type: hand-calc
    skills: [transferred-in, weighted-avg]
    difficulty: 3
    tags: [math]
    generator: chainQ
    lessonRef: { tab: intuition, id: next-department }
    prompt: |
      Two departments, weighted-average, no beginning WIP in either. **Department 1** adds materials at the start
      ({=d1Mat|money}) and converts evenly ({=d1Conv|money}); it completes {=d1Completed|comma} units and has
      {=d1End|comma} left, {=d1EndConv|pct} converted. Its completed units go to **Department 2**, which adds its own
      materials at the end ({=addMat|money}) and converts evenly ({=addConv|money}); it completes {=completed|comma}
      units and has {=endU|comma} left, {=conv|pct} converted. Department 2 is the last department.
    steps:
      - prompt: Cost transferred out of Department 1 (₱)
        answer: { var: d1CompletedCost, tol: 1 }
        misconceptions:
          - { var: wrongD1Total, feedback: 'Only the completed units leave; Department 1''s ending WIP stays behind.' }
        hint: Department 1's completed units × its combined cost per equivalent unit.
      - prompt: Department 2's transferred-in cost per equivalent unit (₱)
        answer: { var: unitTi, tol: 0.005 }
        hint: Transferred-in cost ÷ units received; every unit is 100% complete for it.
      - prompt: Department 2's equivalent units of conversion
        answer: { var: euConv, tol: 0.5 }
        hint: Completed + ending WIP × its conversion percent.
      - prompt: Department 2's combined cost per equivalent unit (₱)
        answer: { var: combined, tol: 0.005 }
        misconceptions:
          - { var: wrongNoTi, feedback: 'The units bring Department 1''s cost with them: add the transferred-in unit cost.' }
      - prompt: Cost transferred to Finished Goods Inventory (₱)
        answer: { var: completedCost, tol: 1 }
        misconceptions:
          - { var: wrongToFgAll, feedback: 'Only Department 2''s completed units go to Finished Goods; its ending WIP stays.' }
    hints:
      - Finish Department 1's report first; its cost transferred out is Department 2's transferred-in cost.
      - 'Department 2 has three categories: transferred-in, materials and conversion.'
    explanation: |
      Department 1 sends ${=d1Completed|comma} \times {=d1Combined|2f} = {=d1CompletedCost|money}$. Department 2: transferred-in
      {=unitTi|money2}, materials {=unitMat|money2} (materials EU {=euMat|comma}), conversion {=unitConv|money2} (EU
      {=euConv|comma}), combined {=combined|money2}. To Finished Goods: ${=completed|comma} \times {=combined|2f} = {=completedCost|money}$.

