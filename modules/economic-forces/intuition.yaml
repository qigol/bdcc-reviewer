scenes:
  - id: reading-an-economy
    title: Reading an economy
    goal: How can a company tell how big and how rich a country's market is before it enters?
    skills: [economy-size]
    state: { lens: gdp, animFrom: 0, animTo: 2.8 }
    derive:
      - { fn: macroLens, in: { lens: '@lens' }, out: m }
    stage:
      - id: env-note
        widget: Callout
        props:
          kind: note
          title: Forces outside the firm
          body: |
            - **Foreign environment**: uncontrollable domestic forces inside a foreign host country
            - **International environment**: interactions between home-country and foreign-country forces
      - id: anim
        widget: Animation
        region: top
        hidden: true
        props:
          src: [assets/anim/gdp-to-gni-and-shadow.webm, assets/anim/gdp-to-gni-and-shadow.mp4]
          poster: assets/anim/gdp-to-gni-and-shadow.poster.jpg
          alt: |
            An island country with a dashed border: three factories and a foreign-owned plant send gold coins into a column
            labelled GDP. Then coins from the residents' plant on a nearby islet arc in, a coin from the foreign-owned plant
            leaves, and the column becomes GNI, 600 billion dollars. The camera sinks below the island, where three dim cash
            stalls pass coins among themselves, the underground economy that official figures miss.
          start: '@animFrom'
          end: '@animTo'
          loop: false
          stills: [1.3, 2.7, 4.0, 4.95]
      - id: size-sched
        widget: Schedule
        hidden: true
        props:
          title: Why total income alone can mislead (illustrative comparison)
          columns: [Total GNI ($B), Population (M), GNI per capita ($)]
          decimals: 0
          rows:
            - { label: Country A (large but populous), amounts: [600, 120, 5000], format: number }
            - { label: Country B (same GNI, fewer people), amounts: [600, 40, 15000], format: number }
      - id: lens-choice
        widget: Choice
        region: side
        hidden: true
        props:
          label: Economic lens
          style: dropdown
          options:
            - { value: gdp, label: Gross domestic product (GDP) }
            - { value: gni, label: Gross national income (GNI) }
            - { value: growth, label: Economic growth rate }
            - { value: underground, label: Underground economy }
        bind: { value: lens }
      - id: lens-readout
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Indicator, value: '{=m.name}', tone: accent }
            - { label: What it captures, value: '{=m.captures}' }
            - { label: Blind spot, value: '{=m.blindSpot}' }
            - { label: Market signal, value: '{=m.signal}', tone: good }
    beats:
      - say: |
          A company selling abroad faces forces it cannot control. The **foreign environment** encompasses all the
          uncontrollable forces originating outside the home country that surround and affect the firm. The **international
          environment** is the interaction between domestic environmental forces and foreign environmental forces.
        define: [foreign-environment, international-environment]
      - say: |
          To judge a market, start with its output and income. **Gross domestic product**, or GDP, is the total money value
          of all goods and services produced inside a country in a year. **Gross national income**, or GNI, is the income
          earned by its residents, including income from abroad.
        define: [gdp, gni]
        hide: [env-note]
        show: [anim]
      - say: |
          Sheer size can fool you if a huge population shares that income. **GNI per capita** divides a nation's gross
          national income by its population to show average income per person, a rough indicator of how advanced an economy
          is.
        define: [gni-per-capita]
        show: [size-sched]
        gate:
          type: predict
          question: Two countries have the exact same total GNI, but Country B has a much smaller population. What does GNI per capita reveal?
          options:
            - Country B has higher average income per person and a more affluent consumer base
            - Country A has higher average income per person because it has more workers
            - Both countries belong to the exact same World Bank income group
            - Total GNI already accounts for population differences
          answer: 0
          explain: Dividing the same GNI among fewer residents yields a higher GNI per capita, indicating higher average living standards.
      - say: |
          Two cautions complete the picture. The **economic growth rate** shows how fast output is expanding, signaling
          rising consumer demand. The **underground economy** is unreported cash, barter, and informal trade missed by
          official figures, often driven by high taxes or heavy regulation.
        define: [economic-growth-rate, underground-economy]
        set: { animFrom: 2.8, animTo: 5 }
        hide: [size-sched]
        show: [lens-choice, lens-readout]
        gate:
          type: when
          prompt: Select the underground economy in the menu to see how unreported activity changes the market picture.
          when: "lens == 'underground'"
          hint: Choose Underground economy from the Economic lens dropdown.
      - say: Match the core size indicators before moving on.
        hide: [anim]
        gate:
          type: practice
          template: gdp-gni-match
    takeaway: GNI per capita reveals average affluence, while growth rates and the underground economy capture momentum and hidden demand.

  - id: rich-and-poor
    title: Rich, poor and in between
    goal: How do international institutions and managers classify countries by level of economic development?
    skills: [development-level]
    stage:
      - id: groups-tree
        widget: Tree
        props:
          orientation: down
          root:
            id: wb-root
            label: World Bank Development Taxonomy
            note: Classified by GNI per capita ($)
            tone: accent
            children:
              - id: wb-high
                label: High Income (Developed)
                note: Over $13,845 — advanced infrastructure & institutions
                tone: good
              - id: wb-um
                label: Upper-Middle Income
                note: $4,466 to $13,845 — includes major emerging markets
              - id: wb-lm
                label: Lower-Middle Income
                note: $1,136 to $4,465 — industrializing developing nations
              - id: wb-low
                label: Low Income (Developing)
                note: Below $1,136 — agrarian focus, limited infrastructure
      - id: groups-note
        widget: Callout
        hidden: true
        props:
          kind: note
          title: World Bank GNI per capita cutoffs (dollars)
          body: |
            - **High income (Developed)**: over 13,845
            - **Upper-middle income**: 4,466 to 13,845
            - **Lower-middle income**: 1,136 to 4,465
            - **Low income**: below 1,136
      - id: sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          shuffle: true
          chips:
            - { id: c1, label: 'Norway (95,510 dollars per person)' }
            - { id: c2, label: 'Saudi Arabia (27,590)' }
            - { id: c3, label: 'Malaysia (11,780)' }
            - { id: c4, label: 'Mexico (10,410)' }
            - { id: c5, label: 'India (2,380)' }
            - { id: c6, label: 'Nigeria (2,140)' }
          bins:
            - { id: high, label: High income (over 13,845) }
            - { id: um, label: Upper-middle (4,466 up to 13,845) }
            - { id: lm, label: Lower-middle (1,136 up to 4,465) }
          solution: { c1: high, c2: high, c3: um, c4: um, c5: lm, c6: lm }
    beats:
      - say: |
          The World Bank classifies economies into four income groups using GNI per capita: high income (over 13,845
          dollars), upper-middle income (4,466 to 13,845), lower-middle income (1,136 to 4,465), and low income (below
          1,136).
      - say: |
          High-income industrial nations are called **developed economies**. They feature high living standards, advanced
          technological infrastructure, well-established legal systems, strong education and healthcare, and a very small
          share of national output coming from agriculture.
        define: [developed-economy]
        show: [groups-note]
        gate:
          type: predict
          question: China's Atlas GNI per capita in Table 7.2 is 12,850 dollars. Which World Bank group does it fall into?
          options: [Upper-middle income, High income, Lower-middle income, Low income]
          answer: 0
          explain: 12,850 dollars lies between 4,466 and 13,845, placing it in the upper-middle-income group.
      - say: |
          **Developing economies** have lower incomes, less advanced infrastructure, and lower average living standards.
          They often face dualism—an unequal sharing of income with a small middle class alongside widespread poverty.
        define: [developing-economy]
      - say: |
          In between are **emerging market economies**: countries with low to middle incomes per person that are rapidly
          reforming and moving toward developed status, such as India and China. Sort the six countries into their World
          Bank income groups.
        define: [emerging-market-economy]
        hide: [groups-tree, groups-note]
        show: [sorter]
        gate:
          type: event
          prompt: Place every country into its corresponding World Bank income group.
          target: sorter
          event: solved
          hint: Compare each country's GNI per capita with the 13,845 and 4,466 dollar cutoffs.
      - say: Check which institutional traits distinguish a developed economy.
        hide: [sorter]
        show: [groups-tree, groups-note]
        gate:
          type: practice
          template: developed-multi
      - say: Step back and consider what a single national average leaves out.
        gate:
          type: reflect
          prompt: Why shouldn't a manager rely on GNI per capita alone when judging a market?
          model: |
            GNI per capita is only a national average. It hides how unequally income is distributed, ignores the
            underground economy, and says nothing about local price levels, economic growth, or how much discretionary
            income households actually have left to spend.
    takeaway: Development classifications group countries by GNI per capita and institutional maturity, though averages never tell the whole story.

  - id: same-money-different-baskets
    title: Same money, different baskets
    goal: Why does a dollar of income go much further in some countries than in others?
    skills: [ppp]
    state: { pppCountry: 'United States', animFrom: 0, animTo: 1.8 }
    derive:
      - { fn: pppProfile, in: { country: '@pppCountry' }, out: p }
    stage:
      - id: basket-sched
        widget: Schedule
        hidden: true
        props:
          title: Shopping basket in Thailand vs the United States (slide 14)
          columns: [Thai baht, US dollars]
          decimals: 2
          rows:
            - { label: Soap (bar), amounts: [50, 1.25], format: number }
            - { label: Rice (pound), amounts: [35, 0.55], format: number }
            - { label: Shoes (pair), amounts: [905, 70], format: number }
            - { label: Dress, amounts: [780, 85], format: number }
            - { label: Socks (pair), amounts: [95, 3.25], format: number }
            - { label: Total basket cost, amounts: [1865, 160.05], style: total, format: number }
      - id: gnicap-sched
        widget: Schedule
        hidden: true
        props:
          title: GNI per capita at Atlas exchange rates vs PPP (Table 7.2, US dollars)
          columns: [Atlas method ($), Purchasing power parity ($)]
          decimals: 0
          rows:
            - { label: Norway, amounts: [95510, 118440], format: number }
            - { label: United States, amounts: [76370, 77530], format: number }
            - { label: Turkey, amounts: [10590, 36920], format: number }
            - { label: Malaysia, amounts: [11780, 32250], format: number }
            - { label: China, amounts: [12850, 21250], format: number }
            - { label: India, amounts: [2380, 8210], format: number }
      - id: ppp-choice
        widget: Choice
        region: side
        hidden: true
        props:
          label: Country comparison
          style: dropdown
          options:
            - { value: 'United States', label: United States }
            - { value: Norway, label: Norway }
            - { value: Turkey, label: Turkey }
            - { value: India, label: India }
        bind: { value: pppCountry }
      - id: ppp-readout
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Country, value: '{=p.country}', tone: accent }
            - { label: Local price level, value: '{=p.priceLevel}' }
            - { label: PPP vs Atlas comparison, value: '{=p.pppVsAtlas}' }
            - { label: Market takeaway, value: '{=p.marketTakeaway}', tone: good }
      - id: anim
        widget: Animation
        region: top
        props:
          src: [assets/anim/ppp-scale.webm, assets/anim/ppp-scale.mp4]
          poster: assets/anim/ppp-scale.poster.jpg
          alt: |
            A balance scale fills with the same five goods on each side, tagged 1,865 baht and 160.05 dollars, and tips toward the
            dollar. A dial of baht per dollar then spins up as baht beads pour in, until the scale levels at about 11.65.
          start: '@animFrom'
          end: '@animTo'
          loop: false
          stills: [1.2, 1.8, 2.8, 4.3, 5]
    beats:
      - say: |
          To compare national incomes across borders, analysts convert local currencies into dollars using an **exchange
          rate**: the price of one currency in terms of another. Yet market exchange rates reflect currency trading and
          cross-border trade, not domestic shop prices.
        define: [exchange-rate]
      - say: |
          **Purchasing power parity**, or PPP, adjusts the exchange rate so that two currencies buy the exact same basket of
          goods at home. The lecture compares five everyday items—soap, rice, shoes, a dress, and socks—in Thailand and the
          United States.
        define: [purchasing-power-parity]
        gate:
          type: predict
          question: Why do managers adjust GNI per capita for purchasing power parity (PPP) when evaluating a developing market?
          options:
            - Because everyday local goods and services often cost much less than market exchange rates imply
            - Because PPP measures only exported manufactured goods
            - Because market exchange rates never fluctuate from year to year
            - Because PPP removes the need to consider household income distribution
          answer: 0
          explain: Local non-traded goods and services are usually much cheaper in lower-income countries, so a dollar of income buys more locally.
      - say: |
          Notice how the five items total 1,865 baht in Thailand and 160.05 dollars in the United States. Comparing identical
          baskets reveals what money actually buys on the ground rather than on foreign-exchange trading desks.
        set: { animFrom: 1.8, animTo: 5 }
        show: [basket-sched]
      - say: |
          **Inflation** is a sustained rise in prices that erodes purchasing power. To reduce short-term currency swings,
          the World Bank uses the **Atlas conversion factor**, averaging exchange rates over three years and adjusting for
          inflation differences.
        define: [inflation, atlas-conversion-factor]
        hide: [basket-sched, anim]
        show: [gnicap-sched, ppp-choice, ppp-readout]
        gate:
          type: when
          prompt: Select Turkey in the menu to inspect how low domestic prices make PPP income far exceed Atlas income.
          when: "pppCountry == 'Turkey'"
          hint: Choose Turkey from the Country comparison dropdown.
      - say: Test your intuition on why Atlas and PPP figures diverge.
        gate:
          type: practice
          template: ppp-mcq
    takeaway: PPP adjusts for local price levels, showing that households in low-price countries can buy more than nominal exchange rates suggest.

  - id: inequality-and-spending
    title: Who can afford what
    goal: Beyond national averages, how can a firm tell how much money households have left to spend on choice items?
    skills: [inequality-spending]
    state: { tier: gross, animFrom: 0, animTo: 1.2 }
    derive:
      - { fn: incomeTier, in: { tier: '@tier' }, out: t }
    stage:
      - id: gini-note
        widget: Callout
        props:
          kind: note
          title: Income distribution and the Gini index
          body: |
            A country's average income can hide wide inequality. A **lower Gini index** means income is shared more evenly; a **higher Gini index** means income is concentrated in fewer hands.
      - id: spending-sched
        widget: Schedule
        hidden: true
        props:
          title: From gross earnings to choice spending (illustrative household, US dollars)
          columns: [Amount ($), Share of gross (%)]
          decimals: 0
          rows:
            - { label: Gross household income, amounts: [30000, 100], format: number }
            - { label: Less personal taxes, amounts: [-4000, -13], format: number }
            - { label: Disposable income (after tax), amounts: [26000, 87], style: subtotal, format: number }
            - { label: Less essential purchases (food, housing, utilities), amounts: [-12000, -40], format: number }
            - { label: Discretionary income (available for choices), amounts: [14000, 47], style: total, format: number }
      - id: tier-choice
        widget: Choice
        region: side
        hidden: true
        props:
          label: Household income layer
          style: dropdown
          options:
            - { value: gross, label: Gross household income }
            - { value: disposable, label: Disposable income }
            - { value: discretionary, label: Discretionary income }
        bind: { value: tier }
      - id: tier-readout
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Measure, value: '{=t.name}', tone: accent }
            - { label: What is deducted, value: '{=t.deducted}' }
            - { label: Best used to judge, value: '{=t.bestFor}', tone: good }
      - id: anim
        widget: Animation
        region: top
        props:
          src: [assets/anim/gini-and-spending.webm, assets/anim/gini-and-spending.mp4]
          poster: assets/anim/gini-and-spending.poster.jpg
          alt: |
            Two countries each get ten coins: one shares them two per person, the other gives six to one person and one to each
            of the rest. A square chart draws a teal equal-shares diagonal and a coral curve bowing beneath it, the gap shaded:
            a bigger gap means a higher Gini index. Then one household stands by a gold bar, gross income 30,000 dollars, with a
            violet 4,000-dollar tax slice on top. The tax slice lifts away (disposable 26,000), the 12,000 of essentials turns
            coral and slides off, and what is left turns teal: discretionary income, 14,000 dollars.
          start: '@animFrom'
          end: '@animTo'
          loop: false
          stills: [1.1, 2.1, 3.0, 3.6, 4.9]
    beats:
      - say: |
          Two countries can have the exact same average income yet offer very different consumer markets. **Income
          distribution** describes how a nation's total income is shared out among its population segments.
        define: [income-distribution]
      - say: |
          The **Gini index** measures how equally family income is distributed across a country. A lower value means more
          equal sharing, while a higher Gini index signals that income is concentrated in a small elite.
        define: [gini-index]
        set: { animFrom: 1.2, animTo: 2.2 }
        gate:
          type: predict
          question: If two countries share the same GNI per capita but Country A has a much higher Gini index, what should a mid-market retailer expect in Country A?
          options:
            - A smaller middle class, with purchasing power concentrated among a wealthy minority
            - Every household having almost identical buying power
            - Lower spending on luxury goods by top earners
            - Zero income taxes across all households
          answer: 0
          explain: A higher Gini index indicates greater inequality, meaning fewer middle-income households relative to the national average.
      - say: |
          For individual households, marketers track what remains to spend. **Disposable income** is personal income left
          after paying taxes, which must first cover food, shelter, and other necessities.
        define: [disposable-income]
        set: { animFrom: 2.2, animTo: 3.1 }
        hide: [gini-note]
        show: [spending-sched]
      - say: |
          Subtracting essential purchases from disposable income leaves **discretionary income**: the money available to
          spend on choice items such as travel, electronics, or fashion. Explore the three income layers in the menu.
        define: [discretionary-income]
        set: { animFrom: 3.1, animTo: 5 }
        show: [tier-choice, tier-readout]
        gate:
          type: when
          prompt: Select Discretionary income in the menu to see why sellers of non-essential goods focus on this layer.
          when: "tier == 'discretionary'"
          hint: Choose Discretionary income from the Household income layer dropdown.
      - say: Match the distribution and spending concepts to their definitions.
        hide: [anim]
        gate:
          type: practice
          template: spending-match
    takeaway: Income distribution shows how evenly earnings are shared, while discretionary income reveals what remains after taxes and essentials.

  - id: labor-and-debt
    title: What labor costs and what countries owe
    goal: How does a company compare factory labor costs across countries and evaluate macroeconomic debt risks?
    skills: [labor-costs, external-debt]
    state: { debtRisk: baseline }
    derive:
      - { fn: debtSignal, in: { risk: '@debtRisk' }, out: d }
    stage:
      - id: ulc-note
        widget: Callout
        props:
          kind: note
          title: Why hourly wages do not equal unit labor cost
          body: |
            - **Unit labor cost**: total direct labor cost divided by units produced
            - Shifts in unit labor cost depend on **hourly compensation**, **worker productivity**, and **exchange rates**
      - id: risk-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          shuffle: true
          chips:
            - { id: s1, label: 'Output per worker rises faster than hourly wages' }
            - { id: s2, label: 'Wages jump while factory output per worker stagnates' }
            - { id: s3, label: 'Government restricts imports to conserve foreign exchange for foreign lenders' }
            - { id: s4, label: 'Export earnings are diverted to service heavy foreign debt' }
          bins:
            - { id: lower-ulc, label: Lower unit labor cost }
            - { id: higher-ulc, label: Higher unit labor cost }
            - { id: debt-strain, label: External debt strain }
          solution: { s1: lower-ulc, s2: higher-ulc, s3: debt-strain, s4: debt-strain }
      - id: debt-chart
        widget: Chart
        hidden: true
        props:
          kind: bar
          title: External debt in 2022 (billions of US dollars, Table 7.7)
          xLabel: Country
          yLabel: 2022 debt ($B)
          series:
            - { name: 2022 debt, x: [China, India, Mexico, Brazil, Turkey, Indonesia, Argentina], y: [2389, 617, 600, 579, 459, 396, 248] }
      - id: debt-sched
        widget: Schedule
        hidden: true
        props:
          title: External stock of debt in 1980 vs 2022 (Table 7.7, billions of US dollars)
          columns: [1980 debt ($B), 2022 debt ($B)]
          decimals: 0
          rows:
            - { label: China, amounts: [5, 2389], format: number }
            - { label: India, amounts: [21, 617], format: number }
            - { label: Mexico, amounts: [58, 600], format: number }
            - { label: Brazil, amounts: [72, 579], format: number }
            - { label: Turkey, amounts: [19, 459], format: number }
            - { label: Indonesia, amounts: [21, 396], format: number }
            - { label: Argentina, amounts: [27, 248], format: number }
      - id: debt-choice
        widget: Choice
        region: side
        hidden: true
        props:
          label: Debt pressure channel
          style: dropdown
          options:
            - { value: baseline, label: Manageable debt baseline }
            - { value: imports, label: Foreign currency rationing & import controls }
            - { value: growth, label: Diverted export earnings & slower growth }
        bind: { value: debtRisk }
      - id: debt-readout
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Channel, value: '{=d.focus}', tone: accent }
            - { label: Foreign exchange effect, value: '{=d.currencyEffect}' }
            - { label: Impact on foreign firms, value: '{=d.firmRisk}', tone: good }
    beats:
      - say: |
          Hourly pay is only half the production story. **Unit labor cost** is total direct labor cost divided by the number
          of units produced. Countries with slower-rising unit labor costs attract investment and often become new global
          competitors.
        define: [unit-labor-cost]
        gate:
          type: predict
          question: Why can a country with high hourly wages still achieve a lower unit labor cost than a low-wage country?
          options:
            - Higher worker productivity spreads the wage bill across many more finished units
            - High wages automatically lower the country's exchange rate
            - Unit labor cost ignores direct factory wages
            - Low-wage countries never export manufactured goods
          answer: 0
          explain: Because unit labor cost divides labor cost by output, high output per worker can offset higher hourly pay.
      - say: |
          Countries also borrow across borders. **External debt** is the money a nation owes to foreign commercial banks,
          governments, and international institutions. Sort the labor and debt scenarios by their macroeconomic effect.
        define: [external-debt]
        hide: [ulc-note]
        show: [risk-sorter]
        gate:
          type: event
          prompt: Sort each scenario into lower unit labor cost, higher unit labor cost, or external debt strain.
          target: risk-sorter
          event: solved
          hint: Productivity gains lower unit cost, wage hikes without output gains raise it, and foreign debt drains hard currency.
      - say: |
          Table 7.7 tracks major developing-country debtors from 1980 to 2022. Rapidly rising external debt is not perilous
          by itself if the economy and export earnings grow just as fast, but heavy debt service can choke off foreign
          exchange.
        hide: [risk-sorter]
        show: [debt-chart, debt-sched]
      - say: |
          When debt service absorbs scarce foreign currency, host governments may ration hard currency or restrict imports,
          leaving local factories unable to buy imported parts or raw materials.
        hide: [debt-sched]
        show: [debt-choice, debt-readout]
        gate:
          type: when
          prompt: Select Foreign currency rationing & import controls in the menu to see how host-country debt hurts foreign plants.
          when: "debtRisk == 'imports'"
          hint: Choose Foreign currency rationing & import controls from the dropdown.
      - say: Check your understanding of how external debt affects international firms.
        gate:
          type: practice
          template: debt-mcq
    takeaway: Unit labor cost weighs wages against productivity, while heavy external debt can trigger foreign exchange shortages and import controls.

  - id: people-as-a-market
    title: People as a market
    goal: How do population density, age profiles, and urbanization shape consumer markets and labor supply?
    skills: [population]
    state: { demoTrend: aging, animFrom: 0, animTo: 2 }
    derive:
      - { fn: demographicLens, in: { trend: '@demoTrend' }, out: dm }
    stage:
      - id: demo-note
        widget: Callout
        props:
          kind: note
          title: Socioeconomic forces that shape a market
          body: |
            - **Population density**: inhabitants per square kilometer or square mile (shows how concentrated buyers are)
            - **Age distribution**: young bases in developing nations vs aging populations in industrial nations
            - **Rural-to-urban shift**: migration into cities that concentrates consumers and changes lifestyles
      - id: demo-choice
        widget: Choice
        region: side
        hidden: true
        props:
          label: Demographic trend
          style: dropdown
          options:
            - { value: aging, label: Aging industrial population }
            - { value: young, label: Young developing population }
            - { value: urban, label: Rural-to-urban shift }
        bind: { value: demoTrend }
      - id: demo-readout
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Trend, value: '{=dm.pattern}', tone: accent }
            - { label: Where it dominates, value: '{=dm.region}' }
            - { label: Market impact, value: '{=dm.marketImpact}', tone: good }
      - id: anim
        widget: Animation
        region: top
        hidden: true
        props:
          src: [assets/anim/demographic-shifts.webm, assets/anim/demographic-shifts.mp4]
          poster: assets/anim/demographic-shifts.poster.jpg
          alt: |
            Two stacks of age bars build from the bottom: a teal one with a wide young base, labelled developing and young, and
            a violet one widest near the top, labelled industrial and aging. Then little people walk along a glowing road from
            green fields into a city, whose towers rise and light up. The view pulls back to show both: age and place shape
            demand.
          start: '@animFrom'
          end: '@animTo'
          loop: false
          stills: [1.6, 3.2, 4.1, 4.95]
    beats:
      - say: |
          Total population is the most general indicator of potential market size, yet headcount alone says little about
          buying power or reachability. **Population density** measures the number of inhabitants per area unit, showing how
          closely clustered customers are for logistics and retail.
        define: [population-density]
        gate:
          type: predict
          question: Why is a high population density often helpful to a consumer-goods marketer?
          options:
            - Concentrated populations make physical distribution, promotion, and retail coverage less costly
            - High population density guarantees that every citizen earns a high income
            - Sparsely populated deserts always have lower transport costs per customer
            - Population density measures the country's external debt burden
          answer: 0
          explain: Clustered populations are easier and cheaper to reach with logistics, retail stores, and marketing than scattered rural populations.
      - say: |
          Who the people are matters just as much. **Age distribution** shows how a population divides across age groups.
          Developing nations usually have younger populations, whereas many industrial nations face aging populations and
          early retirement that strain pension systems.
        define: [age-distribution]
        show: [anim]
      - say: |
          Where people live also shifts demand. The **rural-to-urban shift** is the movement of a nation's people from the
          countryside into cities, concentrating buyers and creating demand for urban housing, transport, and packaged
          goods.
        define: [rural-to-urban-shift]
        set: { animFrom: 2, animTo: 5 }
        show: [demo-choice, demo-readout]
        gate:
          type: when
          prompt: Select Rural-to-urban shift in the menu to see how city migration changes consumer markets.
          when: "demoTrend == 'urban'"
          hint: Choose Rural-to-urban shift from the Demographic trend dropdown.
      - say: Check which demographic patterns match the lecture.
        hide: [anim]
        gate:
          type: practice
          template: pop-multi
      - say: Reflect on how socioeconomic and economic indicators work together.
        gate:
          type: reflect
          prompt: Why is population size alone a poor sign of a market's strength?
          model: |
            A large population with low incomes has little purchasing power. Market strength depends on whether people have
            discretionary income, how densely they are clustered for distribution, and how age distribution and urbanization
            shape what they want to buy.
    takeaway: Population density, age distribution, and urbanization determine where customers are and what they need, beyond raw population size.
