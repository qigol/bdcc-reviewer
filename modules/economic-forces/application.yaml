intro: |
  Before opening a factory or retail store abroad, a company reads the host country's economy: what local money actually
  buys, how unit labor costs compare once productivity is weighed, who has discretionary income to spend, and whether
  external debt threatens foreign exchange access.
case:
  id: shoe-maker
  title: A Cebu shoe maker looks at Thailand
  story: |
    Cebu Soles makes leather dress shoes and is considering opening a factory and regional sales office in Thailand.
    Before committing capital, the owner evaluates local price levels using the lecture's five-good shopping basket,
    compares factory unit labor costs against the home plant, examines regional purchasing power and household income
    distribution, and checks whether foreign debt could disrupt imported leather supplies.
  cells:
    - id: price-level
      title: What does money buy there?
      say: |
        The owner first compares the lecture's five-good shopping basket in Thailand and the United States. While the
        market exchange rate reflects currency trading, comparing identical baskets reveals how far local incomes stretch
        in domestic shops.
      stage:
        - id: basket-sched
          widget: Schedule
          props:
            title: Shopping basket in Thailand vs the United States (slide 14)
            columns: [Thai baht, US dollars]
            decimals: 2
            rows:
              - { label: Soap (bar), amounts: [50, 1.25], format: number }
              - { label: Rice (pound), amounts: [35, 0.55], format: number }
              - { label: Shoes (pair), amounts: [905, 70], format: number }
              - { label: Dress, amounts: [780, 85], format: number }
              - { label: Socks (pair), amounts: [95, 3.25], format: number }
              - { label: Total basket cost, amounts: [1865, 160.05], style: total, format: number }
      decision:
        prompt: Suppose the market exchange rate requires many more baht per dollar than the PPP basket comparison implies. What does that tell Cebu Soles about Thailand's economy?
        type: mcq
        options:
          - Local goods and services are relatively inexpensive, so a dollar of income buys much more locally than the market exchange rate suggests
          - Local prices in Thailand are much higher than in the United States
          - Both countries have identical domestic price levels for everyday goods
          - Market exchange rates always measure domestic purchasing power perfectly
        answer: 0
        model: When PPP requires fewer local currency units per dollar than the market exchange rate, everyday domestic goods and services are cheaper locally than nominal currency conversions imply.
    - id: labor
      title: How do factory labor costs compare?
      say: |
        Next, the owner compares production costs between Thailand and the home plant. Looking only at hourly wage rates
        can mislead a manufacturer if worker productivity or exchange rates move in the opposite direction.
      stage:
        - id: ulc-note
          widget: Callout
          props:
            kind: note
            title: Evaluating unit labor cost across two plant sites
            body: |
              - **Unit labor cost** combines direct labor compensation with the number of pairs produced
              - Lower hourly wages reduce unit cost only if workers maintain comparable output per hour
              - Trends in unit labor cost depend on **hourly pay**, **productivity**, and **exchange rate shifts**
      decision:
        prompt: Why should Cebu Soles base its factory site decision on unit labor cost rather than hourly wage rates alone?
        type: mcq
        options:
          - Because low hourly wages can be offset if workers produce fewer pairs per hour, raising the labor cost per pair
          - Because unit labor cost ignores how many pairs of shoes the factory produces
          - Because hourly wage rates are always identical across developing and developed economies
          - Because exchange rate swings never affect dollar-denominated labor costs
        answer: 0
        model: Unit labor cost weighs total direct labor cost against actual output. A site is only cost-competitive if pay per worker is low relative to the number of units each worker produces.
    - id: market
      title: Is the regional market worth entering?
      say: |
        The owner also hopes to sell shoes across Southeast Asia. In neighboring Malaysia and other middle-income Asian
        economies (Table 7.2), GNI per capita measured at purchasing power parity is much higher than GNI per capita at
        Atlas exchange rates.
      stage:
        - id: market-sched
          widget: Schedule
          props:
            title: Regional GNI per capita benchmarks (Table 7.2, US dollars)
            columns: [Atlas method ($), Purchasing power parity ($)]
            decimals: 0
            rows:
              - { label: Malaysia, amounts: [11780, 32250], format: number }
              - { label: China, amounts: [12850, 21250], format: number }
              - { label: India, amounts: [2380, 8210], format: number }
      decision:
        prompt: What does the wide gap between Atlas and PPP GNI per capita tell the owner about middle-income Southeast Asian markets, and what caveats remain?
        type: open
        model: |
          Because local prices for everyday necessities are lower, households enjoy much stronger real purchasing power at
          PPP than nominal Atlas figures suggest. However, GNI per capita is still an average, so the owner must also check
          income distribution (the Gini index) and whether households have discretionary income left after taxes and
          essentials.
    - id: household
      title: Who can afford a pair of dress shoes?
      say: |
        Leather dress shoes are a choice purchase, not a survival necessity. To size the customer base, Cebu Soles looks
        beyond national GNI per capita to how household income is taxed, spent on essentials, and distributed across
        families.
      stage:
        - id: house-tree
          widget: Tree
          props:
            orientation: down
            root:
              id: h-gross
              label: Gross Household Income
              note: Total earnings before deductions
              tone: accent
              children:
                - id: h-tax
                  label: Personal Taxes
                  note: Paid to government
                - id: h-disp
                  label: Disposable Income
                  note: Income left after taxes
                  children:
                    - id: h-ess
                      label: Essential Purchases
                      note: Food, housing, utilities
                    - id: h-disc
                      label: Discretionary Income
                      note: Left for choice items like leather dress shoes
                      tone: good
      decision:
        prompt: Which combination of household and distributional indicators points to the strongest broad market for non-essential leather shoes?
        type: mcq
        options:
          - Growing discretionary income paired with a moderate Gini index and an expanding urban middle class
          - High gross income where taxes and essential food and housing costs absorb nearly all earnings
          - A very high Gini index where almost all national income belongs to a tiny elite
          - A large rural population with minimal disposable income
        answer: 0
        model: Sellers of non-essential consumer goods depend on discretionary income—what remains after taxes and essentials—shared across a broad middle class rather than concentrated in a tiny elite.
    - id: risks
      title: What macroeconomic risks could disrupt the plant?
      say: |
        Finally, the owner checks macroeconomic stability. Large external debt, an unreported underground economy, and
        demographic shifts all shape operational risk—especially because the Thai factory must import specialty leather
        tanned abroad.
      stage:
        - id: beyond-note
          widget: Callout
          props:
            kind: beyond
            title: Macroeconomic risk check
            body: |
              - **External debt strain**: heavy foreign debt service can drain hard-currency reserves and trigger import restrictions
              - **Underground economy**: cash-only informal competitors may evade taxes and regulations
              - **Urbanization & demographics**: rural-to-urban migration concentrates both factory labor and retail shoppers
      decision:
        prompt: If a host country accumulates heavy external debt and runs short of foreign exchange, which risk matters most to Cebu Soles' factory?
        type: mcq
        options:
          - Government import restrictions or currency controls that make it difficult to pay for imported leather inputs
          - A sudden drop in the country's rural-to-urban migration
          - An automatic decrease in the Gini index
          - Immediate elimination of all domestic taxes
        answer: 0
        model: Heavily indebted governments often conserve scarce foreign currency to service external debt, restricting imports or access to hard currency needed by factories that buy foreign inputs.
explainBack:
  prompt: |
    Explain to a colleague how purchasing power parity differs from the market exchange rate, why unit labor cost is a
    better guide than hourly wages alone, and why discretionary income matters for consumer goods.
  rubric:
    - Explains that PPP compares what an identical basket of goods actually buys locally
    - Explains that unit labor cost weighs wages against worker productivity and output
    - Distinguishes discretionary income (after taxes and essentials) or notes another indicator such as income distribution or external debt
atScale:
  title: In practice
  body: |
    International analysts pull these indicators from the World Bank, the International Monetary Fund, and national
    statistical offices. Multinationals maintain country-screening dashboards that pair GNI per capita at PPP with growth
    rates, Gini indexes, unit labor cost trends, external debt burdens, and demographic profiles before approving market
    entry.
tradeoffs:
  title: Where to site the factory
  columns: [Option, Strength, Risk]
  rows:
    - [Thailand, 'Competitive unit labor cost, growing regional PPP buying power', 'Exchange rate swings, unfamiliar regulatory environment']
    - [Stay at home, 'Familiar rules, no cross-border currency or import-control risk', 'Higher unit labor cost, slower domestic market growth']
    - [Partner with a local firm, 'Local market knowledge, shared capital and regulatory risk', 'Less operational control over quality and branding']
