templates:
  # ------------------------------------------------------------------ economy-size (5 templates)
  - id: gdp-gni-match
    type: match
    skills: [economy-size]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: reading-an-economy }
    prompt: Match each macroeconomic measure to what it captures.
    pairs:
      - ['[[gdp|Gross domestic product (GDP)]]', 'Value of all goods and services produced inside the country in a year']
      - ['[[gni|Gross national income (GNI)]]', 'Total income earned by a nation''s residents, including income from abroad']
      - ['[[gni-per-capita|GNI per capita]]', 'National income divided by population to show average income per person']
      - ['[[underground-economy|Underground economy]]', 'Unreported or underreported cash, barter, and informal activity missed by official figures']
    hints:
      - Distinguish domestic production inside borders from total resident income and unreported trade.
    explanation: GDP counts production within national borders, GNI counts income earned by residents at home and abroad, GNI per capita adjusts for population size, and the underground economy captures unreported activity.

  - id: env-forces-mcq
    type: mcq
    skills: [economy-size]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: reading-an-economy }
    prompt: How does the international environment differ from the foreign environment?
    options:
      - The foreign environment covers uncontrollable forces inside a host country, while the international environment covers how home and foreign forces interact
      - The foreign environment covers only controllable company policies, while the international environment covers domestic taxes
      - They are identical terms for a company's internal management team
      - The international environment applies only to firms that never export or invest abroad
    answer: 0
    hints:
      - Think about forces inside one foreign country versus interactions across borders.
    explanation: The foreign environment consists of uncontrollable forces originating outside the home country, whereas the international environment captures the interactions between domestic and foreign environmental forces.

  - id: growth-mcq
    type: mcq
    skills: [economy-size]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: reading-an-economy }
    prompt: Why should international managers examine a country's economic growth rate alongside GNI per capita?
    options:
      - GNI per capita is only a static snapshot, whereas sustained positive growth signals expanding consumer demand
      - Economic growth rates eliminate the need to know a country's population or income level
      - GNI per capita measures only the underground economy
      - Economic growth rates never change from year to year
    answer: 0
    hints:
      - A snapshot shows a single moment in time, not the direction of change.
    explanation: GNI and GNI per capita provide a static snapshot of size and average affluence, while rapid, rising economic growth indicates expanding consumer demand and market momentum.

  - id: underground-mcq
    type: mcq
    skills: [economy-size]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: reading-an-economy }
    prompt: When a country has a large underground economy, what does that imply about official GNI per capita figures?
    options:
      - Official statistics understate the true volume of economic activity and consumer purchasing power
      - Official statistics overstate the country's real output by counting cash trades twice
      - The country has no informal or cash-based businesses
      - Every citizen pays the highest possible income tax rate
    answer: 0
    hints:
      - Unreported cash and barter transactions are left out of official GDP and GNI.
    explanation: Because the underground economy consists of unreported or underreported income from cash work, barter, and informal trade, a large shadow sector means real purchasing power is higher than official GNI reports.

  - id: shadow-drivers-multi
    type: multi
    skills: [economy-size]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: reading-an-economy }
    prompt: Which conditions typically cause a country's underground economy to grow larger?
    options:
      - High tax burdens that encourage people to hide income
      - Heavy or oppressive government regulations and red tape
      - Widespread cash, barter, and informal street trade
      - Transparent, low-cost business registration and full tax compliance
    answer: [0, 1, 2]
    hints:
      - Consider why workers and small firms choose not to report their transactions to authorities.
    explanation: High taxes, burdensome government red tape, and cash-or-barter trading push individuals and small businesses into the unreported underground economy.

  # ------------------------------------------------------------------ development-level (4 templates)
  - id: dev-match
    type: match
    skills: [development-level]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: rich-and-poor }
    prompt: Match each development classification to its defining profile.
    pairs:
      - ['[[developed-economy|Developed economy]]', 'High-income industrial nation with advanced infrastructure and strong legal institutions']
      - ['[[developing-economy|Developing economy]]', 'Lower-income nation with less advanced infrastructure and lower average living standards']
      - ['[[emerging-market-economy|Emerging market economy]]', 'Low- to middle-income country rapidly industrializing and moving toward developed status']
    hints:
      - India and China are classic lecture examples of the third category.
    explanation: Developed economies are high-income industrial countries, developing economies have lower incomes and less infrastructure, and emerging markets are transition economies moving toward developed status.

  - id: developed-multi
    type: multi
    skills: [development-level]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: rich-and-poor }
    prompt: Which characteristics are typical of a developed economy?
    options:
      - GNI per capita above the World Bank high-income threshold (13,845 dollars)
      - A very small share of national output coming from agriculture
      - Well-established governmental, financial, and legal systems
      - Widespread malnutrition and high adult illiteracy
      - Heavy reliance on subsistence farming for most employment
    answer: [0, 1, 2]
    hints:
      - The last two options describe challenges found in lower-income developing economies.
    explanation: Developed economies have high per-person incomes, minimal share of output from agriculture, strong legal and political institutions, and high standards of education and healthcare.

  - id: emerging-mcq
    type: mcq
    skills: [development-level]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: rich-and-poor }
    prompt: Why does the lecture highlight countries such as India and China as emerging market economies?
    options:
      - They have low to middle incomes per person today but are rapidly reforming and moving toward developed status
      - They already have the highest GNI per capita in the world
      - Their economies rely entirely on subsistence agriculture with zero manufacturing
      - Their populations and economies are shrinking every decade
    answer: 0
    hints:
      - Think about what "emerging" means on the path from developing to developed.
    explanation: Emerging market economies are low- to middle-income countries experiencing rapid growth, industrialization, and economic reform that move them toward developed status.

  - id: wb-groups-order
    type: order
    skills: [development-level]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: rich-and-poor }
    prompt: Order the four World Bank income groups from highest GNI per capita to lowest.
    items:
      - High income (over 13,845 dollars)
      - Upper-middle income (4,466 to 13,845 dollars)
      - Lower-middle income (1,136 to 4,465 dollars)
      - Low income (below 1,136 dollars)
    hints:
      - Start with the group classified as developed economies and step down to the lowest tier.
    explanation: The World Bank orders countries from high income (over 13,845 dollars) down through upper-middle, lower-middle, and low income (below 1,136 dollars).

  # ------------------------------------------------------------------ ppp (4 templates)
  - id: ppp-mcq
    type: mcq
    skills: [ppp]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: same-money-different-baskets }
    prompt: Why is a developing or emerging country's GNI per capita usually much higher at purchasing power parity (PPP) than at Atlas exchange rates?
    options:
      - Everyday local goods and services cost much less there, so the same income buys a larger basket locally
      - Its currency is always stronger than the US dollar on foreign exchange markets
      - PPP ignores domestic prices and counts only luxury imports
      - The Atlas method subtracts taxes and essential living expenses
    answer: 0
    hints:
      - Think about how much a haircut, a pound of rice, or local rent costs in a low-price country.
    explanation: Purchasing power parity adjusts for domestic price levels. Where local goods and services are inexpensive, each dollar of income buys far more locally than market exchange rates imply.

  - id: ppp-match
    type: match
    skills: [ppp]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: same-money-different-baskets }
    prompt: Match each currency and price concept to its definition.
    pairs:
      - ['[[exchange-rate|Exchange rate]]', 'The price of one nation''s currency stated in terms of another currency']
      - ['[[purchasing-power-parity|Purchasing power parity (PPP)]]', 'An exchange-rate adjustment so that two currencies buy the same basket of goods']
      - ['[[inflation|Inflation]]', 'A sustained rise in the general price level that reduces what each unit of money buys']
      - ['[[atlas-conversion-factor|Atlas conversion factor]]', 'The World Bank''s three-year averaged, inflation-adjusted exchange rate']
    hints:
      - Distinguish the market price of a currency, the basket-based adjustment, rising price levels, and the World Bank smoothing method.
    explanation: Exchange rates convert currencies, PPP equalizes the cost of an identical basket of goods, inflation erodes purchasing power, and the Atlas conversion factor smooths three-year exchange rates for inflation.

  - id: basket-order
    type: order
    skills: [ppp]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: same-money-different-baskets }
    prompt: Put the conceptual steps of a purchasing power parity (PPP) basket comparison in logical order.
    items:
      - Select a representative basket of everyday goods and services consumed in both countries
      - Record the domestic price of each item in the local currency of each country
      - Sum the total cost of the identical basket in each currency
      - Compare the two basket totals to see how much local currency matches the purchasing power of one dollar
    hints:
      - You must define the basket and gather local item prices before comparing total basket costs.
    explanation: PPP starts by defining an identical basket of goods, pricing it in each country's currency, summing each basket, and comparing the totals to establish relative purchasing power.

  - id: atlas-method-mcq
    type: mcq
    skills: [ppp]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: same-money-different-baskets }
    prompt: Why does the World Bank use the Atlas conversion factor instead of a single day's market exchange rate when comparing GNI across countries?
    options:
      - Averaging exchange rates over three years and adjusting for inflation smooths out temporary currency swings
      - A single day's market exchange rate already adjusts for local rice and soap prices
      - The Atlas method measures only the underground economy
      - Market exchange rates are updated only once every ten years
    answer: 0
    hints:
      - Currency markets can swing wildly over short periods.
    explanation: The Atlas conversion factor averages a country's exchange rate over three years and adjusts for domestic versus international inflation so transient currency spikes do not distort income comparisons.

  # ------------------------------------------------------------------ inequality-spending (4 templates)
  - id: gini-mcq
    type: mcq
    skills: [inequality-spending]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: inequality-and-spending }
    prompt: What does the Gini index measure, and what does a higher value indicate?
    options:
      - It measures how equally family income is distributed; a higher value indicates greater inequality
      - It measures how equally family income is distributed; a higher value indicates perfect equality
      - It measures a country's external debt burden relative to exports
      - It measures the share of gross income paid in personal taxes
    answer: 0
    hints:
      - Think of the gap between an equal-shares diagonal and the actual income distribution curve.
    explanation: The Gini index measures the degree of inequality in a country's family income distribution. A higher Gini value means income is more concentrated in fewer hands.

  - id: spending-match
    type: match
    skills: [inequality-spending]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: inequality-and-spending }
    prompt: Match each income and distribution concept to its meaning.
    pairs:
      - ['[[income-distribution|Income distribution]]', 'How a nation''s total income is shared out among its population']
      - ['[[gini-index|Gini index]]', 'Indicator of how equally family income is shared within a country']
      - ['[[disposable-income|Disposable income]]', 'Personal income remaining after taxes are paid']
      - ['[[discretionary-income|Discretionary income]]', 'Income remaining after both taxes and essential purchases such as food and shelter']
    hints:
      - Disposable income is after taxes; discretionary income also removes essentials.
    explanation: Income distribution and the Gini index show how evenly national income is shared, while disposable and discretionary income track what households keep after taxes and necessities.

  - id: income-tiers-order
    type: order
    skills: [inequality-spending]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: inequality-and-spending }
    prompt: Put the steps in order to trace how a household's total earnings narrow down to what it can spend on non-essential choices.
    items:
      - Start with gross household income from wages and other earnings
      - Subtract personal taxes to arrive at disposable income
      - Subtract essential living purchases such as food, housing, and utilities
      - Arrive at discretionary income available for choice and luxury goods
    hints:
      - Taxes are deducted before essential household purchases.
    explanation: Gross income minus taxes yields disposable income, and subtracting essential purchases from disposable income leaves discretionary income.

  - id: discretionary-mcq
    type: mcq
    skills: [inequality-spending]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: inequality-and-spending }
    prompt: Why do companies selling non-essential goods—such as fashion footwear, consumer electronics, or leisure travel—focus on discretionary income rather than disposable income?
    options:
      - Households must first pay for food, housing, and basic utilities out of disposable income before buying choice items
      - Disposable income already deducts all spending on food, housing, and clothing
      - Discretionary income includes money that must be paid to the tax authorities
      - Non-essential goods are purchased only by governments, not households
    answer: 0
    hints:
      - If rent and groceries consume almost all after-tax pay, little is left for optional purchases.
    explanation: Disposable income still has to cover survival necessities like food and shelter. Only discretionary income—what remains after taxes and essentials—can be spent on optional consumer goods.

  # ------------------------------------------------------------------ labor-costs (4 templates)
  - id: ulc-mcq
    type: mcq
    skills: [labor-costs]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: labor-and-debt }
    prompt: If factory wages in a country rise at the exact same pace as output per worker, what happens to the country's unit labor cost?
    options:
      - It stays unchanged because higher productivity offsets the higher wage rate
      - It doubles because both wages and output increased
      - It falls to zero
      - It rises faster than hourly wages
    answer: 0
    hints:
      - Unit labor cost compares total direct labor cost against the number of units produced.
    explanation: Because unit labor cost weighs labor compensation against units produced, equal percentage gains in hourly pay and worker productivity leave the labor cost per unit unchanged.
    variants:
      - prompt: Wages in a country rise 5%, and output per worker rises 15%. What happens to unit labor cost?
        options:
          - It falls
          - It rises 5%
          - It rises 20%
          - It stays the same
        answer: 0
        optionFeedback:
          1: Productivity rose faster than pay.
          2: The two changes partly offset; they don't add.
          3: They'd need to rise by the same share.
        explanation: Output per worker grew faster than wages, so each unit carries less labor cost.
      - prompt: Country A pays half Country B's wages, but its workers produce one-third as much per hour. Which has the lower unit labor cost?
        options:
          - Country B
          - Country A
          - They are equal
          - It can't be compared
        answer: 0
        optionFeedback:
          1: Low wages don't help if productivity is even lower.
          2: Half the pay for a third of the output is more per unit.
          3: Unit labor cost compares wages with output.
        explanation: A's cost per unit is (1/2) ÷ (1/3) = 1.5 times B's.

  - id: ulc-drivers-multi
    type: multi
    skills: [labor-costs]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: labor-and-debt }
    prompt: Which three underlying forces cause a country's unit labor cost (in international terms) to change over time?
    options:
      - Changes in hourly compensation and wage rates
      - Changes in worker productivity (output per worker)
      - Changes in currency exchange rates
      - Changes in the World Bank's cutoff definitions
    answer: [0, 1, 2]
    hints:
      - Think about what workers are paid, how much they produce, and how local costs convert into foreign currency.
    explanation: The lecture notes that shifts in unit labor costs across countries are driven by compensation rates, worker productivity, and exchange rate movements.

  - id: ulc-vs-wage-mcq
    type: mcq
    skills: [labor-costs]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: labor-and-debt }
    prompt: Why can a country with very low hourly wages still be an expensive place to manufacture goods?
    options:
      - Low skill levels or poor equipment can result in low output per worker, driving up the labor cost per unit produced
      - Low hourly wages always guarantee the lowest unit labor cost
      - Unit labor cost measures only executive salaries, not factory wages
      - Countries with low wages prohibit manufacturing exports
    answer: 0
    hints:
      - Consider how many hours it takes to produce each finished item if productivity is low.
    explanation: If workers produce very few units per hour due to limited training or technology, the total labor cost spread per unit (unit labor cost) can be higher than in a high-wage, high-productivity plant.

  - id: ulc-match
    type: match
    skills: [labor-costs]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: labor-and-debt }
    prompt: Match each factory or macroeconomic shift to its effect on a country's unit labor cost.
    pairs:
      - ['Automation and training boost output per worker faster than wages', 'Lowers unit labor cost and improves cost competitiveness']
      - ['Rapid wage inflation with no gain in factory output per worker', 'Raises unit labor cost and erodes cost competitiveness']
      - ['Wages and worker productivity grow at the exact same rate', 'Keeps domestic unit labor cost stable']
    hints:
      - Compare the pace of wage growth with the pace of output growth.
    explanation: Unit labor cost falls when productivity outpaces wages, rises when wage hikes exceed productivity gains, and stays flat when both move together.

  # ------------------------------------------------------------------ external-debt (4 templates)
  - id: debt-mcq
    type: mcq
    skills: [external-debt]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: labor-and-debt }
    prompt: How can a host country's heavy external debt directly harm a foreign company operating a factory or sales subsidiary there?
    options:
      - The government may restrict imports or ration foreign currency to conserve hard currency for debt service
      - Heavy foreign debt guarantees that the host government will eliminate all import tariffs
      - External debt automatically increases household discretionary income
      - Foreign lenders require the host country to subsidize all consumer imports
    answer: 0
    hints:
      - Foreign debt must be repaid in hard foreign currency, which is also needed to buy imports.
    explanation: When a country owes large sums to foreign lenders, servicing that debt drains scarce foreign exchange, often prompting governments to restrict imports or impose currency controls.

  - id: debt-spiral-order
    type: order
    skills: [external-debt]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: labor-and-debt }
    prompt: Place the events in order to show how rising external debt can disrupt a foreign manufacturer that relies on imported components.
    items:
      - The host country borrows heavily from foreign commercial banks, governments, and international institutions
      - Interest and principal payments on external debt absorb a growing share of export earnings
      - Hard-currency reserves run short across the domestic banking system
      - The government restricts imports and rations foreign exchange, blocking the factory from paying foreign suppliers
    hints:
      - Start with foreign borrowing and trace how debt service drains foreign currency before controls are imposed.
    explanation: Heavy external borrowing leads to rising foreign-currency debt service, which depletes hard-currency reserves and pressures governments to restrict imports and access to foreign exchange.

  - id: debt-multi
    type: multi
    skills: [external-debt]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: labor-and-debt }
    prompt: Which macroeconomic risks are associated with a heavy external debt burden in a developing economy?
    options:
      - Scarcity of foreign exchange needed to pay for imported goods and components
      - Government import restrictions aimed at conserving hard currency
      - Slower domestic growth because export earnings are diverted to pay foreign lenders
      - Guaranteed appreciation of the local currency and unlimited import subsidies
    answer: [0, 1, 2]
    hints:
      - Think about what happens when export revenues must go to foreign creditors instead of domestic investment or imports.
    explanation: Large external debt drains foreign exchange, tempts governments to restrict imports, and diverts export revenues away from domestic growth.

  - id: debt-comparison-mcq
    type: mcq
    skills: [external-debt]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: labor-and-debt }
    prompt: In Table 7.7, China's external debt grew dramatically between 1980 and 2022. Why do analysts compare external debt growth against a country's overall economic and export growth?
    options:
      - A large rise in external debt is far more manageable when national income and export earnings expand rapidly alongside it
      - External debt never has to be repaid if a country's population exceeds one billion
      - Raw dollar debt totals are the only indicator needed to judge default risk
      - Growing exports automatically erase all foreign bank loans
    answer: 0
    hints:
      - A bigger economy with strong export revenues has much greater capacity to service its debt.
    explanation: A steep increase in external debt is not necessarily dangerous on its own if the country's GDP, GNI, and export earnings have grown rapidly enough to service those obligations.

  # ------------------------------------------------------------------ population (4 templates)
  - id: pop-mcq
    type: mcq
    skills: [population]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: people-as-a-market }
    prompt: Why is total population size alone a poor indicator of a country's economic strength and market potential?
    options:
      - A large population with very low incomes has little purchasing power for most goods and services
      - Population size never changes over time
      - Countries with small populations never import consumer products
      - Total population already adjusts for taxes, essentials, and local price levels
    answer: 0
    hints:
      - Headcount tells you how many people live there, not how much they can afford to buy.
    explanation: Population size is only a starting point; without sufficient income, purchasing power, and reachable concentration, a large population does not translate into strong effective demand.
    variants:
      - prompt: Country X has 200 million people with low incomes; Country Y has 20 million with high discretionary income. Which is likely the bigger market for luxury watches?
        options:
          - Country Y
          - Country X, because it has more people
          - They are equal
          - Neither buys watches
        answer: 0
        optionFeedback:
          1: Buying power matters more than headcount for luxuries.
          2: Their incomes differ greatly.
          3: Both have watch buyers.
        explanation: Population alone doesn't measure purchasing power.
      - prompt: A baby-food maker compares two countries with equal incomes. Country P has a young, growing population; Country Q is aging. Which is more promising?
        options:
          - Country P
          - Country Q
          - They are identical markets
          - Neither
        answer: 0
        optionFeedback:
          1: An aging population buys less baby food.
          2: Age structure changes demand.
          3: Babies need food everywhere.
        explanation: Age structure shapes what people buy.

  - id: pop-multi
    type: multi
    skills: [population]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: people-as-a-market }
    prompt: Which statements accurately describe demographic forces highlighted in the lecture?
    options:
      - Developing countries generally have younger age distributions than high-income industrial countries
      - Longer life expectancy and early retirement in industrial countries strain social security and pension systems
      - The rural-to-urban shift moves people from the countryside into cities, concentrating consumers
      - High-income industrial nations always have the youngest populations and fastest birthrates
    answer: [0, 1, 2]
    hints:
      - Contrast the age pyramids of developing nations with those of aging industrial nations.
    explanation: Developing nations typically have younger populations, industrial nations face aging populations that strain pensions, and rural-to-urban migration concentrates buyers in cities.

  - id: demo-match
    type: match
    skills: [population]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: people-as-a-market }
    prompt: Match each socioeconomic concept to what it tells a marketer.
    pairs:
      - ['[[population-density|Population density]]', 'Number of inhabitants per area unit, indicating how geographically concentrated customers are']
      - ['[[age-distribution|Age distribution]]', 'Breakdown of a population into young, working-age, and elderly cohorts']
      - ['[[rural-to-urban-shift|Rural-to-urban shift]]', 'Migration of people from the countryside into cities, reshaping demand and distribution']
    hints:
      - Connect spatial crowding, age cohorts, and city migration to their definitions.
    explanation: Population density shows geographic concentration, age distribution reveals the balance between youth, workers, and retirees, and the rural-to-urban shift tracks urbanization.

  - id: aging-market-mcq
    type: mcq
    skills: [population]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: people-as-a-market }
    prompt: What challenge do many high-income industrial economies face as their age distribution shifts toward older cohorts?
    options:
      - Fewer working-age taxpayers support a growing number of retirees, straining public pensions and healthcare
      - Their workforce is expanding too rapidly for factories to employ
      - Demand for healthcare and retirement services disappears
      - Their cities immediately empty out into rural farming villages
    answer: 0
    hints:
      - Think about the ratio of active workers to retired citizens when birthrates fall and longevity rises.
    explanation: In aging industrial nations, early retirement and longer lifespans reduce the ratio of active workers to retirees, straining social security systems while shifting consumer demand toward healthcare and senior services.

  # ------------------------------------------------------------------ from main 1.3.0 (quiz diversity)
  - id: ppp-two-tier
    type: two-tier
    skills: [ppp]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: atlas-vs-ppp }
    prompt: "A firm compares two markets with the same GNI per capita at market exchange rates. In country X, everyday goods are much cheaper than in country Y. Which country's consumers can buy more?"
    options: [Country X, Country Y, 'They buy the same, since their GNI per capita is equal']
    answer: 0
    reasons:
      - At PPP, the same income buys a bigger basket where prices are lower
      - Exchange-rate incomes already adjust for local prices
      - Cheaper goods mean lower-quality goods, so people buy less
    reasonAnswer: 0
    optionFeedback:
      2: Exchange-rate (Atlas) incomes ignore local prices. PPP corrects for them.
    reasonFeedback:
      1: Market-rate figures convert at the exchange rate; they don't account for what money buys locally. That's PPP's job.
      2: Price levels, not quality, are what PPP adjusts for.
    hints: [Which measure accounts for what a dollar buys locally?]
    explanation: Country X's GNI per capita at PPP is higher than its exchange-rate figure, so for consumer-goods sales X is the larger market per person.

  - id: income-cloze
    type: code-fill
    lang: text
    skills: [economy-size, inequality-spending]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: reading-an-economy }
    prompt: Fill in the terms.
    code: |
      A country's total income divided by its population is its GNI per __BLANK_1__. Income left after taxes is __BLANK_2__ income,
      and what remains after essentials such as food and housing is __BLANK_3__ income.
    blanks:
      '1': { accept: [capita, person, head], hint: 'c…' }
      '2': { accept: [disposable], hint: 'd…' }
      '3': { accept: [discretionary], hint: 'd…' }
    hints: [The last two both start with "d".]
    explanation: GNI per capita = GNI ÷ population. Disposable = after taxes; discretionary = after taxes and necessities, the money luxury brands compete for.

  - id: atlas-case
    type: case
    skills: [ppp, economy-size]
    difficulty: 3
    tags: [math, application]
    generator: atlasQ
    lessonRef: { tab: math-code, id: atlas-vs-ppp }
    prompt: |
      **Sizing {=country} as a market.** Its GNI per capita is **{=atlas|comma}** dollars by the Atlas method and **{=ppp|comma}**
      dollars at purchasing power parity.
    parts:
      - type: numeric
        prompt: How many times larger is the PPP figure than the Atlas figure? (two decimals)
        answer: { var: ratio, tol: 0.01 }
        misconceptions:
          - { var: wrongInverse, feedback: 'You divided Atlas by PPP. Divide PPP by Atlas.' }
          - { var: wrongPct, feedback: "That's how much **more** PPP is (ratio − 1). The question asks how many times as large." }
        explanation: '{=ppp|comma} ÷ {=atlas|comma} = {=ratio|2}.'
      - type: numeric
        prompt: The gap between the two figures, in dollars
        answer: { var: gap, tol: 1 }
        explanation: '{=ppp|comma} − {=atlas|comma} = {=gap|comma}.'
      - type: two-tier
        prompt: What does a PPP figure well above the Atlas figure tell a consumer-goods exporter?
        options: ['Local prices are low, so incomes buy more than the exchange rate suggests', 'The currency is overvalued, so imports will be cheap', 'The Atlas figure is wrong and should be ignored']
        answer: 0
        reasons:
          - PPP converts income using what a common basket costs locally
          - PPP measures the size of the whole economy, not prices
          - The Atlas method averages exchange rates to smooth swings, so it counts local prices twice
        reasonAnswer: 0
        reasonFeedback:
          1: Both figures here are per capita. PPP's adjustment is about local price levels.
          2: Atlas smooths exchange-rate swings, but it doesn't adjust for local prices at all.
        explanation: PPP above Atlas means low local prices. Use PPP to judge buying power, and Atlas when the firm must convert earnings home.
    hints:
      - Ratio = PPP ÷ Atlas.
      - PPP corrects for local price levels; Atlas doesn't.
    explanation: PPP is {=ratio|2}× the Atlas figure ({=gap|comma} dollars higher), so local buying power is larger than the exchange rate suggests.

