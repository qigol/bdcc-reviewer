    explanation: GNI per capita = GNI ÷ population. Disposable = after taxes; discretionary = after taxes and necessities, the money luxury brands compete for.

  - id: atlas-case
    type: case
    skills: [ppp, economy-size]
    difficulty: 3
    tags: [math, application]
    generator: atlasQ
    lessonRef: { tab: math-code, id: atlas-vs-ppp }
    prompt: |
      **Sizing {=country} as a market.** Its GNI per capita is **{=atlas|comma}** dollars by the Atlas method and **{=ppp|comma}**
      dollars at purchasing power parity.
    parts:
      - type: numeric
        prompt: How many times larger is the PPP figure than the Atlas figure? (two decimals)
        answer: { var: ratio, tol: 0.01 }
        misconceptions:
          - { var: wrongInverse, feedback: 'You divided Atlas by PPP. Divide PPP by Atlas.' }
          - { var: wrongPct, feedback: "That's how much **more** PPP is (ratio − 1). The question asks how many times as large." }
        explanation: '{=ppp|comma} ÷ {=atlas|comma} = {=ratio|2}.'
      - type: numeric
        prompt: The gap between the two figures, in dollars
        answer: { var: gap, tol: 1 }
        explanation: '{=ppp|comma} − {=atlas|comma} = {=gap|comma}.'
      - type: two-tier
        prompt: What does a PPP figure well above the Atlas figure tell a consumer-goods exporter?
        options: ['Local prices are low, so incomes buy more than the exchange rate suggests', 'The currency is overvalued, so imports will be cheap', 'The Atlas figure is wrong and should be ignored']
        answer: 0
        reasons:
          - PPP converts income using what a common basket costs locally
          - PPP measures the size of the whole economy, not prices
          - The Atlas method averages exchange rates to smooth swings, so it counts local prices twice
        reasonAnswer: 0
        reasonFeedback:
          1: Both figures here are per capita. PPP's adjustment is about local price levels.
          2: Atlas smooths exchange-rate swings, but it doesn't adjust for local prices at all.
        explanation: PPP above Atlas means low local prices. Use PPP to judge buying power, and Atlas when the firm must convert earnings home.
    hints:
      - Ratio = PPP ÷ Atlas.
      - PPP corrects for local price levels; Atlas doesn't.
    explanation: PPP is {=ratio|2}× the Atlas figure ({=gap|comma} dollars higher), so local buying power is larger than the exchange rate suggests.

