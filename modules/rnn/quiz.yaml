  - id: levels-two-tier
    type: two-tier
    skills: [seq-forecast, tanh-memory]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: forecast }
    prompt: On the 48 test months the RNN on CO₂ **levels** had an MAE of 5.12 ppm against 1.08 for the naive forecast. Why?
    options: ['Every test month was above the training range, and its bounded units could not follow', 'It was trained for too few epochs', 'The windows were 12 months long']
    answer: 0
    reasons:
      - tanh units are bounded and it never learned what to do with inputs beyond training
      - A longer training would make it extrapolate
      - Twelve-month windows hide the seasonal pattern
    reasonAnswer: 0
    optionFeedback:
      '1': Its best epoch was chosen on validation; more epochs do not teach it unseen ranges.
      '2': The changes model used the same windows and did well.
    reasonFeedback:
      '1': No amount of training data covered values that high.
      '2': The changes model learned the season from the same windows.
    explanation: Model the change, like ARIMA's differencing; the changes stay in the training range and the MAE drops to 0.26.

  - id: scaling-mcq
    type: mcq
    skills: [seq-forecast]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: forecast }
    prompt: A power co-op in Bohol standardizes monthly demand before training an RNN. Which mean and spread should it use?
    options:
      - Those of the training months only
      - Those of all months, including the test months
      - Those of the test months only
      - The mean of the most recent 12 months
    answer: 0
    optionFeedback:
      '1': That leaks information about the future into training.
      '2': The model must not see the test months at all while it is built.
      '3': Recent months may include validation or test data.
    explanation: Fit any scaling on the training months only, then apply it to validation and test.
    variants:
      - prompt: A hospital forecasts daily patient arrivals with an RNN. How should it pick the training epoch?
        options:
          - Keep the epoch with the lowest loss on a later, chronological validation period
          - Keep the epoch with the lowest test error
          - Keep the last epoch always
          - Keep the epoch with the lowest training loss
        answer: 0
        optionFeedback:
          '1': The test period must be used once, at the very end.
          '2': The last epoch may overfit.
          '3': Training loss keeps falling as it memorizes.
        explanation: A [[checkpoint]] chosen on a chronological validation period keeps the test score honest.
      - prompt: A rice trader wants to know whether an RNN forecast of weekly prices is worth using. What is the first check?
        options:
          - Beat the naive forecast on the same test weeks
          - Reach a training loss below 0.01
          - Use more hidden units than weeks
          - Beat the RNN's own validation score
        answer: 0
        optionFeedback:
          '1': A low training loss can mean memorizing.
          '2': Size says nothing about usefulness.
          '3': Validation was used to build it; the baseline is the yardstick.
        explanation: A model that cannot beat "copy last week" has learned nothing useful.
