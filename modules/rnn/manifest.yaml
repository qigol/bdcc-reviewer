  - id: rnn-cell
    label: The recurrent cell
    description: 'h_t = tanh(W_xh x_t + W_hh h_(t−1) + b_h), shared weights and unfolding.'
  - id: rnn-forward
    label: Forward pass by hand
    description: Hidden states step by step, then one prediction from the last state.
  - id: tanh-memory
    label: tanh and memory length
    description: Why tanh, its saturation, and how w_hh sets how long a spike is remembered.
  - id: rnn-params
    label: Counting parameters
    description: 'm(d + m + 1) for the RNN, plus embedding and output layers; independent of sequence length.'
  - id: bptt
    label: Backpropagation Through Time
