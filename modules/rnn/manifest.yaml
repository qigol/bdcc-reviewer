shortTitle: RNNs
summary: |
  When order carries meaning, a network needs memory. Follow a hidden state step by step, run an RNN forward by hand,
  backpropagate through time, see why long-range memory fades, then use RNNs for movie-review sentiment and a
  CO₂ forecast.
