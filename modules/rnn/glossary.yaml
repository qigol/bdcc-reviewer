terms:
  - id: model
    term: model
    short: A recipe with adjustable numbers that turns the facts we know about a case into a guess about what we want to know.
    related: [training, parameter]
    skills: [seq-order]

  - id: training
    term: training
    aka: [learning, fitting]
    short: Adjusting a model's numbers using examples with known answers, so its guesses get closer to those answers.
    related: [model, epoch, training-set]
    skills: [seq-order, sentiment]

  - id: sequence
    term: sequence
    aka: [sequential data]
    short: Data whose values arrive in an order that carries meaning, such as the words of a review or monthly readings.
    related: [time-step, hidden-state]
    skills: [seq-order]

  - id: time-step
    term: time step
    aka: [t, step, position]
    short: One position in a sequence, such as the third word of a review or one month of a series.
    related: [sequence, unfolding]
    skills: [seq-order]

  - id: bag-of-words
    term: bag of words
    aka: [word counts]
    short: Describing a text only by how often each word appears, ignoring the order of the words.
    related: [sequence]
    skills: [seq-order]

  - id: hidden-state
    term: hidden state
    aka: [h_t, state, memory]
    short: The network's running summary of everything it has read so far, updated at every step.
    formula: 'h_t = \tanh(W_{xh}x_t + W_{hh}h_{t-1} + b_h)'
    long: It is **not** the [[prediction]]; an output layer reads it when one is needed. It starts at $h_0 = 0$.
    related: [recurrent-connection, tanh, prediction]
    skills: [seq-order, rnn-cell]

  - id: many-to-one
    term: many-to-one
    short: A sequence goes in and one output comes out after reading all of it, such as review to sentiment.
    related: [one-to-many, many-to-many]
    skills: [seq-categories]

  - id: one-to-many
    term: one-to-many
    short: One input goes in and a sequence comes out, such as an image to a caption.
    related: [many-to-one, many-to-many]
    skills: [seq-categories]

  - id: many-to-many
    term: many-to-many
    aka: [aligned, delayed, sequence-to-sequence]
    short: A sequence goes in and a sequence comes out, either one output per input step or after reading the whole input.
    long: Aligned, as in tagging each word; delayed, as in translation.
    related: [many-to-one, one-to-many]
    skills: [seq-categories]

  - id: rnn
    term: recurrent network (RNN)
    aka: [RNN, LSTM, GRU]
    short: A network for sequences that feeds its own hidden state back in, so each step remembers what came before.
    related: [hidden-state, recurrent-connection, shared-weights]
    skills: [rnn-cell]

  - id: recurrent-connection
    term: recurrent connection
    aka: [loop, W_hh]
    short: The loop that feeds the previous hidden state back into the hidden layer at the next step.
    related: [hidden-state, rnn]
    skills: [rnn-cell]

  - id: weight
    term: weight
    aka: [w, connection weight]
    short: The number on one connection that says how strongly, and in which direction, an input pushes the unit it feeds.
    related: [bias, parameter]
    skills: [rnn-cell]

  - id: bias
    term: bias
    aka: [b, intercept]
    short: A number added to a unit's sum after the weighted inputs, so the unit can fire earlier or later.
    related: [weight, parameter]
    skills: [rnn-cell]

  - id: parameter
    term: parameter
    aka: [trainable parameter, θ, theta]
    short: A number the model learns during training; in a neural network, every weight and every bias.
    related: [weight, bias, shared-weights]
    skills: [rnn-cell, rnn-params]

  - id: shared-weights
    term: shared weights
    aka: [weight sharing, parameter sharing over time]
    short: The same weight matrices are used at every time step, so one network handles sequences of any length.
    related: [unfolding, parameter, rnn]
    skills: [rnn-cell, rnn-params]

  - id: unfolding
    term: unfolding
    aka: [unrolling, unfold through time]
    short: Drawing one copy of the recurrent cell per time step, all with the same weights, to see the chain of computations.
    related: [shared-weights, bptt, time-step]
    skills: [rnn-cell]

  - id: tanh
    term: tanh
    aka: [hyperbolic tangent]
    short: An S-shaped activation that squashes any number into the range −1 to 1, centred on 0.
    formula: '\tanh(z) = \frac{e^z - e^{-z}}{e^z + e^{-z}}, \quad \tanh''(z) = 1 - \tanh^2(z)'
    related: [saturation, hidden-state, sigmoid]
    skills: [rnn-cell, tanh-memory]

  - id: prediction
    term: prediction
    aka: [output, ŷ, y-hat]
    short: The value the model gives back for a case. We write it ŷ ("y-hat") to tell it apart from the true answer.
    related: [hidden-state, loss]
    skills: [rnn-forward]

  - id: saturation
    term: saturation
    aka: [saturated unit]
    short: When tanh's input is large in size, its curve is flat, so its slope is close to 0 and little signal passes back.
    related: [tanh, vanishing-gradient]
    skills: [tanh-memory]

  - id: loss
    term: loss
    aka: [L, error]
    short: One number that measures how wrong a prediction is; training tries to make it small.
    related: [prediction, backpropagation]
    skills: [bptt]

  - id: backpropagation
    term: backpropagation
    aka: [backprop, backward pass]
    short: The method that sends the error backward through the network, layer by layer, to find how much each weight caused it.
    related: [bptt, loss, gradient-descent]
    skills: [bptt]

  - id: bptt
    term: Backpropagation Through Time (BPTT)
    aka: [BPTT]
    short: Ordinary backpropagation run on the unfolded network, adding up each shared weight's gradient over all time steps.
    formula: '\frac{\partial L}{\partial h_{t-1}} = \frac{\partial L}{\partial h_t}\, w_{hh}(1 - h_t^2)'
    related: [backpropagation, unfolding, shared-weights]
    skills: [bptt]

  - id: gradient-descent
    term: gradient descent
    short: The update that moves every parameter a small step against its loss gradient, the direction that lowers the loss.
    related: [learning-rate, backpropagation]
    skills: [bptt]

  - id: learning-rate
    term: learning rate
    aka: [η, eta, step size]
    short: The small number η ("eta") that sets how big each gradient-descent step is.
    related: [gradient-descent]
    skills: [bptt]

  - id: long-range-dependency
    term: long-range dependency
    short: A link between elements far apart in a sequence, such as a verdict in a review's first sentence and its label.
    related: [vanishing-gradient]
    skills: [vanishing]

  - id: vanishing-gradient
    term: vanishing gradient
    aka: [vanishing gradients]
    short: An error signal that shrinks toward zero as it is multiplied by a factor below 1 at every step back.
    related: [exploding-gradient, saturation, long-range-dependency]
    skills: [vanishing]

  - id: exploding-gradient
    term: exploding gradient
    aka: [exploding gradients]
    short: An error signal that grows huge as it is multiplied by a factor above 1 at every step back, making updates unstable.
    related: [vanishing-gradient, gradient-clipping]
    skills: [vanishing]

  - id: gradient-clipping
    term: gradient clipping
    aka: [clip_grad_norm_]
    short: Rescaling the gradient whenever it is too large, which stops exploding updates but does nothing for vanishing ones.
    related: [exploding-gradient, truncated-bptt]
    skills: [vanishing]

  - id: truncated-bptt
    term: truncated BPTT
    short: Backpropagating through only the last k steps of a long sequence; cheaper, but no signal reaches further back.
    related: [bptt, gradient-clipping]
    skills: [vanishing]

  - id: embedding
    term: embedding
    aka: [word embedding, embedding layer, word vector]
    short: A trainable lookup table with one row of numbers per word; a word's id simply selects its row.
    related: [sequence-padding, parameter]
    skills: [sentiment]

  - id: sequence-padding
    term: sequence padding
    aka: [pad_sequences, pre-padding, truncation]
    short: Adding zeros to short sequences, and cutting long ones, so every sequence in a batch has the same length.
    long: Padding at the **start** keeps the real words right before the final [[hidden-state]] is read.
    related: [embedding]
    skills: [sentiment]

  - id: sigmoid
    term: sigmoid
    aka: [logistic function, σ]
    short: An S-shaped activation that squashes any number into the range 0 to 1, so the output can be read as a probability.
    related: [binary-cross-entropy, tanh]
    skills: [sentiment]

  - id: binary-cross-entropy
    term: binary cross-entropy
    aka: [BCE, log loss, BCEWithLogitsLoss]
    short: The loss for yes/no predictions; it is small when the predicted probability is high for the true class.
    formula: 'L = -[\,y\log p + (1-y)\log(1-p)\,]'
    related: [sigmoid, loss]
    skills: [sentiment]

  - id: training-set
    term: Training set
    aka: [training data, training split]
    short: The part of the data the model learns from.
    related: [validation-set, test-set]
    skills: [sentiment, seq-forecast]

  - id: validation-set
    term: validation set
    aka: [validation data, val]
    short: Data held back from training and checked after every epoch, to watch for overfitting and compare models.
    related: [training-set, test-set, checkpoint]
    skills: [sentiment, seq-forecast]

  - id: test-set
    term: Test set
    aka: [test data, test split]
    short: Data kept aside and never shown during learning, used at the end to check how well the model really does.
    related: [validation-set]
    skills: [sentiment]

  - id: epoch
    term: epoch
    aka: [epochs]
    short: One full pass of training through every example in the training set.
    related: [training, checkpoint]
    skills: [sentiment]

  - id: overfitting
    term: Overfitting
    aka: [overfit, memorize]
    short: When a model memorizes the exact examples it learned from instead of the general pattern, so it does worse on new cases.
    related: [validation-set, checkpoint]
    skills: [sentiment]

  - id: checkpoint
    term: checkpoint
    aka: [best-epoch checkpoint, model checkpoint]
    short: A saved copy of the weights from the epoch with the best validation score, restored after training.
    related: [epoch, validation-set, overfitting]
    skills: [sentiment, seq-forecast]

  - id: sliding-window
    term: sliding window
    aka: [input window, windowing]
    short: Cutting a series into overlapping pieces, each made of the last L values in order plus the value right after them as the target.
    related: [chronological-split, naive-forecast]
    skills: [seq-forecast]

  - id: naive-forecast
    term: Naive forecast
    aka: [naive]
    short: Every future value is set equal to the last value seen. On a chart it is a flat line.
    related: [mae, sliding-window]
    skills: [seq-forecast]

  - id: mae
    term: MAE
    aka: [mean absolute error]
    short: The average size of the forecast misses, ignoring sign, in the series' own units.
    related: [naive-forecast]
    skills: [seq-forecast]

  - id: chronological-split
    term: Chronological split
    aka: [split by date, chronological]
    short: Cutting the data at a date, so the model learns from the past and is tested on the future. Never shuffled.
    related: [sliding-window, feature-standardization]
    skills: [seq-forecast]

  - id: feature-standardization
    term: standardization
    aka: [z-score, scaling]
    short: Rescaling values to z = (y − μ)/σ, using the mean and spread of the training part only.
    formula: 'z = \frac{y - \mu_{\text{train}}}{\sigma_{\text{train}}}'
    related: [chronological-split, differencing]
    skills: [seq-forecast]

  - id: differencing
    term: Differencing
    aka: [difference, differenced, monthly change]
    short: Replacing each value with how much it changed since the step before. You lose one value, and you now forecast changes.
    related: [feature-standardization, naive-forecast]
    skills: [seq-forecast]
