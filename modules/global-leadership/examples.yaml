examples:
  - id: term-global-mind-set
    source: "INTB 3355 Module 11, Global Leadership Issues and Practices (Session 20): glossary term Global mind-set"
    fn: termLookup
    in:
      term: global-mind-set
    expect:
      name: Global mind-set
      meaning: A way of thinking that is open to and aware of different cultures and markets and can bring them together.
  - id: term-multiplicity
    source: "INTB 3355 Module 11, Global Leadership Issues and Practices (Session 20): glossary term Multiplicity"
    fn: termLookup
    in:
      term: multiplicity
    expect:
      name: Multiplicity
      meaning: Many different countries, cultures, rules and customers at once, so the leader faces many different demands.
  - id: term-business-competencies
    source: "INTB 3355 Module 11, Global Leadership Issues and Practices (Session 20): glossary term Business competencies"
    fn: termLookup
    in:
      term: business-competencies
    expect:
      name: Business competencies
      meaning: Skills about the business, such as vision, business savvy, managing communities, organizational savvy and
        leading change.
  - id: term-gled-model
    source: "INTB 3355 Module 11, Global Leadership Issues and Practices (Session 20): glossary term GLED model"
    fn: termLookup
    in:
      term: gled-model
    expect:
      name: GLED model
      meaning: A model of how expertise grows, starting from four antecedents, including individual traits, cultural exposure
        and education.
  - id: term-global-team
    source: "INTB 3355 Module 11, Global Leadership Issues and Practices (Session 20): glossary term Global team"
    fn: termLookup
    in:
      term: global-team
    expect:
      name: Global team
      meaning: A team marked by high diversity, spread over places, and mostly working through technology rather than face to
        face.
