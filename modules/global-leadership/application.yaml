intro: |
  A strong leader at home is not automatically a strong leader abroad. Work through the minicase of Justin Marshall at
  Compcorp, and decide what went wrong, what the company could have done and what Justin could have done.
case:
  id: justin-compcorp
  title: Justin Marshall at Compcorp
  story: |
    Justin Marshall rose through the ranks at Compcorp. When offered the job of vice president of the Asia-Pacific region,
    he felt sure he could turn the failing division around. Soon several key managers resigned and morale problems
    appeared. Justin was reassigned to a domestic unit. Nothing in the case says he studied the region, learned an Asian
    language or was helped by the company to build global skills.
  cells:
    - id: why-failed
      title: What went wrong?
      say: |
        Justin spent his effort on technical analysis and used the approach that had worked for him in the United States.
        His key executives left, which suggests they did not feel able to discuss their concerns with him.
      stage:
        - id: facts-table
          widget: Schedule
          props:
            title: What the case tells us
            columns: [Observation]
            rows:
              - { label: Approach, amounts: ['Technical analysis, same method as in the U.S.'] }
              - { label: Culture, amounts: [No sign he studied it] }
              - { label: Executives, amounts: [Several key managers resigned] }
              - { label: Company support, amounts: [No sign of global leadership development] }
      decision:
        prompt: Which explanation fits the evidence best?
        type: mcq
        options:
          - He lacked a global mind-set and did not factor in culture as he tried to drive change
          - The division was too small to matter
          - The executives were not paid enough
          - Technical analysis is never useful
        answer: 0
        optionFeedback:
          3: Technical analysis can be useful, but it was not enough without culture.
        model: The case points to missing global mind-set and cultural awareness. Justin used the approach that worked at home and communication with his direct reports broke down.
    - id: company-step
      title: What could Compcorp have done?
      say: |
        Compcorp assumed that because Justin could drive change in the United States, he could do it in Asia-Pacific.
        The company could have used a development model to prepare him.
      stage:
        - id: model-tree
          widget: Tree
          props:
            root:
              id: models
              label: Ways to prepare Justin
              children:
                - { id: gled, label: GLED model, note: 'Build expertise from exposure, education and novel projects' }
                - { id: rs, label: Right Stuff model, note: Leader and company work as partners }
                - { id: tools, label: Tools, note: 'Language and culture training, short-term assignments, mentors' }
      decision:
        prompt: Which action would best follow the GLED idea of building expertise through exposure?
        type: mcq
        options:
          - A short-term assignment in the region, with a mentor who has lived there
          - A longer email about the company's goals
          - A pay cut
          - No preparation, since he was successful before
        answer: 0
        model: Short-term assignments and mentoring by experienced expatriates add cultural exposure and project experience, in line with GLED and the idea of experiential learning.
    - id: justin-step
      title: What could Justin have done?
      say: |
        Even if the company did little, Justin could have helped himself before he took the job. He knew his career was at stake.
      stage:
        - id: justin-note
          widget: Callout
          props:
            kind: note
            title: Options open to Justin
            body: 'Study the region''s language and culture, ask for short foreign assignments, meet successful international managers, and work on his global mind-set.'
      decision:
        prompt: What is the first thing Justin should have changed about his approach?
        type: mcq
        options:
          - Recognize that culture matters and build a global mind-set before driving change
          - Hire more analysts
          - Avoid talking to executives
          - Move the division to the U.S.
        answer: 0
        model: A global mind-set, the openness to and awareness of other cultures, comes first. Without it he could not read how his team felt or adjust his change approach.
    - id: change-step
      title: Plan the change
      say: |
        Suppose Justin had a second chance and wanted a change plan with Kotter's steps. The division is failing, but staff
        are anxious and few see the need.
      stage:
        - id: kotter-note
          widget: Callout
          props:
            kind: note
            title: Facts about the division
            body: The division is losing money, staff are anxious and few of them feel any need for change, and Justin has no guiding team yet.
      decision:
        prompt: Which step should Justin take first?
        type: mcq
        options:
          - Increase urgency by helping people see why change is needed
          - Make the change stick through succession planning
          - Celebrate short-term wins
          - Declare the change finished
        answer: 0
        optionFeedback:
          1: Making change stick is the last step.
        model: Kotter begins with increasing urgency. Only then can Justin form a guiding team and share a vision, and he must do it in ways that fit local culture.
    - id: reflect-step
      title: Lessons for a company
      say: Compcorp promoted a good home-market leader. Think about what to change in how it picks and prepares leaders.
      stage:
        - id: lesson-note
          widget: Callout
          props:
            kind: tip
            title: Reminder
            body: Only 7 percent of surveyed firms effectively develop global leadership capability.
      decision:
        prompt: In two or three sentences, what should a company do before sending a high performer to lead abroad?
        type: open
        model: |
          Assess the person's global competencies, give language and culture training, arrange short assignments and a mentor,
          and treat development as a partnership, as the Right Stuff model suggests. Success at home does not guarantee
          success abroad.
atScale:
  title: In practice
  body: |
    Large firms keep talent pools for global assignments and use assessment instruments before promotions. They
    pair leaders with mentors, rotate them through regions, and train whole teams in language and culture. Human resources
    teams check how pay, labor law and culture affect team rewards.
tradeoffs:
  title: Choosing a way to develop leaders
  columns: [Option, Benefit, Risk]
  rows:
    - [Assessment instruments, Show strengths and gaps early, 'Only a snapshot, not a cure']
    - [Short-term assignments, Real exposure at limited cost, May be too short to change habits]
    - [Language and culture training, Builds understanding and trust, Needs time and follow-up]
connections:
  - module: org-design
    note: Leaders work inside the structure and culture of the organization, which affects how much change they can lead.
explainBack:
  prompt: |
    Explain to a friend why a leader who succeeded at home failed abroad, using global mind-set, the four complexities and a
    change model.
  rubric:
    - Defines global mind-set and links it to culture awareness
    - Names at least two of multiplicity, interdependence, ambiguity and dynamism
    - Uses Lewin or Kotter to describe how a change should be led
