scenes:
  - id: mind-set
    title: Thinking beyond one country
    goal: Why do so many firms say they lack the leaders to work across borders, and what do those leaders need first?
    skills: [mind-set]
    stage:
      - id: gap-note
        widget: Callout
        props:
          kind: note
          title: A leadership gap
          body: |
            The biggest limit many multinationals face is **lack of leadership capacity**. Only **7 percent** of surveyed
            international executives said their firms effectively develop global leadership capability.
      - id: lm-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: l1, label: Innovates and challenges the status quo }
            - { id: l2, label: Administers and accepts the status quo }
            - { id: l3, label: Has a long-range view }
            - { id: l4, label: Has a short-term view }
            - { id: l5, label: Inspires people }
            - { id: l6, label: Controls }
          bins:
            - { id: leader, label: Leader }
            - { id: manager, label: Manager }
          solution: { l1: leader, l2: manager, l3: leader, l4: manager, l5: leader, l6: manager }
    beats:
      - say: |
          Many companies say they cannot find enough people able to lead abroad. One way to build the skill is to volunteer
          for an international project, such as a corporate social responsibility program. First, what is the skill?
        show: [gap-note]
      - say: |
          A **global mind-set** is a view that combines openness to and awareness of diversity across cultures and
          markets with the ability to bring them together. Some CEOs call it a prerequisite for global industry dominance.
        define: [global-mind-set]
      - say: |
          It has two key parts. **Intellectual intelligence** is the thinking skill of understanding complex global issues.
          **Global emotional intelligence** is the ability to read and respond to people from other cultures.
        define: [intellectual-intelligence, global-emotional-intelligence]
        gate:
          type: predict
          question: A leader reads a long report on a foreign market but ignores how local staff feel about it. Which part of the mind-set is missing?
          options:
            - Global emotional intelligence
            - Intellectual intelligence
            - Neither, the leader has everything
            - Currency intelligence
          answer: 0
          explain: The report shows thinking skill, but sensing how people from another culture feel is emotional intelligence.
      - say: |
          **Leadership** is the behaviors and processes needed to organize a group of people to reach a common purpose.
          It is not the same as management. Sort the traits the lecture gives to leaders and to managers.
        define: [leadership]
        hide: [gap-note]
        show: [lm-sorter]
        gate:
          type: event
          prompt: Place each trait under leader or manager.
          target: lm-sorter
          event: solved
          hint: Leaders look at the horizon. Managers look at the bottom line.
      - say: Check the definition.
        hide: [lm-sorter]
        gate:
          type: practice
          template: mindset-mcq
      - say: And the two parts.
        gate:
          type: practice
          template: mindset-parts-multi
      - say: One question in your own words.
        gate:
          type: reflect
          prompt: How could a student with no international experience begin building a global mind-set, and why bother?
          model: |
            They can read about other cultures, learn a language, meet international students and join global projects.
            It matters because firms need people who understand different markets and can work with people from them.
    takeaway: A global mind-set joins thinking skill with emotional skill, and global leaders need both.

  - id: complexity
    title: Why leading abroad is harder
    goal: What makes a leader's job more complicated when the team and customers are in many countries?
    skills: [complexity-styles]
    stage:
      - id: dim-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: x1, label: Fifteen countries with fifteen sets of rules }
            - { id: x2, label: A port strike in one country delays factories in three others }
            - { id: x3, label: Nobody can tell why sales in one market suddenly fell }
            - { id: x4, label: Technology and rules change every few months }
          bins:
            - { id: mult, label: Multiplicity }
            - { id: inter, label: Interdependence }
            - { id: amb, label: Ambiguity }
            - { id: dyn, label: Dynamism }
          solution: { x1: mult, x2: inter, x3: amb, x4: dyn }
      - id: style-table
        widget: Schedule
        hidden: true
        props:
          title: Six GLOBE leadership styles
          columns: [A plain reading]
          rows:
            - { label: Performance-oriented, amounts: [Sets high goals and rewards excellence] }
            - { label: Team-oriented, amounts: [Builds loyalty and cooperation in the team] }
            - { label: Participative, amounts: [Involves others in decisions] }
            - { label: Humane, amounts: [Shows care and kindness] }
            - { label: Autonomous, amounts: [Acts on his or her own judgment] }
            - { label: Self-protective, amounts: [Looks after status and safety] }
    beats:
      - say: |
          Leading across borders adds four overlapping layers of difficulty. **Multiplicity** means many countries,
          cultures and demands at once. **Interdependence** means units in different places rely on each other.
        define: [multiplicity, interdependence]
      - say: |
          **Ambiguity** means unclear information and unclear cause and effect. **Dynamism** means fast, constant change.
          Try matching a few situations to the four.
        define: [ambiguity, dynamism]
        show: [dim-sorter]
        gate:
          type: event
          prompt: Place each situation under the dimension of complexity it shows.
          target: dim-sorter
          event: solved
          hint: A strike that spreads is about reliance. Many rule sets is about number.
      - say: |
          Leaders also behave differently. A large study called Project GLOBE found six leadership styles ([[globe-leadership-styles]]). Which style works
          best depends on the culture.
        define: [globe-leadership-styles]
        hide: [dim-sorter]
        gate:
          type: predict
          question: How many leadership styles did Project GLOBE identify?
          options: [Four, Six, Eight, Twelve]
          answer: 1
          explain: Project GLOBE identified six styles. Culture affects how each one is received.
      - say: Here are the six with a plain reading of each.
        show: [style-table]
      - say: Check the dimensions.
        hide: [style-table]
        gate:
          type: practice
          template: dimensions-match
      - say: And what makes global leadership special.
        gate:
          type: practice
          template: complexity-mcq
    takeaway: Global leadership faces four overlapping complexities, and leadership styles vary by culture.

  - id: competencies
    title: What a global leader needs to be good at
    goal: Which skills do researchers say a leader abroad needs?
    skills: [competencies]
    stage:
      - id: comp-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: k1, label: Vision and strategic thinking }
            - { id: k2, label: Business savvy }
            - { id: k3, label: Cross-cultural communication }
            - { id: k4, label: Teaming skills }
            - { id: k5, label: Resilience }
            - { id: k6, label: Inquisitiveness }
          bins:
            - { id: bus, label: Business competencies }
            - { id: ppl, label: People competencies }
            - { id: self, label: Self competencies }
          solution: { k1: bus, k2: bus, k3: ppl, k4: ppl, k5: self, k6: self }
      - id: abilities-note
        widget: Callout
        hidden: true
        props:
          kind: note
          title: Abilities and roles
          body: |
            Five abilities for a global assignment: **see differences, make connections, adjust, integrate and lead change,
            localize**. Mintzberg's eight roles: monitor, spokesperson, liaison, leader, negotiator, innovator, decision
            maker, change agent.
    beats:
      - say: |
          Global leaders need business skill plus cultural understanding, adaptability and the ability to inspire people from
          many nations. Researchers list five abilities for a good global assignment and eight roles for the leader.
        show: [abilities-note]
      - say: |
          The lecture groups skills into three families. **Business competencies** are about the business itself, such as
          vision, business savvy and leading change. **People competencies** are about working with others.
        define: [business-competencies, people-competencies]
        hide: [abilities-note]
      - say: |
          **Self competencies** are personal qualities: resilience, character, inquisitiveness and flexibility. Sort a few skills into their family.
        define: [self-competencies]
        show: [comp-sorter]
        gate:
          type: event
          prompt: Put each competency into business, people or self.
          target: comp-sorter
          event: solved
          hint: Resilience is a quality of the person. Teaming skills involve others.
      - say: |
          The researchers' lists also include the global mind-set itself. Which family do you think it belongs to?
        hide: [comp-sorter]
        gate:
          type: predict
          question: In the competency tables, where does global mind-set appear?
          options:
            - Among the self competencies
            - Among the business competencies
            - Among the people competencies
            - It is not listed
          answer: 0
          explain: Global mind-set, cosmopolitanism and cognitive complexity are listed with the self competencies.
      - say: Check the groups.
        gate:
          type: practice
          template: group-match
      - say: And the abilities.
        gate:
          type: practice
          template: abilities-multi
    takeaway: Global leaders combine business, people and self competencies.

  - id: developing
    title: Growing global leaders
    goal: How do companies choose and grow people who can lead abroad?
    skills: [develop-leaders]
    stage:
      - id: gled-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: g1, label: A leader's personality and drive }
            - { id: g2, label: Growing up in several countries }
            - { id: g3, label: A course in international business }
            - { id: g4, label: A first assignment in a market the leader has never seen }
          bins:
            - { id: ind, label: Individual characteristics }
            - { id: cult, label: Cultural exposure }
            - { id: edu, label: Global education }
            - { id: nov, label: Project novelty }
          solution: { g1: ind, g2: cult, g3: edu, g4: nov }
      - id: assess-note
        widget: Callout
        hidden: true
        props:
          kind: tip
          title: Ways to assess leaders
          body: |
            Instruments include the **Cross-Cultural Adaptability Inventory**, the **Intercultural Development
            Inventory**, the **Global Competencies Inventory** and the **Global Executive Leadership Inventory**.
    beats:
      - say: |
          Firms first measure. Several instruments test global leadership competencies. After that they develop people. The
          best known approaches are two models, one about how expertise grows and one about partnership.
        show: [assess-note]
      - say: |
          The **GLED model** emphasizes how expertise is built. It begins with four antecedents: individual characteristics,
          cultural exposure, global education and project novelty. Sort a few examples into them.
        define: [gled-model]
        hide: [assess-note]
        show: [gled-sorter]
        gate:
          type: event
          prompt: Match each example to the GLED antecedent it shows.
          target: gled-sorter
          event: solved
          hint: A brand-new market is a novel project. A course is education.
      - say: Try predicting this one.
        gate:
          type: predict
          question: Some experts say the skills a global leader needs depend on the company. Which kind of model would they favor?
          options:
            - One built as a partnership between the leader and the organization
            - One that treats every leader identically
            - One based only on personality
            - One that avoids experience
          answer: 0
          explain: That describes the Right Stuff model, which ties development to the partnership between leader and organization.
      - say: |
          The **Right Stuff model** focuses on what leaders have learned and can do. It says the result comes from an
          interaction and partnership between the leader and the organization, and that the right stuff varies by company.
        define: [right-stuff-model]
        hide: [gled-sorter]
      - say: |
          Classes help: business basics, history, geography, political science, language and culture. But the goal is to
          grow leaders through **transformational experiences**, real experiences that change how a person sees the world.
        define: [transformational-experience]
      - say: Check the two models.
        gate:
          type: practice
          template: models-mcq
      - say: And the four antecedents.
        gate:
          type: practice
          template: gled-multi
    takeaway: Companies assess and then develop leaders, using the GLED and Right Stuff models and real experience.

  - id: teams
    title: Leading a team that is never in one place
    goal: How does a leader get people from many cultures to work as one team?
    skills: [global-teams]
    stage:
      - id: mbi-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: t1, label: Members talk about how they are alike and different }
            - { id: t2, label: The team agrees how it will work together }
            - { id: t3, label: Differences are managed so expectations and skills fit }
          bins:
            - { id: map, label: Map }
            - { id: bridge, label: Bridge }
            - { id: integ, label: Integrate }
          solution: { t1: map, t2: bridge, t3: integ }
      - id: reward-note
        widget: Callout
        hidden: true
        props:
          kind: note
          title: Balancing team and individual rewards
          body: |
            Consider the **nature of the task**, the **stability of team membership**, the **national cultures** of the members,
            **labor laws** about pay, and the **reward options** available.
    beats:
      - say: |
          A **global team** has high diversity, is spread across places and works mostly through technology rather than
          face to face. The leader must establish the team, coach its members and set the team's norms.
        define: [global-team]
      - say: |
          **Team norms** are shared standards a team uses to judge whether behavior is appropriate. Cultures differ in how
          they define roles, communicate and settle conflict, so norms must be set on purpose.
        define: [team-norms]
      - say: |
          The **map-bridge-integrate model** helps. Mapping lets members discuss differences. Bridging sets how they will work
          together. Integrating manages the differences to understand expectations, backgrounds and skills.
        define: [map-bridge-integrate]
        show: [mbi-sorter]
        gate:
          type: event
          prompt: Match each team action to its step.
          target: mbi-sorter
          event: solved
          hint: Talking comes first, an agreement second, and ongoing management third.
      - say: Make a prediction, then we will look at it.
        gate:
          type: predict
          question: What is the risk if rewards depend only on how the whole team performs?
          options:
            - Some members may put in less effort
            - Everyone works harder
            - Cultures become identical
            - No rewards are needed
          answer: 0
          explain: When effort is hidden in the group, some people ease off, which is social loafing.
      - say: |
          Pay is hard in teams. **Social loafing** is the tendency of some people to put in less effort in a group. Rewards
          based on both the team and the person can help, but several factors matter.
        define: [social-loafing]
        hide: [mbi-sorter]
        show: [reward-note]
      - say: Check the three activities.
        hide: [reward-note]
        gate:
          type: practice
          template: norms-three-multi
      - say: And the order of the three steps.
        gate:
          type: practice
          template: mbi-order
    takeaway: Global teams need clear norms, a map-bridge-integrate process and rewards that avoid social loafing.

  - id: change
    title: Leading change across cultures
    goal: When a leader tries to change how an organization works, what steps help it last?
    skills: [lead-change]
    stage:
      - id: lewin-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: w1, label: Overcome inertia and defenses against the change }
            - { id: w2, label: Try the new behaviors, often with confusion }
            - { id: w3, label: The new behaviors are accepted or rejected }
          bins:
            - { id: un, label: Unfreezing }
            - { id: mv, label: Moving }
            - { id: re, label: Refreezing }
          solution: { w1: un, w2: mv, w3: re }
      - id: kotter-tree
        widget: Tree
        hidden: true
        props:
          root:
            id: k
            label: Kotter's steps
            note: Eight in all
            children:
              - { id: ka, label: Increase urgency, note: Step 1 }
              - { id: kb, label: Develop the guiding team, note: Step 2 }
              - { id: kc, label: Create a vision and strategy, note: Step 3 }
              - { id: kd, label: Communicate the vision, note: Step 4 }
              - { id: ke, label: Remove obstacles, note: Step 5 }
              - { id: kf, label: Generate short-term wins, note: Step 6 }
              - { id: kg, label: Don't let up, note: Step 7 }
              - { id: kh, label: Make the change stick, note: Step 8 }
    beats:
      - say: |
          Global leaders also lead change. **Lewin's three-stage process** has unfreezing, moving and refreezing.
          Unfreezing means overcoming inertia and the defenses people raise against a change.
        define: [lewin-three-stage]
        show: [lewin-sorter]
        gate:
          type: event
          prompt: Match each description to a Lewin stage.
          target: lewin-sorter
          event: solved
          hint: The first stage melts resistance. The last one decides what stays.
      - say: |
          **Kotter's eight-step process** is more detailed. It runs from the start of a change through to making it stick.
        define: [kotter-eight-step]
        hide: [lewin-sorter]
        gate:
          type: predict
          question: In Kotter's process, what comes before developing the guiding team?
          options:
            - Increasing urgency
            - Making the change stick
            - Generating short-term wins
            - Communicating the vision
          answer: 0
          explain: Kotter's first step is to increase urgency, and the guiding team follows.
      - say: |
          Here are Kotter's eight steps. Culture also shapes attitudes toward change, so a leader must communicate across
          cultural borders. A change that worked at home may not work abroad if the leader never studied the culture.
        show: [kotter-tree]
      - say: Put the Lewin stages in order.
        gate:
          type: practice
          template: lewin-order
      - say: And the first four of Kotter's steps.
        gate:
          type: practice
          template: kotter-order
      - say: A last question.
        gate:
          type: reflect
          prompt: Why might a change plan that worked at home fail when a leader uses it abroad without changing it?
          model: |
            Cultures differ in how they see change, authority and communication. Without a global mind-set the leader
            may not notice objections, and people may stay silent until they leave.
    takeaway: Lewin and Kotter describe change, and culture changes how it must be led.
