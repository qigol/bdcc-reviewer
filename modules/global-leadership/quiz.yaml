templates:
  # ------------------------------------------------------------------ mind-set
  - id: mindset-mcq
    type: mcq
    skills: [mind-set]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: mind-set }
    prompt: Which best describes a [[global-mind-set|global mind-set]]?
    options:
      - Openness to and awareness of diversity across cultures and markets, with the ability to bring them together
      - Speaking only one language fluently
      - A plan to sell everywhere at the same price
      - A rule that all offices must copy headquarters
    answer: 0
    hints:
      - It is a way of thinking, not a language or a price.
    explanation: A global mind-set combines openness and awareness of cultural diversity with the ability to synthesize across it.

  - id: mindset-parts-multi
    type: multi
    skills: [mind-set]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: mind-set }
    prompt: Which are the two key components of a global mind-set?
    options:
      - Intellectual intelligence
      - Global emotional intelligence
      - Currency intelligence
      - Legal intelligence
    answer: [0, 1]
    hints:
      - One concerns thinking and one concerns feelings.
    explanation: The lecture names intellectual intelligence and global emotional intelligence.

  - id: leader-manager-match
    type: match
    skills: [mind-set]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: mind-set }
    prompt: Match each trait to the leader or the manager.
    pairs:
      - ['Innovates and challenges the status quo', 'Leader']
      - ['Administers and accepts the status quo', 'Manager']
      - ['Has an eye on the horizon', 'Leader']
      - ['Has an eye on the bottom line', 'Manager']
    hints:
      - Think long-range versus short-term.
    explanation: The lecture contrasts leaders who innovate, develop and inspire with managers who administer, maintain and control.

  - id: gap-mcq
    type: mcq
    skills: [mind-set, develop-leaders]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: mind-set }
    prompt: What did surveyed international executives report about their firms' global leadership development?
    options:
      - Only about 7 percent of firms were effectively developing global leadership capability
      - Almost all firms were doing it well
      - About half of firms were developing it well
      - No firm had tried
    answer: 0
    hints:
      - The number is small.
    explanation: Only 7 percent of surveyed firms were effectively developing global leadership capability, which is why lack of leadership capacity limits many MNCs.

  # ------------------------------------------------------------------ complexity-styles
  - id: dimensions-match
    type: match
    skills: [complexity-styles]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: complexity }
    prompt: Match each dimension of complexity to its meaning.
    pairs:
      - ['[[multiplicity|Multiplicity]]', 'Many countries, cultures and demands at once']
      - ['[[interdependence|Interdependence]]', 'Units rely on one another across borders']
      - ['[[ambiguity|Ambiguity]]', 'Unclear information and unclear cause and effect']
      - ['[[dynamism|Dynamism]]', 'Fast and constant change']
    hints:
      - Start with the one about change.
    explanation: These four overlapping dimensions are what make global leadership harder than domestic leadership.

  - id: dimension-case-mcq
    type: mcq
    skills: [complexity-styles]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: complexity }
    prompt: A plant closure in one country delays shipments to five other countries. Which dimension is this?
    options:
      - Interdependence
      - Multiplicity
      - Dynamism
      - Ambiguity
    answer: 0
    hints:
      - Look for units that rely on each other.
    explanation: When one unit's problem spreads to others, the units are interdependent.

  - id: globe-multi
    type: multi
    skills: [complexity-styles]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: complexity }
    prompt: Which are among the six leadership styles identified by Project GLOBE?
    options:
      - Performance-oriented
      - Team-oriented
      - Participative
      - Humane
      - Profit-oriented
    answer: [0, 1, 2, 3]
    hints:
      - One option is not on the list of six.
    explanation: The six GLOBE styles are performance-oriented, team-oriented, participative, humane, autonomous and self-protective.

  - id: globe-match
    type: match
    skills: [complexity-styles]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: complexity }
    prompt: Match each short example to the GLOBE style it suggests.
    pairs:
      - ['A leader asks the whole team to vote on the plan', 'Participative']
      - ['A leader builds loyalty and cooperation inside the team', 'Team-oriented']
      - ['A leader sets high goals and rewards excellence', 'Performance-oriented']
      - ['A leader shows care and kindness toward staff', 'Humane']
    hints:
      - Voting is a clue for one of them.
    explanation: These are plain readings of the style names. Which style works best differs across cultures.

  - id: complexity-mcq
    type: mcq
    skills: [complexity-styles]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: complexity }
    prompt: How does global leadership differ from domestic leadership?
    options:
      - It deals with four overlapping dimensions of complexity
      - It never involves culture
      - It has fewer stakeholders
      - It needs no communication
    answer: 0
    hints:
      - Think of multiplicity and its three companions.
    explanation: Multiplicity, interdependence, ambiguity and dynamism make global leadership more complex.

  # ------------------------------------------------------------------ competencies
  - id: abilities-multi
    type: multi
    skills: [competencies]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: competencies }
    prompt: Which are among the five abilities for a successful global assignment?
    options:
      - See differences
      - Make connections
      - Adjust
      - Integrate and lead change
      - Localize
      - Standardize everything
    answer: [0, 1, 2, 3, 4]
    hints:
      - Five of the six are on the list.
    explanation: The five abilities are see differences, make connections, adjust, integrate and lead change, and localize.

  - id: group-match
    type: match
    skills: [competencies]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: competencies }
    prompt: Match each competency to its group.
    pairs:
      - ['Vision and strategic thinking', 'Business']
      - ['Cross-cultural communication', 'People']
      - ['Resilience', 'Self']
      - ['Empowering others', 'People']
      - ['Business savvy', 'Business']
      - ['Inquisitiveness', 'Self']
    hints:
      - Resilience is about the person.
    explanation: The lecture groups competencies as business, people and self competencies.

  - id: mintzberg-mcq
    type: mcq
    skills: [competencies]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: competencies }
    prompt: Which is NOT one of Mintzberg's global leadership roles listed in the lecture?
    options:
      - Accountant
      - Monitor
      - Liaison
      - Change agent
    answer: 0
    hints:
      - The roles are things like Monitor, Spokesperson and Negotiator.
    explanation: The lecture lists monitor, spokesperson, liaison, leader, negotiator, innovator, decision maker and change agent.

  - id: mindset-group-mcq
    type: mcq
    skills: [competencies, mind-set]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: competencies }
    prompt: In the competency tables, which group does global mind-set itself belong to?
    options:
      - Self competencies
      - Business competencies
      - People competencies
      - None of them
    answer: 0
    hints:
      - It appears next to resilience and character.
    explanation: Global mind-set, with cosmopolitanism and cognitive complexity, is listed among the self competencies.

  # ------------------------------------------------------------------ develop-leaders
  - id: gled-multi
    type: multi
    skills: [develop-leaders]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: developing }
    prompt: Which are the four antecedents in the GLED model?
    options:
      - Individual characteristics
      - Cultural exposure
      - Global education
      - Project novelty
      - Office size
    answer: [0, 1, 2, 3]
    hints:
      - Four of the five are about the person and what they experience.
    explanation: GLED begins with individual characteristics, cultural exposure, global education and project novelty.

  - id: models-mcq
    type: mcq
    skills: [develop-leaders]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: developing }
    prompt: Which model stresses a partnership between the leader and the organization, and says the needed skills vary across organizations?
    options:
      - The Right Stuff model
      - The GLED model
      - Lewin's model
      - The map-bridge-integrate model
    answer: 0
    hints:
      - The phrase is the name of the model.
    explanation: The Right Stuff model sees leaders developing through partnership with their organization.

  - id: assessment-mcq
    type: mcq
    skills: [develop-leaders]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: developing }
    prompt: Which is an instrument used to assess global leadership competencies?
    options:
      - The Intercultural Development Inventory
      - The Consumer Price Index
      - The Gini coefficient
      - The Big Mac index
    answer: 0
    hints:
      - Look for an inventory about cultures.
    explanation: The lecture lists CCAI, IDI, GCI and GELI as assessment instruments.

  - id: tools-multi
    type: multi
    skills: [develop-leaders]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: developing }
    prompt: Which tools does the lecture say help develop global leaders?
    options:
      - Training in business fundamentals including international business
      - Knowledge of history, geography and political science
      - Training in language and culture
      - Transformational experiences
      - Avoiding all foreign travel
    answer: [0, 1, 2, 3]
    hints:
      - One option works against the goal.
    explanation: Leaders learn through study, language and culture training, and above all through experience.

  # ------------------------------------------------------------------ global-teams
  - id: mbi-order
    type: order
    skills: [global-teams]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: teams }
    prompt: Put the map-bridge-integrate steps in order.
    items:
      - Map the team's differences and similarities
      - Bridge by agreeing how members will work together
      - Integrate by managing the differences
    hints:
      - The first step is a discussion.
    explanation: Mapping lets members talk about differences, bridging sets how they will work together, and integration manages the differences.

  - id: social-loafing-mcq
    type: mcq
    skills: [global-teams]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: teams }
    prompt: One team member does less work when others do the same job. What is this?
    options:
      - Social loafing
      - Multiplicity
      - Unfreezing
      - Reverse culture shock
    answer: 0
    hints:
      - Effort drops in a group.
    explanation: Social loafing is the tendency of some people to put in less effort in a group.

  - id: rewards-multi
    type: multi
    skills: [global-teams]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: teams }
    prompt: Which are areas to consider when balancing team and individual rewards?
    options:
      - The nature of the task
      - Stability of team membership
      - National cultures of team members
      - Labor laws about pay
      - The color of the office
    answer: [0, 1, 2, 3]
    hints:
      - One option is trivial.
    explanation: The lecture lists task, stability, culture, labor law and available reward options.

  - id: virtual-mcq
    type: mcq
    skills: [global-teams]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: teams }
    prompt: What does the lecture say about meeting in person for virtual teams?
    options:
      - Most teams meet face to face at the start and during crises
      - Virtual teams never need to meet
      - Face-to-face meetings are banned
      - Only managers meet
    answer: 0
    hints:
      - Technology lacks the richness of a face-to-face talk.
    explanation: Virtual communication lacks richness, so most teams meet in person at launch and in a crisis.

  - id: norms-three-multi
    type: multi
    skills: [global-teams]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: teams }
    prompt: Which are the three main activities when leading teams?
    options:
      - Establishing the team
      - Coaching team members
      - Setting team norms
      - Cutting the budget
    answer: [0, 1, 2]
    hints:
      - The last option is not on the list.
    explanation: Leaders establish the team, coach its members and set team norms.

  # ------------------------------------------------------------------ lead-change
  - id: lewin-order
    type: order
    skills: [lead-change]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: change }
    prompt: Put Lewin's three stages in order.
    items:
      - Unfreezing
      - Moving to the new behaviors
      - Refreezing
    hints:
      - Think of ice melting, moving, then setting again.
    explanation: Unfreezing overcomes inertia, moving puts new behaviors into practice, and refreezing accepts or rejects them.

  - id: kotter-order
    type: order
    skills: [lead-change]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: change }
    prompt: Put Kotter's first four steps in order.
    items:
      - Increase urgency
      - Develop the guiding team
      - Develop a change vision and strategy
      - Communicate the vision for buy-in
    hints:
      - People must feel the need before a team is formed.
    explanation: Kotter starts with urgency, builds a guiding team, creates a vision, and then communicates it.

  - id: kotter-multi
    type: multi
    skills: [lead-change]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: change }
    prompt: Which are among Kotter's later steps?
    options:
      - Empower broad-based action by removing obstacles
      - Generate short-term wins that are rewarded
      - Don't let up
      - Make the change stick
      - Cancel the project
    answer: [0, 1, 2, 3]
    hints:
      - One option is not a step.
    explanation: After the vision, Kotter lists empowering action, short-term wins, persistence and making change stick.

  - id: culture-change-mcq
    type: mcq
    skills: [lead-change]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: change }
    prompt: What does the lecture say about change and culture?
    options:
      - Attitude toward change is influenced by culture, and driving change needs communication across cultural borders
      - Every culture welcomes change equally
      - Culture has no effect on change
      - Change is only a technical matter
    answer: 0
    hints:
      - Think about the minicase about Justin.
    explanation: Cultures differ in how they see change, so a leader must communicate across borders.

  - id: justin-mcq
    type: mcq
    skills: [mind-set, lead-change]
    difficulty: 3
    tags: [application]
    lessonRef: { tab: application, id: why-failed }
    prompt: A leader moves to run a regional division and copies the approach that worked at home, without studying the local culture. Key managers leave. What does this most suggest?
    options:
      - The leader lacked a global mind-set and did not factor in culture
      - The managers were too well paid
      - The division had no problems
      - The company had too many global teams
    answer: 0
    hints:
      - What did the leader fail to learn first?
    explanation: The minicase points to missing global mind-set and culture awareness, plus a company that did not develop the leader.
