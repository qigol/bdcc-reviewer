terms:
  - id: global-mind-set
    term: Global mind-set
    short: A way of thinking that is open to and aware of different cultures and markets and can bring them together.
    related: [intellectual-intelligence, global-emotional-intelligence]
    skills: [mind-set]
  - id: intellectual-intelligence
    term: Intellectual intelligence
    short: The thinking skill of understanding complex global issues, one of the two key parts of a global mind-set.
    related: [global-emotional-intelligence]
    skills: [mind-set]
  - id: global-emotional-intelligence
    term: Global emotional intelligence
    short: The ability to read and respond to the feelings and behavior of people from other cultures.
    related: [intellectual-intelligence]
    skills: [mind-set]
  - id: leadership
    term: Leadership
    short: The behaviors and processes needed to organize a group of people to reach a common purpose.
    related: [global-mind-set, business-competencies, people-competencies]
    skills: [mind-set]
  - id: multiplicity
    term: Multiplicity
    short: Many different countries, cultures, rules and customers at once, so the leader faces many different demands.
    related: [interdependence]
    skills: [complexity-styles]
  - id: interdependence
    term: Interdependence
    short: Units in different countries rely on one another, so a decision in one place affects the others.
    related: [multiplicity]
    skills: [complexity-styles]
  - id: ambiguity
    term: Ambiguity
    short: Unclear information and unclear cause and effect, so leaders cannot be sure what is happening.
    related: [dynamism]
    skills: [complexity-styles]
  - id: dynamism
    term: Dynamism
    short: Fast and constant change in markets, rules and technology.
    related: [ambiguity]
    skills: [complexity-styles]
  - id: globe-leadership-styles
    term: GLOBE leadership styles
    short: The six leadership styles found by Project GLOBE, such as team-oriented and participative.
    related: [leadership, multiplicity, people-competencies]
    skills: [complexity-styles]
  - id: business-competencies
    term: Business competencies
    short: Skills about the business, such as vision, business savvy, managing communities, organizational savvy and leading change.
    related: [people-competencies, self-competencies]
    skills: [competencies]
  - id: people-competencies
    term: People competencies
    short: Skills for working with others, such as cross-cultural communication, interpersonal skills and teaming.
    related: [business-competencies, self-competencies]
    skills: [competencies]
  - id: self-competencies
    term: Self competencies
    short: Personal qualities such as resilience, character, inquisitiveness and flexibility.
    related: [business-competencies, people-competencies]
    skills: [competencies]
  - id: gled-model
    term: GLED model
    aka: [Global Leadership Expertise Development model]
    short: A model of how expertise grows, starting from four antecedents, including individual traits, cultural exposure and education.
    related: [right-stuff-model]
    skills: [develop-leaders]
  - id: right-stuff-model
    term: Right Stuff model
    short: A model in which the leader and the organization work as partners to build the skills that company needs.
    related: [gled-model]
    skills: [develop-leaders]
  - id: transformational-experience
    term: Transformational experience
    short: A real experience, often abroad, that changes how a person sees the world and builds leadership skills.
    related: [gled-model, right-stuff-model, global-mind-set]
    skills: [develop-leaders]
  - id: global-team
    term: Global team
    short: A team marked by high diversity, spread over places, and mostly working through technology rather than face to face.
    related: [team-norms]
    skills: [global-teams]
  - id: team-norms
    term: Team norms
    short: Shared standards a team uses to judge whether behavior is appropriate.
    related: [global-team]
    skills: [global-teams]
  - id: map-bridge-integrate
    term: Map-bridge-integrate model
    aka: [MBI]
    short: Three steps to understand team culture, discussing differences, agreeing how to work together, and managing the differences.
    related: [team-norms]
    skills: [global-teams]
  - id: social-loafing
    term: Social loafing
    short: The tendency of some people to put in less effort when they work in a group.
    related: [global-team, team-norms]
    skills: [global-teams]
  - id: lewin-three-stage
    term: Lewin's three-stage process
    short: A change model in three stages, unfreezing, moving to new behaviors, and refreezing them.
    related: [kotter-eight-step]
    skills: [lead-change]
  - id: kotter-eight-step
    term: Kotter's eight-step process
    short: A change model with eight steps that runs from the start of a change to making it stick.
    related: [lewin-three-stage]
    skills: [lead-change]
