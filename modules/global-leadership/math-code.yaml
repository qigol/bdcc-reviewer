sections:
  - id: key-terms
    title: Key terms lookup
    skills:
      - mind-set
      - complexity-styles
      - competencies
      - develop-leaders
      - global-teams
      - lead-change
    summary: "A placeholder section: this module is conceptual, so the workbench only looks up the meaning of its key terms.
      Pick a term to see what it means."
    keyFormula: \text{term} \rightarrow \text{meaning}
    state:
      term: global-mind-set
    derive:
      - fn: termLookup
        in:
          term: "@term"
        out: k
    live:
      - id: r
        widget: Readout
        props:
          items:
            - label: Term
              value: "{=k.name}"
              tone: accent
            - label: Meaning
              value: "{=k.meaning}"
              tone: good
      - id: pick
        widget: Choice
        props:
          label: Term
          options:
            - value: global-mind-set
              label: Global mind-set
            - value: multiplicity
              label: Multiplicity
            - value: business-competencies
              label: Business competencies
            - value: gled-model
              label: GLED model
            - value: global-team
              label: Global team
        bind:
          value: term
    steps:
      - tex: |
          \anchor{lookup}{\text{term}} ;\mapsto; \text{meaning}
        say: Each term has one meaning in this lecture.
      - tex: |
          \anchor{answer}{\text{meaning}} = \text{{=k.name|text}}
        say: "{=k.name}: {=k.meaning}"
    code:
      lang: python
      title: A term lookup
      source: |
        TERMS = {
            "global-mind-set": "Global mind-set",
            "multiplicity": "Multiplicity",
            "business-competencies": "Business competencies",
            "gled-model": "GLED model",
            "global-team": "Global team",
        }

        def term_lookup(term):
            """Look up a key term from the lecture.

            Args:
                term: the term's id.
            Returns:
                The term's name.
            Placeholder: this module is conceptual; see the Intuition tab.
            """
            name = TERMS[term]       # @a:lookup
            return name              # @a:answer
    links:
      - anchor: lookup
        label: Find the term
      - anchor: answer
        label: Its meaning
    trace:
      fn: termLookup
      in:
        term: "@term"
    examples:
      - term-global-mind-set
      - term-multiplicity
      - term-business-competencies
      - term-gled-model
      - term-global-team
    tryIt:
      - leader-manager-match
      - mindset-mcq
    pitfalls:
      - Memorizing the term without the idea behind it. The Intuition tab explains each one.
    examTip: "Exam questions on this lecture are conceptual: know what each term means and when it applies."
