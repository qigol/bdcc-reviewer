  notes: '2026-11-03: v1.0.0. Built for the gap the midterm exposed: Problem 1a names the file, but 1b and 1c only take a user, so students had to know to build the data inside each function. Every output and traceback is a real run of the lesson cell (record.py: Python 3.12.12, pandas 2.2.3, the course server runs Python 3.12), on food-mini, an invented dataset in the Food.com layout (assets/food-mini). No midterm code, solutions or assert values are used. 1.0.1: the atScale code no longer uses the midterm cut of 250. Application decisions branch: a wrong option shows its real error and the learner picks again.'
