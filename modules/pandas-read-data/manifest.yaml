schemaVersion: 1
id: pandas-read-data
version: 1.0.1
title: 'pandas I: Finding, Reading and Checking Data'
shortTitle: pd Reading
summary: |
  Before any recommender or itemset code runs, you need the data in a DataFrame. Find the right file in an unfamiliar
  folder, peek at it, read it, check what you loaded, turn list-like text back into lists, build a utility matrix,
  and write graded functions that load their own data.
course: BDCC
order: 15
color: '#7c3aed'
icon: folder-open
sources:
  - title: 'Midterm exam, Problems 1 and 2 (Food.com recipes and interactions): the data-loading steps the problems assume'
    file: 'midterm-exam/Problem 1.ipynb, midterm-exam/Problem 2.ipynb'
    date: '2026-11-03'
  - title: 'food-mini: an 8-recipe, 30-review dataset in the Food.com file layout, every output recorded from real pandas runs'
    file: 'assets/food-mini/'
    date: '2026-11-03'
prerequisites: []
skills:
  - id: find-files
    label: Finding the data file
    description: List an unfamiliar data folder, read what each file holds, and pick the one the spec names.
  - id: peek-file
    label: Peeking before reading
    description: Print the first lines of a file to see its header, separator and quoted text before loading it.
  - id: read-csv
    label: Reading a CSV with pandas
    description: pd.read_csv with the full path, and the FileNotFoundError a wrong name or folder gives.
  - id: inspect-frame
    label: Checking what you loaded
    description: shape, head, dtypes, columns, value_counts and nunique; spotting values such as a 0 that means "no stars".
  - id: list-columns
    label: Lists saved as text
    description: A list written into a CSV comes back as a string; turn it back into a list with ast.literal_eval or converters.
  - id: threshold-filter
    label: Count, cut and keep
    description: Count rows per item with groupby, keep items with ">= t" or "> t" as the spec says, and filter rows with isin.
  - id: pivot-matrix
    label: Building a utility matrix
    description: pivot users into rows and items into columns; sorted labels, NaN for unrated, and the duplicate-entry error.
  - id: loc-iloc
    label: Labels vs positions
    description: loc looks rows up by label (a user id), iloc by position (0, 1, 2…); each fails differently when mixed up.
  - id: self-contained
    label: Functions that load their own data
    description: A graded function runs in a fresh kernel, so it reads or builds its data itself and returns the answer.
requires:
  widgets: [Text, Code, Matrix, Tree, DropBins, Readout, Slider]
guide: 2
workbench: code
objectives:
  - id: locate-and-load
    text: 'Find the file a spec needs in an unfamiliar data folder, peek at it, read it with pd.read_csv, and fix the FileNotFoundError a wrong path gives.'
    skills: [find-files, peek-file, read-csv]
  - id: check-the-load
    text: 'Check a loaded table with shape, dtypes and value_counts before computing on it, and turn list-like text columns back into lists.'
    skills: [inspect-frame, list-columns]
  - id: build-the-matrix
    text: 'Keep the items that pass a count cut exactly as the spec words it, pivot the rows into a utility matrix, and look users up with loc and iloc.'
    skills: [threshold-filter, pivot-matrix, loc-iloc]
  - id: graded-functions
    text: 'Write graded functions that load their own data and return their answer, and explain the NameError or AttributeError when they do not.'
    skills: [self-contained, read-csv]
