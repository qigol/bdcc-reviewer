title: Job-Order Costing
shortTitle: Job Order
summary: |
  Trace a custom job's materials and labor, apply overhead with a predetermined rate, price the job, follow its cost from
  raw materials to COGS, and settle under- or overapplied overhead at year end.
course: MANACC
order: 10
color: '#b45309'
icon: receipt
guide: 2
workbench: journal
currency: ₱
sources:
  - title: 'Session 5: Job-Order Costing (ACCT 2302, Principles of Managerial Accounting)'
    file: Session5_Job_Order_Costing.pdf
    sessions: '5'
    date: '2026'
prerequisites: []
objectives:
  - id: choose-system
    text: Decide whether a business needs job-order or process costing and justify it from the nature of its output.
    skills: [cost-systems]
  - id: cost-and-price
    text: Build a job cost sheet from requisitions, time tickets and a predetermined overhead rate, and turn it into a price or a profit check, for a factory job or a service engagement.
    skills: [job-cost-sheet, pohr, service-jobs]
  - id: follow-the-cost
    text: Record a job's cost flow from Raw Materials Inventory to Cost of Goods Sold and compute COGM, ending WIP, COGS and ending Finished Goods.
    skills: [cost-flow, cogm]
  - id: settle-overhead
    text: Compute applied overhead, judge whether it is under- or overapplied, and close it to COGS or prorate it across WIP, Finished Goods and COGS.
    skills: [over-under, proration]
  - id: compare-rates
    text: Compute departmental and plantwide rates from budgets, cost a job both ways, and explain which jobs the plantwide rate distorts.
    skills: [dept-rates]
skills:
  - id: cost-systems
    label: Job-order vs process costing
    description: Cost accumulation systems; choosing by the nature of the output; strengths and limits of job costing.
  - id: job-cost-sheet
    label: The job cost sheet and pricing
    description: DM from requisitions, DL from time tickets, applied overhead, markup on cost.
  - id: pohr
    label: Predetermined overhead rate
    description: Budgeted overhead ÷ budgeted activity; the activity base; applied overhead; normal vs actual costing.
  - id: cost-flow
    label: The job-order cost flow
    description: Raw Materials → WIP → Finished Goods → COGS, and the journal entries that move cost.
  - id: over-under
    label: Under- and overapplied overhead
    description: The Factory Overhead account, actual vs applied overhead, and the closing entry to COGS.
  - id: proration
    label: Prorating a material difference
    description: Materiality, and splitting under- or overapplied overhead across WIP, Finished Goods and COGS.
  - id: dept-rates
    label: Departmental vs plantwide rates
    description: One rate per department on its own base, and the distortion a plantwide rate causes.
  - id: cogm
    label: COGM and COGS for several jobs
    description: Completed jobs make COGM; sold jobs make COGS; the rest stay in WIP or Finished Goods.
  - id: service-jobs
    label: Service jobs and job profitability
    description: Engagements costed like jobs, and comparing a finished cost sheet with its quote.
