objectives:
  - id: choose-system
    text: Decide whether a business needs job-order or process costing and justify it from the nature of its output.
    skills: [cost-systems]
  - id: cost-and-price
    text: Build a job cost sheet from requisitions, time tickets and a predetermined overhead rate, and turn it into a price or a profit check.
    skills: [job-cost-sheet, pohr]
  - id: settle-overhead
    text: Compute applied overhead, judge whether it is under- or overapplied, and close it to COGS or prorate it across WIP, Finished Goods and COGS.
    skills: [over-under, proration]
  - id: compare-rates
    text: Cost a job under departmental rates and under one plantwide rate, and explain which jobs the plantwide rate distorts.
    skills: [dept-rates]
