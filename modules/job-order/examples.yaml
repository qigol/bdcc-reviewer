examples:
  - id: chiphard-job-123
    source: 'Session 5, slide 22 (Example 2)'
    fn: jobSheet
    in: { issues: '@chiphard.issues', labor: '@chiphard.labor', rate: '@chiphard.rate', markup: '@chiphard.markup' }
    expect: { dm: 2200, dl: 2185, hours: 320, oh: 1440, total: 5825, markupAmt: 2330, price: 8155 }
  - id: chiphard-walk
    source: 'Session 5, slide 22 (Example 2), count-along'
    fn: jobSheetWalk
    in: { issues: '@chiphard.issues', labor: '@chiphard.labor', rate: '@chiphard.rate', markup: '@chiphard.markup' }
    expect: { steps: 11, total: 5825, price: 8155 }
  - id: quezon-pohr
    source: 'Session 5, slide 31 (Example 3)'
    fn: pohr
    in: { budgetOH: '@quezon.budgetOH', budgetBase: '@quezon.budgetDLH', dm: '@quezon.dm', hours: '@quezon.hours', wage: '@quezon.wage' }
    expect: { rate: 60, dl: 16200, oh: 10800, total: 89000 }
  - id: quezon-walk
    source: 'Session 5, slide 31 (Example 3), count-along'
    fn: pohrWalk
    in: { budgetOH: '@quezon.budgetOH', budgetBase: '@quezon.budgetDLH', dm: '@quezon.dm', hours: '@quezon.hours', wage: '@quezon.wage' }
    expect: { steps: 7, rate: 60, total: 89000 }
  - id: company-x
    source: 'Session 5, slide 34 (Example 4)'
    fn: overheadClose
    in: { actualOH: 198000, rate: 2, actualBase: 96000, kind: hour }
    expect: { applied: 192000, amt: 6000, kind: underapplied }
  - id: company-y
    source: 'Session 5, slide 34 (Example 4)'
    fn: overheadClose
    in: { actualOH: 256000, rate: 1.5, actualBase: 176000, kind: pct }
    expect: { applied: 264000, amt: 8000, kind: overapplied }
  - id: two-companies
    source: 'Session 5, slide 34 (Example 4)'
    fn: twoCompanies
    in: { x: '@twoco.x', y: '@twoco.y' }
    expect: { x.diff: 6000, y.diff: -8000 }
  - id: cavite-prorate
    source: 'Session 5, slide 44 (Example 5)'
    fn: prorate
    in: { amount: '@cavite.amount', kind: '@cavite.kind', wip: '@cavite.wip', fg: '@cavite.fg', cogs: '@cavite.cogs' }
    expect: { total: 1200000, wipShare: 0.2, fgShare: 0.3, cogsShare: 0.5, wipAdj: 12000, fgAdj: 18000, cogsAdj: 30000, direction: decrease }
  - id: cavite-walk
    source: 'Session 5, slide 44 (Example 5), count-along'
    fn: prorateWalk
    in: { amount: '@cavite.amount', kind: '@cavite.kind', wip: '@cavite.wip', fg: '@cavite.fg', cogs: '@cavite.cogs' }
    expect: { steps: 5, total: 1200000 }
  - id: dept-rates
    source: 'Session 5, slide 49 (Example 6)'
    fn: deptRates
    in: { budget: '@job105.budget' }
    expect: { rateA: 1.125, rateB: 7.5, plantRate: 1.8 }
    note: The plantwide rate is 147,000 ÷ 81,500 = 1.8037; slide 53 rounds it to 180%.
  - id: job-105-dept
    source: 'Session 5, slides 51–53 (Examples 7–8)'
    fn: deptJob
    in: { budget: '@job105.budget', a: '@job105.a', b: '@job105.b', units: '@job105.units', plantRate: '@job105.plantRate' }
    expect: { ohA: 40.5, ohB: 112.5, oh: 153, total: 289, unit: 9.63, plantOH: 109.8, plantTotal: 245.8, gap: 43.2 }
  - id: job-105-walk
    source: 'Session 5, slides 51–53, count-along'
    fn: deptJobWalk
    in: { budget: '@job105.budget', a: '@job105.a', b: '@job105.b', units: '@job105.units', plantRate: '@job105.plantRate' }
    expect: { steps: 10, total: 289, gap: 43.2 }
  - id: bulacan-flow
    source: 'Session 5, slide 59 (Example 9)'
