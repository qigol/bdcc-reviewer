  - id: bulacan-walk
    source: 'Session 5, slides 57–61, count-along'
    fn: flowWalk
    in: { dm: '@bulacan.dm', dl: '@bulacan.dl', oh: '@bulacan.oh', price: '@bulacan.price' }
    expect: { steps: 5, total: 92400 }
