terms:
  - id: cost-accumulation-system
    term: Cost accumulation system
    aka: [product costing system]
    short: A system that collects manufacturing costs (materials, labor and overhead) and assigns them to cost objects such as jobs, units or departments.
    long: |
      It does two things: measure the costs incurred, then assign them to products. It serves external reporting
      (inventory and income) and internal decisions (setting a price).
    related: [job-order-costing, process-costing]
    skills: [cost-systems]
  - id: cost-object
    term: Cost object
    short: Anything whose cost a manager wants measured separately; in job-order costing the job itself is the cost object.
    related: [job-cost-sheet]
    skills: [cost-systems]
  - id: job-order-costing
    term: Job-order costing
    short: A costing system that traces costs to a specific, identifiable job, order or contract and records them on a job cost sheet.
    related: [process-costing, job-cost-sheet]
    skills: [cost-systems]
  - id: process-costing
    term: Process costing
    short: A costing system that accumulates costs by department and averages them over continuous, identical output.
    related: [job-order-costing]
    skills: [cost-systems]
  - id: job-cost-sheet
    term: Job cost sheet
    short: The document that records one job's direct materials, direct labor and applied overhead; unfinished sheets form the subsidiary ledger for Work in Process.
    related: [materials-requisition, time-ticket, work-in-process]
    skills: [job-cost-sheet]
  - id: materials-requisition
    term: Materials requisition form
    aka: [materials requisition]
    short: The source document that authorizes and records materials issued from the storeroom to a specific job.
    related: [job-cost-sheet]
    skills: [job-cost-sheet]
  - id: time-ticket
    term: Time ticket
    aka: [labor time sheet]
    short: The source document recording the hours a worker spent on a specific job and the wage rate for those hours.
    related: [job-cost-sheet]
    skills: [job-cost-sheet]
  - id: factory-overhead
    term: Factory overhead
    aka: [manufacturing overhead, overhead, OH]
    short: Every production cost other than direct materials and direct labor; it cannot be traced to one job, so it is applied with a rate.
    long: |
      In the ledger, Factory Overhead is a control account: actual overhead is debited to it as it is incurred, and
      applied overhead is credited to it as jobs are charged.
    related: [applied-overhead, predetermined-overhead-rate]
    skills: [job-cost-sheet, pohr]
  - id: markup
    term: Markup on cost
    aka: [cost-plus pricing, markup]
    short: A percentage of total job cost added to that cost to set the price; price equals cost times one plus the markup.
    formula: '\text{Price} = \text{Cost} \times (1 + m)'
    related: [job-cost-sheet]
    skills: [job-cost-sheet]
  - id: predetermined-overhead-rate
    term: Predetermined overhead rate
    aka: [POHR]
    short: Budgeted annual overhead divided by budgeted annual activity, computed before the period begins and used all year.
    formula: '\text{POHR} = \frac{\text{Budgeted annual overhead}}{\text{Budgeted annual activity}}'
    related: [activity-base, applied-overhead]
    skills: [pohr]
  - id: activity-base
    term: Activity base
    aka: [allocation base, overhead application base]
    short: The measure, such as direct labor hours, machine hours or direct labor cost, that overhead is applied on; it should drive overhead.
    related: [predetermined-overhead-rate]
    skills: [pohr]
  - id: applied-overhead
    term: Applied overhead
    short: Overhead charged to a job as the predetermined rate times the job's actual activity.
    formula: '\text{Applied OH} = \text{POHR} \times \text{actual activity}'
    related: [predetermined-overhead-rate, underapplied-overhead]
    skills: [pohr, over-under]
  - id: normal-costing
    term: Normal costing
    short: Direct materials and labor at actual cost, overhead applied with the predetermined rate, so job costs are known as work proceeds.
    related: [actual-costing]
    skills: [pohr]
  - id: actual-costing
    term: Actual costing
    short: Materials, labor and overhead all at actual cost, so a job's cost is only known once the period ends.
    related: [normal-costing]
    skills: [pohr]
  - id: underapplied-overhead
    term: Underapplied overhead
    short: The shortfall when applied overhead is less than actual overhead, so jobs were undercharged; closing it increases cost of goods sold.
    formula: '\text{Actual OH} - \text{Applied OH} > 0'
    related: [overapplied-overhead, applied-overhead]
    skills: [over-under]
  - id: overapplied-overhead
    term: Overapplied overhead
    short: The excess when applied overhead is more than actual overhead, so jobs were overcharged; closing it decreases cost of goods sold.
    formula: '\text{Applied OH} - \text{Actual OH} > 0'
    related: [underapplied-overhead]
    skills: [over-under]
  - id: proration
    term: Proration
    short: Splitting a material under- or overapplied amount across WIP, Finished Goods and COGS in proportion to the applied overhead each holds.
    related: [underapplied-overhead, overapplied-overhead]
    skills: [proration]
  - id: plantwide-rate
    term: Plantwide rate
    aka: [plantwide overhead rate]
    short: One predetermined overhead rate, on one activity base, used for the entire factory.
    related: [departmental-rate]
    skills: [dept-rates]
  - id: departmental-rate
    term: Departmental rate
    aka: [departmental overhead rate]
    short: A separate predetermined overhead rate for each department, each on the activity base that drives that department's overhead.
    related: [plantwide-rate]
    skills: [dept-rates]
  - id: product-cost
    term: Product cost
    aka: [inventoriable cost]
    short: A manufacturing cost (DM, DL or overhead) that is held as inventory on the balance sheet until the goods are sold.
    related: [work-in-process, cost-of-goods-sold]
    skills: [cost-flow]
  - id: work-in-process
    term: Work in Process
    aka: [WIP, Work-in-Process Inventory]
    short: The inventory account holding the cost of jobs started but not finished; normal balance is a debit.
    related: [job-cost-sheet, finished-goods]
    skills: [cost-flow]
  - id: finished-goods
    term: Finished Goods
    aka: [Finished Goods Inventory]
    short: The inventory account holding the cost of completed jobs not yet sold; normal balance is a debit.
    related: [work-in-process, cost-of-goods-sold]
    skills: [cost-flow]
  - id: cost-of-goods-sold
    term: Cost of Goods Sold
    aka: [COGS]
    short: The expense recognized when jobs are sold; the job's accumulated cost moves here from Finished Goods.
    related: [finished-goods]
    skills: [cost-flow, cogm]
  - id: cost-of-goods-manufactured
    term: Cost of goods manufactured
    aka: [COGM]
    short: The total cost of jobs completed during the period; it moves from Work in Process to Finished Goods.
    formula: '\text{COGM} = \text{Beg. WIP} + \text{costs added} - \text{End. WIP}'
    related: [work-in-process, finished-goods]
    skills: [cogm]
