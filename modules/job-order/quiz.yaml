    steps:
      - prompt: Overhead applied to the job (₱)
        answer: { var: oh, tol: 0.5 }
        hint: The rate × the job's direct labor hours.
      - prompt: Work in Process balance after the job's costs are recorded, before it is completed (₱)
        answer: { var: wipBefore, tol: 0.5 }
        hint: The opening balance plus the job's materials, labor and applied overhead.
      - prompt: Cost transferred to Finished Goods when the job is completed (₱)
        answer: { var: fgCost, tol: 0.5 }
        hint: Only this job is completed.
      - prompt: Gross margin on the sale (₱)
        answer: { var: gm, tol: 0.5 }
        hint: Price minus the job cost that moved to Cost of Goods Sold.
      - prompt: Gross margin as a percent of the price (%, to two decimal places)
        answer: { var: gmPct, tol: 0.01, percent: true }
        hint: Gross margin ÷ price.
    hints:
      - Every entry adds to or moves out of Work in Process; the other jobs' cost never leaves it here.
      - A markup is on cost; a margin percent is on price.
    explanation: |
      Applied OH $= {=hours} \times {=rate} = {=oh|money}$; job cost $= {=dm|comma} + {=dl|comma} + {=oh|comma} = {=total|money}$.
      WIP $= {=otherWip|comma} + {=total|comma} = {=wipBefore|money}$, of which only {=fgCost|money} moves to Finished Goods
      and then to COGS. Gross margin $= {=price|comma} - {=total|comma} = {=gm|money}$, or ${=gm|comma} \div {=price|comma} = {=gmPct|2f}\%$ of the price.

