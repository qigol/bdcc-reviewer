  - id: pohr-explain
    type: explain
    skills: [pohr]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: two-companies }
    prompt: A classmate asks why the shop doesn't just charge each job its **actual** overhead for the month it was made. Explain why a predetermined rate is used instead.
    model: |
      Actual overhead isn't known until the bills arrive, often after the job is priced and delivered, and much of it (rent,
      depreciation, supervision) is fixed, so cost per hour would swing with each month's volume and the season. A rate set in
      January from **budgeted** overhead ÷ **budgeted** activity gives every job a cost right away and charges similar jobs the
      same amount all year. The cost of that is a gap between applied and actual overhead, which is closed at year-end.
    checklist:
      - Actual overhead is only known later, after jobs need to be costed or priced
      - Fixed overhead per hour would swing with monthly volume or seasons
      - The rate comes from budgeted overhead ÷ budgeted activity
      - The difference from actual (under/overapplied) is settled at year-end
    hints: [Think about timing (when the bills arrive) and about fixed costs in a slow month.]
    explanation: A predetermined rate trades exactness for timeliness and consistency, and the year-end close corrects the total.

