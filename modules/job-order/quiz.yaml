  - id: chain-handcalc
    type: hand-calc
    skills: [pohr, over-under]
    difficulty: 3
    tags: [math]
    generator: chainQ
    lessonRef: { tab: intuition, id: two-companies }
    prompt: |
      In January a metal shop budgets {=budgetOH|money} of overhead and {=budgetDLH|comma} direct labor hours. In March,
      a job uses {=dm|money} of materials and {=hours} direct labor hours at {=wage|money} per hour. By December the shop
      has worked {=actualDLH|comma} direct labor hours and its actual overhead is {=actualOH|money}.
    steps:
      - prompt: Predetermined overhead rate (₱ per direct labor hour)
        answer: { var: rate, tol: 0.01 }
        hint: Budgeted overhead ÷ budgeted hours.
      - prompt: Total cost of the March job (₱)
        answer: { var: total, tol: 0.5 }
        hint: Materials + hours × wage + hours × the rate.
      - prompt: Overhead applied for the whole year (₱)
        answer: { var: appliedYear, tol: 0.5 }
        hint: The rate × the hours actually worked in the year.
      - prompt: 'Actual − applied (₱; negative if overapplied)'
        answer: { var: signedDiff, tol: 0.5 }
        hint: Positive means jobs were undercharged.
    hints:
      - The rate is fixed in January; the year's actual hours only decide how much is applied.
      - The year-end gap compares actual overhead with **applied** overhead, not with the budget.
    explanation: |
      POHR $= {=budgetOH|comma} \div {=budgetDLH|comma} = {=rate|money2}$. Job $= {=dm|comma} + {=hours} \times {=wage} + {=hours} \times {=rate} = {=total|money}$.
      Applied $= {=actualDLH|comma} \times {=rate} = {=appliedYear|money}$; ${=actualOH|comma} - {=appliedYear|comma} = {=signedDiff|comma}$:
      {=kindTxt} by {=amt|money}, so closing it {=cogsDir} COGS.

  - id: flow-chain-handcalc
    type: hand-calc
