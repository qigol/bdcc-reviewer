    skills: [cogm]
    difficulty: 2
    tags: [journal]
    generator: cogmQ
    lessonRef: { tab: math-code, id: cogm }
    prompt: 'This month: {=jobText}. Beginning Finished Goods of {=begFG|money} was sold. Complete the schedule.'
    rows: '@rows'
    hints:
