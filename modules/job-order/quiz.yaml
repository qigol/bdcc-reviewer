  - id: chain-handcalc
    type: hand-calc
    skills: [pohr, over-under]
    difficulty: 3
    tags: [math]
    generator: chainQ
    lessonRef: { tab: intuition, id: two-companies }
    prompt: |
      In January a metal shop budgets {=budgetOH|money} of overhead and {=budgetDLH|comma} direct labor hours. In March,
      a job uses {=dm|money} of materials and {=hours} direct labor hours at {=wage|money} per hour. By December the shop
      has worked {=actualDLH|comma} direct labor hours and its actual overhead is {=actualOH|money}.
    steps:
      - prompt: Predetermined overhead rate (₱ per direct labor hour)
        answer: { var: rate, tol: 0.01 }
        hint: Budgeted overhead ÷ budgeted hours.
      - prompt: Total cost of the March job (₱)
        answer: { var: total, tol: 0.5 }
        hint: Materials + hours × wage + hours × the rate.
      - prompt: Overhead applied for the whole year (₱)
        answer: { var: appliedYear, tol: 0.5 }
        hint: The rate × the hours actually worked in the year.
      - prompt: 'Actual − applied (₱; negative if overapplied)'
        answer: { var: signedDiff, tol: 0.5 }
        hint: Positive means jobs were undercharged.
    hints:
      - The rate is fixed in January; the year's actual hours only decide how much is applied.
      - The year-end gap compares actual overhead with **applied** overhead, not with the budget.
    explanation: |
      POHR $= {=budgetOH|comma} \div {=budgetDLH|comma} = {=rate|money2}$. Job $= {=dm|comma} + {=hours} \times {=wage} + {=hours} \times {=rate} = {=total|money}$.
      Applied $= {=actualDLH|comma} \times {=rate} = {=appliedYear|money}$; ${=actualOH|comma} - {=appliedYear|comma} = {=signedDiff|comma}$:
      {=kindTxt} by {=amt|money}, so closing it {=cogsDir} COGS.

  - id: flow-chain-handcalc
    type: hand-calc
    skills: [pohr, cost-flow]
    difficulty: 3
    tags: [math]
    generator: flowChainQ
    lessonRef: { tab: math-code, id: cost-flow }
    prompt: |
      Work in Process already holds {=otherWip|money} of cost for other jobs when a fabrication shop starts a new job.
      The job uses {=dm|money} of direct materials and {=hours} direct labor hours at {=wage|money} per hour, and
      overhead is applied at {=rate|money} per direct labor hour. The job is completed, then delivered and sold at its
      cost plus {=markupPct}%, rounded to the nearest ₱1,000: {=price|money}. The other jobs are still in process.
    steps:
      - prompt: Overhead applied to the job (₱)
        answer: { var: oh, tol: 0.5 }
        hint: The rate × the job's direct labor hours.
      - prompt: Work in Process balance after the job's costs are recorded, before it is completed (₱)
        answer: { var: wipBefore, tol: 0.5 }
        hint: The opening balance plus the job's materials, labor and applied overhead.
      - prompt: Cost transferred to Finished Goods when the job is completed (₱)
        answer: { var: fgCost, tol: 0.5 }
        hint: Only this job is completed.
      - prompt: Gross margin on the sale (₱)
        answer: { var: gm, tol: 0.5 }
        hint: Price minus the job cost that moved to Cost of Goods Sold.
      - prompt: Gross margin as a percent of the price (%, to two decimal places)
        answer: { var: gmPct, tol: 0.01, percent: true }
        hint: Gross margin ÷ price.
    hints:
      - Every entry adds to or moves out of Work in Process; the other jobs' cost never leaves it here.
      - A markup is on cost; a margin percent is on price.
    explanation: |
      Applied OH $= {=hours} \times {=rate} = {=oh|money}$; job cost $= {=dm|comma} + {=dl|comma} + {=oh|comma} = {=total|money}$.
      WIP $= {=otherWip|comma} + {=total|comma} = {=wipBefore|money}$, of which only {=fgCost|money} moves to Finished Goods
      and then to COGS. Gross margin $= {=price|comma} - {=total|comma} = {=gm|money}$, or ${=gm|comma} \div {=price|comma} = {=gmPct|2f}\%$ of the price.

  - id: dept-rates-handcalc
    type: hand-calc
    skills: [dept-rates]
    difficulty: 3
    tags: [math]
    generator: deptBudgetQ
    lessonRef: { tab: intuition, id: two-departments }
    prompt: |
      Department A budgets {=aOH|money} of overhead on {=aDLb|money} of direct labor cost. Department B budgets
      {=bOH|money} of overhead on {=bMHb|comma} machine hours, and {=bDLb|money} of direct labor cost. A job used, in A,
      labor {=aDl|money2} and {=aMh} machine hours; in B, labor {=bDl|money2} and {=bMh} machine hours.
    steps:
      - prompt: Department A's rate (% of direct labor cost)
        answer: { var: aRatePct, tol: 0.05, percent: true }
        hint: A's budgeted overhead ÷ A's budgeted labor cost.
      - prompt: Department B's rate (₱ per machine hour)
        answer: { var: bRate, tol: 0.01 }
        hint: B's budgeted overhead ÷ B's budgeted machine hours.
      - prompt: One plantwide rate (% of direct labor cost)
        answer: { var: plantPct, tol: 0.05, percent: true }
        hint: Pool both departments' overhead, then divide by both departments' labor cost.
      - prompt: The job's overhead under departmental rates (₱)
        answer: { var: deptOH, tol: 0.01 }
        hint: Each department's rate on its own base, then add.
      - prompt: The job's overhead under the plantwide rate (₱)
        answer: { var: plantOH, tol: 0.01 }
        hint: The plantwide rate × the job's total labor cost.
    hints:
      - Departmental rates come from each department's own budget; the plantwide rate pools the budgets.
      - Keep each rate with its base (% of labor cost, or ₱ per machine hour).
    explanation: |
      A $= {=aOH|comma} \div {=aDLb|comma} = {=aRatePct}\%$; B $= {=bOH|comma} \div {=bMHb|comma} = {=bRate|money2}$ per MH;
      plantwide $= ({=aOH|comma} + {=bOH|comma}) \div ({=aDLb|comma} + {=bDLb|comma}) = {=plantPct}\%$.
      Departmental overhead $= {=ohA|2f} + {=ohB|2f} = {=deptOH|money2}$; plantwide $= {=dl} \times {=plantPct}\% = {=plantOH|money2}$.
      The plantwide rate {=gapDir} this job.

  - id: cogs-close-handcalc
    type: hand-calc
    skills: [cogm, over-under]
    difficulty: 3
    tags: [math]
    generator: cogmQ
    lessonRef: { tab: math-code, id: cogm }
    prompt: |
      It is the last month of the year. {=jobText}. Beginning Finished Goods of {=begFG|money} was sold. Overhead for
      the year was {=ohKindTxt} by {=ohDiff|money}, an immaterial amount the company closes to Cost of Goods Sold.
    steps:
      - prompt: Cost of goods manufactured (₱)
        answer: { var: cogm, tol: 0.5 }
        hint: Completed jobs only.
      - prompt: Cost of goods sold before the year-end close (₱)
        answer: { var: cogs, tol: 0.5 }
        hint: Beginning Finished Goods + COGM − the finished job still unsold.
      - prompt: Cost of goods sold after closing the overhead difference (₱)
        answer: { var: adjCogs, tol: 0.5 }
        hint: Underapplied means jobs were undercharged.
    hints:
      - 'Work in order: what was completed, what was sold, then the year-end close.'
      - Underapplied overhead is added to COGS; overapplied is subtracted.
    explanation: |
      COGM $= {=cogm|money}$ (ending WIP {=endWip|money} stays behind). COGS $= {=begFG|comma} + {=cogm|comma} - {=endFG|comma} = {=cogs|money}$.
      Overhead was {=ohKindTxt}, so the close {=ohDir} COGS by {=ohDiff|money}: {=adjCogs|money}.

  - id: prorate-infer-numeric
    type: numeric
    skills: [proration, over-under]
    difficulty: 3
    tags: [math]
    generator: prorateQ
    lessonRef: { tab: intuition, id: prorate-it }
    prompt: |
      At year end, applied overhead sits in Work in Process {=wip|money}, Finished Goods {=fg|money} and Cost of Goods
      Sold {=cogs|money}; these three accounts hold all of the overhead applied this year. Actual overhead for the year
      was {=actualOH|money}. The difference is material and is prorated. By how much does Cost of Goods Sold change?
      Enter a negative number if it decreases.
    answer: { var: signedCogsAdj, tol: 0.5 }
    hints:
      - First compare actual overhead with the applied overhead in the three accounts. Which way is the miss?
      - COGS takes its share of applied overhead times the difference.
    explanation: |
      Applied $= {=total|money}$ against actual {=actualOH|money}: {=kindTxt} by {=amount|money}. COGS holds
      ${=cogs|comma} \div {=total|comma} = {=cogsPct|pct}$ of applied overhead, so it changes by {=cogsAdj|money}
      ({=direction}): {=signedCogsAdj|comma}.

  - id: materiality-mcq
    type: mcq
    skills: [proration]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: two-companies }
    prompt: Two shops each end the year with overhead underapplied by about 5% of actual overhead. Shop P sold almost every job it made; Shop Q still holds about a third of the year's applied overhead in Work in Process and Finished Goods. Which treatment fits each?
    options:
      - 'P can close it to COGS; Q should prorate, or its inventories stay understated'
      - 'Both must prorate, because any gap above 1% of overhead is material'
      - 'Both should close it to COGS, because the two gaps are the same size'
      - 'P should prorate and Q close it, because Q still holds inventory'
    answer: 0
    hints: [Ask where the year's applied overhead ended up, and what closing everything to COGS would misstate.]
    explanation: Materiality is a judgment, not a fixed percent. When nearly everything was sold, COGS holds nearly all the applied overhead, so closing the gap there is accurate enough. When a big share still sits in inventory, dumping it all into COGS misstates WIP and Finished Goods, so prorating is worth the work.

  - id: strengths-multi
    type: multi
    skills: [cost-systems]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: beyond-the-floor }
    prompt: Which of these are genuine **limitations** of job-order costing? Select all that apply.
    options:
      - Every job needs its own requisitions, time tickets and cost sheet, which takes clerical effort
      - Overhead is still applied with an estimated rate, so a job's cost is only as good as that rate
      - It is a poor fit for continuous output of identical units
      - It cannot show whether an individual job made or lost money
      - It cannot be used by service firms such as law or audit firms
    answer: [0, 1, 2]
    hints: [Two of the options describe things job costing is actually good at.]
    explanation: Tracking each job costs record-keeping effort, applied overhead is an estimate, and identical continuous output is better averaged by process costing. Showing each job's profit is a strength, and service firms use job costing for every engagement.
