schemaVersion: 1
id: interpretability
version: 1.2.1
title: Model Interpretability
shortTitle: Interpret
summary: |
  Ask why a model predicts what it predicts. For the whole model: built-in importance, permutation importance and
  partial dependence. For one case: SHAP, LIME and counterfactuals. Then learn what none of them can honestly claim.
course: ML2
order: 20
color: '#7c3aed'
icon: microscope
sources:
  - title: 'Session 6: Model Interpretability Basics (lab notebook, instructors'' copy)'
    file: Session_6_Model_Interpretability_Basics_Instructors.ipynb
    sessions: '6'
  - title: 'Session 7: Local Interpretability: SHAP, LIME and Counterfactuals (lab notebook)'
    file: Session_7_Local_Interpretability_Instructor.ipynb
    sessions: '7'
prerequisites: []
skills:
  - id: global-local
    label: Global vs local explanations
    description: Which question each tool answers, and for whom.
  - id: impurity-importance
    label: Built-in (impurity) importance
    description: Summing a tree's weighted Gini decreases per feature and normalizing.
  - id: permutation-importance
    label: Permutation importance
    description: Shuffling one column on held-out data and measuring the drop in the metric.
  - id: correlation-trap
    label: Correlated features
    description: How near-duplicate features split credit (built-in) or erase it (permutation).
  - id: pdp
    label: Partial dependence plots
    description: Forcing one feature to each grid value for every row and averaging the predictions.
  - id: shapley
    label: Shapley values
    description: Fair credit as the average marginal contribution; additivity to the prediction.
  - id: shap-reading
    label: Reading SHAP output
    description: Baseline plus contributions, waterfall plots, slicing by row and class, and flipping the class.
  - id: lime
    label: LIME
    description: A simple weighted surrogate fitted to perturbations around one row.
  - id: counterfactuals
    label: Counterfactuals
    description: Nearby inputs that flip the prediction; valid vs plausible vs actionable.
  - id: honest-reading
    label: Reading explanations honestly
    description: Name the class, distrust correlated credit, and never read an explanation as causal.
requires:
  widgets: [Tree, Matrix, Chart, StepPlayer, Readout, Choice, Slider, Formula, DropBins, Callout]
authoring:
  generatedBy: Claude
  generatedAt: '2026-10-05'
  notes: |
    Built from the Session 6 (partial) and Session 7 instructor notebooks on Breast Cancer Wisconsin with a 300-tree random forest. There is no deck. The forest, SHAP's TreeExplainer, LIME and DiCE cannot run in the browser, so their outputs are shown verbatim and every mechanism is taught on hand-sized toys: two depth-2 trees on ten tumours (radius and area are exact twins), the notebook's own 3-feature Shapley table, a 1-D LIME fit, and a linear counterfactual model. v1.1.0 (2026-10-05): rewritten in plain language for learners who start from zero; guide edition 2 (every term defined where it first appears, new basic terms such as decision tree, random forest, predicted probability, test set and linear model, practice and reflect gates, tryIt, quiz hints). No ids changed.
    v1.2.0 (learner review 2026-10-05): predict answers hidden until after each gate; waterfall reading taught on the
    three-feature example (the notebook's per-feature SHAP values for patient 205 are not in the source notes, so none
    are shown or quoted); new shap-reading skill so the SHAP section follows the waterfall scene; LIME live example
    uses seven copies so the kernel width matters; LIME and counterfactual objectives in plain words; background data,
    correlation, quartile bins and feature prefixes taught; Application LIME/SHAP decision corrected; loan-model
    transfer and level-3 templates added; session numbers removed from learner text.
    v1.2.1 (re-audit): shuffle index k (not π) in the twins formula; full chart-abbreviation key; background-data beat no
    longer names SHAP before it is defined; size-weighted Gini worked arithmetic uses 4/9.
guide: 2
objectives:
  - id: pick-the-scope
    text: |
      Tell whether a "why" question is about the whole model or one prediction, and name a tool that answers it.
    skills:
      - global-local
  - id: rank-features
    text: |
      Compute built-in and permutation importance on a small tree, and explain why look-alike features distort both.
    skills:
      - impurity-importance
      - permutation-importance
      - correlation-trap
  - id: explain-one-case
    text: |
      Build a partial dependence point, Shapley values and a counterfactual by hand, and say what LIME's line means.
    skills:
      - pdp
      - shapley
      - shap-reading
      - lime
      - counterfactuals
  - id: read-honestly
    text: 'Read any explanation correctly, naming the class it explains and never treating it as a cause.'
    skills:
      - honest-reading
