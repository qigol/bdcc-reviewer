templates:
  - id: gini-hand
    type: hand-calc
    skills: [impurity-importance]
    difficulty: 1
    tags: [math]
    generator: giniQ
    lessonRef: { tab: intuition, id: impurity-credit }
    prompt: |
      A split sends {=nL} training rows left ({=bL} benign, {=mL} malignant) and {=nR} rows right ({=bR} benign, {=mR} malignant).
      All {=N} training rows reach this node.
    steps:
      - prompt: Gini impurity of the node before the split
        answer: { var: giniT, tol: 0.005 }
        hint: 'Use the node''s shares of benign and malignant: 1 − p_B² − p_M².'
      - prompt: 'Size-weighted Gini of the two children'
        answer: { var: child, tol: 0.005 }
        misconceptions:
          - { var: wrongChildMean, feedback: 'That is the plain average of the two Ginis. Weight each child by its share of the node''s rows, N_L/N_t and N_R/N_t, not ½ each.' }
        hint: 'Work out each child''s Gini, then weight each by its share of the node''s cases.'
      - prompt: Impurity decrease credited to this split
        answer: { var: decrease, tol: 0.005 }
        misconceptions:
          - { var: wrongNoChildWeights, feedback: 'Use the size-weighted children''s Gini from the step before, not their plain average.' }
        hint: 'Node Gini minus the weighted children''s Gini.'
    hints:
      - Gini measures how mixed a group is. Start with the group before the split.
    explanation: |
      Node: {=b} benign, {=m} malignant, so $1 - p_B^2 - p_M^2 = {=giniT|3}$. The two groups, weighted by size:
      $\tfrac{ {=nL} }{ {=nt} }({=giniL|3}) + \tfrac{ {=nR} }{ {=nt} }({=giniR|3}) = {=child|3}$. Reduction $= {=giniT|3} - {=child|3} = {=decrease|3}$.

  - id: impurity-decrease
    type: numeric
    skills: [impurity-importance]
    difficulty: 2
    tags: [math]
    generator: giniQ
    lessonRef: { tab: math-code, id: impurity-importance }
    prompt: |
      A question deep in a tree is reached by {=nt} of the tree's {=N} training cases ({=b} benign, {=m} malignant). It sends
      {=nL} cases left ({=bL} B, {=mL} M) and {=nR} right ({=bR} B, {=mR} M). How much weighted mixing reduction does it add
      to its feature?
    answer: { var: decrease, tol: 0.005 }
    misconceptions:
      - {var: wrongNoNodeWeight, feedback: 'Multiply by N_t/N: a question that sees only part of the data earns that much less.'}
      - {var: wrongNoChildWeights, feedback: 'Weight the two groups by their size, not ½ each.'}
    hints:
      - First compute the Gini of the node and of each child group.
      - Mixing reduction = node Gini − (size-weighted Gini of the children).
      - 'Finally multiply by the share of all cases that reach this node, N_t ÷ N.'
    explanation: |
      $\tfrac{ {=nt} }{ {=N} }\big({=giniT|3} - {=child|3}\big) = {=decrease|4}$.

  - id: impurity-normalize
    type: numeric
    skills: [impurity-importance]
    difficulty: 1
    tags: [math]
    generator: impurityQ
    lessonRef: { tab: math-code, id: impurity-importance }
    prompt: |
      A tree's questions and how much each reduced the weighted mixing: {=splits}. What is the built-in importance of **{=target}**?
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 2 } }
    answer: { var: imp, tol: 0.005 }
    misconceptions:
      - {var: wrongRaw, feedback: 'Divide this feature''s total by the total over all features.'}
      - {var: wrongFirst, feedback: 'Add every question on this feature before dividing.'}
    hints:
      - Add up all the reductions from questions on this feature.
      - Divide that by the sum of the reductions for every feature.
    explanation: |
      This feature's total = {=raw|2}; total for all features = {=total|2}; importance = {=raw|2} ÷ {=total|2} = {=imp|3}.

  - id: builtin-limits
    type: multi
    skills: [impurity-importance, honest-reading]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: math-code, id: impurity-importance }
    prompt: What does built-in (impurity) importance **not** tell you? Select all that apply.
    options:
      - Whether larger values push towards benign or malignant
      - How well the model does on new data (it is worked out on the training data)
      - How much accuracy the feature is worth
      - 'Which features'' questions removed the most mixing'
    answer: [0, 1, 2]
    hints:
      - What three things would you want to know that a list of shares cannot tell you?
    explanation: |
      It only answers "what was the model built from?", as shares of mixing removed. No direction, no accuracy units,
      and it uses the training data only.


  - id: perm-numeric
    type: numeric
    skills: [permutation-importance]
    difficulty: 1
    tags: [math]
    generator: permQ
    lessonRef: { tab: math-code, id: permutation-importance }
    prompt: |
      The test {=metric} is {=base}. After shuffling one feature {=reps} times, the {=metric} values are {=shuffledList}. What is that feature's permutation importance? Give 3 decimal places.
    answer: { var: imp, tol: 0.001 }
    misconceptions:
      - { var: wrongSign, feedback: 'Importance is baseline − shuffled score, so a drop is positive.' }
      - { var: wrongFirst, feedback: 'Average over all repeats; one shuffle is luck.' }
    hints:
      - First average the shuffled scores.
      - Importance = original score − average shuffled score.
    explanation: |
      Average shuffled score {=meanShuffled|4}; importance = {=base} − {=meanShuffled|4} = {=imp|4}.

  - id: perm-negative
    type: mcq
    skills: [permutation-importance, correlation-trap]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: twins }
    prompt: A feature has permutation importance −0.0003. What should you do?
    options:
      - Treat it as noise near zero and look for twin features
      - Delete the feature, since shuffling it helped the model
      - 'Report that the feature lowers the model''s accuracy'
      - Re-run the shuffles until the value comes out positive
    answer: 0
    hints:
      - Could a shuffle make the score slightly better just by chance?
    explanation: |
      Shuffling made the score very slightly better by luck, often because a twin covered for it. It is not a reason to delete the feature.


  - id: builtin-vs-perm
    type: match
    skills: [impurity-importance, permutation-importance]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: math-code, id: permutation-importance }
    prompt: Complete the comparison of the two importances.
    pairs:
      -   - 'Built-in importance: data used'
          - The training data
      -   - 'Permutation importance: data used'
          - The test data
      -   - 'Built-in importance: units'
          - Shares of the total mixing removed
      -   - 'Permutation importance: units'
          - Drop in the chosen score
      -   - 'Built-in importance: cost'
          - 'Free: comes with the trained forest'
      -   - 'Permutation importance: cost'
          - Scoring the test set many times
    pick: 4
    explanation: |
      Built-in shows how the model was built; permutation shows what it needs on test data, in the score's own units.


  - id: perm-code
    type: code-fill
    skills: [permutation-importance]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: permutation-importance }
    prompt: Complete permutation importance.
    code: |
      def permutation_importance(model, X, y, score, perms):
          base = score(y, model.predict(X))
          result = {}
          for col in X.columns:
              drops = []
              for perm in perms:
                  X_shuf = X.copy()
                  X_shuf[col] = X[col].values[__BLANK_1__]
                  s = score(y, model.predict(X_shuf))
                  drops.append(__BLANK_2__)
              result[col] = np.mean(drops)
          return result
    blanks:
      '1': { accept: ['perm'] }
      '2': { accept: ['base - s', 'base-s'] }
    hints:
      - 'Which values get rearranged, and is the model retrained?'
    explanation: 'Rearrange one column, score again without retraining, and record original score − shuffled score.'

  - id: twins-mcq
    type: mcq
    skills: [correlation-trap]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: twins }
    prompt: 'worst radius is 5th by built-in importance but 29th of 30 by permutation importance. The best explanation?'
    options:
      - Its look-alikes carry the same information, so shuffling it alone costs little
      - Built-in importance is unreliable and should simply be ignored
      - 'Worst radius only matters on the training data, so it is overfit'
      - Permutation importance cannot handle features measured in numbers
    answer: 0
    hints:
      - What happens when you scramble one twin but the model can still read the others?
    explanation: |
      Built-in importance shares credit between twins; permutation importance can wipe it out, because the model still sees the other twins.


  - id: twins-multi
    type: multi
    skills: [correlation-trap, honest-reading]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: correlated-twins }
    prompt: Two features are near-perfect twins. Which statements are true?
    options:
      - Built-in importance tends to share the credit between them
      - Shuffling one of them can leave the score almost unchanged
      - Shuffling both together can reveal the information they share
      - Their SHAP values can be added up as separate evidence
      - A PDP that sets one twin can create cases that could never exist
    answer: [0, 1, 2, 4]
    hints:
      - 'Think about built-in importance, shuffling, SHAP and PDPs one at a time.'
    explanation: |
      Twins share credit (built-in, SHAP), hide each other (shuffling), and make PDPs and counterfactuals produce impossible cases.


  - id: pdp-numeric
    type: numeric
    skills: [pdp]
    difficulty: 1
    tags: [math]
    generator: pdpQ
    lessonRef: { tab: math-code, id: partial-dependence }
    prompt: 'Model: {=rule}. Compute the partial dependence on radius at **radius = {=v}** over the cases below.'
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0 } }
    answer: { var: pd, tol: 0.005 }
    misconceptions:
      - {var: wrongOwn, feedback: 'You averaged the answers at each case''s own radius. A PDP gives every case the same radius v.'}
      - {var: wrongSingle, feedback: 'Average over all the cases, not just one.'}
    hints:
      - Give every case the radius v and keep its other features.
      - 'Run each changed case through the rule, then average the answers.'
    explanation: 'With every radius set to {=v}, the model''s answers are ({=ps|list}); their average is {=pd|3}.'
  - id: pdp-hand
    type: hand-calc
    skills: [pdp]
    difficulty: 2
    tags: [math]
    generator: pdpQ
    lessonRef: { tab: intuition, id: pdp-sweep }
    prompt: 'Model: {=rule}. Build one PDP point at radius = {=v}.'
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0 } }
    steps:
      - prompt: 'Answer for R1 with its radius set to {=v} (its texture is {=r1tex})'
        answer: { var: p1, tol: 0.005 }
        hint: 'Follow the rule with radius = v and R1''s own texture.'
      - prompt: 'The PDP value at {=v} (the average over all cases)'
        answer: { var: pd, tol: 0.005 }
        misconceptions:
          - { var: wrongOwn, feedback: 'Force every row to radius {=v}; do not use their own radii.' }
        hint: 'Do the same for every case, then average.'
    hints:
      - Every case gets the same radius; only their other features differ.
    explanation: 'Answers with radius set to {=v}: ({=ps|list}); average {=pd|3}.'
  - id: pdp-read
    type: mcq
    skills: [pdp, honest-reading]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: pdp-sweep }
    prompt: 'A PDP of P(class 1 = benign) against worst concave points slopes downward. What does it say?'
    options:
      - 'On average, this model gives a lower benign probability at more concave points'
      - More concave points cause a tumour to become malignant
      - Every patient's benign probability falls as concave points rise
      - Concave points is the most important feature in the model
    answer: 0
    hints:
      - 'A PDP is an average of the model''s answers. Does it say anything about causes or about each patient?'
    explanation: |
      A PDP is an average statement about the model. It is not about causes, not about each patient, and not a ranking.


  - id: pdp-caveats
    type: multi
    skills: [pdp, honest-reading]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: partial-dependence }
    prompt: Which are genuine limitations of a PDP? Select all that apply.
    options:
      - 'It averages, so two groups moving in opposite directions can cancel out to a flat line'
      - Setting one feature while the others stay put can create impossible cases
      - The ends of the curve may rest on very few real cases
      - It cannot show direction
      - It is not causal
    answer: [0, 1, 2, 4]
    hints:
      - 'One option names exactly what a PDP is good for, not a limitation.'
    explanation: |
      Direction is exactly what a PDP adds over importance. Its limits are averaging, impossible cases, few cases at the ends, and no causes.


  - id: pdp-code
    type: code-fill
    skills: [pdp]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: partial-dependence }
    prompt: Complete the partial dependence loop.
    code: |
      def partial_dependence(model, X, feature, grid):
          curve = []
          for v in grid:
              X_forced = X.copy()
              X_forced[feature] = __BLANK_1__
              p = model.predict_proba(X_forced)[:, 1]
              curve.append(p.__BLANK_2__())
          return np.array(curve)
    blanks:
      '1': { accept: ['v'] }
      '2': { accept: ['mean'] }
    hints:
      - Every row gets the same value. Which column changes?
    explanation: Every row gets the same value v; the PDP point is the average predicted P(class 1).

  - id: shapley-2
    type: numeric
    skills: [shapley]
    difficulty: 1
    tags: [math]
    generator: shapleyQ
    lessonRef: { tab: math-code, id: shapley-orderings }
    prompt: |
      Two features. The model answers v(none) = {=vNone}, v(A) = {=vA}, v(B) = {=vB}, v(A and B) = {=vAB}. What is A's Shapley value?
    answer: { var: phiA, tol: 0.005 }
    misconceptions:
      - {var: wrongFirst, feedback: 'That is what A adds only when it comes first. Average it with what A adds when it joins after B.'}
      - {var: wrongLast, feedback: 'That is what A adds only when it comes last. Average over both orders.'}
    hints:
      - 'There are two orders: A then B, or B then A.'
      - 'A first: v(A) − v(none). A second: v(A and B) − v(B). Average the two.'
    explanation: |
      Order A then B: A adds $v(A) - v(\text{none}) = {=vA} - {=vNone}$. Order B then A: A adds $v(AB) - v(B) = {=vAB} - {=vB}$.
      Average: $\phi_A = {=phiA|3}$.

  - id: shapley-hand
    type: hand-calc
    skills: [shapley]
    difficulty: 2
    tags: [math]
    generator: shapleyQ
    lessonRef: { tab: intuition, id: fair-split }
    prompt: 'v(none) = {=vNone}, v(A) = {=vA}, v(B) = {=vB}, v(A and B) = {=vAB}. Compute φ_A over both orders.'
    steps:
      - prompt: "What A adds when A comes first"
        answer: { var: wrongFirst, tol: 0.005 }
        hint: v(A) − v(none).
      - prompt: "What A adds when A comes second"
        answer: { var: wrongLast, tol: 0.005 }
        hint: v(A and B) − v(B).
      - prompt: 'φ_A'
        answer: { var: phiA, tol: 0.005 }
        hint: Average the two.
      - prompt: 'φ_A + φ_B (it should equal v(A and B) − v(none))'
        answer: { var: sumCheck, tol: 0.005 }
        hint: Work out φ_B the same way and add.
    hints:
      - Write down both orders first.
    explanation: |
      $\phi_A = \tfrac12[({=vA} - {=vNone}) + ({=vAB} - {=vB})] = {=phiA|3}$; $\phi_B = {=phiB|3}$; their sum ${=sumCheck|3} = {=vAB} - {=vNone}$.

  - id: shapley-3
    type: numeric
    skills: [shapley]
    difficulty: 3
    tags: [math]
    generator: shapleyQ
    lessonRef: { tab: math-code, id: shapley-formula }
    prompt: |
      Three features. v(none) = {=vNone}, v(A) = {=vA}, v(B) = {=vB}, v(C) = {=vC}, v(AB) = {=vAB}, v(AC) = {=vAC},
      v(BC) = {=vBC}, v(ABC) = {=vABC}. Compute φ_A.
    answer: { var: phiA, tol: 0.005 }
    misconceptions:
      - {var: wrongFirst, feedback: "That is only the \"A first\" order. Use weights 1/3, 1/6, 1/6, 1/3 for \"known before A\" = none, B, C, both.\n"}
      - {var: wrongLast, feedback: 'That is only the "A last" order. Average over all four sets with the Shapley weights.'}
    hints:
      - 'Four cases for what is known before A: nothing, only B, only C, or B and C.'
      - 'Their weights are 1/3, 1/6, 1/6 and 1/3.'
      - 'For each case, A adds v(with A) − v(without A).'
    explanation: |
      $\phi_A = \tfrac13(v_A - v_{\text{none}}) + \tfrac16(v_{AB} - v_B) + \tfrac16(v_{AC} - v_C) + \tfrac13(v_{ABC} - v_{BC}) = {=phiA|3}$.

  - id: shapley-weights-match
    type: match
    skills: [shapley]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: shapley-formula }
    prompt: 'Match each piece of the Shapley formula $\phi_j = \sum_S \frac{|S|!\,(|F|-|S|-1)!}{|F|!}[v(S \cup \{j\}) - v(S)]$ to what it counts.'
    pairs:
      - ['$|S|!$', 'Orderings of the features already known before j']
      - ['$(|F| - |S| - 1)!$', 'Orderings of the features that come after j']
      - ['$|F|!$', 'All orderings of the features']
      - ['$v(S \cup \{j\}) - v(S)$', 'How much the prediction moved when j joined']
    hints:
      - '"n!" counts the orders of n things.'
    explanation: |
      The weight is the share of all orders in which exactly the features in S come before j, so every order counts once.


  - id: additivity-missing
    type: numeric
    skills: [shap-reading, shapley]
    difficulty: 2
    tags: [math]
    generator: additivityQ
    lessonRef: { tab: math-code, id: shap-additivity }
    prompt: |
      For one patient, the baseline is {=base} and the model predicts {=fx|2} for class 1 (benign). SHAP values: {=list}.
      What is the missing contribution of **{=missingName}**?
    answer: { var: missing, tol: 0.005 }
    misconceptions:
      - { var: wrongNoBase, feedback: 'Subtract the baseline too: prediction = baseline + all contributions.' }
      - { var: wrongSign, feedback: 'Check the sign: contributions must add up to prediction − baseline.' }
    hints:
      - Prediction = baseline + the sum of all contributions.
      - Missing = prediction − baseline − (sum of the known contributions).
    explanation: |
      Additivity: $f(x) = E[f(x)] + \sum \phi_j$, so the missing one is ${=fx|2} - {=base} - (\text{the others}) = {=missing|2}$.

  - id: class-flip
    type: numeric
    skills: [shap-reading, honest-reading]
    difficulty: 1
    tags: [intuition]
    generator: additivityQ
    lessonRef: { tab: intuition, id: waterfall }
    prompt: |
      Explaining class 1 (benign), {=firstName} has SHAP value {=first|2}. What is its SHAP value if you explain class 0 (malignant) instead?
    answer: { var: flipped, tol: 0.005 }
    misconceptions:
      - { var: first, feedback: 'Every sign flips when you switch class: P(malignant) = 1 − P(benign).' }
      - { var: baseMal, feedback: 'That is the class-0 baseline, not the contribution.' }
    hints:
      - P(malignant) = 1 − P(benign). What happens to each push?
    explanation: |
      With two classes, P(malignant) = 1 − P(benign), so every push flips: $\phi^{(0)} = -\phi^{(1)} = {=flipped|2}$. The
      model is unchanged; only the question changed.

  - id: shap-slice-code
    type: code-fill
    skills: [shap-reading, honest-reading]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: shap-additivity }
    prompt: Slice the SHAP values for patient `obs_pos`, all features, class 1 = benign, and check additivity.
    code: |
      explainer = shap.TreeExplainer(model)
      shap_values = explainer(X_test)          # (rows, features, classes)
      obs = shap_values[obs_pos, :, __BLANK_1__]
      base = float(obs.base_values)
      total = float(obs.values.__BLANK_2__())
      assert abs(base + total - y_proba[obs_pos]) < 1e-6
    blanks:
      '1': { accept: ['1'] }
      '2': { accept: ['sum'] }
    hints:
      - The last axis of the SHAP array is the class.
    explanation: The last axis is the class. Baseline + sum of contributions must equal the model's P(benign).

  - id: lime-slope
    type: numeric
    skills: [lime]
    difficulty: 2
    tags: [math]
    generator: limeQ
    lessonRef: { tab: math-code, id: lime-surrogate }
    prompt: |
      LIME (one feature) asked the real model about three changed copies and weighted them by closeness (table). Compute the weighted straight-line slope.
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 2 } }
    answer: { var: b, tol: 0.005 }
    misconceptions:
      - {var: unweighted, feedback: 'You ignored the weights. Use weighted averages and weighted sums.'}
      - { var: wrongEnds, feedback: 'That is the slope between the two end points only.' }
    hints:
      - 'First the weighted averages: x̄ = Σwx ÷ Σw and ȳ = Σwy ÷ Σw.'
      - Then b = Σw(x − x̄)(y − ȳ) ÷ Σw(x − x̄)².
    explanation: |
      Weighted averages: $\bar x = {=xbar|3}$, $\bar y = {=ybar|3}$. Slope
      $b = \frac{\sum w(x - \bar x)(y - \bar y)}{\sum w (x - \bar x)^2} = \frac{ {=sxy|4} }{ {=sxx|4} } = {=b|3}$.

  - id: lime-mcq
    type: mcq
    skills: [lime]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: local-line }
    prompt: What is a LIME weight such as +0.047 for "worst texture ≤ 21.06"?
    options:
      - A weight in a small stand-in line fitted around this one case
      - The change in P(benign) caused by this patient's worst texture
      - 'The forest''s own internal weight for the worst texture feature'
      - 'How important worst texture is for the whole model overall'
    answer: 0
    hints:
      - LIME fits its own small model. Whose number is the weight?
    explanation: |
      LIME is a second model of the first one, built around one case using ranges like "≤ 21.06". Its weights are not
      changes in probability, can change between runs, and should be compared with SHAP only by order and sign.


  - id: lime-order
    type: order
    skills: [lime]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: math-code, id: lime-surrogate }
    prompt: Put LIME's procedure in order.
    items:
      - Make many slightly changed copies of the case to explain
      - Ask the original model to answer every copy
      - Weight each copy by how close it is to the original case
      - Fit a simple (straight-line) model to the weighted copies
      - 'Read the simple model''s weights as the explanation'
    explanation: 'Change, ask, weight, fit, read.'

  - id: lime-code
    type: code-fill
    skills: [lime]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: lime-surrogate }
    prompt: Complete the 1-D LIME slope.
    code: |
      def lime_slope(f, x0, deltas, sigma):
          z = x0 + np.array(deltas, dtype=float)
          y = __BLANK_1__(z)
          w = np.exp(-(z - x0) ** 2 / sigma ** 2)
          zb = np.average(z, weights=w)
          yb = np.average(y, weights=w)
          return np.sum(__BLANK_2__ * (z - zb) * (y - yb)) / np.sum(w * (z - zb) ** 2)
    blanks:
      '1': { accept: ['f'] }
      '2': { accept: ['w'] }
    hints:
      - 'Which model answers the copies, and what multiplies every sum?'
    explanation: 'The original model answers the changed copies, and every sum is weighted by closeness.'

  - id: cf-numeric
    type: numeric
