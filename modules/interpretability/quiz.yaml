  - id: lime-objective-mcq
    type: mcq
    skills: [lime]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: lime-surrogate }
    prompt: 'In LIME''s objective $\xi(x) = \arg\min_{g \in G} \mathcal{L}(f, g, \pi_x) + \Omega(g)$, what does $\Omega(g)$ do?'
    options:
      - It penalizes a complicated stand-in, keeping it simple to read
      - It weights each changed copy by how close it is to x
      - It measures how badly g copies the model f near x
      - It lists the family of simple models LIME may choose from
    answer: 0
    hints:
      - 'Match each symbol: G is the family, π_x the closeness weights, L the copying error.'
    explanation: |
      L measures how well g copies f near x, using the closeness weights π_x; G is the family of simple models; Ω(g) adds a
      cost for complexity, so the winning g stays simple enough to explain.

  - id: cf-lambda-mcq
    type: mcq
    skills: [counterfactuals]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: counterfactual-search }
    prompt: 'In the counterfactual objective $\arg\min_{x''} \text{loss}(f(x''), y_{\text{target}}) + \lambda\, d(x, x'')$, what happens if λ is made much larger?'
    options:
      - Staying close to x counts more, so x' moves less and may not flip
      - Flipping the class counts more, so x' may move as far as it needs
      - More features are allowed to change at the same time
      - The model is retrained with a stronger penalty on its weights
    answer: 0
    hints:
      - λ multiplies the distance term. What does a bigger multiplier make the search care about?
    explanation: |
      λ weighs closeness against reaching the wanted class. A large λ keeps x' near x, at the risk of not flipping; a small
      λ flips reliably but may wander far from the real case. The model itself never changes.
