templates:
  - id: gini-hand
    type: hand-calc
    skills: [impurity-importance]
    difficulty: 1
    tags: [math]
    generator: giniQ
    lessonRef: { tab: intuition, id: impurity-credit }
    prompt: |
      A split sends {=nL} training rows left ({=bL} benign, {=mL} malignant) and {=nR} rows right ({=bR} benign, {=mR} malignant).
      All {=N} training rows reach this node.
    steps:
      - prompt: Gini impurity of the node before the split
        answer: { var: giniT, tol: 0.005 }
      - prompt: 'Size-weighted Gini of the two children'
        answer: { var: child, tol: 0.005 }
        misconceptions:
          - { var: wrongNoChildWeights, feedback: 'Weight each child by its share of the node''s rows, N_L/N_t and N_R/N_t, not ½ each.' }
      - prompt: Impurity decrease credited to this split
        answer: { var: decrease, tol: 0.005 }
    explanation: |
      Node: {=b} B, {=m} M → $1 - p_B^2 - p_M^2 = {=giniT|3}$. Children: $\tfrac{ {=nL} }{ {=nt} }({=giniL|3}) + \tfrac{ {=nR} }{ {=nt} }({=giniR|3}) = {=child|3}$.
      Decrease $= {=giniT|3} - {=child|3} = {=decrease|3}$.

  - id: impurity-decrease
    type: numeric
    skills: [impurity-importance]
    difficulty: 2
    tags: [math]
    generator: giniQ
    lessonRef: { tab: math-code, id: impurity-importance }
    prompt: |
      A split deep in a tree is reached by {=nt} of the tree's {=N} training rows ({=b} benign, {=m} malignant). It sends
      {=nL} rows left ({=bL} B, {=mL} M) and {=nR} right ({=bR} B, {=mR} M). What weighted impurity decrease does it add to its feature?
    answer: { var: decrease, tol: 0.005 }
    misconceptions:
      - { var: wrongNoNodeWeight, feedback: 'Multiply by N_t/N: a split that sees only part of the data earns proportionally less.' }
      - { var: wrongNoChildWeights, feedback: 'Weight the children by size, not ½ each.' }
    explanation: |
      $\tfrac{ {=nt} }{ {=N} }\big({=giniT|3} - {=child|3}\big) = {=decrease|4}$.

  - id: impurity-normalize
    type: numeric
    skills: [impurity-importance]
    difficulty: 1
    tags: [math]
    generator: impurityQ
    lessonRef: { tab: math-code, id: impurity-importance }
    prompt: |
      A tree's splits and their weighted impurity decreases: {=splits}. What is the built-in importance of **{=target}**?
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 2 } }
    answer: { var: imp, tol: 0.005 }
    misconceptions:
      - { var: wrongRaw, feedback: 'Normalize: divide the feature''s summed decrease by the total over all features.' }
      - { var: wrongFirst, feedback: 'Add every split on this feature before dividing.' }
    explanation: |
      raw({=target}) = {=raw|2}; total = {=total|2}; importance = {=raw|2} / {=total|2} = {=imp|3}.

  - id: builtin-limits
    type: multi
    skills: [impurity-importance, honest-reading]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: math-code, id: impurity-importance }
    prompt: What does built-in (impurity) importance **not** tell you? Select all that apply.
    options:
      - Whether larger values push towards benign or malignant
      - How the model generalizes to new data (it is computed on training data)
      - How much accuracy the feature is worth
      - Which features the model's splits used most
    answer: [0, 1, 2]
    explanation: It answers only "what did the model build itself out of?" in shares of impurity reduction. No direction, no accuracy units, training data only.

  - id: perm-numeric
    type: numeric
    skills: [permutation-importance]
    difficulty: 1
    tags: [math]
    generator: permQ
    lessonRef: { tab: math-code, id: permutation-importance }
    prompt: |
      Test {=metric} is {=base}. After shuffling one feature {=reps} times, the {=metric} values are {=shuffledList}.
      What is that feature's permutation importance?
    answer: { var: imp, tol: 0.001 }
    misconceptions:
      - { var: wrongSign, feedback: 'Importance is baseline − shuffled score, so a drop is positive.' }
      - { var: wrongFirst, feedback: 'Average over all repeats; one shuffle is luck.' }
    explanation: |
      Mean shuffled score {=meanShuffled|4}; importance = {=base} − {=meanShuffled|4} = {=imp|4}.

  - id: perm-negative
    type: mcq
    skills: [permutation-importance, correlation-trap]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: twins }
    prompt: A feature has permutation importance −0.0003. What should you do?
    options:
      - 'Treat it as noise around zero; check for correlated twins before concluding anything'
      - Delete the feature because it hurts the model
      - Report that the feature lowers the model's accuracy
      - Re-run until the value is positive
    answer: 0
    explanation: Shuffling made the score marginally better by chance, often because a twin covered for it. It is not a signal to delete.

  - id: builtin-vs-perm
    type: match
    skills: [impurity-importance, permutation-importance]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: math-code, id: permutation-importance }
    prompt: Complete the Session 6 comparison of the two importances.
    pairs:
      - ['Built-in importance: data used', 'The training data']
      - ['Permutation importance: data used', 'Held-out (test) data']
      - ['Built-in importance: units', 'Shares of the total impurity reduction']
      - ['Permutation importance: units', 'Loss in the chosen metric']
      - ['Built-in importance: cost', 'Free: comes with the fitted forest']
      - ['Permutation importance: cost', 'Re-scoring the held-out set many times']
    pick: 4
    explanation: Built-in describes how the model was built; permutation describes what it needs on held-out data, in metric units.

  - id: perm-code
    type: code-fill
    skills: [permutation-importance]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: permutation-importance }
    prompt: Complete permutation importance.
    code: |
      def permutation_importance(model, X, y, score, perms):
          base = score(y, model.predict(X))
          result = {}
          for col in X.columns:
              drops = []
              for perm in perms:
                  X_shuf = X.copy()
                  X_shuf[col] = X[col].values[__BLANK_1__]
                  s = score(y, model.predict(X_shuf))
                  drops.append(__BLANK_2__)
              result[col] = np.mean(drops)
          return result
    blanks:
      '1': { accept: ['perm'] }
      '2': { accept: ['base - s', 'base-s'] }
    explanation: Reorder one column with the permutation, re-score without refitting, and record baseline − shuffled score.

  - id: twins-mcq
    type: mcq
    skills: [correlation-trap]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: twins }
    prompt: 'worst radius is 5th by built-in importance but 29th of 30 by permutation importance. The best explanation?'
    options:
      - 'Its near-duplicates (worst perimeter, worst area) carry the same signal, so shuffling it alone costs almost nothing'
      - Built-in importance is wrong and should be ignored
      - worst radius only matters on the training data, so it is overfit
      - Permutation importance cannot handle continuous features
    answer: 0
    explanation: Built-in importance splits credit between twins; permutation importance can erase it, because the model recovers through the twins.

  - id: twins-multi
    type: multi
    skills: [correlation-trap, honest-reading]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: correlated-twins }
    prompt: Two features are near-perfect twins. Which statements are true?
    options:
      - Built-in importance tends to split the credit between them
      - Shuffling one of them can leave the score almost unchanged
      - Shuffling both together can reveal the signal they share
      - Their SHAP values can be added up as independent evidence
      - A PDP that forces one twin can create rows that could never exist
    answer: [0, 1, 2, 4]
    explanation: Twins split credit (built-in, SHAP), hide each other (permutation), and break PDPs and counterfactuals by producing impossible combinations.

  - id: pdp-numeric
    type: numeric
    skills: [pdp]
    difficulty: 1
    tags: [math]
    generator: pdpQ
    lessonRef: { tab: math-code, id: partial-dependence }
    prompt: |
      Model: {=rule}. Compute the partial dependence on radius at **radius = {=v}** over the rows below.
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0 } }
    answer: { var: pd, tol: 0.005 }
    misconceptions:
      - { var: wrongOwn, feedback: 'You averaged the predictions at each row''s own radius. A PDP forces every row to the same radius v.' }
      - { var: wrongSingle, feedback: 'Average over all rows, not just one.' }
    explanation: |
      With every radius set to {=v}, the predictions are ({=ps|list}); their mean is {=pd|3}.

  - id: pdp-hand
    type: hand-calc
    skills: [pdp]
    difficulty: 2
    tags: [math]
    generator: pdpQ
    lessonRef: { tab: intuition, id: pdp-sweep }
    prompt: 'Model: {=rule}. Build one PDP point at radius = {=v}.'
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 0 } }
    steps:
      - prompt: 'Prediction for R1 with its radius forced to {=v} (its texture is {=r1tex})'
        answer: { var: p1, tol: 0.005 }
      - prompt: 'The PDP value at {=v} (average over all rows)'
        answer: { var: pd, tol: 0.005 }
        misconceptions:
          - { var: wrongOwn, feedback: 'Force every row to radius {=v}; do not use their own radii.' }
    explanation: |
      Forced predictions ({=ps|list}), average {=pd|3}.

  - id: pdp-read
    type: mcq
    skills: [pdp, honest-reading]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: pdp-sweep }
    prompt: 'A PDP of P(class 1 = benign) against worst concave points slopes downward. What does it say?'
    options:
      - 'On average, when this model sees more concave points it predicts a lower benign probability'
      - More concave points cause malignancy
      - Every patient's benign probability falls as concave points rise
      - Concave points is the most important feature
    answer: 0
    explanation: 'A PDP is an average statement about the model: not causal, not per patient, and not a ranking.'

  - id: pdp-caveats
    type: multi
    skills: [pdp, honest-reading]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: partial-dependence }
    prompt: Which are genuine limitations of a PDP (Session 6)? Select all that apply.
    options:
      - It averages, so two subgroups moving in opposite directions can cancel to a flat line
      - Forcing one feature while others stay put can create impossible rows
      - The ends of the curve may rest on very few real rows
      - It cannot show direction
      - It is not causal
    answer: [0, 1, 2, 4]
    explanation: Direction is exactly what a PDP adds over importance. Its limits are averaging, impossible rows, thin data at the ends, and no causality.

  - id: pdp-code
    type: code-fill
    skills: [pdp]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: partial-dependence }
    prompt: Complete the partial dependence loop.
    code: |
      def partial_dependence(model, X, feature, grid):
          curve = []
          for v in grid:
              X_forced = X.copy()
              X_forced[feature] = __BLANK_1__
              p = model.predict_proba(X_forced)[:, 1]
              curve.append(p.__BLANK_2__())
          return np.array(curve)
    blanks:
      '1': { accept: ['v'] }
      '2': { accept: ['mean'] }
    explanation: Every row gets the same value v; the PDP point is the mean of the predicted P(class 1).

  - id: shapley-2
    type: numeric
    skills: [shapley]
    difficulty: 1
    tags: [math]
    generator: shapleyQ
    lessonRef: { tab: math-code, id: shapley-orderings }
    prompt: |
      Two features. The model outputs v(∅) = {=vNone}, v(A) = {=vA}, v(B) = {=vB}, v(A, B) = {=vAB}.
      What is A's Shapley value?
    answer: { var: phiA, tol: 0.005 }
    misconceptions:
      - { var: wrongFirst, feedback: 'That is A''s contribution only when it comes first. Average it with A''s contribution when it joins after B.' }
      - { var: wrongLast, feedback: 'That is A''s contribution only when it comes last. Average over both orders.' }
    explanation: |
      Order A, B: $v(A) - v(\varnothing) = {=vA} - {=vNone}$. Order B, A: $v(AB) - v(B) = {=vAB} - {=vB}$. Average: $\phi_A = {=phiA|3}$.

  - id: shapley-hand
    type: hand-calc
    skills: [shapley]
    difficulty: 2
    tags: [math]
    generator: shapleyQ
    lessonRef: { tab: intuition, id: fair-split }
    prompt: 'v(∅) = {=vNone}, v(A) = {=vA}, v(B) = {=vB}, v(A, B) = {=vAB}. Compute φ_A over both orderings.'
    steps:
      - prompt: "A's marginal contribution when A comes first"
        answer: { var: wrongFirst, tol: 0.005 }
      - prompt: "A's marginal contribution when A comes second"
        answer: { var: wrongLast, tol: 0.005 }
      - prompt: 'φ_A'
        answer: { var: phiA, tol: 0.005 }
      - prompt: 'φ_A + φ_B (it should equal v(A, B) − v(∅))'
        answer: { var: sumCheck, tol: 0.005 }
    explanation: |
      $\phi_A = \tfrac12[({=vA} - {=vNone}) + ({=vAB} - {=vB})] = {=phiA|3}$; $\phi_B = {=phiB|3}$; their sum ${=sumCheck|3} = {=vAB} - {=vNone}$.

  - id: shapley-3
    type: numeric
    skills: [shapley]
    difficulty: 3
    tags: [math]
    generator: shapleyQ
    lessonRef: { tab: math-code, id: shapley-formula }
    prompt: |
      Three features. v(∅) = {=vNone}, v(A) = {=vA}, v(B) = {=vB}, v(C) = {=vC}, v(AB) = {=vAB}, v(AC) = {=vAC},
      v(BC) = {=vBC}, v(ABC) = {=vABC}. Compute φ_A.
    answer: { var: phiA, tol: 0.005 }
    misconceptions:
      - { var: wrongFirst, feedback: 'Only the "A first" ordering. Use weights 1/3, 1/6, 1/6, 1/3 over S = ∅, {B}, {C}, {B, C}.' }
      - { var: wrongLast, feedback: 'Only the "A last" ordering. Average over all subsets with the Shapley weights.' }
    explanation: |
      $\phi_A = \tfrac13(v_A - v_\varnothing) + \tfrac16(v_{AB} - v_B) + \tfrac16(v_{AC} - v_C) + \tfrac13(v_{ABC} - v_{BC}) = {=phiA|3}$.

  - id: shapley-weights-match
    type: match
    skills: [shapley]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: shapley-formula }
    prompt: 'Match each piece of the Shapley formula $\phi_j = \sum_S \frac{|S|!\,(|F|-|S|-1)!}{|F|!}[f(S \cup \{j\}) - f(S)]$ to what it counts.'
    pairs:
      - ['$|S|!$', 'Orderings of the features already known before j']
      - ['$(|F| - |S| - 1)!$', 'Orderings of the features that come after j']
      - ['$|F|!$', 'All orderings of the features']
      - ['$f(S \cup \{j\}) - f(S)$', 'How much the prediction moved when j joined']
    explanation: The weight is the fraction of all orderings in which exactly S precedes j, so every ordering counts once.

  - id: additivity-missing
    type: numeric
    skills: [shapley]
    difficulty: 2
    tags: [math]
    generator: additivityQ
    lessonRef: { tab: math-code, id: shap-additivity }
    prompt: |
      For one patient, the baseline E[f(x)] is {=base} and the model predicts {=fx|2} for class 1 (benign). SHAP values: {=list}.
      What is the missing contribution of **{=missingName}**?
    answer: { var: missing, tol: 0.005 }
    misconceptions:
      - { var: wrongNoBase, feedback: 'Subtract the baseline too: prediction = baseline + all contributions.' }
      - { var: wrongSign, feedback: 'Check the sign: contributions must add up to prediction − baseline.' }
    explanation: |
      Additivity: $f(x) = E[f(x)] + \sum \phi_j$, so the missing one is ${=fx|2} - {=base} - (\text{the others}) = {=missing|2}$.

  - id: class-flip
    type: numeric
    skills: [shapley, honest-reading]
    difficulty: 1
    tags: [intuition]
    generator: additivityQ
    lessonRef: { tab: intuition, id: waterfall }
    prompt: |
      Explaining class 1 (benign), {=firstName} has SHAP value {=first|2}. What is its SHAP value if you explain class 0 (malignant) instead?
    answer: { var: flipped, tol: 0.005 }
    misconceptions:
      - { var: first, feedback: 'Every sign flips when you switch class: P(malignant) = 1 − P(benign).' }
      - { var: baseMal, feedback: 'That is the class-0 baseline, not the contribution.' }
    explanation: |
      For a binary classifier, $\phi_j^{(0)} = -\phi_j^{(1)} = {=flipped|2}$. The model is unchanged; only the question changed.

  - id: shap-slice-code
    type: code-fill
    skills: [shapley, honest-reading]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: shap-additivity }
    prompt: Slice the SHAP values for patient `obs_pos`, all features, class 1 = benign, and check additivity.
    code: |
      explainer = shap.TreeExplainer(model)
      shap_values = explainer(X_test)          # (rows, features, classes)
      obs = shap_values[obs_pos, :, __BLANK_1__]
      base = float(obs.base_values)
      total = float(obs.values.__BLANK_2__())
      assert abs(base + total - y_proba[obs_pos]) < 1e-6
    blanks:
      '1': { accept: ['1'] }
      '2': { accept: ['sum'] }
    explanation: The last axis is the class. Baseline + sum of contributions must equal the model's P(benign).

  - id: lime-slope
    type: numeric
    skills: [lime]
    difficulty: 2
    tags: [math]
    generator: limeQ
    lessonRef: { tab: math-code, id: lime-surrogate }
    prompt: |
      LIME (1-D) scored three perturbations with the original model and weighted them by proximity (table). Compute the
      weighted least-squares slope.
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 2 } }
    answer: { var: b, tol: 0.005 }
    misconceptions:
      - { var: unweighted, feedback: 'You ignored the weights. Use weighted means and weighted sums.' }
      - { var: wrongEnds, feedback: 'That is the slope between the two end points only.' }
    explanation: |
      $\bar x = {=xbar|3}$, $\bar y = {=ybar|3}$; $b = \frac{\sum w(x - \bar x)(y - \bar y)}{\sum w (x - \bar x)^2} = \frac{ {=sxy|4} }{ {=sxx|4} } = {=b|3}$.

  - id: lime-mcq
    type: mcq
    skills: [lime]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: local-line }
    prompt: What is a LIME weight such as +0.047 for "worst texture ≤ 21.06"?
    options:
      - 'A coefficient of a simple weighted model fitted around this one row; compare it with SHAP only by rank and sign'
      - The change in P(benign) caused by worst texture
      - The forest's own internal weight for worst texture
      - The feature's global importance
    answer: 0
    explanation: LIME is a second model of the first one, local to one row, on binned conditions; its weights are not probability shifts and are not stable across runs.

  - id: lime-order
    type: order
    skills: [lime]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: math-code, id: lime-surrogate }
    prompt: Put LIME's procedure in order.
    items:
      - Generate many perturbed copies of the row to explain
      - Score every perturbed copy with the original model
      - Weight each copy by its closeness to the original row
      - Fit a simple (linear) model to the weighted copies
      - Read the simple model's coefficients as the explanation
    explanation: Perturb, score, weight, fit, read.

  - id: lime-code
    type: code-fill
    skills: [lime]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: lime-surrogate }
    prompt: Complete the 1-D LIME slope.
    code: |
      def lime_slope(f, x0, deltas, sigma):
          z = x0 + np.array(deltas, dtype=float)
          y = __BLANK_1__(z)
          w = np.exp(-(z - x0) ** 2 / sigma ** 2)
          zb = np.average(z, weights=w)
          yb = np.average(y, weights=w)
          return np.sum(__BLANK_2__ * (z - zb) * (y - yb)) / np.sum(w * (z - zb) ** 2)
    blanks:
      '1': { accept: ['f'] }
      '2': { accept: ['w'] }
    explanation: The original model scores the perturbations, and every sum is weighted by proximity.

  - id: cf-numeric
    type: numeric
    skills: [counterfactuals]
    difficulty: 2
    tags: [math]
    generator: cfQ
    lessonRef: { tab: math-code, id: counterfactual-search }
    prompt: |
      {=rule}. A case has x1 = {=x1}, x2 = {=x2}, so its score is {=s} (malignant). Holding the other feature fixed, what
      value of **{=feature}** puts the score exactly at 0?
    answer: { var: target, tol: 0.01 }
    misconceptions:
      - { var: wrongSign, feedback: 'Wrong direction: with a negative weight, the feature must go down to raise the score.' }
      - { var: wrongNoWeight, feedback: 'Divide the score gap by the feature''s weight.' }
    explanation: |
      The score must rise by {=s} → 0, and each unit of {=feature} changes it by its weight, so {=feature} moves by {=change|2} to {=target|2}.

  - id: cf-valid-plausible
    type: mcq
    skills: [counterfactuals, correlation-trap]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: flip-it }
    prompt: 'DiCE returns a counterfactual that halves worst perimeter (117.7 → 57.4) but leaves worst area at 989.5. The forest calls it benign. Which is true?'
    options:
      - 'It is valid (it flips the model) but not plausible: perimeter and area are geometrically locked'
      - 'It is valid and plausible, so it is a good treatment target'
      - 'It is invalid because the model is wrong'
      - 'It is causal evidence that perimeter drives malignancy'
    answer: 0
    explanation: Valid is not plausible, plausible is not actionable, and none of it is causal. `features_to_vary` cannot express which combinations are possible.

  - id: cf-terms-match
    type: match
    skills: [counterfactuals, honest-reading]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: math-code, id: counterfactual-search }
    prompt: Match each word to what it means for a counterfactual.
    pairs:
      - ['Valid', 'The model really does predict the other class for it']
      - ['Plausible', 'A row like it could exist in reality']
      - ['Actionable', 'A person could actually bring the change about']
      - ['Causal', 'Changing it in reality would change the outcome; never established by the model']
    explanation: Counterfactuals are valid by construction; plausibility and actionability must be checked separately; causality never follows.

  - id: method-match
    type: match
    skills: [global-local]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: global-or-local }
    prompt: Match each question to the tool built to answer it.
    pairs:
      - ['Which features did the model build itself out of?', 'Built-in importance']
      - ['Which features does it need to keep its test score?', 'Permutation importance']
      - ['How does the average prediction move as one feature grows?', 'Partial dependence plot']
      - ['How far did each feature push this prediction from the baseline?', 'SHAP']
      - ['What matters right around this one row, in a simple model?', 'LIME']
      - ['What would have to change for this prediction to flip?', 'Counterfactual (DiCE)']
    pick: 5
    explanation: The first three are global (the whole model); the last three are local (one prediction).

  - id: scope-mcq
    type: mcq
    skills: [global-local]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: global-or-local }
    prompt: A patient asks why her result came out malignant. A colleague shows her the PDP of worst radius. What is wrong?
    options:
      - 'Scope: a PDP is a global average over all rows, not an explanation of her prediction'
      - Nothing; the PDP explains every patient
      - PDPs can only be shown to auditors
      - The PDP should be replaced by built-in importance
    answer: 0
    explanation: Use a local method (SHAP, LIME, counterfactual) for one decision. Scope determines method.

  - id: causal-mcq
    type: mcq
    skills: [honest-reading]
    difficulty: 1
