  - id: honest-explain
    type: explain
    skills: [honest-reading]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: twins }
    prompt: A colleague writes "SHAP shows that high worst-area causes malignancy." Explain what is wrong with the claim and how to rewrite it honestly.
    model: |
      SHAP describes how the trained model's output responds to its inputs, not how tumours behave, so it can't show a cause.
      Correlated twins (radius, perimeter, area) also share credit, so one feature's bar may stand in for several. An honest
      version: "In this model, high worst-area pushes the predicted probability towards malignant for these patients; worst-area
      moves with radius and perimeter, so their effects can't be separated."
    checklist:
      - SHAP explains the model, not the real-world cause
      - Correlated twin features share or hide each other's credit
      - Rewrite in terms of the model's prediction
      - Mention the correlation with the twin features
    hints: ["What does SHAP perturb: the patient, or the model's inputs?"]
    explanation: Describe the model's behaviour, and name the twins that blur credit.

  - id: perm-parsons
    type: order
    skills: [permutation-importance]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: permutation-importance }
    prompt: Build the permutation-importance procedure from the bank. Two lines don't belong.
    items:
      - Score the trained model on the test set
      - Shuffle one feature's column in the test set
      - Score the model again on the shuffled data
      - Repeat the shuffle several times and average the scores
      - Importance = original score − mean shuffled score
    distractors:
      - Retrain the model without the feature
      - Shuffle the feature in the training set and refit
    hints: [The model is never retrained.]
    explanation: Score, shuffle one column, rescore, repeat and average, subtract. Retraining is drop-column importance, a different method.

