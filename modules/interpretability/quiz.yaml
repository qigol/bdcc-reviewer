      - 'Match each symbol: G is the family, π_x the closeness weights, L the copying error.'
    explanation: |
      L measures how well g copies f near x, using the closeness weights π_x; G is the family of simple models; Ω(g) adds a
      cost for complexity, so the winning g stays simple enough to explain.

  - id: cf-lambda-mcq
    type: mcq
    skills: [counterfactuals]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: counterfactual-search }
    prompt: 'In the counterfactual objective $\arg\min_{x''} \text{loss}(f(x''), y_{\text{target}}) + \lambda\, d(x, x'')$, what happens if λ is made much larger?'
    options:
      - Staying close to x counts more, so x' moves less and may not flip
      - Flipping the class counts more, so x' may move as far as it needs
      - More features are allowed to change at the same time
      - The model is retrained with a stronger penalty on its weights
    answer: 0
    optionFeedback:
      1: "That's what a small λ does."
      2: "λ weighs distance; it doesn't count how many features change."
      3: "The model never changes in a counterfactual search."
    hints:
      - λ multiplies the distance term. What does a bigger multiplier make the search care about?
    explanation: |
      λ weighs closeness against reaching the wanted class. A large λ keeps x' near x, at the risk of not flipping; a small
      λ flips reliably but may wander far from the real case. The model itself never changes.

  # ------------------------------------------------------------------ new formats (find-error, case, two-tier, explain, Parsons)
  - id: gini-find-error
    type: find-error
    skills: [impurity-importance]
    difficulty: 2
    tags: [math]
    generator: giniQ
    lessonRef: { tab: intuition, id: impurity-credit }
    prompt: |
      A split sends {=nL} rows left ({=bL} benign, {=mL} malignant) and {=nR} rows right ({=bR} benign, {=mR} malignant). A
      classmate works out the impurity decrease. **One step is wrong.** Click it and give the correct weighted children's Gini.
    steps:
      - 'Node Gini = 1 − p_B² − p_M² = {=giniT|3}'
      - 'Left Gini = {=giniL|3}, right Gini = {=giniR|3}'
      - 'Children''s Gini = ({=giniL|3} + {=giniR|3}) ÷ 2 = {=wrongChildMean|3}'
      - 'Decrease = node Gini − children''s Gini'
    wrong: 2
    fix: { var: child, tol: 0.005 }
    fixPrompt: What is the correct size-weighted children's Gini (three decimals)?
    misconceptions:
      - { var: wrongChildMean, feedback: "That's still the plain average. Weight each child by its share of the node's rows." }
    stepFeedback:
      0: The node's Gini from its class shares is right.
      1: Each child's own Gini is right.
      3: Node minus children is the right decrease, once the children are weighted.
    hints: [A child with more rows should count more.]
    explanation: 'Weighted: {=nL}/{=nt} × {=giniL|3} + {=nR}/{=nt} × {=giniR|3} = {=child|3}, so the decrease is {=decrease|3}.'

  - id: perm-case
    type: case
    skills: [permutation-importance, honest-reading]
    difficulty: 3
    tags: [math]
    generator: permQ
    lessonRef: { tab: math-code, id: permutation-importance }
    prompt: |
      **Score one feature by shuffling.** The model's test {=metric} is {=base}. Shuffling one feature {=reps} times gives
      {=shuffledList}.
    parts:
      - type: numeric
        prompt: Mean shuffled score (three decimals)
        answer: { var: meanShuffled, tol: 0.0005 }
        explanation: 'Mean of {=shuffledList} = {=meanShuffled|4}.'
      - type: numeric
        prompt: Permutation importance (four decimals)
        answer: { var: imp, tol: 0.0002 }
        misconceptions:
          - { var: wrongSign, feedback: 'Subtract the other way round: original score − mean shuffled score.' }
          - { var: wrongFirst, feedback: 'Average all the shuffles, not just the first one.' }
        explanation: '{=base} − {=meanShuffled|4} = {=imp|4}.'
      - type: two-tier
        prompt: Suppose another feature scores about 0.000 the same way. What is the honest reading of that?
        options: ['The model barely relies on this feature alone, or a twin covers for it', 'The feature has no relationship with the outcome', 'The feature should be deleted']
        answer: 0
        reasons:
          - Permutation importance measures what the model loses when this one feature is scrambled
          - Near-zero importance proves the feature is unrelated to the outcome in the real world
          - Shuffling a feature retrains the model without it
        reasonAnswer: 0
        reasonFeedback:
          1: It describes this model, and a correlated twin can hide a real relationship.
          2: The model isn't retrained; the feature is scrambled in the test data.
        explanation: Near zero means scrambling that feature costs this model little, perhaps because a look-alike carries the same signal.
    hints: [Importance = original score − mean shuffled score.]
    explanation: Mean shuffled {=meanShuffled|4}; importance {=imp|4}; read it as "what this model loses", not as truth about the world.

