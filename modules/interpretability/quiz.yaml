    skills: [counterfactuals, honest-reading]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: math-code, id: counterfactual-search }
    prompt: Match each word to what it means for a counterfactual.
    pairs:
      - ['Valid', 'The model really does predict the other class for it']
      - ['Plausible', 'A row like it could exist in reality']
      - ['Actionable', 'A person could actually bring the change about']
      - ['Causal', 'Changing it in reality would change the outcome; never established by the model']
    explanation: |
      Counterfactuals are always valid; whether they are plausible or actionable must be checked separately; they never show a cause.


