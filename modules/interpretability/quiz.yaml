  - id: transfer-twins
    type: two-tier
    skills: [correlation-trap, permutation-importance]
    difficulty: 3
    tags: [application]
    lessonRef: { tab: intuition, id: twins }
    prompt: In a house-price model, "floor area" and "number of rooms" are 95% correlated. Shuffling floor area alone barely changes the score. Is floor area unimportant?
    options: ['Not necessarily; rooms can stand in for it', 'Yes; its importance is near zero', 'Yes, and it should be deleted']
    answer: 0
    reasons:
      - A twin feature carries the same information, so shuffling one leaves the model a backup
      - Near-zero permutation importance always means a useless feature
      - Correlated features are ignored by models
    reasonAnswer: 0
    optionFeedback:
      1: The twin hides its contribution.
      2: Deleting it may be harmless only because the twin remains.
    reasonFeedback:
      1: Twins can each look useless alone.
      2: Models use correlated features freely.
    hints: [What does the model still see when floor area is shuffled?]
    explanation: Shuffle the twins together to see what they carry jointly.
    variants:
      - prompt: Height in cm and height in inches are both in a model. Built-in importance gives each about half the credit. What's the honest reading?
        options: ['Height matters; the credit is split between two copies', 'Each is only half as important as other features', 'Both should be ranked separately']
        answer: 0
        reasons:
          - Built-in importance shares credit between features carrying the same information
          - Importance always adds up correctly for twins
          - Twins never affect importance
        reasonAnswer: 0
        optionFeedback:
          1: Together they carry height's full importance.
          2: Report them as one group.
        reasonFeedback:
          1: Splitting credit hides the true importance.
          2: Twins are exactly what distorts importance.
        explanation: Group twins when reporting importance.
      - prompt: A PDP sets "rooms" to 8 for a 30 m² studio flat. What is the problem?
        options: ['It creates an impossible house, because rooms and area are tied', 'Nothing; PDPs can set any value', 'The PDP will crash']
        answer: 0
        reasons:
          - Changing one twin while holding the other fixed makes combinations that don't exist
          - PDPs only use real houses
          - Models can't predict unusual inputs
        reasonAnswer: 0
        optionFeedback:
          1: The model will answer, but about a house that can't exist.
          2: It runs fine; the cases are just unrealistic.
        reasonFeedback:
          1: PDPs force values onto every case.
          2: Models will output something for any input.
        explanation: PDPs over correlated features rest on impossible cases.

  - id: transfer-perm-read
