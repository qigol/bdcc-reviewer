    tags: [application]
    lessonRef: { tab: application, id: worth-it }
    prompt: Put a responsible interpretation workflow in order.
    items:
      - Train the model and check it does well on the test set
      - Rank features for the whole model (built-in and permutation importance)
      - Check which top features move together (twins)
      - Look at the direction of the top features with PDPs
      - 'Explain single decisions (SHAP, LIME, counterfactuals), naming the class'
      - 'Report every explanation as a statement about the model, not about causes'
    explanation: |
      Rank features first, then look at direction, then explain single cases. Only explain models that work.


  - id: impurity-code
    type: code-fill
    skills: [impurity-importance]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: impurity-importance }
    prompt: Complete the weighted impurity decrease.
    code: |
      def impurity_importance(splits, n_total):
          raw = {}
          for feature, y, y_l, y_r in splits:
              g = gini(y)
              child = len(y_l) / len(y) * gini(y_l) + len(y_r) / len(y) * gini(y_r)
              decrease = __BLANK_1__ / n_total * (g - child)
              raw[feature] = raw.get(feature, 0) + decrease
          total = sum(raw.values())
          return {f: v / __BLANK_2__ for f, v in raw.items()}
    blanks:
      '1': { accept: ['len(y)'] }
      '2': { accept: ['total'] }
    hints:
      - Each question is scaled by the share of cases that reach it.
    explanation: |
      Each question is weighted by the share of training cases that reach it, and each feature's total is divided by the overall total so they sum to 1.

  - id: perm-auc-numeric
    type: numeric
    skills: [permutation-importance]
    difficulty: 2
    tags: [math]
    generator: permQ
    lessonRef: { tab: math-code, id: permutation-importance }
    prompt: |
      A forest's test {=metric} is {=base}. After shuffling one feature {=reps} times, the {=metric} values are
      {=shuffledList}. What is that feature's permutation importance? Give 4 decimal places.
    answer: { var: imp, tol: 0.0005 }
    misconceptions:
      - { var: wrongSign, feedback: 'Importance is original score − shuffled score, so a drop is positive.' }
      - { var: wrongFirst, feedback: 'Average over all the shuffles; one shuffle can be luck.' }
    hints:
      - The drops are in thousandths of ROC-AUC, as in the real forest. Keep every decimal.
      - Average the shuffled scores, then subtract that average from the original score.
    explanation: |
      Average shuffled ROC-AUC {=meanShuffled|4}; importance = {=base} − {=meanShuffled|4} = {=imp|4}. Small, because a
      score near 1 has little room to fall: read the order of the features, not the size.

  - id: waterfall-hand
    type: hand-calc
    skills: [shap-reading, honest-reading]
    difficulty: 3
    tags: [math, application]
    generator: waterfallQ
    lessonRef: { tab: intuition, id: waterfall }
    prompt: |
      A bank's loan model explains P(approved) for one applicant (class 1 = approved, class 0 = refused) with a SHAP
      waterfall. The table lists it top-down as the plot draws it: the prediction f(x) at the top (hidden), the bars
      sorted by size, and the baseline E[f(x)] at the bottom.
    show:
      - { id: t, widget: Matrix, props: { data: '@table', format: 2 } }
    steps:
      - prompt: 'Read from the bottom: the running total after the two bars nearest the baseline ({=bottomTwo})'
        answer: { var: afterTwo, tol: 0.005 }
        hint: Start at the baseline and add the two lowest bars.
      - prompt: 'P(approved) at the top of the plot, f(x)'
        answer: { var: fx, tol: 0.005 }
        hint: Keep adding bars until all four are in.
      - prompt: 'The top of the same plot if you explain class 0 instead: P(refused)'
        answer: { var: fxNo, tol: 0.005 }
        hint: 'Switching class flips the baseline (1 − E[f(x)]) and every bar''s sign.'
    hints:
      - A waterfall is read from the bottom up, one bar at a time.
      - Baseline + every push = the prediction at the top.
    explanation: |
      Bottom-up: {=base} plus the {=bottomTwo} bars gives {=afterTwo|2}; all four bars (sum {=sumPhi|2}) give
      f(x) = {=fx|2}. For class 0 the baseline is 1 − {=base} and every push flips, so the top is 1 − {=fx|2} = {=fxNo|2}.
      A bar's sign says "towards approved" or "towards refused", never "good" or "bad".

  - id: twins-loan-hand
    type: hand-calc
    skills: [correlation-trap, permutation-importance]
    difficulty: 3
    tags: [math, application]
    generator: twinsQ
    lessonRef: { tab: math-code, id: correlated-twins }
    prompt: |
      A loan model uses monthly income and monthly salary, which are near twins (for most people salary is most of their
      income). Its test ROC-AUC is {=base}. Shuffling income alone, twice, gives {=incList}. Shuffling salary alone gives
      {=salList}. Shuffling both columns together with the same shuffle gives {=bothList}.
    steps:
      - prompt: 'Permutation importance of income alone (4 decimal places)'
        answer: { var: impIncome, tol: 0.0002 }
        hint: Original score minus the average of the two shuffled scores.
      - prompt: 'Permutation importance of income and salary shuffled together (4 decimal places)'
        answer: { var: impBoth, tol: 0.0002 }
        hint: Same rule, using the scores with both columns shuffled.
    hints:
      - Permutation importance = original score − average shuffled score.
      - Work out each one separately; do not add the single importances.
    explanation: |
      Income alone: {=base} − {=meanInc|4} = {=impIncome|4}, about zero, because the model still reads salary. Together:
      {=base} − {=meanBoth|4} = {=impBoth|4}. Adding the one-at-a-time values ({=sumSingles|4}) would hide what the twins
      carry between them, so report them as one group.

  - id: twins-transfer-multi
    type: multi
    skills: [correlation-trap, honest-reading]
    difficulty: 3
    tags: [application]
    lessonRef: { tab: intuition, id: twins }
    prompt: |
      In a loan model, income alone has permutation importance 0.0005 and salary alone −0.001, but shuffling the two
      together drops ROC-AUC by 0.06. Which conclusions are sound? Select all that apply.
    options:
      - The pair carries real information even though each looks useless alone
      - Income can be dropped, because its own importance is about zero
      - Report income and salary as one group in the ranking
      - The negative value means salary makes the model worse
      - Built-in importance would probably split the credit between them
    answer: [0, 2, 4]
    hints:
      - When one twin is shuffled, what can the model still read?
    explanation: |
      Twins cover for each other, so one-at-a-time shuffles look like zero. The joint drop shows what they carry together.
      A tiny negative value is noise, and built-in importance shares credit between twins rather than erasing it.

