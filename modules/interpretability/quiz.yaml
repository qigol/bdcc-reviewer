  - id: highcard-mcq
    type: mcq
    skills: [impurity-importance, permutation-importance]
    difficulty: 3
    tags: [application]
    lessonRef: { tab: intuition, id: impurity-credit }
    prompt: |
      A colleague leaves a "patient ID" column (a different number for every patient) in a forest's training data. Its
      built-in importance comes out at 0.04, but its permutation importance on the test set is about 0. What is going on?
    options:
      - With so many values, trees found splits on it that fit training noise
      - The ID really matters, and permutation importance missed it
      - Permutation importance cannot handle columns with many values
      - The ID must be a twin of another feature in the data
    answer: 0
    hints:
      - Which of the two importances is worked out on the training data?
    explanation: |
      A feature with many distinct values offers many possible questions, so trees can use it to separate training rows by
      luck. Built-in importance counts that as credit. On new data the ID carries no signal, so shuffling it costs nothing.

  - id: pdp-flat-multi
    type: multi
    skills: [pdp, honest-reading]
    difficulty: 3
    tags: [application]
    lessonRef: { tab: math-code, id: partial-dependence }
    prompt: 'A house-price model''s PDP for "number of bathrooms" is flat. Which conclusions are justified? Select all that apply.'
