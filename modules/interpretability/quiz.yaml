  - id: cf-actionable-multi
    type: multi
    skills: [counterfactuals, honest-reading]
    difficulty: 3
    tags: [application]
    lessonRef: { tab: intuition, id: flip-it }
    prompt: |
      A loan model refuses an applicant. A counterfactual search returns these changes, and each one would flip the model to
      "approve". Which are both plausible and actionable? Select all that apply.
    options:
      - Pay down ₱20,000 of credit-card debt
      - Be five years younger
      - Have a monthly salary higher than her total monthly income
      - Have opened her bank account ten years earlier
      - Take a second job that adds ₱8,000 a month
