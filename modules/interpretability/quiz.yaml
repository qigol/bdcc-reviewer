  - id: impurity-code
    type: code-fill
    skills: [impurity-importance]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: impurity-importance }
    prompt: Complete the weighted impurity decrease.
    code: |
      def impurity_importance(splits, n_total):
          raw = {}
          for feature, y, y_l, y_r in splits:
              g = gini(y)
              child = len(y_l) / len(y) * gini(y_l) + len(y_r) / len(y) * gini(y_r)
              decrease = __BLANK_1__ / n_total * (g - child)
              raw[feature] = raw.get(feature, 0) + decrease
          total = sum(raw.values())
          return {f: v / __BLANK_2__ for f, v in raw.items()}
    blanks:
      '1': { accept: ['len(y)'] }
      '2': { accept: ['total'] }
    explanation: Each split is weighted by the share of training rows reaching it, and the per-feature sums are normalized to 1.
