    generator: cfQ
    lessonRef: { tab: math-code, id: counterfactual-search }
    prompt: |
      {=rule}. The model says benign when the score is above 0. A case has x1 = {=x1}, x2 = {=x2}, so its score is {=s}
      (malignant). Holding the other feature fixed, what value of **{=feature}** puts the score exactly at 0?
    answer: { var: target, tol: 0.01 }
    misconceptions:
      - { var: wrongSign, feedback: 'Wrong direction: with a negative weight, the feature must go down to raise the score.' }
