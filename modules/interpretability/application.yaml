intro: |
  A model that is often right is not yet a model we can trust. Before it affects decisions about people, someone must
  check that it is right for reasons we would accept, explain single decisions to the people affected, and say plainly
  what those explanations cannot claim. This case runs the whole Session 6–7 toolkit on one forest as a review before use.
case:
  id: hospital-review
  title: Reviewing the tumour classifier before a pilot
  story: |
    A provincial hospital wants to try the Session 6–7 random forest (300 trees, Breast Cancer Wisconsin, 1 = benign) as a
    second opinion on biopsy measurements. You are asked for a short review: what does the model rely on, which way do its
    features push, and how would we explain one patient's result to her doctor?
  data: [patient, bcimp, tumors, trees, lime, dice]
  state: { by: builtin, cls: 1 }
  derive:
    - { fn: rankImportance, in: { bcimp: '@bcimp', by: '@by' }, out: rk }
    - { fn: twinsLecture, in: { bcimp: '@bcimp' }, out: tl }
    - { fn: pdpBoth, in: { tumors: '@tumors', trees: '@trees' }, out: pb }
    - { fn: additivity, in: { patient: '@patient', cls: '@cls' }, out: ad }
    - { fn: limeRank, in: { lime: '@lime' }, out: lr }
    - { fn: diceCheck, in: { dice: '@dice' }, out: dc }
  cells:
    - id: worth-it
      title: Is it worth interpreting?
      say: |
        On 143 test tumours the forest is {=patient.accuracy|pct1} accurate with [[roc-auc|ROC-AUC]] {=patient.rocAuc|4}.
        Explaining only makes sense for a model worth explaining; otherwise you just describe its mistakes in detail.
      stage:
        - id: perf
          widget: Readout
          props:
            items:
              - { label: accuracy, value: '@patient.accuracy', format: 3, tone: good }
              - { label: ROC-AUC, value: '@patient.rocAuc', format: 4, tone: good }
              - { label: test rows, value: '@patient.testRows' }
      decision:
        prompt: The model is accurate. What is the review's central question now?
        type: mcq
        options:
          - 'Is it accurate for reasons we would accept, or has it found a shortcut we would never accept?'
          - 'Can we make it even more accurate?'
          - 'Which explanation method gives the nicest plot?'
          - 'None: accurate models need no review'
        answer: 0
        model: |
          That is the guiding question of this block (Session 10 deck). Accuracy says the model works on this test set.
          Interpretation checks whether it works for reasons that will hold up and that we can defend.
    - id: what-it-relies-on
      title: What does it rely on?
      say: |
        Two whole-model rankings. [[impurity-importance|Built-in importance]] is mixing reduction on the training data;
        [[permutation-importance|permutation importance]] is test ROC-AUC lost when a column is shuffled. The top three
        agree: worst perimeter, worst area, worst concave points.
      stage:
        - id: by
          widget: Choice
          props:
            label: rank by
            options:
              - { value: builtin, label: 'built-in (impurity)' }
              - { value: perm, label: 'permutation (test AUC)' }
          bind: { value: by }
        - id: chart
          widget: Chart
          props: { kind: bar, series: '@rk.series', title: 'Top 10 features · w. = worst, m. = mean, c.pts = concave points' }
      decision:
        prompt: A colleague writes "worst perimeter increases benign probability by 14.6%". Correct it.
        type: open
        model: |
          0.146 is worst perimeter's share of the forest's total mixing reduction, not a change in probability, and
          importance has no direction at all. To say which way it pushes, look at a PDP; for one patient, look at SHAP.
    - id: twins-check
      title: The size twins
      say: |
        worst radius is 5th by built-in importance but 29th of 30 by permutation importance. worst radius, worst perimeter
        and worst area are [[correlated-features|twins]]: their correlation is above 0.98.
      stage:
        - id: tw
          widget: Matrix
          props: { data: '@tl.table', format: 4, title: 'Size features in both rankings', rowHeader: feature }
      decision:
        prompt: Should we drop worst radius from the model because its permutation importance is about zero?
        type: mcq
        options:
          - 'Not on that evidence: its twins cover for it when it alone is shuffled; shuffle the size group together first'
          - 'Yes: permutation importance proves it is useless'
          - 'Yes: a negative importance means it hurts the model'
          - 'No: built-in importance is always right'
        answer: 0
        model: |
          Built-in importance shares credit among twins; permutation importance can wipe it out, because the model still
          sees the other twins. Neither is lying. Judge the group, not one member.
    - id: direction
      title: Which way does size push?
      say: |
        A [[pdp|PDP]] gives every case the same value of one feature and averages P(benign). On the toy trees, setting
        radius above the 14.5 question drops the average from 0.6 to 0.25; in the twin forest the step is half as tall.
      stage:
        - id: pdpc
          widget: Chart
          props: { kind: line, series: '@pb.series', xLabel: radius, yLabel: 'average P(benign)', title: 'Partial dependence on radius (toy)' }
      decision:
        prompt: 'The hospital''s quality officer reads the PDP as "shrinking a tumour makes it benign". Your reply?'
        type: mcq
        options:
          - 'A PDP describes this model''s average output for forced inputs, some impossible; it is not a causal claim about tumours'
          - 'Correct, that is what a downward slope means'
          - 'Correct, but only for radii above 14.5'
          - 'The PDP is wrong because it has a step'
        answer: 0
        model: |
          The curve says "when this model sees a larger radius it gives a lower benign probability". It cannot support
          "shrink this number and the patient gets better", and it averages over cases that could not exist.
    - id: one-patient
      title: Explaining one patient
      say: |
        Patient 205 is really malignant and predicted malignant, the least clear-cut such case: P(benign) {=patient.pBenign}.
        For class {=cls}, baseline {=ad.base|4} plus contributions {=ad.sum|4} gives {=ad.fx|4}.
      stage:
        - id: cls
          widget: Choice
          props:
            label: class explained
            options:
              - { value: 1, label: '1 = benign' }
              - { value: 0, label: '0 = malignant' }
          bind: { value: cls }
        - id: add
          widget: Chart
          props: { kind: bar, series: '@ad.bars', yLabel: probability }
        - id: lime-t
          widget: Matrix
          props: { data: '@lr.table', format: 4, title: 'LIME for the same patient (towards benign)' }
      decision:
        prompt: SHAP and LIME rank this patient's features differently. What do you report?
        type: open
        model: |
          Report both, with what each can claim. SHAP splits this prediction exactly (it adds up, but twins share credit).
          LIME is a straight-line stand-in on ranges, on a different scale, and changes without a fixed seed. Where they agree
          (size and dent features pushing towards malignant) we can speak with more confidence; where they disagree, that
          disagreement itself tells us how much confidence the explanation deserves.
    - id: what-would-change
      title: What would have flipped it?
      say: |
        DiCE found nearby cases the forest calls benign. Checking each one's geometry, {=dc.implausible|list} give two
        different radii, one from perimeter and one from area.
      stage:
        - id: dc-t
          widget: Matrix
          props: { data: '@dc.table', format: 2, title: 'Radius implied by worst perimeter vs worst area', rowHeader: row }
        - id: dice-note
          widget: Callout
          props: { kind: beyond, body: 'The perimeter/area geometry check is not in the notebook; it makes its remark "no such tumour exists" measurable. Real tumours are not circles, so the original ratio is 1.06, not 1.' }
      decision:
        prompt: Pick the sentence you could say to the clinician about cf2 (worst area 989.5 → 535.9).
        type: mcq
        options:
          - '"Holding everything else fixed, this model would output benign if worst area were 536; that describes the model, not the tumour."'
          - '"If the tumour shrank to an area of 536 it would be benign."'
          - '"Reducing worst area to 536 is the recommended treatment target."'
          - '"The patient is almost benign."'
        answer: 0
        model: |
          Valid is not plausible (area changed while perimeter did not), plausible is not actionable (nobody can set an
          area), and a counterfactual is never a cause. Say what the model would do, and nothing about the patient's body.
atScale:
  title: Interpretability on real systems
  body: |
    **SHAP on big data.** TreeExplainer is exact and fast for tree models, so it runs on millions of rows; LightGBM and
    XGBoost can return SHAP values themselves (`pred_contrib=True`). For models that are not trees (KernelSHAP), use a
    small background set (100–1,000 rows), because the cost grows with background size × rows explained.

    **Permutation importance** retrains nothing but re-scores the whole test set (number of features × repeats) times.
    Run it in parallel with `n_jobs` and score on a sample. Shuffle look-alike features together.

    **Monitoring.** Save the global importances and per-decision SHAP values with each model version. A sudden change in
    which features carry the predictions is an early warning that the data has shifted or something is leaking.

    **Documentation.** With every explanation you publish, record the class explained, the background data, the random
    seeds (LIME, DiCE) and the known twins.
  code:
    - lang: python
      title: SHAP values straight from LightGBM
      source: |
        import lightgbm as lgb

        model = lgb.LGBMClassifier(n_estimators=500).fit(X_train, y_train)
        contrib = model.predict(X_test, pred_contrib=True)   # (rows, features + 1)
        phi, base = contrib[:, :-1], contrib[:, -1]           # last column = baseline (log-odds)
        # additivity on the log-odds scale: base + phi.sum(axis=1) == raw score
    - lang: python
      title: Grouped permutation importance in parallel
      source: |
        import numpy as np
        from sklearn.metrics import roc_auc_score

        groups = {"size": ["worst radius", "worst perimeter", "worst area"], "texture": ["worst texture"]}
        rng = np.random.default_rng(42)
        base = roc_auc_score(y_test, model.predict_proba(X_test)[:, 1])
        for name, cols in groups.items():
            perm = rng.permutation(len(X_test))
            X_shuf = X_test.copy()
            X_shuf[cols] = X_test[cols].values[perm]      # same permutation for the whole group
            print(name, base - roc_auc_score(y_test, model.predict_proba(X_shuf)[:, 1]))
tradeoffs:
  title: Six tools, six questions
  columns: [Method, Question it answers, Scope, Main caveat]
  rows:
    - ['Built-in importance', 'What did the model build itself out of?', 'Global', 'No direction; training data; twins split credit']
    - ['Permutation importance', 'What does the model need to keep its score?', 'Global', 'Metric-dependent; twins can erase each other']
    - ['PDP', 'How does the average prediction move with one feature?', 'Global', 'An average; impossible rows; not causal']
    - ['SHAP', 'How far did each feature push this prediction from the baseline?', 'Local', 'Depends on class and background; twins share credit']
    - ['LIME', 'What matters right around this row, in a simple surrogate?', 'Local', 'A second model; unstable; binned conditions']
    - ['Counterfactual (DiCE)', 'What would have to change to flip this prediction?', 'Local', 'Valid ≠ plausible ≠ actionable; not causal']
explainBack:
  prompt: |
    A doctor asks why the model called her patient malignant and what the patient could do to be classified benign.
    Explain what you can and cannot tell her, using SHAP, the class coding, counterfactuals and the word "causal".
  rubric:
    - |
      Says which class the explanation is for (1 = benign) and that negative contributions push towards malignant
    - Explains that the baseline plus all contributions equals the predicted probability
    - 'Mentions that look-alike size features share credit, so their bars are not separate findings'
    - |
      Says a counterfactual is a changed input that flips the model, and checks whether it could exist and could be acted on
    - |
      Refuses to give causal advice ("shrink the tumour"); every method describes the model, not the patient
    - 'Notes that LIME and SHAP can disagree, and that disagreement limits how confident we can be'
