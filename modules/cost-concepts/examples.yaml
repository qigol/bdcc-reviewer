examples:
  - id: tarpaulin-cost
    source: 'Session 1, slides 74–75 (Example 4)'
    page: 75
    fn: mfgCost
    in: { materials: '@tarpaulin.materials', labor: '@tarpaulin.labor', overhead: '@tarpaulin.overhead' }
    expect: { dm: 75500, dl: 10400, oh: 6500, prime: 85900, conversion: 16900, total: 92400, overlap: 10400 }
  - id: tarpaulin-walk
    source: 'Session 1, slides 74–75 (Example 4), count-along'
    fn: mfgWalk
    in: { materials: '@tarpaulin.materials', labor: '@tarpaulin.labor', overhead: '@tarpaulin.overhead' }
    expect: { steps: 10, total: 92400 }
  - id: tarpaulin-flow
    source: 'Session 1, slides 59–60, applied to the Example 4 job (module-built entries)'
    fn: costFlow
    in: { dm: 75500, dl: 10400, oh: 6500, soldPct: 0.4 }
    expect: { total: 92400, cogs: 36960, fg: 55440 }
  - id: tarpaulin-unsold
    source: 'Session 1, slide 60: finished but not yet sold'
    fn: costFlow
    in: { dm: 75500, dl: 10400, oh: 6500, soldPct: 0 }
    expect: { total: 92400, cogs: 0, fg: 92400 }
  - id: quality-rule
    source: 'Session 1, slide 38: ₱1 at design, ₱10 in production, ₱100 at the customer, for one defect'
    fn: qualityRule
    in: { defects: 1 }
    expect: { design: 1, production: 10, customer: 100 }
