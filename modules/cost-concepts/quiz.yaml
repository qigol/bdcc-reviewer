    lessonRef: { tab: intuition, id: cost-of-what }
    prompt: A hospital wants to know what its **pediatrics ward** costs. Is the salary of the ward's head nurse a direct cost of that ward?
    options: ['Yes', 'No', 'Only if the nurse is part-time']
    answer: 0
    reasons:
      - The head nurse works only for that ward, so the salary can be traced to it
      - Salaries are always indirect
