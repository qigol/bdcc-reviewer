  - id: transfer-product-period
    type: mcq
    skills: [product-period]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: product-or-period }
    prompt: A Bacolod furniture maker pays a salary to the guard of its **factory** gate. When does that cost reach the income statement?
    options:
      - As part of COGS, when the furniture made in that period is sold
      - As an expense in the month it is paid
      - Never; guard salaries are not costs
      - As a selling expense
    answer: 0
    optionFeedback:
      1: Factory costs are product costs; they wait in inventory until sale.
      2: It's a real cost of making the furniture.
      3: Guarding the factory supports production, not selling.
    hints: [Is the cost part of making the product?]
    explanation: Factory overhead is a product cost, expensed through COGS on sale.
    variants:
      - prompt: The same furniture maker pays commissions to its showroom salespeople. When does that cost reach the income statement?
        options:
          - As a selling expense in the period it's incurred
          - In COGS when the furniture is sold
          - In Finished Goods inventory
          - In Work in Process
        answer: 0
        optionFeedback:
          1: Commissions aren't part of making the product.
          2: Only product costs sit in inventory.
          3: Selling costs never enter production accounts.
        explanation: Selling costs are period costs, expensed right away.
      - prompt: The furniture maker's accountant earns a salary at the head office. When does that cost reach the income statement?
        options:
          - As an administrative expense in the period
          - In COGS when goods are sold
          - In Raw Materials inventory
          - As factory overhead
        answer: 0
        optionFeedback:
          1: Head-office salaries aren't product costs.
          2: Only materials go into Raw Materials.
          3: Head-office work isn't factory work.
        explanation: Administrative costs are period costs.

  - id: transfer-cost-object
    type: two-tier
    skills: [cost-objects]
