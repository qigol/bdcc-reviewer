  # ------------------------------------------------------------------ new formats (case, find-error, two-tier, explain)
  - id: cogs-case
    type: case
    skills: [product-period, mfg-cost]
    difficulty: 3
    tags: [math, journal]
    generator: cogsQ
    lessonRef: { tab: intuition, id: product-or-period }
    prompt: |
      **From factory to income statement.** A workshop finishes {=units|comma} units at {=unitCost|money2} each and sells
      {=soldUnits|comma} of them this period.
    parts:
      - type: numeric
        prompt: Total cost of the finished units (₱)
        answer: { var: total, tol: 0.5 }
        explanation: '{=units|comma} × {=unitCost|money2} = {=total|money}.'
      - type: numeric
        prompt: Cost of goods sold this period (₱)
        answer: { var: cogs, tol: 0.5 }
        misconceptions:
          - { var: wrongAll, feedback: "That expenses every unit made. Only the units **sold** become COGS; the rest stay in Finished Goods." }
          - { var: wrongSwap, feedback: That is the unsold units. COGS is the cost of the units sold. }
        explanation: '{=soldUnits|comma} × {=unitCost|money2} = {=cogs|money}.'
      - type: two-tier
        prompt: Where is the cost of the **unsold** units reported?
        options: ['As Finished Goods inventory on the balance sheet', 'As an expense on this period''s income statement', 'As a period cost in selling expense']
        answer: 0
        reasons:
          - Product costs stay in inventory until the goods are sold
          - All costs incurred this period are expensed this period
          - Costs of goods not yet sold are selling costs
        reasonAnswer: 0
        reasonFeedback:
          1: That's true of **period** costs only. Product costs wait in inventory.
          2: Selling costs are period costs such as commissions. Making the goods is a product cost.
        explanation: '{=unsold|comma} unsold units × {=unitCost|money2} = {=fg|money} stays in Finished Goods.'
    hints:
      - Product costs attach to units; they become an expense only when those units are sold.
    explanation: Finished {=total|money}; COGS {=cogs|money}; Finished Goods {=fg|money}. The two add back to the total.

  - id: product-period-explain
    type: explain
    skills: [product-period]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: product-or-period }
    prompt: A friend says the factory supervisor's salary and the sales manager's salary should be treated the same way because both are salaries. Explain why accounting treats them differently.
    model: |
      The factory supervisor's salary is part of making the product (manufacturing overhead), so it is a **product cost**: it
      attaches to units, sits in inventory, and is expensed as COGS only when those units are sold. The sales manager's salary
      isn't part of making anything, so it is a **period cost** (selling expense), expensed in the period it's incurred. What
      matters is the function the cost serves, not what kind of payment it is.
    checklist:
      - The supervisor's salary is manufacturing overhead, a product cost
      - Product costs sit in inventory and become COGS when the goods are sold
      - The sales manager's salary is a period (selling) cost, expensed right away
      - The test is the cost's function (making vs selling), not its form
    hints: [Ask whether each salary is part of making the goods.]
    explanation: Same form, different function, so different timing on the income statement.

