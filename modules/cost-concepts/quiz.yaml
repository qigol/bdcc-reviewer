    reasonAnswer: 0
    optionFeedback:
      1: The salary serves only that ward, so it's traceable.
      2: Part-time or full-time doesn't decide traceability.
    reasonFeedback:
      1: Labor can be direct to a cost object it serves alone.
      2: Labor and other costs can be direct too.
    hints: [Can the cost be traced to the ward alone?]
    explanation: Direct or indirect depends on the cost object; a ward-only salary is direct to the ward.
    variants:
      - prompt: Now the cost object is **one patient's stay** in the pediatrics ward. Is the head nurse's salary direct to that stay?
        options: ['No', 'Yes', 'Only for long stays']
        answer: 0
        reasons:
          - The nurse oversees every patient in the ward, so the salary can't be traced to one stay
          - Salaries are never costs of patient care
          - Long stays make all costs direct
        reasonAnswer: 0
        optionFeedback:
          1: The salary is shared by all patients in the ward.
          2: Stay length doesn't make a shared cost traceable.
        reasonFeedback:
