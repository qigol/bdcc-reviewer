templates:
  # ------------------------------------------------------------------ managerial against financial
  - id: acct-mcq
    type: mcq
    skills: [accounting-types]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: two-kinds }
    prompt: A plant manager needs a weekly cost-per-unit dashboard, even if the figures are only estimates. Which branch of accounting is this?
    options:
      - Managerial accounting, because it serves internal decisions and favors timeliness
      - Financial accounting, because it uses cost figures
      - Financial accounting, because it is produced every week
      - Neither, because it is not audited
    answer: 0
    optionFeedback:
      1: "Using cost figures doesn't make it financial; who it's for and why does."
      2: "Frequency isn't the test; internal use and timeliness are."
      3: "Managerial reports aren't audited, and that's normal for managerial accounting."
    hints:
      - Who reads it, and what do they need it for?
    explanation: The reader is an internal manager making operating decisions, and speed matters more than audited precision. That describes managerial accounting.

  - id: acct-match
    type: match
    skills: [accounting-types]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: two-kinds }
    prompt: Match each feature to the branch of accounting it describes.
    pairs:
      - ['Managerial: users', 'Internal managers at all levels']
      - ['Financial: users', 'Investors, creditors and regulators']
      - ['Managerial: rules', 'No mandatory rule set']
      - ['Financial: rules', 'PFRS or GAAP required']
      - ['Managerial: verification', 'Not audited']
      - ['Financial: verification', 'Independently audited']
    pick: 4
    explanation: Managerial accounting is internal, flexible and not audited; financial accounting is external, rule-bound and audited.

  - id: acct-multi
    type: multi
    skills: [accounting-types]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: two-kinds }
    prompt: Which of these describe managerial accounting? Select all that apply.
    options:
      - Reports on segments, products and departments
      - Future-oriented budgets and forecasts
      - Required by PFRS or GAAP
      - Produced as often as managers need it
      - Independently audited each year
    answer: [0, 1, 3]
    optionFeedback:
      0: "Yes: managers need segment and product detail."
      1: "Yes: budgets and forecasts look ahead."
      2: "Required standards apply to financial accounting."
      3: "Yes: reports come out whenever managers need them."
      4: "Independent audits are for financial statements."
    hints:
      - Think about who it is for and what rules, if any, bind it.
    explanation: Managerial accounting follows managers' needs, not a rule book. Required formats and independent audit belong to financial accounting.

  # ------------------------------------------------------------------ management functions
  - id: func-mcq
    type: mcq
    skills: [mgmt-functions]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: three-functions }
    prompt: A plant manager compares last week's actual labor hours with the standard and decides which variances to investigate. Which management function is that?
    options:
      - Controlling, because actual results are compared with the plan
      - Planning, because it concerns next month
      - Financing, because it concerns money
      - Organizing, because it assigns people
    answer: 0
    optionFeedback:
      1: "Planning sets the targets; comparing actual results with them is controlling."
      2: "Financing isn't one of the three management functions taught."
      3: "Organizing assigns people, but this is comparing results with the plan."
    hints:
      - Is the manager setting a plan or checking how the plan went?
    explanation: Comparing actual with standard and acting on the gap is the feedback loop of controlling. Deciding which variance to chase is a decision made inside that loop.
    variants:
      - prompt: A sales director sets next year's sales targets and the advertising budget for each region. Which management function is that?
        options:
          - Planning, because it sets goals and budgets for the future
          - Controlling, because it involves numbers
          - Organizing, because it involves regions
          - Directing, because the director gives orders
        answer: 0
        optionFeedback:
          1: Controlling compares actual results with plans; nothing has happened yet.
          2: Organizing arranges people and resources; this sets goals.
          3: Setting targets and budgets is planning.
        explanation: Setting goals and budgets for the future is planning.
      - prompt: A store manager sees that March sales were 15% below budget and asks the team why. Which management function is that?
        options:
          - Controlling, because actual results are compared with the plan
          - Planning, because it concerns the budget
          - Financing, because it concerns sales money
          - Organizing, because it involves the team
        answer: 0
        optionFeedback:
          1: Planning made the budget; comparing results with it is controlling.
          2: Financing isn't one of the management functions taught.
          3: Organizing assigns people; this checks results.
        explanation: Comparing actual with plan and following up is controlling.

  - id: func-multi
    type: multi
    skills: [mgmt-functions]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: three-functions }
    prompt: Which statements about the three management functions are true? Select all that apply.
    options:
      - Decision making happens inside both planning and controlling
      - A budget is the main output of planning
      - Controlling means setting goals for the next five years
      - Variances tell the manager where to direct attention
    answer: [0, 1, 3]
    optionFeedback:
      0: "Yes: decisions are made in both."
      1: "Yes: the budget is planning's main output."
      2: "Setting long-range goals is planning."
      3: "Yes: variances point to where attention is needed."
    hints:
      - Go back to what each function produces.
    explanation: Planning produces budgets and strategy, and controlling produces comparisons and corrective action. Setting long-range goals is planning, not controlling.

  - id: loop-order
    type: order
    skills: [mgmt-functions]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: three-functions }
    prompt: Put the controlling feedback loop in order.
    items:
      - Set the standard or budget
      - Measure what actually happened
      - Compute the variance
      - Act, and feed the lesson into the next plan
    explanation: You need a standard before you can measure against it, a measurement before a variance, and a variance before you act.

  # ------------------------------------------------------------------ roles
  - id: line-staff-mcq
    type: mcq
    skills: [org-roles]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: who-does-what }
    prompt: The Controller advises production managers with cost reports but cannot order them to change a process. What kind of authority is that?
    options:
      - Staff authority
      - Line authority
      - Treasurer authority
      - No authority at all
    answer: 0
    optionFeedback:
      1: "Line authority means direct command over the main work; the Controller only advises it."
      2: "The Treasurer is a separate staff role, not a kind of authority."
      3: "Advising through reports is staff authority, which is real authority."
    hints:
      - Does the role give direct orders to the people doing the main work?
    explanation: Staff roles support and advise through information and analysis. Line authority is direct command over the chain that achieves the organization's objectives.

  - id: role-match
    type: match
    skills: [org-roles]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: who-does-what }
    prompt: Match each task to the finance role that usually owns it.
    pairs:
      - ['Designs the cost accumulation system and budgets', 'Controller']
      - ['Negotiates bank loans and lines of credit', 'Treasurer']
      - ['Prepares variance and performance reports', 'Controller']
      - ['Manages cash, credit policy and collections', 'Treasurer']
    explanation: The Controller is the information executive and the Treasurer is the money executive. Both report to the CFO.

  - id: controller-mcq
    type: mcq
    skills: [org-roles]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: who-does-what }
    prompt: The Controller gives direct orders to the Cost Systems Analyst, yet accounting is called a staff function. How can both be true?
    options:
      - Staff authority describes accounting's relationship to the rest of the organization, not the hierarchy inside the department
      - The Controller is really a line manager of production
      - The Cost Systems Analyst is an outside consultant
      - Staff and line mean the same thing
    answer: 0
    optionFeedback:
      1: "The Controller runs accounting, not production."
      2: "The analyst is an employee inside accounting."
      3: "Line commands the main work; staff advises it."
    hints:
      - Authority can exist inside a department that is advisory to everyone else.
    explanation: Inside accounting the Controller commands the analysts. To production and sales, accounting as a whole advises rather than commands.

  # ------------------------------------------------------------------ value chain and quality
  - id: chain-order
    type: order
    skills: [value-chain]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: value-chain-quality }
    prompt: Put the functions of the value chain in order.
    items:
      - Research and development
      - Design
      - Production
      - Marketing
      - Distribution
      - Customer service
    explanation: From idea to after-sale support, the six functions are linked, and a cost decision in one can quietly damage another.

  - id: quality-match
    type: match
    skills: [value-chain]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: value-chain-quality }
    prompt: Match each cost to its category of quality cost.
    pairs:
      - ['Training and supplier partnerships', 'Prevention']
      - ['Inspection and testing', 'Appraisal']
      - ['Scrap and rework before shipping', 'Internal failure']
      - ['Warranty claims and returns', 'External failure']
    explanation: Prevention stops defects, appraisal finds them, internal failure is paid before the customer sees them, and external failure after.

  - id: defect-numeric
    type: numeric
    skills: [value-chain]
    difficulty: 1
    tags: [math]
    generator: defectQ
    lessonRef: { tab: math-code, id: value-chain-rule }
    prompt: |
      Using the 1:10:100 rule of thumb (₱1 at design, ₱10 in production, ₱100 at the customer per defect), what is
      the total cost if the customer finds {=defects} defects?
    answer: { var: customer, tol: 0.5 }
    hints:
      - Which stage is the customer's discovery?
      - Multiply the number of defects by that stage's cost.
    explanation: 'Found by the customer, each defect costs about ₱100: ${=defects} \times 100 = {=customer|money}$. Caught at design the same defects would cost only {=design|money}.'

  - id: defect-fill
    type: schedule-fill
    skills: [value-chain]
    difficulty: 1
    tags: [journal]
    generator: defectQ
    lessonRef: { tab: math-code, id: value-chain-rule }
    prompt: |
      Complete the cost of {=defects} defects at each stage, using ₱1, ₱10 and ₱100 per defect.
    rows:
      - { label: Caught at design, amount: '@design', blank: true }
      - { label: Caught in production, amount: '@production', blank: true }
      - { label: Caught by the customer, amount: '@customer', style: total, blank: true }
    hints:
      - Multiply the defects by 1, by 10 and by 100.
    explanation: '{=defects} defects × ₱1 = {=design|money}; × ₱10 = {=production|money}; × ₱100 = {=customer|money}.'

  - id: lean-mcq
    type: mcq
    skills: [value-chain]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: value-chain-quality }
    prompt: A plant keeps a large store of finished goods "just in case." Which kind of waste is that in lean thinking?
    options:
      - Excess inventory
      - Waiting
      - Defects
      - Overproduction of services
    answer: 0
    optionFeedback:
      1: "Waiting is idle time between steps."
      2: "Defects are faulty output."
      3: "Finished goods held \"just in case\" are excess inventory."
    hints:
      - Capital is tied up in unneeded stock.
    explanation: The four categories are waiting, overproduction, excess inventory and defects. Stock held without need ties up capital, which is excess inventory.

  # ------------------------------------------------------------------ ethics
  - id: ethics-mcq
    type: mcq
    skills: [ethics]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: ethics-standards }
    prompt: A plant manager asks the controller to delay recording a real, incurred maintenance expense until next quarter so this quarter hits a bonus threshold, calling it "just a timing difference." What should the controller do?
    options:
      - Decline, document the conversation and escalate if pressure continues
      - Agree, since it is only a timing difference
      - Agree, but tell nobody
      - Record half now and half later
    answer: 0
    optionFeedback:
      1: "The expense is already incurred, so delaying it misstates the quarter."
      2: "Secrecy makes the integrity failure worse."
      3: "Splitting it still misstates the quarter."
    hints:
      - Which standards does knowingly misstating timing violate?
    explanation: This is a failure of integrity and of credibility. The expense is real and already incurred, and calling it timing is a common rationalization.

  - id: ethics-multi
    type: multi
    skills: [ethics]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: ethics-standards }
    prompt: An accountant inflates sales figures on the internal weekly dashboard only, not in audited statements. Which statements are true? Select all that apply.
    options:
      - Integrity is violated
      - Credibility is violated
      - Because the report is unaudited, the violation is smaller
      - The lack of an external check makes personal integrity more important
    answer: [0, 1, 3]
    optionFeedback:
      0: "Yes: knowingly reporting false figures violates integrity."
      1: "Yes: misleading reports violate credibility."
      2: "Internal reports drive decisions, so false figures matter just as much."
      3: "Yes: with no auditor, the accountant's own integrity is the check."
    hints:
      - Who relies on the dashboard, and who checks it?
    explanation: Knowingly reporting false figures discredits the profession and misleads the sales VP's staffing decisions. Being unaudited is not a defense; it is the reason the standards matter.

  - id: ethics-match
    type: match
    skills: [ethics]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: ethics-standards }
    prompt: Match each situation to the standard it is mainly about.
    pairs:
      - ['Sharing unreleased earnings with a relative', 'Confidentiality']
      - ['Signing off an analysis you are not qualified to do', 'Competence']
      - ['Disclosing a financial interest in a supplier before recommending it', 'Integrity']
      - ['Showing both upside and downside scenarios in a recommendation', 'Credibility']
    explanation: Each of the four standards has a typical test, which is keeping secrets, keeping skills current, avoiding conflicts of interest, or presenting the whole picture.

  # ------------------------------------------------------------------ cost objects
  - id: direct-mcq
    type: mcq
    skills: [cost-objects]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: cost-of-what }
    prompt: For the cost object "a batch of dining tables," how is the factory supervisor's salary classified?
    options:
      - Indirect, because it oversees all production and cannot be traced to the tables alone
      - Direct, because the supervisor works in the factory
      - Direct, because it is a labor cost
      - It is not a cost of the tables at all
    answer: 0
    optionFeedback:
      1: "Working in the factory doesn't make a cost traceable to one batch."
      2: "Labor is direct only if it works on the cost object itself."
      3: "It's a real cost of the tables, just an indirect one."
    hints:
      - Could you trace it to this one batch economically?
    explanation: Direct costs can be traced to the cost object economically. A salary that serves every product is related to the tables but not traceable to them alone.
    variants:
      - prompt: For the cost object "the Cebu branch", how is the Cebu branch manager's salary classified?
        options:
          - Direct, because it can be traced to that branch alone
          - Indirect, because salaries are always indirect
          - Indirect, because the manager reports to head office
          - It isn't a cost of the branch
        answer: 0
        optionFeedback:
          1: Salaries can be direct or indirect depending on the cost object.
          2: Reporting lines don't decide traceability; what the salary serves does.
          3: It's a real cost of running that branch.
        explanation: A cost that serves only the chosen cost object is direct to it.
      - prompt: For the cost object "a single wedding cake", how is the bakery's oven depreciation classified?
        options:
          - Indirect, because the oven serves every product and can't be traced economically to one cake
          - Direct, because the cake is baked in the oven
          - Direct, because depreciation is a fixed cost
          - It isn't a cost of the cake at all
        answer: 0
        optionFeedback:
          1: Being used for the cake doesn't make a shared cost traceable to it alone.
          2: Fixed vs variable is a different question from direct vs indirect.
          3: It's a real cost of making the cake, just an indirect one.
        explanation: Shared costs are indirect to any single product.

  - id: cost-object-mcq
    type: mcq
    skills: [cost-objects]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: cost-of-what }
    prompt: Fabric bought specifically for a set of dining chairs is classified as direct. Direct to what?
    options:
      - Direct to the set of chairs; it would be indirect to a batch of tables
      - Direct to every product in the factory
      - Direct to the whole company only
      - Direct, always, because it is a material
    answer: 0
    optionFeedback:
      1: "It's direct only to the chairs it was bought for."
      2: "It is direct to the chairs, a narrower cost object."
      3: "Materials can be indirect for other cost objects, such as the tables."
    hints:
      - Classification depends on the cost object chosen.
    explanation: It is not the cost that is direct or indirect but its relationship to a chosen cost object. The same fabric is direct to chairs and indirect to tables.

  - id: driver-mcq
    type: mcq
    skills: [cost-objects]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: cost-of-what }
    prompt: A factory's setup-related overhead rises with the number of times machines are changed over, not with the number of hours they run. Which is the better cost driver?
    options:
      - The number of setups
      - Machine hours
      - Direct labor cost
      - Units sold
    answer: 0
    optionFeedback:
      1: "Setup cost doesn't follow run hours."
      2: "Labor cost doesn't track changeovers."
      3: "Sales volume doesn't track how often machines are reset."
    hints:
      - A driver is what causes the cost to change.
    explanation: A cost driver should be the factor that actually moves the cost. Here that is the number of setups, a preview of activity-based costing.

  # ------------------------------------------------------------------ product and period
  - id: pp-mcq
    type: mcq
    skills: [product-period]
    difficulty: 1
    tags: [term]
    generator: productPeriodQ
    lessonRef: { tab: intuition, id: product-or-period }
    prompt: |
      Is this a product cost or a period cost?

      **{=item}**
    hints:
      - Is it incurred inside the factory to make the product?
    explanation: 'It is a **{=kindName}**. Costs incurred inside the factory to make the product are product costs; selling and administrative costs, and delivery after production, are period costs.'

  - id: period-sum-numeric
    type: numeric
    skills: [product-period]
    difficulty: 2
    tags: [math]
    generator: periodSumQ
    lessonRef: { tab: math-code, id: cost-flow }
    prompt: |
      A company incurred these costs this month: {=itemText}. What is the total of the **product** costs?
    answer: { var: productTotal, tol: 0.5 }
    hints:
      - Which items are incurred inside the factory to make the product?
      - Add only those.
    explanation: 'Product costs are the factory items, which add to {=productTotal|money}. The other items, {=periodTotal|money} in all, are period costs expensed immediately.'

  - id: period-only-numeric
    type: numeric
    skills: [product-period]
    difficulty: 2
    tags: [math]
    generator: periodSumQ
    lessonRef: { tab: math-code, id: cost-flow }
    prompt: |
      A company incurred these costs this month: {=itemText}. How much is **expensed immediately** as period costs?
    answer: { var: periodTotal, tol: 0.5 }
    hints:
      - Selling and administrative costs are period costs.
    explanation: 'Period costs total {=periodTotal|money}. The factory items, {=productTotal|money}, are product costs that stay in inventory until the units are sold.'

  - id: cogs-numeric
    type: numeric
    skills: [product-period]
    difficulty: 1
    tags: [math]
    generator: cogsQ
    lessonRef: { tab: math-code, id: cost-flow }
    prompt: |
      A factory finished {=units|comma} units at a manufacturing cost of {=unitCost|money} each. It sold {=soldUnits|comma}
      of them this period. What is its Cost of Goods Sold?
    answer: { var: cogs, tol: 0.5 }
    hints:
      - Only the units sold leave inventory and become an expense.
      - Multiply the units sold by the cost per unit.
    explanation: 'COGS $= {=soldUnits|comma} \times {=unitCost|money} = {=cogs|money}$. The other {=unsold|comma} units, {=fg|money}, are still in Finished Goods.'

  - id: cogs-handcalc
    type: hand-calc
    skills: [product-period]
    difficulty: 2
    tags: [math]
    generator: cogsQ
    lessonRef: { tab: math-code, id: cost-flow }
    prompt: |
      A factory finished {=units|comma} units at {=unitCost|money} each and sold {=soldUnits|comma} of them.
    steps:
      - prompt: Total cost of the units finished (₱)
        answer: { var: total, tol: 0.5 }
        hint: Units × cost per unit.
      - prompt: Cost of Goods Sold (₱)
        answer: { var: cogs, tol: 0.5 }
        misconceptions:
          - { var: wrongAll, feedback: 'That is the cost of every unit. Only the units sold become COGS.' }
        hint: Units sold × cost per unit.
      - prompt: Finished Goods still on hand (₱)
        answer: { var: fg, tol: 0.5 }
        misconceptions:
          - { var: wrongSwap, feedback: 'That is the cost of goods sold, not the inventory left.' }
        hint: Total cost minus Cost of Goods Sold.
    hints:
      - Split the total between what was sold and what was not.
    explanation: 'Total {=total|money}; COGS {=cogs|money}; Finished Goods {=fg|money}. COGS is an expense; Finished Goods stays an asset.'

  - id: cogs-fill
    type: schedule-fill
    skills: [product-period]
    difficulty: 1
    tags: [journal]
    generator: cogsQ
    lessonRef: { tab: math-code, id: cost-flow }
    prompt: |
      Complete the schedule for {=units|comma} units finished at {=unitCost|money} each, of which {=soldUnits|comma}
      were sold.
    rows:
      - { label: Total manufacturing cost of the units, amount: '@total', style: subtotal }
      - { label: Cost of Goods Sold (expense), amount: '@cogs', indent: 1, blank: true }
      - { label: Finished Goods inventory (asset), amount: '@fg', indent: 1, blank: true }
    hints:
      - COGS is the cost of the units sold.
    explanation: 'COGS = {=soldUnits|comma} × {=unitCost|money} = {=cogs|money}; Finished Goods = {=total|money} − {=cogs|money} = {=fg|money}.'

  - id: complete-je
    type: journal-entry
    skills: [product-period]
    difficulty: 1
    calculator: false
    tags: [journal]
    generator: completeQ
    lessonRef: { tab: math-code, id: cost-flow }
    prompt: |
      {=eventText} The cost involved is {=total|money}.
    accounts: '@accounts'
    entries: '@entries'
    hints:
      - A product cost moves from one asset account to another until it is sold.
      - When it is sold it leaves inventory and becomes an expense.
    explanation: 'A finished job moves from Work in Process to Finished Goods, still an asset. When the units are sold, Cost of Goods Sold is debited and Finished Goods is credited.'

  - id: flow-order
    type: order
    skills: [product-period]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: product-or-period }
    prompt: Put the life of a product cost in order.
    items:
      - Direct materials, direct labor and overhead are added to Work in Process
      - The cost moves to Finished Goods inventory, still an asset
      - The unit is sold and the cost leaves inventory
      - The cost becomes Cost of Goods Sold, an expense
    explanation: A product cost is an asset while the unit is in the factory or the warehouse, and becomes an expense only when the unit is sold.

  # ------------------------------------------------------------------ manufacturing cost
  - id: element-mcq
    type: mcq
    skills: [mfg-cost]
    difficulty: 1
    tags: [term]
    generator: elementQ
    lessonRef: { tab: intuition, id: build-the-cost }
    prompt: |
      Which element of manufacturing cost is this?

      **{=item}**
    hints:
      - Can it be traced to the product, or does it support the factory as a whole?
    explanation: 'It is **{=kindName}**. Materials and labor that can be traced to the product are direct; everything else needed to run the factory, including indirect materials and indirect labor, is factory overhead.'

  - id: prime-numeric
    type: numeric
    skills: [mfg-cost]
    difficulty: 1
    tags: [math]
    generator: primeQ
    lessonRef: { tab: math-code, id: manufacturing-cost }
    prompt: |
      A job used {=m1|money} and {=m2|money} of direct materials, {=l1|money} and {=l2|money} of direct labor, and
      {=oh|money} of applied factory overhead. What is its prime cost?
    answer: { var: prime, tol: 0.5 }
    hints:
      - Prime cost leaves one element out. Which?
    explanation: 'Prime cost $= \text{DM} + \text{DL} = {=dm|comma} + {=dl|comma} = {=prime|money}$. Overhead is not included.'

  - id: conversion-numeric
    type: numeric
    skills: [mfg-cost]
    difficulty: 1
    tags: [math]
    generator: conversionQ
    lessonRef: { tab: math-code, id: manufacturing-cost }
    prompt: |
      A job used {=m1|money} and {=m2|money} of direct materials, {=l1|money} and {=l2|money} of direct labor, and
      {=oh|money} of applied factory overhead. What is its conversion cost?
    answer: { var: conversion, tol: 0.5 }
    hints:
      - Conversion cost is the cost of converting materials into product.
    explanation: 'Conversion cost $= \text{DL} + \text{OH} = {=dl|comma} + {=oh|comma} = {=conversion|money}$. Direct materials are not included.'

  - id: mfg-handcalc
    type: hand-calc
    skills: [mfg-cost]
    difficulty: 2
    tags: [math]
    generator: mfgQ
    lessonRef: { tab: math-code, id: manufacturing-cost }
