          - Utilities are never costs
          - Power is direct when lights are on
        reasonAnswer: 0
        optionFeedback:
          1: A building-wide bill is shared.
          2: Time of day doesn't change traceability.
        reasonFeedback:
          1: Power is a real cost, just indirect.
          2: Traceability depends on measurement, not usage hours.
        explanation: Without a separate meter, the bill is indirect to any one ward.

  - id: transfer-ethics
    type: mcq
    skills: [ethics]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: ethics-standards }
    prompt: A cost analyst at a food company learns from internal reports that a big supplier contract will be cancelled next week, before it's announced. A friend asks whether to sell shares in that supplier. What should the analyst do?
    options:
      - Say nothing about it, because the information is confidential
      - Tell the friend, since it's only one person
      - Hint at it without saying it directly
      - Sell their own shares first, then keep quiet
    answer: 0
    optionFeedback:
      1: Sharing confidential information violates confidentiality whoever hears it.
      2: A hint still discloses confidential information.
      3: Trading on it is using confidential information for personal gain.
    hints: [Which standard covers information learned at work?]
    explanation: Confidentiality forbids disclosing or using information learned at work for personal advantage.
    variants:
      - prompt: An accountant is asked to prepare a cost report on a project their spouse manages. What should they do?
        options:
          - Disclose the conflict of interest and step aside if needed
          - Prepare it quietly, being extra careful
          - Make the numbers look slightly better to help
          - Refuse without saying why
        answer: 0
        optionFeedback:
          1: Care doesn't remove the appearance of a conflict; it must be disclosed.
          2: That violates integrity and credibility.
          3: The conflict should be disclosed, not hidden.
        explanation: Integrity requires avoiding and disclosing conflicts of interest.
      - prompt: A junior accountant is asked to prepare a variance analysis using a costing method they have never learned. What does the competence standard ask?
        options:
          - Get the training or help needed, or say they can't do it well yet
          - Do it anyway and hope for the best
          - Copy last year's report
          - Ask a friend outside the company to do it
        answer: 0
        optionFeedback:
          1: Competence means keeping up the knowledge to do the work properly.
          2: Copying old figures misstates the current period.
          3: That would also break confidentiality.
        explanation: Competence means developing the skills needed and recognizing limits.
