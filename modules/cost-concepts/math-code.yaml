sections:
  - id: accounting-compare
    title: Managerial and financial accounting, side by side
    skills: [accounting-types]
    summary: |
      Both branches draw on the same transaction data and reshape it for different readers. [[managerial-accounting|Managerial
      accounting]] serves insiders, looks ahead and favors speed. [[financial-accounting|Financial accounting]] serves
      outsiders, looks back, follows rules and is audited.
    keyFormula: '\text{Same data} \to \text{managerial reports (inside)} \ \text{or}\ \text{financial statements (outside)}'
    data: [accounting]
    steps:
      - tex: |
          \anchor{users}{\text{who reads it}},\ \anchor{time}{\text{which way it looks}},\ \anchor{rules}{\text{what rules bind it}}
        say: 'The first three differences: the reader, the time frame and the rule book.'
      - tex: |
          \anchor{unit}{\text{what it reports on}},\ \anchor{frequency}{\text{how often}},\ \anchor{audit}{\text{who checks it}},\ \anchor{speed}{\text{speed or precision}}
        say: 'The last four: the unit, the rhythm, the checking and the trade-off.'
    journal:
      title: The seven dimensions (slide 19)
      blocks:
        - { kind: schedule, title: Managerial against financial accounting, columns: [Managerial, Financial], rows: '@accounting.rows' }
    links:
      - { anchor: users, label: Primary users }
      - { anchor: time, label: Time orientation }
      - { anchor: rules, label: Rules }
      - { anchor: unit, label: Reporting unit }
      - { anchor: frequency, label: Frequency }
      - { anchor: audit, label: Verification }
      - { anchor: speed, label: Precision against speed }
    tryIt: [acct-mcq, acct-match, acct-multi]
    pitfalls:
      - Saying managerial accounting is "less accurate". It trades some precision for timeliness, and nobody audits it.
      - Treating the two as separate record systems. They share the same underlying data.
    examTip: Answer in pairs, "internal and future-oriented against external and historical," not as a list of one branch.

  - id: functions-roles
    title: The controlling loop, and who runs it
    skills: [mgmt-functions, org-roles]
    summary: |
      [[controlling|Controlling]] is a loop: set a standard, measure actual, find the [[variance|variance]], act and feed the
      lesson into the next [[planning|plan]]. The [[controller|Controller]] runs the information side of that loop; the
      [[treasurer|Treasurer]] runs the money side.
    keyFormula: '\text{Variance} = \text{actual} - \text{standard}'
    data: [functions]
    steps:
      - tex: |
          \anchor{standard}{\text{standard}} \to \anchor{actual}{\text{actual}} \to \anchor{variance}{\text{variance}} \to \anchor{act}{\text{act}}
        say: The four steps of the controlling feedback loop.
      - tex: |
          \anchor{controller}{\text{Controller}}: \text{information}
          \qquad
          \anchor{treasurer}{\text{Treasurer}}: \text{money}
        say: Both are staff roles reporting to the CFO. One manages information, the other manages cash.
    journal:
      title: Controlling and the two finance roles
      blocks:
        - { kind: schedule, title: 'The controlling loop (slide 15)', columns: [What happens], rows: '@functions.loop' }
        - { kind: schedule, title: 'Controller against Treasurer (slide 26)', columns: [Core focus, Typical outputs], rows: '@functions.roles' }
    links:
      - { anchor: standard, label: Standard, say: A budget or standard cost says what should happen. }
      - { anchor: actual, label: Actual, say: The accounting system records what did happen. }
      - { anchor: variance, label: Variance, say: The gap shows where attention is needed. }
      - { anchor: act, label: Act and feed forward }
      - { anchor: controller, label: Controller }
      - { anchor: treasurer, label: Treasurer }
    tryIt: [func-mcq, loop-order, role-match]
    pitfalls:
      - Treating decision making as a fourth step that happens after the others. It runs through planning and controlling.
      - Thinking a staff role has no authority at all. The Controller commands the accounting department.
    examTip: Name the function by what the manager is doing right now, not by the document in front of them.

  - id: value-chain-rule
    title: The value chain and the 1:10:100 rule
    skills: [value-chain]
    summary: |
      The [[value-chain|value chain]] links six functions that together create [[customer-value|customer value]].
      [[total-quality-management|Total quality management]] treats prevention as cheaper than repair: a defect that
      costs ₱1 at design costs about ₱10 in production and ₱100 at the customer.
    keyFormula: '\text{Cost of a defect} \approx 1:10:100 \quad (\text{design : production : customer})'
    state: { defects: 10 }
    derive:
      - { fn: qualityRule, in: { defects: '@defects' }, out: qr }
    live:
      - id: defects-in
        widget: Slider
        props: { label: Defects found, min: 1, max: 100, step: 1 }
        bind: { value: defects }
    steps:
      - tex: |
          \anchor{design}{1} : \anchor{production}{10} : \anchor{customer}{100}
        say: The rule of thumb behind the case for prevention spending.
      - tex: |
          \anchor{design}{ {=qr.design|comma} } \quad \anchor{production}{ {=qr.production|comma} } \quad \anchor{customer}{ {=qr.customer|comma} }
        say: 'The same defects, found at three different stages. This is illustrative, as the slide says.'
    journal:
      title: What the same defects cost
      blocks:
        - { kind: schedule, title: Pesos by stage of discovery, rows: '@qr.rows' }
    links:
      - { anchor: design, label: Caught at design, say: ₱1 per defect. }
      - { anchor: production, label: Caught in production, say: ₱10 per defect. }
      - { anchor: customer, label: Caught by the customer, say: '₱100 per defect, plus lost trust and sales.' }
    trace: { fn: qualityRule, in: { defects: '@defects' } }
    examples: [quality-rule]
    tryIt: [defect-numeric, defect-fill, chain-order]
    pitfalls:
      - Quoting 1:10:100 as a measured law. The slide calls it an illustrative rule of thumb.
    examTip: Link it to the cost of quality, "prevention and appraisal now, or internal and external failure later."

  - id: ethics-table
    title: The four IMA standards
    skills: [ethics]
    summary: |
      The [[ima-standards|IMA standards]] are [[competence|competence]], [[confidentiality|confidentiality]],
      [[integrity|integrity]] and [[credibility|credibility]]. Managerial reports are not audited, so the preparer's own
      integrity is often the only safeguard.
    keyFormula: 'C_1\ \text{Competence}\quad C_2\ \text{Confidentiality}\quad C_3\ \text{Integrity}\quad C_4\ \text{Credibility}'
    data: [ethics]
    steps:
      - tex: |
          \anchor{competence}{C_1} \quad \anchor{confidentiality}{C_2}
        say: Know your craft; keep what you learn private.
      - tex: |
          \anchor{integrity}{C_3} \quad \anchor{credibility}{C_4}
        say: Do not bend the numbers; present them fairly and completely.
    journal:
      title: Slides 42–49 and 80–81
      blocks:
        - { kind: schedule, title: The four standards, columns: [What it asks, Violated in], rows: '@ethics.rows' }
    links:
      - { anchor: competence, label: Competence }
      - { anchor: confidentiality, label: Confidentiality }
      - { anchor: integrity, label: Integrity, say: Delaying a real expense to reach a bonus is a failure of integrity. }
      - { anchor: credibility, label: Credibility, say: 'Inflated figures, even on an internal dashboard, do not communicate fairly.' }
    tryIt: [ethics-mcq, ethics-match, ethics-multi]
    pitfalls:
      - Saying an internal report cannot be unethical because it is not audited. The lack of audit is why ethics matters most.
      - Calling a one-quarter delay "just timing". The slide names that rationalization.
    examTip: Name the standards, say which is violated and why, then state what the person should do.

  - id: direct-indirect
    title: Direct or indirect, for which cost object?
    skills: [cost-objects]
    summary: |
      A [[direct-cost|direct cost]] can be traced to a [[cost-object|cost object]] cheaply; an
      [[indirect-cost|indirect cost]] cannot. It is not the cost that is direct or indirect, but its relationship to the
      object you chose.
    keyFormula: '\text{Direct to } O \iff \text{traceable to } O \text{ at reasonable cost}'
    data: [furniture]
    steps:
      - tex: |
          \anchor{direct}{\text{Direct}}: \text{traced to this object}
        say: A clear link, and tracing is worth the effort.
      - tex: |
          \anchor{indirect}{\text{Indirect}}: \text{shared, spread with a cost driver}
        say: Related to the object but not traceable to it alone.
      - tex: |
          \text{Same cost, two objects} \Rightarrow \text{direct to one, indirect to the other}
        say: Chair fabric is direct to chairs and indirect to tables.
    journal:
      title: Cordillera Craft Furniture (slides 56–57)
      blocks:
        - { kind: schedule, title: 'The same four costs, two cost objects', columns: [A batch of dining tables, A set of dining chairs], rows: '@furniture.rows' }
    links:
      - { anchor: direct, label: Direct, say: Traceable to the chosen cost object. }
      - { anchor: indirect, label: Indirect, say: Not traceable to the chosen cost object. }
    tryIt: [direct-mcq, cost-object-mcq, driver-mcq]
    pitfalls:
      - Calling a cost "direct" without naming the cost object.
      - Treating indirect as "unimportant". It is real cost that must be allocated.
    examTip: Write "Direct to [object]" or "Indirect to [object]". A bare "direct" loses marks.

  - id: manufacturing-cost
    title: Building total manufacturing cost
    skills: [mfg-cost]
    summary: |
      Total manufacturing cost is [[direct-materials|direct materials]] plus [[direct-labor|direct labor]] plus
      [[factory-overhead|factory overhead]]. [[prime-cost|Prime cost]] and [[conversion-cost|conversion cost]] are
      overlapping groupings; direct labor sits in both and is counted once in the total.
    keyFormula: '\text{Total} = \text{DM} + \text{DL} + \text{OH}'
    data: [tarpaulin]
    derive:
      - { fn: mfgCost, in: { materials: '@tarpaulin.materials', labor: '@tarpaulin.labor', overhead: '@tarpaulin.overhead' }, out: mc }
    steps:
      - tex: |
          \anchor{prime}{\text{Prime}} = \anchor{dm}{\text{DM}} + \anchor{dl}{\text{DL}}
          \qquad
          \anchor{conv}{\text{Conversion}} = \anchor{dl}{\text{DL}} + \anchor{oh}{\text{OH}}
        say: Two groupings of the same three elements.
      - tex: |
          \anchor{total}{\text{Total}} = \anchor{dm}{\text{DM}} + \anchor{dl}{\text{DL}} + \anchor{oh}{\text{OH}}
        say: Direct labor is in both groupings but appears once here.
      - tex: |
          \anchor{total}{ {=mc.total|comma} } = \anchor{dm}{ {=mc.dm|comma} } + \anchor{dl}{ {=mc.dl|comma} } + \anchor{oh}{ {=mc.oh|comma} }
        say: 'Bulacan Prints & Fab: the tarpaulin job comes to ₱92,400.'
    journal:
      title: Bulacan Prints & Fab, event-tarpaulin job (Example 4)
      blocks:
        - { kind: schedule, title: Cost build-up, rows: '@mc.rows' }
    links:
      - { anchor: dm, label: Direct materials }
      - { anchor: dl, label: Direct labor }
      - { anchor: oh, label: Applied overhead }
      - { anchor: prime, label: Prime cost }
      - { anchor: conv, label: Conversion cost }
      - { anchor: total, label: Total manufacturing cost }
    trace: { fn: mfgCost, in: { materials: '@tarpaulin.materials', labor: '@tarpaulin.labor', overhead: '@tarpaulin.overhead' } }
    examples: [tarpaulin-cost, tarpaulin-walk]
    tryIt: [mfg-handcalc, mfg-fill, prime-numeric, conversion-numeric]
    pitfalls:
      - Adding prime and conversion cost to get the total. That counts direct labor twice.
      - Treating glue, nails and supervisors' wages as direct. They are indirect materials and indirect labor, part of overhead.
    examTip: Compute DM, DL and OH first. Then prime, conversion and total are one addition each.

  - id: cost-flow
    title: From Work in Process to expense
    skills: [product-period]
    beyondSlides: true
    summary: |
      A [[product-cost|product cost]] enters Work in Process, moves to [[inventory|finished goods inventory]], and becomes
      an expense, [[cost-of-goods-sold|cost of goods sold]], only when the unit is sold. A [[period-cost|period cost]]
      skips all that and is expensed at once. The entries are the module's, not the deck's.
    keyFormula: '\text{WIP} \to \text{Finished goods} \to \text{COGS}'
    state: { soldPct: 0.4 }
    data: [tarpaulin]
    derive:
      - { fn: costFlow, in: { dm: 75500, dl: 10400, oh: 6500, soldPct: '@soldPct' }, out: cf }
    live:
      - id: sold-in
        widget: Slider
        props: { label: Share of the units sold, min: 0, max: 1, step: 0.1, format: pct }
        bind: { value: soldPct }
    steps:
      - tex: |
          \anchor{wip}{\text{WIP}} \to \anchor{fg}{\text{Finished goods}} \to \anchor{cogs}{\text{COGS}}
        say: The three stops of a product cost.
      - tex: |
          \anchor{cogs}{ {=cf.cogs|comma} } = {=soldPct|pct} \times {=cf.total|comma}
        say: Only the units sold leave inventory.
      - tex: |
          \anchor{fg}{ {=cf.fg|comma} } = {=cf.total|comma} - {=cf.cogs|comma}
        say: The rest is still an asset.
    journal:
      title: The tarpaulin job, ₱92,400
      blocks:
        - { kind: schedule, title: Where the cost sits, rows: '@cf.rows' }
        - { kind: entries, title: The entries, entries: '@cf.entries' }
    links:
      - { anchor: wip, label: Work in Process, say: 'Materials, labor and overhead are debited here as they are used.' }
      - { anchor: fg, label: Finished Goods, say: Still an asset until the units are sold. }
      - { anchor: cogs, label: Cost of Goods Sold, say: An expense on the income statement. }
    trace: { fn: costFlow, in: { dm: 75500, dl: 10400, oh: 6500, soldPct: '@soldPct' } }
    examples: [tarpaulin-flow, tarpaulin-unsold]
    tryIt: [cogs-numeric, cogs-fill, complete-je]
    pitfalls:
      - Expensing the whole job when it is finished. It is still inventory until it is sold.
      - Treating delivery-truck depreciation as a product cost. It happens after production, so it is a period cost.
    examTip: Ask "inside the factory to make the product?" Yes means product cost; no means period cost.
