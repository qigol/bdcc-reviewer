skills:
  - id: accounting-types
    label: Managerial against financial accounting
    description: Users, time orientation, rules, unit, frequency, verification and speed.
  - id: mgmt-functions
    label: Planning, controlling and decision making
    description: The three functions, the controlling loop and how they overlap.
  - id: org-roles
    label: Line, staff, Controller and Treasurer
