terms:
  - id: cost
    term: Cost
    short: The money value of the resources given up, used or set aside to make something or to do something.
    long: |
      "Different costs for different purposes": a cost that is right for valuing inventory may be wrong for a pricing
      decision, so a number is only a cost of something specific.
    related: [cost-object]
    skills: [accounting-types]
  - id: managerial-accounting
    term: Managerial accounting
    aka: [management accounting]
    short: Accounting that collects and reports information for managers inside the organization to plan, control and decide.
    related: [financial-accounting]
    skills: [accounting-types]
  - id: financial-accounting
    term: Financial accounting
    short: Accounting that prepares rule-bound, audited statements for outsiders such as investors, lenders and regulators.
    related: [managerial-accounting]
    skills: [accounting-types]
  - id: planning
    term: Planning
    short: Choosing goals and the means of reaching them, and expressing them in budgets, forecasts and strategic plans.
    related: [budget, controlling]
    skills: [mgmt-functions]
  - id: budget
    term: Budget
    short: A plan that puts numbers on the activity and costs a business expects in a future period.
    related: [planning, variance]
    skills: [mgmt-functions]
  - id: controlling
    term: Controlling
    short: Watching how the plan is carried out, comparing actual results with the plan and acting on the gaps.
    related: [planning, variance]
    skills: [mgmt-functions]
  - id: variance
    term: Variance
    short: The gap between what was planned or expected and what actually happened, which shows where to look.
    related: [controlling, budget]
    skills: [mgmt-functions]
  - id: decision-making
    term: Decision making
    short: Choosing between alternatives. It happens inside both planning and controlling and is not a separate step.
    related: [planning, controlling]
    skills: [mgmt-functions]
  - id: line-authority
    term: Line authority
    short: The right to give direct orders to people in the chain, held by managers directly responsible for the main objectives.
    related: [staff-authority]
    skills: [org-roles]
  - id: staff-authority
    term: Staff authority
    short: A support and advisory role with no direct command over the line, as the accounting function has to production.
    related: [line-authority, controller]
    skills: [org-roles]
  - id: controller
    term: Controller
    short: The chief management accounting executive, who designs the accounting system, budgets and internal reports.
    related: [treasurer, staff-authority]
    skills: [org-roles]
  - id: treasurer
    term: Treasurer
    short: The finance executive in charge of cash, banks, credit, insurance and raising money, which is the money side of finance.
    related: [controller, staff-authority]
    skills: [org-roles]
  - id: value-chain
    term: Value chain
    short: The linked functions that turn inputs into something a customer values, from research and design to customer service.
    related: [customer-value]
    skills: [value-chain]
  - id: customer-value
    term: Customer value
    short: What the customer receives (performance, quality, service) minus what the customer gives up (price, time, effort).
    related: [value-chain]
    skills: [value-chain]
  - id: lean-thinking
    term: Lean thinking
    aka: [lean manufacturing]
    short: A philosophy of removing waste, meaning any activity that uses resources without adding value for the customer.
    related: [total-quality-management]
    skills: [value-chain]
  - id: total-quality-management
    term: Total quality management
    aka: [TQM]
    short: An approach in which every employee in every function works continuously to improve quality, because preventing defects is cheaper than fixing them.
    related: [cost-of-quality, lean-thinking]
    skills: [value-chain]
  - id: cost-of-quality
    term: Cost of quality
    short: The total of prevention, appraisal, internal failure and external failure costs. It can reach 20–25% of sales in some industries.
    related: [total-quality-management]
    skills: [value-chain]
  - id: ima-standards
    term: IMA standards
    aka: [IMA Statement of Ethical Professional Practice]
    short: The four principles of conduct, competence, confidentiality, integrity and credibility, that guide management accountants.
    related: [competence, confidentiality, integrity, credibility]
    skills: [ethics]
  - id: competence
    term: Competence
    short: Keeping up the expertise needed for the job and following the laws and technical standards that apply.
    related: [ima-standards]
    skills: [ethics]
  - id: confidentiality
    term: Confidentiality
    short: Keeping information private unless disclosure is authorized or required, and never using it for personal gain.
    related: [ima-standards]
    skills: [ethics]
  - id: integrity
    term: Integrity
    short: Avoiding conflicts of interest and any conduct that would discredit the profession, and speaking up when asked to misstate results.
    related: [ima-standards]
    skills: [ethics]
  - id: credibility
    term: Credibility
    short: Communicating information fairly and objectively, and disclosing everything a user would need to understand it.
    related: [ima-standards]
    skills: [ethics]
  - id: cost-object
    term: Cost object
    short: Anything for which management wants a separate measure of cost, such as a product, a service, a department or a customer.
    related: [direct-cost, indirect-cost]
    skills: [cost-objects]
  - id: direct-cost
    term: Direct cost
    short: A cost that can be traced to one cost object clearly and at a reasonable cost, such as the wood in one table.
    related: [indirect-cost, cost-object]
    skills: [cost-objects]
  - id: indirect-cost
    term: Indirect cost
    short: A cost linked to a cost object that cannot be traced to it cheaply, so it must be shared out using a cost driver.
    related: [direct-cost, cost-driver]
    skills: [cost-objects]
  - id: cost-driver
    term: Cost driver
    short: A factor that causes, or moves closely with, a change in cost, such as machine hours or number of orders.
    related: [indirect-cost]
    skills: [cost-objects]
  - id: cost-pool
    term: Cost pool
    short: A group of indirect costs collected together before they are assigned to cost objects.
    related: [indirect-cost, cost-driver]
    skills: [cost-objects]
  - id: product-cost
    term: Product cost
    aka: [inventoriable cost]
    short: A cost of making a product. It sits in inventory as an asset until the unit is sold, and only then becomes an expense.
    related: [period-cost, inventory]
    skills: [product-period]
  - id: period-cost
    term: Period cost
    short: A cost that is expensed in the period it is incurred whether or not anything was sold, such as selling and administrative costs.
    related: [product-cost]
    skills: [product-period]
  - id: inventory
    term: Inventory
    short: Goods that have been bought or made and not yet sold. It is an asset on the balance sheet.
    related: [product-cost, cost-of-goods-sold]
    skills: [product-period]
  - id: cost-of-goods-sold
    term: Cost of goods sold
    aka: [COGS]
    short: The product cost of the units that were sold in the period. It is an expense on the income statement.
    related: [inventory, product-cost]
    skills: [product-period]
  - id: direct-materials
    term: Direct materials
    short: Raw materials that become a physical part of the finished product and can be traced to it economically.
    related: [direct-labor, factory-overhead]
    skills: [mfg-cost]
  - id: direct-labor
    term: Direct labor
    short: The wages of workers who physically convert materials into the finished product and whose time can be traced to it.
    related: [direct-materials, factory-overhead]
    skills: [mfg-cost]
  - id: factory-overhead
    term: Factory overhead
    aka: [manufacturing overhead, overhead]
    short: All manufacturing costs other than direct materials and direct labor, including indirect materials and indirect labor.
    related: [direct-materials, direct-labor]
    skills: [mfg-cost]
  - id: prime-cost
    term: Prime cost
    short: Direct materials plus direct labor, the two elements most directly tied to the product.
    formula: '\text{Prime cost} = \text{DM} + \text{DL}'
    related: [conversion-cost, total-manufacturing-cost]
    skills: [mfg-cost]
  - id: conversion-cost
    term: Conversion cost
    short: Direct labor plus factory overhead, the cost of turning materials into a finished product.
    formula: '\text{Conversion cost} = \text{DL} + \text{OH}'
    related: [prime-cost, total-manufacturing-cost]
    skills: [mfg-cost]
  - id: total-manufacturing-cost
    term: Total manufacturing cost
    short: Direct materials plus direct labor plus factory overhead. Direct labor is counted once even though it is in both prime and conversion cost.
    formula: '\text{Total} = \text{DM} + \text{DL} + \text{OH}'
    related: [prime-cost, conversion-cost]
    skills: [mfg-cost]
