examples:
  - id: hp-means
    source: 'Sessions 5–7, slide 3'
    page: 2
    fn: rowMeans
    in: { matrix: '@hp4x7' }
    expect: { means: [3.333, 4.667, 3.667, 3] }
    tol: 0.01
    note: '10/3, 14/3, 11/3, 3'
  - id: hp-center-a
    source: 'Sessions 5–7, slide 4'
    page: 2
    fn: center
    in: { matrix: '@hp4x7' }
    expect: { values.0: [0.667, null, null, 1.667, -2.333, null, null] }
    tol: 0.01
    note: 'A: 2/3, 5/3, −7/3'
  - id: hp-sim-ba
    source: 'Sessions 5–7, slide 5'
    page: 3
    fn: sim
    in: { matrix: '@hp4x7', a: B, b: A, mode: user }
    expect: { sim: 1, overlap: 1 }
    tol: 0.01
    note: 'Only HP1 is co-rated: the one-overlap trap.'
  - id: hp-sim-ca
    source: 'Sessions 5–7, slide 5'
