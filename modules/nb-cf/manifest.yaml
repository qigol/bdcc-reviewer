objectives:
  - id: center
    text: Compute each user's mean over the items they rated and mean-center a ratings matrix by hand.
    skills: [mean-centering]
  - id: similarity
    text: Compute the cosine similarity of two users, or the adjusted cosine of two items, over co-rated entries only, and spot when it rests on too few.
    skills: [similarity, ibcf-similarity, sparsity-pitfalls]
  - id: user-based
    text: Predict a missing rating with user-based CF, choosing the top-k positive neighbours and adding the user's mean back.
    skills: [neighbors, ubcf-predict]
  - id: item-based
    text: Predict a missing rating with item-based CF from the user's own ratings of the most similar items, and explain when a cell stays blank.
    skills: [ibcf-predict, neighbors, sparsity-pitfalls]
  - id: ranking
    text: Score a recommended list with DCG, IDCG and NDCG, and explain what each one measures.
    skills: [dcg, ndcg]
