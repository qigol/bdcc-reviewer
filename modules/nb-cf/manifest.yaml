title: Neighborhood-based Collaborative Filtering
shortTitle: NB-CF
summary: |
  Predict missing ratings from similar users or similar items: mean-center, compare over co-rated entries,
  borrow the opinions of the top-k positive neighbours, then judge the ranking with DCG and NDCG.
