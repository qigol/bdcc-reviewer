sections:
  - id: mean-centering
    title: Row means and mean-centering
    skills: [mean-centering]
    summary: |
      Some people rate everything high, some rate everything low. Subtract each user's own average so
      a rating becomes "above or below what this person usually gives". In numpy the whole matrix is centered at once.
    keyFormula: '\mu_u = \frac{1}{|I_u|}\sum_{j \in I_u} r_{uj}, \quad s_{uj} = r_{uj} - \mu_u'
    data: [hp4x7]
    derive:
      - { fn: center, in: { matrix: '@hp4x7' }, out: c }
    live:
      - id: matrix
        widget: Matrix
        props:
          data: '@hp4x7'
          title: Harry Potter / Twilight / Star Wars ratings
          showRowMeans: true
    steps:
      - tex: |
          \anchor{rated}{M_{uj} = \begin{cases} \text{T} & r_{uj} \text{ observed} \\ \text{F} & \text{blank} \end{cases}}
        say: |
          The ratings live in a users × items array `R`, with `np.nan` for a blank. `np.isnan(R)` is True at every
          blank and `~` flips it (element-wise NOT), so `M` marks the ratings that exist. Blanks are not zeros.
      - tex: |
          \mu_u = \frac{\anchor{total}{\sum_{j \in I_u} r_{uj}}}{\anchor{count}{|I_u| = \sum_j M_{uj}}}, \qquad \anchor{mu}{\text{mu} = \text{totals} \,/\, \text{counts}}
        say: |
          $I_u$ ("I sub u") is the set of items user u rated, and $|I_u|$ is how many there are.
          `axis=1` means "along each row", giving one number per user. `M.sum(axis=1)` counts the Trues (True = 1),
          and `np.nansum(R, axis=1)` adds the ratings while skipping NaN. `keepdims=True` keeps both as m × 1 columns,
          so `/` divides them row by row.
      - tex: |
          \anchor{s}{S = R - \boldsymbol{\mu}\,\mathbf{1}^{\top}}, \quad \text{i.e. } s_{uj} = r_{uj} - \mu_u, \qquad \anchor{ret}{\boldsymbol{\mu} = (\mu_1, \dots, \mu_m)}
        say: |
          `R` is m × n and `mu` is m × 1. **Broadcasting** repeats `mu` across the n columns (that is $\boldsymbol\mu\mathbf{1}^\top$),
          so each rating loses its own row's mean, and NaN − μ stays NaN. `mu.ravel()` hands the means back as a flat 1-D array.
      - tex: |
          \mu_A = \anchor{mu}{\tfrac{4 + 5 + 1}{3} = {=c.meansMap.A|frac}}, \qquad s_{A,\text{HP1}} = \anchor{s}{4 - \tfrac{10}{3} = {=c.values.0.0|frac}}
        say: 'The lecture''s HP example. B''s mean is {=c.meansMap.B|frac}, C''s {=c.meansMap.C|frac}, D''s {=c.meansMap.D|frac}. Step through to see the array each line produces.'
    code:
      lang: python
      source: |
        import numpy as np

        def center(R):
            """Mean-center each user's ratings.

            Args:
                R: users × items ratings, np.nan where a user did not rate.

            Returns:
                (S, mu): S = R minus each row's mean (blanks stay np.nan, every
                row of S sums to 0), and mu = the user means as a 1-D array.
                Lecture: mu == [10/3, 14/3, 11/3, 3] for users A–D.
            """
            # @a rated
            # True where a rating exists (~ flips np.isnan)
            M = ~np.isnan(R)
            # @end
            # @a count
            # ratings per user: sum along each row, True = 1
            counts = M.sum(axis=1, keepdims=True)
            # @end
            # @a total
            # sum of each row's ratings, skipping NaN
            totals = np.nansum(R, axis=1, keepdims=True)
            # @end
            # @a mu
            # row means: two m × 1 columns, divided row by row
            mu = totals / counts
            # @end
            # @a s
            # broadcast: each row's mean is subtracted from that row
            S = R - mu
            # @end
            # @a ret
            # hand back the means as a flat 1-D array
            return S, mu.ravel()
            # @end
    extraCode:
      - lang: python
        title: Shortcut (np.nanmean)
        source: |
          import numpy as np

          def center(R):
              """Same result as the step-by-step version, using np.nanmean.

              Returns:
                  (S, mu): centered ratings and the user means.
              """
              mu = np.nanmean(R, axis=1)     # mean of each row, NaN skipped
              S = R - mu[:, None]            # [:, None] turns mu into a column
              return S, mu
    links:
      - { anchor: rated, label: 'M: True where rated', say: '`np.isnan` is True at NaN; `~` negates every entry.' }
      - { anchor: count, label: '|Iᵤ|: ratings per user', say: '`.sum(axis=1)` collapses the columns; True counts as 1.' }
      - { anchor: total, label: 'Σ rᵤⱼ over rated items', say: '`np.nansum` treats NaN as absent; a plain `.sum` would return NaN.' }
      - { anchor: mu, label: 'μᵤ = totals / counts', say: 'Two m × 1 columns divided entry by entry.' }
      - { anchor: s, label: 'S = R − μ (broadcast)', say: 'An m × 1 column is stretched across the n columns before subtracting.' }
      - { anchor: ret, label: 'μ as a 1-D array', say: '`ravel()` flattens shape (m, 1) to (m,).' }
    trace: { fn: centerCode, in: { matrix: '@hp4x7' } }
    examples: [hp-means, hp-center-a, ab-means]
    pitfalls:
      - '`R.mean(axis=1)` returns NaN for any user with a blank. Use `np.nansum` over the counts (or `np.nanmean`).'
      - Divide by the number of ratings the user gave, not by the number of columns (`R.shape[1]`).
      - 'Without `keepdims=True` (or `mu[:, None]`), `mu` has shape (m,) and broadcasting lines it up with the **columns**: an error, or silently wrong when m = n.'
      - Missing ratings stay missing after centering; they do not become −μᵤ.
    examTip: Keep fractions (10/3, 14/3 …) until the end; the lecture's centered HP table is in thirds.
    tryIt: [mean-numeric, center-numeric, code-center]

  - id: similarity
    title: 'User similarity: cosine over co-rated items'
    skills: [similarity]
    summary: |
      Compare two users only on the items **both** rated, using their [[mean-centering|centered]] ratings. The result is a
      [[cosine-similarity|cosine]] between −1 (opposite tastes) and 1 (same tastes); no overlap, or a zero vector, gives 0.
      The code does one pair at a time; the extra tab fills the whole user × user table at once.
    keyFormula: '\text{sim}(u,v) = \frac{\sum_{j \in I_u \cap I_v} s_{uj} s_{vj}}{\sqrt{\sum_{j \in I_u \cap I_v} s_{uj}^2}\sqrt{\sum_{j \in I_u \cap I_v} s_{vj}^2}}'
    data: [ab5x6]
    state: { a: A, b: B }
    derive:
      - { fn: sim, in: { matrix: '@ab5x6', a: '@a', b: '@b', mode: user }, out: s }
      - { fn: simSheet, in: { matrix: '@ab5x6', a: '@a', b: '@b', mode: user }, out: ws }
    steps:
      - tex: |
          \anchor{corated}{I_u \cap I_v = \{\, j : u \text{ rated } j \text{ and } v \text{ rated } j \,\}}
        say: |
          $I_u$ ("I sub u") is the set of items u rated, and ∩ ("intersect") keeps the items in both sets: the
          [[co-rated]] items. In code, `np.isnan` is True at a blank, `~` flips it, and `&` is an element-wise "and".
          `S[u, both]` keeps only those entries.
      - tex: |
          \anchor{dot}{\sum_{j \in I_u \cap I_v} s_{uj}\, s_{vj}}
        say: '`a @ b` on two 1-D arrays multiplies them entry by entry and adds: the [[dot-product|dot product]] over the co-rated items.'
      - tex: |
          \anchor{norm}{\sqrt{\textstyle\sum_{j \in I_u \cap I_v} s_{uj}^2}\;\sqrt{\textstyle\sum_{j \in I_u \cap I_v} s_{vj}^2}}
        say: |
          `np.linalg.norm(a)` is the square root of the sum of squares of `a`, its [[norm|length]]. Because `a` and `b`
          already hold only the co-rated entries, these are the lecture's lengths.
      - tex: |
          \anchor{sim}{\text{sim}(u,v) = \frac{\text{dot}}{\|a\|\,\|b\|}} \quad (0 \text{ if a length is } 0)
        say: No overlap, or a zero vector, makes a length 0; return 0 instead of dividing by 0.
      - tex: |
          \anchor{sim}{ {=ws.simTex} }
        say: 'At the default pair (A, B) the lecture''s table shows 0.70. Pick another pair to see its co-rated items ({=s.overlap} here: {=s.corated|list}). Step through to see each line on the data.'
    code:
      lang: python
      source: |
        import numpy as np

        def sim(S, u, v):
            """Centered cosine of users u and v over the items both rated.

            Args:
                S: users × items centered ratings, np.nan = blank.
                u, v: the two rows to compare.

            Returns:
                float in [−1, 1]; 0 when they share no rated item or a
                length is 0.
                Lecture: sim(S, B, A) == 0.70 on the 5 × 6 matrix.
            """
            # @a corated
            # True where both rated; keep only those entries
            both = ~np.isnan(S[u]) & ~np.isnan(S[v])
            a, b = S[u, both], S[v, both]
            # @end
            # @a dot
            # multiply pairwise and add
            dot = a @ b
            # @end
            # @a norm
            # lengths over the same co-rated items
            norm = np.linalg.norm(a) * np.linalg.norm(b)
            # @end
            # @a sim
            # no overlap or a zero vector gives 0
            return 0.0 if norm == 0 else dot / norm
            # @end
    extraCode:
      - lang: python
        title: All pairs at once (numpy)
        source: |
          import numpy as np

          def user_sims(S):
              """Centered cosine of every pair of users, over co-rated items only.

              Args:
                  S: users × items centered ratings, np.nan = blank.

              Returns:
                  users × users array of similarities; 0 where a pair shares
                  no rated item (a length of 0).
              """
              M = (~np.isnan(S)).astype(float)   # 1 = rated, 0 = blank
              Z = np.nan_to_num(S)               # blanks become 0
              dot = Z @ Z.T                      # every row · row at once
              ss = (Z ** 2) @ M.T                # u's squares, only where v also rated
              nu = np.sqrt(ss)                   # ‖u‖ over the items both rated
              den = nu * nu.T                    # ‖u‖ · ‖v‖, entry by entry
              safe = np.where(den > 0, den, 1.0) # never divide by 0
              return np.where(den > 0, dot / safe, 0.0)
    links:
      - { anchor: corated, label: 'Iᵤ ∩ Iᵥ: co-rated items', say: 'A boolean mask, then boolean indexing keeps those entries.' }
      - { anchor: dot, label: 'dot product', say: '`@` on two vectors is the dot product.' }
      - { anchor: norm, label: 'lengths over the co-rated items', say: '`np.linalg.norm` of the already-cut arrays.' }
      - { anchor: sim, label: 'the similarity, in [−1, 1]', say: 'A conditional expression returns 0 when a length is 0.' }
    trace: { fn: sim, in: { matrix: '@ab5x6', a: '@a', b: '@b', mode: user } }
    examples: [ab-sim-ab, ab-sim-ac, ab-sim-bc, ab-sim-bd, ab-sim-de, hp-sim-ca, hp-sim-cb, hp-sim-da]
    pitfalls:
      - 'A length over **all** of a user''s ratings (`np.linalg.norm` of the whole row, ignoring the other user) is wrong. The lecture''s lengths run over the co-rated items only. `np.linalg.norm(a)` on the co-rated slice is right.'
      - Center first. The cosine of raw ratings is almost always positive because ratings are positive numbers.
      - '`*` is element-wise and `@` is the dot (or matrix) product. Swapping them gives arrays of a plausible shape with the wrong meaning.'
    examTip: 'Write the two centered vectors restricted to co-rated items side by side; then dot, lengths, divide.'
    tryIt: [sim-numeric, sim-hand, code-sim]

  - id: neighbors
    title: Choosing the neighbours
    skills: [neighbors]
    summary: |
      Only peers who actually rated the target item can vote. Take the k most similar of them, then drop anyone with
      similarity ≤ 0. If nobody is left, leave the prediction blank. In numpy this is masking, sorting and indexing.
    keyFormula: 'P_u(j) = \{ v \in \text{top-}k(R_j) : \text{sim}(u,v) > 0 \}'
    data: [ab5x6]
    state: { user: B, item: c, k: 3 }
    derive:
      - { fn: predict, in: { matrix: '@ab5x6', user: '@user', item: '@item', k: '@k', mode: user }, out: p }
    live:
      - id: k-slider
        widget: Slider
        region: top
        props: { label: 'k (neighbours)', min: 1, max: 4, step: 1 }
        bind: { value: k }
      - id: matrix
        widget: Matrix
        props:
          data: '@ab5x6'
          title: Five users × six items
          showRowMeans: false
    steps:
      - tex: |
          R_j = \{\, v : \anchor{raters}{r_{vj} \text{ observed}},\ \anchor{self}{v \neq u} \,\} \;\to\; \anchor{idx}{\text{their row numbers}}
        say: |
          $R_j$, the candidates, are the other users who rated item j. `S[:, j]` is column j (every user's centered rating of j);
          `np.flatnonzero` turns a True/False array into the positions of its Trues.
      - tex: |
          \anchor{sort}{\text{sort } R_j \text{ by sim}(u, v), \text{ largest first}} \;\Rightarrow\; \anchor{topk}{\text{top-}k}
        say: |
          `sims[u, cands]` reads the candidates' similarities to u. `np.argsort` returns the order that would sort an array **ascending**, so sorting the negatives (`-sc`) puts the most similar first.
          `kind='stable'` keeps ties in row order (the lecture's tie-break). `order[:k]` keeps k, and `cands[order[:k]]` maps them back to rows.
      - tex: |
          P_u(j) = \anchor{pos}{\{ v \in \text{top-}k : \text{sim}(u,v) > 0 \}}
        say: '$P_u(j)$ is the lecture''s name for the neighbours actually used: the top k, positive only. `sims[u, top] > 0` is a True/False array; `top[...]` with it keeps the True positions (boolean indexing).'
      - tex: |
          \text{top-}{=k}: \text{ {=p.top|list} } \;\Rightarrow\; \anchor{pos}{P_u(j) = \{\text{ {=p.used|list} }\}}
        say: 'At the default k = 3 for B·c: C 0.94, A 0.70 and D −0.72 make the top 3, and D is dropped for its negative similarity. Move k to see the sets change.'
    code:
      lang: python
      source: |
        import numpy as np

        def neighbors(S, sims, u, j, k):
            """User u's usable neighbours for item j, as row numbers.

            The k users most similar to u among those who rated j (u excluded),
            then only the ones with a positive similarity.

            Args:
                S: centered ratings; sims: user_sims(S).
                u: row of the target user; j: column of the target item.
                k: how many neighbours to keep before the sim > 0 filter.

            Returns:
                1-D int array of rows, most similar first (may be empty).
            """
            # @a raters
            # who rated item j? (column j of S)
            raters = ~np.isnan(S[:, j])
            # @end
            # @a self
            # u can't vote for itself
            raters[u] = False
            # @end
            # @a idx
            # row numbers of the True entries
            cands = np.flatnonzero(raters)
            # @end
            # @a sort
            # their similarity to u; sort the negatives = best first
            sc = sims[u, cands]
            order = np.argsort(-sc, kind='stable')
            # @end
            # @a topk
            # the k most similar candidates
            top = cands[order[:k]]
            # @end
            # @a pos
            # keep only positive similarities
            return top[sims[u, top] > 0]
            # @end
    links:
      - { anchor: raters, label: 'rated item j?', say: 'Column slice `S[:, j]`, then a NaN test.' }
      - { anchor: self, label: 'not u itself', say: 'Assigning into a boolean array by index.' }
      - { anchor: idx, label: 'candidate rows', say: '`np.flatnonzero` gives the indices of the True entries.' }
      - { anchor: sort, label: 'sort by similarity', say: 'argsort of the negated similarities = descending order.' }
      - { anchor: topk, label: 'top-k', say: 'Slice the first k, then index `cands` with them.' }
      - { anchor: pos, label: 'then sim > 0', say: 'Boolean indexing keeps the positive neighbours.' }
    trace: { fn: neighborsCode, in: { matrix: '@ab5x6', user: '@user', item: '@item', k: '@k' } }
    examples: [ub-b-c, ub-e-b, ib-hp-c-hp2-blank]
    pitfalls:
      - Take the top-k **before** filtering; a negative neighbour still occupies a top-k slot (in the lecture's E·b, only D is left).
      - Users who didn't rate the item can't be neighbours, however similar they are.
      - '`np.argsort(sims[u, cands])` without the minus sign sorts from least to most similar.'
    examTip: 'Circle the raters of the target column, sort them by similarity, cross out beyond k and any sim ≤ 0.'
    tryIt: [neighbors-multi, positive-only]

  - id: ub-predict
    title: User-based prediction (and adding the mean back)
    skills: [ubcf-predict, neighbors]
    summary: |
      The centered prediction is the similarity-weighted average of the neighbours' centered ratings for the item:
      in numpy, one dot product divided by one sum. The slides stop there; add the user's own mean to turn it back into a rating.
    keyFormula: '\hat s_{uj} = \frac{\sum_{v \in P_u(j)} \text{sim}(u,v)\, s_{vj}}{\sum_{v \in P_u(j)} \text{sim}(u,v)}, \quad \hat r_{uj} = \hat s_{uj} + \mu_u'
    data: [ab5x6]
    state: { user: B, item: c, k: 3 }
    derive:
      - { fn: predict, in: { matrix: '@ab5x6', user: '@user', item: '@item', k: '@k', mode: user }, out: p }
      - { fn: predictSheet, in: { matrix: '@ab5x6', user: '@user', item: '@item', k: '@k', mode: user }, out: ps }
    live:
      - id: k-slider
        widget: Slider
        region: top
        props: { label: 'k (neighbours)', min: 1, max: 4, step: 1 }
        bind: { value: k }
      - id: matrix
        widget: Matrix
        props:
          data: '@ab5x6'
          title: Five users × six items
          showRowMeans: false
    steps:
      - tex: |
          \anchor{nbrs}{N = P_u(j)} \ (\text{previous section}), \qquad \anchor{blank}{N = \varnothing \;\Rightarrow\; \text{blank}}
        say: '`N` holds the row numbers of $P_u(j)$. `N.size` is its length; 0 means nobody can vote, so the function returns `np.nan`.'
      - tex: |
          \anchor{w}{\mathbf{w} = \big(\text{sim}(u,v)\big)_{v \in P_u(j)}}, \qquad \anchor{s}{\mathbf{s} = \big(s_{vj}\big)_{v \in P_u(j)}}
        say: |
          **Fancy indexing** (indexing with an array): `sims[u, N]` reads row u at the columns in N; `S[N, j]` reads the rows in N
          of column j. Both come out in the same neighbour order, so they line up.
      - tex: |
          \anchor{pred}{\hat s_{uj}} = \frac{\anchor{num}{\mathbf{w} \cdot \mathbf{s}}}{\anchor{den}{\textstyle\sum_{v \in P_u(j)} w_v}} = \frac{\sum_{v \in P_u(j)} \text{sim}(u,v)\, s_{vj}}{\sum_{v \in P_u(j)} \text{sim}(u,v)}
        say: '`w @ s` on two 1-D arrays is their dot product (multiply pairwise, add); `w.sum()` adds the weights.'
      - tex: |
          \hat r_{uj} = \hat s_{uj} + \anchor{mean}{\mu_u}
        say: 'Undo the centering with the **target user''s** mean, `mu[u]`. $\hat r$ ("r-hat") is the predicted rating, just as $\hat s$ is the predicted centered rating.'
      - tex: |
          \anchor{pred}{ {=ps.predTex} }, \qquad \anchor{mean}{ {=ps.ratingTex} }
        say: 'At the default B·c with k = 3: (0.94)(1) + (0.7)(1.5) over 0.94 + 0.7 = 1.21 (the lecture shows 1.2), so B would rate c about 1.21 + 4.8 = 6.0. Change k or the cell to see other cases.'
    code:
      lang: python
      source: |
        import numpy as np

        def predict_user_based(S, mu, sims, u, j, k):
            """User-based prediction of user u's rating of item j.

            A similarity-weighted average of the neighbours' centered ratings of
            j, plus u's own mean to undo the centering.

            Args:
                S: centered ratings; mu: user means; sims: user_sims(S).
                u, j: row and column of the target cell; k: neighbourhood size.

            Returns:
                float rating, or np.nan when no neighbour is left.
            """
            # @a nbrs
            # u's positive top-k neighbours who rated j
            N = neighbors(S, sims, u, j, k)
            # @end
            # @a blank
            # nobody left to vote: leave the cell blank
            if N.size == 0:
                return np.nan
            # @end
            # @a w
            # weights sim(u, v): row u at the columns in N
            w = sims[u, N]
            # @end
            # @a s
            # their centered ratings of j: rows N of column j
            s = S[N, j]
            # @end
            # @a num
            # Σ sim · s: the dot product of two 1-D arrays
            num = w @ s
            # @end
            # @a den
            # Σ sim over the neighbours used
            den = w.sum()
            # @end
            # @a pred
            # the weighted average (still centered)
            s_hat = num / den
            # @end
            # @a mean
            # add u's mean back to get a rating
            return s_hat + mu[u]
            # @end
    links:
      - { anchor: nbrs, label: 'neighbours P_u(j)', say: 'The helper from the previous section.' }
      - { anchor: blank, label: 'nobody → blank', say: '`np.nan` marks a prediction we cannot make.' }
      - { anchor: w, label: 'weights sim(u, v)', say: 'Fancy indexing: row u, columns N.' }
      - { anchor: s, label: 'their centered ratings', say: 'Fancy indexing: rows N, column j.' }
      - { anchor: num, label: 'Σ sim · s', say: '`@` on two vectors is the dot product.' }
      - { anchor: den, label: 'Σ sim', say: 'Sum of the used weights (not k).' }
      - { anchor: pred, label: 'ŝ: weighted average' }
      - { anchor: mean, label: 'add μᵤ back', say: 'mu[u] is the target user''s own mean.' }
    trace: { fn: predictCode, in: { matrix: '@ab5x6', user: '@user', item: '@item', k: '@k' } }
    examples: [ub-b-c, ub-c-a, ub-c-f, ub-e-b, ub-b-c-rating]
    pitfalls:
      - Forgetting to add μᵤ back gives a centered value like 1.2, not a rating like 6.0.
      - 'The denominator is the sum of the **used** similarities (`w.sum()`), not k and not the number of users.'
      - '`sims[u, N]` and `S[N, j]` must use the same `N` in the same order, or the weights pair up with the wrong ratings.'
    examTip: 'Show the arithmetic like the lecture: (sim)(dev) + (sim)(dev) over sim + sim. The lecture''s tables report ŝ, so give ŝ unless the question asks for a rating; then add μᵤ.'
    tryIt: [ub-predict-numeric, ub-predict-hand, code-predict]
    errata:
      - 'If you''re reading the slides: the worked C·a and C·f plug in **0.87** for sim(C, A), but the similarity table says **0.89**. With 0.89, C·a = 1.35 and C·f = −1.14; both still round to the slides'' 1.3 and −1.1.'

  - id: item-similarity
    title: 'Item similarity: adjusted cosine'
    skills: [ibcf-similarity, similarity]
    summary: |
      Flip the matrix: compare two **items** by the users who rated both. The ratings are still centered by each
      **user's** mean, which is why it's called the [[adjusted-cosine|adjusted cosine]]. The code is the user version on
      columns instead of rows.
    keyFormula: '\text{sim}(i,j) = \frac{\sum_{u \in U_i \cap U_j} s_{ui} s_{uj}}{\sqrt{\sum_{u \in U_i \cap U_j} s_{ui}^2}\sqrt{\sum_{u \in U_i \cap U_j} s_{uj}^2}}'
    data: [ab5x6]
    state: { a: a, b: b }
    derive:
      - { fn: sim, in: { matrix: '@ab5x6', a: '@a', b: '@b', mode: item }, out: s }
      - { fn: simSheet, in: { matrix: '@ab5x6', a: '@a', b: '@b', mode: item }, out: ws }
    steps:
      - tex: |
          \anchor{corated}{U_i \cap U_j = \{\, u : u \text{ rated } i \text{ and } u \text{ rated } j \,\}}
        say: |
          $U_i$ ("U sub i") is the set of users who rated item i; the intersection holds the co-raters. `S[:, i]` is
          column i. Do **not** re-center by column means: $s_{ui}$ is still the rating minus **user** u's mean.
      - tex: |
          \anchor{dot}{\sum_{u \in U_i \cap U_j} s_{ui}\, s_{uj}}
        say: '`a @ b` multiplies the two columns'' centered values user by user and adds.'
      - tex: |
          \anchor{norm}{\sqrt{\textstyle\sum_{u \in U_i \cap U_j} s_{ui}^2}\;\sqrt{\textstyle\sum_{u \in U_i \cap U_j} s_{uj}^2}}
        say: Both lengths run over the same co-raters, never over every rater of each item.
      - tex: |
          \anchor{sim}{\text{sim}(i,j) = \frac{\text{dot}}{\|a\|\,\|b\|}} \quad (0 \text{ if no common rater})
        say: 'Items with no common rater get 0, like HP3 and TW in the HP data.'
      - tex: |
          \anchor{sim}{ {=ws.simTex} }
        say: 'At the default pair (a, b) the lecture''s item table shows 0.74. The HP pair TW, SW1, with the table''s erratum below, is worked in the item-based scene of the Intuition tab.'
    code:
      lang: python
      source: |
        import numpy as np

        def item_sim(S, i, j):
            """Adjusted cosine of items i and j over the users who rated both.

            S is centered by USER (row) means, as in the lecture; only the
            comparison runs down columns instead of along rows.

            Args:
                S: users × items centered ratings, np.nan = blank.
                i, j: the two columns to compare.

            Returns:
                float in [−1, 1]; 0 when no user rated both.
                Lecture: item_sim(S, a, b) == 0.74 on the 5 × 6 matrix.
            """
            # @a corated
            # users who rated both items; keep only those entries
            both = ~np.isnan(S[:, i]) & ~np.isnan(S[:, j])
            a, b = S[both, i], S[both, j]
            # @end
            # @a dot
            # multiply user by user and add
            dot = a @ b
            # @end
            # @a norm
            # lengths over the same co-raters
            norm = np.linalg.norm(a) * np.linalg.norm(b)
            # @end
            # @a sim
            # no common rater gives 0
            return 0.0 if norm == 0 else dot / norm
            # @end
    extraCode:
      - lang: python
        title: All pairs at once (numpy)
        source: |
          import numpy as np

          def item_sims(S):
              """Adjusted cosine of every pair of items, over co-raters only.

              Args:
                  S: users × items ratings centered by USER means, np.nan = blank.

              Returns:
                  items × items array of similarities; 0 where a pair shares no rater.
              """
              M = (~np.isnan(S)).astype(float)   # 1 = rated, 0 = blank
              Z = np.nan_to_num(S)               # blanks become 0
              dot = Z.T @ Z                      # every column · column at once
              ss = (Z ** 2).T @ M                # i's squares, only for users who also rated j
              ni = np.sqrt(ss)
              den = ni * ni.T
              safe = np.where(den > 0, den, 1.0)
              return np.where(den > 0, dot / safe, 0.0)
    links:
      - { anchor: corated, label: 'Uᵢ ∩ Uⱼ: co-raters', say: 'Column slices `S[:, i]`, a boolean "and", then boolean indexing.' }
      - { anchor: dot, label: 'dot product', say: 'Column · column over the co-raters.' }
      - { anchor: norm, label: 'lengths over the co-raters' }
      - { anchor: sim, label: item similarity }
    trace: { fn: sim, in: { matrix: '@ab5x6', a: '@a', b: '@b', mode: item } }
    examples: [ab-isim-ab, ab-isim-ac, ab-isim-af, ab-isim-be, ab-isim-df, ib-sim-hp1-hp2, ib-sim-hp1-tw, ib-sim-hp3-tw, ib-sim-tw-sw1]
    pitfalls:
      - Center by the **user** (row) mean even though you compare columns. `np.nanmean(R, axis=0)` would be the wrong mean.
      - 'Lengths over **every** rater of each item are wrong; a generic column-cosine routine run on centered data does exactly that. Use only the co-raters.'
      - Items with no common rater have similarity 0.
    examTip: 'For each pair of columns, list the users who rated both, write their centered values, and cosine them.'
    errata:
      - 'If you''re reading the slides: the item table prints sim(TW, SW1) = **−0.73**. Co-raters A and C give TW = (5/3, −5/3), SW1 = (−7/3, 1/3), so the cosine is −40/50 = **−0.80**. (−0.73 is the user-based sim(A, C).) No prediction changes, because it is negative either way.'
    tryIt: [isim-numeric, isim-hand, adjusted-cosine]

  - id: ib-predict
    title: Item-based prediction
    skills: [ibcf-predict, neighbors]
    summary: |
      To predict user u's rating of item j, look at the items **u already rated**, take the k most similar to j,
      keep those with positive similarity, and average u's own centered ratings of them.
    keyFormula: '\hat s_{uj} = \frac{\sum_{i \in N_j(u)} \text{sim}(j,i)\, s_{ui}}{\sum_{i \in N_j(u)} \text{sim}(j,i)}, \quad \hat r_{uj} = \hat s_{uj} + \mu_u'
    data: [hp4x7]
    state: { user: C, item: HP1, k: 2 }
    derive:
      - { fn: predict, in: { matrix: '@hp4x7', user: '@user', item: '@item', k: '@k', mode: item }, out: p }
      - { fn: predictSheet, in: { matrix: '@hp4x7', user: '@user', item: '@item', k: '@k', mode: item }, out: ps }
    live:
      - id: k-slider
        widget: Slider
        region: top
        props: { label: 'k (similar items)', min: 1, max: 6, step: 1 }
        bind: { value: k }
      - id: matrix
        widget: Matrix
        props:
          data: '@hp4x7'
          title: Harry Potter / Twilight / Star Wars ratings
          showRowMeans: false
    steps:
      - tex: |
          \text{cands} = \{\, i : \anchor{rated}{r_{ui} \text{ observed}},\ \anchor{self}{i \neq j} \,\} \;\to\; \anchor{idx}{\text{their column numbers}}
        say: '`S[u]` is row u, the user''s own centered ratings. The candidates are the items in that row that are not NaN.'
      - tex: |
          \begin{gathered} \anchor{sort}{\text{sort by sim}(j, i), \text{ largest first}} \;\Rightarrow\; \anchor{topk}{\text{top-}k} \;\Rightarrow\; \anchor{pos}{\text{sim} > 0} \\ \anchor{blank}{\text{none left} \Rightarrow \text{blank}} \end{gathered}
        say: 'Same argsort, slice and boolean-index steps as user-based CF, reading row j of the item similarities. $N_j(u)$ names what is left: the items u rated that are among the k most similar to j, with sim > 0.'
      - tex: |
          \anchor{w}{\mathbf{w} = \big(\text{sim}(j,i)\big)_{i \in N}}, \qquad \anchor{s}{\mathbf{s} = \big(s_{ui}\big)_{i \in N}}
        say: '`isims[j, N]` gives the weights; `S[u, N]` gives the **user''s own** centered ratings of those items.'
      - tex: |
          \anchor{pred}{\hat s_{uj}} = \frac{\anchor{num}{\mathbf{w} \cdot \mathbf{s}}}{\anchor{den}{\textstyle\sum_{i \in N} w_i}}, \qquad \hat r_{uj} = \hat s_{uj} + \anchor{mean}{\mu_u}
        say: A dot product over a sum, then the user's mean added back.
      - tex: |
          \anchor{pred}{ {=ps.predTex} }
        say: 'At the default C·HP1 with k = 2: C rated TW (sim 1), SW1 (−1) and SW2 (0); the top 2 are TW and SW2, and only TW is positive, so ŝ = (1)(−5/3)/1 = −1.67 (the lecture shows −1.7). As a rating: −5/3 + 11/3 = 2.'
    code:
      lang: python
      source: |
        import numpy as np

        def predict_item_based(S, mu, isims, u, j, k):
            """Item-based prediction of user u's rating of item j.

            Takes the k items most similar to j among those u rated (positive
            similarities only) and averages u's OWN centered ratings of them,
            weighted by similarity, then adds u's mean back.

            Args:
                S: centered ratings; mu: user means; isims: item_sims(S).
                u, j: row and column of the target cell; k: neighbourhood size.

            Returns:
                float rating, or np.nan when no similar item is left.
            """
            # @a rated
            # items u rated (row u of S)
            rated = ~np.isnan(S[u])
            # @end
            # @a self
            # the target item can't be its own neighbour
            rated[j] = False
            # @end
            # @a idx
            # column numbers of the True entries
            cands = np.flatnonzero(rated)
            # @end
            # @a sort
            # similarity to j; sort the negatives = best first
            sc = isims[j, cands]
            order = np.argsort(-sc, kind='stable')
            # @end
            # @a topk
            # the k most similar items
            top = cands[order[:k]]
            # @end
            # @a pos
            # keep only positive similarities
            N = top[isims[j, top] > 0]
            # @end
            # @a blank
            # nothing left: leave the cell blank
            if N.size == 0:
                return np.nan
            # @end
            # @a w
            # weights sim(j, i)
            w = isims[j, N]
            # @end
            # @a s
            # u's OWN centered ratings of those items
            s = S[u, N]
            # @end
            # @a num
            # Σ sim · s (dot product) and Σ sim
            num = w @ s
            # @end
            # @a den
            den = w.sum()
            # @end
            # @a pred
            # weighted average, then u's mean back
            s_hat = num / den
            # @end
            # @a mean
            return s_hat + mu[u]
            # @end
    links:
      - { anchor: rated, label: 'items u rated', say: 'Row slice `S[u]`, then a NaN test.' }
      - { anchor: self, label: 'not j itself' }
      - { anchor: idx, label: 'candidate columns', say: '`np.flatnonzero` gives the indices of the True entries.' }
      - { anchor: sort, label: 'sort by similarity to j' }
      - { anchor: topk, label: 'top-k similar items' }
      - { anchor: pos, label: 'sim > 0' }
      - { anchor: blank, label: 'none left → blank' }
      - { anchor: w, label: 'weights sim(j, i)' }
      - { anchor: s, label: 'the user''s own ratings' }
      - { anchor: num, label: 'Σ sim · s' }
      - { anchor: den, label: 'Σ sim' }
      - { anchor: pred, label: weighted average of the user's own ratings }
      - { anchor: mean, label: add μᵤ back }
    trace: { fn: ibPredictCode, in: { matrix: '@hp4x7', user: '@user', item: '@item', k: '@k' } }
    examples: [ib-hp-c-hp1, ib-hp-a-hp2, ib-hp-b-tw, ib-hp-a-sw2, ib-hp-c-hp2-blank, ib-hp-a-hp3-blank, ib-ab-c-a, ib-ab-e-b, ib-ab-b-c, ib-ab-c-f]
    pitfalls:
      - In item-based CF, the weights come from item–item similarities and the values from the **target user's** row (`S[u, N]`, not `S[N, j]`).
      - Many HP cells stay blank because all candidate similarities are 0 or negative. That's sparsity, not an error.
    examTip: 'Read the target item''s row of the item-similarity matrix, restricted to the items the user rated. The lecture''s tables report ŝ; give ŝ unless the question asks for a rating.'
    tryIt: [ib-predict-numeric, ib-predict-hand, blank-when]
    errata:
      - 'If you''re reading the slides: later slides show B''s predicted TW as **0.7**, but the worked step computes (1)(1/3)/1 = **0.3**, which is the correct value.'

  - id: dcg
    title: Discounted cumulative gain
    skills: [dcg]
    summary: |
      Judging a ranked list: a relevant item near the top is worth more than the same item further down.
      Each position adds a gain 2^rel − 1, discounted by log₂(position + 1). In numpy every position is handled at once.
    keyFormula: '\text{DCG}@k = \sum_{i=1}^{k} \frac{2^{rel_i} - 1}{\log_2(i + 1)}'
    data: [dcg6]
    derive:
      - { fn: dcg, in: { ratings: '@dcg6.ratings', list: '@dcg6.rec', k: 5 }, out: d }
    live:
      - id: ranklist
        widget: RankList
        props:
          items: '@dcg6.items'
          relevance: '@dcg6.ratings'
          order: '@dcg6.rec'
          k: 5
          showRelevance: true
          showGain: true
    steps:
      - tex: |
          \anchor{rel}{\mathbf{rel} = (rel_1, \dots, rel_k)}, \qquad \anchor{pos}{\mathbf{i} = (1, 2, \dots, k)}
        say: |
          `rel` holds the true [[relevance]] (here, the true rating) of each recommended item, in ranked order. DCG@k ("at k") scores only the top k positions.
          `rel[:k]` keeps the first k; `np.arange(1, k + 1)` builds the positions (the stop value is left out).
      - tex: |
          \anchor{gain}{\mathbf{g} = 2^{\mathbf{rel}} - 1}, \qquad \anchor{disc}{\mathbf{d} = \log_2(\mathbf{i} + 1)}
        say: |
          Arithmetic on arrays is element-wise: `2.0 ** rel` raises 2 to every rating, `- 1` subtracts 1 from each,
          and `np.log2(i + 1)` takes the log of every position plus one.
      - tex: |
          \text{DCG}@k = \anchor{add}{\sum_{i=1}^{k}} \anchor{terms}{\frac{g_i}{d_i}}
        say: '`gain / disc` divides position by position, and `.sum()` adds the terms.'
      - tex: |
          = \frac{7}{1} + \frac{511}{1.585} + \frac{127}{2} + \frac{255}{2.322} + \frac{31}{2.585} = 7 + 322.41 + 63.5 + 109.82 + 11.99 = \anchor{add}{ {=d.dcg|2} }
        say: 'The list [B, A, C, F, E] with true ratings 3, 9, 7, 8, 5 gives the lecture''s 514.72.'
    code:
      lang: python
      source: |
        import numpy as np

        def dcg(rel, k):
            """Discounted cumulative gain of a ranked list, cut at k.

            Each position i (from 1) contributes (2^rel − 1) / log2(i + 1), so
            relevant items count more the higher they are ranked.

            Args:
                rel: true relevance of each recommended item, in ranked order.
                k: how many positions to score.

            Returns:
                float: the DCG@k.
            """
            # @a rel
            # the first k positions, as a float array
            rel = np.asarray(rel[:k], dtype=float)
            # @end
            # @a pos
            # positions 1, 2, …, k (the stop value is left out)
            i = np.arange(1, rel.size + 1)
            # @end
            # @a gain
            # gain of every position: 2^rel − 1
            gain = 2.0 ** rel - 1
            # @end
            # @a disc
            # discount of every position: log2(i + 1)
            disc = np.log2(i + 1)
            # @end
            # @a terms
            # one term per position
            terms = gain / disc
            # @end
            # @a add
            # add them up: the DCG
            return terms.sum()
            # @end
    links:
      - { anchor: rel, label: 'relevance, ranked order', say: '`np.asarray` converts a list to an array; `dtype=float` avoids integer overflow in 2**rel.' }
      - { anchor: pos, label: 'positions 1 … k', say: '`np.arange(start, stop)` stops just before `stop`.' }
      - { anchor: gain, label: 'gain 2^rel − 1', say: 'Element-wise power and subtraction.' }
      - { anchor: disc, label: 'discount log₂(i + 1)', say: 'Element-wise log base 2.' }
      - { anchor: terms, label: 'gain / discount', say: 'Element-wise division.' }
      - { anchor: add, label: 'DCG@k (the sum)', say: '`.sum()` adds every entry.' }
    trace: { fn: dcgCode, in: { ratings: '@dcg6.ratings', list: '@dcg6.rec', k: 5 } }
    examples: [dcg]
    pitfalls:
      - 'The top position divides by log₂2 = 1, not by log₂1 = 0: positions start at 1 (`np.arange(1, …)`), not 0.'
      - Use 2^rel − 1, not the rating itself.
    examTip: 'Build a small table: position, item, rel, 2^rel − 1, log₂(i+1), contribution; then add the last column.'
    tryIt: [dcg-numeric, dcg-numeric-hard, code-dcg]

  - id: ndcg
    title: IDCG and NDCG
    skills: [ndcg, dcg]
    summary: |
      DCG values aren't comparable across users, so divide by the best achievable DCG (IDCG), computed on the ideal
      order. NDCG lies between 0 and 1; 1 means a perfect ranking.
    keyFormula: '\text{NDCG}@k = \frac{\text{DCG}@k}{\text{IDCG}@k}'
    data: [dcg6]
    derive:
      - { fn: ndcg, in: { ratings: '@dcg6.ratings', list: '@dcg6.rec', k: 5 }, out: n }
    live:
      - id: ranklist
        widget: RankList
        props:
          items: '@dcg6.items'
          relevance: '@dcg6.ratings'
          order: '@dcg6.rec'
          k: 5
          showRelevance: true
          showGain: true
    steps:
      - tex: |
          \anchor{dcg}{d = \text{DCG}@k(\mathbf{rel})}
        say: The previous section's function, on the recommended order.
      - tex: |
          \anchor{ideal}{\text{ideal} = \text{all items' true ratings, largest first}}
        say: |
          `np.sort` sorts ascending; the slice `[::-1]` (step −1) reverses it. The ideal list is chosen from **all** rated items:
          [A, F, C, E, B] makes the top 5, and D (rating 2) doesn't.
      - tex: |
          \anchor{idcg}{\text{IDCG}@5} = \frac{511}{1} + \frac{255}{1.585} + \frac{127}{2} + \frac{31}{2.322} + \frac{7}{2.585} = 511 + 160.89 + 63.5 + 13.35 + 2.71
        say: The same function on the ideal order.
      - tex: |
          \anchor{ndcg}{\text{NDCG}} = \frac{\anchor{dcg}{ {=n.dcg|2} }}{\anchor{idcg}{ {=n.idcg|2} }} = {=n.ndcg|3}
        say: The lecture's 0.685.
    code:
      lang: python
      source: |
        import numpy as np

        def ndcg(rel, all_rel, k):
            """Normalized DCG: the list's DCG over the best possible DCG.

            Args:
                rel: relevance of the recommended items, in ranked order.
                all_rel: relevance of every item (used to build the ideal list).
                k: cut-off.

            Returns:
                float in [0, 1]; 1 means the list is already ideally ordered.
            """
            # @a dcg
            # DCG of the recommended list
            d = dcg(rel, k)
            # @end
            # @a ideal
            # all items, best first: sort ascending, then reverse
            ideal = np.sort(all_rel)[::-1]
            # @end
            # @a idcg
            # IDCG: the DCG of the ideal list
            i = dcg(ideal, k)
            # @end
            # @a ndcg
            # NDCG, between 0 and 1
            return d / i
            # @end
    links:
      - { anchor: dcg, label: DCG of the recommended list }
      - { anchor: ideal, label: 'the ideal order', say: 'Ascending sort, then reversed with [::-1].' }
      - { anchor: idcg, label: DCG of the ideal list }
      - { anchor: ndcg, label: the ratio }
    trace: { fn: ndcgCode, in: { ratings: '@dcg6.ratings', list: '@dcg6.rec', k: 5 } }
    examples: [ndcg]
    pitfalls:
      - The ideal list is chosen from **all** rated items, not just the recommended ones.
      - '`np.sort(all_rel)` alone is ascending, the **worst** order. Forgetting `[::-1]` gives an "IDCG" smaller than the DCG.'
    examTip: 'Compute IDCG with the same k and the same gain/discount as DCG; only the order changes.'
    tryIt: [ndcg-numeric, ndcg-hand, ndcg-hand-hard]
    errata:
      - 'If you''re reading the slides: the formula is printed "NDCG = DCG / **NDCG**"; the denominator is **IDCG** (514.72 / 751.45 = 0.685).'

  - id: significance
    title: Significance weighting
    skills: [sparsity-pitfalls, similarity]
    beyondSlides: true
    summary: |
      A similarity of 1 based on one shared item is weak evidence. Scale similarities by how many co-rated items
      they rest on, so tiny overlaps can't dominate the neighbourhood. One matrix product counts every overlap.
    keyFormula: '\text{sim}^{*}(u,v) = \frac{\min(|I_u \cap I_v|, \beta)}{\beta}\,\text{sim}(u,v)'
    data: [hp4x7]
    state: { a: B, b: A, beta: 3 }
    derive:
      - { fn: shrunkSim, in: { matrix: '@hp4x7', a: '@a', b: '@b', mode: user, beta: '@beta' }, out: w }
    live:
      - id: beta-slider
        widget: Slider
        region: top
        props: { label: 'β (cap on co-rated items)', min: 1, max: 6, step: 1 }
        bind: { value: beta }
      - id: matrix
        widget: Matrix
        props:
          data: '@hp4x7'
          title: Harry Potter / Twilight / Star Wars ratings
          showRowMeans: false
    steps:
      - tex: |
          \anchor{mask}{M_{uj} \in \{0, 1\}}, \qquad \anchor{both}{|I_u \cap I_v| = \sum_j M_{uj} M_{vj} = (M M^{\top})_{uv}}
        say: |
          Row u · row v of the 0/1 mask adds a 1 exactly where both rated, so `M @ M.T` holds every pair's overlap
          (its diagonal is how many items each user rated).
      - tex: |
          \anchor{w}{w = \frac{\min(|I_u \cap I_v|,\ \beta)}{\beta}}
        say: 'β ("beta") is the overlap at which a similarity is fully trusted. `np.minimum(both, beta)` caps every count at β, entry by entry; dividing by β gives a weight between 0 and 1.'
      - tex: |
          \anchor{shrunk}{\text{sim}^{*} = w \odot \text{sim}}
        say: '`w * sims` multiplies the two tables entry by entry.'
      - tex: |
          \text{sim}(B,A) = {=w.sim|2}, \ |I_B \cap I_A| = {=w.overlap} \;\Rightarrow\; \anchor{shrunk}{\text{sim}^{*} = {=w.shrunk|2}}
        say: 'B and A share only HP1 (the one-overlap trap), so at β = {=beta} their "perfect" similarity is multiplied by {=w.weight|2}. Move β to see the weight change.'
    code:
      lang: python
      source: |
        import numpy as np

        def shrunk_sims(S, sims, beta=3):
            """Significance weighting: shrink similarities that rest on few co-rated items.

            Each similarity is multiplied by min(both, β) / β, where `both` is how
            many items the two users have both rated.

            Args:
                S: centered ratings; sims: user_sims(S).
                beta: overlap at which a similarity is trusted in full.

            Returns:
                users × users array of shrunk similarities.
            """
            # @a mask
            # 1 where rated, 0 where blank
            M = (~np.isnan(S)).astype(int)
            # @end
            # @a both
            # co-rated counts for every pair: row · row of M
            both = M @ M.T
            # @end
            # @a w
            # weight: grows with the overlap, 1 once it reaches β
            w = np.minimum(both, beta) / beta
            # @end
            # @a shrunk
            # shrink each similarity, entry by entry
            return w * sims
            # @end
    links:
      - { anchor: mask, label: 'M: 1 = rated' }
      - { anchor: both, label: 'overlap sizes', say: 'Mask times its transpose counts the shared 1s.' }
      - { anchor: w, label: 'overlap weight', say: '`np.minimum` is an element-wise min.' }
      - { anchor: shrunk, label: 'shrunk similarity' }
    trace: { fn: shrunkCode, in: { matrix: '@hp4x7', a: '@a', b: '@b', beta: '@beta' } }
    pitfalls:
      - Not in the lecture. On the exam, use plain similarities unless asked.
    tryIt: [one-overlap, sig-hand, sparsity-statements]
    examTip: If a question asks why a similarity of 1 might be misleading, point to the size of the overlap.
