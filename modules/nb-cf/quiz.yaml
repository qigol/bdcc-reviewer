      '1': { accept: ['&'], hint: element-wise and }
      '2': { accept: ['np.dot(a, b)', 'a @ b', 'a.dot(b)', 'b.dot(a)', 'b @ a', 'np.dot(b, a)', '(a * b).sum()', 'np.sum(a * b)', 'sum(a * b)', 'np.inner(a, b)', 'np.vdot(a, b)'] }
