templates:
  - id: mean-numeric
    type: numeric
    skills: [mean-centering]
    difficulty: 1
    tags: [math]
    generator: meanQ
    lessonRef: { tab: intuition, id: harsh-vs-generous }
    prompt: 'What is user **{=user}**''s mean rating $\mu_{ {=user} }$? (Blank = not rated.)'
    show:
      - { id: m, widget: Matrix, props: { data: '@matrix', format: int } }
    answer: { var: mean, tol: 0.01 }
    hints:
      - Which cells in {=user}'s row actually hold a rating?
      - Add those ratings and divide by how many there are, not by the number of columns.
    explanation: |
      Average only the observed ratings: $\mu = {=sum} / {=n} = {=mean|2}$ (as a fraction, ${=mean|frac}$).

  - id: center-numeric
    type: numeric
    skills: [mean-centering]
    difficulty: 1
    tags: [math]
    generator: centerQ
    lessonRef: { tab: intuition, id: harsh-vs-generous }
    prompt: 'What is the **mean-centered** value of {=user}''s rating of {=item}?'
    show:
      - { id: m, widget: Matrix, props: { data: '@matrix', format: int } }
    answer: { var: dev, tol: 0.01 }
    hints:
      - Centering uses the mean of the user who gave the rating.
      - Find {=user}'s mean over the items {=user} rated, then subtract it from the rating.
    explanation: |
      $s = r - \mu_{ {=user} } = {=r} - {=mean|frac} = {=dev|2}$.

  - id: sim-numeric
    type: numeric
    skills: [similarity]
    difficulty: 2
    tags: [math]
    generator: simQ
    lessonRef: { tab: intuition, id: only-co-rated }
    prompt: Compute the lecture's similarity between users A and B (the cosine of their centered ratings over the items both rated).
    show:
      - { id: m, widget: Matrix, props: { data: '@matrix', format: int, showRowMeans: true } }
    answer: { var: sim, tol: 0.01 }
    hints:
      - List the items both A and B rated; ignore the rest.
      - Center each user by their own mean (shown on the right), multiply the centered values item by item and add.
      - Divide by the two lengths, each over the same co-rated items.
    explanation: |
      Co-rated items: {=corated|list}. Dot product of centered values = {=dot|3}; lengths over those items {=na|3} and {=nb|3}; sim = {=dot|3} / ({=na|3} × {=nb|3}) = {=sim|2}.

  - id: sim-hand
    type: hand-calc
    skills: [similarity, mean-centering]
    difficulty: 2
    tags: [math]
    generator: simQ
    lessonRef: { tab: math-code, id: similarity }
    prompt: Compute sim(A, B) step by step, the way the lecture does.
    show:
      - { id: m, widget: Matrix, props: { data: '@matrix', format: int } }
    hints:
      - Each mean uses every rating that user gave; the similarity uses only the co-rated items.
    steps:
      - prompt: 'μ_A (mean of A''s ratings)'
        answer: { var: muA, tol: 0.01 }
        hint: Add A's ratings and divide by how many A gave.
      - prompt: 'μ_B'
        answer: { var: muB, tol: 0.01 }
      - prompt: How many items did both users rate?
        answer: { var: overlap, tol: 0 }
      - prompt: 'Dot product of their **centered** ratings over those items'
        answer: { var: dot, tol: 0.02 }
        hint: 'Subtract each user''s mean from their ratings first, then multiply item by item and add.'
      - prompt: 'sim(A, B) = dot / (‖a‖ · ‖b‖), lengths over the same co-rated items'
        answer: { var: sim, tol: 0.01 }
    explanation: |
      μ_A = {=muA|2}, μ_B = {=muB|2}; co-rated {=corated|list}; dot = {=dot|3}; lengths {=na|3}, {=nb|3}; sim = {=sim|2}.

  - id: sim-hand-hard
    type: hand-calc
    skills: [similarity]
    difficulty: 3
    tags: [math]
    generator: simQ
    lessonRef: { tab: intuition, id: only-co-rated }
    prompt: Six items, several blanks. Compute sim(A, B).
    show:
      - { id: m, widget: Matrix, props: { data: '@matrix', format: int } }
    hints:
      - Blanks are not zeros. Drop any item either user skipped.
      - Center first, with each user's mean over all their ratings.
    steps:
      - prompt: Number of co-rated items
        answer: { var: overlap, tol: 0 }
      - prompt: Dot product of centered ratings (co-rated only)
        answer: { var: dot, tol: 0.02 }
      - prompt: '‖a‖ over the co-rated items'
        answer: { var: na, tol: 0.02 }
        hint: Square A's centered values on the co-rated items only, add, take the root.
      - prompt: '‖b‖ over the co-rated items'
        answer: { var: nb, tol: 0.02 }
      - prompt: sim(A, B)
        answer: { var: sim, tol: 0.01 }
    explanation: |
      Means {=muA|2} and {=muB|2}; co-rated {=corated|list}; {=dot|3} / ({=na|3} · {=nb|3}) = {=sim|2}.

  - id: sig-hand
    type: hand-calc
    skills: [similarity, sparsity-pitfalls]
    difficulty: 3
    tags: [math]
    generator: sigSimQ
    lessonRef: { tab: math-code, id: significance }
    prompt: |
      A and B share only a few rated items, so you don't fully trust their similarity. Shrink it with significance weighting at **β = {=beta}** (a common fix that goes beyond the lecture).
    show:
      - { id: m, widget: Matrix, props: { data: '@matrix', format: int } }
    hints:
      - First compute the ordinary sim(A, B), centering each user by the mean of all their ratings.
      - The weight is min(overlap, β)/β; multiply the similarity by it.
    steps:
      - prompt: Number of co-rated items (the overlap)
        answer: { var: overlap, tol: 0 }
      - prompt: sim(A, B)
        answer: { var: sim, tol: 0.01 }
        hint: Cosine of the centered ratings over the co-rated items only.
      - prompt: 'Weight min(overlap, β)/β'
        answer: { var: weight, tol: 0.01 }
      - prompt: Shrunk similarity
        answer: { var: shrunk, tol: 0.01 }
    explanation: |
      Means {=muA|2} and {=muB|2}; co-rated {=corated|list}, so the overlap is {=overlap} and sim(A, B) = {=sim|2}. The weight is min({=overlap}, {=beta})/{=beta} = {=weight|2}, so the shrunk similarity is {=sim|2} × {=weight|2} = {=shrunk|2}.

  - id: isim-numeric
    type: numeric
    skills: [ibcf-similarity]
    difficulty: 2
    tags: [math]
    generator: isimQ
    lessonRef: { tab: intuition, id: item-based-ab }
    prompt: |
      Compute the **adjusted cosine** between items **{=a}** and **{=b}**. User means are shown on the right.
    show:
      - { id: m, widget: Matrix, props: { data: '@matrix', format: int, showRowMeans: true } }
    answer: { var: sim, tol: 0.01 }
    hints:
      - Center each rating by the mean of the **user** who gave it, not by the item's mean.
      - Keep only the users who rated both {=a} and {=b}.
      - Dot product over those users, divided by both lengths over the same users.
    explanation: |
      Co-raters: {=corated|list}. Centered by user means, the dot product is {=dot|3}; the lengths over those users are {=na|3} and {=nb|3}; sim({=a}, {=b}) = {=dot|3} / ({=na|3} × {=nb|3}) = {=sim|2}.

  - id: isim-hand
    type: hand-calc
    skills: [ibcf-similarity, mean-centering]
    difficulty: 3
    tags: [math]
    generator: isimQ
    lessonRef: { tab: math-code, id: item-similarity }
    prompt: |
      Compute the adjusted cosine sim({=a}, {=b}) step by step, like the lecture's item-similarity table. User means: {=meansText}.
    show:
      - { id: m, widget: Matrix, props: { data: '@matrix', format: int } }
    hints:
      - Item similarity still centers by **user** means, then compares two columns.
    steps:
      - prompt: 'How many users rated both {=a} and {=b}?'
        answer: { var: overlap, tol: 0 }
      - prompt: 'Dot product of the two columns'' centered ratings over those users'
        answer: { var: dot, tol: 0.02 }
        hint: Subtract each user's mean from that user's ratings, then multiply across and add.
      - prompt: '‖{=a}‖ over the same users'
        answer: { var: na, tol: 0.02 }
        hint: Only the users who rated both items count.
      - prompt: '‖{=b}‖ over the same users'
        answer: { var: nb, tol: 0.02 }
      - prompt: 'sim({=a}, {=b})'
        answer: { var: sim, tol: 0.01 }
    explanation: |
      Co-raters {=corated|list}; dot = {=dot|3}; lengths {=na|3} and {=nb|3}; sim = {=sim|2}.

  - id: neighbors-multi
    type: multi
    skills: [neighbors]
    difficulty: 2
    tags: [math]
    generator: neighborsQ
    lessonRef: { tab: math-code, id: neighbors }
    prompt: |
      We predict **{=user}**'s rating of **{=item}** with user-based CF, **k = {=k}**. The candidates (users who rated {=item}) and their similarities to {=user} are listed. Which neighbours are actually used?
    show:
      - { id: s, widget: Matrix, props: { data: '@sims', format: 2, heatmap: div, rowHeader: 'sim to' } }
    hints:
      - Sort the candidates by similarity and keep the top k first.
      - Then drop anyone in the top k whose similarity is not positive.
    explanation: |
      Take the top-{=k} by similarity, then keep only sim > 0: {=used|list}.

  - id: ub-predict-numeric
    type: numeric
    skills: [ubcf-predict, neighbors]
    difficulty: 2
    tags: [math]
    generator: ubPredictQ
    lessonRef: { tab: intuition, id: add-the-mean-back }
    prompt: |
      Using user-based CF with **k = {=k}**, predict {=user}'s **rating** of {=item}: the centered prediction ŝ plus {=user}'s mean.
    show:
      - { id: c, widget: Matrix, props: { data: '@centeredM', format: 2, title: Centered ratings, showRowMeans: false } }
      - { id: s, widget: Matrix, props: { data: '@sims', format: 2, heatmap: div, title: User similarities } }
      - { id: r, widget: Matrix, props: { data: '@matrix', format: int, showRowMeans: true, title: Original ratings } }
    answer: { var: rating, tol: 0.02 }
    hints:
      - Candidates are the other users who rated {=item}. Rank them by similarity to {=user} and keep the top {=k}.
      - Drop any of those with similarity ≤ 0, then take the similarity-weighted average of their centered ratings.
      - Add {=user}'s mean to turn ŝ into a rating.
    explanation: |
      Top-{=k} candidates: {=top|list}; positive: {=used|list}. $\hat s = {=num|3} / {=den|3} = {=pred|2}$, then $\hat r = \hat s + \mu = {=pred|2} + {=mean|2} = {=rating|2}$.

  - id: ub-predict-hand
    type: hand-calc
    skills: [ubcf-predict, neighbors, mean-centering]
    difficulty: 3
    tags: [math]
    generator: ubPredictQ
    lessonRef: { tab: intuition, id: borrowing-opinions }
    prompt: |
      Walk through the user-based prediction of **{=user} · {=item}** (k = {=k}) exactly like the lecture's worked examples.
    show:
      - { id: c, widget: Matrix, props: { data: '@centeredM', format: 2, title: Centered ratings } }
      - { id: s, widget: Matrix, props: { data: '@sims', format: 2, heatmap: div, title: User similarities } }
      - { id: r, widget: Matrix, props: { data: '@matrix', format: int, showRowMeans: true, title: Original ratings } }
    hints:
      - Top-k raters of the item first, then keep only sim > 0.
    steps:
      - prompt: 'Numerator: Σ sim(u, v) · s_vj over the neighbours used'
        answer: { var: num, tol: 0.02 }
        hint: 'Top-k raters of the item, then drop sim ≤ 0.'
      - prompt: 'Denominator: Σ sim(u, v) over the same neighbours'
        answer: { var: den, tol: 0.02 }
        hint: Add only the similarities you used in the numerator.
      - prompt: 'Centered prediction ŝ'
        answer: { var: pred, tol: 0.02 }
      - prompt: 'μ of {=user}'
        answer: { var: mean, tol: 0.01 }
      - prompt: 'Predicted rating ŝ + μ'
        answer: { var: rating, tol: 0.02 }
    explanation: |
      Top-{=k}: {=top|list}; used (sim > 0): {=used|list}. ŝ = {=num|3}/{=den|3} = {=pred|2}; rating = {=pred|2} + {=mean|2} = {=rating|2}.

  - id: ub-pipeline-hand
    type: hand-calc
    skills: [ubcf-predict, similarity, mean-centering]
    difficulty: 3
    tags: [math]
    generator: ubPipelineQ
    lessonRef: { tab: intuition, id: add-the-mean-back }
    prompt: |
      From the raw ratings alone, predict **{=user}**'s rating of **{=item}** with user-based CF (k = 2). Only {=n1} and {=n2} rated {=item}.
    show:
      - { id: m, widget: Matrix, props: { data: '@matrix', format: int } }
    hints:
      - Center every user first, each by their own mean.
      - Each similarity is a cosine over the items the two users both rated.
    steps:
      - prompt: 'μ of {=user}'
        answer: { var: mean, tol: 0.01 }
      - prompt: 'sim({=user}, {=n1})'
        answer: { var: sim1, tol: 0.01 }
        hint: Use only the items both {=user} and {=n1} rated.
      - prompt: 'sim({=user}, {=n2})'
        answer: { var: sim2, tol: 0.01 }
      - prompt: 'Centered prediction ŝ'
        answer: { var: pred, tol: 0.02 }
        hint: Weight each neighbour's centered rating of the item by its similarity, then divide by the sum of the similarities.
      - prompt: 'Predicted rating ŝ + μ'
        answer: { var: rating, tol: 0.02 }
    explanation: |
      μ = {=mean|2}. sim({=user}, {=n1}) = {=sim1|2} over {=co1|list}; sim({=user}, {=n2}) = {=sim2|2} over {=co2|list}. Both are positive, so both are used: ŝ = {=num|3} / {=den|3} = {=pred|2}, and the rating is {=pred|2} + {=mean|2} = {=rating|2}.

  - id: ib-predict-numeric
    type: numeric
    skills: [ibcf-predict]
    difficulty: 2
    tags: [math]
    generator: ibPredictQ
    lessonRef: { tab: math-code, id: ib-predict }
    prompt: |
      Using item-based CF with **k = 2**, compute the **centered prediction ŝ** for {=user} · {=item}, before adding the mean (the lecture's tables report ŝ).
    show:
      - { id: c, widget: Matrix, props: { data: '@centeredM', format: 2, title: Centered ratings } }
      - { id: s, widget: Matrix, props: { data: '@sims', format: 2, heatmap: div, title: Item similarities } }
    answer: { var: pred, tol: 0.02 }
    hints:
      - Candidates are the items {=user} rated. Read their similarities to {=item} from the table.
      - Keep the top 2, drop any with sim ≤ 0, and average {=user}'s own centered ratings of them, weighted by similarity.
    explanation: |
      Among the items {=user} rated, the top 2 by similarity to {=item} are {=top|list}; with sim > 0: {=used|list}. Their similarity-weighted average of {=user}'s centered ratings is {=num|3} / {=den|3} = {=pred|2} (as a rating, {=pred|2} + {=mean|2} = {=rating|2}).

  - id: ib-predict-hand
    type: hand-calc
    skills: [ibcf-predict, mean-centering]
    difficulty: 3
    tags: [math]
    generator: ibPredictQ
    lessonRef: { tab: intuition, id: item-based-ab }
    prompt: |
      Walk through the item-based prediction of **{=user} · {=item}** (k = 2), then turn it into a rating.
    show:
      - { id: c, widget: Matrix, props: { data: '@centeredM', format: 2, title: Centered ratings } }
      - { id: s, widget: Matrix, props: { data: '@sims', format: 2, heatmap: div, title: Item similarities } }
      - { id: r, widget: Matrix, props: { data: '@matrix', format: int, showRowMeans: true, title: Original ratings } }
    hints:
      - The weights come from the target item's row of the item-similarity table; the values from the user's own row.
    steps:
      - prompt: 'Numerator: Σ sim({=item}, i) · s_{=user},i over the items used'
        answer: { var: num, tol: 0.02 }
        hint: Among the items {=user} rated, keep the 2 most similar to {=item}, then drop sim ≤ 0.
      - prompt: 'Denominator: Σ sim over the same items'
        answer: { var: den, tol: 0.02 }
      - prompt: 'Centered prediction ŝ'
        answer: { var: pred, tol: 0.02 }
      - prompt: 'μ of {=user}'
        answer: { var: mean, tol: 0.01 }
      - prompt: 'Predicted rating ŝ + μ'
        answer: { var: rating, tol: 0.02 }
    explanation: |
      Top 2 of {=user}'s items: {=top|list}; used: {=used|list}. ŝ = {=num|3} / {=den|3} = {=pred|2}; rating = {=pred|2} + {=mean|2} = {=rating|2}.

  - id: ib-pipeline-hand
    type: hand-calc
    skills: [ibcf-predict, ibcf-similarity, mean-centering]
    difficulty: 3
    tags: [math]
    generator: ibPipelineQ
    lessonRef: { tab: intuition, id: flip-it }
    prompt: |
      From the raw ratings alone, predict **{=user}**'s rating of **{=item}** with item-based CF (k = 2). {=user} rated only {=n1} and {=n2}. User means: {=meansText}.
    show:
      - { id: m, widget: Matrix, props: { data: '@matrix', format: int } }
    hints:
      - Item similarity still centers every rating by the mean of the **user** who gave it.
      - Each similarity runs only over the users who rated both items.
    steps:
      - prompt: 'μ of {=user}'
        answer: { var: mean, tol: 0.01 }
      - prompt: 'sim({=item}, {=n1})'
        answer: { var: sim1, tol: 0.01 }
        hint: Use only the users who rated both {=item} and {=n1}.
      - prompt: 'sim({=item}, {=n2})'
        answer: { var: sim2, tol: 0.01 }
      - prompt: 'Centered prediction ŝ'
        answer: { var: pred, tol: 0.02 }
        hint: Weight {=user}'s own centered ratings of {=n1} and {=n2} by their similarities to {=item}, then divide by the sum of the similarities.
      - prompt: 'Predicted rating ŝ + μ'
        answer: { var: rating, tol: 0.02 }
    explanation: |
      μ = {=mean|2}. sim({=item}, {=n1}) = {=sim1|2} over {=co1|list}; sim({=item}, {=n2}) = {=sim2|2} over {=co2|list}. Both are positive, so ŝ = {=num|3} / {=den|3} = {=pred|2}, and the rating is {=pred|2} + {=mean|2} = {=rating|2}.

  - id: adjusted-cosine
    type: mcq
    skills: [ibcf-similarity]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: math-code, id: item-similarity }
    prompt: In the lecture's item-based CF, before computing the cosine between two item columns, each rating is centered by…
    options:
      - the mean of the user who gave it
      - the mean of the item (column) it sits in
      - the mean of the whole rating matrix
      - nothing; item-based CF uses the raw ratings
    answer: 0
    optionFeedback:
      '1': 'Centering by the item mean is the Pearson correlation between items, a different measure. The lecture centers the whole table by user means and then compares columns.'
    explanation: The same user-centered matrix serves both flavours; comparing its columns is the adjusted cosine.

  - id: item-sim-zero
    type: mcq
    skills: [ibcf-similarity, sparsity-pitfalls]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: item-similarity }
    prompt: 'In the HP item-similarity table, sim(HP3, TW) = 0. Why?'
    options:
      - No user rated both HP3 and TW
      - HP3 and TW have opposite ratings that cancel out
      - TW has the lowest average rating of all the films
      - Similarities below 0.5 are rounded down to 0
    answer: 0
    explanation: Only B rated HP3 and only A and C rated TW, so the co-rated set is empty and similarity defaults to 0.

  - id: dcg-numeric
    type: numeric
    skills: [dcg]
    difficulty: 1
    tags: [math]
    generator: dcgQ
    lessonRef: { tab: math-code, id: dcg }
    prompt: |
      True relevance: {=ratingsText}. A recommender returns **{=list|list}**. Compute DCG@{=k} (gain 2^rel − 1, discount log₂(i + 1)).
    answer: { var: dcg, tol: 0.05 }
    hints:
      - Each position i adds (2^rel − 1) / log₂(i + 1).
      - Position 1 divides by log₂2 = 1, position 2 by log₂3 ≈ 1.585, position 3 by log₂4 = 2.
    explanation: |
      Terms: {=terms}. Their sum is DCG = {=dcg|2}.

  - id: dcg-numeric-hard
    type: numeric
    skills: [dcg]
    difficulty: 2
    tags: [math]
    generator: dcgQ
    lessonRef: { tab: intuition, id: judging-a-ranking }
    prompt: |
      Relevance scores: {=ratingsText}. A recommender shows **{=list|list}**. If it swapped its first two items ({=top1} and {=top2}), by how much would DCG@{=k} change? Give new − old (negative if it drops).
    answer: { var: swapDelta, tol: 0.05 }
    hints:
      - Only positions 1 and 2 change; every other term is the same before and after.
      - Compute the first two terms before and after the swap, then subtract old from new.
    explanation: |
      Before: {=terms}, DCG = {=dcg|2}. After the swap: {=swapTerms}. The change is {=swapDelta|2}: putting the more relevant item first gains, because position 1 has no discount.

  - id: ndcg-numeric
    type: numeric
    skills: [ndcg, dcg]
    difficulty: 2
    tags: [math]
    generator: dcgQ
    lessonRef: { tab: math-code, id: ndcg }
    prompt: |
      Relevance: {=ratingsText}. The list **{=list|list}** is shown to the user. Compute NDCG@{=k}.
    answer: { var: ndcg, tol: 0.01 }
    misconceptions:
      - { var: dcg, feedback: 'That is DCG. Normalize by the ideal DCG (best possible order of all items).' }
      - { var: idcg, feedback: 'That is IDCG, the denominator. NDCG = DCG / IDCG.' }
    hints:
      - NDCG = DCG / IDCG, with the same k for both.
      - For IDCG, sort **all** items by relevance (not just the listed ones) and keep the best k.
    explanation: |
      DCG = {=dcg|2}; ideal order {=ideal|list} gives IDCG = {=idcg|2}; NDCG = {=ndcg|3}.

  - id: ndcg-hand
    type: hand-calc
    skills: [ndcg, dcg]
    difficulty: 2
    tags: [math]
    generator: ndcgQ
    lessonRef: { tab: math-code, id: ndcg }
    prompt: |
      Relevance: {=ratingsText}. Recommended top-{=k}: **{=list|list}**. Compute NDCG@{=k} the way the lecture does.
    hints:
      - The ideal list draws from every item, not just the recommended ones.
    steps:
      - prompt: 'DCG@{=k} of the recommended list'
        answer: { var: dcg, tol: 0.05 }
      - prompt: 'Relevance of the item that belongs first in the ideal list'
        answer: { var: topRel, tol: 0 }
      - prompt: 'IDCG@{=k}'
        answer: { var: idcg, tol: 0.05 }
        hint: Sort all items by relevance, keep the best k, and compute their DCG.
      - prompt: NDCG = DCG / IDCG
        answer: { var: ndcg, tol: 0.01 }
    explanation: |
      DCG = {=dcg|2}; ideal {=ideal|list} → IDCG = {=idcg|2}; NDCG = {=ndcg|3}.

  - id: ndcg-hand-hard
    type: hand-calc
    skills: [ndcg, dcg]
    difficulty: 3
    tags: [math]
    generator: ndcgQ
    lessonRef: { tab: intuition, id: judging-a-ranking }
    prompt: |
      Six items have true relevance {=ratingsText} (0 = irrelevant). A recommender shows the top-{=k} list **{=list|list}**. Score it with NDCG@{=k}.
    hints:
      - Gain 2^rel − 1, discount log₂(i + 1); an item with relevance 0 adds nothing.
      - The ideal list ranks **all six** items by relevance, including any the recommender left out.
    steps:
      - prompt: 'DCG@{=k} of the recommended list'
        answer: { var: dcg, tol: 0.05 }
        hint: Four terms, one per position, in the order shown.
      - prompt: 'Relevance of the item that belongs first in the ideal list'
        answer: { var: topRel, tol: 0 }
      - prompt: 'IDCG@{=k}'
        answer: { var: idcg, tol: 0.05 }
        hint: Sort all six items by relevance, keep the best {=k}, and compute their DCG.
      - prompt: NDCG = DCG / IDCG
        answer: { var: ndcg, tol: 0.01 }
    explanation: |
      DCG terms: {=terms}, so DCG = {=dcg|2}. The ideal list {=ideal|list} starts with {=top} (relevance {=topRel}), which the recommender missed. Its terms: {=idealTerms}, so IDCG = {=idcg|2} and NDCG = {=ndcg|3}.

  - id: ndcg-steps
    type: order
    skills: [ndcg, dcg]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: judging-a-ranking }
    prompt: Order the steps for scoring a recommended list with NDCG@k.
    items:
      - Look up the true relevance of each recommended item, in list order
      - Turn each relevance into a gain, 2^rel − 1
      - Divide each gain by its position's discount, log₂(i + 1)
      - Add the discounted gains to get the DCG
      - Divide the DCG by the ideal list's DCG (IDCG)
    explanation: Each step uses the result of the one before. NDCG = DCG / IDCG, with the same k, gain and discount for both.

  - id: ubcf-steps
    type: order
    skills: [ubcf-predict, neighbors, mean-centering, similarity]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: math-code, id: ub-predict }
    prompt: Put user-based CF (as taught) in order.
    items:
      - Compute each user's mean μᵤ over the items they rated
      - Mean-center every rating
      - Compute user–user cosine similarities over co-rated items
      - Among users who rated the target item, take the top-k by similarity and keep sim > 0
      - Similarity-weight their centered ratings of the item (ŝ)
      - Add the target user's mean back (ŝ + μᵤ)
    explanation: The lecture's steps, plus the last step it leaves implicit, adding the mean back.

