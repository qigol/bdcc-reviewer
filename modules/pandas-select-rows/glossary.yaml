terms:
  - id: boolean-mask
    term: Boolean mask
    aka: [mask, masks, boolean Series]
    short: 'A column of True and False, one per row, made by a condition such as `df["rating"] >= 4`.'
    long: |
      `df[mask]` keeps the True rows; `mask.sum()` counts them, because True counts as 1. Combine masks with
      [[mask-operators]].
    related: [mask-operators, condition]
    skills: [bool-mask]
  - id: condition
    term: Condition
    aka: [conditions, boolean condition]
    short: 'An expression that is true or false for each row, such as `df["rating"] >= 4`. Filtering keeps the rows where it is true.'
    related: [boolean-mask]
    skills: [bool-mask]
  - id: mask-operators
    term: '&, | and ~'
    aka: [mask operators, ampersand, pipe, tilde]
    short: 'Combine masks row by row: `&` both true, `|` either true, `~` flips True and False. Each condition needs its own parentheses.'
    long: |
      Python's words `and`, `or` and `not` ask a whole column for one True or False and raise
      [[ambiguous-truth-value]].
    related: [boolean-mask, ambiguous-truth-value]
    skills: [combine-masks]
  - id: ambiguous-truth-value
    term: Ambiguous truth value
    aka: ['The truth value of a Series is ambiguous', ValueError]
    short: 'The ValueError pandas raises when Python needs one True or False from a whole column, as `and` or a missing parenthesis does.'
    related: [mask-operators]
    skills: [combine-masks]
  - id: isna
    term: isna / notna
    aka: [isna, notna, isnull, notnull]
    short: 'Masks that are True where a value is missing (isna) or present (notna). `x == NaN` is never True, so use these.'
    related: [nan, candidate-items]
    skills: [missing-mask]
  - id: nan
    term: NaN
    aka: [not a number, missing value]
    short: 'pandas'' marker for a missing number. In a utility matrix it means "this user did not rate this item".'
    related: [isna]
    skills: [missing-mask]
  - id: candidate-items
    term: Candidate items
    aka: [candidates, unrated items]
    short: 'The items a recommender may suggest to a user: the ones the user has not rated yet.'
    related: [isna]
    skills: [missing-mask]
  - id: co-rated
    term: Co-rated items
    aka: [co-rated, co-raters, co-rater, common raters]
    short: 'Users who rated both items being compared; in pandas, `(util[a].notna() & util[b].notna()).sum()` counts them.'
    related: [isna, mask-operators]
    skills: [pair-mask]
  - id: relative-support
    term: Relative support
    aka: [RelSup, support as a fraction]
    short: The share of all transactions that contain the itemset, i.e. the absolute support divided by the number of transactions.
    long: |
      "At least 25% of recipes" compares a count with 0.25 × the number of recipes, or the share with 0.25, never a
      count with 0.25. See [[minsup]].
    related: [minsup]
    skills: [relative-threshold]
  - id: minsup
    term: Minimum support (minsup)
    aka: [minsup, minimum support]
    short: The bar an itemset's support must reach to count as frequent; given as a count (2) or as a fraction of all baskets (0.4).
    related: [relative-support, minconf]
    skills: [relative-threshold]
  - id: minconf
    term: Minimum confidence (minconf)
    aka: [minconf, minimum confidence]
    short: The confidence a candidate rule must reach to be kept.
    related: [minsup, lift]
    skills: [combine-masks]
  - id: lift
    term: Lift
    short: Confidence divided by the consequent's base rate; above 1 means baskets with A hold B more often than baskets in general.
    related: [minconf, tie-break]
    skills: [sort-tiebreak]
  - id: nlargest
    term: nlargest
    aka: [nlargest(1), head(1)]
    short: 'Keeps the n rows with the largest values. With n = 1 it keeps one row even when several share the maximum.'
    related: [tie-break]
    skills: [max-filter]
  - id: tie-break
    term: Tie-break
    aka: [tie-breaks, tie, ties, tied]
    short: A second sort key that decides the order of rows whose first key is equal, so the result comes out the same every run.
    long: |
      In pandas: `sort_values(["score", "id"], ascending=[False, True])`. A tie at the top-k cut-off decides which
      id makes the list, which is why an [[assert-equal]] can fail on a single item.
    related: [assert-equal, nlargest]
    skills: [sort-tiebreak]
  - id: assert-equal
    term: assert_equal
    aka: [numpy.testing.assert_equal, assert]
    short: 'A test that raises AssertionError when two values differ, printing the first difference as ACTUAL (yours) and DESIRED (expected).'
    related: [tie-break]
    skills: [read-asserts]
