      walkthrough:
        - say: |
            Rules come from the frequent sets with two or more tags: each tag can be the consequent, the rest is the
            antecedent. Support is already at least 25%, because the whole set is frequent.
          code: |
            import ast
            from itertools import combinations

            def frequent(frac=0.25):
                recipes = pd.read_csv("{=dataDir}/RAW_recipes.csv", converters={"tags": ast.literal_eval})
                baskets = [set(t) for t in recipes["tags"]]
                n = len(baskets)
                tags = sorted(set().union(*baskets))
                freq = {}
                for size in range(1, len(tags) + 1):
                    for s in combinations(tags, size):
                        c = sum(1 for b in baskets if set(s) <= b)
                        if c >= frac * n:
                            freq[s] = c
                return freq, n

            freq, n = frequent()
            candidates = [(s, b) for s in freq if len(s) >= 2 for b in s]
            print(len(candidates), "candidate rules")
        - say: |
            Confidence = count(A ∪ {b}) / count(A); keep it at 0.8 or more. Lift = confidence / (count(b) / n). Sort by
            decreasing lift, then by the antecedent list.
          code: |
            def highest_lifts():
                freq, n = frequent()
                rules = []
                for s, c in freq.items():
                    if len(s) < 2:
                        continue
                    for b in s:
                        a = tuple(x for x in s if x != b)
                        conf = c / freq[a]
                        if conf >= 0.8:
                            rules.append((conf / (freq[(b,)] / n), list(a), b))
                rules.sort(key=lambda x: (-x[0], x[1]))
                return [(a, b) for _, a, b in rules[:10]]

            hl = highest_lifts()
            assert_equal(hl[:5], {=liftsPy})
            print("passed")
