title: 'Midterm mock: recipes, recommendations and tags'
story: examQ
timeLimitMin: 45
intro: |
  A food site hands you two tables, already loaded. `interactions` has one row per rating (`user_id`, `recipe_id`,
  `rating`, all ratings 1 to 5), and `recipes` holds each recipe's `tags` as a real list. As in the midterm, every
  problem is a function whose result a hidden test checks, so what counts is selecting exactly the rows the spec
  describes. Each attempt draws new data, and all four problems use the same data.

  Work the numbers by hand from the tables in each question. Answers are hidden until you submit, then every worked
  solution is shown.
problems:
  - id: p1a
    title: 'Problem 1a: The utility matrix'
    spec: |
      Create a function `create_utility_matrix` that returns a DataFrame with users as rows and recipes as columns,
      considering **only recipes with at least {=nMin} ratings**. Sort users and recipes by their ids.
    hint: |
      Count, cut, pivot. `counts = interactions.groupby("recipe_id")["rating"].count()`, keep
      `counts[counts >= {=nMin}].index`, filter the rows with `isin`, then
      `pivot(index="user_id", columns="recipe_id", values="rating")`. Columns are the kept recipes; NaN cells are
      user-recipe pairs with no rating.
    items:
      - { template: exam-1a, points: 10 }
  - id: p1b
    title: 'Problem 1b: Item-based recommendations'
    spec: |
      Create a function `item_recommend(user)` that returns the best recipe ids for that user by an item-based
      recommender using **up to {=k} nearest neighbours**. Consider **only neighbours with at least {=m} commonly
      rating users**. Recommend only recipes the user has not rated. Follow the conventions used in class:
      user-mean-centred cosine over co-rated users, positive similarities only, mean added back. Sort by
      **decreasing estimated rating, then by increasing recipe id**.
    hint: |
      Two selections, then a sort. Candidates: `row = util.loc[user]` and `row[row.isna()]`. Neighbours of candidate `j`:
      recipes `r` the user rated with `(util[j].notna() & util[r].notna()).sum() >= {=m}`. Ranking:
      `sort_values(["estimate", "recipe_id"], ascending=[False, True])`.
    items:
      - { template: exam-1b-select, points: 10 }
      - { template: exam-1b-rank, points: 10 }
  - id: p2a
    title: 'Problem 2a: Largest frequent tag sets'
    spec: |
      Treat each recipe as a transaction and its tags as items. A set of tags is frequent if it is found in **at least
      50%** of the recipes. Create `largest_baskets()` that returns **all** the largest frequent tag sets, sorted by
      decreasing support, with the tags in each set sorted alphabetically.
    hint: |
      Turn 50% into a count first: `len(recipes) * 0.5`. A set is frequent when its count is `>=` that number. The
      largest sets are every frequent set whose size equals the maximum size (`size == size.max()`), ties included.
    items:
      - { template: exam-2a, points: 10 }
  - id: p2b
    title: 'Problem 2b: Strong rules'
    spec: |
      Create `strong_rules()` that returns the tag association rules with **support of at least 50% and confidence of
      at least 0.8**, each with a single-tag consequent, sorted by **decreasing lift, then by antecedent**.
    hint: |
      confidence(A → b) = count(A ∪ {b}) / count(A); lift = confidence / (share of recipes with b). Keep
      `(support >= 0.5) & (confidence >= 0.8)`, then `sort_values(["lift", "antecedent"], ascending=[False, True])`.
    items:
      - { template: exam-2b, points: 10 }
coding:
  title: 'Midterm mock (coding): Food.com, smaller'
  story: codeExamQ
  timeLimitMin: 120
  intro: |
    This is the midterm, problem for problem, on a smaller dataset: {=nRatings} ratings of {=nRecipes} recipes by
    {=nUsers} users, in the same file layout as the Food.com Recipes and Interactions dataset. Each attempt draws new
    data. Write each function in its cell, run it, then run its test cell: `assert_equal` checks it and prints ACTUAL
    and DESIRED when it fails.

    Python 3.12 and pandas 2.2 run in your browser. The files are at `{=dataDir}`. When you submit, the kernel restarts
    and your cells run top to bottom before the tests, as a grader would run them. Afterwards, walk through every
    problem or only the ones you missed, then try its twists.
  files:
    '{=dataDir}/RAW_interactions.csv': interactionsCsv
    '{=dataDir}/RAW_recipes.csv': recipesCsv
  setup: |
    import numpy as np
    import pandas as pd
    from numpy.testing import assert_equal
  problems:
    # ======================================================================== 1a
    - id: c1a
      title: 'Problem 1a [10 pts]'
      spec: |
        For Problem 1, you will be working with the dataset found at `{=dataDir}`.

        Create a function `create_utility_matrix` that reads `{=dataDir}/RAW_interactions.csv` and returns a pandas data
        frame corresponding to the utility matrix. Consider only items that have at least {=nMin} ratings. Sort users
        and items by their ids.
      hint: |
        Count each recipe's ratings with `groupby`, keep `counts >= {=nMin}`, filter the rows with `isin`, then
        `pivot(index="user_id", columns="recipe_id", values="rating")`.
      stub: |
        def create_utility_matrix():
            """Return the utility matrix: users as rows, recipes as columns."""
            # YOUR CODE HERE
            raise NotImplementedError()
      tests:
        - points: 10
          code: |
            df_utility = create_utility_matrix()
            assert_equal(df_utility.shape, {=shapePy})
            assert_equal(df_utility.columns[:10].tolist(), {=colsPy})
            assert_equal(df_utility.index[:10].tolist(), {=indexPy})
            ratings = df_utility.iloc[0][df_utility.iloc[0].notnull()]
            assert_equal(ratings.tolist(), {=firstRatingsPy})
            assert_equal(ratings.index.tolist(), {=firstItemsPy})
      walkthrough:
        - say: |
            Start where the spec points: read the file and look at it before you write the function. The rating column
            is `rating`, and the ids are whole numbers.
          code: |
            df = pd.read_csv("{=dataDir}/RAW_interactions.csv")
            print(df.shape)
            df.head()
        - say: |
            "At least {=nMin} ratings" is a count per recipe, then a cut with `>=`. Look at the counts near the cut-off:
            recipes with exactly {=nMin} must stay.
          code: |
            counts = df.groupby("recipe_id")["rating"].count()
            keep = counts[counts >= {=nMin}].index
            print(len(keep), "recipes kept")
            counts.sort_values().head(8)
        - say: |
            `isin` keeps only the rows of those recipes. `pivot` puts users in rows and recipes in columns, sorted by id.
          code: |
            rated = df[df["recipe_id"].isin(keep)]
            util = rated.pivot(index="user_id", columns="recipe_id", values="rating")
            util.shape
        - say: |
            Wrap the steps in the function the spec names. It reads the file itself, so it works in a fresh kernel.
            Then the test cell.
          code: |
            def create_utility_matrix():
                df = pd.read_csv("{=dataDir}/RAW_interactions.csv")
                counts = df.groupby("recipe_id")["rating"].count()
                keep = counts[counts >= {=nMin}].index
                rated = df[df["recipe_id"].isin(keep)]
                return rated.pivot(index="user_id", columns="recipe_id", values="rating")

            df_utility = create_utility_matrix()
            assert_equal(df_utility.shape, {=shapePy})
            assert_equal(df_utility.columns[:10].tolist(), {=colsPy})
            assert_equal(df_utility.index[:10].tolist(), {=indexPy})
            print("passed")
      twists:
        - id: gt
          title: 'More than, not at least'
          change: '"at least {=nMin}" becomes "more than {=nMin}": recipes with exactly {=nMin} ratings now drop out.'
          spec: |
            Create a function `create_utility_matrix_gt` like `create_utility_matrix`, but considering only items with
            **more than** {=nMin} ratings.
          stub: |
            def create_utility_matrix_gt():
                # YOUR CODE HERE
                raise NotImplementedError()
          solution: |
            def create_utility_matrix_gt():
                df = pd.read_csv("{=dataDir}/RAW_interactions.csv")
                counts = df.groupby("recipe_id")["rating"].count()
                keep = counts[counts > {=nMin}].index
                rated = df[df["recipe_id"].isin(keep)]
                return rated.pivot(index="user_id", columns="recipe_id", values="rating")
          tests:
            - |
              u = create_utility_matrix_gt()
              assert_equal(u.shape, {=gtShapePy})
              assert_equal(u.columns[:10].tolist(), {=gtColsPy})
        - id: active
          title: 'A cut on the users too'
          change: 'A second cut, on the rows: after building the matrix, keep only users with at least {=uMin} ratings in it.'
          spec: |
            Create a function `create_active_matrix` that returns the utility matrix of Problem 1a, keeping only the users
            with **at least {=uMin} ratings in that matrix**.
          stub: |
            def create_active_matrix():
                # YOUR CODE HERE
                raise NotImplementedError()
          solution: |
            def create_active_matrix():
                util = create_utility_matrix()
                per_user = util.notna().sum(axis=1)
                return util[per_user >= {=uMin}]
          tests:
            - |
              a = create_active_matrix()
              assert_equal(a.shape, {=activeShapePy})
              assert_equal(a.index[:10].tolist(), {=activeIndexPy})

    # ======================================================================== 1b
    - id: c1b
      title: 'Problem 1b [10 pts]'
      spec: |
        Create a function `item_recommend` that accepts a user ID and returns the {=topN} best recipe ID recommendations
        for that user by an item-based recommender system using (up to) {=k} nearest neighbors. Consider only neighbors
        that have at least {=m} commonly rating users. Follow the preprocessing and conventions used in class. Sort by
        decreasing estimated rating then by increasing recipe ID.

        *The conventions used in class (nb-cf):* centre each rating by its user's mean over the recipes that user rated
        in the utility matrix; similarity is the cosine of the centred ratings over co-rated users (0 if a length is 0);
        a candidate's neighbors are the recipes the user rated; take the top {=k} by similarity (ties by recipe ID),
        then keep only positive similarities; estimate = user mean + Σ sim × centred rating / Σ sim. Recipes without a
        neighbor get no estimate.
      hint: |
        Candidates: `row = util.loc[user]` and `row[row.isna()]`. Common raters of recipes `j` and `r`:
        `(util[j].notna() & util[r].notna()).sum() >= {=m}`. Rank with
        `sort_values(["estimate", "recipe_id"], ascending=[False, True])`.
      stub: |
        def item_recommend(user):
            """Return the best recipe ids for a user ID by item-based collaborative filtering."""
            # YOUR CODE HERE
            raise NotImplementedError()
      tests:
        - points: 10
          code: |
            assert_equal(item_recommend({=user}), {=itemRecPy})
      walkthrough:
        - say: |
            Build the matrix with the Problem 1a function, centre each user's ratings by that user's own mean, and split
            the user's row into candidates (NaN) and rated recipes.
          code: |
            util = create_utility_matrix()
            centered = util.sub(util.mean(axis=1), axis=0)
            row = util.loc[{=user}]
            candidates = row[row.isna()].index.tolist()
            rated = row[row.notna()].index.tolist()
            print("candidates:", candidates)
            print("rated:", rated)
        - say: |
            For one candidate, go through the recipes the user rated. A neighbor needs at least {=m} users who rated
            both; the similarity is the cosine of the centred ratings over exactly those users.
          code: |
            j = candidates[0]
            for r in rated:
                both = util[j].notna() & util[r].notna()
                if both.sum() < {=m}:
                    print(r, "skipped:", both.sum(), "common raters")
                    continue
                a, b = centered.loc[both, j], centered.loc[both, r]
                den = np.sqrt((a ** 2).sum()) * np.sqrt((b ** 2).sum())
                print(r, "sim =", round((a * b).sum() / den, 3) if den > 1e-12 else 0.0)
        - say: |
            Keep the top {=k} by similarity (ties by recipe ID), drop non-positive ones, and average the neighbors'
            centred ratings weighted by similarity, plus the user's mean. Do it for every candidate, then rank.
          code: |
            def item_recommend(user):
                util = create_utility_matrix()
                centered = util.sub(util.mean(axis=1), axis=0)
                row = util.loc[user]
                est = {}
                for j in row[row.isna()].index:
                    sims = []
                    for r in row[row.notna()].index:
                        both = util[j].notna() & util[r].notna()
                        if both.sum() < {=m}:
                            continue
                        a, b = centered.loc[both, j], centered.loc[both, r]
                        den = np.sqrt((a ** 2).sum()) * np.sqrt((b ** 2).sum())
                        sims.append(((a * b).sum() / den if den > 1e-12 else 0.0, r))
                    sims.sort(key=lambda x: (-x[0], x[1]))
                    used = [(s, r) for s, r in sims[:{=k}] if s > 1e-12]
                    if used:
                        est[j] = row.mean() + sum(s * centered.loc[user, r] for s, r in used) / sum(s for s, _ in used)
                out = pd.DataFrame({"recipe_id": list(est), "estimate": list(est.values())})
                out = out.sort_values(["estimate", "recipe_id"], ascending=[False, True])
                return out["recipe_id"].head({=topN}).tolist()

            assert_equal(item_recommend({=user}), {=itemRecPy})
            print("passed")
      twists:
        - id: user-based
          title: 'User-based instead of item-based'
          change: 'Neighbors are now other users who rated the candidate, compared over the recipes both rated; m now counts common recipes.'
          spec: |
            Create a function `user_recommend` that returns the {=topN} best recipe IDs for a user ID by a **user-based**
            recommender: for each candidate recipe, the neighbors are the other users who rated it, using (up to) {=k}
            nearest neighbors with at least {=m} commonly rated recipes. Same centring, similarity, tie-breaks and
            estimate as in class. Sort by decreasing estimate, then increasing recipe ID.
          stub: |
            def user_recommend(user):
                # YOUR CODE HERE
                raise NotImplementedError()
          solution: |
            def user_recommend(user):
                util = create_utility_matrix()
                centered = util.sub(util.mean(axis=1), axis=0)
                row = util.loc[user]
                est = {}
                for j in row[row.isna()].index:
                    sims = []
                    for v in util.index[util[j].notna()]:
                        both = util.loc[user].notna() & util.loc[v].notna()
                        if v == user or both.sum() < {=m}:
                            continue
                        a, b = centered.loc[user, both], centered.loc[v, both]
                        den = np.sqrt((a ** 2).sum()) * np.sqrt((b ** 2).sum())
                        sims.append(((a * b).sum() / den if den > 1e-12 else 0.0, v))
                    sims.sort(key=lambda x: (-x[0], x[1]))
                    used = [(s, v) for s, v in sims[:{=k}] if s > 1e-12]
                    if used:
                        est[j] = row.mean() + sum(s * centered.loc[v, j] for s, v in used) / sum(s for s, _ in used)
                out = pd.DataFrame({"recipe_id": list(est), "estimate": list(est.values())})
                out = out.sort_values(["estimate", "recipe_id"], ascending=[False, True])
                return out["recipe_id"].head({=topN}).tolist()
          tests:
            - |
              assert_equal(user_recommend({=user}), {=userRecPy})

    # ======================================================================== 1c
    - id: c1c
      title: 'Problem 1c [10 pts]'
      spec: |
        Create a function `cd_recommend` that will recommend the {=topN} best unrated recipe IDs to the given `user` ID
        according to coordinate gradient descent with {=d} latent components and stopping condition of improvement in
        SSE (fraction change) less than 0.1. Follow the usual initial conditions and optimization order to pass the
        asserts. Sort by decreasing estimated rating then by increasing recipe ID.

        *The usual initial conditions and order (lf-cf):* U (users × {=d}) and V ({=d} × recipes) start as all ones. One
        sweep updates every entry of U, user by user and factor by factor, then every entry of V, factor by factor and
        recipe by recipe. Each entry is set to its exact minimiser over the observed ratings:
        Σ factor × (rating − rest) / Σ factor². SSE is summed over observed ratings. After each sweep, stop when
        (previous SSE − new SSE) / previous SSE < 0.1, and predict with the factors from that sweep.
      hint: |
        Use the matrix from Problem 1a. Keep a mask of the observed cells (`~np.isnan(R)`), and compute the SSE only over
        them. Recommend among the user's NaN cells.
      stub: |
        def cd_recommend(user):
            """Return the best unrated recipe ids for a user ID by coordinate descent."""
            # YOUR CODE HERE
            raise NotImplementedError()
      tests:
        - points: 10
          code: |
            assert_equal(cd_recommend({=user}), {=cdRecPy})
      walkthrough:
        - say: |
            Turn the matrix into an array and keep a mask of the observed cells: the SSE counts only those. U and V start
            as all ones.
          code: |
            util = create_utility_matrix()
            R = util.to_numpy(dtype=float)
            mask = ~np.isnan(R)
            nu, ni = R.shape
            U, V = np.ones((nu, {=d})), np.ones(({=d}, ni))
            sse = lambda: float(((R - U @ V)[mask] ** 2).sum())
            print("SSE before any sweep:", round(sse(), 3))
        - say: |
            One sweep: every u (user by user, factor by factor), then every v (factor by factor, recipe by recipe).
            Each entry jumps to its exact minimiser, Σ factor × (rating − rest) / Σ factor², over the observed cells.
          code: |
            def sweep(U, V):
                for i in range(nu):
                    for s in range({=d}):
                        obs = mask[i]
                        rest = U[i] @ V[:, obs] - U[i, s] * V[s, obs]
                        den = (V[s, obs] ** 2).sum()
                        U[i, s] = (V[s, obs] * (R[i, obs] - rest)).sum() / den if den != 0 else 0.0
                for s in range({=d}):
                    for j in range(ni):
                        obs = mask[:, j]
                        rest = U[obs] @ V[:, j] - U[obs, s] * V[s, j]
                        den = (U[obs, s] ** 2).sum()
                        V[s, j] = (U[obs, s] * (R[obs, j] - rest)).sum() / den if den != 0 else 0.0

            sweep(U, V)
            print("SSE after one sweep:", round(sse(), 3))
        - say: |
            Sweep until the improvement fraction drops below 0.1, keep the factors from that last sweep, and rank the
            user's NaN cells by U @ V.
          code: |
            def cd_recommend(user):
                util = create_utility_matrix()
                R = util.to_numpy(dtype=float)
                mask = ~np.isnan(R)
                nu, ni = R.shape
                U, V = np.ones((nu, {=d})), np.ones(({=d}, ni))
                sse = lambda: float(((R - U @ V)[mask] ** 2).sum())
                prev = sse()
                while True:
                    for i in range(nu):
                        for s in range({=d}):
                            obs = mask[i]
                            rest = U[i] @ V[:, obs] - U[i, s] * V[s, obs]
                            den = (V[s, obs] ** 2).sum()
                            U[i, s] = (V[s, obs] * (R[i, obs] - rest)).sum() / den if den != 0 else 0.0
                    for s in range({=d}):
                        for j in range(ni):
                            obs = mask[:, j]
                            rest = U[obs] @ V[:, j] - U[obs, s] * V[s, j]
                            den = (U[obs, s] ** 2).sum()
                            V[s, j] = (U[obs, s] * (R[obs, j] - rest)).sum() / den if den != 0 else 0.0
                    cur = sse()
                    if (prev - cur) / prev < 0.1:
                        break
                    prev = cur
                P = pd.DataFrame(U @ V, index=util.index, columns=util.columns)
                row = util.loc[user]
                out = P.loc[user, row[row.isna()].index].reset_index()
                out.columns = ["recipe_id", "estimate"]
                out = out.sort_values(["estimate", "recipe_id"], ascending=[False, True])
                return out["recipe_id"].head({=topN}).tolist()

            assert_equal(cd_recommend({=user}), {=cdRecPy})
            print("passed")
      twists:
        - id: fixed-sweeps
          title: 'A fixed number of sweeps'
          change: 'No stopping rule: run exactly 4 sweeps, and report the SSE as you go.'
          spec: |
            Create a function `cd_sse_history` that runs coordinate descent on the Problem 1a matrix with {=d} latent
            components for **exactly 4 sweeps** and returns the SSE before any sweep and after each sweep (5 numbers),
            each rounded to 3 decimals.
          stub: |
            def cd_sse_history():
                # YOUR CODE HERE
                raise NotImplementedError()
          solution: |
            def cd_sse_history():
                util = create_utility_matrix()
                R = util.to_numpy(dtype=float)
                mask = ~np.isnan(R)
                nu, ni = R.shape
                U, V = np.ones((nu, {=d})), np.ones(({=d}, ni))
                sse = lambda: float(((R - U @ V)[mask] ** 2).sum())
                history = [round(sse(), 3)]
                for _ in range(4):
                    for i in range(nu):
                        for s in range({=d}):
                            obs = mask[i]
                            rest = U[i] @ V[:, obs] - U[i, s] * V[s, obs]
                            den = (V[s, obs] ** 2).sum()
                            U[i, s] = (V[s, obs] * (R[i, obs] - rest)).sum() / den if den != 0 else 0.0
                    for s in range({=d}):
                        for j in range(ni):
                            obs = mask[:, j]
                            rest = U[obs] @ V[:, j] - U[obs, s] * V[s, j]
                            den = (U[obs, s] ** 2).sum()
                            V[s, j] = (U[obs, s] * (R[obs, j] - rest)).sum() / den if den != 0 else 0.0
                    history.append(round(sse(), 3))
                return history
          tests:
            - |
              assert_equal(cd_sse_history(), {=sse4Py})
        - id: two-factors
          title: 'Two factors and a tighter stop'
          change: 'Two latent components, stop below 0.05 instead of 0.1, and return the top estimate itself.'
          spec: |
            Create a function `cd_top` that runs the same coordinate descent with **2 latent components** and a
            stopping fraction of **0.05**, and returns `(recipe_id, estimate)` for the user's best unrated recipe, the
            estimate rounded to 3 decimals.
          stub: |
            def cd_top(user):
                # YOUR CODE HERE
                raise NotImplementedError()
          solution: |
            def cd_top(user):
                util = create_utility_matrix()
                R = util.to_numpy(dtype=float)
                mask = ~np.isnan(R)
                nu, ni = R.shape
                U, V = np.ones((nu, 2)), np.ones((2, ni))
                sse = lambda: float(((R - U @ V)[mask] ** 2).sum())
                prev = sse()
                while True:
                    for i in range(nu):
                        for s in range(2):
                            obs = mask[i]
                            rest = U[i] @ V[:, obs] - U[i, s] * V[s, obs]
                            den = (V[s, obs] ** 2).sum()
                            U[i, s] = (V[s, obs] * (R[i, obs] - rest)).sum() / den if den != 0 else 0.0
                    for s in range(2):
                        for j in range(ni):
                            obs = mask[:, j]
                            rest = U[obs] @ V[:, j] - U[obs, s] * V[s, j]
                            den = (U[obs, s] ** 2).sum()
                            V[s, j] = (U[obs, s] * (R[obs, j] - rest)).sum() / den if den != 0 else 0.0
                    cur = sse()
                    if (prev - cur) / prev < 0.05:
                        break
                    prev = cur
                P = pd.DataFrame(U @ V, index=util.index, columns=util.columns)
                row = util.loc[user]
                cand = P.loc[user, row[row.isna()].index]
                best = cand.reset_index().sort_values([user, "recipe_id"], ascending=[False, True]).iloc[0]
                return int(best["recipe_id"]), round(float(best[user]), 3)
          tests:
            - |
              assert_equal(cd_top({=user}), ({=cdTwoId}, {=cdTwoEst}))

    # ======================================================================== 2a
    - id: c2a
      title: 'Problem 2a [10 pts]'
      spec: |
        For Problem 2, consider each recipe in `{=dataDir}/RAW_recipes.csv` as a transaction and their tags as items in
        the transaction.

        Create a function `largest_baskets` that returns the list of all largest baskets of frequent tags in terms of
        the number of items in the basket. A set of tags is frequent if it is found in at least 25% of the recipes.
        Sort the baskets by decreasing support. Sort the items in each basket lexicographically.
      hint: |
        The `tags` column is text: read it with `converters={"tags": ast.literal_eval}`. "At least 25%" is
        `count >= 0.25 * len(recipes)`. Keep every frequent set whose size equals the maximum size; ties in support go
        by the sorted tag list.
      stub: |
        def largest_baskets():
            """Return all the largest frequent tag sets, by decreasing support."""
            # YOUR CODE HERE
            raise NotImplementedError()
      tests:
        - points: 10
          code: |
            lb = largest_baskets()
            assert_equal(lb[:2], {=largestPy})
      walkthrough:
        - say: |
