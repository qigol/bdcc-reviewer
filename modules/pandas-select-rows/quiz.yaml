  - id: book-case
    type: case
    skills: [missing-mask, pair-mask, sort-tiebreak, read-asserts]
    difficulty: 3
    tags: [application]
    prompt: |
      **A book recommender.** `util` is users × books (NaN = unread). The spec: *"`recommend(user)` returns the 5 best
      **unread** books by predicted score, ties by increasing book id, using only neighbour books with **at least 20**
      common readers."*
    parts:
      - type: code-fill
        prompt: Complete the candidates and the common-reader count.
        code: |
          row = util.loc[user]
          candidates = row[row.__BLANK_1__()].index
          common = (util[b].notna() __BLANK_2__ util[j].notna()).sum()
          keep = common __BLANK_3__ 20
        blanks:
          '1': { accept: [isna, isnull] }
          '2': { accept: ['&'] }
          '3': { accept: ['>='] }
        explanation: 'Unread = `isna`; common readers need both columns (`&`); "at least" is `>=`.'
      - type: mcq
        prompt: Which sort gives the spec's order?
        options: ['`sort_values(["score", "book_id"], ascending=[False, True])`', '`sort_values("score", ascending=False)`', '`sort_values(["score", "book_id"], ascending=False)`', '`nlargest(5, "score")`']
        answer: 0
        shuffle: false
        optionFeedback:
          '1': 'No tie-break: tied books come in whatever order pandas left them.'
          '2': 'That sorts the ids descending too.'
          '3': 'nlargest keeps the current order for ties, not the spec''s.'
        explanation: 'Two keys, two directions: score down, id up.'
      - type: mcq
        prompt: 'The test fails: item=0, ACTUAL a book the user already read. What do you fix?'
        options: ['The candidate mask', 'The tie-break', 'The neighbour threshold', 'Nothing: the test is wrong']
        answer: 0
        shuffle: false
        optionFeedback:
          '1': 'A tie-break reorders candidates; it cannot add a read book.'
          '2': 'Neighbours affect scores, not which books are candidates.'
          '3': 'A read book must never be recommended.'
        explanation: 'A read book in the output means the candidate mask kept rated cells: `isna`, not `notna`.'
    hints:
      - 'Candidates, neighbours, ranking: three separate conditions.'
    explanation: 'Unread books by `isna`, neighbours by `(a.notna() & b.notna()).sum() >= 20`, ranking by two keys, and ACTUAL/DESIRED to locate the slip.'

  - id: explain-conditions
    type: explain
    skills: [combine-masks, read-asserts]
    difficulty: 2
    tags: [code]
    prompt: 'A spec has three conditions and your result fails the test. Explain how you would find which condition is wrong without rewriting everything.'
    model: |
      Build each condition as its own mask and print its `.sum()` against what the spec implies. Then combine them
      with `&` (or `|` where the spec says "or"), each in parentheses. Compare ACTUAL with DESIRED: too many rows means
      a loose condition or `|`, a wrong first item points at the mask, and one late item at a tie.
    checklist:
      - 'Checks each mask separately with `.sum()`'
      - 'Combines with `&`/`|` and parentheses as the spec words it'
      - 'Uses ACTUAL and DESIRED to narrow down the cause'
    explanation: 'Debug selections one condition at a time.'
