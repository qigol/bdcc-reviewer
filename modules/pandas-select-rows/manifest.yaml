  notes: '2026-11-03: v1.0.0. Built for the midterm gap: students could load the data but not isolate the rows each spec describes (unrated items, co-rated neighbours, relative support, confidence AND support, largest baskets, score-then-id ranking). Every output and assert failure is a real run (assets/record2.py: Python 3.12.12, pandas 2.2.3, numpy 2) on food-mini. Spec wording and thresholds are mirrored from the midterm on purpose; no midterm code, solutions or assert values are used. 1.0.1: assert-mcq variants use food-mini ids. 1.3.0: after submit, a walkthrough of each coding problem (every problem or only the missed ones) and twists that change the spec; all checked in real pandas with scripts/exam-check. 1.2.0: the coding version of the mock exam (exam.yaml coding): the five midterm problems in real Python run in the browser by Pyodide, on a smaller Food.com-shaped dataset; checked with a reference solution on 40 seeds; exam hints and tools. 1.1.0: a 4-problem mock exam (exam.yaml) shaped like the midterm, scoring the selections only; one seed draws one dataset for all problems; item-based CF copied verbatim from nb-cf and checked against its slide numbers (examples ib-*). Application decisions branch: a wrong option shows its real output or its real failed assert.'
