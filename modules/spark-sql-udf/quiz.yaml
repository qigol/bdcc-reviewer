  - id: pandas-udf-explain
    type: explain
    skills: [pandas-series-udf, arrow-transfer]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: whole-batches }
    prompt: 'A teammate''s `@udf` that doubles a fare is slow on millions of trips. Explain why a pandas UDF doing `s * 2` is usually faster.'
    model: |
      A plain UDF is called once per row, and each value is converted to and from Python on its own.
      A pandas UDF gets a whole Arrow batch (up to 10,000 rows) as a pandas Series, so Python is called once per
      batch, and `s * 2` doubles every value in one fast step. Fewer calls and no per-row conversion save time.
    checklist:
      - A plain UDF runs once per row
      - A pandas UDF runs once per batch of many rows
      - Arrow converts a whole batch in one go, not value by value
      - 's * 2 works on the whole Series at once'
    hints: ['Count how many times Python is called in each case.']
    explanation: 'Batches cut the number of calls and the per-row conversions.'

