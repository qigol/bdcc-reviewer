templates:
  # =====================================================================================
  # User-defined functions
  # =====================================================================================
  - id: plain-vs-udf-mcq
    type: mcq
    skills: [udf-wrap]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: intuition, id: plain-function }
    prompt: |
      `pair_code` is a plain Python [[function]]: `def pair_code(pu, do): return f'{pu}-{do}'`, with no `@udf`
      line. What does `trips.select(pair_code(trips.PULocationID, trips.DOLocationID)).show()` do?
    options:
      - 'It fails with an [[analysis-exception]]: the function joined the two Column descriptions into one long name that is no column'
      - 'It prints one code per trip, such as `41-238`'
      - 'It prints the single code `PULocationID-DOLocationID`'
      - 'It fails with a NameError, because `pair_code` is not defined'
    answer: 0
    optionFeedback:
      '1': 'That is what the `@udf` version prints. The plain function runs once, in Python, on two Column objects, not on each row''s values.'
      '2': 'Close: with the names as strings it builds `PULocationID-DOLocationID`. Here it gets Column objects, and `select` then looks for a column with that made-up name and fails.'
      '3': '`pair_code` is defined; the def cell ran. The error comes from Spark, not from Python names.'
    hints:
      - What does `f'{pu}-{do}'` give when `pu` is `trips.PULocationID`, a Column object?
    explanation: |
      Without `@udf`, Python calls `pair_code` once with two Column objects and returns the string
      `"Column<'PULocationID'>-Column<'DOLocationID'>"`. `select` treats that string as a column name, and the real
      run fails with `UNRESOLVED_COLUMN`. Only a [[udf]] makes Spark call the function once per row.
    variants:
      - prompt: 'After `@udf` is added above `def pair_code`, what does `pair_code(41, 238)` return in the notebook?'
        options:
          - 'A PySparkTypeError: a UDF expects columns (or column names), not plain numbers'
          - "The string '41-238'"
          - 'The number 41238'
          - 'A Column that Spark fills in later with 41-238'
        answer: 0
        optionFeedback:
          '1': 'That was true before `@udf`. Now `pair_code` is a UDF, and the real run says `Argument col should be Column or str, got int`.'
          '2': 'Nothing adds the numbers; the f-string joins them with a hyphen, and here it does not even run.'
          '3': 'A UDF only builds a Column from column names or Columns. 41 is neither, so it raises at once.'
        explanation: 'A UDF works on columns. To test the Python logic on plain values, call the function before decorating it.'
      - prompt: 'Which line makes Spark call `pair_code` once for every row of `trips`?'
        options:
          - "`trips.select(pair_code('PULocationID', 'DOLocationID'))` after `@udf` is added above the def"
          - "`trips.select(pair_code('PULocationID', 'DOLocationID'))` with the plain def"
          - '`[pair_code(r[0], r[1]) for r in [(41, 238)]]` with the plain def'
          - "`trips.select('PULocationID', 'DOLocationID').show()`"
        answer: 0
        optionFeedback:
          '1': 'The plain def runs once on the two names and returns `PULocationID-DOLocationID`, which is no column.'
          '2': 'That runs the function in plain Python on one hand-typed pair, not on the DataFrame.'
          '3': 'That shows the two zones but never calls `pair_code`.'
        explanation: '`@udf` wraps the function so Spark sends it each row''s values and builds a new column from the results.'

  - id: pair-code-fill
    type: code-fill
    skills: [udf-wrap]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: udf-per-row }
    prompt: Complete the cell so that Spark runs `pair_code` on every trip and shows the codes.
    code: |
      from pyspark.sql.functions import udf

      @__BLANK_1__
      def pair_code(pu, do):
          """Concatenate PULocationID and DOLocationID with a hyphen"""
          return f'{pu}-{do}'

      trips.__BLANK_2__(pair_code('PULocationID', 'DOLocationID')).show()
    blanks:
      '1': { accept: [udf, 'udf()', 'udf(useArrow=True)'], hint: 'The name of the function that wraps it.' }
      '2': { accept: ['select'], hint: 'The method that picks or builds columns.' }
    hints:
      - The function must be wrapped before Spark can call it per row.
    explanation: '`@udf` turns the function into a [[udf]]; `select(...)` builds the new column, and `show()` prints it.'

  - id: pair-distinct-numeric
    type: numeric
    skills: [udf-wrap]
    difficulty: 1
    tags: [math]
    generator: pairDistinctQ
    lessonRef: { tab: intuition, id: plain-function }
    prompt: |
      The `@udf` version of `pair_code` runs on this table. How many **different** codes appear in its output?

      {=table}
    answer: { var: distinct, tol: 0 }
    hints:
      - Write the code for each row first, `pickup-dropoff`.
      - Then cross out codes you have already seen.
    explanation: |
      The codes are {=codes}. Rows with the same pickup **and** drop-off give the same code, so there are
      {=distinct} different codes in {=n} rows.

  # =====================================================================================
  # Return types
  # =====================================================================================
  - id: return-type-mcq
    type: mcq
    skills: [udf-return-type]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: intuition, id: return-types }
    prompt: |
      `@udf` with no type, above `def double_fare(fare): return fare * 2`. The real run shows `23.0` for a fare of
      11.5. What type does `printSchema()` give the new column?
    options:
      - '`string`: without a declared [[return-type]], Spark stores the result as text'
      - '`double`: the function returns a Python float'
      - '`float`: Spark copies the input column''s type'
      - '`int`: 23.0 is a whole number'
    answer: 0
    optionFeedback:
      '1': 'Spark does not look at what Python returns. It uses the declared type, and the default is string.'
      '2': 'The input `fare_amount` is a double, but the UDF''s column takes the declared type, string.'
      '3': 'The value is printed as `23.0`, text that only looks like a number.'
    hints: ['What does `@udf` assume when you give it no type?']
    explanation: 'The real `printSchema()` prints `double_fare(fare_amount): string`. Declare `@udf(''double'')` to keep numbers.'
    variants:
      - prompt: '`@udf(''int'', useArrow=False)` above `def double_fare_int(fare): return fare * 2`. What does `show()` print for a fare of 11.5?'
        options:
          - 'NULL: with pickle, a float that does not fit the declared int is dropped silently'
          - '23'
          - '23.0'
          - 'A PythonException naming the type'
        answer: 0
        optionFeedback:
          '1': 'That is what Arrow gives (`useArrow=True`): it casts 23.0 to 23. Pickle does not cast.'
          '2': 'That would need a string or double type.'
          '3': 'With pickle there is no error at all, which is what makes it dangerous.'
        explanation: 'The real run prints NULL in every row: a silent NULL from a mismatched [[return-type]].'
      - prompt: 'Which `returnType` makes `collect_user_info` return a nested column with `id` and `user.name`?'
        options:
          - "`'id LONG, user STRUCT<name: STRING, description: STRING>'`"
          - "`'string'`"
          - "`'id, user.name, user.description'`"
          - "`'array<string>'`"
        answer: 0
        optionFeedback:
          '1': 'Then Spark would print the tuple as text, with no fields to reach into.'
          '2': 'A schema needs a type for every field, not only names.'
          '3': 'An array holds items by position, with no field names.'
        explanation: 'A [[ddl-schema-string]] (or the matching StructType) describes the [[struct]] the tuple fills.'

  - id: ddl-fill
    type: code-fill
    skills: [udf-return-type]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: struct-return }
    prompt: |
      Write the [[ddl-schema-string]] that matches this `StructType`, so that `@udf(UserInfoType2)` gives the same
      nested column.
      ```python
      StructType([
          StructField('id', LongType()),
          StructField('user', StructType([
              StructField('name', StringType()),
              StructField('description', StringType())
          ]))
      ])
      ```
    code: |
      UserInfoType2 = "id __BLANK_1__, user __BLANK_2__<name: STRING, description: STRING>"
    blanks:
      '1': { accept: ['LONG', 'BIGINT', 'long', 'bigint'], hint: 'LongType in DDL.' }
      '2': { accept: ['STRUCT', 'struct'], hint: 'The DDL word for a nested type with named fields.' }
    hints: ['Each StructField becomes `name TYPE`; a nested StructType becomes `STRUCT<...>`.']
    explanation: '`LongType()` is `LONG` (or `BIGINT`), and the nested StructType is `STRUCT<name: STRING, description: STRING>`.'

  - id: type-output-match
    type: match
    skills: [udf-return-type, arrow-transfer]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: intuition, id: return-types }
    prompt: 'Each declaration sits above `def f(fare): return fare * 2`. Match it to what the real run printed for a fare of 11.5.'
    pairs:
      - ['`@udf` (no type)', 'the text 23.0 (column type string)']
      - ["`@udf('double')`", 'the number 23.0']
      - ["`@udf('int', useArrow=True)`", '23']
      - ["`@udf('int', useArrow=False)`", 'NULL']
    hints: ['Arrow casts a value to the declared type; pickle drops values that do not fit.']
    explanation: 'Without a type, Spark keeps text. Arrow casts 23.0 to the int 23; [[pickle]] cannot, so the value becomes [[null-value|NULL]].'

  # =====================================================================================
  # Arrow and batches
  # =====================================================================================
  - id: arrow-mcq
    type: mcq
    skills: [arrow-transfer]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: pickle-or-arrow }
    prompt: 'What does `useArrow=True` change for a row-at-a-time `@udf`?'
    options:
      - 'How the values travel between Spark and Python: in Arrow''s shared column format instead of [[pickle]]'
      - 'What the function computes: Arrow runs a faster version of your code'
      - 'Where the result goes: Arrow writes it to a file'
      - 'Nothing at all; it is only a label'
    answer: 0
    optionFeedback:
      '1': 'Your Python code is the same. Only the way rows are packed and unpacked changes.'
      '2': 'The result is still a new column in the DataFrame.'
      '3': 'It changes the transfer, and with it how a mismatched return type is handled.'
    hints: ['The function body is identical in both versions. What else happens on every call?']
    explanation: '[[apache-arrow|Arrow]] sends values in batches in a format both sides read without converting each value. A mismatched type is then cast or raises an error, instead of becoming a silent NULL.'
    variants:
      - prompt: 'In the PySpark version these runs used (4.3), what does `spark.conf.get("spark.sql.execution.pythonUDF.arrow.enabled")` print in a fresh session?'
        options:
          - "'true': plain @udf functions already use Arrow"
          - "'false': pickle is always the default"
          - 'An error: the setting only exists on Databricks'
          - "'pickle'"
        answer: 0
        optionFeedback:
          '1': 'The notebook describes older versions. The real run on 4.3 printed `''true''`.'
          '2': 'It is a standard Spark setting; the real local run printed it.'
          '3': 'The setting is true or false, not a format name.'
        explanation: 'Check the setting in your own notebook: the default depends on the Spark version.'
      - prompt: 'Which kind of UDF always uses Arrow, whatever the setting?'
        options:
          - 'A pandas UDF made with `@pandas_udf`'
          - 'A plain `@udf`'
          - 'A lambda registered with `spark.udf.register`'
          - 'None: Arrow must always be switched on'
        answer: 0
        optionFeedback:
          '1': 'A plain `@udf` follows the setting or `useArrow=`.'
          '2': 'A registered plain function or lambda is a row-at-a-time UDF.'
          '3': 'Pandas UDFs need Arrow to build their pandas Series, so they always use it.'
        explanation: 'A [[pandas-udf]] receives whole Arrow [[batch|batches]] as pandas objects.'

  - id: batch-count-numeric
    type: numeric
    skills: [arrow-transfer]
    difficulty: 1
    tags: [math]
    generator: batchQ
    lessonRef: { tab: math-code, id: arrow-batches }
    prompt: |
      A partition holds **{=n}** rows and `spark.sql.execution.arrow.maxRecordsPerBatch` is **{=size}**. How many
      times is a Series-to-Series [[pandas-udf]] called on this partition?
    answer: { var: calls, tol: 0 }
    hints:
      - Each call gets one [[batch]] of at most {=size} rows.
      - Divide, then round **up** for the leftover rows.
    explanation: 'The batch sizes are {=sizesText}: $\lceil {=n} / {=size} \rceil = {=calls}$ calls.'

  - id: last-batch-numeric
    type: numeric
    skills: [arrow-transfer]
    difficulty: 2
    tags: [math]
    generator: batchQ
    lessonRef: { tab: math-code, id: arrow-batches }
    prompt: |
      A pandas UDF returns `pd.Series([len(s)] * len(s))`, the size of the [[batch]] it received. The partition has
      **{=n}** rows and batches hold at most **{=size}**. What does it print for the **last** row?
    answer: { var: last, tol: 0 }
    hints:
      - Fill whole batches of {=size} first.
      - The last batch holds whatever is left.
    explanation: 'Batches: {=sizesText}. The last row sits in the last batch, so it prints {=last}.'

  # =====================================================================================
  # Series to Series
  # =====================================================================================
  - id: clip-count-numeric
    type: numeric
    skills: [pandas-series-udf]
    difficulty: 1
    tags: [math]
    generator: clipQ
    lessonRef: { tab: intuition, id: whole-batches }
    prompt: |
      A Series-to-Series [[pandas-udf]] returns `np.clip(s, {=lo}, {=hi})`. One batch holds these values:
      {=values}. How many values does it **change**?
    answer: { var: changed, tol: 0 }
    hints:
      - A value inside the range, bounds included, stays as it is.
      - Count values above {=hi} **and** values below {=lo}.
    explanation: '{=above} values are above {=hi} and {=below} below {=lo}: {=changed} change. The output is {=clipped}.'

  - id: clip-hand
    type: hand-calc
    skills: [pandas-series-udf]
    difficulty: 3
    tags: [math]
    generator: clipQ
    lessonRef: { tab: math-code, id: clip-series }
    prompt: |
      `clip_udf` returns `np.clip(s, {=lo}, {=hi})` on this batch: {=values}. Work through it as the Series does.
    steps:
      - prompt: How many values are above the top bound and become {=hi}?
        answer: { var: above, tol: 0 }
        hint: Strictly above; a value equal to {=hi} stays.
      - prompt: How many values are below the bottom bound and become {=lo}?
        answer: { var: below, tol: 0 }
        hint: Look for negative values.
      - prompt: What is the sum of the clipped Series?
        answer: { var: sumOut, tol: 0.01 }
        hint: Replace each value outside the range by its bound, then add.
        misconceptions:
          - { var: sumIn, feedback: 'That is the sum before clipping.' }
          - { var: sumHighOnly, feedback: 'You lowered the big values but left the negative ones. They rise to {=lo}.' }
    hints:
      - '`np.clip(x, lo, hi)` is `min(max(x, lo), hi)` for each value.'
    explanation: 'Clipped: {=clipped}. Its sum is {=sumOut}; before clipping it was {=sumIn}.'

  - id: udf-kind-match
    type: match
    skills: [pandas-series-udf, iterator-udf, grouped-pandas]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: intuition, id: iterators }
    prompt: Match each pandas UDF signature to what Spark does with it.
    pairs:
      - ['`def f(s: pd.Series) -> pd.Series`', 'called once per batch; returns one value per row']
      - ['`def f(it: Iterator[pd.Series]) -> Iterator[pd.Series]`', 'called once; loops over the batches and yields a Series for each']
      - ['`def f(it: Iterator[Tuple[pd.Series, pd.Series]]) -> Iterator[pd.Series]`', 'called once; each batch brings two columns together']
      - ['`def f(v: pd.Series) -> float`', 'one number per group, used inside agg']
    hints: ['Read the [[type-hint|type hints]] after each parameter and after `->`.']
    explanation: 'The [[type-hint|type hints]] decide the kind: Series to Series, [[iterator]] of Series, iterator of tuples, or Series to scalar (an [[aggregation]]).'

  # =====================================================================================
  # Iterators
  # =====================================================================================
  - id: hash-numeric
    type: numeric
    skills: [iterator-udf]
    difficulty: 1
    tags: [math]
    generator: hashQ
    lessonRef: { tab: intuition, id: iterators }
    prompt: |
      An [[iterator]] UDF reads `a = {=a}`, `b = {=b}`, `c = {=c}` once, then yields `(a * x + b) % c` for every
      batch. What does it give for the id `x = {=x}`?
    answer: { var: h, tol: 0 }
    hints:
      - First $a \cdot x$, then add $b$.
      - '`%` keeps the remainder after dividing by {=c}.'
    explanation: '${=a} \times {=x} + {=b} = {=axb}$, and ${=axb} = {=quotient} \times {=c} + {=h}$, so the result is **{=h}**.'

  - id: hash-hand
    type: hand-calc
    skills: [iterator-udf]
    difficulty: 2
    tags: [math]
    generator: hashQ
    lessonRef: { tab: math-code, id: iterator-hash }
    prompt: 'Work out `(a * x + b) % c` for a = {=a}, b = {=b}, c = {=c} and x = {=x}, one step at a time.'
    steps:
      - prompt: '$a \cdot x$'
        answer: { var: ax, tol: 0 }
        hint: Multiply.
      - prompt: '$a \cdot x + b$'
        answer: { var: axb, tol: 0 }
        hint: Add b to the last result.
      - prompt: 'The remainder after dividing by c'
        answer: { var: h, tol: 0 }
        hint: How much is left after taking away as many whole c's as fit?
        misconceptions:
          - { var: quotient, feedback: 'That is how many times {=c} fits. `%` keeps what is left over.' }
          - { var: noB, feedback: 'That is $(a \cdot x) \% c$, without b.' }
    hints: ['Keep the order of the brackets: multiply, add, then take the remainder.']
    explanation: '${=a} \times {=x} = {=ax}$; $+ {=b} = {=axb}$; ${=axb} \bmod {=c} = {=h}$.'

  - id: yield-find-error
    type: find-error
    code: true
    skills: [iterator-udf]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: intuition, id: iterators }
    prompt: 'This iterator UDF, decorated with `@pandas_udf(''long'')`, fails with `UDF_RETURN_TYPE ... should be iterator of pandas.Series, but is Series`. Click the line that causes it.'
    steps:
      - 'def mask_bad(ids: Iterator[pd.Series]) -> Iterator[pd.Series]:'
      - '    a, b, c = 193602, 15914, 1000'
      - '    for x in ids:'
      - '        return (a * x + b) % c'
    wrong: 3
    stepFeedback:
      '0': 'These hints are exactly right for an iterator UDF.'
      '1': 'Setup before the loop runs once; that is the point of the iterator kind.'
      '2': 'Looping over the batches is right.'
    hints: ['What must an iterator UDF hand back for each batch?']
    explanation: '`return` ends the function after the first batch and hands back one Series, not an iterator. Write `yield (a * x + b) % c`.'

  - id: fare-rate-numeric
    type: numeric
    skills: [iterator-udf]
    difficulty: 1
    tags: [math]
    generator: fareRateQ
    lessonRef: { tab: math-code, id: iterator-hash }
    prompt: |
      `fare_rate` loops `for trip_distance, fare_amount in iterator:` and yields `fare_amount / trip_distance`. A
      trip is **{=d}** miles long with a fare of **{=f}** dollars. What does it yield for this trip? Give two decimal
      places.
    answer: { var: rate, tol: 0.006 }
    hints:
      - Dollars per mile.
      - Divide the fare by the distance.
    explanation: '${=f} / {=d} = {=rate|2}$ dollars per mile.'

  # =====================================================================================
  # Series to scalar and applyInPandas
  # =====================================================================================
  - id: group-mean-numeric
    type: numeric
    skills: [grouped-pandas]
    difficulty: 1
    tags: [math]
    generator: groupMeanQ
    lessonRef: { tab: intuition, id: one-per-group }
    prompt: |
      `tweets.groupby('country_code').agg(mean_udf(tweets.statuses_count))` runs on these tweets, where
      `mean_udf` returns `v.mean()`. What does it print for **{=target}**? Give two decimal places.

      {=table}
    answer: { var: mean, tol: 0.006 }
    hints:
      - The function receives only the {=target} rows as one Series.
      - Add them up and divide by how many there are.
    explanation: '{=target}: $({=values}) / {=k} = {=mean|2}$.'

  - id: norm-fare-numeric
    type: numeric
    skills: [grouped-pandas]
    difficulty: 3
    tags: [math]
    generator: normFareQ
    lessonRef: { tab: math-code, id: group-mean }
    prompt: |
      `trips.groupby('VendorID').applyInPandas(standardize_fares, ...)` divides each fare by
      `s['fare_amount'].max()`. What is `normed_fare` for **trip {=trip}**? Give two decimal places.

      {=table}
    answer: { var: normed, tol: 0.006 }
    hints:
      - '[[apply-in-pandas]] hands the function one vendor''s rows at a time.'
      - Find vendor {=vendor}'s highest fare first.
    explanation: 'Vendor {=vendor}''s highest fare is {=max}, so ${=fareT} / {=max} = {=normed|2}$.'

  - id: agg-two-tier
    type: two-tier
    skills: [grouped-pandas]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: intuition, id: one-per-group }
    prompt: '`trips.groupby(''VendorID'').agg(clip_0_to_100(trips.trip_distance))` fails. Which UDF kind belongs in `agg` instead?'
    options:
      - 'A Series-to-scalar UDF, such as `def f(v: pd.Series) -> float`'
      - 'Another Series-to-Series UDF with a different return type'
      - 'Any `@udf`, because a plain UDF works per group'
    answer: 0
    reasons:
      - '`agg` needs one value per group, and only a Series-to-scalar UDF returns one value for many'
      - '`agg` needs a float return type'
      - '`agg` needs one value per row, which a Series-to-Series UDF cannot give'
    reasonAnswer: 0
    optionFeedback:
      '1': 'The type is not the problem. A Series-to-Series UDF returns one value **per row**, and the real run fails with `MISSING_AGGREGATION`.'
      '2': 'A plain UDF is row-at-a-time too, so it gives no single value for a group.'
    reasonFeedback:
      '1': 'A Series-to-scalar UDF declared `''double''` works; what matters is one value per group.'
      '2': 'It is the other way round: `agg` makes one value per group.'
    hints: ['How many values does `agg` keep for each vendor?']
    explanation: 'An [[aggregation]] squeezes each group into one value. `mean_udf` (Series to scalar) does that; `clip_0_to_100` returns a value per row, so Spark reports `MISSING_AGGREGATION`.'

  # =====================================================================================
  # Temporary views and spark.sql
  # =====================================================================================
  - id: where-count-numeric
    type: numeric
    skills: [temp-view-sql]
    difficulty: 1
    tags: [math]
    generator: whereQ
    lessonRef: { tab: intuition, id: tables-by-name }
    prompt: |
      A [[temp-view]] `rides` holds these fares: {=fares}. How many rows does
      `spark.sql("SELECT * FROM rides WHERE fare_amount > {=x}")` return?
    answer: { var: kept, tol: 0 }
    hints:
      - Test each fare on its own.
      - '`>` is strict.'
    explanation: '{=kept} fares are greater than {=x}. A fare equal to {=x} fails the test.'

  - id: view-order
    type: order
    skills: [temp-view-sql]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: sql-where }
    prompt: Put the steps for answering a question about `trips` with SQL in order.
    items:
      - "Read the file: `trips = spark.read.csv('taxi12.csv', header=True, inferSchema=True)`"
      - "Give it a name SQL can see: `trips.createOrReplaceTempView('trips')`"
      - 'Write the statement: `q = spark.sql("SELECT PULocationID FROM trips WHERE fare_amount > 20")`'
      - 'Run an action on the DataFrame it returns: `q.show()`'
    hints: ['SQL can only name tables that already have a view.']
    explanation: '`spark.sql` returns a [[dataframe]], so `show()` (an action) comes last; the [[temp-view]] must exist before the statement names it.'

  - id: view-mcq
    type: mcq
    skills: [temp-view-sql]
