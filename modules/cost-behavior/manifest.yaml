title: Cost Behavior and Cost Estimation
shortTitle: Behavior
summary: |
  See how a cost responds when activity changes, classify costs as variable, fixed, mixed or step, and estimate a cost
  formula y = a + bx from monthly data with the high-low and scattergraph methods.
