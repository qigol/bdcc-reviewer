objectives:
  - id: classify-behavior
    text: Classify a cost as variable, fixed, mixed or step, and explain what happens to its total and its cost per unit when volume changes.
    skills: [behavior-patterns, unit-behavior]
  - id: range-and-types
    text: Explain why a fixed cost is fixed only within a relevant range, and tell committed from discretionary fixed costs when a budget must be cut.
    skills: [relevant-range, fixed-types]
  - id: high-low
    text: Separate a mixed cost into its fixed and variable parts with the high-low method, choosing the points by activity, and predict cost at a new activity level.
    skills: [high-low, cost-formula]
  - id: scattergraph
    text: Read a fixed cost and a variable rate off a line fitted by eye to a scattergraph, and spot an outlier before it distorts a formula.
    skills: [scattergraph, outliers]
  - id: compare-and-decide
    text: Compare the two methods, budget with a cost formula, and cost one special order by its incremental cost only.
    skills: [compare-methods, incremental]
skills:
  - id: behavior-patterns
    label: Variable, fixed, mixed and step costs
    description: The four cost behavior patterns and how to classify a cost by what its total does.
  - id: unit-behavior
    label: Total cost against cost per unit
    description: Fixed cost per unit falls as volume rises; variable cost per unit stays the same.
  - id: relevant-range
    label: The relevant range
    description: Why fixed and variable are true only inside a range of activity, and the danger of extrapolating.
  - id: fixed-types
    label: Committed and discretionary fixed costs
    description: Which fixed costs can be cut quickly and which cannot.
  - id: cost-formula
    label: The cost formula y = a + bx
    description: Fixed component, variable rate, prediction and budgeting.
  - id: high-low
    label: The high-low method
    description: Pick the highest and lowest activity, then find b and a.
  - id: scattergraph
    label: The scattergraph method
    description: Plot all points, fit a line by eye, read the intercept and the slope.
  - id: compare-methods
    label: Comparing the methods
    description: Why the methods disagree, which to trust and when.
  - id: incremental
    label: Incremental cost of an order
    description: Only the cost that changes with a decision is relevant to it.
  - id: outliers
    label: Outliers and high-low
    description: How one abnormal month distorts the high-low formula, and why to plot first.
