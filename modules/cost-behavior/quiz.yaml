    prompt: Fill in the blanks about the cost formula y = a + bx.
    code: |
      In y = a + bx, **a** is the __BLANK_1__ cost, **b** is the __BLANK_2__ cost per unit of activity, and **x** is the level of __BLANK_3__.
      The formula only holds inside the __BLANK_4__ range.
    blanks:
      '1': { accept: [fixed, total fixed, fixed cost], hint: 'f…' }
      '2': { accept: [variable, variable rate], hint: 'v…' }
      '3': { accept: [activity, the activity, cost driver activity, output], hint: 'a…' }
      '4': { accept: [relevant], hint: 'r…' }
    hints: [The intercept is what you'd pay at zero activity.]
    explanation: a = total fixed cost (the intercept), b = variable cost per unit of activity (the slope), x = activity. Outside the relevant range a and b can change.

  - id: highlow-case
    type: case
    skills: [high-low, cost-formula, relevant-range]
    difficulty: 3
    tags: [math]
    generator: highLowQ
    lessonRef: { tab: intuition, id: high-low-walk }
    prompt: |
      **Five months of a mixed cost.** The table shows the cost and its activity. Work out the cost formula with the high-low
      method and use it.
    show:
      - { id: tbl, widget: Matrix, props: { data: '@table', format: int, rowHeader: Month } }
    parts:
      - type: two-tier
        prompt: Which two months do you use?
        options: ['The months with the highest and lowest **activity**', 'The months with the highest and lowest **cost**', 'The first and last months']
        answer: 0
        reasons:
          - Activity drives the cost, so the line is pinned at the extremes of the driver
          - The highest and lowest costs show the biggest spread
          - Time order shows the trend
        reasonAnswer: 0
        reasonFeedback:
          1: The cost extremes can sit in months whose activity isn't extreme (a one-off bill), and that skews b.
          2: High-low is about how cost moves with activity, not with time.
        explanation: High point {=hiLabel} ({=hiX|comma} units), low point {=loLabel} ({=loX|comma} units).
      - type: numeric
        prompt: Variable rate b (₱ per unit of activity)
        answer: { var: b, tol: 0.01 }
        misconceptions:
          - { var: wrongB, feedback: 'That uses the highest and lowest **cost**. Choose the highest and lowest **activity**.' }
        explanation: 'b = {=dy|comma} ÷ {=dx|comma} = {=b|2f}.'
      - type: numeric
        prompt: Fixed cost a (₱)
        answer: { var: a, tol: 0.5 }
        misconceptions:
          - { var: wrongFixedLow, feedback: "That is the low point's total cost. Take away b × activity first." }
        explanation: 'a = {=loY|comma} − {=b|2f} × {=loX|comma} = {=a|comma}.'
      - type: numeric
        prompt: Predicted cost at {=predictAt|comma} units (₱)
        answer: { var: predicted, tol: 0.5 }
        misconceptions:
          - { var: wrongNoA, feedback: 'You left out the fixed cost. y′ = a + bx.' }
        explanation: 'y′ = {=a|comma} + {=b|2f} × {=predictAt|comma} = {=predicted|comma}.'
    hints:
      - Pick the points by activity, then slope = change in cost ÷ change in activity.
      - Fixed cost = total cost at either point − b × that point's activity.
    explanation: Cost formula y = {=a|comma} + {=b|2f}x, so at {=predictAt|comma} units the cost is about {=predicted|comma}.

