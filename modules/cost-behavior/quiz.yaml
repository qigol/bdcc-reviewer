  - id: fixed-unit-two-tier
    type: two-tier
    skills: [unit-behavior, behavior-patterns]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: total-vs-unit }
    prompt: A bakery's oven lease is a fixed ₱30,000 a month. Next month it bakes twice as many loaves, still within its relevant range. What happens to the lease cost **per loaf**?
    options: [It halves, It stays the same, It doubles]
    answer: 0
    reasons:
      - The same total is spread over twice as many units
      - Fixed costs are fixed per unit
      - Total cost rises with volume, so cost per unit rises too
      - The lease is renegotiated whenever volume changes
    reasonAnswer: 0
    optionFeedback:
      1: Per-unit cost stays the same for **variable** costs. A fixed total spread over more units gets smaller per unit.
      2: Doubling per unit would mean total lease cost quadrupled. The total stays ₱30,000.
    reasonFeedback:
      1: This is the classic mix-up. Fixed costs are fixed **in total**; per unit they fall as volume rises.
      2: The lease total doesn't rise with volume inside the relevant range.
      3: Within the relevant range the commitment doesn't change. That's what makes it fixed.
    hints: ["Divide the same ₱30,000 by more loaves."]
    explanation: Fixed in total means variable per unit. ₱30,000 ÷ 2× the loaves = half the cost per loaf. Variable costs behave the other way round.

  - id: formula-cloze
    type: code-fill
    lang: text
    skills: [cost-formula]
    difficulty: 1
    tags: [term]
