templates:
  # ------------------------------------------------------------------ patterns of cost behavior
  - id: classify-mcq
    type: mcq
    skills: [behavior-patterns]
    difficulty: 1
    tags: [term]
    generator: behaviorClassQ
    lessonRef: { tab: intuition, id: four-patterns }
    prompt: |
      How does this cost behave as production volume changes?

      **{=item}**
    hints:
      - Ask what happens to the total when volume doubles, and whether it ever drops to zero.
    explanation: 'The cost is a **{=kindName}** cost. Check two things: does the total move with activity, and is there a fixed part that is paid even at zero activity?'

  - id: patterns-match
    type: match
    skills: [behavior-patterns]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: four-patterns }
    prompt: Match each cost pattern to its picture in words.
    pairs:
      - ['Variable cost', 'A straight line from the origin']
      - ['Fixed cost', 'A flat, horizontal line']
      - ['Mixed cost', 'A rising line that starts above zero']
      - ['Step cost', 'A staircase: flat, then a jump']
    explanation: Variable cost starts at zero and climbs in proportion; fixed cost is flat; mixed cost climbs from a fixed starting amount; step cost is flat until a limit forces a jump.

  - id: step-vs-mixed-mcq
    type: mcq
    skills: [behavior-patterns]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: four-patterns }
    prompt: A plant hires one extra supervisor for every 15 workers it adds. Which pattern is this, and why?
    options:
      - Step cost, because the cost stays flat and then jumps each time a threshold is crossed
      - Mixed cost, because it has a fixed part and a variable part
      - Variable cost, because it rises as workers are added
      - Fixed cost, because a supervisor's salary is a fixed amount
    answer: 0
    optionFeedback:
      1: "A mixed cost rises smoothly from a fixed base; this one stays flat and then jumps."
      2: "A variable cost rises with every worker; this one jumps only every 15 workers."
      3: "Each salary is fixed, but the number of supervisors grows in steps, so the total is a step cost."
    hints:
      - Picture the total on a graph. Is it a smooth line or a staircase?
    explanation: The supervisor cost is constant for a while and then jumps by one salary at a threshold. That is a staircase, which is a step cost. A mixed cost rises smoothly and a variable cost starts at zero.
    variants:
      - prompt: A call center's phone bill is ₱5,000 a month plus ₱2 per minute of calls. Which pattern is this, and why?
        options:
          - Mixed cost, because it has a fixed part and a part that rises with use
          - Step cost, because it jumps at thresholds
          - Variable cost, because it rises with minutes
          - Fixed cost, because a bill comes every month
        answer: 0
        optionFeedback:
          1: Nothing jumps here; the bill rises smoothly by ₱2 a minute.
          2: A purely variable cost would start at zero; this one has a ₱5,000 base.
          3: The minute charge makes part of it vary.
        explanation: A fixed base plus a smooth per-unit charge is a mixed cost.
      - prompt: A factory pays each machine operator ₱90 for every unit they assemble, and nothing else. Which pattern is this, and why?
        options:
          - Variable cost, because the total rises in direct proportion to units and starts at zero
          - Mixed cost, because wages are paid monthly
          - Step cost, because operators are added one at a time
          - Fixed cost, because the rate per unit doesn't change
        answer: 0
        optionFeedback:
          1: There's no fixed part; with zero units the cost is zero.
          2: Pay is per unit, not per operator hired.
          3: A constant rate per unit is exactly what makes the total variable.
        explanation: Constant per unit and proportional in total is a variable cost.

  - id: patterns-order
    type: order
    skills: [behavior-patterns, relevant-range]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: four-patterns }
    prompt: Put these costs in order from the one that changes LEAST with volume to the one that changes MOST, for a factory making more units.
    items:
      - Straight-line depreciation on the building (fixed)
      - A supervisor hired for every 15 extra workers (step)
      - Electric power with a base charge and a per-kWh charge (mixed)
      - Leather used per pair of shoes (variable)
    explanation: Fixed cost does not move at all, a step cost moves in occasional jumps, a mixed cost moves smoothly from a fixed starting point, and a variable cost moves in full proportion.

  # ------------------------------------------------------------------ total versus per unit
  - id: unit-fixed-numeric
    type: numeric
    skills: [unit-behavior]
    difficulty: 1
    tags: [math]
    generator: unitQ
    lessonRef: { tab: math-code, id: unit-cost }
    prompt: |
      A factory pays {=total|money} a month in fixed depreciation. At {=v1|comma} units a month the cost per unit is
      {=unit1|money2}. If output rises to {=v2|comma} units, what is the depreciation cost per unit?
    answer: { var: unit2, tol: 0.01 }
    hints:
      - Depreciation is a fixed cost. What happens to its total when output rises?
      - Divide the total by the new number of units.
    explanation: 'The total stays {=total|money}. Per unit $= {=total|comma} \div {=v2|comma} = {=unit2|money2}$, lower than {=unit1|money2} because more units share the same cost.'

  - id: unit-fixed-fill
    type: schedule-fill
    skills: [unit-behavior]
    difficulty: 1
    tags: [journal]
    generator: unitQ
    lessonRef: { tab: math-code, id: unit-cost }
    prompt: |
      Complete the schedule for a fixed cost of {=total|money} a month at two production levels.
    columns: [Total cost, Cost per unit]
    rows:
      - { label: 'Low volume', amounts: ['@total', '@unit1'], blank: true }
      - { label: 'High volume', amounts: ['@total', '@unit2'], blank: true }
    hints:
      - Total fixed cost is the same at both volumes.
      - Cost per unit is the total divided by that volume's units.
    explanation: 'Both totals are {=total|money}. Per unit: {=total|comma} ÷ {=v1|comma} = {=unit1|money2} and {=total|comma} ÷ {=v2|comma} = {=unit2|money2}.'

  - id: variable-unit-numeric
    type: numeric
    skills: [unit-behavior, behavior-patterns]
    difficulty: 2
    tags: [math]
    generator: variableQ
    lessonRef: { tab: intuition, id: total-vs-unit }
    prompt: |
      A variable cost totals {=total1|money} when {=v1|comma} units are made. What does the cost per unit come to when
      {=v2|comma} units are made?
    answer: { var: rate, tol: 0.01 }
    hints:
      - Does the cost per unit of a variable cost change with volume?
      - Divide the total by the volume it belongs to.
    explanation: 'A variable cost has the same cost per unit at every volume: ${=total1|comma} \div {=v1|comma} = {=rate|money2}$. At {=v2|comma} units the total becomes {=total2|money}, but the unit cost stays {=rate|money2}.'

  - id: total-vs-unit-multi
    type: multi
    skills: [unit-behavior]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: total-vs-unit }
    prompt: Volume doubles within the relevant range. Which statements are true? Select all that apply.
    options:
      - Total variable cost doubles
      - Variable cost per unit stays the same
      - Total fixed cost doubles
      - Fixed cost per unit is cut in half
      - Fixed cost per unit stays the same
    answer: [0, 1, 3]
    optionFeedback:
      0: "Yes: twice the units means twice the total variable cost."
      1: "Yes: the rate per unit doesn't change."
      2: "Total fixed cost stays the same within the range."
      3: "Yes: the same total is spread over twice the units."
      4: "Fixed cost per unit falls as volume rises."
    hints:
      - Treat total and per-unit separately for each kind of cost.
    explanation: A variable cost moves with volume in total but is constant per unit. A fixed cost is constant in total, so its per-unit amount falls as more units share it.

  # ------------------------------------------------------------------ relevant range
  - id: range-mcq
    type: mcq
    skills: [relevant-range]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: range-and-commitment }
    prompt: A cost formula was built from months where the plant ran 8,000 to 15,000 machine hours. Management wants to use it to budget a month at 22,000 hours. What is the best advice?
    options:
      - Do not rely on it; 22,000 hours is outside the relevant range the formula came from
      - Use it; a high R² means any volume is safe
      - Use it, but halve the variable rate to be conservative
      - Use it; fixed costs never change
    answer: 0
    optionFeedback:
      1: "R² describes the fit inside the data's range; it says nothing about 22,000 hours."
      2: "Halving the rate is arbitrary. The formula simply wasn't built for that volume."
      3: "Fixed costs can step up at new volumes, for example a second shift."
    hints:
      - What range of volumes did the data cover?
    explanation: A cost formula holds only inside the range of activity it was estimated from. At 22,000 hours the plant may need a second shift or new equipment, which changes the fixed and variable parts.

  - id: range-multi
    type: multi
    skills: [relevant-range]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: range-and-commitment }
    prompt: Which statements about the relevant range are true? Select all that apply.
    options:
      - A fixed cost is fixed only within the relevant range
      - Cost classifications are made for a particular relevant range
      - A cost formula may be used at any volume if it fits the data well
      - Beyond the range a new fixed-cost level, a step, is often needed
    answer: [0, 1, 3]
    optionFeedback:
      0: "Yes: outside the range, fixed costs can step up or down."
      1: "Yes: a classification holds for a stated range."
      2: "A good fit inside the range says nothing about volumes outside it."
      3: "Yes: more capacity usually means a new fixed-cost level."
    hints:
      - Think of what has to hold true for a cost to stay fixed.
    explanation: Fixed and variable are always meant within a range of activity. Using a formula far outside the range it came from is one of the most common errors in cost estimation.

  - id: long-run-mcq
    type: mcq
    skills: [relevant-range, behavior-patterns]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: range-and-commitment }
    prompt: 'The quotation "strictly speaking, there is no such thing as a fixed cost; in the long run all costs are variable" makes which point?'
    options:
      - Fixed means fixed only for a time horizon and a range of volume, not forever
      - Fixed costs should always be treated as variable in budgets
      - Variable costs are really fixed costs in disguise
      - Cost classification does not matter in the long run
    answer: 0
    optionFeedback:
      1: "For the planning horizon, fixed costs are still treated as fixed."
      2: "The quote is about time horizons, not about variable costs being fixed."
      3: "Classification matters for each horizon and range; the quote says it isn't permanent."
    hints:
      - Think about what ends or changes, such as a lease, a salary or a depreciation schedule.
    explanation: A lease ends, a supervisor can be hired or let go, and depreciation stops once the asset is used up. Fixed describes behavior over the horizon and range we are planning for.

  # ------------------------------------------------------------------ committed and discretionary
  - id: commit-mcq
    type: mcq
    skills: [fixed-types]
    difficulty: 1
    tags: [term]
    generator: commitQ
    lessonRef: { tab: intuition, id: range-and-commitment }
    prompt: |
      Is this fixed cost committed or discretionary?

      **{=item}**
    hints:
      - Was it locked in by a past decision, or does management choose the amount each year?
    explanation: 'It is a **{=kindName}**. Committed costs come from long-term commitments such as leases and equipment; discretionary costs are set by annual management decisions.'

  - id: commit-match
    type: match
    skills: [fixed-types]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: range-and-commitment }
    prompt: Match each cost to the kind of fixed cost it is.
    pairs:
      - ['Rent on a long-term factory lease', 'Committed']
      - ['Depreciation on owned machinery', 'Committed']
      - ['Annual advertising budget', 'Discretionary']
      - ['Employee training program', 'Discretionary']
    explanation: Leases and equipment are past commitments that are hard to undo. Advertising and training are chosen each year and can be changed quickly.

  - id: cut-mcq
    type: mcq
    skills: [fixed-types]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: range-and-commitment }
    prompt: Revenue disappoints and the budget must be cut quickly without breaking contracts. Which cost does management usually look at first, and what is the risk?
    options:
      - Discretionary costs such as training; cutting too much can hurt long-term competitiveness
      - Committed costs such as the lease; cutting them is free and fast
      - Variable costs only; fixed costs cannot be touched
      - Depreciation; stopping it increases real cash
    answer: 0
    optionFeedback:
      1: "Cutting committed costs usually means breaking contracts, so it's neither free nor fast."
      2: "Discretionary fixed costs can be cut within a year."
      3: "Depreciation is a non-cash expense; stopping it doesn't create cash."
    hints:
      - Which fixed costs can be changed without a penalty?
    explanation: Discretionary costs can be adjusted within a year. Committed costs usually mean breaking contracts or abandoning capacity. But gutting training or research for short-term profit can damage the business later.
    variants:
      - prompt: A hotel needs to free up cash this month without breaking any contract. Which cost is it most able to reduce quickly?
        options:
          - Discretionary costs such as advertising and staff training
          - The building lease
          - Depreciation on its rooms
          - Its long-term loan payments
        answer: 0
        optionFeedback:
          1: A lease is a committed cost; cutting it means breaking a contract.
          2: Depreciation isn't a cash payment, so cutting it frees no cash.
          3: Loan payments are contractual commitments.
        explanation: Discretionary fixed costs can be adjusted within the year, though cutting too deep can hurt later.
      - prompt: Which of these is a **committed** fixed cost for a trucking company?
        options:
          - Depreciation on its trucks
          - Its sponsorship of a basketball league this season
          - Next quarter's driver training budget
          - Its annual advertising campaign
        answer: 0
        optionFeedback:
          1: Sponsorship is decided each season, so it's discretionary.
          2: Training budgets are set each period, so they're discretionary.
          3: Advertising budgets are discretionary.
        explanation: Committed costs come from long-term decisions about capacity, such as owning trucks.

  # ------------------------------------------------------------------ the cost formula
  - id: formula-numeric
    type: numeric
    skills: [cost-formula]
    difficulty: 1
    tags: [math]
    generator: formulaQ
    lessonRef: { tab: math-code, id: cost-formula }
    prompt: |
      A mixed cost has a fixed part of {=a|money} and a variable rate of {=b|money2} per unit of activity. What total
      cost does the formula $y' = a + bx$ estimate at {=x|comma} units?
    answer: { var: y, tol: 0.01 }
    hints:
      - The variable part is rate times activity.
      - Add the fixed part once.
    explanation: 'Variable part $= {=b|2f} \times {=x|comma} = {=varPart|money}$. Total $y\prime = {=a|comma} + {=varPart|comma} = {=y|money}$.'

  - id: formula-fill
    type: schedule-fill
    skills: [cost-formula]
    difficulty: 1
    tags: [journal]
    generator: formulaQ
    lessonRef: { tab: math-code, id: cost-formula }
    prompt: |
      Complete the estimate. The fixed cost is {=a|money}, the variable rate is {=b|money2} per unit and activity is
      {=x|comma} units.
    rows:
      - { label: Fixed cost component, amount: '@a' }
      - { label: Variable cost, amount: '@varPart', blank: true }
      - { label: Estimated total cost, amount: '@y', style: total, blank: true }
    hints:
      - Variable cost = rate × activity.
    explanation: 'Variable cost $= {=b|2f} \times {=x|comma} = {=varPart|money}$ and the total is {=a|comma} + {=varPart|comma} = {=y|money}.'

  - id: formula-perunit-numeric
    type: numeric
    skills: [cost-formula, unit-behavior]
    difficulty: 2
    tags: [math]
    generator: formulaQ
    lessonRef: { tab: math-code, id: cost-formula }
    prompt: |
      A mixed cost follows $y' = {=a|comma} + {=b|2f}x$. What is the estimated **average cost per unit** at {=x|comma}
      units?
    answer: { var: perUnit, tol: 0.01 }
    hints:
      - First find the estimated total cost.
      - Then divide by the number of units.
    explanation: 'Total $= {=a|comma} + {=b|2f} \times {=x|comma} = {=y|money}$; per unit $= {=y|comma} \div {=x|comma} = {=perUnit|money2}$. The fixed part is spread over the units, so the average is above the variable rate.'

  - id: formula-meaning-mcq
    type: mcq
    skills: [cost-formula]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: cost-formula }
    prompt: In the cost formula y = a + bx, what do a and b stand for?
    options:
      - a is the fixed cost component and b is the variable cost per unit of activity
      - a is the variable cost per unit and b is the fixed cost
      - a is the total cost and b is the activity level
      - a is the activity level and b is the profit
    answer: 0
    optionFeedback:
      1: "Swapped: b multiplies the activity, so b is the rate per unit."
      2: "y is the total cost and x the activity level."
      3: "The formula describes cost, not profit."
    hints:
      - Which of the two is multiplied by activity x?
    explanation: b multiplies the activity level, so it is the rate per unit. a is added once, at any level of activity, so it is the fixed part.

  - id: budget-numeric
    type: numeric
    skills: [cost-formula]
    difficulty: 2
    tags: [application]
    generator: formulaQ
    lessonRef: { tab: math-code, id: cost-formula }
    prompt: |
      Last year's data gave the overhead formula $y' = {=a|comma} + {=b|2f}x$ where x is direct labor hours. Next month
      the plant expects {=x|comma} hours. What overhead should go into the budget?
    answer: { var: y, tol: 0.01 }
    hints:
      - Plug the forecast activity into the formula.
    explanation: 'Budgeted overhead $= {=a|comma} + {=b|2f} \times {=x|comma} = {=y|money}$.'

  # ------------------------------------------------------------------ high-low
  - id: highlow-handcalc
    type: hand-calc
    skills: [high-low, cost-formula]
    difficulty: 2
    tags: [math]
    generator: highLowQ
    lessonRef: { tab: math-code, id: high-low }
    prompt: |
      The table shows a mixed cost and its activity for several months. Use the high-low method, then predict the cost
      at {=predictAt|comma} units of activity.
    show:
      - { id: tbl, widget: Matrix, props: { data: '@table', format: int, rowHeader: Month } }
    steps:
      - prompt: Variable rate b (cost per unit of activity)
        answer: { var: b, tol: 0.01 }
        misconceptions:
          - { var: wrongB, feedback: 'That uses the highest and lowest **cost**. Choose the highest and lowest **activity**.' }
        hint: Divide the change in cost by the change in activity between the highest-activity and lowest-activity months.
      - prompt: Fixed cost a
        answer: { var: a, tol: 0.5 }
        misconceptions:
          - { var: wrongFixedLow, feedback: 'That is the low point''s total cost. Take away b × activity first.' }
        hint: Total cost at either point minus b × activity at that point.
      - prompt: Predicted cost at the activity level above
        answer: { var: predicted, tol: 0.5 }
        misconceptions:
          - { var: wrongNoA, feedback: 'You left out the fixed cost. y′ = a + bx.' }
        hint: a + b × the new activity.
    hints:
      - Find the months with the highest and lowest activity first, not cost.
    explanation: |
      High = {=hiLabel} ({=hiX|comma} units, {=hiY|money}); low = {=loLabel} ({=loX|comma}, {=loY|money}).
      $b = {=dy|comma} \div {=dx|comma} = {=b|2f}$; $a = {=hiY|comma} - {=b|2f} \times {=hiX|comma} = {=a|money}$;
      $y' = {=a|comma} + {=b|2f} \times {=predictAt|comma} = {=predicted|money}$.

  - id: highlow-fill
    type: schedule-fill
    skills: [high-low]
    difficulty: 2
    tags: [journal]
    generator: highLowQ
    lessonRef: { tab: math-code, id: high-low }
    prompt: |
      Complete the high-low worksheet for the table of months. The high point is {=hiLabel} and the low point is
      {=loLabel}.
    show:
      - { id: tbl, widget: Matrix, props: { data: '@table', format: int, rowHeader: Month } }
    rows:
      - { label: 'Activity at the high point', amount: '@hiX', format: number }
      - { label: 'Activity at the low point', amount: '@loX', format: number }
      - { label: 'Difference in activity', amount: '@dx', format: number, blank: true }
      - { label: 'Difference in cost', amount: '@dy', blank: true }
      - { label: 'Variable rate b', amount: '@b', format: number, blank: true }
      - { label: 'Fixed cost a', amount: '@a', style: total, blank: true }
    hints:
      - The two differences come from the high and low rows of the table.
      - b = difference in cost ÷ difference in activity.
    explanation: 'Activity moved {=hiX|comma} − {=loX|comma} = {=dx|comma}; cost moved {=hiY|comma} − {=loY|comma} = {=dy|comma}; b = {=dy|comma} ÷ {=dx|comma} = {=b|2f}; a = {=hiY|comma} − {=b|2f} × {=hiX|comma} = {=a|money}.'

  - id: highlow-pick-mcq
    type: mcq
    skills: [high-low]
    difficulty: 2
    tags: [intuition]
    generator: highLowQ
    lessonRef: { tab: intuition, id: high-low-walk }
    prompt: Which two months does the high-low method use for this data?
    show:
      - { id: tbl, widget: Matrix, props: { data: '@table', format: int, rowHeader: Month } }
    hints:
      - The method looks at activity, not at cost.
    explanation: 'High-low uses the months with the highest and lowest **activity**: {=hiLabel} and {=loLabel}. A month can have a very high cost at only middling activity, and it is skipped.'

  - id: highlow-order
    type: order
    skills: [high-low]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: high-low-walk }
    prompt: Put the steps of the high-low method in order.
    items:
      - Pick the months with the highest and lowest activity
      - Divide the change in cost by the change in activity to get b
      - Subtract b × activity from total cost at either point to get a
      - Write y′ = a + bx and use it to predict
    explanation: The rate comes first because the fixed cost needs it. Once a and b are known, the formula can predict cost at any activity inside the relevant range.

  - id: highlow-limits-mcq
    type: mcq
    skills: [high-low]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: high-low-walk }
    prompt: What is the main weakness of the high-low method?
    options:
      - It uses only two of the data points, and those extremes may be the least typical months
      - It needs a computer and statistical software
      - It cannot produce a fixed cost
      - It only works when cost is purely variable
    answer: 0
    optionFeedback:
      1: "High-low needs only a pencil; that's its appeal."
      2: "It does give a fixed cost: total cost minus b × activity."
      3: "It works for mixed costs; that's what it's for."
    hints:
      - How many of the twelve months did the Flexible Manufacturing example use?
    explanation: The two extremes are often unusual months, and if either is atypical the whole formula shifts. The other months are ignored, and there is no measure of how well the line fits.

  # ------------------------------------------------------------------ scattergraph
  - id: scatter-numeric
    type: numeric
    skills: [scattergraph]
    difficulty: 2
    tags: [math]
    generator: scatterQ
    lessonRef: { tab: math-code, id: scattergraph }
    prompt: |
      A line fitted by eye to a scattergraph crosses the cost axis at {=a|money} and passes through the point
      ({=x|comma} units, {=y|money}). What is the variable rate per unit?
    answer: { var: b, tol: 0.001 }
    hints:
      - The intercept is the fixed cost. Take it away from the cost at the point.
      - Divide what is left by the activity at the point.
    explanation: 'Variable cost at the point $= {=y|comma} - {=a|comma} = {=varPart|money}$. Rate $= {=varPart|comma} \div {=x|comma} = {=b|money2}$.'

  - id: scatter-fill
    type: schedule-fill
    skills: [scattergraph]
    difficulty: 1
    tags: [journal]
    generator: scatterQ
    lessonRef: { tab: math-code, id: scattergraph }
    prompt: |
      Complete the schedule. The fitted line crosses the cost axis at {=a|money} and passes through
      ({=x|comma} units, {=y|money}).
    rows:
      - { label: 'Total cost on the line', amount: '@y' }
      - { label: 'Less: fixed cost (intercept)', amount: '@a', indent: 1 }
      - { label: 'Variable cost at that point', amount: '@varPart', style: subtotal, blank: true }
      - { label: 'Variable rate per unit', amount: '@b', format: number, style: total, blank: true }
    hints:
      - Variable cost = total cost on the line − intercept.
    explanation: 'Variable cost = {=y|comma} − {=a|comma} = {=varPart|money}; rate = {=varPart|comma} ÷ {=x|comma} = {=b|money2}.'

  - id: scatter-handcalc
    type: hand-calc
    skills: [scattergraph, cost-formula]
    difficulty: 2
    tags: [math]
    generator: scatterQ
    lessonRef: { tab: math-code, id: scattergraph }
    prompt: |
      A fitted line crosses the cost axis at {=a|money} and passes through ({=x|comma} units, {=y|money}). Estimate the
      cost at {=x2|comma} units.
    steps:
      - prompt: Variable cost at the point on the line
        answer: { var: varPart, tol: 0.5 }
        hint: Total cost at the point minus the fixed cost.
      - prompt: Variable rate per unit
        answer: { var: b, tol: 0.001 }
        misconceptions:
          - { var: wrongNoSub, feedback: 'You divided total cost by activity. Remove the fixed cost first.' }
        hint: Variable cost divided by activity at the point.
      - prompt: Estimated cost at the new activity level
        answer: { var: pred, tol: 0.5 }
        hint: Fixed cost + rate × new activity.
    hints:
      - The intercept is the fixed cost; the slope is the variable rate.
    explanation: 'Variable cost $= {=y|comma} - {=a|comma} = {=varPart|comma}$; $b = {=varPart|comma} \div {=x|comma} = {=b|2f}$; $y\prime = {=a|comma} + {=b|2f} \times {=x2|comma} = {=pred|money}$.'

