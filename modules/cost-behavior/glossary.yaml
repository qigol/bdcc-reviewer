terms:
  - id: activity-measure
    term: Activity measure
    aka: [activity level, cost driver, volume]
    short: A number that says how busy an operation is, such as units made, machine hours or labor hours. Costs are compared with it.
    long: |
      The chosen measure should be the one most closely tied to the cost being studied. Later sessions call a well-chosen
      measure a cost driver.
    related: [cost-behavior]
    skills: [behavior-patterns]
  - id: cost-behavior
    term: Cost behavior
    short: How the total amount of a cost changes, or stays the same, when the activity measure goes up or down.
    related: [variable-cost, fixed-cost, mixed-cost, step-cost]
    skills: [behavior-patterns]
  - id: fixed-cost
    term: Fixed cost
    short: A cost whose total stays the same as activity changes, so the cost of each unit gets smaller as activity rises.
    long: |
      Fixed means fixed **within the relevant range** and for a limited time. Over a long enough period every cost can change.
    related: [variable-cost, cost-per-unit, relevant-range]
    skills: [behavior-patterns, unit-behavior]
  - id: variable-cost
    term: Variable cost
    short: A cost whose total rises and falls in direct proportion to activity, so the cost of each unit stays the same.
    related: [fixed-cost, cost-per-unit]
    skills: [behavior-patterns, unit-behavior]
  - id: cost-per-unit
    term: Cost per unit
    aka: [unit cost]
    short: A cost's total divided by the number of units of activity. It can change with volume even when the total does not.
    formula: '\text{Cost per unit} = \frac{\text{total cost}}{\text{units of activity}}'
    related: [fixed-cost, variable-cost]
    skills: [unit-behavior]
  - id: mixed-cost
    term: Mixed cost
    aka: [semivariable cost]
    short: A cost that has a fixed part and a variable part. It rises with activity but is never zero, even when activity is zero.
    related: [fixed-cost-component, variable-rate, cost-formula]
    skills: [behavior-patterns]
  - id: step-cost
    term: Step cost
    short: A cost that stays flat over a range of activity, then jumps to a new, higher flat level once a limit is passed.
    related: [fixed-cost, relevant-range]
    skills: [behavior-patterns]
  - id: relevant-range
    term: Relevant range
    short: The span of activity over which a cost's fixed total or variable rate is expected to hold true.
    long: |
      A cost formula built from this year's volumes should be trusted only inside the range of volumes it came from.
      Outside it, capacity limits, new shifts or new equipment change the pattern.
    related: [fixed-cost, cost-formula]
    skills: [relevant-range]
  - id: budget
    term: Budget
    short: A plan that puts numbers on the activity and costs a business expects in a future period.
    related: [discretionary-fixed-cost, cost-formula]
    skills: [fixed-types, cost-formula]
  - id: committed-fixed-cost
    term: Committed fixed cost
    short: A fixed cost that comes from past long-term commitments, such as a lease or equipment, so it cannot be cut quickly.
    related: [discretionary-fixed-cost]
    skills: [fixed-types]
  - id: discretionary-fixed-cost
    term: Discretionary fixed cost
    aka: [managed fixed cost, programmed fixed cost]
    short: A fixed cost that management sets each year, such as advertising or training, so it can be changed quickly.
    related: [committed-fixed-cost, budget]
    skills: [fixed-types]
  - id: cost-formula
    term: Cost formula
    aka: [cost-volume formula, y = a + bx]
    short: An equation that estimates a total cost from the activity level, as a fixed amount plus a rate for each unit.
    formula: "y' = a + bx"
    long: |
      The prime on $y'$ ("y prime") reminds you that the answer is an estimate. Real cost varies around the line.
    related: [fixed-cost-component, variable-rate]
    skills: [cost-formula]
  - id: fixed-cost-component
    term: Fixed cost component
    aka: [intercept, a]
    short: The part of a mixed cost that does not change with activity. It is the value of a in the cost formula.
    related: [variable-rate, cost-formula]
    skills: [cost-formula]
  - id: variable-rate
    term: Variable rate
    aka: [slope, b]
    short: The cost added for each extra unit of activity. It is the value of b in the cost formula.
    related: [fixed-cost-component, cost-formula]
    skills: [cost-formula]
  - id: factory-overhead
    term: Factory overhead
    aka: [overhead, manufacturing overhead]
    short: The costs of running a factory other than materials and the wages of the people who make the product, such as rent and power.
    related: [direct-labor-hour, mixed-cost]
    skills: [high-low]
  - id: direct-labor-hour
    term: Direct labor hour
    aka: [DLH]
    short: One hour of work by a person who makes the product. Factories use these hours to measure how busy a plant is.
    related: [activity-measure, factory-overhead]
    skills: [high-low]
  - id: high-low-method
    term: High-low method
    short: A way to estimate the fixed cost and variable rate from only the month with the most activity and the month with the least.
    related: [cost-formula, scattergraph-method]
    skills: [high-low]
  - id: scattergraph-method
    term: Scattergraph method
    short: A way to estimate the fixed cost and variable rate by plotting every month's cost against activity and drawing a line by eye.
    related: [high-low-method, outlier]
    skills: [scattergraph]
  - id: outlier
    term: Outlier
    short: A data point that sits far away from the pattern of the others, often because of an unusual one-time event.
    related: [scattergraph-method, high-low-method]
    skills: [scattergraph, compare-methods]
  - id: incremental-cost
    term: Incremental cost
    aka: [differential cost]
    short: The extra cost caused by one particular decision. A cost that is the same either way is not incremental.
    related: [fixed-cost, variable-rate]
    skills: [compare-methods]
