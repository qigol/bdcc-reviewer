      - type: numeric
        prompt: The extra cost per job protected (dollars)
        answer: { var: perJob, tol: 0.5 }
        misconceptions:
          - { var: wrongNoJobs, feedback: 'That is the total extra cost. Divide it by the number of jobs.' }
        explanation: '{=buyersPay|comma} ÷ {=jobsProtected} = {=perJob|comma}.'
      - type: two-tier
        prompt: Why do such tariffs often survive even when the cost per job is high?
        options: ['The gains are concentrated in a few producers, while the cost is spread thinly over many buyers', 'Foreign producers pay the whole cost', 'Buyers don''t pay anything extra']
        answer: 0
        reasons:
          - A small group gains a lot and lobbies hard, while each buyer loses only a little
          - Tariffs are paid only by exporters abroad
          - Tariffs lower domestic prices
        reasonAnswer: 0
        reasonFeedback:
          1: Domestic buyers pay through higher prices, as part 1 shows.
          2: Tariffs raise domestic prices.
        explanation: Concentrated benefits and diffuse costs keep protection politically alive.
    hints: [Extra paid = price rise × units; then divide by the jobs.]
    explanation: Buyers pay {=buyersPay|comma} a year, or {=perJob|comma} per job protected.

