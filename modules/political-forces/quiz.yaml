  - id: dumping-two-tier
    type: two-tier
    skills: [trade-barriers]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: dumping-test }
    prompt: A foreign maker sells a product abroad at 105 dollars, below both its home price of 120 dollars and its cost of 110 dollars. Is this dumping?
    options: ['Yes', 'No, because the price is still above zero', 'No, because export prices are never compared with home prices']
    answer: 0
    reasons:
      - Selling abroad below the home-market price or below cost counts as dumping
      - Dumping only means selling at a loss on every unit sold
      - Only governments can dump goods
    reasonAnswer: 0
    optionFeedback:
      1: A positive price can still be below home price and cost.
      2: The home-market price is exactly the comparison the test uses.
    reasonFeedback:
      1: Selling below the home price is enough, even without a loss.
      2: Dumping is done by firms.
    hints: [Compare 105 with the home price and with cost.]
    explanation: 105 is below both the 120 home price and the 110 cost, so it meets the dumping test; countervailing or anti-dumping duties may follow.

  - id: infant-explain
    type: explain
    skills: [govt-role, trade-barriers]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: economic-reasons }
    prompt: Explain the infant-industry argument for protection, and its main weakness.
    model: |
      A young domestic industry may have high costs at first, so lower-cost imports would undercut it before it can grow and
      learn. Temporary protection (tariffs or quotas) lets it reach scale and become competitive, after which protection should
      end. The weakness is that protection is hard to remove: firms shielded from competition may never become efficient, and
      consumers keep paying higher prices.
    checklist:
      - Young firms have high costs before they reach scale
      - Imports would undercut them before they can grow
      - Protection is meant to be temporary
      - In practice it is hard to remove and can keep firms inefficient
    hints: [What is supposed to happen once the industry grows up?]
    explanation: Temporary shelter to grow; the risk is that it becomes permanent.

  - id: tariff-cloze
