intro: |
  Politics reaches every import order: the safety of the shipping route, the structure of border taxes, and rules on
  local content and unfair pricing. This case follows one importer through these policy forces.
case:
  id: bike-importer
  title: A Davao bike shop imports frames
  story: |
    Davao Cycles imports alloy bicycle frames from a supplier in Asia. The shipment sails past regions with maritime
    piracy risk, faces a compound duty at customs, and competes against domestic frame makers lobbying for new trade
    barriers. The owner must evaluate each political force.
  data: [piracy]
  state:
    year: '2022'
  derive:
    - { fn: piracyYear, in: { table: '@piracy', year: '@year' }, out: pa }
  cells:
    - id: route-risk
      title: Is the route safe?
      say: |
        Table 5.1 shows how piracy incidents were spread across regions in 2022. Shipping through a region with active
        incidents means higher insurance and route planning.
      stage:
        - id: risk-r
          widget: Readout
          props:
            items:
              - { label: Africa, value: '@pa.africa' }
              - { label: Asia, value: '@pa.asia' }
              - { label: Latin America and the Caribbean, value: '@pa.latam' }
              - { label: Rest of world, value: '@pa.rest' }
              - { label: Highest-risk region, value: '@pa.topRegion', tone: accent }
      decision:
        prompt: In 2022, which region had the most incidents, and what should the owner do about the route?
        type: mcq
        options: [Asia; buy cargo insurance and check the shipping route, Africa; cancel the order immediately, Latin America; ignore the risk completely, Rest of the world; nothing to do]
        answer: 0
        model: Asia had the highest incident count in 2022. Because the supplier is in Asia, the owner should insure the cargo and verify routing with the carrier rather than ignore the risk.
    - id: border-duty
      title: What kind of tariff applies at customs?
      say: |
        Customs applies a border tax that charges both a percentage of the shipment's invoice value and a fixed fee for
        each physical frame in the container.
      stage:
        - id: duty-schedule
          widget: Schedule
          props:
            title: Customs tariff structure on bicycle frames
            columns: [Assessment basis]
            rows:
              - { label: Value component, amounts: ['Percentage of total invoice value (ad valorem)'] }
              - { label: Unit component, amounts: ['Fixed fee per physical bicycle frame (specific)'] }
      decision:
        prompt: What type of tariff is customs charging, and how does it affect the importer's sourcing choice?
        type: mcq
        options:
          - A compound duty; it taxes both shipment value and unit volume
          - A variable levy; it fluctuates daily with world grain prices
          - A voluntary export restraint; the exporter keeps the tax revenue
          - An import ban; no frames may legally cross the border
        answer: 0
        model: Combining a percentage of value (ad valorem) with a fixed charge per unit (specific) creates a compound duty, raising the landed cost on both expensive and high-volume shipments.
    - id: compare-local
      title: A new local-content rule
      say: |
        Domestic frame makers ask the government to require bicycle assemblers to source a minimum share of their parts
        from factories inside the host country.
      stage:
        - id: local-note
          widget: Text
          props:
            body: |
              Proposed rule: **Every bicycle assembled and sold domestically must use a set share of locally manufactured components.**
      decision:
        prompt: How is this proposed policy classified?
        type: mcq
        options:
          - A local content requirement, which is a nontariff barrier
          - An ad valorem tariff on exports
          - Privatization of the bicycle industry
          - A countervailing duty against foreign buyers
        answer: 0
        model: Forcing firms to use domestically produced goods or services is a local content requirement, one of the main nontariff barriers.
    - id: unfair-price
      title: Unfair pricing and trade remedies
      say: |
        The Asian supplier offers frames at an export price below both its home-market price and its cost of production,
        supported by an export grant from its home government.
      stage:
        - id: dump-schedule
          widget: Schedule
          props:
            title: Supplier pricing and support profile
            columns: [Observation]
            rows:
              - { label: Export price vs. home price and cost, amounts: [Priced below both home-market price and production cost] }
              - { label: Government support abroad, amounts: [Exporter receives a direct state export subsidy] }
      decision:
        prompt: What two unfair-trade concepts apply here, and what border taxes could the importing government impose in response?
        type: open
        model: |
          Selling abroad below home price or production cost is dumping, which can trigger an antidumping duty. Receiving a
          foreign government export grant is a subsidy, which can trigger a countervailing duty to cancel out the unfair help.
          Davao Cycles should not count on the artificially low price lasting.
    - id: policy-view
      title: Whose side is the border on?
      say: |
        The owner hears that the government may also add an import quota on bicycle frames to protect local makers.
        Think about who gains and who loses.
      stage:
        - id: beyond-note
          widget: Callout
          props:
            kind: beyond
            title: Beyond the slides
            body: Real importers also check licences, customs paperwork and rules of origin. The lecture covers only the instruments and motives.
      decision:
        prompt: A quota on bicycle frames is added. Who is most likely to gain and who to lose?
        type: mcq
        options: [Local frame makers gain; importers and cyclists lose, Importers gain; local makers lose, Everyone gains, No one is affected]
        answer: 0
        model: A quota limits supply, so local makers face less competition and can charge more. Importers lose volume and cyclists pay higher prices.
explainBack:
  prompt: |
    Explain to a friend how ad valorem, specific, compound and variable-levy tariffs differ, why a government adds a
    countervailing duty, and what country risk means for an importer.
  rubric:
    - Distinguishes ad valorem (percentage of value), specific (per unit), compound (both) and variable levy (price gap)
    - Links a countervailing duty to canceling out foreign export subsidies
    - Mentions political and physical risks to people, property and cargo
atScale:
  title: In practice
  body: |
    Importers use customs brokers to classify goods, because the duty rule depends on the product code. Cargo insurance and
    route planning handle piracy risk. Companies keep country risk reports from export credit agencies and track trade
    notifications from the World Trade Organization so they hear of new barriers early.
tradeoffs:
  title: Sourcing choices
  columns: [Option, Benefit, Risk]
  rows:
    - [Import from Asia, Lower factory price, 'Piracy, duties that change, dumping or countervailing action']
    - [Buy local, 'No border taxes, shorter supply line', Higher unit price]
    - [Split orders, Spreads political and supply risk, More paperwork]
