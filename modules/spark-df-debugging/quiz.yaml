  - id: debug-chain-hand
    type: hand-calc
    skills: [lazy-eval, select-filter, group-order]
    difficulty: 3
    tags: [code]
    generator: debugChainQ
    lessonRef: { tab: math-code, id: lazy-plan }
    prompt: |
      A classmate runs these five [[cell|cells]] from top to bottom on the {=k} trips below. One column name is
      misspelled. Find where Spark complains, then work out what the fixed notebook prints.
    show:
      - { id: c, widget: Code, props: { source: '@code', lang: python } }
      - { id: t, widget: Text, props: { body: '{=table}' } }
    steps:
      - prompt: Which cell raises the error?
        answer: { var: failAt, tol: 0 }
        misconceptions:
          - { var: typoCell, feedback: 'The misspelling sits in cell {=typoCell}, but `orderBy` only adds a step to the plan. The error waits for the action.' }
          - { var: lastCell, feedback: '`groupBy("name")` looks the name up on its own line, so the error comes before `show()`.' }
        hint: Does the command with the misspelling check names on its own line, or only add a step to the plan?
      - prompt: 'You fix the spelling and run the cells again. How many trips does `kept` hold?'
        answer: { var: nf, tol: 0 }
        misconceptions:
          - { var: otherOp, feedback: 'That is the count with the other operator. `&` (and) needs both tests true; `|` (or) needs one.' }
          - { var: fareOnly, feedback: 'You used only the fare test. The tip test counts too.' }
        hint: 'Test each trip twice (fare above {=x}, tip above 0), then join the two answers with `{=op}` ({=opWord}).'
      - prompt: How many rows does `top.show()` print?
        answer: { var: groups, tol: 0 }
        misconceptions:
          - { var: nf, feedback: 'That is the number of kept trips. `groupBy` + `count` makes one row per zone.' }
      - prompt: Which `PULocationID` is printed in the first row?
        answer: { var: topZone, tol: 0 }
        misconceptions:
          - { var: wrongTie, feedback: 'Right count, wrong [[tie-break]]: `"PULocationID"` puts the smaller zone number first.' }
        hint: Biggest count first; among equal counts, the smallest zone number.
    hints:
      - Find the misspelled name first, then decide where Spark notices it.
      - 'After the fix, work cell by cell: the filter, then one row per zone, then the sort with its tie-break.'
    explanation: |
      The misspelling `PULocatonID` is in cell {=typoCell}, and the error appears in cell {=failAt}: {=why}.
      After the fix, {=nf} of the {=k} trips have a fare above {=x} {=opWord} a tip above 0. They start in
      {=groups} zones, so `top.show()` prints {=groups} rows, zone {=topZone} first with {=topCount} trip(s):

      {=result}

  - id: share-hand
    type: hand-calc
    skills: [select-filter, builtin-clash]
    difficulty: 3
    tags: [code, application]
    generator: shareQ
    lessonRef: { tab: application, id: round-clash }
    prompt: |
      `trips` holds the {=k} trips below. A fresh notebook, with no star import, runs Bea's share cell:
    show:
      - { id: t, widget: Text, props: { body: '{=table}' } }
      - { id: c, widget: Code, props: { source: '@code', lang: python } }
    steps:
      - prompt: What does `tipped.count()` return?
        answer: { var: nf, tol: 0 }
        misconceptions:
          - { var: tipOnly, feedback: 'You checked only the tip. The fare must also be above {=x}.' }
          - { var: fareOnly, feedback: 'You checked only the fare. The tip must also be above 0.' }
        hint: 'A trip counts when its tip is above 0 **and** its fare is above {=x}.'
      - prompt: 'What does the `print` line show? Type the decimal it prints: `round(..., 2)` keeps at most two decimal places.'
        answer: { var: share, tol: 0.001 }
        misconceptions:
          - { var: shareTip, feedback: 'That share leaves out the fare test: it divides every tipped trip by all trips.' }
          - { var: upsideDown, feedback: 'The division is upside down. `tipped.count() / trips.count()` puts the kept trips on top, so the share is at most 1.' }
        hint: 'Divide the kept trips by all {=k} trips, then round to two decimal places.'
      - prompt: 'Now the notebook starts with `from pyspark.sql.functions import *`. Which line of the cell fails?'
        answer: { value: 2, tol: 0 }
        misconceptions:
          - { value: 1, feedback: 'Line 1 is fine: `trips.tip_amount` and `&` need no import.' }
        hint: Which name on these two lines does the star import cover?
    hints:
      - Count the kept trips first, then divide by every trip in the table.
    explanation: |
      {=nf} of the {=k} trips have a tip and a fare above {=x}, so the line prints {=share}: {=nf} / {=k} rounded to
      two decimal places. After a star import, line 2 fails with a bare `AssertionError`: `round` then means
      PySpark's, which expects a column. Line 1 uses no imported name, so it still runs.
