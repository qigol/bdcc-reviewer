templates:
  # =====================================================================================
  # Session 3: imports and the built-in clash
  # =====================================================================================
  - id: import-style-mcq
    type: mcq
    skills: [imports]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: intuition, id: toolbox }
    prompt: |
      A fresh notebook runs one [[import]] line, then `F.desc("count")`. Which import line makes `F.desc("count")` work?
    options:
      - '`from pyspark.sql import functions as F`'
      - '`from pyspark.sql.functions import desc`'
      - '`from pyspark.sql.functions import *`'
      - '`import pyspark`'
    answer: 0
    optionFeedback:
      '1': 'This borrows `desc` under its bare name. The name `F` is never created, so `F.desc` raises `NameError: name ''F'' is not defined`.'
      '2': 'The star copies every tool under its bare name, but it does not create the name `F`. A real run gives `NameError: name ''F'' is not defined`.'
      '3': 'This loads the package, but no name `F` exists afterwards.'
    hints:
      - '`F.desc` asks for something called `F`. Which line creates that name?'
    explanation: |
      `as F` gives the whole [[module]] `pyspark.sql.functions` the short name `F`. Only then does `F.desc(...)` find
      the tool. In the real runs, the other import lines all end in `NameError: name 'F' is not defined`.

  - id: clash-mcq
    type: mcq
    skills: [builtin-clash]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: intuition, id: two-sums }
    prompt: |
      A fresh notebook runs `from pyspark.sql.functions import *` in one [[cell]], then `sum([1, 2, 3])` in the next.
      What happens?
    options:
      - 'An error: a bare `AssertionError` with no message'
      - 'It prints `6`, as before'
      - 'A `TypeError`, as with `max(3, 7)`'
      - '`NameError: name ''sum'' is not defined`'
    answer: 0
    optionFeedback:
      '1': 'That is what Python''s own `sum` does. After the star import, `sum` means PySpark''s `sum`.'
      '2': 'Only `max` gives a TypeError. PySpark''s `sum` also wants a column, but a check inside it fails first, with a bare AssertionError.'
      '3': 'The name exists: the star import brought in PySpark''s `sum`. That is exactly the problem.'
    hints:
      - The star copied every PySpark tool under its bare name. Does PySpark have a tool called `sum`?
    explanation: |
      The [[wildcard-import]] replaced Python's [[built-in-function]] `sum` with PySpark's `sum`, which expects a
      column, not the [[list]] `[1, 2, 3]`. The real output:

      ```text
      Traceback (most recent call last):
        File "<cell 4>", line 1, in <module>
          sum([1, 2, 3])
        ...
      AssertionError
      ```

  - id: clash-why-mcq
    type: mcq
    skills: [builtin-clash, imports]
    difficulty: 2
    tags: [code, intuition]
    lessonRef: { tab: math-code, id: import-styles }
    prompt: |
      After `from pyspark.sql.functions import *`, why does `round(4.567, 1)` fail, and how does
      the `F.` style prevent it?
    options:
      - 'The star import replaced Python''s `round` with PySpark''s, which expects a column. With `F`, Spark''s version is `F.round` and Python''s `round` is untouched.'
      - 'PySpark switches off Python''s built-in functions. Importing with `F` switches them back on.'
      - '`round` needs an import before it works. `as F` is that import.'
      - 'Spark cannot round numbers with three decimals. `F` uses a more precise number type.'
    answer: 0
    hints:
      - Which `round` does the name `round` point to after the star import?
      - With `as F`, where do PySpark's tools live?
    explanation: |
      A [[wildcard-import]] copies every PySpark tool under its bare name. The copies replace Python's
      [[built-in-function|built-in functions]] with the same names (`round`, `max`, `sum` and nine others). With
      `from pyspark.sql import functions as F` every PySpark tool keeps the label `F.`. So `round` still means
      Python's `round` (4.6), and `F.round` means Spark's.

  - id: import-match
    type: match
    skills: [imports, builtin-clash]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: import-styles }
    prompt: Match each [[import]] line with what it does.
    pairs:
      - ['`from pyspark.sql.functions import desc`', 'Borrows one tool, under its bare name `desc`']
      - ['`from pyspark.sql.functions import *`', 'Borrows every tool under bare names, which can hide Python''s `round`, `max` and `sum`']
      - ['`from pyspark.sql import functions as F`', 'Borrows the whole toolbox under the label `F`']
      - ['`from builtins import round, max, sum`', 'Takes Python''s own `round`, `max` and `sum` back']
    hints:
      - 'Look at what comes after the word `import`: one name, a star, or a module with `as`.'
    explanation: |
      One name gives one bare tool. The star gives every tool, bare, and can cover Python's
      [[built-in-function|built-in functions]]. `as F` keeps every Spark tool behind the label `F.`. The `builtins`
      module is where Python keeps its own `round`, `max` and `sum`.

  - id: code-import-f
    type: code-fill
    skills: [imports]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: import-styles }
    prompt: Complete the recommended [[import]] line, so that later cells can write `F.desc("count")`.
    code: |
      from pyspark.sql import __BLANK_1__ as __BLANK_2__
    blanks:
      '1': { accept: ['functions'], hint: 'the module that holds desc and sum' }
      '2': { accept: ['F'], hint: the short label }
    explanation: '`from pyspark.sql import functions as F` loads the [[module]] `pyspark.sql.functions` under the short name `F`.'

  - id: import-notebook-hand
    type: hand-calc
    skills: [imports, builtin-clash]
    difficulty: 3
    tags: [code]
    lessonRef: { tab: intuition, id: two-sums }
    prompt: |
      A fresh notebook runs these five [[cell|cells]] in order. When a cell raises an error, you read it and run
      the next cell anyway. Follow what each name means after every cell.
    show:
      - id: c
        widget: Code
        props:
          lang: python
          source: |
            # cell 1
            from pyspark.sql.functions import *

            # cell 2
            print(round(4.567, 1))

            # cell 3
            from builtins import round

            # cell 4
            print(round(4.567, 1))

            # cell 5
            F.desc("count")
    steps:
      - prompt: Which cell is the first to raise an error?
        answer: { value: 2, tol: 0 }
        misconceptions:
          - { value: 1, feedback: 'The star import itself runs without complaint. The trouble starts when a covered name is used.' }
          - { value: 5, feedback: 'Cell 5 fails too, but cell 2 fails first: after the star, `round` means PySpark''s, which expects a column.' }
        hint: After cell 1, which `round` does the name `round` point to?
      - prompt: What does cell 4 print?
        answer: { value: 4.6, tol: 0.001 }
        misconceptions:
          - { value: 4.57, feedback: '`round(4.567, 1)` keeps one decimal place, not two.' }
        hint: Cell 3 takes Python's own `round` back from the `builtins` module.
      - prompt: Which cell raises the next error after cell 2?
        answer: { value: 5, tol: 0 }
        misconceptions:
          - { value: 4, feedback: 'Cell 3 took Python''s `round` back, so cell 4 prints 4.6.' }
        hint: Does any of the cells create the name `F`?
    hints:
      - 'The star covers `round`, `max` and `sum`; `from builtins import round` takes `round` back.'
      - 'The star copies tools under their bare names. It never creates a name called `F`.'
    explanation: |
      Cell 1's [[wildcard-import]] copies every PySpark tool under its bare name, so cell 2's `round` is PySpark's
      and fails with a bare `AssertionError`. Cell 3 takes Python's [[built-in-function]] back, so cell 4 prints
      4.6. The star never creates the name `F`, so cell 5 raises `NameError: name 'F' is not defined`. Real runs
      gave each of these results.

  # =====================================================================================
  # Session 3: group, count, sort
  # =====================================================================================
  - id: group-count-numeric
    type: numeric
    skills: [group-order]
    difficulty: 1
    tags: [code]
    generator: groupCountQ
    lessonRef: { tab: intuition, id: assembly-line }
    prompt: |
      Here are {=k} of the twelve trips. You run `trips.groupBy("PULocationID").count().show()`.
      Which number appears in the `count` column next to zone **{=zone}**?
    show:
      - { id: t, widget: Text, props: { body: '{=table}' } }
    answer: { var: answer, tol: 0 }
    hints:
      - '`groupBy` makes one group per pickup zone. `count()` counts the trips in each group.'
      - 'Go down the `PULocationID` column and tally every {=zone}.'
    explanation: |
      Zone {=zone} appears {=answer} time(s) among the {=k} trips, so its row says {=answer}. The result has
      {=groups} rows, one per zone:

      {=result}

  - id: group-rows-numeric
    type: numeric
    skills: [group-order]
    difficulty: 1
    tags: [code]
    generator: groupRowsQ
    lessonRef: { tab: math-code, id: group-count-order }
    prompt: |
      Here are {=k} of the twelve trips. How many rows does `{=code}` print?
    show:
      - { id: t, widget: Text, props: { body: '{=table}' } }
    answer: { var: answer, tol: 0 }
    hints:
      - '`groupBy("{=col}")` makes one group for each different value in that column.'
      - 'List the different values of `{=col}` you can see, then count them.'
    explanation: |
      The result has one row per different value of `{=col}`. This table holds {=answer} different values, so
      `show()` prints {=answer} rows. The biggest count inside the result is {=topCount}.

  - id: top-zone-numeric
    type: numeric
    skills: [group-order]
    difficulty: 2
    tags: [code]
    generator: topZoneQ
    lessonRef: { tab: math-code, id: group-count-order }
    prompt: |
      Here are {=k} of the twelve trips. You run
      `trips.groupBy("PULocationID").count().orderBy(F.desc("count"), "PULocationID").show()`.
      Which `PULocationID` is printed in row **{=r}** of the result?
    show:
      - { id: t, widget: Text, props: { body: '{=table}' } }
    answer: { var: answer, tol: 0 }
    hints:
      - First count the trips in every zone.
      - Sort the counts from biggest to smallest. If two zones have the same count, the smaller zone number comes first.
    explanation: |
      The counts sorted with `F.desc("count")`, then with the [[tie-break]] `"PULocationID"` (smallest zone first):

      {=result}

      Row {=r} holds zone {=answer}.

  - id: group-hand
    type: hand-calc
    skills: [group-order]
    difficulty: 3
    tags: [code]
    generator: groupHandQ
    lessonRef: { tab: intuition, id: assembly-line }
    prompt: |
      Work out by hand what `trips.groupBy("PULocationID").count().orderBy(F.desc("count"), "PULocationID").show()`
      prints for these {=k} trips.
    show:
      - { id: t, widget: Text, props: { body: '{=table}' } }
    steps:
      - prompt: 'The `count` for zone {=zoneA}'
        answer: { var: countA, tol: 0 }
        hint: Tally the rows whose `PULocationID` is {=zoneA}.
      - prompt: 'The `count` for zone {=zoneB}'
        answer: { var: countB, tol: 0 }
      - prompt: How many rows does the result have?
        answer: { var: groups, tol: 0 }
        misconceptions:
          - { var: k, feedback: 'That is the number of trips. The result has one row per zone.' }
        hint: One row per different zone.
      - prompt: Which zone is printed in the first row?
        answer: { var: topZone, tol: 0 }
        misconceptions:
          - { var: wrongTie, feedback: 'Right count, wrong [[tie-break]]: `"PULocationID"` puts the smaller zone number first.' }
        hint: Biggest count first; among equal counts, the smallest zone number.
    hints:
      - Count every zone first, then sort the counts.
    explanation: |
      Zone {=zoneA} has {=countA} trip(s) and zone {=zoneB} has {=countB}. There are {=groups} zones, so {=groups} rows.
      The biggest count is {=topCount}; with the [[tie-break]] the first row is zone {=topZone}:

      {=result}

  - id: tie-mcq
    type: mcq
    skills: [group-order]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: assembly-line }
    prompt: |
      In the twelve trips, zones 33, 41 and 74 each have 2 trips. After
      `trips.groupBy("PULocationID").count().orderBy(F.desc("count")).show()`, in which order do these three zones print?
    options:
      - 'Spark does not promise an order for them. Add `"PULocationID"` as a second sort key to fix it.'
      - 'Always 33, 41, 74: Spark sorts tied rows by their first column.'
      - 'Always 74, 41, 33: descending applies to every column.'
      - 'Always in the order the trips appear in the file: 41, 74, 33.'
    answer: 0
    optionFeedback:
      '1': 'Spark does not sort tied rows by any column unless you ask. One real run printed 41 first.'
      '2': '`F.desc` applies only to the column it wraps, `count`. Nothing sorts the zone numbers.'
      '3': 'Nothing promises file order after `groupBy`: Spark groups the rows in its own order.'
    hints:
      - '`orderBy(F.desc("count"))` sorts by one thing only. What decides between equal counts?'
    explanation: |
      With one sort key, rows with equal counts can come out in any order, and the order can change from run to
      run. One real run printed 41, 33, 74. A [[tie-break]] such as `orderBy(F.desc("count"), "PULocationID")` makes
      it 33, 41, 74 every time.

  - id: code-tiebreak
    type: code-fill
    skills: [group-order]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: group-count-order }
    prompt: |
      Two zones have exactly the same trip count. Complete the chain so the busiest zone comes first
      and tied zones always come out in the same order (smallest zone number first).
    code: |
      (
          trips.groupBy("PULocationID")
          .count()
          .orderBy(F.__BLANK_1__("count"), __BLANK_2__)
          .show()
      )
    blanks:
      '1': { accept: ['desc'], hint: biggest first }
      '2': { accept: ['"PULocationID"', 'F.col("PULocationID")', 'F.asc("PULocationID")', 'F.col("PULocationID").asc()', 'trips.PULocationID', 'trips["PULocationID"]'], hint: the second sort key }
    explanation: |
      `F.desc("count")` puts the biggest count first. The second key `"PULocationID"` is the [[tie-break]]: among
      equal counts it sorts by zone number, smallest first.

  - id: cast-float-mcq
    type: mcq
    skills: [group-order]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: group-count-order }
    prompt: |
      The notebook's "Session 3 › Grouping, counting and sorting" section casts `total_amount` to `float` (casting
      converts a column to another type) before summing per vendor. Without the cell's final `.describe()`, on the
      twelve trips it prints:

      ```text
      +--------+------------------+
      |VendorID| sum(total_amount)|
      +--------+------------------+
      |       1| 86.25000095367432|
      |       2|132.45000076293945|
      +--------+------------------+
      ```

      Without the cast the sums are 86.25 and 132.45. Why the extra digits?
    options:
      - '`cast("float")` stores each amount with fewer digits, so tiny rounding errors appear and add up.'
      - 'The data really holds those digits; the version without the cast hides them.'
      - '`float` keeps more digits than `double`, so the cast shows digits that were there all along.'
      - '`groupby` in lowercase is an older, less exact version of `groupBy`.'
    answer: 0
    optionFeedback:
      '1': 'The file holds 14.76 and the other amounts with two decimals. The extra digits are made by the cast.'
      '2': 'It is the other way round: `double` keeps about 16 digits, `float` only about 7.'
      '3': '`groupby` and `groupBy` are two spellings of the same method.'
    hints:
      - '`total_amount` was already a `double`. What does converting it to `float` change?'
    explanation: |
      `inferSchema=True` already read `total_amount` as `double` (about 16 digits). Casting means converting a column
      to another type; `float` keeps only about 7 digits, so 14.76 becomes a number very close to, but not exactly,
      14.76. The sums show that rounding error.

  # =====================================================================================
  # Session 3: filters
  # =====================================================================================
  - id: filter-count-numeric
    type: numeric
    skills: [select-filter]
    difficulty: 1
    tags: [code]
    generator: filterCountQ
    lessonRef: { tab: math-code, id: filter-rows }
    prompt: |
      Here are {=k} of the twelve trips. What does this line return?

      `{=code}`
    show:
      - { id: t, widget: Text, props: { body: '{=table}' } }
    answer: { var: answer, tol: 0 }
    hints:
      - 'Go down the `{=col}` column and test each value against {=x}.'
      - '`>` is strict: a value equal to {=x} fails the test.'
    explanation: |
      The [[condition]] `F.col("{=col}") > {=x}` is true for {=answer} of the {=k} trips, and `filter` keeps exactly
      those rows. A trip with exactly {=x} is dropped; `>=` would keep {=geq}.

  - id: filter-and-numeric
    type: numeric
    skills: [select-filter]
    difficulty: 2
    tags: [code]
    generator: filterAndQ
    lessonRef: { tab: intuition, id: filter-conditions }
    prompt: |
      Here are {=k} of the twelve trips. What does this line return?

      `{=code}`
    show:
      - { id: t, widget: Text, props: { body: '{=table}' } }
    answer: { var: answer, tol: 0 }
    hints:
      - '`&` means "and": a trip is kept only if both conditions are true.'
      - 'Mark the fares above {=x}, then check the tip of each marked trip.'
    explanation: |
      {=firstOnly} trip(s) pass the fare test and {=secondOnly} pass the tip test, but only {=answer} pass both, so
      `count()` returns {=answer}. With `|` (or) it would be {=orCount}.

  - id: filter-or-numeric
    type: numeric
    skills: [select-filter]
    difficulty: 2
    tags: [code]
    generator: filterOrQ
    lessonRef: { tab: math-code, id: filter-rows }
    prompt: |
      Here are {=k} of the twelve trips. What does this line return?

      `{=code}`
    show:
      - { id: t, widget: Text, props: { body: '{=table}' } }
    answer: { var: answer, tol: 0 }
    hints:
      - '`|` means "or": one true condition is enough to keep a trip.'
      - A trip that passes both tests is still kept only once.
    explanation: |
      Keep every trip from zone {=z} and every trip with a fare above {=x}. That gives {=answer} rows. Adding the two
      separate counts gives {=sumBoth}, because {=andCount} trip(s) pass both tests and would be counted twice.

  - id: or-not-numeric
    type: numeric
    skills: [select-filter]
    difficulty: 3
    tags: [code]
    generator: orNotQ
    lessonRef: { tab: intuition, id: filter-conditions }
    prompt: |
      Here are {=k} of the twelve trips. What does this line return?

      `{=code}`
    show:
      - { id: t, widget: Text, props: { body: '{=table}' } }
    answer: { var: answer, tol: 0 }
    hints:
      - '`~` flips a test: `~(F.col("tip_amount") > 0)` is true for the trips whose tip is **not** above 0.'
      - 'With `|`, a trip is kept when it starts in zone {=z}, or has no tip, or both.'
      - 'Count the zone {=z} trips and the trips without a tip, then take away the trips you counted twice.'
    explanation: |
      {=zoneN} trip(s) start in zone {=z}, and {=notN} have no tip. {=both} of them are both, and `filter` keeps
      each row once: {=zoneN} + {=notN} − {=both} = {=answer}. Without the `~`, the line would keep
      {=withoutNot} trips.

  - id: and-error-mcq
    type: mcq
    skills: [select-filter]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: intuition, id: filter-conditions }
    prompt: |
      This cell fails:

      ```text
      Traceback (most recent call last):
        File "<cell 18>", line 1, in <module>
          trips.filter((F.col("fare_amount") > 10) and (F.col("tip_amount") > 0))
                       ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
        ...
      pyspark.errors.exceptions.base.PySparkValueError: [CANNOT_CONVERT_COLUMN_INTO_BOOL] Cannot convert column into bool: please use '&' for 'and', '|' for 'or', '~' for 'not' when building DataFrame boolean expressions.
      ```

      Which change fixes it?
    options:
      - 'Replace `and` with `&`'
      - 'Replace `and` with `+`'
      - 'Remove the parentheses around each condition'
      - 'Write `AND` in capital letters'
    answer: 0
    optionFeedback:
      '2': 'Removing the parentheses keeps the `and`, so the same CANNOT_CONVERT_COLUMN_INTO_BOOL error appears. Keep them for the `&` fix too: without them Python reads `10 & F.col(...)` first and raises the same error.'
      '3': '`AND` works inside a SQL text such as `"fare_amount > 10 AND tip_amount > 0"`, but not between two Python column expressions.'
    hints:
      - The last line of the error names the replacement for `and`.
    explanation: |
      Python's `and` needs a plain true or false, but a Spark [[condition]] is a column of true/false values. The
      message itself gives the fix: `&` for `and`, `|` for `or`, `~` for `not`, each condition in its own parentheses.

  - id: code-and-fix
    type: code-fill
    skills: [select-filter]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: filter-rows }
    prompt: |
      Fix this line: `trips.filter(trips.fare_amount > 10 and trips.tip_amount > 0)`.
    code: |
      trips.filter((trips.fare_amount > 10) __BLANK_1__ (trips.tip_amount > 0))
    blanks:
      '1': { accept: ['&'], hint: '"and" for Spark conditions' }
    explanation: |
      Between Spark [[condition|conditions]] use `&` (and), `|` (or) and `~` (not), with each condition in its own
      parentheses. On the twelve trips the fixed line keeps 5 rows.

  # =====================================================================================
  # Session 3: reading a chain
  # =====================================================================================
  - id: chain-order
    type: order
    skills: [method-chain]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: chain-steps }
    prompt: |
      Put the stations of this [[method-chain]] in order. It should list the pickup zones of the trips that got a tip,
      busiest zone first.
    items:
      - '`trips`'
      - '`.filter(F.col("tip_amount") > 0)`'
      - '`.groupBy("PULocationID")`'
      - '`.count()`'
      - '`.orderBy(F.desc("count"), "PULocationID")`'
      - '`.show()`'
    hints:
      - '`count()` needs groups, and `orderBy(F.desc("count"))` needs the `count` column.'
    explanation: |
      Filter first, while `tip_amount` is still there. `groupBy` hands over [[grouped-data|GroupedData]], `count()`
      turns it into a table with a `count` column, `orderBy` sorts that column, and `show()` is the
      [[action]] that prints. On the twelve trips the result is 7 and 33 (2 trips each), then 41, 74 and 97.

  - id: chain-rows-numeric
    type: numeric
    skills: [method-chain]
    difficulty: 2
    tags: [code]
    generator: chainRowsQ
    lessonRef: { tab: math-code, id: chain-steps }
    prompt: |
      Here are {=k} of the twelve trips. How many rows does this chain produce?
    show:
      - { id: t, widget: Text, props: { body: '{=table}' } }
      - { id: c, widget: Code, props: { source: '@code', lang: python } }
    answer: { var: answer, tol: 0 }
    hints:
      - Read the chain one station at a time. Which trips survive the filter?
      - Then count the different zones among the surviving trips only.
    explanation: |
      After the filter, {=afterFilter} trips are left. `groupBy` + `count` makes one row per zone among those trips:
      {=answer} rows. Grouping all {=k} trips would give {=allGroups}.

  - id: chain-hand
    type: hand-calc
    skills: [method-chain, select-filter, group-order]
    difficulty: 3
    tags: [code]
    generator: chainHandQ
    lessonRef: { tab: intuition, id: read-a-chain }
    prompt: |
      Read this chain one station at a time on these {=k} trips. The full `trips` table has {=allCols} columns.
    show:
      - { id: t, widget: Text, props: { body: '{=table}' } }
      - { id: c, widget: Code, props: { source: '@code', lang: python } }
    steps:
      - prompt: Rows left after `filter`
