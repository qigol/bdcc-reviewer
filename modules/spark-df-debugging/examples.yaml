    note: 'mean 41.333333333333336 and 175.08333333333334; sample stddev 31.93838765593226 and 71.73747383003635.'
  - id: t12-groupby-count
    source: 'Session 3 › Grouping, counting and sorting, without orderBy, on taxi12; truth m2.groupby_count'
    fn: realMatch
    in: { key: m2.groupby_count }
    expect: { same: true }
    note: Spark prints the groups in its own (hash) order 41, 7, 97, 75, 33, 74.
  - id: t12-groupby-desc
    source: 'Session 3 › Grouping, counting and sorting, F style without a tie-break, on taxi12; truth m2.groupby_count_desc'
    fn: realMatch
    in: { key: m2.groupby_count_desc }
    expect: { same: true }
    note: Without a tie-break the three zones with 2 trips came out 41, 33, 74 in this run; that order is not guaranteed.
  - id: t12-groupby-tiebreak
    source: 'Session 3 › Grouping, counting and sorting, with the tie-break, on taxi12; truth m2.groupby_count_desc_tiebreak'
    fn: realMatch
    in: { key: m2.groupby_count_desc_tiebreak }
    expect: { same: true }
  - id: t12-assembly-chain
    source: 'Scene assembly-line chain (select, groupBy, count, orderBy); real Spark 4.0.1 run (harness), m2x.lazy.assembly'
    fn: realMatch
    in: { key: m2x.lazy.assembly }
    expect: { same: true }
  - id: tally-walk
    source: 'Count-along of the Session 3 grouping chain on taxi12 (truth m2.groupby_count_desc_tiebreak)'
    fn: tallyWalk
    in: {}
    expect: { steps: 15, top: 7, topCount: 4, tied: [33, 41, 74], order: [7, 33, 41, 74, 75, 97] }
    note: One step per trip (12), plus the empty start, the top zone and the tie-break.
  - id: group-count-code
    source: 'Section group-count-order trace on taxi12 (truth m2.groupby_count_desc_tiebreak)'
    fn: groupCountCode
    in: {}
    expect: { groups: 6, top: 7, topCount: 4, shown: 6 }
  - id: group-count-code-show5
    source: 'Section group-count-order trace with the notebook''s show(5) (m2x.lazy.top_pickups_show5 prints 5 of 6 rows)'
    fn: groupCountCode
    in: { n: 5 }
    expect: { groups: 6, shown: 5 }
    note: 'One step for groupBy, one per trip (12), one for the sort and one for show(5): 15 steps.'
  - id: zone-count-7
    source: 'Count of zone 7 on taxi12 (truth m2.groupby_count: zone 7 has 4 trips)'
    fn: zoneCount
    in: { zone: 7 }
    expect: { count: 4, trips: [3, 4, 8, 11] }
  - id: station-grouped
    source: 'Truth m2.type_groupby: groupBy alone returns GroupedData'
    fn: stationView
    in: { upTo: 2 }
    expect: { grouped: true, type: "<class 'pyspark.sql.connect.group.GroupedData'>" }
  - id: station-count
    source: 'Truth m2.groupby_count (6 zones)'
    fn: stationView
    in: { upTo: 3 }
    expect: { rows: 6, cols: 2 }
  - id: t12-cast-float-sum
    source: 'Session 3 › Grouping, counting and sorting, the cast example without describe, on taxi12; truth m2.withcolumn_cast_sum'
    fn: realMatch
