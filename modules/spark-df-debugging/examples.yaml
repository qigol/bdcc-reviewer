    expect: { same: true }
    note: 'cast("float") shows float artifacts: 86.25000095367432 and 132.45000076293945 instead of 86.25 and 132.45 (truth m2.withcolumn_cast_sum_double).'
  - id: t12-sum-double
    source: 'Truth m2.withcolumn_cast_sum_double'
