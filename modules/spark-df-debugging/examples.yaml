examples:
  # ---- the lesson data -------------------------------------------------------------------
  - id: taxi12-dataset
    source: 'Blueprint §2a; lessons/taxi12.csv read with header=True, inferSchema=True (truth m2.setup)'
    fn: datasetCheck
    in: { table: '@taxi12' }
    expect: { same: true, rows: 12, columns: 10, types: [int, timestamp, string, int, int, int, double, double, double, double] }
    note: The dataset file equals the engine's read of the lesson CSV, value for value; the types match truth m2.dtypes.
  - id: t12-dtypes
    source: 'Notebook, Session 4 › Your inspection toolkit (dtypes); real Spark 4.0.1 run (harness), truth m2.dtypes'
    fn: realMatch
    in: { key: m2.dtypes }
    expect: { same: true }

  # ---- Session 3: imports ---------------------------------------------------------------
  - id: import-f-scope
    source: 'Notebook, Session 3 › Imports: borrowing tools; real Spark 4.0.1 runs (harness), m2x.imp.F.*'
    fn: importScope
    in: { style: F }
    expect: { okCount: 4, roundWorks: true, descWorks: false, fdescWorks: true }
    note: 'With `functions as F`, Python''s own round/max/sum still work, `F.desc` works, bare `desc` raises NameError.'
  - id: import-star-scope
    source: 'Notebook, Session 3 › Broken on purpose: the wildcard import; real Spark 4.0.1 runs (harness), m2x.imp.star.* = truth m2.wildcard.*'
    fn: importScope
    in: { style: star }
    expect: { okCount: 1, roundWorks: false, descWorks: true, fdescWorks: false }
  - id: import-code-trace
    source: 'Section import-styles trace (Session 3 › Imports: borrowing tools, then the wildcard import and its fix); truth m2.builtins.*, m2.type_F, m2.wildcard.round, m2x.app.builtins_back'
    fn: importCode
    in: {}
    expect: { steps: 10, clash: AssertionError, fixed: 4.6 7 6, results.round: '4.6', results.typeF: "<class 'module'>" }
    note: 'One step per executed line: 3 built-ins, 3 lines of the F import, 2 of the wildcard cell, 2 of the fix.'
  - id: wildcard-round-error
    source: 'Notebook, Session 3 › Broken on purpose: the wildcard import; real Spark 4.0.1 run (harness), truth m2.wildcard.round'
    fn: realMatch
    in: { key: m2.wildcard.round }
    expect: { same: true, part: final }
    note: 'A bare `AssertionError` with no message.'
  - id: wildcard-max-error
    source: 'Notebook, Session 3 › Broken on purpose: the wildcard import (text); real Spark 4.0.1 run (harness), truth m2.wildcard.max'
    fn: realMatch
    in: { key: m2.wildcard.max }
    expect: { same: true }
  - id: desc-without-import
    source: 'The grouping chain (Session 3 › Grouping, counting and sorting) run before its import; real Spark 4.0.1 run (harness), truth m2.desc_without_import'
    fn: realMatch
    in: { key: m2.desc_without_import }
    expect: { same: true }

  # ---- Session 3: select, group, count, sort ---------------------------------------------
