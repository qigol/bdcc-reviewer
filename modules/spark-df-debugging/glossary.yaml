terms:
  - id: dataframe
    term: DataFrame
    aka: [DataFrames, data frame]
    short: 'A table that Spark holds and works on: rows of records, each split into named columns. It can be spread over many computers.'
    related: [column, method]
    skills: [method-chain]
  - id: column
    term: Column
    aka: [columns]
    short: 'One named field of a table, such as `fare_amount`; every row holds one value in it.'
    long: |
      In code, `F.col("fare_amount")`, `trips.fare_amount` and `trips["fare_amount"]` all point to the same column.
    related: [dataframe, row, condition]
    skills: [select-filter]
  - id: row
    term: Row
    aka: [rows]
    short: 'One record of a table, such as one taxi trip. It holds one value in every column.'
    related: [dataframe, column]
    skills: [select-filter]
  - id: cell
    term: Cell
    aka: [cells, notebook cell]
    short: One box of code in a notebook. You run it on its own, and whatever it prints appears right below it.
    related: [traceback]
    skills: [tracebacks]
  - id: function
    term: Function
    aka: [functions]
    short: A named, reusable piece of code. You call it with parentheses, give it inputs, and it hands back a result.
    long: |
      Python has many ready-made ones. You write your own with `def name(inputs):` and an indented body; the line
      `return value` hands the result back to whoever called it.
    related: [built-in-function, method, none]
    skills: [imports, functions-def]
  - id: module
    term: Module
    aka: [modules]
    short: 'A named collection of ready-made Python tools, such as `pyspark.sql.functions` (one file or a folder of files). Its tools stay out of reach until loaded.'
    related: [import]
    skills: [imports]
  - id: import
    term: Import
    aka: [importing, imports, imported]
    short: "The statement that loads a module's tools into your notebook, so that you can call them by name."
    long: |
      Three styles appear in the course notebook: `from pyspark.sql.functions import desc` (one tool, bare name),
      `from pyspark.sql.functions import *` (every tool, bare names) and `from pyspark.sql import functions as F`
      (the whole toolbox under the short name `F`, the style the course recommends).
    related: [module, wildcard-import]
    skills: [imports]
  - id: built-in-function
    term: Built-in function
    aka: [built-in, built-ins, built-in functions]
    short: 'A function Python has from the start, with no import at all: `round`, `max`, `sum`, `print`, `type`.'
    related: [function, wildcard-import]
    skills: [builtin-clash]
  - id: list
    term: List
    aka: [lists]
    short: 'Several values in square brackets, kept in order, such as `[1, 2, 3]`.'
    related: [built-in-function]
    skills: [builtin-clash]
  - id: wildcard-import
    term: Wildcard import
    aka: [import *, star import]
    short: 'Writing `from module import *`: it copies every tool under its bare name and silently replaces same-named tools already there.'
    long: |
      After `from pyspark.sql.functions import *`, PySpark's `round`, `max`, `sum` and nine other functions replace
      Python's [[built-in-function|built-in functions]] of the same name. `round(4.567, 1)` then fails with a bare
      `AssertionError` and `max(3, 7)` with a `TypeError`.
    related: [import, built-in-function]
    skills: [builtin-clash]
  - id: method
    term: Method
    aka: [methods]
    short: 'A function that belongs to an object and is called with a dot after it, as in `trips.select("PULocationID")`.'
    related: [function, method-chain]
    skills: [method-chain]
  - id: method-chain
    term: Method chain
    aka: [chain, chains, chained]
    short: Several method calls joined by dots. Each works on the table the previous call returned and hands on a new one.
    long: |
      Wrap a long chain in parentheses so it can span several lines, one call per line. To check it, cut it after any
      call and add `.show()`.
    related: [method, grouped-data]
    skills: [method-chain]
  - id: grouped-data
    term: GroupedData
    aka: [grouped data]
    short: "The in-between object `groupBy` returns: rows sorted into groups, waiting for a summary such as `count()`. It has no `show()`."
    related: [method-chain, tie-break]
    skills: [method-chain, group-order]
  - id: tie-break
    term: Tie-break
    aka: [tie-breaks, tie, ties, tied]
    short: A second sort key that decides the order of rows whose first key is equal, so the result comes out the same every run.
    related: [grouped-data]
    skills: [group-order]
  - id: condition
    term: Condition
    aka: [conditions, boolean condition]
    short: 'An expression that is true or false for each row, such as `F.col("fare_amount") > 10`. `filter` keeps the rows where it is true.'
    long: |
      Join conditions with `&` (and), `|` (or) and `~` (not), each condition in its own parentheses. Python's words
      `and`, `or`, `not` do not work on Spark columns.
    related: [column]
    skills: [select-filter]
  - id: attribute-error
    term: AttributeError
    short: "Python's error when you use a dot to ask a value for something it does not have, such as `show()` on GroupedData."
    long: |
      An attribute is anything you reach with a dot: a method such as `show`, or a stored value. The message names the
      value's kind and the missing attribute: `'NoneType' object has no attribute 'show'`.
    related: [grouped-data, none, method]
    skills: [method-chain, functions-def]
  - id: variable
    term: Variable
    aka: [variables]
    short: 'A name that holds a value. `counts = ...` stores the result of the right-hand side under the name `counts`.'
    long: |
      One `=` stores a value; two, `==`, ask "is equal to?". A variable that holds a DataFrame holds a plan, not data.
    related: [function, plan]
    skills: [functions-def]
  - id: none
    term: None
    aka: [NoneType]
    short: "Python's value for \"nothing\". A function that ends without a `return` line hands back this value."
    related: [function]
    skills: [functions-def]
  - id: transformation
    term: Transformation
    aka: [transformations]
    short: 'A command that describes a new table from an old one, such as `select`, `filter` or `orderBy`. It returns at once and computes nothing.'
    related: [action, lazy-evaluation]
    skills: [lazy-eval]
  - id: action
    term: Action
    aka: [actions]
    short: 'A command that asks for a result, such as `show`, `count` or `toPandas`. It makes Spark carry out the waiting steps.'
    related: [transformation, lazy-evaluation]
    skills: [lazy-eval]
  - id: lazy-evaluation
    term: Lazy evaluation
    aka: [lazy, lazily]
    short: "Spark's habit of waiting: it only writes steps down until an action asks for a result, then does all the work at once."
    related: [plan, action]
    skills: [lazy-eval]
  - id: plan
    term: Plan
    aka: [plans, query plan, execution plan]
    short: "Spark's list of steps for building a result, written before anything runs. `explain()` prints it."
    related: [lazy-evaluation]
    skills: [lazy-eval]
  - id: spark-connect
    term: Spark Connect
    short: 'The setup Databricks serverless uses: your notebook sends plans to a Spark computer elsewhere (a server), which checks and runs them.'
    long: |
      The server checks the plan when the notebook asks it something: an action such as `show()`, or a look at the
      column list such as `columns` or `printSchema()`. So most misspelled column names surface there, not where you
      typed them. A few commands (`groupBy("name")`, `df["name"]`, `df.name`) ask for the column list straight away
      and fail on their own line.
    related: [lazy-evaluation, plan]
    skills: [lazy-eval]
  - id: traceback
    term: Traceback
    aka: [tracebacks, stack trace]
    short: "The error report Python prints: the chain of calls from your cell down to the failure, ending with the error's name and message."
    long: |
      Read two parts first: the last line (the error's name and message), then the [[frame]] that names your own
      cell (`File "<cell 52>", line 1`). On Databricks the frame usually reads `File <command-…>` instead.
    related: [cell, frame, analysis-exception]
    skills: [tracebacks]
  - id: frame
    term: Frame
    aka: [frames]
    short: 'One `File …, line N` entry of a traceback: a step in the chain of calls, naming a file or cell and the line that ran.'
    related: [traceback, cell]
    skills: [tracebacks]
  - id: analysis-exception
    term: AnalysisException
    short: "Spark's error when it cannot make sense of a plan, most often because a column name cannot be found."
    related: [traceback, name-error, type-error]
    skills: [tracebacks, error-types]
  - id: name-error
    term: NameError
    short: "Python's error for a name it was never given: a skipped cell, a restarted notebook or a missing import."
    related: [analysis-exception, type-error]
    skills: [error-types]
  - id: type-error
    term: TypeError
    short: "Python's error when a value of the wrong kind is used, such as comparing a piece of text with a number."
    related: [name-error, analysis-exception]
    skills: [error-types]
  - id: schema
    term: Schema
    aka: [schemas]
    short: "The list of a table's column names with their types: text, whole number, decimal number, timestamp. `printSchema()` shows it."
    related: [silent-null]
    skills: [error-types]
  - id: silent-null
    term: Silent null
    aka: [silent nulls]
    short: A missing value, shown as NULL, that appears with no error because a value in the file did not fit the type the schema promised.
    long: |
      Example: a schema that says `store_and_fwd_flag INT` for a column holding `N` and `Y`. Every flag becomes
      NULL and `groupBy` shows one NULL group. Spark 4 runs in a strict mode (ANSI mode, named after the American
      National Standards Institute, whose rules it follows), so comparing that column with `"Y"` does raise an error.
    related: [schema]
    skills: [error-types]
