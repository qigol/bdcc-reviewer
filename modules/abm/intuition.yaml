scenes:
  - id: diagnosis-treatment
    title: An accurate cost changes nothing by itself
    goal: ABC showed that one of Cavite Precision's parts is undercosted. Has the company gained anything yet?
    skills: [abc-to-abm]
    data: [brackets, treatment]
    derive:
      - { fn: setups, in: { products: '@brackets.products', costPerSetup: '@brackets.costPerSetup' }, out: st }
    stage:
      - id: table
        widget: Text
        props:
          body: |
            | | ABC | ABM |
            |---|---|---|
            | What it is | a costing technique | a management philosophy |
            | Question | What does this cost? | Should we still do this? |
            | Looks | backward | forward |
            | Medical analogy | diagnosis | treatment |
      - id: diag
        widget: Readout
        region: side
        props:
          items:
            - { label: 'Setups a year, Custom vs Standard Bracket', value: '{=brackets.products.0.setups|comma} vs {=brackets.products.1.setups|comma}' }
            - { label: 'Setup cost ABC traces to each product', value: '{=st.costA|money} vs {=st.costB|money}', tone: bad }
      - id: bins
        widget: DropBins
        hidden: true
        props: { chips: '@treatment.chips', bins: '@treatment.bins', solution: '@treatment.solution' }
      - id: kt
        widget: Callout
        region: side
        hidden: true
        props:
          kind: note
          title: Kepner-Tregoe method
          body: '**Situation appraisal**: what is going on? **Problem analysis**: why did it happen? **Decision analysis**: what should we do? **Potential problem analysis**: what could go wrong with the plan?'
    beats:
      - say: |
          The ABC module showed that one plantwide rate undercosts Cavite Precision's premium custom part. Here we call
          it Custom Bracket: it needs 800 setups a year, and ABC traces their cost to it. **Activity-based management**
          (ABM) is what comes next: using that data to change the business.
        define: [activity-based-management]
        gate:
          type: predict
          question: Management files the corrected cost report and changes nothing else. How much has the company gained so far?
          options: ['Nothing yet; the gain comes from acting on the data', 'A lot; accurate costs lower future costs by themselves', 'Some; the report alone makes every price right']
          answer: 0
          explain: ABC diagnoses; ABM treats. Repricing Custom Bracket, fixing its setups or reconsidering the product is where the value is.
      - say: |
          ABC is the diagnosis: what does an activity cost? ABM is the treatment: what do we change because of it?
          Sort six tasks from this module's cases.
        show: [bins]
        gate:
          type: event
          prompt: Sort each task into diagnosis or treatment.
          target: bins
          event: solved
          hint: Does the task measure a cost, or change what the business does?
      - say: |
          ABM is not a one-off project but **Kaizen**: measure, find the waste, diagnose its cause, act, and measure
          again.
        define: [kaizen]
        hide: [bins]
        gate:
          type: predict
          question: What should each pass through the improvement cycle aim for?
          options: ['Some improvement in cost, time or quality', 'Perfection in one big redesign', 'A more detailed costing system']
          answer: 0
          explain: Small, continuous improvements, cycle after cycle; each pass starts from the new measurements.
      - say: |
          Choosing a treatment takes structured thinking. The **Kepner-Tregoe method** asks four questions in turn: what
          is going on, why did it happen, what should we do, and what could go wrong with the plan?
        define: [kepner-tregoe]
        gate:
          type: predict
          question: Cavite has chosen quick-change dies for Custom Bracket. Now it asks how the die supplier and the setup crews might react. Which Kepner-Tregoe step is that?
          options: [Potential problem analysis, Decision analysis, Problem analysis, Situation appraisal]
          answer: 0
          explain: Looking ahead for what could go wrong with a chosen plan is potential problem analysis. Finding why there are 800 setups was problem analysis; choosing the dies was decision analysis.
      - say: |
          ABM data reaches beyond the accounting office, to three groups: operations, who run the processes; sales, who
          manage the customers; and procurement, who choose the suppliers.
        show: [kt]
        gate:
          type: reflect
          prompt: Custom Bracket's setup data lands on all three desks. What could operations, sales and procurement each do with it?
          model: |
            Operations can cut changeover time or run similar orders back to back. Sales can add a charge to small
            orders. Procurement can ask the die supplier for tooling that changes over faster. The
            management accountant brings the numbers to all three as a business partner.
      - say: Check the distinction.
        gate:
          type: practice
          template: abm-mcq
    takeaway: ABC tells you what an activity costs; ABM asks whether it should exist and acts on the answer, cycle after cycle.

  - id: value-or-waste
    title: Would the customer pay for this?
    goal: Which of a furniture maker's six activities actually add value?
    skills: [pva]
    data: [cordillera]
    stage:
      - id: bins
        widget: DropBins
        props: { chips: '@cordillera.chips', bins: '@cordillera.bins', solution: '@cordillera.solution' }
      - id: quality
        widget: Callout
        region: side
        hidden: true
        props:
          kind: note
          title: Four kinds of quality cost
          body: '**Prevention**: training, better design. **Appraisal**: inspection. **Internal failure**: rework before shipping. **External failure**: repairs and returns after the sale.'
      - id: actions
        widget: Text
        region: side
        hidden: true
        props:
          body: |
            **What to do with a non-value-added activity**

            1. **Eliminate** it: redesign so it no longer happens
            2. **Reduce** it: cut the time or cost it takes
            3. **Select** the cheapest way to do one you still need
            4. **Share** it: let one activity serve more output, such as one common part used in several products
    beats:
      - say: |
          **Process-value analysis** puts one test to every activity: would the customer pay for this if they could see it?
        define: [process-value-analysis]
        gate:
          type: predict
          question: Would a buyer of a Cordillera chair pay for the time its parts spend waiting for the finishing department?
          options: ['No; waiting changes nothing about the chair', 'Yes; the chair can''t be finished without it']
          answer: 0
          explain: Waiting changes nothing about the chair; it only adds cost.
      - say: |
          A **value-added activity** changes the product in a way the customer wants. A **non-value-added activity** adds
          cost but no value. The textbook names five: scheduling, moving, waiting, inspecting and storing.
        define: [value-added-activity, non-value-added-activity]
        gate:
          type: event
          prompt: Sort Cordillera's six activities.
          target: bins
          event: solved
          hint: Does the activity change the chair itself?
      - say: Inspection is the tricky one. It feels essential.
        gate:
          type: predict
          question: Why is inspecting the finished chair non-value-added even though it protects quality?
          options: [A perfectly made chair would need no inspection, Inspection happens after the chair is already built, Inspection is done by quality staff rather than carpenters]
          answer: 0
          explain: '"Necessary" is not "value-added"; prevention reduces the need for inspection.'
      - say: |
          Services have activities too. At Luzon Savings Bank a loan officer reviews each application and checks the
          applicant's credit history before the bank decides.
        gate:
          type: predict
          question: Is checking the applicant's credit history value-added?
          options: ['Yes; the check produces the lending decision the customer came for', 'No; like inspecting a chair, it only checks work already done']
          answer: 0
          explain: In a bank the review and the credit check are the service itself; they produce the decision. Re-checking a form because it was filled in wrong would be inspection, and non-value-added.
      - say: |
          **Quality costs** come in four kinds. Seen through a value lens, failure costs are pure waste, and inspection
          becomes waste once prevention works.
        define: [quality-costs]
        show: [quality]
        gate:
          type: predict
          question: Cordillera spends money on all four kinds. Which spending would ABM grow rather than cut?
          options: ['Training carpenters to join frames right the first time', 'Inspecting every finished chair before it ships', 'Re-gluing loose joints found before shipping', 'Repairing chairs returned under warranty']
          answer: 0
          explain: Prevention builds quality in, so it is largely value-added. Inspection, rework and warranty repairs exist only because defects might happen or did happen.
      - say: |
          Just-in-time (JIT) production makes only what the next step needs, when it needs it. It attacks moving and
          waiting with the **manufacturing cell**: the machines for one product family side by side, run by multi-skilled
          workers.
        define: [manufacturing-cell]
        hide: [quality]
        show: [actions]
        gate:
          type: predict
          question: 'Cordillera rebuilds its line as a cell: the saw sits beside the assembly bench, and cut pieces pass straight from hand to hand. What happened to "moving cut pieces to the assembly station"?'
          options: [Eliminate, Reduce, Select, Share]
          answer: 0
          explain: No move is left, so the activity is eliminated. A cell that only shortened the trip would reduce it.
      - say: Half of Cordillera's listed activities add no value.
        gate:
          type: reflect
          prompt: Studies find that non-value-added time can be 60–90% of the time a product spends in a traditional plant. Why is that good news for a manager?
          model: |
            It is a large improvement opportunity that needs no new equipment or harder work: cutting waiting and moving
            reduces cost, inventory and lead time while leaving the value-added work unchanged.
      - say: Practice on the bank.
        gate:
          type: practice
          template: pva-match
    takeaway: Only activities the customer would pay for add value; the rest are eliminated, reduced, done the cheapest way or shared.

  - id: why-800
    title: Why does Custom Bracket need 800 setups?
    goal: How do you find the cause behind an activity cost, not just its size?
    skills: [driver-analysis]
    data: [brackets, fishbone]
    state: { stUpTo: 0 }
    derive:
      - { fn: setups, in: { products: '@brackets.products', costPerSetup: '@brackets.costPerSetup', upTo: '@stUpTo' }, out: st }
    stage:
      - id: sheet
        widget: Schedule
        props: { title: Setups by product, columns: [Custom Bracket, Standard Bracket], rows: '@st.rows' }
      - id: whys
        widget: Text
        region: side
        hidden: true
        props:
          body: |
            **Five whys**

            1. Why is setup cost so high? 800 setups a year.
            2. Why 800 setups? Orders arrive in small batches.
            3. Why small batches? Sales accepts any order size.
            4. Why does sales take them? Nobody linked order size to production cost.
            5. Why not? Setup cost was buried in one plantwide rate until ABC traced it.
      - id: bins
        widget: DropBins
        hidden: true
        props: { chips: '@fishbone.chips', bins: '@fishbone.bins', solution: '@fishbone.solution' }
    beats:
      - say: |
          The ABC module asked what drives setup cost: the number of setups. **Driver analysis** asks the deeper
          question: why are there so many setups at all?
        define: [driver-analysis]
        gate:
          type: predict
          question: Custom Bracket makes 20,000 units a year with 800 setups. What is its average batch size, in units per setup?
          answer: { value: 25, tol: 0.5 }
          explain: '$20{,}000 \div 800 = 25$ units per setup.'
      - say: |
          Batches of 25. At ₱1,000 a setup, every Custom Bracket carries ₱40 of setup cost. Standard Bracket's cost cells
          are still blank.
        set: { stUpTo: 1 }
        gate:
          type: predict
          question: What is Standard Bracket's setup cost per unit?
          answer: { value: 1.25, tol: 0.005 }
          explain: '$100 \times 1{,}000 \div 80{,}000 = ₱1.25$, or ₱1,000 ÷ its batches of 800 units: 32 times less than Custom Bracket.'
      - say: |
          The **five whys** trace a symptom upstream: each answer becomes the next question. Here the root cause is a
          sales policy and a costing habit, far from the factory floor.
        define: [five-whys]
        set: { stUpTo: 2 }
        show: [whys]
        gate:
          type: predict
          question: Which fix addresses that root cause?
          options: ['A minimum order size for customers', 'A faster changeover procedure', 'More setup crews on every shift']
          answer: 0
          explain: Each cause points to a different fix; small batches call for order policy, not shop-floor speed.
      - say: |
          Not every problem has one clear chain of whys. Batangas Steel's inspection cost tripled while its volume rose
          only 10%, and many things could be behind it. A **fishbone diagram** sorts the possible causes into six
          categories.
        define: [fishbone-diagram]
        hide: [whys]
        show: [bins]
        gate:
          type: event
          prompt: Place each possible cause on its bone.
          target: bins
          event: solved
          hint: Processes, equipment, materials, people, environment, management.
      - say: |
          Data can test the candidates. A **regression** estimates how much each candidate moves the cost. Its trap is
          **multicollinearity**: candidates that rise and fall together, so the data can't tell which one matters.
        define: [regression, multicollinearity]
        gate:
          type: reflect
          prompt: You run a regression of setup cost on batch size, product complexity and customer. Why might the results mislead?
          model: |
            The candidates may move together: small-batch customers may also order the most complex products. Then the
            regression can't separate their effects and may blame the wrong cause. Drop or combine the correlated
            candidates, or gather data that breaks the link (complex products in big batches).
      - say: Toyota used the same five whys on a worker's injury. Put its chain in order.
        gate:
          type: practice
          template: whys-order
    takeaway: An activity count is a symptom; ask why until you reach a cause you can act on, and test candidates against data.

  - id: customer-b
    title: The customer who looked second best
    goal: Which of Rizal Wholesale's customers really makes money?
    skills: [customer-profit]
    data: [rizal, davao]
    state: { scenario: current, cuUpTo: 0 }
    derive:
      - { fn: customers, in: { pools: '@rizal.pools', customers: '@rizal.customers', consolidated: '@rizal.consolidated', scenario: '@scenario', upTo: '@cuUpTo' }, out: cu }
      - { fn: whale, in: { pools: '@davao.pools', customers: '@davao.customers' }, out: wh }
    stage:
      - id: sheet
        widget: Schedule
        props: { title: Rizal Wholesale Distributors, columns: [Customer A, Customer B, Customer C], rows: '@cu.rows' }
      - id: rank
        widget: Readout
        region: side
        props:
          items:
            - { label: Ranked by gross margin, value: '{=cu.rankGm}' }
            - { label: Ranked by operating profit, value: '{=cu.rankShown}', tone: accent }
      - id: pick
        widget: Choice
        region: side
        hidden: true
        props:
          label: Customer B orders
          options:
            - { value: current, label: As now }
            - { value: consolidated, label: Consolidated }
        bind: { value: scenario }
      - id: whale
        widget: Chart
        hidden: true
        props: { kind: line, series: '@wh.series', xLabel: 'customers, most profitable first', yLabel: '% of total profit', title: 'Davao Fruit Snacks: the whale curve' }
    beats:
      - say: |
          Rizal Wholesale ranks its customers by gross margin: A, then B, then C. **Customer profitability analysis**
          subtracts each customer's **cost to serve**: here ₱100 for every order it places and ₱200 for every delivery.
        define: [customer-profitability, cost-to-serve]
        gate:
          type: predict
          question: 'Orders and deliveries a year: A 800 and 200, B 1,000 and 900, C 200 and 400. How do the three rank by operating profit?'
          options: ['A, then C, then B', 'A, then B, then C', 'B, then A, then C', 'C, then A, then B']
          answer: 0
          explain: 'A: $200{,}000 - 120{,}000 = 80{,}000$. B: $140{,}000 - 280{,}000 = -140{,}000$. C: $120{,}000 - 100{,}000 = 20{,}000$. B, second on gross margin, comes last.'
      - say: |
          B places many small orders and wants frequent deliveries. B has offered to consolidate into 250 orders and 300
          deliveries a year: same product, same price.
        set: { cuUpTo: 1 }
        gate:
          type: predict
          question: What would B's operating profit be after consolidating?
          answer: { value: 55000, tol: 0.5 }
          explain: '$140{,}000 - (250 \times 100 + 300 \times 200) = 140{,}000 - 85{,}000 = ₱55{,}000$: a ₱195,000 swing from ordering behavior alone.'
      - say: Check it on the schedule.
        show: [pick]
        gate:
          type: when
          prompt: Switch B to 250 orders and 300 deliveries.
          when: "scenario == 'consolidated'"
          hint: Use the choice on the side.
      - say: |
          Plot cumulative profit from the most to the least profitable customer and you get the **whale curve**. Rizal's
          three customers lose money overall, so they can't show it. Davao Fruit Snacks, the Application's company, has
          eight: five profitable ones earn ₱1,995,000, and the other three lose ₱475,000.
        define: [whale-curve]
        gate:
          type: predict
          question: What share of Davao's total profit do its five profitable customers earn, in percent (one decimal place)?
          answer: { value: 131.25, tol: 0.1, percent: true }
          explain: 'Total profit is $1{,}995{,}000 - 475{,}000 = 1{,}520{,}000$, so the five earn $1{,}995{,}000 \div 1{,}520{,}000 = 131.25\%$ of it.'
      - say: |
          The curve passes 100% after three customers, peaks at 131% after five, then the loss-making tail pulls it back.
          Firms often sort customers into tiers: Tier 1 to protect and grow, Tier 2 to serve more efficiently, Tier 3 to
          renegotiate, price by activity and change behavior.
        show: [whale]
        gate:
          type: predict
          question: 'Davao''s hotel group loses ₱70,000 on 600 small orders a year. Which tier is it, and what does that tier call for?'
          options: ['Tier 3: renegotiate terms, price by activity, change its ordering', 'Tier 1: protect and grow it with a dedicated account manager', 'Tier 2: watch it and serve it more efficiently', 'No tier: drop it before the loss grows']
          answer: 0
          explain: A loss-making customer is Tier 3. The response is to change what drives its cost to serve; dropping it is the last resort.
      - say: Back to Rizal. On paper, consolidating saves ₱195,000 of order and delivery cost.
        hide: [whale]
        gate:
          type: reflect
          prompt: When is Rizal's ₱195,000 saving real, and when is it only on paper?
          model: |
            It is real only if Rizal spends less: fewer order clerks or overtime hours, fewer truck trips, or the freed
            capacity serving new, profitable orders. If the same staff and trucks stay, the ABC cost moves off B but
            company profit barely changes. Dropping B would lose its ₱140,000 margin while those costs stayed.
      - say: Compute a consolidation yourself.
        gate:
          type: practice
          template: consolidate-numeric
    takeaway: Gross margin hides cost to serve; change how a customer orders before dropping it, and cut the freed capacity to make savings real.

  - id: cheap-supplier
    title: The cheaper supplier that costs more
    goal: Which supplier is really cheaper once you count what happens after the invoice?
    skills: [tco]
    data: [suppliers, zamboanga]
    state: { tcUpTo: 1, walkUpTo: 0 }
    derive:
      - { fn: tco, in: { qty: '@suppliers.qty', suppliers: '@suppliers.suppliers', activities: '@suppliers.activities', upTo: '@tcUpTo', walkUpTo: '@walkUpTo' }, out: tc }
      - { fn: tco, in: { qty: '@zamboanga.qty', suppliers: '@zamboanga.suppliers', activities: '@zamboanga.activities' }, out: zb }
    stage:
      - id: sheet
        widget: Schedule
        props: { title: 'Total cost of ownership, 1,000 units', columns: [Supplier A, Supplier B], rows: '@tc.rows' }
      - id: player
        widget: StepPlayer
        region: bottom
        hidden: true
        props:
          fn: tcoWalk
          in: { qty: '@suppliers.qty', suppliers: '@suppliers.suppliers', activities: '@suppliers.activities' }
          roles: { journal: sheet }
      - id: zam
        widget: Schedule
        hidden: true
        props: { title: Zamboanga Seafood packaging, columns: ['Last year (1%)', 'This year (4%)'], rows: '@zb.rows' }
    beats:
      - say: |
          Supplier A quotes ₱95 a unit; Supplier B quotes ₱100. Price is only the tip of the iceberg: every supplier also
          causes receiving, inspection, rework, expediting and paperwork, each at an activity rate.
        gate:
          type: predict
          question: A delivers in 10 shipments, B in 4, and receiving costs ₱500 a delivery. How much more receiving does A cost?
          answer: { value: 3000, tol: 0.5 }
          explain: '$(10 - 4) \times 500 = ₱3{,}000$.'
      - say: |
          Each hidden cost is a rate times the driver the supplier causes. Add them to the price and you have the
          supplier's **total cost of ownership**. Play the hidden costs line by line.
        define: [total-cost-of-ownership]
        show: [player]
        gate:
          type: event
          prompt: Play the hidden costs to the end.
          target: player
          event: done
      - say: Now bring the price back in.
        gate:
          type: predict
          question: What is Supplier A's total cost of ownership per unit?
          answer: { value: 126, tol: 0.005 }
          explain: '$(95{,}000 + 31{,}000) \div 1{,}000 = ₱126$, against $(100{,}000 + 5{,}000) \div 1{,}000 = ₱105$ for B.'
      - say: |
          Supplier A: ₱5 cheaper on the invoice, ₱21 dearer per unit in reality. Quality matters even more under
          **JIT purchasing**: small, frequent, defect-free deliveries with no buffer stock.
        define: [jit-purchasing]
        set: { tcUpTo: 99 }
        gate:
          type: predict
          question: A JIT plant receives a shipment of packaging with many defects. What happens that a plant with a full warehouse would avoid?
          options: ['The line can stop: there is no stock to use instead', 'The supplier must refund the whole year''s purchases', 'Receiving cost falls because fewer units are accepted']
          answer: 0
          explain: JIT removes the safety stock, so a supplier's late or defective shipment carries straight through to production.
      - say: |
          Zamboanga Seafood buys 200,000 packages a year at ₱18 from one supplier. Last year 1% were defective and there
          were no rush shipments. This year 4% were defective, and two rush shipments cost ₱40,000 each. Reworking a
          defective package costs ₱150.
        hide: [player]
        gate:
          type: predict
          question: How much did the packaging supplier's total cost of ownership rise this year?
          answer: { value: 980000, tol: 0.5 }
          explain: '$200{,}000 \times (4\% - 1\%) \times 150 + 2 \times 40{,}000 = 900{,}000 + 80{,}000 = ₱980{,}000$.'
      - say: The price never moved. TCO is customer profitability seen from the other side.
        show: [zam]
        gate:
          type: reflect
          prompt: How should the buyer use Zamboanga's ₱980,000 figure with the packaging supplier?
          model: |
            As leverage: show the supplier what its defects cost, and ask for a quality fix, a price adjustment that
            covers the rework, or both, with switching suppliers as the fallback. Price alone would have shown no change.
      - say: Compare two suppliers yourself.
        gate:
          type: practice
          template: tco-numeric
    takeaway: Choose suppliers on total cost of ownership; poor quality shows up as your inspection, rework and expediting.

  - id: cycle-clock
    title: The clock on the factory floor
    goal: How much of a batch's time in the plant actually adds value?
    skills: [cycle-metrics]
    state: { process: 3.5, inspect: 1, move: 1, wait: 4.5, cyUpTo: 0 }
    derive:
      - { fn: cycle, in: { process: '@process', inspect: '@inspect', move: '@move', wait: '@wait', upTo: '@cyUpTo' }, out: cy }
    stage:
      - id: sheet
        widget: Schedule
        props: { title: 'Marikina Shoe, one batch (hours)', rows: '@cy.rows' }
      - id: wait
        widget: Slider
        region: side
        hidden: true
        props: { label: Waiting time (hours), min: 0, max: 6, step: 0.5, format: 1 }
        bind: { value: wait }
      - id: move
        widget: Slider
        region: side
        hidden: true
        props: { label: Moving time (hours), min: 0, max: 2, step: 0.25, format: 2 }
        bind: { value: move }
      - id: errata
        widget: Callout
        region: side
        hidden: true
        props:
          kind: errata
          title: Erratum
          body: 'If you''re reading the slide: it calls this redesign "30% faster throughput". Cycle time is 30% shorter; throughput (velocity) rises about 43%.'
    beats:
      - say: |
          A batch of shoes spends 3.5 hours being cut, stitched and assembled, 1 hour in inspection, 1 hour moving and
          4.5 hours waiting. All four together make its **cycle time**: the clock from start to finish.
        define: [cycle-time]
      - say: |
          **Manufacturing cycle efficiency** (MCE) asks how much of that clock adds value: processing time over cycle
          time. The cost-flows module's notes on JIT call the same ratio the value-added share.
        define: [manufacturing-cycle-efficiency]
        gate:
          type: predict
          question: What is the batch's MCE, in percent?
          answer: { value: 35, tol: 0.05, percent: true }
          explain: '$3.5 \div (3.5 + 1 + 1 + 4.5) = 3.5 \div 10 = 35\%$; 65% of the time adds no value.'
      - say: The schedule now shows cycle time and MCE. Marikina rearranges into cells. Attack the biggest waste.
        set: { cyUpTo: 2 }
        show: [wait, move]
        gate:
          type: when
          prompt: Cut waiting time until MCE reaches 50%.
          when: 'cy.mce >= 0.5'
          hint: 'Processing stays 3.5 hours, so cycle time must fall to 7 hours.'
      - say: |
          **Velocity** is units produced over cycle time: how fast output flows. A new example, timed in days: one
          100-unit order with 2 days of processing takes 10 days in all, so it moves at 10 units a day.
        define: [velocity]
        gate:
          type: predict
          question: Removing waste cuts the order's cycle time from 10 days to 4. What is its velocity now, in units a day?
          answer: { value: 25, tol: 0.005 }
          explain: '$100 \div 4 = 25$ units a day, 2.5 times faster, with the same 2 days of processing.'
      - say: |
          Back to the shoes: the cells cut the batch's cycle time from 10 hours to 7, which is 30% shorter. Velocity is
          units per hour, and the batch size didn't change.
        set: { wait: 1.5, move: 1 }
        gate:
          type: predict
          question: By what percent does the batch's velocity rise (nearest whole percent)?
          answer: { value: 42.86, tol: 0.5, percent: true }
          explain: 'Velocity is units ÷ cycle time, so it is multiplied by $10 \div 7 = 1.43$: a rise of about 43%, not 30%.'
      - say: A 30% shorter cycle is a 43% faster flow. Many reports mix the two up.
        show: [errata]
        gate:
          type: reflect
          prompt: Why do "30% shorter" and "43% faster" describe the same change?
          model: |
            Velocity is units ÷ cycle time. Cutting the denominator from 10 to 7 multiplies velocity by 10 ÷ 7 = 1.43. A
            shorter cycle and a faster flow are reciprocal: if cycle time falls by x%, velocity rises by 1 ÷ (1 − x) − 1,
            always more than x%.
      - say: Compute MCE yourself.
        gate:
          type: practice
          template: mce-numeric
    takeaway: MCE is processing time over cycle time; cutting waiting and moving raises MCE and velocity without anyone working faster.

  - id: kaizen-loop
    title: The cycle that never ends
    goal: How do this module's tools fit together into one habit?
    skills: [abc-to-abm]
    data: [kaizen]
    stage:
      - id: bins
        widget: DropBins
        props: { chips: '@kaizen.chips', bins: '@kaizen.bins', solution: '@kaizen.solution' }
      - id: tools
        widget: Text
        region: side
        hidden: true
        props:
          body: |
            **The ABM toolkit**

            | Tool | The question it answers |
            |---|---|
            | Process-value analysis | Does this activity add value? |
            | Driver analysis | Why does it happen at all? |
            | Customer profitability | Which customers cost more than they earn? |
            | Supplier costing | What does a supplier really cost? |
            | Performance measures | How long does it take, and how much adds value? |
    beats:
      - say: |
          Every scene in this module was part of the Kaizen loop: measure, find the waste, diagnose, act, measure again.
          Put five moves from the cases on the loop.
        gate:
          type: event
          prompt: Place each move on its step of the loop.
          target: bins
          event: solved
          hint: Is the move finding a number, judging it, explaining it, changing something, or checking the change?
      - say: |
          Each tool answers one question, and they share the same activity data. Cutting waiting shortens cycle time,
          raises MCE and velocity, and lowers the cost of the waiting activity, all at once.
        show: [tools]
        gate:
          type: predict
          question: A plant's MCE is stuck at 20%, and most of the lost time is batches queuing for one oven. Which tool comes next?
          options: ['Driver analysis: find out why batches queue for the oven', 'Process-value analysis: confirm that the queue is waste', 'Supplier costing: compare the suppliers of a second oven', 'Customer profitability: find who orders the most batches']
          answer: 0
          explain: The measure already shows the waste, and queuing is clearly non-value-added. The next step is the cause, so driver analysis; buying an oven before knowing why batches queue may fix the wrong thing.
      - say: |
          Run together, ABC and ABM give more accurate costs, better pricing and product-mix decisions, and lower cost
          from removing non-value-added work.
        gate:
          type: predict
          question: Cavite's ABM team makes four promises to its board. Which one can it not keep?
          options: ['Product costs with no estimates left in them', 'Prices that reflect what each product uses', 'Lower cost from cutting waiting and moving', 'Clearer choices about which customers to serve']
          answer: 0
          explain: Activity rates are still set in advance from budgets, so ABC/ABM costs remain estimates. The other three are the usual benefits of a combined system.
      - say: Match each tool to its question, without the table.
        hide: [tools]
        gate:
          type: practice
          template: toolkit-match
      - say: One last loop.
        gate:
          type: reflect
          prompt: Marikina's cells cut waiting from 4.5 hours to 1.5. Which other numbers in this module would that one change move, and why?
          model: |
            Cycle time falls from 10 to 7 hours, so MCE rises from 35% to 50% and velocity by about 43%, because cycle
            time is the denominator of both. Less waiting also means less work in process to store and move, so the cost
            of those non-value-added activities falls. The next Kaizen pass starts from the new, shorter clock.
    takeaway: ABM is one loop of measure, find waste, diagnose, act and re-measure; its five tools share the same activity data.
