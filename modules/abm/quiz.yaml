  - id: abm-explain
    type: explain
    skills: [abc-to-abm]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: pva }
    prompt: Explain the difference between activity-based costing and activity-based management, using an example.
    model: |
      ABC is a costing technique: it measures what activities cost and traces them to products and customers. ABM uses that
      information to manage: it asks whether each activity adds value and how to do it better or stop doing it. For example, ABC
      shows that setups cost ₱400 each; ABM then works to cut setup time or the number of setups.
    checklist:
      - ABC measures and assigns the cost of activities
      - ABM acts on that information to improve or eliminate activities
      - ABM relies on ABC's data; it doesn't replace it
      - A concrete example of acting on an activity cost
    hints: [One measures, the other manages.]
    explanation: ABC answers "what does it cost?"; ABM answers "what should we do about it?".

  - id: pva-cloze
    type: code-fill
    lang: text
    skills: [pva]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: math-code, id: pva }
    prompt: Fill in the process-value-analysis terms.
    code: |
      An activity the customer is willing to pay for is __BLANK_1__-added. Moving, waiting, inspecting, storing and scheduling add
      cost but no value, so they are __BLANK_2__-value-added. Processing time ÷ total cycle time is the manufacturing cycle
      __BLANK_3__.
    blanks:
      '1': { accept: [value], hint: 'v…' }
      '2': { accept: [non, non-value, not], hint: 'n…' }
      '3': { accept: [efficiency, efficiency (MCE), MCE], hint: 'e…' }
    hints: [The last one is abbreviated MCE.]
    explanation: Value-added vs non-value-added activities; MCE = processing time ÷ cycle time.

