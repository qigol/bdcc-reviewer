  # ------------------------------------------------------------------ new formats (case, find-error, two-tier, explain, cloze)
  - id: customer-case
    type: case
    skills: [customer-profit]
    difficulty: 3
    tags: [math, application]
    generator: customerQ
    lessonRef: { tab: math-code, id: customers }
    prompt: |
      **A hardware distributor's money-losing customer.** It earns a gross margin of {=gm|money} on {=orders|comma} orders and
      {=dels|comma} deliveries a year. Order processing costs ₱{=oRate} per order and delivery ₱{=dRate} per delivery.
    parts:
      - type: numeric
        prompt: The customer's cost to serve this year (₱)
        answer: { var: cost, tol: 0.5 }
        explanation: '{=orders|comma} × ₱{=oRate} + {=dels|comma} × ₱{=dRate} = {=cost|money}.'
      - type: numeric
        prompt: Its operating profit this year (₱; negative for a loss)
        answer: { var: profit, tol: 0.5 }
        explanation: '{=gm|money} − {=cost|money} = {=profit|money}.'
      - type: two-tier
        prompt: What should the distributor try first?
        options: ['Change how the customer orders and receives goods', 'Drop the customer', 'Raise all its prices by the size of the loss']
        answer: 0
        reasons:
          - The loss comes from ordering behavior, which drives the cost to serve and can change
          - A customer with a loss can never become profitable
          - Prices are the only lever on customer profit
        reasonAnswer: 0
        optionFeedback:
          1: Dropping a customer is the last resort, after its cost drivers have been tackled.
          2: A blanket price rise ignores what causes the cost and may lose the customer.
        reasonFeedback:
          1: Changing order and delivery patterns can turn the loss around.
          2: Activity drivers such as orders and deliveries are levers too.
        explanation: Fewer, larger orders and consolidated deliveries cut the cost to serve.
      - type: numeric
        prompt: If it consolidates into {=newOrders|comma} orders and {=newDels|comma} deliveries at the same margin, what is its new operating profit (₱)?
        answer: { var: newProfit, tol: 0.5 }
        explanation: '{=gm|money} − ({=newOrders|comma} × ₱{=oRate} + {=newDels|comma} × ₱{=dRate}) = {=newProfit|money}.'
    hints:
      - Cost to serve = orders × order rate + deliveries × delivery rate.
    explanation: Cost to serve {=cost|money} turns the margin into {=profit|money}; consolidating cuts it to {=newCost|money}, for a profit of {=newProfit|money}.

