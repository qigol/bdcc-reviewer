templates:
  # ------------------------------------------------------------------ ABC to ABM
  - id: abm-mcq
    type: mcq
    skills: [abc-to-abm]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: math-code, id: abc-to-abm }
    prompt: Which statement best distinguishes activity-based management from activity-based costing?
    options:
      - ABC measures what activities cost; ABM uses that information to decide whether and how activities should be done
      - ABM is a more detailed version of ABC with more cost pools
      - ABC is for manufacturers; ABM is for service firms
      - ABM replaces ABC once costs are accurate
    answer: 0
    hints: [Diagnosis or treatment?]
    explanation: ABC is a costing technique; ABM is a management philosophy that acts on ABC's data.

  - id: toolkit-match
    type: match
    skills: [abc-to-abm]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: kaizen-loop }
    prompt: Match each ABM tool to the question it answers.
    pairs:
      - ['Process-value analysis', 'Does this activity add customer value?']
      - ['Driver analysis', 'Why does this activity happen at all?']
      - ['Customer profitability', 'Which customers cost more than they are worth?']
      - ['Supplier costing', 'What does buying from this supplier really cost?']
      - ['Performance measures', 'How long does the process take, and how much of it adds value?']
    explanation: Classify, diagnose, apply to customers and suppliers, then measure.

  - id: kt-order
    type: order
    skills: [abc-to-abm]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: diagnosis-treatment }
    prompt: Put the four Kepner-Tregoe steps in the order the method works through them.
    items:
      - Situation appraisal (what is going on?)
      - Problem analysis (why did it happen?)
      - Decision analysis (what should we do?)
      - Potential problem analysis (what could go wrong with the plan?)
    explanation: Clarify and prioritize, find the cause, choose among alternatives, then protect the plan.

  - id: kaizen-order
    type: order
    skills: [abc-to-abm]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: diagnosis-treatment }
    prompt: Put one pass of the Kaizen improvement cycle in order.
    items:
      - Measure the process as it is
      - Identify the non-value-added work
      - Diagnose what causes it
      - Act to remove or reduce it
      - Measure again to confirm the improvement
    explanation: Measure, find the waste, diagnose its cause, act, and re-measure; the new measurement starts the next pass.

  - id: benefits-multi
    type: multi
    skills: [abc-to-abm]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: kaizen-loop }
    prompt: Which are benefits of a combined ABC/ABM system? Select all that apply.
    options:
      - More accurate product and service costs
      - Better pricing, service-mix and product-strategy decisions
      - Cost reduction by eliminating non-value-added activities
      - Elimination of all estimates from the cost system
    answer: [0, 1, 2]
    hints: [Activity rates are still predetermined.]
    explanation: ABC/ABM improves costs, decisions and control; rates remain estimates.

  # ------------------------------------------------------------------ process-value analysis
  - id: pva-match
    type: match
    skills: [pva]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: value-or-waste }
    prompt: 'Luzon Savings Bank: classify each loan-processing activity.'
    pairs:
      - ['Reviewing the application for completeness', 'Value-added']
      - ['Waiting in a queue for a loan officer', 'Non-value-added']
      - ['Verifying the credit history', 'Value-added']
      - ['Filing paperwork in the physical archive', 'Non-value-added']
    hints: [In a bank, which steps produce the lending decision the customer came for?]
    explanation: In a bank, reviewing the application and verifying the credit history are the service itself; they produce the lending decision the customer came for. Waiting in a queue and filing paperwork add nothing the customer wants. Re-checking a form because it was filled in wrong would be inspection, and non-value-added.

  - id: action-match
    type: match
    skills: [pva]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: math-code, id: pva }
    prompt: Match each response to the non-value-added activity it fits best.
    pairs:
      - ['Digitize records so the physical archive is no longer needed', 'Eliminate']
      - ['Cut queue time by balancing workstation capacity', 'Reduce']
      - ['Choose the cheapest of three ways to do a required safety inspection', 'Select']
      - ['Use one common component in three products, so a single setup serves all of them', 'Share']
    explanation: 'Eliminate it, reduce its time or cost, select the cheapest way to do it, or share it across more output: the four responses to a non-value-added activity.'

  - id: necessary-mcq
    type: mcq
    skills: [pva]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: pva }
    prompt: A food plant must inspect every batch for food safety. How does process-value analysis classify the inspection?
    options:
      - Non-value-added but necessary for now; reduce the need for it through prevention
      - Value-added, because the law requires it
      - Value-added, because customers want safe food
      - Neither; required activities are excluded from the analysis
    answer: 0
    hints: [Would a perfectly made batch need inspecting?]
    explanation: Necessary is not the same as value-added; prevention makes appraisal activity redundant over time.

  - id: nva-multi
    type: multi
    skills: [pva]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: math-code, id: pva }
    prompt: Which of these are typically non-value-added? Select all that apply.
    options:
      - Moving work in process between stations
      - Waiting for the next machine
      - Inspecting for defects
      - Scheduling production
      - Storing finished goods in a warehouse
      - Assembling the product
      - Stitching the shoe upper to its sole
    answer: [0, 1, 2, 3, 4]
    hints: [The textbook names five classic non-value-added activities.]
    explanation: Scheduling, moving, waiting, inspecting and storing add cost but not product value; assembling and stitching transform the product.

  - id: quality-mcq
    type: mcq
    skills: [pva]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: value-or-waste }
    prompt: Seen through a value-added lens, which [[quality-costs|quality costs]] should be eliminated?
    options:
      - Internal and external failure costs such as rework and warranty claims
      - Prevention costs such as training and process design
      - All four categories equally
      - None; quality costs are always value-added
    answer: 0
    hints: [Which categories exist only because something already went wrong?]
    explanation: Prevention is largely value-added; failure is entirely non-value-added; appraisal becomes non-value-added once prevention works.

  # ------------------------------------------------------------------ driver analysis
  - id: setup-numeric
    type: numeric
    skills: [driver-analysis]
    difficulty: 1
    tags: [math]
    generator: setupQ
    lessonRef: { tab: math-code, id: setups }
    prompt: |
      Product A: {=unitsA|comma} units a year with {=setupsA|comma} setups. Product B: {=unitsB|comma} units with
      {=setupsB|comma} setups. Each setup costs {=cost|money}. What is Product A's setup cost **per unit**?
    answer: { var: perA, tol: 0.005 }
    hints:
      - Setup cost = setups × cost per setup.
      - Divide by A's units.
    explanation: '${=setupsA|comma} \times {=cost|comma} \div {=unitsA|comma} = ₱{=perA|2f}$ per unit, against ₱{=perB|2f} for B. A runs batches of {=batchA|comma}.'

  - id: setup-fill
    type: schedule-fill
    skills: [driver-analysis]
    difficulty: 1
    tags: [journal]
    generator: setupQ
    lessonRef: { tab: math-code, id: setups }
    prompt: Complete the setup-cost comparison (₱{=cost|comma} per setup).
    columns: [Product A, Product B]
    rows: '@rows'
    hints:
      - Setup cost = setups × cost per setup; per unit = that ÷ units.
    explanation: 'A: ₱{=perA|2f} per unit; B: ₱{=perB|2f}. The gap of ₱{=gap|2f} is a batch-size problem before it is a cost problem.'

  - id: whys-order
    type: order
    skills: [driver-analysis]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: why-800 }
    prompt: 'Toyota''s five whys for an employee injury: put the answers in the order the whys uncover them.'
    items:
      - There was an oil spill on the machining floor
      - A pressing machine was leaking oil
      - The seal was of poor quality
      - Low-cost, below-specification seals came from a new supplier
      - A company-wide directive told teams to cut costs
    explanation: Each answer becomes the next question; the root cause (a cost-cutting directive) is far from the floor.

  - id: root-mcq
    type: mcq
    skills: [driver-analysis]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: math-code, id: setups }
    prompt: Investigation shows Custom Bracket's changeovers each take three hours because the dies are bolted by hand. Which action addresses that root cause?
    options:
      - A changeover-time project (SMED, Single-Minute Exchange of Dies)
      - A minimum order quantity for customers
      - Smarter production scheduling
      - Raising Custom Bracket's price
    answer: 0
    hints: [Match the fix to the cause you found.]
    explanation: 'Slow changeovers call for SMED; small batches for order policy; poor sequencing for scheduling.'

  - id: growth-numeric
    type: numeric
    skills: [driver-analysis]
    difficulty: 2
    tags: [math]
    generator: growthQ
    lessonRef: { tab: math-code, id: root-cause }
    prompt: |
      A plant's inspection cost rose from {=before|money} to {=after|money} while production volume grew {=gPct}%. The
      inspection procedure did not change. How much of the increase can volume **not** explain?
    answer: { var: unexplained, tol: 0.5 }
    hints:
      - Expected cost if only volume drove it = last year's cost × (1 + growth).
    explanation: 'Expected ${=before|comma} \times (1 + {=gPct}\%) = {=expected|money}$; unexplained ${=after|comma} - {=expected|comma} = {=unexplained|money}$. Look for a rising defect rate.'

  - id: fishbone-match
    type: match
    skills: [driver-analysis]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: why-800 }
    prompt: Place each cause of rising rejects on its fishbone category.
    pairs:
      - ['A worn die on the stamping press', 'Equipment']
      - ['Resin from a new supplier', 'Materials']
      - ['New operators without training', 'People']
      - ['Factory heat warping parts', 'Environment']
      - ['Incentives that reward speed over quality', 'Management']
    explanation: Ishikawa's six bones are processes, equipment, materials, people, environment and management.

  - id: collinear-mcq
    type: mcq
    skills: [driver-analysis]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: root-cause }
    prompt: An analyst runs a [[regression]] of setup cost on batch size, product complexity and customer, and it says more complex products have cheaper setups. What is the likely problem?
    options:
      - The candidate drivers are correlated with each other (multicollinearity)
      - Setup cost has no drivers
      - The sample is too large
      - Regression cannot be used on cost data
    answer: 0
    hints: [Do the customers with small batches also order the most complex products?]
    explanation: Correlated candidates blur each other's effects; drop or combine them, or gather data that breaks the correlation.

  # ------------------------------------------------------------------ customer profitability
  - id: consolidate-numeric
    type: numeric
    skills: [customer-profit]
    difficulty: 2
    tags: [math]
    generator: customerQ
    lessonRef: { tab: math-code, id: customers }
    prompt: |
      A customer earns a gross margin of {=gm|money} on {=orders|comma} orders and {=dels|comma} deliveries a year. Order
      processing costs ₱{=oRate} per order and delivery ₱{=dRate} per delivery. The customer agrees to consolidate into
      {=newOrders|comma} orders and {=newDels|comma} deliveries, same margin. What is its new operating profit?
    answer: { var: newProfit, tol: 0.5 }
    hints:
      - New cost to serve = new orders × order rate + new deliveries × delivery rate.
    explanation: 'Before: ${=gm|comma} - {=cost|comma} = {=profit|money}$. After: ${=gm|comma} - {=newCost|comma} = {=newProfit|money}$, a swing of {=swing|money}.'

  - id: customer-handcalc
    type: hand-calc
    skills: [customer-profit]
    difficulty: 2
    tags: [math]
    generator: customerQ
    lessonRef: { tab: math-code, id: customers }
    prompt: |
      Gross margin {=gm|money}; {=orders|comma} orders at ₱{=oRate} and {=dels|comma} deliveries at ₱{=dRate}. Proposed:
      {=newOrders|comma} orders and {=newDels|comma} deliveries.
    steps:
      - prompt: Current cost to serve (₱)
        answer: { var: cost, tol: 0.5 }
      - prompt: Current operating profit (₱, a loss as negative)
        answer: { var: profit, tol: 0.5 }
      - prompt: Cost to serve after consolidation (₱)
        answer: { var: newCost, tol: 0.5 }
      - prompt: Operating profit after consolidation (₱)
        answer: { var: newProfit, tol: 0.5 }
    hints:
      - Rates times drivers, then subtract from gross margin.
    explanation: 'From {=profit|money} to {=newProfit|money}, with no change in price or product.'

  - id: customer-fill
    type: schedule-fill
    skills: [customer-profit]
    difficulty: 1
    tags: [journal]
    generator: customerQ
    lessonRef: { tab: math-code, id: customers }
    prompt: |
      Complete the customer's profitability before and after it consolidates from {=orders|comma} orders and
      {=dels|comma} deliveries to {=newOrders|comma} and {=newDels|comma}.
    columns: [Before, After]
    rows: '@rows'
    hints:
      - Each cost line is driver quantity × rate.
    explanation: 'Operating profit goes from {=profit|money} to {=newProfit|money}.'

  - id: respond-mcq
    type: mcq
    skills: [customer-profit]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: customer-b }
    prompt: Customer profitability analysis shows a wholesale customer losing money on many small orders and rush deliveries. What should come first?
    options:
      - Change what drives its cost to serve, through minimum orders, consolidated deliveries or activity-based pricing
      - Drop the customer before the loss grows, since its gross margin cannot cover its cost to serve
      - Raise its prices across the board by the size of the loss, whatever it orders
      - Move part of its cost to serve onto the profitable customers, so every customer breaks even
    answer: 0
    hints: [Is the loss caused by the customer itself, or by how it orders?]
    explanation: The loss comes from ordering behavior, which can change. Dropping the customer is the last resort, and a strategic customer may be worth keeping anyway; shifting its cost onto others just hides it.

  - id: swing-mcq
    type: mcq
    skills: [customer-profit]
    difficulty: 3
    tags: [application]
    lessonRef: { tab: intuition, id: customer-b }
    prompt: |
      A customer agrees to consolidate its orders, and its activity-based [[cost-to-serve|cost to serve]] falls by
      ₱195,000. The distributor keeps the same order clerks and the same delivery trucks, and finds no new work for them.
      What happens to the distributor's total profit next year?
    options:
      - Little changes; the cost moves off this customer but the company still pays for the clerks and trucks
      - It rises by ₱195,000, because that much activity cost is no longer caused
      - It rises by the customer's whole new operating profit, now that it pays its way
      - It falls by ₱195,000, because the other customers now absorb that cost
    answer: 0
    hints: [Did the company spend any less on order processing and delivery?]
    explanation: An activity cost only falls when the resources behind it are cut or put to other profitable work. Until then the ₱195,000 is unused capacity, and next year's activity rates rise to absorb it.

  - id: tier-match
    type: match
    skills: [customer-profit]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: customer-b }
    prompt: Match each customer tier to its strategy.
    pairs:
      - ['Tier 1, most profitable', 'Protect and grow; dedicated account management']
      - ['Tier 2, moderately profitable', 'Monitor; improve service efficiency']
      - ['Tier 3, marginal or unprofitable', 'Renegotiate, price by activity, change behavior']
    explanation: Tiering gives sales a shared, defensible language for prioritizing customers.

  - id: whale-mcq
    type: mcq
    skills: [customer-profit]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: customer-b }
    prompt: What does a whale curve of customer profitability typically show?
    options:
      - A few customers earn more than 100% of total profit, and a tail of customers gives some of it back
      - Profit spread evenly across customers
      - That most customers are unprofitable and should be dropped
      - That the largest customers are always the most profitable
    answer: 0
    hints: [Plot cumulative profit, most profitable first.]
    explanation: The insight is concentration, not that most customers are bad.

  - id: whale-handcalc
    type: hand-calc
    skills: [customer-profit]
    difficulty: 3
    tags: [math]
    generator: whaleQ
    lessonRef: { tab: intuition, id: customer-b }
    prompt: |
      A distributor's cost to serve is ₱{=oRate} per order and ₱{=dRate} per delivery, assigned to the customer who causes it.

      | Customer | Gross margin | Orders | Deliveries |
      |---|---|---|---|
      {=table}

      Build the top of its whale curve.
    steps:
      - prompt: Total operating profit of all customers (₱)
        answer: { var: total, tol: 0.5 }
      - prompt: Operating profit of the profitable customers only (₱)
        answer: { var: peakProfit, tol: 0.5 }
      - prompt: That as a percent of total operating profit (one decimal place)
        answer: { var: peakPct, tol: 0.06, percent: true }
    hints:
      - Operating profit = gross margin − orders × order rate − deliveries × delivery rate, for each customer.
      - The whale curve peaks once every profitable customer is added.
    explanation: 'Total profit {=total|money}; the {=peakCount} profitable customers earn {=peakProfit|money}, which is {=peakPct|1}% of it. The {=losers} loss-makers give back {=lossTotal|money}.'

  # ------------------------------------------------------------------ supplier TCO
  - id: tco-numeric
    type: numeric
    skills: [tco]
    difficulty: 2
    tags: [math]
    generator: tcoQ
    lessonRef: { tab: math-code, id: tco }
    prompt: |
      You need {=qty|comma} units. Supplier A charges ₱{=pA} a unit; Supplier B ₱{=pB}. Activity costs and drivers:

      | Activity | Rate | Supplier A | Supplier B |
      |---|---|---|---|
      {=table}

      What is Supplier A's total cost of ownership?
    answer: { var: tcoA, tol: 0.5 }
    hints:
      - TCO = price × quantity + Σ rate × driver.
    explanation: 'A: ${=wrongPriceOnly|comma} + {=hiddenA|comma} = {=tcoA|money}$ (₱{=unitA|2f} a unit); B: {=tcoB|money} (₱{=unitB|2f}). The cheaper invoice costs {=diff|money} more.'

  - id: tco-fill
    type: schedule-fill
    skills: [tco]
    difficulty: 2
    tags: [journal]
    generator: tcoQ
    lessonRef: { tab: math-code, id: tco }
    prompt: |
      {=qty|comma} units; Supplier A ₱{=pA}, Supplier B ₱{=pB} a unit.

      | Activity | Rate | Supplier A | Supplier B |
      |---|---|---|---|
      {=table}

      Complete the total-cost-of-ownership schedule.
    columns: [Supplier A, Supplier B]
    rows: '@rows'
    hints:
      - Each activity line is rate × that supplier's driver quantity.
    explanation: 'Hidden costs {=hiddenA|money} vs {=hiddenB|money}; TCO {=tcoA|money} vs {=tcoB|money}.'

  - id: tco-handcalc
    type: hand-calc
    skills: [tco]
    difficulty: 3
    tags: [math]
    generator: tcoQ
    lessonRef: { tab: intuition, id: cheap-supplier }
    prompt: |
      You need {=qty|comma} units. Supplier A charges ₱{=pA} a unit; Supplier B ₱{=pB}. Activity costs and drivers:

      | Activity | Rate | Supplier A | Supplier B |
      |---|---|---|---|
      {=table}

      Decide which supplier to use, and by how much.
    steps:
      - prompt: Supplier A's hidden activity costs (₱)
        answer: { var: hiddenA, tol: 0.5 }
      - prompt: Supplier A's total cost of ownership (₱)
        answer: { var: tcoA, tol: 0.5 }
      - prompt: Supplier B's total cost of ownership (₱)
        answer: { var: tcoB, tol: 0.5 }
      - prompt: How much more does Supplier A cost in total than Supplier B (₱)?
        answer: { var: diff, tol: 0.5 }
    hints:
      - Each hidden line is the rate × that supplier's driver quantity.
      - TCO = price × quantity + hidden costs. Compare totals, not prices.
    explanation: 'A: ${=wrongPriceOnly|comma} + {=hiddenA|comma} = {=tcoA|money}$; B: {=tcoB|money}. Choose Supplier B: it is {=diff|money} cheaper in total, although its invoice is {=priceGap|money} higher.'

  - id: mirror-mcq
    type: mcq
    skills: [tco, customer-profit]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: math-code, id: tco }
    prompt: Why is supplier total cost of ownership called the mirror image of customer profitability analysis?
    options:
      - Both assign activity costs to the outside party that causes them, one on the selling side and one on the buying side
      - Both use gross margin as the starting point
      - Both are required by financial reporting standards
      - Both only look at purchase price
    answer: 0
    hints: [Who causes the hidden costs in each case?]
    explanation: Customers cause order and delivery cost; suppliers cause receiving, inspection, rework and expediting cost.

  - id: defect-numeric
    type: numeric
    skills: [tco]
    difficulty: 3
    tags: [math]
    generator: defectQ
    lessonRef: { tab: math-code, id: tco-defects }
    prompt: |
      You buy {=units|comma} units a year at ₱{=price} each. The supplier's defect rate rose from {=oldPct}% to {=newPct}%;
      each defective unit costs ₱{=rework} to rework, and this year you also paid for rush replacement shipments
      ({=rush} at {=rushCost|money} each). What is this year's total cost of ownership?
    answer: { var: tcoNew, tol: 0.5 }
    hints:
      - Count every cost the supplier causes this year, not just the invoice.
    explanation: 'This year {=tcoNew|money}; at last year''s rate (no rush shipments) {=tcoOld|money}; the increase is {=increase|money} even though the price never changed.'

  - id: defect-fill
    type: schedule-fill
    skills: [tco]
    difficulty: 1
    tags: [journal]
    generator: defectQ
    lessonRef: { tab: math-code, id: tco-defects }
    prompt: |
      {=units|comma} units at ₱{=price}; rework ₱{=rework} per defective unit; defects {=oldPct}% last year and
      {=newPct}% this year; rush shipments this year: {=rush} at {=rushCost|money} each (none last year). Complete the schedule.
    columns: [Last year, This year]
    rows: '@rows'
    hints:
      - Rework = units × defect rate × rework cost.
    explanation: 'TCO {=tcoOld|money} → {=tcoNew|money}.'

  - id: defect-rise-numeric
    type: numeric
    skills: [tco]
    difficulty: 3
    tags: [math]
    generator: defectQ
    lessonRef: { tab: math-code, id: tco-defects }
    prompt: |
      You buy {=units|comma} units a year at ₱{=price} each. The supplier's defect rate rose from {=oldPct}% last year to
      {=newPct}% this year; each defective unit costs ₱{=rework} to rework. This year you also paid for {=rush} rush
      replacement shipments at {=rushCost|money} each; last year there were none. By what percent did the supplier's total
      cost of ownership rise? (Percent, to one decimal place.)
    answer: { var: increasePct, tol: 0.06, percent: true }
    hints:
      - Work out each year's TCO = purchase price + rework (+ rush shipments this year).
      - Percent rise = (this year − last year) ÷ last year.
    explanation: 'Last year {=tcoOld|money}; this year {=tcoNew|money}; the rise is ${=increase|comma} \div {=tcoOld|comma} = {=increasePct|1}\%$ with the price unchanged.'

  - id: jit-mcq
    type: mcq
    skills: [tco]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: cheap-supplier }
    prompt: Why does total cost of ownership matter even more under JIT purchasing?
    options:
      - With no buffer inventory, a late or defective shipment can stop production
      - JIT suppliers always charge higher prices
      - JIT eliminates the need for receiving
      - Under JIT inspection becomes value-added
    answer: 0
    hints: [What absorbs a bad shipment in a traditional plant?]
    explanation: JIT removes the safety stock, so supplier reliability and quality carry straight through to production.

  # ------------------------------------------------------------------ cycle time, MCE, velocity
  - id: mce-numeric
    type: numeric
    skills: [cycle-metrics]
    difficulty: 1
    tags: [math]
    generator: mceQ
    lessonRef: { tab: math-code, id: mce }
    prompt: |
      A batch spends {=process} hours in processing, {=inspect} in inspection, {=move} moving and {=wait} waiting. What is
      its manufacturing cycle efficiency? (Percent, to one decimal place, e.g. 27.8 for 27.8%.)
    answer: { var: mcePct, tol: 0.06, percent: true }
    hints:
      - Cycle time = processing + inspection + moving + waiting.
