  - id: wait-two-tier
    type: two-tier
    skills: [cycle-metrics]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: mce }
    prompt: A plant halves the time products spend waiting between machines; processing time is unchanged. What happens to manufacturing cycle efficiency?
    options: [It rises, It falls, It stays the same]
    answer: 0
    reasons:
      - Cycle time shrinks while processing time stays the same, so processing is a bigger share
      - Waiting time adds value, so cutting it lowers MCE
      - MCE depends only on processing time
    reasonAnswer: 0
    optionFeedback:
      1: Less non-value-added time can only raise the value-added share.
      2: The denominator, cycle time, got smaller.
    reasonFeedback:
      1: Waiting is non-value-added.
      2: MCE is processing ÷ cycle time, so cycle time matters too.
    hints: [MCE = processing time ÷ cycle time.]
