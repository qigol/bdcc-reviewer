  # ------------------------------------------------------------------ cycle time, MCE, velocity
  - id: mce-numeric
    type: numeric
    skills: [cycle-metrics]
    difficulty: 1
    tags: [math]
    generator: mceQ
    lessonRef: { tab: math-code, id: mce }
    prompt: |
      A batch spends {=process} hours in processing, {=inspect} in inspection, {=move} moving and {=wait} waiting. What is
      its manufacturing cycle efficiency? (Percent, to one decimal place, e.g. 27.8 for 27.8%.)
    answer: { var: mcePct, tol: 0.06, percent: true }
    hints:
      - Cycle time = processing + inspection + moving + waiting.
      - MCE = processing ÷ cycle time.
    explanation: 'Cycle time $= {=total}$ hours; MCE $= {=process} \div {=total} = {=mcePct|1}\%$.'

  - id: mce-handcalc
    type: hand-calc
    skills: [cycle-metrics]
    difficulty: 2
    tags: [math]
    generator: mceQ
    lessonRef: { tab: math-code, id: mce }
    prompt: |
      Processing {=process} h, inspection {=inspect} h, moving {=move} h, waiting {=wait} h. Cells then cut waiting to
      {=newWait} h. Give MCE as a percent to one decimal place.
    steps:
      - prompt: Cycle time before (hours)
        answer: { var: total, tol: 0.005 }
      - prompt: MCE before (%, one decimal place)
        answer: { var: mcePct, tol: 0.06, percent: true }
      - prompt: Cycle time after (hours)
        answer: { var: newTotal, tol: 0.005 }
      - prompt: MCE after (%, one decimal place)
        answer: { var: newMcePct, tol: 0.06, percent: true }
    hints:
      - Processing time does not change.
    explanation: 'MCE rises from {=mcePct|1}% to {=newMcePct|1}% from waiting alone.'

  - id: velocity-numeric
    type: numeric
    skills: [cycle-metrics]
    difficulty: 2
    tags: [math]
    generator: velocityQ
    lessonRef: { tab: math-code, id: velocity }
    prompt: |
      An order of {=units} units takes {=b_process} days processing, {=b_inspect} inspection, {=b_move} moving and
      {=b_wait} in queue. Work cells halve moving time to {=a_move} days and queue time falls to {=a_wait} days. What is
      the new velocity in units per day? (One decimal place.)
    answer: { var: velAfter, tol: 0.06 }
    hints:
      - Velocity = units ÷ cycle time.
    explanation: 'Cycle time {=before} → {=after} days; velocity {=velBefore|2} → {=velAfter|2} units a day ({=speedup|2}×).'

  - id: velocity-rise-numeric
    type: numeric
    skills: [cycle-metrics]
    difficulty: 3
    tags: [math]
    generator: velocityQ
    lessonRef: { tab: intuition, id: cycle-clock }
    prompt: |
      An order of {=units} units takes {=b_process} days processing, {=b_inspect} inspection, {=b_move} moving and
      {=b_wait} in queue. Work cells halve moving time to {=a_move} days and queue time falls to {=a_wait} days. By what
      percent does velocity rise? (Percent, to one decimal place.)
    answer: { var: risePct, tol: 0.06, percent: true }
    hints:
      - Velocity = units ÷ cycle time, so compare the two cycle times.
      - Percent rise = old cycle time ÷ new cycle time − 1.
    explanation: 'Cycle time falls {=cutPct|1}% ({=before} → {=after} days), but velocity rises by ${=before} \div {=after} - 1 = {=risePct|1}\%$: from {=velBefore|2} to {=velAfter|2} units a day.'

