terms:
  - id: activity-based-management
    term: Activity-based management
    aka: [ABM]
    short: Using activity-based cost information to improve operations by eliminating non-value-added activity, redesigning processes and judging the true profitability of products, customers and suppliers.
    related: [process-value-analysis, driver-analysis]
    skills: [abc-to-abm]
  - id: kaizen
    term: Kaizen
    aka: [continuous improvement]
    short: Continuous, incremental improvement; ABM runs as a cycle of measure, identify waste, diagnose, act and re-measure.
    related: [activity-based-management]
    skills: [abc-to-abm]
  - id: kepner-tregoe
    term: Kepner-Tregoe method
    aka: [Kepner-Tregoe, Rational Process]
    short: A structured decision method in four parts; assess the situation, analyze the problem's cause, decide among alternatives, and plan for potential problems.
    related: [driver-analysis]
    skills: [abc-to-abm]
  - id: process-value-analysis
    term: Process-value analysis
    aka: [PVA]
    short: The systematic evaluation of every activity in a process to decide whether it adds value from the customer's point of view.
    related: [value-added-activity, non-value-added-activity]
    skills: [pva]
  - id: value-added-activity
    term: Value-added activity
    aka: [value-added]
    short: An activity the customer would pay for if they could see it happening; it directly transforms the product, like machining or assembly.
    related: [non-value-added-activity]
    skills: [pva]
  - id: non-value-added-activity
    term: Non-value-added activity
    aka: [non-value-added]
    short: An activity that adds cost but no value for the customer, such as moving, waiting, inspecting or storing; it may still be necessary for now.
    related: [value-added-activity]
    skills: [pva]
  - id: manufacturing-cell
    term: Manufacturing cell
    aka: [cells, work cells]
    short: Machines grouped by product family and arranged in sequence, so products flow from one machine to the next with little moving or waiting.
    related: [non-value-added-activity]
    skills: [pva, cycle-metrics]
  - id: driver-analysis
    term: Driver analysis
    short: The search for the root causes of activity costs; asking why an activity happens at all and this often, not just what it costs.
    related: [five-whys, fishbone-diagram]
    skills: [driver-analysis]
  - id: five-whys
    term: Five whys
    aka: [5 whys]
    short: A Toyota root-cause technique; ask "why?" repeatedly, each answer becoming the next question, until the real cause appears.
    related: [driver-analysis, fishbone-diagram]
    skills: [driver-analysis]
  - id: fishbone-diagram
    term: Fishbone diagram
    aka: [Ishikawa diagram, fishbone]
    short: Ishikawa's diagram that groups a problem's possible causes into processes, equipment, materials, people, environment and management.
    related: [five-whys]
    skills: [driver-analysis]
  - id: customer-profitability
    term: Customer profitability analysis
    aka: [customer profitability, cost to serve]
    short: ABC applied to customers; gross margin less the order, delivery and service costs each customer causes gives its true profit.
    formula: '\text{Operating profit} = \text{Gross margin} - \sum \text{rate} \times \text{driver used}'
    related: [whale-curve]
    skills: [customer-profit]
  - id: whale-curve
    term: Whale curve
    short: Cumulative profit plotted from most to least profitable customer; it rises above 100% of total profit and falls back as loss-making customers are added.
    related: [customer-profitability]
    skills: [customer-profit]
  - id: total-cost-of-ownership
    term: Total cost of ownership
    aka: [TCO]
    short: A supplier's purchase price plus the hidden activity costs of doing business with it, such as receiving, inspection, rework, expediting and paperwork.
    formula: '\text{TCO} = \text{Purchase price} + \sum \text{driver} \times \text{activity rate}'
    related: [customer-profitability]
    skills: [tco]
  - id: jit-purchasing
    term: JIT purchasing
    aka: [just-in-time purchasing]
    short: Buying in small, frequent, defect-free deliveries triggered by actual demand; with no buffer stock, supplier quality matters even more.
    related: [total-cost-of-ownership]
    skills: [tco]
  - id: cycle-time
    term: Cycle time
    aka: [throughput time]
    short: The total time from the start of production to completion; processing plus inspection, moving and waiting time.
    formula: '\text{Cycle time} = \text{Process} + \text{Inspect} + \text{Move} + \text{Wait}'
    related: [manufacturing-cycle-efficiency, velocity]
    skills: [cycle-metrics]
  - id: manufacturing-cycle-efficiency
    term: Manufacturing cycle efficiency
    aka: [MCE]
    short: Value-added (processing) time divided by total cycle time; the share of time in production that actually adds value.
    formula: '\text{MCE} = \frac{\text{Processing time}}{\text{Cycle time}}'
    related: [cycle-time]
    skills: [cycle-metrics]
  - id: velocity
    term: Velocity
    aka: [manufacturing velocity, process velocity]
    short: Units produced divided by cycle time; how fast output flows through the process.
    formula: '\text{Velocity} = \frac{\text{Units produced}}{\text{Cycle time}}'
    related: [cycle-time]
    skills: [cycle-metrics]
