examples:
  - id: cordillera
    source: 'Session 8, slide 30 (Example 2)'
    fn: classify
    in: { activities: '@cordillera.activities' }
    expect: { va: 3, nva: 3, nvaShare: 0.5 }
  - id: luzon
    source: 'Session 8, slide 71 (Example 8)'
    fn: classify
    in: { activities: '@luzon.activities' }
    expect: { va: 3, nva: 2, eliminate: Filing paperwork in the physical archive }
  - id: brackets
    source: 'Session 8, slide 36 (Example 3); per-unit figures derived'
    fn: setups
    in: { products: '@brackets.products', costPerSetup: '@brackets.costPerSetup' }
    expect: { ratio: 8, costA: 800000, costB: 100000, perUnitA: 40, perUnitB: 1.25, batchA: 25, batchB: 800 }
  - id: batangas
    source: 'Session 8, slide 72 (Example 9); expected cost derived'
    fn: costGrowth
    in: { before: '@batangas.before', after: '@batangas.after', volumeGrowth: '@batangas.volumeGrowth' }
    expect: { expected: 330000, unexplained: 570000, multiple: 3 }
  - id: rizal
    source: 'Session 8, slides 47–48 (Example 5)'
    fn: customers
    in: { pools: '@rizal.pools', customers: '@rizal.customers' }
    expect: { rates.orders: 100, rates.deliveries: 200, cost.A: 120000, cost.B: 280000, cost.C: 100000, profit.A: 80000, profit.B: -140000, profit.C: 20000, rankGm: A > B > C, rankProfit: A > C > B }
  - id: rizal-consolidated
    source: 'Session 8, slide 73 (Example 10)'
    fn: customers
    in: { pools: '@rizal.pools', customers: '@rizal.customers', consolidated: '@rizal.consolidated', scenario: consolidated }
    expect: { cost.B: 85000, profit.B: 55000 }
  - id: tco-iceberg
    source: 'Session 8, slide 56 (illustrative TCO)'
    fn: tco
    in: { qty: '@suppliers.qty', suppliers: '@suppliers.suppliers', activities: '@suppliers.activities' }
    expect: { base.A: 95000, base.B: 100000, hidden.A: 31000, hidden.B: 5000, total.A: 126000, total.B: 105000, perUnit.A: 126, perUnit.B: 105, best: Supplier B }
  - id: zamboanga
    source: 'Session 8, slide 75 (Example 12)'
    fn: tco
    in: { qty: '@zamboanga.qty', suppliers: '@zamboanga.suppliers', activities: '@zamboanga.activities' }
    expect: { total.last: 3900000, total.now: 4880000, hidden.now: 1280000, diff: 980000 }
  - id: marikina-mce
    source: 'Session 8, slide 63 (Example 7)'
    fn: cycle
    in: { process: '@marikina.before.process', inspect: '@marikina.before.inspect', move: '@marikina.before.move', wait: '@marikina.before.wait' }
    expect: { total: 10, mce: 0.35, nvaShare: 0.65, biggest: waiting }
  - id: marikina-cells
    source: 'Session 8, slide 74 (Example 11)'
    fn: cycleCompare
    in: { before: '@marikina.before', after: '@marikina.after' }
    expect: { before: 10, after: 7, mceBefore: 0.35, mceAfter: 0.5, cut: 0.3 }
  - id: order-100
    source: 'Session 8, slides 67–68 (illustrative)'
    fn: cycleCompare
    in: { before: '@order100.before', after: '@order100.after', units: '@order100.units', unit: day }
    expect: { before: 10, after: 4, mceBefore: 0.2, mceAfter: 0.5, velBefore: 10, velAfter: 25, cut: 0.6 }
  - id: davao-whale
    source: 'Application case (synthetic)'
    fn: whale
    in: { pools: '@davao.pools', customers: '@davao.customers' }
    expect: { total: 1520000, peakShare: 1.3125, peakCount: 5, losers: 3, lossTotal: 475000, worst: Online resellers }
  - id: davao-tco
    source: 'Application case (synthetic)'
    fn: tco
    in: { qty: '@davao.supply.qty', suppliers: '@davao.supply.suppliers', activities: '@davao.supply.activities' }
    expect: { total.X: 2388000, total.Y: 2292700, diff: 95300, best: Supplier Y }
