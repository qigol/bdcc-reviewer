    parts:
      - type: numeric
        prompt: The CFR quote
        answer: { var: priceCfr, tol: 0.5 }
        misconceptions:
          - { var: wrongFob, feedback: 'That is only the FOB price. CFR adds freight.' }
        explanation: 'CFR = FOB + freight = {=priceCfr|comma}.'
      - type: numeric
        prompt: The CIF quote
        answer: { var: priceCif, tol: 0.5 }
        explanation: 'CIF = FOB + freight + insurance = {=priceCif|comma}.'
      - type: two-tier
        prompt: Under an FOB quote, who pays the freight to the destination port?
        options: [The buyer, The seller, 'They split it equally']
        answer: 0
        reasons:
          - FOB means the seller's job ends once the goods are on board
          - FOB means the seller delivers to the buyer's door
          - Incoterms always split transport costs
        reasonAnswer: 0
        reasonFeedback:
          1: Delivery to the door is a D-term, not FOB.
          2: Each term assigns costs to one side; nothing is split by default.
        explanation: Under FOB the buyer takes over at the ship's rail and pays the freight.
    hints: [Each term adds costs on top of FOB.]
    explanation: CFR {=priceCfr|comma}; CIF {=priceCif|comma}; under FOB the buyer pays freight and insurance.

