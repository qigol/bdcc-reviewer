templates:
  # ------------------------------------------------------------------ legal-systems
  - id: law-systems-match
    type: match
    skills: [legal-systems]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: kinds-of-law }
    prompt: Match each legal system to its main feature.
    pairs:
      - ['[[civil-law|Civil law]]', 'Written codes that try to cover every area; judges question witnesses']
      - ['[[common-law|Common law]]', 'Earlier court decisions guide later ones; the trial is adversarial']
      - ['[[religious-law|Religious law]]', 'A religious source is the basis of the law']
    hints:
      - Which system depends on earlier judgments?
    explanation: Civil law is codified, common law grows from precedent, and religious law rests on a religious source.

  - id: common-law-mcq
    type: mcq
    skills: [legal-systems]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: kinds-of-law }
    prompt: In a common law system, a defendant is…
    options:
      - Presumed innocent until proven guilty
      - Presumed guilty until proven innocent
      - Questioned by the judge only
      - Judged only by religious leaders
    answer: 0
    optionFeedback:
      1: "Common law presumes innocence; the burden of proof is on the prosecution."
      2: "Questioning by the judge is the inquisitorial style of civil law; common law trials are adversarial."
      3: "Judgment by religious leaders describes religious law, not common law."
    hints:
      - Think of who has to prove the case.
    explanation: In common law trials are adversarial and the defendant is presumed innocent until proven guilty.

  - id: civil-law-multi
    type: multi
    skills: [legal-systems]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: kinds-of-law }
    prompt: Which statements are true of civil law?
    options:
      - It is based on codification
      - It comes from ancient Roman law
      - It is the most widespread system in the world
      - Judges actively question the prosecution, the defense and the witnesses
      - It depends mainly on precedent
    answer: [0, 1, 2, 3]
    optionFeedback:
      0: "Yes: civil law rests on written codes."
      1: "Yes: it descends from Roman law."
      2: "Yes: it's the most widespread system."
      3: "Yes: civil-law judges are inquisitorial."
      4: "Reliance on precedent is the mark of common law."
    hints:
      - Which option describes common law instead?
    explanation: Civil law relies on written codes, not precedent, and its judges are inquisitorial.

  - id: precedent-mcq
    type: mcq
    skills: [legal-systems]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: kinds-of-law }
    prompt: A judge decides a case the same way an earlier court decided a similar one. The judge is following…
    options:
      - Precedent
      - A treaty
      - A trade secret
      - Extraterritoriality
    answer: 0
    optionFeedback:
      1: "A treaty is an agreement between countries."
      2: "A trade secret is confidential business information."
      3: "Extraterritoriality is applying a law beyond a country's borders."
    hints:
      - Which word means an earlier decision?
    explanation: Following earlier decisions is the use of precedent, central to common law.
    variants:
      - prompt: A judge applies a detailed written code passed by the legislature, rather than earlier rulings. Which legal tradition does that reflect?
        options:
          - Civil law
          - Common law
          - Religious law
          - Customary law only
        answer: 0
        optionFeedback:
          1: Common law relies on precedent.
          2: Religious law is based on religious texts.
          3: Customary law relies on tradition, not codes.
        explanation: Civil law is based on codification.
      - prompt: A Philippine court cites a 1990 Supreme Court decision to settle a similar dispute. What is the court relying on?
        options:
          - Precedent
          - A treaty
          - A trade secret
          - Arbitration
        answer: 0
        optionFeedback:
          1: A treaty is between countries.
          2: A trade secret is business information.
          3: Arbitration is a private alternative to court.
        explanation: Following an earlier ruling is relying on precedent.

  # ------------------------------------------------------------------ corruption-index
  - id: cpi-change-numeric
    type: numeric
    skills: [corruption-index]
    difficulty: 1
    tags: [math]
    generator: cpiQ
    lessonRef: { tab: math-code, id: cpi-ranks }
    prompt: |
      In the Corruption Perceptions Index, **{=country}** ranked **{=earlier}** in {=from} and **{=later}** in {=to}. By how many places did its rank change? (Positive if it improved, negative if it got worse.)
    answer: { var: change, tol: 0.5 }
    misconceptions:
      - { var: wrongSign, feedback: 'You have the sign backwards. A smaller rank number is better, so a fall in the number is an improvement.' }
      - { var: wrongEarlier, feedback: 'That is the earlier rank itself. Subtract the later rank from it.' }
    hints:
      - A smaller rank number means less corruption.
      - Change = earlier rank minus later rank.
    explanation: |
      $ {=earlier} - {=later} = {=change}$, so the rank {=direction}.

  - id: cpi-handcalc
    type: hand-calc
    skills: [corruption-index]
    difficulty: 2
    tags: [math]
    generator: cpiQ
    lessonRef: { tab: math-code, id: cpi-ranks }
    prompt: |
      Use the Corruption Perceptions Index table for **{=country}** between {=from} and {=to}.
    steps:
      - prompt: What was the rank in {=from}?
        answer: { var: earlier, tol: 0.5 }
        misconceptions:
          - { var: later, feedback: 'That is the rank in the later year.' }
        hint: Find the column for the earlier year.
      - prompt: What was the rank in {=to}?
        answer: { var: later, tol: 0.5 }
        misconceptions:
          - { var: earlier, feedback: 'That is the rank in the earlier year.' }
        hint: Find the column for the later year.
      - prompt: By how many places did the rank change (positive = improved)?
        answer: { var: change, tol: 0.5 }
        misconceptions:
          - { var: wrongSign, feedback: 'Check the sign. Earlier minus later is positive when the rank number falls.' }
        hint: Earlier minus later.
    hints:
      - Find the two ranks first.
    explanation: |
      Ranks: {=earlier} then {=later}. Change $= {=earlier} - {=later} = {=change}$.

  - id: cpi-gap-numeric
    type: numeric
    skills: [corruption-index]
    difficulty: 1
    tags: [math]
    generator: cpiGapQ
    lessonRef: { tab: math-code, id: cpi-ranks }
    prompt: |
      In {=year}, **{=a}** ranked **{=ra}** and **{=b}** ranked **{=rb}** in the Corruption Perceptions Index. How many places apart were they?
    answer: { var: gap, tol: 0.5 }
    misconceptions:
      - { var: wrongSum, feedback: 'You added the ranks. The distance between them is their difference.' }
      - { var: ra, feedback: 'That is just one country''s rank. Subtract one rank from the other.' }
    hints:
      - How far apart are two positions in a list?
      - Subtract the smaller rank from the larger.
    explanation: |
      $|{=ra} - {=rb}| = {=gap}$ places.

  - id: cpi-compare-mcq
    type: mcq
    skills: [corruption-index]
    difficulty: 1
    tags: [math]
    generator: cpiGapQ
    lessonRef: { tab: math-code, id: cpi-ranks }
    prompt: |
      In {=year}, **{=a}** ranked **{=ra}** and **{=b}** ranked **{=rb}** in the Corruption Perceptions Index. Which was seen as less corrupt?
    hints:
      - Rank 1 is the best.
    explanation: |
      The smaller rank number is better, so the country ranked {=cleaner} was seen as less corrupt.

  - id: fcpa-mcq
    type: mcq
    skills: [corruption-index]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: rule-and-corruption }
    prompt: What does the U.S. Foreign Corrupt Practices Act forbid?
    options:
      - Paying foreign government officials to receive special treatment
      - Paying any foreign supplier for goods
      - Hiring foreign workers
      - Selling goods abroad
    answer: 0
    optionFeedback:
      1: "Paying suppliers for goods is ordinary business."
      2: "The act is about bribery, not hiring."
      3: "Exporting is legal; bribing officials to win business isn't."
    hints:
      - The word corrupt is the clue.
    explanation: The act forbids bribing foreign officials. Facilitating payments for routine services are allowed.

  - id: cpi-code
    type: code-fill
    skills: [corruption-index]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: cpi-ranks }
    prompt: Complete the function that finds how a rank changed.
    code: |
      def rank_change(earlier, later):
          return __BLANK_1__ - __BLANK_2__
    blanks:
      '1': { accept: ['earlier'] }
      '2': { accept: ['later'] }
    hints:
      - A positive answer should mean the country improved.
    explanation: Earlier minus later is positive when the rank number got smaller.

  - id: rule-law-multi
    type: multi
    skills: [corruption-index]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: rule-and-corruption }
    prompt: Which are true about the rule of law?
    options:
      - Countries governed by the rule of law tend to attract foreign investment
      - Such countries tend to protect their citizens' human rights
      - It means rulers can change the law whenever they like
      - It applies only to private companies
    answer: [0, 1]
    optionFeedback:
      0: "Yes: predictable law attracts investment."
      1: "Yes: such countries tend to protect human rights."
      2: "Under the rule of law, rulers are bound by the law too."
      3: "It binds everyone, governments included."
    hints:
      - The rule of law limits those in power.
    explanation: Under the rule of law, laws bind everyone, which encourages investment and protects rights.

  # ------------------------------------------------------------------ intl-law
  - id: public-private-match
    type: match
    skills: [intl-law]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: law-between-nations }
    prompt: Match each kind of international rule to what it governs.
    pairs:
      - ['[[public-international-law|Public international law]]', 'Relationships between governments']
      - ['[[private-international-law|Private international law]]', 'Relationships between people and companies in different countries']
      - ['[[treaty|Treaty]]', 'A formal agreement between countries']
      - ['[[customary-international-law|Customary international law]]', 'Rules that grew from customs over centuries']
    hints:
      - Which one is about companies?
    explanation: International rules come from agreements and from long custom, and apply to governments or to private parties.

  - id: arbitration-mcq
    type: mcq
    skills: [intl-law]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: settling-disputes }
    prompt: Why do many international contracts name arbitration instead of court?
    options:
      - It is usually quicker, cheaper and more private
      - A world court will always enforce its ruling
      - It avoids having any contract
      - It is required by every treaty
    answer: 0
    optionFeedback:
      1: "No world court enforces rulings, which is why the choice of forum matters."
      2: "Arbitration is named inside a contract; it doesn't replace the contract."
      3: "It's a choice the parties make, not a treaty requirement."
    hints:
      - No world court can enforce its decrees.
    explanation: Arbitration is faster, less costly and private. No worldwide court can force parties to obey.

  - id: clauses-match
    type: match
    skills: [intl-law]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: settling-disputes }
    prompt: Match each clause or term to its job.
    pairs:
      - ['[[choice-of-law|Choice-of-law provision]]', 'Says which country''s law governs the contract']
      - ['[[choice-of-forum|Choice-of-forum clause]]', 'Says where a dispute will be settled']
      - ['[[arbitration|Arbitration]]', 'Settles a dispute outside the courts']
      - ['[[litigation|Litigation]]', 'A court case to decide legal rights']
    hints:
      - Law versus place.
    explanation: A contract can fix both the law that applies and the place where disputes are settled.

  - id: extraterritorial-mcq
    type: mcq
    skills: [intl-law]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: law-between-nations }
    prompt: A country applies its antitrust law to a foreign company's actions that happen entirely abroad. This is…
    options:
      - Extraterritoriality
      - Arbitration
      - Precedent
      - Privatization
    answer: 0
    optionFeedback:
      1: "Arbitration is a way to settle disputes, not a reach of law."
      2: "Precedent is following earlier rulings."
      3: "Privatization is selling state assets."
    hints:
      - Territory means land; extra means beyond.
    explanation: Extraterritorial application means a country tries to apply its laws beyond its borders.
    variants:
      - prompt: A country fines a foreign bank for bribes paid entirely in a third country. What is this an example of?
        options:
          - Extraterritorial application of its laws
          - Arbitration
          - Privatization
          - Precedent
        answer: 0
        optionFeedback:
          1: Arbitration settles private disputes.
          2: Privatization sells state assets.
          3: Precedent is following earlier rulings.
        explanation: Applying a country's laws to conduct outside its borders is extraterritoriality.
      - prompt: Why can extraterritorial laws worry a Philippine firm that doesn't operate in the US?
        options:
          - Its dealings with US partners or in dollars can bring it under US law
          - US law applies to every company everywhere automatically
          - Only US citizens can be affected
          - It can't; laws stop at borders
        answer: 0
        optionFeedback:
          1: There must be some connection to the US.
          2: Foreign firms can be affected through links to the US.
          3: Extraterritoriality is exactly laws reaching past borders.
        explanation: Links such as US partners, listings or dollar transactions can bring foreign firms into reach.

  - id: contracts-multi
    type: multi
    skills: [intl-law]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: settling-disputes }
    prompt: Which statements about international contracts are true?
    options:
      - No worldwide court can enforce its decrees
      - The UN Convention on the International Sale of Goods helps solve jurisdiction problems
      - Cross-border litigation raises the question of which country's law applies
      - Courts everywhere must follow one world contract law
    answer: [0, 1, 2]
    optionFeedback:
      0: "Yes: there's no global enforcer."
      1: "Yes: the CISG gives common rules for sales of goods."
      2: "Yes: choice of law is a central question."
      3: "There's no single world contract law."
    hints:
      - Which option sounds too good to be true?
    explanation: There is no world court and no single contract law, which is why clauses and conventions matter.

  # ------------------------------------------------------------------ incoterms
  - id: inco-price-numeric
    type: numeric
    skills: [incoterms]
    difficulty: 1
    tags: [math]
    generator: incoQ
    lessonRef: { tab: math-code, id: incoterm-price }
    prompt: |
      Goods cost **{=fob|comma}** on board the ship (FOB price). Freight to the destination port is **{=freight|comma}** and insurance is **{=insurance|comma}**. What price does a seller quote under **{=term}**?
    answer: { var: price, tol: 0.5 }
    misconceptions:
      - { var: wrongFob, feedback: 'That is only the FOB price. CFR and CIF add freight; CIF adds insurance too.' }
      - { var: wrongAll, feedback: 'You added a cost that is not part of this term. Check what the term includes.' }
    hints:
      - CFR includes freight. CIF includes freight and insurance.
      - Start from the FOB price and add what the term covers.
    explanation: |
      Under {=term} the quote is {=price|comma}.

  - id: inco-fas-numeric
    type: numeric
    skills: [incoterms]
    difficulty: 2
    tags: [math]
    generator: incoQ
    lessonRef: { tab: math-code, id: incoterm-price }
    prompt: |
      Goods cost **{=fob|comma}** on board the ship (FOB price). Loading them onto the ship costs **{=loading|comma}**, freight is **{=freight|comma}** and insurance is **{=insurance|comma}**. What price does the seller quote under **{=term}**?
    answer: { var: price, tol: 0.5 }
    misconceptions:
      - { var: wrongFob, feedback: 'That is the FOB price. The terms differ in what the seller includes.' }
      - { var: wrongAll, feedback: 'You added everything, including costs that this term leaves to the buyer or the seller.' }
    hints:
      - FAS stops at the ship's side, before loading.
      - FAS price = FOB price minus loading. CFR and CIF add freight.
    explanation: |
      Under {=term} the quote is {=price|comma}.

  - id: inco-total-numeric
    type: numeric
    skills: [incoterms]
    difficulty: 2
    tags: [math]
    generator: incoQ
    lessonRef: { tab: math-code, id: incoterm-price }
    prompt: |
      Goods cost **{=fob|comma}** on board, freight is **{=freight|comma}** and insurance is **{=insurance|comma}**. Whatever term is used, what is the total cost of getting the goods to the destination port insured?
    answer: { var: total, tol: 0.5 }
    misconceptions:
      - { var: wrongFob, feedback: 'That leaves out freight and insurance.' }
      - { var: wrongNoIns, feedback: 'You left out insurance.' }
    hints:
      - The costs are the same; only who pays them changes.
    explanation: |
      Total $= {=fob|comma} + {=freight|comma} + {=insurance|comma} = {=total|comma}$.

  - id: inco-buyer-numeric
    type: numeric
    skills: [incoterms]
    difficulty: 3
    tags: [math]
    generator: incoQ
    lessonRef: { tab: math-code, id: incoterm-price }
    prompt: |
      Goods cost **{=fob|comma}** on board (FOB price). Loading costs **{=loading|comma}**, freight **{=freight|comma}** and insurance **{=insurance|comma}**. The seller quotes under **{=term}**. How much must the buyer pay on top of the quoted price to cover the rest of the costs to the destination port?
    answer: { var: buyerExtra, tol: 0.5 }
    misconceptions:
      - { var: wrongBuyer, feedback: 'That is the quoted price itself. Work out the costs it does not include.' }
      - { var: wrongAll, feedback: 'That is the cost of everything. Take away what the quote already includes.' }
    hints:
      - Total costs minus what the quote covers.
      - For FAS the loading is also left to the buyer.
    explanation: |
      Costs to destination (FOB + freight + insurance) are {=total|comma}. The quote covers {=price|comma}. The buyer pays {=buyerExtra|comma} more.

  - id: inco-handcalc
    type: hand-calc
    skills: [incoterms]
    difficulty: 3
    tags: [math]
    generator: incoQ
    lessonRef: { tab: math-code, id: incoterm-price }
    prompt: |
      FOB price **{=fob|comma}**, loading **{=loading|comma}**, freight **{=freight|comma}**, insurance **{=insurance|comma}**. The seller quotes under **{=term}**.
    steps:
      - prompt: What is the quoted price?
        answer: { var: price, tol: 0.5 }
        misconceptions:
          - { var: wrongFob, feedback: 'Check what this term adds to or removes from the FOB price.' }
        hint: Start at FOB and apply the term.
      - prompt: What is the total cost of getting the goods to the port insured?
        answer: { var: total, tol: 0.5 }
        misconceptions:
          - { var: wrongFob, feedback: 'Add freight and insurance to the FOB price.' }
        hint: FOB plus freight plus insurance.
      - prompt: How much does the buyer pay on top of the quote?
        answer: { var: buyerExtra, tol: 0.5 }
        misconceptions:
          - { var: wrongBuyer, feedback: 'That is the quote. Subtract it from the total.' }
        hint: Total minus quote.
    hints:
      - Take it one step at a time.
    explanation: |
      Quote {=price|comma}; total {=total|comma}; buyer pays {=buyerExtra|comma} on top.

  - id: inco-terms-match
    type: match
    skills: [incoterms]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: shipping-terms }
    prompt: Match each term to what it covers.
    pairs:
      - ['[[fas|FAS]]', 'Seller pays up to the ship''s side; risk passes alongside the ship']
      - ['[[fob|FOB]]', 'Seller puts the goods on board; risk passes on board']
      - ['[[cfr|CFR]]', 'Price includes goods and freight; buyer buys insurance']
      - ['[[cif|CIF]]', 'Price includes goods, insurance and freight']
    hints:
      - Which term covers the most?
    explanation: The four terms differ in how far the seller's costs and risk go.

  - id: inco-code
    type: code-fill
    skills: [incoterms]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: incoterm-price }
    prompt: Complete the CIF price function.
    code: |
      def cif_price(fob, freight, insurance):
          return fob + __BLANK_1__ + __BLANK_2__
    blanks:
      '1': { accept: ['freight', 'insurance'] }
      '2': { accept: ['insurance', 'freight'] }
    hints:
      - CIF stands for cost, insurance and freight.
    explanation: A CIF price covers the goods, the freight and the insurance.

  - id: inco-order
    type: order
    skills: [incoterms]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: incoterm-price }
    prompt: Put the terms in order from the one that covers the least of the seller's costs to the most (starting from FAS).
    items:
      - FAS
      - FOB
      - CFR
      - CIF
    hints:
      - What does each term add?
    explanation: FAS stops alongside the ship, FOB adds loading, CFR adds freight and CIF adds insurance.

  # ------------------------------------------------------------------ ip-rights
  - id: ip-match
    type: match
    skills: [ip-rights]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: protecting-ideas }
    prompt: Match each kind of intellectual property to what it protects.
    pairs:
      - ['[[patent|Patent]]', 'An invention or process, with exclusive rights to make and sell it']
      - ['[[trademark|Trademark]]', 'A shape, color, phrase or sound that marks a product']
      - ['[[copyright|Copyright]]', 'Works by authors, artists, composers and software makers']
      - ['[[trade-secret|Trade secret]]', 'Confidential information such as a formula']
    hints:
      - Which one needs no registration?
    explanation: Each kind of intellectual property protects a different kind of creation.

  - id: trade-secret-mcq
    type: mcq
    skills: [ip-rights]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: protecting-ideas }
    prompt: What is true of trade secrets?
    options:
      - They are the most common type of IP protection and need no government registration
      - They must be registered at the patent office
      - They only protect songs and books
      - They last forever without any effort
    answer: 0
    optionFeedback:
      1: "Trade secrets need no registration; secrecy is the protection."
      2: "Songs and books are protected by copyright."
      3: "A trade secret lasts only as long as it's kept secret."
    hints:
      - Think of a secret recipe.
    explanation: A trade secret is any confidential business information. Keeping it secret is the protection.

  - id: ip-treaties-mcq
    type: mcq
    skills: [ip-rights]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: protecting-ideas }
    prompt: Which agreement is named in the lecture as protecting copyrights?
    options:
      - The Berne Convention
      - The Madrid Agreement
      - The FCPA
      - The Jamaica Agreement
    answer: 0
    optionFeedback:
      1: "The Madrid Agreement covers trademark registration."
      2: "The FCPA is an anti-bribery law."
      3: "The Jamaica Agreement concerned exchange rates, not copyright."
    hints:
      - The Madrid Agreement covers trademarks.
    explanation: Copyrights are protected by the Berne Convention, WIPO and TRIPS. The Madrid Agreement of 1891 covers international trademark registration.

  - id: ip-multi
    type: multi
    skills: [ip-rights]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: protecting-ideas }
    prompt: Which statements about intellectual property and property rights are true?
    options:
      - Patent laws vary widely from country to country
      - Property rights can be violated by private actions such as theft and piracy
      - Property rights can also be violated by public actions such as bribes and excessive taxes
      - Intellectual property is protected the same way everywhere
    answer: [0, 1, 2]
    optionFeedback:
      0: "Yes: patent protection differs widely by country."
      1: "Yes: theft and piracy are private violations."
      2: "Yes: bribes and excessive taxes are public violations."
      3: "Protection varies by country."
    hints:
      - Which option says everywhere?
    explanation: Protection varies by country, and both private and public actions can violate property rights.

  # ------------------------------------------------------------------ national-laws
  - id: antitrust-mcq
    type: mcq
    skills: [national-laws]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: laws-at-home }
    prompt: Competitors secretly agree to charge the same high price. Which law targets this?
    options:
      - Antitrust (competition) law
      - Tort law
      - Accounting law
      - Copyright law
    answer: 0
    optionFeedback:
      1: "Tort law covers harm such as product injuries."
      2: "Accounting rules don't target price fixing."
      3: "Copyright protects creative works."
    hints:
      - Price fixing is one example named in the lecture.
    explanation: Antitrust law prevents price fixing, market sharing and monopolies.
    variants:
      - prompt: Two airlines agree to split routes so they never compete on the same one. Which law targets this?
        options:
          - Antitrust (competition) law
          - Copyright law
          - Tort law
          - Tax law
        answer: 0
        optionFeedback:
          1: Copyright protects creative works.
          2: Tort law covers harm such as injuries.
