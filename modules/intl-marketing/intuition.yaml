scenes:
  - id: mix-or-adapt
    title: One plan for the world, or a plan for each place?
    goal: A firm has a winning way to sell at home. Should it do exactly the same thing in every other country?
    skills: [standardize]
    stage:
      - id: ikea-note
        widget: Callout
        props:
          kind: note
          title: IKEA in India
          body: |
            IKEA opened its first store in India in **2018** and had **7 more by 2023**, with plans for **25** more. About
            **one-third** of its range there changes every year and about **one-third** of the items are sourced locally.
      - id: ikea-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: i1, label: A third of the range changes each year }
            - { id: i2, label: Furniture designs adjusted for local homes }
            - { id: i3, label: An on-site team assembles and delivers the furniture }
            - { id: i4, label: Prices set for the local market }
            - { id: i5, label: The in-store restaurant menu is changed }
          bins:
            - { id: prod, label: Product }
            - { id: price, label: Price }
            - { id: serv, label: Service and delivery }
          solution: { i1: prod, i2: prod, i3: serv, i4: price, i5: prod }
    beats:
      - say: |
          IKEA is famous for low-priced, cleverly designed furniture that you assemble yourself. In India it made several
          changes. What a firm decides to keep and what it decides to change is the heart of international marketing.
        show: [ikea-note]
      - say: |
          Every firm makes four sets of choices: about its product, how it promotes it, its price, and how it gets it to
          customers. Together they form the **marketing mix**. Using the same mix everywhere is **standardization**.
        define: [marketing-mix, standardization]
        gate:
          type: predict
          question: What is the main benefit that makes top managers want one global marketing mix?
          options:
            - It saves cost and keeps the marketing consistent
            - It always raises prices
            - It removes the need to know customers
            - It makes every shop smaller
          answer: 0
          explain: Standardization produces cost savings and consistent marketing, but it is harder than it sounds.
      - say: |
          Part of what stays the same is the firm's look. The **corporate visual identity** is its name, logo, slogan,
          graphics, color and typeface. Customers recognize a firm by it, so many firms keep it unchanged worldwide.
        define: [corporate-visual-identity]
      - say: |
          But standardizing is not as easy as it sounds. Many firms must change their home mix or build a new one, because
          countries differ in culture, income, law and climate. Sort IKEA's changes by the part of the mix they touch.
        hide: [ikea-note]
        show: [ikea-sorter]
        gate:
          type: event
          prompt: Place each IKEA change under the part of the mix it belongs to.
          target: ikea-sorter
          event: solved
          hint: Assembly and delivery are about how the goods reach and serve the customer.
      - say: Check the four parts of the mix.
        hide: [ikea-sorter]
        gate:
          type: practice
          template: mix-mcq
      - say: One question about the trade-off.
        gate:
          type: reflect
          prompt: Why might a firm keep its logo and colors the same but change its product in each country?
          model: |
            The look builds recognition worldwide and costs little to keep. The product often has to fit local tastes,
            income and rules, so it is where changes are most needed.
    takeaway: Firms want one marketing mix for savings and consistency, but local differences force changes.

  - id: total-product
    title: What exactly is the customer buying?
    goal: When a shopper buys a chair, what are they really paying for, and which kinds of products travel best?
    skills: [total-product]
    stage:
      - id: parts-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: p1, label: The chair itself }
            - { id: p2, label: The wood and screws }
            - { id: p3, label: The name on the tag }
            - { id: p4, label: The logo on the box }
            - { id: p5, label: Free repairs for two years }
            - { id: p6, label: Delivery and assembly }
          bins:
            - { id: phys, label: Physical product }
            - { id: brand, label: Brand and image }
            - { id: serv, label: Service and support }
          solution: { p1: phys, p2: phys, p3: brand, p4: brand, p5: serv, p6: serv }
      - id: type-tree
        widget: Tree
        hidden: true
        props:
          root:
            id: types
            label: Kinds of product
            note: How much they need to change abroad
            children:
              - id: ind
                label: Industrial products
                note: Need less adaptation, except for safety, emission or noise law
                tone: good
              - id: con
                label: Consumer products
                note: Often more adaptation, except luxury goods
                tone: warn
              - id: srv
                label: Services
                note: Less complex, with some change for custom and law
                tone: accent
    beats:
      - say: |
          A shopper buys more than an object. The **total product** is everything the customer receives: the item itself, its
          brand name, accessories, after-sales service, warranty, instructions, the package, and the company's image.
        define: [total-product]
        show: [parts-sorter]
        gate:
          type: event
          prompt: Sort each part of a chair purchase into the part of the total product.
          target: parts-sorter
          event: solved
          hint: A repair promise is a service. A name on a tag is a brand.
      - say: |
          Because there are many parts, a firm can change one and keep the others. It might keep the item and change the size
          of the pack, or keep the brand and add a new warranty.
        hide: [parts-sorter]
      - say: |
          Some products need to change far more than others. This is the product's **sensitivity to the foreign environment** ([[environmental-sensitivity]]). Which kind do you think needs the fewest changes?
        define: [environmental-sensitivity]
        gate:
          type: predict
          question: Which kind of product usually needs the least adaptation for foreign markets?
          options:
            - Industrial products
            - Everyday food and drink
            - Fashion that follows local tastes
            - Products with local religious meaning
          answer: 0
          explain: Industrial products usually need less adaptation, though safety, emission or noise rules sometimes require changes.
      - say: |
          Industrial products travel best. Consumer products often need more change, though luxury items can be sold as they
          are. Services are less complex but still bend to customs and law.
        show: [type-tree]
      - say: Test the idea on a pack size.
        hide: [type-tree]
        gate:
          type: practice
          template: size-pack-mcq
      - say: One more question about a whole bundle.
        gate:
          type: practice
          template: total-parts-multi
    takeaway: A customer buys a total product, and industrial goods need the least change abroad.

  - id: forces-change
    title: Why the same product changes abroad
    goal: What makes a product that works at home fail somewhere else?
    skills: [foreign-forces]
    stage:
      - id: forces-table
        widget: Schedule
        hidden: true
        props:
          title: Forces that push a firm to change its product
          columns: [What it affects]
          rows:
            - { label: Sociocultural forces, amounts: ['Colors, labels, brand name and the meaning of images'] }
            - { label: Legal forces, amounts: ['Safety, food and drug rules, brand registration, domain names'] }
            - { label: Economic forces, amounts: ['Pricing, packaging and production; income gaps'] }
            - { label: Physical forces, amounts: ['Climate and terrain; heat, humidity, altitude'] }
      - id: force-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: f1, label: A color that means mourning in one culture }
            - { id: f2, label: A food safety rule }
            - { id: f3, label: Low incomes call for small, cheap packs }
            - { id: f4, label: High altitude changes how the product works }
          bins:
            - { id: socio, label: Sociocultural }
            - { id: legal, label: Legal }
            - { id: eco, label: Economic }
            - { id: phys, label: Physical }
          solution: { f1: socio, f2: legal, f3: eco, f4: phys }
    beats:
      - say: |
          Four outside forces push firms to change what they sell. Culture shapes preferences. Law sets rules. Income shapes
          what people can pay. Climate and land shape how products behave. Firms cannot control any of these.
        show: [forces-table]
      - say: |
          Culture is easy to miss. An appliance maker finds that people wash clothes in different ways, so one machine does
          not fit all. Colors, labels and brand names may need to change, and an image may mean something else abroad.
        hide: [forces-table]
        show: [force-sorter]
        gate:
          type: event
          prompt: Sort each example into the force behind it.
          target: force-sorter
          event: solved
          hint: Altitude is about land and climate. A mourning color is about meaning.
      - say: Pause and make a guess before the next idea.
        gate:
          type: predict
          question: A firm uses a brand name for years at home and then enters a country where a stranger registered the same name first. In many countries, who owns the name?
          options:
            - The first registrant
            - The firm that used it first
            - The government
            - Whoever sells the most
          answer: 0
          explain: Many countries follow the first-registrant rule, unlike the order-of-use approach familiar in the United States.
      - say: |
          Law can surprise a firm too. In many countries a brand name belongs to the first person to register it, not the
          first to use it. This is the **first-registrant rule**. A firm that waits may find its own name taken.
        define: [first-registrant-rule]
        hide: [force-sorter]
      - say: Review the four forces.
        gate:
          type: practice
          template: forces-match
      - say: And the climate force.
        gate:
          type: practice
          template: climate-mcq
    takeaway: Culture, law, income and climate push firms to change products, and a brand name must be registered early.

  - id: six-strategies
    title: Mix and match the product and the message
    goal: A firm can change its product, its message, both or neither. How do these choices combine?
    skills: [product-message]
    stage:
      - id: strat-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: a1, label: One soda sold with the same ad in every country }
            - { id: a2, label: A car kept as is but advertised as a family car in one country and a luxury car in another }
            - { id: a3, label: A shampoo with a local scent and the same ad }
            - { id: a4, label: A snack with a new flavor and a new local ad }
            - { id: a5, label: A new, cheaper phone launched with the usual brand message }
            - { id: a6, label: A new low-cost stove for the same cooking need with a new message }
          bins:
            - { id: s1, label: Same product, same message }
            - { id: s2, label: Same product, different message }
            - { id: s3, label: Product adaptation, same message }
            - { id: s4, label: Product adaptation, message adaptation }
            - { id: s5, label: Different product, same message }
            - { id: s6, label: Different product for the same use, different message }
          solution: { a1: s1, a2: s2, a3: s3, a4: s4, a5: s5, a6: s6 }
      - id: brand-table
        widget: Schedule
        hidden: true
        props:
          title: Global brand values, 2023
          columns: [Rank 2023, Rank 2010, Value ($ millions)]
          rows:
            - { label: Apple, amounts: ['1', '17', '502,680'] }
            - { label: Microsoft, amounts: ['2', '3', '316,659'] }
            - { label: Amazon, amounts: ['3', '36', '276,929'] }
            - { label: Google, amounts: ['4', '4', '260,260'] }
            - { label: Samsung, amounts: ['5', '19', '91,407'] }
            - { label: Toyota, amounts: ['6', '11', '64,504'] }
            - { label: Mercedes-Benz, amounts: ['7', '12', '61,414'] }
            - { label: Coca-Cola, amounts: ['8', '1', '58,046'] }
            - { label: Nike, amounts: ['9', '25', '53,773'] }
            - { label: BMW, amounts: ['10', '15', '51,157'] }
    beats:
      - say: |
          **Promotion** is any way a firm talks to its publics: advertising, public relations, sales offers like rebates, and
          events. A firm chooses what it sells and what it says. Each can be kept or changed.
        define: [promotion]
      - say: |
          Combining a product choice with a message choice gives a **product and message strategy**. There are six common
          ones. They run from the same product with the same message everywhere to a different product with a different
          message.
        define: [product-message-strategy]
        show: [strat-sorter]
        gate:
          type: event
          prompt: Match each example to its strategy.
          target: strat-sorter
          event: solved
          hint: Ask two questions. Did the product change? Did the message change?
      - say: |
          Strong brands make the same product and message strategy easier to run. A **brand value** is what a brand is worth
          in dollars, and some firms list it on their balance sheet. Before the ranking, make a guess.
        define: [brand-value]
        hide: [strat-sorter]
        gate:
          type: predict
          question: Which brand was ranked first in the 2010 list of most valuable global brands?
          options: [Coca-Cola, Apple, Microsoft, Toyota]
          answer: 0
          explain: Coca-Cola was first in 2010 and eighth in 2023, while Apple climbed from seventeenth to first.
      - say: |
          Here is the 2023 list with the ranks of 2010. Notice how far some brands moved. Value can rise quickly and a
          famous name is not safe forever.
        show: [brand-table]
      - say: Apply the six strategies to a case.
        hide: [brand-table]
        gate:
          type: practice
          template: strategy-mcq
      - say: And the values.
        gate:
          type: practice
          template: brand-multi
    takeaway: Six strategies combine a product choice with a message choice, and brands can gain or lose value over time.

  - id: advertising
    title: Telling the story, globally or locally
    goal: Should one advertisement run everywhere, or should each country get its own?
    skills: [advertising-promo]
    state: { spread: global }
    stage:
      - id: culture-note
        widget: Callout
        hidden: true
        props:
          kind: note
          title: Culture changes what works in an ad
          body: |
            Directness versus indirectness, comparison, humor, gender roles, explicitness, sophistication, popular versus
            traditional culture, and information versus fluff.
      - id: net-note
        widget: Callout
        hidden: true
        props:
          kind: tip
          title: Why firms like Internet advertising
          body: |
            It reaches an **affluent, accessible audience**, can be **inexpensive**, is sometimes **less regulated**, is
            **interactive**, and reaches people who watch little television, such as teenagers.
      - id: spread-choice
        widget: Choice
        region: side
        hidden: true
        props:
          label: Campaign style
          style: dropdown
          options:
            - { value: global, label: One global campaign }
            - { value: programmed, label: Tested, partly adapted campaign }
            - { value: local, label: Entirely local campaign }
        bind: { value: spread }
    beats:
      - say: |
          **Advertising** is paid, non-personal presentation of ideas, goods or services by an identified sponsor. Firms use
          it for most of their promotion, and U.S. ad agencies follow their clients abroad through subsidiaries and
          partners.
        define: [advertising]
      - say: |
          Culture changes what works. Some countries prefer direct messages, some indirect. Humor, comparisons and gender
          roles all vary, and so does the taste for plain information over fluff.
        show: [culture-note]
      - say: Take a guess first. The answer comes right after.
        gate:
          type: predict
          question: Which is a typical reason to choose one global or regional campaign?
          options:
            - Lower cost and a consistent brand image
            - Matching every local joke
            - Avoiding all media
            - Making each country feel unique
          answer: 0
          explain: Global campaigns spread costs and keep the brand image consistent, though they may miss local tastes.
      - say: |
          **Global and regional advertising** uses one campaign across many countries or a whole region. It wins on cost,
          quality, brand image and economies of scale, and it is easier to send around the world.
        define: [global-advertising]
        hide: [culture-note]
      - say: |
          Firms also choose how many brands to show. Nestlé often puts a local brand next to its corporate brand, called the
          **two-brand approach**. Coca-Cola uses the **one-brand approach**, one brand with different variants.
        define: [two-brand-approach, one-brand-approach]
      - say: |
          Most firms end up in the middle. **Glocal advertising** blends a global and a local approach. In the
          **programmed-management approach**, a firm uses market tests to decide how much to individualize a campaign.
        define: [glocal-advertising, programmed-management-approach]
        show: [spread-choice]
        gate:
          type: when
          prompt: Pick the campaign style that uses market testing to decide how much to adapt.
          when: "spread == 'programmed'"
          hint: It is a middle ground, not all global and not all local.
      - say: |
          Media matter too. Satellite TV can reach the world, print has local and regional editions, and digital advertising
          leads the growth. Here is why the Internet is popular.
        hide: [spread-choice]
        show: [net-note]
      - say: Check the middle path.
        hide: [net-note]
        gate:
          type: practice
          template: glocal-mcq
      - say: And a few more tests.
        gate:
          type: practice
          template: programmed-mcq
    takeaway: Global campaigns save cost, local campaigns fit culture, and many firms use a tested middle path.

  - id: other-promotion
    title: Selling in person, offers and goodwill
    goal: Advertising is only one way to promote. What else do firms use?
    skills: [advertising-promo]
    stage:
      - id: promo-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: o1, label: A salesperson explains a machine to a factory buyer }
            - { id: o2, label: A contest with prizes }
            - { id: o3, label: A coupon that takes money off }
            - { id: o4, label: A letter to the community after a public complaint }
            - { id: o5, label: A display placed at the checkout }
          bins:
            - { id: ps, label: Personal selling }
            - { id: sp, label: Sales promotion }
            - { id: pr, label: Public relations }
          solution: { o1: ps, o2: sp, o3: sp, o4: pr, o5: sp }
    beats:
      - say: |
          **Personal selling** is selling face to face. It is widely used for industrial products and in consumer sales in
          developing countries. The Internet may help, depending on how well trust can be built. Hiring sales staff abroad
          brings its own challenges.
        define: [personal-selling]
      - say: |
          **Sales promotion** covers short-term pushes such as displays, contests, premiums, trade shows, celebrity
          offers, money-off deals and coupons. Culture limits what is acceptable.
        define: [sales-promotion]
      - say: |
          **Public relations** aims at a favorable impression rather than an immediate sale. It is overlooked in many
          international markets, but it can help in periods of public criticism.
        define: [public-relations]
        show: [promo-sorter]
        gate:
          type: event
          prompt: Put each activity under the promotion tool it uses.
          target: promo-sorter
          event: solved
          hint: Coupons and contests push sales now. A letter to the community builds goodwill.
      - say: Try the matching.
        hide: [promo-sorter]
        gate:
          type: practice
          template: promo-tools-match
      - say: And when public relations helps.
        gate:
          type: predict
          question: In which situation is public relations most useful abroad?
          options:
            - During public criticism in an international market
            - When a firm wants an instant sale
            - When a firm has no customers
            - When a coupon expires
          answer: 0
          explain: Public relations helps a firm earn a better impression when it faces public criticism.
    takeaway: Personal selling, sales promotion and public relations complement advertising.

  - id: price-and-shops
    title: What to charge and where to sell
    goal: Pricing and distribution decide whether a good product ever reaches a buyer at a fair price. How do firms choose?
    skills: [price-distribution]
    stage:
      - id: dept-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: d1, label: Prices that give steady cash flow }
            - { id: d2, label: Prices that create large sales volumes }
            - { id: d3, label: Avoiding antitrust problems }
            - { id: d4, label: The effect of prices on tax loads }
          bins:
            - { id: fin, label: Finance }
            - { id: prod, label: Production }
            - { id: legal, label: Legal }
            - { id: tax, label: Tax }
          solution: { d1: fin, d2: prod, d3: legal, d4: tax }
      - id: price-note
        widget: Callout
        hidden: true
        props:
          kind: note
          title: Culture shapes how prices are read
          body: A sale can weaken the idea of quality in Britain and Japan, so a price cut may hurt the brand there.
    beats:
      - say: |
          Pricing is complex because it touches many parts of the firm. Finance, production, legal, tax and sales all want
          something different from the price. Match each concern to the department that raises it.
        show: [dept-sorter]
        gate:
          type: event
          prompt: Match each pricing concern to its department.
          target: dept-sorter
          event: solved
          hint: Volume is a production worry. Tax people think about tax.
      - say: |
          There are two ways to set prices. **Foreign national pricing** follows market forces in the country of sale.
          **International pricing** sets the price of goods made in one country and sold in another.
        define: [foreign-national-pricing, international-pricing]
        hide: [dept-sorter]
        show: [price-note]
      - say: Before we explain, what do you think?
        gate:
          type: predict
          question: What can happen if export prices are set too low in one country?
          options:
            - Resellers may buy there and sell elsewhere at a higher price
            - Tariffs will disappear
            - The brand becomes global
            - Every competitor leaves
          answer: 0
          explain: Gray-market resellers exploit price gaps between countries and undercut the firm.
      - say: |
          Prices that are too low in a cheap market invite the **gray market**: resellers who buy where goods are cheap and
          sell where they are dear, without the maker's approval. A domestic sales manager wants export prices high enough to
          avoid it.
        define: [gray-market]
        hide: [price-note]
      - say: |
          Distribution follows its own logic. Subsidiaries usually design local channels, and the choice is long-term.
          Standardizing is often unrealistic because of local conditions, so firms start with the home model and change it as
          needed. McDonald's uses franchisers.
      - say: |
          Geography, culture and income all shape distribution. **Disintermediation** is the unraveling of traditional
          distribution structures, popularly called cutting out the middlemen.
        define: [disintermediation]
        gate:
          type: practice
          template: disintermediation-mcq
      - say: Check the distribution choice.
        gate:
          type: practice
          template: distribution-mcq
      - say: One last question for the whole module.
        gate:
          type: reflect
          prompt: Name one thing a global firm should keep the same everywhere and one thing it should adapt. Explain why.
          model: |
            A firm can keep its corporate visual identity the same because it builds recognition cheaply. It should adapt
            what local culture, law, income or climate demand, such as the product, pack size or message.
    takeaway: Prices must satisfy many departments and avoid the gray market, and distribution starts with the home model but adapts.
