intro: |
  A marketing plan has to survive contact with real shoppers, rules and shops. Follow an imaginary Philippine snack
  maker as it takes one product to a new country and decide how much to keep and how much to change.
case:
  id: sampaguita-launch
  title: Sampaguita Snacks goes abroad
  story: |
    Sampaguita Snacks, an imaginary company from Cebu, makes crunchy coconut crisps with the slogan "Taste of home".
    It plans to sell in a new country called Marava, where the climate is hot and humid. All facts below are invented
    for practice.
  cells:
    - id: product-step
      title: What changes in the product?
      say: |
        Taste tests in Marava show shoppers like the crisp but find the pack too big for their budget and the plain bag
        hard to tell apart on a shelf. Sampaguita wants to save cost where it can.
      stage:
        - id: product-table
          widget: Schedule
          props:
            title: Marava test results
            columns: [Finding]
            rows:
              - { label: The crisp itself, amounts: [Liked as is] }
              - { label: Pack size, amounts: [Too expensive for daily budgets] }
              - { label: Bag design, amounts: [Hard to spot on shelf] }
              - { label: Brand name, amounts: [Not yet known] }
      decision:
        prompt: Which strategy fits these findings best?
        type: mcq
        options:
          - Keep the crisp but adapt the pack size and bag design, with the same slogan
          - Create a completely new product and a new message
          - Cancel the launch
          - Raise the price to match the premium brands
        answer: 0
        optionFeedback:
          3: Higher prices would make an already expensive pack even less affordable.
        model: The product is liked, so only parts of the total product, pack size and package, need adapting. The message can stay the same.
    - id: name-step
      title: The brand name problem
      say: |
        A lawyer reports that a local trader registered the name "Sampaguita" for snacks in Marava three years ago, though
        Sampaguita Snacks has never sold there.
      stage:
        - id: name-note
          widget: Callout
          props:
            kind: warn
            title: From the lawyer
            body: In Marava, registrations are recorded by date, and the earliest registrant is recognized.
      decision:
        prompt: Who is most likely to own the name in Marava, and what should the firm consider?
        type: mcq
        options:
          - The local registrant owns it, so the firm should negotiate or choose another name
          - Sampaguita Snacks owns it since it used the name first at home
          - Nobody owns it
          - The government will pick a winner by lottery
        answer: 0
        model: Under a first-registrant approach, the earlier registrant holds the name, so the firm needs a deal or a new name. Registering early in every target country avoids this.
    - id: ad-step
      title: One ad or many?
      say: |
        The marketing team tested one humorous ad in three towns of Marava and measured how many viewers liked it. The
        team wants to keep the campaign mostly global but is unsure how much to change.
      stage:
        - id: ad-chart
          widget: Chart
          props:
            kind: bar
            title: Share who liked the humorous ad (hypothetical test)
            xLabel: Town
            yLabel: Percent
            series:
              - { name: Liked the ad, x: [North, Coast, Hills], y: [82, 78, 20] }
      decision:
        prompt: Which approach best follows these test results?
        type: mcq
        options:
          - Keep one core campaign and individualize it for the Hills after more tests
          - Run exactly the same ad in all three towns
          - Drop advertising in Marava
          - Make a different product for each town
        answer: 0
        optionFeedback:
          1: The Hills result shows the same ad does not work everywhere.
        model: Two towns liked the ad but the Hills did not. A programmed-management, glocal approach keeps the shared core and uses tests to individualize where needed.
    - id: price-step
      title: A price gap
      say: |
        Sampaguita sells a pack for the equivalent of 40 pesos in Marava and 55 in a neighboring country. A trader in Marava
        starts buying large quantities.
      stage:
        - id: price-note
          widget: Callout
          props:
            kind: note
            title: What the sales manager saw
            body: Large orders from one trader, shipped to the neighboring country, with no approval from the firm.
      decision:
        prompt: What is the likely problem, and how could the firm respond?
        type: open
        model: |
          The trader is a gray-market reseller who buys in the cheap market and sells in the dearer one. The firm could
          align prices more closely, limit shipments to resellers, or sell through channels it controls.
    - id: shop-step
      title: Reaching the shelves
      say: |
        Most shoppers in Marava buy from small kiosks. A new online app lets Sampaguita deliver direct, skipping
        the wholesalers. The sales team asks how to design the channel.
      stage:
        - id: shop-note
          widget: Callout
          props:
            kind: note
            title: Channel facts
            body: Wholesalers supply the kiosks, and the app could cut out the wholesaler but cannot reach kiosks on islands without roads.
      decision:
        prompt: What is the best channel decision?
        type: mcq
        options:
          - Start with the home model, use wholesalers for kiosks, and test the app where delivery is possible
          - Use only the app everywhere
          - Use no channels at all
          - Copy the channel of a rival exactly
        answer: 0
        model: Standard channels are often unrealistic locally, so the firm starts with the home model and changes it. Disintermediation by app works only where delivery is possible.
atScale:
  title: In practice
  body: |
    Global brands keep a central style guide for their corporate visual identity, give regional teams a budget to
    adapt, and run market tests before spending on a new campaign. Legal teams register brand names and domain names
    early in each market, and finance teams watch price gaps that attract gray-market resellers.
tradeoffs:
  title: How much to adapt a campaign
  columns: [Approach, Benefit, Risk]
  rows:
    - [One global campaign, Low cost and a consistent image, May miss local tastes]
    - [Glocal or programmed, 'Tested fit at moderate cost', 'More work and slower rollout']
    - [Entirely local, Strong cultural fit, 'High cost and inconsistent brand image']
connections:
  - module: legal-forces
    note: Brand registration and intellectual property rules shape what a firm can safely sell under its name.
  - module: market-entry
    note: Entry mode and market choice come before the marketing mix is set.
  - module: case-unilever-brazil
    note: The Unilever case tests the marketing mix on low-income shoppers.
  - module: case-coca-cola
    note: The Coca-Cola case shows one brand with many variants and a local-global mix.
explainBack:
  prompt: |
    Explain to a friend why a firm might keep some parts of its marketing the same abroad and change others, using the
    total product, the six strategies and the pricing concerns.
  rubric:
    - Names the marketing mix and the benefit of standardization
    - Describes at least one force that pushes for change, such as culture, law, income or climate
    - Mentions glocal or programmed-management advertising and a pricing or distribution risk
