terms:
  - id: marketing-mix
    term: Marketing mix
    short: The set of choices a firm makes about its product, promotion, price and distribution to satisfy a target market.
    related: [standardization]
    skills: [standardize]
  - id: standardization
    term: Standardization
    short: Using the same marketing mix in every market.
    related: [marketing-mix]
    skills: [standardize]
  - id: corporate-visual-identity
    term: Corporate visual identity
    aka: [CVI]
    short: The name, logo, slogan, graphics, color and typeface that help people recognize a firm.
    related: [standardization]
    skills: [standardize]
  - id: total-product
    term: Total product
    short: Everything the customer buys, including the item itself, brand name, service, warranty, instructions, package and company image.
    skills: [total-product]
  - id: environmental-sensitivity
    term: Sensitivity to the foreign environment
    short: How much a product has to change to suit the culture, law and conditions of another country.
    related: [total-product]
    skills: [total-product]
  - id: first-registrant-rule
    term: First-registrant rule
    short: In many countries a brand name belongs to whoever registers it first, not to whoever used it first.
    related: [corporate-visual-identity, environmental-sensitivity]
    skills: [foreign-forces]
  - id: promotion
    term: Promotion
    short: Any way a firm communicates with its publics, such as advertising, public relations, sales offers and events.
    skills: [product-message]
  - id: product-message-strategy
    term: Product and message strategy
    short: A combination of one choice about the product and one choice about the message used to sell it.
    related: [promotion]
    skills: [product-message]
  - id: brand-value
    term: Brand value
    short: The dollar worth of a brand, which some companies list on their balance sheets.
    related: [corporate-visual-identity, one-brand-approach, two-brand-approach]
    skills: [product-message]
  - id: advertising
    term: Advertising
    short: Paid, non-personal presentation of ideas, goods or services by a sponsor who is named.
    related: [promotion]
    skills: [advertising-promo]
  - id: global-advertising
    term: Global and regional advertising
    short: Using one advertising campaign across many countries or a whole region.
    related: [glocal-advertising]
    skills: [advertising-promo]
  - id: two-brand-approach
    term: Two-brand approach
    short: Selling one product under both a local brand and the company's main brand.
    related: [one-brand-approach]
    skills: [advertising-promo]
  - id: one-brand-approach
    term: One-brand approach
    short: Selling under a single brand everywhere, with different versions for different markets.
    related: [two-brand-approach]
    skills: [advertising-promo]
  - id: glocal-advertising
    term: Glocal advertising
    short: A mix of global and local approaches, partly standard and partly adapted.
    related: [programmed-management-approach]
    skills: [advertising-promo]
  - id: programmed-management-approach
    term: Programmed-management approach
    short: A middle path between a global and a local campaign that uses market tests to decide how much to adapt.
    related: [glocal-advertising]
    skills: [advertising-promo]
  - id: personal-selling
    term: Personal selling
    short: Selling through face-to-face contact with a salesperson, common in industrial sales.
    related: [promotion, advertising, sales-promotion]
    skills: [advertising-promo]
  - id: sales-promotion
    term: Sales promotion
    short: Short-term activities such as displays, contests, premiums, coupons and money-off offers that push sales.
    related: [promotion, advertising, personal-selling]
    skills: [advertising-promo]
  - id: public-relations
    term: Public relations
    aka: [PR]
    short: Ways of communicating with a firm's publics to earn a favorable impression rather than an immediate sale.
    related: [promotion, advertising]
    skills: [advertising-promo]
  - id: foreign-national-pricing
    term: Foreign national pricing
    short: Setting a local price based on market forces in the country where the product is sold.
    related: [international-pricing]
    skills: [price-distribution]
  - id: international-pricing
    term: International pricing
    short: Setting prices for goods made in one country and sold in another.
    related: [foreign-national-pricing]
    skills: [price-distribution]
  - id: gray-market
    term: Gray market
    short: Resellers who buy goods in a cheap market and resell them in a dearer one without the maker's approval.
    related: [international-pricing, foreign-national-pricing, disintermediation]
    skills: [price-distribution]
  - id: disintermediation
    term: Disintermediation
    short: The unraveling of traditional distribution chains, often called cutting out the middlemen.
    related: [gray-market, international-pricing]
    skills: [price-distribution]
