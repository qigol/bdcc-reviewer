sections:
  - id: key-terms
    title: Key terms lookup
    skills:
      - standardize
      - total-product
      - foreign-forces
      - product-message
      - advertising-promo
      - price-distribution
    summary: "A placeholder section: this module is conceptual, so the workbench only looks up the meaning of its key terms.
      Pick a term to see what it means."
    keyFormula: \text{term} \rightarrow \text{meaning}
    state:
      term: marketing-mix
    derive:
      - fn: termLookup
        in:
          term: "@term"
        out: k
    live:
      - id: r
        widget: Readout
        props:
          items:
            - label: Term
              value: "{=k.name}"
              tone: accent
            - label: Meaning
              value: "{=k.meaning}"
              tone: good
      - id: pick
        widget: Choice
        props:
          label: Term
          options:
            - value: marketing-mix
              label: Marketing mix
            - value: total-product
              label: Total product
            - value: first-registrant-rule
              label: First-registrant rule
            - value: promotion
              label: Promotion
            - value: advertising
              label: Advertising
        bind:
          value: term
    steps:
      - tex: |
          \anchor{lookup}{\text{term}} ;\mapsto; \text{meaning}
        say: Each term has one meaning in this lecture.
      - tex: |
          \anchor{answer}{\text{meaning}} = \text{{=k.name|text}}
        say: "{=k.name}: {=k.meaning}"
    code:
      lang: python
      title: A term lookup
      source: |
        TERMS = {
            "marketing-mix": "Marketing mix",
            "total-product": "Total product",
            "first-registrant-rule": "First-registrant rule",
            "promotion": "Promotion",
            "advertising": "Advertising",
        }

        def term_lookup(term):
            """Look up a key term from the lecture.

            Args:
                term: the term's id.
            Returns:
                The term's name.
            Placeholder: this module is conceptual; see the Intuition tab.
            """
            name = TERMS[term]       # @a:lookup
            return name              # @a:answer
    links:
      - anchor: lookup
        label: Find the term
      - anchor: answer
        label: Its meaning
    trace:
      fn: termLookup
      in:
        term: "@term"
    examples:
      - term-marketing-mix
      - term-total-product
      - term-first-registrant-rule
      - term-promotion
      - term-advertising
    tryIt:
      - ikea-match
      - mix-mcq
    pitfalls:
      - Memorizing the term without the idea behind it. The Intuition tab explains each one.
    examTip: "Exam questions on this lecture are conceptual: know what each term means and when it applies."
