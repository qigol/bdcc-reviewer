examples:
  - id: term-marketing-mix
    source: "INTB 3355 Module 13, Marketing Internationally (Session 23): glossary term Marketing mix"
    fn: termLookup
    in:
      term: marketing-mix
    expect:
      name: Marketing mix
      meaning: The set of choices a firm makes about its product, promotion, price and distribution to satisfy a target market.
  - id: term-total-product
    source: "INTB 3355 Module 13, Marketing Internationally (Session 23): glossary term Total product"
    fn: termLookup
    in:
      term: total-product
    expect:
      name: Total product
      meaning: Everything the customer buys, including the item itself, brand name, service, warranty, instructions, package
        and company image.
  - id: term-first-registrant-rule
    source: "INTB 3355 Module 13, Marketing Internationally (Session 23): glossary term First-registrant rule"
    fn: termLookup
    in:
      term: first-registrant-rule
    expect:
      name: First-registrant rule
      meaning: In many countries a brand name belongs to whoever registers it first, not to whoever used it first.
  - id: term-promotion
    source: "INTB 3355 Module 13, Marketing Internationally (Session 23): glossary term Promotion"
    fn: termLookup
    in:
      term: promotion
    expect:
      name: Promotion
      meaning: Any way a firm communicates with its publics, such as advertising, public relations, sales offers and events.
  - id: term-advertising
    source: "INTB 3355 Module 13, Marketing Internationally (Session 23): glossary term Advertising"
    fn: termLookup
    in:
      term: advertising
    expect:
      name: Advertising
      meaning: Paid, non-personal presentation of ideas, goods or services by a sponsor who is named.
