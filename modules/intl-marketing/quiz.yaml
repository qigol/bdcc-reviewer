templates:
  # ------------------------------------------------------------------ standardize
  - id: mix-mcq
    type: mcq
    skills: [standardize]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: mix-or-adapt }
    prompt: Which four sets of decisions make up the [[marketing-mix]]?
    options:
      - Product, promotion, pricing and distribution
      - Product, profit, people and politics
      - Price, packaging, payroll and patents
      - Promotion, production, plants and partners
    answer: 0
    hints:
      - Three of them begin with the letter P in the lecture's wording.
    explanation: The marketing mix is the strategic choices about the product and its promotion, pricing and distribution.

  - id: standard-benefit-mcq
    type: mcq
    skills: [standardize]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: mix-or-adapt }
    prompt: What is the main reason top management likes to standardize the marketing mix?
    options:
      - It saves cost and keeps marketing consistent
      - It makes every country identical
      - It removes the need for research
      - It lowers all taxes
    answer: 0
    hints:
      - Think of one campaign, one package and one design shared by many countries.
    explanation: Standardization produces cost savings and consistent marketing, though it is harder than it sounds.

  - id: cvi-mcq
    type: mcq
    skills: [standardize]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: mix-or-adapt }
    prompt: Which of these is part of a firm's [[corporate-visual-identity|corporate visual identity]]?
    options:
      - Its logo, color and typeface
      - Its tax rate
      - Its factory location
      - Its employees' salaries
    answer: 0
    hints:
      - It is what a customer can see at a glance.
    explanation: Corporate visual identity includes name, logo, slogan, graphics, color and typeface.

  - id: domestic-intl-multi
    type: multi
    skills: [standardize, foreign-forces]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: mix-or-adapt }
    prompt: International markets differ because of variations in which uncontrollable forces?
    options:
      - Sociocultural
      - Resource and environmental
      - Economic and socioeconomic
      - Legal
      - The firm's own logo
    answer: [0, 1, 2, 3]
    hints:
      - One option is something the firm controls.
    explanation: The lecture lists sociocultural, resource and environmental, economic and socioeconomic, legal and financial forces.

  - id: ikea-match
    type: match
    skills: [standardize]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: mix-or-adapt }
    prompt: Match each change IKEA made in India to the part of the marketing mix it touches.
    pairs:
      - ['Changed a third of the range each year', 'Product']
      - ['Built an on-site assembly team and delivery', 'Distribution and service']
      - ['Adjusted prices for the market', 'Pricing']
      - ['Changed the in-store restaurant menu', 'Product']
    hints:
      - Delivery is about getting goods to the customer.
    explanation: IKEA adapted its product line, designs, pricing and restaurant, and added local assembly and delivery.

  # ------------------------------------------------------------------ total-product
  - id: total-product-mcq
    type: mcq
    skills: [total-product]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: total-product }
    prompt: A customer buys a phone with its warranty, charger, manual and brand. What is the whole bundle called?
    options:
      - The total product
      - The physical product only
      - The brand name only
      - The corporate visual identity
    answer: 0
    hints:
      - It is more than the item itself.
    explanation: The total product is what the customer buys, including the physical product, brand name, accessories, service, warranty, instructions, image and package.

  - id: total-parts-multi
    type: multi
    skills: [total-product]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: total-product }
    prompt: Which are parts of the total product?
    options:
      - Brand name
      - After-sales service
      - Warranty
      - Package
      - Tax return
    answer: [0, 1, 2, 3]
    hints:
      - One option has nothing to do with what a customer receives.
    explanation: A total product includes the item, brand name, accessories, after-sales service, warranty, instructions, company image and package.

  - id: spectrum-order
    type: order
    skills: [advertising-promo]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: advertising }
    prompt: Put these approaches in order from the most standardized to the most local.
    items:
      - A globally standardized campaign
      - A programmed-management campaign tested market by market
      - An entirely local program
    hints:
      - The middle path uses market testing.
    explanation: A programmed-management approach sits between a globally standardized campaign and an entirely local one.

  - id: rollout-order
    type: order
    skills: [standardize, price-distribution]
    difficulty: 3
    tags: [application]
    lessonRef: { tab: intuition, id: price-and-shops }
    prompt: Put a sensible way to roll out a marketing approach abroad in order.
    items:
      - Start with the home-country model
      - Test it in the new market
      - Change the parts that local conditions require
      - Keep the parts that work unchanged everywhere
    hints:
      - You cannot test before you have something to test.
    explanation: Firms start with the home model and change it only where local conditions demand, keeping the savings of standardization where possible.

  - id: product-type-match
    type: match
    skills: [total-product]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: total-product }
    prompt: Match each product type to what the lecture says about adapting it.
    pairs:
      - ['Industrial products', 'Need less adaptation, unless safety, emission or noise law requires it']
      - ['Consumer products', 'Often need more adaptation, except luxury goods']
      - ['Services', 'Marketing is less complex, with some adaptation for customs and law']
    hints:
      - Luxury is the exception for one of them.
    explanation: Different product types face different pressure from the foreign environment.

  - id: size-pack-mcq
    type: mcq
    skills: [total-product]
    difficulty: 3
    tags: [application]
    lessonRef: { tab: intuition, id: total-product }
    prompt: A detergent maker keeps the formula but sells it in smaller packs abroad. What does this show?
    options:
      - Adaptation may be needed in the package or size even when the physical product stays the same
      - The brand name has been removed
      - The product is now an industrial product
      - Standardization has failed completely
    answer: 0
    hints:
      - Think about which part of the total product changed.
    explanation: Adaptation may not be needed in the physical product, but it may be in aspects like size or packaging.

  # ------------------------------------------------------------------ foreign-forces
  - id: forces-match
    type: match
    skills: [foreign-forces]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: forces-change }
    prompt: Match each foreign force to an example of how it changes marketing.
    pairs:
      - ['Sociocultural forces', 'Colors, labels or a brand name may need to change']
      - ['Legal forces', 'Safety, food and drug rules, and brand registration']
      - ['Economic forces', 'Income gaps affect pricing, packaging and production']
      - ['Physical forces', 'Heat, humidity and altitude require product changes']
    hints:
      - Climate belongs with physical forces.
    explanation: Each force acts on a different part of the marketing mix.

  - id: first-registrant-mcq
    type: mcq
    skills: [foreign-forces]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: forces-change }
    prompt: A firm's brand name is already registered in another country by a stranger. What does the lecture say about how brand names are treated in many countries?
    options:
      - The brand name belongs to the first registrant, not to the first user
      - The brand name always belongs to the original user
      - Brand names cannot be registered
      - Registration is only for logos
    answer: 0
    hints:
      - The U.S. approach is based on order of use, and many countries differ.
    explanation: In many countries the first to register owns the name. Internet domain names can also already be registered elsewhere.

  - id: climate-mcq
    type: mcq
    skills: [foreign-forces]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: forces-change }
    prompt: Chocolate that melts in a hot, humid country is an example of which kind of force?
    options:
      - Physical forces
      - Legal forces
      - Sociocultural forces
      - Financial forces
    answer: 0
    hints:
      - Think of climate and terrain.
    explanation: Heat, humidity and high altitude can require changes to products and production.

  - id: language-mcq
    type: mcq
    skills: [foreign-forces]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: forces-change }
    prompt: An ad slogan has a rude meaning when translated. Which force is at work?
    options:
      - Sociocultural, because language connotations can affect promotions
      - Physical, because of climate
      - Economic, because of income gaps
      - Legal, because of registration
    answer: 0
    hints:
      - Meaning and image vary between cultures.
    explanation: Language connotations and image meanings vary among cultures, which is a sociocultural force.

  # ------------------------------------------------------------------ product-message
  - id: six-match
    type: match
    skills: [product-message]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: six-strategies }
    prompt: Match each strategy to what the firm does.
    pairs:
      - ['Same product, same message', 'Sell one item the same way everywhere']
      - ['Same product, different message', 'Keep the item but change how it is promoted']
      - ['Product adaptation, same message', 'Change the item but keep the promotion']
      - ['Product adaptation, message adaptation', 'Change both the item and the promotion']
      - ['Different product, same message', 'Offer a new item with the existing promotion']
      - ['Different product for the same use, different message', 'Create a new item and a new message for the same need']
    hints:
      - Start with the pairs that change only one thing.
    explanation: The six strategies combine three product choices (same, adapted, different) with message choices.

  - id: strategy-mcq
    type: mcq
    skills: [product-message]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: six-strategies }
    prompt: A car maker sells the same sedan but advertises it as a family car in one country and a luxury car in another. Which strategy is this?
    options:
      - Same product, different message
      - Same product, same message
      - Product adaptation, same message
      - Different product, same message
    answer: 0
    hints:
      - Look at what stays the same and what changes.
    explanation: The product is unchanged and only the message is different.

  - id: brandvalue-mcq
    type: mcq
    skills: [product-message]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: six-strategies }
    prompt: Why do some companies record brand value on their balance sheets?
    options:
      - A strong brand is a valuable asset that supports sales abroad and at home
      - Brands are free to create
      - Governments require every brand to be listed
      - Brand value is the same as sales
    answer: 0
    hints:
      - Think about what makes a brand worth money.
    explanation: Brands are valuable assets, and the lecture lists the dollar values of the most valuable global brands.

  - id: brand-multi
    type: multi
    skills: [product-message]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: six-strategies }
    prompt: Which statements about the 2023 global brand values are correct?
    options:
      - Apple ranked first
      - Coca-Cola ranked first in 2010
      - Coca-Cola ranked eighth in 2023
      - Nike ranked first in 2010
    answer: [0, 1, 2]
    hints:
      - Check the 2010 column for Nike.
    explanation: Apple was first in 2023 and Coca-Cola was first in 2010 and eighth in 2023. Nike was twenty-fifth in 2010.

  # ------------------------------------------------------------------ advertising-promo
  - id: global-vs-local-multi
    type: multi
    skills: [advertising-promo]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: advertising }
    prompt: Which reasons favor global or regional advertising?
    options:
      - Cost
      - Quality
      - Consistent brand image
      - Economies of scale
      - Differences in local humor and gender roles
    answer: [0, 1, 2, 3]
    hints:
      - The last option is a reason to localize.
    explanation: The lecture names cost, quality, brand image, regional organization, ease of transmission and economies of scale as reasons to use global or regional advertising.

  - id: cultural-dimensions-mcq
    type: mcq
    skills: [advertising-promo]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: advertising }
    prompt: Which of these is a cultural dimension that affects advertising?
    options:
      - Directness versus indirectness
      - The size of the firm's logo
      - The number of employees
      - The date of incorporation
    answer: 0
    hints:
      - Look for something about how people prefer to be spoken to.
    explanation: Directness, comparison, humor, gender roles, explicitness, sophistication, popular versus traditional culture and information versus fluff all vary by culture.

  - id: brand-approach-match
    type: match
    skills: [advertising-promo]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: advertising }
    prompt: Match each approach to the company the lecture uses as an example.
    pairs:
      - ['[[two-brand-approach|Local brand plus corporate brand]]', 'Nestlé']
      - ['[[one-brand-approach|One brand with different variants]]', 'Coca-Cola']
    hints:
      - Which company sells under one famous name?
    explanation: Nestlé puts a local brand next to its strategic corporate brand. Coca-Cola uses one brand with variants.

  - id: glocal-mcq
    type: mcq
    skills: [advertising-promo]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: advertising }
    prompt: What is glocal advertising?
    options:
      - A combined global and local approach
      - An advertisement shown only on the Internet
      - A campaign sold only in one village
      - Free advertising from government
    answer: 0
    hints:
      - The word blends two other words.
    explanation: Glocal advertising sits in the middle of the global-local range, and many companies are moving toward it.

  - id: programmed-mcq
    type: mcq
    skills: [advertising-promo]
    difficulty: 3
    tags: [term]
    lessonRef: { tab: intuition, id: advertising }
    prompt: How does the programmed-management approach decide how much to adapt a campaign?
    options:
      - It uses market testing to find the individualization needed
      - It always uses one global campaign
      - It lets each country invent its own campaign with no guidance
      - It copies a rival's campaign
    answer: 0
    hints:
      - It is a middle ground that relies on evidence.
    explanation: The approach uses market testing to see how much a campaign should change from market to market.

  - id: internet-ad-multi
    type: multi
    skills: [advertising-promo]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: advertising }
    prompt: Which are advantages of Internet advertising?
    options:
      - It reaches an affluent, accessible audience
      - It can be inexpensive
      - It is sometimes less regulated than traditional ads
      - It lets consumers choose which messages to receive
      - It reaches no one under thirty
    answer: [0, 1, 2, 3]
    hints:
      - The last option is the opposite of what the lecture says about teenagers.
    explanation: The Internet is interactive and can reach groups who watch less television, such as teenagers.

  - id: promo-tools-match
    type: match
    skills: [advertising-promo]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: other-promotion }
    prompt: Match each promotion tool to its idea.
    pairs:
      - ['[[personal-selling|Personal selling]]', 'Face-to-face selling, common in industrial sales']
      - ['[[sales-promotion|Sales promotion]]', 'Displays, contests, premiums, coupons and money-off offers']
      - ['[[public-relations|Public relations]]', 'Earning a favorable impression rather than a quick sale']
      - ['[[advertising|Advertising]]', 'Paid, non-personal presentation by an identified sponsor']
    hints:
      - Coupons belong to a short-term push.
    explanation: Each tool serves a different purpose in the promotion mix.

  - id: pr-mcq
    type: mcq
    skills: [advertising-promo]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: other-promotion }
    prompt: When can public relations be especially useful for a firm abroad?
    options:
      - During periods of public criticism in international markets
      - Only when selling industrial goods
      - Never, since it brings no sales
      - Only on the Internet
    answer: 0
    hints:
      - It aims at impressions, not immediate sales.
    explanation: Public relations is an overlooked tool that can help when a firm faces public criticism abroad.

  # ------------------------------------------------------------------ price-distribution
  - id: pricing-concerns-match
    type: match
    skills: [price-distribution]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: price-and-shops }
    prompt: Match each department to the pricing concern the lecture gives it.
    pairs:
      - ['Finance', 'Prices that are profitable and give steady cash flow']
      - ['Production', 'Prices that create large sales volumes']
      - ['Legal', 'Antitrust, trademark and intellectual property issues']
      - ['Tax', 'The effect of prices on tax loads']
      - ['Domestic sales', 'Export prices high enough to avoid gray-market resellers']
    hints:
      - Volume is a production worry.
    explanation: Pricing touches every department, which is why it is a complex process.

  - id: pricing-types-mcq
    type: mcq
    skills: [price-distribution]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: price-and-shops }
    prompt: Which describes international pricing?
    options:
      - Setting prices for goods produced in one country and sold in another
      - Setting a local price from local market forces only
      - Setting a price for goods made and sold in the same country
      - Setting wages for expatriates
    answer: 0
    hints:
      - One option is about where the goods are made and sold.
    explanation: Foreign national pricing follows local market forces, while international pricing covers goods that cross borders.

  - id: gray-mcq
    type: mcq
    skills: [price-distribution]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: price-and-shops }
    prompt: Why might a sales manager want export prices high enough?
    options:
      - To avoid gray-market resellers buying cheap and reselling elsewhere
      - To remove all tariffs
      - To stop all research
      - To make every country identical
    answer: 0
    hints:
      - Cheap goods can travel to a dearer market.
    explanation: If export prices are too low, resellers can buy abroad and resell at home, undercutting the firm.

  - id: distribution-mcq
    type: mcq
    skills: [price-distribution]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: price-and-shops }
    prompt: What does the lecture suggest about standardizing distribution?
    options:
      - It may be unrealistic because of local conditions, so start with the home model and change as needed
      - It is always easy
      - It should never use the home model
      - It has no long-term effect
    answer: 0
    hints:
      - McDonald's uses franchisers in many countries.
    explanation: Local conditions often make a standard channel unrealistic, and subsidiaries tend to design local channels for the long term.

  - id: disintermediation-mcq
    type: mcq
    skills: [price-distribution]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: price-and-shops }
    prompt: What is disintermediation?
    options:
      - Cutting out the middlemen in a distribution chain
      - Adding more wholesalers
      - Lowering the quality of a product
      - A tax on imports
    answer: 0
    hints:
      - Middlemen are the intermediaries.
    explanation: Disintermediation is the unraveling of traditional distribution structures.
