scenes:
  - id: two-brazils
    title: Two Brazils in one country
    goal: Why might the same washing powder sell very differently in two parts of one country?
    skills: [brazil-regions]
    stage:
      - id: story-note
        widget: Callout
        props:
          kind: note
          title: Maria's problem
          body: |
            Laercio Cardoso, a Unilever marketer, met **Maria Conceicao** in Fortaleza. Like almost everyone in Brazil, she would
            love to buy **Omo**, Unilever's flagship brand, but her tight budget means she can only afford cheaper local brands.
      - id: region-table
        widget: Schedule
        hidden: true
        props:
          title: Northeast and Southeast of Brazil, 1996
          columns: [Northeast, Southeast]
          rows:
            - { label: People (millions), amounts: ['48', '73'] }
            - { label: Income per person (dollars), amounts: ['2,250', '6,600'] }
            - { label: Illiterate adults, amounts: ['40%', '15%'] }
            - { label: Living on under two minimum wages, amounts: ['53%', '21%'] }
      - id: habit-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: h1, label: Many scrub clothes with bars of soap and add bleach for stains }
            - { id: h2, label: Most families own a washing machine }
            - { id: h3, label: Women often wash at a public laundry or river and meet friends }
            - { id: h4, label: Laundry is seen as a chore done at home alone }
          bins:
            - { id: ne, label: Northeast (Recife) }
            - { id: se, label: Southeast (Sao Paulo) }
          solution: { h1: ne, h2: se, h3: ne, h4: se }
    beats:
      - say: |
          Unilever sold Omo to the rich. Maria could not afford it. The company already had 81 percent of Brazil's detergent
          powder market, so growth had to come from somewhere new: the 48 million mostly poor people of the Northeast.
        show: [story-note]
      - say: |
          Brazil is huge, with most people in two clusters on the coast. Before you see the numbers, guess how the two clusters
          differ.
        gate:
          type: predict
          question: In 1996, roughly how did income per person in the Northeast compare with the Southeast?
          options:
            - About one third as high
            - About the same
            - Twice as high
            - Slightly lower
          answer: 0
          explain: About 2,250 dollars in the Northeast against 6,600 in the Southeast.
      - say: |
          Here is how the regions compare. People are grouped by **social class**, a measure of household income as a multiple of
          the monthly minimum salary, about 70 dollars in 1996. In the Northeast, 53 percent lived on under two minimum salaries.
        define: [social-class]
        hide: [story-note]
        show: [region-table]
      - say: |
          Washing differs too. Both regions buy **detergent powder** and **laundry soap**, but not in the same mix. A
          Northeastern woman scrubs with soap bars, adds bleach, and adds a little powder at the end to make clothes smell
          good.
        define: [detergent-powder, laundry-soap]
        hide: [region-table]
        show: [habit-sorter]
        gate:
          type: event
          prompt: Place each habit in the region it describes.
          target: habit-sorter
          event: solved
          hint: Few Northeastern households own a washing machine.
      - say: |
          For many Northeastern women, a spotless family is a source of pride and gossip. Cleanliness shows a mother's
          dedication. In the Southeast, where machines do the work, it matters much less for status.
        hide: [habit-sorter]
      - say: Check the regional gap.
        gate:
          type: practice
          template: regions-mcq
      - say: And the washing habits.
        gate:
          type: practice
          template: wash-habits-mcq
    takeaway: The Northeast is poorer and washes by hand with soap, powder and pride, so one product does not fit both regions.

  - id: what-shoppers-want
    title: What would Maria look for?
    goal: When money is tight, what makes one washing powder worth buying?
    skills: [consumer-needs]
    stage:
      - id: attr-chart
        widget: Chart
        hidden: true
        props:
          kind: bar
          title: Importance of each attribute (percent)
          xLabel: Attribute
          yLabel: Importance
          series:
            - { name: Importance, x: ['Cleaning power', 'Smell and softness', 'Stain removal', 'Dissolving', 'Packaging', 'Harm to colors'], y: [24, 20, 16, 16, 13, 11] }
      - id: attr-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: a1, label: Makes a lot of foam }
            - { id: a2, label: A strong, pleasant smell that suggests softness }
            - { id: a3, label: Dissolves easily, no residue after rinsing }
            - { id: a4, label: Easy to open and protects against humidity }
          bins:
            - { id: power, label: Cleaning power }
            - { id: smell, label: Smell and softness }
            - { id: dissolve, label: Dissolving }
            - { id: pack, label: Packaging }
          solution: { a1: power, a2: smell, a3: dissolve, a4: pack }
    beats:
      - say: |
          Along with price, low-income shoppers judge detergents on six attributes. The most important is perceived power: the
          ability to clean and whiten with a small quantity, often judged by how much foam it makes.
      - say: |
          Second is smell. A strong, pleasant smell is associated with softness for fabric and hands. Third is removing stains
          without laundry soap and bleach. Fourth is dissolving without residue.
        gate:
          type: predict
          question: Which attribute did consumers rank least important?
          options:
            - Impact on colors, or fading
            - Cleaning power
            - Smell
            - Packaging
          answer: 0
          explain: Harm to colors was last, at 11 percent importance.
      - say: |
          Packaging comes fifth. Low-income shoppers, who are often barely literate, prefer simple, distinctive packs that
          are easy to recognize, easy to open and protected from humidity. Here are the importance scores.
        show: [attr-chart]
      - say: Match four examples to the attribute they illustrate.
        hide: [attr-chart]
        show: [attr-sorter]
        gate:
          type: event
          prompt: Place each example under its attribute.
          target: attr-sorter
          event: solved
          hint: Foam signals power. Smell signals softness.
      - say: Check the top attribute.
        hide: [attr-sorter]
        gate:
          type: practice
          template: foam-mcq
      - say: And the ranking.
        gate:
          type: practice
          template: importance-order
    takeaway: Shoppers pay for power first, then smell, stain removal, dissolving, packaging and color care.

  - id: market-map
    title: Who sells what, and for how much
    goal: Before choosing a move, what does the Northeast market look like?
    skills: [market-structure]
    stage:
      - id: powder-table
        widget: Schedule
        hidden: true
        props:
          title: Detergent powder in the Northeast, 1996
          columns: [Share, Price to retailers per kg]
          rows:
            - { label: Omo (Unilever), amounts: ['52%', '3.00'] }
            - { label: Minerva (Unilever), amounts: ['17%', '2.40'] }
            - { label: Campeiro (Unilever), amounts: ['6%', '1.70'] }
            - { label: Ace (P&G), amounts: ['11%', '2.40'] }
      - id: soap-table
        widget: Schedule
        hidden: true
        props:
          title: Laundry soap in the Northeast, 1996
          columns: [Share, Price to retailers per kg]
          rows:
            - { label: Minerva (Unilever), amounts: ['19.1%', '1.70'] }
            - { label: Bem-te-vi (ASA), amounts: ['11.3%', '1.20'] }
            - { label: Flora, amounts: ['6.0%', '1.20'] }
      - id: tier-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: b1, label: Omo, delivers high quality at a high price }
            - { id: b2, label: Campeiro, focuses on cost cuts across what shoppers value }
            - { id: b3, label: Invicto, an entry-level detergent that rivals Campeiro }
            - { id: b4, label: Ace, offers superior whiteness }
          bins:
            - { id: prem, label: Premium brand }
            - { id: price, label: Price brand }
          solution: { b1: prem, b2: price, b3: price, b4: prem }
    beats:
      - say: |
          Detergent powder was a 106 million dollar market in the Northeast, growing 17 percent a year. Laundry soap was about
          the same size at 102 million dollars but grew only 6 percent. The [[barriers-to-entry|barriers to entry]] for powder are high because it needs costly factories.
        define: [barriers-to-entry]
        gate:
          type: predict
          question: What share of the Northeast detergent powder market did Unilever's three brands hold together?
          options: [About 45 percent, About 60 percent, About 75 percent, About 95 percent]
          answer: 2
          explain: Omo 52, Minerva 17 and Campeiro 6 make 75 percent, below Unilever's national share.
      - say: |
          Here are the powder brands. A company's **market share** is its portion of the category's total sales. Notice how far
          apart the prices are, from 3.00 dollars per kg for Omo to 1.70 for Campeiro.
        define: [market-share]
        show: [powder-table]
      - say: |
          In soap, Unilever's Minerva leads with 19.1 percent, but the market is spread among many small local firms. The top
          four players had only 38 percent between them. P&G did not make soap.
        hide: [powder-table]
        show: [soap-table]
      - say: |
          A **premium brand** charges more because shoppers think it better. A **price brand** competes with a low price and
          cost cutting across what shoppers value. Sort four brands.
        define: [premium-brand, price-brand]
        hide: [soap-table]
        show: [tier-sorter]
        gate:
          type: event
          prompt: Place each brand in its tier.
          target: tier-sorter
          event: solved
          hint: Price brands focus on cost reduction across dimensions valued by consumers.
      - say: |
          Unilever tracks how well shoppers know each brand. **Top-of-mind awareness** is the share naming a brand first.
          **Brand knowledge** is the share who say they know it. **Market penetration** is the share who bought it in the
          past year.
        define: [top-of-mind-awareness, brand-knowledge, market-penetration]
        hide: [tier-sorter]
      - say: Check the size and growth.
        gate:
          type: practice
          template: market-size-mcq
      - say: And the brands.
        gate:
          type: practice
          template: shares-match
    takeaway: Unilever dominated premium powder in the Northeast, while cheap powder and soap were left to others.

  - id: go-no-go
    title: The go or no-go argument
    goal: A winning company is asked to chase poor shoppers with a cheaper brand. Should it?
    skills: [go-no-go]
    stage:
      - id: econ-table
        widget: Schedule
        hidden: true
        props:
          title: Dollars per kg, by brand
          columns: [Price, Formulation, Packaging, Promotion, Unit margin]
          rows:
            - { label: Omo, amounts: ['3.00', '1.65', '0.35', '0.35', '0.65'] }
            - { label: Minerva powder, amounts: ['2.40', '1.40', '0.35', '0.30', '0.35'] }
            - { label: Campeiro, amounts: ['1.70', '0.90', '0.35', '0.20', '0.25'] }
      - id: debate-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: d1, label: We already have 81 percent of the market and see no other way to grow }
            - { id: d2, label: Cheaper sales would replace our high-margin sales }
            - { id: d3, label: If we do nothing, P&G will attack us where we are weakest }
            - { id: d4, label: The investment community may think we abandoned premium brands }
          bins:
            - { id: laercio, label: Laercio, for going ahead }
            - { id: fernanda, label: Fernanda, against }
          solution: { d1: laercio, d2: fernanda, d3: laercio, d4: fernanda }
    beats:
      - say: |
          Unilever earned most from detergent, which it called its **cash cow**: a steady earner that funds growth elsewhere.
          Fernanda, the category manager, said the company should not divert money from premium brands to a cheaper one.
        define: [cash-cow]
      - say: Make a prediction, then we will look at it.
        gate:
          type: predict
          question: If one kg of Omo sales is replaced by a cheaper Unilever brand, what happens to Unilever's profit on that kg?
          options:
            - It falls, because the cheaper brand earns less per kg
            - It rises, because costs fall
            - It stays the same
            - It doubles
          answer: 0
          explain: A lower price and a lower margin per kg mean less profit on a switched kg.
      - say: |
          Her fear is **cannibalization**: sales of a new brand that come from the company's own brands instead of new buyers.
          If an Omo buyer switched to a cheaper brand, the company would earn less per kilogram.
        define: [cannibalization]
      - say: |
          To measure it, use the **unit margin**: what is left per kg after paying formulation, packaging and promotion costs.
          Here are the figures for three brands.
        define: [unit-margin]
        show: [econ-table]
      - say: |
          Laercio saw the other side: the Indian detergent Nirma had taken 48 percent of its market, leaving Unilever second
          with 24 percent. Fernanda recalled **Marlboro Friday**, when a 20 percent price cut at Philip Morris was read as a
          sign that big brands were losing.
        define: [marlboro-friday]
        hide: [econ-table]
        show: [debate-sorter]
        gate:
          type: event
          prompt: Put each argument with the person who made it.
          target: debate-sorter
          event: solved
          hint: Fernanda worries about margins and reputation. Laercio worries about growth and P&G.
      - say: |
          Davidson, the head of Home Care, had heard it all and was undecided. He asked at what cannibalization rate Unilever
          would start losing money, and whether it had the skills to compete in this market.
        hide: [debate-sorter]
      - say: Check the term.
        gate:
          type: practice
          template: cannibal-term-mcq
      - say: And the first margin.
        gate:
          type: practice
          template: margin-omo-mcq
      - say: One question about the debate.
        gate:
          type: reflect
          prompt: Name one reason to go ahead and one reason to hold back, using the case facts.
          model: |
            Go ahead because Unilever already holds most of the market and local low-price brands, as in India, could attack
            it. Hold back because each Omo buyer who switches earns the company less per kilogram and the premium image could suffer.
    takeaway: A cheaper brand might defend Unilever's share, but each switched kilogram costs margin.

  - id: brand-and-product
    title: Brand, product and pack
    goal: If Unilever goes ahead, what should it sell and under which name?
    skills: [brand-product]
    stage:
      - id: brand-tree
        widget: Tree
        hidden: true
        props:
          root:
            id: brand
            label: Brand choices
            note: Extra marketing cost per kg
            children:
              - { id: nb, label: New brand, note: 0.10 dollars per kg, tone: warn }
              - { id: ext, label: Brand extension, note: 0.05 dollars per kg, tone: accent }
              - { id: repo, label: Reposition an existing brand, note: No extra marketing cost, tone: good }
      - id: product-tree
        widget: Tree
        hidden: true
        props:
          root:
            id: prod
            label: Product options
            children:
              - { id: p1, label: Campeiro formula, note: Cheapest in the range }
              - { id: p2, label: Minerva formula, note: May be too expensive }
              - { id: p3, label: New formula, note: Priced halfway, by dropping some ingredients }
    beats:
      - say: |
          First, a **value proposition**: the promise the brand makes about what the shopper gets and why it is worth the price.
          Was something wrong with the old positioning? Unilever had to decide whether a new promise was needed.
        define: [value-proposition]
      - say: Pause and make a guess before the next idea.
        gate:
          type: predict
          question: Which brand choice would you expect to cost the most in extra marketing per kg?
          options:
            - Developing a new brand
            - Launching a brand extension
            - Repositioning an existing brand
            - All three add the same
          answer: 0
          explain: The case assumes 0.10 dollars for a new brand, 0.05 for an extension and nothing for repositioning.
      - say: |
          Next, the name. A **brand extension** uses an existing name on a new version. **Repositioning** changes how an
          existing brand is presented. Or Unilever could build a new brand, but there were rumors of cutting the brand
          portfolio.
        define: [brand-extension, repositioning]
        show: [brand-tree]
      - say: |
          Then the product. Unilever could use Campeiro's formula, Minerva's, or a third formula halfway between them, if
          its scientists could drop some ingredients. The question was which attributes to cut, keep or improve.
        hide: [brand-tree]
        show: [product-tree]
      - say: |
          Packaging matters too. A plastic sachet costs 30 percent of a cardboard box, but shoppers love boxes. Larger packs lower
          the cost per kg but may exceed the weekly budget of the poorest. One answer could be several types and sizes.
        hide: [product-tree]
      - say: Test the packaging logic.
        gate:
          type: practice
          template: sachet-mcq
      - say: And the brand options.
        gate:
          type: practice
          template: brand-options-match
    takeaway: Brand, formula and pack each trade cost against what shoppers value.

  - id: price-promo-shops
    title: Price, message and shops
    goal: How do you price, advertise and deliver a product to tens of thousands of tiny stores?
    skills: [mix-channels]
    stage:
      - id: channel-table
        widget: Schedule
        hidden: true
        props:
          title: Two ways to reach small stores
          columns: [Generalist wholesaler, Specialized distributor]
          rows:
            - { label: Reach, amounts: [Wide, Focused] }
            - { label: Products carried, amounts: [Hundreds, 20 to 40] }
            - { label: Relationship, amounts: ['Opportunistic, price driven', 'Partnership, information exchange'] }
            - { label: Variable cost to reach the smallest stores per kg, amounts: ['0.10 dollars', '0.05 dollars'] }
      - id: comm-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: m1, label: Television commercials }
            - { id: m2, label: Trade promotions }
            - { id: m3, label: Displays in small shops }
            - { id: m4, label: Events }
          bins:
            - { id: atl, label: Above the line }
            - { id: btl, label: Below the line }
          solution: { m1: atl, m2: btl, m3: btl, m4: btl }
    beats:
      - say: |
          The **wholesale price** is what a shop pays Unilever, not what Maria pays. The case calls it the single most
          important decision. Priced too high, the brand is out of reach. What about priced too low?
        define: [wholesale-price]
        gate:
          type: predict
          question: What is the main risk of setting the wholesale price too low?
          options:
            - It increases cannibalization of Unilever's other brands
            - It makes the pack too big
            - It stops television advertising
            - It has no risk
          answer: 0
          explain: A cheap brand tempts buyers of Omo and Minerva to switch.
      - say: |
          Priced too low, it increases cannibalization of Unilever's other brands. Communication is next. In regular markets Unilever spent 70 percent above the line and 30 percent below. [[above-the-line|Above-the-line]]
          means media advertising, with a low cost per contact and high reach. [[below-the-line|Below-the-line]] means trade promotions, events and
          displays.
        define: [above-the-line, below-the-line]
        show: [comm-sorter]
        gate:
          type: event
          prompt: Put each activity above or below the line.
          target: comm-sorter
          event: solved
          hint: Mass media is above the line.
      - say: |
          A mostly below-the-line plan would cost about 0.05 dollars per kg, a third of a traditional plan, but reach fewer people at
          a higher cost per contact. Small store owners also matter, because shoppers rely on them for advice and credit.
        hide: [comm-sorter]
      - say: |
          Distribution is the last choice. About 75,000 small outlets are spread over the Northeast, and shoppers rarely visit
          big supermarkets. A **generalist wholesaler** serves many categories over a wide area. A **specialized distributor** sells
          all of one maker's brands in a few categories locally.
        define: [generalist-wholesaler, specialized-distributor]
        show: [channel-table]
      - say: Check the price decision.
        hide: [channel-table]
        gate:
          type: practice
          template: price-mcq
      - say: And the channels.
        gate:
          type: practice
          template: distribution-match
      - say: A last question for the whole case.
        gate:
          type: reflect
          prompt: Why might a specialized distributor suit low-income shoppers better than a generalist wholesaler?
          model: |
            It reaches the smallest stores at lower cost, carries only the maker's brands, and builds a partnership that
            supports displays and local selling, which matters where shoppers rely on small stores.
    takeaway: Price, message and channel must fit shoppers who live on tiny budgets and shop at tiny stores.
