terms:
  - id: social-class
    term: Social class
    short: A group of households with a similar income, here counted as a multiple of the monthly minimum salary.
    related: [laundry-soap, price-brand, market-penetration]
    skills: [brazil-regions]
  - id: detergent-powder
    term: Detergent powder
    short: A washing powder, made by drying a liquid mix of chemicals in a tower, used for hand or machine washing.
    related: [laundry-soap]
    skills: [market-structure, brazil-regions]
  - id: laundry-soap
    term: Laundry soap
    short: A cheap bar of soap, made mostly from animal fat, used to scrub clothes by hand or treat tough stains.
    related: [detergent-powder]
    skills: [market-structure, brazil-regions]
  - id: market-share
    term: Market share
    short: The part of a market's total sales that one company or brand captures.
    related: [market-penetration, barriers-to-entry, premium-brand]
    skills: [market-structure]
  - id: barriers-to-entry
    term: Barriers to entry
    short: Things that make it hard for new firms to enter a market, such as the cost of building a factory.
    related: [market-share, detergent-powder]
    skills: [market-structure]
  - id: premium-brand
    term: Premium brand
    short: A brand that charges a higher price because shoppers see it as better.
    related: [price-brand]
    skills: [market-structure]
  - id: price-brand
    term: Price brand
    short: A brand that wins shoppers mainly with a low price and cost cutting across what they value.
    related: [premium-brand]
    skills: [market-structure]
  - id: top-of-mind-awareness
    term: Top-of-mind awareness
    short: The share of consumers who name a brand first when asked.
    related: [brand-knowledge, market-penetration]
    skills: [market-structure]
  - id: brand-knowledge
    term: Brand knowledge
    short: The share of consumers who say they know a brand.
    related: [top-of-mind-awareness, market-penetration]
    skills: [market-structure]
  - id: market-penetration
    term: Market penetration
    short: The share of consumers who bought at least one unit of a brand in the past year.
    related: [top-of-mind-awareness, brand-knowledge]
    skills: [market-structure]
  - id: cash-cow
    term: Cash cow
    short: A product that earns steady profit and pays for growth elsewhere in the company.
    related: [cannibalization, unit-margin, premium-brand]
    skills: [go-no-go]
  - id: unit-margin
    term: Unit margin
    short: What a company keeps on each kilogram after paying formulation, packaging and promotion costs.
    related: [wholesale-price, cash-cow, price-brand]
    skills: [go-no-go]
  - id: cannibalization
    term: Cannibalization
    short: A new product's sales that come from the company's own existing products instead of from new buyers.
    related: [cash-cow, brand-extension, market-share]
    skills: [go-no-go]
  - id: marlboro-friday
    term: Marlboro Friday
    short: The 1993 day Philip Morris cut Marlboro's price 20 percent, which analysts read as big brands losing to cheaper ones.
    related: [premium-brand, price-brand]
    skills: [go-no-go]
  - id: value-proposition
    term: Value proposition
    short: The promise a brand makes about what the shopper gets, and why it is worth the price.
    related: [premium-brand, price-brand, repositioning]
    skills: [brand-product]
  - id: brand-extension
    term: Brand extension
    short: Using an existing brand name on a new version or product.
    related: [repositioning]
    skills: [brand-product]
  - id: repositioning
    term: Repositioning
    short: Changing how an existing brand is presented so that it appeals to a different group of shoppers.
    related: [brand-extension]
    skills: [brand-product]
  - id: wholesale-price
    term: Wholesale price
    short: The price a shop pays the manufacturer, not the price the shopper pays.
    related: [unit-margin, generalist-wholesaler, specialized-distributor]
    skills: [mix-channels]
  - id: above-the-line
    term: Above-the-line communication
    short: Media advertising, such as television, which reaches many people at a low cost per contact.
    related: [below-the-line]
    skills: [mix-channels]
  - id: below-the-line
    term: Below-the-line communication
    short: Trade promotions, events and displays in shops, which reach fewer people at a higher cost per contact.
    related: [above-the-line]
    skills: [mix-channels]
  - id: generalist-wholesaler
    term: Generalist wholesaler
    short: A wholesaler that supplies many categories and brands over a wide area, mostly to larger shops.
    related: [specialized-distributor]
    skills: [mix-channels]
  - id: specialized-distributor
    term: Specialized distributor
    short: A small distributor with exclusive rights to sell all of one manufacturer's brands in a few categories in a local area.
    related: [generalist-wholesaler]
    skills: [mix-channels]
