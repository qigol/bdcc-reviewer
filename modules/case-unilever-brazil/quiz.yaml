templates:
  # ------------------------------------------------------------------ brazil-regions
  - id: regions-mcq
    type: mcq
    skills: [brazil-regions]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: two-brazils }
    prompt: Which statement about Brazil's Northeast compared with the Southeast matches the case?
    options:
      - Income per person was much lower and illiteracy much higher in the Northeast
      - Income per person was higher in the Northeast
      - Illiteracy was the same in both regions
      - The Northeast had more washing machines
    answer: 0
    hints:
      - The case lists per-capita income of about 2,250 and 6,600 dollars.
    explanation: In 1996 income per person was about 2,250 dollars in the Northeast and 6,600 in the Southeast, and illiteracy was 40 percent against 15 percent.

  - id: wash-habits-mcq
    type: mcq
    skills: [brazil-regions]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: two-brazils }
    prompt: How do women in the Northeast typically wash clothes?
    options:
      - They scrub with bars of laundry soap, add bleach for tough stains, and add only a little powder at the end
      - They load a washing machine with powder and softener
      - They send clothes to a dry cleaner
      - They use liquid detergent only
    answer: 0
    hints:
      - Only 28 percent of households in Recife had a washing machine.
    explanation: In the Southeast the process looks like European or North American habits, with powder and softener in a machine.

  - id: washing-match
    type: match
    skills: [brazil-regions]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: two-brazils }
    prompt: Match each fact to the city it describes.
    pairs:
      - ['28 percent of households own a washing machine', 'Recife (Northeast)']
      - ['67 percent of families own a washing machine', 'Sao Paulo (Southeast)']
      - ['73 percent of women think bleach is necessary for fat stains', 'Recife (Northeast)']
      - ['Clothes washed about 3.9 times a week', 'Sao Paulo (Southeast)']
    hints:
      - Washing is more frequent where people own fewer clothes.
    explanation: Clothes are washed more often in the Northeast, 5 times a week against 3.9.

  - id: pride-mcq
    type: mcq
    skills: [brazil-regions, consumer-needs]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: two-brazils }
    prompt: Why is washing a social activity in the Northeast?
    options:
      - Many women wash at public laundries, rivers or ponds, where they meet friends, and spotless clothes show a mother's dedication
      - They are forced to wash in groups by law
      - Washing machines are banned
      - Clothes are washed once a month
    answer: 0
    hints:
      - Think about status and pride.
    explanation: In the Southeast, where most women own a machine, cleanliness matters less for self-esteem and status.

  # ------------------------------------------------------------------ consumer-needs
  - id: attributes-multi
    type: multi
    skills: [consumer-needs]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: what-shoppers-want }
    prompt: Which are among the six key attributes Northeastern consumers use to judge detergents, along with price?
    options:
      - Cleaning and whitening power, often judged by foam
      - Smell and softness
      - Ability to remove stains without soap and bleach
      - Easy dissolving and no residue
      - Impact on colors, the least important
      - The brand's country of origin
    answer: [0, 1, 2, 3, 4]
    hints:
      - Five of the six options are attributes.
    explanation: Packaging is the sixth attribute, and consumers prefer simple, easy-to-recognize packs.

  - id: importance-order
    type: order
    skills: [consumer-needs]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: what-shoppers-want }
    prompt: Put the attributes from most important to least important to Northeastern consumers.
    items:
      - Cleaning and whitening power
      - Smell and softness
      - Stain removal
      - Packaging
      - Impact on colors
    hints:
      - Power comes first and harm to colors comes last.
    explanation: Importance was 24, 20, 16, 16 (dissolving), 13 and 11 percent in that order, with stain removal and dissolving tied at 16.

  - id: foam-mcq
    type: mcq
    skills: [consumer-needs]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: what-shoppers-want }
    prompt: How do consumers in the Northeast often judge the power of a detergent?
    options:
      - By the amount of foam it produces
      - By the price of the box
      - By the name of the factory
      - By television ads
    answer: 0
    hints:
      - Soft water also produces great quantities of foam from soap.
    explanation: Power is the most important attribute and is often judged by foam.

  - id: packaging-mcq
    type: mcq
    skills: [consumer-needs, brand-product]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: what-shoppers-want }
    prompt: What do low-income consumers prefer in packaging, according to the case?
    options:
      - Distinctive, simple and easy-to-recognize packs that are easy to open and protect against humidity
      - Plastic sachets because they are cheapest
      - Complicated designs with long text
      - Glass jars
    answer: 0
    hints:
      - Many are barely literate.
    explanation: Consumers were attached to boxes and regarded anything else as good for second-rate products.

  # ------------------------------------------------------------------ market-structure
  - id: market-size-mcq
    type: mcq
    skills: [market-structure]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: market-map }
    prompt: In 1996, how did the Northeast's detergent powder and laundry soap markets compare?
    options:
      - They were about the same size in dollars, but powder grew faster
      - Soap was ten times bigger
      - Powder was ten times bigger
      - Both were shrinking
    answer: 0
    hints:
      - Powder was about 106 million dollars and soap 102 million.
    explanation: Powder grew 17 percent a year and soap 6 percent.

  - id: entry-mcq
    type: mcq
    skills: [market-structure]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: market-map }
    prompt: Why were barriers to entry higher in detergent powder than in laundry soap?
    options:
      - Powder is capital intensive to make, while soap is easy to produce from fats and oils
      - Soap needs a patent
      - Powder is banned for small firms
      - Soap is more expensive
    answer: 0
    hints:
      - Powder needs a dry tower and steam.
    explanation: Animal fat for soap is produced in large quantities by slaughterhouses, so soap was fragmented among local firms.

  - id: shares-match
    type: match
    skills: [market-structure]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: market-map }
    prompt: Match each Northeast detergent powder brand to its share and price.
    pairs:
      - ['Omo', 'About 52 percent share at 3 dollars per kg']
      - ['Minerva powder', 'About 17 percent share at 2.40 dollars per kg']
      - ['Campeiro', 'About 6 percent share at 1.70 dollars per kg']
      - ['Ace (P&G)', 'About 11 percent share at 2.40 dollars per kg']
    hints:
      - Omo is the leader and the most expensive.
    explanation: Unilever's three brands together held about 75 percent of the Northeast powder market.

  - id: awareness-match
    type: match
    skills: [market-structure]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: market-map }
    prompt: Match each brand measure to its definition.
    pairs:
      - ['[[top-of-mind-awareness|Top-of-mind awareness]]', 'Share of consumers who name the brand first']
      - ['[[brand-knowledge|Brand knowledge]]', 'Share who say they know the brand']
      - ['[[market-penetration|Market penetration]]', 'Share who bought at least once in the past year']
    hints:
      - One is about buying, two are about thinking.
    explanation: The case tracks these three measures for the major brands in the Northeast.

  - id: soap-mcq
    type: mcq
    skills: [market-structure]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: market-map }
    prompt: Who were Unilever's main competitors in laundry soap, and why?
    options:
      - Local Brazilian companies, because P&G did not make laundry soap
      - P&G, because it led the soap market
      - Nirma, because it had entered Brazil
      - No one, because the market was empty
    answer: 0
    hints:
      - The top four players held only 38 percent of soap.
    explanation: ASA with Bem-te-vi had 11 percent, and the market was very fragmented.

  # ------------------------------------------------------------------ go-no-go
  - id: margin-omo-mcq
    type: mcq
    skills: [go-no-go]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: go-no-go }
    prompt: Omo sells at 3.00 dollars per kg to retailers. Formulation costs 1.65, packaging 0.35 and promotion 0.35 per kg. What is its unit margin per kg?
    options:
      - 0.65 dollars
      - 1.35 dollars
      - 1.00 dollars
      - 0.35 dollars
    answer: 0
    hints:
      - Subtract all three costs from the price.
    explanation: 3.00 minus 1.65, 0.35 and 0.35 is 0.65 dollars per kg.

  - id: margin-campeiro-mcq
    type: mcq
    skills: [go-no-go]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: go-no-go }
    prompt: Campeiro sells at 1.70 dollars per kg. Formulation costs 0.90, packaging 0.35 and promotion 0.20. What is its unit margin?
    options:
      - 0.25 dollars
      - 0.50 dollars
      - 0.80 dollars
      - 0.35 dollars
    answer: 0
    hints:
      - Add the three costs first.
    explanation: 1.70 minus 0.90, 0.35 and 0.20 is 0.25 dollars per kg.

  - id: cannibal-mcq
    type: mcq
    skills: [go-no-go]
    difficulty: 3
    tags: [application]
    lessonRef: { tab: intuition, id: go-no-go }
    prompt: Using the margins of Omo (0.65 per kg) and Campeiro (0.25 per kg), what does Unilever lose on each kg of Omo that a buyer swaps for Campeiro?
    options:
      - 0.40 dollars per kg
      - 0.25 dollars per kg
      - 0.65 dollars per kg
      - 0.90 dollars per kg
    answer: 0
    hints:
      - Subtract the new margin from the old.
    explanation: The margin falls from 0.65 to 0.25, a loss of 0.40 per kg, which is cannibalization at work.

  - id: cannibal-term-mcq
    type: mcq
    skills: [go-no-go]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: go-no-go }
    prompt: What is cannibalization?
    options:
      - A new product's sales that come from the company's own existing products
      - A rival copying a product
      - Selling below cost
      - Buying a competitor
    answer: 0
    hints:
      - The company eats its own sales.
    explanation: Davidson asked what share of new sales could come from other Unilever brands before the company would start losing money.

  - id: debate-match
    type: match
    skills: [go-no-go]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: go-no-go }
    prompt: Match each argument to the person who made it.
    pairs:
      - ['We should not divert money from premium brands to a cheaper one', 'Fernanda, the category manager']
      - ['We already have 81 percent of the market and see no other way to grow', 'Laercio']
      - ['Brazil is not India, and the investment community may think we abandoned premium brands', 'Fernanda, the category manager']
      - ['We would gain expertise in marketing to low-income consumers', 'Laercio']
    hints:
      - Laercio argues for going ahead.
    explanation: The debate shows both the risks and the upside of targeting the low-income segment.

  - id: nirma-mcq
    type: mcq
    skills: [go-no-go]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: go-no-go }
    prompt: What did the Indian detergent Nirma show Laercio?
    options:
      - A small local entrepreneur's low-price brand can take almost half a market from a global leader
      - Premium brands always win
      - Low prices never work
      - Detergent cannot be sold in India
    answer: 0
    hints:
      - Nirma took 48 percent of the Indian market.
    explanation: Unilever was a distant second in India with 24 percent, which is why Laercio feared local brands.

  # ------------------------------------------------------------------ brand-product
  - id: brand-options-match
    type: match
    skills: [brand-product]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: brand-and-product }
    prompt: Match each brand strategy to the extra marketing cost the case assumes per kg.
    pairs:
      - ['Develop a new brand', '0.10 dollars']
      - ['Launch a brand extension', '0.05 dollars']
      - ['Reposition an existing brand', 'No extra marketing cost']
    hints:
      - The more new, the more it costs.
    explanation: These costs are given for the break-even analysis.

  - id: product-options-mcq
    type: mcq
    skills: [brand-product]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: brand-and-product }
    prompt: Which was one of Unilever's product options for the new brand?
    options:
      - A third formula priced halfway between Minerva and Campeiro, by dropping some ingredients
      - Copy Omo exactly at half the price
      - Sell only soap
      - Use no formula
    answer: 0
    hints:
      - The question was which attributes to remove, keep or improve.
    explanation: Unilever could also use Campeiro's formulation or Minerva's, which might be too expensive.

  - id: sachet-mcq
    type: mcq
    skills: [brand-product]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: brand-and-product }
    prompt: A plastic sachet costs 30 percent of a cardboard box. Why might Unilever still not use only sachets?
    options:
      - Low-income consumers were attached to boxes and saw other packaging as for second-rate products
      - Sachets are illegal
      - Boxes are cheaper
      - Sachets cannot hold powder
    answer: 0
    hints:
      - Think about perception.
    explanation: One solution might be to launch several types and sizes.

  - id: value-prop-mcq
    type: mcq
    skills: [brand-product]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: brand-and-product }
    prompt: What risk does an ad that says the product is for low-income people carry?
    options:
      - Shoppers may be reluctant to buy because such products are usually inferior
      - It always doubles sales
      - It is illegal
      - It confuses retailers
    answer: 0
    hints:
      - The case compares it with aspirational messages.
    explanation: But aspirational messages might confuse consumers and cause unwanted cannibalization.

  # ------------------------------------------------------------------ mix-channels
  - id: price-mcq
    type: mcq
    skills: [mix-channels]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: price-promo-shops }
    prompt: Why was the wholesale price the single most important decision?
    options:
      - Too high and the product is out of reach, too low and it increases cannibalization
      - It sets the factory size
      - It decides the brand name
      - It is set by the government
    answer: 0
    hints:
      - There are two risks, one at each end.
    explanation: Unilever could also use coupons or change the prices of Omo, Minerva and Campeiro.

  - id: line-mcq
    type: mcq
    skills: [mix-channels]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: price-promo-shops }
    prompt: In regular detergent markets, how did Unilever split communication spending?
    options:
      - 70 percent above the line and 30 percent below the line
      - 30 percent above and 70 percent below
      - All above the line
      - All below the line
    answer: 0
    hints:
      - Television reaches almost every Brazilian.
    explanation: A 70 percent below-the-line plan would cost about one third as much but reach fewer people at a higher cost per contact.

  - id: distribution-match
    type: match
    skills: [mix-channels]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: price-promo-shops }
    prompt: Match each feature to the channel it describes.
    pairs:
      - ['Hundreds of products, wide reach, opportunistic relationship', 'Generalist wholesaler']
      - ['20 to 40 products, small, partnership with the manufacturer', 'Specialized distributor']
      - ['Variable cost of 0.10 dollars per kg to reach the smallest stores', 'Generalist wholesaler']
      - ['Variable cost of 0.05 dollars per kg to reach the smallest stores', 'Specialized distributor']
    hints:
      - The specialist is the smaller and cheaper one.
    explanation: About 75,000 small outlets were hard for Unilever to reach on its own.

  - id: outlets-mcq
    type: mcq
    skills: [mix-channels]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: price-promo-shops }
    prompt: Where did low-income consumers in the Northeast mostly shop?
    options:
      - Small local stores, which also gave them advice and credit
      - Large supermarkets like Carrefour
      - Online only
      - Factories
    answer: 0
    hints:
      - There were about 75,000 of them.
    explanation: Getting buy-in from small store owners was crucial.

  - id: channel-order
    type: order
    skills: [go-no-go, brand-product]
    difficulty: 3
    tags: [application]
    lessonRef: { tab: intuition, id: go-no-go }
    prompt: Put the questions Unilever must answer in a sensible order.
    items:
      - Should we target low-income consumers at all?
      - What value proposition and brand fit them?
      - What product, packaging and price deliver it?
      - How will we communicate and distribute it?
    hints:
      - Decide whether to go before designing.
    explanation: The go or no-go decision comes first, followed by brand and marketing mix choices.
