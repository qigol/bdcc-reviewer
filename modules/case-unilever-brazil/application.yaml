intro: |
  The case stops just before the decision. Use the numbers in it to test the arguments, then make the call yourself. The case
  does not say what Unilever did, and neither does this module.
case:
  id: unilever-decision
  title: Go or no-go for the Northeast
  story: |
    Robert Davidson, head of Unilever's Home Care division in Brazil, must decide whether the company should market
    detergent to low-income consumers in the Northeast. Unilever already holds 81 percent of Brazil's detergent powder market.
    Laercio wants a cheaper brand. Fernanda fears cannibalization. All figures below come from the case.
  cells:
    - id: cannibal-step
      title: What does one switched kilogram cost?
      say: |
        Take a simple view. A new Unilever brand would have the same economics as Campeiro. Suppose a shopper who used to buy
        a kilogram of Omo switches to it. The table gives each brand's price and costs per kilogram.
      stage:
        - id: unit-table
          widget: Schedule
          props:
            title: Dollars per kg
            columns: [Wholesale price, Formulation, Packaging, Promotion]
            rows:
              - { label: Omo, amounts: ['3.00', '1.65', '0.35', '0.35'] }
              - { label: Campeiro, amounts: ['1.70', '0.90', '0.35', '0.20'] }
      decision:
        prompt: By how much does Unilever's profit change on that switched kilogram?
        type: mcq
        options:
          - It falls by 0.40 dollars
          - It falls by 0.65 dollars
          - It rises by 0.25 dollars
          - It falls by 1.30 dollars
        answer: 0
        optionFeedback:
          1: That ignores the 0.25 dollars the cheaper brand still earns.
          2: That counts only the new margin and ignores the Omo margin that is lost.
        model: Omo earns 0.65 per kg and Campeiro 0.25 per kg, so a switch loses 0.40 per kg. New buyers add 0.25 per kg each.
    - id: break-even-step
      title: How much cannibalization can Unilever stand?
      say: |
        Now Davidson's question. Assume every cannibalized kilogram comes from Omo and the new brand has Campeiro's economics
        with no extra marketing cost, as for a repositioned brand. For each kilogram of the new brand that Unilever sells, some
        share came from Omo and the rest from new buyers.
      stage:
        - id: breakeven-note
          widget: Callout
          props:
            kind: note
            title: Use your own arithmetic
            body: Use the margins you found in the cell above. Every kg sold earns the new margin, and every cannibalized kg also loses what Omo would have earned.
      decision:
        prompt: At about what cannibalization rate does the new brand stop adding profit?
        type: mcq
        options:
          - About 38 percent
          - About 25 percent
          - About 62 percent
          - About 50 percent
        answer: 0
        optionFeedback:
          1: Do not use the margin as a percentage. Compare 0.25 with the 0.65 lost on each cannibalized kg.
        model: Net profit per kg of new sales is 0.25 minus 0.65 times the cannibalized share. It is zero when the share is 0.25 divided by 0.65, about 38 percent. Above that, Unilever loses money.
    - id: new-brand-step
      title: What if it is a new brand?
      say: |
        Marketing says a brand-new name would add 0.10 dollars per kilogram in extra marketing costs. A repositioned existing brand
        would add nothing. The new brand otherwise has the same costs as Campeiro.
      stage:
        - id: newbrand-note
          widget: Callout
          props:
            kind: note
            title: Assumption
            body: From the case, a new brand adds 0.10 dollars per kg, a brand extension 0.05 and repositioning 0.
      decision:
        prompt: With the new-brand cost, what is the break-even cannibalization rate if every cannibalized kg comes from Omo?
        type: mcq
        options:
          - About 23 percent
          - About 38 percent
          - About 15 percent
          - About 62 percent
        answer: 0
        optionFeedback:
          1: That is the repositioning case with no extra cost.
        model: The margin falls to 0.15, so the break-even share is 0.15 divided by 0.65, about 23 percent. A new brand leaves less room for cannibalization than repositioning.
    - id: channel-step
      title: Reaching 75,000 small stores
      say: |
        Unilever cannot reach the 75,000 small outlets alone. Generalist wholesalers have wide reach but are price driven and
        sometimes use smaller local wholesalers. Specialized distributors give exclusive local focus and partnership.
      stage:
        - id: channel-table
          widget: Schedule
          props:
            title: Channel comparison
            columns: [Generalist wholesaler, Specialized distributor]
            rows:
              - { label: Variable cost to reach the smallest stores per kg, amounts: ['0.10 dollars', '0.05 dollars'] }
              - { label: Point-of-purchase work, amounts: ['Limited, focused on gaining distribution', Extensive] }
              - { label: Relationship, amounts: ['Opportunistic, price driven', 'Partnership, information exchange'] }
      decision:
        prompt: Which channel fits the goal of building the brand at the smallest stores?
        type: mcq
        options:
          - Specialized distributors, for lower cost and strong in-store support
          - Generalist wholesalers, for lower cost per kg
          - No channel, selling direct from the factory
          - Supermarkets only
        answer: 0
        optionFeedback:
          1: The generalist's cost per kg to reach the smallest stores is higher in the case.
        model: Specialized distributors cost 0.05 per kg against 0.10 and give extensive point-of-purchase work and partnership, which suits small stores that shoppers rely on.
    - id: call-step
      title: Your call
      say: |
        Weigh the facts. Unilever has 75 percent of the Northeast powder market and a large premium brand. Poor shoppers want
        power, smell and good boxes. Local brands could attack. The case does not say what happened next.
      stage:
        - id: call-note
          widget: Callout
          props:
            kind: tip
            title: Remember
            body: Use only facts from the case. State your recommendation, the brand and price you would choose, and the main risk you accept.
      decision:
        prompt: What would you recommend, and what is the main risk you accept?
        type: open
        model: |
          A strong answer decides go or no-go and backs it with a figure. For example, go with a repositioned or extended
          brand because it has low extra cost and a break-even cannibalization rate near 38 percent, and accept the risk that
          Omo buyers switch. Or hold back if you think cannibalization will exceed that rate or the brand image could suffer.
atScale:
  title: In practice
  body: |
    Consumer goods firms test each choice before a launch. They run field studies in shoppers' homes, test products and
    packs in a few towns, and track awareness and trial. They build break-even tables for each brand option and set
    a limit on how much cannibalization they will accept. Distribution partners are often chosen last but decide whether
    the product reaches small stores.
tradeoffs:
  title: Brand options for the new low-price product
  columns: [Option, Benefit, Risk]
  rows:
    - [Reposition an existing brand, No extra marketing cost, Confuses the existing brand image]
    - [Brand extension, 'Uses a known name for 0.05 dollars per kg', Dilutes the parent brand]
    - [New brand, 'Clean fit for low-income shoppers', Costs 0.10 dollars per kg and adds to a crowded portfolio]
connections:
  - module: intl-marketing
    note: Standardize or adapt, the six product and message strategies, and gray market and distribution choices.
  - module: market-entry
    note: Segment scanning and the five segment criteria apply to the Northeast low-income shoppers.
  - module: economic-forces
    note: Income gaps and social classes explain why one price does not fit all of Brazil.
explainBack:
  prompt: |
    Explain to a friend why Unilever hesitated to sell a cheaper detergent to poor shoppers in the Northeast, and how the case's
    numbers show how much cannibalization it could accept.
  rubric:
    - Describes the differences between the Northeast and Southeast
    - Uses unit margins to explain cannibalization
    - Mentions one choice about brand, price, communication or distribution
