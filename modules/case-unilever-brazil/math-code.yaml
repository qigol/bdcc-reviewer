sections:
  - id: key-terms
    title: Key terms lookup
    skills:
      - brazil-regions
      - consumer-needs
      - market-structure
      - go-no-go
      - brand-product
      - mix-channels
    summary: "A placeholder section: this module is conceptual, so the workbench only looks up the meaning of its key terms.
      Pick a term to see what it means."
    keyFormula: \text{term} \rightarrow \text{meaning}
    state:
      term: social-class
    derive:
      - fn: termLookup
        in:
          term: "@term"
        out: k
    live:
      - id: r
        widget: Readout
        props:
          items:
            - label: Term
              value: "{=k.name}"
              tone: accent
            - label: Meaning
              value: "{=k.meaning}"
              tone: good
      - id: pick
        widget: Choice
        props:
          label: Term
          options:
            - value: social-class
              label: Social class
            - value: detergent-powder
              label: Detergent powder
            - value: cash-cow
              label: Cash cow
            - value: value-proposition
              label: Value proposition
            - value: wholesale-price
              label: Wholesale price
        bind:
          value: term
    steps:
      - tex: |
          \anchor{lookup}{\text{term}} ;\mapsto; \text{meaning}
        say: Each term has one meaning in this lecture.
      - tex: |
          \anchor{answer}{\text{meaning}} = \text{{=k.name|text}}
        say: "{=k.name}: {=k.meaning}"
    code:
      lang: python
      title: A term lookup
      source: |
        TERMS = {
            "social-class": "Social class",
            "detergent-powder": "Detergent powder",
            "cash-cow": "Cash cow",
            "value-proposition": "Value proposition",
            "wholesale-price": "Wholesale price",
        }

        def term_lookup(term):
            """Look up a key term from the lecture.

            Args:
                term: the term's id.
            Returns:
                The term's name.
            Placeholder: this module is conceptual; see the Intuition tab.
            """
            name = TERMS[term]       # @a:lookup
            return name              # @a:answer
    links:
      - anchor: lookup
        label: Find the term
      - anchor: answer
        label: Its meaning
    trace:
      fn: termLookup
      in:
        term: "@term"
    examples:
      - term-social-class
      - term-detergent-powder
      - term-cash-cow
      - term-value-proposition
      - term-wholesale-price
    tryIt:
      - washing-match
      - regions-mcq
    pitfalls:
      - Memorizing the term without the idea behind it. The Intuition tab explains each one.
    examTip: "Exam questions on this lecture are conceptual: know what each term means and when it applies."
