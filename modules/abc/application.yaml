intro: |
  Any plant that makes both standard and custom products faces the same question: is the custom work as profitable as
  the single overhead rate says? This case takes a Cebu kitchenware maker from its machine-hour rate to a four-pool ABC
  system, then uses the new costs to answer a real bid.
case:
  id: cebu-kitchenware
  title: Cebu Kitchenware re-costs its product lines
  story: |
    Cebu Kitchenware Co. makes standard pots in long runs, premium cookware sets in medium batches, and custom orders for
    hotels and resorts in small, design-heavy batches. Factory overhead of ₱2,720,000 is applied at one rate per machine
    hour; the plant's ₱400,000 of administration cost is not in that rate. Sales says the
    hotel line is the most profitable; the new controller is not so sure. All figures are synthetic.
  data: [cebu]
  state: { system: trad }
  derive:
    - { fn: compare, in: { products: '@cebu.products', pools: '@cebu.pools', baseLabel: '@cebu.baseLabel', omit: [c-tradm] }, out: cc }
    - { fn: compareView, in: { products: '@cebu.products', pools: '@cebu.pools', baseLabel: '@cebu.baseLabel', system: '@system' }, out: cv }
    - { fn: hierarchy, in: { pools: '@cebu.pools' }, out: hy }
    - { fn: bid, in: { products: '@cebu.products', pools: '@cebu.pools', bid: '@cebu.bid' }, out: bd }
  cells:
    - id: old-rate
      title: The old machine-hour rate
      say: |
        ₱2,720,000 over 32,000 machine hours is {=cc.tradRate|money} an hour. Standard pots take half an hour each, premium
        sets one hour, hotel pieces two hours. Prices: a pot ₱420, a premium set ₱1,500, a hotel piece ₱2,400.
      stage:
        - id: pick
          widget: Choice
          props:
            label: Overhead assigned with
            options:
              - { value: trad, label: One machine-hour rate }
              - { value: abc, label: Four activity pools }
          bind: { value: system }
        - { id: view, widget: Schedule, props: { title: 'Per unit, {=cv.label}', columns: '@cv.columns', rows: '@cv.rows' } }
      decision:
        prompt: Under the single rate, which product line shows the highest margin (price minus full cost, as a share of price)?
        type: mcq
        options: ['Hotel custom orders', 'Premium sets', 'Standard pots', 'All three earn about the same margin']
        answer: 0
        optionFeedback:
          1: 'Premium sets show 44.3% under the single rate, (1,500 − 835) ÷ 1,500: close, but the hotel line is a little higher.'
          2: 'Standard pots show the lowest margin, (420 − 282.50) ÷ 420 = 32.7%.'
          3: 'Pots trail at 32.7% while premium sets and hotel pieces sit near 44–45%, so they are not all the same.'
        model: 'Hotel: $(2{,}400 - 1{,}320) \div 2{,}400 = 45\%$. Premium: $(1{,}500 - 835) \div 1{,}500 = 44.3\%$. Pots: $(420 - 282.50) \div 420 = 32.7\%$. The hotel line wins narrowly, the figure Sales has been quoting.'
    - id: pools
      title: Four pools, four drivers
      say: |
        Interviews and activity logs split overhead into machining (per machine hour), setups, inspections and design
        changes. The hotel line runs 240 of the 400 setups and 40 of the 60 design changes on 4% of the units.
      stage:
        - { id: rates, widget: Schedule, props: { title: Activity rates, columns: '@cc.rateColumns', rows: '@cc.rateRows' } }
        - { id: hier, widget: Schedule, props: { title: Overhead by level of the hierarchy, rows: '@hy.rows' } }
      decision:
        prompt: Plant administration (₱400,000) pays for the plant manager's office, security and property insurance. What should the controller do with it?
        type: mcq
        options:
          - Keep it out of the product costs and report it separately
          - Spread it over the lines by machine hours, as the old rate did
          - Add it to the setup pool, since every setup uses the plant
          - Split it equally over the three lines, since each uses the plant
        answer: 0
        optionFeedback:
          1: 'Administration doesn''t rise with machine hours. Spreading it that way brings back the volume distortion ABC removes.'
          2: 'Setups don''t cause the manager''s office, security or insurance. Adding them to the setup pool would overcost the batch-heavy hotel line.'
          3: 'An equal split is arbitrary: no line causes a third of these costs. Facility-level costs are usually reported separately.'
        model: These costs keep the whole plant running but don't vary with any product's machine hours, setups or units, so no driver links them to a product. They are facility-level costs; spreading them by machine hours, setups or equal shares would reintroduce distortion.
    - id: abc-costs
      title: The ABC unit costs
      say: |
        Under ABC, standard pots carry {=cc.abcOH.standard|money2} of overhead, premium sets {=cc.abcOH.premium|money2} and
        hotel pieces {=cc.abcOH.hotel|money2}.
      stage:
        - { id: as, widget: Schedule, props: { title: Overhead assigned under ABC, columns: '@cc.columns', rows: '@cc.assignRows' } }
        - { id: cr, widget: Schedule, props: { title: Unit costs and margins, columns: '@cc.columns', rows: '@cc.costRows' } }
      decision:
        prompt: What happened to the hotel line's margin, and why?
        type: open
        model: |
          It fell from 45% to about 31%. The hotel line uses 60% of the setups and two-thirds of the design changes, which
          the machine-hour rate spread mostly onto standard pots. Standard pots were overcosted by ₱18.70 a unit and are
          more profitable than reported (37% rather than 33%).
    - id: bid
      title: A resort chain's order
      say: |
        A resort chain wants 500 custom pieces: ₱1,150 of materials and labor each, 1,000 machine hours, 30 setups, 120
        inspections and 8 design changes. A competitor has quoted ₱1,450 a piece.
      stage:
        - { id: bu, widget: Schedule, props: { title: 'What the order uses', rows: '@bd.useRows' } }
      decision:
        prompt: Using the activity rates above, what is the order's full cost per piece under ABC?
        type: mcq
        options: ['₱1,520', '₱1,320', '₱1,150', '₱1,900']
        answer: 0
        optionFeedback:
          1: '₱1,320 uses the single machine-hour rate (1,000 × ₱85 ÷ 500 = ₱170 of overhead a piece), not the activity rates.'
          2: '₱1,150 is materials and labor only; the order''s overhead is missing.'
          3: '₱1,900 is the cost-plus-25% quote (₱1,520 × 1.25), not the cost.'
        model: 'ABC overhead $= 1{,}000 \times 40 + 30 \times 1{,}500 + 120 \times 300 + 8 \times 8{,}000 = ₱185{,}000$, or ₱370 a piece, so the full cost is $1{,}150 + 370 = ₱1{,}520$. The single machine-hour rate gives $1{,}000 \times 85 \div 500 = ₱170$ of overhead (₱1,320); ₱1,150 leaves overhead out; ₱1,900 is the cost-plus-25% quote.'
    - id: bid-call
      title: Take the order?
      say: |
        Sales still wants to match the competitor's ₱1,450, pointing out that the machine-hour rate shows a profit.
        Assume the order's setups, inspections and design changes are extra work it causes.
      decision:
        prompt: Should Cebu Kitchenware take the order at ₱1,450 a piece?
        type: mcq
        options:
          - No; at its ABC full cost every piece loses money
          - Yes; under the single machine-hour rate it shows a profit
          - Yes; the price more than covers materials and labor
          - No; the price is below the cost-plus-25% quote
        answer: 0
        optionFeedback:
          1: 'The ₱1,320 single-rate cost spreads overhead by machine hours and misses the setups, inspections and design changes this order causes. At its ABC cost, each piece loses money.'
          2: 'Materials and labor are not the only costs the order adds: it also causes ₱370 a piece of overhead.'
          3: 'The quote includes a 25% markup, so a price below it could still be profitable. Compare the price with the ABC full cost instead.'
        model: |
          At ₱1,520 a piece, matching ₱1,450 loses $500 \times 70 = ₱35{,}000$; the machine-hour rate's ₱1,320 hides the
          loss. This holds only because the setups, inspections and design work really are caused by the order. For any
          special order, compare the price with the costs that actually change; ABC is good at finding them.
    - id: response
      title: What to do about the hotel line
      say: The owners don't want to abandon hotels; the line brings prestige and repeat business.
      decision:
        prompt: Using the ABC data, suggest two ways to make custom hotel work profitable without dropping it.
        type: open
        model: |
          Attack the drivers: offer a catalogue of pre-designed hotel pieces to cut design changes, and set minimum order
          sizes or batch scheduling to cut setups per unit. Price the rest honestly: quote custom orders from ABC costs,
          with explicit charges for design changes and small runs.
    - id: keep-it
      title: Is ABC worth keeping?
      say: The controller's ABC model took a month of interviews and needs quarterly updates.
      decision:
        prompt: Is ABC worth the ongoing cost for Cebu Kitchenware?
        type: open
        model: |
          Yes. Overhead is large (₱2.7 million), the three lines differ sharply in setups and design work, and real pricing
          decisions (bids like the resort order) depend on the result. Four pools are enough; the company doesn't need a
          20-pool system, and its accounting software (an ERP, enterprise resource planning system) can collect the setup, inspection and design-change counts.
atScale:
  title: ABC in practice
  body: |
    **Design.** A cost accountant and the operations managers map activities with interviews, time studies and the logs
    of the company's ERP (enterprise resource planning) software, then regroup overhead accounts into a handful of pools (four to six capture most of the accuracy). Drivers are
    chosen for cause and effect; the data to count them (setups, inspections, change orders) usually already exists in
    production and quality systems.

    **Running it.** Activity rates are set from the budget at the start of the year, like a POHR. The ERP (SAP CO's
    activity types, Oracle, or Odoo with analytic accounts; a spreadsheet model in smaller firms) multiplies each order's
    driver counts by the rates. Facility-level costs are reported separately.

    **Using it.** Product costs feed price lists, bids and product-mix reviews; customer costs feed account-management
    decisions. The activity-based management module uses the same pools to find and remove non-value-added work.

    **Maintenance.** Rates and drivers are reviewed yearly, or when the product mix changes. Many companies pilot ABC on
    one product line before rolling it out.
tradeoffs:
  title: Designing an ABC system
  columns: [Choice, Option A, Option B, When to prefer B]
  rows:
    - ['Overhead assignment', 'One plantwide rate', 'Activity-based rates', 'Overhead is large and products differ in setups, inspections and design work']
    - ['Number of pools', 'Four to six well-chosen pools', 'An exhaustive 20-pool system', 'Rarely; only where the extra accuracy changes decisions']
    - ['Driver for each pool', 'Data already available (e.g. labor hours)', 'The activity that causes the cost', 'Always, unless the convenient driver is also the causal one']
    - ['Facility-level costs', 'Allocate them on some base', 'Report them separately', 'No driver links them to products']
connections:
  - { module: job-order, note: 'Activity rates are the job-order module''s predetermined overhead rate, computed once per pool. Its departmental rates (Job 105) are the step between one plantwide rate and activity pools.' }
  - { module: cost-flows, note: 'The Sarver Company example in the supplemental notes is a first ABC computation with five pools.' }
  - { module: abm, note: 'Activity-based management turns these pools into a management tool: value-added analysis, driver analysis, customer and supplier cost.' }
explainBack:
  prompt: Explain to Cebu Kitchenware's sales manager why the hotel line is less profitable than the old reports showed.
  rubric:
    - The old system spread all overhead on machine hours, a volume measure
    - Setups and design changes are batch- and product-level costs that the hotel line uses heavily
    - ABC assigns those costs to the products that cause them, raising the hotel line's cost from ₱1,320 to ₱1,660
    - Standard pots were overcosted and were subsidizing hotel work; total overhead is unchanged
