skills:
  - id: distortion
    label: Why a single rate distorts
    description: Volume-based rates, cost distortion and the warning signs of cross-subsidization.
  - id: abc-steps
    label: The three ABC steps and activity rates
    description: Identify activities, compute activity rates, sum what a product consumes.
  - id: apply-abc
    label: Costing a job with activity rates
    description: Rate × driver used for each pool, total and per unit, against the plantwide rate.
  - id: trad-vs-abc
    label: Traditional vs ABC unit costs
    description: Who is over- and undercosted, by how much, and what it does to margins.
  - id: cost-hierarchy
    label: The cost hierarchy
    description: Unit-, batch-, product- and facility-level activities and their drivers.
  - id: abc-services
    label: ABC in services
    description: Cost per visit, transcript or transaction for a service line, and the drivers services use.
  - id: customer-profit
    label: Customer profitability
    description: Gross margin less the ABC cost to serve each customer, and what to do about a losing customer.
  - id: adoption
    label: When ABC is worth it
    description: Benefits, limits, driver choice and the adoption decision.
