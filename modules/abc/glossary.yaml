terms:
  - id: direct-materials
    term: Direct materials
    aka: [DM]
    short: The raw materials that become part of the product and can be traced to it, such as the steel in a tool.
    related: [direct-labor, factory-overhead]
    skills: [distortion]
  - id: direct-labor
    term: Direct labor
    aka: [DL]
    short: The pay of the workers who make the product and whose time can be traced to it.
    related: [direct-materials, factory-overhead]
    skills: [distortion]
  - id: factory-overhead
    term: Factory overhead
    aka: [overhead, OH, manufacturing overhead, MOH]
    short: Every factory cost other than direct materials and direct labor, such as rent, power, setups and inspections; it can't be traced to one product.
    long: |
      Other modules use different titles for the same cost: the job-order and process-costing modules call it
      **Factory Overhead**, and the cost-flows notes call it **Manufacturing Overhead**. They are the same thing.
    related: [predetermined-overhead-rate, plantwide-rate]
    skills: [distortion]
  - id: predetermined-overhead-rate
    term: Predetermined overhead rate
    aka: [POHR, predetermined rate]
    short: Budgeted overhead divided by a budgeted activity measure, set before the year starts and used to charge overhead to products all year.
    formula: '\text{POHR} = \frac{\text{Budgeted overhead}}{\text{Budgeted activity}}'
    related: [plantwide-rate, activity-rate]
    skills: [distortion]
  - id: plantwide-rate
    term: Plantwide overhead rate
    aka: [plantwide rate, single rate, single overhead rate, traditional costing, traditional]
    short: One predetermined rate for all of a plant's overhead, based on one volume measure such as direct labor or machine hours.
    long: |
      Costing every product with one plantwide rate is what this module calls **traditional costing**. "Single rate" and
      "the old system" mean the same thing here.
    formula: '\text{Plantwide rate} = \frac{\text{Total budgeted overhead}}{\text{Total volume driver}}'
    related: [cost-distortion, activity-rate]
    skills: [distortion, apply-abc]
  - id: volume-based-driver
    term: Volume-based driver
    aka: [volume driver, volume measure]
    short: A driver that rises with the number of units made, such as direct labor hours or machine hours.
    related: [plantwide-rate, unit-level]
    skills: [distortion]
  - id: setup
    term: Setup
    aka: [setups, machine setup]
    short: Preparing a machine for a new production run; it is done once per batch, whatever the batch's size.
    related: [batch-level, volume-based-driver]
    skills: [distortion]
  - id: cost-distortion
    term: Cost distortion
    short: The systematic overcosting of some products and undercosting of others caused by one volume-based rate when overhead is driven by non-volume activities.
    related: [cross-subsidization, plantwide-rate]
    skills: [distortion, trad-vs-abc]
  - id: cross-subsidization
    term: Cross-subsidization
    aka: [cross-subsidy]
    short: High-volume, simple products carrying overhead caused by low-volume, complex ones, so the first look costlier and the second cheaper than they are.
    related: [cost-distortion]
    skills: [trad-vs-abc]
  - id: activity-based-costing
    term: Activity-based costing
    aka: [ABC]
    short: Assigns overhead to products by their use of activities, tracing costs first to activities and then from activities to products.
    related: [activity, activity-cost-pool, activity-rate]
    skills: [abc-steps]
  - id: activity
    term: Activity
    short: Any distinct task that consumes resources, such as setting up a machine, inspecting a batch or processing an order.
    related: [activity-cost-pool, cost-driver]
    skills: [abc-steps]
  - id: activity-cost-pool
    term: Activity cost pool
    aka: [cost pool, activity pool]
    short: Overhead regrouped by the activity that consumes it, not by its original account; each pool has its own driver.
    related: [activity, activity-rate]
    skills: [abc-steps]
  - id: cost-driver
    term: Cost driver
    aka: [driver]
    short: A factor that causes, or is closely correlated with, an activity's cost, such as the number of setups or pounds of material.
    related: [activity, activity-rate]
    skills: [abc-steps, adoption]
  - id: activity-rate
    term: Activity rate
    short: An activity pool's budgeted cost divided by its predicted driver level; a predetermined overhead rate computed once per pool.
    formula: '\text{Activity rate} = \frac{\text{Budgeted pool cost}}{\text{Predicted driver level}}'
    related: [activity-cost-pool, cost-driver, predetermined-overhead-rate]
    skills: [abc-steps, apply-abc]
  - id: departmental-rate
    term: Departmental overhead rate
    aka: [departmental rate, departmental rates]
    short: A separate predetermined overhead rate for each production department, each on the volume measure that suits that department.
    related: [plantwide-rate, two-stage-assignment]
    skills: [abc-steps]
  - id: two-stage-assignment
    term: Two-stage cost assignment
    aka: [two stages, Stage 1]
    short: Stage 1 gathers overhead into cost pools (one plantwide pool, departments, or activities); Stage 2 assigns each pool to products or jobs.
    related: [activity-based-costing, departmental-rate]
    skills: [abc-steps]
  - id: unit-level
    term: Unit-level activity
    aka: [unit-level]
    short: Performed for every unit, such as machining a part; machine or labor hours are good drivers for it.
    related: [batch-level, volume-based-driver]
    skills: [cost-hierarchy]
  - id: batch-level
    term: Batch-level activity
    aka: [batch-level]
    short: Performed once per batch whatever its size, such as a setup or a first-article inspection.
    related: [unit-level, product-level, setup]
    skills: [cost-hierarchy]
  - id: product-level
    term: Product-level activity
    aka: [product-level, product-sustaining]
    short: Performed to support a product line whatever its volume or batches, such as engineering changes or regulatory filings.
    related: [batch-level, facility-level]
    skills: [cost-hierarchy]
  - id: facility-level
    term: Facility-level activity
    aka: [facility-level]
    short: Keeps the whole plant running, such as factory rent; often left unallocated in ABC because no driver links it to products.
    related: [product-level]
    skills: [cost-hierarchy]
  - id: gross-margin
    term: Gross margin
    short: Sales minus the cost of the goods sold, before selling and serving costs are taken off.
    formula: '\text{Gross margin} = \text{Sales} - \text{Cost of goods sold}'
    related: [cost-to-serve, operating-profit]
    skills: [customer-profit]
  - id: cost-to-serve
    term: Cost to serve
    aka: [cost-to-serve, serving cost]
    short: What it costs to take a customer's orders and deliver to them, assigned with activity rates.
    related: [gross-margin, customer-profitability]
    skills: [customer-profit]
  - id: operating-profit
    term: Operating profit
    short: What a customer (or product) earns after its cost to serve is subtracted from its gross margin.
    formula: '\text{Operating profit} = \text{Gross margin} - \text{Cost to serve}'
    related: [gross-margin, cost-to-serve]
    skills: [customer-profit]
  - id: customer-profitability
    term: Customer profitability analysis
    aka: [customer profitability]
    short: Ranks customers by gross margin less the ABC-assigned cost of serving them, such as order processing and deliveries.
    formula: '\text{Customer profit} = \text{Gross margin} - \sum \text{rate} \times \text{driver used}'
    related: [activity-based-costing, cost-to-serve]
    skills: [customer-profit]
