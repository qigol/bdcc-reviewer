terms:
  - id: plantwide-rate
    term: Plantwide overhead rate
    aka: [plantwide rate, single rate, single overhead rate]
    short: One predetermined rate for all of a plant's overhead, based on one volume measure such as direct labor or machine hours.
    formula: '\text{Plantwide rate} = \frac{\text{Total budgeted overhead}}{\text{Total volume driver}}'
    related: [cost-distortion, activity-rate]
    skills: [distortion, apply-abc]
  - id: volume-based-driver
    term: Volume-based driver
    aka: [volume driver, volume measure]
    short: A driver that rises with the number of units made, such as direct labor hours or machine hours.
    related: [plantwide-rate, unit-level]
    skills: [distortion]
  - id: cost-distortion
    term: Cost distortion
    short: The systematic overcosting of some products and undercosting of others caused by one volume-based rate when overhead is driven by non-volume activities.
    related: [cross-subsidization, plantwide-rate]
    skills: [distortion, trad-vs-abc]
  - id: cross-subsidization
    term: Cross-subsidization
    aka: [cross-subsidy]
    short: High-volume, simple products carrying overhead caused by low-volume, complex ones, so the first look costlier and the second cheaper than they are.
    related: [cost-distortion]
    skills: [trad-vs-abc]
  - id: activity-based-costing
    term: Activity-based costing
    aka: [ABC]
    short: Assigns overhead to products by their use of activities, tracing costs first to activities and then from activities to products.
    related: [activity, activity-cost-pool, activity-rate]
    skills: [abc-steps]
  - id: activity
    term: Activity
    short: Any distinct task that consumes resources, such as setting up a machine, inspecting a batch or processing an order.
    related: [activity-cost-pool, cost-driver]
    skills: [abc-steps]
  - id: activity-cost-pool
    term: Activity cost pool
    aka: [cost pool, activity pool]
    short: Overhead regrouped by the activity that consumes it, not by its original account; each pool has its own driver.
    related: [activity, activity-rate]
    skills: [abc-steps]
  - id: cost-driver
    term: Cost driver
    aka: [driver]
    short: A factor that causes, or is closely correlated with, an activity's cost, such as the number of setups or pounds of material.
    related: [activity, activity-rate]
    skills: [abc-steps, adoption]
  - id: activity-rate
    term: Activity rate
    short: An activity pool's budgeted cost divided by its predicted driver level; Session 5's POHR computed once per pool.
    formula: '\text{Activity rate} = \frac{\text{Budgeted pool cost}}{\text{Predicted driver level}}'
    related: [activity-cost-pool, cost-driver]
    skills: [abc-steps, apply-abc]
  - id: two-stage-assignment
    term: Two-stage cost assignment
    aka: [two stages, Stage 1]
    short: Stage 1 traces overhead to departments (traditional) or activities (ABC); Stage 2 assigns it from there to products or jobs.
    related: [activity-based-costing]
    skills: [abc-steps]
  - id: unit-level
    term: Unit-level activity
    aka: [unit-level]
    short: Performed for every unit, such as machining a part; machine or labor hours are good drivers for it.
    related: [batch-level, volume-based-driver]
    skills: [cost-hierarchy]
  - id: batch-level
    term: Batch-level activity
    aka: [batch-level]
    short: Performed once per batch whatever its size, such as a setup or a first-article inspection.
    related: [unit-level, product-level]
    skills: [cost-hierarchy]
  - id: product-level
    term: Product-level activity
    aka: [product-level, product-sustaining]
    short: Performed to support a product line whatever its volume or batches, such as engineering changes or regulatory filings.
    related: [batch-level, facility-level]
    skills: [cost-hierarchy]
  - id: facility-level
    term: Facility-level activity
    aka: [facility-level]
    short: Keeps the whole plant running, such as factory rent; often left unallocated in ABC because no driver links it to products.
    related: [product-level]
    skills: [cost-hierarchy]
  - id: customer-profitability
    term: Customer profitability analysis
    aka: [customer profitability, cost-to-serve]
    short: Gross margin from a customer less the ABC-assigned cost of serving it, such as order processing and deliveries.
    formula: '\text{Customer profit} = \text{Gross margin} - \sum \text{rate} \times \text{driver used}'
    related: [activity-based-costing]
    skills: [abc-services]
