    explanation: A good driver rises with the same thing the cost does, so it comes from the pool's own level. Facility-level costs usually have none.

  - id: compare3-numeric
    type: numeric
    skills: [trad-vs-abc]
    difficulty: 3
    tags: [math]
    generator: compareQ
    lessonRef: { tab: math-code, id: cross-subsidy }
    prompt: |
      A plant makes {=unitsHi|comma} Standard units ({=mhHi|comma} machine hours) and {=unitsLo|comma} Custom units
      ({=mhLo|comma} machine hours). It has always applied overhead with one rate per machine hour. Overhead pools and
      driver use:

      | Pool | Cost | Driver | Standard | Custom |
      |---|---|---|---|---|
      {=table}

      By how much **per Standard unit** does the single machine-hour rate overcost Standard?
    answer: { var: diffHi, tol: 0.005 }
    hints:
      - Single rate = total overhead ÷ total machine hours; Standard's share = its machine hours × the rate ÷ its units.
      - ABC = Σ (pool cost ÷ total driver) × Standard's use, ÷ Standard's units.
      - Overcosting = single-rate overhead per unit − ABC overhead per unit.
    explanation: 'The single ₱{=tradRate|2f} per machine hour gives Standard ₱{=tradHi|2f} a unit. ABC gives ${=ohHi|comma} \div {=unitsHi|comma} = ₱{=abcHi|2f}$. Standard is overcosted by ₱{=diffHi|2f} a unit, and Custom undercosted by ₱{=diffLo|2f}.'

  - id: margin-handcalc
    type: hand-calc
    skills: [trad-vs-abc]
    difficulty: 3
    tags: [math]
    generator: marginQ
    lessonRef: { tab: math-code, id: caselets }
    prompt: |
      Standard: {=unitsHi|comma} units, {=mhHi|comma} machine hours. Custom: {=unitsLo|comma} units, {=mhLo|comma} machine
      hours, direct costs ₱{=directLo} a unit, price ₱{=priceLo} a unit. Overhead ({=totalOH|money}) has been applied with
      one rate per machine hour.

      | Pool | Cost | Driver | Standard | Custom |
      |---|---|---|---|---|
      {=table}
    steps:
      - prompt: Plantwide rate per machine hour (₱)
        answer: { var: tradRate, tol: 0.005 }
      - prompt: Custom's full cost per unit under the single rate (₱)
        answer: { var: tradFullLo, tol: 0.005 }
        hint: Direct costs + machine hours × rate ÷ units.
      - prompt: Custom's full cost per unit under ABC (₱)
        answer: { var: abcFullLo, tol: 0.005 }
        hint: Direct costs + Custom's ABC overhead ÷ its units.
      - prompt: Custom's margin under ABC, as a percent of price, to one decimal place (%)
        answer: { var: abcPct, tol: 0.06, percent: true }
        hint: (Price − ABC full cost) ÷ price.
    hints:
      - Work out both full costs before the margin.
    explanation: 'Single rate: full cost ₱{=tradFullLo|2f}, margin {=tradPct|1}%. ABC: full cost ₱{=abcFullLo|2f}, margin $({=priceLo} - {=abcFullLo|2f}) \div {=priceLo} = {=abcPct|1}\%$, {=dirTxt} than the single rate showed.'

  - id: bid-numeric
    type: numeric
    skills: [apply-abc, trad-vs-abc]
    difficulty: 3
    tags: [application]
    generator: bidQ
    lessonRef: { tab: application, id: bid }
    prompt: |
      A plant has these overhead pools. The last column is what one customer's order would use.

      | Pool | Budgeted cost | Predicted driver | The order uses |
      |---|---|---|---|
      {=table}

      The order is for {=units|comma} units at ₱{=price|comma} each; direct materials and labor are ₱{=direct|comma} a unit.
      Assume the order's setups and inspections are extra work it causes. Using ABC full cost, what is the order's profit
      or loss **per unit**? (Enter a loss as a negative number.)
    answer: { var: profitAbc, tol: 0.005 }
    hints:
      - Rate for each pool = budgeted cost ÷ predicted driver.
      - Order overhead = Σ rate × the order's use; divide by its units and add the direct cost.
      - Profit per unit = price − full cost per unit.
    explanation: 'ABC overhead {=ohOrder|money} ÷ {=units|comma} units, plus ₱{=direct|comma} direct, gives a full cost of ₱{=abcFull|2f}: ₱{=price|comma} − ₱{=abcFull|2f} = ₱{=profitAbc|2f} a unit. The single ₱{=plantRate|2f} per machine hour would give a full cost of ₱{=tradFull|2f}. {=verdictTxt}'

