  - id: transfer-distortion
    type: two-tier
    skills: [distortion, trad-vs-abc]
    difficulty: 3
    tags: [application]
    lessonRef: { tab: math-code, id: cross-subsidy }
    prompt: A bakery makes plain pandesal in huge runs and custom birthday cakes in tiny batches with many setups. It applies all overhead by direct labor hours. Which product is probably **undercosted**?
    options: ['The custom cakes', 'The pandesal', 'Neither; labor hours are always accurate']
    answer: 0
    reasons:
      - The cakes cause many batch-level costs that a labor-hour rate spreads over the high-volume bread
