  # ------------------------------------------------------------------ the workbook caselets, one per level
  - id: caselet-simple-numeric
    type: numeric
    skills: [trad-vs-abc]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: caselets }
    prompt: |
      CleanWave Soap Works makes 500,000 bars of Regular Soap (10,000 direct labor hours) and 100,000 bars of Herbal
      Premium Soap (3,000 direct labor hours). It has always applied overhead at one rate per direct labor hour. Its
      overhead pools and driver use:

      | Pool | Cost | Driver | Regular | Herbal |
      |---|---|---|---|---|
      | Machine setup | ₱300,000 | setups | 10 | 20 |
      | Quality inspection | ₱350,000 | inspections | 10 | 40 |

      Is the herbal bar as cheap to make as the labor-hour rate says? Find its **ABC overhead per bar**.
    answer: { value: 4.8, tol: 0.005 }
    misconceptions:
      - { value: 1.5, feedback: 'That is the labor-hour rate''s figure: ₱650,000 ÷ 13,000 hours = ₱50 an hour, × 3,000 hours ÷ 100,000 bars. ABC charges Herbal for its setups and inspections.' }
      - { value: 2, feedback: 'That is the setup pool alone (20 × ₱10,000 ÷ 100,000). Add Herbal''s share of the inspection pool.' }
      - { value: 2.8, feedback: 'That is the inspection pool alone (40 × ₱7,000 ÷ 100,000). Add Herbal''s share of the setup pool.' }
    hints:
      - Each pool's rate = its cost ÷ the total driver of both products.
      - Herbal's overhead = Σ rate × Herbal's use; divide by its 100,000 bars.
    explanation: 'Rates: ₱300,000 ÷ 30 = ₱10,000 per setup and ₱350,000 ÷ 50 = ₱7,000 per inspection. Herbal uses $20 \times 10{,}000 + 40 \times 7{,}000 = ₱480{,}000$, or ₱4.80 a bar. The labor-hour rate gives it only ₱1.50, so the herbal bar is far dearer than it looked, and Regular is overcosted (₱1.00 a bar against ₱0.34 under ABC).'

  - id: caselet-moderate-numeric
    type: numeric
    skills: [trad-vs-abc]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: caselets }
    prompt: |
      GoldenCrisp Biscuits has always applied overhead at one rate per machine hour.

      | | Plain | Cream | Assorted Gift Pack |
      |---|---|---|---|
      | Units | 2,000,000 | 800,000 | 200,000 |
      | Direct materials per unit | ₱2.00 | ₱2.80 | ₱5.50 |
      | Direct labor per unit | ₱0.50 | ₱0.70 | ₱1.20 |
      | Price per unit | ₱3.50 | ₱5.00 | ₱9.00 |

      | Pool | Cost | Driver | Plain | Cream | Assorted |
      |---|---|---|---|---|---|
      | Machine running | ₱1,140,000 | machine hours | 2,000 | 1,200 | 600 |
      | Setups | ₱480,000 | setups | 20 | 40 | 100 |
      | Material handling | ₱320,000 | material moves | 40 | 80 | 200 |
      | Packaging changeovers | ₱570,000 | changeovers | 10 | 30 | 150 |

      Is the Assorted Gift Pack really profitable? Find its **full cost per unit under ABC** (direct materials and
      labor plus ABC overhead).
    answer: { value: 12.35, tol: 0.005 }
    misconceptions:
      - { value: 8.6816, feedback: 'That is the full cost with one machine-hour rate (₱2,510,000 ÷ 3,800 hours = ₱660.53 an hour). Use the four activity rates.' }
      - { value: 5.65, feedback: 'That is the ABC overhead per pack only; add the ₱6.70 of direct materials and labor.' }
      - { value: 6.7, feedback: 'That is direct materials and labor only; the pack''s ABC overhead is missing.' }
    hints:
      - Each pool's rate = its cost ÷ the total driver of all three products.
      - The pack's overhead = Σ rate × its use, ÷ its 200,000 units.
      - Full cost = direct materials + direct labor + overhead per unit.
    explanation: 'Rates: ₱300 per machine hour, ₱3,000 per setup, ₱1,000 per move, ₱3,000 per changeover. The pack uses $600 \times 300 + 100 \times 3{,}000 + 200 \times 1{,}000 + 150 \times 3{,}000 = ₱1{,}130{,}000$, or ₱5.65 a unit. Full cost $= 5.50 + 1.20 + 5.65 = ₱12.35$ against a ₱9.00 price: it loses ₱3.35 a pack. The single machine-hour rate showed a full cost of ₱8.68 and a thin profit.'

  - id: caselet-complex-numeric
    type: numeric
    skills: [trad-vs-abc]
    difficulty: 3
    tags: [math]
    lessonRef: { tab: math-code, id: caselets }
    prompt: |
      Radiance Personal Care makes 1,000,000 units of Mass Shampoo, 300,000 of Premium Shampoo, 150,000 of Herbal
      Conditioner and 5,000,000 Travel Sachets. It has always applied overhead at one rate per machine hour; the machine
      hours are the filling-and-capping driver below.

      | Pool | Cost | Driver | Mass | Premium | Conditioner | Sachets |
      |---|---|---|---|---|---|---|
      | Filling and capping | ₱1,175,000 | machine hours | 2,000 | 750 | 450 | 1,500 |
      | Setup and changeover | ₱900,000 | batches | 20 | 30 | 30 | 10 |
      | Quality testing | ₱450,000 | tests | 20 | 60 | 60 | 10 |
      | Formula sustaining | ₱700,000 | formulas | 1 | 3 | 2 | 1 |
      | Regulatory filing | ₱260,000 | filings | 2 | 4 | 6 | 1 |

      Which product does the machine-hour rate flatter most, that is, undercost by the most per unit? Enter **that
      product's undercosting per unit** as a positive amount (ABC overhead per unit − single-rate overhead per unit).
    answer: { value: 3.8589, tol: 0.006 }
    misconceptions:
      - { value: 1.6379, feedback: 'That is Premium Shampoo''s undercosting. Another product is undercosted by more per unit.' }
      - { value: -3.8589, feedback: 'Right product and size; enter the undercosting as a positive amount.' }
      - { value: 0.583, feedback: 'That is Mass Shampoo''s gap, but the single rate overcosts it. Look for a product whose ABC cost is higher.' }
    hints:
      - Single rate = total overhead ÷ total machine hours; each product's share = its machine hours × the rate ÷ its units.
      - ABC per unit = Σ (pool cost ÷ total driver) × the product's use, ÷ its units.
      - Compare the two for every product; the undercosted ones have ABC above the single rate.
    explanation: 'Single rate $= 3{,}485{,}000 \div 4{,}700 = ₱741.49$ per machine hour. Herbal Conditioner gets $450 \times 741.49 \div 150{,}000 = ₱2.22$ a unit; under ABC it uses $450 \times 250 + 30 \times 10{,}000 + 60 \times 3{,}000 + 2 \times 100{,}000 + 6 \times 20{,}000 = ₱912{,}500$, or ₱6.08 a unit. It is undercosted by ₱3.86, more than Premium Shampoo (₱1.64); Mass Shampoo and Travel Sachets are overcosted.'

  # ------------------------------------------------------------------ new formats (case, find-error, two-tier, explain, Parsons)
  - id: compare-case
    type: case
    skills: [trad-vs-abc, distortion]
    difficulty: 3
    tags: [math]
    generator: compareQ
    lessonRef: { tab: math-code, id: cross-subsidy }
    prompt: |
      **Is the old rate distorting costs?** A plant makes {=unitsHi|comma} Standard units ({=mhHi|comma} machine hours) and
      {=unitsLo|comma} Custom units ({=mhLo|comma} machine hours). Overhead pools and driver use:

      | Pool | Cost | Driver | Standard | Custom |
      |---|---|---|---|---|
      {=table}
    parts:
      - type: numeric
        prompt: Plantwide rate on machine hours (₱ per machine hour)
        answer: { var: tradRate, tol: 0.005 }
        explanation: '{=totalOH|money} ÷ {=totalMH|comma} = {=tradRate|money2} per machine hour.'
      - type: numeric
        prompt: Traditional overhead per **Custom** unit (₱)
        answer: { var: tradLo, tol: 0.005 }
        explanation: '{=mhLo|comma} × {=tradRate|money2} ÷ {=unitsLo|comma} = {=tradLo|money2}.'
      - type: numeric
        prompt: ABC overhead per **Custom** unit (₱)
        answer: { var: abcLo, tol: 0.005 }
        explanation: "Custom's share of every pool, ÷ {=unitsLo|comma} units = {=abcLo|money2}."
      - type: two-tier
        prompt: What has the plantwide rate been doing to the Custom product?
        options: ['Undercosting it, so Standard subsidizes Custom', 'Overcosting it, so Custom subsidizes Standard', 'Costing it correctly, since total overhead is the same']
        answer: 0
        reasons:
          - Custom uses a large share of the batch and product activities but only a small share of machine hours
          - Custom is the lower-volume product, so it always carries less overhead
          - Machine hours are the right driver for every pool
        reasonAnswer: 0
        optionFeedback:
          1: Custom's traditional cost ({=tradLo|money2}) is below its ABC cost ({=abcLo|money2}), so it's undercosted.
          2: The total is the same, but how it's split between the products isn't.
        reasonFeedback:
          1: Volume alone doesn't decide it. Custom ends up with more overhead per unit under ABC.
          2: Setups and other batch activities don't follow machine hours, which is the source of the distortion.
        explanation: Traditional {=tradLo|money2} vs ABC {=abcLo|money2} per Custom unit, so Custom is undercosted and Standard overcosted.
    hints:
      - The plantwide rate spreads every pool by machine hours.
      - ABC spreads each pool by its own driver, then divides by units.
    explanation: Plantwide {=tradLo|money2} vs ABC {=abcLo|money2} per Custom unit. The machine-hour rate spreads batch-level costs as if they followed machine time.

  - id: rate-find-error
    type: find-error
    skills: [abc-steps]
    difficulty: 2
    tags: [math]
    generator: rateQ
    lessonRef: { tab: math-code, id: abc-rates }
    prompt: 'A trainee computes the activity rate for **{=name}**. **One step is wrong.** Click it and give the correct rate.'
    steps:
      - 'Activity cost pool: {=name}, ₱{=cost|comma}'
      - 'Cost driver: {=driver}, {=total|comma} in total for the year'
      - 'Activity rate = {=total|comma} ÷ ₱{=cost|comma} = {=wrongInverse|4} per peso'
      - 'Each product is charged its {=driver} × the rate'
    wrong: 2
    fix: { var: rate, tol: 0.005 }
    fixPrompt: What is the correct activity rate (₱ per driver unit)?
    misconceptions:
      - { var: wrongInverse, feedback: "That's still driver units per peso. Divide the pool's cost by the driver total." }
    stepFeedback:
      0: The pool and its cost are given correctly.
      1: The driver and its total are given correctly.
      3: Charging driver use × rate is the right last step.
    hints: [A rate is pesos per driver unit.]
    explanation: Rate = ₱{=cost|comma} ÷ {=total|comma} = {=rate|money2} per {=driver}. The trainee divided the wrong way round.

  - id: total-oh-two-tier
    type: two-tier
    skills: [trad-vs-abc]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: cross-subsidy }
    prompt: A company switches from one plantwide rate to ABC. What happens to the **total** overhead assigned to all products together?
    options: [It stays the same, It rises, It falls]
    answer: 0
    reasons:
      - ABC only changes how the same overhead is split among products
      - More cost pools mean more cost
      - ABC removes non-value-added overhead automatically
    reasonAnswer: 0
    optionFeedback:
      1: ABC adds pools, not cost. The same overhead is reassigned.
      2: ABC measures costs; cutting them is ABM's job.
    reasonFeedback:
      1: Pools are ways of grouping the same cost.
      2: Removing waste takes management action (ABM), not a costing change.
    hints: [Does a new way of slicing a pie change its size?]
    explanation: Total overhead is unchanged; some products' costs rise and others fall.

  - id: distortion-explain
    type: explain
    skills: [distortion]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: cross-subsidy }
    prompt: Explain why a single volume-based overhead rate tends to overcost high-volume products and undercost low-volume, complex ones.
    model: |
      Much overhead is batch- or product-level: setups, inspections, engineering changes. These costs follow the number of
      batches or products, not the number of units. A volume-based rate spreads them by units or hours, so high-volume products,
      which run long batches, absorb a big share of costs they hardly cause, while low-volume, complex products, which need
      many setups and changes, carry too little. ABC traces each pool by its own driver.
    checklist:
      - Some overhead is batch- or product-level, not unit-level
      - A volume rate spreads it by units or hours anyway
      - High-volume products absorb costs they barely cause (overcosted)
      - Low-volume, complex products cause many setups but are undercharged
    hints: ["Think about a setup that costs the same whether the batch is 10 units or 10,000."]
    explanation: Volume rates assume every cost follows volume; batch- and product-level costs don't.

  - id: abc-steps-parsons
    type: order
    skills: [abc-steps]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: abc-rates }
    prompt: Build the steps of activity-based costing from the bank. Two lines don't belong.
    items:
      - Identify the activities that consume overhead
      - Assign overhead costs to activity cost pools
      - Choose a cost driver for each pool
      - Compute an activity rate for each pool
      - Assign overhead to products by their use of each driver
    distractors:
      - Divide total overhead by total direct labor hours
      - Charge every product the same overhead per unit
    hints: [You need pools and drivers before you can compute any rate.]
    explanation: Activities → pools → drivers → rates → assignment. One plantwide rate or a flat charge per unit is exactly what ABC replaces.

