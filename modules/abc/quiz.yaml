          3: Revenue doesn't drive cleaning.
        explanation: Cleaning is batch-level per flight.
      - prompt: A bank's cost of **processing loan applications** grows with the number of applications, not with the loan amounts. Which driver fits?
        options: ['Number of applications', 'Total loan amount', 'Number of branches', 'Interest earned']
        answer: 0
