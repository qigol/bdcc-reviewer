terms:
  - id: latent-factor
    term: Latent factor
    short: A hidden taste dimension learned from ratings, such as how much a film is "action" versus "romance".
    related: [factorization, rank]
    lessonRef: { tab: intuition, id: hidden-tastes }
    skills: [latent-model]
  - id: factorization
    term: Matrix factorization
    short: Approximating the rating matrix as the product of a user-factor matrix U and a factor-item matrix V.
    formula: 'R \approx UV'
    related: [latent-factor, rank]
    lessonRef: { tab: intuition, id: matrix-is-a-product }
    skills: [latent-model]
  - id: rank
    term: Rank d
    short: The number of latent factors; U is m×d and V is d×n.
    related: [factorization, regularization]
    lessonRef: { tab: math-code, id: latent-model }
    skills: [rank-choice]
  - id: predicted-rating
    term: Predicted rating
    short: The dot product of a user's factor row and an item's factor column.
    formula: 'p_{ij} = \sum_{s=1}^{d} u_{is} v_{sj}'
    related: [factorization]
    lessonRef: { tab: math-code, id: latent-model }
    skills: [latent-model, prediction]
  - id: sse
    term: Sum of squared errors (SSE)
    short: The total of (actual − predicted)² over the observed ratings only; the quantity being minimized.
    formula: '\sum_{(i,j)\ \text{observed}} (r_{ij} - p_{ij})^2'
    related: [als, coordinate-descent]
    lessonRef: { tab: math-code, id: sse-observed }
    skills: [sse-observed]
  - id: observed-entry
    term: Observed entry
    short: A cell of the rating matrix that has an actual rating; missing cells never enter the SSE.
    related: [sse]
    lessonRef: { tab: intuition, id: only-observed-cells }
    skills: [sse-observed]
  - id: als
    term: Alternating least squares (ALS)
    short: Repeatedly freezing U to solve V by least squares, then freezing V to solve U.
    related: [least-squares, coordinate-descent]
    lessonRef: { tab: intuition, id: als-dance }
    skills: [als-step]
  - id: least-squares
    term: Least squares
    short: Choosing parameters that minimize the sum of squared errors; with one factor matrix frozen it is a linear regression.
    related: [als]
    lessonRef: { tab: math-code, id: als-update }
    skills: [als-step]
  - id: symmetry-trap
    term: Symmetry trap
    short: Starting ALS from identical columns keeps them identical forever, so a rank-2 model acts like rank 1.
    related: [als, random-init]
    lessonRef: { tab: intuition, id: symmetry-trap }
    skills: [als-symmetry]
  - id: random-init
    term: Random initialization
    short: Starting U and V at small random values to break symmetry so each factor can learn something different.
    related: [symmetry-trap]
    lessonRef: { tab: intuition, id: symmetry-trap }
    skills: [als-symmetry]
  - id: coordinate-descent
    term: Coordinate (gradient) descent
    short: Minimizing the SSE by updating one entry at a time to the exact minimum of its parabola.
    related: [closed-form-update, als]
    lessonRef: { tab: intuition, id: one-knob }
    skills: [cgd-update]
  - id: closed-form-update
    term: Closed-form entry update
    short: Setting the derivative of the SSE with respect to one entry to zero and solving it directly.
    formula: 'u_{is} = \frac{\sum_j v_{sj}\,(r_{ij} - \sum_{t \ne s} u_{it} v_{tj})}{\sum_j v_{sj}^2}'
    related: [coordinate-descent]
    lessonRef: { tab: math-code, id: cgd-derivation }
    skills: [cgd-derivation]
  - id: residual
    term: Residual (partial)
    short: What is left of a rating after subtracting the contribution of every other factor, r − Σₜ≠ₛ uᵢₜvₜⱼ.
    related: [closed-form-update]
    lessonRef: { tab: math-code, id: cgd-derivation }
    skills: [cgd-derivation]
  - id: overfitting
    term: Overfitting
    short: Fitting the observed ratings too closely with too many parameters, so predictions for missing cells get wild.
    related: [regularization, rank]
    lessonRef: { tab: intuition, id: filling-the-blanks }
    skills: [prediction, rank-choice]
  - id: regularization
    term: Regularization (λ)
    short: Adding λ times the squared size of the factors to the SSE, which keeps factors small and makes the minimizer unique.
    formula: '\text{SSE} + \lambda\left(\|U\|^2 + \|V\|^2\right)'
    related: [overfitting, symmetry-trap]
    lessonRef: { tab: math-code, id: regularization }
    skills: [rank-choice]
