sections:
  - id: latent-model
    title: The latent-factor model
    skills: [latent-model, rank-choice]
    summary: |
      Give every user a short vector of tastes and every item a vector of traits. A predicted rating is their dot
      product. The whole matrix is U (m×d) times V (d×n).
    keyFormula: 'R \approx P = UV, \qquad p_{ij} = \sum_{s=1}^{d} u_{is}\, v_{sj}'
    data: [r5x5]
    derive:
      - { fn: als, in: { R: '@r5x5', iters: 1 }, out: a }
    steps:
      - tex: |
          R_{m \times n} \approx \anchor{u}{U_{m \times d}}\;\anchor{v}{V_{d \times n}}
        say: 'With d = 2 the 5×5 lecture matrix is explained by 10 + 10 = 20 numbers.'
      - tex: |
          \anchor{p}{p_{ij}} = \sum_{s=1}^{d} \anchor{u}{u_{is}}\,\anchor{v}{v_{sj}}
        say: User i's row of U dotted with item j's column of V.
      - tex: |
          \anchor{p}{p_{11}} = \anchor{u}{ {=a.U.values.0.0|4} } \cdot \anchor{v}{ {=a.V.values.0.0|3} } + {=a.U.values.0.1|4} \cdot {=a.V.values.1.0|3} = {=a.P.values.0.0|3}
        say: After one ALS round from the slides (U row 1 = 1.0988…, V column 1 = 1.75).
    code:
      lang: python
      source: |
        import numpy as np

        def predict(U, V):
            """U: m x d user factors, V: d x n item factors"""
            return U @ V            # @a:p

        def predict_one(U, V, i, j):
            u_i = U[i, :]           # @a:u
            v_j = V[:, j]           # @a:v
            return u_i @ v_j        # @a:p
    links:
      - { anchor: u, label: 'U: user factors (m×d)' }
      - { anchor: v, label: 'V: item factors (d×n)' }
      - { anchor: p, label: 'P = UV: predictions' }
    examples: [init-ones]
    pitfalls:
      - V is d×n on the slides, so item j's factors are a **column** of V.
      - The model has m·d + d·n parameters, far fewer than m·n cells.
    examTip: 'Write U and V next to R with their shapes; every p_ij is "row i of U · column j of V".'

  - id: sse-observed
    title: SSE over observed entries
    skills: [sse-observed]
    summary: |
      Fit U and V by making predictions close to the ratings we **have**. Missing cells are what we want to predict,
      so they never enter the error.
    keyFormula: '\text{SSE} = \sum_{(i,j)\ \text{observed}} \left(r_{ij} - \sum_s u_{is} v_{sj}\right)^2'
    data: [r5x5]
    derive:
      - { fn: init, in: { R: '@r5x5', d: 2, kind: ones }, out: st }
      - { fn: sse, in: { R: '@r5x5', U: '@st.U', V: '@st.V' }, out: s }
    steps:
      - tex: |
          \text{SSE} = \sum_{\anchor{obs}{(i,j)\ \text{observed}}} \anchor{err}{\left(r_{ij} - p_{ij}\right)^2}
        say: One squared error per observed rating.
      - tex: |
          \text{column } i_1: [5 - (\bar v_{11} + \bar v_{12})]^2 + [3 - (\cdot)]^2 + [2 - (\cdot)]^2 + [4 - (\cdot)]^2
        say: 'Slide 4 writes it per item column. Column 1 has four terms because u3·i1 is missing.'
      - tex: |
          U = V = \mathbf{1}: \quad p_{ij} = 2, \qquad \text{SSE} = \anchor{err}{ {=s.sse|2} } \text{ over } \anchor{obs}{ {=s.observed} } \text{ observed cells}
        say: The CGD starting point on slide 9.
    code:
      lang: python
      source: |
        def sse(R, U, V):
            """R uses np.nan for missing ratings"""
            observed = ~np.isnan(R)                   # @a:obs
            E = R - U @ V
            return np.sum(E[observed] ** 2)           # @a:err
    links:
      - { anchor: obs, label: observed cells only }
      - { anchor: err, label: squared errors }
    examples: [sse-ones]
    pitfalls:
      - Treating missing ratings as 0 would train the model to predict 0 for everything unseen.
    examTip: 'Count the observed cells first (22 on the slides), then write one squared term per cell.'

  - id: als-update
    title: 'ALS: freeze one side, solve the other'
    skills: [als-step]
    summary: |
      With U frozen, each item's column of V is an ordinary least-squares problem over the users who rated it (and
      symmetrically for U). Alternate the two half-steps.
    keyFormula: '\mathbf{v}_j = \arg\min_{\mathbf{v}} \sum_{i:\,r_{ij}\ \text{obs}} (r_{ij} - \mathbf{u}_i \cdot \mathbf{v})^2'
    data: [r5x5]
    derive:
      - { fn: init, in: { R: '@r5x5', d: 2, kind: ones }, out: st }
      - { fn: alsStepV, in: { R: '@r5x5', U: '@st.U' }, out: s1 }
      - { fn: alsStepU, in: { R: '@r5x5', V: '@s1.V' }, out: s2 }
    steps:
      - tex: |
          \anchor{freeze}{U \text{ fixed}} \;\Rightarrow\; \mathbf{v}_j = \anchor{solve}{\arg\min_{\mathbf{v}} \sum_{i \in \text{obs}(j)} (r_{ij} - \mathbf{u}_i \cdot \mathbf{v})^2}
        say: A linear regression per item. The features are the frozen user factors.
      - tex: |
          U = \mathbf{1}: \quad \bar v_{j1} + \bar v_{j2} = \text{mean of column } j \;\Rightarrow\; \bar v_{j1} = \bar v_{j2} = \tfrac{\text{mean}}{2}
        say: 'Only the sum is determined; the slides split it evenly (minimum-norm solution): 3.5/2 = 1.75, 3/2 = 1.5, 3.6/2 = 1.8 …'
      - tex: |
          V = \begin{pmatrix} {=s1.V.values.0.0|3} & {=s1.V.values.0.1|3} & {=s1.V.values.0.2|3} & {=s1.V.values.0.3|3} & {=s1.V.values.0.4|3} \\ {=s1.V.values.1.0|3} & \cdots & & & {=s1.V.values.1.4|3} \end{pmatrix}
        say: Slide 5.
      - tex: |
          \anchor{freeze}{V \text{ fixed}} \;\Rightarrow\; u_{11} = u_{12} = \anchor{solve}{ {=s2.U.values.0.0|8} }
        say: 'Then solve each user row with V frozen: slide 8''s 1.09884117.'
    code:
      lang: python
      source: |
        def als_step_V(R, U):
            d, n = U.shape[1], R.shape[1]
            V = np.zeros((d, n))                               # @a:freeze
            for j in range(n):
                obs = ~np.isnan(R[:, j])
                # lstsq returns the minimum-norm solution when the system is rank-deficient
                V[:, j] = np.linalg.lstsq(U[obs], R[obs, j], rcond=None)[0]   # @a:solve
            return V

        def als_step_U(R, V):
            return als_step_V(R.T, V.T).T                      # same problem, transposed
    links:
      - { anchor: freeze, label: freeze one factor matrix }
      - { anchor: solve, label: least squares for the other }
    trace: { fn: alsStepV, in: { R: '@r5x5', U: '@st.U' } }
    examples: [als-v-first, als-v-symmetric, als-u-first]
    pitfalls:
      - Each regression uses only the **observed** ratings of that column (or row).
      - With U = all ones the problem has infinitely many solutions; the slides pick the even split.
    examTip: 'From U = all ones, each V column is simply (column mean of observed ratings)/2 in every row.'

  - id: als-run
    title: ALS iterations and the symmetry trap
    skills: [als-step, als-symmetry]
    summary: |
      Alternate V-steps and U-steps; the SSE can only go down. But from all-ones U the two latent columns stay
      identical forever, so the "rank-2" model is really rank 1.
    keyFormula: 'U^{(t)} \to V^{(t+1)} \to U^{(t+1)} \to \cdots, \quad \text{SSE non-increasing}'
    data: [r5x5]
    state: { iters: 3, initKind: ones }
    derive:
      - { fn: als, in: { R: '@r5x5', iters: '@iters', initKind: '@initKind' }, out: run }
    steps:
      - tex: |
          \anchor{init}{U^{(0)}} \;\xrightarrow{\ \anchor{solve-v}{\text{solve } V}\ }\; V^{(1)} \;\xrightarrow{\ \anchor{solve-u}{\text{solve } U}\ }\; U^{(1)} \;\to \cdots
        say: Each half-step minimizes the SSE over one block exactly, so the SSE never increases.
      - tex: |
          U:\ \text{columns equal} \;\Rightarrow\; V:\ \text{rows equal} \;\Rightarrow\; U:\ \text{columns equal}
        say: Symmetry in, symmetry out. Only $v_{j1} + v_{j2}$ is ever determined.
      - tex: |
          \text{SSE after } {=iters} \text{ iterations} = {=run.sse|3}, \qquad \text{still symmetric? } \text{ {=run.symmetric} }
        say: 'Set initKind to `random` in the live inputs to break the tie.'
    code:
      lang: python
      source: |
        def als(R, d=2, iters=10, init="ones", seed=0):
            m, n = R.shape
            rng = np.random.default_rng(seed)
            U = np.ones((m, d)) if init == "ones" else 0.5 + rng.random((m, d))   # @a:init
            for _ in range(iters):
                V = als_step_V(R, U)                                          # @a:solve-v
                U = als_step_U(R, V)                                          # @a:solve-u
            return U, V
    links:
      - { anchor: init, label: initialization }
      - { anchor: solve-v, label: 'V-step (U frozen)' }
      - { anchor: solve-u, label: 'U-step (V frozen)' }
    trace: { fn: als, in: { R: '@r5x5', iters: '@iters', initKind: '@initKind' } }
    examples: [als-symmetry]
    pitfalls:
      - All-ones initialization is fine for a hand example but wastes the extra factors; use random initialization in practice.
    examTip: 'If asked why U''s columns are equal on slide 8: the symmetric start (all ones) makes both factors receive identical updates.'

  - id: cgd-derivation
    title: 'Coordinate descent: deriving the update (slide 15)'
    skills: [cgd-derivation]
    summary: |
      Change one entry u_is and freeze everything else. The SSE is then a parabola in that entry, so setting the
      derivative to zero gives its exact minimizer.
    keyFormula: 'u_{is} = \frac{\sum_{j} v_{sj}\left(r_{ij} - \sum_{t \ne s} u_{it} v_{tj}\right)}{\sum_{j} v_{sj}^2}'
    steps:
      - tex: |
          \text{SSE} = \sum_{j \in \text{obs}(i)} \Big( r_{ij} - u_{is} v_{sj} - \sum_{t \ne s} u_{it} v_{tj} \Big)^2 + \text{(terms without } u_{is})
        say: Split the prediction into the part that uses u_is and the rest.
      - tex: |
          \anchor{grad}{\frac{\partial\, \text{SSE}}{\partial u_{is}}} = \sum_{j} -2\, v_{sj} \Big( r_{ij} - u_{is} v_{sj} - \sum_{t \ne s} u_{it} v_{tj} \Big) = 0
        say: Differentiate and set to zero.
      - tex: |
          \sum_j v_{sj} r_{ij} - u_{is} \sum_j v_{sj}^2 - \sum_j v_{sj} \sum_{t \ne s} u_{it} v_{tj} = 0
        say: Expand the sum (slide 15, line 3).
      - tex: |
          \anchor{closed}{u_{is} = \frac{\sum_{j} v_{sj}\left(r_{ij} - \sum_{t \ne s} u_{it} v_{tj}\right)}{\sum_{j} v_{sj}^2}}
        say: Solve for u_is. The v_sj entries update the same way, with the roles of U and V swapped.
    code:
      lang: python
      source: |
        def update_u(R, U, V, i, s):
            obs = ~np.isnan(R[i])
            rest = U[i] @ V - U[i, s] * V[s]          # prediction without factor s
            resid = R[i, obs] - rest[obs]             # @a:grad
            U[i, s] = (V[s, obs] @ resid) / (V[s, obs] @ V[s, obs])   # @a:closed
            return U
    links:
      - { anchor: grad, label: 'the partial residual (from ∂SSE/∂u = 0)' }
      - { anchor: closed, label: closed-form minimizer }
    pitfalls:
      - Sum only over the columns the user rated.
      - Subtract the contribution of the **other** factors before regressing on v_sj.
    examTip: 'Memorize the pattern: Σ (factor)·(rating − rest) / Σ (factor)².'

  - id: cgd-worked
    title: 'Coordinate descent: the worked steps'
    skills: [cgd-update, cgd-derivation]
    summary: |
      From U = V = all ones every prediction is 2. Updating u₁₁ = x makes row 1's predictions x + 1, and the SSE of row 1
      is minimized at x = 2.6. Then updating v₁₁ = y with x fixed gives y = 1.68.
    keyFormula: 'x = \tfrac{13}{5} = 2.6, \qquad y = \tfrac{16.4}{9.76} = 1.68'
    data: [r5x5]
    derive:
      - { fn: cgdLecture, in: { R: '@r5x5' }, out: cg }
    steps:
      - tex: |
          \anchor{freeze}{(4-x)^2 + (1-x)^2 + (3-x)^2 + (3-x)^2 + (2-x)^2}
        say: Row 1's ratings minus 1 (the frozen factor's contribution), as on slide 11.
      - tex: |
          -2\,[\anchor{num}{13} - \anchor{den}{5}x] = 0 \;\Rightarrow\; \anchor{update}{x = 2.6}
        say: The derivative is linear; the root is the minimum.
      - tex: |
          (4 - 2.6y)^2 + (2-y)^2 + (1-y)^2 + (3-y)^2 \;\Rightarrow\; -2\,[\anchor{num}{16.4} - \anchor{den}{9.76}\,y] = 0 \;\Rightarrow\; \anchor{update}{y = {=cg.y|2}}
        say: Column 1 with u₁₁ = 2.6 fixed (slides 12–14). The slide writes "x = 1.68"; it is y.
      - tex: |
          \text{SSE}: {=cg.sse0} \to {=cg.sse1|2} \to {=cg.sse2|2}
        say: Each exact coordinate update lowers the SSE.
    code:
      lang: python
      source: |
        R1 = np.array([5, 2, 4, 4, 3])                 # row 1, V = ones
        # prediction of row 1 is x*1 + 1*1 = x + 1
        # @a freeze
        sse_row1 = lambda x: np.sum((R1 - (x + 1)) ** 2)
        # @end
        num = np.sum(R1 - 1)                           # @a:num
        den = len(R1)                                  # @a:den
        x = num / den                                  # @a:update
        print(x)                                       # 2.6
    links:
      - { anchor: freeze, label: SSE as a function of one entry }
      - { anchor: num, label: 'numerator Σ v(r − rest)' }
      - { anchor: den, label: 'denominator Σ v²' }
      - { anchor: update, label: the new value }
    trace: { fn: cgdLecture, in: { R: '@r5x5' } }
    examples: [cgd-x, cgd-y]
    pitfalls:
      - Only observed cells count; column 1 has four terms because u3·i1 is missing.
      - After updating x, use the **new** x when updating y.
    examTip: 'Write the parabola, differentiate, solve: for u₁₁ from all ones it is just the mean of (rating − 1) over the row.'
    errata:
      - 'Slide 14 solves for **y** (= v₁₁) but labels the answer "x = 1.68". It is y = 1.68.'

  - id: prediction
    title: Filling the blanks
    skills: [prediction, rank-choice]
    summary: |
      Once U and V are trained, every missing cell is just p_ij = u_i · v_j. With 20 parameters for 22 ratings the fit
      can be too good: some blanks get implausible values.
    keyFormula: '\hat r_{ij} = \sum_s u_{is} v_{sj} \quad \text{for missing } (i,j)'
    data: [r5x5]
    derive:
      - { fn: als, in: { R: '@r5x5', iters: 10, initKind: random, seed: 7 }, out: run }
      - { fn: fillMissing, in: { R: '@r5x5', U: '@run.U', V: '@run.V' }, out: f }
    steps:
      - tex: |
          \anchor{fill}{\hat r_{ij} = \mathbf{u}_i \cdot \mathbf{v}_j}
        say: The same dot product, evaluated where R is blank.
      - tex: |
          \anchor{fit}{\text{training SSE} = {=run.sse|2}}
        say: 'Random start, 10 ALS iterations: an almost perfect fit of the 22 observed ratings.'
      - tex: |
          \anchor{fill}{\text{blanks}}: \text{ {=f.text} }
        say: 'u3·i1 comes out far below 1: the model over-fits. Regularization (next section) tames this.'
    code:
      lang: python
      source: |
        U, V = als(R, d=2, iters=10, init="random", seed=7)   # @a:fit
        P = U @ V
        missing = np.argwhere(np.isnan(R))
        for i, j in missing:
            print(f"u{i+1}·i{j+1} ≈ {P[i, j]:.2f}")    # @a:fill
    links:
      - { anchor: fill, label: predictions for missing cells }
      - { anchor: fit, label: training fit (random start) }
    pitfalls:
      - A tiny training SSE does not mean good predictions for the blanks.
      - Clip predictions to the rating scale in practice.
    examTip: 'Predictions come from the same product UV; nothing special happens for missing cells.'

  - id: regularization
    title: Regularization (λ)
    skills: [rank-choice, als-symmetry]
    beyondSlides: true
    summary: |
      Add λ‖U‖² + λ‖V‖² to the SSE. Each ALS step becomes a ridge regression: factors shrink, predictions calm down,
      and the minimizer becomes unique (no more free split of v₁ + v₂).
    keyFormula: '\min_{U,V} \sum_{\text{obs}} (r_{ij} - \mathbf{u}_i\cdot\mathbf{v}_j)^2 + \lambda\left(\|U\|^2 + \|V\|^2\right)'
    data: [r5x5]
    state: { lambda: 1 }
    derive:
      - { fn: als, in: { R: '@r5x5', iters: 10, initKind: random, seed: 7, lambda: '@lambda' }, out: reg }
      - { fn: fillMissing, in: { R: '@r5x5', U: '@reg.U', V: '@reg.V' }, out: fr }
    steps:
      - tex: |
          \mathbf{v}_j = \anchor{ridge}{(U_{o}^\top U_{o} + \lambda I)^{-1} U_{o}^\top \mathbf{r}_{o}}
        say: The V-step with the observed rows U_o of U, now a ridge regression.
      - tex: |
          \anchor{lam}{\lambda} \uparrow \;\Rightarrow\; \text{smaller factors, higher training SSE, saner blanks}
        say: λ trades fit on the observed ratings for stability on the missing ones.
      - tex: |
          \anchor{lam}{\lambda = {=lambda}}: \text{ training SSE} = {=reg.sse|2}; \quad \text{blanks: {=fr.text}}
        say: Change λ in the live inputs and watch u3·i1.
    code:
      lang: python
      source: |
        def ridge_step_V(R, U, lam):
            d, n = U.shape[1], R.shape[1]
            V = np.zeros((d, n))
            for j in range(n):
                obs = ~np.isnan(R[:, j])
                Uo = U[obs]
                A = Uo.T @ Uo + lam * np.eye(d)                     # @a:lam
                V[:, j] = np.linalg.solve(A, Uo.T @ R[obs, j])      # @a:ridge
            return V
    links:
      - { anchor: ridge, label: ridge solution }
      - { anchor: lam, label: 'λ: regularization strength' }
    pitfalls:
      - Not on the slides; Spark's ALS calls λ `regParam`.
    examTip: If asked how to fix the symmetry or over-fitting problems, mention random initialization and regularization.
