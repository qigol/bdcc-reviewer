title: Latent-factor Collaborative Filtering
shortTitle: LF-CF
summary: |
  Explain ratings with a few hidden taste factors, R ≈ U·V. Fit them by minimizing the SSE on observed entries
  with alternating least squares or coordinate descent, then fill in the blanks.
course: BDCC
order: 30
color: '#10b981'
icon: grid-3x3
