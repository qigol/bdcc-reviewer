    file: 8-10-lf-cf.pdf
    sessions: '8-10'
    date: '2026-09-18'
prerequisites: [nb-cf]
guide: 2
objectives:
  - id: model
    text: Predict a rating as the dot product of a user's and an item's latent factors, and count the model's parameters.
    skills: [latent-model]
  - id: score
    text: Compute the SSE of a factorization over the observed ratings only.
    skills: [sse-observed]
  - id: als
    text: Carry out ALS half-steps by hand and explain why an all-ones start falls into the symmetry trap.
    skills: [als-step, als-symmetry]
  - id: cgd
    text: Derive and apply the closed-form coordinate-descent update for one entry of U or V.
    skills: [cgd-derivation, cgd-update]
  - id: predict
    text: Fill the missing ratings, spot overfitting, and explain how d and λ are chosen on held-out ratings.
    skills: [prediction, rank-choice]
