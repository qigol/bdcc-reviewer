  notes: >-
    Reproduces slide 5 and slide 8 to 8 decimals via minimum-norm least squares; CGD x = 2.6 and y = 1.68. 1.1.0 (2026-09-30): solve-along revision. SSE = 75 counted row by row, every ALS column and row fit of iteration 1 written out, x and y shown as worksheets, a full coordinate-descent sweep (20 updates) and every blank's dot product; Math & Code uses loop-based Python traced line by line. New scene full-sweep; all existing IDs kept. 1.2.0 (2026-09-30): Math & Code rewritten in numpy (U @ V, boolean masks for the observed SSE, per-column lstsq with boolean row selection, the U-step as the V-step on transposes, vectorized single-entry updates, np.where for filling, ridge via np.linalg.solve), with a comment above every line and a step-through showing the array each line produces; Intuition defines each term where it first appears (latent, factor, d and rank, matrix factorization, error, SSE, ALS, least squares, iteration, coordinate descent, parabola, derivative, global minimum, over-fitting, regularization). 1.2.1 (2026-10-01): live-example fix. Math & Code traces now carry ops, so the live data follows every stepped line (rows, cells and chips light up; counts, sims and predictions are annotated or filled in as the loop runs); live inputs get sliders/toggles/dropdowns; every code block has docstrings. All IDs kept. 1.3.0 (learner review 2026-10-05): guide edition 2 (objectives, define cards for every term, practice and reflect gates, tryIt on every section, quiz hints); corrected the regularization message (λ does not break the symmetry trap; only a random start does); one notation v_sj (factor, item) everywhere; give-away and auto-pass gates repaired; CGD escaping the trap made explicit; new U-step and V-entry generators.
