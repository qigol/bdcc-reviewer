  - id: cgd-two-hand
    type: hand-calc
    skills: [cgd-update, cgd-derivation]
    difficulty: 3
    tags: [math]
    generator: cgdTwoQ
    lessonRef: { tab: intuition, id: one-knob }
    prompt: |
      Coordinate descent from U = V = all ones (d = 2), like the lecture's x then y. First update **u_{=i}1** (user
      {=user}), then update **v_1{=j}** (item {=item}) using the new u_{=i}1. Give 2 decimals.
    show:
      - { id: mp, widget: MatrixProduct, props: { U: '@U', V: '@V', R: '@R', format: 2 } }
    steps:
      - prompt: New u_{=i}1
        answer: { var: x, tol: 0.01 }
        hint: rest = 1 for every cell; average (rating − 1) over the items this user rated.
      - prompt: 'SSE of the whole matrix after that first update'
        answer: { var: sse1, tol: 0.05 }
        hint: Only row {=user}'s predictions changed.
      - prompt: New v_1{=j}
        answer: { var: y, tol: 0.01 }
        hint: 'Σ u·(r − rest) / Σ u² over the users who rated {=item}; user {=user}''s partner factor is now the new u.'
    hints:
      - Each update jumps to the bottom of a parabola in one entry, with everything else frozen.
    explanation: |
      $u_{ {=i}1} = {=x|2}$ (SSE {=sse0|2} → {=sse1|2}). Then $v_{1{=j}} = \frac{ {=yNum|3} }{ {=yDen|3} } = {=y|2}$
      (SSE → {=sse2|2}). Using the old u would give {=wrongStaleY|2}.

  - id: sse2-hand
    type: hand-calc
    skills: [sse-observed, prediction, latent-model]
    difficulty: 3
    tags: [math]
    generator: sse2Q
    lessonRef: { tab: intuition, id: only-observed-cells }
    prompt: |
      A rank-2 factorization of a 3 × 3 rating matrix with one blank ({=blankCell}). Fill the blank, then score the fit.
    show:
      - { id: mp, widget: MatrixProduct, props: { U: '@U', V: '@V', R: '@R', format: 2 } }
    steps:
      - prompt: Predicted rating for the blank {=blankCell}
        answer: { var: blank, tol: 0.01 }
        hint: Row of U dotted with the column of V, both factors.
      - prompt: How many observed cells enter the SSE?
        answer: { var: observed, tol: 0 }
      - prompt: SSE over the observed cells
        answer: { var: sse, tol: 0.01 }
        hint: Square (r − p) for every observed cell and add; the blank is not a 0 rating.
    hints:
      - Every prediction is u₁v₁ + u₂v₂.
    explanation: |
      Blank: {=blank|2}. SSE over the {=observed} observed cells: {=sse|2} (counting the blank as a 0 rating would give {=wrongZero|2}).
