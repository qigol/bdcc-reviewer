templates:
  - id: dot-numeric
    type: numeric
    skills: [latent-model]
    difficulty: 1
    tags: [math]
    generator: dotQ
    lessonRef: { tab: math-code, id: latent-model }
    prompt: |
      A user's factors are **u = ({=u|list})** and an item's factors are **v = ({=v|list})**. What rating does the latent-factor model predict?
    answer: { var: p, tol: 0.01 }
    hints:
      - Pair the first factors, then the second ones.
      - Multiply each pair, then add the products.
    explanation: |
      $p = \sum_s u_s v_s = {=p|2}$: multiply matching factors and add.

  - id: dot-numeric-3
    type: numeric
    skills: [latent-model, prediction]
    difficulty: 2
    tags: [math]
    generator: dotQ
    lessonRef: { tab: intuition, id: hidden-tastes }
    prompt: |
      With d = {=d} latent factors, u = ({=u|list}) and v = ({=v|list}). Compute the predicted rating $p = \sum_s u_s v_s$.
    answer: { var: p, tol: 0.01 }
    hints:
      - Every one of the {=d} factors contributes a product.
      - Multiply matching factors, then add all {=d} products.
    explanation: |
      Dot product over all {=d} factors: {=p|2}.

  - id: params-numeric
    type: numeric
    skills: [latent-model, rank-choice]
    difficulty: 1
    tags: [math]
    generator: paramsQ
    lessonRef: { tab: math-code, id: latent-model }
    prompt: |
      A service has **{=m}** users, **{=n}** items and uses **d = {=d}** latent factors. How many numbers do U and V hold together?
    answer: { var: params, tol: 0 }
    hints:
      - U has one row of d numbers per user; V has one column of d numbers per item.
      - Add the two sizes, m·d + d·n.
    explanation: |
      U is {=m}×{=d} and V is {=d}×{=n}: ${=m}\cdot{=d} + {=d}\cdot{=n} = {=params|int}$, versus {=cells|int} cells in R.

  - id: sse-numeric
    type: numeric
    skills: [sse-observed]
    difficulty: 1
    tags: [math]
    generator: sseQ
    lessonRef: { tab: math-code, id: sse-observed }
    prompt: Compute the SSE of this factorization (rank 1). Blanks in R are missing ratings.
    show:
      - { id: mp, widget: MatrixProduct, props: { U: '@U', V: '@V', R: '@R', format: 2 } }
    answer: { var: sse, tol: 0.01 }
    hints:
      - Each prediction is the user's factor times the item's factor.
      - Square (rating − prediction) for every observed cell; skip the blanks.
    explanation: |
      Sum (r − p)² over the {=observed} observed cells only: SSE = {=sse|2}.

  - id: sse-numeric-2
    type: numeric
    skills: [sse-observed]
    difficulty: 2
    tags: [math]
    generator: sseQ
    lessonRef: { tab: intuition, id: only-observed-cells }
    prompt: 'R has two missing ratings. What is the SSE of P = UV on R?'
    show:
      - { id: mp, widget: MatrixProduct, props: { U: '@U', V: '@V', R: '@R', format: 2 } }
    answer: { var: sse, tol: 0.01 }
    hints:
      - Count the observed cells first.
      - One squared error per observed cell; blanks add nothing.
    explanation: |
      Only the {=observed} observed cells count. SSE = {=sse|2}. (Treating blanks as 0 would give {=wrongZero|2}.)

  - id: sse-hand
    type: hand-calc
    skills: [sse-observed, latent-model]
    difficulty: 2
    tags: [math]
    generator: sseQ
    lessonRef: { tab: math-code, id: sse-observed }
    prompt: Compute the SSE step by step.
    show:
      - { id: mp, widget: MatrixProduct, props: { U: '@U', V: '@V', R: '@R', format: 2 } }
    steps:
      - prompt: How many cells of R are observed?
        answer: { var: observed, tol: 0 }
        hint: Count the cells that hold a rating.
      - prompt: 'SSE = Σ (r − p)² over those cells'
        answer: { var: sse, tol: 0.01 }
        misconceptions:
          - { var: wrongZero, feedback: 'Missing ratings must be skipped, not treated as 0.' }
        hint: Prediction = user factor × item factor; square each error and add.
    hints:
      - Blank cells are skipped, never counted as 0.
    explanation: |
      {=observed} observed cells; SSE = {=sse|2}.

  - id: als-column
    type: numeric
    skills: [als-step, als-symmetry]
    difficulty: 2
    tags: [math]
    generator: alsColumnQ
    lessonRef: { tab: math-code, id: als-update }
    prompt: |
      ALS with d = 2 starts from **U = all ones**. After the first V-step, what is the value of each factor for item **{=item}** (the minimum-norm solution, as in the lecture)?
    show:
      - { id: r, widget: Matrix, props: { data: '@R', format: int } }
    answer: { var: v, tol: 0.01 }
    hints:
      - With U = all ones, every prediction in the column is v₁ + v₂.
      - The best v₁ + v₂ is the mean of the observed ratings; the minimum-norm solution splits it evenly.
    explanation: |
      Only $v_1 + v_2$ is determined; it equals the mean of the {=n} observed ratings, {=mean|2}. The even split gives {=v|3} each.

  - id: als-column-hand
    type: hand-calc
    skills: [als-step]
    difficulty: 2
    tags: [math]
    generator: alsColumnQ
    lessonRef: { tab: intuition, id: als-dance }
    prompt: 'First ALS V-step for item {=item} (U = all ones, d = 2), like the lecture''s first V-step.'
    show:
      - { id: r, widget: Matrix, props: { data: '@R', format: int } }
    steps:
      - prompt: 'How many observed ratings does {=item} have?'
        answer: { var: n, tol: 0 }
      - prompt: 'What must v₁ + v₂ equal (the least-squares value)?'
        answer: { var: mean, tol: 0.01 }
        hint: With U = ones every prediction in the column is v₁ + v₂; the best constant is the mean.
      - prompt: 'v₁ = v₂ = ?'
        answer: { var: v, tol: 0.01 }
        misconceptions:
          - { var: wrongAllRows, feedback: 'Skip the missing ratings when averaging.' }
          - { var: wrongMean, feedback: 'That is v₁ + v₂. The minimum-norm solution splits it evenly between the two factors.' }
    hints:
      - Only the item's observed ratings enter.
    explanation: |
      Mean of {=n} observed ratings = {=mean|3}; split evenly → {=v|3}.

  - id: als-row
    type: hand-calc
    skills: [als-step, als-symmetry]
    difficulty: 3
    tags: [math]
    generator: alsRowQ
    lessonRef: { tab: intuition, id: als-dance }
    prompt: |
      An ALS U-step with d = 2. V's two rows are equal, w = ({=w|list}) for items i1–i4. The user rated
      ({=ratingsText}) and left {=blankItem} blank. Find the user's row of U (answers to 3 decimals), like the lecture's 1.09884117.
    show:
      - { id: mp, widget: MatrixProduct, props: { U: { rows: [u], cols: [f1, f2], values: [['u_1', 'u_2']] }, V: '@V', R: '@R', symbolic: true } }
    steps:
      - prompt: Σ w·r over the rated items
        answer: { var: num, tol: 0.01 }
        hint: Skip the blank item.
      - prompt: Σ w² over the rated items
        answer: { var: den, tol: 0.01 }
      - prompt: u₁ + u₂ (the best multiplier of w)
        answer: { var: sumU, tol: 0.005 }
        hint: A line through the origin, Σ w r / Σ w².
      - prompt: u₁ = u₂ = ? (minimum-norm split)
        answer: { var: each, tol: 0.005 }
    hints:
      - With V's rows equal, every prediction is (u₁ + u₂)·w, so only the sum is determined.
      - The minimum-norm solution splits that sum evenly.
    explanation: |
      $u_1 + u_2 = \frac{\sum w r}{\sum w^2} = \frac{ {=num|3} }{ {=den|3} } = {=sumU|4}$, split evenly: {=each|4} each.

  - id: cgd-numeric
    type: numeric
    skills: [cgd-update]
    difficulty: 1
    tags: [math]
    generator: cgdQ
    lessonRef: { tab: math-code, id: cgd-worked }
    prompt: |
      Coordinate descent, d = 2. U and V are shown below. Update **u_{=i}1** (user {=user}, factor 1) to its exact minimizer.
    show:
      - { id: mp, widget: MatrixProduct, props: { U: '@U', V: '@V', R: '@R', format: 2 } }
    answer: { var: value, tol: 0.01 }
    hints:
      - rest = what factor 2 already predicts, u_{=i}2 · v₂ⱼ.
      - New value = Σ v₁ⱼ (r − rest) / Σ v₁ⱼ², over the items this user rated.
    explanation: |
      $u = \dfrac{\sum_j v_{1j}(r_{ij} - u_{i2}v_{2j})}{\sum_j v_{1j}^2} = \dfrac{ {=num|3} }{ {=den|3} } = {=value|3}$, over the observed cells of row {=i}.

  - id: cgd-hand
    type: hand-calc
    skills: [cgd-update, cgd-derivation]
    difficulty: 2
    tags: [math]
    generator: cgdQ
    lessonRef: { tab: intuition, id: one-knob }
    prompt: |
      Update u_{=i}1 by coordinate descent, step by step (the lecture's closed form).
    show:
      - { id: mp, widget: MatrixProduct, props: { U: '@U', V: '@V', R: '@R', format: 2 } }
    steps:
      - prompt: 'Numerator Σⱼ v₁ⱼ (rᵢⱼ − uᵢ₂ v₂ⱼ) over row {=i}''s observed cells'
        answer: { var: num, tol: 0.01 }
        hint: 'For each rated column: (factor-1 value of the item) × (rating − what factor 2 already predicts).'
      - prompt: 'Denominator Σⱼ v₁ⱼ²'
        answer: { var: den, tol: 0.01 }
        hint: Square each partner factor v₁ⱼ of a rated item and add; it is a count only if they are all 1.
      - prompt: New u_{=i}1
        answer: { var: value, tol: 0.01 }
        misconceptions:
          - { var: wrongMean, feedback: 'Subtract the other factor''s contribution before averaging.' }
      - prompt: SSE of the whole matrix after the update
        answer: { var: after, tol: 0.05 }
        hint: Only row {=i}'s predictions changed; the other rows' squared errors stay as they were.
    hints:
      - Freeze everything except u_{=i}1; the SSE is a parabola in it.
    explanation: |
      {=num|3} / {=den|3} = {=value|3}; the SSE of the whole matrix goes {=before|2} → {=after|2}.

  - id: cgd-hard
    type: numeric
    skills: [cgd-update]
    difficulty: 3
    tags: [math]
    generator: cgdQ
    lessonRef: { tab: math-code, id: cgd-derivation }
    prompt: |
      Two missing ratings and an uneven V. Compute the coordinate-descent update of u_{=i}1 (2 decimals).
    show:
      - { id: mp, widget: MatrixProduct, props: { U: '@U', V: '@V', R: '@R', format: 2 } }
    answer: { var: value, tol: 0.01 }
    hints:
      - Use only the items this user rated.
      - Σ v₁ⱼ (r − u_{=i}2 v₂ⱼ) on top, Σ v₁ⱼ² below; the v₁ⱼ are not all 1.
    explanation: |
      Numerator {=num|3}, denominator {=den|3}: u = {=value|3}.

  - id: cgd-v-numeric
    type: numeric
    skills: [cgd-update, cgd-derivation]
    difficulty: 3
    tags: [math]
    generator: cgdVQ
    lessonRef: { tab: intuition, id: one-knob }
    prompt: |
      Coordinate descent, d = 2. Update **v_1{=j}** (factor 1 of item {=item}) to its exact minimizer (2 decimals), like the
      lecture's y = 16.4 / 9.76. U and V are shown below.
    show:
      - { id: mp, widget: MatrixProduct, props: { U: '@U', V: '@V', R: '@R', format: 2 } }
    answer: { var: value, tol: 0.01 }
    hints:
      - The partner factor of v_1{=j} is each rater's u_i1; rest = u_i2 · v_2{=j}.
      - New value = Σ u_i1 (r − rest) / Σ u_i1², over the users who rated {=item}.
    explanation: |
      $v_{1{=j}} = \frac{\sum_i u_{i1}(r_{i{=j}} - u_{i2}v_{2{=j}})}{\sum_i u_{i1}^2} = \frac{ {=num|3} }{ {=den|3} } = {=value|3}$.

  - id: symmetry-mcq
    type: mcq
    skills: [als-symmetry]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: symmetry-trap }
    prompt: 'Why are both columns of the lecture''s U after one ALS iteration identical (1.0988…, 1.0988…)?'
    options:
      - ALS started from U = all ones, and identical factors receive identical updates forever
      - The data really has only one taste dimension
      - Least squares always returns identical columns
      - It is a rounding artifact
    answer: 0
    optionFeedback:
      '1': 'Even with richer data, a symmetric start stays symmetric. Random initialization lets the factors differ.'
    hints: [What did U look like before the first V-step?]
    explanation: With identical columns in U, the V-step gives identical rows in V, and the U-step then keeps U's columns identical. That is the symmetry trap.

  - id: symmetry-fixes
    type: multi
    skills: [als-symmetry, rank-choice]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: symmetry-trap }
    prompt: Starting from U = all ones, which of these get you out of the symmetry trap? Select all that apply.
    options:
      - Initialize U randomly instead
      - Update one entry at a time with coordinate descent instead of ALS
      - Add λ(‖U‖² + ‖V‖²) regularization to ALS
      - Run more ALS iterations from all ones
      - Start ALS from U = all twos instead of all ones
    answer: [0, 1]
    hints:
      - Ask whether each change makes the two factors start, or become, different.
    explanation: |
      A random start makes the factors differ from the beginning, and a single coordinate update (u₁₁ = 2.6) already
      makes U's columns unequal. Regularization only shrinks the factors: from a symmetric start the ridge step is
      symmetric too. More iterations or any constant start stay symmetric.

  - id: cgd-escape-mcq
    type: mcq
    skills: [als-symmetry, cgd-update]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: full-sweep }
    prompt: From U = V = all ones, one coordinate-descent sweep reaches SSE ≈ 21.1, while ALS from all ones gets stuck at 22.6. Why?
    options:
      - Updating u₁₁ alone makes U's two columns differ at once, so the two factors can learn different things
      - Coordinate descent uses a larger step size than ALS
      - Coordinate descent ignores the missing ratings
      - ALS uses regularization and coordinate descent doesn't
    answer: 0
    hints: [Look at U's first row right after x = u₁₁ = 2.6.]
    explanation: After the first update U's row 1 is (2.6, 1), so the columns are no longer copies. ALS updates whole columns together and keeps them equal; coordinate descent breaks the tie with its first move.

  - id: sse-missing
    type: mcq
    skills: [sse-observed]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: only-observed-cells }
    prompt: How do missing ratings enter the SSE in the lecture's latent-factor model?
    options:
      - They don't; only observed cells are summed
      - As zeros
      - As the user's mean rating
      - As the column mean
    answer: 0
    hints: [What are the blanks for?]
    explanation: The lecture writes one squared term per observed rating; the blanks are what we want to predict.

  - id: als-monotone
    type: mcq
    skills: [als-step, cgd-update]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: watching-sse-fall }
    prompt: 'During ALS (or exact coordinate descent), the SSE after each update…'
    options:
      - never increases
      - always decreases by the same amount
      - can increase if the learning rate is too high
      - always reaches the global minimum
    answer: 0
    hints: [Each update solves its own small problem exactly.]
    explanation: Each update solves its sub-problem exactly, so the objective can only drop or stay. But convergence to the global minimum is not guaranteed.

  - id: cgd-derivative
    type: mcq
    skills: [cgd-derivation]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: cgd-derivation }
    prompt: 'In the lecture''s derivation, why is a single-entry update available in closed form?'
    options:
      - With everything else frozen, the SSE is a quadratic (parabola) in that one entry
      - Because U and V are orthogonal
      - Because the ratings are integers
      - Because d = 2
    answer: 0
    hints: [How does the prediction depend on u_is when everything else is frozen?]
    explanation: 'The prediction is linear in u_is, so the squared error is quadratic; set the derivative to 0 and solve.'

  - id: cgd-steps
    type: order
    skills: [cgd-derivation]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: cgd-derivation }
    prompt: Order the derivation of the coordinate update for u_is.
    items:
      - Write the SSE over the observed cells of row i
      - Split each prediction into u_is·v_sj plus the other factors' contribution
      - Differentiate with respect to u_is and set the derivative to zero
      - Collect the u_is terms on one side
      - Divide by Σ v_sj² to get the closed form
    explanation: 'SSE → split → derivative = 0 → rearrange → u_is = Σ v(r − rest) / Σ v².'

  - id: als-steps
    type: order
    skills: [als-step]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: math-code, id: als-run }
    prompt: Order the ALS procedure.
    items:
      - Choose d and initialize U
      - Freeze U; for each item, solve least squares over its observed ratings to get V's column
      - Freeze V; for each user, solve least squares over their observed ratings to get U's row
      - Repeat the two half-steps until the SSE stops improving
      - Predict missing ratings with P = UV
    explanation: Alternate the two easy half-steps; predictions come from the product.

  - id: code-predict
    type: code-fill
    skills: [latent-model, prediction]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: latent-model }
    prompt: Complete the prediction functions (U is m×d, V is d×n).
    code: |
      def predict(U, V):
          return __BLANK_1__

      def predict_one(U, V, i, j):
          return U[i, :] @ V[__BLANK_2__]
    blanks:
      '1': { accept: ['U @ V', 'U@V', 'np.dot(U, V)', 'U.dot(V)', 'np.matmul(U, V)'] }
      '2': { accept: [':, j', ':,j'] }
    hints: [Item j's factors are a column of V.]
    explanation: 'P = UV; item j''s factors are column j of V.'

  - id: code-sse
    type: code-fill
    skills: [sse-observed]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: sse-observed }
    prompt: Complete the SSE over observed entries (np.nan marks missing ratings).
    code: |
      def sse(R, U, V):
          observed = __BLANK_1__(R)
          E = R - U @ V
          return np.sum(E[__BLANK_2__] ** 2)
    blanks:
      '1': { accept: ['~np.isnan'] }
      '2': { accept: ['observed'] }
    hints: [A rating exists where R is not NaN.]
    explanation: Mask out missing cells, then sum squared errors on the rest.

  - id: code-als
    type: code-fill
    skills: [als-step]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: als-update }
    prompt: Complete the ALS V-step.
    code: |
      def als_step_V(R, U):
          V = np.zeros((U.shape[1], R.shape[1]))
          for j in range(R.shape[1]):
              rated = ~np.isnan(R[:, j])
              V[:, j] = np.linalg.lstsq(__BLANK_1__, R[rated, j], rcond=None)[0]
          return V
    blanks:
      '1': { accept: ['U[rated]', 'U[rated, :]'], hint: the frozen rows of the users who rated item j }
    hints: [The features are the frozen U rows of the users who rated item j.]
    explanation: Regress item j's observed ratings on the frozen factors of the users who rated it.

  - id: code-cgd
    type: code-fill
    skills: [cgd-derivation, cgd-update]
    difficulty: 3
    tags: [code]
    lessonRef: { tab: math-code, id: cgd-derivation }
    prompt: Complete the closed-form coordinate update.
    code: |
      def update_u(R, U, V, i, s):
          rated = ~np.isnan(R[i])
          rest = U[i] @ V - U[i, s] * V[s]
          resid = R[i, rated] - __BLANK_1__
          U[i, s] = (V[s, rated] @ resid) / (__BLANK_2__)
          return U
    blanks:
      '1': { accept: ['rest[rated]'], hint: 'rest here covers every item; keep only the rated ones' }
      '2': { accept: ['V[s, rated] @ V[s, rated]', 'np.sum(V[s, rated] ** 2)', '(V[s, rated] ** 2).sum()', 'np.dot(V[s, rated], V[s, rated])'] }
    hints:
      - Unlike the lesson's code, `rest` here is computed for every item, so it must be restricted to the rated ones.
      - The denominator is Σ v_sj² over the rated items.
    explanation: 'Residual after the other factors, regressed on v_s: Σ v·resid / Σ v².'

  - id: match-terms
    type: match
    skills: [latent-model, prediction, rank-choice, als-symmetry]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: hidden-tastes }
    prompt: Match each term to its meaning.
    pairs:
      - [Latent factor, 'A learned hidden taste dimension']
      - [Rank d, 'Number of latent factors']
      - [Overfitting, 'Near-zero training error, bad predictions for blanks']
      - [Symmetry trap, 'Identical starting factors never separate']
      - [Regularization, 'Penalty on large factor values']
    explanation: The main ideas beyond the arithmetic.

  - id: match-shapes
    type: match
    skills: [latent-model]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: latent-model }
    prompt: Match each object to its shape (m users, n items, d factors).
    pairs:
      - [R, 'm × n']
      - [U, 'm × d']
      - [V, 'd × n']
      - ['A user''s factors', '1 × d (a row of U)']
      - ['An item''s factors', 'd × 1 (a column of V)']
    explanation: 'R ≈ UV with V written d×n, as in the lecture.'

  - id: overfit
    type: mcq
    skills: [prediction, rank-choice]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: filling-the-blanks }
    prompt: 'A model reaches training SSE ≈ 0 but predicts 0.5 for a 1–5 rating. What is the most likely cause?'
    options:
      - Overfitting (too many free parameters for the data); try a smaller d or add λ
      - Underfitting; increase d
      - The SSE was computed over missing cells
      - Too few ALS iterations
    answer: 0
    hints: [Compare the number of parameters with the number of known ratings.]
    explanation: Fitting known ratings perfectly with many parameters can distort the unknown ones. Regularize or reduce d, and validate on held-out ratings.

  - id: predict-missing
    type: mcq
    skills: [prediction]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: math-code, id: prediction }
    prompt: After training, how is a missing rating r_ij predicted?
    options:
      - As the dot product of row i of U and column j of V
      - As the average of row i
      - By finding the k most similar users
      - It can't be predicted without retraining
    answer: 0
    explanation: 'The same P = UV used during training gives values for every cell, including blanks.'

  - id: lambda-effect
    type: mcq
    skills: [rank-choice]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: math-code, id: regularization }
    prompt: 'Increasing λ (regularization) in ALS typically…'
    options:
      - increases the training SSE a little but stabilizes predictions for unseen cells
      - decreases the training SSE
      - has no effect on predictions
      - breaks the symmetry trap from an all-ones start
    answer: 0
    hints: [What does a penalty on big factor values do to the fit on known ratings?]
    explanation: The penalty pulls factors toward zero, trading training fit for generalization. It does not break the symmetry trap.

  - id: slide14
    type: mcq
    skills: [cgd-update]
    difficulty: 1
    tags: [math]
    lessonRef: { tab: math-code, id: cgd-worked }
    prompt: 'The lecture''s second coordinate step ends with "x = 1.68". Which entry was actually updated?'
    options:
      - 'y = v₁₁, the first factor of item 1, with u₁₁ = 2.6 fixed'
      - 'x = u₁₁ again'
      - 'u₂₁'
      - 'v₁₂'
    answer: 0
    explanation: 'The expression (4 − 2.6y)² + (2 − y)² + … is in y; the label is a typo.'

  - id: lf-vs-nb
