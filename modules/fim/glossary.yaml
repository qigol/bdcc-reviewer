terms:
  - id: transaction
    term: Transaction
    aka: [basket, transactions, baskets]
    short: One record of the database, a set of items bought (or occurring) together, such as a single shopping basket.
    related: [item, itemset, database]
    lessonRef: { tab: intuition, id: whats-in-a-basket }
    skills: [support]
  - id: item
    term: Item
    aka: [items]
    short: A single product or event that can appear in a transaction, like bread or milk.
    related: [transaction]
    lessonRef: { tab: intuition, id: whats-in-a-basket }
    skills: [support]
  - id: itemset
    term: Itemset
    short: Any set of items considered together; a k-itemset has exactly k items.
    aka: [k-itemset, itemsets]
    long: '{bread, butter, milk} is a 3-itemset; {milk} is a 1-itemset. Order inside a set does not matter: {milk, bread} is the same itemset as {bread, milk}.'
    related: [item, absolute-support, superset]
    lessonRef: { tab: intuition, id: whats-in-a-basket }
    skills: [support]
  - id: database
    term: Database (D)
    aka: [database, transaction database, D]
    short: The whole list of transactions being mined, written D; |D| is how many transactions it holds.
    long: The lecture's grocery database has |D| = 5 baskets; the sari-sari case has |D| = 30.
    related: [transaction, relative-support]
    lessonRef: { tab: intuition, id: whats-in-a-basket }
    skills: [support]
  - id: absolute-support
    term: Absolute support
    aka: [AbsSup, support count, support]
    short: The number of transactions that contain every item of an itemset.
    formula: '\text{AbsSup}(X) = |\{T \in D : X \subseteq T\}|'
    long: Read the formula as "the number of transactions T in D such that X is a subset of T", i.e. T holds every item of X. Plain "Sup" in this module means this count.
    related: [relative-support, minsup]
    lessonRef: { tab: intuition, id: counting-togetherness }
    skills: [support]
  - id: relative-support
    term: Relative support
    aka: [RelSup]
    short: The share of all transactions that contain the itemset, i.e. the absolute support divided by the number of transactions.
    formula: '\text{RelSup}(X) = \frac{\text{AbsSup}(X)}{|D|}'
    related: [absolute-support, database]
    lessonRef: { tab: intuition, id: counting-togetherness }
    skills: [support]
  - id: minsup
    term: Minimum support (minsup)
    aka: [minsup, minimum support]
    short: The bar an itemset's support must reach to count as frequent; given as a count (2) or as a fraction of all baskets (0.4).
    long: A fraction such as 0.15 on 30 baskets means at least 0.15 × 30 = 4.5 baskets, so in practice at least 5.
    related: [frequent-itemset]
    lessonRef: { tab: intuition, id: lecture-support-table }
    skills: [frequent-itemset]
  - id: frequent-itemset
    term: Frequent itemset
    aka: [frequent]
    short: An itemset whose (absolute or relative) support is at least minsup.
    formula: '\text{Sup}(X) \ge \text{minsup}'
    related: [minsup, apriori-principle]
    lessonRef: { tab: intuition, id: lecture-support-table }
    skills: [frequent-itemset]
  - id: lattice
    term: Itemset lattice
    aka: [lattice]
    short: A picture of every possible itemset, arranged in levels by size, with lines joining each itemset to the ones one item bigger.
    related: [itemset, superset, brute-force]
    lessonRef: { tab: intuition, id: the-bar }
    skills: [frequent-itemset, brute-force]
  - id: brute-force
    term: Brute force
    short: Counting the support of every possible non-empty itemset, 2ⁿ − 1 of them for n items.
    formula: '2^n - 1'
    related: [apriori, fp-growth, lattice]
    lessonRef: { tab: intuition, id: combinatorial-explosion }
    skills: [brute-force]
  - id: superset
    term: Superset
    aka: [supersets]
    short: An itemset that contains every item of another one, possibly with more; {bread, eggs, milk} is a superset of {bread, eggs}.
    formula: 'Y \supseteq X'
    long: The reverse word is subset, written X ⊆ Y.
    related: [itemset, apriori-principle]
    lessonRef: { tab: intuition, id: apriori-principle }
    skills: [frequent-itemset, apriori]
  - id: apriori-principle
    term: Apriori principle
    aka: [antimonotonicity, downward closure]
    short: If an itemset is infrequent, every superset of it is infrequent too, so supersets never need counting.
    related: [apriori, frequent-itemset, superset]
    lessonRef: { tab: intuition, id: apriori-principle }
    skills: [apriori, frequent-itemset]
  - id: apriori
    term: Apriori
    aka: [Apriori algorithm]
    short: Level-wise mining that only counts itemsets built by growing ones already known to be frequent.
    long: The lecture's version extends each frequent itemset by one later frequent item. The classic textbook version also drops any candidate with an infrequent subset before counting.
    related: [apriori-principle, brute-force, fp-growth]
    lessonRef: { tab: intuition, id: apriori-run }
    skills: [apriori]
  - id: fp-growth
    term: FP-growth
    aka: [Frequent-Pattern growth]
    short: Mining by successively filtering the database to rows containing a growing prefix and recursing on what remains.
    long: The lecture teaches it as projected-database filtering in alphabetical order; textbooks store the same information in an FP-tree.
    related: [projected-database, prefix, apriori]
    lessonRef: { tab: intuition, id: fp-growth-filter }
    skills: [fp-growth]
  - id: prefix
    term: Prefix
    aka: [prefixes]
    short: The itemset FP-growth is currently growing, such as {bread} or {bread, milk}; every itemset found in that branch starts with it.
    related: [fp-growth, projected-database]
    lessonRef: { tab: intuition, id: fp-growth-filter }
    skills: [fp-growth]
  - id: projected-database
    term: Projected database
    aka: [conditional database, filtered table, filtered database]
    short: The rows that contain a prefix, keeping only the items that come after the prefix in a fixed order.
    long: Written D with the prefix underneath, e.g. D_{bread}, read "D restricted to bread".
    related: [fp-growth, prefix]
    lessonRef: { tab: intuition, id: fp-growth-filter }
    skills: [fp-growth]
  - id: association-rule
    term: Association rule
    aka: [rule, rules]
    short: A statement A → B saying that transactions containing A tend to also contain B.
    long: It describes co-occurrence in the data, not cause and effect.
    related: [antecedent, consequent, confidence]
    lessonRef: { tab: intuition, id: itemsets-to-rules }
    skills: [rules]
  - id: antecedent
    term: Antecedent
    aka: [left-hand side, precedent]
    short: The "if" part A of a rule A → B.
    related: [consequent, association-rule]
    lessonRef: { tab: intuition, id: itemsets-to-rules }
    skills: [rules]
  - id: consequent
    term: Consequent
    aka: [right-hand side]
    short: The "then" part B of a rule A → B, the itemset being predicted.
    related: [antecedent, association-rule]
    lessonRef: { tab: intuition, id: itemsets-to-rules }
    skills: [rules]
  - id: confidence
    term: Confidence
    aka: [conf]
    short: Of the transactions that contain the antecedent, the share that also contain the consequent.
    formula: '\text{Conf}(A \rightarrow B) = P(B \mid A) = \frac{\text{Sup}(A \cup B)}{\text{Sup}(A)}'
    long: P(B | A) is read "the probability of B given A". Sup here is the count; dividing both counts by |D| would cancel, so shares give the same ratio.
    related: [lift, minconf]
    lessonRef: { tab: intuition, id: itemsets-to-rules }
    skills: [confidence]
  - id: rule-generation
    term: Rule generation
    aka: [generate rules, generating rules]
    short: Splitting each frequent itemset into every non-empty antecedent and consequent pair and keeping splits that pass minconf.
    related: [minconf, association-rule]
    lessonRef: { tab: intuition, id: itemsets-to-rules }
    skills: [rules]
  - id: minconf
    term: Minimum confidence (minconf)
    aka: [minconf, minimum confidence]
    short: The confidence a candidate rule must reach to be kept.
    related: [confidence, rule-generation]
    lessonRef: { tab: intuition, id: itemsets-to-rules }
    skills: [rules]
  - id: base-rate
    term: Base rate
    aka: [base rate]
    short: How common the consequent is in all baskets, regardless of the antecedent; its relative support.
    formula: '\text{RelSup}(B) = \frac{\text{Sup}(B)}{|D|}'
    related: [lift, relative-support]
    lessonRef: { tab: intuition, id: milk-trap }
    skills: [lift]
  - id: lift
    term: Lift
    short: Confidence divided by the consequent's base rate; above 1 means baskets with A hold B more often than baskets in general.
    formula: '\text{Lift}(A \rightarrow B) = \frac{\text{Conf}(A \rightarrow B)}{\text{RelSup}(B)}'
    long: |
      Above 1 is a positive association, 1 none, below 1 negative. A value just above 1 (1.1 or 1.15) is a weak positive
      association; on a few dozen baskets it could easily be chance. Lift says nothing about cause, and a big lift on an
      itemset below minsup is noise.
    related: [confidence, base-rate]
    lessonRef: { tab: intuition, id: milk-trap }
    skills: [lift, interpretation]
  - id: leverage
    term: Leverage
    short: How much more often A and B occur together than they would if unrelated, as a difference of relative supports.
    formula: '\text{RelSup}(A \cup B) - \text{RelSup}(A)\,\text{RelSup}(B)'
    related: [lift, conviction]
    lessonRef: { tab: math-code, id: leverage-conviction }
    skills: [interpretation]
  - id: conviction
    term: Conviction
    short: Ratio of expected to observed rule failures; infinite for rules that never fail, 1 when A and B are unrelated.
    formula: '\frac{1 - \text{RelSup}(B)}{1 - \text{Conf}(A \rightarrow B)}'
    related: [lift, leverage]
    lessonRef: { tab: math-code, id: leverage-conviction }
    skills: [interpretation]
