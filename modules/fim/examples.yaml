examples:
  - id: abs-support-bread-butter-milk
    source: 'Sessions 3–4, slide 8'
    page: 2
    fn: support
    in: { transactions: '@grocery5', itemset: [bread, butter, milk] }
    expect: { abs: 1 }
  - id: abs-support-bread-milk
    source: 'Sessions 3–4, slide 8'
    page: 2
    fn: support
    in: { transactions: '@grocery5', itemset: [bread, milk] }
    expect: { abs: 2 }
  - id: abs-support-milk
    source: 'Sessions 3–4, slide 8'
    page: 2
    fn: support
    in: { transactions: '@grocery5', itemset: [milk] }
    expect: { abs: 5 }
  - id: rel-support-bread
    source: 'Sessions 3–4, slide 9'
    page: 2
    fn: support
    in: { transactions: '@grocery5', itemset: [bread] }
    expect: { rel: 0.4 }
    tol: 0.01
  - id: rel-support-butter-milk
    source: 'Sessions 3–4, slide 9'
    page: 2
    fn: support
    in: { transactions: '@grocery5', itemset: [butter, milk] }
    expect: { rel: 0.2 }
    tol: 0.01
  - id: frequent-among-3
    source: 'Sessions 3–4, slide 10'
    page: 2
    fn: frequentAmong
    in: { transactions: '@grocery5', minsup: 3, itemsets: [[bread, butter, milk], [bread, butter], [bread, milk], [butter, milk], [bread], [butter], [milk]] }
    expect: { count: 1, frequent: [[milk]] }
    note: Only {milk} is frequent among the listed itemsets.
  - id: frequent-among-2
    source: 'Sessions 3–4, slide 11'
    page: 2
    fn: frequentAmong
    in: { transactions: '@grocery5', minsup: 2, itemsets: [[bread, butter, milk], [bread, butter], [bread, milk], [butter, milk], [bread], [butter], [milk]] }
    expect: { count: 3, frequent: [[bread, milk], [bread], [milk]] }
  - id: frequent-among-rel
    source: 'Sessions 3–4, slides 12–13'
    page: 3
    fn: frequentAmong
    in: { transactions: '@grocery5', minsup: 0.4, itemsets: [[bread, butter, milk], [bread, butter], [bread, milk], [butter, milk], [bread], [butter], [milk]] }
    expect: { count: 3 }
    note: 'minsup = 0.4 (relative) keeps {bread, milk}, {bread}, {milk}.'
  - id: brute-support-four
    source: 'Sessions 3–4, slide 16'
    page: 3
    fn: support
    in: { transactions: '@grocery5', itemset: [bread, cheese, eggs, milk] }
    expect: { abs: 1 }
  - id: brute-lattice-size
    source: 'Sessions 3–4, slides 15–16'
    page: 3
    fn: explosion
    in: { n: 6 }
    expect: { count: 63 }
    note: Brute force evaluates every non-empty itemset of the 6 items.
  - id: apriori-level-two
    source: 'Sessions 3–4, slide 19'
    page: 4
    fn: aprioriRun
    in: { transactions: '@grocery5', minsup: 2 }
    expect: { level2: 10, count: 11 }
  - id: fp-growth-run
    source: 'Sessions 3–4, slides 21–40'
    page: 4
    fn: fpGrowthRun
    in: { transactions: '@grocery5', minsup: 2 }
    expect: { count: 11, explored: 18 }
  - id: frequent-minsup-2
    source: 'Sessions 3–4, slide 45'
    page: 8
    fn: frequentItemsets
    in: { transactions: '@grocery5', minsup: 2 }
    expect: { count: 11 }
  - id: conf-bread-butter
    source: 'Sessions 3–4, slide 43'
    page: 8
    fn: confidence
    in: { transactions: '@grocery5', A: [bread], B: [butter] }
    expect: { conf: 0.5, supAB: 1, supA: 2 }
    tol: 0.01
  - id: conf-milk-yogurt
    source: 'Sessions 3–4, slide 47'
    page: 8
    fn: confidence
    in: { transactions: '@grocery5', A: [milk], B: [yogurt] }
    expect: { conf: 0.6 }
    tol: 0.01
  - id: conf-yogurt-milk
    source: 'Sessions 3–4, slide 47'
    page: 8
    fn: confidence
    in: { transactions: '@grocery5', A: [yogurt], B: [milk] }
    expect: { conf: 1 }
    tol: 0.01
  - id: conf-eggs-milk-yogurt
    source: 'Sessions 3–4, slide 51'
    page: 9
    fn: confidence
    in: { transactions: '@grocery5', A: [eggs, milk], B: [yogurt] }
    expect: { conf: 0.67 }
    tol: 0.01
  - id: conf-milk-eggs-yogurt
    source: 'Sessions 3–4, slide 52'
    page: 9
    fn: confidence
    in: { transactions: '@grocery5', A: [milk], B: [eggs, yogurt] }
    expect: { conf: 0.4 }
    tol: 0.01
    note: Rejected at minconf 0.6 (crossed out on the slide).
  - id: rules-13
    source: 'Sessions 3–4, slide 60'
    page: 10
    fn: rules
    in: { transactions: '@grocery5', minsup: 2, minconf: 0.6 }
    expect: { count: 13, considered: 16 }
  - id: lift-bread-butter
    source: 'Sessions 3–4, slide 61'
    page: 11
    fn: lift
    in: { transactions: '@grocery5', A: [bread], B: [butter] }
    expect: { conf: 0.5, relB: 0.2, lift: 2.5 }
    tol: 0.01
  - id: lift-bread-eggs
    source: 'Sessions 3–4, slide 62'
    page: 11
    fn: lift
    in: { transactions: '@grocery5', A: [bread], B: [eggs] }
    expect: { conf: 0.5, relB: 0.6, lift: 0.83 }
    tol: 0.01
  - id: lift-milk-trap
    source: 'Sessions 3–4, slides 47 and 61 (derived)'
    page: 11
    fn: lift
    in: { transactions: '@grocery5', A: [yogurt], B: [milk] }
    expect: { conf: 1, lift: 1 }
    note: Milk is in every basket, so any rule X → {milk} has confidence 1 and lift exactly 1.
