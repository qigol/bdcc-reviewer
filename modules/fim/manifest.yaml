objectives:
  - id: count
    text: Count the absolute and relative support of an itemset and decide whether it is frequent at an absolute or relative minsup.
    skills: [support, frequent-itemset]
  - id: prune
    text: Explain why brute force needs 2ⁿ − 1 counts, and list and count the candidates the lecture's Apriori checks level by level.
    skills: [brute-force, apriori]
  - id: filter
    text: Mine every frequent itemset by hand with FP-growth by filtering prefix-projected databases.
    skills: [fp-growth]
  - id: rules
    text: Split each frequent itemset into every candidate rule and keep those whose confidence reaches minconf.
    skills: [rules, confidence]
  - id: judge
    text: Compute lift and use it, together with support, to judge whether a rule is worth acting on.
    skills: [lift, interpretation]
