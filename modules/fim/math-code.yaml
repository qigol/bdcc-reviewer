sections:
  - id: support
    title: Absolute and relative support
    skills: [support]
    summary: |
      Support measures how common an itemset is: count the transactions that contain **every** item of it
      (absolute), or divide that count by the number of transactions (relative).
    keyFormula: '\text{AbsSup}(X) = |\{T \in D : X \subseteq T\}|, \quad \text{RelSup}(X) = \frac{\text{AbsSup}(X)}{|D|}'
    data: [grocery5]
    state: { X: [bread, milk] }
    derive:
      - { fn: support, in: { transactions: '@grocery5', itemset: '@X' }, out: s }
    live:
      - id: table
        widget: TransactionTable
        props:
          transactions: '@grocery5'
          title: Lecture grocery database
          highlight: '@X'
          showContainCount: true
    steps:
      - tex: |
          \text{AbsSup}(X) = \anchor{ret}{\left|\{\, \anchor{loop}{T \in D} : \anchor{test}{X \subseteq T} \,\}\right|}
        say: The number of transactions that contain the whole itemset.
      - tex: |
          \anchor{init}{\text{count} = 0}, \quad \text{for each } \anchor{loop}{T \in D}: \ \anchor{test}{X \subseteq T} \Rightarrow \anchor{inc}{\text{count} \mathrel{+}= 1}
        say: The same definition written as a loop. Each basket adds 1 or 0.
      - tex: |
          \text{RelSup}(X) = \anchor{rel}{\frac{\text{AbsSup}(X)}{|D|}}
        say: Divide by the number of transactions to get a fraction between 0 and 1.
      - tex: |
          \text{AbsSup}({=X|set}) = \anchor{ret}{ {=s.tallyTex} = {=s.abs} }, \qquad \text{RelSup} = \anchor{rel}{\frac{ {=s.abs} }{ {=s.n} } = {=s.rel|2}}
        say: 'Lecture example (slides 8–9): one term per basket. Press **Step through** to run the loop line by line; change X in the live inputs, e.g. `milk`.'
    code:
      lang: python
      source: |
        def abs_support(X, transactions):
            """Absolute support: how many transactions contain every item of X.

            Args:
                X: the itemset, e.g. {"bread", "milk"}.
                transactions: the database, one collection of items per basket.

            Returns:
                int: the number of baskets T with X ⊆ T.
                Lecture: abs_support({"bread", "milk"}, D) == 2.
            """
            count = 0                     # @a:init
            for T in transactions:        # @a:loop
                if set(X) <= set(T):      # @a:test
                    count += 1            # @a:inc
            return count                  # @a:ret

        def rel_support(X, transactions):
            """Relative support: the fraction of transactions that contain X.

            Returns:
                float in [0, 1]: abs_support(X) / |D|.
                Lecture: rel_support({"bread", "milk"}, D) == 2 / 5 == 0.4.
            """
            return abs_support(X, transactions) / len(transactions)  # @a:rel
    links:
      - { anchor: init, label: 'count = 0' }
      - { anchor: loop, label: 'visit every transaction T' }
      - { anchor: test, label: 'X ⊆ T? (all items present)', say: 'A transaction counts only if X ⊆ T.' }
      - { anchor: inc, label: 'count += 1' }
      - { anchor: ret, label: 'AbsSup(X)' }
      - { anchor: rel, label: 'RelSup(X): divide by |D|' }
    trace: { fn: supportCode, in: { transactions: '@grocery5', itemset: '@X' } }
    examples: [abs-support-bread-butter-milk, abs-support-bread-milk, abs-support-milk, rel-support-bread, rel-support-butter-milk]
    pitfalls:
      - A basket supports {bread, milk} only if it has **both**, not either one.
      - Relative support divides by the number of **transactions**, not by the number of items.
    examTip: Write one 1 or 0 per basket, add them (AbsSup), then divide by |D| only if the question asks for relative support.

  - id: frequent-itemsets
    title: Frequent itemsets and minsup
    skills: [frequent-itemset]
    summary: |
      An itemset is frequent when its support reaches minsup. minsup can be an absolute count (2) or a fraction (0.4).
      Raising minsup can only remove itemsets.
    keyFormula: 'X \text{ frequent} \iff \text{Sup}(X) \ge \text{minsup}'
    data: [grocery5]
    state: { minsup: 2 }
    derive:
      - { fn: frequentItemsets, in: { transactions: '@grocery5', minsup: '@minsup' }, out: f }
      - fn: frequentAmong
        in: { transactions: '@grocery5', minsup: '@minsup', itemsets: [[bread, butter, milk], [bread, butter], [bread, milk], [butter, milk], [bread], [butter], [milk]] }
        out: fa
    live:
      - id: table
        widget: TransactionTable
        props:
          transactions: '@grocery5'
          title: Lecture grocery database
    steps:
      - tex: |
          X \text{ is frequent} \iff \anchor{sup}{\text{Sup}(X)} \ge \anchor{minsup}{\text{minsup}}
        say: Compare the support with the threshold. Use the same kind of support (count or fraction) on both sides.
      - tex: |
          \text{minsup} < 1 \;\Rightarrow\; \text{compare } \anchor{rel}{\text{RelSup}(X) = \tfrac{\text{AbsSup}(X)}{|D|}} \text{ instead}
        say: A fraction means a relative threshold, so convert the count first (slides 12–13).
      - tex: |
          \anchor{init}{F = \emptyset}; \quad \anchor{loop}{\forall X \in C}: \ \anchor{minsup}{\text{Sup}(X) \ge \text{minsup}} \Rightarrow \anchor{keep}{F \leftarrow F \cup \{X\}}; \quad \anchor{ret}{\text{return } F}
        say: Filtering a list of candidates is a single loop.
      - tex: |
          \text{Sup}(Y) \le \text{Sup}(X) \quad \text{whenever } X \subseteq Y
        say: Adding items can only shrink the set of baskets that contain them. This is why raising minsup never adds itemsets.
      - tex: |
          \anchor{minsup}{\text{minsup} = {=minsup}}: \ {=fa.count} \text{ of the 7 slide-8 itemsets}, \ {=f.count} \text{ of all 63}
        say: 'Step through checks the seven slide-8 itemsets. Set minsup to 3, 0.5 or 0.4 in the live inputs to replay slides 10–13. Over all itemsets at minsup 2: {=f.labels}.'
    code:
      lang: python
      source: |
        def frequent_itemsets(candidates, transactions, minsup):
            """Keep the candidate itemsets whose support reaches minsup.

            Args:
                candidates: itemsets to test.
                transactions: the database.
                minsup: an absolute count (≥ 1) or, if below 1, a relative
                    threshold compared with abs_support / |D|.

            Returns:
                list: the frequent candidates, in the order they were given.
            """
            frequent = []                              # @a:init
            for X in candidates:                       # @a:loop
                sup = abs_support(X, transactions)     # @a:sup
                if minsup < 1:                         # a fraction: relative threshold
                    sup = sup / len(transactions)      # @a:rel
                if sup >= minsup:                      # @a:minsup
                    frequent.append(X)                 # @a:keep
            return frequent                            # @a:ret
    links:
      - { anchor: init, label: 'frequent = []' }
      - { anchor: loop, label: 'each candidate X' }
      - { anchor: sup, label: 'Sup(X)', say: 'Absolute, or relative when minsup is a fraction.' }
      - { anchor: rel, label: 'convert to RelSup' }
      - { anchor: minsup, label: 'Sup(X) ≥ minsup?' }
      - { anchor: keep, label: 'keep X' }
      - { anchor: ret, label: 'the frequent itemsets' }
    trace:
      fn: frequentCode
      in: { transactions: '@grocery5', minsup: '@minsup', itemsets: [[bread, butter, milk], [bread, butter], [bread, milk], [butter, milk], [bread], [butter], [milk]] }
    examples: [frequent-among-3, frequent-among-2, frequent-among-rel, frequent-minsup-2]
    pitfalls:
      - Frequent means support **≥** minsup, not strictly greater.
      - Don't compare a count with a fraction; convert one of them first.
    examTip: 'List supports level by level (singletons, then pairs …) and tick the ones ≥ minsup; count ticks at the end.'

  - id: brute-force
    title: Brute force
    skills: [brute-force]
    summary: |
      The simplest method: evaluate the support of every non-empty itemset. With n items there are 2ⁿ − 1 of them,
      which explodes quickly (slide 41: simple but computationally expensive).
    keyFormula: '\#\text{candidates} = 2^n - 1'
    data: [grocery5]
    state: { n: 6 }
    derive:
      - { fn: explosion, in: { n: '@n' }, out: ex }
    live:
      - id: table
        widget: TransactionTable
        props:
          transactions: '@grocery5'
          title: Lecture grocery database
    steps:
      - tex: |
          \anchor{size}{k = 1, \dots, n}: \quad \anchor{loop}{X \in \tbinom{I}{k}} \;\Rightarrow\; \anchor{count}{\text{Sup}(X)} \;\Rightarrow\; \anchor{test}{\ge \text{minsup}?} \;\Rightarrow\; \anchor{keep}{\text{store } X}
        say: Every subset of the item set I is a candidate, from single items up to all items at once.
      - tex: |
          \#\text{candidates} = \sum_{k=1}^{n} \tbinom{n}{k} = 2^{\anchor{n}{n}} - 1
        say: Each item is either in or out of X (2ⁿ choices); drop the empty set.
      - tex: |
          \anchor{n}{n = {=n}} \;\Rightarrow\; 2^{ {=n} } - 1 = {=ex.count} \text{ counts before } \anchor{ret}{\text{returning}}
        say: The lecture's 6 items already give 63 itemsets. Step through all 63 counts; 38 of them come back 0.
    code:
      lang: python
      source: |
        from itertools import combinations

        def brute_force(transactions, minsup):
            """Brute force: count the support of every non-empty itemset.

            Tries all 2^n − 1 combinations of the n distinct items, smallest
            first, and stores each one whose support reaches minsup.

            Returns:
                dict: {itemset tuple: absolute support} for every frequent itemset.
                Lecture (minsup 2): 63 itemsets counted, 11 frequent.
            """
            items = sorted({i for T in transactions for i in T})   # @a:n
            frequent = {}
            for k in range(1, len(items) + 1):                     # @a:size
                for X in combinations(items, k):                   # @a:loop
                    sup = abs_support(X, transactions)             # @a:count
                    if sup >= minsup:                              # @a:test
                        frequent[X] = sup                          # @a:keep
            return frequent                                        # @a:ret
    links:
      - { anchor: n, label: 'n = number of distinct items' }
      - { anchor: size, label: 'itemset size k' }
      - { anchor: loop, label: 'every itemset of size k' }
      - { anchor: count, label: 'count its support' }
      - { anchor: test, label: '≥ minsup?' }
      - { anchor: keep, label: 'store it' }
      - { anchor: ret, label: 'all frequent itemsets' }
    trace: { fn: bruteForceCode, in: { transactions: '@grocery5', minsup: 2 } }
    examples: [brute-lattice-size, brute-support-four]
    pitfalls:
      - 2ⁿ includes the empty set; brute force checks 2ⁿ − 1.
    examTip: Quote the count 2ⁿ − 1 when asked why brute force does not scale.

  - id: apriori
    title: Apriori (as taught)
    skills: [apriori]
    summary: |
      Evaluate only supersets of frequent itemsets. Start with single items; at each level extend every frequent
      itemset by one frequent item that comes later in the order, and count only those candidates.
    keyFormula: 'C_{k+1} = \{X \cup \{i\} : X \in L_k,\ i \in L_1,\ i \text{ after } \max X\}'
    data: [grocery5]
    state: { minsup: 2 }
    derive:
      - { fn: aprioriRun, in: { transactions: '@grocery5', minsup: '@minsup' }, out: ap }
    live:
      - id: minsup-slider
        widget: Slider
        region: top
        props: { label: 'minsup (absolute count)', min: 1, max: 5, step: 1 }
        bind: { value: minsup }
      - id: table
        widget: TransactionTable
        props:
          transactions: '@grocery5'
          title: Lecture grocery database
    steps:
      - tex: |
          \text{Sup}(X) < \text{minsup} \;\Rightarrow\; \text{Sup}(Y) < \text{minsup} \quad \forall\, Y \supseteq X
        say: The Apriori principle. Once an itemset is infrequent, none of its supersets can be frequent.
      - tex: |
          C_1 = \anchor{level}{\{\{i\} : i \in I\}}, \qquad \anchor{while}{\text{repeat while } C_k \neq \emptyset}
        say: Level 1 counts every single item; the loop runs as long as there are candidates.
      - tex: |
          L_k = \anchor{keep}{\{\, \anchor{loop}{X \in C_k} : \anchor{count}{\text{Sup}(X)} \anchor{test}{\ge \text{minsup}} \,\}}
        say: Count every candidate once and keep the ones that reach minsup.
      - tex: |
          C_{k+1} = \anchor{extend}{\{\, X \cup \{i\} : X \in L_k,\ i \in \anchor{items1}{L_1},\ i \text{ after } \max(X) \,\}}
        say: Extend each frequent itemset by a later frequent item (order bread, butter, milk, eggs, yogurt, cheese on slide 19).
      - tex: |
          |C_2| = {=ap.level2}, \qquad \text{counted } {=ap.evaluated} \text{ candidates instead of } {=ap.bruteForce} \;\Rightarrow\; \anchor{ret}{ {=ap.count} \text{ frequent}}
        say: 'Same {=ap.count} frequent itemsets as brute force, with {=ap.saved} fewer support counts.'
    code:
      lang: python
      source: |
        ORDER = ["bread", "butter", "milk", "eggs", "yogurt", "cheese"]  # slide 19

        def apriori(transactions, minsup, order=ORDER):
            """Apriori as taught on slide 19: grow only from frequent itemsets.

            Level 1 is every single item. Each later level extends every frequent
            itemset by one frequent single item (items1) that comes later in
            `order`, so supersets of infrequent itemsets are never counted.

            Args:
                transactions: the database.
                minsup: absolute support threshold.
                order: the item order used to extend itemsets (slide 19's listing).

            Returns:
                dict: {itemset tuple: absolute support} for every frequent itemset.
            """
            candidates = [(i,) for i in order]                 # @a:level
            frequent, items1 = {}, None
            while candidates:                                  # @a:while
                level = []
                for X in candidates:                           # @a:loop
                    sup = abs_support(X, transactions)         # @a:count
                    if sup >= minsup:                          # @a:test
                        frequent[X] = sup                      # @a:keep
                        level.append(X)                        # @a:keep
                if items1 is None:
                    items1 = [X[0] for X in level]             # @a:items1
                # @a extend
                candidates = [X + (i,) for X in level
                              for i in items1 if order.index(i) > order.index(X[-1])]
                # @end
            return frequent                                    # @a:ret
    extraCode:
      - lang: python
        title: Classic join + prune (beyond the slides)
        source: |
          from itertools import combinations

          def apriori_classic(transactions, minsup):
              """Classic Apriori (beyond the slides): join, then prune, then count.

              Joins frequent (k−1)-itemsets that share their first k−2 items, drops
              any candidate with an infrequent (k−1)-subset, and only then counts
              support.

              Returns:
                  dict: {itemset tuple: absolute support} for every frequent itemset.
              """
              items = sorted({i for T in transactions for i in T})
              L = [(i,) for i in items if abs_support((i,), transactions) >= minsup]
              frequent, k = {X: abs_support(X, transactions) for X in L}, 2
              while L:
                  prev = set(L)
                  C = {tuple(sorted(set(a) | set(b))) for a in L for b in L
                       if a[:-1] == b[:-1] and a[-1] < b[-1]}          # join
                  C = [c for c in C
                       if all(s in prev for s in combinations(c, k - 1))]  # prune
                  L = [c for c in C if abs_support(c, transactions) >= minsup]
                  frequent.update({c: abs_support(c, transactions) for c in L})
                  k += 1
              return frequent
    links:
      - { anchor: level, label: 'C₁: every single item' }
      - { anchor: while, label: 'loop while candidates remain' }
      - { anchor: loop, label: 'each candidate X' }
      - { anchor: count, label: count support }
      - { anchor: test, label: '≥ minsup?' }
      - { anchor: keep, label: 'keep if ≥ minsup' }
      - { anchor: items1, label: 'L₁: the frequent single items' }
      - { anchor: extend, label: 'extend frequent itemsets only' }
      - { anchor: ret, label: 'all frequent itemsets' }
    trace: { fn: aprioriCode, in: { transactions: '@grocery5', minsup: '@minsup' } }
    examples: [apriori-level-two]
    pitfalls:
      - Only frequent itemsets are extended; butter (support 1) never appears in a 2-item candidate.
      - The lecture's version still counts {bread, milk, eggs} even though {bread, eggs} is infrequent. The classic prune (extra code tab) would skip it.
    examTip: 'Write the candidates level by level in the slide-19 order, strike the infrequent ones, and extend only what survives.'

  - id: fp-growth
    title: FP-growth (projected databases)
    skills: [fp-growth]
    summary: |
      Successively filter the database: pick a prefix, keep only rows that contain it, drop the items that come
      at or before it in alphabetical order, and repeat inside that smaller database while the prefix stays frequent.
    keyFormula: 'D_{P \cup \{i\}} = \{\, T \setminus \{x \le i\} : T \in D_P,\ i \in T \,\}'
    data: [grocery5]
    state: { minsup: 2 }
    derive:
      - { fn: fpGrowthRun, in: { transactions: '@grocery5', minsup: '@minsup' }, out: fp }
    live:
      - id: minsup-slider
        widget: Slider
        region: top
        props: { label: 'minsup (absolute count)', min: 1, max: 5, step: 1 }
        bind: { value: minsup }
      - id: table
        widget: TransactionTable
        props:
          transactions: '@grocery5'
          title: Lecture grocery database
    steps:
      - tex: |
          \anchor{items}{I(D_P)} = \text{items present in } D_P, \qquad \anchor{loop}{\text{for each } i \in I(D_P)}
        say: Start from the whole database (P = ∅) and try every item that still appears in it, alphabetically.
      - tex: |
          D_{\anchor{prefix}{P \cup \{i\}}} = \anchor{filter}{\{\, T \setminus \{x \le i\} : T \in D_P,\ i \in T \,\}}
        say: Filter to the rows containing the new item, then keep only items after it (so each itemset is found once).
      - tex: |
          \text{Sup}(P \cup \{i\}) = |D_{P \cup \{i\}}|, \qquad \anchor{test}{|D_{P \cup \{i\}}| \ge \text{minsup}} \Rightarrow \anchor{keep}{\text{record it}},\ \anchor{recurse}{\text{mine } D_{P \cup \{i\}}}
        say: The support of the grown prefix is simply the number of rows left. Infrequent prefixes stop the recursion (Apriori principle again).
      - tex: |
          {=fp.explored} \text{ prefixes explored} \;\Rightarrow\; \anchor{ret}{ {=fp.count} \text{ frequent itemsets}}
        say: The lecture walks all 18 prefixes on slides 22–39 and ends with the same 11 itemsets (slide 40). Step through the recursion call by call.
    code:
      lang: python
      source: |
        ORDER = ["bread", "butter", "cheese", "eggs", "milk", "yogurt"]  # alphabetical

        def fp_growth(rows, minsup, prefix=(), out=None):
            """FP-growth by projected databases (recursive, no candidate generation).

            For each item i, keep the rows that contain i, cut them to the items
            after i, and recurse on that smaller database with prefix + (i,).

            Args:
                rows: the (projected) database, each row sorted by ORDER.
                minsup: absolute support threshold.
                prefix: the itemset this call is extending; () at the top.
                out: the dict being filled; created on the first call.

            Returns:
                dict: {itemset tuple: absolute support}. Lecture (minsup 2): 11 itemsets.
            """
            out = {} if out is None else out
            items = sorted({i for T in rows for i in T}, key=ORDER.index)   # @a:items
            for i in items:                                                 # @a:loop
                # @a filter
                proj = [[x for x in T if ORDER.index(x) > ORDER.index(i)]
                        for T in rows if i in T]
                # @end
                P = prefix + (i,)                                           # @a:prefix
                if len(proj) >= minsup:                                     # @a:test
                    out[P] = len(proj)                                      # @a:keep
                    fp_growth(proj, minsup, P, out)                         # @a:recurse
            return out                                                      # @a:ret
    links:
      - { anchor: items, label: 'items left in this database' }
      - { anchor: loop, label: 'try each item i' }
      - { anchor: filter, label: 'filter rows, drop earlier items' }
      - { anchor: prefix, label: 'the grown prefix P ∪ {i}' }
      - { anchor: test, label: 'row count ≥ minsup?' }
      - { anchor: keep, label: 'record its support' }
      - { anchor: recurse, label: 'recurse while frequent' }
      - { anchor: ret, label: 'back to the caller' }
    trace: { fn: fpGrowthCode, in: { transactions: '@grocery5', minsup: '@minsup' } }
    examples: [fp-growth-run]
    pitfalls:
      - Drop items that come **before or equal to** the prefix's last item; otherwise itemsets get counted twice.
      - An empty projected row still counts toward the prefix's support.
    examTip: Keep the alphabetical order fixed; draw each projected table and write its row count as the prefix support.
    errata:
      - 'Slide 25 shows the {bread, eggs}-projected database as transaction **1** with {milk}; it should be transaction **3**. T1 has no eggs. The support (1) is unaffected.'

  - id: confidence
    title: Confidence
    skills: [confidence, rules]
    summary: |
      Of the baskets that contain the antecedent, the fraction that also contain the consequent: a conditional probability.
    keyFormula: '\text{Conf}(A \rightarrow B) = P(B \mid A) = \frac{\text{Sup}(A \cup B)}{\text{Sup}(A)}'
    data: [grocery5]
    state: { A: [bread], B: [butter] }
    derive:
      - { fn: confidence, in: { transactions: '@grocery5', A: '@A', B: '@B' }, out: c }
    live:
      - id: table
        widget: TransactionTable
        props:
          transactions: '@grocery5'
          title: Lecture grocery database
          highlight: '@A'
          showContainCount: true
    steps:
      - tex: |
          \text{Conf}(A \rightarrow B) = P(B \mid A)
        say: Among baskets with A, how often is B there too?
      - tex: |
          = \frac{\anchor{sup-ab}{\text{Sup}(A \cup B)}}{\anchor{sup-a}{\text{Sup}(A)}}
        say: Count baskets with both, divide by baskets with the antecedent.
      - tex: |
          \anchor{init}{\text{both counts} = 0}; \ \anchor{loop}{\forall T}: \ \anchor{has-a}{A \subseteq T} \Rightarrow \anchor{sup-a}{\text{Sup}(A) + 1}, \text{ then } \anchor{has-b}{B \subseteq T} \Rightarrow \anchor{sup-ab}{\text{Sup}(A \cup B) + 1}
        say: Both counts in one pass. A basket without A is skipped entirely; it says nothing about the rule.
      - tex: |
          \text{Conf}({=A|set} \rightarrow {=B|set}) = \frac{\anchor{sup-ab}{ {=c.supAB} }}{\anchor{sup-a}{ {=c.supA} }} = \anchor{ratio}{ {=c.conf|2} }
        say: 'Lecture example (slide 43). |D| cancels, so counts work as well as fractions.'
    code:
      lang: python
      source: |
        def confidence(A, B, transactions):
            """Confidence of the rule A → B: of the baskets with A, the share that also have B.

            Args:
                A: antecedent itemset.
                B: consequent itemset.
                transactions: the database.

            Returns:
                float: Sup(A ∪ B) / Sup(A).
                Lecture: confidence({"bread"}, {"butter"}, D) == 1 / 2 == 0.5.
            """
            sup_a = sup_ab = 0                 # @a:init
            for T in transactions:             # @a:loop
                if set(A) <= set(T):           # @a:has-a
                    sup_a += 1                 # @a:sup-a
                    if set(B) <= set(T):       # @a:has-b
                        sup_ab += 1            # @a:sup-ab
            return sup_ab / sup_a              # @a:ratio
    links:
      - { anchor: init, label: 'both counters = 0' }
      - { anchor: loop, label: 'each basket' }
      - { anchor: has-a, label: 'A ⊆ T?' }
      - { anchor: sup-a, label: 'Sup(A)' }
      - { anchor: has-b, label: 'B ⊆ T too?' }
      - { anchor: sup-ab, label: 'Sup(A ∪ B)', say: Baskets holding every item of A and of B. }
      - { anchor: ratio, label: the ratio }
    trace: { fn: confidenceCode, in: { transactions: '@grocery5', A: '@A', B: '@B' } }
    examples: [conf-bread-butter, conf-yogurt-milk, conf-milk-yogurt, conf-eggs-milk-yogurt, conf-milk-eggs-yogurt]
    pitfalls:
      - Divide by the support of the **antecedent**, not by the number of transactions.
      - Conf(A → B) ≠ Conf(B → A); the denominator changes.
    examTip: |
      Use absolute counts: $|D|$ cancels, so the ratio of counts equals the ratio of relative supports.

  - id: rule-generation
    title: Generating rules from frequent itemsets
    skills: [rules, confidence]
    summary: |
      Two phases (slide 44): find all frequent itemsets, then split each one of size ≥ 2 into every antecedent/consequent
      pair and keep the rules whose confidence reaches minconf.
    keyFormula: 'A \rightarrow I \setminus A \text{ kept if } \frac{\text{Sup}(I)}{\text{Sup}(A)} \ge \text{minconf}'
    data: [grocery5]
    state: { minconf: 0.6, I: [eggs, milk, yogurt] }
    derive:
      - { fn: rules, in: { transactions: '@grocery5', minsup: 2, minconf: '@minconf' }, out: r }
      - { fn: rulesFromItemset, in: { transactions: '@grocery5', itemset: '@I', minconf: '@minconf' }, out: one }
    live:
      - id: minconf-slider
        widget: Slider
        region: top
        props: { label: minconf, min: 0, max: 1, step: 0.05 }
        bind: { value: minconf }
      - id: table
        widget: TransactionTable
        props:
          transactions: '@grocery5'
          title: Lecture grocery database
    steps:
      - tex: |
          \anchor{init}{R = \emptyset}; \quad \anchor{itemset}{\text{for each frequent } I}, \quad \anchor{skip}{|I| < 2 \Rightarrow \text{skip}}
        say: Single items can't be split into two non-empty sides.
      - tex: |
          \anchor{size}{k = |I|-1, \dots, 1}: \quad \anchor{split}{A \in \tbinom{I}{k},\ B = I \setminus A}
        say: 'An itemset of size k gives 2^k − 2 candidate rules; bigger antecedents first, as on slide 51.'
      - tex: |
          \anchor{conf}{\frac{\text{Sup}(I)}{\text{Sup}(A)}} \anchor{test}{\ge \text{minconf}} \;\Rightarrow\; \anchor{keep}{R \leftarrow R \cup \{A \rightarrow B\}}; \qquad \anchor{ret}{\text{return } R}
        say: The numerator is the same for every split of I; only the antecedent's support changes.
      - tex: |
          {=r.count} \text{ rules pass at minsup } 2, \ \text{minconf } {=minconf} \quad (\text{from } {=r.considered} \text{ candidates})
        say: 'The lecture gets 13 rules (slide 60). {=I|set} alone yields {=one.count} of its {=one.candidates} splits. Step through all 11 frequent itemsets of slide 45.'
    code:
      lang: python
      source: |
        from itertools import combinations

        def rules(frequent, minconf):
            """Generate every association rule A → I − A that meets minconf.

            Splits each frequent itemset I into antecedent A and consequent
            I − A, bigger antecedents first. Every support it needs is already
            in `frequent` (each subset of a frequent itemset is frequent).

            Args:
                frequent: {frozenset(itemset): absolute support}.
                minconf: confidence threshold between 0 and 1.

            Returns:
                list of (A, B, conf) tuples. Lecture: 16 rules tried, 13 kept.
            """
            out = []                                       # @a:init
            for I, sup_I in frequent.items():              # @a:itemset
                if len(I) < 2:                             # @a:skip
                    continue                               # @a:skip
                for k in range(len(I) - 1, 0, -1):         # @a:size
                    for A in combinations(sorted(I), k):   # @a:split
                        A = frozenset(A)
                        conf = sup_I / frequent[A]         # @a:conf
                        if conf >= minconf:                # @a:test
                            out.append((A, I - A, conf))   # @a:keep
            return out                                     # @a:ret
    links:
      - { anchor: init, label: 'no rules yet' }
      - { anchor: itemset, label: 'a frequent itemset I' }
      - { anchor: skip, label: 'skip single items' }
      - { anchor: size, label: 'antecedent size k' }
      - { anchor: split, label: 'every non-empty proper subset as A' }
      - { anchor: conf, label: 'Sup(I) / Sup(A)' }
      - { anchor: test, label: '≥ minconf?' }
      - { anchor: keep, label: 'keep the rule' }
      - { anchor: ret, label: 'all kept rules' }
    trace:
      fn: rulesCode
      in:
        transactions: '@grocery5'
        minconf: '@minconf'
        itemsets: [[milk], [yogurt, milk], [eggs, milk], [eggs], [yogurt], [eggs, yogurt, milk], [eggs, yogurt], [bread, milk], [cheese, milk], [bread], [cheese]]
    examples: [rules-13, conf-milk-eggs-yogurt]
    pitfalls:
      - Every antecedent is a subset of a frequent itemset, so its support is already known; no new counting is needed.
      - Don't forget multi-item antecedents such as {eggs, yogurt} → {milk}.
    examTip: For each frequent itemset, list its 2^k − 2 splits in a column, write Sup(I)/Sup(A) next to each, and cross out the ones below minconf.

  - id: lift
    title: Lift
    skills: [lift, interpretation]
    summary: |
      Confidence alone can mislead when the consequent is popular. Lift divides confidence by how common the
      consequent already is: above 1 means A makes B more likely.
    keyFormula: '\text{Lift}(A \rightarrow B) = \frac{\text{Conf}(A \rightarrow B)}{\text{RelSup}(B)}'
    data: [grocery5]
    state: { A: [bread], B: [butter] }
    derive:
      - { fn: lift, in: { transactions: '@grocery5', A: '@A', B: '@B' }, out: l }
    live:
      - id: table
        widget: TransactionTable
        props:
          transactions: '@grocery5'
          title: Lecture grocery database
          highlight: '@A'
          showContainCount: true
    steps:
      - tex: |
          \text{Lift}(A \rightarrow B) = \frac{\anchor{conf}{\text{Conf}(A \rightarrow B)}}{\anchor{relb}{\text{RelSup}(B)}} = \frac{P(B \mid A)}{P(B)}
        say: How much more likely B is when A is present, compared with B's usual rate.
      - tex: |
          = \frac{\anchor{sup-ab}{\text{Sup}(A \cup B)} \,/\, \anchor{sup-a}{\text{Sup}(A)}}{\anchor{sup-b}{\text{Sup}(B)} \,/\, \anchor{n}{|D|}}
        say: Four counts are all you need.
      - tex: |
          \anchor{lift}{\text{Lift}} > 1: \text{positive}, \quad = 1: \text{no association}, \quad < 1: \text{negative}
        say: The interpretation from slide 61.
      - tex: |
          \text{Lift}({=A|set} \rightarrow {=B|set}) = \frac{\anchor{conf}{ {=l.supAB}/{=l.supA} }}{\anchor{relb}{ {=l.supB}/{=l.n} }} = \frac{ {=l.conf|2} }{ {=l.relB|2} } = \anchor{lift}{ {=l.lift|2} }
        say: 'Lecture examples: bread → butter gives 2.5 (slide 61); try B = eggs for 0.83 (slide 62) or B = milk for exactly 1.'
    code:
      lang: python
      source: |
        def lift(A, B, transactions):
            """Lift of A → B: confidence divided by B's overall frequency.

            Args:
                A, B: itemsets (sets, so A | B is their union).
                transactions: the database.

            Returns:
                float: conf(A → B) / RelSup(B). Above 1 = positive association,
                1 = independent, below 1 = negative.
                Lecture: lift({"bread"}, {"butter"}, D) == 0.5 / 0.2 == 2.5.
            """
            n = len(transactions)                        # @a:n
            sup_a = abs_support(A, transactions)         # @a:sup-a
            sup_ab = abs_support(A | B, transactions)    # @a:sup-ab
            conf = sup_ab / sup_a                        # @a:conf
            sup_b = abs_support(B, transactions)         # @a:sup-b
            rel_b = sup_b / n                            # @a:relb
            return conf / rel_b                          # @a:lift
    links:
      - { anchor: n, label: '|D|' }
      - { anchor: sup-a, label: 'Sup(A)' }
      - { anchor: sup-ab, label: 'Sup(A ∪ B)' }
      - { anchor: conf, label: 'Conf(A → B)' }
      - { anchor: sup-b, label: 'Sup(B)' }
      - { anchor: relb, label: 'RelSup(B): the base rate of B' }
      - { anchor: lift, label: 'the ratio vs 1' }
    trace: { fn: liftCode, in: { transactions: '@grocery5', A: '@A', B: '@B' } }
    examples: [lift-bread-butter, lift-bread-eggs, lift-milk-trap]
    pitfalls:
      - Divide by the relative support of the **consequent** B, not of A.
      - A rule into an item that is in every basket has confidence 1 but lift 1. It tells you nothing.
    examTip: 'Lift is symmetric: Lift(A → B) = Lift(B → A) = Sup(A∪B)·|D| / (Sup(A)·Sup(B)).'
    errata:
      - 'Slide 62''s lift legend is garbled ("Lift = 1: more likely …"). Use slide 61: **> 1** positive association, **= 1** no association, **< 1** negative association.'

  - id: leverage-conviction
    title: Leverage and conviction
    skills: [interpretation]
    summary: |
      Two more metrics that libraries such as mlxtend report. Leverage is an additive version of lift;
      conviction measures how often the rule would fail if A and B were independent.
    keyFormula: '\text{Lev} = \text{RelSup}(A \cup B) - \text{RelSup}(A)\text{RelSup}(B), \quad \text{Conv} = \frac{1 - \text{RelSup}(B)}{1 - \text{Conf}}'
    beyondSlides: true
    data: [grocery5]
    state: { A: [bread], B: [butter] }
    derive:
      - { fn: ruleMetrics, in: { transactions: '@grocery5', A: '@A', B: '@B' }, out: m }
    live:
      - id: table
        widget: TransactionTable
        props:
          transactions: '@grocery5'
          title: Lecture grocery database
          highlight: '@A'
          showContainCount: true
    steps:
      - tex: |
          \anchor{rels}{s(X) = \text{RelSup}(X)}, \qquad \anchor{lev}{\text{Leverage}} = s(A \cup B) - s(A)\,s(B)
        say: Observed co-occurrence minus what independence predicts. 0 means independent.
      - tex: |
          \anchor{conv}{\text{Conviction}} = \frac{1 - s(B)}{1 - \text{Conf}(A \rightarrow B)}
        say: Expected failures over observed failures; infinite when the rule never fails.
      - tex: |
          \text{Lev}({=A|set} \rightarrow {=B|set}) = \anchor{lev}{ {=m.leverage|3} }, \quad \text{Conv} = \anchor{conv}{ {=m.conviction|2} }
        say: 'Lift for comparison: {=m.lift|2}.'
    code:
      lang: python
      source: |
        def leverage_conviction(A, B, transactions):
            """Leverage and conviction of A → B, from relative supports.

            Returns:
                (lev, conv):
                lev = s(A ∪ B) − s(A)·s(B), how far the pair beats independence;
                conv = (1 − s(B)) / (1 − conf), how often the rule would fail by
                chance compared with how often it does fail (inf when conf = 1).
            """
            n = len(transactions)
            s = lambda X: abs_support(X, transactions) / n            # @a:rels
            lev = s(A | B) - s(A) * s(B)                               # @a:lev
            c, rel_b = s(A | B) / s(A), s(B)
            conv = float("inf") if c == 1 else (1 - rel_b) / (1 - c)   # @a:conv
            return lev, conv
    links:
      - { anchor: rels, label: 'relative supports' }
      - { anchor: lev, label: leverage }
      - { anchor: conv, label: conviction }
    trace: { fn: leverageCode, in: { transactions: '@grocery5', A: '@A', B: '@B' } }
    pitfalls:
      - These are not on the slides; the exam will ask for support, confidence and lift.
    examTip: If an exam asks which rule is interesting, lift is the lecture's answer; leverage and conviction are for real projects.
