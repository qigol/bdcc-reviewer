  - id: code-support
    type: code-fill
    skills: [support]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: support }
    prompt: Complete the support functions.
    code: |
      def abs_support(X, transactions):
          count = 0
          for T in transactions:
              if set(X) __BLANK_1__ set(T):
                  count += 1
          return count

      def rel_support(X, transactions):
          return abs_support(X, transactions) / __BLANK_2__
    blanks:
      '1': { accept: ['<='], hint: subset operator }
      '2': { accept: ['len(transactions)'], hint: '|D|' }
    explanation: A transaction supports X when X ⊆ T (`<=` on sets); relative support divides by the number of transactions.

  - id: code-confidence
    type: code-fill
    skills: [confidence]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: confidence }
    prompt: Complete the confidence function.
    code: |
      def confidence(A, B, transactions):
          sup_ab = abs_support(A | B, transactions)
          sup_a = abs_support(__BLANK_1__, transactions)
          return sup_ab / __BLANK_2__
    blanks:
      '1': { accept: ['A'] }
      '2': { accept: ['sup_a'] }
    hints:
      - Confidence divides by the support of the "if" side.
    explanation: Confidence divides the joint count by the **antecedent's** count.

  - id: code-lift
    type: code-fill
    skills: [lift]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: lift }
    prompt: Complete the lift function.
    code: |
      def lift(A, B, transactions):
          conf = confidence(A, B, transactions)
          rel_b = abs_support(__BLANK_1__, transactions) / len(transactions)
          return __BLANK_2__
    blanks:
      '1': { accept: ['B'] }
      '2': { accept: ['conf / rel_b', 'conf/rel_b'] }
    hints:
      - Lift compares the confidence with how common the consequent is overall.
    explanation: Lift divides the confidence by the relative support of the **consequent**.

