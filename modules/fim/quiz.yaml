templates:
  - id: support-abs
    type: numeric
    skills: [support]
    difficulty: 1
    tags: [math]
    generator: supportQ
    lessonRef: { tab: math-code, id: support }
    prompt: |
      Using the transactions below, what is the **absolute support** of {=X|set}?
    show:
      - { id: t, widget: TransactionTable, props: { transactions: '@transactions' } }
    answer: { var: abs, tol: 0 }
    hints:
      - A basket counts only if it holds **every** item of the itemset.
      - Write 1 or 0 next to each basket, then add them up.
    explanation: |
      Count the baskets that contain **every** item of {=X|set}: $\text{AbsSup} = {=abs}$ of the ${=n}$ transactions.

  - id: support-abs-triple
    type: numeric
    skills: [support]
    difficulty: 3
    tags: [math]
    generator: supportQ
    lessonRef: { tab: math-code, id: support }
    prompt: |
      Seven baskets below. What is $\text{AbsSup}({=X|set})$?
    show:
      - { id: t, widget: TransactionTable, props: { transactions: '@transactions' } }
    answer: { var: abs, tol: 0 }
    hints:
      - All three items must be in the same basket.
      - Go basket by basket and tick only the ones that hold all three.
    explanation: |
      A basket counts only if all three items are present. {=abs} baskets qualify. ({=anyCount} contain at least one of them, which is a different question.)

  - id: support-rel
    type: numeric
    skills: [support]
    difficulty: 1
    tags: [math]
    generator: supportRelQ
    lessonRef: { tab: math-code, id: support }
    prompt: |
      What is the **relative support** of {=X|set}? (A decimal or a fraction is fine.)
    show:
      - { id: t, widget: TransactionTable, props: { transactions: '@transactions' } }
    answer: { var: rel, tol: 0.01 }
    hints:
      - First count the baskets that hold every item (the absolute support).
      - Divide by |D|, the number of baskets, not the number of items.
    explanation: |
      $\text{RelSup} = \dfrac{\text{AbsSup}}{|D|} = \dfrac{ {=abs} }{ {=n} } = {=rel|2}$

  - id: rel-minsup-count
    type: numeric
    skills: [frequent-itemset, support]
    difficulty: 1
    tags: [math]
    generator: relMinsupQ
    lessonRef: { tab: intuition, id: lecture-support-table }
    prompt: |
      A database has **{=n}** baskets and a **relative** minsup of **{=minsup}**. In at least how many baskets must an
      itemset appear to be frequent?
    answer: { var: need, tol: 0 }
    hints:
      - Turn the fraction into a basket count by multiplying by |D|.
      - Baskets come in whole numbers, and the count must reach the bar.
    explanation: |
      $\text{minsup} \times |D| = {=minsup} \times {=n} = {=product|2}$. A count must reach it, so round **up**: {=need} baskets.
      ({=wrongFloor} baskets would be a share of only {=wrongFloor}/{=n}, below {=minsup}.)

  - id: rel-minsup-frequent
    type: numeric
    skills: [frequent-itemset]
    difficulty: 2
    tags: [math]
    generator: relMinsupQ
    lessonRef: { tab: intuition, id: lecture-support-table }
    prompt: |
      Relative **minsup = {=minsup}** on these {=n} baskets. How many itemsets (of any size) are frequent?
    show:
      - { id: t, widget: TransactionTable, props: { transactions: '@transactions' } }
    answer: { var: count, tol: 0 }
    hints:
      - First turn {=minsup} into a whole number of baskets (round up).
      - Then count supports level by level; only extend itemsets that pass.
    explanation: |
      ${=minsup} \times {=n} = {=product|2}$, so an itemset needs at least {=need} baskets. Per level: {=byLevel|list}.
      Frequent: {=list}, {=count} in total.

  - id: count-frequent
    type: numeric
    skills: [frequent-itemset]
    difficulty: 2
    tags: [math]
    generator: countFrequentQ
    lessonRef: { tab: math-code, id: frequent-itemsets }
    prompt: |
      With **minsup = {=minsup}** (absolute), how many itemsets (of any size) are frequent in this database?
    show:
      - { id: t, widget: TransactionTable, props: { transactions: '@transactions' } }
    answer: { var: count, tol: 0 }
    hints:
      - Work level by level, single items first.
      - Only itemsets made of frequent smaller ones can be frequent.
      - Frequent means support ≥ minsup, not strictly greater.
    explanation: |
      Per level: {=byLevel|list} frequent itemsets of size 1, 2, 3, …, so {=count} in total. They are: {=list}.

  - id: count-frequent-hard
    type: numeric
    skills: [frequent-itemset, apriori]
    difficulty: 3
    tags: [math]
    generator: countFrequentQ
    lessonRef: { tab: intuition, id: apriori-run }
    prompt: |
      Six baskets, minsup = {=minsup}. Use the Apriori principle to avoid counting hopeless candidates. How many frequent itemsets are there in total?
    show:
      - { id: t, widget: TransactionTable, props: { transactions: '@transactions' } }
    answer: { var: count, tol: 0 }
    hints:
      - Find the frequent single items first.
      - Pair only frequent items; then grow only frequent pairs.
      - Count support ≥ minsup at every level and add the levels up.
    explanation: |
      Level counts: {=byLevel|list}. Total {=count}: {=list}. Only extend itemsets that are already frequent.

  - id: brute-count
    type: numeric
    skills: [brute-force]
    difficulty: 1
    tags: [math]
    generator: bruteCountQ
    lessonRef: { tab: intuition, id: combinatorial-explosion }
    prompt: |
      A store sells **{=n}** distinct items. How many itemsets would brute force have to count?
    answer: { var: count, tol: 0 }
    hints:
      - Each item is either in an itemset or out of it.
      - That gives 2ⁿ subsets; one of them is empty.
    explanation: |
      Every non-empty subset is a candidate: $2^{ {=n} } - 1 = {=count}$.

  - id: apriori-candidates
    type: multi
    skills: [apriori]
    difficulty: 2
    tags: [math, intuition]
    generator: aprioriCandidatesQ
    lessonRef: { tab: intuition, id: apriori-principle }
    prompt: |
      minsup = {=minsup}. Item supports: {=counts}. Which of these 2-itemsets would Apriori still **count** at level 2?
    show:
      - { id: t, widget: TransactionTable, props: { transactions: '@transactions' } }
    hints:
      - Which single items fall below minsup?
      - A pair is counted only if both of its items are frequent.
    explanation: |
      Level 2 only extends frequent items. {=infreq|set} is infrequent, so every pair containing it is skipped without counting (Apriori principle).

  - id: apriori-count-hand
    type: hand-calc
    skills: [apriori]
    difficulty: 3
    tags: [math]
    generator: aprioriCountQ
    lessonRef: { tab: intuition, id: apriori-run }
    prompt: |
      Run the **lecture's Apriori** on these baskets with minsup = 2 and the item order {=order}. Level 1 counts every
      item; each later level extends every frequent itemset by one frequent item that comes **later** in the order.
    show:
      - { id: t, widget: TransactionTable, props: { transactions: '@transactions' } }
    steps:
      - prompt: 'Level 2: how many pairs does Apriori count?'
        answer: { var: c2, tol: 0 }
        hint: Count the frequent single items first; pair only those.
      - prompt: 'Level 3: how many 3-item candidates does it count?'
        answer: { var: c3, tol: 0 }
        hint: Extend each frequent pair by every frequent item later in the order.
      - prompt: 'How many support counts does it make in total, over all levels?'
        answer: { var: total, tol: 0 }
        hint: Add level 1, level 2, level 3 and any level 4 candidates.
    hints:
      - Write each level's candidates in the given order, strike the infrequent ones, and extend only the survivors.
    explanation: |
      {=levelText}. Total {=total} counts, against {=bruteForce} for brute force and {=classic} with the classic
      prune, for the same {=count} frequent itemsets.

  - id: apriori-principle
    type: mcq
    skills: [apriori, frequent-itemset]
    difficulty: 1
    tags: [term, intuition]
    lessonRef: { tab: intuition, id: apriori-principle }
    prompt: Which statement is the **Apriori principle**?
    options:
      - If an itemset is infrequent, every superset of it is infrequent
      - If an itemset is frequent, every superset of it is frequent
      - If an itemset is infrequent, every subset of it is infrequent
      - Frequent itemsets always contain the most frequent item
    answer: 0
    optionFeedback:
      3: "Frequent itemsets can leave out the most frequent item entirely. The principle is about supersets of infrequent itemsets."
      '1': 'Backwards: supersets can lose baskets. {milk} is frequent but {milk, butter} is not.'
      '2': 'Subsets of an infrequent itemset can be frequent: {bread, eggs} is infrequent but {bread} is frequent.'
    hints:
      - What happens to an itemset's support when you add an item?
    explanation: Support can only drop as items are added, so an infrequent itemset rules out all its supersets. That's why Apriori extends only frequent itemsets.

  - id: minsup-monotone
    type: mcq
    skills: [frequent-itemset]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: the-bar }
    prompt: You raise minsup from 2 to 3. What happens to the set of frequent itemsets?
    options:
      - It can only shrink or stay the same
      - It can only grow or stay the same
      - It can grow or shrink depending on the data
      - It always loses exactly the itemsets of support 2
    answer: 0
    optionFeedback:
      1: "A higher cutoff can't admit anything new: every support stays the same, and the bar only rises."
      2: "Supports don't change when minsup changes, so a higher bar can only drop itemsets, never add them."
      '3': Close, but it loses every itemset with support exactly 2, and that may be none.
    hints:
      - Does changing minsup change any itemset's support?
    explanation: Each itemset's support is fixed; a higher cutoff keeps a subset of what a lower cutoff kept.
    variants:
      - prompt: You lower minsup from 4 to 2. What happens to the set of frequent itemsets?
        options:
          - It can only grow or stay the same
          - It can only shrink or stay the same
          - It can grow or shrink depending on the data
          - It always gains exactly the itemsets of support 2 and 3
        answer: 0
        optionFeedback:
          1: A lower bar can't drop anything that already passed.
          2: Supports don't change, so a lower bar only adds itemsets.
          3: It gains every itemset with support 2 or 3, which may be none.
        explanation: Each support is fixed; a lower cutoff keeps everything the higher cutoff kept, and possibly more.
      - prompt: An itemset {tea, sugar} has support 5. You raise minsup from 3 to 6. What happens to {tea, sugar, milk}?
        options:
          - It is infrequent, whatever its own count
          - It becomes frequent if milk is common
          - It stays as frequent as before
          - It depends on the order of the items
        answer: 0
        optionFeedback:
          1: Its support can't exceed 5, its subset's support, so it can't reach 6.
          2: It was at most 5 before too, so it couldn't stay frequent at 6.
          3: Item order doesn't affect support.
        explanation: A superset's support is at most its subset's (5), so at minsup 6 it is infrequent.

  - id: apriori-steps
    type: order
    skills: [apriori]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: math-code, id: apriori }
    prompt: Put the lecture's Apriori procedure in order.
    items:
      - Count the support of every single item
      - Keep the items with support ≥ minsup
      - Extend each frequent itemset by one later frequent item to form the next candidates
      - Count the support of those candidates only
      - Keep the frequent ones and repeat until no candidates are left
    explanation: Level by level, only frequent itemsets are extended, so infrequent branches are never counted.

  - id: fp-projected
    type: numeric
    skills: [fp-growth]
    difficulty: 2
    tags: [math]
    generator: projectedQ
    lessonRef: { tab: intuition, id: fp-growth-filter }
    prompt: |
      Items are ordered alphabetically. Build the **{{=a}}-projected database** (rows containing {=a}, keeping only items after it).
      In that projected database, how many rows contain **{=b}**? (That is $\text{Sup}(\{ {=a}, {=b} \})$.)
    show:
      - { id: t, widget: TransactionTable, props: { transactions: '@transactions', itemOrder: [bread, butter, cheese, eggs, milk, yogurt] } }
    answer: { var: supAB, tol: 0 }
    hints:
      - Keep only the rows that contain {=a}; ignore the rest.
      - Inside those rows, count the ones that also hold {=b}.
    explanation: |
      The {=a}-projected database has {=rows} rows. {=supAB} of them still contain {=b}, so $\text{Sup}(\{ {=a}, {=b} \}) = {=supAB}$.

  - id: fp-enum-hand
    type: hand-calc
    skills: [fp-growth]
    difficulty: 3
    tags: [math]
    generator: fpEnumQ
    lessonRef: { tab: intuition, id: fp-growth-filter }
    prompt: |
      Mine these baskets completely with **FP-growth** as taught: alphabetical order, minsup = 2. Filter on each item,
      keep only the items after it, and recurse inside every filtered table that has at least 2 rows.
    show:
      - { id: t, widget: TransactionTable, props: { transactions: '@transactions', itemOrder: [bread, butter, cheese, eggs, milk] } }
    steps:
      - prompt: At the top level FP-growth tries every item in the table. How many of them are frequent?
        answer: { var: topFreq, tol: 0 }
        hint: Count each item's baskets; frequent means 2 or more.
      - prompt: How many prefixes does FP-growth try in total, counting the ones that stop below minsup?
        answer: { var: explored, tol: 0 }
        hint: Draw the tree. Inside each frequent prefix's table, every remaining item is one more prefix to try.
      - prompt: How many frequent itemsets does it find?
        answer: { var: count, tol: 0 }
    hints:
      - Each prefix's support is just the number of rows in its filtered table.
    explanation: |
      Frequent: {=frequentList}. Tried but stopped: {=stopList}. That is {=explored} prefixes and {=count} frequent itemsets.

  - id: fp-steps
    type: order
    skills: [fp-growth]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: fp-growth-filter }
    prompt: Order one round of FP-growth as taught (projected databases).
    items:
      - Fix an item order (alphabetical in the lecture)
      - Pick the next item i in the current database as the new prefix
      - Keep only rows containing i and drop items at or before i
      - Record the number of remaining rows as the prefix's support
      - If the prefix is frequent, repeat inside the smaller database; otherwise stop
    explanation: Each prefix shrinks the database; the row count is the support; infrequent prefixes end the recursion.

  - id: fp-concepts
    type: multi
    skills: [fp-growth]
    difficulty: 2
    tags: [term, intuition]
    lessonRef: { tab: math-code, id: fp-growth }
    prompt: Which statements about FP-growth (as taught in the lecture) are true?
    options:
      - It never generates candidates that don't occur in some row
      - The support of a prefix equals the number of rows in its projected database
      - It must scan the full database once per level, like Apriori
      - Different prefixes can be mined independently, which makes it parallelizable
      - It finds fewer frequent itemsets than Apriori
    answer: [0, 1, 3]
    optionFeedback:
      0: "Yes: FP-growth only extends prefixes that actually occur in the projected rows."
      1: "Yes: each row of a prefix's projected database is a transaction containing that prefix, so the row count is the support."
      2: "That's Apriori's pattern. FP-growth reads the database to build its structure, then works on ever-smaller projections."
      3: "Yes: each prefix's projected database is independent, so branches can run on different workers."
      4: "Both methods find exactly the same frequent itemsets. They differ only in how they search."
    hints:
      - Think about what a prefix's filtered table contains.
    explanation: Projected databases shrink as the prefix grows; their row count is the support; each branch is independent, so it can be split across machines. It finds exactly the same itemsets as Apriori.

  - id: conf-numeric
    type: numeric
    skills: [confidence]
    difficulty: 1
    tags: [math]
    generator: confidenceQ
    lessonRef: { tab: math-code, id: confidence }
    prompt: |
      Using the transactions below, compute $\text{Conf}({=A|set} \rightarrow {=B|set})$.
    show:
      - { id: t, widget: TransactionTable, props: { transactions: '@transactions' } }
    answer: { var: conf, tol: 0.01 }
    hints:
      - Only baskets that hold the antecedent matter.
      - Of those, what share also hold the consequent? Sup(A ∪ B) / Sup(A).
    explanation: |
      $\text{Conf}(A \rightarrow B) = \dfrac{\text{Sup}(A \cup B)}{\text{Sup}(A)} = \dfrac{ {=supAB} }{ {=supA} } = {=conf|2}$

  - id: conf-two-antecedents
    type: numeric
    skills: [confidence, rules]
    difficulty: 3
    tags: [math]
    generator: confidenceQ
    lessonRef: { tab: math-code, id: rule-generation }
    prompt: |
      Compute the confidence of the rule {=A|set} → {=B|set}.
    show:
      - { id: t, widget: TransactionTable, props: { transactions: '@transactions' } }
    answer: { var: conf, tol: 0.01 }
    hints:
      - The antecedent has two items; a basket holds it only if it has both.
      - Divide the baskets holding all three items by the baskets holding the antecedent.
    explanation: |
      Baskets with **both** antecedent items: {=supA}. Of those, {=supAB} also contain {=B|set}. Confidence $= {=supAB}/{=supA} = {=conf|2}$.

  - id: conf-venn
    type: numeric
    skills: [confidence]
    difficulty: 2
    tags: [math, intuition]
    generator: vennConfQ
    lessonRef: { tab: intuition, id: itemsets-to-rules }
    prompt: |
      Out of {=N} receipts, {=nA} contain A, {=nB} contain B and {=nAB} contain both. What is conf(A → B)?
    show:
      - { id: v, widget: Venn, props: { labels: [A, B], nA: '@nA', nB: '@nB', nAB: '@nAB', N: '@N' } }
    answer: { var: conf, tol: 0.01 }
    hints:
      - Confidence looks only inside circle A.
      - Divide the overlap by the size of circle A.
    explanation: |
      Condition on A: $\dfrac{n_{AB}}{n_A} = \dfrac{ {=nAB} }{ {=nA} } = {=conf|2}$. (Lift would be ${=conf|2} / ({=nB}/{=N}) = {=lift|2}$.)

  - id: conf-meaning
    type: mcq
    skills: [confidence]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: math-code, id: confidence }
    prompt: 'Conf(A → B) = 0.8 means:'
    options:
      - 80% of the transactions that contain A also contain B
      - 80% of all transactions contain both A and B
      - 80% of the transactions that contain B also contain A
      - B is 0.8 times as likely as usual when A is present
    answer: 0
    optionFeedback:
      '1': That describes the relative support of A ∪ B.
      '2': That is Conf(B → A).
      '3': That is how lift would be phrased.
    explanation: Confidence is the conditional probability P(B | A) = Sup(A ∪ B) / Sup(A).

  - id: rules-pass
    type: multi
    skills: [rules, confidence]
    difficulty: 2
    tags: [math]
    generator: rulesPassQ
    lessonRef: { tab: math-code, id: rule-generation }
    prompt: |
      {=itemset|set} is frequent (support {=supI}). Which rules generated from it pass **minconf = {=minconf}**?
    show:
      - { id: t, widget: TransactionTable, props: { transactions: '@transactions' } }
    hints:
      - Every rule from this itemset has the same numerator, {=supI}.
      - Divide by the support of each rule's antecedent and compare with {=minconf}.
    explanation: |
      Each split has confidence Sup(I) / Sup(A): {=detail}.

  - id: rule-count
    type: numeric
    skills: [rules]
    difficulty: 1
    tags: [math]
    generator: ruleCountQ
    lessonRef: { tab: math-code, id: rule-generation }
    prompt: |
      How many candidate rules A → B (both sides non-empty) can be generated from one frequent **{=k}-itemset**?
    answer: { var: count, tol: 0 }
    hints:
      - The antecedent can be any part of the itemset, and the consequent is the rest.
      - Both sides must be non-empty, so the antecedent can't be empty or the whole itemset.
    explanation: |
      Every non-empty **proper** subset can be the antecedent: $2^{ {=k} } - 2 = {=count}$.

  - id: lift-numeric
    type: numeric
    skills: [lift]
    difficulty: 2
    tags: [math]
    generator: liftQ
    lessonRef: { tab: math-code, id: lift }
    prompt: |
      Compute $\text{Lift}({=A|set} \rightarrow {=B|set})$.
    show:
      - { id: t, widget: TransactionTable, props: { transactions: '@transactions' } }
    answer: { var: lift, tol: 0.02 }
    hints:
      - First the confidence, Sup(A ∪ B) / Sup(A).
      - Then divide by the consequent's base rate, Sup(B) / |D|.
    explanation: |
      $\text{Conf} = {=supAB}/{=supA} = {=conf|2}$, $\text{RelSup}(B) = {=supB}/{=n} = {=relB|2}$, so $\text{Lift} = {=conf|2}/{=relB|2} = {=lift|2}$ ({=verdict} association).

  - id: lift-symmetry
    type: numeric
    skills: [lift]
    difficulty: 2
    tags: [math]
    generator: liftSymQ
    lessonRef: { tab: math-code, id: lift }
    prompt: |
      On these baskets, $\text{Lift}({=A|set} \rightarrow {=B|set}) = {=lift|2}$. What is $\text{Lift}({=B|set} \rightarrow {=A|set})$?
    show:
      - { id: t, widget: TransactionTable, props: { transactions: '@transactions' } }
    answer: { var: lift, tol: 0.02 }
    hints:
      - Write lift with counts only, Sup(A ∪ B)·|D| / (Sup(A)·Sup(B)).
      - What changes in that formula when A and B swap places?
    explanation: |
      $\text{Lift} = \dfrac{\text{Sup}(A \cup B)\,|D|}{\text{Sup}(A)\,\text{Sup}(B)} = \dfrac{ {=supAB} \cdot {=n} }{ {=supA} \cdot {=supB} } = {=lift|2}$
      in both directions. Confidence changes ({=confAB|2} vs {=confBA|2}), lift does not.

  - id: lift-verdict
    type: mcq
    skills: [lift, interpretation]
    difficulty: 1
    tags: [intuition]
    generator: liftVerdictQ
    lessonRef: { tab: intuition, id: milk-trap }
    prompt: |
      For these baskets, Lift({=A|set} → {=B|set}) = **{=lift|2}**. What does that mean?
    show:
      - { id: t, widget: TransactionTable, props: { transactions: '@transactions' } }
    hints:
      - Compare the lift with 1.
    explanation: |
      Lift > 1: positive association; = 1: none; < 1: negative. Here conf = {=conf|2} vs base rate {=relB|2}. Lift describes co-occurrence, not cause.

  - id: milk-trap
    type: mcq
    skills: [interpretation, lift]
    difficulty: 2
    tags: [intuition, application]
    generator: trapQ
    lessonRef: { tab: intuition, id: milk-trap }
    prompt: |
      In these {=n} baskets **{=always}** appears in {=supB} of them. What can you say about the rule {{=a}} → {{=always}}?
    show:
      - { id: t, widget: TransactionTable, props: { transactions: '@transactions' } }
    hints:
      - Compute the confidence first, then the base rate of {=always}.
      - Lift = confidence / base rate of the consequent.
    explanation: |
      Conf = {=conf|2}, but {=always} is in {=supB}/{=n} = {=relB|2} of all baskets, so lift = {=conf|2}/{=relB|2} = {=lift|2}.
      Knowing {=a} barely changes the chance of {=always}: the lecture's milk trap.

  - id: hand-rule-metrics
    type: hand-calc
    skills: [confidence, lift, support]
    difficulty: 2
    tags: [math]
    generator: handRuleQ
    lessonRef: { tab: math-code, id: lift }
    prompt: |
      Evaluate the rule {=A|set} → {=B|set} step by step, as in the lecture.
    show:
      - { id: t, widget: TransactionTable, props: { transactions: '@transactions' } }
    steps:
      - prompt: 'Sup(A ∪ B): baskets containing every item of {=A|set} and {=B|set}'
        answer: { var: supAB, tol: 0 }
      - prompt: 'Sup(A): baskets containing {=A|set}'
        answer: { var: supA, tol: 0 }
      - prompt: 'Conf(A → B) = Sup(A ∪ B) / Sup(A)'
        answer: { var: conf, tol: 0.01 }
        misconceptions:
          - { var: wrongConfN, feedback: 'You divided by |D|. Divide by Sup(A).' }
      - prompt: 'RelSup(B) = Sup(B) / |D|'
        answer: { var: relB, tol: 0.01 }
        misconceptions:
          - { var: wrongRelB, feedback: 'That is the absolute count; divide it by the number of transactions.' }
      - prompt: 'Lift(A → B) = Conf / RelSup(B)'
        answer: { var: lift, tol: 0.02 }
        misconceptions:
