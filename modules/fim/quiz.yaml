    skills: [brute-force]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: brute-force }
    prompt: Complete brute force.
    code: |
      from itertools import combinations

      def brute_force(transactions, minsup):
          items = sorted({i for T in transactions for i in T})
          frequent = {}
          for k in range(1, __BLANK_1__):
              for X in __BLANK_2__(items, k):
                  sup = abs_support(X, transactions)
                  if sup >= minsup:
                      frequent[X] = sup
          return frequent
    blanks:
