  # ------------------------------------------------------------------ new formats (case, find-error, two-tier, explain, cloze)
  - id: forward-case
    type: case
    skills: [forward-parity, fisher]
    difficulty: 3
    tags: [math]
    generator: forwardQ
    lessonRef: { tab: math-code, id: forward-rate }
    prompt: |
      **Pricing a one-year forward.** The spot rate is **{=spot} dollars per euro**. One-year interest is **{=iHome|pct}** in the
      United States (home) and **{=iForeign|pct}** in the euro area.
    parts:
      - type: numeric
        prompt: The interest-rate gap, home − foreign (as a decimal, e.g. 0.03)
        answer: { var: diff, tol: 0.0005 }
        misconceptions:
          - { var: wrongSwap, feedback: "That looks like a forward rate. The gap is just home rate − foreign rate." }
        explanation: '{=iHome|pct} − {=iForeign|pct} = {=diff|3}.'
      - type: numeric
        prompt: The one-year forward rate (dollars per euro, four decimals)
        answer: { var: forward, tol: 0.005 }
        misconceptions:
          - { var: wrongSwap, feedback: 'You took foreign minus home. Use the home rate minus the foreign rate.' }
          - { var: wrongAdd, feedback: 'You added the two interest rates. Use their difference.' }
        explanation: 'Forward = {=spot} × (1 + {=diff|3}) = {=forward|4}.'
      - type: two-tier
        prompt: Suppose instead home interest rates were **lower** than foreign rates. How would the euro trade forward?
        options: ['At a discount (forward below spot)', 'At a premium (forward above spot)', 'At spot, since only inflation matters']
        answer: 0
        reasons:
          - A negative interest gap pulls the forward rate below spot, or arbitrage would pay
          - Forward rates always sit above spot
          - Forward rates follow inflation only
        reasonAnswer: 0
        reasonFeedback:
          1: Premium or discount depends on the sign of the gap.
          2: Covered interest parity ties forwards to interest rates.
        explanation: A lower home rate makes the gap negative, so the foreign currency trades at a forward discount.
    hints: [Forward ≈ spot × (1 + home rate − foreign rate).]
    explanation: Gap {=diff|3}; forward {=forward|4}, a {=direction}.

