    options:
      - It shows an equal surplus
      - It shows an equal deficit
      - It is empty
      - It cannot be known
    answer: 0
    optionFeedback:
      1: "An equal deficit on both sides couldn't balance with unchanged reserves."
      2: "The current account deficit has to be financed through the capital account."
      3: "With reserves unchanged, the accounts must offset, so it's known."
    hints:
      - The whole record adds to zero.
    explanation: Money that flows out through the current account must flow back in through the capital account, so the two offset.

