  - id: ppp-explain
    type: explain
    skills: [ppp]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: why-prices-differ }
    prompt: Explain the law of one price and how it leads to purchasing power parity, including one reason it doesn't hold exactly.
    model: |
      If the same good sells for different prices in two places and moving it is easy, traders buy where it's cheap and sell
      where it's dear until prices meet: the law of one price. Applied to a whole basket of goods, it implies exchange rates
      should move so that money buys the same basket everywhere: purchasing power parity. It holds only roughly, because
      shipping costs, tariffs, and services that can't be traded keep prices apart.
    checklist:
      - Arbitrage pushes prices of the same good together
      - Applied to a basket, it implies PPP exchange rates
      - Transport costs and trade barriers keep prices apart
      - Non-traded goods and services break the link
    hints: [Start with one good, then a whole basket.]
    explanation: Arbitrage drives the law of one price; PPP extends it to baskets and holds only roughly.

