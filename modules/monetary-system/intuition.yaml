scenes:
  - id: from-gold-to-floating
    title: From gold to floating money
    goal: Who decides what a peso, a dollar or a euro is worth next to each other?
    skills: [monetary-system]
    state: { animFrom: 0, animTo: 0.9 }
    stage:
      - id: eras
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: c1, label: Each unit of money is worth a fixed weight of gold }
            - { id: c2, label: The dollar is tied to gold and other money is tied to the dollar }
            - { id: c3, label: Supply and demand set the rate }
            - { id: c4, label: Sir Isaac Newton set it up in Britain in 1717 }
            - { id: c5, label: Ran from 1945 to 1971 }
            - { id: c6, label: Made official by the Jamaica Agreement }
          bins:
            - { id: gold, label: Gold standard }
            - { id: bw, label: Bretton Woods }
            - { id: float, label: Floating rates }
          solution: { c1: gold, c2: bw, c3: float, c4: gold, c5: bw, c6: float }
      - id: era-note
        widget: Callout
        hidden: true
        props:
          kind: note
          title: Three eras of money
          body: |
            - **Gold standard (1717–1930s):** Each currency is worth a fixed weight of gold.
            - **Bretton Woods (1945–1971):** The U.S. dollar is tied to gold, and other currencies fix a **par value** to the dollar.
            - **Floating rates (since 1971 / Jamaica Agreement):** Major currencies move with supply and demand in the FX market.
      - id: anim
        widget: Animation
        region: top
        props:
          src: [assets/anim/gold-to-floating.webm, assets/anim/gold-to-floating.mp4]
          poster: assets/anim/gold-to-floating.poster.jpg
          alt: |
            Coins of five currencies hang from a glowing gold bar (the gold standard), then re-hook onto one big dollar coin that
            hangs from the gold (Bretton Woods, 1944). In 1971 that chain cracks and the coins drop onto a rolling sea, each
            bobbing on its own (floating rates).
          start: '@animFrom'
          end: '@animTo'
          loop: false
          stills: [0.9, 1.8, 2.6, 3.6, 4.4, 5.4, 6]
    beats:
      - say: |
          Each country has its own **currency**, the money it prints and uses. When you trade across borders, you swap one
          currency for another at an **exchange rate**: the price of one currency in terms of another.
        define: [currency, exchange-rate]
      - say: |
          For a long time the price was easy: money was a weight of metal. Under the **gold standard**, each unit of a
          currency was worth a fixed amount of gold. Governments could not print money freely, so they lacked flexibility.
        define: [gold-standard]
        set: { animFrom: 0.9, animTo: 1.8 }
      - say: |
          Tying every currency to gold meant currencies were tied to each other. That is a **fixed exchange rate**: the
          government promises to keep the price where it is.
        define: [fixed-exchange-rate]
      - say: |
          After World War II, countries met at **Bretton Woods** and tied their money to the dollar, and the dollar to gold.
          Each currency got a **par value**, an official value written in gold or dollars.
        define: [bretton-woods, par-value]
        set: { animFrom: 1.8, animTo: 3.6 }
      - say: |
          To defend a fixed rate, a country's **central bank** (its official bank for money) keeps **reserves**: gold and
          foreign currency it can sell to support its own money.
        define: [central-bank, reserves]
      - say: |
          The world needed more dollars as reserves, so the United States had to send out more dollars than it took in.
          That meant running deficits, which made people doubt the dollar. This is the **Triffin paradox**.
        define: [triffin-paradox]
        gate:
          type: predict
          question: To give the world more reserve dollars, the United States must run…
          options: [A deficit, A surplus, Exactly zero trade, No trade at all]
          answer: 0
          explain: Dollars flow out of the country only when it spends more abroad than it earns, which is a deficit.
      - say: |
          In 1971 the dollar link to gold ended. Today the big currencies **float**: a **floating exchange rate** is set by
          supply and demand in the market. Sort the facts into their eras.
        define: [floating-exchange-rate]
        set: { animFrom: 3.6, animTo: 6 }
        show: [eras]
        gate:
          type: event
          prompt: Place every fact in the right era.
          target: eras
          event: solved
          hint: Check the dates and the words "gold" and "dollar".
      - say: Think about what you have seen.
        hide: [eras, anim]
        show: [era-note]
        gate:
          type: reflect
          prompt: In your own words, why was the Bretton Woods system hard to keep going?
          model: |
            The world needed dollars as reserves, so the United States had to run deficits. The more it ran deficits, the
            more people doubted it could swap dollars for gold at the promised price. That loss of trust broke the link
            in 1971.
    takeaway: Money moved from gold, to gold plus the dollar, to rates set by the market.

  - id: peg-or-float
    title: Peg or float?
    goal: How do countries choose between locking their currency and letting the market set it?
    skills: [monetary-system]
    state: { regime: 'hard' }
    derive:
      - { fn: regimeProfile, in: { regime: '@regime' }, out: r }
    stage:
      - id: regime-tree
        widget: Tree
        props:
          root:
            id: imf
            label: IMF Exchange Rate Arrangements
            note: Spectrum from rigid commitment to full market flexibility
            children:
              - id: hard-group
                label: Hard Pegs
                note: Strictest lock; no independent monetary policy
                children:
                  - { id: nslt, label: No separate legal tender }
                  - { id: cb, label: Currency board }
              - id: soft-group
                label: Soft Pegs
                note: Managed stability within bands or crawls
                children:
                  - { id: conv, label: Conventional peg }
                  - { id: crawl, label: Stabilized & crawling pegs }
                  - { id: bands, label: Pegged within horizontal bands }
              - id: float-group
                label: Floating Regimes
                note: Market-driven exchange rates
                children:
                  - { id: managed, label: Floating (managed) }
                  - { id: free, label: Free floating }
      - id: regime-pick
        widget: Choice
        region: side
        props:
          label: Regime category
          style: segmented
          options:
            - { value: 'hard', label: 'Hard peg' }
            - { value: 'soft', label: 'Soft peg' }
            - { value: 'floating', label: 'Floating' }
        bind: { value: regime }
      - id: regime-info
        widget: Readout
        region: side
        props:
          items:
            - { label: Category, value: '@r.title', tone: accent }
            - { label: Monetary autonomy, value: '@r.autonomy' }
            - { label: Rate behavior, value: '@r.stability' }
            - { label: IMF share, value: '@r.prevalence', tone: good }
            - { label: Typical forms, value: '@r.examples' }
    beats:
      - say: |
          Even after the gold link ended, countries still choose how tightly to manage their currency. The International
          Monetary Fund groups exchange rate arrangements along a spectrum from rigid pegs to free floating.
      - say: |
          At the strict end is the **hard peg**: a country either uses another country's currency outright as legal tender
          or runs a currency board that backs every unit of domestic money with foreign reserves.
        define: [hard-peg]
      - say: |
          A **soft peg** is a looser fixed arrangement. The central bank pegs to an anchor currency or basket, or lets the
          rate crawl gradually or move inside horizontal bands.
        define: [soft-peg]
      - say: |
          Across IMF member countries, soft pegs and floating regimes account for the vast majority of national currencies,
          while hard pegs are the smallest of the three main groups.
        gate:
          type: predict
          question: Which broad category of exchange rate arrangements do the largest share of countries use today?
          options: [Hard pegs, Soft pegs, The gold standard, Barter clearing]
          answer: 1
          explain: Soft pegs make up the largest share of IMF members—nearly half of all countries—followed by floating regimes.
      - say: |
          Compare the three categories in the side panel to see what a country gives up when it locks its exchange rate.
        gate:
          type: when
          prompt: Select **Soft peg** in the side panel to inspect how it balances stability and policy flexibility.
          when: "regime == 'soft'"
          hint: Click the "Soft peg" option under Regime category.
      - say: Check your grasp of how the IMF classifies currency regimes.
        gate:
          type: practice
          template: hard-peg-mcq
    takeaway: Countries trade off exchange-rate stability against monetary independence across hard pegs, soft pegs, and floating regimes.

  - id: new-kinds-of-money
    title: New kinds of money
    goal: What counts as money now that it can live on a phone?
    skills: [monetary-system]
    state: { animFrom: 0, animTo: 1.2 }
    stage:
      - id: sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: k1, label: The peso notes in your wallet }
            - { id: k2, label: Bitcoin }
            - { id: k3, label: A coin that always equals one dollar }
            - { id: k4, label: A digital peso issued by the central bank }
          bins:
            - { id: fiat, label: Fiat currency }
            - { id: crypto, label: Cryptocurrency }
            - { id: stable, label: Stablecoin }
            - { id: cb, label: CBDC }
          solution: { k1: fiat, k2: crypto, k3: stable, k4: cb }
      - id: anim
        widget: Animation
        region: top
        props:
          src: [assets/anim/four-forms-of-money.webm, assets/anim/four-forms-of-money.mp4]
          poster: assets/anim/four-forms-of-money.poster.jpg
          alt: |
            Four panels. Fiat: a violet central bank stamps a paper note, and a gold bar beside it is struck out. Crypto: five
            glowing nodes link into a network, blocks chain along the bottom and a coral price line zigzags. Stablecoin: a gold
            coin is chained one-to-one to a vault of dollar notes and its teal price line stays flat. CBDC: the central bank
            beams a violet digital coin into a phone wallet. Last, all four panels side by side with their names.
          start: '@animFrom'
          end: '@animTo'
          loop: false
          stills: [1.1, 2.3, 3.5, 4.3, 4.95]
    beats:
      - say: |
          The pesos in your wallet are **fiat currency**: money issued by a government with no gold or silver behind it.
          It has value because people accept it and the law says it must be accepted.
        define: [fiat-currency]
      - say: |
          Some money exists only as data. A **cryptocurrency** is digital money secured by code and run by a network, not
          by a government or bank. Bitcoin and Ethereum are examples.
        define: [cryptocurrency]
        set: { animFrom: 1.2, animTo: 2.4 }
      - say: |
          Crypto prices swing wildly, so some coins try to stay calm. A **stablecoin** pegs its value to a fiat currency,
          a metal or another crypto. Algorithmic ones have no real backing and lean on computer rules.
        define: [stablecoin]
        set: { animFrom: 2.4, animTo: 3.6 }
      - say: |
          Governments answered with their own digital money. A **central bank digital currency**, or CBDC, is the
          official currency in digital form, issued by the central bank.
        define: [cbdc]
        set: { animFrom: 3.6, animTo: 4.4 }
        gate:
          type: predict
          question: Which of these is NOT controlled by any central authority?
          options: [Fiat currency, Cryptocurrency, CBDC, A banknote]
          answer: 1
          explain: A cryptocurrency is run by a network. The other three are issued by governments or central banks.
      - say: Sort each example into its kind.
        show: [sorter]
        hide: [anim]
        gate:
          type: event
          prompt: Place all four examples in the right bin.
          target: sorter
          event: solved
      - say: One more thought.
        set: { animFrom: 4.4, animTo: 5 }
        hide: [sorter]
        show: [anim]
        gate:
          type: reflect
          prompt: Why might a government prefer to issue a CBDC rather than let people use a cryptocurrency?
          model: |
            A CBDC stays under the central bank's control, so it can still manage the money supply and interest rates and
            watch for crime. A cryptocurrency sits outside that control and can swing in value.
    takeaway: Fiat, crypto, stablecoins and CBDCs differ by who issues them and what, if anything, backs them.

  - id: reading-a-quote
    title: Reading a currency quote
    goal: Why does a currency dealer show two prices for the same currency pair?
    skills: [fx-quotes]
    state: { action: 'hold' }
    derive:
      - { fn: quoteRole, in: { action: '@action' }, out: q }
    stage:
      - id: quote-card
        widget: Callout
        props:
          kind: note
          title: Inside a two-sided dealer quote
          body: |
            - **Spot rate:** Price for immediate currency delivery (settled within two business days).
            - **Bid price:** The lower price where the dealer **buys** foreign currency from a customer.
            - **Ask price:** The higher price where the dealer **sells** foreign currency to a customer.
            - **Bid-ask spread:** The gap between ask and bid—the dealer's built-in transaction fee.
            - **Reciprocal quote:** The same pair flipped around so the second currency becomes the unit being priced.
      - id: action-pick
        widget: Choice
        region: side
        props:
          label: Trade perspective
          style: segmented
          options:
            - { value: 'hold', label: 'Overview' }
            - { value: 'buy', label: 'Importer buys FX' }
            - { value: 'sell', label: 'Exporter sells FX' }
            - { value: 'flip', label: 'Reciprocal quote' }
        bind: { value: action }
      - id: quote-readout
        widget: Readout
        region: side
        props:
          items:
            - { label: Scenario, value: '@q.actor', tone: accent }
            - { label: Side of quote used, value: '@q.sideUsed', tone: good }
            - { label: Dealer role, value: '@q.dealerRole' }
            - { label: Key rule, value: '@q.takeaway' }
    beats:
      - say: |
          Trillions of pesos, dollars and euros are swapped every day in the **foreign exchange market**, or FX market.
          Rather than a single building, it is a global network of banks and dealers trading over computer links.
        define: [fx-market]
      - say: |
          A trade settled within two business days uses the **spot rate**. Whenever you check a currency screen, the
          dealer posts two spot prices side by side for the same pair.
        define: [spot-rate]
      - say: |
          The dealer buys foreign currency at the **bid price** and sells it at the **ask price**. Because the dealer buys
          low and sells high, the ask is always higher than the bid.
        define: [bid-price, ask-price]
        gate:
          type: predict
          question: You are an importer buying euros from a bank. Which price do you pay?
          options: [The bid price, The ask price, The reciprocal midpoint, Neither side]
          answer: 1
          explain: Because you want to buy euros, the bank is selling euros to you at its selling price—the ask.
      - say: |
          The gap between the two prices is the **bid-ask spread**. It is the dealer's fee for providing liquidity. Test
          what happens when an exporter converts foreign earnings home.
        define: [bid-ask-spread]
        gate:
          type: when
          prompt: Select **Exporter sells FX** in the side panel to see which side of the quote applies when selling foreign currency.
          when: "action == 'sell'"
          hint: Click "Exporter sells FX" under Trade perspective.
      - say: |
          Quotes can also be stated the other way round. A **reciprocal quote** flips the pair—expressing euros per dollar
          instead of dollars per euro—so the old ask side becomes the new bid side.
        define: [reciprocal-quote]
      - say: Test your understanding of why currency dealers quote two prices.
        gate:
          type: practice
          template: quote-sides-mcq
    takeaway: Dealers buy foreign currency at the lower bid and sell at the higher ask, earning the bid-ask spread.

  - id: crossing-currencies
    title: When the bank lists the wrong pair
    goal: How do banks price a trade between two currencies when both are quoted only against the U.S. dollar?
    skills: [cross-rates]
    stage:
      - id: vehicle-note
        widget: Callout
        props:
          kind: note
          title: Chaining quotes through a vehicle currency
          body: |
            - **Direct quote gap:** Maintaining deep direct markets between every possible currency pair (such as euros to pounds or baht to pesos) is costly.
            - **Vehicle currency:** A widely traded currency—most often the U.S. dollar—used as the shared middle link.
            - **Cross rate:** Chaining `EUR/USD` and `USD/GBP` cancels out the dollar and yields the implied `EUR/GBP` bid and ask.
      - id: cross-sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: c1, label: 'EUR/USD and USD/GBP quotes posted on the dealer screen' }
            - { id: c2, label: 'The U.S. dollar acting as the shared middle currency that cancels out' }
            - { id: c3, label: 'The resulting EUR/GBP exchange rate between two non-dollar currencies' }
            - { id: c4, label: 'Avoids thin order books between thousands of minor currency pairs' }
          bins:
            - { id: direct, label: Dollar quotes }
            - { id: vehicle, label: Vehicle currency role }
            - { id: cross, label: Cross rate result }
          solution: { c1: direct, c2: vehicle, c3: cross, c4: vehicle }
    beats:
      - say: |
          Suppose a firm holds euros and needs British pounds, or a Thai exporter is paid in Mexican pesos. Banks rarely
          keep deep direct markets for every pair—instead, they route quotes through the U.S. dollar.
      - say: |
          A **cross rate** is an exchange rate between two currencies worked out from each currency's rate against a common
          third currency, usually the dollar. The shared dollar link bridges the two currencies.
        define: [cross-rate]
      - say: |
          When chaining two quotes that share a middle currency, the dealer pairs bid with bid and ask with ask so the
          middle currency cancels out cleanly.
        gate:
          type: predict
          question: Why do foreign exchange dealers use a vehicle currency like the U.S. dollar to build cross rates?
          options:
            - Deep dollar liquidity makes it cheaper to bridge through the dollar than to maintain direct markets for every minor pair
            - International treaties forbid banks from quoting two non-dollar currencies directly
            - Using a vehicle currency removes the bid-ask spread
            - Central banks fix cross rates once a year
          answer: 0
          explain: With over 150 currencies in the world, routing trades through a liquid vehicle currency avoids thin, expensive direct markets.
      - say: |
          Sort each part of a cross-rate transaction into its role in connecting two non-dollar currencies.
        show: [cross-sorter]
        gate:
          type: event
          prompt: Place each description into the right bin.
          target: cross-sorter
          event: solved
          hint: Separate the initial dollar quotes, the middle vehicle role, and the final cross rate.
      - say: Put the steps of building a cross rate in order.
        hide: [cross-sorter]
        gate:
          type: practice
          template: cross-steps-order
    takeaway: A cross rate links two currencies through their quotes against a shared third currency, usually the U.S. dollar.

  - id: why-prices-differ
    title: Why exchange rates move
    goal: Why does a currency lose value abroad after years of rising prices at home?
    skills: [ppp]
    state: { inflScenario: 'balanced', animFrom: 0, animTo: 1.2 }
    derive:
      - { fn: pppOutcome, in: { scenario: '@inflScenario' }, out: p }
    stage:
      - id: loop-note
        widget: Callout
        props:
          kind: note
          title: One product, two markets
          body: |
            - **Law of one price:** In an efficient market with no barriers, identical goods should sell for the same price when expressed in a common currency.
            - **Arbitrage:** Buying a good where it is cheap and selling where it is dear at the same moment to lock in a risk-free profit.
            - **Price convergence:** Arbitrageurs drive up demand in the cheap market and increase supply in the expensive market until the gap closes.
      - id: ppp-schedule
        widget: Schedule
        hidden: true
        props:
          title: How inflation and PPP shape currency value
          columns: [Inflation gap, Currency tendency, Trade impact]
          rows:
            - id: row-high
              label: Higher domestic inflation
              amounts: [Home currency weakens (depreciates), Offsets rising domestic prices; imports cost more]
            - id: row-low
              label: Lower domestic inflation
              amounts: [Home currency strengthens (appreciates), Preserves buying power; imports become cheaper]
            - id: row-equal
              label: Equal inflation rates
              amounts: [PPP exchange rate stays stable, Relative price competitiveness holds steady]
      - id: ppp-choice
        widget: Choice
        region: side
        hidden: true
        props:
          label: Inflation scenario
          style: segmented
          options:
            - { value: 'balanced', label: 'Equal inflation' }
            - { value: 'high-home', label: 'Higher home inflation' }
            - { value: 'low-home', label: 'Lower home inflation' }
        bind: { value: inflScenario }
      - id: ppp-readout
        widget: Readout
        region: side
        hidden: true
        props:
          items:
            - { label: Price trend, value: '@p.gap', tone: accent }
            - { label: PPP currency response, value: '@p.currencyMove', tone: good }
            - { label: Exporter impact, value: '@p.exporterEffect' }
            - { label: Importer impact, value: '@p.importerEffect' }
      - id: anim
        widget: Animation
        region: top
        props:
          src: [assets/anim/arbitrage-and-ppp.webm, assets/anim/arbitrage-and-ppp.mp4]
          poster: assets/anim/arbitrage-and-ppp.poster.jpg
          alt: |
            Two price bars stand level between the New York and Manila skylines, each topped by the same phone: 500 dollars in
            New York, 25,000 pesos (500 dollars at 50 pesos per dollar) in Manila. The New York bar drops to 450 dollars and a
            50-dollar gap opens. Boats then carry phones from New York to Manila, a "+$50" pops at each arrival, and the two
            bars creep together until they are level again.
          start: '@animFrom'
          end: '@animTo'
          loop: false
          stills: [1.1, 1.95, 2.9, 4.9]
    beats:
      - say: |
          Suppose an identical phone sells for the same dollar value in Manila and New York. The **law of one price**
          says that in an efficient market, identical goods sell for the same price everywhere once converted into one currency.
        define: [law-of-one-price]
      - say: Suppose the phone suddenly becomes cheaper in New York while staying expensive in Manila.
        set: { animFrom: 1.2, animTo: 2 }
        gate:
          type: predict
          question: What will traders do when the same product is cheaper in New York than in Manila?
          options: [Buy in New York and sell in Manila, Buy in Manila and sell in New York, Nothing, Wait a year]
          answer: 0
          explain: Traders buy where the product is cheap and sell where it is dear, pushing the two prices back together.
      - say: |
          That risk-free profit is **arbitrage**: buying and selling the same item at the same moment across two markets.
          Arbitrageurs keep trading until the price gap closes.
        define: [arbitrage]
        set: { animFrom: 2, animTo: 5 }
      - say: |
          Across whole economies, prices rarely stay still. **Inflation** is a sustained rise in the general level of
          prices, meaning each unit of currency buys less at home than before.
        define: [inflation]
        hide: [loop-note, anim]
        show: [ppp-schedule, ppp-choice, ppp-readout]
      - say: |
          When domestic prices rise faster than foreign prices, the home currency must weaken so a basket of goods still
          costs the same in both places. That principle is **purchasing power parity** (PPP).
        define: [purchasing-power-parity]
        gate:
          type: when
          prompt: Select **Higher home inflation** in the side panel to see how purchasing power parity predicts the currency will adjust.
          when: "inflScenario == 'high-home'"
          hint: Click "Higher home inflation" under Inflation scenario.
      - say: Consider why real-world exchange rates often drift away from PPP for years at a time.
        gate:
          type: reflect
          prompt: Rates seldom match purchasing power parity exactly. What real-world frictions get in the way?
          model: |
            Shipping costs, import tariffs, and quotas make it expensive to arbitrage physical goods, many services like
            haircuts or housing cannot be traded across borders, and short-term capital flows react to interest rates and
            news. Thus PPP acts as a long-run anchor rather than an instant rule.
    takeaway: Arbitrage equalizes single-good prices, while purchasing power parity links long-run currency moves to inflation gaps.

  - id: interest-and-forwards
    title: Interest rates and the price of tomorrow's money
    goal: How do inflation and interest rate gaps shape real returns and forward exchange rates?
    skills: [fisher, forward-parity]
    stage:
      - id: parity-table
        widget: Schedule
        props:
          title: Interest rate and parity frameworks
          columns: [What it connects, Core economic mechanism]
          rows:
            - id: row-fisher
              label: Fisher effect
              amounts: [Nominal rate, expected inflation & real rate, Lenders demand higher nominal rates to offset expected inflation]
            - id: row-cirp
              label: Covered interest rate parity
              amounts: [Interest gap & forward premium/discount, Forward rate offsets the interest differential to block risk-free arbitrage]
            - id: row-ife
              label: International Fisher effect
              amounts: [Interest gap & expected spot change, Higher-interest currencies are expected to depreciate in the spot market]
      - id: parity-bins
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: p1, label: 'High expected inflation erodes a saver’s real buying power unless nominal rates rise' }
            - { id: p2, label: 'A firm locks in a future exchange rate today so interest differentials cannot be arbitraged' }
            - { id: p3, label: 'A country with higher nominal interest rates is expected to see its spot currency weaken' }
          bins:
            - { id: fe, label: Fisher effect }
            - { id: cirp, label: Covered interest parity }
            - { id: ife, label: International Fisher effect }
          solution: { p1: fe, p2: cirp, p3: ife }
    beats:
      - say: |
          When a bank advertises a deposit or loan rate, that stated figure is the **nominal interest rate**—the rate
          quoted before taking inflation into account.
        define: [nominal-interest-rate]
      - say: |
          What a lender truly gains in buying power is the **real interest rate**, which removes expected inflation from
          the nominal rate. The **Fisher effect** explains that nominal rates rise when expected inflation rises.
        define: [real-interest-rate, fisher-effect]
        gate:
          type: predict
          question: If expected inflation rises above the nominal interest rate on a savings account, what happens to the saver's real buying power?
          options:
            - It shrinks, because the real interest rate is negative
            - It grows faster, because inflation adds to interest
            - It stays constant, because nominal rates guarantee buying power
            - It doubles over the year
          answer: 0
          explain: When prices rise faster than the nominal interest rate, the real interest rate is negative and the saver loses purchasing power.
      - say: |
          Cross-border businesses also want to lock in tomorrow's exchange rate today. A **forward rate** is an exchange
          rate agreed now for swapping currencies on a fixed future date, such as 30, 90, or 180 days ahead.
        define: [forward-rate]
      - say: |
          How is that forward rate set? **Covered interest rate parity** states that the forward premium or discount
          between two currencies offsets the gap between their nominal interest rates—preventing risk-free arbitrage.
        define: [covered-interest-parity]
      - say: |
          Even without a forward contract, interest gaps carry a signal. The **International Fisher effect** states that
          the difference between two countries' nominal interest rates reflects how their spot rate is expected to change.
        define: [international-fisher-effect]
        show: [parity-bins]
        gate:
          type: event
          prompt: Match each scenario to the interest-rate framework that explains it.
          target: parity-bins
          event: solved
          hint: Distinguish between real buying power (Fisher), locked-in forwards (Covered), and expected spot moves (International Fisher).
      - say: Test how interest differentials shape whether a currency trades at a forward premium or discount.
        hide: [parity-bins]
        gate:
          type: practice
          template: forward-direction-mcq
    takeaway: The Fisher effect links nominal rates to inflation, while interest parity links interest gaps to forward and expected spot rates.

  - id: forecasting-rates
    title: Can anyone predict the rate?
    goal: Why do economists and traders disagree on whether exchange rates can be forecast?
    skills: [forecasting]
    data: [spotseries]
    state: { forecastMethod: 'efficient' }
    derive:
      - { fn: forecastProfile, in: { method: '@forecastMethod' }, out: fp }
    stage:
      - id: chart
        widget: Chart
        props:
          kind: line
          series:
            - { name: Dollars per euro, y: '@spotseries' }
          xLabel: Month
          yLabel: Rate
      - id: method-pick
        widget: Choice
        region: side
        props:
          label: Forecasting school
          style: segmented
          options:
            - { value: 'efficient', label: 'Efficient market' }
            - { value: 'random-walk', label: 'Random walk' }
            - { value: 'fundamental', label: 'Fundamental' }
            - { value: 'technical', label: 'Technical' }
        bind: { value: forecastMethod }
      - id: forecast-readout
        widget: Readout
        region: side
        props:
          items:
            - { label: Core assumption, value: '@fp.assumption', tone: accent }
            - { label: Primary inputs, value: '@fp.inputs' }
            - { label: Managerial takeaway, value: '@fp.implication', tone: good }
    beats:
      - say: |
          Look at this six-month run of dollars per euro. Every importer, exporter, and bank treasury would love to know
          in advance which way the rate will move next month.
      - say: |
          One school says trying to beat the market is futile. The **efficient market approach** holds that today's spot
          price already reflects all relevant public information, leaving no easy predictable gain.
        define: [efficient-market]
      - say: |
          A close companion is the **random walk hypothesis**: because future news is unpredictable, exchange rate changes
          are random and the best forecast for tomorrow's rate is simply today's rate.
        define: [random-walk-hypothesis]
        gate:
          type: predict
          question: Under the random walk hypothesis, what is the best forecast for next month's exchange rate?
          options:
            - Today's current spot rate, because future news shocks cannot be predicted
            - An extrapolation of the last two months' upward slope
            - The average rate from ten years ago
            - The official gold par value
          answer: 0
          explain: A random walk holds that all known information is already in today's price, so tomorrow's best predictor is today's spot rate.
      - say: |
          Forecasters still try two active methods. The **fundamental approach** models economic forces like inflation,
          interest rates, and trade, while **technical analysis** studies past price charts to project trends forward.
        define: [fundamental-approach, technical-analysis]
        gate:
          type: when
          prompt: Select **Fundamental** in the side panel to see how macroeconomic forecasting differs from chart-based analysis.
          when: "forecastMethod == 'fundamental'"
          hint: Click "Fundamental" under Forecasting school.
      - say: Weigh the debate between market efficiency and chart reading.
        gate:
          type: reflect
          prompt: If markets are largely efficient, why do some currency traders still rely on technical analysis?
          model: |
            Technical traders believe that human psychology, herd behavior, and institutional trading rules create
            short-term momentum patterns in price charts. Efficient-market proponents counter that any public chart
            pattern is quickly arbitraged away once enough traders act on it.
    takeaway: Efficient-market and random-walk views treat today's rate as the best forecast, while fundamental and technical analysts try to beat it.

  - id: governments-step-in
    title: When governments step in
    goal: How do currency exchange controls and cross-border taxes reshape international business?
    skills: [govt-forces]
    state: { animFrom: 0, animTo: 2.6 }
    stage:
      - id: controls-note
        widget: Callout
        props:
          kind: note
          title: Government tools on money and income
          body: |
            - **Currency exchange controls:** Ration foreign currency to protect central bank reserves, making the local currency **nonconvertible** at an official rate set above the free-market value.
            - **Income tax:** Direct tax on personal and corporate earnings.
            - **Withholding tax:** Tax deducted at the source on passive income (interest, dividends, royalties) paid across borders.
            - **Value-added tax (VAT):** Indirect tax levied only on the value added at each production stage via input tax credits.
      - id: policy-bins
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: g1, label: 'Rations access to foreign currency to protect central bank reserves' }
            - { id: g2, label: 'Collected at each stage of production, with a credit for tax already paid on inputs' }
            - { id: g3, label: 'Deducted at the source when interest, dividends, or royalties are paid abroad' }
          bins:
            - { id: ctrl, label: Exchange controls }
            - { id: vat, label: Value-added tax }
            - { id: wht, label: Withholding tax }
          solution: { g1: ctrl, g2: vat, g3: wht }
      - id: anim
        widget: Animation
        region: top
        hidden: true
        props:
          src: [assets/anim/vat-credit-chain.webm, assets/anim/vat-credit-chain.mp4]
          poster: assets/anim/vat-credit-chain.poster.jpg
          alt: |
            A crate passes from a supplier to a factory to a shop, with a violet government jar below. The supplier sells at
            100 and drops a 12 coin in the jar. The factory sells at 150: 12% of 150 is 18, with a credit of 12 for the tax
            already paid. Then the factory drops in 6 (the jar reads 18), the shop sells at 250, owes 30 less an 18 credit and
            drops in 12. The jar reads 30: 12 + 6 + 12 = 30, which is 12% of 250.
          start: '@animFrom'
          end: '@animTo'
          loop: false
          stills: [1.2, 2.5, 3.3, 4.9]
    beats:
      - say: |
          A country running short of foreign money may limit who can buy it. These are **currency exchange controls**:
          government limits on buying, selling or holding foreign currency, usually to protect the country's reserves.
        define: [exchange-controls]
      - say: |
          A **convertible currency** can be swapped for others without limits. Under controls it becomes nonconvertible: the
          government fixes its value, usually above what the free market would pay.
        define: [convertible-currency]
        gate:
          type: predict
          question: Compared with the free-market rate, the official exchange rate under currency controls is usually…
          options: [Above it, Below it, Exactly equal, Unrelated]
          answer: 0
          explain: Governments set the official value above the free-market value, which is why controls are needed to ration scarce foreign exchange.
      - say: |
          Governments also shape business through taxes. An **income tax** is charged directly on what people and companies
          earn. A **withholding tax** is taken at the source from passive income, such as interest or dividends, paid across a border.
        define: [income-tax, withholding-tax]
      - say: |
          The **value-added tax**, or VAT, is a sales tax collected at every step of production. Each firm charges tax on
          its sale, then receives a credit for the tax already paid on its inputs.
        define: [value-added-tax]
        hide: [controls-note]
        show: [anim]
      - say: |
          Because each firm deducts the tax paid at earlier stages, VAT taxes only the net value added at each step and
          never cascades. Sort each government policy into how it works.
        set: { animFrom: 2.6, animTo: 5 }
        show: [policy-bins]
        gate:
          type: event
          prompt: Place each policy description into the right category.
          target: policy-bins
          event: solved
          hint: Match foreign exchange rationing, supply-chain input credits, and passive income deductions.
      - say: Practice matching the three tax types in international business.
        hide: [policy-bins, anim]
        show: [controls-note]
        gate:
          type: practice
          template: tax-match
    takeaway: Governments ration foreign money with exchange controls and collect revenue through income, withholding, and value-added taxes.

  - id: balance-of-payments
    title: Keeping score between countries
    goal: How does a country record all the money flowing across its borders—and why does it always balance?
    skills: [bop]
    stage:
      - id: bop-tree
        widget: Tree
        props:
          root:
            id: bop-root
            label: Balance of Payments (Double-Entry Record)
            note: Credits (+) come from abroad; Debits (−) go abroad
            children:
              - id: curr-node
                label: Current Account
                note: Goods, services, investment income & unilateral transfers
                children:
                  - { id: exp-node, label: 'Exports of goods & services (Credit +)' }
                  - { id: imp-node, label: 'Imports of goods & services (Debit −)' }
              - id: cap-node
                label: Capital Account
                note: Cross-border investments, loans & asset flows
                children:
                  - { id: in-node, label: 'Foreign investment inflows (Credit +)' }
                  - { id: out-node, label: 'Domestic investment outflows (Debit −)' }
              - id: res-node
                label: Official Reserves
                note: Central bank gold, foreign exchange & IMF holdings
                children:
                  - { id: bal-node, label: 'Offsets any net gap so the three accounts balance to zero' }
      - id: bop-bins
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: b1, label: 'Exporting domestic merchandise and importing foreign shipping services' }
            - { id: b2, label: 'Foreign investors building a local factory or buying domestic bonds' }
            - { id: b3, label: 'The central bank adjusting its gold and foreign currency holdings to balance the accounts' }
          bins:
            - { id: curr, label: Current account }
            - { id: cap, label: Capital account }
            - { id: res, label: Official reserves }
          solution: { b1: curr, b2: cap, b3: res }
    beats:
      - say: |
          Every country trades and invests with the rest of the world. The **balance of payments** (BOP) records all money
          dealings between a country's residents and foreigners over a period, using double-entry bookkeeping so the total balances.
        define: [balance-of-payments]
      - say: |
          Payments received from abroad are recorded as credits (+), and payments sent abroad are debits (−). The
          **current account** records trade in goods and services, investment income, and unilateral transfers like aid.
        define: [current-account]
      - say: |
          The **capital account** records cross-border investments and loans. The **official reserves** account tracks
          changes in the central bank's gold and foreign currency holdings that balance the overall record.
        define: [capital-account, official-reserves]
      - say: |
          Because double-entry bookkeeping requires the balance of payments to sum to zero, a deficit in one account must
          be financed by a surplus in another or by official reserves.
        gate:
          type: predict
          question: If a country runs a current account deficit and its official reserves do not change, what must happen in its capital account?
          options:
            - It must show an offsetting capital account surplus from net foreign investment or borrowing
            - It must show an identical capital account deficit
            - It must be zero by law
            - Its exports of goods must exceed its imports
          answer: 0
          explain: Spending more abroad on goods and services than you earn requires an equal net inflow of foreign capital when reserves stay unchanged.
      - say: |
          Sort each cross-border activity into the balance of payments account where it belongs.
        show: [bop-bins]
        gate:
          type: event
          prompt: Place each transaction into its balance of payments account.
          target: bop-bins
          event: solved
          hint: Goods and services go in the current account; asset investments go in the capital account; central bank holdings go in official reserves.
      - say: Practice how the current and capital accounts offset each other.
        hide: [bop-bins]
        gate:
          type: practice
          template: bop-mcq
    takeaway: Double-entry bookkeeping ensures that a current account deficit is matched by a capital account surplus or a change in reserves.
