  - id: structure-explain
    type: explain
    skills: [structure-types]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: structures }
    prompt: Explain when a company might choose a geographic region structure, and when a global product structure.
    model: |
      A geographic structure groups everything a region needs under one regional manager. It suits firms whose products have
      low or stable technology and must be adapted to local tastes and rules, such as food or consumer goods. A global product
      structure gives each product division worldwide responsibility. It suits diverse, technical product lines that are much
      the same everywhere, and avoids duplicating product experts in each region.
    checklist:
      - Geographic structure groups operations by region
      - It suits low or stable technology and local adaptation
      - Product structure gives each product line worldwide responsibility
      - It suits diverse, technical products and avoids duplicate experts
    hints: ["What differs more across your business: regions or products?"]
    explanation: Organize around whatever varies most, regions or products.

