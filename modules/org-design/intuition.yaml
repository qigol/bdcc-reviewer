scenes:
  - id: designing-an-organization
    title: Designing a worldwide organization
    goal: How should a company with operations in many countries be arranged so its units work as one?
    skills: [org-dimensions]
    state: { spanDesign: narrow }
    derive:
      - { fn: spanProfile, in: { spanDesign: '@spanDesign' }, out: h }
    stage:
      - id: hier-tree
        widget: Tree
        props:
          orientation: down
          root:
            id: ceo
            label: Chief Executive Officer
            note: Top headquarters authority
            tone: accent
            children:
              - id: div-a
                label: Division / Regional Lead A
                note: Formalization & standardization link units
                children:
                  - { id: mgr-a1, label: Unit Manager 1, note: Oversees frontline staff }
                  - { id: mgr-a2, label: Unit Manager 2, note: Oversees frontline staff }
              - id: div-b
                label: Division / Regional Lead B
                note: Departmentalized by function, product or place
                children:
                  - { id: mgr-b1, label: Unit Manager 3, note: Oversees frontline staff }
                  - { id: mgr-b2, label: Unit Manager 4, note: Oversees frontline staff }
      - id: r
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Span of control, value: '{=h.spanLabel}' }
            - { label: Hierarchy shape, value: '{=h.shape}', tone: accent }
            - { label: Key trade-off, value: '{=h.tradeoff}', tone: good }
      - id: spanpick
        widget: Choice
        region: side
        hidden: true
        props:
          label: Span of control
          style: dropdown
          options:
            - { value: narrow, label: Narrow span (few direct reports) }
            - { value: wide, label: Wide span (many direct reports) }
        bind: { value: spanDesign }
    beats:
      - say: |
          A **multinational corporation** is a company that runs business operations in more than one country. Getting its
          far-flung units to work together takes **organizational design**: deciding how the company should be organized so
          its worldwide activities fit together efficiently and effectively.
        define: [multinational-corporation, organizational-design]
      - say: |
          Two ways to guide people across borders are rules and sameness. **Formalization** uses rules, policies, procedures
          and budgets to guide how people work. **Standardization** uses the same approach across the different units of a
          company.
        define: [formalization, standardization]
      - say: |
          Size also shapes authority levels. The **span of control** is the number of employees a manager can effectively
          oversee. A **hierarchy** is the arrangement of an organization into levels of authority and responsibility.
        define: [span-of-control, hierarchy]
        gate:
          type: predict
          question: How does a narrow span of control affect an organization's hierarchy compared to a wide span?
          options:
            - It creates a taller hierarchy with more layers of management
            - It flattens the hierarchy into fewer management layers
            - It eliminates the need for formal rules and policies
            - It removes middle management completely
          answer: 0
          explain: When each manager oversees only a few direct reports, the organization needs more layers of management from bottom to top, forming a tall hierarchy.
      - say: |
          A narrow span gives closer supervision per worker but slows communication across layers. Switch the span of control
          in the side menu to see how widening the span reshapes the hierarchy.
        hide: [hier-tree]
        show: [r, spanpick]
        gate:
          type: when
          prompt: Select the span of control that flattens the hierarchy into fewer layers.
          when: "spanDesign == 'wide'"
          hint: Choose Wide span in the Span of control menu.
      - say: |
          Finally, how units are grouped matters. **Departmentalization** groups people and activities into units by
          function, product, service, customer or place to support specialization and cross-unit coordination.
        define: [departmentalization]
        hide: [spanpick]
      - say: Check how span of control shapes the hierarchy.
        gate:
          type: practice
          template: span-mcq
    takeaway: Span of control shapes whether a hierarchy is tall or flat, while rules and grouping organize work.

  - id: who-decides
    title: Who makes the decisions?
    goal: Should headquarters decide everything, or should managers close to the customer decide?
    skills: [decision-allocation]
    state: { allocation: centralized }
    derive:
      - { fn: decisionProfile, in: { allocation: '@allocation' }, out: c }
    stage:
      - id: decision-sched
        widget: Schedule
        props:
          title: Typical decision allocation in wholly owned subsidiaries
          columns: [Headquarters role, Subsidiary role]
          rows:
            - { id: d1, label: Research & development, amounts: [Centralized direction, Local technical feedback] }
            - { id: d2, label: Capital expenditure budgets, amounts: [Approves major investments, Proposes local projects] }
            - { id: d3, label: Marketing & product adaptation, amounts: [Sets global brand guardrails, Adapts to local customers] }
            - { id: d4, label: Personnel & local staffing, amounts: [Appoints top executives, Manages local workforce] }
      - id: r
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Decision approach, value: '{=c.title}' }
            - { label: Primary advantage, value: '{=c.strength}', tone: good }
            - { label: Key risk, value: '{=c.risk}', tone: accent }
      - id: hqpick
        widget: Choice
        region: side
        hidden: true
        props:
          label: Decision allocation
          style: dropdown
          options:
            - { value: centralized, label: Centralized at headquarters }
            - { value: decentralized, label: Decentralized to subsidiaries }
        bind: { value: allocation }
    beats:
      - say: |
          Every important decision is made somewhere. **Centralization** means making decisions at the top level of the
          company, at headquarters. **Decentralization** means letting lower levels, such as foreign subsidiaries, make
          decisions closer to local operations.
        define: [centralization, decentralization]
        gate:
          type: predict
          question: What is a major risk when headquarters centralizes nearly every decision for its foreign subsidiaries?
          options:
            - Subsidiary managers lose motivation and loyalty while local decisions slow down
            - Headquarters loses all ability to set research and capital budgets
            - Subsidiaries automatically become independent external competitors
            - Formal policies and budgets can no longer be written
          answer: 0
          explain: Local managers understand host-country customers and rules best; stripping away their authority saps motivation and slows local adaptation.
      - say: |
          Older, larger multinationals often make more decisions at headquarters because experienced executives accumulate
          there. Use the menu to shift decision-making authority toward the subsidiaries.
        hide: [decision-sched]
        show: [r, hqpick]
        gate:
          type: when
          prompt: Select the decision approach that empowers local subsidiary managers and speeds up local adaptation.
          when: "allocation == 'decentralized'"
          hint: Choose Decentralized to subsidiaries in the Decision allocation menu.
      - say: |
          Whatever the split, units must work together. **Coordination mechanisms** link the activities of different units
          and levels. **Control mechanisms** check performance and results, including formal, informal, output, process and
          social controls.
        define: [coordination-mechanisms, control-mechanisms]
        hide: [hqpick]
      - say: Test how multinationals allocate decisions across levels.
        gate:
          type: practice
          template: central-mcq
      - say: One more thought.
        gate:
          type: reflect
          prompt: Why shouldn't headquarters make every decision for its subsidiaries?
          model: |
            Subsidiary managers know the local culture, customers and rules better. If headquarters decides everything, they lose
            motivation and loyalty, and decisions slow down. Delegating as much as reasonable keeps managers engaged.
    takeaway: Decisions can sit at headquarters or be delegated locally, and every design needs coordination and control.

  - id: structures
    title: Ways to arrange the top
    goal: When a company grows abroad, what are the ways to arrange who reports to whom at the top?
    skills: [structure-types]
    data: [structures]
    state: { structure: product, animFrom: 0, animTo: 1 }
    derive:
      - { fn: structureInfo, in: { structure: '@structure' }, out: s }
    stage:
      - id: struct-note
        widget: Callout
        props:
          kind: note
          title: Organizing the top of a multinational
          body: |
            - **International division:** Separates domestic from all foreign operations as overseas sales begin.
            - **Product structure:** Worldwide product divisions; centralizes product expertise.
            - **Geographic region structure:** Regional heads report to the CEO; focuses on country-level responsiveness.
      - id: r
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Structure, value: '{=structure}' }
            - { label: Strength, value: '{=s.strength}', tone: good }
            - { label: Cost, value: '{=s.weakness}', tone: accent }
      - id: pick
        widget: Choice
        region: side
        hidden: true
        props:
          label: Structure
          style: dropdown
          options:
            - { value: international-division, label: International division }
            - { value: product, label: Product }
            - { value: geographic, label: Geographic region }
            - { value: functional, label: Functional }
            - { value: hybrid, label: Hybrid }
            - { value: matrix, label: Matrix }
        bind: { value: structure }
      - id: anim
        widget: Animation
        region: top
        props:
          src: [assets/anim/org-chart-structures.webm, assets/anim/org-chart-structures.mp4]
          poster: assets/anim/org-chart-structures.poster.jpg
          alt: |
            An HQ box with a row beneath it that re-forms for each structure: Domestic beside an International division; then
            Cars, Batteries and Solar, each with its own row of little globes; then Americas, Europe and Asia, each with its own
            row of little product cubes; then Making, Selling and Finance; then Europe, Asia and a worldwide Product X. Last, a
            matrix: product rows cross region columns, and a manager where Solar meets Asia gets two solid boss lines before
            the region line turns dashed, an overlay that advises rather than a second boss.
          start: '@animFrom'
          end: '@animTo'
          loop: false
          stills: [0.9, 1.9, 2.9, 3.5, 4.1, 4.9, 5.4]
    beats:
      - say: |
          A company that begins selling abroad often adds an **international division**: a unit at the same level as the
          domestic division, responsible for all activities outside the home country. As overseas business grows, it is
          often dropped for something bigger.
        define: [international-division]
      - say: |
          One choice is the **international product structure**: product divisions run their products worldwide. It
          avoids duplicating product experts but duplicates area experts.
        define: [product-structure]
        set: { animFrom: 1, animTo: 2 }
      - say: |
          Another is the **geographic region structure**: area managers run everything in their region and report to the CEO.
          Every country is under someone in contact with headquarters. It suits products with low or stable technology.
        define: [geographic-structure]
        set: { animFrom: 2, animTo: 3 }
        gate:
          type: predict
          question: Which structure avoids duplicating product experts but duplicates area experts?
          options: [Product structure, Geographic region structure, Matrix, International division]
          answer: 0
          explain: A product structure puts product experts in one place but needs area experts in every product division.
      - say: |
          The **global functional structure** is organized by function at the top. Few international companies use it.
          Explore the structures menu to see where it fits best.
        define: [functional-structure]
        set: { animFrom: 3, animTo: 3.6 }
        hide: [struct-note]
        show: [r, pick]
        gate:
          type: when
          prompt: Find the structure that suits a narrow, highly integrated product mix such as oil.
          when: "structure == 'functional'"
          hint: Compare the Strength line across the structures in the menu.
      - say: |
          A **hybrid organizational structure** uses more than one dimension at the top level, often a regional company that adds
          a worldwide product division.
        define: [hybrid-structure]
        set: { animFrom: 3.6, animTo: 4.2 }
      - say: |
          A **matrix organization** layers two or more dimensions, so some managers report to two bosses. A **matrix overlay**
          avoids that: top divisions must listen to a staff of experts from another dimension.
        define: [matrix-organization, matrix-overlay]
        set: { animFrom: 4.2, animTo: 5.5 }
      - say: |
          A **strategic business unit** is a self-contained business with its own market and competitors, small enough for
          one manager to control.
        define: [strategic-business-unit]
        hide: [anim]
      - say: Match structures to their features.
        hide: [pick]
        gate:
          type: practice
          template: structure-match
    takeaway: Each structure organizes the top around a different dimension and has its own strength and cost.

  - id: newer-forms
    title: Newer ways to organize
    goal: What are companies trying instead of tall, rigid hierarchies?
    skills: [structure-types]
    state: { animFrom: 0, animTo: 1.3 }
    stage:
      - id: sorter
        widget: DropBins
        hidden: true
        props:
          check: instant
          shuffle: true
          chips:
            - { id: f1, label: Redesigning structure and systems to improve efficiency }
            - { id: f2, label: Delivering value using resources outside the firm }
            - { id: f3, label: Lateral decisions and a strong shared philosophy }
            - { id: f4, label: Small agile companies coordinated by a small headquarters }
          bins:
            - { id: reeng, label: Reengineering }
            - { id: virtual, label: Virtual corporation }
            - { id: horizontal, label: Horizontal corporation }
            - { id: network, label: Dynamic network }
          solution: { f1: reeng, f2: virtual, f3: horizontal, f4: network }
      - id: anim
        widget: Animation
        region: top
        props:
          src: [assets/anim/newer-org-forms.webm, assets/anim/newer-org-forms.mp4]
          poster: assets/anim/newer-org-forms.poster.jpg
          alt: |
            A tall five-layer pyramid of boxes loses its middle layers and settles into two flat layers (reengineering). Then a
            small teal firm reaches out with dashed lines to a design studio, a factory, a delivery firm and two remote workers,
            all outside it. Then five peers stand in a row, linked side to side, inside one gold ring of shared philosophy
            (horizontal corporation). Last, a small violet headquarters hub links to five little companies around it (dynamic
            network).
          start: '@animFrom'
          end: '@animTo'
          loop: false
          stills: [1.2, 2.5, 3.7, 4.9]
    beats:
      - say: |
          **Reengineering** means redesigning the structure, hierarchy, systems and processes of an organization to make it more
          efficient.
        define: [reengineering]
      - say: |
          A **virtual corporation** delivers value to customers using resources outside the firm's boundaries. Remote work
          and flexible hours, boosted by the pandemic, have helped it grow.
        define: [virtual-corporation]
        set: { animFrom: 1.3, animTo: 2.6 }
        gate:
          type: predict
          question: Which form relies most on resources from outside the firm?
          options: [Virtual corporation, Functional structure, Reengineering, International division]
          answer: 0
          explain: A virtual corporation coordinates economic activity using resources outside its own boundaries.
      - say: |
          A **horizontal corporation** is organized around lateral decision-making, horizontal networks and a strong
          company-wide philosophy. It has been called an anti-organization.
        define: [horizontal-corporation]
        set: { animFrom: 2.6, animTo: 3.8 }
      - say: |
          A **dynamic network structure** splits the main functions into smaller, more agile companies coordinated by a
          downsized headquarters.
        define: [dynamic-network]
        set: { animFrom: 3.8, animTo: 5 }
      - say: Sort the four forms.
        show: [sorter]
        hide: [anim]
        gate:
          type: event
          prompt: Match each description to its form.
          target: sorter
          event: solved
      - say: A check on the forms.
        hide: [sorter]
        gate:
          type: practice
          template: forms-match
    takeaway: Newer forms flatten hierarchies and use networks, flexible work and outside resources.

  - id: strategy-and-culture
    title: Strategy shapes culture
    goal: How does the way a company competes abroad affect how its people think?
    skills: [strategy-culture]
    state: { strategy: multidomestic }
    derive:
      - { fn: cultureFor, in: { strategy: '@strategy' }, out: k }
    stage:
      - id: culture-note
        widget: Callout
        props:
          kind: note
          title: Three mindsets across borders
          body: |
            - **Ethnocentric:** Treats the home country's practices and people as superior.
            - **Polycentric:** Lets each host country run things its own way.
            - **Geocentric:** Adopts the best ideas and talent from anywhere in the world.
      - id: r
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Strategy, value: '{=strategy}' }
            - { label: Culture, value: '{=k.culture}', tone: good }
            - { label: Idea, value: '{=k.idea}', tone: accent }
      - id: pick
        widget: Choice
        region: side
        hidden: true
        props:
          label: Strategy
          style: dropdown
          options:
            - { value: home replication, label: Home replication }
            - { value: multidomestic, label: Multidomestic }
            - { value: transnational, label: Transnational }
        bind: { value: strategy }
    beats:
      - say: |
          Structure follows strategy, and strategy shapes the company's culture. The **home replication strategy** transfers
          existing products and processes to other markets. It leads to an **ethnocentric culture**, one that treats the
          home country's ways as the best.
        define: [home-replication-strategy, ethnocentric-culture]
      - say: |
          The **multidomestic strategy** adapts to local preferences, rules and cultures.
          It leads to a **polycentric culture**, which lets each country follow its own ways.
        define: [multidomestic-strategy, polycentric-culture]
      - say: |
          The **transnational strategy** standardizes when possible and adapts when necessary.
          It leads to a **geocentric culture**, which takes the best practices from anywhere.
        define: [transnational-strategy, geocentric-culture]
        gate:
          type: predict
          question: Which culture goes with a multidomestic strategy?
          options: [Ethnocentric, Polycentric, Geocentric, None]
          answer: 1
          explain: Adapting to each country's ways produces a polycentric culture.
      - say: |
          The **global strategy** offers standardized products and services around the world; the lecture names no culture for
          it. Use the menu to inspect the strategy that pairs with a world-wide best-practices mindset.
        define: [global-strategy]
        hide: [culture-note]
        show: [r, pick]
        gate:
          type: when
          prompt: Find the strategy that produces a Geocentric culture.
          when: "k.culture == 'Geocentric'"
          hint: Use the Strategy menu and watch the Culture line.
      - say: Another strategy.
        hide: [pick]
        gate:
          type: practice
          template: culture-mcq
    takeaway: Home replication goes with an ethnocentric culture, multidomestic with polycentric and transnational with geocentric.

  - id: shifting-profits
    title: Where the profit shows up
    goal: How can one company lower its tax bill simply by changing the internal prices it charges its own units?
    skills: [transfer-pricing]
    data: [transfer]
    state: { pricingPolicy: market, animFrom: 0, animTo: 1 }
    derive:
      - { fn: transferProfile, in: { pricingPolicy: '@pricingPolicy' }, out: t }
    stage:
      - id: tax-sched
        widget: Schedule
        props:
          title: How internal transfer prices affect two subsidiaries
          columns: [High-tax Alpha, Low-tax Beta, Group effect]
          rows:
            - { id: tp1, label: Standard market transfer price, amounts: [High pretax profit & heavy tax bill, Moderate pretax profit & low tax rate, Baseline group after-tax profit] }
            - { id: tp2, label: Beta charges Alpha a higher transfer price, amounts: [Higher input cost & lower taxable profit, Higher revenue & more profit taxed lightly, Higher group after-tax profit; total pretax profit unchanged] }
            - { id: tp3, label: Regulatory response, amounts: [Tax authority audits transfer prices, Scrutinized for profit shifting, Arm's-length rules limit artificial pricing] }
      - id: r
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Pricing policy, value: '{=t.policy}' }
            - { label: Where profit lands, value: '{=t.whereProfit}', tone: accent }
            - { label: Group outcome, value: '{=t.effect}', tone: good }
      - id: pick
        widget: Choice
        region: side
        hidden: true
        props:
          label: Internal pricing policy
          style: dropdown
          options:
            - { value: market, label: Standard market-based internal price }
            - { value: shift-low-tax, label: Higher transfer price charged by low-tax unit }
            - { value: shift-high-tax, label: Lower transfer price charged by low-tax unit }
        bind: { value: pricingPolicy }
      - id: anim
        widget: Animation
        region: top
        hidden: true
        props:
          src: [assets/anim/transfer-pricing.webm, assets/anim/transfer-pricing.mp4]
          poster: assets/anim/transfer-pricing.poster.jpg
          alt: |
            Two island subsidiaries: Alpha (50% tax) earns 60 and Beta (20% tax) earns 40. An invoice flies from Beta to Alpha and
            10 coins of profit move back to Beta; the total tax falls from 38 to 35 while total profit stays 100.
          start: '@animFrom'
          end: '@animTo'
          loop: false
          stills: [1.0, 2.4, 4.2, 5]
    beats:
      - say: |
          A multinational often operates subsidiaries in countries with very different corporate tax rates. **Pretax profit** is
          profit before income tax is taken out, and **after-tax profit** is the profit that remains after income tax is paid.
        define: [pretax-profit, after-tax-profit]
        gate:
          type: predict
          question: When a multinational shifts pretax profit from a high-tax subsidiary to a low-tax subsidiary, what happens to the group's combined after-tax profit?
          options:
            - It rises because a larger share of group profit is taxed at the lower rate
            - It falls because total pretax profit across the group shrinks
            - It stays unchanged because both subsidiaries belong to the same parent
            - It disappears because internal sales are taxed twice at 100%
          answer: 0
          explain: Total pretax profit stays the same, but shifting where profit is booked from a high-tax country to a low-tax country reduces the group's total tax bill.
      - say: |
          Units of one company regularly sell parts and services to each other. **Transfer pricing** sets the prices for goods
          and services sold between units of the same company, and it also shifts where profit shows up.
        define: [transfer-pricing]
        show: [anim]
      - say: |
          Watch how charging high-tax Alpha a higher internal price for supplies from low-tax Beta moves pretax profit across the
          water. The group's total tax bill falls while combined pretax profit remains unchanged.
        set: { animFrom: 1, animTo: 5 }
      - say: |
          Now explore the internal pricing policy menu to see how transfer pricing shifts profit between high-tax Alpha and
          low-tax Beta.
        hide: [tax-sched]
        show: [r, pick]
        gate:
          type: when
          prompt: Select the transfer pricing policy that shifts pretax profit to the low-tax subsidiary and raises group after-tax profit.
          when: "pricingPolicy == 'shift-low-tax'"
          hint: Choose Higher transfer price charged by low-tax unit in the menu.
      - say: Check the logic of transfer pricing and tax differentials.
        hide: [pick, anim]
        gate:
          type: practice
          template: transfer-concept-mcq
      - say: A last question.
        gate:
          type: reflect
          prompt: Should a company be allowed to profit from international transfer pricing?
          model: |
            Shareholders gain from lower taxes, and the company follows the rules. But the countries that lose revenue may feel
            cheated, and the practice can look unfair to rivals who cannot do the same. Governments respond with rules to
            limit it. The debate is open.
    takeaway: Moving profit to the lower-tax unit raises the group's after-tax profit, even though total pretax profit is unchanged.

  - id: control-without-ownership
    title: Control with and without a majority
    goal: Can a company control a business it does not mostly own?
    skills: [control-influence]
    state: { ownershipMode: minority }
    derive:
      - { fn: ownershipProfile, in: { ownershipMode: '@ownershipMode' }, out: o }
    stage:
      - id: r
        widget: Readout
        props:
          items:
            - { label: Ownership position, value: '{=o.position}' }
            - { label: Type of company, value: '{=o.type}', tone: good }
            - { label: Ways to keep control, value: '{=o.tools}', tone: accent }
      - id: share
        widget: Choice
        region: side
        props:
          label: Voting stock position
          style: dropdown
          options:
            - { value: minority, label: Non-majority voting stock }
            - { value: majority, label: Majority voting stock }
        bind: { value: ownershipMode }
      - id: control-note
        widget: Callout
        hidden: true
        props:
          kind: note
          title: Ownership vs. control
          body: |
            - **Majority of voting stock:** Elects a majority of the board of directors, making the unit a subsidiary.
            - **Non-majority voting stock:** No board majority from shares alone; control can still come from management contracts, financing, technology or key executives.
    beats:
      - say: |
          A **subsidiary** is a company controlled by a parent that owns enough voting stock to elect a majority of its
          board. Use the menu to switch the parent's voting stock position.
        define: [subsidiary]
        gate:
          type: when
          prompt: Select the voting stock position that classifies the company as a subsidiary.
          when: "o.type == 'Subsidiary'"
          hint: Choose Majority voting stock in the side menu.
      - say: |
          An **affiliate** is a company the parent controls without being a majority owner. The control may come from stock or
          from other means.
        define: [affiliate]
        hide: [r, share]
        show: [control-note]
        gate:
          type: predict
          question: A parent company controls a foreign partner firm without owning enough voting stock to elect a board majority. What is that firm called?
          options: [Subsidiary, Affiliate]
          answer: 1
          explain: When a parent controls a company without holding majority voting stock, the lecture classifies that company as an affiliate.
      - say: |
          Two common arrangements. A **joint venture** is a business that two or more companies own and run together. A
          **management contract** is an agreement under which one company manages another, which can give control without
          owning the stock.
        define: [joint-venture, management-contract]
        set: { ownershipMode: minority }
        hide: [control-note]
        show: [r]
      - say: Classify how parents control foreign companies.
        gate:
          type: practice
          template: owner-mcq
    takeaway: A majority of voting stock makes a subsidiary, and affiliates can still be controlled by other means.
