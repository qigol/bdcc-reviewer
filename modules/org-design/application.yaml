intro: |
  Organizing a growing multinational means choosing how tall the hierarchy should be, who makes decisions across borders,
  how internal transfer prices are governed, how to keep control of minority ventures and how corporate culture supports
  strategy. This case walks through each choice for an Asian electronics manufacturer.
case:
  id: circuit-maker
  title: A Laguna circuit maker spreads across Asia
  story: |
    Luzon Circuits started with a single semiconductor plant in Laguna and has expanded into a regional network with
    facilities across Southeast and East Asia. Management now faces five organizational design choices: flattening a tall
    management hierarchy, delegating operational decisions to country managers, governing internal transfer prices between
    a low-tax supplier unit (**Beta**) and a high-tax assembly unit (**Alpha**), retaining control over a minority-owned
    joint venture plant in Vietnam, and building a company culture that fits its transnational strategy.
  data: [transfer, structures]
  state:
    spanDesign: narrow
    allocation: centralized
    pricingPolicy: market
    ownershipMode: minority
    strategy: transnational
  derive:
    - { fn: spanProfile, in: { spanDesign: '@spanDesign' }, out: h }
    - { fn: decisionProfile, in: { allocation: '@allocation' }, out: c }
    - { fn: transferProfile, in: { pricingPolicy: '@pricingPolicy' }, out: t }
    - { fn: ownershipProfile, in: { ownershipMode: '@ownershipMode' }, out: o }
    - { fn: cultureFor, in: { strategy: '@strategy' }, out: k }
  cells:
    - id: layers
      title: Flattening a tall hierarchy
      say: |
        Luzon Circuits grew with a narrow span of control, creating many management layers between factory teams and top
        executives. As the firm shifts from an international division to a worldwide structure, vertical approvals have
        become slow and costly.
      stage:
        - id: layers-tree
          widget: Tree
          props:
            orientation: down
            root:
              id: hq-ceo
              label: Luzon Circuits CEO
              note: Reengineering to widen span and remove middle layers
              tone: accent
              children:
                - id: reg-sea
                  label: Southeast Asia Division
                  note: Wider span empowers plant leads
                  children:
                    - { id: laguna, label: Laguna Fabrication Plant, note: Direct reporting }
                    - { id: vietnam, label: Vietnam Assembly Affiliate, note: Direct reporting }
                - id: reg-ea
                  label: East Asia Division
                  note: Standardized quality systems
                  children:
                    - { id: taiwan, label: Wafer Component Unit (Beta), note: Direct reporting }
                    - { id: japan, label: Automotive Packaging Unit (Alpha), note: Direct reporting }
      decision:
        prompt: Management proposes widening the span of control to flatten the hierarchy. What is the likely trade-off?
        type: mcq
        options:
          - Fewer management layers and faster communication, but less supervision time per direct report
          - More management layers and slower communication across the company
          - Complete elimination of formalization and standardization across plants
          - Automatic conversion of all foreign affiliates into wholly owned subsidiaries
        answer: 0
        model: A wider span reduces management layers and speeds up communication, but each manager oversees more people and has less time for each direct report.
    - id: who-decides
      title: Who decides across borders?
      say: |
        Headquarters in Laguna currently centralizes most operational choices alongside R&D and capital budgets. Country
        managers warn that waiting for headquarters sign-off on local staffing and customer adaptations is hurting morale
        and responsiveness.
      stage:
        - id: central-sched
          widget: Schedule
          props:
            title: Reviewing decision authority at Luzon Circuits
            columns: [Current centralized approach, Proposed balanced delegation]
            rows:
              - { id: c1, label: R&D and capital budgets, amounts: [Kept at headquarters, Kept at headquarters] }
              - { id: c2, label: Local customer adaptation, amounts: [Requires headquarters sign-off, Delegated to subsidiary managers] }
              - { id: c3, label: Host-country staffing, amounts: [Directed by headquarters, Delegated with formal & social controls] }
      decision:
        prompt: Why should headquarters delegate more operational decisions to the subsidiaries while keeping coordination and control mechanisms?
        type: open
        model: |
          Subsidiary managers know local customers, regulations and culture best, and stripping away decision authority saps
          their motivation and loyalty. Delegating local operational choices keeps them engaged, while formal and informal
          controls keep units aligned.
    - id: taxes
      title: Transfer pricing and regulatory scrutiny
      say: |
        Subsidiary Beta (in a low-tax jurisdiction) ships wafer components to Subsidiary Alpha (in a high-tax jurisdiction).
        Raising the internal transfer price charged by Beta shifts pretax profit to the low-tax unit and raises the group's
        combined after-tax profit without changing total pretax profit.
      stage:
        - id: tax-sched-case
          widget: Schedule
          props:
            title: Internal transfer pricing trade-offs
            columns: [High-tax Alpha, Low-tax Beta, Group & regulatory impact]
            rows:
              - { id: p1, label: Market-based transfer price, amounts: [Higher taxable earnings, Normal supplier margin, Standard tax bill & low audit risk] }
              - { id: p2, label: High transfer price to shift profit, amounts: [Higher cost & lower taxable profit, More pretax profit taxed lightly, Lower group tax bill but high audit risk] }
      decision:
        prompt: Why might aggressive transfer pricing create serious risks for Luzon Circuits even though it lowers the group's tax bill?
        type: open
        model: |
          Shifting profit out of the high-tax country reduces local government tax revenue and can trigger audits, legal
          challenges and penalties from tax authorities, while also risking reputational harm and distorting internal
          subsidiary performance evaluations.
    - id: venture
      title: Control of the Vietnam plant
      say: |
        In Vietnam, a local partner holds the majority of voting stock while Luzon Circuits holds a minority stake. Because
        Luzon Circuits cannot elect a majority of the board from its shares alone, the plant is an affiliate rather than a
        subsidiary.
      stage:
        - id: owner-r
          widget: Readout
          props:
            items:
              - { label: Ownership position, value: '{=o.position}' }
              - { label: Type of company, value: '{=o.type}', tone: good }
              - { label: Non-majority control tools, value: '{=o.tools}', tone: accent }
      decision:
        prompt: Luzon Circuits wants to protect its manufacturing quality and proprietary processes at the Vietnam affiliate. Which approach should it rely on?
        type: mcq
        options:
          - Retain control of the technology, use a management contract and place key people in executive jobs
          - Rely solely on its minority voting stock to outvote the majority partner on the board
          - Give up all formal and informal control over plant operations
          - Sell its proprietary technology outright to external competitors
        answer: 0
        model: Without a majority of voting stock, a parent can still keep control of an affiliate through a management contract, control of finances or technology, and placing trusted people in key executive jobs.
    - id: culture
      title: What culture comes with the strategy?
      say: |
        Luzon Circuits follows a transnational strategy: standardize core wafer engineering when possible and adapt
        packaging and customer support when necessary. The lecture links that strategy to one specific company culture.
      stage:
        - id: culture-r
          widget: Readout
          props:
            items:
              - { label: Strategy, value: '{=strategy}' }
              - { label: Linked culture, value: '{=k.culture}', tone: good }
              - { label: Core idea, value: '{=k.idea}', tone: accent }
        - id: beyond-note
          widget: Callout
          props:
            kind: beyond
            title: Beyond the slides
            body: While the lecture illustrates organizational restructuring with 3M, this case applies the same design and control frameworks to an Asian semiconductor manufacturer.
      decision:
        prompt: Which company culture fits a transnational strategy, and what does it mean for selecting and promoting managers across subsidiaries?
        type: open
        model: |
          A geocentric culture fits a transnational strategy. It adopts the best practices and talent from anywhere in the
          world, so the company promotes managers based on ability rather than nationality and rotates leaders across countries.
explainBack:
  prompt: |
    Explain to a friend how span of control shapes an organization's hierarchy, why transfer pricing matters to both
    multinationals and governments, and how a parent company can keep control of an affiliate without majority voting stock.
  rubric:
    - Links a wider span of control to a flatter hierarchy with fewer management layers
    - Explains that shifting pretax profit to a lower-tax subsidiary raises the group's combined after-tax profit while attracting government scrutiny
    - Names at least two tools of control without a majority of voting shares (management contract, finances, technology, or key executives)
atScale:
  title: In practice
  body: |
    Large groups document their transfer prices and keep records for tax authorities, since governments scrutinize them.
    Organization charts are revisited every few years, often when a new product line or region is added. Joint venture
    agreements spell out who appoints the managers, who controls technology and how disputes are settled.
tradeoffs:
  title: Structure choices
  columns: [Structure, Strength, Cost]
  rows:
    - [Product, 'Avoids duplicating product experts', 'Duplicates area experts']
    - [Geographic, 'Every country has a manager in touch with headquarters', 'Best for low or stable technology']
    - [Matrix, 'Meshes several dimensions', 'Multiple reporting lines']
