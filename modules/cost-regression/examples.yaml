examples:
  - id: fmc-regression
    source: 'Session 3, slides 20–27 (Examples 1–3)'
    page: 20
    fn: regression
    in: { points: '@fmck.points' }
    expect: { n: 12, sx: 174, sy: 225, sxy: 3414, sx2: 2792, sy2: 4359, xbar: 14.5, ybar: 18.75, num: 1818, den: 3228, b: 0.5632, a: 10.5836, r2: 0.6084, denY: 1683 }
    tol: 0.0005
  - id: fmc-walk
    source: 'Session 3, slides 20–27, count-along'
    fn: regressionWalk
    in: { points: '@fmck.points' }
    expect: { steps: 23, b: 0.5632, a: 10.5836 }
    tol: 0.0005
  - id: fmc-from-sums
    source: 'Session 3, slides 21–25 (the column totals alone)'
    fn: regression
    in: { n: 12, sx: 174, sy: 225, sxy: 3414, sx2: 2792 }
    expect: { num: 1818, den: 3228, b: 0.5632, a: 10.5836 }
    tol: 0.0005
  - id: fmc-predict-15
    source: 'Session 3, slide 28'
    fn: predictLine
    in: { a: 10.5836, b: 0.5632, x: 15 }
    expect: { y: 19.0316 }
    tol: 0.0001
  - id: fmc-predict-20
    source: 'Session 3, slide 28'
    fn: predictLine
    in: { a: 10.5836, b: 0.5632, x: 20 }
    expect: { y: 21.8476 }
    tol: 0.0001
  - id: fmc-predict-10
    source: 'Session 3, slide 28'
    fn: predictLine
    in: { a: 10.5836, b: 0.5632, x: 10 }
    expect: { y: 16.2156 }
    tol: 0.0001
  - id: fmc-r2
    source: 'Session 3, slides 34–35 (Example 4)'
    fn: rSquared
    in: { points: '@fmck.points' }
    expect: { r2: 0.6084, num: 1818, den: 3228, denY: 1683 }
    tol: 0.0001
  - id: fmc-r2-walk
    source: 'Session 3, slides 34–35 (Example 4), count-along'
    fn: r2Walk
    in: { points: '@fmck.points' }
    expect: { steps: 6, r2: 0.6084 }
    tol: 0.0001
  - id: fmc-se
    source: 'Session 3, slides 42–43 (Example 5)'
    fn: standardError
    in: { points: '@fmck.points' }
    expect: { se: 2.3436, band: 4.6873, df: 10, significant: true }
    tol: 0.0005
    note: The deck quotes sₑ = 2.3436 (₱000) and a roughly ±₱4,687 band; s_b and t are computed with the usual formula and are not on the slides.
  - id: fmc-se-walk
    source: 'Session 3, slides 42–43, count-along'
    fn: seWalk
    in: { points: '@fmck.points' }
    expect: { steps: 6 }
  - id: fmc-lines
    source: 'Session 3, slides 12 and 29 (three lines, one dataset)'
    fn: compareLines
    in: { points: '@fmck.points', hlA: 9.1875, hlB: 0.6875, sgA: 6, sgB: 0.8261 }
    expect: { a: 10.5836, b: 0.5632, sseLS: 54.9257 }
    tol: 0.001
  - id: cordillera-sums
    source: 'Session 3, slides 68–69 (Example 9)'
    fn: regression
    in: { n: 5, sx: 1000, sy: 63000, sxy: 13720000, sx2: 225000 }
    expect: { num: 5600000, den: 125000, b: 44.8, a: 3640 }
    tol: 0.001
  - id: cordillera-points
    source: 'Session 3, slides 68–69 (Example 9), from the five months'
    fn: regression
    in: { points: '@cordillera5.points' }
    expect: { sx: 1000, sy: 63000, sxy: 13720000, sx2: 225000, b: 44.8, a: 3640 }
    tol: 0.001
  - id: cordillera-predict
    source: 'Session 3, slides 68–69 (Example 9)'
    fn: predictLine
    in: { a: 3640, b: 44.8, x: '@cordillera5.predictAt' }
    expect: { y: 13496 }
  - id: ads-deviation
    source: 'Simple Linear Regression Illustration.xlsx, sheet 1'
    fn: deviationForm
    in: { points: '@ads10.points' }
    expect: { sxy: 539, sxx: 330, b: 1.633333, a: 15.866667, xbar: 13, ybar: 37.1, sumDevX: 0, sumErr: 0 }
    tol: 0.00001
  - id: ads-regression
    source: 'Simple Linear Regression Illustration.xlsx, sheet 1, by the slides'' sums'
    fn: regression
    in: { points: '@ads10.points' }
    expect: { sx: 130, sy: 371, b: 1.633333, a: 15.866667 }
    tol: 0.00001
  - id: template-regression
    source: 'Simple Linear Regression Illustration.xlsx, sheet 2 (SLOPE, INTERCEPT, RSQ, STEYX)'
    fn: regression
    in: { points: '@template12.points' }
    expect: { b: 3.81118881, a: 46.39393939, r2: 0.996847497, r: 0.998422504, se: 0.810479153 }
    tol: 0.000001
  - id: twovar-multiple
    source: 'Multiple Regression Illustration.xlsx, sheet "Manual Computation"'
    fn: multipleRegression
    in: { xs: '@twovar10.xs', y: '@twovar10.y', names: '@twovar10.names' }
    expect:
      a: 2.228033
      coefs.0: 1.541841
      coefs.1: 3.218619
      r2: 0.995784
      adjR2: 0.994579
      se: 1.051498
      ses.0: 1.136087
      ses.1: 0.616847
      seA: 3.166936
      ts.0: 1.35715
      ts.1: 5.217856
      f: 826.601041
      sse: 7.73954
      ssr: 1827.86046
    tol: 0.00001
  - id: threevar-multiple
    source: 'Multiple Regression Illustration (1).xlsx, sheet "Manual Computation"'
    fn: multipleRegression
    in: { xs: '@threevar12.xs', y: '@threevar12.y', names: '@threevar12.names' }
    expect:
      a: 13.951519
      coefs.0: 2.213725
      coefs.1: 1.410038
      coefs.2: 3.275862
      r2: 0.995095
      adjR2: 0.993255
      se: 1.364295
      ses.0: 1.217865
      ses.1: 0.643684
      ses.2: 1.641852
      seA: 4.636805
      ts.0: 1.81771
      ts.1: 2.190576
      ts.2: 1.995224
      f: 540.97942
      sse: 14.890406
    tol: 0.00001
  - id: baguio-predict
    source: 'Session 3, slides 50–51 (Example 7)'
    fn: predictMulti
    in: { intercept: '@baguio.intercept', coefs: '@baguio.coefs', values: [5000, 40], names: '@baguio.names' }
    expect: { y: 35200 }
  - id: judge-software
    source: 'Session 3, slides 46–47 (Example 6)'
    fn: judgeModel
    in: { r2: 0.42, t: 0.85 }
    expect: { fit: weak, significant: false }
  - id: judge-drivers
    source: 'Session 3, slides 72–73 (Example 11)'
    fn: betterDriver
    in: { r2A: 0.55, tA: 2.3, r2B: 0.81, tB: 5.6 }
    expect: { winner: B }
  - id: range-utilities
    source: 'Session 3, slides 74–75 (Example 12)'
    fn: rangeCheck
    in: { volume: 22000, low: 8000, high: 15000 }
    expect: { inside: false, status: above }
  - id: predict-range
    source: 'Session 3, slides 42–43 (the ±2 sₑ band)'
    fn: predictRange
    in: { a: 10.5836, b: 0.5632, x: 15, se: 2.3436 }
    expect: { y: 19.0316, half: 4.6872, low: 14.3444, high: 23.7188 }
    tol: 0.0001
