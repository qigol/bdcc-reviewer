terms:
  - id: observation
    term: Observation
    short: One recorded case, such as one month's pair of activity and cost. A regression is built from a list of observations.
    related: [scatterplot]
    skills: [least-squares]
  - id: scatterplot
    term: Scatterplot
    aka: [scattergraph]
    short: A graph with one dot for each observation, activity across and cost up, used to see how two numbers move together.
    related: [observation]
    skills: [least-squares]
  - id: independent-variable
    term: Independent variable
    aka: [x, cost driver, predictor]
    short: The activity measure used to explain the cost, such as direct labor hours. It is the x in the formula.
    related: [dependent-variable]
    skills: [least-squares]
  - id: dependent-variable
    term: Dependent variable
    aka: [y]
    short: The cost we want to explain or predict, such as factory overhead. It is the y in the formula and depends on x.
    related: [independent-variable]
    skills: [least-squares]
  - id: regression-analysis
    term: Regression analysis
    aka: [regression]
    short: A statistical method that finds the line that best fits the observations and so estimates how a cost responds to its driver.
    related: [simple-regression, multiple-regression, least-squares]
    skills: [least-squares]
  - id: residual
    term: Residual
    aka: [error, u]
    short: The gap between a month's actual cost and the cost the fitted line predicts for it, written u = y − y′.
    formula: 'u = y - y'''
    related: [least-squares]
    skills: [least-squares]
  - id: least-squares
    term: Least squares
    aka: [method of least squares, least-squares criterion]
    short: The rule that picks the one line whose squared residuals add up to the smallest possible total.
    formula: '\min \sum (y - y'')^2'
    related: [residual, regression-analysis]
    skills: [least-squares]
  - id: mean
    term: Mean
    aka: [average, x̄, ȳ]
    short: The total of a list of numbers divided by how many there are. A bar over a letter, such as x̄, marks a mean.
    formula: '\bar{x} = \frac{\sum x}{n}'
    related: [simple-regression]
    skills: [regression-line]
  - id: simple-regression
    term: Simple regression
    short: A regression with one independent variable, giving a cost formula of the form y′ = a + bx.
    related: [multiple-regression, regression-analysis]
    skills: [regression-line]
  - id: r-squared
    term: R² (coefficient of determination)
    aka: [R-squared, R2, coefficient of determination]
    short: The share of the ups and downs in cost that the fitted line explains, from 0 (none) to 1 (all).
    formula: 'R^2 = \frac{(n\sum xy - \sum x \sum y)^2}{(n\sum x^2 - (\sum x)^2)(n\sum y^2 - (\sum y)^2)}'
    related: [correlation-coefficient, standard-error-of-estimate]
    skills: [r-squared]
  - id: correlation-coefficient
    term: Correlation coefficient
    aka: [r]
    short: A number from −1 to +1 for how strongly and in which direction two variables move together. Its square is R².
    related: [r-squared]
    skills: [r-squared]
  - id: standard-error-of-estimate
    term: Standard error of the estimate
    aka: [sₑ, standard error of the regression]
    short: The typical size of the gap between actual cost and the fitted line, in the same units as the cost.
    related: [residual, t-statistic]
    skills: [standard-error]
  - id: t-statistic
    term: t-statistic
    aka: [t, t-value]
    short: A coefficient divided by its own standard error. A size above about 2 means the coefficient is probably not just noise.
    formula: 't = \frac{b}{s_b}'
    related: [standard-error-of-estimate]
    skills: [t-statistic]
  - id: multiple-regression
    term: Multiple regression
    short: A regression with two or more independent variables, giving a cost formula y′ = a + b₁x₁ + b₂x₂ + …
    related: [simple-regression, multicollinearity]
    skills: [multiple-regression]
  - id: multicollinearity
    term: Multicollinearity
    short: Two or more drivers in a regression that move closely together, so the model cannot tell their separate effects apart.
    related: [multiple-regression]
    skills: [multicollinearity]
  - id: relevant-range
    term: Relevant range
    short: The span of activity covered by the data a cost formula came from. Outside it, the formula is a guess.
    related: [simple-regression]
    skills: [method-choice]
