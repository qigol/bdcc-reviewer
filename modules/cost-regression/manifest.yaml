skills:
  - id: least-squares
    label: The least-squares criterion
    description: Residuals, squaring them, and why one line minimizes the total.
  - id: regression-line
    label: Computing a and b by hand
    description: The regression table, column totals, b from the sums, a from the means.
  - id: r-squared
    label: R² and correlation
    description: The share of cost variation the line explains and how to read it.
  - id: standard-error
    label: The standard error of the estimate
