objectives:
  - id: least-squares
    text: Explain why least squares gives an objective line of best fit and why the errors are squared before they are added.
    skills: [least-squares]
  - id: compute-line
    text: Compute the slope and intercept of a simple regression by hand from a table of observations, and use the line to predict cost.
    skills: [regression-line]
  - id: judge-fit
    text: Read R², the standard error of the estimate and the t-statistic in plain language, and decide whether a model is worth using.
