          - Only if R² is exactly 1
          - Only after doubling the intercept
        answer: 0
        optionFeedback:
          1: Budgeting within the range is exactly what the model is for.
          2: No model fits perfectly; R² below 1 is normal.
          3: There's no reason to change the intercept.
        explanation: Inside the relevant range, the model is fair to use.

