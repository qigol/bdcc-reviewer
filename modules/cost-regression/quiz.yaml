          - Use the model; a high R² holds at any volume
          - Double the estimate for 4,500 parcels
          - Discard the model completely
        answer: 0
        optionFeedback:
          1: Strong statistics hold only inside the data's range.
          2: Doubling assumes the behavior stays linear far outside the range.
