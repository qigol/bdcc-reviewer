  # ------------------------------------------------------------------ new formats (find-error, case, two-tier)
  - id: intercept-find-error
    type: find-error
    skills: [least-squares, regression-line]
    difficulty: 3
    tags: [math]
    generator: regSumsQ
    calculator: true
    lessonRef: { tab: math-code, id: least-squares-fit }
    prompt: |
      An analyst fits a least-squares line to the five months below. **One step is wrong.** Click it and give the correct value.
    show:
      - { id: tbl, widget: Matrix, props: { data: '@table', format: int, rowHeader: Month } }
    steps:
      - 'Σx = {=sx}, Σy = {=sy}, Σxy = {=sxy}, Σx² = {=sx2}, n = {=n}'
      - 'b = (n·Σxy − Σx·Σy) ÷ (n·Σx² − (Σx)²) = {=num} ÷ {=den} = {=b|3}'
      - 'a = ȳ = {=sy} ÷ {=n} = {=ybar|3}'
      - 'The line is y = a + bx'
    wrong: 2
    fix: { var: a, tol: 0.01 }
    fixPrompt: What is the correct intercept a (two decimals)?
    misconceptions:
      - { var: wrongA, feedback: "That's still ȳ alone. The intercept is ȳ − b·x̄." }
    hints:
      - The least-squares line passes through (x̄, ȳ).
      - So a = ȳ − b·x̄, not ȳ.
    explanation: a = ȳ − b·x̄ = {=ybar|3} − {=b|3} × {=xbar|3} = {=a|3}. Using ȳ alone treats the slope as zero.

  - id: regression-case
    type: case
    skills: [least-squares, regression-line, r-squared]
    difficulty: 3
    tags: [math]
    generator: regSumsQ
    lessonRef: { tab: math-code, id: least-squares-fit }
    prompt: |
      **Fit, judge and use a cost line.** The table shows five months of activity x and cost y. Here Σx = {=sx}, Σy = {=sy},
      Σxy = {=sxy}, Σx² = {=sx2} and Σy² = {=sy2}.
    show:
      - { id: tbl, widget: Matrix, props: { data: '@table', format: int, rowHeader: Month } }
    parts:
      - type: numeric
        prompt: Slope b (two decimals)
        answer: { var: b, tol: 0.01 }
        explanation: 'b = {=num} ÷ {=den} = {=b|3}.'
      - type: numeric
        prompt: Intercept a (two decimals)
        answer: { var: a, tol: 0.01 }
        misconceptions:
          - { var: wrongA, feedback: "That's ȳ alone. The intercept is ȳ − b·x̄." }
        explanation: 'a = {=ybar|3} − {=b|3} × {=xbar|3} = {=a|3}.'
      - type: numeric
        prompt: R² (as a decimal, two places)
        answer: { var: r2, tol: 0.01 }
        explanation: 'R² = {=r2|3}: activity explains about {=r2|pct} of the month-to-month variation in cost.'
      - type: numeric
        prompt: Predicted cost at x = {=predictAt} (two decimals)
        answer: { var: predicted, tol: 0.02 }
        misconceptions:
          - { var: wrongNoA, feedback: 'You left out the intercept. y′ = a + bx.' }
        explanation: 'y′ = {=a|3} + {=b|3} × {=predictAt} = {=predicted|3}.'
    hints:
      - Slope first, then the intercept through (x̄, ȳ).
      - R² = (n·Σxy − Σx·Σy)² ÷ [(n·Σx² − (Σx)²)(n·Σy² − (Σy)²)].
    explanation: y = {=a|3} + {=b|3}x with R² = {=r2|3}; at x = {=predictAt} the line predicts {=predicted|3}.

  - id: r2-two-tier
    type: two-tier
    skills: [r-squared, method-choice]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: how-good }
    prompt: Two cost lines fit the same 12 months. Line A uses machine hours (R² = 0.91); line B uses direct labor hours (R² = 0.42). Which driver should the plant use to predict overhead?
    options: [Machine hours, Direct labor hours, Either one; R² says nothing about prediction]
    answer: 0
    reasons:
      - A higher R² means the driver explains more of the variation in cost
      - A lower R² means the line is more conservative
      - R² measures how large the slope is
    reasonAnswer: 0
    optionFeedback:
      1: Labor hours explain under half the variation, so its predictions will miss by more.
      2: R² is exactly a measure of how much of cost's variation the driver accounts for.
    reasonFeedback:
      1: A low R² isn't conservative, just noisier, with bigger prediction errors.
      2: R² is about fit, not slope. A steep line can fit badly.
    hints: [What share of the month-to-month swings does each driver explain?]
    explanation: Machine hours explain about 91% of the variation in overhead and labor hours about 42%, so machine hours give tighter predictions (check the t-statistic and standard error too).

  # ------------------------------------------------------------------ transfer (new settings, several scenarios each)
  - id: transfer-driver-choice
    type: mcq
    skills: [method-choice, r-squared, t-statistic]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: math-code, id: judge-output }
    prompt: 'A hospital laundry tests two drivers for its cost: kilograms washed (R² = 0.88, t = 7.1) and number of beds occupied (R² = 0.52, t = 1.6). Which driver should its cost formula use?'
    options:
      - Kilograms washed
      - Beds occupied
      - Both, averaged
      - Neither; both are too weak
    answer: 0
    optionFeedback:
      1: Beds explain only about half the variation, and t = 1.6 is below 2.
      2: Averaging two formulas has no statistical basis.
      3: Kilograms washed is strong on both measures.
    hints: [Compare R² and check |t| > 2.]
    explanation: Kilograms washed explains far more of the variation and its coefficient is clearly significant.
    variants:
      - prompt: 'A bakery tests oven hours (R² = 0.61, t = 3.0) and flour used (R² = 0.84, t = 5.4) as drivers of its gas cost. Which should it use?'
        options:
          - Flour used
          - Oven hours
          - Neither
          - Both, added together
        answer: 0
        optionFeedback:
          1: Oven hours pass |t| > 2 but explain less.
          2: Both pass |t| > 2; flour used is clearly better.
          3: Adding two correlated drivers invites multicollinearity.
        explanation: Flour used is better on both R² and t.
      - prompt: 'A courier compares parcels delivered (R² = 0.71, t = 1.4, only 6 months of data) with kilometers driven (R² = 0.69, t = 4.8, 24 months). Which driver is more trustworthy?'
        options:
          - Kilometers driven, since its coefficient is clearly significant over more data
          - Parcels delivered, since its R² is higher
          - Parcels delivered, since six months is enough
          - Neither can be judged
        answer: 0
        optionFeedback:
          1: A slightly higher R² doesn't help when t = 1.4 is below 2.
          2: Six months and a weak t make it unreliable.
          3: The t-statistics settle it.
        explanation: R² is similar, but only kilometers driven has a significant coefficient.

  - id: transfer-collinear
    type: two-tier
    skills: [multicollinearity]
    difficulty: 3
    tags: [application]
    lessonRef: { tab: math-code, id: multiple-regression }
    prompt: A water refilling station regresses its cost on gallons sold and on number of customers (which move almost together). The gallons coefficient comes out negative. What should it do?
    options: ['Drop one of the two drivers and re-estimate', 'Keep both; selling more gallons really lowers cost', 'Add a third driver that also moves with gallons']
    answer: 0
    reasons:
      - Highly correlated drivers can't be separated, so coefficients can take impossible signs
      - A negative coefficient proves economies of scale
      - More correlated drivers make the estimates stable
    reasonAnswer: 0
    optionFeedback:
      1: Selling more water doesn't make cost fall; the sign is a symptom.
      2: More correlated drivers make it worse.
    reasonFeedback:
      1: The sign comes from the collinearity, not the business.
      2: Correlated drivers make coefficients unstable.
    hints: [What happens when two drivers move together?]
    explanation: Multicollinearity; keep the driver more directly tied to the cost.
    variants:
      - prompt: A factory regresses overhead on machine hours and labor hours. They are 40% correlated, both coefficients are positive and both |t| > 3. Is multicollinearity a problem?
        options: ['Probably not', 'Yes, always with two drivers', 'Yes, because R² is high']
        answer: 0
        reasons:
          - Moderate correlation with sensible, significant coefficients shows the effects can be separated
          - Any two drivers are always collinear
          - A high R² is itself the warning sign
        reasonAnswer: 0
        optionFeedback:
          1: Two drivers are fine if they don't move together.
          2: A high R² is good; the warning signs are odd signs and unstable coefficients.
        reasonFeedback:
          1: Collinearity needs strongly correlated drivers.
          2: Low R² is a different issue; high R² isn't a warning by itself.
        explanation: With moderate correlation, sensible signs and strong t-values, the model is usable.
      - prompt: A hotel's housekeeping cost model uses rooms occupied and guests (93% correlated). Adding "guests" made the rooms coefficient swing from 410 to 95. What does that suggest?
        options: ['Multicollinearity', 'A better model', 'A data entry error in rooms']
        answer: 0
        reasons:
          - A coefficient that swings when a correlated driver is added is a classic sign
          - Adding drivers always improves coefficients
          - Large swings only come from typos
        reasonAnswer: 0
        optionFeedback:
          1: Unstable coefficients point to collinearity, not a better model.
          2: The swing follows adding the correlated driver, not a typo.
        reasonFeedback:
          1: Adding correlated drivers can make coefficients unreliable.
          2: The pattern matches collinearity.
        explanation: Rooms and guests move together, so their separate effects can't be pinned down.

