      - Use it; the statistics are strong
      - Add the standard error to be safe
      - Reject the model entirely
    answer: 0
    optionFeedback:
      1: "Strong statistics only hold inside the range of the data."
      2: "The standard error measures scatter within the range; it can't fix extrapolation."
      3: "The model is fine inside its range; just don't stretch it to 22,000 hours."
    hints:
      - Which hours did the data come from?
