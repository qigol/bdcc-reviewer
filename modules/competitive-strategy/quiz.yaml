    tags: [math]
    generator: learnQ
    lessonRef: { tab: math-code, id: learning-curve }
    prompt: |
      The first unit costs {=firstCost} dollars, and each time cumulative output doubles, cost per unit falls to {=pct}% of its
      previous level. A planner works out the cost after {=doublings} doublings. **One step is wrong.** Click it.
    steps:
      - 'Each doubling multiplies the cost by {=rate}'
      - 'There are {=doublings} doublings, so the rate is applied once'
      - 'Cost = {=firstCost} × {=rate} = {=wrongOnce|2} dollars'
    wrong: 1
    stepFeedback:
      0: That's right. Falling to {=pct}% means multiplying by {=rate}.
      2: This follows from the step before it. Find where the method first goes wrong.
    hints:
      - How many times should the rate be applied?
    explanation: 'The rate applies once per doubling, so the cost is ${=firstCost} \times {=rate}^{ {=doublings} } = {=cost|2}$ dollars, not {=wrongOnce|2}.'

  - id: planning-parsons
    type: order
    skills: [planning-steps]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: mission-and-goals }
    prompt: Build the steps of global strategic planning from the bank, in the lecture's order. Two lines don't belong in it.
    items:
      - Analyze the external environments
      - Analyze the company's internal environment
      - Define the vision and mission
      - Set corporate objectives
      - Quantify the goals
      - Formulate strategies
      - Make tactical plans
    distractors:
      - Pick the strategy first, then write a mission that fits it
      - Draw up the budget before setting any objectives
    hints:
      - The firm looks outward and inward before it decides where it is going.
      - Objectives come from the mission, and strategies are how to reach them.
    explanation: Environments (external, then internal) → mission and vision → objectives → quantified goals → strategies → tactical plans. Choosing the strategy or the budget before the objectives turns planning upside down.

  - id: strategy-explain
    type: explain
    skills: [strategy-types]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: pick-a-strategy }
    prompt: Explain how a company chooses among the four international strategies.
    model: |
      Two pressures decide it: the pressure to **lower cost** and the pressure to **adapt locally**. With little of either,
      **home replication** keeps development at home and transfers it abroad. Strong pressure to adapt with low cost pressure
      favours **multidomestic**: tailor products to each country. Strong cost pressure with little need to adapt favours
      **global**: standard products made at scale. When both are strong, **transnational** standardizes where it can and
      adapts where it must.
    checklist:
      - Names the two pressures, to lower cost and to adapt locally
      - Low on both → home replication
      - High adapt, low cost → multidomestic; high cost, low adapt → global
      - Both high → transnational
    hints: [Place each strategy in the two-by-two of cost pressure and pressure to adapt.]
    explanation: The mix of cost pressure and pressure to adapt decides among home replication, multidomestic, global and transnational.

