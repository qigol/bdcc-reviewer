  - id: transfer-learning
    type: mcq
    skills: [cost-leadership]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: math-code, id: learning-curve }
    prompt: 'A shipyard''s first hull takes 10,000 labor hours. With an 80% learning curve, how many hours does the hull built after cumulative output doubles twice (the 4th hull) take?'
    options: ['6,400', '8,000', '6,000', '4,096']
    answer: 0
    optionFeedback:
      1: That's after one doubling only.
      2: You subtracted 20% twice from the original instead of multiplying.
      3: That's four doublings, the 16th hull.
    hints: [Multiply by 0.8 once per doubling.]
    explanation: 10,000 × 0.8 × 0.8 = 6,400 hours.
    variants:
      - prompt: 'The first unit costs 500 dollars and each doubling of cumulative output cuts cost to 90%. What does unit 8 cost?'
        options: ['364.5', '450', '405', '365']
        answer: 0
        optionFeedback:
          1: That's after one doubling.
          2: That's after two doublings; unit 8 is three.
          3: Close, but compute 500 × 0.9³ exactly.
        explanation: 500 × 0.9 × 0.9 × 0.9 = 364.5.
      - prompt: Why does a learning curve favour the firm that enters a market first and produces the most?
        options: ['Its cumulative output is highest, so its unit cost is lowest', 'It always pays lower wages', 'It avoids all fixed costs', 'Customers prefer older firms']
        answer: 0
        optionFeedback:
          1: Wages aren't the mechanism.
          2: Fixed costs remain.
          3: Preference isn't a cost effect.
        explanation: More cumulative output means more learning and lower cost.

