intro: |
  Strategy is a chain of choices: how to create value across borders, how to lower unit costs through scale and learning,
  whether to standardize or adapt, how to align headquarters and local plans, and how to prepare for several possible
  futures. This case follows one expanding restaurant chain through all five choices.
case:
  id: burger-chain
  title: A Cebu burger chain goes abroad
  story: |
    Mabuhay Burgers has built a loyal following in the Philippines with its sweet-savory mango-glazed signature burger and
    efficient central commissary kitchens. Now management plans to expand into Southeast Asia and the United States. Abroad,
    the chain faces unfamiliar food safety statutes, distinct local dining customs, strong cost pressure from global
    fast-food rivals, and diverse regional flavor preferences.
  cells:
    - id: where-value
      title: Positioning the value chain across borders
      say: |
        Entering foreign markets exposes Mabuhay Burgers to the liability of foreignness across both formal laws and
        informal dining customs. To create economic value abroad, management must position its value chain to widen the gap
        between buyer willingness to pay and unit cost.
      stage:
        - id: value-tree
          widget: Tree
          props:
            orientation: down
            root:
              id: root-val
              label: Mabuhay Burgers Value Creation
              note: Widening the gap between buyer willingness to pay and unit cost
              tone: good
              children:
                - id: node-primary
                  label: Primary Value Chain Activities
                  note: Menu design, commissary prep, store operations, local marketing
                - id: node-support
                  label: Support Activities
                  note: Ingredient sourcing, IT order systems, crew training
                - id: node-inst
                  label: Host-Country Institutions
                  note: Formal food safety laws and informal local dining norms
      decision:
        prompt: Mabuhay Burgers highlights its unique mango-glazed recipe to lift buyer willingness to pay while keeping commissary costs under control. Which value chain position is it using?
        type: mcq
        options:
          - Product differentiation, widening the value gap from the buyer side while controlling costs
          - Pure cost leadership, ignoring product uniqueness to offer the lowest-quality burger
          - Home replication, refusing to learn formal or informal host-country institutions
          - Liability of newness, raising unit costs above buyer willingness to pay
        answer: 0
        model: Offering a distinctive product that lifts buyer willingness to pay while keeping unit costs under control is product differentiation.
    - id: cheaper-kitchens
      title: Scaling kitchens and transferring know-how
      say: |
        To keep unit costs competitive against global chains, Mabuhay Burgers relies on central commissary kitchens and
        standardized crew training. However, management discovers that mailing written recipe manuals to new overseas teams
        is not enough to reproduce the exact grill timing and sauce consistency of its veteran Cebu chefs.
      stage:
        - id: kitchen-note
          widget: Callout
          props:
            kind: note
            title: Cost drivers and knowledge transfer in the kitchen
            body: |
              - **Economies of scale:** Spreading fixed commissary rent and equipment overhead across more stores in a region.
              - **Learning curve:** Lowering unit waste and prep time as kitchen crews repeat tasks over time.
              - **Explicit vs. tacit knowledge:** Written recipes and manuals (explicit) vs. a veteran grill master's hands-on feel and timing (tacit).
      decision:
        prompt: Why does mailing written manuals fail to replicate kitchen quality immediately, and how do scale and learning work together once stores open?
        type: mcq
        options:
          - Grill timing is tacit knowledge requiring hands-on coaching, while higher store volume spreads fixed commissary overhead (scale) and repetition reduces crew waste over time (learning)
          - Written recipes are tacit knowledge, and economies of scale eliminate variable beef and bun costs completely
          - Explicit manuals cannot be shared across borders, and the learning curve only applies to headquarters executives
          - Fixed commissary rent rises with each burger sold, while learning curves increase assembly errors
        answer: 0
        model: Written recipes transfer explicit knowledge, but hands-on cooking feel is tacit knowledge that requires in-person coaching. Opening more regional stores spreads fixed commissary overhead (economies of scale), while cumulative repetition cuts waste (learning curve).
    - id: adapt-or-not
      title: Adapt the menu or keep it standard?
      say: |
        Across Southeast Asia, dietary norms and flavor preferences vary widely—requiring halal certification in some
        markets and spicier sauces in others—yet global fast-food rivals keep pressure to lower costs intense. Both cost
        pressure and local adaptation pressure are high.
      stage:
        - id: strat-schedule
          widget: Schedule
          props:
            title: Comparing the four international strategies
            columns: [Strategy, Cost pressure, Adaptation pressure, Menu and kitchen approach]
            rows:
              - id: s-home
                label: Home replication
                amounts: [Low, Low, 'Export the exact domestic menu and processes unchanged']
              - id: s-multi
                label: Multidomestic
                amounts: [Low, High, 'Let each country design its own menu and kitchen systems independently']
              - id: s-global
                label: Global
                amounts: [High, Low, 'Sell one uniform menu worldwide from centralized low-cost hubs']
              - id: s-trans
                label: Transnational
                amounts: [High, High, 'Standardize core commissary systems while adapting local menu items']
                style: total
      decision:
        prompt: Which strategy fits Mabuhay Burgers when both cost pressure and local adaptation pressure are high, how should it apply it, and what is the main organizational risk?
        type: open
        model: |
          A transnational strategy fits best: standardize core operations where possible (shared kitchen equipment, procurement,
          and base recipes) to capture scale economies, and adapt where necessary (halal meat sourcing, local side dishes, and
          sauces) to meet local tastes. The main risk is organizational complexity, because coordinating two-way knowledge flows
          between headquarters and country units requires skilled managers and strong alignment.
    - id: budget-next-year
      title: Aligning headquarters goals with local budgets
      say: |
        Corporate headquarters sets a top-down objective to open thirty stores across three countries next year. Country
        managers push back with bottom-up sales forecasts and tactical plans showing that local licensing and crew training
        can realistically support twenty stores without hurting quality.
      stage:
        - id: plan-schedule
          widget: Schedule
          props:
            title: Planning methods and execution control
            columns: [Approach, How it works, Strategic trade-off]
            rows:
              - id: p-top
                label: Top-down planning
                amounts: ['Starts at corporate HQ and flows down to units', 'Fast global alignment, but risks ignoring local constraints']
              - id: p-bottom
                label: Bottom-up planning
                amounts: ['Starts at local operating units and flows up to HQ', 'Realistic local forecasts, but can fragment company goals']
              - id: p-iter
                label: Iterative planning
                amounts: ['Repeats top-down and bottom-up cycles until reconciled', 'Aligns corporate objectives with realistic unit budgets']
                style: subtotal
              - id: p-bsc
                label: Balanced scorecard
                amounts: ['Tracks financial budgets, resources, people, and mission', 'Prevents short-term cost cuts from damaging long-term quality']
                style: total
      decision:
        prompt: How should Mabuhay Burgers reconcile the clash between headquarters' expansion target and the country managers' forecasts, and how should it measure success?
        type: mcq
        options:
          - Use iterative planning to reconcile top-down objectives with bottom-up sales forecasts and budgets, and track progress with a balanced scorecard
          - Force the top-down target without changes and judge managers solely on short-term expense cuts
          - Abandon corporate objectives completely and let each store spend without an itemized budget
          - Replace the sales forecast with a values statement so no financial budgets are needed
        answer: 0
        model: Iterative planning repeats top-down and bottom-up passes until corporate targets and local tactical budgets agree, while a balanced scorecard tracks both financial results and non-financial drivers like crew training and quality.
    - id: futures
      title: Preparing for uncertain futures
      say: |
        Before signing long-term overseas leases, the planning team writes three plausible scenarios—Boom, Steady, and
        Downturn—and lists the actions needed in each. They also worry about a sudden critical shock, such as an immediate
        border freeze on imported specialty ingredients.
      stage:
        - id: scen-callout
          widget: Callout
          props:
            kind: note
            title: Scenario action lists and critical shocks
            body: |
              - **Boom scenario:** `expand-fast`, `hire-local-managers`, `keep-cost-focus`, `build-new-kitchens`
              - **Steady scenario:** `expand-slowly`, `hire-local-managers`, `keep-cost-focus`
              - **Downturn scenario:** `delay-new-stores`, `hire-local-managers`, `keep-cost-focus`
              - **Critical shock event:** Sudden border freeze on imported mango glaze -> trigger pre-arranged local backup supplier (**contingency plan**)
        - id: beyond-note
          widget: Callout
          props:
            kind: beyond
            title: Beyond the slides
            body: The scenario action lists in this case are illustrative examples built to practice the lecture's frameworks. The lecture's real-world international fast-food case is Jollibee.
      decision:
        prompt: Which actions should management execute first across the three scenarios, and how does a contingency plan complement those moves?
        type: open
        model: |
          Management should start immediately with hiring local managers and keeping a cost focus, because those actions appear
          in all three scenarios and carry low regret whichever future unfolds. Moves tied to only one scenario—like fast
          expansion—should wait until trends clarify. Meanwhile, a contingency plan prepares a ready-to-use backup response
          (such as pre-qualifying a local ingredient supplier) in case a sudden, high-impact border shock occurs.
explainBack:
  prompt: |
    Explain to a friend how an international chain chooses among the four global strategies, how it reconciles headquarters
    goals with local operating plans, and why it plans for several futures instead of betting on a single forecast.
  rubric:
    - Names the two pressures (cost reduction and local adaptation) and links them to the four international strategies
    - Explains how iterative planning reconciles top-down objectives with bottom-up tactical plans, forecasts, and budgets
    - Explains how scenario planning identifies robust actions across plausible futures while contingency plans prepare for critical shocks
atScale:
  title: In practice
  body: |
    Large companies run strategic planning as a yearly cycle with quarterly reviews. Corporate teams set objectives, business
    units build bottom-up plans, and both sides iterate until the budgets agree. Many firms use a balanced scorecard to
    track money, customers, internal processes and learning, and they refresh their scenarios each year.
tradeoffs:
  title: Entry strategies compared
  columns: [Strategy, Strength, Weakness]
  rows:
    - [Global, 'Lowest cost through standard products', 'Misses local tastes']
    - [Multidomestic, 'Fits each market', 'Higher cost, less scale']
    - [Transnational, 'Standard where possible, local where needed', 'Hard to coordinate']
