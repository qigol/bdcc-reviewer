scenes:
  - id: why-a-strategy
    title: Why plan at all?
    goal: What makes one company keep winning customers in many countries while others fade?
    skills: [strategy-basics]
    stage:
      - id: tests
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: t1, label: Customers will pay for it }
            - { id: t2, label: Few firms have it }
            - { id: t3, label: Rivals cannot easily copy it }
            - { id: t4, label: It meets a real need }
            - { id: t5, label: No rival offers it }
            - { id: t6, label: It took years of effort to build }
          bins:
            - { id: valuable, label: Valuable }
            - { id: rare, label: Rare }
            - { id: hard, label: Hard to imitate }
          solution: { t1: valuable, t2: rare, t3: hard, t4: valuable, t5: rare, t6: hard }
      - id: note
        widget: Text
        props:
          body: |
            **Three tests of a core competency**

            - **Valuable:** Creates value customers will pay for.
            - **Rare:** Held by few, if any, current or potential rivals.
            - **Hard to imitate:** Costly or slow for rivals to copy or replace.
    beats:
      - say: |
          Netflix saw early that its home market would fill up, so it began expanding abroad in 2010. It tried
          limited-time offers to learn local tastes and partnered to make local content. That was a plan, not luck. An
          **international strategy** is a plan that guides how a firm uses its scarce resources to reach goals abroad.
        define: [international-strategy]
      - say: |
          A good plan builds **competitive advantage**: a unique, valuable position that earns higher profits than rivals.
          What gives a firm that edge?
        define: [competitive-advantage]
        gate:
          type: predict
          question: Which is the better base for a lasting advantage?
          options: [Something rivals can copy in a week, Something rare that rivals find hard to copy, Something every rival already has, Something customers do not want]
          answer: 1
          explain: Lasting advantage needs value that customers pay for, rarity and difficulty to copy.
      - say: |
          Strengths like that are **core competencies**: special strengths that customers value, rivals lack and others
          find hard to copy or replace. Sort the clues under the three tests.
        define: [core-competencies]
        show: [tests]
        hide: [note]
        gate:
          type: event
          prompt: Place each clue under the test it passes.
          target: tests
          event: solved
          hint: Value is about customers; rare is about rivals; hard to imitate is about copying.
      - say: |
          Finally, **strategic planning** is the process by which an organization decides where it is going, how it will get
          there and how it will judge success. It spots opportunities and threats, and gives everyone one picture.
        define: [strategic-planning]
        hide: [tests]
        show: [note]
      - say: Test your grasp of the three core competency tests.
        gate:
          type: practice
          template: competencies-multi
    takeaway: A strategy builds on competencies that are valuable, rare and hard to copy.

  - id: creating-value
    title: Creating value for customers
    goal: When is a product worth making, and how do firms widen the value gap abroad?
    skills: [value-creation]
    state: { approach: baseline, animFrom: 0, animTo: 1 }
    derive:
      - { fn: valuePosition, in: { approach: '@approach' }, out: v }
    stage:
      - id: value-note
        widget: Callout
        props:
          kind: note
          title: How economic value is created and shared
          body: |
            - **Willingness to pay:** The maximum value a buyer places on the product.
            - **Unit cost:** The resources used to design, make, and deliver the product.
            - **Price charged:** Splits the value created between **customer surplus** (above price) and **firm profit** (below price).
      - id: abroad-note
        widget: Callout
        hidden: true
        props:
          kind: note
          title: Competing across borders
          body: |
            - **Liability of foreignness & newness:** Extra costs of operating in an unfamiliar country or industry.
            - **Formal vs. informal institutions:** Written laws and regulations vs. unwritten norms, values and customs.
            - **Value chain:** Linked activities from design to sale, positioned for **cost leadership** or **product differentiation**.
      - id: inst-bins
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: i1, label: National import tariff and food safety statute }
            - { id: i2, label: Local custom of family-style shared meals }
            - { id: i3, label: Mandatory labor contract law }
            - { id: i4, label: Unwritten norm of relationship-building before signing deals }
          bins:
            - { id: formal, label: Formal institutions }
            - { id: informal, label: Informal institutions }
          solution: { i1: formal, i2: informal, i3: formal, i4: informal }
      - id: pos-r
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Strategic lever, value: '{=v.lever}' }
            - { label: Effect on cost, value: '{=v.costEffect}', tone: accent }
            - { label: Effect on buyer value, value: '{=v.wtpEffect}', tone: accent }
            - { label: Value gap outcome, value: '{=v.gapEffect}', tone: good }
      - id: pos-choice
        widget: Choice
        region: side
        hidden: true
        props:
          label: Value chain position
          style: segmented
          options:
            - { value: baseline, label: Standard }
            - { value: cost-leadership, label: Cost leadership }
            - { value: differentiation, label: Differentiation }
        bind: { value: approach }
      - id: anim
        widget: Animation
        region: top
        props:
          src: [assets/anim/value-creation-and-chain.webm, assets/anim/value-creation-and-chain.mp4]
          poster: assets/anim/value-creation-and-chain.poster.jpg
          alt: |
            A dollar column rises with three lines: cost 50 dollars, price 70 and willingness to pay 100. A bracket marks the 50
            dollars of value created, split into 30 the customer keeps and 20 the firm keeps. Then four chevrons, Design, Make,
            Market and Serve, sit on a support bar while a gold value line grows along them. Back on the column, a teal arrow
            pushes cost down (cost leadership) and a gold arrow lifts willingness to pay (differentiation), widening the gap.
          start: '@animFrom'
          end: '@animTo'
          loop: false
          stills: [0.9, 2.1, 3.4, 4.9]
    beats:
      - say: |
          Firms succeed by creating economic value. **Economic value creation** is the gap between what customers are
          willing to pay for a product and what it costs to make. The wider this gap, the stronger the firm's competitive
          position.
        define: [economic-value-creation]
        gate:
          type: predict
          question: If a firm raises its price without changing product quality or production cost, what happens to the total economic value created?
          options:
            - It stays the same, while shifting more of the existing gap from the buyer to the firm
            - It increases because a higher price automatically creates more buyer value
            - It falls to zero because buyers pay more
            - It doubles because revenue per unit rises
          answer: 0
          explain: Total value created depends only on buyer willingness to pay and production cost. Price merely splits that gap between customer surplus and firm profit.
      - say: |
          As the animation shows, the price sits between willingness to pay and cost. Buyers keep the gap above the price as
          surplus, while the firm keeps the gap below the price as profit.
        set: { animFrom: 1, animTo: 2.2 }
      - say: |
          Going abroad adds extra hurdles. The **liability of foreignness** is the extra cost a firm pays simply because it is
          new to a foreign country. The **liability of newness** is the extra cost of entering a market or industry that is
          new to it.
        define: [liability-of-foreignness, liability-of-newness]
        hide: [value-note, anim]
        show: [abroad-note]
      - say: |
          Part of the foreign cost is learning the local rules. **Formal institutions** are written laws and regulations.
          **Informal institutions** are norms, values, customs and beliefs that shape behavior without being written down.
        define: [formal-institutions, informal-institutions]
        hide: [abroad-note]
        show: [inst-bins]
        gate:
          type: event
          prompt: Sort each host-country rule into formal or informal institutions.
          target: inst-bins
          event: solved
          hint: Written statutes and regulations are formal; unwritten customs and social norms are informal.
      - say: |
          Value is built step by step inside the firm. The **value chain** is the linked set of primary and support
          activities—from design and production to marketing and service—that add value to the final product.
        define: [value-chain]
        hide: [inst-bins]
        show: [abroad-note, anim]
        set: { animFrom: 2.2, animTo: 3.5 }
      - say: |
          Firms position their value chain in two main ways: **cost leadership** keeps costs lower than rivals, while
          **product differentiation** offers customers more value than rivals while keeping costs under control.
        define: [cost-leadership, product-differentiation]
        set: { animFrom: 3.5, animTo: 5 }
        hide: [abroad-note]
        show: [pos-r, pos-choice]
        gate:
          type: when
          prompt: Select the value chain position that widens the value gap by lifting buyer willingness to pay.
          when: "approach == 'differentiation'"
          hint: Choose Differentiation to see how superior design or brand lifts buyer willingness to pay.
      - say: Match these core value-creation concepts before moving on.
        hide: [pos-choice, anim]
        gate:
          type: practice
          template: positions-match
    takeaway: Value creation is the gap between willingness to pay and cost, widened by cost leadership or differentiation.

  - id: getting-cheaper
    title: Getting cheaper as you grow
    goal: Why can a large, experienced producer operate at a unit cost that a newcomer cannot match?
    skills: [cost-leadership]
    state: { driver: none, animFrom: 0, animTo: 0.8 }
    derive:
      - { fn: costDriver, in: { driver: '@driver' }, out: d }
    stage:
      - id: scale-note
        widget: Callout
        props:
          kind: note
          title: Two engines of cost leadership
          body: |
            - **Economies of scale:** Larger plant output spreads fixed overhead (rent, machinery, R&D) thinner across more units in a given period.
            - **Learning curve:** Cumulative repetition over time teaches workers and managers how to reduce waste, errors, and assembly time.
      - id: driver-r
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Mechanism, value: '{=d.mechanism}' }
            - { label: How it lowers cost, value: '{=d.source}', tone: accent }
            - { label: Strategic outcome, value: '{=d.outcome}', tone: good }
      - id: driver-choice
        widget: Choice
        region: side
        hidden: true
        props:
          label: Cost driver
          style: segmented
          options:
            - { value: none, label: Small batch }
            - { value: scale, label: Scale economies }
            - { value: learning, label: Learning curve }
        bind: { value: driver }
      - id: cost-bins
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: c1, label: Spreading factory rent over a larger monthly production run }
            - { id: c2, label: Assembly workers making fewer mistakes after building thousands of units }
            - { id: c3, label: Sharing one automated stamping press across global orders }
            - { id: c4, label: Engineers refining workflow steps through years of cumulative experience }
          bins:
            - { id: scale, label: Economies of scale }
            - { id: learning, label: Learning curve }
          solution: { c1: scale, c2: learning, c3: scale, c4: learning }
      - id: anim
        widget: Animation
        region: top
        props:
          src: [assets/anim/economies-of-scale.webm, assets/anim/economies-of-scale.mp4]
          poster: assets/anim/economies-of-scale.poster.jpg
          alt: |
            A block of fixed cost, 20,000 dollars of rent and machines, is sliced onto product boxes over a 5-dollar base: 25
            dollars a unit. As more boxes pour in, up to 4,000, the slices get thinner and the cost per unit falls to 10 dollars.
          start: '@animFrom'
          end: '@animTo'
          loop: false
          stills: [0.8, 2.0, 2.8, 3.6, 5]
    beats:
      - say: |
          Every factory faces fixed overhead—like rent and heavy machinery—plus variable material cost on each unit.
          **Economies of scale** are the fall in average cost per unit as a plant gets larger and output rises.
        define: [economies-of-scale]
        gate:
          type: predict
          question: As a factory expands output tenfold, why does average cost per unit fall without dropping all the way to zero?
          options:
            - Fixed overhead is spread thinner across more units, while the variable cost per unit remains
            - Variable material cost per unit disappears at high volume
            - Fixed factory rent automatically drops to zero when output rises
            - Suppliers give away raw materials for free once output doubles
          answer: 0
          explain: Fixed cost is divided across more units so each box carries a thinner slice of overhead, but every unit still requires its variable material and labor inputs.
      - say: |
          Watch the fixed-cost block slice thinner as more boxes roll down the line. Switch the cost driver to inspect how
          scale economies work.
        set: { animFrom: 0.8, animTo: 5 }
        hide: [scale-note]
        show: [driver-r, driver-choice]
        gate:
          type: when
          prompt: Select Scale economies to see how higher plant volume lowers average unit cost.
          when: "driver == 'scale'"
          hint: Click Scale economies in the side control.
      - say: |
          Repetition over time also makes work cheaper. The **learning curve** is the drop in cost per unit as a firm repeats
          a task or product again and again over time, cutting waste and assembly errors.
        define: [learning-curve]
        hide: [anim]
        gate:
          type: predict
          question: How does the learning curve differ from economies of scale?
          options:
            - The learning curve comes from cumulative repetition over time, whereas economies of scale come from larger output volume in a given period
            - The learning curve only applies to raw material prices, whereas economies of scale apply to worker skill
            - Economies of scale require small plants, whereas the learning curve requires idle machinery
            - They are identical terms for reducing corporate tax rates
          answer: 0
          explain: Scale economies come from spreading fixed overhead over larger volume at a point in time; learning-curve gains come from cumulative experience over time.
      - say: |
          In practice, global cost leaders combine both engines. Sort each factory advantage into economies of scale or the
          learning curve.
        hide: [driver-r, driver-choice]
        show: [cost-bins]
        gate:
          type: event
          prompt: Place each example under the cost driver it illustrates.
          target: cost-bins
          event: solved
          hint: Overhead spread across volume is scale; skill and workflow mastery from cumulative repetition is learning.
      - say: Check your intuition on economies of scale.
        hide: [cost-bins]
        show: [scale-note]
        gate:
          type: practice
          template: scale-mcq
    takeaway: Bigger output spreads fixed overhead across units, while cumulative repetition lowers cost through the learning curve.

  - id: pick-a-strategy
    title: Standardize or adapt?
    goal: Should a company sell the same thing everywhere or change it for every country?
    skills: [strategy-types]
    data: [strategies]
    state: { cost: low, adapt: low, animFrom: 0, animTo: 0.6 }
    derive:
      - { fn: chooseStrategy, in: { cost: '@cost', adapt: '@adapt' }, out: s }
    stage:
      - id: pressures-note
        widget: Callout
        props:
          kind: note
          title: Two pressures on international firms
          body: |
            - **Pressure to lower cost:** Pushes the firm to standardize products and concentrate production in the lowest-cost locations.
            - **Pressure to adapt locally:** Pushes the firm to tailor products, marketing and delivery to each country's tastes and rules.
      - id: r
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Cost pressure, value: '{=cost}' }
            - { label: Pressure to adapt, value: '{=adapt}' }
            - { label: Strategy, value: '{=s.strategy}', tone: good }
            - { label: Strategic focus, value: '{=s.focus}', tone: accent }
            - { label: Knowledge flow, value: '{=s.knowledgeFlow}' }
      - id: costpick
        widget: Choice
        region: side
        hidden: true
        props:
          label: Cost pressure
          style: segmented
          options:
            - { value: low, label: Low }
            - { value: high, label: High }
        bind: { value: cost }
      - id: adaptpick
        widget: Choice
        region: side
        hidden: true
        props:
          label: Pressure to adapt
          style: segmented
          options:
            - { value: low, label: Low }
            - { value: high, label: High }
        bind: { value: adapt }
      - id: anim
        widget: Animation
        region: top
        props:
          src: [assets/anim/four-strategies-grid.webm, assets/anim/four-strategies-grid.mp4]
          poster: assets/anim/four-strategies-grid.poster.jpg
          alt: |
            A two-by-two grid with cost pressure rising up the side and pressure to adapt along the bottom. The low-low cell
            lights teal: one product copied from home to abroad (home replication). The low-cost, high-adapt cell lights violet:
            three differently shaped products (multidomestic). A question mark pulses in the high-cost, low-adapt cell, which
            then lights gold: the same product around a globe (global). Last, the high-high cell lights coral: a standard core
            linked both ways to local variants (transnational).
          start: '@animFrom'
          end: '@animTo'
          loop: false
          stills: [0.55, 1.3, 2.1, 2.7, 3.7, 4.9]
    beats:
      - say: |
          Two forces pull an international firm in opposite directions. Pressure to cut costs favors selling the same
          thing everywhere. Pressure to adapt favors changing it for each market. The mix decides the strategy.
      - say: |
          With little of either pressure, a firm can use a **home replication strategy**: keep product development at home
          and transfer existing products and processes abroad.
        define: [home-replication-strategy]
        set: { animFrom: 0.6, animTo: 1.4 }
      - say: |
          When local markets want changes and cost pressure is low, the **multidomestic strategy** adapts products and
          services to each market.
        define: [multidomestic-strategy]
        set: { animFrom: 1.4, animTo: 2.2 }
      - say: |
          When cost pressure is strong and adaptation is limited, the **global strategy** offers standard products worldwide
          and uses the best locations to cut costs.
        define: [global-strategy]
        set: { animFrom: 2.2, animTo: 2.8 }
        gate:
          type: predict
          question: Cost pressure is high and pressure to adapt is low. Which strategy fits?
          options: [Home replication, Multidomestic, Global, Transnational]
          answer: 2
          explain: Strong cost pressure and little need to adapt point to a global strategy.
      - say: |
          When both pressures are strong, the **transnational strategy** standardizes when possible and adapts when necessary.
          It can also open a **blue ocean strategy**: creating a new market space with little competition.
        define: [transnational-strategy, blue-ocean-strategy]
        set: { animFrom: 2.8, animTo: 5 }
        hide: [pressures-note]
        show: [r, costpick, adaptpick]
        gate:
          type: when
          prompt: Use the buttons to set the pressures that call for a Transnational strategy.
          when: "s.strategy == 'Transnational'"
          hint: Set both Cost pressure and Pressure to adapt to High.
      - say: Match all four international strategies to their core ideas.
        hide: [costpick, adaptpick, anim]
        gate:
          type: practice
          template: strategy-match
      - say: A thought to finish.
        gate:
          type: reflect
          prompt: If a transnational strategy fits both pressures, why not use it everywhere?
          model: |
            It is hard to run. It asks a firm to standardize and adapt at once, which needs strong coordination, more
            information and more skilled managers. When only one pressure is strong, a simpler strategy can cost less.
    takeaway: Cost pressure and pressure to adapt together decide which of four strategies fits.

  - id: mission-and-goals
    title: Saying where you are going
    goal: How does a company tell its people what it stands for and what it aims to achieve?
    skills: [planning-steps]
    stage:
      - id: hierarchy-tree
        widget: Tree
        props:
          orientation: down
          root:
            id: root-mission
            label: Mission, Vision & Values
            note: Purpose, future aspiration, and core beliefs
            tone: accent
            children:
              - id: node-obj
                label: Corporate Objectives
                note: Measurable targets across organizational levels
                children:
                  - id: node-strat
                    label: Competitive Strategy
                    note: Home replication, Multidomestic, Global, or Transnational
                  - id: node-tactical
                    label: Tactical Plans & Budgets
                    note: Forecasts, itemized budgets, and balanced scorecard
      - id: statements
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: m1, label: 'To organize the world''s information and make it universally accessible and useful' }
            - { id: m2, label: 'We act with integrity, mutual respect and fairness in every community we serve' }
            - { id: m3, label: 'Grow foreign sales by 15% this year' }
          bins:
            - { id: mission, label: Mission statement }
            - { id: values, label: Values statement }
            - { id: objective, label: Objective }
          solution: { m1: mission, m2: values, m3: objective }
      - id: knowledge
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: k1, label: A master chef's feel for when a dish is ready }
            - { id: k2, label: A written recipe }
            - { id: k3, label: A standard operating manual }
            - { id: k4, label: A negotiator's sense of when to stay quiet }
          bins:
            - { id: tacit, label: Tacit knowledge }
            - { id: explicit, label: Explicit knowledge }
          solution: { k1: tacit, k2: explicit, k3: explicit, k4: tacit }
      - id: direction-note
        widget: Callout
        hidden: true
        props:
          kind: note
          title: Direction and knowledge
          body: |
            - **Mission, vision & values:** Define purpose, future aspiration and core beliefs.
            - **Objectives:** Measurable targets that become more specific at each level of the firm.
            - **Explicit vs. tacit knowledge:** Written manuals and procedures vs. experience that is hard to put into words.
    beats:
      - say: |
          The planning steps start by looking at the outside world and the firm's own strengths. Then comes direction. A
          **mission statement** says the organization's purpose and scope. Google's is to organize the world's
          information and make it universally accessible and useful.
        define: [mission-statement]
      - say: |
          A **vision statement** describes the future position the firm wants if it builds the right strengths.
          A **values statement** says the beliefs and priorities members should live by, such as acting with integrity and mutual respect.
        define: [vision-statement, values-statement]
      - say: |
          Then come **objectives**: measurable goals that direct the firm within its mission and vision, becoming more
          specific at the operating level, such as growing foreign sales this year.
        define: [objectives]
        hide: [hierarchy-tree]
        show: [statements]
        gate:
          type: event
          prompt: Sort the three statements into the right bins.
          target: statements
          event: solved
          hint: Purpose and scope is the mission; core beliefs are values; a measurable target is an objective.
      - say: |
          Strategy also depends on what the firm knows. **Knowledge management** is the practice of finding, creating,
          sharing and using valuable knowledge. **Tacit knowledge** is hard to put into words or manuals, while
          **explicit knowledge** is easy to write down and share.
        define: [knowledge-management, tacit-knowledge, explicit-knowledge]
        hide: [statements]
        show: [direction-note]
        gate:
          type: predict
          question: Which kind of knowledge is easier to share with a new employee across borders?
          options: [Explicit knowledge that can be written down, Tacit knowledge that is hard to put into words]
          answer: 0
          explain: Explicit knowledge you can write down or draw can be passed on easily. Tacit knowledge is much harder to transfer.
      - say: Sort the four examples into tacit or explicit knowledge.
        hide: [direction-note]
        show: [knowledge]
        gate:
          type: event
          prompt: Sort each example into tacit or explicit.
          target: knowledge
          event: solved
      - say: One last question.
        hide: [knowledge]
        show: [direction-note]
        gate:
          type: reflect
          prompt: Why does the lecture emphasize setting measurable objectives rather than vague aspirations?
          model: |
            Measurable targets can be verified. They tell managers clearly what to aim for, let business units align their
            tactical plans, and make it obvious whether the strategy is succeeding. Vague aspirations cannot be tested.
    takeaway: Mission, vision, values and objectives set direction, and knowledge is a resource to manage.

  - id: plan-and-budget
    title: From plan to budget
    goal: How does a high-level strategy turn into operational action and multi-dimensional control?
    skills: [budgeting]
    state: { lens: financial-only }
    derive:
      - { fn: scorecardLens, in: { lens: '@lens' }, out: sc }
    stage:
      - id: execution-schedule
        widget: Schedule
        props:
          title: Turning strategy into operational execution
          columns: [Tool, Strategic role, Primary focus]
          rows:
            - id: row-tactical
              label: Tactical plan
              amounts: ['Spells out detailed operational actions to reach objectives', 'Short-term execution steps']
            - id: row-forecast
              label: Sales forecast
              amounts: ['Predicts future customer demand by market', 'Anchors staffing and inventory']
            - id: row-budget
              label: Budget
              amounts: ['Itemizes projected income and spending', 'Allocates resources and controls cost']
            - id: row-scorecard
              label: Balanced scorecard
              amounts: ['Tracks strategy with financial and non-financial measures', 'Money, resources, people & mission']
              style: total
      - id: tactical-bins
        widget: DropBins
        hidden: true
        props:
          check: instant
          chips:
            - { id: b1, label: Step-by-step rollout schedule for opening ten regional stores }
            - { id: b2, label: Projection of next year's expected unit demand by country }
            - { id: b3, label: Itemized schedule of projected store revenues and operating expenses }
            - { id: b4, label: Dashboard tracking financial returns, employee training, and mission milestones }
          bins:
            - { id: tactical, label: Tactical plan }
            - { id: forecast, label: Sales forecast }
            - { id: budget, label: Budget }
            - { id: scorecard, label: Balanced scorecard }
          solution: { b1: tactical, b2: forecast, b3: budget, b4: scorecard }
      - id: lens-r
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Control scope, value: '{=sc.scope}' }
            - { label: Strategic blind spot, value: '{=sc.blindSpot}', tone: accent }
            - { label: Alignment level, value: '{=sc.alignment}', tone: good }
      - id: lens-choice
        widget: Choice
        region: side
        hidden: true
        props:
          label: Performance lens
          style: segmented
          options:
            - { value: financial-only, label: Financial only }
            - { value: balanced-scorecard, label: Balanced scorecard }
        bind: { value: lens }
    beats:
      - say: |
          A strategy is useless until it is turned into daily action. A **tactical plan** (or operational plan) spells out
          in detail how corporate objectives will be reached on the ground.
        define: [tactical-plan]
      - say: |
          To fund those actions, managers start with a **sales forecast**—a prediction of future sales—and build a
          **budget**, which is an itemized projection of income and spending for a future period.
        define: [sales-forecast, budget]
        gate:
          type: predict
          question: Why does a firm prepare its sales forecast before finalizing its operating budget?
          options:
            - Expected sales volume determines the production, staffing, and marketing resources the budget must allocate
            - Operating budgets only record historical tax payments from ten years ago
            - Sales forecasts are legally required to be identical across every competitor
            - Budgets are only written after all spending for the year is finished
          answer: 0
          explain: A sales forecast estimates future revenue and volume, which drives how much production, staffing, and marketing spending the itemized budget needs to fund.
      - say: |
          Each execution tool plays a distinct role in translating goals into action. Sort the four management artifacts into
          the right category.
        hide: [execution-schedule]
        show: [tactical-bins]
        gate:
          type: event
          prompt: Place each artifact under the execution tool it represents.
          target: tactical-bins
          event: solved
          hint: Action steps are tactical plans; demand predictions are forecasts; income/spending schedules are budgets; multi-measure dashboards are balanced scorecards.
      - say: |
          Success is not only about short-term money. A **balanced scorecard** measures strategy success with several kinds
          of measures—including resources, people, and progress toward the mission.
        define: [balanced-scorecard]
        hide: [tactical-bins]
        show: [lens-r, lens-choice]
        gate:
          type: when
          prompt: Switch the performance lens to Balanced scorecard to see how it closes the blind spots of financial-only control.
          when: "lens == 'balanced-scorecard'"
          hint: Select Balanced scorecard in the side panel.
      - say: Match the four execution and control tools to their strategic functions.
        hide: [lens-choice]
        show: [execution-schedule]
        gate:
          type: practice
          template: budget-tools-match
    takeaway: Tactical plans, sales forecasts, budgets, and balanced scorecards turn objectives into coordinated action and control.

  - id: imagining-futures
    title: Preparing for several futures
    goal: How can a company plan when nobody knows what will happen next?
    skills: [scenarios]
    data: [scenarios]
    state: { method: top-down, animFrom: 0, animTo: 1.3 }
    derive:
      - { fn: planningFlow, in: { method: '@method' }, out: pf }
    stage:
      - id: stories-card
        widget: Callout
        props:
          kind: note
          title: Three scenarios for the restaurant chain
          body: |
            - **Boom:** `expand-fast`, `hire-local-managers`, `keep-cost-focus`, `build-new-kitchens`
            - **Steady:** `expand-slowly`, `hire-local-managers`, `keep-cost-focus`
            - **Downturn:** `delay-new-stores`, `hire-local-managers`, `keep-cost-focus`
      - id: planning-note
        widget: Callout
        hidden: true
        props:
          kind: note
          title: How plans move through the firm
          body: |
            - **Contingency plan:** Prepared in advance for a critical, high-impact event.
            - **Top-down vs. bottom-up planning:** Starts at top management and flows down, or starts at operating units and flows up.
            - **Iterative planning:** Repeats top-down and bottom-up cycles until differences are reconciled.
      - id: flow-r
        widget: Readout
        hidden: true
        props:
          items:
            - { label: Where planning starts, value: '{=pf.origin}' }
            - { label: Primary strength, value: '{=pf.strength}', tone: accent }
            - { label: Main risk, value: '{=pf.risk}' }
            - { label: Levels reconciled, value: '{=pf.reconciled}', tone: good }
      - id: flow-choice
        widget: Choice
        region: side
        hidden: true
        props:
          label: Planning direction
          style: segmented
          options:
            - { value: top-down, label: Top-down }
            - { value: bottom-up, label: Bottom-up }
            - { value: iterative, label: Iterative }
        bind: { value: method }
      - id: anim
        widget: Animation
        region: top
        props:
          src: [assets/anim/scenarios-and-planning.webm, assets/anim/scenarios-and-planning.mp4]
          poster: assets/anim/scenarios-and-planning.poster.jpg
          alt: |
            From a "Today" dot three paths fan out, Boom, Steady and Downturn, each filling with its action chips. Then the two
            actions found on every path, hire local managers and keep cost focus, turn gold: two in every story. A dashed side
            branch leads to a contingency plan whose switch flips on. Next, a firm drawn as boxes from top to units: a coral
            arrow runs down (top-down) and a teal arrow runs up (bottom-up). Last, a gold dot circles the whole firm twice:
            iterative planning.
          start: '@animFrom'
          end: '@animTo'
          loop: false
          stills: [1.2, 2.5, 3.7, 4.9]
    beats:
      - say: |
          The future is uncertain, so firms tell several stories about it. A **scenario** is one plausible story about how
          the future might unfold. A fast-food chain pictures a boom, a steady path and a downturn.
        define: [scenario]
        gate:
          type: predict
          question: Look at the three scenario lists on stage. Which actions appear across all three stories?
          options:
            - Hiring local managers and keeping a cost focus
            - Expanding fast and building new kitchens
            - Delaying new stores and expanding slowly
            - Building new kitchens and delaying new stores
          answer: 0
          explain: Hire-local-managers and keep-cost-focus appear in all three lists, making them robust moves whichever future unfolds.
      - say: |
          Actions that appear in every story (`hire-local-managers` and `keep-cost-focus`) are safe no-regret moves to start
          now. Some sudden shocks could also badly hurt the firm: a **contingency plan** is prepared in advance for a
          critical event with a severe impact.
        define: [contingency-plan]
        set: { animFrom: 1.3, animTo: 2.6 }
      - say: |
          Plans can also move through the organization in different directions. **Top-down planning** begins at the highest
          level and moves down. **Bottom-up planning** begins at the lowest operating level and moves up.
        define: [top-down-planning, bottom-up-planning]
        set: { animFrom: 2.6, animTo: 3.8 }
        hide: [stories-card]
        show: [planning-note, flow-r, flow-choice]
      - say: |
          When headquarters and local units disagree, **iterative planning** repeats the top-down and bottom-up cycles until
          all differences between levels are settled.
        define: [iterative-planning]
        set: { animFrom: 3.8, animTo: 5 }
        gate:
          type: when
          prompt: Select the planning direction that reconciles headquarters goals with local operating insight.
          when: "method == 'iterative'"
          hint: Choose Iterative in the side control.
      - say: Put the steps of scenario planning in order.
        hide: [flow-choice, anim]
        gate:
          type: practice
          template: scenario-order
      - say: A last thought.
        gate:
          type: reflect
          prompt: Why look for actions that appear in all the scenarios instead of betting on the most likely one?
          model: |
            Nobody can be sure which story will come true. Actions that fit every story are safe whichever future arrives,
            while a bet on one scenario can fail badly if another happens.
    takeaway: Scenarios help a firm find actions that are safe in every possible future.
