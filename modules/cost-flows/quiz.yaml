  - id: applied-explain
    type: explain
    skills: [pohr-apply, je-cycle]
    difficulty: 2
    tags: [journal]
    lessonRef: { tab: math-code, id: reeder-entries }
    prompt: Explain why Work in Process is debited with **applied** overhead, while the actual overhead bills are debited to Manufacturing Overhead.
    model: |
      Actual overhead (utilities, indirect labor, depreciation) arrives in bills over the year and can't be traced to jobs, so it
      collects as debits in the Manufacturing Overhead control account. Jobs need a cost as they're worked on, so WIP is debited
      with applied overhead, the predetermined rate × each job's base, and Manufacturing Overhead is credited. At year-end the
      account's balance is the under- or overapplied amount, which is closed out.
    checklist:
      - Actual overhead is collected in Manufacturing Overhead as bills arrive
      - Jobs are charged applied overhead (rate × base) in WIP
      - The applied amount is credited to Manufacturing Overhead
      - The leftover balance is under/overapplied and is closed at year-end
    hints: [Which overhead amount is known while the job is being made?]
    explanation: Actual costs collect in the control account; jobs get the applied estimate; the difference is settled at year-end.

