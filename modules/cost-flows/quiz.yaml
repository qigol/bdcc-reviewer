templates:
  # ------------------------------------------------------------------ cost terms
  - id: classify-match
    type: match
    skills: [cost-terms]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: cost-vocabulary }
    prompt: Match each cost of a furniture maker to its classification.
    pairs:
      - ['Narra lumber built into a cabinet', 'Direct materials']
      - ['Wages of the carpenter who builds the cabinet', 'Direct labor']
      - ['Depreciation on the factory saws', 'Manufacturing overhead']
      - ['Commissions paid to the showroom staff', 'Selling (period) cost']
      - ['Salary of the company accountant', 'Administrative (period) cost']
    explanation: Traceable factory inputs are DM and DL; other factory costs are overhead; selling and administrative costs are period costs.

  - id: costeq-numeric
    type: numeric
    skills: [cost-terms]
    difficulty: 1
    tags: [math]
    generator: costEqQ
    lessonRef: { tab: math-code, id: cost-terms }
    prompt: |
      A regression of factory utilities on direct labor hours gave an intercept of {=intercept|money} and a slope of
      {=slope|money2} per hour. Predict utilities cost for a month with {=x|comma} direct labor hours.
    answer: { var: y, tol: 0.5 }
    hints:
      - The cost equation is $Y = a + bX$.
      - Multiply the slope by the hours, then add the intercept.
    explanation: '$Y = {=intercept|comma} + {=slope|2f} \times {=x|comma} = {=y|money}$.'

  - id: mixed-mcq
    type: mcq
    skills: [cost-terms]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: cost-vocabulary }
    prompt: 'A regression gives factory utilities = ₱25,000 + ₱8.50 per direct labor hour, with R² = 0.89. How should utilities be classified, and what does R² say?'
    options:
      - Mixed; hours explain 89% of the variation in utilities cost
      - Variable; 89% of utilities cost is variable
      - Fixed; the intercept is larger than the slope
      - Mixed; utilities will be within 89% of the prediction every month
    answer: 0
    optionFeedback:
      1: "R² isn't the variable share. The intercept is fixed, so the cost is mixed."
      2: "Any positive slope makes part of the cost variable; comparing intercept and slope sizes means nothing."
      3: "R² is the share of variation explained, not a promise about each month's error."
    hints: [Look for a fixed part and a variable part in the equation.]
    explanation: A positive intercept (fixed) and a positive slope (variable) make the cost mixed. R² measures how much of the variation the hours explain.

  - id: prime-conv-multi
    type: multi
    skills: [cost-terms]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: math-code, id: cost-terms }
    prompt: Which statements are true? Select all that apply.
    options:
      - Direct labor is part of both prime cost and conversion cost
      - Prime cost plus conversion cost equals total manufacturing cost
      - Manufacturing overhead is a product cost
      - Advertising is a period cost
    answer: [0, 2, 3]
    optionFeedback:
      0: "Yes: DL appears in prime (DM + DL) and in conversion (DL + MOH)."
      1: "Adding them counts direct labor twice. Total manufacturing cost is DM + DL + MOH."
      2: "Yes: overhead is part of making the product."
      3: "Yes: advertising is a selling cost, expensed in the period."
    hints: [Write out what each total contains.]
    explanation: Prime (DM + DL) and conversion (DL + MOH) overlap in direct labor, so adding them double-counts it. Overhead is a product cost; advertising is a period cost.

  # ------------------------------------------------------------------ POHR and the documents
  - id: pohr-numeric
    type: numeric
    skills: [pohr-apply]
    difficulty: 1
    tags: [math]
    generator: pohrQ
    lessonRef: { tab: math-code, id: pohr-apply }
    prompt: |
      A company estimates {=budgetOH|money} of manufacturing overhead and {=budgetMH|comma} machine-hours for the year. A
      job uses {=dm|money} of direct materials, {=dl|money} of direct labor and {=jobMH|comma} machine-hours. What is the
      job's total cost?
    answer: { var: total, tol: 0.5 }
    hints:
      - The rate is estimated overhead ÷ estimated machine-hours.
      - Add DM, DL and the rate × the job's machine-hours.
    explanation: 'Rate $= {=budgetOH|comma} \div {=budgetMH|comma} = ₱{=rate}$ per MH; overhead $= {=jobMH|comma} \times {=rate} = {=oh|money}$; total $= {=total|money}$.'

  - id: why-estimate-mcq
    type: mcq
    skills: [pohr-apply]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: documents-to-sheet }
    prompt: Why is overhead applied with a rate set before the year begins rather than with actual overhead?
    options:
      - Managers need job costs immediately, and actual rates would swing from month to month
      - Because actual overhead can never be measured
      - Because the tax authorities require estimated rates
      - Because estimated overhead is always more accurate than actual
    answer: 0
    optionFeedback:
      1: "Actual overhead can be measured; it just arrives too late and swings month to month."
      2: "It's a management choice, not a tax rule."
      3: "Actual overhead is the true total. Estimates win on timing and stability, not accuracy."
    hints: [Think about timing, and about seasonal costs.]
    explanation: Two reasons. Waiting until year end is too late to price jobs, and actual monthly rates would vary with random changes in activity.

  - id: docs-order
    type: order
    skills: [pohr-apply]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: math-code, id: job-documents }
    prompt: Put the documents of a job-order costing system in the order they are used.
    items:
      - Sales order
      - Production order
      - Materials requisitions and time tickets
      - Job cost sheet
    explanation: The sales order triggers a production order; requisitions, time tickets and the overhead rate then feed the job cost sheet.

  - id: ticket-mcq
    type: mcq
    skills: [pohr-apply]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: math-code, id: job-documents }
    prompt: A machinist's time ticket shows 6 hours on Job 31, 1 hour on Job 34 and 1 hour cleaning machines, all at ₱80. How is the day's ₱640 recorded?
    options:
      - ₱560 to Work in Process (₱480 to Job 31, ₱80 to Job 34) and ₱80 to Manufacturing Overhead
      - All ₱640 to Job 31, the main job of the day
      - ₱640 to Manufacturing Overhead, to be applied later
      - ₱480 to Job 31 and ₱160 to Manufacturing Overhead
    answer: 0
    optionFeedback:
      1: "Each job gets its own hours; Job 34 and the cleaning hour don't belong to Job 31."
      2: "Hours worked on specific jobs are direct labor charged to WIP, not overhead."
      3: "The hour on Job 34 is direct labor for Job 34; only the cleaning hour is overhead."
    hints: [Which hours can be traced to a specific job?]
    explanation: Hours on jobs are direct labor charged to those jobs; the cleaning hour is indirect labor, part of overhead.

  # ------------------------------------------------------------------ the journal entries
  - id: entry-je-1
    type: journal-entry
    skills: [je-cycle]
    difficulty: 1
    tags: [journal]
    generator: entryQ
    lessonRef: { tab: math-code, id: reeder-entries }
    prompt: '{=text} Record the entry.'
    accounts: '@accounts'
    entries: '@entries'
    hints:
      - Which account increases? Inventories and expenses increase with a debit.
      - The credit is the account that gives up the cost, or records what is now owed.
    explanation: Each entry moves cost one step along RM → WIP → Finished Goods → COGS, or records actual overhead in Manufacturing Overhead.

  - id: entry-je-2
    type: journal-entry
    skills: [je-cycle]
    difficulty: 2
    tags: [journal]
    generator: entryQ
    lessonRef: { tab: math-code, id: reeder-entries }
    prompt: '{=text} Record the entry.'
    accounts: '@accounts'
    entries: '@entries'
    hints:
      - Split the cost into direct (WIP), indirect factory (Manufacturing Overhead) and non-factory (an expense).
      - The credit is the total.
    explanation: Direct costs go to Work in Process, indirect factory costs to Manufacturing Overhead, and selling and administrative costs to expense accounts.

  - id: account-match
    type: match
    skills: [je-cycle, t-accounts]
    difficulty: 2
    tags: [journal]
    lessonRef: { tab: math-code, id: reeder-taccounts }
    prompt: Match each account to what it is credited for.
    pairs:
      - ['Raw Materials', 'Direct and indirect materials issued']
      - ['Work in Process', 'Cost of goods manufactured']
      - ['Finished Goods', 'Cost of goods sold']
      - ['Manufacturing Overhead', 'Overhead applied to Work in Process']
      - ['Salaries and Wages Payable', 'Direct, indirect and office labor incurred']
    explanation: The summary of cost flows. Each inventory account is credited when cost moves on to the next account; the payable is credited when labor is incurred.

  # ------------------------------------------------------------------ T-accounts
  - id: wip-numeric
    type: numeric
    skills: [t-accounts]
    difficulty: 2
    tags: [math]
    generator: balanceQ
    lessonRef: { tab: math-code, id: reeder-taccounts }
    prompt: |
      Work in Process began the year at {=begWIP|money}. Direct materials of {=dmUsed|money} and direct labor of
      {=dl|money} were added; overhead is applied at {=rate|pct} of direct labor cost (actual overhead was
      {=actualOH|money}). Jobs costing {=completed|money} were completed. What is the ending Work in Process balance?
    answer: { var: endWIP, tol: 0.5 }
    hints:
      - WIP is debited for DM, DL and overhead applied.
      - It is credited for the cost of goods manufactured.
    explanation: 'Applied $= {=rate|pct} \times {=dl|comma} = {=applied|comma}$; ending WIP $= {=begWIP|comma} + {=dmUsed|comma} + {=dl|comma} + {=applied|comma} - {=completed|comma} = {=endWIP|money}$.'

  - id: wip-multi
    type: multi
    skills: [t-accounts]
    difficulty: 1
    tags: [journal]
    lessonRef: { tab: math-code, id: reeder-taccounts }
    prompt: Which of these are debited to Work in Process in a job-order system? Select all that apply.
    options:
      - Direct materials issued
      - Direct labor
      - Overhead applied at the predetermined rate
      - Actual factory utilities
      - Indirect materials issued
    answer: [0, 1, 2]
    optionFeedback:
      0: "Yes: direct materials go straight to the job in WIP."
      1: "Yes: direct labor goes straight to the job in WIP."
      2: "Yes: overhead reaches WIP through the predetermined rate."
      3: "Actual overhead bills are debited to Manufacturing Overhead, not WIP."
      4: "Indirect materials are overhead, debited to Manufacturing Overhead."
    hints: [Actual overhead waits somewhere else.]
    explanation: WIP receives DM, DL and applied overhead. Actual overhead costs (utilities, indirect materials) are debited to Manufacturing Overhead.

  # ------------------------------------------------------------------ under- and overapplied
  - id: moh-handcalc
    type: hand-calc
    skills: [over-under, t-accounts]
    difficulty: 2
    tags: [math]
    generator: overheadQ
    lessonRef: { tab: math-code, id: over-under }
    prompt: |
      The year's factory costs: indirect materials {=indirectMat|money}, indirect labor {=indirectLabor|money}, utilities
      {=utilities|money}, factory insurance expired {=insFactory|money}, factory depreciation {=deprFactory|money}.
      Overhead is applied on direct labor cost; estimates were {=estOH|money} of overhead and {=estDL|money} of direct
      labor. Actual direct labor was {=dl|money}.
    steps:
      - prompt: Actual manufacturing overhead (₱)
        answer: { var: actualOH, tol: 0.5 }
        hint: Add the five factory costs.
      - prompt: Predetermined rate (as a decimal, e.g. 1.5 for 150%)
        answer: { var: rate, tol: 0.0005 }
        hint: Estimated overhead ÷ estimated direct labor cost.
      - prompt: Overhead applied (₱)
        answer: { var: applied, tol: 0.5 }
        hint: Rate × actual direct labor cost.
      - prompt: Under- or overapplied amount (₱, as a positive number)
        answer: { var: amt, tol: 0.5 }
        hint: The difference between actual and applied.
    hints:
      - Only factory costs are overhead.
    explanation: 'Actual {=actualOH|money}; rate {=rate|pct}; applied {=applied|money}; overhead is {=kindTxt} by {=amt|money}.'

  - id: close-je
    type: journal-entry
    skills: [over-under]
    difficulty: 1
    tags: [journal]
    generator: disposeQ
    lessonRef: { tab: math-code, id: over-under }
    prompt: |
      At year end, actual overhead was {=actualOH|money} and overhead applied was {=applied|money}. The company closes the
      balance to Cost of Goods Sold. Record the entry.
    accounts: '@accounts'
    entries: '@entries'
    hints:
      - Is the balance in Manufacturing Overhead a debit or a credit?
      - The entry brings Manufacturing Overhead to zero.
    explanation: 'Overhead is {=kindTxt} by {=amt|money}; the entry zeroes Manufacturing Overhead against Cost of Goods Sold, which becomes {=adjustedCogs|money}.'

  - id: allocate-je
    type: journal-entry
    skills: [over-under]
    difficulty: 3
    tags: [journal]
    generator: disposeQ
    lessonRef: { tab: math-code, id: over-under }
    prompt: |
      Overhead was {=kindTxt} by {=amt|money}. Ending balances before adjustment: Work in Process {=endWIP|money},
      Finished Goods {=endFG|money}, Cost of Goods Sold {=costSold|money}. Allocate the balance in proportion to these
      ending balances (round each share to the nearest peso; let COGS absorb any rounding).
    accounts: '@accounts'
    entries: '@entries'
    hints:
      - Each account's share is its balance ÷ the total of the three.
      - Underapplied → debit the three accounts; overapplied → credit them.
    explanation: 'Shares {=wipShare|pct1}, {=fgShare|pct1} and {=cogsShare|pct1}: WIP {=wipAdj|money}, Finished Goods {=fgAdj|money}, COGS {=cogsAdj|money}.'

  - id: dispose-numeric
    type: numeric
    skills: [over-under]
    difficulty: 1
    tags: [math]
    generator: disposeQ
    lessonRef: { tab: math-code, id: over-under }
    prompt: |
      Cost of Goods Sold before adjustment is {=costSold|money}. Actual overhead was {=actualOH|money}; applied overhead
      was {=applied|money}. The balance is closed to Cost of Goods Sold. What is the adjusted Cost of Goods Sold?
    answer: { var: adjustedCogs, tol: 0.5 }
    hints:
      - Underapplied overhead adds to COGS; overapplied overhead reduces it.
    explanation: 'Overhead was {=kindTxt} by {=amt|money}, so COGS becomes {=adjustedCogs|money}.'

  - id: ledger-handcalc
    type: hand-calc
    skills: [t-accounts]
    difficulty: 3
    tags: [journal]
    generator: yearQ
    lessonRef: { tab: intuition, id: reeder-ledger }
    prompt: |
      A job shop opens the year with Raw Materials {=begRM|money}, Work in Process {=begWIP|money} and Finished Goods
      {=begFG|money}. During the year it buys {=purchases|money} of materials and issues {=dmUsed|money} direct and
      {=indirectMat|money} indirect. Direct labor is {=dl|money}, and overhead is applied at {=rate|pct} of direct labor
      cost. Jobs costing {=completed|money} are finished, and goods costing {=costSold|money} are sold. Find the ending
      balances.
    steps:
      - prompt: Ending Raw Materials (₱)
        answer: { var: endRM, tol: 0.5 }
        hint: Opening + purchases − all materials issued.
      - prompt: Ending Work in Process (₱)
        answer: { var: endWIP, tol: 0.5 }
        hint: Opening + direct materials + direct labor + overhead applied − cost of goods manufactured.
      - prompt: Ending Finished Goods (₱)
        answer: { var: endFG, tol: 0.5 }
        hint: Opening + cost of goods manufactured − cost of goods sold.
    hints:
      - Post each amount to its T-account, then take debits minus credits.
      - Overhead applied is the rate times the direct labor cost.
    explanation: 'Raw Materials {=endRM|money}; overhead applied {=applied|money}, so Work in Process {=endWIP|money}; Finished Goods {=endFG|money}.'

  # ------------------------------------------------------------------ income statement
  - id: income-fill
    type: schedule-fill
    skills: [income-stmt]
    difficulty: 2
    tags: [journal]
    generator: incomeQ
    lessonRef: { tab: math-code, id: income-statement }
    prompt: |
      Sales were {=sales|money}. Cost of Goods Sold before adjustment was {=costSold|money}, and overhead was {=kindTxt}
      by {=amt|money} (closed to COGS). Complete the income statement.
    rows: '@rows'
    hints:
      - Adjust COGS for the overhead balance first.
      - Selling and administrative expenses are subtracted from gross margin in full.
    explanation: 'COGS {=cogs|money}; gross margin {=gm|money}; selling and administrative {=totalSA|money}; net income {=ni|money}.'

  - id: ni-numeric
    type: numeric
    skills: [income-stmt, over-under]
    difficulty: 2
    tags: [math]
    generator: incomeQ
    lessonRef: { tab: math-code, id: income-statement }
    prompt: |
      Sales {=sales|money}; unadjusted Cost of Goods Sold {=costSold|money}; overhead {=kindTxt} by {=amt|money}, closed to
      COGS. Selling and administrative: salaries {=saWages|money}, insurance {=insSA|money}, advertising
      {=advertising|money}, depreciation {=deprSA|money}. What is net income?
    answer: { var: ni, tol: 0.5 }
    hints:
      - Adjust COGS, subtract it from sales, then subtract the four period expenses.
    explanation: 'Gross margin $= {=sales|comma} - {=cogs|comma} = {=gm|comma}$; net income $= {=gm|comma} - {=totalSA|comma} = {=ni|money}$.'

  - id: year-handcalc
    type: hand-calc
    skills: [je-cycle, over-under, income-stmt]
    difficulty: 3
    tags: [math]
    generator: yearQ
    lessonRef: { tab: intuition, id: close-the-year }
    prompt: |
      A job shop's year. Work in Process opened at {=begWIP|money}. Materials issued: {=dmUsed|money} direct,
      {=indirectMat|money} indirect. Labor: {=dl|money} direct, {=indirectLabor|money} indirect, {=saWages|money}
      selling and administrative salaries. Factory utilities {=utilities|money}. Insurance of {=insTotal|money} expired,
      {=insPct|pct} of it for the factory. Depreciation: {=deprFactory|money} factory, {=deprSA|money} office. Advertising
      {=advertising|money}. Overhead is applied on direct labor cost; the estimates were {=estOH|money} of overhead and
      {=estDL|money} of direct labor. Jobs costing {=completed|money} were finished, and goods costing {=costSold|money}
      were sold for {=sales|money}. The overhead balance is closed to Cost of Goods Sold.
    steps:
      - prompt: Actual manufacturing overhead (₱)
        answer: { var: actualOH, tol: 0.5 }
        hint: Indirect materials + indirect labor + utilities + factory insurance + factory depreciation.
      - prompt: Overhead applied (₱)
        answer: { var: applied, tol: 0.5 }
        hint: (Estimated overhead ÷ estimated direct labor) × actual direct labor.
      - prompt: Ending Work in Process (₱)
        answer: { var: endWIP, tol: 0.5 }
        hint: Opening + direct materials + direct labor + overhead applied − jobs finished.
      - prompt: Cost of Goods Sold after closing the overhead balance (₱)
        answer: { var: cogsClose, tol: 0.5 }
        hint: Underapplied adds to COGS; overapplied subtracts.
      - prompt: Net income (₱)
        answer: { var: niClose, tol: 0.5 }
        hint: Sales − adjusted COGS − all selling and administrative expenses.
    hints:
      - 'Sort every cost first: direct (WIP), indirect factory (overhead) or selling and administrative (expense).'
      - Compare actual with applied overhead to see which way COGS moves.
    explanation: 'Actual overhead {=actualOH|money}; applied {=rate|pct} × {=dl|money} = {=applied|money}, so overhead is {=kindTxt} by {=amt|money}. Ending WIP {=endWIP|money}. COGS {=cogsClose|money}; gross margin {=gmClose|money}; selling and administrative {=totalSA|money}; net income {=niClose|money}.'

  - id: ni-allocate-numeric
    type: numeric
    skills: [over-under, income-stmt]
    difficulty: 3
    tags: [math]
    generator: yearQ
    lessonRef: { tab: math-code, id: over-under }
    prompt: |
      Overhead was {=kindTxt} by {=amt|money}. Ending balances before adjustment: Work in Process {=endWIP|money},
      Finished Goods {=endFG|money}, Cost of Goods Sold {=costSold|money}. The company allocates the balance in proportion
      to these balances (round the Work in Process and Finished Goods shares to the peso; COGS takes the rest). Sales were
      {=sales|money} and selling and administrative expenses total {=totalSA|money}. What is net income?
    answer: { var: niAlloc, tol: 0.5 }
    hints:
      - Find COGS's share of the balance, not the whole balance.
      - Underapplied overhead raises COGS; overapplied lowers it.
      - Net income = sales − adjusted COGS − selling and administrative expenses.
    explanation: 'Shares: WIP {=wipShare|pct1} → {=wipAdj|money}, Finished Goods {=fgShare|pct1} → {=fgAdj|money}, COGS gets the rest, {=cogsAdjAlloc|money}. Adjusted COGS {=cogsAlloc|money}; net income $= {=sales|comma} - {=cogsAlloc|comma} - {=totalSA|comma} = {=niAlloc|money}$.'

  - id: period-mcq
    type: mcq
    skills: [income-stmt, cost-terms]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: math-code, id: income-statement }
    prompt: Reeder Company's depreciation was ₱145,000 on factory assets and ₱15,000 on office assets. Where does each reach the income statement?
    options:
      - The ₱15,000 as a selling and administrative expense; the ₱145,000 through overhead applied to jobs and, once sold, COGS
      - Both as depreciation expense in selling and administrative expenses
      - Both in Cost of Goods Sold
      - The ₱145,000 as an expense this year; the ₱15,000 in inventory
    answer: 0
    optionFeedback:
      1: "Factory depreciation is a product cost and goes through overhead into inventory."
      2: "Office depreciation is a period cost and never enters COGS."
      3: "It's the other way round: factory depreciation waits in inventory; office depreciation is expensed."
    hints: [Factory costs are product costs.]
    explanation: Factory depreciation is overhead (a product cost); office depreciation is a period cost, as on Reeder's income statement.

  # ------------------------------------------------------------------ equivalent units
  - id: job-or-process-mcq
    type: mcq
    skills: [eu-methods]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: equivalent-units }
    prompt: A paint maker mixes the same white paint in huge batches every day. A sign shop paints custom billboards one order at a time. Which costing system fits each?
    options:
      - 'Paint maker: process costing; sign shop: job-order costing'
      - 'Paint maker: job-order costing; sign shop: process costing'
      - Both use process costing, since both use paint
      - Both use job-order costing, since both fill customer orders
    answer: 0
    optionFeedback:
      1: "Swapped: identical batches call for process costing and custom orders for job costing."
      2: "The input doesn't decide it. The output's nature (identical or unique) does."
      3: "Filling orders isn't the test; the paint maker's output is identical and continuous."
    hints: [Is each unit of output identical to the last, or unique?]
    explanation: Identical, continuous output is averaged by department (process costing); unique orders are traced one job at a time (job-order costing).
    variants:
      - prompt: A Pampanga lantern maker builds giant festival lanterns to each barangay's design, while a candle factory nearby pours identical white candles all day. Which costing system fits each?
        options:
          - 'Lantern maker: job-order costing; candle factory: process costing'
          - 'Lantern maker: process costing; candle factory: job-order costing'
          - Both use job-order costing, since both sell to customers
          - Both use process costing, since both make physical products
        answer: 0
        optionFeedback:
          1: Swapped; unique designs are jobs and identical candles are a process.
          2: Selling to customers doesn't decide it; unique vs identical output does.
          3: Making physical goods doesn't decide it.
        explanation: Unique orders → job-order; identical, continuous output → process.
      - prompt: A Bohol furniture maker builds custom dining sets to order, while a Cebu cement plant runs a continuous kiln. Which costing system fits each?
        options:
          - 'Furniture maker: job-order costing; cement plant: process costing'
          - 'Furniture maker: process costing; cement plant: job-order costing'
          - Both process costing
          - Both job-order costing
        answer: 0
        optionFeedback:
          1: Swapped.
          2: Custom furniture isn't identical output.
          3: Cement from a continuous kiln is identical output.
        explanation: Custom orders are jobs; continuous identical output is a process.

  - id: eu-wa-numeric
    type: numeric
    skills: [eu-methods]
    difficulty: 1
    tags: [math]
    generator: euQ
    lessonRef: { tab: math-code, id: eu-halsey }
    prompt: |
      Weighted-average. Beginning inventory {=begUnits|comma} units ({=begConv|pct} converted); {=started|comma} started;
      {=completed|comma} completed and transferred; ending inventory {=endUnits|comma} units, {=endConv|pct} converted.
      What are the equivalent units of conversion?
    answer: { var: euConv, tol: 0.5 }
    hints:
      - Units transferred out count at 100%.
      - Ending inventory counts at its percent complete; beginning inventory needs no separate line.
    explanation: 'EU $= {=completed|comma} + {=endUnits|comma} \times {=endConv|pct} = {=euConv|comma}$.'

  - id: eu-fifo-numeric
    type: numeric
    skills: [eu-methods]
    difficulty: 2
    tags: [math]
    generator: euQ
    lessonRef: { tab: math-code, id: eu-halsey }
    prompt: |
      FIFO. Beginning inventory {=begUnits|comma} units, {=begConv|pct} converted; {=started|comma} started;
      {=completed|comma} completed and transferred; ending inventory {=endUnits|comma} units, {=endConv|pct} converted.
