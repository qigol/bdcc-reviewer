terms:
  # ------------------------------------------------------------------ cost terms
  - id: product-cost
    term: Product cost
    aka: [manufacturing cost, product costs]
    short: Direct materials, direct labor and manufacturing overhead; it stays in inventory as an asset until the goods are sold.
    related: [period-cost, prime-cost, conversion-cost]
    skills: [cost-terms]
  - id: period-cost
    term: Period cost
    aka: [non-manufacturing cost, period costs]
    short: A selling or administrative cost, expensed in the period incurred and never put into inventory.
    related: [product-cost]
    skills: [cost-terms, income-stmt]
  - id: manufacturing-overhead
    term: Manufacturing overhead
    aka: [factory overhead, overhead, MOH]
    short: Every manufacturing cost other than direct materials and direct labor, such as indirect materials, indirect labor, factory utilities and depreciation.
    related: [product-cost, predetermined-overhead-rate]
    skills: [cost-terms, je-cycle]
  - id: prime-cost
    term: Prime cost
    short: Direct materials plus direct labor, the costs traced to the product.
    formula: '\text{Prime cost} = \text{DM} + \text{DL}'
    related: [conversion-cost]
    skills: [cost-terms]
  - id: conversion-cost
    term: Conversion cost
    short: Direct labor plus manufacturing overhead, the cost of converting materials into product.
    formula: '\text{Conversion cost} = \text{DL} + \text{MOH}'
    related: [prime-cost, equivalent-units]
    skills: [cost-terms, eu-methods]
  - id: mixed-cost
    term: Mixed cost
    aka: [semi-variable cost]
    short: A cost with a fixed part and a variable part; in a regression, the intercept is the fixed part and the slope the variable rate.
    formula: 'Y = a + bX'
    related: [product-cost]
    skills: [cost-terms]

  # ------------------------------------------------------------------ applying overhead
  - id: predetermined-overhead-rate
    term: Predetermined overhead rate
    aka: [POHR, predetermined rate]
    short: Estimated total overhead divided by estimated total activity, set before the period begins and used to apply overhead to jobs.
    formula: '\text{POHR} = \frac{\text{Estimated total MOH}}{\text{Estimated total activity}}'
    related: [applied-overhead]
    skills: [pohr-apply]
  - id: applied-overhead
    term: Applied overhead
    aka: [overhead applied]
    short: The predetermined rate times a job's actual activity; debited to Work in Process and credited to Manufacturing Overhead.
    formula: '\text{Applied} = \text{POHR} \times \text{Actual activity}'
    related: [predetermined-overhead-rate, underapplied-overhead]
    skills: [pohr-apply, je-cycle]
  - id: materials-requisition
    term: Materials requisition form
    aka: [materials requisition, requisition]
    short: The document that releases materials from the storeroom and names the job (or overhead) to charge.
    related: [job-cost-sheet]
    skills: [pohr-apply]
  - id: time-ticket
    term: Employee time ticket
    aka: [time ticket]
    short: An hour-by-hour record of what an employee worked on; time on a job is direct labor, other time (maintenance) is indirect labor.
    related: [job-cost-sheet]
    skills: [pohr-apply]
  - id: job-cost-sheet
    term: Job cost sheet
    short: The form that accumulates one job's direct materials, direct labor and applied overhead and gives its unit cost.
    related: [materials-requisition, time-ticket]
    skills: [pohr-apply]

  # ------------------------------------------------------------------ accounts and the cycle
  - id: raw-materials
    term: Raw Materials
    aka: [raw materials inventory]
    short: The inventory account for materials not yet issued; debited for purchases, credited when materials go to production.
    related: [work-in-process]
    skills: [je-cycle, t-accounts]
  - id: work-in-process
    term: Work in Process
    aka: [WIP]
    short: The inventory account for unfinished goods; debited for direct materials, direct labor and applied overhead, credited for the cost of goods manufactured.
    related: [raw-materials, finished-goods]
    skills: [je-cycle, t-accounts]
  - id: finished-goods
    term: Finished Goods
    short: The inventory account for completed, unsold goods; debited for cost of goods manufactured, credited for cost of goods sold.
    related: [work-in-process, cost-of-goods-sold]
    skills: [je-cycle, t-accounts]
  - id: cost-of-goods-manufactured
    term: Cost of goods manufactured
    aka: [COGM]
    short: The cost of jobs completed during the period, transferred from Work in Process to Finished Goods.
    related: [work-in-process, finished-goods]
    skills: [je-cycle, t-accounts]
  - id: cost-of-goods-sold
    term: Cost of Goods Sold
    aka: [COGS]
    short: The expense account for the manufacturing cost of goods sold; matched against sales on the income statement.
    related: [finished-goods]
    skills: [je-cycle, income-stmt]

  # ------------------------------------------------------------------ under- and overapplied
  - id: underapplied-overhead
    term: Underapplied overhead
    aka: [underapplied]
    short: Actual overhead greater than applied overhead; a debit balance left in Manufacturing Overhead.
    formula: '\text{Actual MOH} > \text{Applied MOH}'
    related: [overapplied-overhead, applied-overhead]
    skills: [over-under]
  - id: overapplied-overhead
    term: Overapplied overhead
    aka: [overapplied]
    short: Applied overhead greater than actual overhead; a credit balance left in Manufacturing Overhead.
    formula: '\text{Applied MOH} > \text{Actual MOH}'
    related: [underapplied-overhead]
    skills: [over-under]
  - id: allocation-method
    term: Allocation of the overhead balance
    aka: [allocation, allocate the balance, proration]
    short: Spreading under- or overapplied overhead over Work in Process, Finished Goods and COGS in proportion to their ending balances.
    related: [underapplied-overhead]
    skills: [over-under]
  - id: gross-margin
    term: Gross margin
    short: Sales minus cost of goods sold; selling and administrative expenses are subtracted from it to get net income.
    formula: '\text{Gross margin} = \text{Sales} - \text{COGS}'
    related: [cost-of-goods-sold, period-cost]
    skills: [income-stmt]

  # ------------------------------------------------------------------ equivalent units and the production report
  - id: equivalent-units
    term: Equivalent units
    aka: [equivalent units of production, EU]
    short: The number of units that would have been produced if all of a department's effort had gone into completed units.
    related: [weighted-average-method, fifo-method]
    skills: [eu-methods]
  - id: weighted-average-method
    term: Weighted-average method
    short: Blends beginning inventory's units and cost with the current period's; equivalent units include work done on beginning inventory last period.
    formula: '\text{EU} = \text{Units transferred out} + \text{End. WIP} \times \%'
    related: [fifo-method]
    skills: [eu-methods, production-report]
  - id: fifo-method
    term: FIFO method
    short: Counts only the current period's work; beginning inventory is finished first and its cost kept out of the unit costs.
    formula: '\text{EU} = \text{Beg.} \times (100\% - \%) + \text{Started and completed} + \text{End.} \times \%'
    related: [weighted-average-method, started-and-completed]
    skills: [eu-methods, production-report]
  - id: started-and-completed
    term: Units started and completed
    aka: [started and completed]
    short: Units both started and finished this period; units transferred out minus beginning inventory units.
    formula: '\text{Units completed} - \text{Beg. WIP units}'
    related: [fifo-method]
    skills: [eu-methods]
  - id: production-report
    term: Production report
    aka: [department production report]
    short: Process costing's key document; summarizes a department's Work in Process account in three parts.
    related: [quantity-schedule, cost-reconciliation]
    skills: [production-report]
  - id: quantity-schedule
    term: Quantity schedule
    short: Part 1 of the production report; accounts for the physical flow of units and shows the equivalent units.
    related: [production-report]
    skills: [production-report]
  - id: cost-reconciliation
    term: Cost reconciliation
    short: Part 3 of the production report; shows that the cost transferred out plus ending inventory equals the total cost to account for.
    related: [production-report]
    skills: [production-report]

  # ------------------------------------------------------------------ JIT
  - id: just-in-time
    term: Just-in-time
    aka: [JIT]
    short: Materials arrive just in time for production, parts for assembly, and products are finished just in time to ship, leaving almost no inventory.
    related: [pull-system, kanban]
    skills: [jit]
  - id: pull-system
    term: Pull system
    aka: [pull approach]
    short: Each workstation produces only what the next one signals it needs; the opposite of a push system, which keeps every station busy.
    related: [just-in-time, kanban]
    skills: [jit]
  - id: kanban
    term: Kanban
    short: The visual pull-signal tool (cards, bins, boards) that triggers replenishment; JIT is the strategy it serves.
    related: [pull-system, just-in-time]
    skills: [jit]
  - id: manufacturing-time
    term: Manufacturing time
    aka: [throughput time]
    short: Processing time plus inspection, move and wait time; only processing adds value.
    formula: '\text{Processing} + \text{Inspection} + \text{Move} + \text{Wait}'
    related: [non-value-added]
    skills: [jit]
  - id: non-value-added
    term: Non-value-added time
    aka: [non-value-added activities]
    short: Inspection, move and wait time, which add cost but not value and should be eliminated where possible.
    related: [manufacturing-time]
    skills: [jit]

  # ------------------------------------------------------------------ ABC
  - id: activity-based-costing
    term: Activity-based costing
    aka: [ABC]
    short: Assigns overhead through many activity cost pools, each with its own driver, instead of one volume-based rate.
    related: [cost-driver, activity-rate]
    skills: [abc-intro]
  - id: cost-driver
    term: Cost driver
    aka: [activity]
    short: An event or transaction that causes cost, such as a machine setup, a purchase order or a quality inspection.
    related: [activity-based-costing]
    skills: [abc-intro]
  - id: activity-rate
    term: Activity rate
    short: An activity cost pool divided by its total driver quantity; a product is charged the rate times the drivers it uses.
    formula: '\text{Activity rate} = \frac{\text{Activity cost}}{\text{Total driver quantity}}'
    related: [activity-based-costing]
    skills: [abc-intro]
