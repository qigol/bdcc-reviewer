  notes: >-
    Built from the Session 6A supplemental notes. The Reeder Company cycle (entries a–k, T-accounts, disposition and the
    income statement), Halsey's equivalent units and the two-method production report all reproduce the slides
    exactly. The JIT manufacturing-time numbers and the Mabini Metalcraft case are synthetic.
    1.1.0 (learner review 2026-10-05): framed as a review; predict answers hidden until after each gate; the Reeder year
    taught entry by entry with a debit/credit primer and a second ledger scene; DM/DL, regression, document-flow, JIT
    element and job-vs-process beats; T7 allocation wording and cross-module account names; Mabini gains process and
    ABC cells; keyed generator misconceptions; level-3 full-year, FIFO report and ABC templates.
    1.2.0 (re-audit): Application rate cell asks for the rate and the ledger cell shows account totals (no cross-cell
    leaks); JIT and Reeder-ledger gates no longer give their answers away; "salaries" for the S&A ₱90,000 everywhere;
    glossary regression formulas fixed.
    1.3.0 (re-audit 2): entry (h)'s journal memo no longer prints the rate; the dispose cell no longer prints adjusted
    COGS; generated years never estimate labor equal to actual, and overheadQ's two "used the estimate" hints merged.
