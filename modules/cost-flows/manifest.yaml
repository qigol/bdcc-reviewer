skills:
  - id: cost-terms
    label: Cost terms and the cost equation
    description: Product vs period costs, prime and conversion cost, a mixed-cost equation from regression.
  - id: pohr-apply
    label: Applying overhead to jobs
    description: The predetermined rate, the documents behind a job cost sheet, and a job's total and unit cost.
  - id: je-cycle
    label: Journal entries for the job-order cycle
    description: Entries (a)–(k), from buying materials to recording cost of goods sold.
  - id: t-accounts
    label: T-accounts and ending balances
    description: Posting the entries and reading the balances of RM, WIP, MOH, FG and COGS.
  - id: over-under
    label: Under- and overapplied overhead
    description: Actual vs applied, and the two ways to dispose of the balance.
  - id: income-stmt
    label: The income statement
    description: Adjusted COGS, gross margin, period expenses and net income.
  - id: eu-methods
    label: Equivalent units, WA and FIFO
    description: The two ways to count equivalent units when there is beginning inventory.
  - id: production-report
    label: The production report
    description: Quantity schedule, unit costs and cost reconciliation under both methods.
  - id: jit
    label: Just-in-time and manufacturing time
    description: Pull vs push, the five JIT elements, kanban, and non-value-added time.
  - id: abc-intro
    label: Activity-based costing, a first look
    description: Activity rates and the overhead shift from high-volume to low-volume products.
