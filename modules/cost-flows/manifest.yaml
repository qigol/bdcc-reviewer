objectives:
  - id: classify
    text: Classify costs as direct materials, direct labor, overhead or period costs, and use a given cost equation to predict a mixed cost.
    skills: [cost-terms]
  - id: apply
    text: Compute a predetermined overhead rate and build a job's cost from requisitions, time tickets and applied overhead.
    skills: [pohr-apply]
  - id: record
    text: Journalize a year of job-order transactions, post them to T-accounts and find the ending balances.
