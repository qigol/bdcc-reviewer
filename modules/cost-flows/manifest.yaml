summary: |
  A review to take after Job-Order and Process Costing, following one company through a full year of books. New
  here: posting to T-accounts, the full cycle of entries (a)–(k), closing the overhead balance into the income
  statement, the three-part production report, just-in-time (JIT) and a first look at activity-based costing.
