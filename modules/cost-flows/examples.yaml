examples:
  - id: quiz1a-predict
    source: 'Session 6A, slide 2 (Quiz 1A, parts a–b)'
    fn: costEquation
    in: { intercept: '@quiz1a.intercept', slope: '@quiz1a.slope', x: '@quiz1a.x' }
    expect: { y: 50500, variable: 25500 }
  - id: parker-rate-job
    source: 'Session 6A, slides 6–7 (Parker Company)'
    fn: parkerJob
    in: { budgetOH: '@parker.budgetOH', budgetMH: '@parker.budgetMH', job: '@parker.job' }
    expect: { rate: 8, oh: 4000, total: 12000 }
  - id: job-2b47
    source: 'Session 6A, slide 9 (materials requisition, job cost sheet, time ticket)'
    fn: jobSheet
    in: { requisition: '@job2b47.requisition', reqs: '@job2b47.reqs', tickets: '@job2b47.tickets', rate: '@job2b47.rate', units: '@job2b47.units' }
    expect: { req14873: 660, dm: 1404, dl: 180, hours: 27, oh: 216, total: 1800, unit: 12 }
  - id: job-2b47-walk
    source: 'Session 6A, slide 9, count-along'
    fn: jobSheetWalk
    in: { requisition: '@job2b47.requisition', reqs: '@job2b47.reqs', tickets: '@job2b47.tickets', rate: '@job2b47.rate', units: '@job2b47.units' }
    expect: { steps: 12, total: 1800, unit: 12 }
  - id: holden-ticket
    source: 'Session 6A, slide 9 (employee time ticket)'
    fn: timeTicket
    in: { holden: '@job2b47.holden' }
    expect: { total: 72, indirect: 9, direct: 63 }
  - id: reeder-cycle
    source: 'Session 6A, slides 10–12 and 16 (entries a–k; under- and overapplied overhead)'
    fn: cycle
    in: { d: '@reeder' }
    expect: { rate: 1.5, applied: 300000, actualOH: 310000, amt: 10000, kind: underapplied, insFactory: 16000, insSA: 4000 }
  - id: reeder-balances
    source: 'Session 6A, slide 13 (T-accounts)'
    fn: balances
    in: { d: '@reeder' }
    expect: { rm: 10000, wip: 60000, fg: 90000, moh: 10000, cogs: 600000 }
  - id: reeder-ledger-walk
    source: 'Session 6A, slides 10–13, posting walk'
    fn: ledgerWalk
    in: { d: '@reeder' }
    expect: { steps: 11, applied: 300000, actualOH: 310000 }
  - id: reeder-close
    source: 'Session 6A, slide 14 (a. close to Cost of Goods Sold)'
    fn: dispose
    in: { d: '@reeder', method: close }
    expect: { amt: 10000, adjustedCogs: 610000 }
  - id: reeder-allocate
    source: 'Session 6A, slide 14 (b. allocate on ending balances)'
    fn: dispose
    in: { d: '@reeder', method: allocate }
    expect: { wipShare: 0.08, fgShare: 0.12, cogsShare: 0.8, wipAdj: 800, fgAdj: 1200, cogsAdj: 8000, adjustedCogs: 608000 }
  - id: reeder-income
    source: 'Session 6A, slide 15 (income statement)'
    fn: income
    in: { d: '@reeder', method: close }
    expect: { cogs: 610000, gm: 290000, totalSA: 209000, ni: 81000 }
  - id: reeder-income-walk
    source: 'Session 6A, slide 15, count-along'
    fn: incomeWalk
    in: { d: '@reeder', method: close }
    expect: { steps: 9, ni: 81000 }
  - id: halsey-wa
    source: 'Session 6A, slide 20 (weighted-average equivalent units)'
    fn: equivUnits
    in: { beg: '@halsey.beg', completed: '@halsey.completed', end: '@halsey.end', method: wa }
    expect: { euMat: 189000, euConv: 181000 }
  - id: halsey-fifo
    source: 'Session 6A, slides 21–22 (FIFO equivalent units)'
    fn: equivUnits
    in: { beg: '@halsey.beg', completed: '@halsey.completed', end: '@halsey.end', method: fifo }
    expect: { finishMat: 0, finishConv: 3000, sc: 160000, euMat: 174000, euConv: 169000 }
  - id: report-wa
    source: 'Session 6A, slide 24 (production report, weighted-average)'
    fn: productionReport
    in: { beg: '@prodreport.beg', started: '@prodreport.started', completed: '@prodreport.completed', end: '@prodreport.end', added: '@prodreport.added', method: wa }
    expect: { euMat: 200000, euConv: 185000, unitMat: 0.39, unitConv: 0.84, transferred: 221400, endMat: 7800, endConv: 4200, endWip: 12000, total: 233400 }
  - id: report-fifo
    source: 'Session 6A, slide 25 (production report, FIFO)'
    fn: productionReport
    in: { beg: '@prodreport.beg', started: '@prodreport.started', completed: '@prodreport.completed', end: '@prodreport.end', added: '@prodreport.added', method: fifo }
    expect: { euMat: 190000, euConv: 176000, unitMat: 0.392, unitConv: 0.842, transferred: 221350, endMat: 7840, endConv: 4210, endWip: 12050, total: 233400 }
  - id: report-fifo-walk
    source: 'Session 6A, slide 25, count-along'
    fn: reportWalk
    in: { beg: '@prodreport.beg', started: '@prodreport.started', completed: '@prodreport.completed', end: '@prodreport.end', added: '@prodreport.added', method: fifo }
    expect: { steps: 11, transferred: 221350 }
  - id: sarver-abc
    source: 'Session 6A, slides 31–32 (Sarver Company)'
    fn: sarver
    in: { totalOH: '@sarver.totalOH', totalDLH: '@sarver.totalDLH', products: '@sarver.products', activities: '@sarver.activities' }
    expect: { tradRate: 18, tradOHA: 45, tradOHB: 36, ohTotalA: 392200, ohTotalB: 507800, abcOHA: 98.05, abcOHB: 25.39, abcCostA: 151.55, abcCostB: 69.39, rates.setups: 51, rates.mh: 7.85, rates.receipts: 120 }
  - id: sarver-sheet-rate
    source: 'Session 6A, slide 31 (spreadsheet: setup cost per setup)'
    fn: activityRate
    in: { cost: '@sarver.sheet.setupCost', driver: '@sarver.sheet.setups' }
    expect: { rate: 588.2353 }
    tol: 0.0001
  - id: mabini-year
    source: 'Application case (synthetic)'
    fn: cycle
    in: { d: '@mabini' }
    expect: { rate: 1.2, applied: 720000, actualOH: 680000, amt: 40000, kind: overapplied, endRM: 70000, endWIP: 200000, endFG: 300000 }
  - id: mabini-allocate
    source: 'Application case (synthetic)'
    fn: income
    in: { d: '@mabini', method: allocate }
    expect: { cogs: 1470000, ni: 650000 }
