  - id: resnet-mcq
    type: mcq
    skills: [skip-connections]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: skip-connections }
    prompt: He et al. found that adding layers to a deep plain network **raised its training error**. What was the cause?
    options:
      - The deeper network was harder to optimize, because the gradient had to pass back through every layer
      - The deeper network overfit the training data
      - The extra layers had no weights
      - The images were too small for so many layers
    answer: 0
    optionFeedback:
      '1': Overfitting lowers training error and raises validation error; here training error itself rose.
      '2': They were ordinary layers with weights.
      '3': The problem was optimization, not input size.
    explanation: That is the [[degradation]] problem; [[skip-connection|skip connections]] fixed it.
    variants:
      - prompt: 'How is a residual block like the LSTM cell state?'
        options:
          - Both add an unchanged copy to a learned change, giving the gradient a direct path
          - Both use a forget gate
          - Both process sequences one step at a time
          - Both double the number of parameters
        answer: 0
        optionFeedback:
          '1': A ResNet has no gates.
          '2': ResNets are not sequence models.
          '3': The shortcut adds no parameters.
        explanation: Additive paths keep gradients alive, across time (LSTM) or across depth (ResNet).

