  # ------------------------------------------------------------ the comparison
  - id: compare-mcq
    type: mcq
    skills: [compare]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: compare-units }
    prompt: 'On IMDb the GRU reached 0.830 validation accuracy, the LSTM 0.804 and the RNN 0.752, each from one run of 8 epochs. Which conclusion is justified?'
    options:
      - Gated units clearly beat the RNN here, but the GRU–LSTM gap could come from the random seed alone
      - The GRU is always better than the LSTM
      - The LSTM is wasted effort because it has more parameters
      - The RNN would win with a larger learning rate
    answer: 0
    optionFeedback:
      '1': One run, one task, one seed cannot show "always".
      '2': It still clearly beat the RNN; the question is the GRU–LSTM difference.
      '3': Nothing in the results tests that.
    explanation: Rerun with other seeds before trusting a 2–3 point gap; all three were still improving at epoch 8.
    variants:
      - prompt: 'All three models had their best validation accuracy at the last epoch, 8. What does that mean for the comparison?'
        options:
          - It compares them at a fixed training budget, not at their best possible accuracy
          - All three had finished learning
          - The models overfit after epoch 8
          - The validation set was too small to measure anything
        answer: 0
        optionFeedback:
          '1': Still improving at the end means more epochs might help.
          '2': There is no evidence about epochs after 8.
          '3': 2,000 reviews is enough to see a 5-point gap.
        explanation: A fair statement is "after 8 epochs", not "the best this model can do".
      - prompt: 'Why did the notebook use `pack_padded_sequence`?'
        options:
          - So the recurrent layer stops at each review's last real word instead of reading padding zeros
          - To make every review exactly 200 words long
          - To shuffle the reviews before each epoch
          - To remove rare words from the vocabulary
        answer: 0
        optionFeedback:
          '1': Padding and cutting make the batch rectangular; packing tells the layer where each review really ends.
          '2': Shuffling is the data loader's job.
          '3': Rare words were mapped to "unknown" when the data was loaded.
        explanation: Otherwise the final hidden state would partly describe padding.

