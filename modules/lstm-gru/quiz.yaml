    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: self-attention }
    prompt: 'A legal-tech startup classifies 20-page contracts, where a clause on page 1 changes the meaning of one on page 18. It has many GPUs. Which family fits best?'
    options:
      - A Transformer, since attention links distant clauses in one step and trains in parallel
      - A vanilla RNN, since it reads every word in order
      - A GRU with a smaller hidden state, to train faster
      - A CNN with 3 × 3 filters
    answer: 0
    optionFeedback:
      '1': Its gradients vanish over thousands of steps.
      '2': A GRU still passes information through thousands of gated steps and one fixed-size vector.
      '3': Small filters only see nearby words.
    explanation: Very long dependencies and plenty of parallel hardware favour self-attention.
    variants:
      - prompt: 'A sensor on a small farm pump streams one reading a minute to a cheap microcontroller that must flag anomalies over the last 30 minutes. Which fits best?'
        options:
          - A small GRU, cheap per step and able to update its state one reading at a time
          - A large Transformer re-reading the whole history at every reading
          - A ResNet image classifier
          - A vanilla RNN with 1,000 hidden units
        answer: 0
        optionFeedback:
          '1': Quadratic attention over a growing history is expensive on a microcontroller.
          '2': The data is a sequence of numbers, not images.
          '3': Larger and still prone to vanishing gradients.
        explanation: Short horizons, streaming input and small hardware favour a small gated recurrent unit.
      - prompt: 'A team''s 60-layer plain CNN has higher training error than its 20-layer version. What should they add?'
        options:
          - Skip connections, making residual blocks
          - More dropout, to stop overfitting
          - A forget gate in every layer
          - Self-attention between pixels
        answer: 0
        optionFeedback:
          '1': Higher training error is not overfitting.
          '2': Forget gates belong to recurrent units.
          '3': The problem is optimization across depth.
        explanation: That is the degradation problem ResNets solved.
