intro: |
  The BYD case closes with three strategic dilemmas: whether its domestic cost advantage can travel abroad, how to overcome
  rising Western tariff walls, and how to defend its lead in China's crowded home market. Work through each strategic
  decision below.
case:
  id: byd-decision
  title: What should BYD do next?
  story: |
    BYD is the world's top EV seller. Its Seal sedan sells for a mass-market price in China but is priced near Western
    rivals in Germany. Overseas sales reached over one million vehicles out of 4.6 million total, and BYD wants half of its
    sales outside China by 2030. However, US tariffs stand at 100% or more and the EU imposes countervailing duties, while
    domestic rivals such as Geely, Xiaomi, and Leapmotor press a fierce price war at home.
  cells:
    - id: price-markup
      title: Why is the Seal priced higher in Europe?
      say: |
        In China's fierce price war, the BYD Seal sells at an aggressive price, whereas in Germany it is priced close to the
        Tesla Model 3. That higher European retail price covers ocean shipping, European import duties, dealer networks, and
        local regulatory compliance—while still leaving a large profit margin.
      stage:
        - id: markup-schedule
          widget: Schedule
          props:
            title: BYD Seal Positioning — China vs. Europe
            columns: [China Home Market, Germany / European Market]
            rows:
              - { label: Competitive climate, amounts: ['Intense price war (~100 carmakers)', 'Higher retail price umbrella'] }
              - { label: Added cost layers, amounts: ['Domestic factory-gate delivery', 'Ocean freight, EU duties & dealer margins'] }
              - { label: Strategic pricing, amounts: ['Volume-first aggressive pricing', 'Priced near Tesla Model 3 ($45k tier)'] }
              - { label: Unit profitability, amounts: ['Thin domestic margin per car', '2–3x higher profit per car than in China'] }
      decision:
        prompt: BYD's German price is close to Tesla's rather than deeply undercutting it. What does that reveal about BYD's strategy in Europe?
        type: mcq
        options:
          - It uses its low production cost to capture a high profit margin per vehicle abroad rather than starting a race to the bottom
          - It sells every car at a heavy loss in Europe
          - It has zero shipping or tariff costs when exporting to Germany
          - European law forces all electric sedans to charge the exact same price
        answer: 0
        model: Because BYD's underlying manufacturing cost is low, pricing near Tesla in Germany absorbs shipping and tariff costs while generating two to three times the profit per car earned in China.
    - id: transfer-edge
      title: Can the cost edge travel?
      say: |
        BYD's cost advantage was forged inside China through walled factory towns, ~75% in-house parts, affordable LFP Blade
        batteries, and lower domestic wages. As BYD opens plants in Hungary, Thailand, and Brazil, not every piece of that
        formula moves easily across borders.
      stage:
        - id: edge-tree
          widget: Tree
          props:
            orientation: right
            root:
              id: edge-root
              label: Transferability of BYD's Cost Edge
              tone: accent
              children:
                - id: portable
                  label: Travels Easily Abroad
                  note: Technology & scale assets
                  children:
                    - { id: lfp-tech, label: LFP Blade Battery & vehicle platform design }
                    - { id: kits, label: Core component kits shipped from China (CKD) }
                - id: location-bound
                  label: Rooted in China
                  note: Hard to replicate overseas
                  children:
                    - { id: cluster, label: Co-located mega-factories & local supplier network }
                    - { id: wages, label: Lower domestic manufacturing & engineering wages }
      decision:
        prompt: Which parts of BYD's cost edge are hardest to transfer to a foreign plant, and how can BYD adapt? Give your reasoning.
        type: open
        model: |
          Co-located mega-factories, dense local supplier clusters, and lower Chinese wages are hardest to replicate abroad,
          especially in higher-wage European markets. BYD can adapt by shipping high-value battery and motor kits from China for
          local CKD assembly, building supplier parks around major overseas plants, and locating early factories in competitive
          manufacturing hubs such as Thailand, Brazil, and Hungary.
    - id: target-gap
      title: Reaching the 50% overseas sales goal
      say: |
        BYD aims to generate half of its total vehicle sales outside China by 2030. Relying only on direct exports from
        Chinese ports would expose BYD to shipping bottlenecks and rising foreign protectionism.
      stage:
        - id: target-schedule
          widget: Schedule
          props:
            title: Portfolio of International Growth Channels
            columns: [Role in 2030 Target, Key Vulnerability]
            rows:
              - { label: Direct exports (Ro-Ro fleet), amounts: ['Uses full China factory scale', 'Fully exposed to foreign tariff walls'] }
              - { label: CKD assembly (e.g., Brazil), amounts: ['Fast startup; lowers import duties', 'Tightening local-content rules'] }
              - { label: Regional FDI plants (Thailand, Hungary), amounts: ['Sells as tariff-free local output', 'Higher capex and local labor costs'] }
      decision:
        prompt: Why are overseas assembly and manufacturing plants essential to BYD's 2030 international ambition?
        type: mcq
        options:
          - Scaling overseas share to half of sales requires tariff-jumping local plants alongside exports
          - BYD is shutting down all of its factories inside China
          - Exporting cars by sea is banned under international maritime law
          - Foreign plants require no capital investment or local workers
        answer: 0
        model: Doubling the overseas share of sales cannot rely on direct exports alone when major markets impose tariffs; local CKD and full manufacturing plants let BYD grow volume inside protected regions.
    - id: tariff-wall
      title: Navigating US and EU trade barriers
      say: |
        The United States imposes tariffs of 100% or more on Chinese EVs alongside connected-vehicle restrictions, while the
        European Union levies countervailing duties. BYD must decide how to allocate capital across regions with very
        different political risks.
      stage:
        - id: wall-note
          widget: Text
          props:
            body: |
              **Comparing Western Trade Barriers**

              - **United States:** 100%+ tariff wall plus national-security scrutiny of connected car software and potential restrictions on Mexican transshipment routes.
              - **European Union:** Graduated countervailing duties on China-built EVs, but open to inward foreign direct investment (FDI) factories inside EU member states such as Hungary.
      decision:
        prompt: How should BYD respond differently to the US market versus the European market, and what risks does each route carry?
        type: open
        model: |
          In Europe, BYD can bypass countervailing duties by building local plants in Hungary and Turkey, though it faces higher
          European labor costs and local-content rules. For the US, a 100%+ tariff and political opposition make direct entry or
          even a Mexican back-door plant highly risky, so BYD is better off prioritizing Europe, Latin America, and Southeast Asia
          first.
    - id: home-rivals
      title: Staying ahead in China's price war
      say: |
        China has factory capacity for roughly 55 million cars against 34 million sold, and agile domestic rivals such as
        Geely, Xiaomi, and Leapmotor are rapidly adopting LFP batteries and fast model cycles.
      stage:
        - id: beyond-note
          widget: Callout
          props:
            kind: beyond
            title: Beyond the case
            body: The strategic facts here are drawn from the case. How BYD balances domestic market share against overseas profitability is an ongoing executive debate.
      decision:
        prompt: What is BYD's strongest defense in a crowded home market experiencing a prolonged price war?
        type: mcq
        options:
          - Sustaining its vertical-integration cost lead, scale advantage, and rapid battery and software innovation
          - Raising domestic car prices far above competitors
          - Halting new model updates for the next five years
          - Outsourcing all battery and motor production to high-margin suppliers
        answer: 0
        model: In a price war driven by excess capacity, the producer with the lowest unit cost and largest scale can cut prices and still remain profitable while continuously refreshing technology.
explainBack:
  prompt: |
    Explain to a colleague why BYD can manufacture EVs for less than Western rivals, how tariffs and foreign plants shape its
    international rollout, and why China's domestic price war makes overseas markets so important.
  rubric:
    - Identifies key structural sources of BYD's cost advantage (vertical integration, LFP batteries, lean overhead, local wages)
    - Explains how import tariffs raise landed prices and how CKD assembly or local FDI plants overcome trade barriers
    - Connects domestic overcapacity and price wars in China to the push for higher-margin overseas sales
atScale:
  title: In practice
  body: |
    Global automakers plan factory footprints years ahead by weighing labor costs, supplier clusters, trade rules, and
    government industrial policies. Because batteries and power electronics represent the core value of an EV, firms face a
    constant make-or-buy tradeoff between vertical integration and supplier flexibility as trade barriers redraw global supply
    chains.
tradeoffs:
  title: Ways into a tariff-protected market
  columns: [Route, Benefit, Risk]
  rows:
    - [Export from China, 'Uses the China cost edge', 'Pays the full tariff']
    - [Assemble with imported parts (CKD), 'Lower tariffs, keeps battery in-house', 'Rules on local content can tighten']
    - [Build a full plant in the market, 'Avoids the tariff', 'Higher labor cost and political opposition']
    - [Partner with a local firm, 'Shares risk and knowledge', 'May hand over technology']
