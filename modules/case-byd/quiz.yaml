templates:
  # ------------------------------------------------------------------ byd-market (5 templates)
  - id: market-mcq
    type: mcq
    skills: [byd-market]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: chinese-ev-market }
    prompt: According to the case, roughly what share of new vehicles sold in China were electric vehicles (BEVs and PHEVs)?
    options:
      - About half of new vehicles sold
      - About one in ten new vehicles sold
      - About a quarter worldwide, but almost none in China
      - Nearly every car on the road
    answer: 0
    hints:
      - China leads global EV adoption by a wide margin over the US.
    explanation: The case notes that EVs reached roughly 50% of new vehicle sales in China, compared with about 25% worldwide and about 8% in the United States.

  - id: late-mover-mcq
    type: mcq
    skills: [byd-market]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: chinese-ev-market }
    prompt: Why did Chinese EV makers enjoy a late-mover advantage over legacy Western and Japanese automakers?
    options:
      - They had no entrenched internal-combustion legacy and could build custom-made EV production systems
      - They invented the internal combustion engine a century before Western rivals
      - They faced zero domestic competition inside China
      - They copied sequential development habits from older foreign automakers
    answer: 0
    hints:
      - Think about what established petrol carmakers had to unlearn or retool.
    explanation: Without legacy ICE factories and habits to protect, Chinese EV makers designed processes custom-built for EVs and ran engineering stages in parallel across their partner ecosystems.
    variants:
      - prompt: A new Vietnamese EV maker starts without any engine factories or dealer networks. According to the case's logic, what advantage could that give it?
        options:
          - It can design its factories and processes for EVs from scratch, with no legacy to unlearn
          - It will always have more customers than older makers
          - It can copy every step of older carmakers
          - It needs no suppliers at all
        answer: 0
        optionFeedback:
          1: Being new doesn't bring customers by itself.
          2: The advantage is not copying combustion-era processes.
          3: Every carmaker needs suppliers.
        explanation: Like China's makers, a late mover can build EV-native processes without legacy costs.
      - prompt: Why can an established European carmaker find it harder to switch to EVs than a new Chinese maker?
        options:
          - Its factories, suppliers and skills are built around combustion engines
          - It has fewer engineers
          - It is banned from making batteries
          - Its customers refuse to buy EVs
        answer: 0
        optionFeedback:
          1: Established makers usually have more engineers.
          2: No such ban exists.
          3: Many of its customers do buy EVs.
        explanation: Legacy investments and habits slow the switch; that's the flip side of the late-mover advantage.

  - id: cycle-speed-mcq
    type: mcq
    skills: [byd-market]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: chinese-ev-market }
    prompt: How does the model refresh cycle of Chinese EV brands compare with that of foreign brands in China, and why does it matter?
    options:
      - Chinese EV models refresh much faster (~1.2 years vs. ~4.2 years), matching tech-savvy buyers' demand for frequent updates
      - Foreign brands update their models three times faster than Chinese EV brands
      - Both Chinese and foreign brands keep models unchanged for over a decade
      - Model refresh speed has no effect on buyer choices in China's price war
    answer: 0
    hints:
      - Chinese consumers treat EVs much like fast-moving consumer electronics.
    explanation: Chinese EVs stay on the market about 1.2 years before being updated or replaced, compared with 4.2 years for foreign brands, helping domestic makers win tech-focused buyers during a price war.

  - id: market-match
    type: match
    skills: [byd-market]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: chinese-ev-market }
    prompt: Match each automotive market term to its definition.
    pairs:
      - ['[[electric-vehicle|Electric vehicle]]', 'A car powered by a battery instead of burning fuel']
      - ['[[plug-in-hybrid|Plug-in hybrid]]', 'A car combining a grid-chargeable battery with a fuel engine']
      - ['[[internal-combustion-engine|ICE]]', 'A traditional engine that burns petrol or diesel fuel']
      - ['[[price-war|Price war]]', 'Rivals repeatedly cutting prices to win buyers, squeezing margins']
    hints:
      - Which powertrain combines both a battery and a fuel engine?
    explanation: BYD sells roughly an even split of pure battery electric vehicles and plug-in hybrids while competing in a fierce domestic price war against legacy ICE and EV rivals.

  - id: ecosystem-multi
    type: multi
    skills: [byd-market]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: chinese-ev-market }
    prompt: Which of the following are elements of the Chinese EV ecosystem described in the case?
    options:
      - Specialized local component and battery producers
      - Mapping, software, and cloud computing partners
      - Dedicated roll-on/roll-off ocean car carriers
      - Joint ventures and knowledge networks across automakers
      - A single state-owned automaker monopoly with no rivals
    answer: [0, 1, 2, 3]
    hints:
      - China's EV ecosystem is a broad network of partners working in parallel across around 100 carmakers.
    explanation: Leading Chinese automakers built extensive ecosystems spanning parts suppliers, cloud and mapping firms, ocean shipping fleets, and joint ventures.

  # ------------------------------------------------------------------ cost-advantage (5 templates)
  - id: cost-multi
    type: multi
    skills: [cost-advantage]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: why-so-cheap }
    prompt: Which are structural sources of BYD's per-vehicle cost advantage identified in the case?
    options:
      - Making roughly 75% of parts in-house, eliminating outside supplier margins
      - Lower monthly wages at its Shenzhen facilities compared with foreign rivals in China
      - Leaner administration and R&D spending per vehicle
      - Lower-cost in-house LFP Blade battery cells
      - A complete government ban on all competing EV brands in China
    answer: [0, 1, 2, 3]
    hints:
      - Recall the cost tower teardown comparing BYD and Tesla.
    explanation: The case attributes BYD's $4,700 per-car cost edge over Tesla primarily to captured supplier margins (~$2,400), leaner admin and R&D (~$1,700), lower labor pay, and cheaper LFP batteries, with direct subsidies making up only about 5%.

  - id: lfp-match
    type: match
    skills: [cost-advantage]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: batteries-and-parts }
    prompt: Match each battery and supply-chain concept to its meaning.
    pairs:
      - ['[[lfp-battery|LFP battery]]', 'Cheaper, cobalt-free, and thermally safer chemistry with lower energy density']
      - ['[[nmc-battery|NMC battery]]', 'Higher energy density chemistry using nickel, manganese, and cobalt at higher cost']
      - ['[[vertical-integration|Vertical integration]]', 'Making most components and inputs in-house rather than buying from outside vendors']
      - ['[[supplier-margin|Supplier margin]]', 'The profit markup an external parts vendor adds when selling to an automaker']
    hints:
      - Contrast the two battery chemistries first, then the two supply-chain terms.
    explanation: BYD combined cobalt-free LFP Blade batteries with deep vertical integration to eliminate external Tier 1 and Tier 2 supplier margins.

  - id: vertical-integration-mcq
    type: mcq
    skills: [cost-advantage]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: batteries-and-parts }
    prompt: How did making roughly 75% of the BYD Seal's components in-house affect BYD's cost structure and operational resilience?
    options:
      - It eliminated roughly $2,400 per car in external supplier profit margins and protected BYD from semiconductor shortages
      - It increased BYD's dependence on high-margin European Tier 1 parts suppliers
      - It forced BYD to buy all of its batteries and electric motors on the spot market
      - It raised per-vehicle administrative overhead above legacy Western automakers
    answer: 0
    hints:
      - Think about what happens to Tier 1 and Tier 2 vendor markups when parts are made internally.
    explanation: Vertical integration across batteries, motors, power electronics, and semiconductors saved roughly $2,400 in supplier margins per vehicle and kept factories running during global chip shortages.

  - id: blade-battery-mcq
    type: mcq
    skills: [cost-advantage]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: batteries-and-parts }
    prompt: Why did BYD's LFP Blade Battery become a major competitive asset despite LFP chemistry having lower energy density than NMC?
    options:
      - Its cell-to-pack design packed more cells into the chassis, improved structural rigidity and safety, and avoided expensive cobalt
      - It used pure cobalt and nickel to double the price of every battery pack
      - It was outsourced entirely to Japanese and Korean battery suppliers
      - It could only be used in two-wheeled electric scooters
    answer: 0
    hints:
      - Consider how physical pack layout and material costs offset LFP's lower cell-level energy density.
    explanation: BYD's Blade Battery arranged long LFP cells directly into the pack without intermediate modules, cutting battery cost per kWh ($128 vs. $175 at Renault) while passing nail-penetration safety tests.

  - id: cost-pillars-order
    type: order
    skills: [cost-advantage]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: why-so-cheap }
    prompt: Order the contributors to BYD's $4,700 per-vehicle cost advantage over Tesla from largest dollar savings to smallest.
    items:
      - Eliminated Tier 1 and Tier 2 external supplier margins (~$2,400 per car)
      - Leaner administration and R&D overhead (~$1,700 per car)
      - Combined labor, battery, and other operational savings (~$365 per car)
      - Direct Chinese government subsidies (~$235, or 5% of the $4,700 gap)
    hints:
      - Vertical integration (supplier margins) is the single biggest block, while direct subsidies represent just 5% of the gap.
    explanation: In the case teardown of BYD's $4,700 per-vehicle advantage over Tesla, in-house supplier margin savings (~$2,400) and leaner admin/R&D (~$1,700) dwarf the 5% (~$235) attributed to direct subsidies.

  # ------------------------------------------------------------------ scale-growth (4 templates)
  - id: scale-breakeven-mcq
    type: mcq
    skills: [scale-growth]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: growing-at-speed }
    prompt: The case estimates break-even volume for an EV brand at around 400,000 vehicles per year. Why does BYD's 4.6 million annual volume create a powerful strategic moat?
    options:
      - Selling over ten times the break-even volume spreads fixed R&D and tooling costs thinly across each car, letting BYD stay profitable during price wars
      - Operating above break-even means variable raw material costs drop to zero
      - Break-even volume is a government quota that bans brands selling more than 400,000 cars
      - Smaller EV startups selling 50,000 cars per year have lower fixed costs per vehicle than BYD
    answer: 0
    hints:
      - Compare fixed-cost absorption at 4.6 million units versus sub-scale startups below 400,000 units.
    explanation: Auto manufacturing requires huge upfront investments in R&D, battery plants, and stamping dies. At over 11 times the 400,000-unit break-even threshold, BYD amortizes fixed costs over millions of cars.

  - id: ice-exit-mcq
    type: mcq
    skills: [scale-growth]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: growing-at-speed }
    prompt: What strategic product-portfolio shift accompanied BYD's six-fold sales surge between 2021 and 2025?
    options:
      - BYD ceased producing pure internal combustion engine cars in 2022 to focus solely on BEVs and plug-in hybrids across all price segments
      - BYD abandoned electric vehicles in 2022 to focus on diesel trucks
      - BYD restricted its lineup to a single ultra-luxury sports car model
      - BYD sold off its battery division and stopped making hybrids
    answer: 0
    hints:
      - Look at how BYD focused its manufacturing capacity in 2022.
    explanation: By ending pure petrol car production in 2022 and offering both BEVs and PHEVs from budget models to luxury brands, BYD captured surging EV demand and scaled from 741,000 to over 4.6 million vehicles.

  - id: scale-match
    type: match
    skills: [scale-growth]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: growing-at-speed }
    prompt: Match each growth and scale concept to its strategic role in the case.
    pairs:
      - ['[[compound-annual-growth-rate|Compound annual growth rate]]', 'Steady yearly compounded rate capturing BYD''s multi-year sales surge']
      - ['[[break-even-volume|Break-even volume]]', 'Annual sales threshold (~400k EVs) required for revenues to cover fixed and variable costs']
      - ['Sub-scale EV startup', 'Maker selling below 400k units whose high per-car fixed costs make price wars perilous']
      - ['Full-line NEV portfolio', 'Offering both BEVs and PHEVs from entry-level hatchbacks to premium SUVs to maximize volume']
    hints:
      - Connect the 400,000-unit threshold to break-even volume and multi-year compounding to CAGR.
    explanation: Rapid compound annual growth carried BYD past the 400,000-unit break-even threshold, whereas sub-scale domestic rivals struggle to absorb fixed R&D and tooling costs.

  - id: scale-virtuous-order
    type: order
    skills: [scale-growth]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: growing-at-speed }
    prompt: Put the steps of BYD's scale-and-cost flywheel in logical causal order.
    items:
      - Commit 100% of production to BEVs and PHEVs backed by in-house LFP batteries
      - Cross the 400,000-unit break-even threshold and scale toward 4.6 million vehicles a year
      - Spread fixed R&D, battery plant, and tooling costs across millions of units to lower per-car cost
      - Use the resulting unit-cost lead to survive domestic price wars and fund overseas expansion
    hints:
      - Start with the strategic focus on EVs/PHEVs, then volume crossing break-even, then unit-cost amortization, then competitive advantage.
    explanation: Focusing on NEVs drove massive volume growth past break-even, which lowered fixed cost per car and enabled BYD to weather domestic price cuts while expanding globally.

  # ------------------------------------------------------------------ overseas-push (5 templates)
  - id: overseas-mcq
    type: mcq
    skills: [overseas-push]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: going-global }
    prompt: Why did BYD establish a CKD (completely knocked down) assembly operation in Brazil?
    options:
      - To assemble vehicles locally from imported part kits, reducing import tariffs while serving Brazil and neighboring Latin American markets
      - To mine cobalt for NMC batteries in the Amazon basin
      - To export Brazilian-built internal combustion engines back to Shenzhen
      - Because Brazil banned all local automobile assembly
    answer: 0
    hints:
      - CKD means shipping component kits from China and assembling the final vehicle inside the host country.
    explanation: Local CKD assembly in Brazil helped BYD bypass rising tariffs on finished imported vehicles while keeping high-value battery and powertrain production in China.
    variants:
      - prompt: Why might BYD build a plant in Thailand rather than ship cars there from China?
        options:
          - To produce inside the market, avoiding import tariffs and serving the region
          - To stop selling in China
          - Because Thailand has no car buyers
          - To pay higher tariffs on purpose
        answer: 0
        optionFeedback:
          1: Overseas plants add to, not replace, home sales.
          2: The plant is built to sell there.
          3: Local production is meant to avoid tariffs.
        explanation: Local plants get around tariffs and bring the maker closer to customers.
      - prompt: A carmaker exports complete-knock-down kits instead of finished cars. What is the main purpose?
        options:
          - Lower tariffs, since kits assembled locally avoid duties on whole cars
          - Making the cars lighter
          - Avoiding all shipping
          - Selling the kits to hobbyists
        answer: 0
        optionFeedback:
          1: Weight isn't the point.
          2: Kits still have to be shipped.
          3: Kits go to the maker's own assembly plant.
        explanation: Kits plus local assembly sidestep tariffs on finished vehicles.

  - id: overseas-margin-mcq
    type: mcq
    skills: [overseas-push]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: going-global }
    prompt: Aside from escaping domestic factory overcapacity, what financial incentive drives BYD's goal of selling half its vehicles outside China by 2030?
    options:
      - Overseas sales earn roughly two to three times the profit per vehicle of sales in China's price-war market
      - Foreign governments pay BYD a cash bonus for every car it keeps in China
      - Ocean shipping and European dealership networks have zero operating cost
      - Domestic Chinese buyers are no longer allowed to purchase electric vehicles
    answer: 0
    hints:
      - Compare the retail price of the BYD Seal in Germany ($45,060) with its price in China ($26,572).
    explanation: Because BYD's production costs are low and foreign markets are less price-compressed than China, BYD can price near Western rivals abroad and earn two to three times as much profit per car.

  - id: expansion-order
    type: order
    skills: [overseas-push]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: going-global }
    prompt: Put the waves of BYD's international expansion in the chronological order described in the case.
    items:
      - Export vehicles to developing markets in Africa, South America, and the Middle East (starting in 2009)
      - Target wealthy EV-friendly countries without domestic automakers, such as Norway and Australia
      - Enter major automotive heartlands including Japan and continental EU markets (2022)
      - Launch passenger EV sales in the United Kingdom and build regional overseas plants (2023 onward)
    hints:
      - BYD built experience in developing markets first, then entered developed markets without home carmakers before tackling Germany, Japan, and the UK.
    explanation: BYD sequenced its global entry from developing regions to low-resistance developed markets (Norway, Australia), and finally into major automaker home markets backed by regional factories.

  - id: entry-modes-match
    type: match
    skills: [overseas-push]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: going-global }
    prompt: Match each international market-entry mechanism to its strategic description.
    pairs:
      - ['[[ckd-assembly|CKD assembly]]', 'Shipping component kits from China for final assembly at a local plant to reduce tariffs']
      - ['[[joint-venture|Joint venture]]', 'A business co-owned and operated by two or more partner firms to share local know-how and risk']
      - ['Ro-Ro car carrier fleet', 'BYD''s own ocean shipping vessels built to control export logistics and freight bottlenecks']
      - ['Greenfield FDI plant', 'Building a full local factory (such as in Hungary or Thailand) to produce inside a region']
    hints:
      - Distinguish between shipping whole cars (Ro-Ro), shipping kits (CKD), partnering (JV), and building a full factory (Greenfield FDI).
    explanation: BYD uses a portfolio of entry modes—own Ro-Ro ships for direct exports, CKD assembly in Brazil, joint ventures, and full plants in Thailand, Uzbekistan, and Hungary.

  - id: portability-multi
    type: multi
    skills: [overseas-push]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: going-global }
    prompt: Which challenges make it difficult for BYD to replicate its full Shenzhen cost advantage inside new overseas factories?
    options:
      - Higher local wages and stricter labor regulations in foreign markets such as Europe
      - Absence of co-located mega-factories and dense local EV supplier clusters abroad
      - Tightening local-content rules that limit relying solely on imported Chinese parts
      - Political and regulatory scrutiny from host governments and incumbent automakers
      - Inability of LFP batteries to function outside China's climate
    answer: [0, 1, 2, 3]
    hints:
      - Which factors are tied to China's manufacturing ecosystem and labor market rather than physics?
    explanation: While BYD's battery and vehicle designs travel globally, its walled factory towns, low domestic wages, and dense Chinese supplier network cannot be copied overnight in Europe or Latin America.

  # ------------------------------------------------------------------ trade-policy (5 templates)
  - id: tariff-mcq
    type: mcq
    skills: [trade-policy]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: walls-and-help }
    prompt: Why is BYD building passenger EV factories in Hungary and Turkey to serve the European market?
    options:
      - Manufacturing inside the EU or its customs union allows BYD to sell cars without paying the countervailing duties levied on imports from China
      - Labor wages in Hungary are less than atenth of wages in rural China
      - The European Union subsidizes 100% of the cost of imported Chinese cars
      - Ocean shipping from Europe to China is BYD's primary revenue source
    answer: 0
    hints:
      - Tariffs and countervailing duties apply to goods crossing external customs borders as imports.
    explanation: Building local production capacity inside Hungary and Turkey is a classic tariff-jumping FDI strategy that insulates BYD from EU import duties on China-built EVs.

  - id: us-barrier-mcq
    type: mcq
    skills: [trade-policy]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: walls-and-help }
    prompt: How does a 100% US import tariff alter the competitive position of a mass-market Chinese EV like the BYD Seal?
    options:
      - It doubles the landed import price before shipping and dealer costs, pushing an affordable sedan into the luxury price bracket
      - It reduces the retail price of the imported car by half for US buyers
      - It affects only internal combustion engine trucks and exempts battery EVs
      - It forces US automakers to pay a tax to the Chinese government
    answer: 0
    hints:
      - A 100% ad-valorem tariff adds a duty equal to the full pre-tariff value of the vehicle.
    explanation: A 100% tariff doubles the pre-tariff vehicle price (for example, turning a ~$26,572 China price into ~$53,144 before freight and dealer margins), effectively blocking direct mass-market exports.

  - id: mexico-route-mcq
    type: mcq
    skills: [trade-policy]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: walls-and-help }
    prompt: Why is building a plant in Mexico or Canada not a guaranteed back-door route for BYD to enter the United States tariff-free?
    options:
      - The US government can tighten regional rules of origin, impose targeted tariffs, or block Chinese connected-vehicle software on national-security grounds
      - Mexico and Canada have no land borders or trade agreements with the United States
      - BYD is legally prohibited from selling cars anywhere in the Western Hemisphere
      - Mexican factories can only manufacture two-wheeled vehicles
    answer: 0
    hints:
      - Consider political forces, USMCA local-content rules, and national-security investigations into connected cars.
    explanation: The case highlights that US policymakers closely scrutinized potential Mexican transshipment routes and launched national-security reviews of Chinese connected-vehicle technology, making a back-door US entry highly risky.

  - id: tariff-welfare-mcq
    type: mcq
    skills: [trade-policy]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: walls-and-help }
    prompt: When a country imposes a prohibitive 100% tariff on imported Chinese EVs, how are domestic stakeholders affected?
    options:
      - Domestic automakers gain temporary protection from low-cost rivals, while local consumers face higher prices, fewer affordable EV options, and slower EV adoption
      - Domestic consumers immediately get cheaper imported cars and wider selection
      - Domestic automakers lose all protection and are forced to cut prices in half
      - Both foreign exporters and domestic car buyers gain at the expense of domestic automakers
    answer: 0
    hints:
      - Weigh the protective shield for domestic producers against the cost to car buyers and climate goals.
    explanation: High tariffs shield domestic automakers and jobs in the short run, but they deprive consumers of affordable EV choices and can slow the broader transition away from petrol vehicles.

  - id: trade-barriers-match
    type: match
    skills: [trade-policy]
    difficulty: 2
    tags: [term]
    lessonRef: { tab: intuition, id: walls-and-help }
    prompt: Match each trade-policy concept from the case to its strategic impact.
    pairs:
      - ['[[tariff|Tariff]]', 'Tax on imported vehicles that raises their landed price in the importing country']
      - ['EU countervailing duties', 'Additional European import duties aimed at offsetting foreign state subsidies']
      - ['Tariff-jumping FDI', 'Building local plants in Hungary, Turkey, or Brazil to produce inside protected markets']
      - ['Connected-vehicle scrutiny', 'Non-tariff national-security restrictions targeting vehicle software, sensors, and data']
    hints:
      - Distinguish between border taxes (tariffs/countervailing duties), investment responses (FDI), and software/security rules.
    explanation: BYD faces a mix of tariff walls, countervailing duties, and non-tariff security reviews, prompting it to invest in local manufacturing plants abroad.

  # ------------------------------------------------------------------ subsidy-role (4 templates)
  - id: subsidy-mcq
    type: mcq
    skills: [subsidy-role]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: walls-and-help }
    prompt: Based on the case's per-vehicle cost breakdown, is it accurate to claim that BYD's cost advantage over Tesla comes mainly from direct government subsidies?
    options:
      - No—direct subsidies accounted for only about 5% (~$235) of BYD's $4,700 per-car cost advantage, while vertical integration and lean overhead explained most of it
      - Yes—direct subsidies accounted for 95% of BYD's per-car cost advantage over Tesla
      - Yes—BYD has higher battery and supplier costs than Western rivals and relies entirely on cash grants
      - No—because the Chinese government prohibited all public support for electric vehicles
    answer: 0
    hints:
      - Recall the share of the $4,700 per-car gap attributed to subsidies versus in-house parts and overhead.
    explanation: While Chinese industrial policy helped build the broader EV sector, only about 5% of BYD's $4,700 per-vehicle edge over Tesla came from direct subsidies; ~95% came from in-house parts, lean overhead, lower labor costs, and cheaper batteries.

  - id: subsidy-multi
    type: multi
    skills: [subsidy-role]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: walls-and-help }
    prompt: Which forms of Chinese government industrial policy helped nurture the domestic EV sector and BYD's early growth?
    options:
      - Direct production subsidies and R&D grants to EV and battery makers
      - Soft loans from state-backed financial institutions
      - Public procurement contracts for municipal electric bus and taxi fleets
      - Consumer purchase incentives and free green license plates in congested cities
      - Mandatory nationalization of all private Chinese automakers
    answer: [0, 1, 2, 3]
    hints:
      - China supported both the supply side (financing and fleet orders) and the demand side (buyer perks and license plates).
    explanation: China used a comprehensive policy toolkit—subsidies, soft loans, municipal bus and taxi contracts, charging infrastructure, and free EV license plates—while allowing fierce private competition among ~100 automakers.

  - id: demand-policy-mcq
    type: mcq
    skills: [subsidy-role]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: walls-and-help }
    prompt: How did Chinese municipal policies such as electric bus contracts and free EV license plates accelerate BYD's scale-up?
    options:
      - Public fleet orders gave BYD guaranteed early volume to refine its LFP batteries, while free license plates pulled mass consumers toward EVs
      - They restricted EV usage to government officials and banned private citizens from buying EVs
      - They required all city buses to use imported European diesel engines
      - They eliminated the need for public charging infrastructure in Chinese cities
    answer: 0
    hints:
      - Think about how early commercial fleet demand and urban license-plate lotteries affect adoption.
    explanation: Early government procurement of electric buses and taxis gave BYD steady volume to scale LFP battery production, and free green license plates saved urban buyers thousands of dollars and long waits compared with ICE plate quotas.

  - id: policy-comparison-mcq
    type: mcq
    skills: [ trade-policy, subsidy-role ]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: walls-and-help }
    prompt: Why do European countervailing duties alone fail to erase BYD's underlying competitiveness in Europe?
    options:
      - Countervailing duties target state subsidies (~5% of BYD's cost edge), leaving BYD's deeper advantages in vertical integration, LFP batteries, and scale intact—especially once BYD builds cars inside Europe
      - European countervailing duties actually pay cash rebates to Chinese importers
      - BYD sells only internal combustion engine vehicles in Europe, which are exempt from all duties
      - European automakers have lower labor and battery costs than BYD
    answer: 0
    hints:
