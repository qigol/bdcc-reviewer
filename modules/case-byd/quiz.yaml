templates:
  # ------------------------------------------------------------------ byd-market
  - id: market-mcq
    type: mcq
    skills: [byd-market]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: chinese-ev-market }
    prompt: According to the case, about what share of new vehicles sold in China were electric vehicles?
    options:
      - About half
      - About one in ten
      - About a quarter of all cars worldwide but almost none in China
      - Almost all
    answer: 0
    optionFeedback:
      1: "About one in ten (8%) is the United States figure. China was around half."
      2: "About a quarter is the worldwide share; China was far higher, at about half."
      3: "EVs were about half of China's new-vehicle sales, not almost all."
    hints:
      - China accounts for most of the world's EV sales.
    explanation: The case says EVs made up about 50% of new vehicles sold in China, compared with about 25% worldwide and about 8% in the United States.

  - id: late-mover-mcq
    type: mcq
    skills: [byd-market]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: chinese-ev-market }
    prompt: Why did the case say Chinese EV makers had a late-mover advantage?
    options:
      - They had no old car-making habits and could build systems made for EVs
      - They started before everyone else
      - They had fewer customers
      - They copied every step of older car makers
    answer: 0
    optionFeedback:
      1: "A late mover starts after others. The advantage came from having no legacy to unlearn."
      2: "Customer numbers aren't the point; the advantage was building EV-native processes from scratch."
      3: "The advantage came from not copying incumbents' combustion-era processes."
    hints:
      - Think of what established makers had to change.
    explanation: Chinese makers did not have an established automotive legacy, so they built processes custom-made for EV manufacturing and worked on development stages at the same time.
    variants:
      - prompt: A new Vietnamese EV maker starts without any engine factories or dealer networks. According to the case's logic, what advantage could that give it?
        options:
          - It can design its factories and processes for EVs from scratch, with no legacy to unlearn
          - It will always have more customers than older makers
          - It can copy every step of older carmakers
          - It needs no suppliers at all
        answer: 0
        optionFeedback:
          1: Being new doesn't bring customers by itself.
          2: The advantage is not copying combustion-era processes.
          3: Every carmaker needs suppliers.
        explanation: Like China's makers, a late mover can build EV-native processes without legacy costs.
      - prompt: Why can an established European carmaker find it harder to switch to EVs than a new Chinese maker?
        options:
          - Its factories, suppliers and skills are built around combustion engines
          - It has fewer engineers
          - It is banned from making batteries
          - Its customers refuse to buy EVs
        answer: 0
        optionFeedback:
          1: Established makers usually have more engineers.
          2: No such ban exists.
          3: Many of its customers do buy EVs.
        explanation: Legacy investments and habits slow the switch; that's the flip side of the late-mover advantage.

  - id: cycle-numeric
    type: numeric
    skills: [byd-market]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: compare-numbers }
    prompt: |
      Chinese EVs stay on the market about **1.2 years** before they are updated or replaced. Foreign brands stay about **4.2 years**. How many times longer is the foreign brands' model life?
    answer: { value: 3.5, tol: 0.05 }
    misconceptions:
      - { value: 0.2857, feedback: 'You divided the short time by the long one. Put the foreign figure on top.' }
      - { value: 3, feedback: 'That is the difference in years. A "times" comparison divides.' }
    hints:
      - Times longer means a ratio.
      - Foreign years divided by Chinese years.
    explanation: $4.2 / 1.2 = 3.5$ times longer.

  - id: market-match
    type: match
    skills: [byd-market]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: chinese-ev-market }
    prompt: Match each term to its meaning.
    pairs:
      - ['[[electric-vehicle|Electric vehicle]]', 'A car powered by a battery']
      - ['[[plug-in-hybrid|Plug-in hybrid]]', 'A chargeable battery plus a fuel engine']
      - ['[[internal-combustion-engine|ICE]]', 'A traditional engine that burns fuel']
      - ['[[price-war|Price war]]', 'Rivals keep cutting prices to win customers']
    hints:
      - Which one has both a battery and an engine?
    explanation: The case describes BYD selling both battery electric cars and plug-in hybrids.

  - id: ecosystem-multi
    type: multi
    skills: [byd-market]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: chinese-ev-market }
    prompt: Which are parts of the Chinese EV ecosystem described in the case?
    options:
      - Specialized parts producers
      - Mapping and cloud companies
      - Car carriers for ocean transport
      - Joint ventures with global automakers
      - A single state-owned monopoly
    answer: [0, 1, 2, 3]
    optionFeedback:
      0: "Yes: specialized parts makers are part of the ecosystem."
      1: "Yes: mapping and cloud partners supply the software side."
      2: "Yes: car carriers ship vehicles overseas."
      3: "Yes: joint ventures with global automakers are part of it."
      4: "The case describes a broad network of partners, not a single state monopoly."
    hints:
      - The ecosystem was a network of partners.
    explanation: BYD and Geely built extensive ecosystems of partners rather than relying on one supplier or one owner.

  # ------------------------------------------------------------------ cost-advantage
  - id: compare-over-numeric
    type: numeric
    skills: [cost-advantage]
    difficulty: 1
    tags: [math]
    generator: compareQ
    lessonRef: { tab: math-code, id: compare-numbers }
    prompt: |
      A BYD car costs **{=base|comma}**. A rival's comparable car costs **{=other|comma}**. By what fraction is the rival's price above BYD's? (Decimal or percent.)
    answer: { var: pctOver, tol: 0.005, accept: [decimal, percent] }
    misconceptions:
      - { var: wrongDivOther, feedback: 'You divided the gap by the rival''s price. To say how far above BYD, divide by BYD''s price.' }
      - { var: wrongSwap, feedback: 'That is negative because the numbers are the wrong way round.' }
    hints:
      - Find the gap, then compare it with the base.
      - Gap divided by BYD's price.
    explanation: |
      Gap $= {=diff|comma}$. $ {=diff|comma} / {=base|comma} = {=pctOver|pct1}$ above BYD.

  - id: compare-under-numeric
    type: numeric
    skills: [cost-advantage]
    difficulty: 2
    tags: [math]
    generator: compareQ
    lessonRef: { tab: math-code, id: compare-numbers }
    prompt: |
      A BYD car costs **{=base|comma}** and a rival's costs **{=other|comma}**. By what fraction is BYD's price below the rival's? (Decimal or percent.)
    answer: { var: pctUnder, tol: 0.005, accept: [decimal, percent] }
    misconceptions:
      - { var: pctOver, feedback: 'You divided by BYD''s price. To say how far below the rival, divide the gap by the rival''s price.' }
      - { var: ratio, feedback: 'That is the ratio of the prices, not the fraction saved.' }
    hints:
      - How far below something means compared with that something.
      - Gap divided by the rival's price.
    explanation: |
      $ {=diff|comma} / {=other|comma} = {=pctUnder|pct1}$ below the rival.

  - id: compare-handcalc
    type: hand-calc
    skills: [cost-advantage]
    difficulty: 2
    tags: [math]
    generator: compareQ
    lessonRef: { tab: math-code, id: compare-numbers }
    prompt: |
      BYD **{=base|comma}**, rival **{=other|comma}**.
    steps:
      - prompt: What is the gap (rival minus BYD)?
        answer: { var: diff, tol: 0.01 }
        misconceptions:
          - { var: other, feedback: 'That is the rival''s price. Subtract BYD''s.' }
        hint: Rival minus BYD.
      - prompt: How many times the BYD price is the rival price?
        answer: { var: ratio, tol: 0.01 }
        misconceptions:
          - { var: pctOver, feedback: 'That is the extra beyond 1. A "times" figure includes the whole.' }
        hint: Rival divided by BYD.
      - prompt: By what fraction is the rival above BYD?
        answer: { var: pctOver, tol: 0.005 }
        misconceptions:
          - { var: ratio, feedback: 'Take away 1 from the ratio.' }
        hint: Ratio minus 1.
    hints:
      - Gap, then ratio, then extra.
    explanation: |
      Gap {=diff|comma}; ratio {=ratio|2}; extra {=pctOver|pct1}.

  - id: battery-numeric
    type: numeric
    skills: [cost-advantage]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: compare-numbers }
    prompt: |
      Battery cost is **128 dollars per kWh** for BYD and **175** for Renault. By what fraction is Renault's battery cost above BYD's? (Decimal or percent.)
    answer: { value: 0.367, tol: 0.005, accept: [decimal, percent] }
    misconceptions:
      - { value: 0.2686, feedback: 'You divided the gap by Renault''s cost. Divide by BYD''s cost.' }
      - { value: 47, feedback: 'That is the gap in dollars. Divide it by BYD''s cost to get a fraction.' }
    hints:
      - Gap first, then compare it with BYD.
      - 47 divided by 128.
    explanation: $(175 - 128) / 128 = 0.367$, about 36.7% above.

  - id: cost-multi
    type: multi
    skills: [cost-advantage]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: why-so-cheap }
    prompt: Which are sources of BYD's cost advantage named in the case?
    options:
      - Making most parts in-house, which removes supplier margins
      - Lower wages for its workers, even within China
      - Lower administration and R&D spending per vehicle
      - Low-cost LFP battery cells
      - A ban on foreign rivals
    answer: [0, 1, 2, 3]
    optionFeedback:
      0: "Yes: vertical integration removes the margins outside suppliers would charge."
      1: "Yes: the case names lower labor costs."
      2: "Yes: lower admin and R&D cost per vehicle is listed."
      3: "Yes: cheaper LFP cells are a big part of it."
      4: "Foreign rivals sell in China; there was no ban behind BYD's cost edge."
    hints:
      - The case says only 5% of the advantage was subsidies.
    explanation: The case lists vertical integration, labor, admin and R&D and cheaper batteries. Subsidies were a small part.

  - id: lfp-match
    type: match
    skills: [cost-advantage]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: batteries-and-parts }
    prompt: Match each term to its meaning.
    pairs:
      - ['[[lfp-battery|LFP battery]]', 'Cheaper and safer, stores less energy for its size']
      - ['[[nmc-battery|NMC battery]]', 'Stores more energy but costs more']
      - ['[[vertical-integration|Vertical integration]]', 'Making many parts and inputs in-house']
      - ['[[supplier-margin|Supplier margin]]', 'The profit a supplier adds to a part']
    hints:
      - Which one is about who makes the parts?
    explanation: BYD chose LFP cells and made most parts itself, which cut costs.

  - id: compare-code
    type: code-fill
    skills: [cost-advantage]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: compare-numbers }
    prompt: Complete the comparison function.
    code: |
      def compare(base, other):
          diff = other - base
          pct_over = diff / __BLANK_1__
          pct_under = diff / __BLANK_2__
          return pct_over, pct_under
    blanks:
      '1': { accept: ['base'] }
      '2': { accept: ['other'] }
    hints:
      - Over the base; under the other.
    explanation: Saying above compares the gap with the base, and saying below compares it with the larger number.

  # ------------------------------------------------------------------ scale-growth
  - id: growth-multiple-numeric
    type: numeric
    skills: [scale-growth]
    difficulty: 1
    tags: [math]
    generator: growthQ
    lessonRef: { tab: math-code, id: growth-rate }
    prompt: |
      A company sold **{=start|comma}** cars in one year and **{=end|comma}** cars {=years} years later. How many times larger are the later sales?
    answer: { var: multiple, tol: 0.05 }
    misconceptions:
      - { var: wrongTotalPct, feedback: 'That is how many times larger it grew beyond the start. Divide the end by the start.' }
      - { var: wrongInverse, feedback: 'You divided the start by the end. Put the later sales on top.' }
    hints:
      - Later divided by earlier.
    explanation: |
      $ {=end|comma} / {=start|comma} = {=multiple}$ times.

  - id: cagr-numeric
    type: numeric
    skills: [scale-growth]
    difficulty: 2
    tags: [math]
    generator: growthQ
    lessonRef: { tab: math-code, id: growth-rate }
    prompt: |
      Sales grew from **{=start|comma}** to **{=end|comma}** over **{=years}** years. What yearly growth rate would take the company from the start to the end? (Decimal or percent.)
    answer: { var: cagr, tol: 0.005, accept: [decimal, percent] }
    misconceptions:
      - { var: wrongTotalPct, feedback: 'That is the total growth over all the years, not a yearly rate.' }
      - { var: wrongPerYearSimple, feedback: 'You divided the total growth by the years. Growth compounds, so take a root.' }
    hints:
      - Find the multiple first.
      - Take the multiple to the power 1 over the number of years, then subtract 1.
    explanation: |
      Multiple {=multiple}. $ {=multiple}^{1/{=years}} - 1 = {=cagr|pct}$ a year.

  - id: growth-handcalc
    type: hand-calc
    skills: [scale-growth]
    difficulty: 3
    tags: [math]
    generator: growthQ
    lessonRef: { tab: math-code, id: growth-rate }
    prompt: |
      Sales were **{=start|comma}** and later **{=end|comma}**, {=years} years apart.
    steps:
      - prompt: How many times larger are the later sales?
        answer: { var: multiple, tol: 0.05 }
        misconceptions:
          - { var: wrongTotalPct, feedback: 'Divide the end by the start; do not subtract 1.' }
        hint: End over start.
      - prompt: What yearly growth rate does that mean? (Decimal.)
        answer: { var: cagr, tol: 0.005 }
        misconceptions:
          - { var: wrongPerYearSimple, feedback: 'Growth compounds. Use a root, not a simple average.' }
        hint: Multiple to the power 1 over years, minus 1.
    hints:
      - Multiple first, then root.
    explanation: |
      Multiple {=multiple}; yearly growth {=cagr|pct}.

  - id: breakeven-numeric
    type: numeric
    skills: [scale-growth]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: compare-numbers }
    prompt: |
      The case says about **400,000** cars is the break-even volume for an EV brand. BYD sold about **4.6 million** cars in 2025. How many times the break-even volume is that?
    answer: { value: 11.5, tol: 0.05 }
    misconceptions:
      - { value: 0.087, feedback: 'You divided break-even by sales. Put BYD''s sales on top.' }
      - { value: 4200000, feedback: 'That is the gap in cars. A "times" figure is a ratio.' }
    hints:
      - Compare sales with the break-even volume.
    explanation: $4{,}600{,}000 / 400{,}000 = 11.5$ times the break-even volume.

  - id: cagr-code
    type: code-fill
    skills: [scale-growth]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: growth-rate }
    prompt: Complete the yearly growth function.
    code: |
      def yearly_growth(start, end, years):
          multiple = end / start
          return multiple ** (1 / __BLANK_1__) - __BLANK_2__
    blanks:
      '1': { accept: ['years'] }
      '2': { accept: ['1'] }
    hints:
      - Take a root of the multiple, then remove the starting 1.
    explanation: The yearly growth rate is the multiple raised to 1 over the years, minus 1.

  - id: scale-order
    type: order
    skills: [scale-growth]
    difficulty: 2
    tags: [math]
    lessonRef: { tab: math-code, id: growth-rate }
    prompt: Put the steps of finding a yearly growth rate in order.
    items:
      - Find the starting and ending values
      - Divide the end by the start to get the multiple
      - Raise the multiple to the power 1 over the number of years
      - Subtract 1 to get the yearly growth rate
    hints:
      - The multiple comes before the root.
    explanation: The yearly rate is a root of the multiple, less 1.

  # ------------------------------------------------------------------ overseas-push
  - id: overseas-share-numeric
    type: numeric
    skills: [overseas-push]
    difficulty: 1
    tags: [math]
    generator: overseasQ
    lessonRef: { tab: math-code, id: overseas-gap }
    prompt: |
      A carmaker sold **{=total|comma}** vehicles, of which **{=overseas|comma}** were sold abroad. What share was sold abroad? (Decimal or percent.)
    answer: { var: share, tol: 0.005, accept: [decimal, percent] }
    misconceptions:
      - { var: targetShare, feedback: 'That is the target, not today''s share. Divide today''s overseas sales by the total.' }
      - { var: wrongInverse, feedback: 'You divided the total by the overseas sales. Put the overseas sales on top.' }
    hints:
      - Part over whole.
    explanation: |
      $ {=overseas|comma} / {=total|comma} = {=share|pct}$.

  - id: overseas-extra-numeric
    type: numeric
    skills: [overseas-push]
    difficulty: 2
    tags: [math]
    generator: overseasQ
    lessonRef: { tab: math-code, id: overseas-gap }
    prompt: |
      A carmaker sells **{=total|comma}** vehicles, with **{=overseas|comma}** sold abroad. It aims for **{=targetShare|pct}** of sales abroad at the same total. How many more vehicles must it sell abroad?
    answer: { var: extra, tol: 0.5 }
    misconceptions:
      - { var: needed, feedback: 'That is how many it needs abroad in all. Subtract what it already sells abroad.' }
      - { var: overseas, feedback: 'That is today''s overseas sales. Find the target and subtract.' }
    hints:
      - First find the overseas sales the target needs.
      - Then subtract today's overseas sales.
    explanation: |
      Needed abroad $= {=total|comma} \times {=targetShare|2} = {=needed|comma}$. Extra $= {=extra|comma}$.

  - id: overseas-mcq
    type: mcq
    skills: [overseas-push]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: going-global }
    prompt: Why did BYD assemble CKD cars in Brazil?
    options:
      - To avoid tariffs on whole cars while using imported parts
      - To stop selling in Brazil
      - To save on shipping lithium
      - Because Brazil has no EV market
    answer: 0
    optionFeedback:
      1: "Assembling locally is a way to sell more in Brazil, not to leave."
      2: "The aim was getting around tariffs on whole cars, not lithium shipping."
      3: "BYD built the plant because Brazil and Latin America were markets worth serving."
    hints:
      - CKD means largely assembled from imported parts.
    explanation: A local assembly plant helped BYD get around recently imposed tariffs and let it grow exports to other Latin American countries.
    variants:
      - prompt: Why might BYD build a plant in Thailand rather than ship cars there from China?
        options:
          - To produce inside the market, avoiding import tariffs and serving the region
          - To stop selling in China
          - Because Thailand has no car buyers
          - To pay higher tariffs on purpose
        answer: 0
        optionFeedback:
          1: Overseas plants add to, not replace, home sales.
          2: The plant is built to sell there.
          3: Local production is meant to avoid tariffs.
        explanation: Local plants get around tariffs and bring the maker closer to customers.
      - prompt: A carmaker exports complete-knock-down kits instead of finished cars. What is the main purpose?
        options:
          - Lower tariffs, since kits assembled locally avoid duties on whole cars
          - Making the cars lighter
          - Avoiding all shipping
          - Selling the kits to hobbyists
        answer: 0
        optionFeedback:
          1: Weight isn't the point.
          2: Kits still have to be shipped.
          3: Kits go to the maker's own assembly plant.
        explanation: Kits plus local assembly sidestep tariffs on finished vehicles.

  - id: overseas-code
    type: code-fill
    skills: [overseas-push]
    difficulty: 2
    tags: [code]
    lessonRef: { tab: math-code, id: overseas-gap }
    prompt: Complete the function that finds how many more cars must be sold abroad.
    code: |
      def extra_needed(total, overseas, target_share):
          needed = total * __BLANK_1__
          return needed - __BLANK_2__
    blanks:
      '1': { accept: ['target_share'] }
      '2': { accept: ['overseas'] }
    hints:
      - Target needs total times the share.
    explanation: The extra needed is the target overseas sales minus what is sold abroad now.

  - id: expansion-order
    type: order
    skills: [overseas-push]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: going-global }
    prompt: Put BYD's international expansion in the order described in the case.
    items:
      - Export cars to Africa, South America and the Middle East (2009)
      - Target developed countries without domestic car production, such as Australia and Norway
      - Enter Japan and several EU countries (2022)
      - Begin sales in the United Kingdom (2023)
    hints:
      - Emerging markets came first.
    explanation: BYD moved from emerging markets to developed countries without car makers, then to Japan, the EU and the UK.

  # ------------------------------------------------------------------ trade-policy
  - id: tariff-total-numeric
    type: numeric
    skills: [trade-policy]
    difficulty: 1
    tags: [math]
    generator: tariffQ
    lessonRef: { tab: math-code, id: tariffed-price }
    prompt: |
      A car costs **{=price|comma}** before a tariff of **{=tariff|pct}**. What does it cost after the tariff?
    answer: { var: total, tol: 0.5 }
    misconceptions:
      - { var: wrongDutyOnly, feedback: 'That is only the tariff. Add it to the price.' }
      - { var: wrongAddRate, feedback: 'You added the rate to the price. Multiply first.' }
    hints:
      - Duty is the rate times the price.
      - Add the duty to the price.
    explanation: |
      Duty $= {=tariff|2} \times {=price|comma} = {=duty|comma}$. Price after tariff $= {=total|comma}$.

  - id: tariff-duty-numeric
    type: numeric
    skills: [trade-policy]
    difficulty: 1
    tags: [math]
    generator: tariffQ
    lessonRef: { tab: math-code, id: tariffed-price }
    prompt: |
      How much tariff is paid on a car priced at **{=price|comma}** when the tariff rate is **{=tariff|pct}**?
    answer: { var: duty, tol: 0.5 }
    misconceptions:
      - { var: total, feedback: 'That includes the price of the car. The tariff alone is the rate times the price.' }
      - { var: wrongAddRate, feedback: 'You added the rate to the price. Multiply the rate by the price.' }
    hints:
      - A percentage of the price.
    explanation: |
      $ {=tariff|2} \times {=price|comma} = {=duty|comma}$.

  - id: tariff-mcq
    type: mcq
    skills: [trade-policy]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: walls-and-help }
    prompt: Why might BYD build a plant in Mexico or Hungary?
    options:
      - To make cars inside a market and reduce the effect of tariffs
      - To make cars more expensive
      - To avoid selling cars
      - To follow a quota on batteries
    answer: 0
    optionFeedback:
      1: "Local production is meant to lower the cost to buyers by dodging tariffs."
      2: "A plant inside a market is built to sell there."
      3: "The motive is tariffs on whole vehicles, not a battery quota."
    hints:
      - Tariffs apply to imports.
    explanation: A plant inside the market, such as in Hungary, could relieve the effect of tariffs. The Mexico plan was also seen as a route to the US.

  - id: tariff-code
    type: code-fill
    skills: [trade-policy]
    difficulty: 1
    tags: [code]
    lessonRef: { tab: math-code, id: tariffed-price }
    prompt: Complete the price after tariff.
    code: |
      def price_after_tariff(price, tariff):
          return price * (1 + __BLANK_1__)
    blanks:
      '1': { accept: ['tariff'] }
    hints:
      - The price plus the duty.
    explanation: The price after a tariff is the price times one plus the tariff rate.

  # ------------------------------------------------------------------ subsidy-role
  - id: subsidy-numeric
    type: numeric
    skills: [subsidy-role]
    difficulty: 2
    tags: [math]
    generator: subsidyQ
    lessonRef: { tab: math-code, id: subsidy-share }
    prompt: |
      A carmaker has a cost advantage of **{=advantage|comma}** dollars per car over a rival, and **{=share|pct}** of it comes from subsidies. How many dollars of the advantage come from subsidies?
    answer: { var: part, tol: 0.5 }
    misconceptions:
      - { var: wrongAll, feedback: 'That is the whole advantage. Only the subsidy share of it counts.' }
      - { var: rest, feedback: 'That is the part that came from everything else.' }
    hints:
      - A share of the total.
    explanation: |
      $ {=share|2} \times {=advantage|comma} = {=part|comma}$ dollars.

  - id: subsidy-mcq
    type: mcq
    skills: [subsidy-role]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: walls-and-help }
    prompt: Is it fair to say BYD's success was mainly due to government subsidies?
    options:
      - Not mainly, since the case says only about 5% of its per-car advantage over Tesla came from subsidies
      - Yes, because subsidies were the whole advantage
      - Yes, because BYD received no other help
      - No, because BYD received no subsidies at all
    answer: 0
    optionFeedback:
