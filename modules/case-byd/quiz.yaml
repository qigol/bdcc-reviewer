  # ------------------------------------------------------------------ new formats (case, find-error, two-tier, explain, cloze)
  - id: tariff-case
    type: case
    skills: [trade-policy, overseas-push]
    difficulty: 3
    tags: [math, application]
    generator: tariffQ
    lessonRef: { tab: math-code, id: tariffed-price }
    prompt: '**Pricing a Chinese EV into a market with a tariff.** The car costs **{=price|comma}** before a tariff of **{=tariff|pct}**.'
    parts:
      - type: numeric
        prompt: The tariff paid on one car
        answer: { var: duty, tol: 0.5 }
        explanation: '{=tariff|pct} × {=price|comma} = {=duty|comma}.'
      - type: numeric
        prompt: The car's price after the tariff
        answer: { var: total, tol: 0.5 }
        misconceptions:
          - { var: wrongDutyOnly, feedback: 'That is only the tariff. Add it to the price.' }
        explanation: '{=price|comma} + {=duty|comma} = {=total|comma}.'
      - type: two-tier
        prompt: How could BYD avoid most of that tariff in a market such as Brazil or Hungary?
        options: ['Assemble or build the cars inside the market', 'Ship the cars through a third country', 'Raise the price before export']
        answer: 0
        reasons:
          - Tariffs fall on imported whole cars, so local assembly from parts or local production avoids them
          - Tariffs depend on the shipping route
          - A higher price lowers the tariff rate
        reasonAnswer: 0
        reasonFeedback:
          1: Origin rules look at where the car was made, not the route.
          2: An ad valorem tariff is a share of the price, so a higher price raises the duty.
        explanation: The case's Brazil CKD plant and the Hungary plan both put production inside the tariff wall.
    hints: [Duty = tariff rate × price; the buyer pays price + duty.]
    explanation: Duty {=duty|comma}, price after tariff {=total|comma}; local assembly is BYD's answer to tariffs.

