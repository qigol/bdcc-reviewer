id: spark-df-basics
version: 1.1.0
title: 'Spark DataFrames I: Notebooks, Reading Data and Schemas'
shortTitle: DF Basics
summary: |
  Start Spark on Databricks, run notebook cells in a working order, read real taxi trips from a CSV file,
  look inside with show, count and printSchema, choose column types, catch values that silently turn into
  NULL, and summarize columns with describe.
course: BDCC
order: 40
color: '#f97316'
icon: table
sources:
  - title: 'Spark DataFrame API (lab notebook), ported to Databricks Free Edition'
    file: 'Spark DataFrame API.ipynb'
    sessions: '1-2'
    date: '2026-10-05'
prerequisites: []
skills:
  - id: run-order
    label: Run order and NameError
    description: Cells run in the order you run them; a skipped cell leaves its variables undefined.
  - id: spark-session
    label: Spark, the driver and the SparkSession
    description: Who does the work (driver, executors) and how getOrCreate hands you the session Databricks made.
  - id: read-csv
    label: Reading a CSV file
    description: spark.read.csv on a volume path, the header option, and what count() returns.
  - id: show-inspect
    label: Looking at rows with show and count
    description: show(n), vertical and truncate, and actions that make Spark do the work.
  - id: column-objects
    label: Columns, Column objects and type()
    description: trips.columns is a list of names; trips["VendorID"] is a Column object, not data.
  - id: schema-types
    label: Schemas, data types and inferSchema
    description: Reading printSchema; every CSV column is a string until you infer or declare types.
  - id: ddl-schema
    label: DDL schema strings
    description: Declaring each column's type yourself, and reading what Spark does when a type is wrong.
  - id: silent-nulls
    label: Silent nulls
    description: Values that do not fit their declared type become NULL without an error; a read option can make them loud.
  - id: pandas-describe
    label: describe, summary and toPandas
    description: count, mean, stddev, min and max; why text columns mislead; limit before toPandas.
