terms:
  - id: cluster
    term: Cluster
    aka: [clusters]
    short: A group of computers that work together on one job, each one handling part of the data.
    related: [driver, executor]
    skills: [spark-session]
  - id: driver
    term: Driver
    aka: [driver program]
    short: The part of Spark that plans the work, splits it into small tasks and hands them out, like a head chef.
    related: [executor, cluster]
    skills: [spark-session]
  - id: executor
    term: Executor
    aka: [executors]
    short: A worker on the cluster that runs tasks on its own slice of the data, like a line cook.
    related: [driver, cluster]
    skills: [spark-session]
  - id: sparksession
    term: SparkSession
    aka: [spark session, Spark session]
    short: The object, named spark in a notebook, that carries your commands to Spark and brings the results back, like a waiter.
    long: |
      On Databricks the session already exists. `SparkSession.builder.getOrCreate()` hands back that same session
      instead of making a new one. With Spark Connect, the session talks to Spark over the network.
    related: [driver, spark-connect]
    skills: [spark-session]
  - id: spark-connect
    term: Spark Connect
    aka: [Connect]
    short: The way your notebook talks to Spark over the network when Spark runs on other computers, as on Databricks.
    related: [sparksession]
    skills: [spark-session]
  - id: cell
    term: Cell
    aka: [cells, code cell]
    short: One box in a notebook. A code cell holds Python; you run it and its output appears under it.
    related: [run-order]
    skills: [run-order]
  - id: variable
    term: Variable
    aka: [variables]
    short: A name that points to a value, such as BASE or trips. Python knows it only after the cell that sets it has run.
    related: [name-error]
    skills: [run-order]
  - id: run-order
    term: Run order
    short: The order in which you actually ran the cells in this session, which can differ from their order on the page.
    related: [cell, variable]
    skills: [run-order]
  - id: name-error
    term: NameError
    aka: [name error]
    short: Python's error when code uses a name it has never been given, often because the cell that creates it has not run.
    related: [variable, traceback]
    skills: [run-order]
  - id: traceback
    term: Traceback
    aka: [tracebacks, error report]
    short: The error report Python prints. It names your cell and line, then ends with the kind of error and its message.
    related: [name-error]
    skills: [run-order]
  - id: csv
    term: CSV file
    aka: [CSV, comma-separated values]
    short: A plain text file where each line is one record and commas separate the values.
    long: CSV stands for comma-separated values.
    skills: [read-csv]
  - id: volume
    term: Volume
    aka: [volumes]
    short: A Databricks storage folder for files. The course data sits in the volume /Volumes/workspace/default/bdcc.
    skills: [read-csv]
  - id: dataframe
    term: DataFrame
    aka: [DataFrames, data frame]
    short: A table of rows with named columns. Spark spreads its rows across the cluster so many computers can work on them.
    related: [row, column, cluster]
    skills: [read-csv]
  - id: row
    term: Row
    aka: [rows]
    short: One record of a table, with one value per column. In the taxi data, one row is one trip.
    related: [dataframe, column]
    skills: [read-csv]
  - id: column
    term: Column
    aka: [columns]
    short: One named field of a table, such as fare_amount, holding one value for every row.
    related: [column-object, data-type]
    skills: [read-csv]
  - id: action
    term: Action
    aka: [actions]
    short: A command, such as show() or count(), that makes Spark read the data, do the work and return a result.
    related: [dataframe]
    skills: [show-inspect]
  - id: column-object
    term: Column object
    aka: [Column objects]
    short: What trips["VendorID"] gives you. It describes a column so you can build commands with it; it holds no values.
    related: [column]
    skills: [column-objects]
  - id: parameter
    term: Parameter
    aka: [parameters]
    short: A named setting you pass inside a command's parentheses, such as header=True. The manual's signature lists each one with its default.
    skills: [column-objects]
  - id: schema
    term: Schema
    aka: [schemas]
    short: The list of a table's column names together with the data type of each, like a printed form with labelled boxes.
    related: [data-type, ddl-schema-string]
    skills: [schema-types]
  - id: data-type
    term: Data type
    aka: [data types, type, types]
    short: The kind of value a column holds, such as string (text), integer, double (decimal number) or timestamp (date and time).
    related: [schema, cast]
    skills: [schema-types]
  - id: infer-schema
    term: inferSchema
    aka: [infer the schema, inferring the schema]
    short: A read option that makes Spark scan all the data one extra time to guess each column's data type.
    related: [schema, data-type]
    skills: [schema-types]
  - id: ddl-schema-string
    term: DDL schema string
    aka: [DDL schema, DDL string]
    short: 'A text that lists every column''s name and type in the file''s column order, such as "VendorID INT, lpep_pickup_datetime TIMESTAMP, …".'
    long: |
      DDL stands for Data Definition Language, the way databases write down tables and their column types. Spark
      matches the pairs to the file's columns by position, not by name, and it trusts the types you write: it does
      not check them against the file.
    related: [schema, silent-null]
    skills: [ddl-schema]
  - id: null-value
    term: 'Null'
    aka: ['NULL', nulls, missing value]
    short: A missing value, where nothing is stored. describe() leaves it out of count, mean and stddev; trips.count() still counts its row.
    related: [silent-null]
    skills: [silent-nulls]
  - id: cast
    term: Cast
    aka: [casting, convert]
    short: Converting a value from one data type to another, such as the text "22" into the whole number 22.
    related: [data-type, silent-null]
    skills: [silent-nulls]
  - id: silent-null
    term: Silent null
    aka: [silent nulls]
    short: A value Spark quietly replaces with null because it does not fit the declared type, without any error or warning.
    related: [null-value, cast, ddl-schema-string]
    skills: [silent-nulls]
  - id: summary-statistics
    term: Summary statistics
    aka: [describe(), summary(), describe]
    short: A few numbers that sum up a column, such as count, mean, standard deviation, minimum and maximum.
    related: [standard-deviation]
    skills: [pandas-describe]
  - id: standard-deviation
    term: Standard deviation
    aka: [stddev]
    short: A measure of how spread out values are around their mean. Spark's stddev divides by n minus 1.
    formula: 's = \sqrt{\frac{\sum_i (x_i - \bar{x})^2}{n - 1}}'
    related: [summary-statistics]
    skills: [pandas-describe]
  - id: pandas
    term: pandas
    aka: [toPandas, pandas DataFrame]
    short: A Python library for tables that fit in one computer's memory. A small Spark DataFrame can be copied into it.
    related: [dataframe]
    skills: [pandas-describe]
