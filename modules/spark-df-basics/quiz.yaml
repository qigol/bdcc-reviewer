    explanation: |
      count = {=count}. The values add up to {=sum|4}, so mean = {=sum|4} ÷ {=count} = **{=mean|2}**. As text, the
      values {=valuesText} sort with "{=minText}" first and "{=maxText}" last, so `min` is **{=minText}** and `max` is
