  - id: stddev-hand
    type: hand-calc
    skills: [pandas-describe]
    difficulty: 3
    tags: [math]
    generator: stddevQ
    lessonRef: { tab: math-code, id: describe-stats }
    prompt: 'Compute the `stddev` that `describe("fare_amount")` prints for these {=k} fares, step by step.'
    show:
      - { id: vals, widget: Text, props: { body: '{=table}' } }
    steps:
      - prompt: The mean (4 decimals)
        answer: { var: mean, tol: 0.001 }
        hint: Add the fares and divide by how many there are.
      - prompt: The sum of the squared differences from the mean (2 decimals)
        answer: { var: ss, tol: 0.01 }
        hint: For each fare, subtract the mean and square the result. Then add them up.
      - prompt: Divide by n − 1 (this is the variance; 2 decimals)
        answer: { var: variance, tol: 0.01 }
        misconceptions:
          - { var: popVar, feedback: 'You divided by n. Spark''s stddev divides by n − 1 = {=nMinus1}.' }
      - prompt: Take the square root (this is the stddev; 2 decimals)
        answer: { var: stddev, tol: 0.01 }
        misconceptions:
          - { var: popSd, feedback: 'That divides by n. Spark divides by n − 1.' }
          - { var: variance, feedback: 'That is the variance. Take its square root.' }
    hints:
      - Mean first, then the squared differences, then divide by n − 1, then the square root.
    explanation: |
      mean = {=mean|4}. The squares add to {=ss|4}. Variance = {=ss|4} ÷ {=nMinus1} = {=variance|4}.
      stddev = √{=variance|4} = **{=stddev|4}**.

  - id: describe-string-multi
    type: multi
    skills: [pandas-describe, schema-types]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: describe-and-pandas }
    prompt: |
      This is real output of `trips.describe("fare_amount").show()` on the lesson file, read with `header=True` only:

      ```text
      +-------+------------------+
      |summary|       fare_amount|
      +-------+------------------+
      |  count|                12|
      |   mean|15.416666666666666|
      | stddev|10.714971118048151|
      |    min|              10.5|
      |    max|               8.5|
      +-------+------------------+
      ```

      Which statements are true? (Select all that apply.)
    options:
      - 'max is 8.5 because the column is text, and "8.5" sorts after "34.5" character by character'
      - mean and stddev are still the real numbers, because Spark converts the text for those two
      - The fares really range from 8.5 to 10.5
      - count counts the values that are not null
      - 'With `inferSchema=True`, min and max become 4.0 and 34.5'
    answer: [0, 1, 3, 4]
    hints:
      - Compare the first characters of "8.5", "34.5" and "10.5".
    explanation: |
      With text, `min` and `max` compare character by character, so "10.5" comes first and "8.5" last. `mean` and
      `stddev` match the numeric read exactly. With `inferSchema=True`, `describe()` prints min 4.0 and max 34.5
      (real output). The [[summary-statistics|summary statistics]] are only as good as the column types.

