        hint: For the mean, Spark converts the text to numbers. Add the values, then divide.
      - prompt: '`min`: type the value it prints'
        answer: { var: min, tol: 0.0001 }
        misconceptions:
          - { var: numMin, feedback: 'That is the smallest number. The column is text, so `min` compares characters, first characters first.' }
          - { var: numMax, feedback: 'That is the largest number. `min` compares the values as text, character by character.' }
      - prompt: '`max`: type the value it prints'
        answer: { var: max, tol: 0.0001 }
