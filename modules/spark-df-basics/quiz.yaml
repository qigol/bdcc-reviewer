        answer: { var: rows, tol: 0 }
        misconceptions:
          - { var: lines, feedback: 'With `header=True` the first line holds the column names, so it is not a row.' }
          - { var: fareKept, feedback: '`count()` counts rows, whether or not they hold NULLs. Only `describe()` skips NULLs.' }
        hint: Count the lines, then decide what the first line is.
      - prompt: 'How many NULLs does `trips.show()` print in `store_and_fwd_flag`?'
        answer: { var: flagNulls, tol: 0 }
        misconceptions:
          - { value: 0, feedback: 'Spark raises no error here, but no letter fits INT, so each one becomes NULL.' }
        hint: Which letters fit a whole-number type?
      - prompt: 'What `count` does `trips.describe("fare_amount").show()` print?'
        answer: { var: fareKept, tol: 0 }
        misconceptions:
          - { var: rows, feedback: '`describe()` counts only the values that are not NULL. The fares with a decimal point became NULL.' }
        hint: Which fares fit INT?
      - prompt: 'What `mean` does it print? Give 2 decimals.'
        answer: { var: fareMean, tol: 0.01 }
        misconceptions:
          - { var: wrongMean, feedback: 'You divided by every row. The NULL fares are left out, not counted as zero.' }
          - { var: allMean, feedback: 'That is the mean of every fare in the file. With INT, the fares with a decimal point became NULL first.' }
