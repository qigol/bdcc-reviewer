      "dtypesRepr": "[('VendorID', 'int'),\n ('lpep_pickup_datetime', 'timestamp'),\n ('store_and_fwd_flag', 'string'),\n ('PULocationID', 'int'),\n ('DOLocationID', 'int'),\n ('passenger_count', 'int'),\n ('trip_distance', 'double'),\n ('fare_amount', 'double'),\n ('tip_amount', 'double'),\n ('total_amount', 'double')]"
      "fareType": "double"
      "flagType": "string"
