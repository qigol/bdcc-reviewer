  - id: string-read-vertical
    source: "Session 1, \"Displaying a DataFrame with show\" (vertical); truth m1.read_header.show3_vertical"
    fn: readTaxi
    in: {"mode":"string","n":3,"truncate":false,"vertical":true}
    expect:
      "showText": "-RECORD 0-----------------------------------\n VendorID             | 2                   \n lpep_pickup_datetime | 2017-10-02 08:00:03 \n store_and_fwd_flag   | N                   \n PULocationID         | 41                  \n DOLocationID         | 238                 \n passenger_count      | 1                   \n trip_distance        | 1.94                \n fare_amount          | 11.5                \n tip_amount           | 2.46                \n total_amount         | 14.76               \n-RECORD 1-----------------------------------\n VendorID             | 2                   \n lpep_pickup_datetime | 2017-10-02 08:00:06 \n store_and_fwd_flag   | N                   \n PULocationID         | 97                  \n DOLocationID         | 137                 \n passenger_count      | 1                   \n trip_distance        | 5.08                \n fare_amount          | 22                  \n tip_amount           | 2                   \n total_amount         | 24.8                \n-RECORD 2-----------------------------------\n VendorID             | 1                   \n lpep_pickup_datetime | 2017-10-02 08:00:14 \n store_and_fwd_flag   | N                   \n PULocationID         | 7                   \n DOLocationID         | 261                 \n passenger_count      | 1                   \n trip_distance        | 9.8                 \n fare_amount          | 34.5                \n tip_amount           | 6                   \n total_amount         | 41.3                \nonly showing top 3 rows\n"
  - id: show-truncate5
    source: "Session 1, \"Discovery: what kind of thing is it?\": truncate as a number; Real Spark 4.0.1 run (harness), fix_m1/probe_fix.json show_truncate5"
    fn: readTaxi
    in: {"mode":"string","n":3,"truncate":5}
    expect:
      "call": "trips.show(3, truncate=5)"
      "showText": "+--------+--------------------+------------------+------------+------------+---------------+-------------+-----------+----------+------------+\n|VendorID|lpep_pickup_datetime|store_and_fwd_flag|PULocationID|DOLocationID|passenger_count|trip_distance|fare_amount|tip_amount|total_amount|\n+--------+--------------------+------------------+------------+------------+---------------+-------------+-----------+----------+------------+\n|       2|               20...|                 N|          41|         238|              1|         1.94|       11.5|      2.46|       14.76|\n|       2|               20...|                 N|          97|         137|              1|         5.08|         22|         2|        24.8|\n|       1|               20...|                 N|           7|         261|              1|          9.8|       34.5|         6|        41.3|\n+--------+--------------------+------------------+------------+------------+---------------+-------------+-----------+----------+------------+\nonly showing top 3 rows\n"
    note: "Values longer than 5 characters keep 2 characters plus ...; shorter values stay whole."
  - id: noheader-read
    source: "Session 1, \"Reading CSV files\" (header default); truth m1.noheader.show3, m1.noheader.columns; count from Real Spark 4.0.1 run (harness), m1/probe_m1.json"
    fn: readTaxi
    in: {"mode":"noheader","n":3}
    expect:
      "showText": "+--------+--------------------+------------------+------------+------------+---------------+-------------+-----------+----------+------------+\n|     _c0|                 _c1|               _c2|         _c3|         _c4|            _c5|          _c6|        _c7|       _c8|         _c9|\n+--------+--------------------+------------------+------------+------------+---------------+-------------+-----------+----------+------------+\n|VendorID|lpep_pickup_datetime|store_and_fwd_flag|PULocationID|DOLocationID|passenger_count|trip_distance|fare_amount|tip_amount|total_amount|\n|       2| 2017-10-02 08:00:03|                 N|          41|         238|              1|         1.94|       11.5|      2.46|       14.76|\n|       2| 2017-10-02 08:00:06|                 N|          97|         137|              1|         5.08|         22|         2|        24.8|\n+--------+--------------------+------------------+------------+------------+---------------+-------------+-----------+----------+------------+\nonly showing top 3 rows\n"
      "columnsRepr": "['_c0', '_c1', '_c2', '_c3', '_c4', '_c5', '_c6', '_c7', '_c8', '_c9']"
      "count": 13
    note: "Without header=True the names line becomes a data row: 13 rows, columns _c0 to _c9."
  - id: string-read-columns-schema
    source: "Session 1 \"DataFrame columns\" and Session 2 \"Column types\"; truth m1.columns, m1.printSchema_default, m1.dtypes_default"
    fn: readTaxi
    in: {"mode":"string"}
    expect:
      "columnsRepr": "['VendorID',\n 'lpep_pickup_datetime',\n 'store_and_fwd_flag',\n 'PULocationID',\n 'DOLocationID',\n 'passenger_count',\n 'trip_distance',\n 'fare_amount',\n 'tip_amount',\n 'total_amount']"
      "schemaText": "root\n |-- VendorID: string (nullable = true)\n |-- lpep_pickup_datetime: string (nullable = true)\n |-- store_and_fwd_flag: string (nullable = true)\n |-- PULocationID: string (nullable = true)\n |-- DOLocationID: string (nullable = true)\n |-- passenger_count: string (nullable = true)\n |-- trip_distance: string (nullable = true)\n |-- fare_amount: string (nullable = true)\n |-- tip_amount: string (nullable = true)\n |-- total_amount: string (nullable = true)\n\n"
      "dtypesRepr": "[('VendorID', 'string'),\n ('lpep_pickup_datetime', 'string'),\n ('store_and_fwd_flag', 'string'),\n ('PULocationID', 'string'),\n ('DOLocationID', 'string'),\n ('passenger_count', 'string'),\n ('trip_distance', 'string'),\n ('fare_amount', 'string'),\n ('tip_amount', 'string'),\n ('total_amount', 'string')]"
      "nCols": 10
      "fareType": "string"
