      "count": 12
      "rowsShown": 12
      "footer": false
    note: "All 12 trips, so no \"only showing\" line. Integers print without .0 because every column is text."
  - id: string-read-show5
    source: "Session 1, \"Displaying a DataFrame with show\" (show with a row count); truth m1.read_header.show5"
    fn: readTaxi
    in: {"mode":"string","n":5}
    expect:
      "showText": "+--------+--------------------+------------------+------------+------------+---------------+-------------+-----------+----------+------------+\n|VendorID|lpep_pickup_datetime|store_and_fwd_flag|PULocationID|DOLocationID|passenger_count|trip_distance|fare_amount|tip_amount|total_amount|\n+--------+--------------------+------------------+------------+------------+---------------+-------------+-----------+----------+------------+\n|       2| 2017-10-02 08:00:03|                 N|          41|         238|              1|         1.94|       11.5|      2.46|       14.76|\n|       2| 2017-10-02 08:00:06|                 N|          97|         137|              1|         5.08|         22|         2|        24.8|\n|       1| 2017-10-02 08:00:14|                 N|           7|         261|              1|          9.8|       34.5|         6|        41.3|\n|       2| 2017-10-02 08:00:15|                 N|           7|         179|              1|         0.37|          4|      0.96|        5.76|\n|       2| 2017-10-02 08:00:16|                 N|          74|         166|              1|          1.4|        8.5|      1.86|       11.16|\n+--------+--------------------+------------------+------------+------------+---------------+-------------+-----------+----------+------------+\nonly showing top 5 rows\n"
