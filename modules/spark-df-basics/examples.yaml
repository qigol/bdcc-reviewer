  - id: flag-int-check
    source: "Session 2, \"Broken on purpose: counting the Y trips\", on the lesson file; truth m1.ddl_int.count_Y, m1.ddl_int.groupby_flag, m1.ddl_int.count_null"
    fn: flagCheck
    in: {"flagType":"INT"}
    expect:
      "nulls": 12
      "groupText": "+------------------+-----+\n|store_and_fwd_flag|count|\n+------------------+-----+\n|              NULL|   12|\n+------------------+-----+\n\n"
      "yOk": false
      "yError": "Traceback (most recent call last):\n  File \"<cell 4>\", line 1, in <module>\n    trips.filter(trips.store_and_fwd_flag == \"Y\").count()\n  ...\npyspark.errors.exceptions.connect.NumberFormatException: [CAST_INVALID_INPUT] The value 'Y' of the type \"STRING\" cannot be cast to \"BIGINT\" because it is malformed. Correct the value as per the syntax, or change its target type. Use `try_cast` to tolerate malformed input and return NULL instead. SQLSTATE: 22018"
      "describeCount": 0
    note: "Under ANSI mode the comparison with \"Y\" raises CAST_INVALID_INPUT; show and groupBy stay silent. The real output's three == DataFrame == call-site lines are trimmed."
  - id: flag-string-check
    source: "Session 2 fix (same section) on the lesson file; truth m1.ddl_string.count_Y"
    fn: flagCheck
    in: {"flagType":"STRING"}
    expect:
      "nulls": 0
      "yOk": true
      "yCount": 1
      "describeCount": 12
  - id: failfast-check
    source: "Session 2, \"Discovery: make Spark fail loudly\", on the lesson file: read, count(), show() in a fresh session; Real Spark 4.0.1 run (harness), fix_m1/probe_ff3.json (FAILFAST: count 12, show error); truth m1.failfast.show (error_causes)"
    fn: failfastCheck
    in: {}
    expect:
      "ok": false
      "count": 12
      "traceback": "Traceback (most recent call last):\n  File \"<cell 3>\", line 1, in <module>\n    trips.show()\n  ...\npyspark.errors.exceptions.connect.SparkException: [FAILED_READ_FILE.NO_HINT] Encountered error while reading file dbfs:/Volumes/workspace/default/bdcc/lessons/taxi12.csv.  SQLSTATE: KD001"
      "causes": ["Caused by: org.apache.spark.SparkException: [MALFORMED_RECORD_IN_PARSING.WITHOUT_SUGGESTION] Malformed records are detected in record parsing: [2,1506931203000000,null,41,238,1,1.94,11.5,2.46,14.76].\nParse Mode: FAILFAST. To process malformed records as null result, try setting the option 'mode' as 'PERMISSIVE'.  SQLSTATE: 22023","Caused by: java.lang.NumberFormatException: For input string: \"N\""]
      "errorClass": "FAILED_READ_FILE.NO_HINT"
    note: "The final line only names the file; the reason is in the Caused by lines."
