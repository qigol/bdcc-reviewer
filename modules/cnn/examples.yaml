examples:
  - id: conv1d-stride2
    source: 'CNN notebook, Part A2'
    fn: conv1d
    in: { x: [3, 2, 1, 7, 1, 2, 5, 4], w: [0.5, 0.75, 1, 0.25], p: 0, s: 2 }
    expect: { y: [7, 9, 8], o: 3, wr: [0.25, 1, 0.75, 0.5] }
    note: The figure prints y = [7, 9, 8].

  - id: conv1d-walk
    source: 'CNN notebook, Part A2 (step-through)'
    fn: conv1dWalk
    in: { x: [3, 2, 1, 7, 1, 2, 5, 4], w: [0.5, 0.75, 1, 0.25], p: 0, s: 2 }
    expect: { y: [7, 9, 8], trace.2.vars.y: 8 }

  - id: conv1d-code
    source: 'CNN notebook, Part A2 (conv1d)'
    fn: conv1dCode
    in: { x: [3, 2, 1, 7, 1, 2, 5, 4], w: [0.5, 0.75, 1, 0.25], p: 0, s: 2 }
    expect: { y: [7, 9, 8], trace.4.vars.y_i: 7 }

  - id: xcorr-first
    source: 'CNN notebook, Part A3 (cross-correlation, stride 1)'
    fn: conv1d
    in: { x: [3, 2, 1, 7, 1, 2, 5, 4], w: [0.5, 0.75, 1, 0.25], p: 0, s: 1, flip: false }
    expect: { y: [5.75, 9, 7.25, 7.5, 8] }
    note: Convolution at stride 1 gives [7, 7.25, 9, 6.75, 8]; sliding the unflipped filter gives different numbers.

  - id: xcorr-flipped
    source: 'CNN notebook, Part A3 (cross-correlation with the flipped filter)'
    fn: conv1d
    in: { x: [3, 2, 1, 7, 1, 2, 5, 4], w: [0.25, 1, 0.75, 0.5], p: 0, s: 1, flip: false }
    expect: { y: [7, 7.25, 9, 6.75, 8] }

  - id: pad-modes
    source: 'CNN notebook, Part A4'
    fn: padModes
    in: { x: [3, 2, 1, 7, 1, 2, 5, 4], w: [1, 1, 1] }
    expect: { valid.o: 6, same.o: 8, full.o: 10, same.p: 1, full.p: 2, valid.y: [6, 10, 9, 10, 8, 11] }

  - id: outsize-figure
    source: 'CNN notebook, Part A5 (n = 10, m = 5, p = 2, s = 1)'
    fn: outSize
    in: { n: 10, m: 5, p: 2, s: 1 }
    expect: { o: 10 }

  - id: outsize-table-2
    source: 'CNN notebook, Part A5 table'
    fn: outSize
    in: { n: 8, m: 4, p: 0, s: 2 }
    expect: { o: 3 }

  - id: outsize-table-5
    source: 'CNN notebook, Part A5 table'
    fn: outSize
    in: { n: 10, m: 3, p: 0, s: 2 }
    expect: { o: 4, floored: true }

  - id: outsize-table-4
    source: 'CNN notebook, Part A5 table'
    fn: outSize
    in: { n: 8, m: 5, p: 4, s: 1 }
    expect: { o: 12 }

  - id: outsize-code
    source: 'CNN notebook, Part B3 table (5 × 5 input, 3 × 3 filter, p = 1, s = 2)'
    fn: outSizeCode
    in: { n: 5, m: 3, p: 1, s: 2 }
    expect: { o: 3 }

  - id: conv2d-small
    source: 'CNN notebook, Part B2 (X_SMALL, W_SMALL, p = 1, s = 2)'
    fn: conv2d
    in: { X: [[2, 1, 2], [5, 0, 1], [1, 7, 3]], W: [[0.5, 0.7, 0.4], [0.3, 0.4, 0.1], [0.5, 1.0, 0.5]], p: 1, s: 2 }
    expect: { Y: [[4.6, 1.6], [7.5, 2.9]] }
    note: The notebook prints the top-left sum 0.4·2 + 0.3·1 + 0.7·5 = 4.6 and the matrix [[4.6, 1.6], [7.5, 2.9]] (Part B6).

  - id: conv2d-xcorr
    source: 'CNN notebook, Part B6 (nn.Conv2d with W as written)'
    fn: conv2d
    in: { X: [[2, 1, 2], [5, 0, 1], [1, 7, 3]], W: [[0.5, 0.7, 0.4], [0.3, 0.4, 0.1], [0.5, 1.0, 0.5]], p: 1, s: 2, flip: false }
    expect: { Y: [[5.9, 2.1], [4.6, 4]] }

  - id: conv2d-walk
    source: 'CNN notebook, Part B2 (step-through)'
    fn: conv2dWalk
    in: { X: [[2, 1, 2], [5, 0, 1], [1, 7, 3]], W: [[0.5, 0.7, 0.4], [0.3, 0.4, 0.1], [0.5, 1.0, 0.5]], p: 1, s: 2 }
    expect: { Y: [[4.6, 1.6], [7.5, 2.9]], trace.3.vars.y: 2.9 }

  - id: conv2d-code
    source: 'CNN notebook, Part B2 (conv2d)'
    fn: conv2dCode
    in: { X: [[2, 1, 2], [5, 0, 1], [1, 7, 3]], W: [[0.5, 0.7, 0.4], [0.3, 0.4, 0.1], [0.5, 1.0, 0.5]], p: 1, s: 2 }
    expect: { Y: [[4.6, 1.6], [7.5, 2.9]], trace.3.vars.Y_ij: 4.6 }

  - id: conv2d-try
    source: 'CNN notebook, Part B2 (X_TRY, W_TRY, p = 0, s = 1)'
    fn: conv2d
    in: { X: [[1, 3, 2, 4], [5, 6, 1, 3], [1, 2, 0, 2], [3, 4, 3, 2]], W: [[1, 0, 3], [1, 2, 1], [0, 1, 1]], p: 0, s: 1 }
    expect: { Y: [[25, 24], [28, 25]] }

  - id: edge-map
    source: Beyond the notebook (vertical filter of Part B4 on a 6 × 6 edge)
    fn: conv2d
    in: { X: [[9, 9, 9, 0, 0, 0], [9, 9, 9, 0, 0, 0], [9, 9, 9, 0, 0, 0], [9, 9, 9, 0, 0, 0], [9, 9, 9, 0, 0, 0], [9, 9, 9, 0, 0, 0]], W: [[1, 0, -1], [1, 0, -1], [1, 0, -1]], flip: false }
    expect: { Y.0: [0, 27, 27, 0], Y.3: [0, 27, 27, 0] }

  - id: kernel-sum-edge
    source: 'CNN notebook, Part B4 tip'
    fn: kernelSum
    in: { W: [[-1, -1, -1], [-1, 8, -1], [-1, -1, -1]] }
    expect: { sum: 0, kind: edge }

  - id: pool-x1
    source: 'CNN notebook, Part B5'
    fn: maxPool
    in: { X: [[10, 255, 125, 0, 170, 100], [70, 255, 105, 25, 25, 70], [255, 0, 150, 0, 10, 10], [0, 255, 10, 10, 150, 20], [70, 15, 200, 100, 95, 0], [35, 25, 100, 20, 0, 60]] }
    expect: { Y: [[255, 125, 170], [255, 150, 150], [70, 200, 95]] }

  - id: pool-same
    source: 'CNN notebook, Part B5 ("Same pooled output: True")'
    fn: poolSame
    in: { X1: '@pool.X1', X2: '@pool.X2' }
    expect: { same: true }

  - id: pool-shift
    source: 'CNN notebook, Part B5 (X1 shifted one column)'
    fn: shiftCols
    in: { X: '@pool.X1', k: 1 }
    expect: { pooled: [[100, 255, 170], [255, 255, 150], [70, 200, 100]] }

  - id: pool-walk
    source: 'CNN notebook, Part B5 (step-through)'
    fn: poolWalk
    in: { X: '@pool.X1' }
    expect: { trace.8.vars.max: 95, Y.1: [255, 150, 150] }

  - id: pool-code
    source: 'CNN notebook, Part B5 (max_pool2d)'
    fn: poolCode
    in: { X: '@pool.X1' }
    expect: { Y.2: [70, 200, 95] }

  - id: dense-vs-conv
    source: 'CNN notebook, Part A1'
    fn: denseVsConv
    in: { n: 150, c: 3, units: 512, filters: 32, m: 3 }
    expect: { dense: 34560512, conv: 896 }

  - id: params-conv-photo
    source: 'CNN notebook, Part C1 (five 3×3×3 filters)'
    fn: convParams
    in: { m: 3, cin: 3, cout: 5 }
    expect: { params: 140 }

  - id: params-code
    source: 'CNN notebook, Part C2 (second conv and first dense layer)'
    fn: paramsCode
    in: { m: 3, cin: 32, cout: 64, din: 576, dout: 64 }
    expect: { conv: 18496, dense: 36928 }

  - id: mnist-table
    source: 'CNN notebook, Part C2 table'
    fn: cnnTable
    in: { input: '@mnist.input', spec: '@mnist.spec' }
    expect:
      total: 93322
      rows.0.shape: 26×26×32
      rows.0.params: 320
      rows.1.shape: 13×13×32
      rows.2.params: 18496
      rows.3.shape: 5×5×64
      rows.4.params: 36928
      rows.5.shape: '576'
      rows.6.params: 36928
      rows.8.params: 650

  - id: mnist-walk
    source: 'CNN notebook, Part C2 (step-through)'
    fn: cnnWalk
    in: { input: '@mnist.input', spec: '@mnist.spec' }
    expect: { total: 93322, trace.8.vars.params: 650 }

  - id: mnist-code
    source: 'CNN notebook, Part C2 (cnn_shape_table)'
    fn: shapeCode
    in: { input: '@mnist.input', spec: '@mnist.spec' }
    expect: { total: 93322 }

  - id: catsdogs-table
    source: 'CNN notebook, Part D3 (four conv + pool stages to 7 × 7 × 128)'
    fn: cnnTable
    in: { input: '@catsdogs.input', spec: '@catsdogs.spec' }
    expect: { rows.7.shape: 7×7×128, rows.8.shape: '6272', rows.0.params: 896 }

  - id: vgg-sizes
    source: 'CNN notebook, Part E2 (150 → 75 → 37 → 18 → 9 → 4, 8,192 features)'
    fn: vgg
    in: { input: '@vgg16.input', blocks: '@vgg16.blocks', head: 256 }
    expect: { sizes: [150, 75, 37, 18, 9, 4], features: 8192, convLayers: 13 }

  - id: vgg-params
    source: 'CNN notebook, Parts E4 and E6 (14,714,688 frozen; 2,097,665 trainable; about 9.2 M when fine-tuning)'
    fn: vgg
    in: { input: '@vgg16.input', blocks: '@vgg16.blocks', head: 256 }
    expect: { base: 14714688, head: 2097665, fineTuneTrainable: 9177089 }

  - id: vgg-code
    source: 'CNN notebook, Part E2–E4'
    fn: vggCode
    in: { input: '@vgg16.input', blocks: '@vgg16.blocks', head: 256 }
    expect: { features: 8192, head: 2097665 }

  - id: leaf-table
    source: Application case (beyond the notebook)
    fn: cnnTable
    in: { input: '@leaf.input', spec: '@leaf.spec' }
    expect: { rows.5.shape: 14×14×128, rows.6.shape: '25088', total: 3304769 }

  - id: noaug-best
    source: Illustrative run (no augmentation)
    fn: curves
    in: { hist: '@noaug' }
    expect: { bestEpoch: 6, minValLoss: 0.559, finalTrainAcc: 0.973, finalValAcc: 0.698 }

  - id: aug-best
    source: Illustrative run (with augmentation)
    fn: curves
    in: { hist: '@aug' }
    expect: { bestEpoch: 18, minValLoss: 0.45 }

  - id: best-epoch-code
    source: 'CNN notebook, summarize_runs (lowest validation loss)'
    fn: bestEpochCode
    in: { hist: '@noaug' }
    expect: { bestEpoch: 6 }
