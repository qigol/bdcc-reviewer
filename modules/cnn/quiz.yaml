  # ------------------------------------------------------------ overfitting and augmentation
  - id: best-epoch
    type: numeric
    skills: [overfit-augment]
    difficulty: 2
    tags: [math]
    generator: curveQ
    lessonRef: { tab: math-code, id: best-epoch }
    prompt: |
      Training and [[validation-set|validation]] loss of a 12-epoch run are plotted below. At which [[epoch]] would you
      stop to keep the model that does best on new photos?
    show:
      - { id: c, widget: Chart, props: { kind: line, series: '@lossSeries', xLabel: epoch, yLabel: loss } }
    answer: { var: bestEpoch, tol: 0 }
    hints:
      - Ignore the training curve; it falls to the end.
      - Find the lowest point of the validation curve.
    explanation: |
      Validation loss is lowest at epoch {=bestEpoch} ({=minValLoss}) and rises after it: the model starts to overfit.

  - id: curves-mcq
    type: mcq
    skills: [overfit-augment]
    difficulty: 1
    tags: [intuition]
    lessonRef: { tab: intuition, id: overfit-augment }
    prompt: Training accuracy climbs toward 100% while validation accuracy stalls near 71% and validation loss rises. What is happening?
    options:
      - The network is overfitting, memorizing the training photos
      - The network is underfitting and needs fewer epochs
      - The validation photos are mislabelled
      - The learning rate is zero, so nothing is learned
    answer: 0
    optionFeedback:
      '1': Underfitting shows low training accuracy too. Here training accuracy is near 100%.
      '2': Nothing points to bad labels; the gap opened as training went on.
      '3': Training accuracy is rising, so the network is learning.
    explanation: A growing train–validation gap with rising validation loss is the classic sign of [[overfitting]].
    variants:
      - prompt: In a run with augmentation, training accuracy is a little **below** validation accuracy for the first epochs. Is something wrong?
        options:
          - No. Training images keep changing and dropout is on, so training is harder than validation
          - Yes, validation images must have leaked into training
          - Yes, the model is overfitting
          - No, but only because the validation set is larger
        answer: 0
        optionFeedback:
          '1': Leakage would push validation up suspiciously, not explain a small gap like this.
          '2': 'Overfitting is the opposite gap, with training far above validation.'
          '3': The sizes do not cause it; the harder training task does.
        explanation: Training results are averaged during the epoch with dropout on and augmented photos; validation is measured after it on clean photos.
      - prompt: Validation loss bottoms out at epoch 6 of 20 and then rises. Which model should you keep?
        options:
          - The one from epoch 6, with the lowest validation loss
          - The one from epoch 20, because it trained longest
          - The one from epoch 1, before any overfitting
          - The one with the lowest training loss
        answer: 0
        optionFeedback:
          '1': By epoch 20 it has memorized the training photos.
          '2': At epoch 1 it has barely learned.
          '3': Training loss is lowest at the end, when overfitting is worst.
        explanation: Keep the epoch that does best on data the model did not train on.

  - id: augment-multi
    type: multi
    skills: [overfit-augment]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: overfit-augment }
    prompt: Which are correct ways to use data augmentation for the cats-vs-dogs CNN?
    options:
      - Randomly rotate training photos by up to ±40°
      - Randomly mirror training photos left to right
      - Randomly zoom training photos by up to ±20%
      - Apply the same random rotations to the validation photos
      - Swap some photos' labels from cat to dog
    answer: [0, 1, 2]
    optionFeedback:
      '3': Validation photos stay untouched; they must measure performance on real photos.
      '4': Augmentation never changes the label. A rotated cat is still a cat.
    hints: [Augmentation changes the picture, never the answer, and only for training.]
    explanation: Rotate, shift, zoom and flip the training photos only, keeping their labels.

  - id: augment-transfer
    type: mcq
    skills: [overfit-augment]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: overfit-augment }
    prompt: A bank trains a CNN to read handwritten digits on cheques. Which augmentation is a **bad** idea here?
    options:
      - Flipping digits upside down, which can turn a 6 into a 9
      - Rotating digits by a few degrees
      - Shifting digits a few pixels sideways
      - Zooming digits in or out slightly
    answer: 0
    optionFeedback:
      '1': People write at a slight slant, so small rotations are realistic.
      '2': Digits are not always centred; small shifts are realistic.
      '3': Handwriting size varies; small zooms are realistic.
    explanation: An augmentation must keep the label true. An upside-down 6 reads as 9.
    variants:
      - prompt: A clinic trains a CNN on chest X-rays, where the heart is on the patient's left. Which augmentation is risky?
        options:
          - Mirroring left to right, which puts the heart on the wrong side
          - Changing brightness slightly
          - Zooming in by up to 10%
          - Shifting the image a few pixels
        answer: 0
        optionFeedback:
          '1': Exposure varies between machines, so mild brightness changes are realistic.
          '2': Patients stand at slightly different distances.
          '3': Positioning varies a little.
        explanation: A left–right mirror creates anatomy that does not exist, and some findings depend on the side.
      - prompt: A farm co-op classifies rice-leaf photos taken from any angle. Which augmentation adds the least realistic variety?
        options:
          - Swapping the red and green channels, so leaves turn reddish
          - Rotating by up to ±40°
          - Mirroring left to right
          - Zooming in by up to 20%
        answer: 0
        optionFeedback:
          '1': Leaves appear at every angle.
          '2': A mirrored leaf is still a leaf with the same disease.
          '3': Photos are taken from different distances.
        explanation: Colour can be the disease signal itself; swapping channels can turn a healthy leaf into something that looks ill.

  # ------------------------------------------------------------ transfer learning
  - id: vgg-trainable
    type: numeric
    skills: [transfer]
    difficulty: 2
    tags: [math]
    generator: vggQ
    lessonRef: { tab: math-code, id: vgg-transfer }
    prompt: |
      VGG16's [[convolutional-base]] is [[frozen-layer|frozen]] and run on {=side} × {=side} photos. A new classifier
      of {=head} ReLU units and one output logit is put on top. How many **trainable** parameters are there?
    answer: { var: trainable, tol: 0 }
    hints:
      - Five pools halve the side, rounding down; the last block has 512 channels.
      - 'Head: $(\text{features} + 1)\cdot u + (u + 1)$. Frozen weights do not count.'
    explanation: |
      {=sizes}, so the base outputs ${=fside}\cdot{=fside}\cdot512 = {=features}$ features. Trainable
      $= ({=features} + 1)\cdot{=head} + ({=head} + 1) = {=trainable|comma0}$.

  - id: transfer-order
    type: order
    skills: [transfer]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: transfer }
    prompt: Put the notebook's transfer-learning steps in order. One step does not belong.
    items:
      - Load VGG16 with its ImageNet weights and keep only the convolutional base
      - Run every photo through the frozen base once and store the 8,192 features
      - Train a small new classifier on the stored features
      - Join base and trained classifier, still freezing the base
      - Unfreeze block 5 and train it with the classifier at a tiny learning rate, with augmentation
    distractors:
      - Unfreeze every block and train with a large learning rate from the start
    hints: [Train the new classifier before touching the base.]
    explanation: An untrained classifier makes large random errors; if the base could change then, those errors would wipe out what it learned on ImageNet.

  - id: transfer-choose
    type: mcq
    skills: [transfer]
    difficulty: 2
    tags: [application]
    lessonRef: { tab: intuition, id: transfer }
    prompt: A small bakery wants to tell its 6 kinds of bread apart from 400 phone photos. What is the best first approach?
    options:
      - Feature extraction with a pre-trained base such as VGG16 and a new small classifier
      - Train a deep CNN from scratch on the 400 photos
      - Fine-tune every layer of VGG16 with a large learning rate
      - Use a dense network on the flattened photos
    answer: 0
    optionFeedback:
      '1': 400 photos are far too few to learn good features from scratch.
      '2': Changing every layer with few photos invites overfitting, and a large rate destroys the learned features.
      '3': Far more parameters and no notion of local patterns.
    explanation: Borrow general visual features; train only a small new classifier. Fine-tune the top block later if needed.
    variants:
      - prompt: Feature extraction already gives 90% validation accuracy. How can you try to go higher?
        options:
          - Fine-tune the top block with a tiny learning rate and augmentation
          - Unfreeze every block and raise the learning rate
          - Remove the base and train only the classifier on raw pixels
          - Add augmentation to the stored features
        answer: 0
        optionFeedback:
          '1': Changing all blocks with 2,000 photos invites overfitting; a large rate wrecks the features.
          '2': Without the base there are no good features to classify.
          '3': Stored features never change, so augmentation is impossible there.
        explanation: Nudge the most specialized features toward your classes, gently.
      - prompt: Why can feature extraction not use data augmentation?
        options:
          - Each photo's features are computed once and stored, so a new random version is never seen
          - The pre-trained base was trained without augmentation
          - Augmentation would change the labels
          - The classifier is too small to use augmented data
        answer: 0
        optionFeedback:
          '1': How the base was trained does not matter here.
          '2': Augmentation never changes labels.
          '3': Size is not the issue; the inputs never change.
        explanation: To augment, the base must run on every new random version of each photo, every epoch.

  - id: transfer-match
    type: match
    skills: [transfer]
    difficulty: 1
    tags: [term]
    lessonRef: { tab: intuition, id: transfer }
    prompt: Match each term to what it means.
    pairs:
      - ['Pre-trained network', 'Already trained on ImageNet; its weights are downloaded']
      - ['Frozen layer', 'Its weights are never updated']
      - ['Feature extraction', 'Base runs once per photo; only the new head trains']
      - ['Fine-tuning', 'The top block is retrained gently with the head']
    explanation: Transfer learning reuses the base; freezing protects it; fine-tuning nudges its top block.

  - id: fine-tune-two-tier
    type: two-tier
    skills: [transfer]
    difficulty: 3
    tags: [intuition]
    lessonRef: { tab: intuition, id: transfer }
    prompt: When fine-tuning VGG16's block 5, which learning rate should you use?
    options: ['A tiny one, about $10^{-5}$', 'The usual $10^{-3}$', 'A large one, so it adapts fast']
    answer: 0
    reasons:
      - The block already holds good features; large steps would overwrite them
      - A smaller rate always gives higher accuracy for any network
      - The base was trained with this exact rate, so it must be reused
    reasonAnswer: 0
    optionFeedback:
      '1': That is the rate for training a new network; it moves the pre-trained weights too far.
      '2': Large steps destroy what ImageNet taught the block.
    reasonFeedback:
      '1': Too small a rate can stall training; it is a trade-off, not a rule.
      '2': The rate is chosen for this task, not copied from pre-training.
    explanation: Fine-tuning nudges good features toward your classes; tiny steps keep them good.

  - id: transfer-explain
    type: explain
    skills: [transfer, overfit-augment]
    difficulty: 2
    tags: [intuition]
    lessonRef: { tab: intuition, id: transfer }
    prompt: Explain when reusing a pre-trained network is better than training a CNN from scratch, and why the base is frozen first.
    model: |
      With few labelled images, a CNN trained from scratch cannot learn good general features and overfits. A network
      pre-trained on ImageNet already detects edges, textures and parts that suit almost any photo. We keep its base
      and train a new classifier for our classes. The base is frozen at first because the untrained classifier makes
      large random errors that would overwrite the learned features; once the classifier is trained, the top block can
      be fine-tuned gently.
    checklist:
      - Few labelled images make training from scratch overfit
      - The pre-trained base already holds general visual features
      - Only a new classifier is trained at first
      - Freezing protects the base from the new classifier's large early errors
    hints: [What does the base already know, and what would a random classifier do to it?]
    explanation: Borrow features when data is scarce; protect them until the new head is trained.
