services:
  kodigo:
    build: { context: .., dockerfile: docker/Dockerfile }
    image: kodigo:latest
    ports: ["8080:8080"]
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in docker/.env (copy .env.example)}
      MAX_UPLOAD_MB: 30
      # Christmas countdown quiz: auto (opens Dec 13, a day at a time) | on (open all now) | off
      CHRISTMAS_QUIZ: ${CHRISTMAS_QUIZ:-auto}
      # optional: pretend today is this date (YYYY-MM-DD), to preview a day
      CHRISTMAS_NOW: ${CHRISTMAS_NOW:-}
    volumes:
      - ../data:/data            # imported modules + module state (enabled/order)
    restart: unless-stopped
