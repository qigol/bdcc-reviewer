terms:
  - id: manufacturing-overhead
    term: Manufacturing overhead
    aka: [MOH, factory overhead]
    short: Every production cost that cannot be traced to a specific job, such as factory rent, utilities and supervisors.
    skills: [pohr]
  - id: allocation-base
    term: Allocation base
    aka: [cost driver]
    short: The measure of activity, such as direct labor-hours, used to spread overhead over jobs.
    skills: [pohr]
  - id: predetermined-overhead-rate
    term: Predetermined overhead rate
    aka: [POHR]
    short: Estimated overhead divided by the estimated allocation base, set before the period starts.
    formula: '\text{POHR} = \frac{\text{estimated overhead}}{\text{estimated base}}'
    related: [allocation-base, applied-overhead]
    skills: [pohr]
  - id: job-cost-sheet
    term: Job cost sheet
    short: The record that accumulates one job's direct materials, direct labor and applied overhead.
    skills: [job-cost]
  - id: work-in-process
    term: Work in Process
    aka: [WIP]
    short: The inventory account that holds the cost of jobs started but not yet finished.
    skills: [cost-flow]
  - id: applied-overhead
    term: Applied overhead
    short: Overhead charged to jobs as the predetermined rate times the job's actual allocation base.
    formula: '\text{POHR} \times \text{actual base}'
    skills: [job-cost, over-under]
  - id: finished-goods
    term: Finished Goods
    short: The inventory account that holds the cost of completed jobs not yet sold.
    skills: [cost-flow]
  - id: underapplied-overhead
    term: Underapplied overhead
    aka: [overapplied overhead]
    short: The gap when actual overhead is more (or less, overapplied) than the overhead applied to jobs.
    related: [applied-overhead]
    skills: [over-under]
